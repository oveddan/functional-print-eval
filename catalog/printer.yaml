# Stub. Ground the hidden-error model in the calibration coupon (PLAN phase 0).
printer: Bambu Lab X1C (with AMS)
layer_mm: 0.2
eval_setup:  # what every task tells the model (PLAN, "What the model is told"; one printer, one filament)
  nozzle_mm: 0.4
  filament: PLA (high-speed PLA, black)
  # Source: Bambu Studio's saved settings (BambuStudio.conf, read 2026-10-30): machine preset
  # "Bambu Lab X1 Carbon 0.4 nozzle" (standard nozzle), process "0.20mm Standard @BBL X1C",
  # Textured PEI plate; the black AMS slot (#161616) uses "Generic PLA High Speed @BBL X1C",
  # Bambu's generic preset, so no brand is recorded. Dan confirmed these were the settings for
  # the coupon prints (2026-10-30).
bridging:  # starting values for the bridge check; to calibrate with a test print
  max_span_mm: 50        # longest strand seen to print cleanly: 50 mm roofs clean in round 1 and round 2 (black high-speed PLA, 0.2 mm); plain bridges of 60, 80 and 100 mm all strung (round 3b, 2026-11-12), so the limit is between 50 and 60
  small_overhang_mm: 1.5 # material this close to the layer below needs no bridge
  narrowest_tangled_mm: 2.0 # the narrowest roof seen to tangle: round 3's ring roof 2, a 2.0 mm ledge round a 5.5 mm hole, messed up (2026-11-12); before it, the Arca plate's 3.1 mm (IMG_5045). Ring roof 1's 1.5 mm ledge printed. Narrower failing ledges are reported as not measured
  anchor_tol_mm: 0.3     # a strand end within this of the layer below counts as anchored
  min_anchored: 0.95     # share of strands in the best direction that must land on solid at both ends
  short_strand_mm: 6.8   # a roof whose longest strand is this short passes with few strands anchored (down to short_strand_min_anchored). Claude's scoring call (2026-11-12),
  short_strand_min_anchored: 0.24  # and at least this share anchored: ring roof 5 printed with 24%, the lowest seen to print (Claude's call, so strands landing on nothing don't pass)
                         # from round 3 and 3b: GPT's roof crop (44% anchored, longest 6.8) printed clean, ring roof 5 (24%, 6.0) mostly ok
                         # and held a tightened M5 nut; ring roofs 2 to 4 (7.5 to 9.9) and every longer crop failed
bed_mm: [256, 256, 256]  # nominal build volume; the slicer also excludes zones near the edge (the organizer's 252 x 210 plate was rejected), not yet measured
filaments:
  petg:
    spec_sheet: Elegoo Rapid PETG print settings, the maker's spec sheet (Dan's notes, 2026-10-22)
    nozzle_c: [240, 270]
    used_c: 250  # tripod build, after 240 curled
    drying: 60 C x 8 h
observed_fits:  # hex nut pocket clearance over across-flats, from the tripod build
  M5: {plus_0_30: falls_out, plus_0_15: holds}
  M8: {plus_0_30: falls_out, plus_0_00: holds}
  quarter_inch: {plus_0_30: falls_out, plus_0_00: still_falls_out}
