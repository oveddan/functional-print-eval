# Values no one measured, estimated from a datasheet a task hands over, each labelled with how.
# Kept out of hardware.yaml because that file is the hardware list every task's prompt shows: these
# are for graders, and a model learns them only from the datasheet itself (can_ask_datasheet).
#
# MG996R: the datasheet Dan attached on 2026-11-05 (tasks/servo-mount/datasheet/MG996R-1.png). Its
# drawing's pixels were measured on 2026-11-07; Dan's caliper readings are in hardware.yaml (`servos`).
MG996R:
  shaft_from_end:
    estimated: [9.3, 11.3]
    unit: mm
    note: >-
      The output shaft's centre from the nearer case end. 10.3 scaled by the drawing's 40.3 dimension,
      the same in its side view (shaft 71 px from the end of a 278 px case) and top view (51 of 199 px).
      Plus or minus 1 because the drawing isn't to scale: in the top view, its 40.3 and 53.6 dimensions
      give scales 10% apart.
  shaft_across:
    estimated: 0
    unit: mm
    note: On the case's centre line side to side, in both the front and top views (within a pixel).
  arm_sits_above_case_top:
    estimated: [0, 10]
    unit: mm
    note: >-
      Where the underside of an arm on the shaft can sit, above the case top: from the case top itself
      to past the spline's tip. The drawing puts the tip about 6 to 8 mm up, but its heights disagree
      with Dan's readings by about 2 mm (tab underside to case top 10.0 against his 7.97; case 36.6
      tall against his 40.4), so the whole range is used.
  rotation:
    datasheet: 120
    unit: deg
    note: "'This high-torque standard servo can rotate approximately 120 degrees (60 in each direction).'"
