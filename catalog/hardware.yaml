# Hardware the models may use, with the dimensions the graders and the assembly
# simulation need. Values are nominal (or max where noted) from the cited standard.
# Dan's actual bin (which lengths he owns) is still to be listed (PLAN, after the week).
#
# Screw lengths: thread length follows ISO 4762's reference b = 2d + 12 (for l <= 125).
# Lengths up to `threaded_to_head_max` are threaded close to the head; longer ones are
# partly threaded with b of thread. Verify the cut-offs against the ISO 4762 table
# before the report; they are marked `verify: true`.

pitch_mm:  # ISO 261 coarse
  M3: 0.5
  M4: 0.7
  M5: 0.8
  M6: 1.0
  M8: 1.25
  "1/4-20": 1.27

screws:
  - family: socket head cap screw
    standard: ISO 4762
    head: cylindrical
    sizes:
      M3: {d: 3, head_d: 5.5, head_h: 3, b: 18, threaded_to_head_max: 20, verify: true}
      M4: {d: 4, head_d: 7.0, head_h: 4, b: 20, threaded_to_head_max: 25, verify: true}
      M5: {d: 5, head_d: 8.5, head_h: 5, b: 22, threaded_to_head_max: 25, verify: true}
      M6: {d: 6, head_d: 10.0, head_h: 6, b: 24, threaded_to_head_max: 30, verify: true}
      M8: {d: 8, head_d: 13.0, head_h: 8, b: 28, threaded_to_head_max: 35, verify: true}
    lengths_mm: [6, 8, 10, 12, 16, 20, 25, 30, 35, 40, 45, 50]
    # head_d and head_h are maximums.

nuts:
  - family: hex nut
    standard: ISO 4032
    sizes:
      M3: {af: 5.5, h: 2.4}
      M4: {af: 7.0, h: 3.2}
      M5: {af: 8.0, h: 4.7}
      M6: {af: 10.0, h: 5.2}
      M8: {af: 13.0, h: 6.8}
  - family: nylon-insert lock nut
    standard: ISO 10511
    sizes:
      M3: {af: 5.5, h: 4.0}
      M4: {af: 7.0, h: 5.0}
      M5: {af: 8.0, h: 5.0}
      M6: {af: 10.0, h: 6.0}
      M8: {af: 13.0, h: 8.0}
  - family: hex nut
    standard: ASME B18.2.2 (finished hex)
    sizes:
      "1/4-20": {af: 11.11, h: 5.56, af_measured: 10.92}  # 7/16" across flats, 7/32" thick; Dan's nut measured 10.92
    # af = across flats, h = height (max).

washers:
  - family: plain washer
    standard: ISO 7089
    sizes:
      M3: {id: 3.2, od: 7, t: 0.5}
      M4: {id: 4.3, od: 9, t: 0.8}
      M5: {id: 5.3, od: 10, t: 1.0}
      M6: {id: 6.4, od: 12, t: 1.6}
      M8: {id: 8.4, od: 16, t: 1.6}

inserts:
  - family: heat-set threaded insert
    standard: none (vendor-specific)
    sizes:
      M3x4x5: {thread: M3, length: 4, od: 5, hole_d: 4.3}  # as bought and used in Estoa; hole per the build

# Parts with no standard. Their dimensions are unknown until someone measures them,
# which is the point: a design that depends on them must ask (failure class C1).
salvaged:
  - id: webcam-mount-bolt
    description: 1/4"-20 bolt from a webcam monitor mount (the Arca plate, Oct 12)
    thread: "1/4-20"
    head_d: null
    head_h: null
    length: null

# Measured by Dan with a caliper (video IMG_5438, transcript in the
# explorations inbox, 2026-10-29-note-servo-bearing-caliper-measurements.md).
# "measured" is the reading; "used" is what the coupons design to, with why.
servos:
  - id: MG90S
    body_l: {measured: [22.0, 22.63], note: "two readings of the length; 22.63 used"}
    body_w: {measured: 12.33}
    body_h: {measured: 22.5, note: "'top to bottom'; not used by the coupon"}
    spline_od: {measured: 4.57}
    tab_hole_d: {measured: 2.17}
    tab_top_to_case_top: {measured: 1.67, note: "from the tab's top face (same method as MG996R)"}
    tab_t: {measured: 2.55}
    tab_face_to_case_top: {used: 4.22, note: "tab top to case top + tab thickness (1.67 + 2.55)"}
    tab_hole_pitch: {measured: 25.84, used: 28.01, note: "caliper tips closed into the two holes, so inner edges; centres = 25.84 + 2.17. Datasheet ~27.8"}
  - id: MG996R
    body_l: {measured: 40.58}
    body_w: {measured: 19.82}
    body_h: {measured: [40.41, 40.40], note: "'front to back'"}
    output_top_d: {measured: 5.60, note: "'the thing at the top'; unclear which feature"}
    spline_od: {measured: 5.84, note: "'if I grab here'"}
    tab_hole_d: {measured: 4.58}
    tab_hole_pitch: {measured: 44.61, used: 49.19, note: "inner edges as for MG90S; centres = 44.61 + 4.58. Datasheet ~49.5. Spacing across each tab's hole pair not measured (datasheet 10)"}
    tab_shape: {note: "each tab has two holes open to the edge (U-slots) and a stiffening rib on its top face (the shaft side) between them; the cable leaves the case end below the tabs (photos IMG_5454-5456, indexed in docs/media/photos.md)"}
    mounting: {note: "seated from below (shaft up through the plate), the tab's top face meets the plate, so the rib must be relieved and the case rises tab_top_to_case_top above the plate; seated from above, the tab's underside meets it and the case rises tab_face_to_case_top"}
    horns_in_box: {note: "plastic double-arm, 6-arm star, round disc, 4-arm cross; plus a bought 25T aluminium single arm with a clamped split hub and 2 holes (IMG_5457-5458). aluminium arm measured below (horn_25t_aluminium); plastic horns unmeasured"}
    tab_notch: {width: {measured: 1.51}, protrudes: {measured: 1.8, note: "Dan confirmed 1.8 mm"}, from_hole_side: {measured: 8.31, note: "'from the side of the holes to the middle notch'"}, note: "a feature between each tab's two holes that stops the tabs sitting flush (coupon D, round 2)"}
    tab_t: {measured: 2.28}
    tab_top_to_case_top: {measured: [5.63, 5.69], used: 5.69, note: "Dan, with a sketch: from the tab's top face"}
    tab_face_to_case_top: {used: 7.97, note: "tab top to case top + tab thickness (5.69 + 2.28); the tab's underside sits on the mount"}
    horn_25t_aluminium:
      hub_od: {measured: 14.66}
      overall_l: {measured: 34.62, note: "hub's far edge to arm tip"}
      hub_t: {measured: 5.95}
      arm_t: {measured: 3.86}
      end_boss_t: {measured: 5.95, note: "'on the foot, there's a stickout': the raised end around the holes"}
      centre_to_tip: {used: 27.29, note: "overall_l - hub_od / 2"}
      hole_centres_from_hub: {estimated: [20.4, 24.1], note: "from photo IMG_5457 proportions scaled to centre_to_tip; about +-1 mm, not measured"}
      hole_d: {measured: 2.55, note: "from the earlier readings ('these little holes')"}
      earlier_readings: {note: "3.13 (likely the clamp screw hole), 1.52, 4.43, 65.88 (heard as '6.5.88'); features unconfirmed"}

bearings:
  - id: 608ZZ
    od: {measured: 21.22, used: 22.0, note: "608 OD is 22.000 -0.008; the video shows the bearing pinched at the jaw tips at an angle, which reads low. Re-measure"}
    bore: {measured: 7.94, nominal: 8.0}
    width: {measured: null, nominal: 7.0}
