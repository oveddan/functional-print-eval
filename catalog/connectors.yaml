# Public dimensions of the plugs a design has to leave room for. Not shown to the models: a person
# at home wouldn't quote them, and the models are expected to know a plug head is wider than its socket.
# The public values a task's brief cites when it sets its limits, and Dan's measurement. Only `measured`
# is read by a grader (estoa-light R3, enclosure.plug_reaches); the spec values aren't a pass mark.

usb_c_plug_overmold:
  # The largest moulded head a compliant USB-C plug may have, from the USB-IF's "USB Type-C Connectors
  # and Cable Assemblies Compliance Document", rev 1.2: 12.35 mm wide, 6.5 mm thick. One secondary source
  # (GitHub, crimpdeq/crimpdeq-case PR 7) says a later USB-IF update raised it to 12.85 x 7.0 mm; that
  # isn't confirmed. usb.org is blocked from cloud sessions, so both were read through a web search
  # summary, not from the document itself (relayed 2026-11-04, at Dan's suggestion, in place of a
  # measurement nobody made). Not a pass mark (Dan): printed holes come out small and plugs go in crooked,
  # so the estoa-light task passes only the printed 14 x 8.5 mm; this explains the gap it leaves.
  max_width_mm: 12.85
  max_thickness_mm: 7.0
  source: "USB-IF Type-C compliance document rev 1.2 (12.35 x 6.5); a possible later update (12.85 x 7.0, unconfirmed); read via a search summary"
  # Records it agrees with (Estoa): an 11.5 x 8.5 mm opening at the end of a 9 mm recess stopped ordinary
  # plugs reaching the port; 14 x 8.5 let a laptop's straight plug seat fully.
  measured:
    # Dan's charger plug, with calipers (2026-11-12): the moulded head and the bare metal in front of it.
    head_width_mm: 11.58
    head_thickness_mm: 6.44
    metal_length_mm: 7.5  # from the tip to the moulded head, about
    source: "Dan, 2026-11-12, one charger cable"
