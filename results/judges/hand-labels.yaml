# Answer-key labels a program doesn't give, made by hand by Claude on 2026-11-12, read against the records.
# Used by scripts/judge_known_answers.py. Each says what it was read from.

supports:
  # Test 1. pbe/parts/supports.py gives the plain-request key (5 submissions). These are the submissions whose
  # instructions assume supports without asking for them outright: a step that says to remove them. Claude's
  # reading of each sentence (quoted). They are "no" under supports.py's rule and "yes" under "expects supports".
  expects_without_asking:
    cloud-smoke/m5-spacer/can_ask/anthropic__claude-haiku-5.5/t1: "Remove any supports from the bore and check the bore is clear."
    loop-estoa/pilot-estoa/estoa-light/can_ask/anthropic__claude-haiku-5.5/t2/feedback: "Remove supports and clean the bar underside."
    loop-estoa/pilot-estoa/estoa-light/can_ask/anthropic__claude-haiku-5.5/t2/neutral: "Remove supports and clean the bar underside."
    loop-estoa/pilot-estoa/estoa-light/can_ask/anthropic__claude-haiku-5.5/t4/feedback: "Remove supports and clean the holes."
    loop-estoa/pilot-estoa/estoa-light/can_ask/anthropic__claude-haiku-5.5/t4/neutral: "Remove supports and clean the holes."
    loop-estoa/pilot-estoa/estoa-light/can_ask/anthropic__claude-haiku-5.5/t5/feedback: "roof support removable through the open back"
    loop-tripod/pilot-tripod/tripod-plate/can_ask/anthropic__claude-haiku-5.5/t1/neutral: "Remove any supports from the pocket and slots."
    pilot-estoa/estoa-light/can_ask/anthropic__claude-haiku-5.5/t2: "Remove supports and clean the bar underside."
    pilot-estoa/estoa-light/can_ask/anthropic__claude-haiku-5.5/t4: "Remove supports and clean the holes."
    pilot-wheel/bearing-wheel/can_ask/anthropic__claude-haiku-5.5/t7: "Remove supports from the bearing pockets and clean out any stringing."
  # The phrasings supports.py was written to turn down: conditional, or "no" said beside "supports". Its CHANGELOG
  # entry names these kinds; the seven submissions are found by reading every saved submission that mentions
  # supports in a sentence without a plain refusal. "no" under both readings.
  conditional_or_refused:
    pilot-estoa/estoa-light/can_ask/anthropic__claude-opus-5.5/t3: "Use supports only if your slicer asks for them;"
    pilot-wheel/bearing-wheel/can_ask/deepseek__deepseek-v4-pro-0813/t3: "tree/organic supports only if the groove overhang needs it (it is shallow, should bridge fine)"
    loop-tripod/pilot-tripod/tripod-plate/can_ask/deepseek__deepseek-v4.1-flash/t1/feedback: "no supports (or supports inside the pocket if the first try still fails)"
    loop-tripod/pilot-tripod/tripod-plate/can_ask/deepseek__deepseek-v4.1-flash/t1/neutral: "No supports anywhere - supports under the pocket would fill it"
    loop-tripod/pilot-tripod-given/tripod-plate/all_given/deepseek__deepseek-v4.1-flash/t1/feedback: "so if your clamp's pocket turns out shallower than about 10.5 mm, either print the plate with supports under that small roof, or tell me"
    pilot-nut-knob-2/nut-knob/M3/can_ask/qwen__qwen3.8-flash/t3: "printed the other way round it needs supports inside the bore."
    loop-tripod/pilot-tripod/tripod-plate/can_ask/google__gemini-4-argon/t2/feedback: "a perpendicular bolt_hole_d x bolt_hole_d square bridge across the slot to support the circular shaft hole above"

roofs:
  # Test 2, roof outcomes fit_cards.py doesn't colour. Claude's reading: "ok", "fine", "mostly ok", "clean" -> good;
  # "messed up", "failed" -> failed.
  good: ["mostly ok", "fine", "mostly ok, needs a bit of trimming", "ok; a bit loose, fixable by clipping", "clean"]
  failed: ["messed up", "failed: all stringy, strings break"]

# Hand checks of every disagreement between a judge and its key (2026-11-12 run), by Claude, read against the
# submission or the transcript's tool calls. An entry here replaces the key the run recorded; the raw rows keep
# the key they ran with. Disagreements not listed were checked and the key stands (docs/decisions-api.md says why).
hand_checked:
  1-supports:
    loop-estoa/pilot-estoa/estoa-light/can_ask/anthropic__claude-haiku-5.5/t5/feedback:
      asks_plainly: {key: true, why: "step 1: 'Support is needed under the roof inside the box; pull it out through the open back.' A plain ask that supports.py's phrasings miss; both judges caught it."}
  4-checklist:
    # plug_head's keyword key matched 'plugged in', 'plug mouth' and the disk's connector plug; none of these asked the charger plug's size.
    pilot-estoa/estoa-light/can_ask/anthropic__claude-haiku-5.5/t5: {plug_head: {key: false, why: "only 'with the ESP32 plugged in'"}}
    pilot-estoa/estoa-light/can_ask/anthropic__claude-opus-5.5/t2: {plug_head: {key: false, why: "only the disk connector 'with its plug in' and 'ESP32 plugged in'"}}
    pilot-estoa/estoa-light/can_ask/deepseek__deepseek-v4-pro-0813/t2: {plug_head: {key: false, why: "only 'ESP32 plugged into the female headers'"}}
    pilot-estoa/estoa-light/can_ask/deepseek__deepseek-v4-pro-0813/t3: {plug_head: {key: false, why: "asked the port mouth's size ('the opening the plug goes into'), not the plug's"}}
    pilot-estoa/estoa-light/can_ask/openai__gpt-6.1-sol/t2: {plug_head: {key: false, why: "asked whether anything blocks 'a plug approaching from below', not its size"}}
    test-first/estoa-light/can_test/deepseek__deepseek-v4.1-flash/t2: {plug_head: {key: false, why: "only 'plugged-in ESP32' and the disc's plug"}}
    test-first/estoa-light/can_test/google__gemini-3.8-flash/t1: {plug_head: {key: false, why: "the disk's input connector, not the charger plug"}}
    # esp32_height's key missed 'maximum height of components'
    pilot-estoa/estoa-light/can_ask/google__gemini-4-argon/t2: {esp32_height: {key: true, why: "'maximum height of components on top' of the perfboard"}}
    test-first/estoa-light/can_test/google__gemini-3.8-flash/t2: {esp32_height: {key: true, why: "'height of components above and below the board'"}}
    # wall_screw_size's key matched 'overhang' for 'hang'
    test-first/estoa-light/can_test/deepseek__deepseek-v4.1-flash/t3: {wall_screw_size: {key: false, why: "the only match was 'does it overhang a 20 cm ruler' about the disc"}}

  # Test 4's questions code can't key, labelled by hand on a sample of four transcripts as the judges saw them
  # (the conversation and tool calls; a submitted design's code cut at 2500 characters). plug_reach isn't
  # labelled: asking where the port mouth sits is a step towards it, and the question doesn't say whether that counts.
  4-checklist-sample:
    pilot-estoa/estoa-light/can_ask/anthropic__claude-opus-5.5/t2: {screw_length: false, bridge_reasoned: false, tool_reach: false}
    test-first/estoa-light/can_test/anthropic__claude-sonnet-5.5/t2: {screw_length: false, bridge_reasoned: false, tool_reach: false}
    pilot-estoa/estoa-light/can_ask/anthropic__claude-haiku-5.5/t1: {screw_length: false, bridge_reasoned: false, tool_reach: false}
    pilot-estoa/estoa-light/can_ask/openai__gpt-6.1-sol/t2: {screw_length: false, bridge_reasoned: false, tool_reach: false}

# Test 5's disagreements, read by Claude. The records' classes stand as the key (no override); these notes say
# which judge picks are defensible from classes.yaml's own wording. Not used in scoring.
5-classes-notes:
  defensible:  # Jev's pick matches the other class's description word for word: the C1/C5 overlap
    side-project-failures.yaml:slots-ignore-headers: "C5 (Jev): C5's description names 'header height'"
    tripod-failures.yaml:arca-counterbore-guessed: "C5 (Jev): C5's description names 'screw head'"
    side-project-failures.yaml:cable-weave-holes-too-tight: "C5 (Jev): C5's description names 'cable bend'"
    estoa-failures.yaml:lid-screw-heads-proud: "C3 (Jev): screw heads standing proud is stack-up arithmetic as much as an envelope"
  wrong:
    estoa-failures.yaml:velcro-thickness-assumed: "C5 (Jev): an unverified consumable, C1"
    estoa-failures.yaml:board-layout-overlap: "C7 (Jev): the overlap is an envelope; only the side it faced touches orientation"
    estoa-failures.yaml:hole-cut-through-ledge: "C3 (Jev): a cut that leaves 0.2 mm of plastic is printability"
    estoa-failures.yaml:test-print-overscoped: "none (Jev and Luna): C8 names test prints far bigger than needed; the record only gives the shop's quote"
    luna-manual: "All five C9 (manual) records went to C10 (process) with Luna: template scale, undocumented holes, insert tool, part reuse, hidden washers"

# Test 3c's disagreements, read by Claude from the crops (kept in a scratch folder, not the repo). Keys stand.
3c-references-notes:
  bridge strips (IMG_6188, 100 and 60 mm spans with Luna; all five arcs with Jev, arcs 1 and 3 with Luna): >-
    From above, each strip shows strands laid side by side, close to the "ok" examples. Dan's verdict ("all stringy,
    strings break") is about strands that break when touched, which a photo can't show. A limit of the photos, not
    something an example photo can teach.
  ring roofs 1, 5, 6, 8, 10 (both models called them failed): >-
    Dan's "mostly ok" and "ok; a bit loose, fixable by clipping" are about whether the part works. Each crop still
    shows stray strands across the top (10, 8) or is too small to read (6 is about 56 px across before scaling up;
    1 and 5 about 80 px). The examples the ring cells got were GPT's roof crop and a ring roof for "ok", and two long
    bridges for "failed", since only one cell that worked is outside the ring-roof photo.

