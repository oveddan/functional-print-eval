parts:
- id: knob
  role: final
  material: PLA
  code: "def build(p):\n    r = p.knob_d / 2.0\n    h = p.knob_h\n    part = cq.Workplane('XY').circle(r).extrude(h)\n\
    \    for i in range(p.n_grooves):\n        ang = i * 360.0 / p.n_grooves\n   \
    \     g = (cq.Workplane('XY').transformed(rotate=(0, 0, ang))\n             .center(r\
    \ - p.groove_depth / 2.0, 0)\n             .rect(p.groove_depth + 2.0, p.groove_w)\n\
    \             .extrude(h))\n        part = part.cut(g)\n    top = part.faces('>Z').workplane()\n\
    \    pd = p.nut_h + p.nut_recess\n    part = part.cut(top.polygon(6, p.pocket_af,\
    \ circumscribed=True).extrude(-pd))\n    top2 = part.faces('>Z').workplane()\n\
    \    part = part.cut(top2.circle(p.clearance_d / 2.0).extrude(-h))\n    return\
    \ part"
  print_orientation: flat bottom face (z=0, bolt-exit side) on the bed; nut pocket
    opens upward
  use_orientation: knob axis vertical, nut pocket facing the user; bolt enters from
    the top and exits the back
