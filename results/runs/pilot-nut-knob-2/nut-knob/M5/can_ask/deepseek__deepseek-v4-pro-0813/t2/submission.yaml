task: nut-knob/M5
note: 30 mm hand knob for an M5 bolt. An ISO 4032 M5 nut press-fits into a hexagonal
  pocket (0.15 mm total interference on the flats) so it stays in without glue, even
  upside down. A coaxial 5.5 mm through-hole lets the bolt thread through the nut
  and exit the back. Grip via 12 vertical grooves around the rim.
questions: []
params:
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: design
    note: ''
  knob_h:
    value: 14
    unit: mm
    kind: design
    source: design
    note: ''
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  nut_h:
