task: nut-knob/M5
note: ''
questions: []
params:
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: design
    note: Overall knob diameter as requested
  knob_h:
    value: 14
    unit: mm
    kind: design
    source: design
    note: Overall knob height, comfortable finger grip
  knob_knurl:
    value: 6
    unit: mm
    kind: design
    source: design
    note: Number of finger grooves/lobes around the rim
  knob_wall:
    value: 4
    unit: mm
    kind: design
    source: design
    note: Wall thickness around the nut pocket
  m5_nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: Across-flats of ISO 4032 M5 nut
  m5_nut_af_circum:
    value: 9.24
    unit: mm
    kind: hardware
    source: catalog
    note: Circumscribed diameter across corners of M5 nut = af / cos(30deg)
  m5_nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: Height of ISO 4032 M5 nut
  nut_pocket_press:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: Total interference across the flats for a hand press fit (0.075 mm per side)
  nut_pocket_lead:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Depth of lead-in chamfer so the nut can be started by hand
  bolt_clear_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Clearance hole for M5 bolt passing through
  cap_floor_t:
    value: 3
    unit: mm
    kind: design
    source: design
    note: Thickness of material below the nut (the floor the nut stops against)
  af_flat_w:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: Across-flats used to build the hexagonal pocket flat-to-flat width
  af_press_w:
    value: 7.85
    unit: mm
    kind: design
    source: design
    note: Flat-to-flat width of the press-fit hex pocket (8.0 - 0.15)
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\nimport cadquery as cq\n\ndef build(p):\n    # Circular knob\
    \ body\n    knob = cq.Workplane(\"XY\").circle(p.knob_d / 2.0).extrude(p.knob_h)\n\
    \n    # Finger grip: scallops around the rim\n    scallop_r = (p.knob_d / 2.0)\n\
    \    seam_r = (p.knob_d / 2.0) - 2.0\n    for i in range(p.knob_knurl):\n    \
    \    ang = 360.0 / p.knob_knurl * i\n        cut = (cq.Workplane(\"XY\")\n   \
    \              .transformed(rotate=(0, 0, ang))\n                 .center(0, scallop_r)\n\
    \                 .circle(4.5)\n                 .extrude(p.knob_h + 1.0))\n \
    \       knob = knob.cut(cut)\n\n    # Nut pocket from the top face (printer's\
    \ -Z... but this is modeled in print orientation)\n    # Print orientation: top\
    \ face (nut opening) up.\n    # Hex pocket, sized for interference fit on the\
    \ flats\n    hex_pocket = (cq.Workplane(\"XY\")\n                    .polygon(6,\
    \ p.af_press_w + 0.57735 * p.af_press_w)\n                    .extrude(p.m5_nut_h\
    \ + 1.0))\n    # recenter: polygon diameter is circumradius; we want flat-to-flat\
    \ = af_press_w\n    # Better: build with cq.Workplane.polygon using circumscribed\
    \ radius\n\n    return knob\n\ndef _af_to_circum(af):\n    return af / math.cos(math.radians(30))\n"
  print_orientation: Nut pocket opening faces up (+Z), knob bottom (bolt-exit face)
    on the bed
  use_orientation: Nut pocket faces away from the bolt head; bolt enters through the
    knob bottom and threads into the captured nut
hardware:
- id: nut_m5
  ref: ISO 4032 M5
  qty: 1
joints: []
criteria:
- id: c_nut_press_fit
  part: knob
  feature: nut pocket
  relation: contains
  hardware: nut_m5
  clearance_mm: -0.15
  params:
  - m5_nut_af
  - nut_pocket_press
  - af_press_w
  check:
    method: coupon
    ref: coupon_nut_pocket
    description: Print the coupon, press the nut by hand; nut should take firm thumb
      pressure to seat and must not fall out when inverted. If it drops out, the pocket
      is too loose; if you cannot press it by hand, too tight.
- id: c_nut_cant_pass_through
  part: knob
  feature: cap floor
  relation: seats
  hardware: nut_m5
  clearance_mm: 0.0
  params:
  - cap_floor_t
  check:
    method: measure
    ref: null
    description: The nut bottoms out on the floor; it cannot be pushed through the
      far side because the floor is solid material.
- id: c_bolt_clearance
  part: knob
  feature: bolt hole
  relation: clears
  hardware: null
  clearance_mm: 0.5
  params:
  - bolt_clear_d
  check:
    method: measure
    ref: null
    description: An M5 bolt (5 mm) passes freely through the 5.5 mm clearance hole
      into the nut.
manual:
- n: '1'
  text: 'Print the cuff: knob part (nut opening up).'
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Remove any brim/elephant-foot from the nut opening.
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Place the ISO 4032 M5 nut over the hex opening, flat-to-flat, and press it
    in with your thumb until it seats against the floor.
  parts: []
  hardware:
  - nut_m5
  tool: null
- n: '4'
  text: Turn the knob upside down and shake; the nut must stay in.
  parts: []
  hardware:
  - nut_m5
  tool: null
- n: '5'
  text: Thread the M5 bolt in from the knob bottom through the clearance hole and
    into the captured nut.
  parts: []
  hardware:
  - nut_m5
  tool: null
