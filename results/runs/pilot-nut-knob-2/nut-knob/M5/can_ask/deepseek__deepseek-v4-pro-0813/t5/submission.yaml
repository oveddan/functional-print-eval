parts:
- id: knob
  role: final
  material: PLA
  code: "import cadquery as cq\nimport math\n\nK = 2.0 / math.sqrt(3.0)\n\ndef hexprism(af,\
    \ h, z0=0.0):\n    return cq.Workplane(\"XY\").polygon(6, af * K).extrude(h).translate((0,\
    \ 0, z0))\n\ndef build(p):\n    knob = cq.Workplane(\"XY\").circle(p.knob_d /\
    \ 2.0).extrude(p.knob_h)\n\n    if p.scallop_count > 0:\n        rc = p.knob_d\
    \ / 2.0 + p.scallop_r - p.scallop_depth\n        cutters = None\n        for i\
    \ in range(int(p.scallop_count)):\n            a = 2.0 * math.pi * i / p.scallop_count\n\
    \            c = (cq.Workplane(\"XY\")\n                 .center(rc * math.cos(a),\
    \ rc * math.sin(a))\n                 .circle(p.scallop_r)\n                 .extrude(p.knob_h\
    \ + 4.0))\n            cutters = c if cutters is None else cutters.union(c)\n\
    \        knob = knob.cut(cutters)\n\n    lead = hexprism(p.lead_af, p.lead_h,\
    \ 0.0)\n    press = hexprism(p.pocket_af, p.pocket_depth - p.lead_h, p.lead_h)\n\
    \    knob = knob.cut(lead.union(press))\n\n    hole = cq.Workplane(\"XY\").circle(p.bolt_clearance_d\
    \ / 2.0).extrude(p.knob_h)\n    return knob.cut(hole)\n"
  print_orientation: Flat open end (nut pocket mouth) down on the bed; bolt bore vertical
  use_orientation: Nut pocket faces down; the M5 bolt enters from the pocket side,
    threads through the nut, and exits the top
- id: nut_fit_coupon
  role: coupon
  material: PLA
  code: "import cadquery as cq\nimport math\n\nK = 2.0 / math.sqrt(3.0)\n\ndef hexprism(af,\
    \ h, z0=0.0):\n    return cq.Workplane(\"XY\").polygon(6, af * K).extrude(h).translate((0,\
    \ 0, z0))\n\ndef build(p):\n    plate = cq.Workplane(\"XY\").rect(p.plate_w, p.plate_w).extrude(p.plate_t)\n\
    \    lead = hexprism(p.lead_af, p.lead_h, 0.0)\n    press = hexprism(p.pocket_af,\
    \ p.pocket_depth - p.lead_h, p.lead_h)\n    plate = plate.cut(lead.union(press))\n\
    \    hole = cq.Workplane(\"XY\").circle(p.bolt_clearance_d / 2.0).extrude(p.plate_t)\n\
    \    return plate.cut(hole)\n"
  print_orientation: Flat, pocket mouth down on the bed
  use_orientation: Pocket face up to press the nut in and test
hardware:
- id: nut1
  ref: ISO 4032 M5
  qty: 1
joints: []
criteria:
- id: nut_seats
  part: knob
  feature: nut pocket
  relation: contains
  hardware: nut1
  clearance_mm: null
  params: []
