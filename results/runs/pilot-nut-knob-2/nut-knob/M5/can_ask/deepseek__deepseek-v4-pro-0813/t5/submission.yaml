task: nut-knob/M5
note: '30mm hand knob with a captured M5 hex nut pressed in from the underside (no
  glue). Bolt enters from the pocket side, threads through the nut, and exits the
  top. Key fit decision: the hexagonal pocket''s across-flats is set slightly undersize
  (7.9mm vs nut 8.0mm) to grip the nut''s flats and hold it when inverted; the nut''s
  chamfered corners clear the pocket corners. A lead-in hex (8.6mm) guides the nut
  in. A coupon lets the maker verify press force and retention before the full knob.'
questions: []
