  part: knob
  feature: bolt bore
  relation: clears
  hardware: null
  clearance_mm: 0.5
  params: []
  check:
    method: measure
    ref: null
    description: Pass an M5 bolt through the bore to the nut and out the top; it should
      turn freely.
manual:
- n: '1'
  text: Print the fit-test coupon first (nut_fit_coupon).
  parts:
  - nut_fit_coupon
  hardware: []
  tool: 3D printer
- n: '2'
  text: Press the M5 hex nut (ISO 4032 M5) into the coupon's pocket by hand. Invert
    and shake the coupon; the nut must stay in. If it drops out or cannot be pressed
    in, the pocket size needs adjusting before printing the knob.
  parts:
  - nut_fit_coupon
  hardware:
  - nut1
  tool: hands
- n: '3'
  text: Print the knob.
  parts:
  - knob
  hardware: []
  tool: 3D printer
- n: '4'
  text: Press the M5 nut into the knob's pocket from the open underside until it seats
    (it will sit just below the flat face).
  parts:
  - knob
  hardware:
  - nut1
  tool: hands
- n: '5'
  text: Thread the knob-and-nut onto your M5 bolt from the pocket side; keep turning
    the knob to tighten the bolt. The bolt passes through the nut and out the top
    of the knob.
  parts:
  - knob
  hardware:
  - nut1
  tool: hands
