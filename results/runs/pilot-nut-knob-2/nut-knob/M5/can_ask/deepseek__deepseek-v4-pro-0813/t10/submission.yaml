  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across-flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 nut height
  knob_d:
    value: 30.0
    unit: mm
    kind: design
    source: design
    note: Octagon across corners, per 'about 30 mm across'
  knob_h:
    value: 20.0
