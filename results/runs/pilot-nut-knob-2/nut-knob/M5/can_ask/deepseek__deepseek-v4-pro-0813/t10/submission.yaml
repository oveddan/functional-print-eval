parts:
- id: knob
  role: final
  material: PLA
  code: "import math\nfrom cadquery import Workplane\n\ndef build(p):\n    body =\
    \ Workplane(\"XY\").polygon(8, p.knob_d).extrude(p.knob_h)\n\n    af_pocket =\
    \ p.nut_af + p.pocket_clearance\n    R = af_pocket / math.sqrt(3.0)\n    apothem\
    \ = af_pocket / 2.0\n    hex_pts = [(R * math.cos(math.radians(60 * i)), R * math.sin(math.radians(60\
    \ * i))) for i in range(6)]\n\n    top = body.faces(\">Z\").workplane()\n    body\
    \ = top.polyline(hex_pts).close().cutBlind(-p.pocket_depth)\n\n    body = body.faces(\"\
    <Z\").workplane().hole(p.bolt_clear_d)\n\n    body = body.faces(\">Z\").edges().chamfer(p.chamfer)\n\
    \    body = body.faces(\"<Z\").edges().chamfer(p.chamfer)\n\n    rib_h = p.nut_h\
    \ + 0.5\n    z_floor = p.knob_h - p.pocket_depth\n    rib_list = []\n    for k\
    \ in range(6):\n        th = math.radians(30 + 60 * k)\n        rc = apothem -\
    \ p.rib_protrusion / 2.0\n        rib = (Workplane(\"XY\")\n               .box(p.rib_protrusion,\
    \ p.rib_w, rib_h, centered=(True, True, False))\n               .rotate((0, 0,\
    \ 0), (0, 0, 1), math.degrees(th))\n               .translate((rc * math.cos(th),\
    \ rc * math.sin(th), z_floor)))\n        rib_list.append(rib)\n\n    body = body.union(rib_list)\n\
    \    return body\n"
  print_orientation: Flat octagonal bottom face (bolt-entry side) on the bed; nut
    pocket faces up.
  use_orientation: Nut pocket up; the nut is pressed in from the top, and the bolt
    enters through the bottom hole and exits out the top.
- id: nut_pocket_coupon
  role: coupon
  material: PLA
  code: "import math\nfrom cadquery import Workplane\n\ndef build(p):\n    body =\
    \ Workplane(\"XY\").box(p.coupon_l, p.coupon_w, p.coupon_h, centered=(True, True,\
    \ False))\n\n    af_pocket = p.nut_af + p.pocket_clearance\n    R = af_pocket\
    \ / math.sqrt(3.0)\n    apothem = af_pocket / 2.0\n    hex_pts = [(R * math.cos(math.radians(60\
    \ * i)), R * math.sin(math.radians(60 * i))) for i in range(6)]\n\n    top = body.faces(\"\
    >Z\").workplane()\n    body = top.polyline(hex_pts).close().cutBlind(-p.pocket_depth)\n\
    \n    body = body.faces(\"<Z\").workplane().hole(p.bolt_clear_d)\n\n    body =\
    \ body.faces(\">Z\").edges().chamfer(p.chamfer)\n\n    rib_h = p.nut_h + 0.5\n\
    \    z_floor = p.coupon_h - p.pocket_depth\n    rib_list = []\n    for k in range(6):\n\
    \        th = math.radians(30 + 60 * k)\n        rc = apothem - p.rib_protrusion\
    \ / 2.0\n        rib = (Workplane(\"XY\")\n               .box(p.rib_protrusion,\
    \ p.rib_w, rib_h, centered=(True, True, False))\n               .rotate((0, 0,\
    \ 0), (0, 0, 1), math.degrees(th))\n               .translate((rc * math.cos(th),\
    \ rc * math.sin(th), z_floor)))\n        rib_list.append(rib)\n\n    body = body.union(rib_list)\n\
    \    return body\n"
  print_orientation: Flat bottom on the bed; nut pocket faces up (same as the knob).
  use_orientation: Nut pocket up for the press-fit and retention test.
