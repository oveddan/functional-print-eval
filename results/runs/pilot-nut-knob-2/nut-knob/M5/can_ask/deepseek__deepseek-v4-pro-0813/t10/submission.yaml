  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: bolt_hole
    role: clearance
  - part: knob
    feature: nut_pocket
    role: nut_pocket
  nut: nut_m5
  external: null
criteria:
- id: nut_seats
  part: knob
  feature: nut_pocket
  relation: seats
  hardware: nut_m5
  clearance_mm: null
  params:
  - nut_af
  - nut_h
  - pocket_clearance
  - rib_protrusion
  - rib_w
  - pocket_depth
  check:
    method: coupon
    ref: nut_pocket_coupon
    description: Press an ISO 4032 M5 nut into the coupon pocket by hand; it should
      seat flat on the pocket floor without tools.
- id: nut_retained
  part: knob
  feature: nut_pocket
  relation: engages
  hardware: nut_m5
  clearance_mm: null
  params:
  - nut_af
  - pocket_clearance
  - rib_protrusion
  - rib_w
  check:
    method: coupon
    ref: nut_pocket_coupon
    description: Turn the coupon pocket-side down and shake; the nut must stay in.
- id: nut_blocked_far_side
  part: knob
  feature: bolt_hole
  relation: faces
  hardware: nut_m5
  clearance_mm: null
  params:
  - nut_af
  - bolt_clear_d
  check:
    method: none
    ref: null
    description: The nut (8.0 mm across flats) cannot pass the far side because the
      bolt hole in the pocket floor is only 5.4 mm.
- id: bolt_clears
  part: knob
  feature: bolt_hole
  relation: clears
  hardware: bolt_m5
  clearance_mm: 0.2
  params:
  - bolt_clear_d
  check:
    method: measure
    ref: null
    description: Push the M5 bolt through the knob's bottom hole; it should slide
      freely into and through the nut.
manual:
- n: '1'
  text: Print the coupon (nut_pocket_coupon) with its flat bottom on the bed and the
    nut pocket facing up.
  parts:
  - nut_pocket_coupon
  hardware: []
  tool: null
- n: '2'
  text: Press an ISO 4032 M5 hex nut into the coupon's hex pocket by hand until it
    seats on the pocket floor. If it is much too tight or too loose, stop and tell
    me the result before printing the knob.
  parts:
  - nut_pocket_coupon
  hardware:
  - nut_m5
  tool: null
- n: '3'
  text: Turn the coupon pocket-side down and shake; the nut must stay in. Then thread
    an ISO 4762 M5x30 bolt through the bottom hole into the nut to confirm the hole
    is centered.
  parts:
  - nut_pocket_coupon
  hardware:
  - nut_m5
  - bolt_m5
  tool: null
- n: '4'
  text: Print the knob with its flat bottom face on the bed and the nut pocket facing
    up.
  parts:
  - knob
  hardware: []
  tool: null
- n: '5'
  text: Press the ISO 4032 M5 hex nut into the knob's top pocket by hand until it
    seats fully inside.
  parts:
  - knob
  hardware:
  - nut_m5
  tool: null
- n: '6'
  text: 'Use the knob: thread it onto your M5 bolt (bolt enters the bottom hole, threads
    through the nut, and exits out the top) and tighten by hand. The nut cannot come
    out the top because the bolt hole is smaller than the nut.'
  parts:
  - knob
  hardware:
  - nut_m5
  - bolt_m5
  tool: null
