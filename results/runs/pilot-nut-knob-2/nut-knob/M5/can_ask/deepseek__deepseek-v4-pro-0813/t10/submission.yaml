task: nut-knob/M5
note: Hand knob for an M5 bolt, ~30 mm across, one printed final piece. An ISO 4032
  M5 hex nut presses into a hexagonal pocket in the top face by hand. Six narrow vertical
  "crush ribs" (one on each pocket flat) provide light interference so the nut stays
  in when the knob is inverted, without glue; the hex flats themselves give torque
  engagement. The nut seats on a solid floor whose bolthole is Ø5.4 (smaller than
  the nut's 8.0 mm across flats), so the nut can't be pushed out the far side, and
  tightening load is carried by that floor. A coupon with the same pocket lets the
  user verify the hand-press fit before printing the knob.
questions: []
