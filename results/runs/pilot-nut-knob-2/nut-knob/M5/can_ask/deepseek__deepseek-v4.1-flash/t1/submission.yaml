task: nut-knob/M5
note: 'A 30 mm hand knob for an M5 bolt, printed flat as one piece. The M5 hex nut
  presses in from the top face into a hex pocket whose across-flats is slightly smaller
  than the nut, and the nut bottoms out on a 6.5 mm thick floor that has a 5.5 mm
  clearance hole for the bolt — so the nut sits fully inside (its top face 0.8 mm
  below the rim), cannot be pushed out of the far side (the floor''s hole, 5.5 mm,
  is far smaller than the nut''s 8 mm across flats), and is held against falling out
  when the knob is turned upside down by the interference fit alone (no glue, no extra
  hardware). The M5 bolt passes up through the underside clearance hole, threads into
  the nut, and its threaded tip emerges from the open top.


  Because the user could not measure their nut, the pocket size is not guessed: coupon
  A prints six hex pockets in 0.10 mm steps from 7.95 mm down to 7.45 mm across the
  flats, covering every ISO 4032 M5 nut (7.64–8.00) combined with a sane press interference
  (0.05–0.25). The user presses the nut into each pocket and keeps the smallest pocket
  that (a) goes in by hand and (b) still holds the nut when the coupon is inverted
  and tapped. That value is typed straight into the knob''s `pocket_af` (default 7.85,
  i.e. 0.15 mm interference on a nominal nut). Everything prints without supports
  and with no bridging at all: the knob''s axis is vertical, the pockets open upward,
  and the finger grooves are vertical.'
questions:
- text: Which way does the bolt pass through the knob?
  answer: 'Assumed from below: the shank enters the 5.5 mm clearance hole in the knob''s
    underside (the pocket floor), threads into the nut, and the threaded tip comes
    out of the open top. The knob''s underside is flat — it does not seat a bolt head;
    the head bears on whatever is being clamped.'
- text: What holds the nut in when the knob is upside down?
  answer: Only the interference fit of the hex pocket walls (pocket across-flats smaller
    than the nut's), verified with coupon A. There is no glue, snap lip, set screw
    or second nut — that keeps the part printable, but it means the pocket size must
    be chosen from the coupon result rather than assumed.
- text: Which M5 bolt should be listed?
  answer: ISO 4762 M5x20 is listed as the demonstrator (any ISO 4762 M5 of 16 mm or
    longer works; 16 mm already brings the thread out of the top face).
params:
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut, width across the flats; catalog max 8.00, min 7.64.
      User could not measure theirs, so the tolerance band is covered by the coupon.
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut height.
  bolt_shank_d:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 nominal shank diameter.
  bolt_clear_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: 'Clearance hole through the pocket floor: 0.5 mm over the M5 shank. Far
      smaller than the nut, so the nut cannot pass through it.'
  pocket_af:
    value: 7.85
    unit: mm
    kind: design
    source: design
    note: Width across flats of the knob's hex nut pocket. Default 7.85 = 0.15 mm
      interference on a nominal nut; replace with the value of the winning pocket
      from coupon A.
  knob_d:
    value: 30.0
    unit: mm
    kind: design
    source: asked
    note: User asked for about 30 mm across. This is the diameter at the un-grooved
      lobes; the finger grooves are cut inside it.
  knob_h:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: Knob height, chosen so the pocket floor under the nut is 6.5 mm thick and
      there is 12 mm of rim to grip.
  pocket_recess:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Distance from the knob's top face down to the nut's top face, so the nut
      sits fully inside the knob.
  lead_in:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Depth of the 45 degree flare at the mouth of the hex pocket, to start the
      nut square and ease the hand press.
  grip_flutes:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Number of vertical finger grooves around the rim.
  groove_r:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: Radius of the cutter that forms each finger groove.
  groove_depth:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: Depth of each finger groove; cutter centre radius = knob_d/2 + groove_r
      - groove_depth.
  coupon_l:
    value: 85.0
    unit: mm
    kind: design
    source: design
    note: Coupon A length.
  coupon_w:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: Coupon A width.
  coupon_h:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: Coupon A thickness; same pocket depth and floor as the knob.
  coupon_pitch:
    value: 13.0
    unit: mm
    kind: design
    source: design
    note: Centre-to-centre spacing of the coupon's pockets.
  coupon_count:
    value: 6
    unit: mm
    kind: design
    source: design
    note: Number of test pockets in coupon A.
  coupon_af_max:
    value: 7.95
    unit: mm
    kind: design
    source: design
    note: Across-flats of the coupon's first (largest) pocket, nearest the -X end.
  coupon_af_step:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: Reduction in across-flats from one coupon pocket to the next, giving 7.95
      to 7.45 mm.
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef hex_pts(af, dx=0.0):\n    # regular hexagon defined by\
    \ its width across flats, vertex on +X\n    R = af / (3 ** 0.5)\n    return [(dx\
    \ + R * math.cos(math.radians(60 * i)),\n             R * math.sin(math.radians(60\
    \ * i))) for i in range(6)]\n\ndef build(p):\n    # body: plain cylinder, axis\
    \ = Z, flat bottom on the bed\n    body = cq.Workplane(\"XY\").circle(p.knob_d\
    \ / 2).extrude(p.knob_h)\n\n    # vertical finger grooves around the rim (no overhangs)\n\
    \    ctr_r = p.knob_d / 2 + p.groove_r - p.groove_depth\n    n = int(p.grip_flutes)\n\
    \    for i in range(n):\n        a = 2 * math.pi * i / n\n        body = body.cut(\n\
    \            cq.Workplane(\"XY\")\n            .moveTo(ctr_r * math.cos(a), ctr_r\
    \ * math.sin(a))\n            .circle(p.groove_r)\n            .extrude(p.knob_h))\n\
    \n    top = p.knob_h\n    floor_z = top - (p.nut_h + p.pocket_recess)\n\n    #\
    \ hex nut pocket: straight walls, open at the top face\n    pocket = (cq.Workplane(\"\
    XY\").workplane(offset=floor_z)\n              .polyline(hex_pts(p.pocket_af)).close()\n\
    \              .extrude(top - floor_z + 0.5))\n    body = body.cut(pocket)\n\n\
    \    # 45 degree lead-in flare at the mouth of the pocket\n    lead = (cq.Workplane(\"\
    XY\").workplane(offset=top - p.lead_in)\n            .polyline(hex_pts(p.pocket_af)).close()\n\
    \            .workplane(offset=p.lead_in + 0.5)\n            .polyline(hex_pts(p.pocket_af\
    \ + 2 * (p.lead_in + 0.5))).close()\n            .loft())\n    body = body.cut(lead)\n\
    \n    # M5 clearance hole through the pocket floor\n    body = body.cut(cq.Workplane(\"\
    XY\")\n                    .circle(p.bolt_clear_d / 2)\n                    .extrude(p.knob_h))\n\
    \n    return body\n"
  print_orientation: Flat bottom face on the bed, knob axis vertical (Z); the hex
    pocket opens upward, so nothing overhangs and there is no bridging.
  use_orientation: Axis vertical, hex pocket up. The nut presses in from the top face;
    the M5 bolt comes up from below through the clearance hole and out of the open
    top.
- id: coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef hex_pts(af, dx=0.0):\n    # regular hexagon defined by\
    \ its width across flats, vertex on +X\n    R = af / (3 ** 0.5)\n    return [(dx\
    \ + R * math.cos(math.radians(60 * i)),\n             R * math.sin(math.radians(60\
    \ * i))) for i in range(6)]\n\ndef build(p):\n    plate = cq.Workplane(\"XY\"\
    ).box(p.coupon_l, p.coupon_w, p.coupon_h,\n                                  \
    \  centered=(True, True, False))\n    n = int(p.coupon_count)\n    floor_z = p.coupon_h\
    \ - (p.nut_h + p.pocket_recess)\n\n    for k in range(n):\n        af = p.coupon_af_max\
    \ - k * p.coupon_af_step\n        x = -p.coupon_pitch * (n - 1) / 2.0 + k * p.coupon_pitch\n\
    \n        # hex pocket, same depth and floor as the knob\n        pocket = (cq.Workplane(\"\
    XY\").workplane(offset=floor_z)\n                  .polyline(hex_pts(af, dx=x)).close()\n\
    \                  .extrude(p.coupon_h - floor_z + 0.5))\n        plate = plate.cut(pocket)\n\
    \n        # same lead-in flare as the knob\n        lead = (cq.Workplane(\"XY\"\
    ).workplane(offset=p.coupon_h - p.lead_in)\n                .polyline(hex_pts(af,\
    \ dx=x)).close()\n                .workplane(offset=p.lead_in + 0.5)\n       \
    \         .polyline(hex_pts(af + 2 * (p.lead_in + 0.5), dx=x)).close()\n     \
    \           .loft())\n        plate = plate.cut(lead)\n\n        # bolt clearance\
    \ hole through the floor\n        plate = plate.cut(cq.Workplane(\"XY\").moveTo(x,\
    \ 0)\n                          .circle(p.bolt_clear_d / 2)\n                \
    \          .extrude(p.coupon_h))\n\n    return plate\n"
  print_orientation: Flat bottom face on the bed, pockets opening upward.
  use_orientation: 'Flat, pockets up: press the nut into each pocket in turn, then
    hold the coupon upside down and tap it to see which pockets hold.'
