manual:
- n: '1'
  text: Print coupon (PLA, 0.2 mm layers, no supports). It lies flat with the six
    hex pockets opening upward; nothing overhangs and nothing bridges.
  parts:
  - coupon
  hardware: []
  tool: null
- n: '2'
  text: Lying flat as printed with the long axis left-right, the pockets from left
    to right are 7.95, 7.85, 7.75, 7.65, 7.55 and 7.45 mm across the flats. Press
    your M5 hex nut into each pocket in turn, flat-face up, starting at the left (loosest).
    It helps to start it square in the 45 degree flare at the mouth.
  parts:
  - coupon
  hardware:
  - nut
  tool: fingers (a light tap with a mallet handle is fine)
- n: '3'
  text: For each pocket that the nut enters, hold the coupon upside down and tap it
    on the bench. Find the smallest pocket the nut went into by hand that still holds
    the nut when inverted. Write down that across-flats number.
  parts:
  - coupon
  hardware:
  - nut
  tool: null
- n: '4'
  text: Print knob, but first set the knob's pocket_af to the number you just wrote
    down (default is 7.85). Print PLA, 0.2 mm layers, no supports, flat bottom on
    the bed with the hex pocket opening up.
  parts:
  - knob
  hardware: []
  tool: null
- n: '5'
  text: Press the M5 hex nut down into the knob's hex pocket, from the top face, square
    to the pocket. Push until it bottoms out on the floor; it should end up with its
    top face about 0.8 mm below the knob's rim, so it is fully inside.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '6'
  text: Turn the knob upside down and tap it. The nut must stay in place. If it drops
    out, reprint the knob with the next pocket size down from the coupon (0.10 mm
    less across the flats).
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '7'
  text: Feed the M5 bolt up through the clearance hole in the knob's underside and
    turn it into the nut. Keep turning by hand until the threaded tip comes out of
    the top of the knob.
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: null
- n: '8'
  text: 'To use: hold the knob and turn it by hand. The trapped nut turns with the
    knob and the bolt is driven in or out, so you can tighten the joint without a
    wrench.'
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: null
