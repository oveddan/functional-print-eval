task: nut-knob/M3
note: A single-piece, 20 mm maximum-diameter PLA hand knob. The M3 nut presses into
  a hexagonal pocket from the recessed top face and seats on an internal shoulder;
  the 3.4 mm axial bore continues through the opposite face for the bolt. The pocket
  fit is a design choice based on the catalog 5.5 mm nut across-flats dimension; actual
  printer and nut variation can affect hand-insertion force. Print as modeled, closed
  face on the bed.
