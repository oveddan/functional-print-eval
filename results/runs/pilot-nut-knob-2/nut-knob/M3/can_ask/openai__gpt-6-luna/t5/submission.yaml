parts:
- id: m3_hand_knob
  role: final
  material: PLA (high-speed PLA)
  code: "def build(p):\n    part = cq.Workplane(\"XY\").circle(p.base_radius).extrude(p.knob_height)\n\
    \    # Radial grip ribs, overlapping the round body so they fuse into one part.\n\
    \    for i in range(int(p.rib_count)):\n        rib = (cq.Workplane(\"XY\")\n\
    \               .box(p.rib_radial_length, p.rib_width, p.rib_height,\n       \
    \             centered=(True, True, False))\n               .translate((p.rib_center_radius,\
    \ 0, p.rib_bottom))\n               .rotate((0, 0, 0), (0, 0, 1), i * 360.0 /\
    \ p.rib_count))\n        part = part.union(rib)\n    # Nut pocket ends in a solid\
    \ shoulder. The axial clearance bore passes through it.\n    pocket_depth = p.nut_height\
    \ + p.pocket_extra_depth\n    pocket_floor = p.knob_height - pocket_depth\n  \
    \  tight_depth = pocket_depth - p.entry_relief_depth\n    hex_diameter = p.nut_fit_af\
    \ * 1.154700538\n    tight_hex = (cq.Workplane(\"XY\").workplane(offset=pocket_floor)\n\
    \                 .polygon(6, hex_diameter).extrude(tight_depth))\n    relief_hex\
    \ = (cq.Workplane(\"XY\").workplane(offset=p.knob_height-p.entry_relief_depth)\n\
    \                  .polygon(6, p.entry_relief_af * 1.154700538)\n            \
    \      .extrude(p.entry_relief_depth))\n    part = part.cut(tight_hex).cut(relief_hex)\n\
    \    bore = cq.Workplane(\"XY\").circle(p.bolt_clearance_d).extrude(p.knob_height)\n\
    \    return part.cut(bore)"
  print_orientation: Print with the flat, unpocketed circular face at z=0 on the bed;
    axis vertical.
  use_orientation: Grip the ribbed circumference. Insert the M3 nut into the recessed
    hex pocket on the top face; the M3 bolt passes through the axial bore from the
    opposite face and engages the nut.
