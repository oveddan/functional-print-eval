manual:
- n: '1'
  text: Print the knob with its flat, unpocketed circular face on the bed. Remove
    any brim or elephant-foot material from the pocket mouth and axial bore.
  parts:
  - m3_hand_knob
  hardware: []
  tool: null
- n: '2'
  text: Align the M3 hex nut with the recessed hex pocket on the top face and press
    it straight in by hand until it bottoms on the internal shoulder. Its top should
    remain below the knob face; do not force it if the nut or pocket is visibly damaged.
  parts:
  - m3_hand_knob
  hardware:
  - m3_nut
  tool: Hand
- n: '3'
  text: Pass the M3 bolt through the axial bore from the opposite face and thread
    it into the captive nut. Turn the ribbed knob by hand to tighten or loosen.
  parts:
  - m3_hand_knob
  hardware:
  - m3_nut
  tool: Hand
