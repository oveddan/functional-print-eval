task: nut-knob/M3
note: One-piece, support-free knob. The M3 nut loads from the bed-side face into a
  shallow hex pocket; a 3.4 mm bore continues through the opposite face. The pocket
  is intentionally slightly undersized across flats for a hand press fit. PLA fit
  varies, so test the nut gently before fully seating it; do not hammer it in. The
  nut is recessed from both outside faces when seated.
questions: []
params:
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: design
    note: Nominal outside diameter.
  knob_h:
    value: 12
    unit: mm
    kind: design
    source: design
    note: ''
  flute_count:
    value: 12
    unit: count
    kind: design
    source: design
    note: Shallow vertical grip grooves.
  flute_r:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: ''
  flute_center_r:
    value: 9.8
    unit: mm
    kind: design
    source: design
    note: ''
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 nominal across-flats.
  nut_thickness:
    value: 2.4
    unit: mm
    kind: hardware
