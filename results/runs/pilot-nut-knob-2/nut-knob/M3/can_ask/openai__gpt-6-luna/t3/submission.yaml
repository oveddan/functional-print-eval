  pocket_depth:
    value: 2.9
    unit: mm
    kind: design
    source: design
    note: Leaves a 9.6 mm solid stop below the pocket.
  mouth_af:
    value: 6.2
    unit: mm
    kind: design
    source: design
    note: Chamfered lead-in opening across flats.
  lead_depth:
    value: 0.7
    unit: mm
    kind: design
    source: design
    note: ''
  bolt_clearance_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: Through-hole for the M3 bolt shank.
  flute_count:
    value: 12
    unit: count
    kind: design
    source: design
    note: ''
  flute_radius:
    value: 1.05
    unit: mm
    kind: design
    source: design
