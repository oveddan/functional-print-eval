task: nut-knob/M3
note: 'One-piece PLA hand knob with an integral through-hole and a blind, hexagonal
  press-fit nut pocket. The M3 nut is inserted from the chamfered end; it sits 0.5
  mm below that face on a solid stop, so it cannot pass through the far side. The
  nut pocket is deliberately snug (5.45 mm across flats for a catalog 5.5 mm nut).
  FDM press fits vary: if the nut is too tight, lightly scrape/deburr the pocket;
  if it is loose, this print may not retain it reliably. The open pocket mouth is
  needed to install the nut; the nut does not protrude beyond the knob. Print in the
  stated orientation in PLA, with no supports.'
questions: []
params:
  knob_od:
    value: 20
    unit: mm
    kind: design
    source: design
    note: Maximum outside diameter, including the scalloped grip.
  knob_height:
    value: 12.5
    unit: mm
    kind: design
    source: design
    note: ''
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
