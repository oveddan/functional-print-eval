parts:
- id: hand_knob
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    h = p.knob_height\n    r = p.knob_od\
    \ / 2.0\n    part = cq.Workplane(\"XY\").circle(r).extrude(h)\n\n    # Vertical\
    \ finger scallops, cut around the outside while retaining a flat bed face.\n \
    \   for i in range(int(p.flute_count)):\n        a = 2.0 * math.pi * i / int(p.flute_count)\n\
    \        x = p.flute_center_radius * math.cos(a)\n        y = p.flute_center_radius\
    \ * math.sin(a)\n        cutter = cq.Workplane(\"XY\").center(x, y).circle(p.flute_radius).extrude(h)\n\
    \        part = part.cut(cutter)\n\n    # M3 bolt passage through the knob and\
    \ the solid floor of the nut pocket.\n    bore = cq.Workplane(\"XY\").circle(p.bolt_clearance_d\
    \ / 2.0).extrude(h)\n    part = part.cut(bore)\n\n    # Hex nut pocket opens at\
    \ the top. A tapered hex lead-in eases hand insertion.\n    circ_factor = 1.0\
    \ / math.cos(math.pi / 6.0)\n    pocket = (cq.Workplane(\"XY\")\n            \
    \  .workplane(offset=h - p.pocket_depth)\n              .polygon(6, p.pocket_af\
    \ * circ_factor)\n              .extrude(p.pocket_depth))\n    lead = (cq.Workplane(\"\
    XY\")\n            .workplane(offset=h - p.lead_depth)\n            .polygon(6,\
    \ p.pocket_af * circ_factor)\n            .workplane(offset=p.lead_depth)\n  \
    \          .polygon(6, p.mouth_af * circ_factor)\n            .loft(combine=True))\n\
    \    part = part.cut(pocket).cut(lead)\n    return part"
  print_orientation: Place the broad circular bolt-exit face (z=0) flat on the bed;
    axis vertical. No supports required.
  use_orientation: Insert the M3 hex nut into the chamfered pocket at the upper end
    until it rests on the pocket floor. The bolt enters through the opposite flat
    face and threads into the captive nut.
hardware:
- id: m3_nut
  ref: ISO 4032 M3
  qty: 1
joints: []
