  - knob_height
  - nut_height
  check:
    method: none
    ref: null
    description: The blind pocket floor prevents the nut being pushed through the
      far face; the nut is recessed below the pocket mouth.
manual:
- n: '1'
  text: Print the hand_knob part flat on its bolt-exit face, with the nut pocket opening
    upward. Use PLA and no supports.
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '2'
  text: Press the ISO 4032 M3 nut into the chamfered hex pocket by hand until it seats
    against the bottom stop. Check that it is recessed and does not fall out when
    the knob is turned upside down.
  parts:
  - hand_knob
  hardware:
  - m3_nut
  tool: null
- n: '3'
  text: Pass your M3 bolt through the central hole from the flat bolt-exit face and
    thread it into the captive nut. The bolt is not included in this design; choose
    its length for your application.
  parts:
  - hand_knob
  hardware: []
  tool: null
