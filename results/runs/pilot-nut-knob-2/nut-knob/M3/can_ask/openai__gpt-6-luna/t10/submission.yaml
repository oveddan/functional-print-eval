task: nut-knob/M3
note: Single-piece hand knob for an M3 hex nut. Print with the nut-entry face on the
  build plate; the short roof bridge over the nut pocket is only about 5.7 mm across.
  The slotted, narrowed entry is intended to flex locally as the nut is pressed in
  by hand, then retain it behind the internal shoulder. Fit can vary with printer/material
  calibration; test the press fit gently before fully seating the nut.
questions: []
params:
  outer_d:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: Approximate across-grip diameter requested.
  height:
    value: 10.5
