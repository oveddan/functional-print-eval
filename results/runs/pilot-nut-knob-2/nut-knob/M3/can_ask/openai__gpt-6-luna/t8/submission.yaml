  clearance_mm: 0.2
  params:
  - bolt_clearance_d
  check:
    method: measure
    ref: null
    description: Verify the intended M3 bolt passes through the axial opening, threads
      into the seated nut, and projects out through the opposite floor side.
manual:
- n: '1'
  text: Print one knob with its flat circular base on the build plate and the nut
    opening facing up. Use the stated 0.2 mm layer height; do not use supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Press the ISO 4032 M3 nut straight into the top opening until it rests in
    the hexagonal pocket. The six slotted petals flex to admit it and spring back
    to retain it. Check retention by turning the knob upside down.
  parts:
  - knob
  hardware:
  - nut_m3
  tool: null
- n: '3'
  text: Insert the M3 bolt from the nut-opening side, engage its threads with the
    captive nut, and continue until the bolt emerges through the opposite floor-side
    passage.
  parts:
  - knob
  hardware:
  - nut_m3
  tool: null
