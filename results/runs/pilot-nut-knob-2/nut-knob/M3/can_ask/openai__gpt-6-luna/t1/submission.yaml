parts:
- id: hand_knob
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    R = p.knob_d / 2.0\n    body = cq.Workplane('XY').circle(R).extrude(p.knob_h).val()\n\
    \n    def hex_cut(af, z, height):\n        cr = af / math.sqrt(3.0)\n        pts\
    \ = [(cr * math.cos(math.radians(60*i)), cr * math.sin(math.radians(60*i))) for\
    \ i in range(6)]\n        return cq.Workplane('XY').workplane(offset=z).polyline(pts).close().extrude(height).val()\n\
    \n    body = body.cut(hex_cut(p.throat_af, -0.01, p.throat_h + 0.01))\n    body\
    \ = body.cut(hex_cut(p.pocket_af, p.throat_h - 0.10, p.pocket_depth - p.throat_h\
    \ + 0.10))\n    bore = cq.Solid.makeCylinder(p.bore_d / 2.0, p.knob_h + 2.0, cq.Vector(0,\
    \ 0, -1), cq.Vector(0, 0, 1))\n    body = body.cut(bore)\n\n    slit_len = R -\
    \ p.slit_start_r + 1.0\n    for i in range(6):\n        slit = cq.Solid.makeBox(slit_len,\
    \ p.slit_w, p.slit_depth,\n                                cq.Vector(p.slit_start_r,\
    \ -p.slit_w / 2.0, 0))\n        slit = slit.rotate(cq.Vector(0, 0, 0), cq.Vector(0,\
    \ 0, 1), 60.0 * i)\n        body = body.cut(slit)\n    return body"
  print_orientation: Bed-side face with the nut opening on the build plate; z=0 is
    that face.
  use_orientation: Nut opening toward the bolt entry side. The M3 bolt/stud passes
    through the captured nut and axial bore, exiting the opposite face.
