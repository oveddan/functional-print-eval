task: nut-knob/M3
note: One-piece, 20 mm diameter knob with a blind captive M3 hex-nut pocket. The nut
  is pressed in from the bed-side opening through a slightly undersized retaining
  throat; six relief slits let the throat flex. The nut sits below a solid roof, and
  a 3.5 mm axial bore passes through the nut position and out the opposite face. Use
  with an M3 threaded bolt or stud; no bolt length is assumed. Print open-side-down
  without supports; the pocket roof bridge is only about 5.7 mm. Press-fit retention
  depends on printer/material variation, so check the nut is seated and captured before
  use.
