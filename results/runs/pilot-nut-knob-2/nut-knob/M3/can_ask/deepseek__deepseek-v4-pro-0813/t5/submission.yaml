task: nut-knob/M3
note: Single-piece hand knob for an M3 bolt with a captured press-fit ISO 4032 M3
  hex nut. A small coupon is included to verify the nut press fit before committing
  to the full knob.
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height
  bolt_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: M3 major diameter
  bolt_clearance:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: Clearance hole for the M3 bolt
  pocket_af:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: Press-fit hex across flats = nut_af minus 0.1 mm. Verify with coupon; tune
      +/-0.05-0.1 mm.
  pocket_depth:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: Pocket depth so the 2.4 mm nut sits ~0.6 mm below the rim (fully inside)
  lead_in_af:
    value: 5.8
    unit: mm
    kind: design
    source: design
    note: Entrance hex across flats to help start the nut by hand
  lead_in_depth:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Depth of the lead-in funnel at the pocket opening
  knob_dia:
    value: 18.0
    unit: mm
    kind: design
    source: design
    note: Base cylinder diameter; grip ridges bring overall diameter to ~20 mm
  knob_h:
    value: 14.0
    unit: mm
    kind: design
    source: design
    note: Knob height
  ridge_h:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: Radial height of grip ridges
  ridge_w:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Tangential width of grip ridges
  n_ridges:
    value: 16
    unit: count
    kind: design
    source: design
    note: Number of grip ridges
  top_fillet:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: Top outer edge fillet
  coupon_x:
    value: 15.0
    unit: mm
    kind: design
    source: design
    note: Coupon block width
  coupon_y:
    value: 15.0
    unit: mm
    kind: design
    source: design
    note: Coupon block depth
  coupon_h:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: Coupon block height; floor under pocket is 2 mm
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\nr = p.knob_dia / 2.0\n\ndef hex_d(af):\n    return 2.0 * af\
    \ / math.sqrt(3.0)\n\nbody = cq.Workplane(\"XY\").circle(r).extrude(p.knob_h)\n\
    \nbody = body.edges(\">Z\").fillet(p.top_fillet)\n\nbody = body.cut(\n    cq.Workplane(\"\
    XY\").circle(p.bolt_clearance / 2.0).extrude(p.knob_h + 1.0)\n)\n\nfloor_z = p.knob_h\
    \ - p.pocket_depth\nbody = body.cut(\n    cq.Workplane(\"XY\")\n    .workplane(offset=floor_z)\n\
    \    .polygon(6, hex_d(p.pocket_af))\n    .extrude(p.pocket_depth + 0.5)\n)\n\n\
    body = body.cut(\n    cq.Workplane(\"XY\")\n    .workplane(offset=p.knob_h - p.lead_in_depth)\n\
    \    .polygon(6, hex_d(p.lead_in_af))\n    .extrude(p.lead_in_depth + 0.5)\n)\n\
    \nfor i in range(int(p.n_ridges)):\n    ang = 360.0 * i / p.n_ridges\n    ridge\
    \ = (\n        cq.Workplane(\"XY\")\n        .box(p.ridge_h, p.ridge_w, p.knob_h)\n\
    \        .translate((r + p.ridge_h / 2.0, 0, p.knob_h / 2.0))\n        .rotate((0,\
    \ 0, 0), (0, 0, 1), ang)\n    )\n    body = body.union(ridge)\n\nreturn body"
  print_orientation: Flat bottom face (z=0, the bolt-exit face) on the bed; the nut
    pocket opens upward (+Z).
  use_orientation: Grip the knurled rim. The M3 nut is pressed into the top-face hexagonal
    pocket; the M3 bolt threads into the nut from the top face and its tip exits through
    the flat bottom face.
- id: press_fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef hex_d(af):\n    return 2.0 * af / math.sqrt(3.0)\n\nblk\
    \ = cq.Workplane(\"XY\").box(p.coupon_x, p.coupon_y, p.coupon_h)\n\nblk = blk.cut(\n\
    \    cq.Workplane(\"XY\").circle(p.bolt_clearance / 2.0).extrude(p.coupon_h +\
    \ 1.0)\n)\n\nfloor_z = p.coupon_h - p.pocket_depth\nblk = blk.cut(\n    cq.Workplane(\"\
    XY\")\n    .workplane(offset=floor_z)\n    .polygon(6, hex_d(p.pocket_af))\n \
    \   .extrude(p.pocket_depth + 0.5)\n)\n\nblk = blk.cut(\n    cq.Workplane(\"XY\"\
    )\n    .workplane(offset=p.coupon_h - p.lead_in_depth)\n    .polygon(6, hex_d(p.lead_in_af))\n\
    \    .extrude(p.lead_in_depth + 0.5)\n)\n\nreturn blk"
  print_orientation: Flat bottom face (z=0) on the bed; the nut pocket opens upward
    (+Z).
  use_orientation: Laid flat; press the nut into the top pocket to test the fit.
hardware:
- id: nut_m3
  ref: ISO 4032 M3
  qty: 1
- id: bolt_m3
  ref: ISO 4762 M3x20
  qty: 1
joints:
- id: m3_bolt_through_nut
  fastener: bolt_m3
  axis_origin:
  - 0.0
  - 0.0
  - 14.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: nut_pocket
    role: nut_pocket
  - part: knob
    feature: bolt_clearance_hole
    role: clearance
  nut: nut_m3
  external: null
criteria:
- id: nut_press_fit
  part: knob
  feature: nut_pocket
  relation: engages
  hardware: nut_m3
  clearance_mm: null
  params:
  - pocket_af
  - nut_af
  check:
    method: coupon
    ref: press_fit_coupon
    description: Press an ISO 4032 M3 nut into the coupon's hex pocket by hand. It
      must press in firmly and stay in when turned upside down. If it falls out, reduce
      pocket_af ~0.05-0.1 mm; if it cannot be pressed by hand, increase pocket_af
      slightly.
- id: nut_fully_inside
  part: knob
  feature: nut_pocket
  relation: contains
  hardware: nut_m3
  clearance_mm: 0.6
  params:
  - pocket_depth
  - nut_h
  check:
    method: measure
    ref: null
    description: After pressing the nut into the knob, confirm the top face of the
      nut sits below the knob's top rim.
- id: nut_cannot_pass_far_side
  part: knob
  feature: bolt_clearance_hole
  relation: supports
  hardware: nut_m3
  clearance_mm: null
  params:
  - bolt_clearance
  - nut_af
  check:
    method: none
    ref: null
    description: The 3.4 mm bolt hole in the pocket floor is smaller than the nut's
      5.5 mm across-flats, so the nut seats on the floor and cannot be pushed through
      the far side.
- id: bolt_clearance
  part: knob
  feature: bolt_clearance_hole
  relation: clears
  hardware: bolt_m3
  clearance_mm: 0.4
  params:
  - bolt_clearance
  - bolt_d
  check:
    method: measure
    ref: null
    description: Slide an M3 bolt through from the nut side; it should thread into
      the pressed nut and pass freely out the opposite face.
manual:
- n: '1'
  text: Print the knob and the press-fit coupon in PLA at 0.2 mm layer height. Print
    both with the flat bottom face on the bed and the nut pocket opening upward.
  parts:
  - knob
  - press_fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: On the coupon, press an ISO 4032 M3 hex nut into the hexagonal pocket by hand
    until it bottoms out on the pocket floor.
  parts:
  - press_fit_coupon
  hardware:
  - nut_m3
  tool: null
- n: '3'
  text: Turn the coupon upside down and tap it lightly. The nut must stay in, and
    it must not push through the far side. If the fit is wrong, adjust pocket_af slightly
    and reprint the coupon before printing the knob.
  parts:
  - press_fit_coupon
  hardware:
  - nut_m3
  tool: null
- n: '4'
  text: Once the coupon fit is good, press an ISO 4032 M3 hex nut into the knob's
    hexagonal pocket until it bottoms out below the top rim.
  parts:
  - knob
  hardware:
  - nut_m3
  tool: null
- n: '5'
  text: 'Turn the knob upside down: the nut must stay in place, and it must not push
    through the flat bottom face.'
  parts:
  - knob
  hardware:
  - nut_m3
  tool: null
- n: '6'
  text: Thread your M3 bolt into the nut from the open (nut) face. It engages the
    nut, and the tip passes through the clearance hole and out the flat bottom face.
    Turn the knurled rim by hand to tighten it.
  parts:
  - knob
  hardware:
  - nut_m3
  - bolt_m3
  tool: null
