task: nut-knob/M3
note: Single-piece hand knob for an M3 bolt with a captured ISO 4032 M3 hex nut. The
  nut presses in from the top and is stopped by the bottom floor (3.4 mm bolt hole),
  so it cannot pass through the far side. A coupon is included to verify the hand
  press fit before printing the full knob.
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut across flats (user could not measure their actual nut;
      catalog value used)
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut height
  bolt_major:
    value: 3.0
    unit: mm
    kind: hardware
    source: datasheet
    note: M3 thread major diameter (nominal)
  bolt_clear:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: Clearance hole for the M3 bolt through the bottom floor
  press_interference:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: Across-flats interference for the hand press fit; verified by the coupon
  pocket_af:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: Tight hex pocket across flats = nut_af 5.5 - press_interference 0.1
  tunnel_af:
    value: 5.9
    unit: mm
    kind: design
    source: design
    note: Loose insertion tunnel across flats = nut_af 5.5 + 0.4 clearance
  pocket_depth:
    value: 2.7
    unit: mm
    kind: design
    source: design
    note: Depth of tight pocket = nut_h 2.4 + 0.3 so the nut seats fully inside
  floor_t:
    value: 1.6
    unit: mm
    kind: design
    source: design
    note: Bottom floor thickness the nut bears against
  knob_od:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: Overall diameter as requested
  knob_h:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: Overall height
  top_fillet:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Rounded outer rim on the grip side
  n_grip:
    value: 8
    unit: count
    kind: design
    source: design
    note: Number of finger-grip scallops
  grip_r:
    value: 4.0
    unit: mm
    kind: design
    source: design
    note: Radius of the scallop cutting cylinder
  grip_depth:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: Depth of each grip scallop from the outer diameter
  coupon_size:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: Side length of the square coupon
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    r = p.knob_od / 2.0\n    body = cq.Workplane(\"\
    XY\").circle(r).extrude(p.knob_h)\n\n    # comfortable rounded outer rim on the\
    \ grip side\n    body = body.edges(\">Z\").fillet(p.top_fillet)\n\n    # finger-grip\
    \ scallops around the outside\n    tool = p.grip_r\n    center_r = r + tool -\
    \ p.grip_depth\n    n = int(p.n_grip)\n    for i in range(n):\n        ang = 2.0\
    \ * math.pi * i / n\n        cx = center_r * math.cos(ang)\n        cy = center_r\
    \ * math.sin(ang)\n        scallop = (\n            cq.Workplane(\"XY\")\n   \
    \         .moveTo(cx, cy)\n            .circle(tool)\n            .extrude(p.knob_h\
    \ + 4.0)\n        )\n        body = body.cut(scallop)\n\n    # bolt clearance\
    \ through the bottom floor\n    bolt_hole = (\n        cq.Workplane(\"XY\")\n\
    \        .circle(p.bolt_clear / 2.0)\n        .extrude(p.knob_h + 4.0)\n    )\n\
    \    body = body.cut(bolt_hole)\n\n    # loose insertion tunnel, open at the top\
    \ face\n    loose_diam = p.tunnel_af / math.cos(math.pi / 6.0)\n    loose = (\n\
    \        cq.Workplane(\"XY\")\n        .workplane(offset=p.floor_t + p.pocket_depth)\n\
    \        .polygon(6, loose_diam)\n        .extrude(p.knob_h - p.floor_t - p.pocket_depth\
    \ + 2.0)\n    )\n    body = body.cut(loose)\n\n    # tight hex pocket that captures\
    \ the nut\n    tight_diam = p.pocket_af / math.cos(math.pi / 6.0)\n    tight =\
    \ (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.floor_t)\n    \
    \    .polygon(6, tight_diam)\n        .extrude(p.pocket_depth)\n    )\n    body\
    \ = body.cut(tight)\n\n    return body"
  print_orientation: Bottom face (the face with the 3.4 mm bolt hole) on the bed,
    z = 0; the hex nut mouth opens upward on the top face
  use_orientation: Nut is pressed into the hex mouth on the top (grip) face until
    it rests on the bottom floor. In use, the M3 bolt enters the 3.4 mm hole in the
    bottom face, threads through the captured nut, and its tip exits out the top mouth.
    The bottom face sits against the workpiece.
- id: coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    body = (\n        cq.Workplane(\"XY\")\n\
    \        .rect(p.coupon_size, p.coupon_size)\n        .extrude(p.floor_t + p.pocket_depth)\n\
    \    )\n\n    hole = (\n        cq.Workplane(\"XY\")\n        .circle(p.bolt_clear\
    \ / 2.0)\n        .extrude(p.floor_t + p.pocket_depth + 2.0)\n    )\n    body\
    \ = body.cut(hole)\n\n    tight_diam = p.pocket_af / math.cos(math.pi / 6.0)\n\
    \    pocket = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.floor_t)\n\
    \        .polygon(6, tight_diam)\n        .extrude(p.pocket_depth + 2.0)\n   \
    \ )\n    body = body.cut(pocket)\n\n    return body"
  print_orientation: Flat bottom (the side with the 3.4 mm hole) on the bed, z = 0;
    the hex pocket opens upward
  use_orientation: Nut is pressed into the hex pocket from the open top to test the
    press fit before printing the full knob
hardware:
- id: m3_nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: nut_press_fit
  part: knob
  feature: tight_pocket
  relation: engages
  hardware: m3_nut
  clearance_mm: null
  params: []
  check:
    method: coupon
    ref: coupon
    description: Press the ISO 4032 M3 nut into the coupon's hex pocket by hand; it
      should seat fully and grip the walls.
- id: nut_retained_inverted
  part: knob
  feature: tight_pocket
  relation: contains
  hardware: m3_nut
  clearance_mm: null
  params: []
  check:
    method: coupon
    ref: coupon
    description: Turn the coupon upside down after pressing the nut in; the nut must
      stay in place.
- id: nut_cannot_pass_far_side
  part: knob
  feature: bolt_hole
  relation: clears
  hardware: null
  clearance_mm: null
  params: []
  check:
    method: none
    ref: null
    description: The 3.4 mm bolt hole is smaller than the M3 nut's 5.5 mm across flats,
      so the nut cannot be pushed out through the bottom face.
- id: bolt_passes_through
  part: knob
  feature: bolt_hole
  relation: clears
  hardware: null
  clearance_mm: null
  params: []
  check:
    method: none
    ref: null
    description: An M3 bolt (3.0 mm major diameter) passes freely through the 3.4
      mm hole and threads into the captured nut.
manual:
- n: '1'
  text: Print the coupon (coupon) flat, with the 3.4 mm hole side down on the bed.
  parts:
  - coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Fit test: press an ISO 4032 M3 hex nut into the coupon''s hex pocket from
    the open top, by hand (thumb pressure). It should seat down to the floor. Turn
    the coupon upside down and confirm the nut stays in. If it is a little stubborn,
    press it in and out once or twice to bed the printed walls.'
  parts:
  - coupon
  hardware:
  - m3_nut
  tool: null
- n: '3'
  text: Print the knob (knob) with its bottom face (the 3.4 mm hole side) down on
    the bed.
  parts:
  - knob
  hardware: []
  tool: null
- n: '4'
  text: Press an ISO 4032 M3 hex nut into the knob's top hex mouth, by hand, until
    its bottom rests against the internal floor. Check it cannot be pushed out through
    the bottom face.
  parts:
  - knob
  hardware:
  - m3_nut
  tool: null
- n: '5'
  text: Turn the knob upside down and confirm the nut stays in place.
  parts:
  - knob
  hardware:
  - m3_nut
  tool: null
- n: '6'
  text: 'Thread the knob onto your M3 bolt: start the bolt into the bottom face''s
    3.4 mm hole, turn the knob clockwise by hand until tight. The bolt threads through
    the captured nut and its tip may come out of the top hex mouth.'
  parts:
  - knob
  hardware: []
  tool: null
