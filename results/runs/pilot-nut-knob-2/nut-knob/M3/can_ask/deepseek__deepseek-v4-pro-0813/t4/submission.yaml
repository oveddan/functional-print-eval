task: nut-knob/M3
note: Captured-nut thumb knob for an M3 bolt. The ISO 4032 M3 nut presses by hand
  into a hex pocket on the top face; a shallow lead-in eases insertion, and the pocket
  floor stops the nut so it cannot be pushed out the far side. The bolt enters from
  the top through the nut and exits the flat bottom clamp face. A coupon tests four
  pocket sizes before printing the knob.
questions:
- text: Which coupon socket size (5.30 / 5.40 / 5.50 / 5.60 mm) gives a firm hand
    press that still holds the nut inverted?
  answer: null
