  coupon_l:
    value: 42.0
    unit: mm
    kind: design
    source: design
    note: Fit-test coupon length
  coupon_w:
    value: 24.0
    unit: mm
    kind: design
    source: design
    note: Fit-test coupon width
  coupon_t:
    value: 4.0
    unit: mm
    kind: design
    source: design
    note: Fit-test coupon thickness
  coupon_sp:
    value: 14.0
    unit: mm
    kind: design
    source: design
    note: Spacing between fit-test holes
parts:
- id: knob
  role: final
  material: PLA
  code: "import cadquery as cq\nimport math\n\ndef build(p):\n    def hex_d(af):\n\
    \        return af / math.cos(math.pi / 6.0)\n\n    def hex_cutter(af, depth,\
    \ corner_r):\n        d = hex_d(af)\n        cutter = cq.Workplane(\"XY\").polygon(6,\
    \ d).extrude(depth)\n        if corner_r > 0:\n            R = d / 2.0\n     \
    \       for k in range(6):\n                a = math.radians(k * 60.0)\n     \
    \           cyl = (cq.Workplane(\"XY\")\n                       .center(R * math.cos(a),\
    \ R * math.sin(a))\n                       .circle(corner_r)\n               \
    \        .extrude(depth))\n                cutter = cutter.union(cyl)\n      \
    \  return cutter\n\n    seat_af = p.nut_af - p.press_fit\n    lead_af = p.nut_af\
    \ + p.lead_margin\n    pocket_depth = p.nut_h + p.pocket_extra\n    bolt_clear\
    \ = p.bolt_d + p.bolt_clearance\n    r = p.knob_od / 2.0\n\n    body = cq.Workplane(\"\
    XY\").circle(r).extrude(p.knob_h)\n\n    for i in range(p.spline_count):\n   \
    \     ang = 360.0 * i / p.spline_count\n        groove = (cq.Workplane(\"XY\"\
    )\n                  .transformed(rotate=(0, 0, ang))\n                  .center(r\
    \ - p.spline_depth / 2.0, 0)\n                  .rect(p.spline_depth, p.spline_width)\n\
    \                  .extrude(p.knob_h + 1.0))\n        body = body.cut(groove)\n\
    \n    body = body.cut(hex_cutter(lead_af, p.lead_len, 0.0))\n    body = body.cut(hex_cutter(seat_af,\
    \ pocket_depth, p.corner_relief_r))\n\n    body = body.faces(\">Z\").workplane().hole(bolt_clear)\n\
    \n    try:\n        body = body.faces(\">Z\").edges().fillet(p.rim_fillet)\n \
    \   except Exception:\n        pass\n\n    return body\n"
  print_orientation: Flat bottom face (the face with the hex nut pocket) down on the
    bed; the through-hole axis is vertical
  use_orientation: Bottom (pocket) face toward the work and the bolt; the bolt threads
    in from the bottom, through the nut, and its tip emerges from the top face
- id: nut_fit_coupon
  role: coupon
  material: PLA
  code: "import cadquery as cq\nimport math\n\ndef build(p):\n    def hex_d(af):\n\
    \        return af / math.cos(math.pi / 6.0)\n\n    plate = cq.Workplane(\"XY\"\
    ).box(p.coupon_l, p.coupon_w, p.coupon_t)\n    afs = [p.nut_af - 0.05, p.nut_af\
    \ - 0.15, p.nut_af - 0.25]\n    for i, af in enumerate(afs):\n        d = hex_d(af)\n\
    \        x = (i - 1) * p.coupon_sp\n        plate = plate.faces(\">Z\").workplane().center(x,\
    \ 0).polygon(6, d).cutThruAll()\n        R = d / 2.0\n        for k in range(6):\n\
    \            a = math.radians(k * 60.0)\n            plate = (plate.faces(\">Z\"\
    ).workplane()\n                     .center(x + R * math.cos(a), R * math.sin(a))\n\
    \                     .circle(p.corner_relief_r)\n                     .cutThruAll())\n\
    \    return plate\n"
  print_orientation: Flat plate, largest face down on the bed; hex holes are vertical
    through the plate
  use_orientation: Test the nut in each of the three hex holes (loose, target, firm)
    to pick the press-fit behaviour before printing the knob
hardware:
- id: m3_nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: nut_press_fit
  part: knob
  feature: nut_pocket
  relation: contains
  hardware: m3_nut
  clearance_mm: null
  params:
  - nut_af
  - press_fit
  - lead_margin
  - corner_relief_r
  check:
    method: coupon
    ref: nut_fit_coupon
    description: Press the M3 nut into each of the three coupon holes; the tightest
      one that still goes in by hand and stays put when turned upside down is the
      workable press fit. The knob pocket uses the middle value (nut across-flats
      - 0.15 mm).
- id: nut_retained_when_inverted
  part: knob
  feature: nut_pocket
  relation: engages
  hardware: m3_nut
  clearance_mm: null
  params:
  - press_fit
  - corner_relief_r
  check:
    method: none
    ref: null
    description: After seating, turn the knob upside down; the press fit on the nut
      flats must hold the nut in the pocket with no glue.
- id: bolt_clears
  part: knob
  feature: bolt_hole
  relation: clears
  hardware: null
  clearance_mm: 0.3
  params:
  - bolt_d
  - bolt_clearance
  check:
    method: measure
    ref: null
    description: Pass an M3 bolt through the through hole; it should slide freely
      and thread into the captured nut, with the tip emerging from the opposite face.
manual:
- n: '1'
  text: Print the fit-test coupon (nut_fit_coupon) first.
  parts:
  - nut_fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Press the ISO 4032 M3 nut into each of the three hex holes (left to right:
    loose, target, firm). Pick the tightest one that still goes in by hand and does
    not fall out when the coupon is turned upside down. The knob itself uses the middle
    (target) size.'
  parts:
  - nut_fit_coupon
  hardware:
  - m3_nut
  tool: null
- n: '3'
  text: Print the knob (knob) with its flat bottom face on the bed, no supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '4'
  text: Press the M3 nut into the hex pocket on the knob's bottom face, chamfered
    side of the nut first, and seat it fully against the floor of the pocket. If it
    is very tight, thread your M3 bolt in through the top 3.3 mm hole a couple of
    turns into the nut and tighten to draw the nut home, then remove the bolt.
  parts:
  - knob
  hardware:
  - m3_nut
  tool: null
- n: '5'
  text: Turn the knob upside down and check the nut stays in the pocket.
  parts:
  - knob
  hardware:
  - m3_nut
  tool: null
- n: '6'
  text: Thread the knob onto the M3 bolt from the bottom face and turn to tighten;
    the bolt passes through the nut and its tip emerges from the top face. If the
    fit ended up too tight or loose, reprint with X/Y scaled by about 1% in the slicer.
  parts:
  - knob
  hardware: []
  tool: null
