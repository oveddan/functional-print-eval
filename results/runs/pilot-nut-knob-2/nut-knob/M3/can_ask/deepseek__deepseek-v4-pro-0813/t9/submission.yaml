  knob_h:
    value: 13.0
    unit: mm
    kind: design
    source: design
    note: Knob height for grip
  spline_count:
    value: 14
    unit: count
    kind: design
    source: design
    note: Number of grip grooves around the rim
  spline_depth:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Radial depth of each grip groove
  spline_width:
    value: 1.4
    unit: mm
    kind: design
    source: design
    note: Tangential width of each grip groove
  rim_fillet:
    value: 0.5
    unit: mm
    kind: design
    source: design
