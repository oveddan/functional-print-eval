task: nut-knob/M3
note: Hand knob (~20 mm) that captures an ISO 4032 M3 hex nut as a press-fit so the
  knob acts as a tool-free thumb nut. The nut is pressed into a blind hex pocket from
  the bottom face; a small through hole (3.3 mm) continues to the top so the M3 bolt
  passes through the nut and out the other side. Corner-relief holes in the pocket
  keep the nut's sharp hex vertices from binding on FDM corner rounding. A fit-test
  coupon checks the press-fit before printing the full knob.
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across-flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 nut thickness
  bolt_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: M3 nominal major diameter
  press_fit:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: Total interference across flats of the seat pocket (0.075 mm per side) for
      a firm hand press that holds the 1 g nut upside down
  lead_margin:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: Lead-in pocket is this much larger across flats than the nut to start the
      press by hand
  lead_len:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Depth of the larger lead-in section at the pocket mouth
  pocket_extra:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Extra pocket depth so the nut sits fully inside, recessed below the bottom
      face
  corner_relief_r:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Cylindrical relief at each pocket vertex to clear the nut's sharp corners
      vs FDM corner rounding
  bolt_clearance:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: Added to bolt_d for the through hole so the threaded shank passes freely
  knob_od:
    value: 20.0
