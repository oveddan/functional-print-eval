task: nut-knob/M3
note: The knob is 20 mm across and 8 mm tall, with 8 finger scallops around the edge.
  The nut sits in a hex pocket 2.8 mm deep with three small crush ribs. The ribs hold
  the nut without glue and are more forgiving of printer variation than a tight plain
  hex. The 5.2 mm floor has only a 3.4 mm bolt hole, so the nut can't be pushed out
  the far side. The bolt needs to be at least about 8 mm longer than whatever it clamps
  so it passes all the way through the knob.
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: M3 nominal diameter
  bolt_clear_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: through hole for the M3 bolt. Much smaller than the nut, so the floor stops
      the nut from being pushed out the far side
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: about 20 mm across, as asked
  knob_h:
    value: 8
    unit: mm
    kind: design
    source: design
    note: ''
  pocket_af:
    value: 5.7
    unit: mm
    kind: design
    source: design
    note: hex pocket across flats, a little bigger than the nut. The ribs give the
      grip
  pocket_depth:
    value: 2.8
    unit: mm
    kind: design
    source: design
    note: nut_h + 0.4, so the nut sits fully below the top face
  rib_r:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: ''
  rib_proud:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: how far each crush rib stands out from its flat. Width from a rib to the
      opposite flat = 5.4, so 0.1 interference on the 5.5 nut. Change this to the
      best coupon cell
  lead_in:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: ribs stop this far below the top so the nut can start in square
  scallop_n:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
  scallop_r:
    value: 2
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_cell:
    value: 11
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    r = p.knob_d/2\n    body = cq.Workplane('XY').circle(r).extrude(p.knob_h)\n\
    \    n = int(p.scallop_n)\n    for i in range(n):\n        a = 2*math.pi*i/n\n\
    \        c = r + p.scallop_r*0.5\n        cut = cq.Workplane('XY').center(c*math.cos(a),\
    \ c*math.sin(a)).circle(p.scallop_r).extrude(p.knob_h)\n        body = body.cut(cut)\n\
    \    body = body.cut(cq.Workplane('XY').circle(p.bolt_clear_d/2).extrude(p.knob_h))\n\
    \    z0 = p.knob_h - p.pocket_depth\n    af = p.pocket_af\n    pocket = cq.Workplane('XY').workplane(offset=z0).polygon(6,\
    \ af/math.cos(math.pi/6)).extrude(p.pocket_depth)\n    body = body.cut(pocket)\n\
    \    for k in range(3):\n        a = math.radians(30 + 120*k)\n        d = af/2\
    \ + p.rib_r - p.rib_proud\n        rib = cq.Workplane('XY').workplane(offset=z0).center(d*math.cos(a),\
    \ d*math.sin(a)).circle(p.rib_r).extrude(p.pocket_depth - p.lead_in)\n       \
    \ body = body.union(rib)\n    return body\n"
  print_orientation: Flat bottom face (the far side with only the bolt hole) on the
    bed, nut pocket opening facing up. No supports or bridges needed.
  use_orientation: Pocket side faces the bolt head side or the work, whichever you
    like. The bolt passes through the nut and out through the bottom face.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\ndef build(p):\n    cell = p.coupon_cell\n    h = p.pocket_depth\
    \ + 1.2\n    prouds = [0.15, 0.25, 0.35, 0.45]\n    plate = cq.Workplane('XY').rect(cell*4,\
    \ cell, centered=False).extrude(h)\n    clip = cq.Workplane('XY').polyline([(0,0),(3,0),(0,3)]).close().extrude(h)\n\
    \    plate = plate.cut(clip)\n    af = p.pocket_af\n    z0 = h - p.pocket_depth\n\
    \    for i, pr in enumerate(prouds):\n        cx = cell*i + cell/2\n        cy\
    \ = cell/2\n        plate = plate.cut(cq.Workplane('XY').center(cx, cy).circle(p.bolt_clear_d/2).extrude(h))\n\
    \        plate = plate.cut(cq.Workplane('XY').workplane(offset=z0).center(cx,\
    \ cy).polygon(6, af/math.cos(math.pi/6)).extrude(p.pocket_depth))\n        for\
    \ k in range(3):\n            a = math.radians(30 + 120*k)\n            d = af/2\
    \ + p.rib_r - pr\n            plate = plate.union(cq.Workplane('XY').workplane(offset=z0).center(cx\
    \ + d*math.cos(a), cy + d*math.sin(a)).circle(p.rib_r).extrude(p.pocket_depth\
    \ - p.lead_in))\n    return plate\n"
  print_orientation: Flat bottom on the bed, pockets facing up
  use_orientation: Hand-held test piece. Cell 1 is at the clipped corner.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 5
joints: []
criteria:
- id: nut_retained
  part: knob
  feature: hex pocket with crush ribs
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - pocket_af
  - rib_proud
  - rib_r
  - nut_af
  check:
    method: coupon
    ref: fit_coupon
    description: The nut presses in by thumb or with a gentle squeeze, stays in when
      you hold the piece upside down and shake it, and doesn't split the wall
- id: nut_recessed
  part: knob
  feature: pocket depth
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - pocket_depth
  - nut_h
  check:
    method: measure
    ref: null
    description: Once the nut is seated, its top is at or below the knob's top face
- id: floor_stops_nut
  part: knob
  feature: pocket floor
  relation: seats
  hardware: nut
  clearance_mm: null
  params:
  - bolt_clear_d
  - nut_af
  check:
    method: none
    ref: null
    description: The 3.4 hole is far smaller than the 5.5 AF nut, so the nut can't
      pass through
- id: bolt_passes
  part: knob
  feature: through hole
  relation: clears
  hardware: null
  clearance_mm: 0.4
  params:
  - bolt_clear_d
  - bolt_d
  check:
    method: none
    ref: null
    description: An M3 bolt slides through the floor hole freely
manual:
- n: '1'
  text: Print fit_coupon. Cell 1 is at the clipped corner and the ribs get bigger
    toward cell 4. Their effective widths are 5.55, 5.45, 5.35 and 5.25 mm, which
    match rib_proud 0.15, 0.25, 0.35 and 0.45.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Press an M3 nut into each cell by hand. Pick the loosest cell where the nut
    still stays in when you turn the coupon upside down and shake it, and where the
    nut can still be pressed all the way to the floor. Set rib_proud to that cell's
    value. The default of 0.3 is between cells 2 and 3.
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: Print the knob with the pocket facing up and no supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '4'
  text: Line the nut's flats up with the pocket and push it straight down until it
    bottoms out on the floor. If it's stiff, press it against a table. Its top should
    sit just below the knob face.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Thread the M3 bolt into the nut. Turn the knob to drive the bolt through the
    nut and out the bottom hole. Then tighten by hand.
  parts:
  - knob
  hardware:
  - nut
  tool: null
