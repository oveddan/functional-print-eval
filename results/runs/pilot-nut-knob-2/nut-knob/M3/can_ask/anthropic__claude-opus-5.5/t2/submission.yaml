task: nut-knob/M3
note: Knob is 20 mm across and 7 mm tall, with 8 finger scallops. There's a 4 mm solid
  floor with a 3.4 mm hole, so the nut can't be pushed out through the far side. The
  nut is held by three crush ribs on alternate flats, so no glue is needed. Ribs stop
  0.6 mm below the pocket mouth so the nut lines up before it presses in.
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height
  bolt_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: M3 nominal diameter
  bolt_clear:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: bolt hole = 3.4 mm, well under the 5.5 mm nut so the nut can't pass through
  pocket_clear:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: per-side clearance on the hex flats; the crush ribs provide the grip
  rib_h:
    value: 0.25
    unit: mm
    kind: design
    source: design
    note: how far each crush rib sticks into the pocket. Set this from the coupon
      result
  rib_w:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: ''
  rib_lead:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: ribs stop this far below the pocket mouth so the nut lines up before it
      presses in
  recess:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: top of nut sits this far below the knob face (fully inside)
  floor_t:
    value: 4.0
    unit: mm
    kind: design
    source: design
    note: solid floor under the nut, stops push-through
  knob_d:
    value: 20.0
    unit: mm
    kind: design
    source: asked
    note: ''
  grip_count:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
  grip_r:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_rib_a:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_rib_b:
    value: 0.25
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_rib_c:
    value: 0.35
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    r = p.knob_d/2\n    h = p.floor_t + p.nut_h\
    \ + p.recess\n    body = cq.Workplane('XY').circle(r).extrude(h)\n    n = int(p.grip_count)\n\
    \    for i in range(n):\n        a = 2*math.pi*i/n\n        body = body.cut(cq.Workplane('XY').center((r+0.6)*math.cos(a),(r+0.6)*math.sin(a)).circle(p.grip_r).extrude(h))\n\
    \    body = body.edges('>Z').chamfer(0.6)\n    af = p.nut_af + 2*p.pocket_clear\n\
    \    depth = p.nut_h + p.recess\n    pocket = cq.Workplane('XY').workplane(offset=p.floor_t).polygon(6,\
    \ af/math.cos(math.radians(30))).extrude(depth)\n    rr = p.rib_w/2\n    rib_len\
    \ = depth - p.rib_lead\n    for ang in (90, 210, 330):\n        d = af/2 + rr\
    \ - p.rib_h\n        a = math.radians(ang)\n        rib = cq.Workplane('XY').workplane(offset=p.floor_t).center(d*math.cos(a),\
    \ d*math.sin(a)).circle(rr).extrude(rib_len)\n        pocket = pocket.cut(rib)\n\
    \    body = body.cut(pocket)\n    hole = cq.Workplane('XY').circle((p.bolt_d+p.bolt_clear)/2).extrude(h)\n\
    \    return body.cut(hole)\n"
  print_orientation: Knob's flat underside (bolt-entry face) on the bed; hex pocket
    opening faces up, so no bridges or supports
  use_orientation: Bolt comes in through the underside, goes through the nut and out
    of the pocket face
- id: rib_coupon
  role: coupon
  material: PLA
  code: "import math\ndef build(p):\n    af = p.nut_af + 2*p.pocket_clear\n    depth\
    \ = p.nut_h + p.recess\n    fl = 1.5\n    out = None\n    for k, rh in enumerate((p.coupon_rib_a,\
    \ p.coupon_rib_b, p.coupon_rib_c)):\n        x = k*13.0\n        c = cq.Workplane('XY').center(x,0).circle(6).extrude(fl+depth)\n\
    \        pocket = cq.Workplane('XY').workplane(offset=fl).center(x,0).polygon(6,\
    \ af/math.cos(math.radians(30))).extrude(depth)\n        rr = p.rib_w/2\n    \
    \    for ang in (90,210,330):\n            d = af/2 + rr - rh\n            a =\
    \ math.radians(ang)\n            pocket = pocket.cut(cq.Workplane('XY').workplane(offset=fl).center(x+d*math.cos(a),\
    \ d*math.sin(a)).circle(rr).extrude(depth-p.rib_lead))\n        c = c.cut(pocket).cut(cq.Workplane('XY').center(x,0).circle((p.bolt_d+p.bolt_clear)/2).extrude(fl+depth))\n\
    \        for j in range(k+1):\n            c = c.cut(cq.Workplane('XY').center(x-1.5+1.5*j,\
    \ -6).rect(0.8,1.6).extrude(fl+depth))\n        out = c if out is None else out.union(c)\n\
    \    return out\n"
  print_orientation: Flat side on the bed, pockets open upward, same as the knob
  use_orientation: 'Test piece: press a nut into each pocket and check which one grips'
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: c1
  part: knob
  feature: hex pocket with crush ribs
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - pocket_clear
  - rib_h
  - rib_w
  check:
    method: coupon
    ref: rib_coupon
