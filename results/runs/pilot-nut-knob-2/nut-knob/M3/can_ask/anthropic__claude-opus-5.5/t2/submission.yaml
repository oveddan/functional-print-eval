- id: c2
  part: knob
  feature: pocket depth
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_h
  - recess
  check:
    method: measure
    ref: null
    description: Once seated, the nut's top is below the knob face (about 0.6 mm)
- id: c3
  part: knob
  feature: floor and bolt hole
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - floor_t
  - bolt_d
  - bolt_clear
  check:
    method: measure
    ref: null
    description: An M3 bolt slides freely through the 3.4 mm hole. The nut can't go
      through it.
manual:
- n: '1'
  text: Print rib_coupon first (PLA, 0.2 mm layers, no supports). The notches next
    to each pocket mark it 1, 2 or 3, and the ribs get tighter from 1 to 3. Press
    an M3 nut into each pocket. Pick the loosest pocket where the nut still stays
    in when you hold it upside down and shake. If that's pocket 1, set rib_h to 0.15.
    Pocket 2 is 0.25 (the default) and pocket 3 is 0.35.
  parts:
  - rib_coupon
  hardware:
  - nut
  tool: null
- n: '2'
  text: Print the knob with the flat underside on the bed and the hex pocket facing
    up. No supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Line the nut's flats up with the pocket and push it straight down until it
    bottoms on the floor. Use your thumb or press with a flat bolt head. The nut ends
    up just below the knob face.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Put your M3 bolt in from the underside of the knob, through the floor hole,
    and thread it through the nut so it comes out the pocket side. The bolt must be
    longer than about 7 mm plus whatever it's clamping.
  parts:
  - knob
  hardware:
  - nut
  tool: null
