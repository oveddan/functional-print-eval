task: nut-knob/M3
note: Knob 20 mm across and 10 mm tall, with 10 scallops for grip. The hex pocket
  is press-fit, and its size gets tuned with a small test coupon first.
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: M3 nominal
  bolt_clear_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: Clearance hole through the floor for the M3 bolt. It is much smaller than
      the nut's 6.35 mm across-corners size, so the nut can't pass through.
  pocket_af:
    value: 5.55
    unit: mm
    kind: design
    source: design
    note: 'Across-flats size of the hex pocket. Printed holes on FDM come out about
      0.1 mm small, so 5.55 should give a light press fit on the 5.5 nut. Tune it
      with the coupon: 5.45, 5.55 or 5.65.'
  pocket_extra_depth:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: Pocket depth = nut_h + this, so the nut sits 0.4 mm below the top face
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: ''
  knob_h:
    value: 10
    unit: mm
    kind: design
    source: design
    note: ''
  lobes:
    value: 10
    unit: count
    kind: design
    source: design
    note: ''
  scallop_r:
    value: 2
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_offset:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Scallop centres sit at knob radius + this; each scallop cuts about 1.4 mm
      deep
  coupon_step:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: Size step between the coupon's pockets
parts:
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    depth = p.nut_h + p.pocket_extra_depth\n    floor = 10\
    \ - (p.knob_h - depth) if False else (p.knob_h - depth)\n    floor = min(floor,\
    \ 1.6)\n    h = floor + depth\n    blk = cq.Workplane('XY').box(30, 14, h, centered=(True,\
    \ True, False))\n    for i, x in enumerate([-9, 0, 9]):\n        af = p.pocket_af\
    \ + (i - 1) * p.coupon_step\n        ac = af / 0.8660254\n        pk = cq.Workplane('XY').workplane(offset=floor).center(x,\
    \ -1).polygon(6, ac).extrude(depth + 1)\n        hl = cq.Workplane('XY').center(x,\
    \ -1).circle(p.bolt_clear_d / 2).extrude(h + 1)\n        blk = blk.cut(pk).cut(hl)\n\
    \        for d in range(i + 1):\n            dot = cq.Workplane('XY').workplane(offset=h\
    \ - 0.4).center(x - 1.5 * i / 2 + 1.5 * d, 4.8).circle(0.5).extrude(1)\n     \
    \       blk = blk.cut(dot)\n    return blk\n"
  print_orientation: Flat face on the bed, pocket openings facing up (same as the
    knob)
  use_orientation: Hand test only
- id: knob
  role: final
  material: PLA
  code: "def build(p):\n    depth = p.nut_h + p.pocket_extra_depth\n    k = cq.Workplane('XY').circle(p.knob_d\
    \ / 2).extrude(p.knob_h)\n    sc = (cq.Workplane('XY')\n          .polarArray(p.knob_d\
    \ / 2 + p.scallop_offset, 0, 360, int(p.lobes))\n          .circle(p.scallop_r).extrude(p.knob_h))\n\
    \    k = k.cut(sc)\n    ac = p.pocket_af / 0.8660254\n    pocket = (cq.Workplane('XY').workplane(offset=p.knob_h\
    \ - depth)\n              .polygon(6, ac).extrude(depth + 1))\n    hole = cq.Workplane('XY').circle(p.bolt_clear_d\
    \ / 2).extrude(p.knob_h + 1)\n    return k.cut(pocket).cut(hole)\n"
  print_orientation: Flat bearing face (bolt-hole side) on the bed, hex pocket opening
    facing up. The pocket needs no bridge and no supports.
  use_orientation: The flat face with only the bolt hole bears on the work. The bolt
    comes in through that face and threads into the nut. Tightening pulls the nut
    against the pocket floor.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: c1
  part: knob
  feature: hex pocket
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - pocket_af
  - nut_af
  check:
    method: coupon
    ref: fit_coupon
    description: The nut presses in by thumb and does not fall out when the part is
      turned upside down and shaken lightly
- id: c2
  part: knob
  feature: hex pocket depth
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_h
  - pocket_extra_depth
  check:
    method: measure
    ref: null
    description: Once pressed in, the nut sits at or below the top face
- id: c3
  part: knob
  feature: pocket floor / bolt hole
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - bolt_clear_d
  - nut_af
  check:
    method: none
    ref: null
    description: The 3.4 mm hole is smaller than the nut's 6.35 mm across-corners
      size, so the nut cannot be pushed through
- id: c4
  part: knob
  feature: bolt hole
  relation: clears
  hardware: null
  clearance_mm: 0.4
  params:
  - bolt_clear_d
  - bolt_d
  check:
    method: none
    ref: null
    description: ''
manual:
- n: '1'
  text: Print fit_coupon in PLA, flat side down, at 0.2 mm layers. It has three hex
    pockets marked with 1, 2 and 3 dots (5.45, 5.55 and 5.65 mm across flats).
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Press the M3 nut into each pocket with your thumb. Pick the tightest pocket
    that still takes the nut fully by hand and holds it when you turn the coupon upside
    down. 1 dot: set pocket_af to 5.45. 2 dots: keep 5.55. 3 dots: set 5.65. If even
    the 3-dot pocket is too tight, use 5.75.'
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: Print the knob with its flat face (bolt hole only) on the bed and the hex
    pocket facing up. No supports are needed.
  parts:
  - knob
  hardware: []
  tool: null
- n: '4'
  text: Line the nut up with the hex pocket and press it in by thumb until it sits
    just below the top face. If it's stiff, press it against a table.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Thread your M3 bolt in from the flat face, through the nut and out the top.
    Turn the knob by hand to tighten. The flat face bears on your work and the nut
    is pulled against the pocket floor.
  parts:
  - knob
  hardware:
  - nut
  tool: null
