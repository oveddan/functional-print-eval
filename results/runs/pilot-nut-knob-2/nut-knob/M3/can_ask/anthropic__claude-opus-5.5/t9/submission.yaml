manual:
- n: '1'
  text: 'Print fit_coupon (PLA, 0.2 mm layers, no supports). It has three nut pockets.
    The number of dots beside each one gives the rib size: 1 dot = 0.30 mm, 2 dots
    = 0.45 mm, 3 dots = 0.60 mm.'
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Press an M3 nut into each pocket by hand, flat side down. Pick the pocket
    where the nut goes in with firm thumb pressure, sits below the surface, and doesn't
    fall out when you turn the coupon over and tap it. To get the nut out again, push
    it back with a screwdriver through the hole underneath. If 2 dots is the best,
    print the knob as it is. If not, change rib_h to the value of the pocket you picked.
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: Print the knob with the flat bottom on the bed and the hex pocket facing up.
    No supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '4'
  text: Line up the nut's flats with the pocket and press it in until it bottoms out.
    You can press it against a tabletop to seat it fully. The nut should sit just
    below the top surface.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Put your M3 bolt in from the flat bottom of the knob, through the floor hole,
    and screw it into the nut until it comes out the top. Turn the knob by hand to
    tighten.
  parts:
  - knob
  hardware:
  - nut
  tool: null
