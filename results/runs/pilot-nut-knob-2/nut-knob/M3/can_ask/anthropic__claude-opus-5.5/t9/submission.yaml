task: nut-knob/M3
note: The nut is held by three small crush ribs on alternate flats of the hex pocket,
  so no glue is needed. The 3.4 mm floor stops the nut from being pushed out the bottom.
  The pocket opens upward on the print, so there are no bridges or supports. The knob
  is 20 mm across with 6 finger scallops and is 10 mm tall.
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: M3 nominal diameter
  bolt_clear:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: diametral clearance on bolt hole
  pocket_clear:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: across-flats clearance of the hex pocket before ribs
  rib_h:
    value: 0.45
    unit: mm
    kind: design
    source: design
    note: crush-rib protrusion into the pocket; tuned with coupon (middle pocket =
      this value)
  rib_r:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: crush-rib radius
  coupon_step:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: rib_h step between coupon pockets
  recess:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: nut top sits this far below the knob top, so it is fully inside
  leadin:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: rib-free lead-in at pocket mouth
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: about 20 mm across
  knob_h:
    value: 10
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_n:
    value: 6
    unit: count
    kind: design
    source: design
    note: ''
  scallop_r:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef pocket_tool(p, rib_h, depth):\n    af = p.nut_af + p.pocket_clear\n\
    \    d = af / math.cos(math.radians(30))\n    tool = cq.Workplane('XY').polygon(6,\
    \ d).extrude(depth)\n    for a in (30, 150, 270):\n        r = af / 2 + p.rib_r\
    \ - rib_h\n        c = cq.Workplane('XY').center(r * math.cos(math.radians(a)),\
    \ r * math.sin(math.radians(a))).circle(p.rib_r).extrude(depth)\n        tool\
    \ = tool.cut(c)\n    af2 = af + 0.4\n    lead = cq.Workplane('XY').workplane(offset=depth\
    \ - p.leadin).polygon(6, af2 / math.cos(math.radians(30))).extrude(p.leadin)\n\
    \    return tool.union(lead)\n\ndef build(p):\n    h = p.knob_h\n    body = cq.Workplane('XY').circle(p.knob_d\
    \ / 2).extrude(h)\n    n = int(p.scallop_n)\n    rr = p.knob_d / 2 + p.scallop_r\
    \ * 0.4\n    for i in range(n):\n        a = 2 * math.pi * i / n\n        s =\
    \ cq.Workplane('XY').center(rr * math.cos(a), rr * math.sin(a)).circle(p.scallop_r).extrude(h)\n\
    \        body = body.cut(s)\n    depth = p.nut_h + p.recess\n    body = body.cut(pocket_tool(p,\
    \ p.rib_h, depth).translate((0, 0, h - depth)))\n    hole = cq.Workplane('XY').circle((p.bolt_d\
    \ + p.bolt_clear) / 2).extrude(h)\n    return body.cut(hole)\n"
  print_orientation: Flat bottom (bolt side) on the bed, nut pocket opening facing
    up; no supports
  use_orientation: Pocket side faces away from the work; bolt enters from the flat
    bottom, through the floor and the nut, and comes out the top
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\ndef pocket_tool(p, rib_h, depth):\n    af = p.nut_af + p.pocket_clear\n\
    \    d = af / math.cos(math.radians(30))\n    tool = cq.Workplane('XY').polygon(6,\
    \ d).extrude(depth)\n    for a in (30, 150, 270):\n        r = af / 2 + p.rib_r\
    \ - rib_h\n        c = cq.Workplane('XY').center(r * math.cos(math.radians(a)),\
    \ r * math.sin(math.radians(a))).circle(p.rib_r).extrude(depth)\n        tool\
    \ = tool.cut(c)\n    af2 = af + 0.4\n    lead = cq.Workplane('XY').workplane(offset=depth\
    \ - p.leadin).polygon(6, af2 / math.cos(math.radians(30))).extrude(p.leadin)\n\
    \    return tool.union(lead)\n\ndef build(p):\n    depth = p.nut_h + p.recess\n\
    \    h = 1.6 + depth\n    pitch = 11.0\n    bar = cq.Workplane('XY').box(3 * pitch\
    \ + 2, 12, h, centered=(True, True, False))\n    for i in range(3):\n        x\
    \ = (i - 1) * pitch\n        rib = p.rib_h + (i - 1) * p.coupon_step\n       \
    \ bar = bar.cut(pocket_tool(p, rib, depth).translate((x, 0, h - depth)))\n   \
    \     bar = bar.cut(cq.Workplane('XY').center(x, 0).circle((p.bolt_d + p.bolt_clear)\
    \ / 2).extrude(h))\n        for k in range(i + 1):\n            dot = cq.Workplane('XY').center(x\
    \ + (k - i / 2) * 1.6, 4.6).circle(0.5).extrude(h).translate((0, 0, h - 0.6))\n\
    \            bar = bar.cut(dot)\n    return bar\n"
  print_orientation: Flat bottom on the bed, pockets facing up
  use_orientation: Hand-held test piece
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
