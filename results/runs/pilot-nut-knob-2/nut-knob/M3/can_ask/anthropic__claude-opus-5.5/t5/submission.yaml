task: nut-knob/M3
note: The knob is 20 mm across and 7 mm tall, with 8 finger scallops. The M3 nut sits
  0.3 mm below the face in a press-fit hex pocket, on top of a 4.3 mm floor with a
  3.4 mm hole for the bolt. The size of the press fit has to be checked with the coupon.
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  pocket_af:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Pocket size across the flats. FDM hex holes usually print about 0.1 mm small,
      so 5.5 should give a firm press fit by hand. Check it with the coupon
  nut_recess:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: how far the nut sits below the top face, so it is fully inside
  lead_in:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: chamfer at the pocket mouth to help start the press
  bolt_clear_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: clearance hole through the floor, much smaller than the nut so it can't
      push through
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: ''
  knob_h:
    value: 7
    unit: mm
    kind: design
    source: design
    note: floor 4.3 mm under the nut
  edge_chamfer:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_n:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
  scallop_r:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_floor:
    value: 1.6
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    D=p.knob_d; H=p.knob_h\n    k=cq.Workplane('XY').circle(D/2).extrude(H)\n\
    \    k=k.faces('>Z').edges().chamfer(p.edge_chamfer)\n    k=k.faces('<Z').edges().chamfer(p.edge_chamfer)\n\
    \    rc=D/2+p.scallop_r*0.4\n    for i in range(int(p.scallop_n)):\n        a=2*math.pi*i/p.scallop_n\n\
    \        k=k.cut(cq.Workplane('XY').center(rc*math.cos(a), rc*math.sin(a)).circle(p.scallop_r).extrude(H))\n\
    \    depth=p.nut_h+p.nut_recess\n    corner=p.pocket_af/math.cos(math.radians(30))\n\
    \    k=k.cut(cq.Workplane('XY').workplane(offset=H-depth).polygon(6,corner).extrude(depth+1))\n\
    \    lead=(cq.Workplane('XY').workplane(offset=H-p.lead_in).polygon(6,corner)\n\
    \          .workplane(offset=p.lead_in+0.01).polygon(6,corner+2*p.lead_in).loft())\n\
    \    k=k.cut(lead)\n    k=k.cut(cq.Workplane('XY').circle(p.bolt_clear_d/2).extrude(H+1))\n\
    \    return k\n"
  print_orientation: Solid floor on the bed (z=0), hex pocket opening upward. No bridges
    or supports.
  use_orientation: Pocket side toward the bolt head / work, or either way; bolt passes
    through nut and floor
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\ndef build(p):\n    depth=p.nut_h+p.nut_recess\n    T=p.coupon_floor+depth\n\
    \    c=cq.Workplane('XY').box(44,11,T,centered=(True,True,False))\n    offs=[-0.1,0.0,0.1,0.2]\n\
    \    xs=[-15,-5,5,15]\n    for x,o in zip(xs,offs):\n        corner=(p.pocket_af+o)/math.cos(math.radians(30))\n\
    \        c=c.cut(cq.Workplane('XY').workplane(offset=T-depth).center(x,0).polygon(6,corner).extrude(depth+1))\n\
    \        c=c.cut(cq.Workplane('XY').center(x,0).circle(p.bolt_clear_d/2).extrude(T+1))\n\
    \    # marker notch at the smallest-pocket end\n    c=c.cut(cq.Workplane('XY').center(-22,0).rect(2,3).extrude(T+1))\n\
    \    return c\n"
  print_orientation: Flat on the bed, pockets opening upward
  use_orientation: Test only
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: nut_press
  part: knob
  feature: hex pocket
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - pocket_af
  - nut_af
  check:
    method: coupon
    ref: fit_coupon
    description: The nut presses in with your thumb or a flat tool, sits flat, and
      stays in when the coupon is turned upside down and tapped lightly
- id: nut_flush
  part: knob
  feature: pocket depth
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_h
  - nut_recess
  check:
    method: measure
    ref: null
    description: Once seated, the nut's top face is about 0.3 mm below the knob face.
      A straightedge laid across the face doesn't touch the nut
- id: nut_stop
  part: knob
  feature: floor with clearance hole
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - bolt_clear_d
  - nut_af
  check:
    method: none
    ref: null
    description: The 3.4 mm hole is much smaller than the 5.5 mm nut, so the nut can't
      pass through
- id: bolt_pass
  part: knob
  feature: through hole
  relation: clears
  hardware: null
  clearance_mm: 0.4
  params:
  - bolt_clear_d
  - bolt_d
  check:
    method: measure
    ref: null
    description: The M3 bolt passes freely through the floor hole
manual:
- n: '1'
  text: Print fit_coupon. The notch marks the smallest pocket. From the notch, the
    pockets are pocket_af -0.1, +0, +0.1 and +0.2 mm (5.4, 5.5, 5.6 and 5.7 mm).
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Press the M3 nut into each pocket. Pick the tightest one where the nut still
    goes fully in by hand and stays in when the coupon is upside down. If that isn't
    the 5.5 pocket, change pocket_af to that size before printing the knob.
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: Print the knob flat side down. It needs no supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '4'
  text: Line the nut's flats up with the hex pocket and press it in until it bottoms
    on the floor. Press with your thumb, or push it against a table edge, or squeeze
    it gently in a vise or with pliers over a flat plate. It should end up just below
    the face.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Thread your M3 bolt into the nut from the pocket side, or from the floor side.
    Either way it comes out the other side of the knob. Turn the knob to tighten.
  parts:
  - knob
  hardware:
  - nut
  tool: null
