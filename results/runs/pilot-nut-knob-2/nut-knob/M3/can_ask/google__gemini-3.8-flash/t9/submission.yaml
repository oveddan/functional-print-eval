task: nut-knob/M3
note: Hand knob for M3 bolt with captive ISO 4032 M3 hex nut. Features integrated
  internal crush ribs on the hex pocket flats for a secure hand press-fit that prevents
  the nut from falling out when inverted, an internal solid shelf preventing push-through,
  and a full through-hole for bolt clearance.
questions: []
params:
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: design
    note: Nominal outer diameter across knob lobes
  leadin_depth:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Depth of lead-in hex recess before ribs engage
  flute_r:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: Radius of scalloped finger grip flutes around perimeter
  pocket_depth:
    value: 3.2
    unit: mm
    kind: design
    source: design
    note: Depth of nut pocket from top face (2.4mm nut sits recessed by 0.8mm)
  num_flutes:
    value: 6
    unit: count
    kind: design
    source: design
    note: Number of finger grip flutes around perimeter
  flute_center_r:
    value: 10.5
    unit: mm
    kind: design
    source: design
    note: Radial distance from knob axis to centers of flute cuts
  edge_chamfer:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Chamfer on top and bottom outer rims of knob for comfortable grip
  bolt_clearance_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: Through-hole diameter for M3 bolt clearance
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut nominal thickness
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut nominal width across flats
  knob_h:
    value: 8
    unit: mm
    kind: design
    source: design
    note: Total height of the knob
  leadin_af:
    value: 5.75
    unit: mm
    kind: design
    source: design
    note: Across-flats of lead-in hex recess at pocket entrance
  nut_pocket_af:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: Across-flats dimension of the main hex pocket
  rib_protrusion:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: Height of crush ribs protruding into pocket flats for press-fit retention
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3 nominal bolt thread diameter
  rib_width:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Width of crush ribs along the pocket flats
parts:
- id: hand-knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    # 1. Base cylinder with top and bottom\
    \ chamfers for ergonomic grip\n    base = (\n        cq.Workplane(\"XY\")\n  \
    \      .circle(p.knob_d / 2.0)\n        .extrude(p.knob_h)\n    )\n    base =\
    \ base.edges(\">Z or <Z\").chamfer(p.edge_chamfer)\n\n    # 2. Cut 6 scalloped\
    \ finger grip flutes around perimeter\n    for i in range(int(p.num_flutes)):\n\
    \        angle = i * (2.0 * math.pi / p.num_flutes)\n        cx = p.flute_center_r\
    \ * math.cos(angle)\n        cy = p.flute_center_r * math.sin(angle)\n       \
    \ flute_cut = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=-1.0)\n\
    \            .transformed(offset=(cx, cy, 0))\n            .circle(p.flute_r)\n\
    \            .extrude(p.knob_h + 2.0)\n        )\n        base = base.cut(flute_cut)\n\
    \n    # 3. Through-hole for M3 bolt clearance\n    bolt_hole = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=-1.0)\n        .circle(p.bolt_clearance_d / 2.0)\n\
    \        .extrude(p.knob_h + 2.0)\n    )\n    base = base.cut(bolt_hole)\n\n \
    \   # 4. Main ribbed hex pocket (with retention crush ribs on flats)\n    r_flat\
    \ = p.nut_pocket_af / 2.0\n    r_corner = r_flat / math.cos(math.pi / 6.0)\n \
    \   rib_h = p.rib_protrusion\n    half_rib_w = p.rib_width / 2.0\n\n    pts =\
    \ []\n    for k in range(6):\n        phi = k * (math.pi / 3.0)\n        theta_a\
    \ = phi - (math.pi / 6.0)\n        pt_corner_a = (r_corner * math.cos(theta_a),\
    \ r_corner * math.sin(theta_a))\n        pts.append(pt_corner_a)\n\n        mx\
    \ = r_flat * math.cos(phi)\n        my = r_flat * math.sin(phi)\n        tx =\
    \ -math.sin(phi)\n        ty = math.cos(phi)\n\n        pt_rib_1 = (mx - half_rib_w\
    \ * tx, my - half_rib_w * ty)\n        pts.append(pt_rib_1)\n\n        nx = math.cos(phi)\n\
    \        ny = math.sin(phi)\n        pt_apex = (mx - rib_h * nx, my - rib_h *\
    \ ny)\n        pts.append(pt_apex)\n\n        pt_rib_2 = (mx + half_rib_w * tx,\
    \ my + half_rib_w * ty)\n        pts.append(pt_rib_2)\n\n    pocket_z = p.knob_h\
    \ - p.pocket_depth\n    ribbed_pocket = (\n        cq.Workplane(\"XY\")\n    \
    \    .workplane(offset=pocket_z)\n        .polyline(pts)\n        .close()\n \
    \       .extrude(p.pocket_depth + 1.0)\n    )\n    base = base.cut(ribbed_pocket)\n\
    \n    # 5. Lead-in smooth hex recess at entrance\n    r_flat_leadin = p.leadin_af\
    \ / 2.0\n    r_corner_leadin = r_flat_leadin / math.cos(math.pi / 6.0)\n    leadin_pts\
    \ = [\n        (r_corner_leadin * math.cos(k * math.pi / 3.0 + math.pi / 6.0),\n\
    \         r_corner_leadin * math.sin(k * math.pi / 3.0 + math.pi / 6.0))\n   \
    \     for k in range(6)\n    ]\n    leadin_z = p.knob_h - p.leadin_depth\n   \
    \ leadin_cut = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=leadin_z)\n\
    \        .polyline(leadin_pts)\n        .close()\n        .extrude(p.leadin_depth\
    \ + 1.0)\n    )\n    base = base.cut(leadin_cut)\n\n    return base\n"
  print_orientation: Bottom face flat on print bed (z=0), nut pocket facing up
  use_orientation: Flat bottom face bears against workpiece or washer; fluted perimeter
    gripped by hand
- id: fit-coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    h = p.pocket_depth + 2.0\n    block = cq.Workplane(\"\
    XY\").rect(14.0, 14.0).extrude(h)\n\n    # Through-hole\n    bolt_hole = (\n \
    \       cq.Workplane(\"XY\")\n        .workplane(offset=-1.0)\n        .circle(p.bolt_clearance_d\
    \ / 2.0)\n        .extrude(h + 2.0)\n    )\n    block = block.cut(bolt_hole)\n\
    \n    # Main ribbed hex pocket\n    r_flat = p.nut_pocket_af / 2.0\n    r_corner\
    \ = r_flat / math.cos(math.pi / 6.0)\n    rib_h = p.rib_protrusion\n    half_rib_w\
    \ = p.rib_width / 2.0\n\n    pts = []\n    for k in range(6):\n        phi = k\
    \ * (math.pi / 3.0)\n        theta_a = phi - (math.pi / 6.0)\n        pt_corner_a\
    \ = (r_corner * math.cos(theta_a), r_corner * math.sin(theta_a))\n        pts.append(pt_corner_a)\n\
    \n        mx = r_flat * math.cos(phi)\n        my = r_flat * math.sin(phi)\n \
    \       tx = -math.sin(phi)\n        ty = math.cos(phi)\n\n        pt_rib_1 =\
    \ (mx - half_rib_w * tx, my - half_rib_w * ty)\n        pts.append(pt_rib_1)\n\
    \n        nx = math.cos(phi)\n        ny = math.sin(phi)\n        pt_apex = (mx\
    \ - rib_h * nx, my - rib_h * ny)\n        pts.append(pt_apex)\n\n        pt_rib_2\
    \ = (mx + half_rib_w * tx, my + half_rib_w * ty)\n        pts.append(pt_rib_2)\n\
    \n    pocket_z = h - p.pocket_depth\n    ribbed_pocket = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=pocket_z)\n        .polyline(pts)\n        .close()\n\
    \        .extrude(p.pocket_depth + 1.0)\n    )\n    block = block.cut(ribbed_pocket)\n\
    \n    # Lead-in smooth hex recess\n    r_flat_leadin = p.leadin_af / 2.0\n   \
    \ r_corner_leadin = r_flat_leadin / math.cos(math.pi / 6.0)\n    leadin_pts =\
    \ [\n        (r_corner_leadin * math.cos(k * math.pi / 3.0 + math.pi / 6.0),\n\
    \         r_corner_leadin * math.sin(k * math.pi / 3.0 + math.pi / 6.0))\n   \
    \     for k in range(6)\n    ]\n    leadin_z = h - p.leadin_depth\n    leadin_cut\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=leadin_z)\n   \
    \     .polyline(leadin_pts)\n        .close()\n        .extrude(p.leadin_depth\
    \ + 1.0)\n    )\n    block = block.cut(leadin_cut)\n\n    return block\n"
  print_orientation: Bottom face flat on print bed (z=0), pocket opening facing up
  use_orientation: Used to test M3 nut press-fit and inversion retention prior to
    full print
hardware:
- id: m3-nut
  ref: ISO 4032 M3
  qty: 1
- id: m3-bolt
  ref: ISO 4762 M3x16
  qty: 1
joints:
- id: joint-knob-bolt
  fastener: m3-bolt
  axis_origin:
  - 0.0
  - 0.0
  - 8.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: hand-knob
    feature: nut-pocket
    role: nut_pocket
  - part: hand-knob
    feature: bolt-hole
    role: clearance
  nut: m3-nut
  external: null
criteria:
- id: crit-nut-retention
  part: hand-knob
  feature: nut-pocket
  relation: contains
  hardware: m3-nut
  clearance_mm: 0.1
  params:
  - nut_af
  - nut_h
  - nut_pocket_af
  - pocket_depth
  - rib_protrusion
  check:
    method: coupon
    ref: fit-coupon
    description: Verify press-fit retention of M3 nut in pocket when inverted without
      glue
- id: crit-nut-bottom-stop
  part: hand-knob
  feature: pocket-shelf
  relation: seats
  hardware: m3-nut
  clearance_mm: null
  params:
  - nut_af
  - bolt_clearance_d
  - pocket_depth
  - knob_h
  check:
    method: measure
    ref: null
    description: Verify that the solid internal shelf stops the nut from pushing through
      the far side
- id: crit-bolt-clearance
  part: hand-knob
  feature: bolt-hole
  relation: clears
  hardware: m3-bolt
  clearance_mm: 0.4
  params:
  - bolt_d
  - bolt_clearance_d
  check:
    method: measure
    ref: null
    description: Verify that M3 bolt passes freely through the through-hole and out
      the other side
manual:
- n: '1'
  text: 'Optional pre-print fit test: Print the fit-coupon part (takes ~3 minutes).
    Press an ISO 4032 M3 hex nut into the hex pocket using firm thumb pressure. Verify
    that the nut enters the lead-in, presses past the retention crush ribs, seats
    against the bottom stop, and stays firmly in place when the coupon is inverted
    without glue.'
  parts:
  - fit-coupon
  hardware:
  - m3-nut
  tool: null
- n: '2'
  text: 'Slice and print the hand-knob with its flat bottom face on the build plate
    (Z=0). No support structures or brims are required. Recommended settings: 0.2
    mm layer height, 3 perimeters / wall loops, and >=20% infill in PLA.'
  parts:
  - hand-knob
  hardware: []
  tool: null
- n: '3'
  text: Orient the M3 hex nut over the hex entrance on the top face of the knob. Push
    the nut straight into the pocket with firm thumb pressure (or invert the knob
    and press down against a hard, flat desk surface) until the nut seats fully against
    the internal shelf. The nut sits recessed 0.8 mm below the top surface and is
    retained by the integrated crush ribs so it will not fall out when inverted.
  parts:
  - hand-knob
  hardware:
  - m3-nut
  tool: null
- n: '4'
  text: Thread your M3 bolt into the captive nut. The bolt passes completely through
    the internal clearance hole and emerges through the far side of the knob, ready
    for tool-free hand tightening.
  parts:
  - hand-knob
  hardware:
  - m3-bolt
  - m3-nut
  tool: null
