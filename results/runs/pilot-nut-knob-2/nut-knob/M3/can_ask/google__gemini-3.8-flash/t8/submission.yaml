task: nut-knob/M3
note: One-piece ergonomic hand knob (20 mm diameter, 6 flutes) with captive M3 nut
  retention for tool-free tightening. Features a tapered internal hex socket (5.65
  mm entry down to 5.50 mm seat) that permits hand pressing while creating a friction
  fit against gravity, an internal solid shoulder stopping nut push-through, and a
  full central clearance bore for through-bolt capability.
questions: []
params:
  nut_pocket_depth:
    value: 3.2
    unit: mm
    kind: design
    source: design
    note: Depth of the nut pocket from top surface to internal shoulder
  coupon_height:
    value: 6
    unit: mm
    kind: design
    source: design
    note: Total height of the test coupon block
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal major diameter of M3 bolt
  nut_pocket_af_entry:
    value: 5.65
    unit: mm
    kind: design
    source: design
    note: Hex pocket across-flats width at the top entry for easy hand alignment
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: Width across flats for ISO 4032 M3 hex nut
  knob_outer_d:
    value: 20
    unit: mm
    kind: design
    source: design
    note: Outer diameter across the lobes of the knob
  knob_height:
    value: 9
    unit: mm
    kind: design
    source: design
    note: Total axial height of the knob
  edge_chamfer:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Chamfer size on top and bottom circular rims for comfort
  nut_pocket_af_seat:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Hex pocket across-flats width at the internal seat shoulder for press-fit
      retention
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal thickness of ISO 4032 M3 hex nut
  bolt_clearance_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: Through-hole diameter for M3 bolt clearance
  flute_d:
    value: 5
    unit: mm
    kind: design
    source: design
    note: Diameter of scalloped finger flutes cut around perimeter
  flute_count:
    value: 6
    unit: count
    kind: design
    source: design
    note: Number of finger grip flutes around the perimeter
parts:
- id: knob
  role: final
  material: PLA
  code: "import cadquery as cq\nimport math\n\ndef build(p):\n    r = p.knob_outer_d\
    \ / 2.0\n    h = p.knob_height\n    c = p.edge_chamfer\n\n    # Base cylinder\
    \ with chamfered rim for comfort and clean first layer\n    knob = cq.Workplane(\"\
    XY\").circle(r).extrude(h)\n    knob = knob.edges(\">Z\").chamfer(c)\n    knob\
    \ = knob.edges(\"<Z\").chamfer(c)\n\n    # Cut finger flutes around perimeter\n\
    \    flute_r = p.flute_d / 2.0\n    orbit_r = r\n    flute_pts = [\n        (\n\
    \            orbit_r * math.cos(i * 2.0 * math.pi / p.flute_count),\n        \
    \    orbit_r * math.sin(i * 2.0 * math.pi / p.flute_count),\n        )\n     \
    \   for i in range(int(p.flute_count))\n    ]\n    cutters = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=-1.0)\n        .pushPoints(flute_pts)\n     \
    \   .circle(flute_r)\n        .extrude(h + 2.0)\n    )\n    knob = knob.cut(cutters)\n\
    \n    # Through-hole for M3 bolt clearance\n    through_hole = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=-1.0)\n        .circle(p.bolt_clearance_d / 2.0)\n\
    \        .extrude(h + 2.0)\n    )\n    knob = knob.cut(through_hole)\n\n    #\
    \ Tapered hex pocket for captive M3 nut\n    z_seat = h - p.nut_pocket_depth\n\
    \    cut_depth = p.nut_pocket_depth + 1.0\n    taper_rate = (p.nut_pocket_af_entry\
    \ - p.nut_pocket_af_seat) / p.nut_pocket_depth\n    af_top = p.nut_pocket_af_seat\
    \ + taper_rate * cut_depth\n\n    def hex_pts(af):\n        r_vert = (af / 2.0)\
    \ / math.cos(math.pi / 6.0)\n        return [\n            (r_vert * math.cos(i\
    \ * math.pi / 3.0), r_vert * math.sin(i * math.pi / 3.0))\n            for i in\
    \ range(6)\n        ]\n\n    pocket = (\n        cq.Workplane(\"XY\")\n      \
    \  .workplane(offset=z_seat)\n        .polyline(hex_pts(p.nut_pocket_af_seat)).close()\n\
    \        .workplane(offset=cut_depth)\n        .polyline(hex_pts(af_top)).close()\n\
    \        .loft(combine=False)\n    )\n    knob = knob.cut(pocket)\n\n    return\
    \ knob\n"
  print_orientation: Flat base on the print bed (z = 0), hex pocket opening facing
    upward (+Z)
  use_orientation: Flat shoulder face seats against clamped part; knob is turned by
    hand onto the M3 bolt
- id: nut_pocket_coupon
  role: coupon
  material: PLA
  code: "import cadquery as cq\nimport math\n\ndef build(p):\n    h = p.coupon_height\n\
    \    block = cq.Workplane(\"XY\").box(14.0, 14.0, h, centered=(True, True, False))\n\
    \n    # Through-hole for M3 bolt clearance\n    through_hole = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=-1.0)\n        .circle(p.bolt_clearance_d / 2.0)\n\
    \        .extrude(h + 2.0)\n    )\n    block = block.cut(through_hole)\n\n   \
    \ # Tapered hex pocket for captive M3 nut\n    z_seat = h - p.nut_pocket_depth\n\
    \    cut_depth = p.nut_pocket_depth + 1.0\n    taper_rate = (p.nut_pocket_af_entry\
    \ - p.nut_pocket_af_seat) / p.nut_pocket_depth\n    af_top = p.nut_pocket_af_seat\
    \ + taper_rate * cut_depth\n\n    def hex_pts(af):\n        r_vert = (af / 2.0)\
    \ / math.cos(math.pi / 6.0)\n        return [\n            (r_vert * math.cos(i\
    \ * math.pi / 3.0), r_vert * math.sin(i * math.pi / 3.0))\n            for i in\
    \ range(6)\n        ]\n\n    pocket = (\n        cq.Workplane(\"XY\")\n      \
    \  .workplane(offset=z_seat)\n        .polyline(hex_pts(p.nut_pocket_af_seat)).close()\n\
    \        .workplane(offset=cut_depth)\n        .polyline(hex_pts(af_top)).close()\n\
    \        .loft(combine=False)\n    )\n    block = block.cut(pocket)\n\n    return\
    \ block\n"
  print_orientation: Flat base on the print bed (z = 0), hex pocket opening facing
    upward (+Z)
  use_orientation: Test block to verify M3 nut press-fit retention before printing
    final knob
hardware:
- id: m3_nut
  ref: ISO 4032 M3
  qty: 1
- id: m3_bolt
  ref: ISO 4762 M3x20
  qty: 1
joints:
- id: knob_bolt_joint
  fastener: m3_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 9.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: nut_pocket
    role: nut_pocket
  - part: knob
    feature: through_hole
    role: clearance
  nut: m3_nut
  external: null
criteria:
- id: nut_retention
  part: knob
  feature: nut_pocket
  relation: seats
  hardware: m3_nut
  clearance_mm: 0.0
  params:
  - nut_pocket_af_seat
  - nut_pocket_af_entry
  - nut_pocket_depth
  - nut_af
  check:
    method: coupon
    ref: nut_pocket_coupon
    description: Press an ISO 4032 M3 hex nut into the pocket using firm thumb pressure.
      Verify that it self-aligns easily at the entry, seats fully against the bottom
      shoulder, sits recessed below the top face, and stays firmly retained when inverted
      without glue.
- id: bolt_clearance
  part: knob
  feature: through_hole
  relation: clears
  hardware: m3_bolt
  clearance_mm: 0.4
  params:
  - bolt_clearance_d
  - bolt_d
  check:
    method: none
    ref: null
    description: Verify that an M3 bolt threads through the captured nut and passes
      cleanly through the central 3.4 mm hole out the other side without binding.
- id: knob_ergonomics
  part: knob
  feature: outer_lobes
  relation: contains
  hardware: null
  clearance_mm: null
  params:
  - knob_outer_d
  - knob_height
  - flute_count
  - flute_d
  check:
    method: none
    ref: null
    description: Verify the knob has an outer diameter of approximately 20 mm across
      the lobes and provides a comfortable, slip-free grip for tightening by hand.
manual:
- n: '1'
  text: 'Optional test print: Print the ''nut_pocket_coupon'' part (approx. 3 minutes)
    at 0.2 mm layer height with PLA. Press an ISO 4032 M3 hex nut into the pocket
    using firm thumb pressure. Verify that the nut enters easily, seats firmly against
    the bottom shoulder, and stays in place when the coupon is turned upside down.'
  parts:
  - nut_pocket_coupon
  hardware:
  - m3_nut
  tool: null
- n: '2'
  text: Print the 'knob' part on your Bambu Lab X1C using standard PLA, 0.4 mm nozzle,
    and 0.2 mm layer height. Orient the part with its flat bottom face on the build
    plate (z = 0) and the hex pocket opening facing upward (+Z). No supports or brim
    are required.
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Align the M3 hex nut with the hex pocket opening on the top face of the knob.
    Press the nut straight into the pocket with your thumb until it seats firmly against
    the internal shoulder. The nut will sit recessed approximately 0.8 mm below the
    top surface.
  parts:
  - knob
  hardware:
  - m3_nut
  tool: null
- n: '4'
  text: Turn the knob upside down to confirm the nut remains firmly retained by friction
    with no glue. Thread your M3 bolt through the nut; the bolt extends through the
    nut and exits through the clearance hole on the far side. Tighten onto your assembly
    by hand.
  parts:
  - knob
  hardware:
  - m3_nut
  - m3_bolt
  tool: null
