task: nut-knob/M3
note: Single-piece 20 mm fluted hand knob for M3 bolt with friction-retained ISO 4032
  M3 hex nut. Features integrated lead-in zone and compliant retention ribs for glue-free
  hand press-fit and a through-hole for unlimited bolt pass-through.
questions: []
params:
  scallop_radius:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: Radius of finger scallop cutouts
  chamfer_top:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Top edge chamfer for smooth, comfortable hand grip
  pocket_af:
    value: 5.65
    unit: mm
    kind: design
    source: design
    note: Hex pocket width across flats (body clearance)
  knob_diameter:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: Overall outer diameter across knob lobes
  rib_protrusion:
    value: 0.18
    unit: mm
    kind: design
    source: design
    note: Radial interference of retention ribs on hex pocket flats
  rib_radius:
    value: 0.5
