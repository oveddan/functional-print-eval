manual:
- n: '1'
  text: Print fit_coupon in PLA with 0.4 mm nozzle, 0.2 mm layers, 4 walls, 100% infill
    and no supports. Enable variable-width walls if available. Preview that all three
    0.8 mm fingers print continuously and relief slots remain open. Allow to cool
    fully.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Align nut flats with pocket; press evenly with your thumb until nut passes
    all three catches and rests on shoulder. Do not hammer. Check for cracks and permanently
    bent fingers. Invert and gently shake: nut must remain captive. Small axial movement
    is intentional.'
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: If too stiff to press in by hand, increase catch_throat_af from 5.2 to 5.3
    mm and reprint coupon. If retention is insufficient, decrease to 5.1 mm and retest.
    If nut binds in the hex pocket itself, increase hex_clearance_af by 0.1 mm and
    repeat all tests. Use only parameters that pass.
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '4'
  text: Thread test_bolt through nut by fingers until it exits bottom. Verify nut
    does not spin and bolt does not bind on plastic. Remove bolt. To reclaim nut,
    push it gently out from below with the bolt's blunt end, keeping fingers clear;
    coupon catches may be damaged. Alternatively use a second ISO 4032 M3 nut in the
    final knob and repeat fit checks.
  parts:
  - fit_coupon
  hardware:
  - nut
  - test_bolt
  tool: null
- n: '5'
  text: Print knob with successful parameters, same settings and pocket-up orientation.
    Cool fully. Press nut in by hand, then repeat inversion, seating and bolt-passage
    checks. Finished assembly consists only of knob and captive nut; no glue or separate
    retainer.
  parts:
  - knob
  hardware:
  - nut
  - test_bolt
  tool: null
- n: '6'
  text: Use as a captive-nut hand fastener on an M3 bolt. Start threads gently; bolt
    can extend out the opposite face. Flat bottom is the bearing face when used as
    a thumb nut. Tighten by hand only, never pliers. Avoid heat, structural or safety-critical
    loads and repeated nut removal. Replace if cracked or retention fails.
  parts:
  - knob
  hardware:
  - nut
  tool: null
