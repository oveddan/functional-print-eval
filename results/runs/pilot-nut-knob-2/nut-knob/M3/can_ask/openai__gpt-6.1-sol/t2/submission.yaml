parts:
- id: knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    import math\n    a = (p.nut_af+p.hex_clearance_af)/2\n\
    \    h = p.knob_h\n    body = cq.Workplane('XY').circle(p.knob_d/2).extrude(h)\n\
    \    for i in range(int(p.scallop_count)):\n        ang = 2*math.pi*i/p.scallop_count\n\
    \        body = body.cut(cq.Workplane('XY').center(p.scallop_center_r*math.cos(ang),p.scallop_center_r*math.sin(ang)).circle(p.scallop_r).extrude(h))\n\
    \    rr = a/math.cos(math.pi/6)\n    pts = [(rr*math.cos(math.radians(30+60*i)),rr*math.sin(math.radians(30+60*i)))\
    \ for i in range(6)]\n    body = body.cut(cq.Workplane('XY').workplane(offset=p.floor_h).polyline(pts).close().extrude(h-p.floor_h))\n\
    \    body = body.cut(cq.Workplane('XY').circle((p.bolt_d+p.bolt_clearance_d)/2).extrude(h))\n\
    \    t,w,g = p.finger_t,p.finger_w,p.slot_gap\n    z0 = p.finger_root_z\n    def\
    \ box(x0,x1,y0,y1):\n        return cq.Workplane('XY').box(x1-x0,y1-y0,h-z0,centered=(False,False,False)).translate((x0,y0,z0))\n\
    \    for deg in (0,120,240):\n        slots = box(a+t,a+t+g,-w/2-g,w/2+g).union(box(a-g,a+t+g,w/2,w/2+g)).union(box(a-g,a+t+g,-w/2-g,-w/2))\n\
    \        body = body.cut(slots.rotate((0,0,0),(0,0,1),deg))\n        z = p.floor_h+p.nut_h+p.nut_axial_play\n\
    \        tip = p.catch_throat_af/2\n        profile = [(a,z),(tip,z),(tip,z+p.catch_land_h),(a,z+p.catch_land_h+p.catch_ramp_h),(a+t,z+p.catch_land_h+p.catch_ramp_h),(a+t,z)]\n\
    \        catch = cq.Workplane('XZ').polyline(profile).close().extrude(w).translate((0,w/2,0)).rotate((0,0,0),(0,0,1),deg)\n\
    \        body = body.union(catch)\n    return body.clean()\n"
  print_orientation: Flat bottom on bed at z=0, pocket up; no supports.
  use_orientation: Nut enters recessed pocket. Flat bottom is bearing face in thumb-nut
    use. Bolt passes through nut and central bore.
- id: fit_coupon
  role: coupon
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    import math\n    a = (p.nut_af+p.hex_clearance_af)/2\n\
    \    h = p.knob_h\n    body = cq.Workplane('XY').circle(p.coupon_d/2).extrude(h)\n\
    \    rr = a/math.cos(math.pi/6)\n    pts = [(rr*math.cos(math.radians(30+60*i)),rr*math.sin(math.radians(30+60*i)))\
    \ for i in range(6)]\n    body = body.cut(cq.Workplane('XY').workplane(offset=p.floor_h).polyline(pts).close().extrude(h-p.floor_h))\n\
    \    body = body.cut(cq.Workplane('XY').circle((p.bolt_d+p.bolt_clearance_d)/2).extrude(h))\n\
    \    t,w,g = p.finger_t,p.finger_w,p.slot_gap\n    z0 = p.finger_root_z\n    def\
    \ box(x0,x1,y0,y1):\n        return cq.Workplane('XY').box(x1-x0,y1-y0,h-z0,centered=(False,False,False)).translate((x0,y0,z0))\n\
    \    for deg in (0,120,240):\n        slots = box(a+t,a+t+g,-w/2-g,w/2+g).union(box(a-g,a+t+g,w/2,w/2+g)).union(box(a-g,a+t+g,-w/2-g,-w/2))\n\
    \        body = body.cut(slots.rotate((0,0,0),(0,0,1),deg))\n        z = p.floor_h+p.nut_h+p.nut_axial_play\n\
    \        tip = p.catch_throat_af/2\n        profile = [(a,z),(tip,z),(tip,z+p.catch_land_h),(a,z+p.catch_land_h+p.catch_ramp_h),(a+t,z+p.catch_land_h+p.catch_ramp_h),(a+t,z)]\n\
    \        catch = cq.Workplane('XZ').polyline(profile).close().extrude(w).translate((0,w/2,0)).rotate((0,0,0),(0,0,1),deg)\n\
    \        body = body.union(catch)\n    return body.clean()\n"
  print_orientation: Flat bottom at z=0, pocket up; same settings as knob, no supports.
  use_orientation: Tests identical internal nut seat and spring catches.
