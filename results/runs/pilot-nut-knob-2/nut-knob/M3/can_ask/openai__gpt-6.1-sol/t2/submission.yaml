task: nut-knob/M3
note: One-piece 20 mm knob. A hex seat resists nut rotation, three integral spring
  catches retain the hand-pressed nut upside down, and a bottom shoulder prevents
  passage through the far side. Central bore allows bolt passage. Actual nut dimensions
  unavailable; coupon testing is required. Small axial play is intentional. Coupon
  is not part of the finished assembly.
questions:
- text: Can you measure nut across flats and thickness?
  answer: Cannot measure; use best judgment.
