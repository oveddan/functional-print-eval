task: nut-knob/M3
note: 'One-piece, approximately 20 mm hand knob with a hand-inserted captive M3 hex
  nut. Two integral lateral spring walls grip opposite nut flats; the remaining hex
  faces resist rotation. A bottom shoulder prevents the nut passing through, while
  a clearance hole lets the bolt exit. Fit is printer- and nut-dependent: validate
  the coupon first. This is a female threaded knob, not a captive bolt-head knob.
  Intended for light hand tightening, not high torque or hot environments.'
questions:
- text: Can you measure the nut across flats and its thickness?
  answer: Cannot measure; use standard dimensions.
