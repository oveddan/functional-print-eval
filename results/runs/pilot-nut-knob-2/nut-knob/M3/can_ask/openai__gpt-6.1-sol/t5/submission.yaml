parts:
- id: knob
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    af = p.nut_af + p.hex_af_clearance\n\
    \    flat = af / 2\n    outer = flat + p.spring_thickness\n    tip = p.nut_af\
    \ / 2 - p.catch_interference\n    lip_z = p.floor_z + p.nut_height + p.catch_axial_clearance\n\
    \    top_z = lip_z + p.catch_land_h + p.catch_ramp_h\n    body = cq.Workplane('XY').circle(p.knob_d/2).extrude(p.knob_h)\n\
    \    for i in range(int(p.grip_count)):\n        a = 2*math.pi*i/p.grip_count\n\
    \        r = p.knob_d/2 + p.grip_cut_offset\n        cut = cq.Workplane('XY').center(r*math.cos(a),r*math.sin(a)).circle(p.grip_cut_r).extrude(p.knob_h)\n\
    \        body = body.cut(cut)\n    pocket = cq.Workplane('XY').workplane(offset=p.floor_z).polygon(6,2*af/math.sqrt(3)).extrude(p.knob_h-p.floor_z)\n\
    \    body = body.cut(pocket)\n    body = body.cut(cq.Workplane('XY').circle((p.bolt_d+p.bolt_d_clearance)/2).extrude(p.knob_h))\n\
    \    inner = flat-p.relief_overlap\n    relief_outer = outer+p.spring_gap\n  \
    \  relief = cq.Workplane('XY').workplane(offset=p.spring_base_z).center(0,(inner+relief_outer)/2).rect(p.spring_width+2*p.spring_gap,relief_outer-inner).extrude(p.knob_h-p.spring_base_z)\n\
    \    profile = [(flat,p.spring_base_z),(outer,p.spring_base_z),(outer,top_z),(flat,top_z),(tip,lip_z+p.catch_land_h),(tip,lip_z),(flat,lip_z)]\n\
    \    finger = cq.Workplane('YZ').polyline(profile).close().extrude(p.spring_width).translate((-p.spring_width/2,0,0))\n\
    \    for a in (0,120,240):\n        body = body.cut(relief.rotate((0,0,0),(0,0,1),a))\n\
    \    for a in (0,120,240):\n        body = body.union(finger.rotate((0,0,0),(0,0,1),a))\n\
    \    return body.clean()\n"
  print_orientation: Broad flat underside on the bed, z=0; hex opening and spring
    ramps face upward. No supports.
  use_orientation: Nut enters the top opening along -Z, seats at z=floor_z, and is
    retained below the three catches. Bolt passes along the central Z axis.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    import math\n    af = p.nut_af + p.hex_af_clearance\n\
    \    flat = af/2\n    outer = flat+p.spring_thickness\n    tip = p.nut_af/2-p.catch_interference\n\
    \    lip_z = p.floor_z+p.nut_height+p.catch_axial_clearance\n    top_z = lip_z+p.catch_land_h+p.catch_ramp_h\n\
    \    body = cq.Workplane('XY').circle(p.coupon_d/2).extrude(p.knob_h)\n    body\
    \ = body.cut(cq.Workplane('XY').workplane(offset=p.floor_z).polygon(6,2*af/math.sqrt(3)).extrude(p.knob_h-p.floor_z))\n\
    \    body = body.cut(cq.Workplane('XY').circle((p.bolt_d+p.bolt_d_clearance)/2).extrude(p.knob_h))\n\
    \    inner = flat-p.relief_overlap\n    relief_outer = outer+p.spring_gap\n  \
    \  relief = cq.Workplane('XY').workplane(offset=p.spring_base_z).center(0,(inner+relief_outer)/2).rect(p.spring_width+2*p.spring_gap,relief_outer-inner).extrude(p.knob_h-p.spring_base_z)\n\
    \    profile = [(flat,p.spring_base_z),(outer,p.spring_base_z),(outer,top_z),(flat,top_z),(tip,lip_z+p.catch_land_h),(tip,lip_z),(flat,lip_z)]\n\
    \    finger = cq.Workplane('YZ').polyline(profile).close().extrude(p.spring_width).translate((-p.spring_width/2,0,0))\n\
    \    for a in (0,120,240):\n        body = body.cut(relief.rotate((0,0,0),(0,0,1),a))\n\
    \    for a in (0,120,240):\n        body = body.union(finger.rotate((0,0,0),(0,0,1),a))\n\
    \    return body.clean()\n"
  print_orientation: Flat underside on bed, z=0, opening upward. Print with the same
    settings as the final knob; no supports.
  use_orientation: Test the nut seat and spring catches exactly as on the final knob.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: hand_insertion
  part: knob
  feature: Hex pocket and three ramped spring catches
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - nut_height
  - hex_af_clearance
  - spring_width
  - spring_thickness
  - spring_gap
  - spring_base_z
  - catch_interference
  check:
    method: coupon
    ref: fit_coupon
    description: Align nut flats and press fully home with a thumb. It must seat without
      tools, cracking, or whitening the springs. Springs must return inward after
      insertion.
- id: upside_down_retention
  part: knob
  feature: Three catch undersides above the seated nut
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - catch_interference
  - catch_axial_clearance
  - catch_land_h
  - floor_z
  - nut_height
  check:
    method: coupon
    ref: fit_coupon
    description: Invert the coupon and gently tap its side. The nut must remain captive;
      slight axial play is acceptable. Inspect that catches overlap the nut's top
      flats.
- id: fully_recessed
  part: knob
  feature: Nut below top rim and supported on floor
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - floor_z
  - nut_height
  - knob_h
  check:
    method: coupon
    ref: fit_coupon
    description: Nut must sit flat at the bottom of the hex pocket, entirely below
      the top rim.
- id: bottom_stop
  part: knob
  feature: Solid seating shoulder surrounding bolt clearance hole
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - floor_z
  - bolt_d
  - bolt_d_clearance
  - nut_af
  - spring_base_z
  check:
    method: coupon
    ref: fit_coupon
    description: Press the seated nut with a thumb; it must not pass out through the
      underside. Do not test using a bolt as a jack against the floor.
- id: bolt_passage
  part: knob
  feature: Central 3.5 mm clearance bore
  relation: clears
  hardware: null
  clearance_mm: 0.25
  params:
  - bolt_d
  - bolt_d_clearance
  check:
    method: coupon
    ref: fit_coupon
    description: Hand-thread the intended M3 bolt through the seated nut and verify
      that its tip emerges freely through the opposite side without contacting plastic.
- id: torque_transfer
  part: knob
  feature: Hex socket walls, particularly the three uninterrupted flats
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - hex_af_clearance
  - nut_height
  check:
    method: coupon
    ref: fit_coupon
    description: With the nut threaded onto the intended bolt, apply light finger
      torque. Nut must turn with the coupon rather than spin in its socket.
manual:
- n: '1'
  text: Print fit_coupon first in the supplied orientation using black PLA, 0.4 mm
    nozzle, 0.2 mm layers, four walls, and 100% infill. Use normal or reduced outer-wall
    speed, not the fastest mode, for the small springs. Disable supports and keep
    the spring slots free of brim material.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Let the coupon cool. Remove loose strings from the pocket and relief slots.
    Align the nut's flats with the hex opening and press it straight down with your
    thumb until it seats beneath the catches. Do not hammer it, heat it, or use a
    bolt to pull it into place.
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: 'Perform the coupon checks: nut fully recessed and flat, catches returned
    inward, nut retained when inverted and gently tapped, bolt threads through by
    hand and emerges from the opposite face, and nut cannot spin under light finger
    torque. If insertion is too stiff, increase hex_af_clearance by 0.1 mm if the
    hex walls bind, or decrease catch_interference by 0.05 mm if only the catches
    resist. If retention fails, increase catch_interference by 0.05 mm. Reprint and
    retest; discard any cracked or whitened specimen. Do not proceed until all checks
    pass.'
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '4'
  text: Print knob with the validated parameters and exactly the same print settings
    and orientation. The coupon is only a test and is not assembled into the finished
    knob. If your only nut is captive in the coupon, carefully flex its catches outward
    to retrieve it; do not damage the nut.
  parts:
  - knob
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '5'
  text: After cooling and clearing strings, align the nut and press it into knob by
    hand. Repeat the inversion and bolt-passage checks. The completed assembly consists
    of one printed knob and one captive nut; no glue or retaining hardware is needed.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '6'
  text: Thread onto your M3 bolt by hand. The hex walls transmit turning force; the
    floor takes load when the nut is drawn toward the underside. Use finger tightening
    only, not pliers or high clamp loads. The snap catches provide retention, not
    a structural axial restraint. Keep away from heat and stop using the knob if springs
    crack or the nut begins to spin.
  parts:
  - knob
  hardware:
  - nut
  tool: null
