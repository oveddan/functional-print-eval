task: nut-knob/M3
note: One-piece, approximately 20 mm hand knob with a captive ISO 4032 M3 nut. Three
  integral spring catches retain the nut independently of the hex pocket's torque-transmitting
  flats. Nominal nut dimensions are used because measurement was unavailable. Print
  and test the small coupon first; it is not part of the finished assembly. Fit is
  not verified until that test passes.
questions:
- text: Actual nut across-flats width and thickness?
  answer: Unable to measure; use best judgment.
