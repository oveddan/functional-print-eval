task: nut-knob/M3
note: 'One-piece, approximately 20 mm hand knob for an ISO 4032 M3 nut. Insert the
  nut from the open pocket side; the bolt passes through the nut and the smaller hole
  on the opposite side. Six small crush ribs provide friction retention, while the
  hex pocket transmits torque. Print the fit strip first: hand insertion and upside-down
  retention must be verified on this printer, not assumed from nominal dimensions.
  The coupon is not part of the finished assembly.'
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats.
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: M3 nominal major diameter; use the user's intended M3 bolt.
  knob_d:
    value: 20
    unit: mm
