parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    def hexwire(af, z):\n        r = af / math.sqrt(3)\n\
    \        pts = [(r*math.cos(math.radians(60*i)), r*math.sin(math.radians(60*i)))\
    \ for i in range(6)]\n        return cq.Workplane('XY').workplane(offset=z).polyline(pts).close()\n\
    \    def hx(af, z, h):\n        return hexwire(af,z).extrude(h)\n    af = p.nut_af\
    \ + p.socket_clearance\n    outer = af + 2*p.wall_t\n    lip = p.nut_af - p.lip_interference\n\
    \    entry = p.nut_af + p.entry_clearance\n    e = p.cut_extra\n    body = cq.Workplane('XY').circle(p.knob_d/2).extrude(p.knob_h)\n\
    \    moat = cq.Workplane('XY').workplane(offset=p.floor_h).circle(p.moat_r).extrude(p.knob_h-p.floor_h+e)\n\
    \    moat = moat.cut(hx(outer,p.floor_h-e,p.knob_h-p.floor_h+3*e))\n    body =\
    \ body.cut(moat)\n    body = body.cut(hx(af,p.floor_h,p.lip_z-p.floor_h))\n  \
    \  body = body.cut(hx(lip,p.lip_z,p.lip_h))\n    r1 = lip/math.sqrt(3)\n    r2\
    \ = entry/math.sqrt(3)\n    pts1 = [(r1*math.cos(math.radians(60*i)),r1*math.sin(math.radians(60*i)))\
    \ for i in range(6)]\n    pts2 = [(r2*math.cos(math.radians(60*i)),r2*math.sin(math.radians(60*i)))\
    \ for i in range(6)]\n    lead = cq.Workplane('XY').workplane(offset=p.lip_z+p.lip_h).polyline(pts1).close().workplane(offset=p.lead_h).polyline(pts2).close().loft(combine=True)\n\
    \    body = body.cut(lead)\n    top = p.lip_z+p.lip_h+p.lead_h\n    body = body.cut(hx(entry,top,p.knob_h-top+e))\n\
    \    length = p.moat_r+p.slit_overrun-p.slit_start_r\n    for i in range(int(p.finger_count)):\n\
    \        slot = cq.Workplane('XY').box(length,p.slit_w,p.knob_h-p.floor_h+e,centered=(True,True,False)).translate((p.slit_start_r+length/2,0,p.floor_h)).rotate((0,0,0),(0,0,1),360*i/p.finger_count)\n\
    \        body = body.cut(slot)\n    bore = cq.Workplane('XY').workplane(offset=-e).circle((p.bolt_d+p.bore_clearance)/2).extrude(p.knob_h+2*e)\n\
    \    body = body.cut(bore)\n    for i in range(int(p.grip_count)):\n        a\
    \ = 2*math.pi*i/p.grip_count\n        scallop = cq.Workplane('XY').workplane(offset=-e).center(p.knob_d/2*math.cos(a),p.knob_d/2*math.sin(a)).circle(p.grip_r).extrude(p.knob_h+2*e)\n\
    \        body = body.cut(scallop)\n    return body\n"
  print_orientation: Flat, closed annular underside on the bed at z=0; socket and
    relief slots open upward. No supports in the socket or moat.
  use_orientation: Press the nut into the open top at z=8. Seated nut bottom is at
    z=2. Bolt runs along the central Z axis.
- id: socket_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    def hx(af,z,h):\n        r=af/math.sqrt(3)\n\
    \        pts=[(r*math.cos(math.radians(60*i)),r*math.sin(math.radians(60*i)))\
    \ for i in range(6)]\n        return cq.Workplane('XY').workplane(offset=z).polyline(pts).close().extrude(h)\n\
    \    af=p.nut_af+p.socket_clearance\n    outer=af+2*p.wall_t\n    lip=p.nut_af-p.lip_interference\n\
    \    entry=p.nut_af+p.entry_clearance\n    e=p.cut_extra\n    body=cq.Workplane('XY').circle(p.coupon_d/2).extrude(p.knob_h)\n\
    \    moat=cq.Workplane('XY').workplane(offset=p.floor_h).circle(p.moat_r).extrude(p.knob_h-p.floor_h+e)\n\
    \    body=body.cut(moat.cut(hx(outer,p.floor_h-e,p.knob_h-p.floor_h+3*e)))\n \
    \   body=body.cut(hx(af,p.floor_h,p.lip_z-p.floor_h))\n    body=body.cut(hx(lip,p.lip_z,p.lip_h))\n\
    \    pts1=[(lip/math.sqrt(3)*math.cos(math.radians(60*i)),lip/math.sqrt(3)*math.sin(math.radians(60*i)))\
    \ for i in range(6)]\n    pts2=[(entry/math.sqrt(3)*math.cos(math.radians(60*i)),entry/math.sqrt(3)*math.sin(math.radians(60*i)))\
    \ for i in range(6)]\n    lead=cq.Workplane('XY').workplane(offset=p.lip_z+p.lip_h).polyline(pts1).close().workplane(offset=p.lead_h).polyline(pts2).close().loft(combine=True)\n\
    \    body=body.cut(lead)\n    top=p.lip_z+p.lip_h+p.lead_h\n    body=body.cut(hx(entry,top,p.knob_h-top+e))\n\
    \    length=p.moat_r+p.slit_overrun-p.slit_start_r\n    for i in range(int(p.finger_count)):\n\
    \        slot=cq.Workplane('XY').box(length,p.slit_w,p.knob_h-p.floor_h+e,centered=(True,True,False)).translate((p.slit_start_r+length/2,0,p.floor_h)).rotate((0,0,0),(0,0,1),360*i/p.finger_count)\n\
    \        body=body.cut(slot)\n    return body.cut(cq.Workplane('XY').workplane(offset=-e).circle((p.bolt_d+p.bore_clearance)/2).extrude(p.knob_h+2*e))\n"
  print_orientation: Flat underside at z=0 on bed; socket open upward, no supports.
  use_orientation: Same nut insertion and bolt direction as knob. Coupon is a separate
    test print, not a component of the finished knob.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
- id: bolt
  ref: ISO 4762 M3x16
  qty: 1
joints:
- id: thread_connection
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: 3.5 mm central through-bore; head is external to the knob
    role: clearance
  - part: knob
    feature: Split hexagonal socket captures the M3 nut above the solid floor
    role: nut_pocket
  nut: nut
  external: null
criteria:
- id: hand_snap_fit
  part: knob
  feature: Six compliant walls and chamfered retaining lips
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - socket_clearance
  - wall_t
  - lip_interference
  - lip_z
  - slit_w
  check:
    method: coupon
    ref: socket_coupon
    description: 'Nut must press in with firm thumb pressure only, without cracked
      or whitened fingers. Invert and gently shake: nut must remain inside. A little
      axial rattle is acceptable.'
- id: nut_seated
  part: knob
  feature: Hex socket above the solid 2 mm floor
  relation: seats
  hardware: nut
  clearance_mm: null
  params:
  - nut_h
  - nut_af
  - floor_h
  - lip_z
  - knob_h
  - socket_clearance
  check:
    method: coupon
    ref: socket_coupon
    description: Verify nut is below the top face, lies flat on the floor, and does
      not rotate freely when a bolt is gently turned. Nominal seated nut top is z=4.4
      mm; lip underside is z=6.2 mm.
- id: floor_stop
  part: knob
  feature: Solid floor with central bore smaller than the nut
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - floor_h
  - bolt_d
  - bore_clearance
  - nut_af
  check:
    method: coupon
    ref: socket_coupon
    description: Apply finger pressure from the entry side; nut cannot pass through
      the underside. Do not hammer.
- id: bolt_clearance
  part: knob
  feature: Central 3.5 mm axial bore
  relation: clears
  hardware: bolt
  clearance_mm: 0.25
  params:
  - bolt_d
  - bore_clearance
  check:
    method: coupon
    ref: socket_coupon
    description: Insert bolt from the flat underside. It must engage the nut by hand
      and emerge through the open top without rubbing the printed bore or spinning
      the nut.
manual:
- n: '1'
  text: Print socket_coupon in PLA at 0.2 mm layers with a 0.4 mm nozzle, 3 walls,
    5 top/bottom layers and 30% infill. Place the flat underside on the bed. Disable
    supports; keep the six slits and surrounding relief clear. Allow to cool before
    testing.
  parts:
  - socket_coupon
  hardware: []
  tool: null
- n: '2'
  text: Align the M3 nut's flats with the coupon's hex opening. Press straight down
    with your thumb until the nut passes the lips and reaches the floor. No hammer,
    pliers, glue or heated insertion. Stop if excessive force is needed or any finger
    whitens/cracks. The fit is intended to snap rather than be a rigid press fit.
  parts:
  - socket_coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: Invert and gently shake the coupon; the nut must stay inside. Confirm it cannot
    be pushed through the bottom. Insert the M3 bolt from the flat underside and screw
    it through the nut until its tip emerges on top, without bottoming the screw head
    hard. Check that the nut does not spin.
  parts:
  - socket_coupon
  hardware:
  - nut
  - bolt
  tool: null
- n: '4'
  text: If insertion is too stiff, reduce lip_interference by 0.10 mm and reprint
    the coupon. If the nut falls out, increase it by 0.10 mm and retest. If the nut
    binds below the lips, increase socket_clearance by 0.10 mm. Do not use a cracked
    test print or assume a failed coupon will work in the final part.
  parts:
  - socket_coupon
  hardware: []
  tool: null
- n: '5'
  text: Recover the nut for the final knob by gently spreading the coupon's flexible
    segments and lifting the nut with the loosely threaded bolt; if necessary sacrifice
    the coupon rather than force the nut. Print knob with the same successful parameters
    and print settings. It is the only printed piece in the finished assembly.
  parts:
  - socket_coupon
  - knob
  hardware:
  - nut
  - bolt
  tool: null
- n: '6'
  text: Press the nut into knob as tested, then repeat the inversion and bolt-through
    checks. Use the knob as a captive-nut hand fastener, with its flat underside against
    the work and the bolt extending through its centre. The listed 16 mm bolt is for
    the functional check; application bolt length depends on your assembly. Tighten
    with fingers only and stop when snug. Keep PLA away from heat; replace the knob
    if its socket cracks or the nut becomes loose enough to escape.
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: null
