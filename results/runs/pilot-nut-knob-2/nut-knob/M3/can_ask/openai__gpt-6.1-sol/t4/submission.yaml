task: nut-knob/M3
note: 'One-piece, approximately 20 mm hand knob with a captive M3 nut. Six flexible
  socket segments retain the nut mechanically; a solid floor prevents it leaving the
  opposite face. The central clearance hole lets the bolt pass through. Nut dimensions
  are catalog nominal because measurement was unavailable. Print and check the coupon
  first: hand insertion and retention cannot be guaranteed without testing the actual
  nut/printer combination. Some axial play inside the socket is intentional. Suitable
  for light hand tightening, not a calibrated torque knob.'
questions:
- text: Can you measure your nut across flats and its thickness?
  answer: Cannot measure; use best judgment.
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 nominal across flats.
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
  knob_h:
    value: 8
    unit: mm
    kind: design
    source: design
    note: ''
  floor_h:
    value: 2
    unit: mm
    kind: design
    source: design
    note: ''
  bore_clearance:
