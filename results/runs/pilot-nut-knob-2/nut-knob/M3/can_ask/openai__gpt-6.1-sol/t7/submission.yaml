task: nut-knob/M3
note: 'One-piece, approximately 20 mm hand knob with six integral flexible nut-retaining
  fingers. The M3 nut is recessed inside the top opening and rests on a solid pedestal;
  a through-hole lets the bolt emerge through the opposite face. No glue, inserts,
  or separate printed retainers. Actual hand-press fit must be checked on your printer:
  nominal nut dimensions cannot guarantee retention without a trial print.'
questions:
- text: Can you measure the actual nut across flats and its thickness?
  answer: Cannot measure; use best judgment. Nominal ISO 4032 M3 dimensions used.
