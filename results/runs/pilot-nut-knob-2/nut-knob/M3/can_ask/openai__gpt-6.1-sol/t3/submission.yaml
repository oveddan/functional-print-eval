parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    e=p.boolean_extra\n    def pts(af):\n \
    \       r=af/math.sqrt(3)\n        return [(r*math.cos(math.radians(30+60*i)),r*math.sin(math.radians(30+60*i)))\
    \ for i in range(6)]\n    b=cq.Workplane('XY').circle(p.knob_d/2).extrude(p.knob_h)\n\
    \    for i in range(p.flute_count):\n        a=2*math.pi*i/p.flute_count\n   \
    \     b=b.cut(cq.Workplane('XY').center(p.flute_center_r*math.cos(a),p.flute_center_r*math.sin(a)).circle(p.flute_r).extrude(p.knob_h+e))\n\
    \    b=b.cut(cq.Workplane('XY').workplane(offset=p.floor_h).polyline(pts(p.nut_af+p.pocket_clearance)).close().extrude(p.knob_h-p.floor_h+e))\n\
    \    rc=p.nut_af/2-p.nut_interference/2+p.rib_r\n    for i in range(6):\n    \
    \    a=math.radians(60*i)\n        b=b.union(cq.Workplane('XY').workplane(offset=p.floor_h-e).center(rc*math.cos(a),rc*math.sin(a)).circle(p.rib_r).extrude(p.knob_h-p.floor_h+e))\n\
    \    entry=cq.Workplane('XY').workplane(offset=p.knob_h-p.entry_h).polyline(pts(p.nut_af-p.nut_interference)).close().workplane(offset=p.entry_h).polyline(pts(p.nut_af+p.pocket_clearance+p.entry_extra_af)).close().loft(combine=True)\n\
    \    b=b.cut(entry)\n    return b.cut(cq.Workplane('XY').workplane(offset=-e).circle((p.bolt_d+p.bolt_clearance)/2).extrude(p.knob_h+2*e))\n"
  print_orientation: Flat closed back on bed at z=0; nut pocket upward. No supports.
  use_orientation: Bolt passes through closed back, through captive nut, and out open
    face.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    e=p.boolean_extra\n    def pts(af):\n \
    \       r=af/math.sqrt(3)\n        return [(r*math.cos(math.radians(30+60*i)),r*math.sin(math.radians(30+60*i)))\
    \ for i in range(6)]\n    def socket(interference):\n        b=cq.Workplane('XY').circle(p.knob_d/2).extrude(p.knob_h)\n\
    \        for i in range(p.flute_count):\n            a=2*math.pi*i/p.flute_count\n\
    \            b=b.cut(cq.Workplane('XY').center(p.flute_center_r*math.cos(a),p.flute_center_r*math.sin(a)).circle(p.flute_r).extrude(p.knob_h+e))\n\
    \        b=b.cut(cq.Workplane('XY').workplane(offset=p.floor_h).polyline(pts(p.nut_af+p.pocket_clearance)).close().extrude(p.knob_h-p.floor_h+e))\n\
    \        rc=p.nut_af/2-interference/2+p.rib_r\n        for i in range(6):\n  \
    \          a=math.radians(60*i)\n            b=b.union(cq.Workplane('XY').workplane(offset=p.floor_h-e).center(rc*math.cos(a),rc*math.sin(a)).circle(p.rib_r).extrude(p.knob_h-p.floor_h+e))\n\
    \        entry=cq.Workplane('XY').workplane(offset=p.knob_h-p.entry_h).polyline(pts(p.nut_af-interference)).close().workplane(offset=p.entry_h).polyline(pts(p.nut_af+p.pocket_clearance+p.entry_extra_af)).close().loft(combine=True)\n\
    \        b=b.cut(entry)\n        return b.cut(cq.Workplane('XY').workplane(offset=-e).circle((p.bolt_d+p.bolt_clearance)/2).extrude(p.knob_h+2*e))\n\
    \    result=cq.Workplane('XY').box(2*p.coupon_spacing,p.coupon_link_w,p.floor_h,centered=(True,True,False))\n\
    \    for j in range(3):\n        x=(j-1)*p.coupon_spacing\n        result=result.union(socket(p.nut_interference+(j-1)*p.coupon_step).translate((x,0,0)))\n\
    \        for k in range(j+1):\n            dx=(k-j/2)*p.coupon_dot_spacing\n \
    \           result=result.union(cq.Workplane('XY').workplane(offset=p.knob_h).center(x+dx,p.coupon_dot_y).circle(p.coupon_dot_r).extrude(p.coupon_dot_h))\n\
    \    return result\n"
  print_orientation: Flat backs and linking strip on bed at z=0; pockets and dots
    upward. No supports.
  use_orientation: Test only; not part of finished assembly. One, two and three dots
    mark increasing rib interference.
