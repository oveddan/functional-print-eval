    method: coupon
    ref: fit_coupon
    description: Bolt passes through back and threads into nut by hand without cross-threading.
manual:
- n: '1'
  text: Print fit_coupon in PLA at 0.2 mm layers, 4 walls, 5 top/bottom layers and
    30% infill, without supports. Use identical filament profile and hole compensation
    for final knob.
  parts:
  - fit_coupon
  hardware: []
  tool: 3D printer
- n: '2'
  text: Align nut flats with one-dot pocket and press straight in with your thumb
    until seated. No hammer or pliers. Check recess, invert over a tray and shake
    gently. If loose, try two dots then three. Select least-tight fit that retains
    nut and prevents rotation under light hand tightening. For removal, first unthread
    bolt, then gently push the nut out through the back hole using the bolt tip; do
    not strike it.
  parts:
  - fit_coupon
  hardware:
  - nut
  - bolt
  tool: null
- n: '3'
  text: Default one-dot, two-dot and three-dot interference values are 0.05, 0.15
    and 0.25 mm. Set nut_interference to selected value before generating knob. If
    no socket passes, shift coupon range in 0.10 mm increments and retest instead
    of forcing the nut. Coupon values always equal nut_interference minus coupon_step,
    nut_interference, and nut_interference plus coupon_step.
  parts:
  - fit_coupon
  - knob
  hardware: []
  tool: null
- n: '4'
  text: Print knob closed-back-down with identical settings. Clear loose strings without
    filing ribs. Hand-press nut fully onto floor, flats aligned. Verify it is fully
    recessed and stays captured upside down. Stop if excessive force is needed. No
    glue or heat is needed.
  parts:
  - knob
  hardware:
  - nut
  tool: 3D printer
- n: '5'
  text: For a function check, pass M3x16 bolt through closed back and thread through
    nut so it emerges from open face. In use, hold bolt against rotation and turn
    knob. This is a captive-nut thumb knob, not a bolt-head driver; it does not lock
    the nut onto the bolt. Use light finger-tight loads only and keep PLA away from
    heat. Repeated nut removal can wear the crush ribs.
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: null
