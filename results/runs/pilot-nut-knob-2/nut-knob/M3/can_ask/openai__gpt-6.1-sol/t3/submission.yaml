task: nut-knob/M3
note: One-piece 20 mm captive-nut knob. Six crush ribs retain the nut without glue;
  a solid floor prevents push-through. Nut dimensions are catalog values because measurement
  was unavailable. Test hand insertion and upside-down retention using the coupon
  before printing the final knob. Physical fit has not been verified.
