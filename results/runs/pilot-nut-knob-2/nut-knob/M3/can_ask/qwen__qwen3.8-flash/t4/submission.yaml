parts:
- id: knob_m3
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    import math\n    R = p.knob_d / 2.0\n    H = p.knob_h\n\
    \    rt = R - p.top_chamfer\n    z1 = p.floor_h                      # nut seat:\
    \ top of the solid floor\n    zf = z1 + p.pocket_h                # top of the\
    \ hex pocket\n    zb = zf + p.funnel_h                # bottom of the straight\
    \ chamber\n    rb = p.bore_d / 2.0\n    rh = p.floor_hole_d / 2.0\n    abot =\
    \ p.pocket_af_bot / 2.0\n    atop = p.pocket_af_top / 2.0\n    rf = p.pocket_af_top\
    \ / math.sqrt(3.0)\n\n    # outer body + chamber, as a half-section revolved about\
    \ Z\n    prof = [(0.0, 0.0), (R, 0.0), (R, H - p.top_chamfer), (rt, H), (rb, H),\n\
    \            (rb, zb), (rf, zf), (atop, zf), (abot, z1), (rh, z1), (rh, 0.0)]\n\
    \    wp = cq.Workplane(\"XZ\").moveTo(prof[0][0], prof[0][1])\n    for q in prof[1:]:\n\
    \        wp = wp.lineTo(q[0], q[1])\n    body = wp.close().revolve(360).val()\n\
    \n    def hexslab(z, af, h, cx=0.0, cy=0.0):\n        rr = af / math.sqrt(3.0)\n\
    \        pts = [(cx + rr * math.cos(k * math.pi / 3.0),\n                cy +\
    \ rr * math.sin(k * math.pi / 3.0)) for k in range(6)]\n        w = cq.Workplane(\"\
    XY\").workplane(offset=z).moveTo(pts[0][0], pts[0][1])\n        for q in pts[1:]:\n\
    \            w = w.lineTo(q[0], q[1])\n        return w.close().extrude(h).val()\n\
    \n    # tapered hex nut pocket: tightest at the seat, just over the nut at the\
    \ top\n    ns = int(p.pocket_slabs)\n    hs = p.pocket_h / ns\n    span = p.pocket_af_top\
    \ - p.pocket_af_bot\n    for k in range(ns):\n        af = p.pocket_af_bot + span\
    \ * (k + 0.5) / ns\n        body = body.cut(hexslab(z1 + k * hs, af, hs + 0.01))\n\
    \n    # 12 vertical flutes for grip\n    n = int(p.flutes)\n    beta = math.pi\
    \ / n\n    amp = p.flute_depth\n    rr2 = (R * R + amp * amp + 2.0 * R * amp *\
    \ math.cos(beta)) / (4.0 * (R + amp) * math.cos(beta))\n    cc = R + amp - rr2\n\
    \    crad = rr2 + p.flute_slack\n    for k in range(n):\n        a = 2.0 * math.pi\
    \ * k / n\n        ring = cq.Workplane(\"XY\").center(cc * math.cos(a), cc * math.sin(a)).circle(crad).extrude(H\
    \ + 1.0)\n        body = body.cut(ring.val())\n    return body"
  print_orientation: 'Flat closed face (the one with the 3.4 mm hole) down on the
    bed, open mouth up, axis vertical. Nothing inside needs support: every internal
    surface opens upward.'
  use_orientation: Print as modelled, no rotation in the slicer; the z=0 face is the
    bed.
- id: nut_coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    import math\n    L, Wd, T = p.coupon_l, p.coupon_w, p.coupon_t\n\
    \    z0 = p.coupon_floor_h               # pocket floor\n    zf = z0 + p.coupon_pocket_h\
    \         # top of the tapered hex, start of the funnel\n    ns = int(p.pocket_slabs)\n\
    \    hs = p.coupon_pocket_h / ns\n    nf = 5\n    hf = (T - zf) / nf\n\n    def\
    \ hexslab(z, af, h, cx=0.0):\n        rr = af / math.sqrt(3.0)\n        pts =\
    \ [(cx + rr * math.cos(k * math.pi / 3.0),\n                rr * math.sin(k *\
    \ math.pi / 3.0)) for k in range(6)]\n        w = cq.Workplane(\"XY\").workplane(offset=z).moveTo(pts[0][0],\
    \ pts[0][1])\n        for q in pts[1:]:\n            w = w.lineTo(q[0], q[1])\n\
    \        return w.close().extrude(h).val()\n\n    plate = cq.Workplane(\"XY\"\
    ).box(L, Wd, T, centered=(True, True, False))\n    gauges = [p.pocket_af_bot +\
    \ p.gauge_step * i for i in range(4)]\n    xs = [-15.0, -5.0, 5.0, 15.0]\n   \
    \ for af0, cx in zip(gauges, xs):\n        for k in range(ns):\n            af\
    \ = af0 + p.pocket_taper * (k + 0.5) / ns\n            plate = plate.cut(hexslab(z0\
    \ + k * hs, af, hs + 0.01, cx))\n        rftop = (af0 + p.pocket_taper) / math.sqrt(3.0)\n\
    \        for j in range(nf):\n            r1 = rftop + p.coupon_funnel_r * (j\
    \ + 0.5) / nf\n            ring = cq.Workplane(\"XY\").workplane(offset=zf + j\
    \ * hf).center(cx, 0.0).circle(r1).extrude(hf + 0.01)\n            plate = plate.cut(ring.val())\n\
    \        push = cq.Workplane(\"XY\").center(cx, 0.0).circle(p.floor_hole_d / 2.0).extrude(z0\
    \ + 0.01)\n        plate = plate.cut(push.val())\n    tab = cq.Workplane(\"XY\"\
    ).workplane(offset=T).center(-L / 2.0 + p.marker_inset_x, 0.0).circle(p.marker_r).extrude(p.marker_h)\n\
    \    plate = plate.union(tab.val())\n    return plate.val()"
  print_orientation: Flat base down on the bed, pockets and their funnels facing up;
    no supports.
  use_orientation: Print as modelled, no rotation in the slicer.
hardware:
- id: m3_nut
  ref: ISO 4032 M3
  qty: 1
- id: m3_bolt
  ref: ISO 4762 M3x16
  qty: 1
joints:
- id: nut_trapped_in_knob
  fastener: m3_nut
  axis_origin:
  - 0.0
  - 0.0
  - 3.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob_m3
    feature: nut_pocket
    role: insert
  - part: knob_m3
    feature: floor_shelf
    role: head_seat
  nut: null
  external: 'nothing: the nut is press-fitted into the printed tapered hex pocket
    and is stopped from the far side by the 3.4 mm hole shelf'
- id: bolt_through_knob
  fastener: m3_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob_m3
    feature: floor_hole
    role: clearance
  - part: knob_m3
    feature: nut_pocket
    role: thread
  nut: m3_nut
  external: 'the M3 bolt being tightened: its tip enters through the 3.4 mm hole in
    the closed end, threads into the trapped nut, and may poke out of the mouth'
criteria:
- id: nut_press_fit
  part: knob_m3
  feature: nut_pocket
  relation: engages
  hardware: m3_nut
  clearance_mm: null
  params:
  - nut_af
  - pocket_af_bot
  - pocket_af_top
  - pocket_h
  - pocket_slabs
  check:
    method: coupon
    ref: nut_coupon
    description: 'Gauge A on the coupon (beside the raised dot) is the same tapered
      hex pocket as the knob, offset only by gauge_step. Press an M3 nut into gauge
      A: it should need firm thumb pressure, not fall out when the coupon is inverted
      and shaken, and still be pushable out from the underside with a 3 mm drift.
      If gauge A is loose, gauge B/C show the fit your printer is actually making.'
- id: nut_stays_in_upside_down
  part: knob_m3
  feature: nut_pocket
  relation: engages
  hardware: m3_nut
  clearance_mm: null
  params:
  - nut_af
  - pocket_af_bot
  - pocket_taper
  - pocket_h
  check:
    method: measure
    ref: null
    description: 'With the nut seated, hold the knob mouth-down over a bench and shake
      it: the nut must not move or drop. The wedged flanks (pocket 0.20 mm under the
      nut across flats at the seat) do this without glue.'
- id: nut_cannot_be_pushed_out_far_side
  part: knob_m3
  feature: floor_shelf
  relation: seats
  hardware: m3_nut
  clearance_mm: null
  params:
  - floor_hole_d
  - nut_af
  - floor_h
  check:
    method: none
    ref: null
    description: The pocket ends on a solid shelf around a 3.4 mm hole; the nut is
      5.5 mm across flats and 6.35 mm corner-to-corner, so it cannot pass. The shelf
      is 3.0 mm thick and is what carries the bolt's thrust.
- id: nut_fully_inside
  part: knob_m3
  feature: chamber
  relation: contains
  hardware: m3_nut
  clearance_mm: null
  params:
  - nut_h
  - pocket_h
  - funnel_h
  - bore_d
  - knob_h
  check:
    method: measure
    ref: null
    description: With the nut seated, its top face must be below the knob's top face
      - you should not be able to touch the nut with a fingertip. The pocket is 2.7
      mm deep for a 2.4 mm nut and its top sits 12.3 mm below the rim.
- id: bolt_clears_floor_hole
  part: knob_m3
  feature: floor_hole
  relation: clears
  hardware: m3_bolt
  clearance_mm: 0.4
  params:
  - floor_hole_d
  - bolt_d
  check:
    method: none
    ref: null
    description: '3.4 mm hole for a 3.0 mm M3 shaft: the bolt passes through the nut
      and out the closed end.'
- id: head_and_nut_clear_mouth
  part: knob_m3
  feature: chamber
  relation: clears
  hardware: m3_nut
  clearance_mm: 0.5
  params:
  - bore_d
  - nut_corner_d
  - bolt_head_d
  check:
    method: none
    ref: null
    description: 'Mouth and chamber are 7.4 mm: the nut (6.35 mm corner-to-corner)
      and an M3 head (5.5 mm) both pass down it.'
- id: grip_diameter
  part: knob_m3
  feature: grip_flutes
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - knob_d
  - flute_depth
  - flutes
  check:
    method: none
    ref: null
    description: 20 mm across the flute crests, 18 mm across the valleys, 12 flutes
      over the full height - about 20 mm across as asked.
- id: coupon_gauge_a
  part: nut_coupon
  feature: gauge_a
  relation: engages
  hardware: m3_nut
  clearance_mm: null
  params:
  - pocket_af_bot
  - pocket_taper
  - gauge_step
  check:
    method: coupon
    ref: nut_coupon
    description: Four tapered hex pockets, 5.30 / 5.42 / 5.54 / 5.66 mm across flats
      at the floor, each over a 3.4 mm push-out hole, in a 46 x 16 x 8 mm plate. The
      raised dot marks the tightest (gauge A), which matches the knob.
manual:
- n: '1'
  text: 'Print both parts in the same PLA batch, on the same printer and settings:
    knob_m3 stands on its flat closed face (the face with the small hole) with the
    open mouth up; nut_coupon stands on its flat base with the four pockets up. Neither
    needs supports, rafts or the AMS - print them together in one plate so the coupon
    tests the same print conditions as the knob.'
  parts:
  - knob_m3
  - nut_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Read the coupon: it has four tapered hex pockets in a row, each 3.0 mm deep
    over a 3.4 mm hole. The raised dot on the top face marks the tightest one (gauge
    A, 5.30 mm across flats at the floor). Gauges B, C and D are 0.12 mm looser each,
    and gauge A is exactly the pocket shape used in the knob.'
  parts:
  - nut_coupon
  hardware:
  - m3_nut
  tool: null
- n: '3'
  text: Press an M3 hex nut into gauge A with your thumb. You want firm resistance
    - the nut should have to be pushed, and should stay put when you turn the coupon
    upside down and shake it. Push a 3 mm drift or a spare M3 bolt up through the
    3.4 mm hole under the pocket to get the nut back out, then try the other gauges
    so you can see the trend. If even gauge A grips, the knob's pocket will hold;
    the pocket is tapered, so the nut always stops itself at whatever depth your printer's
    fit allows.
  parts:
  - nut_coupon
  hardware:
  - m3_nut
  tool: 3 mm drift or a spare M3 bolt
- n: '4'
  text: Seat the nut in the knob. Hold the knob mouth up and drop the M3 hex nut into
    the opening, flat face down; it falls through the 7.4 mm chamber, the conical
    lead-in squares it up with the hex pocket, and it wedges into the tapered pocket.
    Push it home with your thumb.
  parts:
  - knob_m3
  hardware:
  - m3_nut
  tool: null
- n: '5'
  text: 'If the nut needs more force than your thumb gives, use the bolt as a punch:
    thread the nut onto an M3 bolt, hold the bolt upright above the mouth and let
    the nut hang down into the chamber, then press the knob down onto the nut with
    the bolt head (5.5 mm, it fits easily down the 7.4 mm mouth) while the knob stands
    on a bench. Let the bolt unscrew and lift it out. Stop when the nut''s top face
    is below the rim - do not force it past the point where it stops on its own.'
  parts:
  - knob_m3
  hardware:
  - m3_nut
  - m3_bolt
  tool: M3 bolt used as a punch
- n: '6'
  text: 'Check the capture two ways: turn the knob mouth-down over a bench and shake
    it - the nut must not shift or fall; then look into the mouth - the nut must sit
    below the rim, fully inside. The nut can never be pushed out through the closed
    end, because the 3.4 mm hole there is far smaller than the nut.'
  parts:
  - knob_m3
  hardware:
  - m3_nut
  tool: null
- n: '7'
  text: 'To use it: the bolt should stand with its tip pointing at the knob''s closed
    end (head and work on the other side), protruding at least 4 mm. Place the knob
    over the tip so the shaft goes through the 3.4 mm hole and into the trapped nut,
    then turn the knob with your fingers on the flutes to tighten. The closed face
    bears on the work, so the bolt''s thrust is taken by the printed floor, not by
    the nut''s friction.'
  parts:
  - knob_m3
  hardware:
  - m3_bolt
  tool: null
- n: '8'
  text: To take the nut out, rest the knob on a bench mouth-down and tap the closed
    end, or push the nut out with the same 3 mm drift through the hole. PLA creeps
    and softens around 60 C, so if the fit loosens with heat, press the nut back down
    with the bolt head; keep the knob out of a hot car.
  parts:
  - knob_m3
  hardware:
  - m3_nut
  tool: 3 mm drift
