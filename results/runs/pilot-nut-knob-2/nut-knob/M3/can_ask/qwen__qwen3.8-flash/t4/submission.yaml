task: nut-knob/M3
note: 'One printed knob, 20 mm across the flute crests x 18 mm tall, 12 vertical flutes
  for grip. Inside, from the closed end up: 3.0 mm solid floor with a 3.4 mm hole
  (this is the far-side stop - the M3 shaft passes, the 5.5 mm nut never can), a tapered
  hex nut pocket 2.7 mm deep that opens from 5.30 mm across flats at the seat to 5.55
  mm at its top, a 1.0 mm conical lead-in, and a 7.4 mm chamber/mouth that lets the
  nut (and an M3 head) down. The taper is the trick: the nut slides in freely at the
  top and wedges itself tighter the deeper it goes, so it stops at whatever interference
  your printer actually produces - retention is a press fit on six flanks over ~2.4
  mm, no glue, and the nut still sits below the rim. Every internal surface opens
  upward, so a mouth-up print needs no supports at all. A 46 x 16 x 8 mm coupon carries
  four gauge pockets (5.30 / 5.42 / 5.54 / 5.66 at the floor) plus 3.4 mm push-out
  holes; the tightest matches the knob and is marked with a raised dot, so the fit
  can be confirmed before the knob is relied on. A printed flexible snap was designed
  and then rejected - see the limitation note.'
