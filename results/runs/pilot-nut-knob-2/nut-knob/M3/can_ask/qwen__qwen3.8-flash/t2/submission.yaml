criteria:
- id: nut_retained_no_glue
  part: knob
  feature: pinch_band
  relation: engages
  hardware: nut_m3
  clearance_mm: null
  params:
  - nut_af
  - pinch_af
  - pinch_depth
  - nut_h
  check:
    method: coupon
    ref: coupon
    description: 'Press an M3 nut into the coupon''s CENTRE pocket (5.35, same size
      as the knob''s pinch band): it needs firm thumb pressure and must stay in when
      the coupon is turned upside down and shaken.'
- id: nut_cannot_be_pushed_out
  part: knob
  feature: bolt_bore
  relation: clears
  hardware: nut_m3
  clearance_mm: 0.9
  params:
  - bore_d
  - nut_af
  check:
    method: measure
    ref: null
    description: Calipers across the top bore read ~3.7 mm - 1.8 mm smaller than the
      nut across flats - so the nut can never pass through the far side.
- id: nut_seats_home
  part: knob
  feature: nut_ceiling
  relation: supports
  hardware: nut_m3
  clearance_mm: null
  params:
  - funnel_depth
  - pocket_depth
  - pinch_depth
  - nut_h
  check:
    method: measure
    ref: null
    description: Pressed fully home, the nut's top face bears on the flat ceiling
      3.2 mm from the mouth rim and its bottom face sits ~0.8 mm below the rim, i.e.
      the nut is entirely inside the knob.
- id: bolt_runs_out
  part: knob
  feature: bolt_bore
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - bore_d
  - bolt_d
  check:
    method: measure
    ref: null
    description: Before the nut is fitted, the user's M3 bolt should slide through
      the bore from the mouth side and protrude out of the top face without rubbing
      (3.7 bore vs 3.0 thread = 0.35 mm per side).
- id: grip_across
  part: knob
  feature: flutes
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - knob_dia
  - flute_center_radius
  - flute_radius
  check:
    method: measure
    ref: null
    description: ~20 mm across the flute crests, ~18.4 mm across the grooves - the
      grooves are where the fingers sit.
manual:
- n: '1'
  text: 'Print both parts in black PLA: 0.2 mm layers, 0.4 mm nozzle, 20-25% rectilinear
    infill (a hand knob wants to be hefty, not light). The KNOB prints mouth-down,
    axis vertical, NO supports - every internal face is either a vertical wall or
    a ceiling that builds on the layer below. The COUPON prints flat with its holes
    facing up, no supports. They fit on the bed together.'
  parts:
  - knob
  - coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Check the press fit before you touch the knob. Press an M3 nut into each
    hole of the coupon, holding it with the notched corner at your left: left = 5.25,
    centre = 5.35, right = 5.45 across flats. The centre hole is exactly the size
    of the knob''s pinch band. Turn the coupon upside down and shake it - the nut
    in the centre hole must not drop out. If the 5.45 one drops out, that''s expected.'
  parts:
  - coupon
  hardware:
  - nut_m3
  tool: hands
- n: '3'
  text: 'Fit the nut to the knob. Drop it into the open mouth: the lead-in funnel
    is round and 7.6->6.8 mm, wider than the nut''s corners, so it goes in at any
    rotation and stops about 1 mm down. Give the nut a quarter turn until its flats
    line up with the hex pocket - it drops a little deeper - then press it home: lay
    the knob on its back on a bench and push the nut in with your thumb, or press
    the knob down over a nut standing on the bench. You''ll feel it snap past the
    pinch band. It is home when the nut''s top face hits the internal ceiling; the
    nut''s outer face then sits about 0.8 mm below the mouth rim, completely inside
    the knob, nothing proud.'
  parts:
  - knob
  hardware:
  - nut_m3
  tool: bench + thumb
- n: '4'
  text: 'Retention test: grip the knob by its top face, mouth pointing down, and shake
    it. The nut must stay in - the pinch band grips its flats over 1.2 mm of the nut''s
    height, and those same flats are what carry your turning torque.'
  parts:
  - knob
  hardware:
  - nut_m3
  tool: null
- n: '5'
  text: 'Use it like a wingnut: slide the knob onto the M3 bolt with the mouth facing
    the bolt head / workpiece and turn clockwise. As you tighten, the bolt screws
    into the captive nut and its tip comes out through the 3.7 mm hole in the top
    of the knob - that is normal, and it also tells you how much thread is left before
    the bolt runs out. Hand torque only: PLA creeps under sustained load, so don''t
    finish the joint with pliers.'
  parts:
  - knob
  hardware: []
  tool: fingers
- n: '6'
  text: 'Tuning, no glue needed. If the nut won''t go in, or if it feels loose in
    step 4: soak the knob in hot tap water (60-70 C) for a minute to soften the pinch
    band, press the nut home, then plunge the knob in cold water for 30 s - the plastic
    springs back onto the flats and locks the nut in. To remove the nut, repeat the
    hot soak and push it back out through the mouth against a bench.'
  parts:
  - knob
  hardware:
  - nut_m3
  tool: hot water, cold water
