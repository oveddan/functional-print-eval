task: nut-knob/M3
note: 'One printed piece, 20 mm across x 18 mm tall, 12 vertical finger flutes, printed
  mouth-down with no supports (the nut pocket walls are vertical, the ceiling stacks
  on the layer below, and the bolt bore is a plain vertical hole through solid above
  it). Internal stack from the mouth: 1.0 mm round lead-in (7.6->6.8 dia, wider than
  the nut''s 6.35 across corners so the nut can be dropped in at any rotation) ->
  1.0 mm loose hex guide (5.75 across flats) -> 1.2 mm hex pinch band at 5.35 across
  flats, in the same hex phase, which is the press fit that holds the nut when the
  knob is inverted -> a flat ceiling 3.2 mm from the mouth with a 3.7 mm bolt bore
  running out through the top face. The ISO 4032 M3 nut (2.4 thick) therefore sits
  fully inside, ~0.8 mm below the rim, gripped over its upper 1.2 mm; the ceiling''s
  3.7 mm hole is 1.8 mm smaller than the nut''s flats so the nut can never be pushed
  out through the far side, and the bolt passes through the nut and out the other
  side. Since neither the nut nor the bolt could be measured, fastener dimensions
  come from ISO 4032 / M3 catalog values, and the single retention parameter (pinch_af
  = 5.35) is mirrored in the printed coupon (5.25 / 5.35 / 5.45) so the press fit
  can be checked before the knob is committed; step 6 gives a glue-free heat-staking
  remedy if a printer runs over or under.'
questions: []
params:
  bore_d:
    value: 3.7
    unit: mm
    kind: design
    source: design
    note: M3 clearance so the bolt tip runs out; 3.7 << 5.5 so the nut cannot be pushed
      through it
  bolt_d:
    value: 3.0
