      plus printed-pocket shrinkage. Mirrors the coupon''s centre pocket'
  pinch_depth:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: grips the upper 1.2 mm of the nut's 2.4 mm height
  pocket_af:
    value: 5.75
    unit: mm
    kind: design
    source: design
    note: loose hex guide, 0.125 mm/side clearance
  pocket_depth:
    value: 1
