      5 layers - the insertion cam
  tooth_top_z:
    value: 10.4
    unit: mm
    kind: design
    source: design
    note: arm material stops 0.8 mm below the pocket floor so the tip is free
  foot_in_r:
    value: 4.9
    unit: mm
    kind: design
    source: design
    note: ''
  foot_out_r:
    value: 7.2
    unit: mm
    kind: design
    source: design
    note: arm foot, keyed into the wall around the well
  flute_n:
    value: 12
    unit: count
    kind: design
    source: design
    note: grip scallops; 12 matches the arms' 3-fold symmetry
  flute_cutter_r:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: ''
  flute_pitch_r:
    value: 12.2
    unit: mm
    kind: design
    source: design
    note: valleys at r=9.2, i.e. 0.8 mm deep grooves in the crest
  flute_z0:
    value: 1.6
    unit: mm
    kind: design
    source: design
    note: plain band left at the base for bed adhesion
  coupon_tube_r:
    value: 7.4
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_pitch:
    value: 13.5
    unit: mm
    kind: design
    source: design
    note: 3 tubes, fused where they touch
  coupon_top_z:
    value: 14.5
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_off_tight:
    value: -0.15
    unit: mm
    kind: design
    source: design
    note: 'tightest barb aperture: 3.7 mm'
  coupon_off_loose:
