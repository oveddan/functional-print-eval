task: nut-knob/M3
note: 'One printed part. M3 hex nut (ISO 4032, 5.5 across flats x 2.4 thick) is captured
  in an internal hex pocket between two mechanical stops: (1) three cantilever spring
  arms rising from the mouth, each ending in a barb whose flat top face forms part
  of the pocket floor and whose inner face sits at 2.0 mm radius, i.e. a 4.0 mm aperture
  - 0.745 mm inside the nut''s flats - so the nut cannot come back out the mouth,
  and the stepped cone on each barb''s underside cams the arms aside as the nut is
  pushed in; (2) a 7 mm solid ceiling over the pocket pierced only by a 3.4 mm hole,
  so the nut cannot be pushed out through the far side and the M3 bolt goes through
  the nut and out the top. The nut is fully enclosed (mouth 6.9 mm admits it, 6.35
  across corners). Arms: 1.0 mm radial x 2.2 mm tangential section, ~9.4 mm free length,
  ~1.3% transient strain, ~9-10 N press-in and ~9 N pull-out, well above the 0.03
  N gravity load of the upside-down test; the hex pocket (5.8 across flats, 0.15 mm/side)
  carries the turning torque so the nut cannot spin. 12 grip scallops, 0.8 mm deep,
  cut Ø20 down to ~Ø18.4 in the valleys. Ø20 x 21 mm. Included is a 3-tube coupon
  (barb apertures 3.7 / 4.0 / 4.3 mm) because nobody could measure the real nut/bolt
  for me - nut and bolt dimensions are from the ISO catalog/datasheet only; bolt length
  and head size are assumed ISO 4762 M3. If the nut is a slightly oversized real nut,
  ledge_r (and the pocket) is the parameter to tune.'
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut, nominal across flats
  nut_ac:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: ISO 4032 M3 across corners (max); drives the mouth size
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 nut height; drives pocket depth
  bolt_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: datasheet
    note: M3 thread major diameter; must clear the barb aperture and the top hole
  bolt_head_d:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3 socket head diameter; sits on the counterbore shoulder inside
      the mouth
  knob_d:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: over the grip crests
  knob_h:
    value: 21.0
    unit: mm
    kind: design
    source: design
    note: ''
  well_d:
    value: 11.2
    unit: mm
    kind: design
    source: design
    note: internal bore that the arms stand in; gives the arms 1.2 mm of outward travel
      before touching the wall
  mouth_d:
    value: 6.9
    unit: mm
    kind: design
    source: design
    note: entry bore at z=0; passes the nut (6.35 across corners) and stops a bolt
      head from diving deep
  shoulder_z:
    value: 2.6
    unit: mm
    kind: design
    source: design
    note: top of the mouth counterbore; becomes the bolt-head seat
  ledge_z:
    value: 11.2
    unit: mm
    kind: design
    source: design
    note: barb top faces = pocket floor; sets the nut's axial stop
  pocket_af:
    value: 5.8
    unit: mm
    kind: design
    source: design
    note: hex pocket across flats (nut 5.5 + 0.3); reacts the turning torque
  pocket_depth:
    value: 2.55
    unit: mm
    kind: design
    source: design
    note: nut_h 2.4 + 0.15
  bore_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: 'far-side hole through the ceiling: passes M3, far too small for the nut'
  ledge_r:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: barb aperture radius (dia 4.0); 0.745 mm overlap on the nut's flats = snap
