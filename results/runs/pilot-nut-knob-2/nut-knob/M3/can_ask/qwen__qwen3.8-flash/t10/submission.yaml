criteria:
- id: nut_fully_inside
  part: knob
  feature: hex_pocket
  relation: seats
  hardware: nut_m3
  clearance_mm: null
  params:
  - pocket_af
  - pocket_depth
  - nut_af
  - nut_h
  check:
    method: coupon
    ref: coupon_snapfit
    description: In the middle coupon tube the nut must slide into the hex pocket
      and finish below the ceiling, fully enclosed, with no rotation in the pocket.
- id: retained_upside_down
  part: knob
  feature: barb_ledges
  relation: engages
  hardware: nut_m3
  clearance_mm: null
  params:
  - ledge_r
  - nut_af
  - ledge_z
  check:
    method: coupon
    ref: coupon_snapfit
    description: 'The three barb ledges (aperture 4.0 mm) overlap each nut flat by
      0.745 mm. Press a nut into each coupon tube, turn the tube upside down and shake:
      it must stay in. Pick the tube that snaps in firmly by thumb and still holds;
      if all three hold, use the knob as modelled.'
- id: farside_cannot_be_pushed_out
  part: knob
  feature: ceiling_shoulder
  relation: engages
  hardware: nut_m3
  clearance_mm: null
  params:
  - bore_d
  - nut_af
  check:
    method: measure
    ref: knob
    description: 'The hole through the pocket ceiling is 3.4 mm, less than the nut''s
      5.5 mm across flats, so the nut cannot be pushed out through the far side. Push
      hard on the nut''s top face with a screwdriver after assembly: it must not pass
      through.'
- id: bolt_passes_through
  part: knob
  feature: bolt_bore
  relation: clears
  hardware: bolt_m3
  clearance_mm: 0.4
  params:
  - bore_d
  - bolt_d
  check:
    method: measure
    ref: knob
    description: 'M3 shank (3.0) through the 3.4 mm ceiling hole: the tip must emerge
      from the top face with the nut fully seated.'
- id: mouth_admits_nut
  part: knob
  feature: mouth_bore
  relation: clears
  hardware: nut_m3
  clearance_mm: 0.55
  params:
  - mouth_d
  - nut_ac
  check:
    method: measure
    ref: knob
    description: 'Entry bore 6.9 mm vs nut 6.35 mm across corners: the nut must drop
      in from the mouth end without being forced as far as the barbs.'
- id: arm_travel
  part: knob
  feature: spring_arms
  relation: clears
  hardware: nut_m3
  clearance_mm: 0.5
  params:
  - well_d
  - shaft_out_r
  - ledge_r
  check:
    method: coupon
    ref: coupon_snapfit
    description: The arms must be able to spring outward ~0.8 mm without touching
      the well wall (shaft outer face 4.55 + 0.8 = 5.35 vs well radius 5.6). Press
      the nut in with a thumb; it should click, not bind.
- id: coupon_has_3_options
  part: coupon_snapfit
  feature: tube_B
  relation: seats
  hardware: nut_m3
  clearance_mm: null
  params:
  - coupon_off_tight
  - ledge_r
  - coupon_off_loose
  check:
    method: coupon
    ref: coupon_snapfit
    description: Three tubes, barb apertures 4.3 / 4.0 / 3.7 mm (left, middle, right).
      Print before the knob, or on the same plate, and report which is the tightest
      one you can still press a nut into by hand.
manual:
- n: '1'
  text: Print coupon_snapfit and knob together, or the coupon first. Both are printed
    standing on their mouth face (z=0 down), axes vertical, no supports. PLA, 0.2
    mm layers, default high-speed wall settings; leave the slicer's generated supports
    off but keep the brim/raft OFF for the coupon so its mouths stay open.
  parts:
  - coupon_snapfit
  - knob
  hardware: []
  tool: null
- n: '2'
  text: 'Snap test before you commit: push an M3 hex nut into the open (Ø6.9) end
    of each coupon tube - flat sides of the nut facing the three little teeth. Push
    square and firm with your thumb until it clicks home; the nut should finish just
    under the closed top, its tip poking through the small hole. Tube A is tightest
    (aperture 3.7 mm), C loosest (4.3 mm); B matches the knob (4.0 mm).'
  parts:
  - coupon_snapfit
  hardware:
  - nut_m3
  tool: thumb
- n: '3'
  text: Turn each coupon tube upside down and shake it. Pick the tightest tube that
    both snapped in by hand and holds the nut with no visible daylight between the
    teeth and the nut's flat sides. If only A holds and B/C let the nut drop out,
    tell me - the knob needs ledge_r reduced. If a tooth cracked on the way in, tell
    me which tube.
  parts:
  - coupon_snapfit
  hardware:
  - nut_m3
  tool: null
- n: '4'
  text: 'Press the M3 hex nut into the knob''s mouth the same way: the nut''s corners
    line up with the gaps between the three arms, so a quarter-turn of the nut may
    be needed before it starts. Push until it stops (nut bottom face on the three
    teeth, top face just under the closed end). Do not hammer it: it is a snap, ~10
    N.'
  parts:
  - knob
  hardware:
  - nut_m3
  tool: thumb
- n: '5'
  text: 'Verify the trap two ways: hold the knob upside down and shake it (the nut
    must stay in), then push hard on the nut''s top face through the small hole with
    a screwdriver tip (the nut must not be pushed out through the mouth). Both checks
    pass means the arms and the ceiling shoulder are doing their jobs.'
  parts:
  - knob
  hardware:
  - nut_m3
  tool: screwdriver
- n: '6'
  text: 'Use it: pass your M3 bolt tip-first through the mouth from the open end,
    start it into the trapped nut and turn the knob clockwise. The bolt''s head bears
    on the shoulder inside the mouth, the shank passes between the three teeth, and
    the tip comes out of the 3.4 mm hole in the top face - the bolt goes through the
    nut and out the far side, as asked.'
  parts:
  - knob
  hardware:
  - nut_m3
  - bolt_m3
  tool: null
- n: '7'
  text: 'This is a hand knob: use palm/finger torque only. If the nut creeps down
    towards the mouth when you push hard on the bolt, back off and take the tightest
    coupon setting instead.'
  parts:
  - knob
  hardware:
  - bolt_m3
  tool: null
