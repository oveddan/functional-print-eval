parts:
- id: knob
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    import math\n    R = p.knob_d/2.0\n    H = p.knob_h\n\
    \    lz = p.ledge_z\n    pt = lz + p.pocket_depth\n    mr = p.mouth_d/2.0\n  \
    \  wr = p.well_d/2.0\n    br = p.bore_d/2.0\n    root = p.arm_root_z\n\n    def\
    \ cyl(r, z0, h, cx=0.0, cy=0.0):\n        return cq.Workplane(\"XY\").workplane(offset=z0).center(cx,\
    \ cy).circle(r).extrude(h)\n\n    def slab(ang, z0, z1, s0, s1, tw, cx=0.0, cy=0.0):\n\
    \        a = math.radians(ang)\n        ux, uy = math.cos(a), math.sin(a)\n  \
    \      vx, vy = -math.sin(a), math.cos(a)\n        pts = [(s*ux + t*vx + cx, s*uy\
    \ + t*vy + cy)\n               for (s, t) in ((s0, -tw), (s1, -tw), (s1, tw),\
    \ (s0, tw))]\n        w = cq.Workplane(\"XY\").workplane(offset=z0).moveTo(pts[0][0],\
    \ pts[0][1])\n        for q in pts[1:]:\n            w = w.lineTo(q[0], q[1])\n\
    \        return w.close().extrude(z1 - z0)\n\n    body = cyl(R, 0.0, H)\n\n  \
    \  # 12 grip scallops, left plain for 1.6 mm at the base\n    for i in range(int(p.flute_n)):\n\
    \        a = 2.0*math.pi*i/float(p.flute_n)\n        body = body.cut(cyl(p.flute_cutter_r,\
    \ p.flute_z0, H - p.flute_z0 + 1.0,\n                            p.flute_pitch_r*math.cos(a),\
    \ p.flute_pitch_r*math.sin(a)))\n\n    # mouth counterbore, then the well, up\
    \ to the barb ledge plane\n    void = cyl(mr, 0.0, p.shoulder_z).union(cyl(wr,\
    \ p.shoulder_z, lz - p.shoulder_z))\n    body = body.cut(void)\n\n    # hex pocket:\
    \ apothem pocket_af/2, vertices on 0/60/120... so the flats face\n    # 90/210/330\
    \ deg - exactly the three arm directions\n    rc = p.pocket_af/math.sqrt(3.0)\n\
    \    hp = [(rc*math.cos(math.pi*i/3.0), rc*math.sin(math.pi*i/3.0)) for i in range(6)]\n\
    \    w = cq.Workplane(\"XY\").workplane(offset=lz).moveTo(hp[0][0], hp[0][1])\n\
    \    for q in hp[1:]:\n        w = w.lineTo(q[0], q[1])\n    body = body.cut(w.close().extrude(p.pocket_depth))\n\
    \n    # far-side hole the bolt tip pokes out through\n    body = body.cut(cyl(br,\
    \ pt, H - pt + 1.0))\n\n    # three spring arms, foot keyed into the wall, barb\
    \ ledge at the top\n    n = 5\n    for ang in (90.0, 210.0, 330.0):\n        body\
    \ = body.union(slab(ang, 0.0, root, p.foot_in_r, p.foot_out_r, 1.3))\n       \
    \ body = body.union(slab(ang, root, p.ramp_start_z, p.shaft_in_r, p.shaft_out_r,\
    \ p.arm_tw))\n        for k in range(n):\n            z0 = p.ramp_start_z + (p.ramp_end_z\
    \ - p.ramp_start_z)*k/float(n)\n            z1 = p.ramp_start_z + (p.ramp_end_z\
    \ - p.ramp_start_z)*(k+1)/float(n)\n            r = p.shaft_in_r + (p.ledge_r\
    \ - p.shaft_in_r)*(k+1)/float(n)\n            body = body.union(slab(ang, z0,\
    \ z1, r, p.shaft_out_r, p.arm_tw))\n        body = body.union(slab(ang, p.ramp_end_z,\
    \ p.tooth_top_z, p.ledge_r, p.shaft_out_r, p.arm_tw))\n        body = body.union(slab(ang,\
    \ p.tooth_top_z, lz, p.ledge_r, p.barb_trim_r, p.arm_tw))\n    return body"
  print_orientation: mouth face (z=0, the Ø6.9 entry bore) flat on the bed, knob axis
    vertical
  use_orientation: printed as modelled; z=0 is the mouth end, the Ø3.4 bolt hole comes
    out of the top face
- id: coupon_snapfit
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    import math\n    lz = p.ledge_z\n    pt = lz + p.pocket_depth\n\
    \    mr = p.mouth_d/2.0\n    wr = p.well_d/2.0\n    br = p.bore_d/2.0\n    root\
    \ = p.arm_root_z\n\n    def cyl(r, z0, h, cx=0.0, cy=0.0):\n        return cq.Workplane(\"\
    XY\").workplane(offset=z0).center(cx, cy).circle(r).extrude(h)\n\n    def slab(ang,\
    \ z0, z1, s0, s1, tw, cx=0.0, cy=0.0):\n        a = math.radians(ang)\n      \
    \  ux, uy = math.cos(a), math.sin(a)\n        vx, vy = -math.sin(a), math.cos(a)\n\
    \        pts = [(s*ux + t*vx + cx, s*uy + t*vy + cy)\n               for (s, t)\
    \ in ((s0, -tw), (s1, -tw), (s1, tw), (s0, tw))]\n        w = cq.Workplane(\"\
    XY\").workplane(offset=z0).moveTo(pts[0][0], pts[0][1])\n        for q in pts[1:]:\n\
    \            w = w.lineTo(q[0], q[1])\n        return w.close().extrude(z1 - z0)\n\
    \n    outs = []\n    for i, cx in enumerate((-p.coupon_pitch, 0.0, p.coupon_pitch)):\n\
    \        lr = p.ledge_r + (p.coupon_off_tight if i == 0 else (0.0 if i == 1 else\
    \ p.coupon_off_loose))\n        w = cyl(p.coupon_tube_r, 0.0, p.coupon_top_z,\
    \ cx, 0.0)\n        w = w.cut(cyl(mr, 0.0, p.shoulder_z, cx, 0.0).union(\n   \
    \         cyl(wr, p.shoulder_z, lz - p.shoulder_z, cx, 0.0)))\n        rc = p.pocket_af/math.sqrt(3.0)\n\
    \        hp = [(cx + rc*math.cos(math.pi*j/3.0), rc*math.sin(math.pi*j/3.0)) for\
    \ j in range(6)]\n        hh = cq.Workplane(\"XY\").workplane(offset=lz).moveTo(hp[0][0],\
    \ hp[0][1])\n        for q in hp[1:]:\n            hh = hh.lineTo(q[0], q[1])\n\
    \        w = w.cut(hh.close().extrude(p.pocket_depth))\n        w = w.cut(cyl(br,\
    \ pt, p.coupon_top_z - pt + 1.0, cx, 0.0))\n        n = 5\n        for ang in\
    \ (90.0, 210.0, 330.0):\n            w = w.union(slab(ang, 0.0, root, p.foot_in_r,\
    \ p.foot_out_r, 1.3, cx, 0.0))\n            w = w.union(slab(ang, root, p.ramp_start_z,\
    \ p.shaft_in_r, p.shaft_out_r, p.arm_tw, cx, 0.0))\n            for k in range(n):\n\
    \                z0 = p.ramp_start_z + (p.ramp_end_z - p.ramp_start_z)*k/float(n)\n\
    \                z1 = p.ramp_start_z + (p.ramp_end_z - p.ramp_start_z)*(k+1)/float(n)\n\
    \                r = p.shaft_in_r + (lr - p.shaft_in_r)*(k+1)/float(n)\n     \
    \           w = w.union(slab(ang, z0, z1, r, p.shaft_out_r, p.arm_tw, cx, 0.0))\n\
    \            w = w.union(slab(ang, p.ramp_end_z, p.tooth_top_z, lr, p.shaft_out_r,\
    \ p.arm_tw, cx, 0.0))\n            w = w.union(slab(ang, p.tooth_top_z, lz, lr,\
    \ p.barb_trim_r, p.arm_tw, cx, 0.0))\n        outs.append(w)\n    rib = cq.Workplane(\"\
    XY\").workplane(offset=0.0).center(0.0, 6.6).rect(\n        2.0*p.coupon_pitch\
    \ + 2.0*p.coupon_tube_r, 3.6).extrude(1.5)\n    allr = outs[0].union(outs[1]).union(outs[2]).union(rib)\n\
    \    return allr"
  print_orientation: tube mouths (z=0) flat on the bed, axes vertical, rib lying on
    the bed
  use_orientation: printed as modelled; same stack heights as the knob (ledge 11.2,
    pocket 11.2-13.8)
