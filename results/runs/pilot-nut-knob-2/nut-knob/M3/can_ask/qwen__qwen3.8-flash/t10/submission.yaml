  arm_root_z:
    value: 1.7
    unit: mm
    kind: design
    source: design
    note: top of the arm foot; the cantilever root
  shaft_in_r:
    value: 3.55
    unit: mm
    kind: design
    source: design
    note: arm shaft inner face; clears the nut's corners (3.175)
  shaft_out_r:
    value: 4.55
    unit: mm
    kind: design
    source: design
    note: arm shaft outer face; radial thickness 1.0 mm
  arm_tw:
    value: 1.1
    unit: mm
    kind: design
    source: design
    note: half of the arm's tangential width (2.2 mm); stays inside the nut's flat
  ramp_start_z:
    value: 6.2
    unit: mm
    kind: design
    source: design
    note: ''
  ramp_end_z:
    value: 8.8
    unit: mm
    kind: design
