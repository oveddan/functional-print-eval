  barb_r:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: barb ball radius; its lower surface is the lead-in cam
  barb_rc:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: radius of the barb ball centre from the knob axis
  barb_z:
    value: 10.5
    unit: mm
    kind: design
    source: design
    note: height of the barb ball centre
  barb_trim_r:
    value: 2.7
    unit: mm
    kind: design
    source: design
    note: barb is trimmed to this radius so its tip stays clear of the pocket floor
