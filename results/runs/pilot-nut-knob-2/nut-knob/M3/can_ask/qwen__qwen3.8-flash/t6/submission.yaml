  nut: m3_nut
  external: null
criteria:
- id: press_fit_holds
  part: knob
  feature: nut_socket
  relation: seats
  hardware: m3_nut
  clearance_mm: null
  params:
  - socket_af
  - nut_af
  check:
    method: coupon
    ref: fit_coupon
    description: Press a nut into each coupon pocket (5.30 at the ribbed end, 5.40
      middle, 5.50 plain end), turn the coupon upside down and shake. The pocket that
      takes thumb pressure and then holds is the size to use; the knob is modelled
      at 5.40.
- id: flats_drive_nut
  part: knob
  feature: nut_socket
  relation: engages
  hardware: m3_nut
  clearance_mm: null
  params:
  - socket_af
  - nut_af
  - nut_h
  check:
    method: coupon
    ref: fit_coupon
    description: The socket is a hexagon matched to the nut's flats, so turning the
      knob winds the bolt instead of spinning the nut around.
- id: nut_fully_inside
  part: knob
  feature: nut_socket
  relation: contains
  hardware: m3_nut
  clearance_mm: null
  params:
  - knob_h
  - collar_depth
  - socket_relief
  - nut_h
  check:
    method: measure
    ref: null
    description: Once home, the nut's top face sits ~1.0 mm below the palm face (socket
      floor 16.6, nut top at 19.0, collar mouth at 19.4, palm face at 20.0).
- id: floor_blocks_nut
  part: knob
  feature: socket_floor
  relation: supports
  hardware: m3_nut
  clearance_mm: null
  params:
  - bore_d
  - nut_af
  check:
    method: none
    ref: null
    description: The Ø3.4 bore at the far face is smaller than the nut's 5.5 mm across
      flats, so the nut cannot be pushed out that side.
- id: bolt_slides_in_bore
  part: knob
  feature: bolt_bore
  relation: clears
  hardware: m3_bolt
  clearance_mm: 0.2
  params:
  - bore_d
  - m3_major_d
  check:
    method: coupon
    ref: fit_coupon
    description: Your M3 bolt must slide freely through the coupon's 3.4 mm bores.
      If it binds, set bore_d to 3.6 and re-slice.
- id: bolt_exits_palm
  part: knob
  feature: nut_socket
  relation: clears
  hardware: m3_bolt
  clearance_mm: null
  params:
  - collar_af
  - m3_major_d
  check:
    method: none
    ref: null
    description: The bolt passes through the nut and out the 5.6 mm mouth at the palm
      face.
manual:
- n: '1'
  text: 'Slice and print both parts, no supports, no brim: PLA, 0.2 mm layers, 100%
    infill (the socket walls need solid material to grip the nut), 3+ perimeters.
    Orient the knob with its flat work face (the one the small hole opens in) on the
    bed and the palm face up; the coupon prints flat with its three pocket mouths
    up. Print them in the same job so both see the same temperature and filament.'
  parts:
  - knob
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Find the right press fit on the coupon. The pockets are, from the end with
    the raised rib: 5.30 (tightest), 5.40 (middle), 5.50 (slip fit). Press an M3 nut
    into each with your thumb, then turn the coupon upside down over a soft surface
    and shake it. You want a pocket where the nut needs firm thumb pressure and then
    stays put. The knob is modelled at 5.40, i.e. the middle pocket.'
  parts:
  - fit_coupon
  hardware:
  - m3_nut
  tool: null
- n: '3'
  text: If the middle pocket is the one that works, go on. If only the ribbed-end
    (5.30) pocket holds, re-slice the knob with socket_af = 5.30. If even 5.30 drops
    out, use 5.20. Don't glue anything.
  parts:
  - knob
  hardware: []
  tool: slicer
- n: '4'
  text: 'Seat the nut: stand the knob on the bench palm-face up so the socket is a
    vertical hole with its floor 16.6 mm down. Drop the M3 nut onto the mouth - the
    0.6 mm oversize collar centres it and nothing gets shaved. Press it straight in
    with your thumb (a flat steel bar or an M8 bolt shank helps if your thumb is tired)
    until it stops on the socket floor. The nut''s top face ends about 1 mm below
    the palm face, fully inside the knob.'
  parts:
  - knob
  hardware:
  - m3_nut
  tool: null
- n: '5'
  text: 'Check it''s captive: hold the knob upside down and shake it hard, and push
    on the nut with a screwdriver tip through the mouth. The nut must not move and
    must not be able to go through into the 3.4 mm bore. Then check the drive: put
    the nut-side up and try to spin the nut with a finger - the socket''s flats should
    hold it dead.'
  parts:
  - knob
  hardware:
  - m3_nut
  tool: none
- n: '6'
  text: 'Use: slide the knob over the protruding M3 bolt so the bolt tip enters the
    3.4 mm bore at the work face and finds the captive nut, then turn the knob clockwise
    to tighten. The nut''s thread does the work and the bolt tip comes out at the
    palm face - normal, and a sign the nut is fully threaded. The knob''s flat work
    face bears on the workpiece.'
  parts:
  - knob
  hardware:
  - m3_bolt
  tool: null
- n: '7'
  text: To take the knob off a long stud, back it off; if the nut ever works loose
    in the socket after heavy use, drive it out from the bore side with a 3 mm pin
    and press in the spare nut, or re-slice the knob one step tighter from step 3.
  parts:
  - knob
  hardware:
  - m3_nut
  tool: null
