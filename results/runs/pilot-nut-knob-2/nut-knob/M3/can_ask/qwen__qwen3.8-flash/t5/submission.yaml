task: nut-knob/M3
note: Single final knob with an integrated press/snap retaining neck. Default retainer
  neck is a 6.0 mm circular opening, trapped between a hex pocket and lower shoulder.
  Three groups of small flex holes make hand press-in feasible while still retaining
  an M3 nut when inverted.
questions: []
params:
  knob_diameter:
    value: 20
    unit: mm
    kind: design
    source: design
    note: About 20 mm across as requested.
  knob_height:
    value: 22
    unit: mm
    kind: design
    source: design
    note: Finger-grip height for an M3 knob.
  m3_nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 nut across flats.
  m3_nut_thickness:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 nut height.
  m3_nut_across_corners:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: Derived from standard M3 hex across-corners geometry.
  m3_thread_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: M3 nominal thread diameter.
  bolt_clearance:
    value: 0.4
    unit: mm
    kind: design
