criteria:
- id: teeth_grip_nut
  part: knob_m3
  feature: retaining_teeth
  relation: seats
  hardware: nut_m3
  clearance_mm: null
  params:
  - barb_tip_r
  - nut_af
  - nut_ac
  - pocket_af
  check:
    method: coupon
    ref: nut_coupon
    description: 'Press an M3 nut into seat 1 of the coupon: it must snap past the
      tooth (a firm one-handed press, about 10-20 N) and must not fall out when the
      coupon is inverted. Seats 2-4 are the looser/loosest pocket sizes for comparison
      if your printer runs undersized.'
- id: nut_inside_pocket
  part: knob_m3
  feature: hex_nut_pocket
  relation: contains
  hardware: nut_m3
  clearance_mm: null
  params:
  - pocket_af
  - nut_af
  - pocket_depth
  - nut_h
  - bore_d
  - nut_ac
  check:
    method: measure
    ref: null
    description: 'Seated nut is fully inside: its top face ends 0.6 mm below the teeth
      and nothing protrudes from the mouth.'
- id: land_blocks_nut
  part: knob_m3
  feature: land_shoulder
  relation: engages
  hardware: nut_m3
  clearance_mm: 1.48
  params:
  - hole_d
  - nut_ac
  - nut_af
  - land_t
  check:
