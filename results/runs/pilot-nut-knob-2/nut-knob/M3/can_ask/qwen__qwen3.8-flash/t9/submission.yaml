    ref: null
    description: The far-side hole (3.4) is 2.95 mm smaller than the nut's across-corners
      (6.35), so the nut cannot be pushed or shaken out through the far side and its
      full face bears on the 1.6 mm solid shoulder - that is what carries the bolt's
      clamping load.
