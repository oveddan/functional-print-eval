manual:
- n: '1'
  text: 'Print knob_m3 lying on its closed end (the face with the 3.4 mm hole) exactly
    as modelled - mouth up. No supports, PLA, 0.2 mm layers, 3+ top/bottom skins and
    >=4 vertical walls so the four arms are solid. Before using it, clear the mouth
    with a 3 mm drill bit or a screw: the hex pocket, the round bore and the far-side
    hole must all be open and the four little teeth intact.'
  parts:
  - knob_m3
  hardware: []
  tool: null
- n: '2'
  text: 'Print the nut_coupon and use it to dial in the fit before you trust the knob.
    Press an M3 hex nut into seat 1 (the design fit, 5.55 mm across flats): you want
    a firm thumb press and an audible click, and the nut must stay in when you turn
    the coupon upside down and shake it. If the nut will not go in, or the teeth bend
    so far that they stay open, use seat 2; if it drops in without a click, use seat
    3 or 4 and print the knob at that pocket size by changing pocket_af.'
  parts:
  - nut_coupon
  hardware:
  - nut_m3
  tool: null
- n: '3'
  text: 'Install the nut in the knob: drop the M3 hex nut into the mouth flat-first
    (any rotation is fine) and press it down with your thumb - hard, or against a
    table - past the four teeth until it seats on the shoulder at the bottom of the
    hex pocket. The nut stays 0.6 mm below the teeth and is completely inside the
    knob.'
  parts:
  - knob_m3
  hardware:
  - nut_m3
  tool: null
- n: '4'
  text: 'Retention check: hold the knob with the mouth pointing down over a soft surface
    and shake it. The nut must not move or fall out - the four teeth hold it. Push
    on the nut with a pencil: it should lift the teeth a little and then stop, not
    drop through the far side, because the 3.4 mm hole is much smaller than the nut''s
    6.35 mm across-corners.'
  parts:
  - knob_m3
  hardware:
  - nut_m3
  tool: null
- n: '5'
  text: 'Use: put a bolt through what you are clamping and screw it in by hand first.
    Then pass the free threaded end of the bolt in through the knob''s mouth, catch
    the captive nut, and turn the knob clockwise (viewed from the knob''s outer face)
    to tighten. The bolt goes through the nut and its end pokes out of the small hole
    on the knob''s far side - that is normal. A M3x10 is usually right (about 5 mm
    of thread inside the nut once the knob''s mouth face is on the work); use M3x25
    if the parts are thick.'
  parts:
  - knob_m3
  hardware:
  - bolt_m3
  - bolt_m3_long
  tool: null
- n: '6'
  text: 'Tighten by hand only, and clamp between the knob''s flat mouth face and the
    bolt head (an ISO 7089 M3 washer under the bolt head protects soft parts). Do
    not grip the knob with a tool or lever it: a tool''s torque would pull the nut
    against the teeth harder than they are designed for.'
  parts:
  - knob_m3
  hardware:
  - washer_m3
  tool: null
- n: '7'
  text: 'To take the nut out (or to reuse it), push the knob down onto a table with
    the nut resting on the table edge, or push the nut from the far side through the
    3.4 mm hole with a 3 mm pin: the teeth flex outward and release it. If you want
    the knob to be non-adjustable on the bolt, thread an ISO 10511 M3 nylon lock nut
    against the knob instead of relying on the captive nut''s grip.'
  parts:
  - knob_m3
  hardware:
  - nut_m3
  - locknut_m3
  tool: null
