    value: 0.9
    unit: mm
    kind: design
    source: design
    note: ''
  chamber_gap:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Radial space for the flexure petals to move outward
  lead_in_h:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: ''
  retention_h:
    value: 1.8
    unit: mm
    kind: design
    source: design
    note: ''
  wide_support_h:
    value: 1.5
    unit: mm
    kind: design
