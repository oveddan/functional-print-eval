task: nut-knob/M3
note: 'One-piece M3 hand knob with an integral six-petal flex collet. The printed
  nut is captive: it presses through the narrow top aperture, is blocked from the
  far side by the small bolt bore, and stays in when inverted without glue. The outer
  diameter is 20 mm.'
questions: []
params:
  m3_nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut across flats
  m3_nut_corner_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: Regular-hex across-corner distance for the M3 nut
  m3_nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut thickness
  m3_bolt_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: M3 nominal thread diameter
  bolt_clearance:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: Through-hole clearance for M3 bolt
  knob_od:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
  knob_h:
    value: 24
    unit: mm
    kind: design
    source: design
    note: ''
  aperture_flat_clearance:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: Capture bore is nut_af + this clearance, still smaller than nut corners
  lead_in_flat_clearance:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: ''
  root_flat_clearance:
    value: 1.15
    unit: mm
    kind: design
    source: design
    note: ''
  pocket_corner_clearance:
    value: 0.8
    unit: mm
    kind: design
