- id: coupon_snap_feel
  part: retainer_coupon
  feature: snap teeth
  relation: engages
  hardware: m3_nut
  clearance_mm: null
  params:
  - nib_aperture
  - finger_len
  - skirt_af
  - slot_w
  - bore_af
  check:
    method: measure
    ref: null
    description: 'Before printing the knob: press a nut through the coupon one-handed
      (a few newtons, thumb pressure only) and hang it tooth-end-down. If it is too
      stiff, print the coupon with nib_aperture 4.9; if the nut works loose, 4.7.'
manual:
- n: '1'
  text: Print both pieces as modelled, flat end down on the bed, in PLA at 0.2 mm
    layers with no supports and no raft. If your slicer tips the knob onto its side,
    rotate it back so the 20 mm clamping face (the one with the small hole) is the
    layer-1 face and the open, slotted rim is on top. The slim skirt must be the last
    thing printed - printed the other way round it needs supports inside the bore.
  parts:
  - hand_knob
  - retainer_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Print the coupon first if you can: it is the knob''s capture geometry (same
    hex bore, same three slots, same three teeth) on a small pad, and it costs a few
    minutes. Press an M3 hex nut into its bore flat-first, with the nut''s flats lined
    up with the flat faces of the hex hole. It should need one firm push with your
    thumb - the nut rides up the three ramps and clicks past the ledges.'
  parts:
  - retainer_coupon
  hardware:
  - m3_nut
  tool: null
- n: '3'
  text: Turn the coupon tooth-end-down and shake it. The nut must hang on the three
    ledges and not fall out. Then push the nut back out through the teeth with your
    thumb or a bolt tip to check it is serviceable. If you could not get the nut in
    without a vice, reprint the coupon with nib_aperture at 4.9 mm; if the nut falls
    out when inverted, use 4.7 mm. Only reprint the knob once the coupon feels right.
  parts:
  - retainer_coupon
  hardware:
  - m3_nut
  tool: null
- n: '4'
  text: 'Load the knob: hold it with the open, slotted rim facing up, drop the M3
    hex nut in flat-first so its flats sit against the flats of the hex bore, and
    push it with your thumb until it clicks past the three teeth. It then rests on
    the ledges about 3.6 mm below the rim, fully inside the knob. Do not hammer it
    - if the nut goes in at an angle it will jam against a tooth instead of spreading
    the fingers.'
  parts:
  - hand_knob
  hardware:
  - m3_nut
  tool: null
- n: '5'
  text: 'Check the capture: turn the knob upside down and shake it over a table. The
    nut stays in - it is held by the three teeth at the rim end and blocked at the
    other end by the wall around the 3.4 mm hole. No glue anywhere.'
  parts:
  - hand_knob
  hardware:
  - m3_nut
  tool: null
- n: '6'
  text: 'Use it: put the knob''s flat 20 mm face on the part you are clamping, pass
    the M3 bolt through that face from the bolt-head side so it goes through the 3.4
    mm hole and starts in the captured nut, then turn the knob clockwise to tighten.
    The hex bore stops the nut spinning with the knob, so the nut walks down the bolt
    and pulls the bolt head against your part. The bolt tip comes out through the
    open rim - make sure nothing is in the way beyond the knob. Turn the knob the
    other way to back it off.'
  parts:
  - hand_knob
  hardware:
  - m3_nut
  - m3_bolt
  tool: null
- n: '7'
  text: 'Hand tight only. This is a PLA knob: tighten it with your fingers, not with
    a spanner on the knob, and do not use it on anything load-bearing or hot. If you
    want to feel the nut bear properly on the closed shoulder, push the knob back
    up against the nut before turning (you can hear the click past the teeth).'
  parts:
  - hand_knob
  hardware:
  - m3_bolt
  tool: null
- n: '8'
  text: 'To change the nut: push it back out through the rim end with the tip of the
    bolt or a 3 mm dowel, working the fingers outward evenly. The skirt is only 8.4
    mm across - if the knob has to sit down inside a recess or a hole in the panel,
    that slim skirt is what enters it, and the 20 mm body is the stop.'
  parts:
  - hand_knob
  hardware:
  - m3_nut
  tool: null
