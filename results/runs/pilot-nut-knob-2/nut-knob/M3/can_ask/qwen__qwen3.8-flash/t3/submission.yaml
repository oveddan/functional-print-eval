task: nut-knob/M3
note: 'One printed piece, no supports, no glue. The nut is captured by three flexure
  fingers split out of the slim skirt by three through-slots: each finger ends in
  a snap tooth whose ramp faces the rim (so the nut spreads the fingers ~0.35 mm over
  an 11 mm cantilever, about 1% strain in PLA) and whose flat ledge faces inward,
  holding the nut in against inversion. The 5.9 mm hex bore keeps the nut from rotating
  so the knob actually drives the bolt, and the 3.4 mm hole in the 3.5 mm closed end
  is what the nut can never be pushed through while the 3 mm bolt passes freely and
  exits the rim. The 20 mm body carries 12 vertical scallops (1.3 mm deep) for grip,
  with a plain 2.5 mm bearing land at the clamping face; that face is the first printed
  layer so it is dead flat. A coupon is included because the snap fit is the only
  risky part - it is the same bore, slots, finger length and tooth geometry on a 13
  x 3 mm pad, so you can dial nib_aperture in 0.1 mm steps before spending a knob
  print. Everything else (the downward-facing shoulder between body and skirt, the
  teeth shelves, the 1.8 mm slot ceilings) is either printed as a supported top face
  or a sub-millimetre ledge, so the whole knob prints without supports or long bridges.
  I had to guess the nut dimensions from the ISO 4032 catalog entry and the stand-off
  needed at your bolt, since you could not measure either; if your nuts are a non-standard
  (over-sized) M3, the coupon test will show it.'
questions: []
