    source: design
    note: same finger length, slot, tooth and aperture geometry as the knob
parts:
- id: hand_knob
  role: final
  material: PLA (high-speed, black)
  code: "import math\n\n\ndef _hexprism(af, z0, z1):\n    R = (af / 2.0) / math.cos(math.pi\
    \ / 6.0)\n    wp = cq.Workplane(\"XY\").workplane(offset=z0)\n    for k in range(7):\n\
    \        a = math.pi / 3.0 * k\n        x, y = R * math.cos(a), R * math.sin(a)\n\
    \        wp = wp.moveTo(x, y) if k == 0 else wp.lineTo(x, y)\n    return wp.close().extrude(z1\
    \ - z0)\n\n\ndef _tooth(tip_r, wall_r, z_lo, ramp, width, beta):\n    pts = [(tip_r,\
    \ z_lo), (wall_r, z_lo), (wall_r, z_lo + ramp)]\n    wp = cq.Workplane(\"XZ\"\
    )\n    for i, (x, y) in enumerate(pts):\n        wp = wp.moveTo(x, y) if i ==\
    \ 0 else wp.lineTo(x, y)\n    return wp.close().extrude(width, both=True).rotate((0,\
    \ 0, 1), (0, 0, 0), beta)\n\n\ndef build(p):\n    H = p.knob_h\n    zf = p.body_len\n\
    \    Rb = p.knob_d / 2.0\n    Rc = p.flute_r\n    Ra = Rb + Rc - p.flute_depth\n\
    \n    # fat fluted grip body, plain bearing land where it sits on the bed\n  \
    \  w = cq.Workplane(\"XY\").circle(Rb).extrude(zf)\n    for k in range(int(p.flute_n)):\n\
    \        a = 2.0 * math.pi * k / p.flute_n\n        w = w.cut(cq.Workplane(\"\
    XY\").workplane(offset=p.land_h)\n                  .center(Ra * math.cos(a),\
    \ Ra * math.sin(a))\n                  .circle(Rc)\n                  .extrude(zf\
    \ - p.land_h + 2.0))\n\n    # slim hex skirt that carries the three retainer fingers\n\
    \    w = w.union(_hexprism(p.skirt_af, zf, H))\n\n    # hex nut bore: from the\
    \ seat shoulder up through the open rim\n    w = w.cut(_hexprism(p.bore_af, p.roof_t,\
    \ H + 1.0))\n\n    # three through-slots, one per other bore flat, open at the\
    \ rim\n    s0 = H - p.finger_len - 0.5\n    s1 = H + 1.0\n    for beta in (90.0,\
    \ 210.0, 330.0):\n        w = w.cut(cq.Workplane(\"XY\")\n                  .box(p.slot_len,\
    \ p.slot_w, s1 - s0, centered=(True, True, True))\n                  .translate((p.slot_x,\
    \ 0.0, 0.5 * (s0 + s1)))\n                  .rotate((0, 0, 1), (0, 0, 0), beta))\n\
    \n    # three snap teeth: ramp faces the rim, flat ledge retains the nut\n   \
    \ tip_r = p.nib_aperture / 2.0\n    z_lo = H - p.nib_h\n    for beta in (30.0,\
    \ 150.0, 270.0):\n        w = w.union(_tooth(tip_r, p.nib_wall_r, z_lo, p.nib_ramp,\
    \ p.nib_w, beta))\n\n    # bolt clearance hole through the clamping face\n   \
    \ w = w.cut(cq.Workplane(\"XY\").workplane(offset=-1.0)\n              .circle(p.bolt_hole_d\
    \ / 2.0)\n              .extrude(p.roof_t + 2.0))\n    return w\n"
  print_orientation: 'Flat clamping face (the end with the 3.4 mm hole) down on the
    bed, model z=0 on the bed; the open rim with the three snap teeth points up (+Z).
    Never print it rim-down: that puts a downward-facing shoulder in the air.'
  use_orientation: 'As modelled: the z=0 face bears flat on the part being clamped,
    the bolt head sits on that same face, and the M3 tip points out through the open
    rim (+Z).'
- id: retainer_coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "import math\n\n\ndef _hexprism(af, z0, z1):\n    R = (af / 2.0) / math.cos(math.pi\
    \ / 6.0)\n    wp = cq.Workplane(\"XY\").workplane(offset=z0)\n    for k in range(7):\n\
    \        a = math.pi / 3.0 * k\n        x, y = R * math.cos(a), R * math.sin(a)\n\
    \        wp = wp.moveTo(x, y) if k == 0 else wp.lineTo(x, y)\n    return wp.close().extrude(z1\
    \ - z0)\n\n\ndef _tooth(tip_r, wall_r, z_lo, ramp, width, beta):\n    pts = [(tip_r,\
    \ z_lo), (wall_r, z_lo), (wall_r, z_lo + ramp)]\n    wp = cq.Workplane(\"XZ\"\
    )\n    for i, (x, y) in enumerate(pts):\n        wp = wp.moveTo(x, y) if i ==\
    \ 0 else wp.lineTo(x, y)\n    return wp.close().extrude(width, both=True).rotate((0,\
    \ 0, 1), (0, 0, 0), beta)\n\n\ndef build(p):\n    H = p.coupon_h\n    zroot =\
    \ H - p.finger_len\n\n    # solid pad: the anchor the fingers flex against, standing\
    \ in for the knob body\n    w = cq.Workplane(\"XY\").circle(p.coupon_pad_d / 2.0).extrude(zroot)\n\
    \    w = w.union(_hexprism(p.skirt_af, zroot, H))\n\n    # bore, blind against\
    \ the pad\n    w = w.cut(_hexprism(p.bore_af, p.coupon_pad_t, H + 1.0))\n\n  \
    \  # three flexure slots, same place and size as the knob's\n    s0 = zroot -\
    \ 0.5\n    s1 = H + 1.0\n    for beta in (90.0, 210.0, 330.0):\n        w = w.cut(cq.Workplane(\"\
    XY\")\n                  .box(p.slot_len, p.slot_w, s1 - s0, centered=(True, True,\
    \ True))\n                  .translate((p.slot_x, 0.0, 0.5 * (s0 + s1)))\n   \
    \               .rotate((0, 0, 1), (0, 0, 0), beta))\n\n    # three snap teeth,\
    \ identical to the knob's\n    tip_r = p.nib_aperture / 2.0\n    z_lo = H - p.nib_h\n\
    \    for beta in (30.0, 150.0, 270.0):\n        w = w.union(_tooth(tip_r, p.nib_wall_r,\
    \ z_lo, p.nib_ramp, p.nib_w, beta))\n    return w\n"
  print_orientation: Solid pad down on the bed (model z=0 on the bed); the slotted
    fingers and snap teeth point up (+Z), exactly like the knob.
  use_orientation: Hold it pad-down and push the nut in from the tooth end; then turn
    it tooth-end-down to check the nut stays in. This is the pre-flight check for
    hand_knob's capture geometry.
