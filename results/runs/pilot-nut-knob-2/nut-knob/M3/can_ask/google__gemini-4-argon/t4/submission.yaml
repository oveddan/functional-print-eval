task: nut-knob/M3
note: One-piece 20 mm scalloped M3 hand knob with a blind-stopped hexagonal pocket
  and 6 axial crush ribs for reliable hand-press retention without glue. Includes
  a small test coupon to quickly verify the press fit before printing the knob.
questions: []
params:
  flute_count:
    value: 8
    unit: count
    kind: design
    source: design
    note: Number of finger-grip flutes around the knob perimeter
  coupon_od:
    value: 11
    unit: mm
    kind: design
    source: design
    note: Outer diameter of the quick test coupon
  knob_od:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: Outer diameter of the hand knob (~20 mm across)
  pocket_depth:
    value: 3
    unit: mm
    kind: design
    source: design
    note: Depth of the hex nut pocket (nut_h + 0.6 mm recess so the nut sits fully
      inside the knob)
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3 nominal thread diameter
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut thickness
  flute_offset:
    value: 11.2
    unit: mm
    kind: design
    source: design
    note: Radial center distance of the flute cutout circles from the knob axis
  base_stop_h:
    value: 4
    unit: mm
    kind: design
    source: design
    note: Solid shoulder thickness beneath the nut pocket that prevents the nut from
      pushing out the far side
  nut_pocket_clearance:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: Across-flats clearance on the main hex walls so corners clear while the
      crush ribs grip the flats
  knob_h:
    value: 7
    unit: mm
    kind: design
    source: design
    note: Total height of the hand knob (base_stop_h + pocket_depth)
  flute_r:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: Radius of each finger-grip flute cutout
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut width across flats
  bolt_clearance_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: Through-hole diameter for M3 bolt clearance
  crush_rib_protrusion:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: Radial protrusion of the 6 crush ribs from each flat of the hex pocket for
      hand-press interference retention
  crush_rib_w:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Width of each crush rib along the hex flat
parts:
- id: m3_hand_knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    # Main cylindrical body at z = 0..knob_h\n\
    \    body = cq.Workplane(\"XY\").circle(p.knob_od / 2.0).extrude(p.knob_h)\n\n\
    \    # Cut finger-grip flutes around perimeter\n    flutes = (\n        cq.Workplane(\"\
    XY\")\n        .polarArray(p.flute_offset, 0, 360, int(p.flute_count))\n     \
    \   .circle(p.flute_r)\n        .extrude(p.knob_h)\n    )\n    body = body.cut(flutes)\n\
    \n    # Top and bottom outer edge chamfers for comfortable feel and clean first\
    \ layer\n    body = body.edges(\"%CIRCLE\").chamfer(0.6)\n\n    # Hex pocket from\
    \ top face (z = base_stop_h to knob_h)\n    pocket_af = p.nut_af + p.nut_pocket_clearance\n\
    \    pocket_circum_d = pocket_af / math.cos(math.pi / 6.0)\n    hex_cut = (\n\
    \        cq.Workplane(\"XY\")\n        .workplane(offset=p.base_stop_h)\n    \
    \    .polygon(6, pocket_circum_d)\n        .extrude(p.pocket_depth)\n    )\n\n\
    \    # Add 6 axial crush ribs on the centers of the 6 hex flats to hold the nut\
    \ by hand press-fit\n    # Polygon(6, d) has vertices at angles 0, 60, 120...\
    \ so flat midpoints are at 30, 90, 150...\n    rib_h = p.pocket_depth - 0.4  #\
    \ leave 0.4 mm lead-in at the top entry of the pocket\n    ribs = None\n    for\
    \ i in range(6):\n        angle_deg = 30.0 + i * 60.0\n        angle_rad = math.radians(angle_deg)\n\
    \        dist = pocket_af / 2.0\n        cx = dist * math.cos(angle_rad)\n   \
    \     cy = dist * math.sin(angle_rad)\n        rib = (\n            cq.Workplane(\"\
    XY\")\n            .workplane(offset=p.base_stop_h)\n            .transformed(offset=(cx,\
    \ cy, 0), rotate=(0, 0, angle_deg))\n            .circle(p.crush_rib_w / 2.0)\n\
    \            .extrude(rib_h)\n        )\n        # Shift inward slightly if needed\
    \ so radial protrusion equals p.crush_rib_protrusion\n        # Since circle of\
    \ radius crush_rib_w/2 centered at (dist + crush_rib_w/2 - crush_rib_protrusion)\
    \ protrudes by crush_rib_protrusion:\n        r_rib = p.crush_rib_w / 2.0\n  \
    \      center_r = (pocket_af / 2.0) + r_rib - p.crush_rib_protrusion\n       \
    \ cx2 = center_r * math.cos(angle_rad)\n        cy2 = center_r * math.sin(angle_rad)\n\
    \        rib = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=p.base_stop_h)\n\
    \            .center(cx2, cy2)\n            .circle(r_rib)\n            .extrude(rib_h)\n\
    \        )\n        ribs = rib if ribs is None else ribs.union(rib)\n\n    # Cut\
    \ hex pocket while leaving the crush ribs intact\n    pocket_void = hex_cut.cut(ribs)\n\
    \    body = body.cut(pocket_void)\n\n    # Through-hole for M3 bolt all the way\
    \ through the knob\n    bolt_hole = cq.Workplane(\"XY\").circle(p.bolt_clearance_d\
    \ / 2.0).extrude(p.knob_h)\n    body = body.cut(bolt_hole)\n\n    return body\n"
  print_orientation: Flat base (solid stop side) on the print bed at z = 0, hex nut
    pocket facing up (no supports required)
  use_orientation: Tighten by hand around an M3 bolt axis; the M3 bolt passes through
    the base bore, threads through the captured M3 nut, and exits the opposite side
- id: nut_fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    coupon_h = 1.6 + p.pocket_depth\n    body\
    \ = cq.Workplane(\"XY\").circle(p.coupon_od / 2.0).extrude(coupon_h)\n\n    pocket_af\
    \ = p.nut_af + p.nut_pocket_clearance\n    pocket_circum_d = pocket_af / math.cos(math.pi\
    \ / 6.0)\n    hex_cut = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=1.6)\n\
    \        .polygon(6, pocket_circum_d)\n        .extrude(p.pocket_depth)\n    )\n\
    \n    rib_h = p.pocket_depth - 0.4\n    r_rib = p.crush_rib_w / 2.0\n    center_r\
    \ = (pocket_af / 2.0) + r_rib - p.crush_rib_protrusion\n    ribs = None\n    for\
    \ i in range(6):\n        angle_rad = math.radians(30.0 + i * 60.0)\n        cx\
    \ = center_r * math.cos(angle_rad)\n        cy = center_r * math.sin(angle_rad)\n\
    \        rib = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=1.6)\n\
    \            .center(cx, cy)\n            .circle(r_rib)\n            .extrude(rib_h)\n\
    \        )\n        ribs = rib if ribs is None else ribs.union(rib)\n\n    body\
    \ = body.cut(hex_cut.cut(ribs))\n    bolt_hole = cq.Workplane(\"XY\").circle(p.bolt_clearance_d\
    \ / 2.0).extrude(coupon_h)\n    body = body.cut(bolt_hole)\n    return body\n"
  print_orientation: Flat base on the print bed at z = 0, hex pocket facing up
  use_orientation: Test piece to verify hand-press retention of the M3 hex nut and
    through-clearance of the M3 bolt
hardware:
- id: m3_nut
  ref: ISO 4032 M3
  qty: 1
- id: m3_bolt
  ref: ISO 4762 M3x20
  qty: 1
joints:
- id: knob_m3_joint
  fastener: m3_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: m3_hand_knob
    feature: bolt_through_bore
    role: clearance
  - part: m3_hand_knob
    feature: hex_nut_pocket
    role: nut_pocket
  nut: m3_nut
  external: null
criteria:
- id: nut_press_fit_retention
  part: m3_hand_knob
  feature: hex_nut_pocket
  relation: seats
  hardware: m3_nut
  clearance_mm: -0.025
  params:
  - nut_af
  - nut_h
  - nut_pocket_clearance
  - crush_rib_protrusion
  - crush_rib_w
  - pocket_depth
  check:
    method: coupon
    ref: nut_fit_coupon
    description: Press the M3 hex nut into the hexagonal pocket of the coupon (and
      then the knob) by hand; verify it seats flush/recessed against the bottom stop
      and does not fall out when inverted.
- id: bolt_through_clearance
  part: m3_hand_knob
  feature: bolt_through_bore
  relation: clears
  hardware: m3_bolt
  clearance_mm: 0.4
  params:
  - bolt_d
  - bolt_clearance_d
  - base_stop_h
  check:
    method: coupon
    ref: nut_fit_coupon
    description: Pass the M3 bolt through the central bore from the base face, thread
      it through the seated M3 nut, and verify it passes cleanly out the top face
      without binding on the plastic bore.
manual:
- n: '1'
  text: Print the small nut_fit_coupon first and test-press the ISO 4032 M3 hex nut
    into the hex pocket by hand. The 6 small crush ribs inside the pocket deform slightly
    to grip the nut flats so it stays in when turned upside down. If the fit is verified,
    print the m3_hand_knob.
  parts:
  - nut_fit_coupon
  hardware:
  - m3_nut
  - m3_bolt
  tool: null
- n: '2'
  text: Place the M3 hex nut aligned with the hex opening on the top of the m3_hand_knob
    and press it firmly all the way down until it stops against the internal shoulder
    (sitting 0.6 mm recessed below the top face). Turn the knob upside down to confirm
    the crush ribs hold the nut securely in place.
  parts:
  - m3_hand_knob
  hardware:
  - m3_nut
  tool: null
- n: '3'
  text: Thread the M3 bolt into the nut (either entering from the solid bottom face
    so the nut cannot be pushed out under clamping load, or from the top face) and
    tighten by hand so the bolt passes completely through the nut and out the far
    side.
  parts:
  - m3_hand_knob
  hardware:
  - m3_bolt
  tool: null
