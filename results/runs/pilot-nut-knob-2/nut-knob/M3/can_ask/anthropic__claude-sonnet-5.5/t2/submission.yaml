task: nut-knob/M3
note: The nut is held by a snug hex press fit with a small lead-in chamfer. I haven't
  tested how tight this fit is on your printer, so the coupon gives three clearances
  to pick from. The bolt length is up to you. It needs to be long enough to engage
  the nut and pass the 9 mm knob.
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 thickness
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: M3 bolt
  knob_d:
    value: 20
    unit: mm
    kind: world
    source: asked
    note: about 20 mm across, per request
  knob_h:
    value: 9
    unit: mm
    kind: design
    source: design
    note: gives 6.5 mm roof above the nut pocket
  pocket_clear:
    value: 0.05
    unit: mm
    kind: design
    source: design
    note: added to nut AF; small, so the pocket is a snug press fit. Pick from the
      coupon if too tight or loose
  pocket_depth_margin:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: pocket is nut height plus this, so the nut is fully inside
  lead_in:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: conical lead-in at the pocket mouth
  hole_clear:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: bolt hole = M3 + 0.4 = 3.4
  scallop_n:
    value: 10
    unit: count
    kind: design
    source: design
    note: ''
  scallop_r:
    value: 2
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_offset:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: scallop centres sit this far outside the knob radius
  coupon_clear_a:
    value: -0.05
    unit: mm
    kind: design
    source: design
    note: tight
  coupon_clear_b:
    value: 0.05
    unit: mm
    kind: design
    source: design
    note: same as the knob
  coupon_clear_c:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: loose
  coupon_h:
    value: 5
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    af = p.nut_af + p.pocket_clear\n    d = af\
    \ / math.cos(math.radians(30))\n    body = cq.Workplane('XY').circle(p.knob_d/2).extrude(p.knob_h)\n\
    \    R = p.knob_d/2 + p.scallop_offset\n    n = int(p.scallop_n)\n    for i in\
    \ range(n):\n        a = 2*math.pi*i/n\n        body = body.cut(cq.Workplane('XY').center(R*math.cos(a),\
    \ R*math.sin(a)).circle(p.scallop_r).extrude(p.knob_h))\n    depth = p.nut_h +\
    \ p.pocket_depth_margin\n    pocket = cq.Workplane('XY').polygon(6, d).extrude(depth)\n\
    \    cone = cq.Workplane('XY').add(cq.Solid.makeCone(d/2 + p.lead_in, d/2, p.lead_in,\
    \ cq.Vector(0,0,0), cq.Vector(0,0,1)))\n    body = body.cut(pocket).cut(cone)\n\
    \    hole = cq.Workplane('XY').circle((p.bolt_d + p.hole_clear)/2).extrude(p.knob_h)\n\
    \    return body.cut(hole)\n"
  print_orientation: Nut-pocket opening face down on the bed (z=0); flat top up. The
    pocket roof bridges only about 6.4 mm.
  use_orientation: Pocket opening faces the bolt/work surface. Bolt comes up through
    the nut and its tip pokes out of the top hole.
- id: nut-fit-coupon
  role: coupon
  material: PLA
  code: "import math\ndef build(p):\n    w = 14.0\n    blk = cq.Workplane('XY').box(3*w,\
    \ w, p.coupon_h, centered=(True, True, False))\n    depth = p.nut_h + p.pocket_depth_margin\n\
    \    for i, c in enumerate([p.coupon_clear_a, p.coupon_clear_b, p.coupon_clear_c]):\n\
    \        x = (i-1)*w\n        d = (p.nut_af + c) / math.cos(math.radians(30))\n\
    \        pocket = cq.Workplane('XY').center(x, 0).polygon(6, d).extrude(depth)\n\
    \        cone = cq.Workplane('XY').add(cq.Solid.makeCone(d/2 + p.lead_in, d/2,\
    \ p.lead_in, cq.Vector(x,0,0), cq.Vector(0,0,1)))\n        hole = cq.Workplane('XY').center(x,\
    \ 0).circle((p.bolt_d + p.hole_clear)/2).extrude(p.coupon_h)\n        blk = blk.cut(pocket).cut(cone).cut(hole)\n\
    \    return blk\n"
  print_orientation: Pocket openings face down on the bed.
  use_orientation: 'Test piece only: press an M3 nut into each pocket from below.'
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: c1
  part: knob
  feature: hex nut pocket
  relation: contains
  hardware: nut
  clearance_mm: 0.05
  params:
  - nut_af
  - nut_h
  - pocket_clear
  - pocket_depth_margin
  check:
    method: coupon
    ref: nut-fit-coupon
    description: Nut must press in by hand, need light thumb force, and not fall out
      when the coupon is turned upside down and tapped. Use the pocket that does this.
- id: c2
  part: knob
  feature: roof above nut pocket
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - knob_h
  - nut_h
  check:
    method: measure
    ref: null
    description: Roof is solid, so the nut can't be pushed out through the top. Only
      the 3.4 mm bolt hole goes through.
- id: c3
  part: knob
  feature: through bolt hole
  relation: clears
  hardware: nut
  clearance_mm: 0.4
  params:
  - bolt_d
  - hole_clear
  check:
    method: coupon
    ref: nut-fit-coupon
    description: M3 bolt passes freely through the hole and nut.
manual:
- n: '1'
  text: Print the nut-fit coupon first (pocket openings on the bed). It takes only
    a few minutes. Press an M3 nut into each of its three pockets. Pick the one that
    needs firm thumb pressure and holds the nut when the coupon is turned upside down.
    Left pocket is tightest, right is loosest. The knob uses the middle one (pocket_clear
    0.05). If the left or right pocket fits best, change pocket_clear to -0.05 or
    0.15 and reprint the knob.
  parts:
  - nut-fit-coupon
  hardware:
  - nut
  tool: null
- n: '2'
  text: Print the knob with the pocket opening on the bed, at 0.2 mm layers with 3
    or more walls. No supports are needed.
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Put an M3 hex nut on the pocket opening on the underside of the knob, with
    the flats lined up with the hex. Press it in by hand, or push it flat against
    a table, until it bottoms on the roof. It sits fully inside the knob.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Thread your M3 bolt into the nut from the pocket side. The tip comes out through
    the hole in the top of the knob. Turn the knob to tighten.
  parts:
  - knob
  hardware:
  - nut
  tool: null
