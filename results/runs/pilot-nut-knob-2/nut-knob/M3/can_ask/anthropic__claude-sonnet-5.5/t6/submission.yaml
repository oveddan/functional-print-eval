task: nut-knob/M3
note: Nothing was measured on your side. The press-fit clearance (0.1 mm over the
  nut's 5.5 mm across-flats) is a guess for PLA on an X1C, so the design includes
  a small 3-pocket test coupon to print first. The knob is 20 mm across and 8 mm tall,
  with 6 scalloped grooves for grip. The nut goes in from the bed-side face and is
  held by friction. A solid roof with a 3.4 mm hole sits above the pocket, so the
  nut can't be pushed out the far side. Your bolt length isn't specified. It needs
  to be at least the knob's 8 mm plus whatever you're clamping.
questions: []
params:
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: about 20 mm across, per request
  knob_h:
    value: 8
    unit: mm
    kind: design
    source: design
    note: ''
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height
  nut_fit_clearance:
    value: 0.1
    unit: mm
    kind: design
    source: guessed
    note: added to nut across-flats for the pocket. 0.1 is a starting guess for a
      press fit in PLA on this printer. Pick the value from the coupon, which has
      pockets at this value minus 0.1, this value, and this value plus 0.1.
  coupon_step:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: ''
  pocket_extra_depth:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: pocket is slightly deeper than the nut so the nut sits fully inside the
      face
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: M3 nominal
  bolt_clearance:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: through hole = 3.4 mm
  groove_count:
    value: 6
    unit: count
    kind: design
    source: design
    note: ''
  groove_r:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: radius of the scallop cuts that give grip
  top_fillet:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_t:
    value: 5
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    R = p.knob_d / 2.0\n    body = cq.Workplane('XY').circle(R).extrude(p.knob_h)\n\
    \    body = body.faces('>Z').edges().fillet(p.top_fillet)\n    # scalloped grip\n\
    \    for i in range(int(p.groove_count)):\n        a = 2 * math.pi * i / p.groove_count\n\
    \        cut = (cq.Workplane('XY')\n               .center(R * math.cos(a), R\
    \ * math.sin(a))\n               .circle(p.groove_r).extrude(p.knob_h))\n    \
    \    body = body.cut(cut)\n    # hex nut pocket, open at the bed face\n    af\
    \ = p.nut_af + p.nut_fit_clearance\n    hexd = af / math.cos(math.radians(30))\n\
    \    depth = p.nut_h + p.pocket_extra_depth\n    pocket = cq.Workplane('XY').polygon(6,\
    \ hexd).extrude(depth)\n    body = body.cut(pocket)\n    # bolt through hole,\
    \ all the way through\n    hole = cq.Workplane('XY').circle((p.bolt_d + p.bolt_clearance)\
    \ / 2.0).extrude(p.knob_h)\n    body = body.cut(hole)\n    return body\n"
  print_orientation: Nut-pocket face down on the bed (z=0). The hex pocket roof is
    a ~5.5 mm bridge, well under the 50 mm limit.
  use_orientation: Pocket face toward the work, bolt end sticking out of the pocket
    side; the knob is turned by its scalloped rim.
- id: nut-fit-coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    plate = cq.Workplane('XY').rect(30, 11).extrude(p.coupon_t)\n\
    \    for k, x in enumerate((-10, 0, 10)):\n        cl = p.nut_fit_clearance +\
    \ (k - 1) * p.coupon_step\n        af = p.nut_af + cl\n        hexd = af / math.cos(math.radians(30))\n\
    \        depth = p.nut_h + p.pocket_extra_depth\n        pocket = cq.Workplane('XY').center(x,\
    \ 0).polygon(6, hexd).extrude(depth)\n        hole = cq.Workplane('XY').center(x,\
    \ 0).circle((p.bolt_d + p.bolt_clearance) / 2.0).extrude(p.coupon_t)\n       \
    \ plate = plate.cut(pocket).cut(hole)\n    return plate\n"
  print_orientation: Pocket face down on the bed (same as the knob).
  use_orientation: 'Test only: press an M3 nut into each pocket and compare.'
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: c-nut-pocket
  part: knob
  feature: hex nut pocket
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - nut_h
  - nut_fit_clearance
  - pocket_extra_depth
  check:
    method: coupon
    ref: nut-fit-coupon
    description: The nut must press in by hand, need a firm push, and stay in when
      the part is turned upside down and shaken. The three coupon pockets are at the
      design clearance -0.1, +0, and +0.1.
- id: c-nut-depth
  part: knob
  feature: nut pocket depth and ceiling
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_h
  - pocket_extra_depth
  - knob_h
  check:
    method: measure
    ref: null
    description: The nut ends up fully inside the pocket, not above the face. The
      roof above the pocket is solid except for the bolt hole, so the nut cannot go
      out the far side.
- id: c-bolt-hole
  part: knob
  feature: bolt through hole
  relation: clears
  hardware: nut
  clearance_mm: 0.4
  params:
  - bolt_d
  - bolt_clearance
  check:
    method: measure
    ref: null
    description: An M3 bolt slides freely through the 3.4 mm hole and threads into
      the nut. The tip comes out of the far side.
manual:
- n: '1'
  text: Print the nut-fit-coupon first, pocket face down, in black PLA at 0.2 mm layers.
    It takes a few minutes.
  parts:
  - nut-fit-coupon
  hardware: []
  tool: null
- n: '2'
  text: Press an M3 nut into each of the three pockets. The pockets are 0.1 mm tighter
    than, equal to, and 0.1 mm looser than the design clearance. Pick the pocket where
    the nut needs a firm push to go in and does not fall out when you turn the coupon
    over and shake it. If none of them fit, set nut_fit_clearance so the middle pocket
    matches the best one, and regenerate the knob.
  parts:
  - nut-fit-coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: Print the knob with the nut-pocket face on the bed. No supports are needed.
  parts:
  - knob
  hardware: []
  tool: null
- n: '4'
  text: Set the M3 nut in the hex pocket with its flats lined up with the pocket walls.
    Press the knob, pocket side down, onto a hard flat surface such as a table until
    the nut is fully seated and at or below the face. Check that the nut stays in
    with the knob upside down.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Push your M3 bolt through the knob's hole from the top, or in from the pocket
    side, and thread it into the nut. Turn the knob by its scalloped rim to tighten.
  parts:
  - knob
  hardware:
  - nut
  tool: null
