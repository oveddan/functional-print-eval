task: nut-knob/M3
note: 'One printed knob; the M3 hex nut is pressed into it by hand and is held twice
  over: an 0.25 mm across-flats press lip (8 mm... 0.8 mm tall) that the compliant
  pocket wall absorbs, plus a mechanical shoulder - the lip is smaller than the nut
  all round, so the nut''s bottom face is caught even if the print is off-size. The
  pocket roof (everything but a 3.4 mm bore) stops the nut going out the far side,
  and the same 3.4 mm bore lets the bolt show through the top. You could not measure
  your nut or bolt, so nut_af/nut_h are catalog values and the knob is 11 mm tall
  with an open top - if your bolt has under ~11 mm of free shank, tell me and I''ll
  shorten the knob.'
questions:
- text: How much free shank does your M3 bolt have (the part that sticks out of the
    thing it fastens)? The knob is 11 mm tall, so you need about 11 mm for the bolt's
    tip to come out of the far side - if it is shorter, say the word and I will shorten
    the knob.
  answer: null
- text: Is your M3 nut a standard ISO 4032 one, 5.5 mm across the flats? Everything
    is cut to that; my design assumes the catalog size because you could not measure
    it.
  answer: null
- text: 'After printing fit_coupon: which pocket took the nut with a firm press and
    held it when you turned the coupon pocket-down - 1 dot, 2 dots or 3 dots? If it
    was not 2 dots, tell me and I will re-size the knob''s lip.'
  answer: null
params:
  knob_od:
    value: 20
    unit: mm
    kind: world
    source: asked
    note: 'user: ''about 20 mm across''; the knob''s diameter at the flute ridges'
  knob_h:
    value: 11
    unit: mm
    kind: design
    source: design
    note: short enough that a short bolt can still show at the top
  top_chamfer:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: ''
  flute_count:
    value: 8
    unit: count
    kind: design
    source: design
    note: finger scallops around the grip band
  flute_r:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: scallop radius
  flute_depth:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: grip bottoms come out 17 mm across, ridges 20 mm
  flute_z0:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
  flute_band_h:
    value: 8
    unit: mm
    kind: design
    source: design
    note: ''
  bore_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: M3 shank 3.0 + 0.4 clearance; runs from the pocket roof (z=3.8) to the top
      face
  mouth_relief_af:
    value: 5.9
    unit: mm
    kind: design
    source: design
    note: relieved entry hexagon, wider than the nut, so the nut starts squarely and
      the bed-side elephant's foot stays off the press lip
  mouth_relief_h:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: ''
  pocket_lip_af:
    value: 5.25
    unit: mm
    kind: design
    source: design
    note: 'the press lip: nut nominal 5.5 - 0.25; also the 2-dot coupon pocket'
  lip_h:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: ''
  pocket_af:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: 'nut''s nominal across-flats: a slip fit above the lip so the nut''s flats
      drive the knob'
  pocket_depth:
    value: 3.8
    unit: mm
    kind: design
    source: design
    note: relief 0.4 + lip 0.8 + 0.2 drop + nut 2.4; the roof is at z=3.8
  groove_af_in:
    value: 7.1
    unit: mm
    kind: design
    source: design
    note: pocket_af + 2 x 0.8 wall
  groove_w:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: ''
  groove_af_out:
    value: 9.5
    unit: mm
    kind: design
    source: design
    note: groove_af_in + 2 x groove_w; this ring is what lets the pocket wall flex
      outward
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 width across flats (catalog; user could not measure)
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3
  nut_ac:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: across corners = 5.5/cos30; far bigger than the 3.4 roof bore, so the nut
      cannot pass it
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: M3 shank of the user's bolt
  bolt_len:
    value: 20
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3x20 (threaded to the head); any M3 with >= 11 mm of free shank
      also shows at the top
  bolt_buried:
    value: 5
    unit: mm
    kind: design
    source: guessed
    note: assumed 5 mm of the bolt sits inside the part it fastens; the M3x20 tip
      then reaches z=15, i.e. 4 mm proud of the 11 mm-tall knob
  coupon_h:
    value: 6
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_w:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_pitch:
    value: 13
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_lip_af_1:
    value: 5.15
    unit: mm
    kind: design
    source: design
    note: 'coupon pocket with 1 dot: one step tighter than the knob'
  coupon_lip_af_2:
    value: 5.25
    unit: mm
    kind: design
    source: design
    note: 'coupon pocket with 2 dots: exactly the knob''s lip'
  coupon_lip_af_3:
    value: 5.35
    unit: mm
    kind: design
    source: design
    note: 'coupon pocket with 3 dots: one step looser'
parts:
- id: knob
  role: final
  material: PLA (Bambu high-speed PLA, black)
  code: "import math\n\ndef build(p):\n    R = p.knob_od / 2.0\n    H = p.knob_h\n\
    \    ch = p.top_chamfer\n\n    # body: cylinder with a chamfered top rim\n   \
    \ body = cq.Workplane(\"XY\").circle(R).extrude(H - ch)\n    body = body.union(cq.Workplane(obj=cq.Solid.makeCone(\n\
    \        R, R - ch, ch, cq.Vector(0, 0, H - ch), cq.Vector(0, 0, 1))))\n\n   \
    \ # finger flutes around the grip band\n    rc = R + p.flute_r - p.flute_depth\n\
    \    for i in range(int(p.flute_count)):\n        a = 2.0 * math.pi * i / p.flute_count\n\
    \        body = body.cut(\n            cq.Workplane(\"XY\")\n            .center(rc\
    \ * math.cos(a), rc * math.sin(a))\n            .circle(p.flute_r)\n         \
    \   .extrude(p.flute_band_h + 0.2)\n            .translate((0, 0, p.flute_z0 -\
    \ 0.1))\n        )\n\n    # bolt clearance bore: pocket roof -> top face (the\
    \ bolt's exit)\n    body = body.cut(cq.Workplane(\"XY\").circle(p.bore_d / 2.0)\n\
    \                    .extrude(H + 2.0).translate((0, 0, -1.0)))\n\n    def hexprism(af,\
    \ z0, z1):\n        d = af / math.cos(math.pi / 6.0)\n        return (cq.Workplane(\"\
    XY\").polygon(6, d)\n                .extrude((z1 - z0) + 0.1).translate((0, 0,\
    \ z0 - 0.05)))\n\n    # nut pocket: entry relief, press lip, slip pocket\n   \
    \ body = body.cut(hexprism(p.mouth_relief_af, -0.2, p.mouth_relief_h))\n    body\
    \ = body.cut(hexprism(p.pocket_lip_af, p.mouth_relief_h,\n                   \
    \          p.mouth_relief_h + p.lip_h))\n    body = body.cut(hexprism(p.pocket_af,\
    \ p.mouth_relief_h + p.lip_h,\n                             p.pocket_depth))\n\
    \n    # relief ring: gives the pocket wall somewhere to flex so the nut\n    #\
    \ presses in by hand instead of having to crush solid plastic\n    d_in = p.groove_af_in\
    \ / math.cos(math.pi / 6.0)\n    d_out = p.groove_af_out / math.cos(math.pi /\
    \ 6.0)\n    ring = (cq.Workplane(\"XY\").polygon(6, d_out)\n            .extrude(p.pocket_depth\
    \ + 0.1)\n            .cut(cq.Workplane(\"XY\").polygon(6, d_in)\n           \
    \      .extrude(p.pocket_depth + 1.0).translate((0, 0, -0.5))))\n    body = body.cut(ring.translate((0,\
    \ 0, -0.1)))\n    return body\n"
  print_orientation: 'as modelled: flat bottom face on the bed (z = 0); the nut pocket
    mouth and the relief ring open downwards, so the lip is printed from the bed upwards
    and needs no support (flutes, chamfer and bore are all self-supporting)'
  use_orientation: nut pocket mouth pointing down the bolt's thread; grip the fluted
    band (17-20 mm across) and turn by hand; the bolt's tip shows through the 3.4
    mm hole in the top
- id: fit_coupon
  role: coupon
  material: PLA (same spool and settings as the knob)
  code: "import math\n\ndef build(p):\n    Hc = p.coupon_h\n    hx = p.coupon_pitch\
    \ + 7.0\n    body = cq.Workplane(\"XY\").rect(2.0 * hx, p.coupon_w).extrude(Hc)\n\
    \n    def hexprism(af, z0, z1, dx):\n        d = af / math.cos(math.pi / 6.0)\n\
    \        return (cq.Workplane(\"XY\").polygon(6, d)\n                .extrude((z1\
    \ - z0) + 0.1).translate((dx, 0, z0 - 0.05)))\n\n    d_in = p.groove_af_in / math.cos(math.pi\
    \ / 6.0)\n    d_out = p.groove_af_out / math.cos(math.pi / 6.0)\n    ring = (cq.Workplane(\"\
    XY\").polygon(6, d_out)\n            .extrude(p.pocket_depth + 0.1)\n        \
    \    .cut(cq.Workplane(\"XY\").polygon(6, d_in)\n                 .extrude(p.pocket_depth\
    \ + 1.0).translate((0, 0, -0.5))))\n\n    lips = [p.coupon_lip_af_1, p.coupon_lip_af_2,\
    \ p.coupon_lip_af_3]\n    for i in range(3):\n        af = lips[i]\n        dx\
    \ = (i - 1) * p.coupon_pitch\n        relief = af + (p.mouth_relief_af - p.pocket_lip_af)\n\
    \        body = body.cut(hexprism(relief, -0.2, p.mouth_relief_h, dx))\n     \
    \   body = body.cut(hexprism(af, p.mouth_relief_h,\n                         \
    \        p.mouth_relief_h + p.lip_h, dx))\n        body = body.cut(hexprism(p.pocket_af,\
    \ p.mouth_relief_h + p.lip_h,\n                                 p.pocket_depth,\
    \ dx))\n        body = body.cut(ring.translate((dx, 0, -0.1)))\n        body =\
    \ body.cut(cq.Workplane(\"XY\").circle(p.bore_d / 2.0)\n                     \
    \   .extrude(p.pocket_depth + 1.0)\n                        .translate((dx, 0,\
    \ p.pocket_depth - 0.05)))\n        # label dots on the top face\n        for\
    \ k in range(i + 1):\n            body = body.cut(cq.Workplane(\"XY\").circle(0.6).extrude(0.5)\n\
    \                            .translate((dx + (k - i * 0.5) * 1.7,\n         \
    \                               p.coupon_w / 2.0 - 2.0, Hc - 0.5)))\n    return\
    \ body\n"
  print_orientation: 'as modelled: flat bottom on the bed with all three pocket mouths
    opening downwards, i.e. exactly how the knob''s pocket prints'
  use_orientation: 'test rig only: press the nut into each pocket in turn, flats to
    flats, then turn the coupon pocket-down and tap it; 1 dot = 5.15 mm lip, 2 dots
    = 5.25 mm (the knob''s size), 3 dots = 5.35 mm'
hardware:
- id: m3nut
  ref: ISO 4032 M3
  qty: 1
- id: m3bolt
  ref: ISO 4762 M3x20
  qty: 1
joints:
- id: bolt_through_knob
  fastener: m3bolt
  axis_origin:
  - 0.0
  - 0.0
  - -5.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: entry relief and press lip hexagon (the bolt passes the 5.9 hex opening
      and the 5.25 lip)
    role: clearance
  - part: knob
    feature: pocket roof bore, 3.4 mm, from z = 3.8 to the top face
    role: clearance
  nut: m3nut
  external: the part the bolt passes through (assumed 5 mm thick, its head sits 5
    mm below the knob's mouth)
criteria:
- id: c1_nut_presses_in
  part: knob
  feature: nut pocket (entry relief / 5.25 press lip / 5.5 pocket)
  relation: contains
  hardware: m3nut
  clearance_mm: null
  params:
  - pocket_lip_af
  - pocket_af
  - nut_af
  - mouth_relief_af
  - mouth_relief_h
  - lip_h
  check:
    method: coupon
    ref: fit_coupon
    description: the 2-dot coupon pocket is the knob's lip size (5.25 across flats);
      the nut must go in with a firm thumb press and still be there after turning
      the coupon pocket-down and tapping it
- id: c2_lip_interference
  part: knob
  feature: press lip (hexagon 5.25 across flats)
  relation: engages
  hardware: m3nut
  clearance_mm: -0.25
  params:
  - pocket_lip_af
  - nut_af
  - lip_h
  - groove_af_in
  - groove_af_out
  check:
    method: coupon
    ref: fit_coupon
    description: 0.25 mm across-flats interference over 0.8 mm of height; the 0.8
      mm wall with the relief ring behind it flexes about 0.13 mm, so the press is
      light and the grip is elastic
- id: c3_nut_cannot_exit_top
  part: knob
  feature: pocket roof and central bore (3.4 mm)
  relation: supports
  hardware: m3nut
  clearance_mm: 0.0
  params:
  - bore_d
  - nut_ac
  - pocket_depth
  check:
    method: measure
    ref: null
    description: the roof at z = 3.8 is solid apart from the 3.4 mm bore; the nut
      is 6.35 mm across corners, so it can never be pushed out of the far side
- id: c4_nut_fully_inside
  part: knob
  feature: pocket mouth (z = 0)
  relation: contains
  hardware: m3nut
  clearance_mm: null
  params:
  - pocket_depth
  - nut_h
  - mouth_relief_h
  - lip_h
  check:
    method: measure
    ref: null
    description: seated against the roof, the nut's bottom face sits at z = 1.4 (3.8
      - 2.4), i.e. 1.4 mm inside the mouth, so nothing of the nut protrudes
- id: c5_lip_shoulder
  part: knob
  feature: top face of the press lip (shoulder at z = 1.2)
  relation: supports
  hardware: m3nut
  clearance_mm: 0.2
  params:
  - pocket_lip_af
  - pocket_af
  - lip_h
  - nut_h
  - pocket_depth
  check:
    method: coupon
    ref: null
    description: 'the lip is 0.25 mm smaller than the nut all round, so if the nut
      drops 0.2 mm its bottom face lands on the lip''s shoulder: retention that does
      not depend on print tolerance'
- id: c6_bore_clears_bolt
  part: knob
  feature: central bore (3.4 mm)
  relation: clears
  hardware: m3bolt
  clearance_mm: 0.4
  params:
  - bore_d
  - bolt_d
  check:
    method: measure
    ref: null
    description: an M3 shank (3.0 mm) has 0.4 mm of clearance through the roof and
      out of the top
- id: c7_bolt_shows_through
  part: knob
  feature: top opening (z = 11)
  relation: clears
  hardware: m3bolt
  clearance_mm: null
  params:
  - knob_h
  - bolt_len
  - bolt_buried
  check:
    method: measure
    ref: null
    description: 'the bolt goes through the nut and out the far side: with 5 mm buried,
      the M3x20 tip reaches z = 15, which is 4 mm past the knob''s top face; needs
      >= 11 mm of free shank'
manual:
- n: '1'
  text: 'Print fit_coupon. PLA, 0.2 mm layers, no supports: it sits flat with the
    three pocket mouths on the bed, which is exactly how the knob''s pocket prints.'
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Press the ISO 4032 M3 nut into each pocket in turn, by hand, flats facing
    flats. Read the dots: 1 dot = 5.15 mm across flats (tightest), 2 dots = 5.25 mm
    (the size used in the knob), 3 dots = 5.35 mm (loosest).'
  parts:
  - fit_coupon
  hardware:
  - m3nut
  tool: null
- n: '3'
  text: 'Judge the fit. The 2-dot pocket is the knob''s fit: it should take the nut
    with a firm thumb press, and the nut must still be in it after you turn the coupon
    pocket-down and tap it. Too tight in the 2-dot pocket -> expect the same in the
    knob and use the warm-water press in step 6. If even the 1-dot pocket is loose
    on your nut (rare), print the knob with pocket_lip_af reduced by 0.1 (to 5.15)
    - that is one number in the model.'
  parts:
  - fit_coupon
  hardware:
  - m3nut
  tool: null
- n: '4'
  text: Print knob. PLA, 0.2 mm layers, no supports, flat bottom face on the bed (the
    nut pocket faces down).
  parts:
  - knob
  hardware: []
  tool: null
- n: '5'
  text: 'Check the mouth: a hexagon 5.9 mm across the flats, narrowing to a 0.8 mm
    tall lip at 5.25, then opening out to a 5.5 mm hexagon whose roof is 3.8 mm deep.
    The 3.4 mm hole in that roof continues straight out of the top.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '6'
  text: 'Press the nut in. Put the nut on a hard flat surface, hold the knob mouth-down
    over it with the two hexagons aligned, and press straight down with your weight
    until it stops - the nut ends up 1.4 mm inside the mouth. It will not go further:
    above it is the roof. If it will not press in by hand, warm the knob in ~60 C
    water for a minute, press the nut in with a cloth, then cool it under the tap
    so the PLA shrinks onto the nut. No glue.'
  parts:
  - knob
  hardware:
  - m3nut
  tool: hot water (about 60 C) and a cloth
- n: '7'
  text: 'Test retention before you trust it: turn the knob upside down and shake and
    tap it. The nut must stay in - the 0.8 mm lip is smaller than the nut all round,
    so the nut is both gripped by the press and caught on the lip''s shoulder.'
  parts:
  - knob
  hardware:
  - m3nut
  tool: null
- n: '8'
  text: 'Thread the bolt in: mouth facing you, turn the M3 bolt up through the nut
    (or hold the bolt still and turn the knob). It goes through the nut and out of
    the far side - the tip appears in the 3.4 mm hole in the top face; the M3x20 listed
    shows about 4 mm of tip if roughly 5 mm of it is inside your part, so it needs
    at least 11 mm of free shank.'
  parts:
  - knob
  hardware:
  - m3bolt
  - m3nut
  tool: null
- n: '9'
  text: 'Use it: run the bolt through your part, start the knob mouth-first onto the
    thread and tighten by hand by the fluted band. To release, unscrew the knob; the
    nut stays captured inside it.'
  parts:
  - knob
  hardware:
  - m3bolt
  - m3nut
  tool: 2.5 mm hex key (only if you want to hold the bolt's socket head still)
