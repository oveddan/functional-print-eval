task: nut-knob/M3
note: 'One printed knob, 20 mm across, that swallows an ISO 4032 M3 hex nut. The nut
  is pressed in by hand into a hex pocket that is 0.08 mm under the nut''s 5.5 across-flats
  (a friction press fit, no glue); the pocket is 2.8 mm deep so the 2.4 mm nut ends
  up fully inside, 3.2 mm behind the open face. Behind the nut is a 2.5 mm wall pierced
  by a Ø3.4 bolt hole — too small for the nut to pass, so the nut can never be pushed
  out of the far face. The nut is pressed in through a Ø6.6 counterbore at the open
  face (it has to be ≥ the nut''s 6.35 across-corners to let the nut through); that
  same counterbore is the 3.2 mm deep home for the ISO 4762 M3x16 bolt head, so the
  head ends up flush-ish inside the knob and the threaded tip comes out of the far
  face, ready to go into whatever you are clamping. Turning the knob turns the trapped
  nut, so the knob winds along the bolt. The bolt is captive too: its 5.5 head cannot
  pass the hex pocket''s 5.4 across-flats.


  Everything prints without supports: with the far face on the bed, every hole either
  widens toward the top of the print or is a vertical wall, and the 12 grip grooves
  are plain vertical walls. Bed contact is the full Ø20 disc.


  Fit is the one thing I cannot pin down from here: the person could not measure their
  nut, so the pocket across-flats is a catalog-based guess (5.5 - 0.08 = 5.42) and
  the print''s hole tolerance will dominate. So I also hand in a test coupon with
  the same 2.8 mm pocket depth at 5.30 / 5.40 / 5.50 / 5.60 across-flats: print it,
  press the nut into each pocket, take the tightest one that goes in by hand and still
  holds the nut upside down, then set nut_pocket_af to that value and print the knob.
  Each coupon pocket has a Ø4.5 push-out hole under it so a stuck nut can be pushed
  back out.


  All hardware dimensions are catalog values (nut 5.5 AF / 2.4 high; M3 screw shank
  3.0, head 5.5 x 3.0). The M3x16 is fully threaded (threaded-to-head max 20), so
  it threads the nut wherever the nut sits.'
questions: []
params:
  knob_od:
    value: 20.0
    unit: mm
    kind: design
    source: asked
    note: 'user: hand knob about 20 mm across — this is the diameter across the grip
      lobes'
  grip_count:
    value: 12
    unit: count
    kind: design
    source: design
    note: vertical finger grooves around the rim; vertical walls, no supports
  grip_groove_r:
    value: 1.8
    unit: mm
    kind: design
    source: design
    note: radius of the cutter cylinder centred on the rim; valleys end up ~16.4 mm
      across
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across-flats; person could not measure it
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height
  nut_ac:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: across-corners, = nut_af / cos30 = 5.5/0.86603
  screw_shank_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3 shank
  screw_head_d:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3 socket head diameter
  screw_head_h:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3 socket head height
  screw_len:
    value: 16.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3x16, fully threaded (threaded-to-head max 20). Head underside
      sits 8.3 mm from the far face, so the tip leaves the far face by ~7.7 mm
  bolt_hole_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: = screw_shank_d + 0.4 clearance; far smaller than nut_af, which is what
      stops the nut leaving the far face
  head_pocket_d:
    value: 6.6
    unit: mm
    kind: design
    source: design
    note: must be >= nut_ac (6.35) so the nut can be pressed in through it; leaves
      0.55 mm around the 5.5 head
  head_pocket_depth:
    value: 3.2
    unit: mm
    kind: design
    source: design
    note: = screw_head_h + 0.2, so the head sits fully inside, 0.2 mm behind the open
      face
  nut_pocket_af:
    value: 5.42
    unit: mm
    kind: design
    source: design
    note: 'press fit: nut_af - 0.08. Set this from the coupon test before printing
      the knob (5.30/5.40/5.50/5.60 covered there)'
  nut_pocket_depth:
    value: 2.8
    unit: mm
    kind: design
    source: design
    note: = nut_h + 0.4, so the nut is fully inside the knob and recessed from the
      open face; also the coupon's pocket depth
  ceiling_t:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: wall between the nut pocket and the far face, pierced by bolt_hole_d
  coupon_len:
    value: 56.0
    unit: mm
    kind: design
    source: design
    note: coupon blank length
  coupon_w:
    value: 16.0
    unit: mm
    kind: design
    source: design
    note: coupon blank width
  coupon_pitch:
    value: 13.0
    unit: mm
    kind: design
    source: design
    note: spacing of the four test pockets along the coupon
  coupon_floor_t:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: thin floor under the test pockets; the nut's 6.35 across-corners cannot
      pass
  coupon_push_hole_d:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: '> a 4 mm pusher so a stuck nut can be pushed back out; < nut_af so the
      nut still stops on the floor'
  coupon_af_1:
    value: 5.3
    unit: mm
    kind: design
    source: design
    note: 'tightest coupon pocket: 0.20 mm interference on the nut''s 5.5 across-flats'
  coupon_af_2:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: 'coupon pocket: 0.10 mm interference'
  coupon_af_3:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: 'coupon pocket: nominal, zero interference'
  coupon_af_4:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: 'loosest coupon pocket: 0.10 mm clearance, covers undersized printing'
parts:
- id: knob
  role: final
  material: PLA (high-speed, black)
  code: "import math\n\n\ndef build(p):\n    # Print frame: z = 0 is the bed = the\
    \ knob's FAR face (the face the bolt tip exits).\n    # Going up, every hole widens\
    \ (Ø3.4 -> hex pocket -> Ø6.6), so nothing overhangs.\n    H = p.ceiling_t + p.nut_pocket_depth\
    \ + p.head_pocket_depth\n    R = p.knob_od / 2.0\n\n    # knob body\n    body\
    \ = cq.Workplane(\"XY\").circle(R).extrude(H)\n\n    # 12 vertical finger grooves\
    \ (vertical walls: printable, no supports)\n    n = int(round(p.grip_count))\n\
    \    for i in range(n):\n        a = 2.0 * math.pi * i / n\n        body = body.cut(\n\
    \            cq.Workplane(\"XY\")\n            .center(R * math.cos(a), R * math.sin(a))\n\
    \            .circle(p.grip_groove_r)\n            .extrude(H)\n        )\n\n\
    \    # bolt shank hole through the far wall (smaller than the nut: nut can never\
    \ pass)\n    body = body.cut(cq.Workplane(\"XY\").circle(p.bolt_hole_d / 2.0).extrude(H))\n\
    \n    # hex pocket for the ISO 4032 M3 nut, across-flats = nut_pocket_af (press\
    \ fit)\n    rv = (p.nut_pocket_af / math.cos(math.radians(30.0))) / 2.0  # across-corners\
    \ / 2\n    pts = [(rv * math.cos(math.radians(60.0 * i)),\n            rv * math.sin(math.radians(60.0\
    \ * i))) for i in range(6)]\n    body = body.cut(\n        cq.Workplane(\"XY\"\
    )\n        .workplane(offset=p.ceiling_t)\n        .polyline(pts).close()\n  \
    \      .extrude(p.nut_pocket_depth)\n    )\n\n    # counterbore for the bolt head,\
    \ open at the top: big enough for the nut to be pressed through\n    body = body.cut(\n\
    \        cq.Workplane(\"XY\")\n        .workplane(offset=p.ceiling_t + p.nut_pocket_depth)\n\
    \        .circle(p.head_pocket_d / 2.0)\n        .extrude(p.head_pocket_depth)\n\
    \    )\n    return body\n"
  print_orientation: 'Far face on the bed: z = 0 is the flat Ø20 face pierced by the
    small Ø3.4 hole (the face the bolt tip exits); the nut pocket and the Ø6.6 counterbore
    open upward at z = 8.5. No supports.'
  use_orientation: Held in the hand with the far face (where the threaded tip sticks
    out) pointing at the workpiece and the wide Ø6.6 counterbore facing the hand;
    the nut is pressed in from the counterbore side and the bolt is dropped in from
    that same side.
- id: coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "import math\n\n\ndef build(p):\n    # Print frame: z = 0 is the bed = the\
    \ coupon's thin floor (with the push-out holes).\n    T = p.coupon_floor_t + p.nut_pocket_depth\n\
    \    L = p.coupon_len\n    W = p.coupon_w\n    body = cq.Workplane(\"XY\").box(L,\
    \ W, T, centered=(False, True, False))\n\n    afs = [p.coupon_af_1, p.coupon_af_2,\
    \ p.coupon_af_3, p.coupon_af_4]\n    x0 = (L - p.coupon_pitch * (len(afs) - 1))\
    \ / 2.0\n    for i, af in enumerate(afs):\n        x = x0 + i * p.coupon_pitch\n\
    \        # push-out hole in the floor\n        body = body.cut(\n            cq.Workplane(\"\
    XY\").center(x, 0.0)\n            .circle(p.coupon_push_hole_d / 2.0)\n      \
    \      .extrude(p.coupon_floor_t + 0.2)\n        )\n        # hex test pocket:\
    \ same depth as the knob's nut pocket, different across-flats\n        rv = (af\
    \ / math.cos(math.radians(30.0))) / 2.0\n        pts = [(x + rv * math.cos(math.radians(60.0\
    \ * k)),\n                rv * math.sin(math.radians(60.0 * k))) for k in range(6)]\n\
    \        body = body.cut(\n            cq.Workplane(\"XY\")\n            .workplane(offset=p.coupon_floor_t)\n\
    \            .polyline(pts).close()\n            .extrude(p.nut_pocket_depth +\
    \ 0.2)\n        )\n\n    # small nub marking the end nearest the tightest (5.30)\
    \ pocket\n    body = body.union(\n        cq.Workplane(\"XY\").workplane(offset=T)\n\
    \        .center(x0 - 4.5, 6.0)\n        .circle(1.0)\n        .extrude(1.5)\n\
    \    )\n    return body\n"
  print_orientation: Thin floor with the four Ø4.5 push-out holes on the bed (z =
    0); the four hex test pockets open upward. No supports (each pocket widens toward
    the top of the print).
  use_orientation: Flat on the bench, pockets up. Press the M3 nut into each pocket
    from above, flats aligned; test retention; push a stuck nut back out from below
    through the Ø4.5 hole with a 4 mm pusher.
hardware:
- id: nut_m3
  ref: ISO 4032 M3
  qty: 1
- id: screw_m3
  ref: ISO 4762 M3x16
  qty: 1
joints:
- id: j_nut
  fastener: nut_m3
  axis_origin:
  - 0.0
  - 0.0
  - 5.3
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: hex nut pocket (across-flats = nut_pocket_af, 2.8 deep, open at the counterbore
      floor at z = 5.3)
    role: nut_pocket
  nut: null
  external: null
- id: j_screw
  fastener: screw_m3
  axis_origin:
  - 0.0
  - 0.0
  - 5.3
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: bolt head counterbore Ø6.6 x 3.2 deep (open at z = 8.5)
    role: clearance
  - part: knob
    feature: counterbore floor / nut pocket opening at z = 5.3 (bolt head bearing
      face)
    role: head_seat
  - part: knob
    feature: hex nut pocket (across-flats = nut_pocket_af)
    role: nut_pocket
  - part: knob
    feature: Ø3.4 bolt hole through the 2.5 mm ceiling, exits at z = 0
    role: clearance
  nut: null
  external: null
criteria:
- id: c1_nut_press_fit
  part: knob
  feature: hex nut pocket (six flats, across-flats = nut_pocket_af, 2.8 mm deep, open
    at the counterbore floor)
  relation: engages
  hardware: nut_m3
  clearance_mm: -0.08
  params:
  - nut_pocket_af
  - nut_af
  - nut_pocket_depth
  - nut_h
  check:
    method: coupon
    ref: coupon
    description: Print the coupon, press the M3 nut into each of the four test pockets
      in turn. Keep the tightest across-flats that goes in by hand AND holds the nut
      when the coupon is turned upside down and tapped; set nut_pocket_af to that
      value and print the knob.
- id: c2_nut_fully_inside
  part: knob
  feature: nut pocket (2.8 mm deep, floor 3.2 mm behind the open face) and the Ø6.6
    counterbore the nut passes through
  relation: contains
  hardware: nut_m3
  clearance_mm: null
  params:
  - nut_pocket_depth
  - nut_h
  - head_pocket_d
  - nut_ac
  check:
    method: measure
    ref: null
    description: Pocket depth 2.8 > nut height 2.4, and head_pocket_d 6.6 > nut across-corners
      6.35 so the nut can be pressed in through the counterbore; the nut therefore
      ends up fully inside the knob, recessed behind the open face.
- id: c3_nut_cannot_leave_far_side
  part: knob
  feature: 'far end of the nut pocket: 2.5 mm ceiling wall pierced by the Ø3.4 bolt
    hole'
  relation: faces
  hardware: nut_m3
  clearance_mm: null
  params:
  - ceiling_t
  - bolt_hole_d
  - nut_af
  - nut_ac
  check:
    method: measure
    ref: null
    description: The only opening beyond the nut is Ø3.4, far smaller than the nut's
      5.5 across-flats / 6.35 across-corners, so the nut has no path out of the far
      face however hard it is pushed.
- id: c4_bolt_through_and_out
  part: knob
  feature: Ø3.4 bolt hole through the ceiling plus the Ø6.6 x 3.2 counterbore
  relation: clears
  hardware: screw_m3
  clearance_mm: null
  params:
  - bolt_hole_d
  - screw_shank_d
  - head_pocket_d
  - head_pocket_depth
  - screw_head_d
  - screw_head_h
  - screw_len
  check:
    method: measure
    ref: null
    description: 'Drop the M3x16 into the counterbore and turn it into the nut: the
      Ø3.4 hole clears the 3.0 shank, the tip comes out of the far face by about 7.7
      mm, and the 5.5 x 3.0 head sits in the Ø6.6 x 3.2 recess 0.2 mm behind the open
      face.'
- id: c5_grip_od
  part: knob
  feature: 'finger grip: 12 vertical grooves; outer lobes'
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - knob_od
  - grip_count
  - grip_groove_r
  check:
    method: measure
    ref: null
    description: Outer diameter across the lobes ≈ 20 mm as asked (across the valleys
      ≈ 16.4 mm), so it is a two-finger hand knob.
- id: c6_coupon_pockets
  part: coupon
  feature: four hex test pockets, across-flats coupon_af_1..4, each 2.8 mm deep over
    a Ø4.5 push-out hole
  relation: contains
  hardware: nut_m3
  clearance_mm: null
  params:
  - coupon_af_1
  - coupon_af_2
  - coupon_af_3
  - coupon_af_4
  - nut_pocket_depth
  - coupon_push_hole_d
  check:
    method: measure
    ref: null
    description: Pockets span 0.20 mm interference (5.30), 0.10 mm interference (5.40),
      nominal (5.50) and 0.10 mm clearance (5.60) around the nut's 5.5 across-flats,
      all at the knob's real 2.8 mm engagement depth; the Ø4.5 floor hole lets a 4
      mm pusher free a stuck nut.
manual:
- n: '1'
  text: 'Print `coupon` in PLA at 0.2 mm layers exactly as modelled, no supports:
    the thin floor with the four Ø4.5 holes sits on the bed and the four hex pockets
    open upward.'
  parts:
  - coupon
  hardware: []
  tool: Bambu Lab X1C
- n: '2'
  text: 'Press the M3 hex nut into the test pocket nearest the small nub on the top
    face (that end is the tightest, 5.30 across-flats). Align the nut''s flats with
    the pocket''s flats and push with your thumb. Then try the next pockets along
    the row: 5.40, 5.50, 5.60. If one will not go in by hand, do not force it - leave
    that nut where it is and move on.'
  parts:
  - coupon
  hardware:
  - nut_m3
  tool: null
- n: '3'
  text: 'Test each pocket you managed to fill: turn the coupon upside down and tap
    it on the bench. The nut must stay in. Note the across-flats of the tightest pocket
    that both pressed in by hand AND holds the nut upside down. If a nut is stuck
    in a pocket that was too tight, push it back out from below with a 4 mm pusher
    through the Ø4.5 hole.'
  parts:
  - coupon
  hardware:
  - nut_m3
  tool: 4 mm pusher (blunt drill shank, hex key)
- n: '4'
  text: 'Set the knob''s `nut_pocket_af` to the across-flats you noted (the default
    is 5.42, i.e. 0.08 mm of interference) and print `knob` in PLA at 0.2 mm layers
    exactly as modelled, no supports: the flat far face with the small Ø3.4 hole on
    the bed, the wide Ø6.6 counterbore facing up.'
  parts:
  - knob
  hardware: []
  tool: Bambu Lab X1C
- n: '5'
  text: 'Press the M3 hex nut into the knob''s hex pocket: enter from the wide Ø6.6
    counterbore (the nut passes straight through it), line the nut''s flats up with
    the pocket''s flats, and push it home with your thumb. It seats 2.8 mm deep, so
    it disappears inside the knob.'
  parts:
  - knob
  hardware:
  - nut_m3
  tool: null
- n: '6'
  text: 'Turn the knob upside down and tap it on the bench: the nut must stay in without
    glue. If it falls out, the pocket is too loose - print the knob again with a smaller
    `nut_pocket_af`, or re-check the coupon. If you could not press it in at all,
    go the other way.'
  parts:
  - knob
  hardware:
  - nut_m3
  tool: null
- n: '7'
  text: 'Drop the ISO 4762 M3x16 bolt into the Ø6.6 counterbore tip-first and turn
    it into the nut by hand. Keep turning: the thread runs through the nut and the
    tip comes out of the far face. The head comes to rest in the counterbore, 0.2
    mm inside the open face, and it cannot fall back out because the 5.5 head is wider
    than the pocket''s 5.4 across-flats.'
  parts:
  - knob
  hardware:
  - screw_m3
  tool: 2.5 mm hex key (optional, only to start the bolt)
- n: '8'
  text: 'To use it: grip the 20 mm knurled rim, poke the bolt''s protruding tip into
    the hole you are clamping, and turn the knob. The trapped nut turns with the knob,
    so the knob winds itself along the bolt and clamps. Turn the other way to release.'
  parts:
  - knob
  hardware: []
  tool: null
