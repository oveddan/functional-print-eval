task: nut-knob/M3
note: 'One printed piece: a Ø20 mm fluted hand knob with a blind hex pocket for an
  ISO 4032 M3 nut, closed by a roof that carries only the Ø3.4 mm M3 clearance hole.
  The nut presses into the pocket by hand, bottoms on the roof (fully inside the knob,
  recessed 1.2 mm), and is held by an interference fit — no glue — so it stays put
  upside down. The bolt enters through the closed face, threads through the nut and
  its tip comes out of the pocket mouth (~8 mm of thread showing with an M3x20). Everything
  prints without supports: closed face on the bed, pocket mouth up, all walls vertical.


  Fit is the only printer-dependent item, so print the coupon first: five hex pockets
  5.30 / 5.40 / 5.50 / 5.60 / 5.70 mm across flats. The knob is drawn at 5.50 (nominal
  nut AF; FDM pockets usually come out 0.05–0.15 mm small, which is the press fit).
  Pick the smallest pocket you can push the nut into with a firm thumb push that still
  holds it face-down and shaken. If that is 5.40–5.60, print the knob as-is. If only
  5.70 or only 5.30 works, the knob''s hex_af parameter must be set to that value
  before printing — everything else stays the same.


  Hardware: the nut must be a standard ISO 4032 M3 hex nut (5.5 AF, 2.4 thick); with
  a thin jam nut or a nyloc the pocket depth would need changing. The bolt is listed
  as ISO 4762 M3x20, but any M3 bolt with at least 12 mm of thread below the head
  will pass through the nut and out of the knob.'
questions:
- text: Is your M3 nut a standard ISO 4032 hex nut (5.5 mm across flats, 2.4 mm thick),
    or a thinner jam nut / taller nyloc? A thinner or taller nut would need the pocket
    depth changed.
  answer: null
- text: What is your M3 bolt's thread length under the head? Anything from 12 mm up
    works; the model is drawn for a 20 mm bolt giving ~8 mm of protrusion.
  answer: null
params:
  knob_od:
    value: 20.0
    unit: mm
    kind: design
    source: asked
    note: '''about 20 mm across'' from the request; measured across the flute ridges'
  knob_h:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: grip height; leaves an 8.4 mm cap between the closed face and the pocket
      roof for the bolt to cross
  hex_af:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: pocket width across flats, nominal equal to the nut AF; the press fit comes
      from FDM pockets printing 0.05-0.15 mm small — confirm with the coupon ladder
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats; the nut could not be measured
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height; could not be measured
  pocket_depth:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: press-fit hex section height = nut_h 2.4 + 0.6, so a seated nut sits fully
      inside
  pocket_lead:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: wider lead-in relief at the mouth (AF + 1.2 mm) so the nut can be started
      square by hand
  bolt_clearance_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: 3.0 mm shank + 0.4 mm clearance; this is also the roof hole, which is smaller
      than the nut so the nut cannot exit the far side
  bolt_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3 nominal shank; could not be measured
  bolt_len:
    value: 20.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3x20 length under the head; needs at least 12 mm to reach the
      pocket mouth
  flute_count:
    value: 12
    unit: mm
    kind: design
    source: design
    note: ''
  flute_r:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: radius of the scallop cutters
  flute_depth:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: depth of each grip scallop below the 20 mm ridge circle; valleys 18 mm
  coupon_l:
    value: 50.0
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_w:
    value: 14.0
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_t:
    value: 3.6
    unit: mm
    kind: design
    source: design
    note: = pocket_depth + pocket_lead, so each coupon hole is as deep as the knob's
      pocket
  coupon_pitch:
    value: 9.5
    unit: mm
    kind: design
    source: design
    note: ''
  af_test_1:
    value: 5.3
    unit: mm
    kind: design
    source: design
    note: coupon pocket nearest the orientation notch
  af_test_2:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: ''
  af_test_3:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: same as the knob's hex_af
  af_test_4:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: ''
  af_test_5:
    value: 5.7
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\n\ndef build(p):\n    ac = math.cos(math.radians(30.0))   \
    \       # across-flats = across-corners * cos30\n    R = p.knob_od / 2.0\n\n \
    \   # body: flat closed face on the bed at z = 0\n    body = cq.Workplane(\"XY\"\
    ).circle(R).extrude(p.knob_h)\n\n    # grip flutes, cut evenly around the rim\n\
    \    a = R + p.flute_r - p.flute_depth          # cutter axis distance -> flute_depth\
    \ deep\n    n = int(round(p.flute_count))\n    for i in range(n):\n        ang\
    \ = 2.0 * math.pi * i / n\n        body = body.cut(\n            cq.Workplane(\"\
    XY\")\n            .workplane(offset=-1.0)\n            .center(a * math.cos(ang),\
    \ a * math.sin(ang))\n            .circle(p.flute_r)\n            .extrude(p.knob_h\
    \ + 2.0)\n        )\n\n    def hexpts(af):\n        r = af / 2.0 / ac\n      \
    \  return [(r * math.cos(math.radians(60.0 * i)),\n                 r * math.sin(math.radians(60.0\
    \ * i))) for i in range(6)]\n\n    z_roof = p.knob_h - p.pocket_depth - p.pocket_lead\n\
    \n    # press-fit hex section (nut seats on its floor)\n    body = body.cut(\n\
    \        cq.Workplane(\"XY\").workplane(offset=z_roof)\n        .polyline(hexpts(p.hex_af)).close()\n\
    \        .extrude(p.pocket_depth)\n    )\n\n    # wider lead-in at the pocket\
    \ mouth\n    body = body.cut(\n        cq.Workplane(\"XY\").workplane(offset=z_roof\
    \ + p.pocket_depth)\n        .polyline(hexpts(p.hex_af + 2.0 * p.pocket_lead)).close()\n\
    \        .extrude(p.pocket_lead + 1.0)\n    )\n\n    # M3 clearance hole through\
    \ the closed face into the pocket\n    body = body.cut(\n        cq.Workplane(\"\
    XY\").workplane(offset=-1.0)\n        .circle(p.bolt_clearance_d / 2.0)\n    \
    \    .extrude(z_roof + 2.0)\n    )\n\n    return body\n"
  print_orientation: Closed face (the flat face with the Ø3.4 mm hole) on the bed
    at z = 0; body extends +Z to z = 12. Pocket mouth at the top, open upward. Flutes,
    hex pocket walls and the bolt hole are all vertical; the pocket roof is a ~6.3
    mm bridge. No supports.
  use_orientation: 'Same orientation as printed but upside down in use: closed face
    with the bolt hole at the top, mouth at the bottom. The nut presses up into the
    pocket from below; the bolt enters from above through the 3.4 mm hole, threads
    through the nut, and its tip emerges from the mouth.'
- id: coupon
  role: coupon
  material: PLA
  code: "import math\n\n\ndef build(p):\n    ac = math.cos(math.radians(30.0))\n \
    \   t = p.coupon_t\n\n    plate = cq.Workplane(\"XY\").box(\n        p.coupon_l,\
    \ p.coupon_w, t, centered=(True, True, False)\n    )\n\n    # orientation notch:\
    \ the notched end holds the 5.30 pocket\n    notch = cq.Solid.makeBox(\n     \
    \   4.0, p.coupon_w, t + 2.0,\n        cq.Vector(-p.coupon_l / 2.0 - 1.0, -p.coupon_w\
    \ / 2.0, -1.0),\n    )\n    plate = plate.cut(notch)\n\n    afs = [p.af_test_1,\
    \ p.af_test_2, p.af_test_3, p.af_test_4, p.af_test_5]\n    n = len(afs)\n    for\
    \ i, af in enumerate(afs):\n        x = p.coupon_pitch * (i - (n - 1) / 2.0)\n\
    \        r = af / 2.0 / ac\n        pts = [(x + r * math.cos(math.radians(60.0\
    \ * j)),\n                r * math.sin(math.radians(60.0 * j))) for j in range(6)]\n\
    \        plate = plate.cut(\n            cq.Workplane(\"XY\").workplane(offset=-1.0)\n\
    \            .polyline(pts).close()\n            .extrude(t + 2.0)\n        )\n\
    \n    return plate\n"
  print_orientation: Flat on the bed, hex holes vertical, notch visible on the top
    face. No supports.
  use_orientation: Press the M3 nut into each hex pocket from either face, then hold
    the plate face-down and shake it to judge retention.
