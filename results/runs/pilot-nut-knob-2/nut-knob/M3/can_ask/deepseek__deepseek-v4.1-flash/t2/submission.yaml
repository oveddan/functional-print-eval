  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: hex_nut_pocket
    role: nut_pocket
  nut: null
  external: null
- id: bolt_through_knob
  fastener: m3bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: closed_face_head_seat
    role: head_seat
  - part: knob
    feature: bolt_clearance_hole
    role: clearance
  nut: m3nut
  external: null
criteria:
- id: nut_press_fit
  part: knob
  feature: hex_nut_pocket
  relation: contains
  hardware: m3nut
  clearance_mm: 0.0
  params:
  - hex_af
  - nut_af
  - pocket_depth
  - nut_h
  check:
    method: coupon
    ref: coupon
    description: 'Light interference fit: the nut must go into the knob''s 5.50 pocket
      with a firm thumb push (no tool) and must be held by friction alone. Nominal
      pocket AF 5.50 vs nut AF 5.50; FDM hex pockets print slightly small, which is
      the interference. Verified on the coupon ladder 5.30-5.70; the knob''s 5.50
      corresponds to coupon pocket 3 (nearest the 5.50 winner).'
- id: nut_stays_when_inverted
  part: knob
  feature: hex_nut_pocket
  relation: engages
  hardware: m3nut
  clearance_mm: 0.0
  params:
  - hex_af
  - nut_af
  - pocket_depth
  check:
    method: coupon
    ref: coupon
    description: 'Press the nut into the coupon pocket that matched the knob (the
      winner from the ladder; 5.50 by default), hold the plate face-down and shake:
      the nut must stay in with no glue.'
- id: nut_cannot_exit_far_side
  part: knob
  feature: pocket_roof
  relation: supports
  hardware: m3nut
  clearance_mm: null
  params:
  - bolt_clearance_d
  - nut_af
  - pocket_depth
  - pocket_lead
  - nut_h
  check:
    method: none
    ref: null
    description: The pocket roof carries only the Ø3.4 mm bolt hole, which is far
      smaller than the nut's 5.50 mm across-flats, so the nut stops on the roof and
      cannot be pushed out of the closed face. Seated, the nut's outer face is 1.2
      mm inside the pocket mouth, i.e. fully inside the knob.
- id: bolt_clearance
  part: knob
  feature: bolt_clearance_hole
  relation: clears
  hardware: m3bolt
  clearance_mm: 0.4
  params:
  - bolt_clearance_d
  - bolt_d
  check:
    method: measure
    ref: null
    description: 'Measure the printed hole across its diameter (expect ≈3.4 mm), or
      simply slide the M3 bolt in: the Ø3.0 shank must pass through with a little
      play.'
- id: bolt_protrudes_past_nut
  part: knob
  feature: pocket_mouth
  relation: clears
  hardware: m3bolt
  clearance_mm: null
  params:
  - bolt_len
  - knob_h
  - pocket_depth
  - pocket_lead
  - nut_h
  - bolt_clearance_d
  check:
    method: none
    ref: null
    description: With the head on the closed face, the 20 mm under-head length crosses
      the 8.4 mm cap and the 2.4 mm nut and reaches the 12 mm pocket mouth, leaving
      about 8 mm of thread out in the open past the nut and out of the knob. Any M3
      bolt with at least ~12 mm of thread below the head also satisfies this.
manual:
- n: '1'
  text: Print the coupon (part 'coupon') in PLA, 0.2 mm layers, flat on the bed with
    the hex holes vertical. No supports, no brim. It is 50 x 14 x 3.6 mm and takes
    a few minutes.
  parts:
  - coupon
  hardware: []
  tool: null
- n: '2'
  text: The notch on the left end marks the 5.30 mm pocket. Going away from the notch
    the pockets are 5.30, 5.40, 5.50, 5.60, 5.70 mm across flats. Press your M3 hex
    nut into each one in turn, flat face first, from either face of the plate, with
    a firm thumb push.
  parts:
  - coupon
  hardware:
  - m3nut
  tool: null
- n: '3'
  text: For each pocket that the nut goes into, hold the coupon face-down over the
    table and shake it. The pocket you want is the smallest one the nut presses into
    by hand that still refuses to drop out. Note that number.
  parts:
  - coupon
  hardware:
  - m3nut
  tool: null
- n: '4'
  text: 'Compare with the knob: it is drawn with hex_af = 5.50 (the coupon''s middle
    pocket, nearest the notch side). If your winning pocket is 5.40, 5.50 or 5.60,
    print the knob as it is. If 5.50 was clearly far too tight or far too loose and
    only 5.30 or 5.70 worked, set the knob''s hex_af parameter to your winning number
    before slicing; nothing else changes.'
  parts:
  - coupon
  - knob
  hardware: []
  tool: null
- n: '5'
  text: Print the knob (part 'knob') in PLA at 0.2 mm layers with the flat closed
    face — the one with the small Ø3.4 mm hole — on the bed. The hex pocket will open
    upward. No supports needed; the pocket roof bridges about 6 mm.
  parts:
  - knob
  hardware: []
  tool: null
- n: '6'
  text: Press the M3 hex nut into the knob from the wide open face (the face opposite
    the small hole), flat face first, using the chamfered lead-in to get it square.
    Push with your thumb until it stops dead on the pocket roof. It ends up about
    1.2 mm below the rim — fully inside the knob.
  parts:
  - knob
  hardware:
  - m3nut
  tool: null
- n: '7'
  text: Turn the knob upside down over the table and shake it. The nut must stay in.
    If it falls out, the pocket is too loose — go back to the coupon and reprint the
    knob with the next smaller hex_af.
  parts:
  - knob
  hardware:
  - m3nut
  tool: null
- n: '8'
  text: Push the M3x20 bolt through the small Ø3.4 mm hole in the closed face from
    the outside, then turn it into the nut. Keep turning until the tip comes out of
    the open face; about 8 mm of thread will stand proud of the knob and the bolt
    head will sit flat on the closed face.
  parts:
  - knob
  hardware:
  - m3bolt
  - m3nut
  tool: null
- n: '9'
  text: 'Use: hold the knob by the fluted rim and turn. The captive nut turns with
    the knob and drives the bolt through the far side. The nut cannot pass the pocket
    roof and cannot fall out when the knob is inverted.'
  parts:
  - knob
  hardware:
  - m3bolt
  - m3nut
  tool: null
