manual:
- n: '1'
  text: Print the coupon flat on the bed, PLA, 0.2 mm layers, no supports. It is a
    68 x 18 x 5 mm plate with five hex pockets along it; the rows of small dots alongside
    tell you which pocket is which (1 dot = 5.26 mm, 2 = 5.34, 3 = 5.42, 4 = 5.50,
    5 = 5.58 mm across the flats).
  parts:
  - coupon
  hardware: []
  tool: null
- n: '2'
  text: Press the M3 hex nut into pocket 1, then into 2, 3, 4 and 5. Note which pocket
    takes a firm push of the thumb but still goes in by hand, and which one you cannot
    push in at all.
  parts: []
  hardware:
  - m3-nut
  tool: null
- n: '3'
  text: Turn the plate upside down and tap it. The nut must stay in the pocket you
    chose. Pocket 3 (5.42 mm) is the size built into the knob - if a different pocket
    held best, change hex_pocket_af in the knob's code to that pocket's value before
    step 4.
  parts:
  - coupon
  hardware:
  - m3-nut
  tool: null
- n: '4'
  text: 'Print the knob. It is already modelled in its print orientation: the flat
    countersunk face goes on the bed (z = 0) and the open hex pocket faces up. PLA,
    0.2 mm layers, no supports, no brim needed.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '5'
  text: Press the M3 hex nut into the wide hex opening of the knob (the end opposite
    the flat countersunk face), pressing it flat with your thumb until it stops against
    the ceiling. It should end up 0.6 mm below the mouth. If it is stiff, press evenly
    with a bench vise or smooth-jawed pliers - never hammer it.
  parts:
  - knob
  hardware:
  - m3-nut
  tool: null
- n: '6'
  text: 'Check the capture: hold the knob with the hex opening facing down and shake
    it - the nut must not fall out. Then press the nut back the other way with a pencil
    tip through the opening; it must stop on the ceiling and must never appear at
    the countersunk face.'
  parts:
  - knob
  hardware:
  - m3-nut
  tool: null
- n: '7'
  text: Take the M3 bolt (M3x16 is ideal; anything from M3x12 to M3x25 works) and
    push it through the countersunk 3.4 mm hole in the flat face. Turn it into the
    nut's thread and keep turning until the tip comes out of the nut and is visible
    in the hex opening.
  parts:
  - knob
  hardware:
  - m3-bolt
  - m3-nut
  tool: null
- n: '8'
  text: 'Use it by turning the fluted body by hand. Always feed the bolt in through
    the flat countersunk face: tightening then pushes the nut into the ceiling, so
    the load never tries to pull the nut out of the pocket.'
  parts:
  - knob
  hardware:
  - m3-bolt
  tool: null
