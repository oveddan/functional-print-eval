manual:
- n: '1'
  text: 'Print the coupon (part coupon) first: PLA, 0.2 mm layers, no supports. It
    is a 44 x 16 x 8 mm block whose three sockets open upward.'
  parts:
  - coupon
  hardware: []
  tool: 3D printer
- n: '2'
  text: 'Press your M3 hex nut (nut) into the MIDDLE socket with your thumb until
    it bottoms out (its outer face ends up just inside the socket). The three sockets
    differ only in rib height: left 0.10 mm, middle 0.15 mm (same as the knob), right
    0.20 mm.'
  parts:
  - coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: Turn the coupon upside down and shake it. The nut must not fall out. Also
    try the left and right sockets to see how the grip changes.
  parts:
  - coupon
  hardware:
  - nut
  tool: null
- n: '4'
  text: 'Tune only if you need to: if the middle socket is too tight to press in by
    thumb, re-slice the knob with rib_h = 0.10 (or pocket_af = 5.70); if the nut falls
    out of the middle socket, re-slice with rib_h = 0.20 (or pocket_af = 5.50). Nothing
    else changes.'
  parts:
  - knob
  - coupon
  hardware:
  - nut
  tool: slicer
- n: '5'
  text: 'Print the knob (part knob): PLA, 0.2 mm layers, no supports, bottom face
    on the bed so the hex socket''s mouth is face down and the dished top faces up.'
  parts:
  - knob
  hardware: []
  tool: 3D printer
- n: '6'
  text: 'Press the M3 hex nut (nut) into the knob''s socket from the open bottom face,
    thumb pressure, until it stops against the roof. It sits fully inside: its outer
    face is 0.8 mm recessed from the knob''s bottom face, so it never touches your
    workpiece.'
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '7'
  text: 'Check the retention: turn the knob upside down - the nut stays in. Push the
    nut from the mouth side - the roof above it (with only a 3.4 mm hole) stops it
    from going out the far side.'
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '8'
  text: Pass your M3 bolt (bolt) through your workpiece and thread its tip into the
    nut through the knob's open bottom face, until the tip comes out of the 3.4 mm
    hole in the dished top. About 4 mm of thread past the nut lets it emerge; about
    7 mm reaches the top face.
  parts:
  - knob
  hardware:
  - bolt
  tool: null
- n: '9'
  text: Tighten by hand with the scalloped rim. Loosen and tighten as often as you
    like - the nut is captive, so nothing falls out and no tool is needed.
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: null
- n: '10'
  text: 'To remove the nut: push it back out through the mouth with the bolt or your
    thumb (a firm push, the ribs release).'
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: null
