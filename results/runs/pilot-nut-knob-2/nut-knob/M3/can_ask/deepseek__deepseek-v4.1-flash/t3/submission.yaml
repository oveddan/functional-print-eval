criteria:
- id: c1_press_fit
  part: hand_knob
  feature: hex_nut_pocket
  relation: engages
  hardware: nut_m3
  clearance_mm: null
  params:
  - nut_af
  - pocket_af
  - pocket_af_a
  - pocket_af_b
  - pocket_af_c
  - pocket_depth
  check:
    method: coupon
    ref: fit_coupon
    description: 'Press the ISO 4032 M3 nut into all three coupon pockets by hand
      (thumb, or lay the nut on the table and push the coupon down onto it). Then
      hold the coupon pocket-down and tap it: the nut must stay in. Use the smallest
      AF that presses by hand and holds; set pocket_af to it and re-slice the knob.
      If none holds, drop to 5.30; if all are too tight, go up to 5.70.'
- id: c2_shoulder_stops_nut
  part: hand_knob
  feature: pocket_floor
  relation: supports
  hardware: nut_m3
  clearance_mm: null
  params:
  - nut_h
  - pocket_depth
  - nut_af
  - bolt_clear_d
  check:
    method: coupon
    ref: fit_coupon
    description: 'Press the nut into a coupon pocket until it bottoms on the floor,
      then push hard from the pocket side with a pin or your thumb: the nut must not
      pass through, because the floor''s only opening is Ø3.4.'
- id: c3_nut_fully_inside
  part: hand_knob
  feature: pocket_mouth_recess
  relation: contains
  hardware: nut_m3
  clearance_mm: null
  params:
  - nut_h
  - pocket_depth
  check:
    method: measure
    ref: null
    description: After pressing, the nut's outer face must sit 0.3 mm below the knob's
      mouth face (pocket_depth 2.7 - nut_h 2.4). Feel it with a fingernail or measure
      with calipers.
- id: c4_bolt_clears
  part: hand_knob
  feature: bolt_clearance_hole
  relation: clears
  hardware: bolt_m3
  clearance_mm: 0.2
  params:
  - bolt_d
  - bolt_clear_d
  check:
    method: measure
    ref: null
    description: Pass the M3 bolt through the bearing-face hole and turn it up through
      the nut; it must run freely and emerge from the mouth. Calipers on the hole
      should read about 3.4 mm.
- id: c5_coupon_af
  part: fit_coupon
  feature: hex_pockets
  relation: contains
  hardware: null
  clearance_mm: null
  params:
  - pocket_af_a
  - pocket_af_b
  - pocket_af_c
  check:
    method: measure
    ref: null
    description: 'Calipers across the flats of each coupon pocket: 5.40 (1 dot), 5.50
      (2 dots), 5.60 (3 dots), each within about ±0.10 mm of nominal. If the whole
      set reads tight or loose, shift pocket_af accordingly.'
manual:
- n: '1'
  text: Slice fit_coupon. STL as supplied, PLA, 0.2 mm layers, 0.4 mm nozzle, no supports,
    no brim. The flat face with no pockets goes on the bed; the three hex pockets
    open upward.
  parts:
  - fit_coupon
  hardware: []
  tool: Bambu Lab X1C
- n: '2'
  text: 'Press your ISO 4032 M3 nut into each of the three pockets, hex aligned with
    the pocket hex. Push with your thumb, or lay the nut on the table and press the
    coupon down onto it. Note which pockets go in by hand and which are too tight.
    The pockets are labelled by dimples on the top face beside them: 1 dot = 5.40
    mm, 2 dots = 5.50 mm, 3 dots = 5.60 mm.'
  parts:
  - fit_coupon
  hardware:
  - nut_m3
  tool: null
- n: '3'
  text: Turn the coupon pocket-down over a table and tap or shake it. The nut must
    stay in. Pick the SMALLEST across-flats that both presses in by hand and holds
    the nut upside down. If that is 5.50 mm, print the knob exactly as supplied; otherwise
    edit the pocket_af value in the hand_knob code to the winning number (try 5.30
    if nothing holds, 5.70 if everything is too tight) and re-slice.
  parts:
  - fit_coupon
  hardware:
  - nut_m3
  tool: null
- n: '4'
  text: Slice hand_knob. PLA, 0.2 mm layers, no supports. Bearing face (the flat disc
    with the small Ø3.4 hole) on the bed, hex pocket opening up. About 3 g and 25
    minutes.
  parts:
  - hand_knob
  hardware: []
  tool: Bambu Lab X1C
- n: '5'
  text: Press the nut into the knob's hex pocket from the top opening, keeping the
    hex aligned with the pocket. Push it down until it stops on the pocket floor.
    Its outer face should end up 0.3 mm below the mouth face, i.e. fully inside the
    knob. A light tap with a mallet handle is fine if your thumb is not enough; do
    not force a pocket that is clearly too small — reprint with the next size up.
  parts:
  - hand_knob
  hardware:
  - nut_m3
  tool: null
- n: '6'
  text: Hold the knob upside down (mouth down) and shake it. The nut must stay in
    with no glue. If it drops out, reprint the knob with pocket_af one step smaller
    (5.40, then 5.30).
  parts:
  - hand_knob
  hardware:
  - nut_m3
  tool: null
- n: '7'
  text: Insert the M3 bolt from the bearing side (the face with the Ø3.4 hole) and
    turn it up through the knob until it threads into the nut and the tip emerges
    from the mouth. It should turn smoothly the whole way.
  parts:
  - hand_knob
  hardware:
  - bolt_m3
  - nut_m3
  tool: 3 mm hex key
- n: '8'
  text: 'Use: with the bolt through your workpiece and its head on the far side, screw
    the knob down onto the exposed thread, bearing face toward the workpiece, and
    hand-tighten by gripping the scalloped rim. Tightening presses the nut down onto
    the pocket floor, so the load is taken by the printed shoulder and the nut cannot
    be pushed out the far side. Loosening pulls the nut the other way, so leave the
    press fit as tight as you can still assemble by hand.'
  parts:
  - hand_knob
  hardware:
  - bolt_m3
  - nut_m3
  tool: null
- n: '9'
  text: The bolt's threaded length above the workpiece must be at least 10 mm (the
    knob's height) for the tip to come out of the mouth; a shorter bolt still tightens
    but its tip stays inside the knob.
  parts:
  - hand_knob
  hardware:
  - bolt_m3
  tool: null
