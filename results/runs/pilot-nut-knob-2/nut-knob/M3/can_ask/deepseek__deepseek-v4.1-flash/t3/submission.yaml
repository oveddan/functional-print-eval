task: nut-knob/M3
note: 'Hand knob for an M3 bolt: one printed piece, 20 mm across, fluted for finger
  grip. An ISO 4032 M3 nut presses into a vertical hex pocket by hand (interference
  fit, no glue) and is held by friction; the pocket is blind, so the nut bottoms on
  a 7.3 mm-thick floor whose only opening is a Ø3.4 through hole — the nut can never
  be pushed out the far side. The bolt enters that Ø3.4 hole in the bearing face,
  runs up through the body, threads through the nut and emerges from the mouth at
  the top, so it goes right through the nut and out the other side.


  Mechanics: when you hand-tighten the knob onto the bolt, the bolt''s tension pushes
  the nut *down* against the pocket floor, so the tightening load is carried by the
  floor, not by the press fit. The press fit only has to hold the 0.6 g nut against
  gravity when the knob is turned over. When you loosen, the load reverses and the
  press fit takes it, so keep the interference as large as you can still press in
  by hand.


  Because I could not measure your nut or bolt, the pocket size is a design value
  (5.50 mm across flats = line-to-line with the catalog nut AF) and must be chosen
  from the fit coupon: print the coupon first, press your nut into the three pockets
  (5.40 / 5.50 / 5.60), and use the smallest one that presses in by hand and holds
  the nut when the coupon is held pocket-down and shaken. Set pocket_af to that value
  before slicing the knob. If 5.50 works, print the knob as supplied.


  Bolt length: the bolt''s threaded length above the workpiece must be at least the
  knob''s height (10 mm) for the tip to emerge from the mouth; a shorter bolt still
  tightens but stays inside. An ISO 4762 M3x20 (17 mm of shank) exits for workpieces
  up to about 7 mm thick.'
questions: []
params:
  knob_od:
    value: 20.0
    unit: mm
    kind: world
    source: asked
    note: user asked for 'about 20 mm across' — the knob's overall diameter
  knob_h:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: grip height; also the bolt reach needed for the tip to exit the mouth
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut across flats; could not be measured, so catalog value
      used
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut height
  bolt_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: M3 nominal shank diameter
  pocket_af:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: hex pocket across flats = nut_af line-to-line; final value chosen from the
      fit coupon (5.40/5.50/5.60)
  pocket_af_a:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: coupon pocket A, 0.05 mm per side interference (1 dot)
  pocket_af_b:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: coupon pocket B, line-to-line (2 dots)
  pocket_af_c:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: coupon pocket C, 0.05 mm per side clearance (3 dots)
  pocket_depth:
    value: 2.7
    unit: mm
    kind: design
    source: design
    note: nut_h + 0.3 mm, so the nut sits fully inside, its outer face 0.3 mm below
      the mouth
  bolt_clear_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: bolt_d + 0.4 mm clearance hole through the floor and body
  mouth_chamfer:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: 45 deg hex lead-in at the pocket mouth to start the nut square
  flute_count:
    value: 12
    unit: count
    kind: design
    source: design
    note: grip scallops around the rim
  flute_depth:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: radial depth of each scallop (also its half-width at the rim)
  coupon_h:
    value: 6.0
    unit: mm
    kind: design
    source: design
    note: coupon thickness; wall around each pocket is 6.8 mm, comparable to the knob's
      7.25 mm
  coupon_pitch:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: spacing between coupon pockets
  coupon_depth:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: coupon width in y
  dot_d:
    value: 1.4
    unit: mm
    kind: design
    source: design
    note: diameter of the marker dimples identifying each coupon pocket
  dot_depth:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: depth of the marker dimples
parts:
- id: fit_coupon
  role: coupon
  material: PLA (high-speed PLA, black)
  code: "import cadquery as cq\nimport math\n\ndef _hexpts(af, cx=0.0, cy=0.0):\n\
    \    # regular hexagon, across-flats = af, first vertex on +x\n    r = af / math.sqrt(3.0)\n\
    \    return [(cx + r*math.cos(i*math.pi/3.0), cy + r*math.sin(i*math.pi/3.0))\
    \ for i in range(6)]\n\ndef build(p):\n    h = p.coupon_h\n    afs = [p.pocket_af_a,\
    \ p.pocket_af_b, p.pocket_af_c]\n    n = len(afs)\n    width = p.coupon_pitch*(n\
    \ - 1) + 24.0\n    plate = cq.Workplane(\"XY\").box(width, p.coupon_depth, h,\
    \ centered=(True, True, False))\n    z_floor = h - p.pocket_depth\n    z0 = h\
    \ - p.mouth_chamfer\n    for i, af in enumerate(afs):\n        x = (i - 0.5*(n\
    \ - 1))*p.coupon_pitch\n        # hex nut pocket, opening at the top face\n  \
    \      plate = plate.cut(cq.Workplane(\"XY\", origin=(0.0, 0.0, z_floor))\n  \
    \                        .polyline(_hexpts(af, x, 0.0)).close()\n            \
    \              .extrude(p.pocket_depth + 1.0))\n        # hex lead-in chamfer\
    \ at the mouth\n        plate = plate.cut(cq.Workplane(\"XY\", origin=(0.0, 0.0,\
    \ z0))\n                          .polyline(_hexpts(af, x, 0.0)).close()\n   \
    \                       .workplane(offset=p.mouth_chamfer + 1.0)\n           \
    \               .polyline(_hexpts(af + 2.0*(p.mouth_chamfer + 1.0), x, 0.0)).close()\n\
    \                          .loft(ruled=True))\n        # bolt clearance hole through\
    \ the floor (the shoulder the nut cannot pass)\n        plate = plate.cut(cq.Workplane(\"\
    XY\", origin=(x, 0.0, -1.0))\n                          .circle(0.5*p.bolt_clear_d).extrude(z_floor\
    \ + 1.0))\n        # marker dimples: 1 dot = 5.40, 2 dots = 5.50, 3 dots = 5.60\n\
    \        for j in range(i + 1):\n            dx = (j - 0.5*i)*2.0\n          \
    \  plate = plate.cut(cq.Workplane(\"XY\", origin=(x + dx, 3.0 - 0.5*p.coupon_depth,\
    \ h - p.dot_depth))\n                              .circle(0.5*p.dot_d).extrude(p.dot_depth\
    \ + 0.5))\n    return plate"
  print_orientation: 'Flat on the bed: the bottom face (z=0) sits on the bed, the
    three hex pockets open upward. No supports, no bridges.'
  use_orientation: As printed for the test; flip it pocket-down to check the nut stays
    in. The pockets copy the knob's pocket exactly (same AF, same depth, same lead-in,
    same 6.8 mm wall).
- id: hand_knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "import cadquery as cq\nimport math\n\ndef _hexpts(af, cx=0.0, cy=0.0):\n\
    \    # regular hexagon, across-flats = af, first vertex on +x\n    r = af / math.sqrt(3.0)\n\
    \    return [(cx + r*math.cos(i*math.pi/3.0), cy + r*math.sin(i*math.pi/3.0))\
    \ for i in range(6)]\n\ndef build(p):\n    h = p.knob_h\n    # body: plain cylinder,\
    \ then scallop the rim for grip\n    body = cq.Workplane(\"XY\").circle(0.5*p.knob_od).extrude(h)\n\
    \    n = int(p.flute_count)\n    if n > 0:\n        pts = [(0.5*p.knob_od*math.cos(2.0*math.pi*i/n),\n\
    \                0.5*p.knob_od*math.sin(2.0*math.pi*i/n)) for i in range(n)]\n\
    \        flutes = (cq.Workplane(\"XY\", origin=(0.0, 0.0, -1.0))\n           \
    \       .pushPoints(pts).circle(p.flute_depth).extrude(h + 2.0))\n        body\
    \ = body.cut(flutes)\n    # blind hex nut pocket, opening at the top face (z =\
    \ h)\n    z_floor = h - p.pocket_depth\n    body = body.cut(cq.Workplane(\"XY\"\
    , origin=(0.0, 0.0, z_floor))\n                    .polyline(_hexpts(p.pocket_af)).close()\n\
    \                    .extrude(p.pocket_depth + 1.0))\n    # 45 deg hex lead-in\
    \ at the pocket mouth\n    z0 = h - p.mouth_chamfer\n    body = body.cut(cq.Workplane(\"\
    XY\", origin=(0.0, 0.0, z0))\n                    .polyline(_hexpts(p.pocket_af)).close()\n\
    \                    .workplane(offset=p.mouth_chamfer + 1.0)\n              \
    \      .polyline(_hexpts(p.pocket_af + 2.0*(p.mouth_chamfer + 1.0))).close()\n\
    \                    .loft(ruled=True))\n    # bolt clearance hole from the bearing\
    \ face up into the pocket floor\n    body = body.cut(cq.Workplane(\"XY\", origin=(0.0,\
    \ 0.0, -1.0))\n                    .circle(0.5*p.bolt_clear_d).extrude(z_floor\
    \ + 1.0))\n    return body"
  print_orientation: 'Pocket opening up: the bearing face (the flat disc with the
    Ø3.4 hole that touches the workpiece in use) is on the bed at z=0, the hex pocket
    opens at the top. Vertical walls throughout, no bridges, no supports.'
  use_orientation: Same as printed. Bearing face down on the workpiece, hex pocket
    facing up and away from the workpiece. Nut pressed into the pocket from the top;
    the M3 bolt enters the Ø3.4 hole in the bearing face from below, threads through
    the nut and exits the mouth at the top.
