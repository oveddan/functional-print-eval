manual:
- n: '1'
  text: 'Print the fit-test coupon first: PLA, 0.2 mm layers, no supports. It lies
    flat with the pockets opening upward. It is small and quick - do not skip it,
    it decides whether the knob''s pocket suits your printer.'
  parts:
  - fit-coupon
  hardware: []
  tool: Bambu Lab X1C, 0.4 mm nozzle, 0.2 mm layers, PLA
- n: '2'
  text: 'Press the M3 hex nut into each of the three pockets, flat face first, with
    a firm thumb push. The pockets are labelled by bumps on the front edge: 1 bump
    = 0.00 mm interference (loosest), 2 bumps = 0.12 mm (exactly the knob), 3 bumps
    = 0.25 mm (tightest). The nut is fully seated when its top face sits just below
    the start of the round counterbore. Push, do not hammer.'
  parts:
  - fit-coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: Turn the coupon upside down and tap it. The nut must stay in. Pick the pocket
    that grips but still goes in by hand. The 2-bump pocket is the knob's fit; if
    that one drops out but the 3-bump pocket holds, stop and tell me - the knob then
    wants press_interference = 0.25.
  parts:
  - fit-coupon
  hardware:
  - nut
  tool: null
- n: '4'
  text: 'Optional: push the test nuts back out with a 3 mm rod or an M3 bolt through
    the Ø3.4 hole in the coupon''s underside.'
  parts:
  - fit-coupon
  hardware: []
  tool: 3 mm rod
- n: '5'
  text: 'Print the knob: PLA, 0.2 mm layers, no supports. It must sit on its flat
    bottom face - the one with the round recessed lead-in hole - so the hex pocket
    and the wide Ø9 opening end up on top. Do not rotate it; pocket-face-down would
    ruin the pocket and seat.'
  parts:
  - knob
  hardware: []
  tool: Bambu Lab X1C, 0.4 mm nozzle, 0.2 mm layers, PLA
- n: '6'
  text: 'Press the M3 hex nut into the hex pocket in the knob''s top: drop it in (either
    face up) and push it down with your thumb until it stops on the seat, about 7
    mm deep. The tapered ribs start easy and grip as it seats. It ends up fully inside,
    its top face 3.6 mm below the knob''s top face. If it is too stiff for a thumb,
    squeeze it in with a clamp or smooth pliers and a flat pad - never tap it with
    a hammer.'
  parts:
  - knob
  hardware:
  - nut
  tool: clamp or smooth pliers (only if needed)
- n: '7'
  text: 'Retention check: turn the knob upside down and shake. The nut must not fall
    out - no glue is used anywhere. If it does fall out the pocket is too loose for
    your printer; re-slice with press_interference raised to 0.25, the value the 3-bump
    coupon pocket tests.'
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '8'
  text: Thread your M3 bolt up through the knob's bottom lead-in hole until it picks
    up the nut's thread, then keep turning the knob on. The bolt's tip comes out of
    the top opening. The bolt must reach at least 9.4 mm from the knob's bottom face
    (7.0 mm to the seat plus the 2.4 mm nut), so an ISO 4762 M3x16 suits a workpiece
    up to about 6 mm thick.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '9'
  text: 'Use it: hold the flutes and turn the knob clockwise seen from above to tighten,
    anti-clockwise to release. The nut is captive, so the knob simply winds along
    the bolt and its bottom face presses on the workpiece.'
  parts:
  - knob
  hardware:
  - nut
  tool: hand only
