parts:
- id: knob
  role: final
  material: PLA (high-speed, black), 0.2 mm layers, 0.4 mm nozzle
  code: "import math\nD2R = math.pi / 180.0\n\n\ndef build(p):\n    # --- everything\
    \ follows from the nut ---\n    hex_af = p.nut_af + p.pocket_clearance\n    r_hex\
    \ = hex_af / 2.0 / math.cos(30.0 * D2R)    # pocket hexagon circumradius\n   \
    \ r_flat = hex_af / 2.0                          # pocket flat radius\n    r_tip\
    \ = p.nut_af / 2.0 - p.press_interference  # rib tip radius at the seat\n    protr\
    \ = r_flat - r_tip\n    hex_top = p.seat_z + p.nut_h + p.pocket_extra\n    bore_top\
    \ = hex_top + p.bore_h\n    r_hole = p.bolt_hole_d / 2.0\n\n    # --- outer body\
    \ ---\n    body = cq.Workplane(\"XY\").circle(p.knob_od / 2.0).extrude(p.knob_h)\n\
    \    body = body.faces(\">Z\").edges().chamfer(p.top_chamfer)\n    body = body.faces(\"\
    <Z\").edges().chamfer(p.bottom_chamfer)\n\n    # --- vertical grip flutes ---\n\
    \    R = p.knob_od / 2.0 + p.flute_r - p.flute_depth\n    n = int(p.flute_n)\n\
    \    fl = None\n    for i in range(n):\n        a = 2.0 * math.pi * i / n\n  \
    \      c = (cq.Workplane(\"XY\")\n             .moveTo(R * math.cos(a), R * math.sin(a))\n\
    \             .circle(p.flute_r)\n             .extrude(p.knob_h))\n        fl\
    \ = c if fl is None else fl.union(c)\n    body = body.cut(fl)\n\n    # --- central\
    \ void: lead-in cone, clearance hole, hex pocket, counterbore, top funnel ---\n\
    \    v = (cq.Workplane(\"XY\")\n         .workplane(offset=-1.0)\n         .circle(p.bottom_recess_d\
    \ / 2.0)\n         .workplane(offset=p.web_top + 1.0)\n         .circle(r_hole)\n\
    \         .loft())\n    v = v.union(cq.Workplane(\"XY\").circle(r_hole).extrude(p.seat_z))\n\
    \    hexpts = [(r_hex * math.cos((30.0 + 60.0 * k) * D2R),\n               r_hex\
    \ * math.sin((30.0 + 60.0 * k) * D2R)) for k in range(6)]\n    v = v.union(cq.Workplane(\"\
    XY\")\n                .workplane(offset=p.seat_z - 0.05)\n                .polyline(hexpts).close()\n\
    \                .extrude(p.nut_h + p.pocket_extra + 0.05))\n    v = v.union(cq.Workplane(\"\
    XY\")\n                .workplane(offset=hex_top - 0.05)\n                .circle(p.bore_d\
    \ / 2.0)\n                .extrude(p.bore_h + 0.05))\n    v = v.union(cq.Workplane(\"\
    XY\")\n                .workplane(offset=bore_top)\n                .circle(p.bore_d\
    \ / 2.0)\n                .workplane(offset=p.funnel_h)\n                .circle(p.funnel_top_d\
    \ / 2.0)\n                .loft())\n    body = body.cut(v)\n\n    # --- six crush\
    \ ribs, one per flat: full protrusion at the seat, tapering to zero at the top\
    \ ---\n    ribs = None\n    for k in range(int(p.rib_count)):\n        th = 60.0\
    \ * k * D2R\n        nx, ny = math.cos(th), math.sin(th)\n        tx, ty = -math.sin(th),\
    \ math.cos(th)\n        mx, my = r_flat * nx, r_flat * ny\n\n        def tri(apex_r):\n\
    \            return [(mx + p.rib_extra * nx - 0.5 * p.rib_base_w * tx,\n     \
    \                my + p.rib_extra * ny - 0.5 * p.rib_base_w * ty),\n         \
    \           (mx + p.rib_extra * nx + 0.5 * p.rib_base_w * tx,\n              \
    \       my + p.rib_extra * ny + 0.5 * p.rib_base_w * ty),\n                  \
    \  (apex_r * nx, apex_r * ny)]\n\n        prism = (cq.Workplane(\"XY\")\n    \
    \             .workplane(offset=p.seat_z)\n                 .polyline(tri(r_tip)).close()\n\
    \                 .extrude(p.nut_h - p.rib_taper + 0.02))\n        ramp = (cq.Workplane(\"\
    XY\")\n                .workplane(offset=p.seat_z + p.nut_h - p.rib_taper)\n \
    \               .polyline(tri(r_tip)).close()\n                .workplane(offset=p.rib_taper)\n\
    \                .polyline(tri(r_flat)).close()\n                .loft(ruled=True))\n\
    \        one = prism.union(ramp)\n        ribs = one if ribs is None else ribs.union(one)\n\
    \    body = body.union(ribs)\n    return body"
  print_orientation: Bottom face (the flat face with the round lead-in hole) on the
    bed, z = 0; hex nut pocket opening upward. No supports.
  use_orientation: Bottom face against the workpiece, pocket up. Your M3 bolt comes
    up through the bottom lead-in hole, threads through the captive nut and its tip
    leaves the top opening. Turn clockwise seen from above to tighten.
- id: fit-coupon
  role: coupon
  material: PLA (high-speed, black), 0.2 mm layers, 0.4 mm nozzle
  code: "import math\nD2R = math.pi / 180.0\n\n\ndef build(p):\n    hex_af = p.nut_af\
    \ + p.pocket_clearance\n    r_hex = hex_af / 2.0 / math.cos(30.0 * D2R)\n    r_flat\
    \ = hex_af / 2.0\n    hex_top = p.coupon_seat + p.nut_h + p.pocket_extra\n   \
    \ bore_top = hex_top + p.bore_h\n    r_hole = p.bolt_hole_d / 2.0\n    r_br =\
    \ p.bore_d / 2.0\n\n    plate = cq.Workplane(\"XY\").box(p.coupon_l, p.coupon_w,\
    \ p.coupon_t,\n                                    centered=(True, True, False))\n\
    \    hexpts = [(r_hex * math.cos((30.0 + 60.0 * k) * D2R),\n               r_hex\
    \ * math.sin((30.0 + 60.0 * k) * D2R)) for k in range(6)]\n    interfs = [p.coupon_i1,\
    \ p.coupon_i2, p.coupon_i3]\n\n    for i in range(3):\n        x0 = (i - 1) *\
    \ p.coupon_pitch\n        v = (cq.Workplane(\"XY\")\n             .workplane(offset=p.coupon_seat\
    \ - 0.05)\n             .polyline(hexpts).close()\n             .extrude(p.nut_h\
    \ + p.pocket_extra + 0.05))\n        v = v.union(cq.Workplane(\"XY\")\n      \
    \              .workplane(offset=hex_top - 0.05)\n                    .circle(r_br)\n\
    \                    .extrude(p.bore_h + 0.05))\n        v = v.union(cq.Workplane(\"\
    XY\")\n                    .workplane(offset=bore_top)\n                    .circle(r_br)\n\
    \                    .workplane(offset=p.funnel_h)\n                    .circle(p.funnel_top_d\
    \ / 2.0)\n                    .loft())\n        v = v.union(cq.Workplane(\"XY\"\
    ).circle(r_hole).extrude(p.coupon_seat))\n        plate = plate.cut(v.translate((x0,\
    \ 0.0, 0.0)))\n\n        protr = p.pocket_clearance / 2.0 + interfs[i]\n     \
    \   r_tip = r_flat - protr\n        ribs = None\n        for k in range(6):\n\
    \            th = 60.0 * k * D2R\n            nx, ny = math.cos(th), math.sin(th)\n\
    \            tx, ty = -math.sin(th), math.cos(th)\n            mx, my = r_flat\
    \ * nx, r_flat * ny\n\n            def tri(apex_r):\n                return [(mx\
    \ + p.rib_extra * nx - 0.5 * p.rib_base_w * tx,\n                         my +\
    \ p.rib_extra * ny - 0.5 * p.rib_base_w * ty),\n                        (mx +\
    \ p.rib_extra * nx + 0.5 * p.rib_base_w * tx,\n                         my + p.rib_extra\
    \ * ny + 0.5 * p.rib_base_w * ty),\n                        (apex_r * nx, apex_r\
    \ * ny)]\n\n            prism = (cq.Workplane(\"XY\")\n                     .workplane(offset=p.coupon_seat)\n\
    \                     .polyline(tri(r_tip)).close()\n                     .extrude(p.nut_h\
    \ - p.rib_taper + 0.02))\n            ramp = (cq.Workplane(\"XY\")\n         \
    \           .workplane(offset=p.coupon_seat + p.nut_h - p.rib_taper)\n       \
    \             .polyline(tri(r_tip)).close()\n                    .workplane(offset=p.rib_taper)\n\
    \                    .polyline(tri(r_flat)).close()\n                    .loft(ruled=True))\n\
    \            one = prism.union(ramp)\n            ribs = one if ribs is None else\
    \ ribs.union(one)\n        plate = plate.union(ribs.translate((x0, 0.0, 0.0)))\n\
    \n    for i in range(3):\n        x0 = (i - 1) * p.coupon_pitch\n        for j\
    \ in range(i + 1):\n            dx = (j - i / 2.0) * 1.8\n            plate =\
    \ plate.union(cq.Workplane(\"XY\")\n                                .workplane(offset=p.coupon_t)\n\
    \                                .moveTo(x0 + dx, -p.coupon_w / 2.0 + 2.0)\n \
    \                               .circle(0.7)\n                               \
    \ .extrude(0.6))\n    return plate"
  print_orientation: Flat bottom face on the bed, pockets opening upward - the same
    orientation as the knob, so the pocket prints with the same accuracy.
  use_orientation: 'Handling test only: press the M3 nut into each pocket to see which
    one grips. The two-bump pocket is identical to the knob''s.'
