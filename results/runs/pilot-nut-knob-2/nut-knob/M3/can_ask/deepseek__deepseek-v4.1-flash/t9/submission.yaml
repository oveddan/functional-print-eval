task: nut-knob/M3
note: 'Hand knob for an M3 bolt - one printed piece - Ø20 x 13 mm with 8 vertical
  grip flutes, plus a small fit-test coupon you print first.


  HOW IT WORKS

  - The ISO 4032 M3 nut drops into a hexagonal pocket in the top of the knob and bottoms
  out on a 4 mm web, so it cannot be pushed out the far (bottom) side. Its top face
  ends up 3.6 mm below the knob''s top face, so it sits fully inside.

  - Retention (no glue) is six small triangular crush ribs on the pocket''s six flats:
  at the seat each rib tip is 0.12 mm inside the nut''s flats, and each rib tapers
  to zero protrusion over its top 0.8 mm, so the nut presses in easily and grips as
  it seats. The ribs sit in the flats, so their flanks also drive the nut in rotation
  - turning the knob turns the nut.

  - The bolt comes up from below: Ø8 lead-in cone in the bottom face (37 deg, prints
  unsupported), Ø3.4 clearance hole through the web, the nut''s thread, then out through
  a Ø7 counterbore and a 45 deg flare to the Ø9 top opening. The bolt must reach 9.4
  mm from the knob''s bottom face (7.0 seat + 2.4 nut), so an ISO 4762 M3x16 leaves
  ~6 mm for the workpiece.

  - Printed bottom-face-down: no supports, no overhangs beyond 45 deg, widest unsupported
  span ~8 mm.


  FIT NOTE (the one thing to check before the full print)

  Your nut could not be measured, so nut_af = 5.5 and nut_h = 2.4 come from the ISO
  4032 M3 catalog row; everything else follows from those two numbers. Print the coupon:
  its three pockets are identical to the knob''s (same depth, same tapered ribs) with
  0.00 / 0.12 / 0.25 mm rib interference, marked with 1 / 2 / 3 bumps. The 2-bump
  pocket equals the knob. If the 2-bump pocket is loose but the 3-bump holds, the
  knob''s fix is press_interference = 0.25. If your nut measures something other than
  5.5 across the flats, change nut_af only.'
questions:
- text: Your calipers weren't available for the nut, so I used the ISO 4032 catalog
    values (5.5 mm across flats, 2.4 mm thick). Can you confirm those on your own
    nut? If they differ, the only param to change is nut_af (or nut_h) - the pocket,
    ribs and coupon all follow from it.
  answer: null
- text: How long is your M3 bolt, and how thick is the part it clamps? The knob needs
    the bolt to reach 9.4 mm from its bottom face to exit the nut, so M3x16 or longer
    works; I can shorten the knob or lengthen the lead-in cone if you are using an
    M3x12 or a thick workpiece.
  answer: null
