  chamfer_top:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: 45 deg chamfer on the mouth-side outer edge
  chamfer_bottom:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: 45 deg chamfer on the bed-side outer edge (keeps elephant foot off the seating
