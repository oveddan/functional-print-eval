  cup_d:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: open mouth cup; clears nut_ac (6.35) by 0.65 diametral for press-fitting
      the nut and lets the bolt tip out
  coupon_af_1:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: coupon pocket 1 across-flats (1 dot) = knob taper's tight end
  coupon_af_2:
    value: 5.45
    unit: mm
    kind: design
    source: design
    note: coupon pocket 2 across-flats (2 dots)
  coupon_af_3:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: coupon pocket 3 across-flats (3 dots) = nominal nut size
  coupon_af_4:
    value: 5.55
    unit: mm
    kind: design
    source: design
    note: coupon pocket 4 across-flats (4 dots)
  coupon_af_5:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: coupon pocket 5 across-flats (5 dots) = knob taper's loose end
  coupon_pocket_depth:
