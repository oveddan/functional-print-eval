    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across-flats. Could not be measured; catalog value used.
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 nut height. Could not be measured; catalog value used.
  nut_ac:
    value: 6.351
    unit: mm
    kind: hardware
    source: datasheet
    note: nut across-corners = nut_af / cos30 = 5.5/0.86603; sets the minimum mouth
      opening
  bolt_shank_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: datasheet
    note: M3 nominal threaded shank diameter
  bolt_head_d:
    value: 5.5
    unit: mm
    kind: hardware
