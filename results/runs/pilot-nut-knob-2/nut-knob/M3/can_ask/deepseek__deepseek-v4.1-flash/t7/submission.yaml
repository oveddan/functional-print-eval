task: nut-knob/M3
note: 'A one-piece hand knob for an M3 bolt, 20 mm across the grip peaks, 8 mm tall.


  HOW THE NUT IS HELD (no glue):

  - The nut is pressed in from the open top. The hex pocket TAPERS: 5.55 mm across-flats
  at the mouth (looser than the nut, so it drops in) down to 5.38 mm at the floor
  (0.12 mm interference, so it wedges tight). The nut broaches the last fraction of
  a millimetre and is gripped by the flats and the six corner grooves it cuts. It
  cannot rattle free: to fall out it has to be pushed back up through the narrowest
  end of the taper.

  - The floor below the nut is a flat shoulder 3.0 mm thick with only a 3.4 mm bolt
  hole through it, so the nut cannot be pushed out the far side — exactly the direction
  the bolt pushes it when you tighten.

  - Nothing of the nut stands proud: the pocket floor is 3.0 mm from the far face
  and the nut top ends up 2.6 mm below the mouth, so the nut sits fully inside.

  - Above the nut is a 7.0 mm mouth cup (clears the nut''s 6.35 mm across-corners)
  so you can push the nut in, and so the bolt''s threaded end passes through the nut
  and out the top.


  WHY THE COUPON: I could not measure your nut or your printer''s hole tolerance,
  and that tolerance decides whether a press fit holds or falls out. The coupon has
  five straight pockets spanning 5.40–5.60 mm across-flats — the same range the knob''s
  taper sweeps through — with the same ⌀3.4 escape hole. Test it first (step 2–3);
  if all five are loose, reprint the knob with the two pocket_af params 0.06 mm smaller
  (they are named in the knob''s code).


  PRINTING: both parts print flat, no supports, no bridges. Largest unsupported span
  is 0 mm; the pocket''s taper and the open mouth all lean the self-supporting way.


  BOLT: needs at least ~6 mm of thread exposed from your part to reach the nut; thread
  exposed past ~8 mm will stick out of the knob''s top recess (harmless).'
questions:
- text: How thick is the part the knob will clamp, and roughly how much thread sticks
    out of it? That fixes the ideal bolt length (the knob needs about 6 mm of exposed
    thread, and hides the tip up to about 8 mm).
  answer: null
- text: 'After you print the coupon: which dotted pocket gave the press you liked,
    and did the nut stay in it when you shook the coupon upside down? If the answer
    is a pocket other than 3, tell me and I will re-tune the knob''s taper to centre
    on it.'
  answer: null
params:
