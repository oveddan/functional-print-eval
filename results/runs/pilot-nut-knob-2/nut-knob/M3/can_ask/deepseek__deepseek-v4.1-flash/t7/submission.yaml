parts:
- id: knob
  role: final
  material: PLA
  code: "import cadquery as cq\nimport math\n\n\ndef build(p):\n    R = p.knob_d /\
    \ 2.0\n    H = p.knob_h\n\n    # --- outer body: a puck printed flat ---\n   \
    \ body = cq.Workplane(\"XY\").circle(R).extrude(H)\n    body = body.faces(\">Z\"\
    ).edges().chamfer(p.chamfer_top)\n    body = body.faces(\"<Z\").edges().chamfer(p.chamfer_bottom)\n\
    \n    # --- hand grip: scallops removed around the rim ---\n    n = int(p.scallop_n)\n\
    \    for i in range(n):\n        a = 2.0 * math.pi * i / n + math.pi / n\n   \
    \     body = body.cut(\n            cq.Workplane(\n                \"XY\",\n \
    \               origin=(p.scallop_ctr * math.cos(a),\n                       \
    \ p.scallop_ctr * math.sin(a), -1.0),\n            ).circle(p.scallop_r).extrude(H\
    \ + 2.0)\n        )\n\n    # --- bolt clearance bore, up to the pocket floor ---\n\
    \    body = body.cut(\n        cq.Workplane(\"XY\").circle(p.bore_d / 2.0).extrude(p.floor_t)\n\
    \    )\n\n    # --- tapered hex nut pocket ---\n    # wide (+0.05) at the mouth\
    \ so the nut drops in, tight (-0.12) at the\n    # floor so it wedges and grips.\
    \ Taper leans the printable way.\n    ac_b = p.pocket_af_bottom / math.cos(math.pi\
    \ / 6.0)\n    ac_t = p.pocket_af_top / math.cos(math.pi / 6.0)\n    body = body.cut(\n\
    \        cq.Workplane(\"XY\", origin=(0, 0, p.floor_t))\n        .polygon(6, ac_b)\n\
    \        .workplane(offset=p.pocket_depth)\n        .polygon(6, ac_t)\n      \
    \  .loft()\n    )\n\n    # --- open mouth cup: press the nut in here, bolt tip\
    \ comes out here ---\n    body = body.cut(\n        cq.Workplane(\"XY\", origin=(0,\
    \ 0, p.floor_t + p.pocket_depth))\n        .circle(p.cup_d / 2.0)\n        .extrude(H)\n\
    \    )\n\n    return body\n"
  print_orientation: Flat far face (the face with the ⌀3.4 mm bore) on the bed, z=0;
    the open mouth cup faces up. Bolt axis vertical. No supports.
  use_orientation: 'Bolt axis vertical in use: the flat far face (z=0) presses against
    the part being clamped, the open mouth (z=8) faces away and gives access to press
    the nut in. The nut drops into the tapered hex pocket from the mouth; the bolt
    comes up through the far face and threads into the nut.'
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import cadquery as cq\nimport math\n\n\ndef build(p):\n    afs = [p.coupon_af_1,\
    \ p.coupon_af_2, p.coupon_af_3,\n           p.coupon_af_4, p.coupon_af_5]\n  \
    \  n = len(afs)\n    L = p.coupon_pitch * (n - 1) + 2.0 * p.coupon_margin\n  \
    \  W = p.coupon_w\n    T = p.coupon_t\n\n    plate = cq.Workplane(\"XY\").rect(L,\
    \ W).extrude(T)\n    x0 = -L / 2.0 + p.coupon_margin\n\n    for i, af in enumerate(afs):\n\
    \        x = x0 + i * p.coupon_pitch\n\n        # escape hole under the pocket\n\
    \        plate = plate.cut(\n            cq.Workplane(\"XY\", origin=(x, 0, 0))\n\
    \            .circle(p.bore_d / 2.0)\n            .extrude(p.coupon_floor_t)\n\
    \        )\n\n        # straight hex pocket (the knob's is tapered through this\
    \ range)\n        ac = af / math.cos(math.pi / 6.0)\n        plate = plate.cut(\n\
    \            cq.Workplane(\"XY\", origin=(x, 0, p.coupon_floor_t))\n         \
    \   .polygon(6, ac)\n            .extrude(p.coupon_pocket_depth)\n        )\n\n\
    \        # identification dots: pocket i gets i+1 dots along the front edge\n\
    \        for k in range(i + 1):\n            tx = x - p.coupon_tick_pitch * i\
    \ / 2.0 + p.coupon_tick_pitch * k\n            plate = plate.cut(\n          \
    \      cq.Workplane(\"XY\", origin=(tx, -(W / 2.0 - 2.0), T))\n              \
    \  .circle(p.coupon_tick_r)\n                .extrude(-p.coupon_tick_depth)\n\
    \            )\n\n    return plate\n"
  print_orientation: Flat on the bed, z=0; hex pockets open upward. Same pocket axis
    direction as the knob.
  use_orientation: Handling jig only. Press the M3 nut into each of the five pockets
    to find the fit your printer produces, and check the nut cannot be pushed out
    through the ⌀3.4 hole below each pocket.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
- id: bolt
  ref: ISO 4762 M3x16
  qty: 1
joints:
- id: nut_capture
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: bolt_bore_3.4 (through the 3 mm floor)
    role: clearance
  - part: knob
    feature: nut_pocket (tapered hex, 2.45 mm deep)
    role: nut_pocket
  - part: knob
    feature: mouth_cup_7.0
    role: clearance
  nut: nut
  external: null
criteria:
- id: c1
  part: knob
  feature: nut_pocket (tapered hex, 5.55 AF at mouth to 5.38 AF at floor)
  relation: contains
  hardware: nut
  clearance_mm: -0.12
  params:
  - pocket_af_bottom
  - pocket_af_top
  - nut_af
  - pocket_depth
  - nut_h
  check:
    method: coupon
    ref: fit_coupon
    description: 'The nut presses in by hand from the mouth and is gripped by interference
      at the floor end of the taper, where the pocket is 0.12 mm narrower than the
      nut across-flats. Verify on the coupon: pocket 3 (5.50 AF) should be a firm
      thumb press. The knob''s taper sweeps 5.38-5.55, so it grips whether the printer
      runs tight or loose.'
- id: c2
  part: knob
  feature: pocket_floor (flat shoulder, 3.0 mm thick, ⌀3.4 bolt hole)
  relation: supports
  hardware: nut
  clearance_mm: -2.1
  params:
  - bore_d
  - nut_af
  - floor_t
  check:
    method: coupon
    ref: fit_coupon
    description: 'The ⌀3.4 bore is 2.1 mm narrower than the nut''s 5.5 across-flats,
      so the nut seats on the floor and cannot be pushed out the far side. Verify
      on the coupon: the nut seat in every pocket and none can be pushed through the
      hole below.'
- id: c3
  part: knob
  feature: mouth_cup (7.0 mm open cup above the pocket)
  relation: clears
  hardware: nut
  clearance_mm: 0.65
  params:
  - cup_d
  - nut_ac
  check:
    method: none
    ref: null
    description: '7.0 mm cup vs the nut''s 6.35 mm across-corners: the nut can be
      pushed in from the top and comes out again, but is never free to fall out on
      its own because the pocket below is narrower than the nut.'
- id: c4
  part: knob
  feature: bolt_bore (⌀3.4 through the floor)
  relation: clears
  hardware: bolt
  clearance_mm: 0.2
  params:
  - bore_d
  - bolt_shank_d
  check:
    method: none
    ref: null
    description: '0.2 mm radial clearance on the M3 shank: the bolt slides through
      the floor and into the nut without binding.'
- id: c5
  part: knob
  feature: mouth_cup (open top)
  relation: clears
  hardware: bolt
  clearance_mm: 2.0
  params:
  - cup_d
  - bolt_shank_d
  check:
    method: none
    ref: null
    description: 'The bolt goes through the nut and out the other side: the tip emerges
      from the nut into the 2.6 mm deep ⌀7 mouth recess, so the thread end never bottoms
      out.'
- id: c6
  part: knob
  feature: pocket taper wall (1.6 deg, opening upward)
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - pocket_af_bottom
  - pocket_af_top
  - pocket_depth
  check:
    method: none
    ref: null
    description: 'Printability: the pocket''s cross-section grows as it is built up,
      and the mouth is fully open, so the pocket prints with no overhang and no bridge.
      Do not invert the knob in the slicer.'
manual:
- n: '1'
  text: 'Slice and print both parts in PLA on the X1C at 0.2 mm layers, exactly as
    they sit in the files: the knob with its flat far face on the bed and the open
    mouth up, the coupon flat on the bed. No supports and no brim. 3 perimeters and
    20% infill is plenty.'
  parts:
  - knob
  - fit_coupon
  hardware: []
  tool: slicer
- n: '2'
  text: 'Check the press fit on the coupon. Press the M3 nut into each of the five
    pockets by hand, pressing straight down. The dot marks count the pockets from
    the left: 1 dot = 5.40 mm across-flats, 2 = 5.45, 3 = 5.50, 4 = 5.55, 5 = 5.60.
    Pocket 5 should feel nearly loose and pocket 3 should be a firm thumb press. Also
    check that the nut seats on the flat and cannot be pushed out through the small
    ⌀3.4 hole below any pocket.'
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: 'Turn the coupon upside down and shake it. The nut must stay in whichever
    pocket gave a firm press. If the nut falls straight out of every pocket your printer
    is printing the holes oversized — reprint the knob after changing pocket_af_bottom
    to 5.32 and pocket_af_top to 5.49 in the knob''s code (both names are in the params).
    If the nut will not enter even pocket 5, your printer runs tight: change them
    to 5.44 and 5.61.'
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '4'
  text: 'Press the nut into the knob. Drop it into the open mouth, hex flat to flat,
    then press it straight down with a flat hard object (the head of a bolt, the handle
    of a tool) or lay the nut on a hard table and press the knob down over it. It
    should travel smoothly, then tighten over the last millimetre and stop on the
    floor — about 2.5 mm in. If it stops early, it is gripping in the taper, which
    is fine: just make sure the nut''s top face ends up below the mouth.'
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Check the capture. The nut must sit fully inside, with its top face well below
    the mouth, nothing proud of the opening. Hold the knob mouth-down and shake it;
    the nut must not fall out. It should already be gripped, and tightening the bolt
    only pushes it harder onto the floor shoulder.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '6'
  text: 'Fit the knob to the bolt. Pass the M3 bolt through the part you are clamping
    so at least 6 mm of thread is exposed, then screw the knob on with your fingers:
    the thread goes up through the ⌀3.4 hole in the knob''s far face, into the nut,
    and the end comes out into the recess at the top of the knob. If the bolt''s exposed
    thread is longer than about 8 mm the end will simply poke out of the top of the
    knob.'
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: null
- n: '7'
  text: Tighten by hand. Grip the scalloped rim and turn — the nut turns with the
    knob and pulls the flat far face down onto the part. No tool is needed, and the
    nut cannot be forced out the far side because the 3.4 mm hole in the floor is
    narrower than the nut.
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: null
- n: '8'
  text: If you ever want the nut out, push it out with a small punch from the far
    side through the ⌀3.4 hole — that is the only way, which is what makes the capture
    reliable.
  parts:
  - knob
  hardware:
  - nut
  tool: null
