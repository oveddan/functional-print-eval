  coupon_margin:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: plate material before the first and after the last pocket
  coupon_tick_r:
    value: 0.7
    unit: mm
    kind: design
    source: design
    note: radius of the identification dots (pocket i gets i+1 dots)
  coupon_tick_depth:
    value: 0.6
    unit: mm
    kind: design
