    note: user asked for about 20 mm across; this is the diameter across the grip
      peaks
  knob_h:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: knob height in print orientation (bolt axis vertical)
  scallop_n:
    value: 8
    unit: count
    kind: design
    source: design
    note: grip scallops around the rim; fingers sit in the valleys
  scallop_r:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: radius of the cylinder removed to form each scallop
  scallop_ctr:
    value: 10.5
    unit: mm
    kind: design
    source: design
    note: distance from the axis to each scallop cylinder's centre; valleys land at
