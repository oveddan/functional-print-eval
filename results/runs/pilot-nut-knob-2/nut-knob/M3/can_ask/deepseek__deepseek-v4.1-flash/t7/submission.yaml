  pocket_depth:
    value: 2.45
    unit: mm
    kind: design
    source: design
    note: nut_h + 0.05 so the nut seats fully on the floor
  pocket_af_bottom:
    value: 5.38
    unit: mm
    kind: design
    source: design
    note: 'nut_af - 0.12 interference at the floor end of the taper: this is what
      grips the nut'
  pocket_af_top:
    value: 5.55
    unit: mm
    kind: design
    source: design
    note: 'nut_af + 0.05 at the mouth end: entry clearance so the nut drops in before
