parts:
- id: knob
  role: final
  material: PLA (high-speed, black)
  code: "import math\n\ndef hex_pts(af):\n    rc = af / math.sqrt(3.0)  # circumradius\
    \ of a hexagon from across-flats\n    return [(rc * math.cos(math.radians(60.0\
    \ * i)),\n             rc * math.sin(math.radians(60.0 * i))) for i in range(6)]\n\
    \ndef build(p):\n    R = p.knob_d / 2.0\n    H = p.knob_h\n    depth = p.pocket_depth\n\
    \n    body = cq.Workplane(\"XY\").circle(R).extrude(H)\n    body = body.edges(\"\
    >Z\").chamfer(p.top_chamfer)\n    body = body.edges(\"<Z\").chamfer(p.bottom_chamfer)\n\
    \n    # blind hex pocket for the M3 nut, open at the bottom face (z=0)\n    pocket\
    \ = (cq.Workplane(\"XY\")\n              .polyline(hex_pts(p.pocket_af)).close()\n\
    \              .extrude(depth))\n    body = body.cut(pocket)\n\n    # snap lip:\
    \ narrower hex throat the nut clicks through and cannot fall past\n    lip = (cq.Workplane(\"\
    XY\", origin=(0, 0, p.leadin_h))\n           .polyline(hex_pts(p.lip_af)).close()\n\
    \           .extrude(p.lip_h - p.leadin_h))\n    body = body.cut(lip)\n\n    #\
    \ 45-degree hex lead-in at the mouth so the nut starts square and centred\n  \
    \  lead = (cq.Workplane(\"XY\")\n            .polyline(hex_pts(p.lip_af + 2.0\
    \ * p.leadin_h)).close()\n            .workplane(offset=p.leadin_h)\n        \
    \    .polyline(hex_pts(p.lip_af)).close()\n            .loft(ruled=True))\n  \
    \  body = body.cut(lead)\n\n    # clearance hole for the bolt shank, from the\
    \ pocket ceiling out the top\n    hole = (cq.Workplane(\"XY\", origin=(0, 0, depth\
    \ - 0.01))\n            .circle(p.bolt_hole_d / 2.0)\n            .extrude(H -\
    \ depth + 1.01))\n    body = body.cut(hole)\n\n    # chamfer the hole exit on\
    \ the top face\n    exit_ch = cq.Solid.makeCone(p.bolt_hole_d / 2.0 + p.hole_chamfer,\n\
    \                                p.bolt_hole_d / 2.0,\n                      \
    \          p.hole_chamfer,\n                                cq.Vector(0.0, 0.0,\
    \ H),\n                                cq.Vector(0.0, 0.0, 1.0))\n    body = body.cut(exit_ch)\n\
    \n    # vertical grip flutes around the rim\n    for i in range(p.flute_n):\n\
    \        a = 2.0 * math.pi * i / p.flute_n\n        x = p.flute_center_r * math.cos(a)\n\
    \        y = p.flute_center_r * math.sin(a)\n        cutter = (cq.Workplane(\"\
    XY\", origin=(x, y, -1.0))\n                  .circle(p.flute_r)\n           \
    \       .extrude(H + 2.0))\n        body = body.cut(cutter)\n\n    return body\n"
  print_orientation: bottom face down - pocket mouth flat on the bed, flutes vertical
  use_orientation: in use the pocket mouth faces the bolt head; the bolt runs through
    the nut and out the top face
- id: fit-coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "import math\n\ndef hex_pts(af):\n    rc = af / math.sqrt(3.0)\n    return\
    \ [(rc * math.cos(math.radians(60.0 * i)),\n             rc * math.sin(math.radians(60.0\
    \ * i))) for i in range(6)]\n\ndef build(p):\n    H = p.coupon_h\n    depth =\
    \ p.pocket_depth\n\n    body = cq.Workplane(\"XY\").circle(p.coupon_d / 2.0).extrude(H)\n\
    \    body = body.edges(\">Z\").chamfer(0.6)\n\n    # identical nut pocket stack\
    \ as the knob\n    pocket = (cq.Workplane(\"XY\")\n              .polyline(hex_pts(p.pocket_af)).close()\n\
    \              .extrude(depth))\n    body = body.cut(pocket)\n\n    lip = (cq.Workplane(\"\
    XY\", origin=(0, 0, p.leadin_h))\n           .polyline(hex_pts(p.lip_af)).close()\n\
    \           .extrude(p.lip_h - p.leadin_h))\n    body = body.cut(lip)\n\n    lead\
    \ = (cq.Workplane(\"XY\")\n            .polyline(hex_pts(p.lip_af + 2.0 * p.leadin_h)).close()\n\
    \            .workplane(offset=p.leadin_h)\n            .polyline(hex_pts(p.lip_af)).close()\n\
    \            .loft(ruled=True))\n    body = body.cut(lead)\n\n    hole = (cq.Workplane(\"\
    XY\", origin=(0, 0, depth - 0.01))\n            .circle(p.bolt_hole_d / 2.0)\n\
    \            .extrude(H - depth + 1.01))\n    body = body.cut(hole)\n\n    return\
    \ body\n"
  print_orientation: pocket mouth flat on the bed
  use_orientation: 'test piece: press the M3 nut into the pocket from the bottom face,
    then invert to check retention'
