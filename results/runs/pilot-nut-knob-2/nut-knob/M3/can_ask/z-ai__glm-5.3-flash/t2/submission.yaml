criteria:
- id: nut-presses-in-by-hand
  part: knob
  feature: hex nut pocket (blind, pocket_depth deep, pocket_af across flats)
  relation: contains
  hardware: nut-m3
  clearance_mm: null
  params:
  - nut_af
  - pocket_af
  - nut_h
  - pocket_depth
  check:
    method: coupon
    ref: fit-coupon
    description: 'Press the M3 nut into the fit-coupon''s pocket mouth with thumb
      pressure over a table: it must click past the snap lip without pliers and without
      the lip cracking or whitening.'
- id: nut-retained-upside-down
  part: knob
  feature: snap lip (lip_af across flats at the mouth)
  relation: supports
  hardware: nut-m3
  clearance_mm: null
  params:
  - lip_af
  - nut_af
  - lip_h
  check:
    method: coupon
    ref: fit-coupon
    description: 'With the nut seated in the coupon, turn the coupon upside down and
      tap it on the table: the nut must not fall or slide out (lip_af is 0.2 mm under
      the nut''s flats, so only the lip''s own elasticity can let it through).'
- id: nut-blocked-at-far-side
  part: knob
  feature: pocket ceiling web above the nut
  relation: supports
  hardware: nut-m3
  clearance_mm: null
  params:
  - bolt_hole_d
  - nut_af
  - knob_h
  - pocket_depth
  check:
    method: none
    ref: null
    description: 'The pocket is blind: above the nut is 8.6 mm of solid PLA pierced
      only by the 3.4 mm bolt hole. The nut (flats 5.5, corners 6.35) cannot pass
      through it, no matter how hard it is pushed with the bolt.'
- id: bolt-passes-through
  part: knob
  feature: bolt clearance hole through the ceiling and out the top
  relation: clears
  hardware: m3-bolt
  clearance_mm: null
  params:
  - bolt_d
  - bolt_hole_d
  check:
    method: coupon
    ref: fit-coupon
    description: 'Thread the bolt through the coupon''s 3.4 mm hole from the pocket
      side: it must pass freely out the other face.'
- id: nut-drives-with-knob
  part: knob
  feature: hex pocket walls around the nut
  relation: engages
  hardware: nut-m3
  clearance_mm: null
  params:
  - pocket_af
  - nut_af
  check:
    method: coupon
    ref: fit-coupon
    description: 'Hold the bolt head and try to spin the nut: the hex pocket walls
      must take the torque with no free spin beyond the small printed clearance.'
manual:
- n: '1'
  text: Print fit-coupon (black high-speed PLA, 0.2 mm layers) with the pocket mouth
    flat on the bed. It uses ~1 g and takes a few minutes.
  parts:
  - fit-coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Fit test: put the coupon pocket-up on a table, drop in the ISO 4032 M3 nut
    and press it in with your thumb. It should take firm finger pressure, click past
    the snap lip, and bottom out. Turn the coupon upside down and tap it - the nut
    must stay in. Thread the M3 bolt through from the pocket side - it must pass out
    the far hole freely. Verdicts: (a) can''t press it in by hand, or the lip cracks/whitens
    -> reprint with lip_af = 5.4; (b) falls out when inverted -> reprint with lip_af
    = 5.2; (c) otherwise, the fit is good - print the knob.'
  parts:
  - fit-coupon
  hardware:
  - nut-m3
  - m3-bolt
  tool: null
- n: '3'
  text: Print knob with the pocket mouth flat on the bed, flutes vertical. The 5.7
    mm pocket ceiling bridges about 6 mm - well within what this printer handles.
  parts:
  - knob
  hardware: []
  tool: null
- n: '4'
  text: 'Press the M3 nut into the knob exactly like on the coupon: pocket-up on a
    table, align the nut flats with the pocket, press with your thumb until it clicks
    past the snap lip and seats - it ends up recessed about 1 mm inside the mouth,
    flush with the pocket ceiling. Flip the knob over and shake it: the nut stays
    in. No glue, ever.'
  parts:
  - knob
  hardware:
  - nut-m3
  tool: null
- n: '5'
  text: 'To use: thread the M3 bolt into the knob from the mouth side (head on the
    outside of the mouth, threads running through the nut), so the shank exits the
    hole in the top face. Hold the target and turn the knob clockwise - the captive
    nut drives the bolt, no tools needed. Turning the knob anticlockwise backs it
    out. The nut stays captured for the life of the knob. The knob fits any standard
    M3 bolt; the 20 mm length listed is a common example.'
  parts:
  - knob
  hardware:
  - m3-bolt
  tool: null
