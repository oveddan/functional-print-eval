task: nut-knob/M3
note: 'One-piece PLA hand knob, Ø20 x 12 mm, for a captive ISO 4032 M3 nut, no glue.
  Retention: the nut is pressed into a blind hex pocket through a narrow snap lip
  - the lip''s across-flats is 0.2 mm UNDER the nut''s flats, so the nut clicks past
  it and cannot fall out when the knob is inverted, and the bolt head cannot push
  it out through the mouth either. Through the far side there is only a 3.4 mm hole
  in 8.6 mm of solid PLA, so the nut can never be pushed out the other end. The hex
  pocket walls (5.7 across flats, 0.2 mm over the nut) turn the nut with the knob
  so the knob drives the bolt. The bolt runs through the nut and out the top; its
  socket head (Ø5.5) bears on the small ring inside the mouth - any standard M3 bolt
  of any length works, the catalog M3x20 is just the reference. Print both parts pocket-mouth-down
  (no supports; the only internal bridge is the 5.7 mm pocket ceiling, far under the
  50 mm limit). Print the fit-coupon FIRST: it replicates the exact pocket stack,
  so the press force and inverted retention are proven before printing the knob; tuning
  values are in the manual. Nut dimensions could not be measured, so catalog values
  for ISO 4032 M3 (5.5 af x 2.4 h) are used and all fit margins are on the printed
  side, where they belong.'
questions: []
