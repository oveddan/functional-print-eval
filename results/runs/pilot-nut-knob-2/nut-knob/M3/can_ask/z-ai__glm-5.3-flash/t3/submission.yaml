task: nut-knob/M3
note: Captive-nut hand knob, Ø20 x 12, one printed piece. Nut retention is a snap
  lip (thin flexing ring with lead-in cone) over a hex pocket; the pocket floor has
  only a 3.6 mm bolt hole, so the nut is trapped and cannot exit the far side. Press
  the coupon first to dial in the lip before printing the knob.
questions:
- text: How long is the M3 bolt you'll use? (Any length from 10 mm up works; a 12
    mm bolt's tip protrudes about 4 mm out of the bottom.)
  answer: null
- text: Is 12 mm thickness okay for the knob, or do you want it chunkier/thinner?
  answer: null
params:
  knob_dia:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: user asked for about 20 mm across
  knob_h:
    value: 12
    unit: mm
    kind: design
    source: design
    note: chosen for a comfortable 2-3 finger grip and stiff pocket floor
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut thickness
  pocket_af:
    value: 5.8
    unit: mm
    kind: design
    source: design
    note: nut af + 0.3 slip fit; leaves ~6 deg rotational play so torque still transfers
      via the flats
  pocket_depth:
    value: 2.7
    unit: mm
    kind: design
    source: design
    note: nut h 2.4 + 0.3; nut top sits 0.3 below the lip
  lip_id:
    value: 6
    unit: mm
    kind: design
    source: design
    note: smaller than nut across-corners 6.35 so corners catch and retain; larger
      than bolt head 5.5 so the head can seat; ~0.35 diametral press flex
  lip_od:
    value: 7.6
    unit: mm
    kind: design
    source: design
    note: ''
  lip_h:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: thin section + relief dish keep press force at a few newtons, well below
      PLA crack risk
  dish_dia:
    value: 12
    unit: mm
    kind: design
    source: design
    note: relief dish that makes the lip thin and flexible
  bolt_hole_d:
    value: 3.6
    unit: mm
    kind: design
    source: design
    note: M3 clearance plus print-shrink allowance; far smaller than nut af so the
      nut cannot be pushed out the far side
  bolt_head_d:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3 head; must pass the lip opening
  sc_r:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: finger-scallop radius for grip
  sc_depth:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA (high-speed, black)
  code: "import math\n\ndef build(p):\n    R = p.knob_dia / 2.0\n    body = cq.Workplane(\"\
    XY\").circle(R).extrude(p.knob_h)\n    body = body.faces(\"<Z\").edges().chamfer(0.6)\n\
    \    body = body.faces(\">Z\").edges().chamfer(0.5)\n    # six finger scallops\
    \ around the rim for grip\n    off = R + p.sc_r - p.sc_depth\n    for i in range(6):\n\
    \        a = math.radians(i * 60.0)\n        body = body.cut(\n            cq.Workplane(\"\
    XY\")\n            .center(off * math.cos(a), off * math.sin(a))\n           \
    \ .circle(p.sc_r)\n            .extrude(p.knob_h + 2)\n        )\n    # relief\
    \ dish on the top face (makes the snap lip thin and springy)\n    body = body.cut(\n\
    \        cq.Workplane(\"XY\")\n        .workplane(offset=p.knob_h - p.lip_h)\n\
    \        .circle(p.dish_dia / 2.0)\n        .extrude(p.lip_h + 1)\n    )\n   \
    \ # hex nut pocket, open up into the dish, floor below (only the bolt hole pierces\
    \ it)\n    hex_d = p.pocket_af / math.cos(math.pi / 6.0)\n    body = body.cut(\n\
    \        cq.Workplane(\"XY\")\n        .workplane(offset=p.knob_h - p.lip_h -\
    \ p.pocket_depth)\n        .polygon(6, hex_d)\n        .extrude(p.pocket_depth\
    \ + 0.01)\n    )\n    # snap-lip opening through the lip\n    body = body.cut(\n\
    \        cq.Workplane(\"XY\")\n        .workplane(offset=p.knob_h - p.lip_h)\n\
    \        .circle(p.lip_id / 2.0)\n        .extrude(p.lip_h + 1)\n    )\n    #\
    \ 0.4 mm 45 deg lead-in cone at the lip's top edge\n    r0 = p.lip_id / 2.0\n\
    \    cone = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.knob_h\
    \ - p.lip_h)\n        .circle(r0)\n        .workplane(offset=p.lip_h)\n      \
    \  .circle(r0 + 0.4)\n        .loft()\n    )\n    body = body.cut(cone)\n    #\
    \ bolt through-hole: pocket floor to bottom face\n    body = body.cut(\n     \
    \   cq.Workplane(\"XY\").circle(p.bolt_hole_d / 2.0).extrude(p.knob_h)\n    )\n\
    \    return body"
  print_orientation: flat bottom face (far face with the small hole) on the bed, knob
    standing upright with the nut pocket facing up; no supports
  use_orientation: upright with the nut pocket facing up, bolt tip pointing down out
    of the far face
- id: coupon-nut-fit
  role: coupon
  material: PLA (high-speed, black)
  code: "import math\n\ndef build(p):\n    R = 8.0\n    H = 8.0\n    body = cq.Workplane(\"\
    XY\").circle(R).extrude(H)\n    body = body.faces(\"<Z\").edges().chamfer(0.6)\n\
    \    body = body.cut(\n        cq.Workplane(\"XY\")\n        .workplane(offset=H\
    \ - p.lip_h)\n        .circle(p.dish_dia / 2.0)\n        .extrude(p.lip_h + 1)\n\
    \    )\n    hex_d = p.pocket_af / math.cos(math.pi / 6.0)\n    body = body.cut(\n\
    \        cq.Workplane(\"XY\")\n        .workplane(offset=H - p.lip_h - p.pocket_depth)\n\
    \        .polygon(6, hex_d)\n        .extrude(p.pocket_depth + 0.01)\n    )\n\
    \    body = body.cut(\n        cq.Workplane(\"XY\")\n        .workplane(offset=H\
    \ - p.lip_h)\n        .circle(p.lip_id / 2.0)\n        .extrude(p.lip_h + 1)\n\
    \    )\n    r0 = p.lip_id / 2.0\n    cone = (\n        cq.Workplane(\"XY\")\n\
    \        .workplane(offset=H - p.lip_h)\n        .circle(r0)\n        .workplane(offset=p.lip_h)\n\
    \        .circle(r0 + 0.4)\n        .loft()\n    )\n    body = body.cut(cone)\n\
    \    body = body.cut(cq.Workplane(\"XY\").circle(p.bolt_hole_d / 2.0).extrude(H))\n\
    \    return body"
  print_orientation: flat bottom on the bed, pocket face up; no supports
  use_orientation: pocket face up (same pocket and snap lip as the knob, no scallops,
    quick to print)
hardware:
- id: nut-m3
  ref: ISO 4032 M3
  qty: 1
- id: bolt-m3x12
  ref: ISO 4762 M3x12
  qty: 1
joints:
- id: bolt-into-captive-nut
  fastener: bolt-m3x12
  axis_origin:
  - 0.0
  - 0.0
  - 12.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: hex nut pocket (5.8 mm AF x 2.7 deep) under the snap lip
    role: nut_pocket
  - part: knob
    feature: 3.6 mm through-hole from pocket floor out the far face
    role: clearance
  nut: nut-m3
  external: null
criteria: []
manual:
- n: '1'
  text: Print the coupon (coupon-nut-fit) in PLA, pocket face up, no supports.
  parts:
  - coupon-nut-fit
  hardware: []
  tool: null
- n: '2'
  text: 'Test fit: place the M3 nut over the coupon''s pocket opening and press with
    your thumb — it should click past the lip with firm (not painful) finger pressure.
    Flip the coupon upside down and shake: the nut must stay in. Try to push the nut
    out the small bottom hole with a fingertip: it must not budge.'
  parts:
  - coupon-nut-fit
  hardware:
  - nut-m3
  tool: null
- n: '3'
  text: If the coupon passes, print the knob the same way. If the nut will not press
    in or the lip cracks, reprint the coupon with lip_id increased by 0.2 mm; if the
    nut drops straight out when inverted, decrease lip_id by 0.2 mm and retest before
    printing the knob.
  parts:
  - coupon-nut-fit
  - knob
  hardware: []
  tool: null
- n: '4'
  text: Press the M3 nut into the knob's top pocket with your thumb until it clicks
    past the snap lip. Verify it stays in when you turn the knob upside down.
  parts:
  - knob
  hardware:
  - nut-m3
  tool: null
- n: '5'
  text: 'Screw the M3 bolt in from the top: it passes the lip, threads through the
    captive nut, and the tip emerges from the knob''s flat bottom face. The bolt head
    ends up resting on the nut inside the pocket and may sit slightly proud of the
    top face — that''s normal.'
  parts:
  - knob
  hardware:
  - bolt-m3x12
  - nut-m3
  tool: null
- n: '6'
  text: To tighten, grip the scalloped knob and twist clockwise — the captive nut
    drives the bolt. No tools needed.
  parts:
  - knob
  hardware:
  - bolt-m3x12
  tool: null
