manual:
- n: '1'
  text: Print coupon-3-lips flat on the bed, pockets up, no supports (about 5 minutes).
  parts:
  - coupon-3-lips
  hardware: []
  tool: 3D printer (Bambu Lab X1C)
- n: '2'
  text: 'Fit test: lay the bar flat on a table and press an M3 nut into each pocket
    with your thumb — left pocket lip 5.30, middle 5.40, right 5.50. The correct pocket
    lets the nut snap in with firm finger pressure and holds it when the bar is turned
    upside down and tapped.'
  parts: []
  hardware: []
  tool: null
- n: '3'
  text: 'Bolt check on the middle pocket: thread your M3 bolt in from the top until
    the head clicks past the lip and seats on the nut (the head ends roughly 1.5-1.8
    mm below the surface). Unscrew it again and confirm the nut is still captive.'
  parts: []
  hardware: []
  tool: null
- n: '4'
  text: 'If the middle (5.40) pocket passed steps 2-3, print the knob — it uses the
    same 5.40 lip, flat on the bed, no supports. If 5.40 clearly failed (nut drops
    in unheld, or will not press in), stop: the knob needs its lip size changed to
    the size that worked before printing.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '5'
  text: 'Press the M3 nut into the knob''s top pocket: rest the nut on the funnel
    mouth (it self-aligns), then press on a table with your thumb until it clicks
    past the lip. Turn the knob upside down and tap it — the nut must stay in.'
  parts:
  - knob
  hardware:
  - m3-nut
  tool: null
- n: '6'
  text: Thread your M3 bolt in from the top, through the nut, turning the knob until
    the head snaps past the lip and bottoms on the nut. For bolts about 9 mm or longer
    the tip pokes out of the bottom hole; shorter bolts stop inside the hole — both
    work.
  parts:
  - knob
  hardware: []
  tool: null
- n: '7'
  text: 'Use: grip the fluted rim and turn. To release the bolt, unscrew until the
    head clicks back out through the lip and pull it free. The nut cannot be pushed
    out through the bottom — the solid floor''s 3.3 mm hole is far narrower than the
    nut.'
  parts:
  - knob
  hardware: []
  tool: null
