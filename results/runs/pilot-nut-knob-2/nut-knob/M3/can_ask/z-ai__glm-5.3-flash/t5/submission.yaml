task: nut-knob/M3
note: One-piece PLA hand knob, Ø20 × 10 mm, for driving an M3 bolt without tools.
  An ISO 4032 M3 nut presses by hand into a hex pocket (5.65 across flats) through
  a snap lip (5.40 across flats) at the mouth — elastic retention, no glue — and is
  held upside-down by that lip. Below the pocket is a solid 2.8 mm floor with a Ø3.3
  hole, so the nut can never be pushed out through the far side while the bolt passes
  through the nut and out the bottom. The bolt head snaps through the same lip and
  seats directly on the captive nut, so clamping loads bypass the lip. Because the
  nut and bolt head could not be caliper-measured, the design is dimensioned to ISO
  nominal values and a coupon (three pockets, lips 5.30/5.40/5.50) verifies the fit
  before the knob is printed. The knob's lip is the 5.40 size. The user's own M3 socket-head
  bolt (not catalogue hardware) threads into the captive nut.
questions:
- text: Did the middle coupon pocket (5.40 lip) hold the nut upside-down after a firm
    thumb press?
  answer: null
- text: How long is your M3 bolt? (determines how far the tip sticks out of the bottom
    hole; >= ~9 mm exits the knob)
  answer: null
