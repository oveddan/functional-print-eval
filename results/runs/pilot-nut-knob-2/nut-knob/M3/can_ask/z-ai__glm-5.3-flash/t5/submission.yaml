parts:
- id: knob
  role: final
  material: PLA (high-speed, black)
  code: "import math\n\ndef build(p):\n    H = p.knob_h\n    d = p.knob_d\n    ac\
    \ = p.pocket_af / math.cos(math.pi / 6)      # pocket hex, across corners\n  \
    \  lac = p.lip_af / math.cos(math.pi / 6)        # snap lip hex, across corners\n\
    \    lip_z0 = H - p.lip_h\n\n    body = cq.Workplane(\"XY\").circle(d / 2).extrude(H)\n\
    \    body = body.edges(\">Z\").chamfer(p.top_ch)\n    body = body.edges(\"<Z\"\
    ).chamfer(p.bot_ch)\n\n    # finger flutes around the rim\n    for i in range(int(p.flute_n)):\n\
    \        a = 2 * math.pi * i / p.flute_n\n        x = d / 2 * math.cos(a)\n  \
    \      y = d / 2 * math.sin(a)\n        cutter = (cq.Workplane(\"XY\", origin=(x,\
    \ y, -1))\n                  .circle(p.flute_d / 2).extrude(H + 2))\n        body\
    \ = body.cut(cutter)\n\n    # main hex pocket: from the solid floor up through\
    \ the top face\n    void = (cq.Workplane(\"XY\", origin=(0, 0, p.floor_t))\n \
    \           .polygon(6, ac).extrude(H - p.floor_t + 0.5))\n    # carve the snap\
    \ lip: subtract a lip-sized hex column from the mouth,\n    # leaving an elastic\
    \ hex ring that the nut and bolt head snap past\n    lipcol = (cq.Workplane(\"\
    XY\", origin=(0, 0, lip_z0 - 0.01))\n              .polygon(6, lac).extrude(p.lip_h\
    \ + 0.11))\n    void = void.cut(lipcol)\n    body = body.cut(void)\n\n    # 45\
    \ deg lead-in funnel at the mouth (guides nut and bolt head onto the lip)\n  \
    \  c = p.lead_in\n    ftop = (p.lip_af + 2 * c) / math.cos(math.pi / 6)\n    funnel\
    \ = (cq.Workplane(\"XY\", origin=(0, 0, H - c))\n              .polygon(6, lac)\n\
    \              .workplane(offset=c + 0.1)\n              .polygon(6, ftop)\n \
    \             .loft())\n    body = body.cut(funnel)\n\n    # bolt clearance hole\
    \ through the solid floor\n    hole = (cq.Workplane(\"XY\", origin=(0, 0, -1))\n\
    \            .circle(p.bolt_hole_d / 2).extrude(p.floor_t + 1.2))\n    body =\
    \ body.cut(hole)\n    return body"
  print_orientation: bottom face (z=0) on the bed, pocket opening up — no bridges
    or supports needed
  use_orientation: pocket opening up; the bolt is inserted from this side and its
    tip exits the bottom
- id: coupon-3-lips
  role: coupon
  material: PLA (high-speed, black)
  code: "import math\n\ndef build(p):\n    H = p.knob_h\n    ft = p.floor_t\n    k\
    \ = math.cos(math.pi / 6)\n    ac = p.pocket_af / k\n    pitch = p.coupon_pitch\n\
    \    xs = [-pitch, 0.0, pitch]\n    L = 2 * pitch + 20\n    W = 18\n    bar =\
    \ cq.Workplane(\"XY\").box(L, W, H, centered=(True, True, False))\n    for i,\
    \ x in enumerate(xs):\n        laf = p.lip_af + (i - 1) * p.coupon_lip_step\n\
    \        lac = laf / k\n        lip_z0 = H - p.lip_h\n        void = (cq.Workplane(\"\
    XY\", origin=(x, 0, ft))\n                .polygon(6, ac).extrude(H - ft + 0.5))\n\
    \        lipcol = (cq.Workplane(\"XY\", origin=(x, 0, lip_z0 - 0.01))\n      \
    \            .polygon(6, lac).extrude(p.lip_h + 0.11))\n        void = void.cut(lipcol)\n\
    \        bar = bar.cut(void)\n        c = p.lead_in\n        ftop = (laf + 2 *\
    \ c) / k\n        funnel = (cq.Workplane(\"XY\", origin=(x, 0, H - c))\n     \
    \             .polygon(6, lac)\n                  .workplane(offset=c + 0.1)\n\
    \                  .polygon(6, ftop)\n                  .loft())\n        bar\
    \ = bar.cut(funnel)\n        hole = (cq.Workplane(\"XY\", origin=(x, 0, -1))\n\
    \                .circle(p.bolt_hole_d / 2).extrude(ft + 1.2))\n        bar =\
    \ bar.cut(hole)\n    return bar"
  print_orientation: flat, largest face (z=0) on the bed, pockets up — no supports
    needed
  use_orientation: pockets up, same orientation as printed
