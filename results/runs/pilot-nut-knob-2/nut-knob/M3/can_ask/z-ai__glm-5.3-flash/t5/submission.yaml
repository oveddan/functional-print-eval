    note: 45 deg funnel at the pocket mouth, self-aligns the nut and the bolt head
  lip_af:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: 0.10 nominal interference on nut_af so the nut snaps in by hand and holds
      upside-down; coupon verifies 5.30/5.40/5.50 before the knob is printed
  lip_h:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: compliant snap ring, low strain at 0.05/side deflection
  nut_af:
