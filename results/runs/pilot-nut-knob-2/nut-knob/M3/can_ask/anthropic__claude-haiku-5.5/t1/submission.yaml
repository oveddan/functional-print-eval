task: nut-knob/M3
note: ''
questions: []
params:
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: design
    note: knob outer diameter
  knob_h:
    value: 12
    unit: mm
    kind: design
    source: design
    note: knob height, bottom (nut entry) to top
  bore_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: M3 clearance bore through the knob, smaller than the nut so the nut cannot
      exit the top
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 thickness
  pocket_af:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: hex pocket across flats, 0.1 mm clearance over the nut for a hand press
      fit
  pocket_clear:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: extra headroom above the nut in the pocket
  lip_d:
    value: 5.2
    unit: mm
    kind: design
    source: design
    note: circular retaining lip at the entry, smaller than the nut flats (5.5) so
      the nut cannot drop out when inverted; PLA flexes to let the nut through
  lip_h:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: lip thickness at the entry
parts:
- id: knob
  role: final
  material: PLA high-speed, black
  code: "def build(p):\n    import math\n    body = cq.Workplane('XY').circle(p.knob_d/2).extrude(p.knob_h)\n\
    \    body = body.faces('>Z').edges().chamfer(1.0)\n    lip_cut = cq.Workplane('XY').workplane(offset=-1).circle(p.lip_d/2).extrude(p.lip_h\
    \ + 1)\n    hex_d = p.pocket_af / math.cos(math.radians(30))\n    top = p.lip_h\
    \ + p.nut_h + p.pocket_clear\n    hex_cut = cq.Workplane('XY').workplane(offset=p.lip_h).polygon(6,\
    \ hex_d).extrude(top - p.lip_h)\n    bore = cq.Workplane('XY').workplane(offset=-1).circle(p.bore_d/2).extrude(p.knob_h\
    \ + 2)\n    return body.cut(lip_cut).cut(hex_cut).cut(bore)\n"
  print_orientation: bottom face (nut entry, with retaining lip) on the bed, knob
    axis vertical
  use_orientation: knob axis vertical, nut entry facing the work, grip on top, bolt
    through the centre
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints:
- id: knob_bolt
  fastener: nut
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: hex nut pocket
    role: nut_pocket
  - part: knob
    feature: clearance bore
    role: clearance
  nut: null
  external: null
criteria:
- id: nut_captive
  part: knob
  feature: hex nut pocket with retaining lip
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - pocket_af
  - lip_d
  - nut_af
  check:
    method: measure
    ref: null
    description: Nut seats in the hex pocket; the 5.2 mm lip holds it when the knob
      is inverted. Fit should be a light press, not loose.
- id: bolt_clearance
  part: knob
  feature: clearance bore
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - bore_d
  check:
    method: measure
    ref: null
    description: M3 bolt passes freely through the 3.4 mm bore.
manual:
- n: '1'
  text: Print the knob with its bottom face (the nut entry, with the thin retaining
    lip) on the bed. Knob axis vertical. Supports should not be needed; the pocket
    ceiling is a short bridge.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Remove any stringing from the hex pocket and the lip opening with a small
    blade. The round opening at the bottom should measure about 5.2 mm across.
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Start an M3 hex nut (ISO 4032) into the hex pocket from the bottom opening,
    flats aligned with the pocket. Press it upward past the lip by hand. The lip should
    flex and let it snap in, and the nut should then sit in the pocket with light
    resistance. If it will not go past the lip by hand, do not force it.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Turn the knob upside down and confirm the nut stays in the pocket with no
    glue. The lip stops it falling out, and the top bore is too small for the nut
    to exit.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Run your M3 bolt up through the knob bore into the nut and tighten by turning
    the knob.
  parts:
  - knob
  hardware:
  - nut
  tool: null
