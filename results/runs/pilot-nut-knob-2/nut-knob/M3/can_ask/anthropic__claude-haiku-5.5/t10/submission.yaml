task: nut-knob/M3
note: 'Captive M3 nut hand knob, one printed piece. The nut is pressed in through
  a smaller hex opening at the bottom, which retains it, so no glue is needed. The
  bolt is your own M3 bolt; choose its length for the part it fastens. Print test:
  the press-fit tolerances (pocket 5.4 mm AF, lip 5.0 mm AF) depend on your printer,
  so if the nut is too tight or too loose after the first print, adjust pocket_af
  and lip_af by about 0.1 to 0.2 mm and reprint.'
questions: []
params:
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: Knob outer diameter, as requested (about 20 mm)
  knob_h:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Overall knob height
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: M3 bolt major diameter
  bore_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: Clearance hole for the M3 bolt through the knob
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height
  pocket_af:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: Nut pocket across flats, slightly under nut AF so the nut is a press fit
  pocket_h:
    value: 2.6
    unit: mm
    kind: design
    source: design
    note: Nut pocket depth, nut height plus 0.2 mm
  lip_af:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: Entry hex opening at the bottom; smaller than the nut so it snaps past and
      is retained
  lip_t:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: Thickness of the retaining lip at the bottom
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    body = cq.Workplane('XY').circle(p.knob_d\
    \ / 2).extrude(p.knob_h)\n    body = body.faces('>Z').edges().fillet(1.0)\n  \
    \  k = 1.0 / math.cos(math.radians(30))\n    # entry hex opening through the bottom\
    \ lip (nut is pushed in through here)\n    entry = cq.Workplane('XY').workplane(offset=-1).polygon(6,\
    \ p.lip_af * k).extrude(p.lip_t + 1)\n    # captive pocket for the nut above the\
    \ lip\n    pocket = cq.Workplane('XY').workplane(offset=p.lip_t).polygon(6, p.pocket_af\
    \ * k).extrude(p.pocket_h)\n    # bolt bore through the whole knob\n    bore =\
    \ cq.Workplane('XY').workplane(offset=-1).circle(p.bore_d / 2).extrude(p.knob_h\
    \ + 2)\n    return body.cut(entry).cut(pocket).cut(bore)\n"
  print_orientation: bottom face on bed (z=0 is the bottom of the knob, lip side down)
  use_orientation: upright, bottom face down, bolt along the knob axis
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: nut_pocket
  part: knob
  feature: hex nut pocket above the bottom lip
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - pocket_af
  - pocket_h
  - nut_af
  - nut_h
  check:
    method: measure
    ref: null
    description: After printing, press the M3 nut up through the bottom opening by
      hand; it should seat in the pocket and not drop out when the knob is turned
      upside down.
- id: bolt_bore
  part: knob
  feature: bolt bore through knob
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - bore_d
  - bolt_d
  check:
    method: measure
    ref: null
    description: M3 bolt passes freely through the bore and threads into the captive
      nut.
manual:
- n: '1'
  text: Print the knob with the flat bottom on the bed (lip side down). No supports
    needed.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Check the nut fits the bottom opening. Push the M3 ISO 4032 nut into the hex
    opening at the bottom of the knob by hand. It should squeeze past the lip and
    seat in the pocket above it. If it will not go in, ream the opening lightly with
    a 5.5 mm drill bit held by hand, or sand the hex corners of the nut slightly.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Confirm the nut is captive. Turn the knob upside down and shake it gently;
    the nut should stay in the pocket.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Thread the M3 bolt through the knob's bore and into the nut. Turn the knob
    by hand to tighten.
  parts: []
  hardware: []
  tool: null
