task: nut-knob/M3
note: ''
questions:
- text: The nut snap-in relies on about 0.2 mm of PLA flex per side at the lip. Please
    do a quick test print before relying on it; if the nut will not seat, the lip_af
    param can be raised toward 5.3 mm.
  answer: null
- text: Bolt length was assumed as M3x20; the final length depends on the mount thickness
    and should be chosen by the person.
  answer: null
params:
  knob_od:
    value: 20
    unit: mm
    kind: design
    source: design
    note: Knob outer diameter, as requested
  knob_h:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Knob height, print axis vertical
  floor_t:
    value: 5
    unit: mm
    kind: design
    source: design
    note: Solid floor under the nut cavity, carries the bolt hole
  bolt_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: M3 clearance hole through floor and lip for the bolt shank
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 thickness
  pocket_clear:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: Clearance added to nut size for the nut cavity and top channel
  lip_af:
    value: 5.1
    unit: mm
    kind: design
    source: design
    note: Retaining lip across flats, 0.2 mm per side smaller than nut so the nut
      snaps through and is held. Must be confirmed by a test print; PLA flex is limited
  lip_t:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: Retaining lip thickness
parts:
- id: knob
  role: final
  material: PLA high-speed black
  code: "import math\n\ndef build(p):\n    H = p.knob_h\n    R = p.knob_od / 2.0\n\
    \    body = cq.Workplane('XY').circle(R).extrude(H)\n\n    def hexcut(af, z0,\
    \ z1):\n        d = af / math.cos(math.pi / 6)\n        return cq.Workplane('XY').workplane(offset=z0).polygon(6,\
    \ d).extrude(z1 - z0)\n\n    cav_af = p.nut_af + p.pocket_clear\n    cav_h = p.nut_h\
    \ + 0.4\n    cav_z0 = p.floor_t\n    cav_z1 = cav_z0 + cav_h\n    lip_z0 = cav_z1\n\
    \    lip_z1 = lip_z0 + p.lip_t\n\n    body = body.cut(hexcut(cav_af, cav_z0, cav_z1))\n\
    \    body = body.cut(hexcut(p.lip_af, lip_z0, lip_z1))\n    body = body.cut(hexcut(cav_af,\
    \ lip_z1, H + 1))\n    hole = cq.Workplane('XY').workplane(offset=-1).circle(p.bolt_d\
    \ / 2.0).extrude(H + 2)\n    body = body.cut(hole)\n    return body\n"
  print_orientation: knob axis vertical, flat bottom on bed, nut opening facing up
  use_orientation: knob axis vertical, nut opening at top, bolt passes through the
    floor
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
- id: bolt
  ref: ISO 4762 M3x20
  qty: 1
joints: []
criteria:
- id: nut_captive
  part: knob
  feature: hex nut cavity with retaining lip at top
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - nut_h
  - pocket_clear
  - lip_af
  - lip_t
  - floor_t
  check:
    method: coupon
    ref: null
    description: Print the knob, press the M3 nut in through the top, confirm it snaps
      past the lip, stays when knob is inverted, and cannot be pushed out through
      the floor hole.
- id: bolt_clear
  part: knob
  feature: bolt clearance hole through floor and lip
  relation: clears
  hardware: bolt
  clearance_mm: null
  params:
  - bolt_d
  check:
    method: coupon
    ref: null
    description: M3 bolt turns freely through the knob hole and threads into the captive
      nut.
manual:
- n: '1'
  text: Print the knob upright (nut opening facing up). No supports are needed.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Hold the knob with the nut opening facing up. Line the nut's flats up with
    the hex opening, then press the M3 nut straight down with your thumb. It should
    pop past the lip and sit in the cavity. If it will not go in, do not force it;
    report the fit so the lip can be opened up.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: 'Check the nut is held: turn the knob upside down and confirm the nut stays
    in the cavity.'
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Pass the M3 bolt up through the hole in the floor of the knob and thread it
    into the captive nut. Tighten by hand by turning the knob.
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: null
