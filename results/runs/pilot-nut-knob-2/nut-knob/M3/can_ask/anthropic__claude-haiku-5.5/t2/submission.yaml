task: nut-knob/M3
note: Retention relies on the press fit (pocket 0.2 mm under nut across-flats) plus
  the closed top wall. Nut stays captive against gravity only through friction; if
  it slips when inverted, increase the interference to 5.2 mm across flats or add
  a small lip at the pocket mouth. The knob was not printed or fit-tested; the press-fit
  tightness depends on the printer and should be checked once.
questions: []
params:
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: design
    note: Knob outer diameter
  knob_h:
    value: 7
    unit: mm
    kind: design
    source: design
    note: Knob height; top wall above the nut pocket is knob_h - nut_h
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 thickness; pocket depth equals this so the nut sits fully inside
  pocket_af:
    value: 5.3
    unit: mm
    kind: design
    source: design
    note: Hex pocket across flats, 0.2 mm under nut_af so the nut press-fits and is
      held by friction
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: M3 bolt major diameter
  bolt_hole_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: Clearance hole through the top wall for the bolt
  grip_n:
    value: 12
    unit: count
    kind: design
    source: design
    note: Number of grip grooves around the knob rim
  grip_r:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: Radius of each grip groove
parts:
- id: knob
  role: final
  material: PLA high-speed black
  code: "def build(p):\n    import math\n    r = p.knob_d / 2\n    body = cq.Workplane('XY').circle(r).extrude(p.knob_h)\n\
    \    pts = []\n    for i in range(int(p.grip_n)):\n        a = 2 * math.pi * i\
    \ / p.grip_n\n        pts.append((r * math.cos(a), r * math.sin(a)))\n    grooves\
    \ = cq.Workplane('XY').pushPoints(pts).circle(p.grip_r).extrude(p.knob_h)\n  \
    \  body = body.cut(grooves)\n    pocket = cq.Workplane('XY').polygon(6, p.pocket_af\
    \ / math.cos(math.radians(30))).extrude(p.nut_h)\n    hole = cq.Workplane('XY').circle(p.bolt_hole_d\
    \ / 2).extrude(p.knob_h)\n    body = body.cut(pocket).cut(hole)\n    return body"
  print_orientation: Pocket mouth face (z=0) on the bed, knob top up
  use_orientation: Knob upright, nut pocket facing the mount, bolt entering from the
    pocket side and passing out through the top hole
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
- id: bolt
  ref: ISO 4762 M3x20
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print the knob with the flat pocket face on the bed (knob top up). No supports
    needed; the bolt hole is a short bridge at the top.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Check the hex pocket on the open face. Align the nut's flats with the pocket
    and press the M3 nut in by hand from the open face until it seats flush at the
    top of the pocket. It should be a snug press fit; if it will not start, clean
    the pocket with a 3 mm drill bit by hand (do not force it).
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Turn the knob over to confirm the nut stays captive. It is held by friction
    in the hex pocket and cannot pass the top wall, which has only the 3.4 mm bolt
    hole.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Thread the M3 bolt through the far (top) hole and into the nut from the pocket
    side, then tighten by turning the knob by hand.
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: none
