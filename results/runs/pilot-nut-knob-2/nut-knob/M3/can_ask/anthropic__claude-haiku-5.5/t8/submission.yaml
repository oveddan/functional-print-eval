task: nut-knob/M3
note: ''
questions:
- text: Is the M3 bolt's diameter standard (3 mm), and is there a head on the far
    side that must clear the knob?
  answer: null
- text: Does the nut press in by hand with light resistance? If it is too tight or
    loose, the pocket across-flats value (pocket_af) is the one to change.
  answer: null
params:
  knob_od:
    value: 20
    unit: mm
    kind: design
    source: design
    note: Knob outer diameter, as requested
  knob_h:
    value: 14
    unit: mm
    kind: design
    source: design
    note: Knob height; gives grip and leaves material above the nut
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height
  pocket_af:
    value: 5.3
    unit: mm
    kind: design
    source: design
    note: Hex pocket across flats, 0.2 mm under nut so the PLA grips the nut by interference
      and holds it when inverted. Needs a test-fit with the real nut; adjust if too
      tight or loose
  pocket_depth:
    value: 2.8
    unit: mm
    kind: design
    source: design
    note: Nut height plus 0.4 mm; nut sits against the top floor, fully inside the
      knob
  bolt_clear:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: M3 clearance hole through the top floor
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    body = cq.Workplane('XY').circle(p.knob_od\
    \ / 2).extrude(p.knob_h)\n    body = body.faces('>Z').edges().chamfer(1.5)\n \
    \   # hex nut pocket, open at the bottom (z=0), closed by a floor at the top of\
    \ the pocket\n    corner_d = p.pocket_af / math.cos(math.radians(30))\n    pocket\
    \ = cq.Workplane('XY').polygon(6, corner_d).extrude(p.pocket_depth)\n    body\
    \ = body.cut(pocket)\n    # bolt clearance hole through the whole knob\n    hole\
    \ = cq.Workplane('XY').circle(p.bolt_clear / 2).extrude(p.knob_h)\n    body =\
    \ body.cut(hole)\n    return body"
  print_orientation: bottom face (nut opening) on the bed, z=0 at the bed
  use_orientation: upright, nut pocket at the bottom, bolt entering from the top
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: nut_pocket
  part: knob
  feature: hex nut pocket, 5.3 mm across flats, 2.8 mm deep, open at the bottom
  relation: contains
  hardware: nut
  clearance_mm: 0.2
  params:
  - nut_af
  - nut_h
  - pocket_af
  - pocket_depth
  check:
    method: measure
    ref: null
    description: Nut pressed in by hand stays put when knob is inverted; nut sits
      fully inside the knob against the top floor.
- id: bolt_hole
  part: knob
  feature: M3 clearance hole through knob top floor
  relation: clears
  hardware: null
  clearance_mm: 0.4
  params:
  - bolt_clear
  check:
    method: measure
    ref: null
    description: M3 bolt passes freely through the hole and into the nut.
manual:
- n: '1'
  text: Print the knob with the nut-pocket face (the flat bottom) on the bed. Use
    0.2 mm layers. No supports are needed.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Test-fit the nut first. Hold the knob with the hex pocket facing up and push
    the M3 nut into the pocket by hand, flats aligned with the pocket. It should press
    in with light resistance and stop against the pocket's top floor. If it will not
    start, or goes in with a lot of force, the pocket is off by about 0.1 mm and the
    design needs adjusting before use.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Turn the knob upside down and confirm the nut stays in the pocket with no
    glue. Nut should not drop out.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Thread the M3 bolt down through the top clearance hole into the nut, and tighten
    by turning the knob by hand.
  parts:
  - knob
  hardware: []
  tool: null
