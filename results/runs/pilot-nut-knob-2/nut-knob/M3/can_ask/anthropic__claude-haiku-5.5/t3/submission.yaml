task: nut-knob/M3
note: ''
questions: []
params:
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: about 20 mm across, from the request
  knob_h:
    value: 10
    unit: mm
    kind: design
    source: design
    note: overall height
  bore_d:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: open bore from the top that lets the nut drop past the retaining lip; nut
      corners are 6.35 mm
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 thickness
  pocket_af:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: hex pocket across flats, slightly under nut AF so the nut press-fits by
      hand
  lip_open:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: round retaining opening, smaller than nut AF so the nut snaps past it and
      is held
  lip_t:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: thickness of the retaining lip
  roof_t:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: closed far side the nut cannot be pushed through
  seat_gap:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: extra pocket depth above nut thickness
  bolt_clear:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: M3 clearance hole through the roof
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    r = p.knob_d / 2.0\n    lip_bot = p.roof_t\
    \ + p.nut_h + p.seat_gap\n    lip_top = lip_bot + p.lip_t\n    body = cq.Workplane('XY').circle(r).extrude(p.knob_h)\n\
    \    # open bore from the top, down to the top of the retaining lip\n    bore\
    \ = cq.Workplane('XY').workplane(offset=lip_top).circle(p.bore_d / 2.0).extrude(p.knob_h\
    \ - lip_top + 1)\n    body = body.cut(bore)\n    # hex nut pocket under the lip,\
    \ sitting on the roof\n    hexd = p.pocket_af / math.cos(math.pi / 6)\n    hexp\
    \ = cq.Workplane('XY').workplane(offset=p.roof_t).polygon(6, hexd).extrude(lip_bot\
    \ - p.roof_t)\n    body = body.cut(hexp)\n    # retaining lip opening\n    lipo\
    \ = cq.Workplane('XY').workplane(offset=lip_bot - 0.01).circle(p.lip_open / 2.0).extrude(p.lip_t\
    \ + 0.02)\n    body = body.cut(lipo)\n    # bolt clearance through the roof\n\
    \    hole = cq.Workplane('XY').workplane(offset=-1).circle(p.bolt_clear / 2.0).extrude(p.roof_t\
    \ + 2)\n    body = body.cut(hole)\n    return body\n"
  print_orientation: roof (bolt-side face) on the bed, bore opening up
  use_orientation: 'same as printed: roof on the bolt side, bore open at the top'
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: nut_captive
  part: knob
  feature: hex nut pocket under retaining lip
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - pocket_af
  - lip_open
  - nut_h
  - roof_t
  check:
    method: measure
    ref: null
    description: Nut seats fully inside the hex pocket, held by the lip; does not
      fall out upside down and cannot be pushed out the roof side
- id: bolt_clearance
  part: knob
  feature: roof bolt hole
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - bolt_clear
  check:
    method: measure
    ref: null
    description: M3 bolt passes freely through the roof hole
manual:
- n: '1'
  text: Print the knob with the roof (flat closed face) on the bed and the open bore
    facing up. No supports needed.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: 'Check the nut pocket: the M3 nut should be able to press past the lip with
    firm hand pressure. If it will not go, the lip is too tight; if it rattles, it
    is too loose. Do not force it with a tool.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Press the M3 hex nut into the open bore, flats aligned to the hex pocket,
    pushing it through the lip until it seats on the roof. It is now held between
    the lip and the roof and cannot fall out in either orientation.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Thread the M3 bolt through the roof hole from the outside into the captive
    nut and tighten by hand by turning the knob.
  parts:
  - knob
  hardware:
  - nut
  tool: null
