task: estoa-light
note: 'The box prints flat on its back face (z = 0) with zero support material required.
  The USB-C access window at the bottom uses a 40 mm top bridge (well within the 50
  mm bridging capability of the Bambu Lab X1C) so the front circular rim remains continuous
  360 degrees. Two recessed keyhole bosses spaced 120 mm apart horizontally in the
  upper half allow the box to hang flat against the wall on #8 round-head screws standing
  3.5 mm out from the wall.'
questions:
- text: What are the LED disk mounting hole diameter, spacing, and position relative
    to the input wires?
  answer: 'led disk hole diameter: 3.3 mm; led disk between holes: 30.2 mm (inner
    edges, so 33.5 mm centre-to-centre); on a horizontal line through the centre (3
    and 9 o''clock) with input wires at 12 o''clock; 102.54 mm and 102.24 mm from
    outside of holes to disk edge.'
- text: What are the perfboard dimensions, corner hole positions, and ESP32 USB-C
    port position?
  answer: 50 x 70 mm perfboard (18 x 24 holes at 2.54 mm); 2.4 mm corner holes 0.9
    mm from board edges (45.8 x 65.8 mm centre-to-centre). ESP32 (63.17 x 28.25 mm)
    in columns 8 and 18, rows 2 to 23, standing 16 mm tall; USB-C port is 7.53 mm
    from the perfboard edge, 3.99 mm off the ESP32 centreline, and its bottom is 12.54
    mm above the perfboard top face (3.2 mm tall x 10.67 mm wide).
- text: What wall screws are used to hang the box?
  answer: '#8 round-head screws in 1/4 inch anchors with heads at most 9 mm across,
    standing about 3.5 mm out from the wall, at any spacing specified by the design.'
