parts:
- id: wall_box
  role: final
  material: PLA (matte white)
  code: "def build(p):\n    r_outer = p.led_disk_od / 2.0\n    r_inner = r_outer -\
    \ p.wall_t\n    disk_hole_pitch = p.led_disk_between_holes + p.led_disk_hole_d\n\
    \    pb_dx = p.perfboard_w / 2.0 - (p.perfboard_hole_edge_dist + p.perfboard_hole_d\
    \ / 2.0)\n    pb_dy = p.perfboard_l / 2.0 - (p.perfboard_hole_edge_dist + p.perfboard_hole_d\
    \ / 2.0)\n\n    # 1. Main cylindrical shell (floor + outer wall)\n    outer =\
    \ cq.Workplane(\"XY\").circle(r_outer).extrude(p.box_depth)\n    inner = cq.Workplane(\"\
    XY\").workplane(offset=p.floor_t).circle(r_inner).extrude(p.box_depth)\n    box\
    \ = outer.cut(inner)\n\n    # 2. Central structural rib & two M3 mounting pillars\
    \ for the LED disk\n    rib = (\n        cq.Workplane(\"XY\")\n        .center(0.0,\
    \ 0.0)\n        .rect(disk_hole_pitch, 5.0)\n        .extrude(p.floor_t + 8.0)\n\
    \    )\n    pillars = (\n        cq.Workplane(\"XY\")\n        .pushPoints([(-disk_hole_pitch\
    \ / 2.0, 0.0), (disk_hole_pitch / 2.0, 0.0)])\n        .circle(p.pillar_od / 2.0)\n\
    \        .extrude(p.box_depth)\n    )\n    box = box.union(rib).union(pillars)\n\
    \n    # Cut heat-set insert bores and M3 clearance bores into the top of the two\
    \ pillars\n    insert_bores = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.box_depth\
    \ - (p.insert_length + 1.0))\n        .pushPoints([(-disk_hole_pitch / 2.0, 0.0),\
    \ (disk_hole_pitch / 2.0, 0.0)])\n        .circle(p.insert_hole_d / 2.0)\n   \
    \     .extrude(p.insert_length + 2.0)\n    )\n    clearance_bores = (\n      \
    \  cq.Workplane(\"XY\")\n        .workplane(offset=p.box_depth - 12.0)\n     \
    \   .pushPoints([(-disk_hole_pitch / 2.0, 0.0), (disk_hole_pitch / 2.0, 0.0)])\n\
    \        .circle(p.m3_clearance_d / 2.0)\n        .extrude(12.5)\n    )\n    box\
    \ = box.cut(insert_bores).cut(clearance_bores)\n\n    # 3. Four standoffs for\
    \ the 50x70 perfboard\n    pb_pts = [\n        (-pb_dx, p.perfboard_center_y -\
    \ pb_dy),\n        (pb_dx, p.perfboard_center_y - pb_dy),\n        (-pb_dx, p.perfboard_center_y\
    \ + pb_dy),\n        (pb_dx, p.perfboard_center_y + pb_dy),\n    ]\n    standoff_top_z\
    \ = p.floor_t + p.standoff_h\n    standoffs = (\n        cq.Workplane(\"XY\")\n\
    \        .pushPoints(pb_pts)\n        .circle(p.standoff_od / 2.0)\n        .extrude(standoff_top_z)\n\
    \    )\n    pilot_holes = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=standoff_top_z\
    \ - 5.5)\n        .pushPoints(pb_pts)\n        .circle(p.m2_pilot_d / 2.0)\n \
    \       .extrude(6.0)\n    )\n    box = box.union(standoffs).cut(pilot_holes)\n\
    \n    # 4. Two recessed keyhole bosses in the upper half for #8 wall screws\n\
    \    kh_x = p.wall_screw_pitch / 2.0\n    kh_y = 45.0\n    boss_h = 7.5\n    for\
    \ sx in (-kh_x, kh_x):\n        boss = (\n            cq.Workplane(\"XY\")\n \
    \           .center(sx, kh_y + p.keyhole_slot_l / 2.0)\n            .slot2D(p.keyhole_slot_l\
    \ + p.keyhole_entry_d + 8.0, p.keyhole_entry_d + 8.0, 90.0)\n            .extrude(boss_h)\n\
    \        )\n        box = box.union(boss)\n        # Through entry circle and\
    \ upper slot (z = 0 to keyhole_web_t)\n        entry_cut = (\n            cq.Workplane(\"\
    XY\")\n            .center(sx, kh_y)\n            .circle(p.keyhole_entry_d /\
    \ 2.0)\n            .extrude(boss_h + 1.0)\n        )\n        slot_cut = (\n\
    \            cq.Workplane(\"XY\")\n            .center(sx, kh_y + p.keyhole_slot_l\
    \ / 2.0)\n            .slot2D(p.keyhole_slot_l + p.keyhole_slot_w, p.keyhole_slot_w,\
    \ 90.0)\n            .extrude(p.keyhole_web_t)\n        )\n        # Internal\
    \ counterbore pocket above keyhole_web_t for screw head clearance (prints facing\
    \ +z, no overhang)\n        head_pocket = (\n            cq.Workplane(\"XY\")\n\
    \            .workplane(offset=p.keyhole_web_t)\n            .center(sx, kh_y\
    \ + p.keyhole_slot_l / 2.0)\n            .slot2D(p.keyhole_slot_l + p.keyhole_entry_d\
    \ + 2.0, p.keyhole_entry_d + 2.0, 90.0)\n            .extrude(boss_h)\n      \
    \  )\n        box = box.cut(entry_cut).cut(slot_cut).cut(head_pocket)\n\n    #\
    \ 5. Bottom access window for the USB-C charger plug (bridged at top, 40 mm span\
    \ <= 50 mm max bridge)\n    usb_z_min = p.floor_t + p.standoff_h + p.perfboard_t\
    \ + 2.0\n    usb_z_max = p.box_depth - 3.5\n    usb_cut = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=usb_z_min)\n        .center(8.0, -r_outer)\n\
    \        .rect(p.usb_window_w, 30.0)\n        .extrude(usb_z_max - usb_z_min)\n\
    \    )\n    box = box.cut(usb_cut)\n\n    return box\n"
  print_orientation: Back face flat on the build plate (z = 0 on the bed, +z up)
  use_orientation: Back face flat against the wall (z = 0 on the wall, +z away from
    the wall, +y up)
- id: fit_coupon
  role: coupon
  material: PLA (matte white)
  code: "def build(p):\n    disk_hole_pitch = p.led_disk_between_holes + p.led_disk_hole_d\n\
    \    pb_dx = p.perfboard_w / 2.0 - (p.perfboard_hole_edge_dist + p.perfboard_hole_d\
    \ / 2.0)\n    pb_dy = p.perfboard_l / 2.0 - (p.perfboard_hole_edge_dist + p.perfboard_hole_d\
    \ / 2.0)\n    base_t = 2.4\n\n    # Compact T-shaped test frame checking LED disk\
    \ hole spacing + perfboard standoffs + USB-C window height\n    pb_frame = (\n\
    \        cq.Workplane(\"XY\")\n        .center(0.0, p.perfboard_center_y)\n  \
    \      .rect(p.perfboard_w + 6.0, p.perfboard_l + 6.0)\n        .extrude(base_t)\n\
    \    )\n    pb_cutout = (\n        cq.Workplane(\"XY\")\n        .center(0.0,\
    \ p.perfboard_center_y)\n        .rect(p.perfboard_w - 10.0, p.perfboard_l - 10.0)\n\
    \        .extrude(base_t + 1.0)\n    )\n    spine = (\n        cq.Workplane(\"\
    XY\")\n        .center(0.0, p.perfboard_center_y / 2.0)\n        .rect(14.0, abs(p.perfboard_center_y)\
    \ + 12.0)\n        .extrude(base_t)\n    )\n    disk_bar = (\n        cq.Workplane(\"\
    XY\")\n        .center(0.0, 0.0)\n        .rect(disk_hole_pitch + p.pillar_od,\
    \ p.pillar_od)\n        .extrude(base_t)\n    )\n    coupon = pb_frame.cut(pb_cutout).union(spine).union(disk_bar)\n\
    \n    # Two short bosses at LED disk hole centres with heat-set insert holes\n\
    \    boss_h = base_t + p.insert_length + 2.0\n    bosses = (\n        cq.Workplane(\"\
    XY\")\n        .pushPoints([(-disk_hole_pitch / 2.0, 0.0), (disk_hole_pitch /\
    \ 2.0, 0.0)])\n        .circle(p.pillar_od / 2.0)\n        .extrude(boss_h)\n\
    \    )\n    insert_holes = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=boss_h\
    \ - (p.insert_length + 1.0))\n        .pushPoints([(-disk_hole_pitch / 2.0, 0.0),\
    \ (disk_hole_pitch / 2.0, 0.0)])\n        .circle(p.insert_hole_d / 2.0)\n   \
    \     .extrude(p.insert_length + 2.0)\n    )\n    coupon = coupon.union(bosses).cut(insert_holes)\n\
    \n    # Four perfboard standoffs with M2 pilot holes\n    pb_pts = [\n       \
    \ (-pb_dx, p.perfboard_center_y - pb_dy),\n        (pb_dx, p.perfboard_center_y\
    \ - pb_dy),\n        (-pb_dx, p.perfboard_center_y + pb_dy),\n        (pb_dx,\
    \ p.perfboard_center_y + pb_dy),\n    ]\n    st_top = base_t + p.standoff_h\n\
    \    standoffs = (\n        cq.Workplane(\"XY\")\n        .pushPoints(pb_pts)\n\
    \        .circle(p.standoff_od / 2.0)\n        .extrude(st_top)\n    )\n    pilots\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=st_top - 5.0)\n\
    \        .pushPoints(pb_pts)\n        .circle(p.m2_pilot_d / 2.0)\n        .extrude(5.5)\n\
    \    )\n    coupon = coupon.union(standoffs).cut(pilots)\n\n    return coupon\n"
  print_orientation: Flat on the build plate (z = 0 on the bed)
  use_orientation: Test gauge against the LED disk back face and the perfboard
