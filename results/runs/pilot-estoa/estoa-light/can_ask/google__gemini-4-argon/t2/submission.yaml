- n: '1'
  text: Print the small fit_coupon first. Press one M3x4x5 heat-set insert into one
    of the coupon's upper bosses to verify insert fit and check that the two central
    holes on the LED disk align with the 33.5 mm boss spacing. Test-fit the perfboard
    onto the four M2 standoffs and verify the USB-C charger plug clears the bottom
    window.
  parts:
  - fit_coupon
  hardware:
  - m3_insert
  - led_disk
  - perfboard
  - esp32
  - m2_perfboard_screw
  tool: soldering iron and Phillips screwdriver
- n: '2'
  text: Print the wall_box flat on the build plate (back face at z = 0). Using a soldering
    iron, press the two M3x4x5 heat-set inserts flush into the top of the two central
    mounting pillars.
  parts:
  - wall_box
  hardware:
  - m3_insert
  tool: soldering iron
- n: '3'
  text: Place the perfboard (with the ESP32 plugged into its headers and its USB-C
    port facing down towards the bottom access window) onto the four lower standoffs
    inside the wall_box. Fasten the four corners using the four M2 x 6 self-tapping
    screws.
  parts:
  - wall_box
  hardware:
  - perfboard
  - esp32
  - m2_perfboard_screw
  tool: small Phillips screwdriver
- n: '4'
  text: Route the four input wires from the perfboard up between the two central pillars
    to the 12 o'clock input connector on the back of the LED disk. Seat the LED disk
    flat against the front rim and central pillars of the wall_box (with the input
    wires at 12 o'clock) and fasten it through the two central holes using the two
    ISO 4762 M3x8 socket head screws.
  parts:
  - wall_box
  hardware:
  - led_disk
  - m3_disk_screw
  tool: 2.5 mm hex key
- n: '5'
  text: 'Install two #8 round-head wall screws into wall anchors spaced 120.0 mm apart
    horizontally and levelled, leaving the underside of the screw heads about 3.5
    mm out from the wall. Plug the USB-C charger cable straight up through the bottom
    access window into the ESP32, then hang the box flat on the wall by fitting the
    two keyhole openings over the screw heads and sliding the box down 12 mm.'
  parts:
  - wall_box
  hardware: []
  tool: spirit level and screwdriver
