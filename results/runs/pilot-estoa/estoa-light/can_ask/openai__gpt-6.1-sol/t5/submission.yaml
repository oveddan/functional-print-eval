task: estoa-light
note: '232 mm diameter, 60 mm deep wall box with rotatable electronics carrier and
  broad bottom USB access bay. FIT-CHECK-FIRST: USB position, PCB thickness and rear
  component projections remain unmeasured. ESP32 assembly coordinates are provisional,
  not verified. Print coupons and carrier before box. Disk diameter inferred as 241.58
  mm from the supplied measurements. Black PLA is the only confirmed material; equivalent
  matte-white PLA can be used after repeating fit checks. The user''s #8 wall screws
  and anchors are external wall fixings, not supplied design hardware; keyholes accommodate
  them subject to the mandatory test. Front/diffuser is not included.'
questions:
- text: LED hole centres?
  answer: '33.5 mm apart: measured inner-edge gap 30.2 plus hole diameter 3.3. Both
    lie on horizontal centreline.'
- text: USB location and rear clearances?
  answer: Not established. Carrier rotates to aim the actual USB port downward; actual
    cable access and component clearances must pass the template checks before printing
    box.
- text: White PLA?
  answer: Not confirmed. Available black PLA is specified; obtain equivalent white
    PLA for the requested appearance.
