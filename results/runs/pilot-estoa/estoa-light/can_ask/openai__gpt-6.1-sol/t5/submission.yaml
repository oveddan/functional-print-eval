criteria:
- id: disk_mount_fit
  part: led_mount_coupon
  feature: Two nut-backed posts
  relation: supports
  hardware: led_disk
  clearance_mm: null
  params:
  - disk_hole_pitch
  - disk_hole_d
  - disk_t
  - disk_d
  - disk_rear_envelope
  check:
    method: coupon
    ref: led_mount_coupon
    description: Both screws must enter freely. 16 mm post footprints and rim must
      touch only safe bare rear PCB lands. 5.5 mm heads must clear LEDs/traces. Do
      not force or flex board; revise supports if interfering.
- id: nut_capture
  part: box
  feature: Side-entry M3 channels and roof
  relation: contains
  hardware: led_nuts
  clearance_mm: 0.4
  params:
