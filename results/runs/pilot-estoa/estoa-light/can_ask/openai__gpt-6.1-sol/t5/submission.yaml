    method: measure
    ref: null
    description: Measure actual terminal/capacitor and disk rear projections. Hold
      disk back at z=60 above loaded carrier; maintain at least 2 mm air gap to every
      component and connector except verified bare support lands. Four wires must
      reach with slack.
- id: wall_capture
