    ref: wall_coupon
    description: Actual user's screw head must pass 10 mm entry but not 5 mm neck,
      and shank must slide. Set head underside about 4.5 mm from wall, adjusting for
      secure sliding fit. External anchors must suit wall; follow packaging.
manual:
- n: '1'
  text: Disconnect power. Print coupons in final filament at 0.2 mm layers. Use 5
    walls, 6 top/bottom layers and 25–30% infill. Do not support short nut channels.
    Largest part footprint is 232 mm, within the X1C. White PLA is not confirmed available;
    use equivalent white only after repeating these tests.
  parts:
  - led_mount_coupon
  - pilot_coupon
  - wall_coupon
  hardware: []
  tool: 3D printer
- n: '2'
  text: Test LED coupon on actual disk with M3 nuts and M3x10 screws. Nuts slide in
    from +y with flats against straight channel walls. Push fully to closed ends.
    Confirm spacing, safe rear lands, head clearance and full thread engagement. Tighten
    gently by hand without flexing PCB. Remove test hardware afterwards. Any interference
    needs support redesign, not more torque.
  parts:
  - led_mount_coupon
  hardware:
  - led_disk
  - led_screws
  - led_nuts
  tool: 2.5 mm hex key
- n: '3'
  text: Test actual M2x6 screws in pilot coupon. Choose a pilot that neither splits
    nor strips; change pilot_d if needed. Print carrier and check four-hole pattern
    on actual perfboard. All standoffs must seat flat; screw heads must not bridge
    copper. Confirm no underside solder will touch carrier or central pivot head.
  parts:
  - pilot_coupon
  - carrier
  hardware:
  - pcb_screws
  - perfboard
  tool: Hand screwdriver
- n: '4'
  text: 'Perform paper-circle USB check before full box: mark 232 mm circle, carrier
    centre 53 mm below centre and bottom bay 96 mm wide from y=-70 downward. Rotate
    carrier so actual USB points down. Check actual cable insertion/removal with wall
    at z=0 and disk at z=60. Actual port coordinates are unknown; assembly ESP32 placement
    is illustrative. Measure rear projections and tallest components, check at least
    2 mm gaps and existing wire reach. If this fails, revise geometry before printing
    box.'
  parts:
  - carrier
  hardware:
  - perfboard
  - esp32
  - led_disk
  tool: Paper, ruler and actual USB cable
- n: '5'
  text: Print box flat back down, 5 walls, 6 top/bottom layers, 30% infill. No supports
    inside nut channels. Optional brim for adhesion. Inspect keyholes, tall posts,
    layer bonding and flat back. Do not use cracked or warped prints.
  parts:
  - box
  hardware: []
  tool: 3D printer
- n: '6'
  text: Slide pivot nut into low boss from +y. Place carrier on boss, washer above
    carrier, then M3x10 screw. Leave loose enough to rotate. Attach perfboard with
    four M2x6 self-tapping screws using light hand torque; estimated penetration is
    4.4 mm with a 1.6 mm board. Aim actual USB toward bay, then lightly tighten pivot.
    Keep solder at least 2 mm from pivot head.
  parts:
  - box
  - carrier
  hardware:
  - pivot_nut
  - pivot_screw
  - pivot_washer
  - pcb_screws
  - perfboard
  - esp32
  tool: 2.5 mm hex key and hand screwdriver
- n: '7'
  text: Route existing four wires clear of pivot, tall posts and rim; they must have
    slack. Slide LED nuts into tall pillar channels from +y. Temporarily seat disk,
    wires toward +y. Recheck every rear component and support contact; remove disk
    for wall fixing.
  parts:
  - box
  - carrier
  hardware:
  - led_nuts
  - led_disk
  - perfboard
  tool: Ruler
- n: '8'
  text: 'Wall fixings are the user''s external #8 round-head screws and 1/4 inch anchors,
    not additional printed-assembly hardware. Test them with wall coupon. Mark two
    level screw centres 120 mm apart, corresponding to box coordinates x=±60, y=64.
    Avoid hidden pipes/wiring. Install anchors according to packaging and wall construction;
    choose adequate screw embedment. Adjust screw-head undersides to approximately
    4.5 mm from wall. Pass heads through entry holes and slide box DOWN 14 mm. Both
    shanks must reach upper ends, heads must capture and back must rest flat. Do not
    hang on unsuitable anchors. This lift-off hanger is not childproof or impact-resistant.'
  parts:
  - wall_coupon
  - box
  hardware: []
  tool: Level, appropriate drill and screwdriver
- n: '9'
  text: Lift box off wall. Seat disk on verified support lands, without pinching wires,
    and gently secure with two M3x10 screws into captured nuts. Do not bow PCB. Rehang
    and check secure capture before plugging USB into the port through bottom bay.
    Bay intentionally remains open; future transparent shell must preserve USB access
    and 14 mm lift-off travel.
  parts:
  - box
  - carrier
  hardware:
  - led_disk
  - led_screws
  - led_nuts
  tool: 2.5 mm hex key
- n: '10'
  text: Use only a correctly rated existing low-voltage USB supply and wiring. This
    mechanical design does not validate the ESP32 power path or current required by
    255 LEDs. Start at low brightness, monitor heating and keep PLA well below its
    softening conditions. Avoid sunlight/heaters and do not enclose a mains charger.
    Periodically inspect screws, PLA seats and wall capture.
  parts:
  - box
  hardware:
  - esp32
  - led_disk
  tool: null
