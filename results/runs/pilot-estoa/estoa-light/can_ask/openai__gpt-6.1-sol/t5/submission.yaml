  - nut_m3_h
  - nut_width_allowance
  - nut_height_allowance
  - nut_roof
  - screw_m3_length
  - disk_t
  check:
    method: coupon
    ref: led_mount_coupon
    description: Nut flats face channel sidewalls; push fully to closed end. Verify
      secure tightening without nut spinning, cracking or screw bottoming, and full
      thread engagement.
