parts:
- id: back_box
  role: final
  material: PLA; listed black stock, or matte white if separately obtained
  code: "def build(p):\n    import math\n    b = cq.Workplane('XY').box(p.box_w,p.box_h,p.base_t,centered=(True,True,False))\n\
    \    outer = cq.Workplane('XY').workplane(offset=p.base_t).rect(p.box_w,p.box_h).rect(p.box_w-2*p.wall_t,p.box_h-2*p.wall_t).extrude(p.rim_z-p.base_t)\n\
    \    b=b.union(outer)\n    opening=cq.Workplane('XY').box(p.bottom_open_w,3*p.wall_t,p.bottom_open_high-p.bottom_open_low,centered=(True,True,False)).translate((0,-p.box_h/2,p.bottom_open_low))\n\
    \    b=b.cut(opening)\n    af=p.m3_nut_af+p.nut_af_allowance\n    nd=af/math.cos(math.pi/6)\n\
    \    nh=p.m3_nut_h+p.nut_height_allowance\n    for x in (-p.disk_pitch/2,p.disk_pitch/2):\n\
    \        b=b.union(cq.Workplane('XY').workplane(offset=p.base_t).center(x,0).circle(p.post_r).extrude(p.disk_back_z-p.base_t))\n\
    \        pocket=cq.Workplane('XY').workplane(offset=p.disk_nut_z).center(x,0).polygon(6,nd).extrude(nh)\n\
    \        entry=cq.Workplane('XY').box(nd,2*p.post_r,nh,centered=(True,False,False)).translate((x,0,p.disk_nut_z))\n\
    \        hole=cq.Workplane('XY').workplane(offset=p.disk_nut_z-10).center(x,0).slot2D(p.m3_clear+p.disk_slot_extra,p.m3_clear,0).extrude(p.disk_back_z-p.disk_nut_z+11)\n\
    \        b=b.cut(pocket).cut(entry).cut(hole)\n    for x in (-p.carrier_mount_half,p.carrier_mount_half):\n\
    \        for yy in (-p.carrier_mount_half,p.carrier_mount_half):\n           \
    \ y=p.carrier_y+yy\n            b=b.union(cq.Workplane('XY').workplane(offset=p.base_t).center(x,y).circle(p.carrier_boss_r).extrude(p.carrier_z-p.base_t))\n\
    \            b=b.cut(cq.Workplane('XY').center(x,y).polygon(6,nd).extrude(p.carrier_nut_roof_z))\n\
    \            b=b.cut(cq.Workplane('XY').center(x,y).circle(p.m3_clear/2).extrude(p.carrier_z+1))\n\
    \    for x in (-p.wall_hole_half_pitch,p.wall_hole_half_pitch):\n        y=p.wall_hole_y\n\
    \        cut=cq.Workplane('XY').center(x,y-p.keyhole_travel).circle((p.m4_head_d+p.wall_head_clear)/2).extrude(p.base_t+1)\n\
    \        stem=cq.Workplane('XY').center(x,y-p.keyhole_travel/2).slot2D(p.keyhole_travel+p.m4_d+p.wall_stem_clear,p.m4_d+p.wall_stem_clear,90).extrude(p.base_t+1)\n\
    \        b=b.cut(cut).cut(stem)\n    return b"
  print_orientation: Flat exterior rear face on bed, z=0. No supports; enable bridge
    handling over small nut-pocket roofs and the 3 mm-thick bottom wall opening.
  use_orientation: Rear face against wall; +y up, +z toward disk; bottom access opening
    points down.
- id: perf_carrier
  role: final
  material: PLA
  code: "def build(p):\n    b=cq.Workplane('XY').box(p.carrier_size,p.carrier_size,p.carrier_t,centered=(True,True,False))\n\
    \    hx=p.pcb_w/2-p.pcb_hole_edge_gap-p.pcb_hole_d/2\n    hy=p.pcb_l/2-p.pcb_hole_edge_gap-p.pcb_hole_d/2\n\
    \    for x in (-hx,hx):\n        for y in (-hy,hy):\n            b=b.union(cq.Workplane('XY').workplane(offset=p.carrier_t).center(x,y).circle(p.pcb_standoff_r).extrude(p.pcb_standoff_h))\n\
    \            b=b.cut(cq.Workplane('XY').workplane(offset=p.carrier_t).center(x,y).circle(p.selftap_pilot/2).extrude(p.pcb_standoff_h+1))\n\
    \    for x in (-p.carrier_mount_half,p.carrier_mount_half):\n        for y in\
    \ (-p.carrier_mount_half,p.carrier_mount_half):\n            b=b.cut(cq.Workplane('XY').center(x,y).circle(p.m3_clear/2).extrude(p.carrier_t+1))\n\
    \    # Four-way symmetric clearances for the disk mounting posts.\n    for x in\
    \ (-p.disk_pitch/2,p.disk_pitch/2):\n        for s in (-1,1):\n            b=b.cut(cq.Workplane('XY').center(x,s*abs(p.carrier_y)).circle(p.post_r+0.8).extrude(p.carrier_t+1))\n\
    \            b=b.cut(cq.Workplane('XY').center(s*abs(p.carrier_y),x).circle(p.post_r+0.8).extrude(p.carrier_t+1))\n\
    \    return b"
  print_orientation: Broad flat underside on bed; standoffs upward.
  use_orientation: Initially centred at (0,-42,12), parallel to rear wall. May rotate
    about its centre in 90-degree steps so USB cable exits downward; rotate perfboard
    and ESP32 with it.
- id: disk_template
  role: coupon
  material: PLA
  code: "def build(p):\n    b=cq.Workplane('XY').box(60,16,1.2,centered=(True,True,False))\n\
    \    for x in (-p.disk_pitch/2,p.disk_pitch/2):\n        b=b.cut(cq.Workplane('XY').center(x,0).slot2D(p.m3_clear+p.disk_slot_extra,p.m3_clear,0).extrude(2))\n\
    \    return b"
  print_orientation: Flat on bed.
  use_orientation: Unpowered fit template across the disk's two mounting holes; do
    not scrape LEDs.
- id: fastener_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    import math\n    af=p.m3_nut_af+p.nut_af_allowance\n \
    \   nd=af/math.cos(math.pi/6)\n    nh=p.m3_nut_h+p.nut_height_allowance\n    b=cq.Workplane('XY').box(36,22,12,centered=(True,True,False))\n\
    \    pocket=cq.Workplane('XY').workplane(offset=4).center(-7,0).polygon(6,nd).extrude(nh)\n\
    \    entry=cq.Workplane('XY').box(nd,13,nh,centered=(True,False,False)).translate((-7,0,4))\n\
    \    b=b.cut(pocket).cut(entry)\n    b=b.cut(cq.Workplane('XY').center(-7,0).circle(p.m3_clear/2).extrude(13))\n\
    \    b=b.cut(cq.Workplane('XY').workplane(offset=6).center(10,0).circle(p.selftap_pilot/2).extrude(7))\n\
    \    return b"
  print_orientation: Flat bottom on bed.
  use_orientation: 'Bench test only: lateral M3 nut insertion and M2 self-tapping
    pilot.'
