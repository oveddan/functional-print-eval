  hardware: perfboard
  clearance_mm: null
  params:
  - pcb_w
  - pcb_l
  - pcb_hole_d
  - pcb_hole_edge_gap
  check:
    method: template
    ref: perf_carrier
    description: Lay unpowered perfboard on carrier before installing screws. Assumes
      holes are equally inset at all four corners. Every hole must align and every
      boss must avoid solder.
- id: pcb_clearance
  part: back_box
  feature: Internal space above and below carrier
  relation: clears
  hardware: perfboard
  clearance_mm: null
  params:
  - pcb_t
  - solder_depth
  - component_height
  - carrier_z
  - carrier_t
  - pcb_standoff_h
  - disk_rear_depth
  check:
    method: measure
    ref: null
    description: 'Actual solder must clear carrier by at least 1 mm: nominal allowable
      solder depth is 5 mm. Actual components and disk rear connector must retain
      at least 3 mm separation, including wire bends. Check around both disk posts.'
- id: usb_access
  part: back_box
  feature: 114 x 54 mm downward-facing access opening
  relation: clears
  hardware: esp32
  clearance_mm: null
  params:
  - bottom_open_w
  - bottom_open_low
  - bottom_open_high
  - usb_mouth_x
  - usb_mouth_y
  - usb_mouth_z
  check:
    method: measure
    ref: null
    description: Rotate carrier to aim USB downward if possible. With disk temporarily
      in place, plug and unplug the actual charger cable through the bottom opening
      without pushing the ESP32 or bending the cable sharply. If port is not edge-facing
      or plug cannot be reached, stop; exact measurements and redesign are required.
- id: disk_head_landing
  part: back_box
  feature: Two disk mounting posts
  relation: supports
  hardware: disk
  clearance_mm: null
  params:
  - disk_t
  - m3_head_d
  - disk_back_z
  - m3_disk_length
  - disk_nut_z
  check:
    method: measure
    ref: null
    description: Verify 5.5 mm head lands only on safe bare PCB, no LED or conductor
      contact. Verify rear pads/posts and the box rim touch no solder or component.
      M3x16 requires approximately 0.8–4 mm PCB thickness and must fully engage the
      nut without bottoming. Stop if unsuitable.
- id: wall_fit
  part: back_box
  feature: Keyholes at 100 mm centres
  relation: seats
  hardware: wall_screws
  clearance_mm: null
  params:
  - wall_hole_half_pitch
  - m4_head_d
  - m4_d
  - base_t
  check:
    method: measure
    ref: null
    description: Suitable load-rated wall anchorage is missing. Do not mount using
      self-tapping PCB screws or substitute unverified fixings. Once suitable anchorage
      exists, verify heads overlap slots, both screws carry load, rear lies flat and
      lifting is required for removal.
manual:
- n: '1'
  text: 'Keep all electronics unpowered. This is a fit-gated design: first print disk_template
    and fastener_coupon at 0.2 mm layers. Check both disk holes and both fastener
    fits. Do not use a printed template as a drill guide on the PCB.'
  parts:
  - disk_template
  - fastener_coupon
  hardware:
  - disk
  - disk_screws
  - m3_nuts
  - pcb_screws
  tool: null
- n: '2'
  text: Measure actual PCB thicknesses, solder/component heights and the disk rear
    protrusions. Verify safe 5.5 mm-diameter M3 head landing areas at the disk holes.
    If any fit criterion fails, stop and revise the design; do not tighten a screw
    against an LED or exposed conductor.
  parts: []
  hardware:
  - disk
  - perfboard
  - esp32
  - disk_screws
  tool: Calipers or ruler
- n: '3'
  text: Print back_box and perf_carrier with their broad rear faces down, 4 perimeters,
    5 top/bottom layers and about 30% infill. No supports intended. Inspect the bottom-opening
    lintel and nut-pocket roofs; remove loose strands. Black PLA is the available
    material; white PLA is an optional separately acquired replacement. Keep PLA away
    from hot surfaces and direct sun.
  parts:
  - back_box
  - perf_carrier
  hardware: []
  tool: 3D printer
- n: '4'
  text: Before wall mounting, insert four M3 nuts from the back of back_box into its
    four carrier-boss pockets. Push each nut to the closed end at z6.6. Thread each
    carrier screw temporarily to verify seating. The pockets are deliberately rear-accessible;
    they need not retain loose nuts before the screws are fitted.
  parts:
  - back_box
  hardware:
  - m3_nuts
  - carrier_screws
  tool: null
- n: '5'
  text: Dry-fit perfboard on perf_carrier. Hole centres are inferred as 45.8 by 65.8
    mm. Check all four bosses clear solder. Fasten gently using four M2x6 self-tapping
    screws; do not overtighten. Require at least 1 mm solder clearance and do not
    let screw tips break through the carrier plate.
  parts:
  - perf_carrier
  hardware:
  - perfboard
  - esp32
  - pcb_screws
  tool: Screwdriver matching the actual self-tapping heads
- n: '6'
  text: Set carrier into the box. Rotate carrier, perfboard and ESP32 together in
    90-degree steps until the USB plug exits downward toward the large bottom opening.
    The assembly coordinates show the initial orientation only. Tighten the four M3x12
    carrier screws into the rear-loaded nuts. Check no perfboard edge or component
    touches either disk mounting post.
  parts:
  - back_box
  - perf_carrier
  hardware:
  - carrier_screws
  - m3_nuts
  - perfboard
  - esp32
  tool: 2.5 mm hex key
- n: '7'
  text: Slide the remaining two M3 nuts into the disk-post pockets from the +y side.
    Route the existing four wires clear of the post holes, rim, screw tips and USB
    access. Keep slack for removal and gentle wire bends. Do not drill, cut or modify
    the electronics.
  parts:
  - back_box
  hardware:
  - m3_nuts
  - disk
  - perfboard
  tool: null
- n: '8'
  text: Trial-place disk with input wires toward +y and back face at the post tops.
    Confirm at least 3 mm separation between opposing components/wires, and no rim
    contact with solder or components. Check actual USB cable insertion/removal with
    the disk in place. If access fails, do not close it; exact USB coordinates and
    a revised opening are needed.
  parts:
  - back_box
  - perf_carrier
  hardware:
  - disk
  - perfboard
  - esp32
  tool: null
- n: '9'
  text: If all checks pass, fasten disk using two M3x16 screws. Their illustrated
    head height assumes a 1.6 mm disk; use the actual thickness for the check. Require
    full nut engagement, no bottoming, safe head contact and only light finger torque.
    Do not bend the PCB to pull it against a post.
  parts:
  - back_box
  hardware:
  - disk
  - disk_screws
  - m3_nuts
  tool: 2.5 mm hex key
- n: '10'
  text: 'Wall installation is blocked with the inventory as listed: suitable wall
    anchors are not provided. Do not improvise wall anchors from printed PLA. Obtain
    or identify suitable load-rated anchorage for two M4x20 machine screws and the
    actual wall before proceeding. Confirm electrical, cable and wall clearances.
    The two screws are 100 mm apart horizontally; their head undersides must stand
    approximately 4 mm from a flat wall, leaving about 16 mm screw engagement in suitable
    anchorage.'
  parts:
  - back_box
  hardware:
  - wall_screws
  tool: Wall-appropriate installation tools; not specified
- n: '11'
  text: Only after suitable wall anchorage has been validated, offer both large keyhole
    openings over the screw heads and lower the box 10 mm so both shanks reach the
    upper narrow ends. Verify full engagement and no wobble before releasing it. The
    keyholes have no anti-lift latch; avoid cable pull or upward knocks. Insert the
    USB cable through the bottom without loading the ESP32. Initial powered use should
    be supervised; check that the enclosed electronics do not overheat PLA.
  parts:
  - back_box
  hardware:
  - wall_screws
  - esp32
  - disk
  tool: null
