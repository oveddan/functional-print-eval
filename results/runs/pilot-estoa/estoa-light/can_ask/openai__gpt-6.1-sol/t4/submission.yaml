task: estoa-light
note: Provisional, fit-gated back-box design, not a verified fit. Disk hole centres
  are 33.5 mm apart (30.2 mm inner-edge gap + 3.3 mm hole diameter). The inferred
  disk diameter is 241.58 mm, assuming both edge measurements follow the same diameter.
  A large bottom opening and a four-way rotatable perfboard carrier avoid inventing
  a precise USB cutout. Unmeasured dimensions are explicitly guessed or unknown; do
  not install until the manual's checks pass. Only black PLA is available in the listed
  setup; matte white requires separately obtaining suitable filament. Front diffuser
  and outer translucent sides are not included.
questions:
- text: Disk diameter and thickness?
  answer: Direct measurement unavailable. Diameter conditionally inferred as 241.58
    mm; thickness remains unknown.
- text: Disk mounting-hole pattern?
  answer: 3.3 mm holes, 30.2 mm inner-edge gap; derived 33.5 mm centres along 3-to-9
    o'clock diameter.
- text: Perfboard mounting pattern?
  answer: 50 x 70 mm board; 2.4 mm corner holes, 0.9 mm hole-edge to board-edge gap;
    inferred 45.8 x 65.8 mm centres.
- text: Exact USB mouth frame and plug dimensions?
  answer: null
- text: Maximum component, solder and rear disk protrusions; safe disk head landing
    areas?
  answer: null
- text: Suitable wall anchors available?
  answer: null
- text: Are all assembly coordinates verified?
  answer: No. Disk and carrier nominal coordinates follow the proposed design. Perfboard
    top height and PCB screw heads assume 1.6 mm PCB thickness. ESP32 mouth position
    and direction are explicitly illustrative guesses; its true frame must be measured
    and its carrier orientation selected during unpowered fit checks.
