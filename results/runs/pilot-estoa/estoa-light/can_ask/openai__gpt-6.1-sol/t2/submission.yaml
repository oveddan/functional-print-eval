criteria:
- id: disk_fit
  part: back_box
  feature: 33.5 mm hole pitch and disk outline
  relation: supports
  hardware: disk
  clearance_mm: null
  params:
  - disk_d
  - disk_pitch
  - disk_hole_d
  - box_d
  check:
    method: coupon
    ref: fit_coupon
    description: Place unpowered disk on coupon bosses, wires up. Both screws must
      enter freely. Compare strip ends with disk's left/right outer edges; inferred
      diameter must be confirmed. Check full box outline with a paper circle before
      printing.
- id: nuts_fit
  part: back_box
  feature: Side-loaded hex nut slots
  relation: contains
  hardware: disk_nuts
  clearance_mm: 0.3
  params:
  - nut_af
  - nut_h
  - nut_slack
  check:
    method: coupon
    ref: fit_coupon
    description: Nuts slide in sideways, stay aligned and resist rotation with finger-tight
      screws. Do not force nuts into undersized pockets.
- id: disk_screw_reach
  part: back_box
  feature: M3 screw/nut engagement and electrical clearance
  relation: engages
  hardware: disk_screws
  clearance_mm: null
  params:
  - disk_t
  - m3_length
  - nut_roof
  - nut_h
  - nut_slack
  - washer_t
  check:
    method: coupon
    ref: fit_coupon
    description: With actual disk and washer, verify screw passes entirely through
      nut without bottoming; confirm washer/head touch only a safe mounting land and
      no LEDs/traces. Nominal 10 mm screw gives full nut engagement for disk thickness
      up to about 3.5 mm; verify actual rather than assuming.
