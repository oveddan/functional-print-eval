manual:
- n: '1'
  text: Do not start with the full box. Print fit_coupon in PLA, 0.2 mm layers, 4
    perimeters and no supports. It fits the X1C bed with a modest brim. De-energize
    both boards while checking fit.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Insert the two M3 nuts sideways into coupon bosses. Test the disk holes with
    M3x10 screws and M3 washers, finger-tight only. Keep metal clear of LED packages/traces.
    The long strip estimates disk diameter; confirm both edges and hole positions.
    If the strip interpretation is wrong, correct disk_d before continuing. Remove
    all hardware after testing.
  parts:
  - fit_coupon
  hardware:
  - disk
  - disk_nuts
  - disk_screws
  - disk_washers
  tool: 2.5 mm hex key
- n: '3'
  text: Use the end pad of fit_coupon to qualify one M2 self-tapping screw with an
    actual perfboard corner; do not force or use a power driver. Verify the screw
    head safely overlaps the hole without touching circuitry. Confirm perfboard thickness
    and solder clearance. Stop and adjust pilot/height if necessary.
  parts:
  - fit_coupon
  hardware:
  - perf
  - perf_screws
  tool: Matching hand screwdriver
- n: '4'
  text: 'Make the paper/cardboard USB access mock-up described in usb_access. With
    the perfboard''s 70 mm direction vertical and USB facing downward, verify the
    actual plug can be inserted and removed through the open bottom. The ESP32 pose
    is only estimated: this check is mandatory. Check tallest capacitor, solder tails
    and disk input connector against the cavity. If any check fails, change the model
    before printing.'
  parts: []
  hardware:
  - perf
  - esp
  - disk
  tool: null
- n: '5'
  text: 'Print back_box outside-back down, cavity up: PLA, 0.2 mm layers, 5 perimeters,
    at least 5 top/bottom layers, about 25% infill. Use a 5 mm brim if needed; total
    footprint remains within 256 mm. No supports in nut slots or screw pilots. Available
    filament is black; obtain matte white if colour is important. Clear brim and burrs
    without enlarging the keyhole necks.'
  parts:
  - back_box
  hardware: []
  tool: null
- n: '6'
  text: Slide M3 nuts into the central tower side slots. Seat the perfboard on its
    four bosses, USB toward the bottom opening, and install four M2x6 screws gently
    by hand. Confirm no solder or bare wire touches screw heads or the floor. ESP32
    remains plugged into its existing headers.
  parts:
  - back_box
  hardware:
  - disk_nuts
  - perf
  - esp
  - perf_screws
  tool: Matching hand screwdriver
- n: '7'
  text: Route the existing four disk wires loosely through the cavity, away from screw
    holes, nut slots and USB plug path. Do not pinch them against the rim. Place disk
    back against the rim and centre towers, input wires upward. Install M3 washers
    and M3x10 screws through its two centre holes into the nuts. Tighten only enough
    to retain the PCB, never bow it. Verify actual screw engagement, component clearance
    and USB operation again.
  parts:
  - back_box
  hardware:
  - disk
  - disk_screws
  - disk_washers
  - perf
  - esp
  tool: 2.5 mm hex key
- n: '8'
  text: 'Wall-mounting hold point: M4 machine screws are NOT substitutes for suitable
    wall screws/anchors in plasterboard or masonry. Do not screw them directly into
    an unknown wall. No suitable wall attachment has been provided or verified. Until
    a compatible load-bearing M4 threaded attachment is established, do not hang this
    light. No mains wiring or charger block may be enclosed.'
  parts: []
  hardware:
  - wall_screws
  tool: null
- n: '9'
  text: 'Only after the wall attachment is verified: set two M4x20 screw axes level
    at 130 mm spacing, with approximately 3 mm under-head gap. Hold the light with
    each large keyhole opening over a head, press the back to the wall, then lower
    it 8 mm into both narrow necks. Adjust gap for a snug, removable fit; the assembled
    screw axes are 65 mm above the box centre. Check both heads are captured before
    releasing. Keep USB cable slack so it cannot lift the box off its keyholes.'
  parts:
