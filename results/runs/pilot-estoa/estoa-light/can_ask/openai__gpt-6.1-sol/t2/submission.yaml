task: estoa-light
note: 'Back box only; no diffuser. Dimensions imply a 241.58 mm disk, but that interpretation
  has not been confirmed. This is a conditional-fit design: print the coupon and perform
  the specified dry fits before printing/using the box. The bottom has a large open
  service notch, not a sealed USB port. ESP32 placement and board thickness are provisional,
  not verified measurements. Wall mounting is NOT ready for use until a suitable existing
  M4 threaded wall attachment has been verified; no anchors are available in the permitted
  hardware. Print in the available black PLA for now, or obtain matte-white PLA for
  the requested colour. Do not install a mains charger inside the enclosure; only
  low-voltage USB wiring belongs inside.'
