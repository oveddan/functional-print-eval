  text: 'Print fit_coupon flat on bed in intended PLA: 0.2 mm layers, 0.4 mm nozzle,
    four walls, five top/bottom layers, 20% infill, no supports. Matte white is requested
    but must be available separately from the confirmed black stock.'
  parts:
  - fit_coupon
  hardware: []
  tool: Bambu X1C
- n: '2'
  text: With power disconnected, put M3 nuts in paired coupon pockets, lay disk on
    the bosses, and try both M3x8 screws. Check 33.5 mm alignment, safe head contact
    and full nut engagement; finger-snug only. Disk thickness is unknown, so do not
    skip. Recover disk, screws and nuts.
  parts:
  - fit_coupon
  hardware:
  - disk
  - disk_screws
  - disk_nuts
  tool: 2.5 mm hex key
- n: '3'
  text: Pilot row left-to-right is 1.6, 1.8, 2.0 mm. Test one M2x6 screw by hand.
    Choose smallest hole that grips without splitting; update board_pilot_d before
    full printing if needed. Verify board hole-centre rectangle 45.8 x 65.8 mm and
    that screw heads span the holes without touching circuitry.
  parts:
  - fit_coupon
  hardware:
  - board_screws
  - perfboard
  tool: Hand screwdriver and ruler/calipers
- n: '4'
  text: Print rear_box flat back down, open front up, same settings, no supports.
    Side-window roofs bridge about 38 mm. Inspect bridges and clean strings from bores,
    hex pockets and keyholes. Check actual disk is large enough to cover the 238 mm
    box.
  parts:
  - rear_box
  hardware:
  - disk
  tool: Bambu X1C
- n: '5'
  text: Dry-fit perfboard on four posts below centre, long axis up/down. Keep power
    disconnected. Confirm solder has at least 2 mm spare clearance above backplate
    and electronics do not hit disk towers. ESP32 remains plugged into its existing
    headers. The assembly ESP32 port location is illustrative, not measured.
  parts:
  - rear_box
  hardware:
  - perfboard
  - esp32
  tool: null
- n: '6'
  text: Before fastening, insert and remove actual USB plug from outside through a
    side window. Try the complete perfboard rotated 180 degrees if needed; its rectangular
    hole pattern is unchanged. Repeat all clearance checks after rotation. If the
    plug cannot be reached without loading the socket, stop and revise the enclosure;
    do not force it. Verify again after closing the disk.
  parts:
  - rear_box
  hardware:
  - perfboard
  - esp32
  tool: null
- n: '7'
  text: Install four M2x6 self-tapping screws by hand, only until seated. Confirm
    at least 3 mm engagement without bottoming, splitting posts or crushing board.
    Route the four disk wires clear of posts, screw heads and USB connector, leaving
    service slack.
  parts:
  - rear_box
  hardware:
  - perfboard
  - board_screws
  tool: Hand screwdriver
- n: '8'
  text: Place one M3 nut into each disk boss top pocket. Align disk input wires upward
    and two holes left/right. Ensure disk rests without rocking on rim and bosses;
    no back components or wires may touch. Fit both M3x8 screws, finger-snug only.
    Do not add metal washers near LEDs. Check USB access once closed.
  parts:
  - rear_box
  hardware:
  - disk
  - disk_nuts
  - disk_screws
  tool: 2.5 mm hex key
- n: '9'
  text: 'Use the user''s existing #8 round-head wall screws and appropriate anchors
    as external wall fixtures. Install level, 130 mm centre-to-centre. Follow actual
    anchor instructions for drilling/embedding in the actual wall; nominal 1/4-inch
    anchor size alone does not establish suitability. Set underside of heads approximately
    3.5 mm from wall and verify heads pass 10 mm entries but cannot pass 5 mm throats.'
  parts:
  - rear_box
  hardware: []
  tool: Level, drill and suitable screwdriver
- n: '10'
  text: Disconnect USB. Offer large keyhole entries over both wall screw heads, then
    lower box 10 mm to seat in narrow upper ends. Seated fixture axes are approximately
    x=-65/+65, y=60 relative to box centre. Adjust head projection for snug flat fit.
    Support the light and gently test retention. These are lift-off slots, not positive
    locks; cable slack must prevent upward pull.
  parts:
  - rear_box
  hardware: []
  tool: null
- n: '11'
  text: Reconnect low-voltage USB through a service window. Initially test at low
    brightness; verify power supply, wires, terminals and power path support the programmed
    LED load. Do not assume ESP32 USB can carry unrestricted full-white current for
    255 LEDs. Perform a supervised temperature test before extended use. Keep vents
    open. Future transparent sides must preserve the selected USB access path and
    ventilation; they are not included in this design.
  parts:
  - rear_box
  hardware:
  - disk
  - perfboard
  - esp32
  tool: null
