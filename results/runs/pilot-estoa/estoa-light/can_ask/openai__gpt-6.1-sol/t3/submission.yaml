- id: disk_fit
  part: rear_box
  feature: paired mounting bosses and front rim
  relation: supports
  hardware: disk
  clearance_mm: null
  params:
  - disk_pitch
  - disk_hole_d
  - disk_d
  check:
    method: coupon
    ref: fit_coupon
    description: Both screws align without bending the disk. Also compare 238 mm box
