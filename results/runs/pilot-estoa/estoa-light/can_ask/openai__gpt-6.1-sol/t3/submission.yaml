task: estoa-light
note: 'Rear box only, with a ventilated service belt rather than a guessed close-fitting
  USB cutout. Future outer sides must preserve USB access and ventilation. Matte white
  PLA is requested; only black PLA was confirmed available. Disk diameter is inferred.
  Disk thickness, rear projections, solder clearance and exact USB position remain
  unverified: perform the mandatory checks before final assembly. Wall screws/anchors
  are existing external fixtures reported by the user, not supplied design hardware.
  ESP32 placement and screw-head elevations using assumed board thicknesses are illustrative;
  do not use them as measured manufacturing datums.'
questions:
- text: Disk measurements?
  answer: 'Two 3.3 mm holes, 30.2 mm inner-edge gap, symmetric left/right about centre.
    Derived pitch 33.5 mm. Outer hole edges to opposite board edges: 102.54 and 102.24
    mm; inferred diameter 241.58 mm assuming measurements along the hole diameter.
    Thickness and back projections unavailable.'
- text: Perfboard measurements?
  answer: 50 x 70 mm; corner holes 2.4 mm, nearest hole edge 0.9 mm from board edge.
    Derived hole rectangle 45.8 x 65.8 mm, assuming symmetric corner holes. Thickness
    and solder projection unavailable.
- text: USB position?
  answer: ESP32 63.17 x 28.25 mm and about 16 mm above perfboard; underside 11.05
    mm above it. Reported USB/board edge distances 4.80 and 7.53 mm do not establish
    direction or port centre. Broad side windows provided; verify access physically.
- text: Wall fixtures?
  answer: 'User reports existing #8 round-head screws, heads at most 9 mm, with 1/4-inch
    anchors; spacing can be chosen. Set 130 mm centres and adjust underside-head projection
    near 3.5 mm. Anchors must suit actual wall.'
