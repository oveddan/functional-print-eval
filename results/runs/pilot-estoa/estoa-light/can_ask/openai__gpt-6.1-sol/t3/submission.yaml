parts:
- id: rear_box
  role: final
  material: PLA, matte white requested; black is the only confirmed available stock
  code: "def build(p):\n    import math\n    e = p.geometry_overcut\n    r = p.box_d/2\n\
    \    s = cq.Workplane('XY').circle(r).extrude(p.base_t)\n    wall = cq.Workplane('XY').workplane(offset=p.base_t).circle(r).circle(r-p.wall_t).extrude(p.box_h-p.base_t)\n\
    \    for i in range(int(p.window_count)):\n        cutter = cq.Workplane('XY').box(p.window_radial_depth,p.window_w,p.window_top-p.window_bottom,centered=(True,True,False)).translate((r-p.wall_t/2,0,p.window_bottom))\n\
    \        cutter = cutter.rotate((0,0,0),(0,0,1),i*360/p.window_count)\n      \
    \  wall = wall.cut(cutter)\n    s = s.union(wall)\n    for x in (-p.disk_pitch/2,p.disk_pitch/2):\n\
    \        foot = cq.Workplane('XY').workplane(offset=p.base_t).center(x,0).circle(p.disk_boss_foot_d/2).extrude(p.boss_foot_h)\n\
    \        post = cq.Workplane('XY').workplane(offset=p.base_t).center(x,0).circle(p.disk_boss_d/2).extrude(p.box_h-p.base_t)\n\
    \        s = s.union(foot).union(post)\n        bore = cq.Workplane('XY').workplane(offset=p.base_t).center(x,0).circle(p.m3_bore/2).extrude(p.box_h-p.base_t+e)\n\
    \        pocket = cq.Workplane('XY').workplane(offset=p.box_h-p.m3_nut_h-p.nut_depth_allowance).center(x,0).polygon(6,(p.m3_nut_af+p.nut_af_allowance)/math.cos(math.pi/6)).extrude(p.m3_nut_h+p.nut_depth_allowance+e)\n\
    \        s = s.cut(bore).cut(pocket)\n    hx = p.board_w/2-p.board_hole_edge_gap-p.board_hole_d/2\n\
    \    hy = p.board_l/2-p.board_hole_edge_gap-p.board_hole_d/2\n    for x in (-hx,hx):\n\
    \        for y in (p.board_centre_y-hy,p.board_centre_y+hy):\n            post\
    \ = cq.Workplane('XY').workplane(offset=p.base_t).center(x,y).circle(p.board_post_d/2).extrude(p.board_under_z-p.base_t)\n\
    \            hole = cq.Workplane('XY').workplane(offset=p.board_under_z-p.board_pilot_depth).center(x,y).circle(p.board_pilot_d/2).extrude(p.board_pilot_depth+e)\n\
    \            s = s.union(post).cut(hole)\n    for x in (-p.key_pitch/2,p.key_pitch/2):\n\
    \        y = p.key_entry_y\n        entry = cq.Workplane('XY').workplane(offset=-e).center(x,y).circle(p.key_entry_d/2).extrude(p.base_t+2*e)\n\
    \        slot = cq.Workplane('XY').workplane(offset=-e).center(x,y+p.key_travel/2).rect(p.key_slot_w,p.key_travel).extrude(p.base_t+2*e)\n\
    \        end = cq.Workplane('XY').workplane(offset=-e).center(x,y+p.key_travel).circle(p.key_slot_w/2).extrude(p.base_t+2*e)\n\
    \        s = s.cut(entry).cut(slot).cut(end)\n    return s"
  print_orientation: Flat external circular back face on bed at z=0, open front upward.
    No supports. Window roofs bridge approximately 38 mm, below confirmed 50 mm limit.
  use_orientation: Back at wall; +y up, +z toward viewer. Perfboard below centre;
    disk input wires at top.
- id: fit_coupon
  role: coupon
  material: Same PLA as rear_box
  code: "def build(p):\n    import math\n    e = p.geometry_overcut\n    s = cq.Workplane('XY').box(p.coupon_w,p.coupon_l,p.coupon_base,centered=(True,True,False))\n\
    \    for x in (-p.disk_pitch/2,p.disk_pitch/2):\n        post = cq.Workplane('XY').workplane(offset=p.coupon_base).center(x,p.coupon_disk_y).circle(p.disk_boss_d/2).extrude(p.coupon_boss_top-p.coupon_base)\n\
    \        hole = cq.Workplane('XY').workplane(offset=p.coupon_base).center(x,p.coupon_disk_y).circle(p.m3_bore/2).extrude(p.coupon_boss_top-p.coupon_base+e)\n\
    \        pocket = cq.Workplane('XY').workplane(offset=p.coupon_boss_top-p.m3_nut_h-p.nut_depth_allowance).center(x,p.coupon_disk_y).polygon(6,(p.m3_nut_af+p.nut_af_allowance)/math.cos(math.pi/6)).extrude(p.m3_nut_h+p.nut_depth_allowance+e)\n\
    \        s = s.union(post).cut(hole).cut(pocket)\n    for i in range(3):\n   \
    \     x = (i-1)*p.coupon_pilot_step\n        post = cq.Workplane('XY').workplane(offset=p.coupon_base).center(x,p.coupon_pilot_y).circle(p.board_post_d/2).extrude(p.board_under_z-p.coupon_base)\n\
    \        hole = cq.Workplane('XY').workplane(offset=p.board_under_z-p.board_pilot_depth).center(x,p.coupon_pilot_y).circle((p.board_pilot_d+i*p.coupon_pilot_increment)/2).extrude(p.board_pilot_depth+e)\n\
    \        s = s.union(post).cut(hole)\n    return s"
  print_orientation: Flat rectangular base on bed; bosses upward. No supports.
  use_orientation: Test fixture only; disk boss pair at y=8 and three pilot-test posts
    at y=-14.
