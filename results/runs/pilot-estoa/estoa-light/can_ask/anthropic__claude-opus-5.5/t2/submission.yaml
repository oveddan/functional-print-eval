task: estoa-light
note: 'The box is a rounded rectangle 90 x 120 x 36 mm that hides behind the centre
  of the disc (about 242 mm across, worked out from the hole-to-edge readings). The
  USB-C opening is a 40 mm wide notch in the bottom wall, sized to cover both ways
  I could read where the port sits. The perfboard edge is 14 mm from the wall, which
  leaves room even if the ESP32 hangs past the perfboard. The disc''s thickness, the
  perfboard''s thickness and where the disc''s connector is were guessed: if the connector
  sits on the back of the disc within 60 mm of its centre, the disc won''t sit flat
  on the lid. The M3 screw heads stand 3 mm proud on the LED side, so the frosted
  front will need clearance there.'
