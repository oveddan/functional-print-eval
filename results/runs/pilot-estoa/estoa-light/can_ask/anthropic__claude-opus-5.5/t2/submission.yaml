manual:
- n: '1'
  text: Print coupon_fit first. Melt one insert into its hole, drive an M2 self-tapper
    into the small hole, and check that a wall-screw head goes into the round hole,
    slides along the slot, and won't pull out. If anything is tight or loose, say
    so before you print the full parts.
  parts:
  - coupon_fit
  hardware:
  - insert
  - m2_screw
  tool: soldering iron with insert tip
- n: '2'
  text: Print the body with its back on the bed and the lid with its grooved front
    face on the bed. Neither needs supports.
  parts:
  - body
  - lid
  hardware: []
  tool: null
- n: '3'
  text: Melt 4 inserts into the tops of the body's corner bosses, flush with the rim.
    From the lid's front (grooved) face, melt 2 inserts into the two holes either
    side of the centre.
  parts:
  - body
  - lid
  hardware:
  - insert
  tool: soldering iron with insert tip
- n: '4'
  text: Place the perfboard on the four standoffs, ESP32 side up, with the USB-C port
    at the end facing the wide notch in the body's bottom wall. Fix it with 4 M2x6
    self-tapping screws. Plug a USB-C cable in through the notch to check it reaches.
    If the port sits deep inside, use a cable with a slim plug.
  parts:
  - body
  hardware:
  - perfboard
  - esp32
  - m2_screw
  tool: small Phillips screwdriver
- n: '5'
  text: Feed the four disc wires out through the slot near the lid's top edge. Screw
    the lid onto the body, grooved face out, with 4 M3x8 screws in the corner counterbores.
    The heads sit below the surface.
  parts:
  - lid
  - body
  hardware:
  - lid_screw
  tool: 2.5 mm hex key
- n: '6'
  text: Lay the wires in the groove that runs from the slot to the lid's top edge,
    then out to the disc's input connector at 12 o'clock. Set the disc on the lid,
    LEDs facing out, wires at the top, and fix it through its two centre holes with
    2 M3x6 screws into the lid's inserts.
  parts:
  - lid
  hardware:
  - led_disk
  - disc_screw
  tool: 2.5 mm hex key
- n: '7'
  text: 'Put two #8 screws into the wall anchors, 44 mm apart and level, leaving about
    4 mm between each head and the wall. Before you fit the disc, check that the box
    hangs on them: push the heads into the round keyhole entries and slide the box
    down. Plug the USB-C charger in through the bottom notch, behind the disc''s lower
    edge.'
  parts:
  - body
  hardware: []
  tool: null
