parts:
- id: body
  role: final
  material: PLA, matte white
  code: "def build(p):\n    W,H,R,t,D,bt = p.box_w,p.box_h,p.box_corner_r,p.wall_t,p.body_depth,p.back_t\n\
    \    body = cq.Workplane('XY').rect(W,H).extrude(D).edges('|Z').fillet(R)\n  \
    \  inner = cq.Workplane('XY').workplane(offset=bt).rect(W-2*t,H-2*t).extrude(D).edges('|Z').fillet(R-t)\n\
    \    body = body.cut(inner)\n    corners = [(sx*p.lid_screw_x, sy*p.lid_screw_y)\
    \ for sx in (-1,1) for sy in (-1,1)]\n    body = body.union(cq.Workplane('XY').pushPoints(corners).circle(p.lid_boss_d/2).extrude(D))\n\
    \    body = body.cut(cq.Workplane('XY').workplane(offset=D-p.insert_len-2).pushPoints(corners).circle(p.insert_hole_d/2).extrude(p.insert_len+2))\n\
    \    pb_cy = -(H/2-t) + p.usb_edge_gap + p.pb_l/2\n    hx = p.pb_w/2 - p.pb_hole_edge\
    \ - p.pb_hole_d/2\n    hy = p.pb_l/2 - p.pb_hole_edge - p.pb_hole_d/2\n    pb\
    \ = [(sx*hx, pb_cy+sy*hy) for sx in (-1,1) for sy in (-1,1)]\n    top = bt + p.standoff_h\n\
    \    body = body.union(cq.Workplane('XY').pushPoints(pb).circle(p.standoff_d/2).extrude(top))\n\
    \    body = body.cut(cq.Workplane('XY').workplane(offset=top-5.5).pushPoints(pb).circle(p.m2_pilot_d/2).extrude(5.5))\n\
    \    ent_d = p.wall_head_d + 1\n    sw = p.wall_shank_d + 0.6\n    kh = bt + p.keyhole_head_clear\
    \ + 2\n    ey, ry = p.keyhole_entry_y, p.keyhole_rest_y\n    cy = (ey+ry)/2\n\
    \    blen = ry-ey+ent_d+6\n    for sx in (-1,1):\n        xc = sx*p.keyhole_x\n\
    \        body = body.union(cq.Workplane('XY').box(ent_d+6, blen, kh, centered=(True,True,False)).translate((xc,cy,0)))\n\
    \        body = body.cut(cq.Workplane('XY').center(xc,ey).circle(ent_d/2).extrude(bt+p.keyhole_head_clear))\n\
    \        body = body.cut(cq.Workplane('XY').center(xc,cy).slot2D(ry-ey+sw, sw,\
    \ 90).extrude(bt))\n        body = body.cut(cq.Workplane('XY').workplane(offset=bt).center(xc,cy).slot2D(ry-ey+ent_d,\
    \ ent_d, 90).extrude(p.keyhole_head_clear))\n    body = body.cut(cq.Workplane('XY').box(p.usb_notch_w,\
    \ 3*t, D, centered=(True,True,False)).translate((0,-H/2,p.usb_notch_z0)))\n  \
    \  return body\n"
  print_orientation: back (wall side) on the bed, open side up
  use_orientation: back flat on the wall, open side facing out
- id: lid
  role: final
  material: PLA, matte white
  code: "def build(p):\n    W,H,R,T = p.box_w,p.box_h,p.box_corner_r,p.lid_t\n   \
    \ lid = cq.Workplane('XY').rect(W,H).extrude(T).edges('|Z').fillet(R)\n    corners\
    \ = [(sx*p.lid_screw_x, sy*p.lid_screw_y) for sx in (-1,1) for sy in (-1,1)]\n\
    \    lid = lid.cut(cq.Workplane('XY').pushPoints(corners).circle(p.m3_clear_d/2).extrude(T))\n\
    \    lid = lid.cut(cq.Workplane('XY').pushPoints(corners).circle((p.m3_head_d+0.5)/2).extrude(p.cb_depth))\n\
    \    hc = (p.disc_hole_gap_inner + p.disc_hole_d)/2\n    dp = [(-hc,0),(hc,0)]\n\
    \    lid = lid.cut(cq.Workplane('XY').pushPoints(dp).circle(p.insert_hole_d/2).extrude(p.insert_len+0.5))\n\
    \    lid = lid.cut(cq.Workplane('XY').pushPoints(dp).circle(p.m3_clear_d/2).extrude(T))\n\
    \    lid = lid.cut(cq.Workplane('XY').center(0,p.wire_slot_y).rect(16,8).extrude(T))\n\
    \    gl = H/2 - p.wire_slot_y + 2\n    lid = lid.cut(cq.Workplane('XY').box(p.groove_w,\
    \ gl, p.groove_d, centered=(True,False,False)).translate((0,p.wire_slot_y,0)))\n\
    \    return lid\n"
  print_orientation: front face (the disc side) on the bed
  use_orientation: screwed on top of the body, front face out; the disc lies on it
- id: coupon_fit
  role: coupon
  material: PLA
  code: "def build(p):\n    bt = p.back_t\n    ent_d = p.wall_head_d + 1\n    sw =\
    \ p.wall_shank_d + 0.6\n    kh = bt + p.keyhole_head_clear + 2\n    ey, ry = 8,\
    \ 8 + (p.keyhole_rest_y - p.keyhole_entry_y)\n    c = cq.Workplane('XY').box(40,\
    \ 30, kh, centered=(False,False,False))\n    c = c.cut(cq.Workplane('XY').center(10,ey).circle(ent_d/2).extrude(bt+p.keyhole_head_clear))\n\
    \    c = c.cut(cq.Workplane('XY').center(10,(ey+ry)/2).slot2D(ry-ey+sw, sw, 90).extrude(bt))\n\
    \    c = c.cut(cq.Workplane('XY').workplane(offset=bt).center(10,(ey+ry)/2).slot2D(ry-ey+ent_d,\
    \ ent_d, 90).extrude(p.keyhole_head_clear))\n    c = c.cut(cq.Workplane('XY').workplane(offset=kh-p.insert_len-1).center(28,8).circle(p.insert_hole_d/2).extrude(p.insert_len+1))\n\
    \    c = c.cut(cq.Workplane('XY').workplane(offset=kh-5.5).center(28,22).circle(p.m2_pilot_d/2).extrude(5.5))\n\
    \    return c\n"
  print_orientation: flat on the bed
  use_orientation: hand test
