task: estoa-light
note: Several values are inferred. I read the disc's holes as 33.5 mm apart centre
  to centre (30.2 measured between inner edges plus one 3.3 hole diameter). I read
  the disc as 241.6 mm across from the hole-to-edge readings, which matches Adafruit's
  240 mm disc. The disc and perfboard thicknesses (1.6), the solder-joint height,
  the USB plug size and the wire length are guesses. I couldn't confirm how far the
  USB port sits from the perfboard edge or which side of the board it's on, so the
  bottom slot is 30 mm wide to work either way. The ESP32 shown in the assembly assumes
  the port is flush with the board edge, on the +x side.
questions:
- text: How long are the four disc wires? The perfboard sits at the bottom and the
    disc's input is at 12 o'clock.
  answer: null
- text: Do you want the charger cable to come out at the bottom (as designed) or somewhere
    else?
  answer: null
