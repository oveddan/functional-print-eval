manual:
- n: '1'
  text: Print fit_coupon first (about 15 min). Use a soldering iron to press an M3
    insert into each pillar, flush with the top. Put the disc on it, LED side up,
    and drive the two M3x8 screws through the disc's centre holes into the inserts.
    Then hang the coupon's keyhole on one of your wall screws. If both fit, carry
    on.
  parts:
  - fit_coupon
  hardware:
  - m3_insert
  - m3_screw
  - disc
  tool: soldering iron, 2.5 mm hex key
- n: '2'
  text: Print back_box in matte white PLA, back face on the bed (it's 242 mm across,
    so it fills most of the X1C bed). No supports. Turn the brim off so it fits.
  parts:
  - back_box
  hardware: []
  tool: null
- n: '3'
  text: Press an M3 insert into each of the two centre pillars, flush with the top.
  parts:
  - back_box
  hardware:
  - m3_insert
  tool: soldering iron
- n: '4'
  text: Put the perfboard on the four standoffs near the bottom, ESP32 side up, with
    the USB-C port pointing down at the wide slot in the bottom wall. Fix it with
    the four M2x6 self-tapping screws.
  parts:
  - back_box
  hardware:
  - perfboard
  - esp32
  - m2_screw
  tool: small Phillips screwdriver
- n: '5'
  text: Plug the four wires into the disc's input. They have to reach from the perfboard
    to the disc's 12 o'clock input, roughly 200 mm, so extend them if they're short.
    Lay the disc on the rim, LED side out, with the wires at the top. Line its two
    centre holes up with the pillars and screw it on with the two M3x8 screws.
  parts:
  - back_box
  hardware:
  - disc
  - m3_screw
  tool: 2.5 mm hex key
- n: '6'
  text: 'Wall screws: put two screws level, 120 mm apart, leaving each head about
    5 mm out from the wall. The disc''s centre ends up 80 mm below the screws. Push
    the screw heads into the round keyholes in the back, then slide the light down
    so it locks. Plug the USB-C charger into the ESP32 through the slot at the bottom.'
  parts:
  - back_box
  hardware: []
  tool: null
