parts:
- id: back_box
  role: final
  material: PLA matte white
  code: "def build(p):\n    R = p.box_d/2\n    H = p.box_h\n    b = p.back_t\n   \
    \ body = cq.Workplane('XY').circle(R).extrude(H)\n    body = body.cut(cq.Workplane('XY').workplane(offset=b).circle(R\
    \ - p.wall_t).extrude(H))\n    hp = p.disc_hole_pitch/2\n    body = body.union(cq.Workplane('XY').box(2*hp,\
    \ p.rib_w, H - 1, centered=(True, True, False)))\n    for sx in (-1, 1):\n   \
    \     body = body.union(cq.Workplane('XY').center(sx*hp, 0).circle(p.pillar_d/2).extrude(H))\n\
    \    for sx in (-1, 1):\n        body = body.cut(cq.Workplane('XY').workplane(offset=H\
    \ - p.insert_hole_depth).center(sx*hp, 0).circle(p.insert_hole_d/2).extrude(p.insert_hole_depth\
    \ + 1))\n    hx = p.pb_hole_sx/2\n    hy = p.pb_hole_sy/2\n    yc = p.pb_center_y\n\
    \    for dx in (-hx, hx):\n        for dy in (-hy, hy):\n            body = body.union(cq.Workplane('XY').center(dx,\
    \ yc + dy).circle(p.standoff_d/2).extrude(b + p.standoff_h))\n            body\
    \ = body.cut(cq.Workplane('XY').workplane(offset=b + p.standoff_h - p.pilot_depth).center(dx,\
    \ yc + dy).circle(p.pilot_d/2).extrude(p.pilot_depth + 1))\n    for kx in (-p.key_x,\
    \ p.key_x):\n        ky = p.key_y\n        L = p.slot_len\n        iw = p.hood_inner_w\n\
    \        hw = p.hood_wall\n        y0 = ky - iw/2\n        y1 = ky + L + iw/2\n\
    \        ym = (y0 + y1)/2\n        body = body.union(cq.Workplane('XY').center(kx,\
    \ ym).rect(iw + 2*hw, (y1 - y0) + 2*hw).extrude(b + p.hood_h + p.hood_top))\n\
    \        body = body.cut(cq.Workplane('XY').workplane(offset=b).center(kx, ym).rect(iw,\
    \ y1 - y0).extrude(p.hood_h))\n        body = body.cut(cq.Workplane('XY').center(kx,\
    \ ky).circle(p.key_head_hole_d/2).extrude(b))\n        body = body.cut(cq.Workplane('XY').center(kx,\
    \ ky + L/2).rect(p.key_slot_w, L).extrude(b))\n        body = body.cut(cq.Workplane('XY').center(kx,\
    \ ky + L).circle(p.key_slot_w/2).extrude(b))\n    slot = cq.Workplane('XY').box(p.usb_slot_w,\
    \ p.wall_t*3, p.usb_slot_h).translate((0, -(R - p.wall_t/2), p.usb_z))\n    body\
    \ = body.cut(slot)\n    return body\n"
  print_orientation: back face (wall side, z=0) on the bed, open side up
  use_orientation: back face against the wall, USB slot at the bottom
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    hp = p.disc_hole_pitch/2\n    body = cq.Workplane('XY').box(2*hp\
    \ + p.pillar_d + 10, 34, p.back_t, centered=(True, True, False))\n    for sx in\
    \ (-1, 1):\n        body = body.union(cq.Workplane('XY').center(sx*hp, 0).circle(p.pillar_d/2).extrude(p.coupon_pillar_h))\n\
    \        body = body.cut(cq.Workplane('XY').workplane(offset=p.coupon_pillar_h\
    \ - p.insert_hole_depth).center(sx*hp, 0).circle(p.insert_hole_d/2).extrude(p.insert_hole_depth\
    \ + 1))\n    ky = -7\n    L = p.slot_len\n    body = body.cut(cq.Workplane('XY').center(0,\
    \ ky).circle(p.key_head_hole_d/2).extrude(p.back_t))\n    body = body.cut(cq.Workplane('XY').center(0,\
    \ ky + L/2).rect(p.key_slot_w, L).extrude(p.back_t))\n    body = body.cut(cq.Workplane('XY').center(0,\
    \ ky + L).circle(p.key_slot_w/2).extrude(p.back_t))\n    return body\n"
  print_orientation: flat plate on the bed, pillars up
  use_orientation: held against the disc / wall screw to check fit
