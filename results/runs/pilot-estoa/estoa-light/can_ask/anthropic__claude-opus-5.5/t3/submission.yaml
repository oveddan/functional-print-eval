task: estoa-light
note: 'Two-part box, 180 mm across with a flat bottom and 36 mm deep, sitting behind
  the ~242 mm disc. The back shell has two keyholes for the wall, four standoffs for
  the perfboard and a USB opening in the flat bottom. The front lid holds the disc''s
  two M3 inserts and has a long wire slot at 12 o''clock. Guesses: disc and perfboard
  thickness, USB plug grip size, solder height below the perfboard.'
questions:
- text: Disc thickness and anything standing off its back (I assumed the back is flat
    and 1.6 mm thick). If the connector is soldered to the back, it has to sit over
    the lid's slot.
  answer: null
- text: Is the USB-C mouth flush with the ESP32 board's end? I assumed the mouth is
    7.53 mm in from the perfboard edge, so the plug's grip goes about 2 mm into the
    box.
  answer: null
- text: Are the perfboard-to-disc wires long enough to reach from the lower half of
    the box out through the slot (up to about 100 mm)?
  answer: null
