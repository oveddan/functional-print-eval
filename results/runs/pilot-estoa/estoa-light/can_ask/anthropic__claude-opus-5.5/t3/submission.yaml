manual:
- n: '1'
  text: Print back_shell (wall face down) and front_lid (front face down) in matte
    white PLA. Use supports only if your slicer asks for them; the keyhole roofs and
    the USB opening are short bridges.
  parts:
  - back_shell
  - front_lid
  hardware: []
  tool: null
- n: '2'
  text: Use a soldering iron to press 4 heat-set inserts into the tops of the 4 wall
    bosses inside back_shell, and 2 inserts into the two holes near the lid's centre,
    from the front (flat) face. Seat them flush.
  parts:
  - back_shell
  - front_lid
  hardware:
  - insert
  tool: soldering iron with insert tip
- n: '3'
  text: Set the perfboard ESP32-side up on the 4 standoffs, with the ESP32's USB end
    against the flat bottom wall and the ESP32 toward the side where the USB opening
    sits. Screw it down with the 4 M2x6 self-tapping screws, snug only.
  parts: []
  hardware:
  - perfboard
  - pb_screw
  tool: small Phillips screwdriver
- n: '4'
  text: 'Test now: push the charger plug in through the bottom opening and make sure
    it clicks fully into the ESP32 port. The opening is wide enough for either of
    the ESP32''s two USB-C ports.'
  parts: []
  hardware:
  - esp32
  tool: null
- n: '5'
  text: Feed the 4 disc wires out through the long slot in front_lid. Place the lid
    on the shell, with the flat edges together and the lip inside the wall, and fix
    it with 4 M3x8 screws in the counterbored holes.
  parts:
  - front_lid
  - back_shell
  hardware:
  - lid_screw
  tool: 2.5 mm hex key
- n: '6'
  text: Plug the wires into the disc's 4-pin input connector. Lay the disc on the
    lid, back face down, with its wires at 12 o'clock (toward the slot's long end,
    away from the flat bottom). Screw it on through its two centre holes with 2 M3x6
    screws. Don't overtighten.
  parts: []
  hardware:
  - disc
  - disc_screw
  tool: 2.5 mm hex key
- n: '7'
  text: 'Fix two #8 screws in their anchors, level and 80 mm apart, with the heads
    standing 3.2 mm off the wall. Hang the box by putting the heads into the round
    keyhole openings and sliding it down 12 mm. Plug the charger in through the bottom
    opening.'
  parts:
  - back_shell
  hardware: []
  tool: drill, level
