parts:
- id: back_shell
  role: final
  material: PLA matte white
  code: "import math\ndef build(p):\n    def dshape(r, yf, h):\n        c = cq.Workplane('XY').circle(r).extrude(h)\n\
    \        b = cq.Workplane('XY').center(0, (r - yf) / 2.0).rect(2 * r + 2, r +\
    \ yf).extrude(h)\n        return c.intersect(b)\n    R_in = p.box_r - p.wall_t\n\
    \    yf_in = p.box_flat - p.wall_t\n    H = p.box_h\n    s = dshape(p.box_r, p.box_flat,\
    \ H)\n    s = s.cut(dshape(R_in, yf_in, H).translate((0, 0, p.back_t)))\n    rr\
    \ = R_in - p.boss_d / 2.0\n    pts = [(rr * math.cos(math.radians(a)), rr * math.sin(math.radians(a)))\
    \ for a in (45, 135, 225, 315)]\n    top = H - p.lid_pad_t\n    bosses = cq.Workplane('XY').pushPoints(pts).circle(p.boss_d\
    \ / 2.0).extrude(top - p.back_t).translate((0, 0, p.back_t))\n    s = s.union(bosses)\n\
    \    holes = cq.Workplane('XY').pushPoints(pts).circle(p.insert_hole_d / 2.0).extrude(p.insert_hole_depth).translate((0,\
    \ 0, top - p.insert_hole_depth))\n    s = s.cut(holes)\n    cy = -yf_in + p.pb_edge_gap\
    \ + p.pb_l / 2.0\n    hx = p.pb_w / 2.0 - p.pb_hole_edge - p.pb_hole_d / 2.0\n\
    \    hy = p.pb_l / 2.0 - p.pb_hole_edge - p.pb_hole_d / 2.0\n    sp = [(sx * hx,\
    \ cy + sy * hy) for sx in (-1, 1) for sy in (-1, 1)]\n    so = cq.Workplane('XY').pushPoints(sp).circle(p.standoff_d\
    \ / 2.0).extrude(p.standoff_h).translate((0, 0, p.back_t))\n    s = s.union(so)\n\
    \    pil = cq.Workplane('XY').pushPoints(sp).circle(p.m2_pilot_d / 2.0).extrude(p.standoff_h\
    \ + p.back_t - 1).translate((0, 0, 1))\n    s = s.cut(pil)\n    for sx in (-1,\
    \ 1):\n        x = sx * p.key_dx / 2.0\n        yc = p.key_y + p.key_travel /\
    \ 2.0\n        pad = cq.Workplane('XY').center(x, yc).rect(p.key_pad_w, p.key_pad_l).extrude(p.key_pad_t)\n\
    \        s = s.union(pad)\n        entry = cq.Workplane('XY').center(x, p.key_y).circle((p.wall_head_d\
    \ + 1) / 2.0).extrude(p.key_neck_t + p.key_head_gap)\n        neck = cq.Workplane('XY').center(x,\
    \ yc).rect(p.wall_shank_d + 0.6, p.key_travel).extrude(p.key_neck_t)\n       \
    \ neck_end = cq.Workplane('XY').center(x, p.key_y + p.key_travel).circle((p.wall_shank_d\
    \ + 0.6) / 2.0).extrude(p.key_neck_t)\n        cav = cq.Workplane('XY').center(x,\
    \ yc).rect(p.wall_head_d + 1, p.key_travel).extrude(p.key_head_gap).translate((0,\
    \ 0, p.key_neck_t))\n        cav_end = cq.Workplane('XY').center(x, p.key_y +\
    \ p.key_travel).circle((p.wall_head_d + 1) / 2.0).extrude(p.key_head_gap).translate((0,\
    \ 0, p.key_neck_t))\n        s = s.cut(entry).cut(neck).cut(neck_end).cut(cav).cut(cav_end)\n\
    \    col_mid = (p.esp_col_a + p.esp_col_b) / 2.0\n    esp_x = (col_mid - (p.pb_cols\
    \ + 1) / 2.0) * p.pb_pitch\n    z_port = p.back_t + p.standoff_h + p.pb_t + p.usb_bottom_h\
    \ + p.usb_h / 2.0\n    slot_w = 2 * p.usb_offset + p.plug_grip_w + 2 * p.usb_clear\n\
    \    slot_h = p.plug_grip_t + 2 * p.usb_clear\n    u = cq.Workplane('XY').box(slot_w,\
    \ p.wall_t * 4, slot_h).translate((esp_x, -p.box_flat + p.wall_t / 2.0, z_port))\n\
    \    s = s.cut(u)\n    return s\n"
  print_orientation: back (wall) face on the bed, z=0
  use_orientation: z=0 against the wall, flat face down
- id: front_lid
  role: final
  material: PLA matte white
  code: "import math\ndef build(p):\n    def dshape(r, yf, h):\n        c = cq.Workplane('XY').circle(r).extrude(h)\n\
    \        b = cq.Workplane('XY').center(0, (r - yf) / 2.0).rect(2 * r + 2, r +\
    \ yf).extrude(h)\n        return c.intersect(b)\n    R_in = p.box_r - p.wall_t\n\
    \    yf_in = p.box_flat - p.wall_t\n    s = dshape(p.box_r, p.box_flat, p.lid_t)\n\
    \    rr = R_in - p.boss_d / 2.0\n    pts = [(rr * math.cos(math.radians(a)), rr\
    \ * math.sin(math.radians(a))) for a in (45, 135, 225, 315)]\n    lip = dshape(R_in\
    \ - 0.3, yf_in - 0.3, 2).cut(dshape(R_in - 1.8, yf_in - 1.8, 2))\n    lip = lip.cut(cq.Workplane('XY').pushPoints(pts).circle(p.boss_d\
    \ / 2.0 + 0.6).extrude(2))\n    s = s.union(lip.translate((0, 0, p.lid_t)))\n\
    \    pads = cq.Workplane('XY').pushPoints(pts).circle(p.boss_d / 2.0).extrude(p.lid_pad_t).translate((0,\
    \ 0, p.lid_t))\n    s = s.union(pads)\n    dx = (p.disc_hole_gap + p.disc_hole_d)\
    \ / 2.0\n    dpts = [(-dx, 0), (dx, 0)]\n    dbos = cq.Workplane('XY').pushPoints(dpts).circle(4.5).extrude(p.lid_pad_t).translate((0,\
    \ 0, p.lid_t))\n    s = s.union(dbos)\n    tot = p.lid_t + p.lid_pad_t\n    s\
    \ = s.cut(cq.Workplane('XY').pushPoints(pts).circle(1.7).extrude(tot))\n    s\
    \ = s.cut(cq.Workplane('XY').pushPoints(pts).circle(p.m3_head_d / 2.0 + 0.5).extrude(p.m3_head_h\
    \ + 0.4))\n    s = s.cut(cq.Workplane('XY').pushPoints(dpts).circle(p.insert_hole_d\
    \ / 2.0).extrude(tot - 0.5))\n    ws = cq.Workplane('XY').center(0, (p.wire_slot_y0\
    \ + p.wire_slot_y1) / 2.0).slot2D(p.wire_slot_y1 - p.wire_slot_y0, p.wire_slot_w,\
    \ 90).extrude(tot)\n    s = s.cut(ws)\n    return s\n"
  print_orientation: front face (disc side) on the bed, z=0; pads and lip face up
  use_orientation: front face toward the room, disc screwed onto it
