note: Disc diameter (102 mm) comes from the part number, not a measurement, and the
  disc's thickness is guessed. Check both before you print. Where the USB port sits
  isn't certain, so the notch is 26 mm wide and covers either side. Wall screws are
  yours (#8, 9 mm heads).
