parts:
- id: back_box
  role: final
  material: PLA (matte white)
  code: "import math\ndef build(p):\n    Ro = p.disc_d/2\n    Ri = Ro - p.wall_t\n\
    \    H = p.box_h\n    body = cq.Workplane('XY').circle(Ro).extrude(H)\n    body\
    \ = body.cut(cq.Workplane('XY').workplane(offset=p.floor_t).circle(Ri).extrude(H))\n\
    \    # lid bosses with inserts\n    angs = [30, 150, 225, 315]\n    pts = [(p.lid_screw_r*math.cos(math.radians(a)),\
    \ p.lid_screw_r*math.sin(math.radians(a))) for a in angs]\n    bosses = cq.Workplane('XY').pushPoints(pts).circle(p.lid_boss_d/2).extrude(H)\n\
    \    body = body.union(bosses.intersect(cq.Workplane('XY').circle(Ro).extrude(H)))\n\
    \    body = body.cut(cq.Workplane('XY').workplane(offset=H-8).pushPoints(pts).circle(p.insert_hole_d/2).extrude(8))\n\
    \    # perfboard standoffs\n    hc = p.pb_hole_edge + p.pb_hole_d/2\n    sx =\
    \ p.pb_w/2 - hc\n    spts = [(sx, p.pb_y_bottom+hc), (-sx, p.pb_y_bottom+hc),\
    \ (sx, p.pb_y_bottom+p.pb_l-hc), (-sx, p.pb_y_bottom+p.pb_l-hc)]\n    st = p.floor_t\
    \ + p.standoff_h\n    body = body.union(cq.Workplane('XY').pushPoints(spts).circle(p.standoff_d/2).extrude(st))\n\
    \    body = body.cut(cq.Workplane('XY').workplane(offset=st-6).pushPoints(spts).circle(p.m2_pilot_d/2).extrude(6))\n\
    \    # keyholes (box slides down onto the screw heads)\n    ent = p.wall_screw_head_d\
    \ + 1.0\n    slot_w = p.wall_screw_shank_d + 0.4\n    pk_w = p.wall_screw_head_d\
    \ + 1.4\n    for kx in (p.keyhole_x, -p.keyhole_x):\n        blk = cq.Workplane('XY').box(16,\
    \ 24, 8.5, centered=(True, True, False)).translate((kx, 4, 0))\n        body =\
    \ body.union(blk)\n        body = body.cut(cq.Workplane('XY').center(kx, 0).circle(ent/2).extrude(7))\n\
    \        body = body.cut(cq.Workplane('XY').center(kx, p.keyhole_travel/2).slot2D(p.keyhole_travel+slot_w,\
    \ slot_w, 90).extrude(2.5))\n        body = body.cut(cq.Workplane('XY').workplane(offset=2.5).center(kx,\
    \ p.keyhole_travel/2).slot2D(p.keyhole_travel+pk_w, pk_w, 90).extrude(4.5))\n\
    \    # USB-C access notch in the bottom wall, open to the rim (lid closes it)\n\
    \    notch = cq.Workplane('XY').box(p.usb_notch_w, 9, H, centered=(True, True,\
    \ False)).translate((-3, -Ro+3.5, p.usb_notch_z0))\n    body = body.cut(notch)\n\
    \    return body\n"
  print_orientation: back face (wall side, z=0) on the bed; no supports
  use_orientation: z=0 against the wall, open side facing out, USB notch at the bottom
- id: lid
  role: final
  material: PLA (matte white)
  code: "import math\ndef build(p):\n    Ro = p.disc_d/2\n    lid = cq.Workplane('XY').circle(Ro).extrude(p.lid_t)\n\
    \    angs = [30, 150, 225, 315]\n    pts = [(p.lid_screw_r*math.cos(math.radians(a)),\
    \ p.lid_screw_r*math.sin(math.radians(a))) for a in angs]\n    cb_d = p.m3_head_d\
    \ + 0.7\n    lid = lid.cut(cq.Workplane('XY').pushPoints(pts).circle(p.m3_clear_d/2).extrude(p.lid_t))\n\
    \    lid = lid.cut(cq.Workplane('XY').workplane(offset=p.lid_t-(p.m3_head_h+0.2)).pushPoints(pts).circle(cb_d/2).extrude(p.m3_head_h+0.2))\n\
    \    pitch = p.disc_hole_inner_gap + p.disc_hole_d\n    dd = p.insert_len + 0.5\n\
    \    lid = lid.cut(cq.Workplane('XY').workplane(offset=p.lid_t-dd).pushPoints([(pitch/2,\
    \ 0), (-pitch/2, 0)]).circle(p.insert_hole_d/2).extrude(dd))\n    # wire pass-through\
    \ towards 12 o'clock\n    lid = lid.cut(cq.Workplane('XY').center(0, 30).slot2D(20,\
    \ 12, 90).extrude(p.lid_t))\n    return lid\n"
  print_orientation: inner face (z=0) on the bed, counterbores and insert holes facing
    up
  use_orientation: sits on the box rim; the LED disc screws onto its top face
