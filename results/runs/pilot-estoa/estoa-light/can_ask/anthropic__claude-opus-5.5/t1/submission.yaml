manual:
- n: '1'
  text: 'Print back_box and lid in matte white PLA, flat side down, no supports. (Your
    loaded filament is black: swap to white.)'
  parts:
  - back_box
  - lid
  hardware: []
  tool: null
- n: '2'
  text: Heat-set 4 inserts into the tops of the lid bosses in back_box, and 2 inserts
    into the two holes either side of the lid's centre (counterbored side up).
  parts:
  - back_box
  - lid
  hardware:
  - insert
  tool: soldering iron with insert tip
- n: '3'
  text: Place the perfboard on the four standoffs with the ESP32's USB-C port facing
    the notch at the bottom, and fix it with the four M2 self-tapping screws.
  parts:
  - back_box
  hardware:
  - pb_screw
  - perfboard
  - esp32
  tool: small Phillips screwdriver
- n: '4'
  text: Check that the charger plugs into the ESP32 through the notch. Feed the four
    disc wires through the lid's slot.
  parts:
  - back_box
  - lid
  hardware:
  - esp32
  tool: null
- n: '5'
  text: Put the lid on the box with the wire slot at the top (12 o'clock) and fix
    it with four M3x8 screws into the rim inserts.
  parts:
  - lid
  - back_box
  hardware:
  - lid_screw
  tool: 2.5 mm hex key
- n: '6'
  text: Connect the wires to the disc. Lay the disc on the lid with its input wires
    at 12 o'clock and screw it down through its two centre holes with M3x6 screws.
  parts:
  - lid
  hardware:
  - disc_screw
  - disk
  tool: 2.5 mm hex key
- n: '7'
  text: 'On the wall: set two #8 screws level, 72 mm apart, with about 3 mm between
    each head''s underside and the wall. Put the big holes of the keyholes over the
    heads and slide the box down 8 mm.'
  parts:
  - back_box
  hardware: []
  tool: null
