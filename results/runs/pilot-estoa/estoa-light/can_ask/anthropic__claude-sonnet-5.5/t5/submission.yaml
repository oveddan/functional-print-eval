task: estoa-light
note: Assumptions are listed in the params notes and the questions. The box is a rounded
  rectangle, about 69 x 89 x 38.5 mm, and sits well inside the roughly 241 mm disc.
  I derived that diameter from the hole-to-edge measurements. A round box would not
  fit the 50 x 70 mm board with the USB port at a wall. The disc's M3 screw heads
  are 3 mm tall. Check that they clear the later transparent front. The port assumptions,
  the guessed disc thickness and the guessed board thickness could shift the plug
  opening or the screw lengths. I did not print a coupon, but it is worth test-fitting
  one insert pocket before the full print. The ESP32 faces the port toward the bottom,
  so the charger hangs below the box.
questions:
- text: Which end of the perfboard does the USB-C port face, and is the ESP32 on the
    +x or -x side? I assumed +y and +x. Column 1 is on the -x side.
  answer: null
- text: Which side of the ESP32's centreline is the USB-C port on? The opening is
    wide enough for either side.
  answer: null
- text: What is the disc's actual thickness, and how far do the wire connector and
    the LEDs stand proud of the board? I guessed 1.6 mm for the PCB.
  answer: null
- text: How big is the head of the charger plug? I made a 24 x 10 mm opening and guessed
    the rest.
  answer: null
params:
