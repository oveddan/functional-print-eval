manual:
- n: '1'
  text: Print box-tray and box-lid in matte white PLA. The tray goes back face down,
    open side up. The lid goes with its rear face down, so the counterbores face up.
    Use at least 4 perimeters.
  parts:
  - box-tray
  - box-lid
  hardware: []
  tool: null
- n: '2'
  text: Heat-set 4 inserts into the tray's corner bosses from the open rim, flush
    with the rim. Heat-set 2 inserts into the lid's two centre pockets from the front
    face, flush with the surface.
  parts:
  - box-tray
  - box-lid
  hardware:
  - ins-lid
  - ins-disc
  tool: soldering iron with an insert tip
- n: '3'
  text: Set the perfboard on the four posts so the ESP32's USB-C port faces the notch
    in the bottom wall. Screw it down with the four M2 self-tapping screws. Do not
    overtighten.
  parts:
  - box-tray
  hardware:
  - m2-board
  - perfboard
  - esp32
  tool: small Phillips screwdriver
- n: '4'
  text: Feed the four wires from the perfboard out through the notch in the top wall,
    leaving enough length to reach the disc's input connector. Set the lid on the
    tray with its counterbores over the corner bosses, trapping the wires in the notch.
    Fasten it with four M3x8 screws.
  parts:
  - box-lid
  - box-tray
  hardware:
  - m3-lid
  tool: 2.5 mm hex key
- n: '5'
  text: Lay the disc on the lid front with its wire side at 12 o'clock, over the notch,
    and plug in or connect the four wires. Line the disc's two holes up with the lid's
    inserts. Fasten it with two M3x8 screws. If the screw heads press the LEDs, check
    the disc thickness first.
  parts:
  - box-lid
  hardware:
  - m3-disc
  - disc
  tool: 2.5 mm hex key
- n: '6'
  text: 'Put two #8 screws in the wall, 30 mm apart horizontally, with the heads standing
    5 mm off the wall. Drop the box''s keyhole entries over the heads and slide the
    box down. Plug the USB-C charger into the port through the opening in the bottom
    wall.'
  parts:
  - box-tray
  hardware: []
  tool: null
