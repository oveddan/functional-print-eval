manual:
- n: '1'
  text: Print the box (front face down, matte white) and the cover (wall face down).
    No supports needed.
  parts:
  - box
  - cover
  hardware: []
  tool: null
- n: '2'
  text: Heat-set the 2 inserts into the 4.3 mm holes from the inside of the front
    plate (box lying on its front), pressing them flush with the inside face. Heat-set
    the 4 other inserts into the holes at the rim bosses, flush with the rim.
  parts:
  - box
  hardware:
  - insert
  tool: soldering iron
- n: '3'
  text: Fix the perfboard on the 4 standoffs with its ESP32 side facing the open (wall)
    side and the USB-C port end over the notch. Drive the 4 M2 self-tapping screws
    in. Check the port is lined up with the notch.
  parts:
  - box
  hardware:
  - m2x6
  - perfboard
  - esp32
  tool: small screwdriver
- n: '4'
  text: Push the 4 wires from the perfboard out through the long slot in the front
    plate (toward 12 o'clock). Hold the disc on the front with its wires at 12 o'clock
    and connect the wires to its 4-pin input.
  parts:
  - box
  hardware:
  - disc
  tool: null
- n: '5'
  text: Screw the disc to the front with 2 M3x8 screws through its two holes (3 and
    9 o'clock) into the inserts. Don't overtighten.
  parts:
  - box
  hardware:
  - m3x8
  - disc
  tool: 2.5 mm hex key
- n: '6'
  text: Plug in the USB-C cable plug so it leaves through the notch. Lay the cover
    on the rim, counterbores facing the wall side, and fasten it with 4 M3x8 screws.
  parts:
  - box
  - cover
  hardware:
  - m3x8
  tool: 2.5 mm hex key
- n: '7'
  text: 'Mark two wall screw positions 70 mm apart, same height. Drive the #8 screws
    so the underside of each head is about 5.5 mm from the wall. Push the box on so
    the heads pass through the 10 mm holes, then slide it down so the shanks sit in
    the slots.'
  parts:
  - cover
  hardware: []
  tool: null
