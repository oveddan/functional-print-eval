task: estoa-light
note: 'Assumptions to check: (1) disc diameter unknown (guessed 100 mm); box OD 94.8
  mm must hide behind it. (2) I read the ESP32 numbers as the USB mouth being 2.73
  mm inside the perfboard end, and assumed the port is at the perfboard''s -y end;
  the notch is 26 mm wide to allow for the 3.99 mm offset either side. (3) Perfboard
  1.6 mm, disc 1.6 mm and #8 head height 4.5 mm were guessed. (4) The disc connector
  position is unknown, so the front plate has a long wire slot. (5) Cover screws mean
  unscrewing the cover to access the electronics after hanging, which needs the box
  taken off the wall. (6) The charger is assumed to be on a cable whose plug exits
  the notch; a rigid charger body will not fit this way.'
