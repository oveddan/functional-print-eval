task: estoa-light
note: 'Several values are guesses: perfboard thickness 1.6 mm, tail length 3 mm, wall-screw
  head height 5 mm, USB-C port height, and disc thickness 1.6 mm. The box is deliberately
  roomy to cover them. The USB-C notch is 44 mm wide and open at the top, and it is
  on the right wall. This assumes the ESP32''s USB end is the perfboard end next to
  that wall. The perfboard is set 32.5 mm below the disc centre line, so the box only
  reaches about 72 mm from the disc centre and is fully hidden behind the 168 mm disc.
  The disc rests on the box rim and the two posts. If its back has components in that
  area, tell me. The wire notch in the top wall is a guess because the connector position
  is unknown.'
questions:
- text: 'Could not be measured: disc board thickness, perfboard thickness, plug housing
    size, tallest part on the perfboard, solder tail length, position of the disc''s
    wire connector, and the sideways position of the USB-C port on the perfboard.'
  answer: null
