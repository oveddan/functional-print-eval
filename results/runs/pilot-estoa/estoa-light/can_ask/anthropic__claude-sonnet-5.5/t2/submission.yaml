manual:
- n: '1'
  text: Print the box (back face on the bed, open side up) and the lid (underside
    on the bed) in matte white PLA.
  parts:
  - box
  - lid
  hardware: []
  tool: null
- n: '2'
  text: With a soldering iron, heat-set the four M3 inserts into the holes in the
    tops of the corner posts in the box. Push them in square and flush.
  parts:
  - box
  hardware:
  - insert
  tool: soldering iron
- n: '3'
  text: Heat-set the two remaining M3 inserts into the two small holes in the front
    face of the lid (the ones 33.5 mm apart on the horizontal line). Leave the four
    corner counterbored holes empty.
  parts:
  - lid
  hardware:
  - insert
  tool: soldering iron
- n: '4'
  text: Mount the perfboard on the four standoffs with the ESP32 on top. Turn it so
    the ESP32's USB-C end points to the bottom of the box (the wall with the wide
    opening). Fix it with the four M2x6 self-tapping screws through the corner holes.
  parts:
  - box
  hardware:
  - perfboard
  - esp32
  - screw-pb
  tool: small Phillips screwdriver
- n: '5'
  text: Pass the four wires from the perfboard up through the slot in the lid and
    set the lid on the box. Don't pinch the wires. Fix it with four M3x8 screws in
    the counterbored corner holes, so the screw heads are flush.
  parts:
  - lid
  hardware:
  - screw-lid
  tool: 2.5 mm hex key
- n: '6'
  text: Connect the wires to the disc's input connector. The disc's wire connector
    goes at 12 o'clock, over the wire slot. Lay the disc on the lid front, then screw
    it down with two M3x6 screws through its two small holes into the lid inserts.
    Do not overtighten.
  parts:
  - lid
  hardware:
  - disc
  - screw-disc
  tool: 2.5 mm hex key
- n: '7'
  text: 'Drive two #8 screws into the wall 60 mm apart horizontally, with the heads
    standing about 8 mm off the wall. Put the screw heads into the two large round
    entries at the back of the box, then lower the box so the screw shanks slide up
    into the narrow slots. Plug your USB-C cable into the ESP32 through the opening
    in the bottom wall.'
  parts:
  - box
  hardware: []
  tool: drill and screwdriver
