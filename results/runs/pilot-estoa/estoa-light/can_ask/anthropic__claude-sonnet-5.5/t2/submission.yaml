parts:
- id: box
  role: final
  material: matte white PLA
  code: "def build(p):\n    W=p.box_w; H=p.box_h; D=p.depth; bt=p.back_t; w=p.wall\n\
    \    def cyl(x,y,z0,h,d):\n        return cq.Workplane('XY').workplane(offset=z0).center(x,y).circle(d/2).extrude(h)\n\
    \    def blk(x,y,z0,sx,sy,h):\n        return cq.Workplane('XY').workplane(offset=z0).center(x,y).rect(sx,sy).extrude(h)\n\
    \    outer = cq.Workplane('XY').box(W,H,D,centered=(True,True,False)).edges('|Z').fillet(p.corner_r)\n\
    \    cav = cq.Workplane('XY').workplane(offset=bt).rect(W-2*w,H-2*w).extrude(D).edges('|Z').fillet(p.corner_r-w)\n\
    \    body = outer.cut(cav)\n    # lid posts with insert holes\n    for sx in (-1,1):\n\
    \        for sy in (-1,1):\n            body = body.union(cyl(sx*p.post_xy, sy*p.post_xy,\
    \ bt-0.5, D-bt+0.5, p.post_d))\n    for sx in (-1,1):\n        for sy in (-1,1):\n\
    \            body = body.cut(cyl(sx*p.post_xy, sy*p.post_xy, D-p.post_hole_depth,\
    \ p.post_hole_depth+1, p.insert_hole_d))\n    # perfboard standoffs\n    hx =\
    \ p.pb_w/2 - p.pb_hole_edge - p.pb_hole_d/2\n    hy = p.pb_l/2 - p.pb_hole_edge\
    \ - p.pb_hole_d/2\n    for sx in (-1,1):\n        for sy in (-1,1):\n        \
    \    x=sx*hx; y=p.pb_cy+sy*hy\n            body = body.union(cyl(x,y,bt-0.5,p.standoff_h+0.5,p.standoff_d))\n\
    \    for sx in (-1,1):\n        for sy in (-1,1):\n            x=sx*hx; y=p.pb_cy+sy*hy\n\
    \            body = body.cut(cyl(x,y,bt+p.standoff_h-p.m2_pilot_depth,p.m2_pilot_depth+1,p.m2_pilot_d))\n\
    \    # keyholes: entry circle + narrow slot in the rear layer, wide pocket behind\
    \ it\n    entry = p.wscrew_head_d+0.8\n    slot = p.wscrew_shank_d+0.6\n    L\
    \ = p.key_len\n    for sx in (-1,1):\n        x0=sx*p.key_x; y0=p.key_y\n    \
    \    body = body.cut(cyl(x0,y0,-1,p.rear_t+1,entry))\n        body = body.cut(blk(x0,y0+L/2,-1,slot,L,p.rear_t+1))\n\
    \        pk = cyl(x0,y0,p.rear_t,p.pocket_d,entry).union(cyl(x0,y0+L,p.rear_t,p.pocket_d,entry)).union(blk(x0,y0+L/2,p.rear_t,entry,L,p.pocket_d))\n\
    \        body = body.cut(pk)\n    # USB-C opening in the bottom wall\n    port_z\
    \ = bt+p.standoff_h+p.pb_t+p.esp_port_bottom+p.esp_port_h/2\n    op = cq.Workplane('XY').box(p.usb_w,\
    \ w+2, p.usb_h).translate((0, -H/2+w/2, port_z))\n    body = body.cut(op)\n  \
    \  return body\n"
  print_orientation: back face (the wall side) flat on the bed, open side up
  use_orientation: back face against the wall, open side facing out
- id: lid
  role: final
  material: matte white PLA
  code: "def build(p):\n    W=p.box_w; H=p.box_h; T=p.lid_t\n    def cyl(x,y,z0,h,d):\n\
    \        return cq.Workplane('XY').workplane(offset=z0).center(x,y).circle(d/2).extrude(h)\n\
    \    lid = cq.Workplane('XY').box(W,H,T,centered=(True,True,False)).edges('|Z').fillet(p.corner_r)\n\
    \    for sx in (-1,1):\n        for sy in (-1,1):\n            x=sx*p.post_xy;\
    \ y=sy*p.post_xy\n            lid = lid.cut(cyl(x,y,-1,T+2,p.m3_clear_d))\n  \
    \          lid = lid.cut(cyl(x,y,T-p.cbore_depth,p.cbore_depth+1,p.cbore_d))\n\
    \    for sx in (-1,1):\n        lid = lid.cut(cyl(sx*p.disc_hole_pitch/2,0,T-p.disc_insert_depth,p.disc_insert_depth+1,p.insert_hole_d))\n\
    \    ys=(p.wire_slot_y0+p.wire_slot_y1)/2\n    sl = cq.Workplane('XY').workplane(offset=-1).center(0,ys).rect(p.wire_slot_w,p.wire_slot_y1-p.wire_slot_y0).extrude(T+2)\n\
    \    lid = lid.cut(sl)\n    return lid\n"
  print_orientation: underside flat on the bed, front face up
  use_orientation: on the rim of the box, front face out; the LED disc screws to its
    front
