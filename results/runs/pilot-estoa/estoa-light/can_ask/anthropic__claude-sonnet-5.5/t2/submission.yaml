task: estoa-light
note: 'The box is a 100 x 100 mm rounded cup with a separate lid, hidden behind the
  disc. The disc is about 241 mm across, derived from the hole-to-edge readings. The
  two M3 disc screws go into heat-set inserts in the lid, and four more M3 screws
  fix the lid to the box. The perfboard sits on four standoffs with M2 screws. Keyhole
  pockets in the back plate hang it on two #8 screws 60 mm apart. The USB-C opening
  is in the bottom wall, sized generously because the port''s position and the plug
  size are uncertain. Several values are guesses (see params and questions). I did
  not print a coupon for the opening.'
questions:
- text: Disc diameter, disc thickness and the position of the input connector couldn't
    be measured. I assumed 1.6 mm PCB thickness and made the lid wire slot wide (18
    x 36 mm at 12 o'clock). Can you check the connector lies within it?
  answer: null
- text: The USB-C port's sideways position on the perfboard and the size of your plug
    housing are uncertain. The bottom opening is 44 x 12 mm to allow for this. Does
    the plug fit?
  answer: null
- text: Is the ESP32's USB end 7.53 mm inside the perfboard edge or overhanging it?
    I assumed inside. If it overhangs, the plug will not reach the port and the perfboard
    needs moving.
  answer: null
