task: estoa-light
note: Box is 240 mm diameter, 30 mm deep, fits the 256 mm bed. Cable exit slot is
  at the bottom of the wall, at the ESP32 port. Wall screws are only the 2 keyholes
  at x=+/-60, y=45. Front and sides come later.
questions:
- text: Disc thickness at the mounting holes (1.6 mm assumed) to size the M3 screw.
    If it's thicker, the M3x6 screw may be too short.
  answer: null
- text: Does the line through the two disc holes run left-right across the disc (as
    assumed, bar along x)?
  answer: null
- text: Perfboard thickness (1.6 mm assumed) and whether the ESP32 is centred on the
    perfboard width, with its USB port at the wall-side end.
  answer: null
- text: Is the disc outer diameter 241.6 mm as calculated? If it's different, the
    box radius needs changing.
  answer: null
