parts:
- id: back
  role: final
  material: PLA matte white
  code: "def build(p):\n    Ro = p.box_r\n    Ri = Ro - p.wall_t\n    H = p.depth\n\
    \    tb = p.back_t\n    body = cq.Workplane('XY').circle(Ro).extrude(tb)\n   \
    \ body = body.union(cq.Workplane('XY').circle(Ro).circle(Ri).extrude(H))\n   \
    \ bar_h = H - p.bar_z0\n    bar = cq.Workplane('XY').box(p.bar_len, p.bar_w, bar_h,\
    \ centered=(True, True, False)).translate((0, 0, p.bar_z0))\n    post = cq.Workplane('XY').workplane(offset=tb\
    \ - 0.01).circle(p.post_r).extrude(p.bar_z0 - tb + 0.5)\n    body = body.union(bar).union(post)\n\
    \    pts = [(sx * p.pb_x, p.pb_yc + sy * p.pb_y) for sx in (-1, 1) for sy in (-1,\
    \ 1)]\n    so = cq.Workplane('XY').workplane(offset=tb - 0.01).pushPoints(pts).circle(p.standoff_r).extrude(p.standoff_h\
    \ + 0.01)\n    body = body.union(so)\n    pil = cq.Workplane('XY').workplane(offset=tb).pushPoints(pts).circle(p.pilot_d\
    \ / 2).extrude(p.standoff_h + 1)\n    body = body.cut(pil)\n    ins_pts = [(-p.disc_hole_pitch\
    \ / 2, 0), (p.disc_hole_pitch / 2, 0)]\n    ins = cq.Workplane('XY').workplane(offset=H\
    \ - p.ins_len).pushPoints(ins_pts).circle(p.ins_hole_d / 2).extrude(p.ins_len\
    \ + 1)\n    body = body.cut(ins)\n    kh_pts = [(-p.kh_x, p.kh_y), (p.kh_x, p.kh_y)]\n\
    \    kh = cq.Workplane('XY').workplane(offset=-1).pushPoints(kh_pts).circle(p.kh_head_d\
    \ / 2).extrude(tb + 2)\n    slot_pts = [(-p.kh_x, p.kh_y - p.kh_slot_len / 2),\
    \ (p.kh_x, p.kh_y - p.kh_slot_len / 2)]\n    slot = cq.Workplane('XY').workplane(offset=-1).pushPoints(slot_pts).rect(p.kh_shank_w,\
    \ p.kh_slot_len).extrude(tb + 2)\n    body = body.cut(kh).cut(slot)\n    usb =\
    \ cq.Workplane('XY').box(p.usb_w, p.wall_t + 4, p.usb_h, centered=(True, True,\
    \ False)).translate((0, -(Ro - p.wall_t / 2), p.usb_z0))\n    body = body.cut(usb)\n\
    \    return body\n"
  print_orientation: back plate on the bed (z=0 bed, +z up, away from the wall)
  use_orientation: back plate flat against the wall (z=0 wall, +z toward the disc)
