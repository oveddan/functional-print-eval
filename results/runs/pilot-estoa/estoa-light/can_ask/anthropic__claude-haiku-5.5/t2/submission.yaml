manual:
- n: '1'
  text: Print the back box in matte white, back plate on the bed. Remove supports
    and clean the bar underside.
  parts:
  - back
  hardware: []
  tool: null
- n: '2'
  text: Press or heat-set the two M3x4x5 inserts into the blind holes in the top of
    the disc-mount bar, at 16.75 mm either side of centre. They must sit flush with
    the bar top.
  parts:
  - back
  hardware:
  - insert
  tool: null
- n: '3'
  text: Mount the perfboard on the four standoffs inside the box (perfboard long side
    along the box's up-down axis, ESP32 USB port toward the bottom of the box, the
    wall-side end). Fix each corner hole with an M2x6 self-tapping screw.
  parts:
  - back
  hardware:
  - pb_screw
  - perfboard
  - esp32
  tool: null
- n: '4'
  text: Wire the four perfboard wires to the disc's input connector. Route the wires
    down the centre post side, clear of the bar.
  parts:
  - back
  hardware:
  - disc
  tool: null
- n: '5'
  text: Set the disc on the rim and bar with its LED side out. Pass each M3x6 screw
    through a disc hole from the LED side and tighten into its insert.
  parts:
  - back
  hardware:
  - disc_screw
  - disc
  tool: null
- n: '6'
  text: 'Hang the box on the two wall screws (your own #8 screws, not in the hardware
    list). Put them in the wall 120 mm apart, heads about 5 mm proud, then slide the
    keyhole slots over them and let the box drop into the narrow part.'
  parts:
  - back
  hardware: []
  tool: null
- n: '7'
  text: Plug the USB-C charger into the ESP32 through the port slot at the bottom
    of the wall.
  parts:
  - back
  hardware:
  - esp32
  tool: null
