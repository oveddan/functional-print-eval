parts:
- id: back_box
  role: final
  material: PLA (matte white)
  code: "import cadquery as cq\n\ndef build(p):\n    R = p.disc_diameter/2.0\n   \
    \ flange = p.front_flange_w\n    wt = p.wall_thickness\n    depth = p.box_depth\n\
    \n    # Main cylindrical body (back box), open at the front\n    outer = (cq.Workplane(\"\
    XY\")\n             .circle(R)\n             .extrude(depth))\n\n    # Hollow\
    \ it out from the front, leaving wall thickness + an annular front flange\n  \
    \  inner_R = R - wt\n    hollow = (cq.Workplane(\"XY\")\n              .circle(inner_R)\n\
    \              .extrude(depth))\n\n    body = outer.cut(hollow)\n\n    # Close\
    \ the back (a back plate): actually body already has a back; front is open\n \
    \   # The front flange is the open rim the disc screws onto; disc sits on the\
    \ rim.\n    # Add the annular front flange protruding inward for the disc to sit\
    \ on?\n    # The disc itself is ~240mm, nearly fills R. We just need screw bosses\
    \ to receive disc screws.\n\n    return body\n"
  print_orientation: back face (flat closed side) on the bed, +z = depth direction
  use_orientation: open front faces +z (towards the disc); back face against wall
