parts:
- id: box
  role: final
  material: PLA (matte white)
  code: "import cadquery as cq\n\ndef build(p):\n    R = p.disk_radius + p.wall\n\
    \    base = cq.Workplane('XY').circle(R).extrude(p.box_depth)\n    # hollow the\
    \ box: open front (z=box_depth), solid back (z=0)\n    inner_R = p.disk_radius\n\
    \    box = base.cut(cq.Workplane('XY').circle(inner_R).translate((0,0,p.wall)).extrude(p.box_depth\
    \ - p.wall))\n    # front rim to seat the disk: recess at z = box_depth - wall\n\
    \    # disk sits flush; a lip holds it\n    return box\n"
  print_orientation: back face (z=0) on the bed, opening facing up
  use_orientation: back against wall, +z opening toward viewer
