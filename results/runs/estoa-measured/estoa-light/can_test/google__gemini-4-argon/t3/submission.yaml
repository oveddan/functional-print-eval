task: estoa-light
note: 'Single-piece 242 mm matte-white wall box printed flat on its back face without
  supports. Includes central M3 heat-set insert bosses at 33.5 mm pitch for the DotStar
  255-LED disk, four M2 standoffs for the 50x70 mm perfboard, a 30x13 mm bottom portal
  giving full clearance for the 11.58x6.44 mm USB-C charger plug head to reach the
  recessed ESP32 port, and two recessed keyhole slots spaced 120 mm apart for #8 round-head
  wall screws.'
