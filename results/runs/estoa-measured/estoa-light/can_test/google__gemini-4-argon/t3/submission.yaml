manual:
- n: '1'
  text: Using a soldering iron, press the two M3x4x5 heat-set inserts flush into the
    4.3 mm holes in the top of the two central mounting bosses on led_wall_box.
  parts:
  - led_wall_box
  hardware:
  - m3_insert
  tool: soldering iron
- n: '2'
  text: Place the perfboard (with the ESP32 plugged into its headers and its USB-C
    port facing the bottom window at 6 o'clock) onto the four internal standoffs in
    the lower half of led_wall_box, and fasten the four corners with the four M2x6
    self-tapping screws.
  parts:
  - led_wall_box
  hardware:
  - perfboard
  - esp32
  - m2_screw
  tool: Phillips screwdriver
- n: '3'
  text: 'Install the two #8 round-head wall screws into your wall anchors on a horizontal
    line 120.0 mm apart, leaving the undersides of the screw heads about 3.5 mm out
    from the wall. Hang led_wall_box over the two screw heads through the 10.5 mm
    keyhole openings and slide it down so the shafts seat in the 5.0 mm slots and
    the back of the box sits flat against the wall.'
  parts:
  - led_wall_box
  hardware: []
  tool: level and screwdriver
- n: '4'
  text: Connect the four wires from the perfboard to the LED disk's 4-pin input at
    12 o'clock, align the LED disk's two centre mounting holes (at 3 o'clock and 9
    o'clock) with the two central bosses on led_wall_box, and secure the disk to the
    front of the box with the two ISO 4762 M3x8 socket head screws. Plug the USB-C
    charger cable straight through the bottom window into the ESP32's USB-C port.
  parts:
  - led_wall_box
  hardware:
  - led_disk
  - m3_screw
  tool: 2.5 mm hex key
assembly:
  parts:
  - origin:
