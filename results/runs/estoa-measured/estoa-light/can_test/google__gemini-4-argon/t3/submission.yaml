parts:
- id: led_wall_box
  role: final
  material: PLA
  code: "def build(p):\n    r_out = p.led_disk_d / 2.0\n    r_in = r_out - p.wall_t\n\
    \n    # 1. Outer cylindrical tub with flat back wall at z = 0\n    box = (\n \
    \       cq.Workplane(\"XY\")\n        .circle(r_out)\n        .extrude(p.box_depth)\n\
    \        .faces(\">Z\")\n        .workplane()\n        .circle(r_in)\n       \
    \ .cutBlind(-(p.box_depth - p.back_wall_t))\n    )\n\n    # 2. Central mounting\
    \ bridge and twin bosses for the LED disk's two centre M3 holes\n    boss_dx =\
    \ p.led_disk_hole_pitch / 2.0\n    center_web = (\n        cq.Workplane(\"XY\"\
    )\n        .rect(p.led_disk_hole_pitch, 6.0)\n        .extrude(p.box_depth)\n\
    \    )\n    center_bosses = (\n        cq.Workplane(\"XY\")\n        .pushPoints([(-boss_dx,\
    \ 0.0), (boss_dx, 0.0)])\n        .circle(p.center_boss_od / 2.0)\n        .extrude(p.box_depth)\n\
    \    )\n    # Horizontal stiffening rib connecting the central bosses to the outer\
    \ wall\n    horiz_rib = (\n        cq.Workplane(\"XY\")\n        .rect(p.led_disk_d\
    \ - p.wall_t, 3.2)\n        .extrude(20.0)\n    )\n    box = box.union(center_web).union(center_bosses).union(horiz_rib)\n\
    \n    # 3. Four internal perimeter pilasters (flush with z = box_depth) to back\
    \ the LED disk edge\n    for angle_deg in [35.0, 145.0, 215.0, 325.0]:\n     \
    \   pilaster = (\n            cq.Workplane(\"XY\")\n            .transformed(rotate=(0.0,\
    \ 0.0, angle_deg))\n            .center(r_in - 2.0, 0.0)\n            .rect(6.0,\
    \ 12.0)\n            .extrude(p.box_depth)\n        )\n        box = box.union(pilaster)\n\
    \n    # 4. Protective collars around the two wall keyhole slots on the inside\
    \ floor\n    kh_dx = p.wall_screw_pitch / 2.0\n    for sx in [-kh_dx, kh_dx]:\n\
    \        collar = (\n            cq.Workplane(\"XY\")\n            .center(sx,\
    \ p.wall_screw_y + p.wall_keyhole_slot_l / 2.0)\n            .slot2D(p.wall_keyhole_slot_l\
    \ + p.wall_keyhole_entry_d + 6.0, p.wall_keyhole_entry_d + 6.0, 90.0)\n      \
    \      .extrude(p.back_wall_t + 5.0)\n        )\n        collar_cavity = (\n \
    \           cq.Workplane(\"XY\")\n            .workplane(offset=p.back_wall_t)\n\
    \            .center(sx, p.wall_screw_y + p.wall_keyhole_slot_l / 2.0)\n     \
    \       .slot2D(p.wall_keyhole_slot_l + p.wall_keyhole_entry_d + 0.6, p.wall_keyhole_entry_d\
    \ + 0.6, 90.0)\n            .extrude(p.box_depth)\n        )\n        box = box.union(collar).cut(collar_cavity)\n\
    \n    # 5. Cut the two keyhole slots through the back wall (z = 0 to back_wall_t)\n\
    \    kh_entries = (\n        cq.Workplane(\"XY\")\n        .pushPoints([(-kh_dx,\
    \ p.wall_screw_y), (kh_dx, p.wall_screw_y)])\n        .circle(p.wall_keyhole_entry_d\
    \ / 2.0)\n        .extrude(p.back_wall_t)\n    )\n    box = box.cut(kh_entries)\n\
    \    for sx in [-kh_dx, kh_dx]:\n        kh_slot = (\n            cq.Workplane(\"\
    XY\")\n            .center(sx, p.wall_screw_y + p.wall_keyhole_slot_l / 2.0)\n\
    \            .slot2D(p.wall_keyhole_slot_l + p.wall_keyhole_slot_w, p.wall_keyhole_slot_w,\
    \ 90.0)\n            .extrude(p.back_wall_t)\n        )\n        box = box.cut(kh_slot)\n\
    \n    # 6. Four standoffs for the 50 x 70 mm perfboard\n    pb_dx = p.perfboard_hole_pitch_x\
    \ / 2.0\n    pb_dy = p.perfboard_hole_pitch_y / 2.0\n    pb_pts = [\n        (p.perfboard_x\
    \ - pb_dx, p.perfboard_y - pb_dy),\n        (p.perfboard_x + pb_dx, p.perfboard_y\
    \ - pb_dy),\n        (p.perfboard_x - pb_dx, p.perfboard_y + pb_dy),\n       \
    \ (p.perfboard_x + pb_dx, p.perfboard_y + pb_dy),\n    ]\n    standoff_top_z =\
    \ p.back_wall_t + p.standoff_h\n    standoffs = (\n        cq.Workplane(\"XY\"\
    )\n        .pushPoints(pb_pts)\n        .circle(p.standoff_od / 2.0)\n       \
    \ .extrude(standoff_top_z)\n    )\n    box = box.union(standoffs)\n\n    pilot_holes\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=standoff_top_z\
    \ - (p.m2_screw_len - p.perfboard_t + 1.2))\n        .pushPoints(pb_pts)\n   \
    \     .circle(p.m2_pilot_d / 2.0)\n        .extrude(p.m2_screw_len + 2.0)\n  \
    \  )\n    box = box.cut(pilot_holes)\n\n    # 7. Two M3x4x5 heat-set insert holes\
    \ in the top of the central bosses\n    insert_hole_depth = p.insert_m3_len +\
    \ 5.0\n    insert_holes = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.box_depth\
    \ - insert_hole_depth)\n        .pushPoints([(-boss_dx, 0.0), (boss_dx, 0.0)])\n\
    \        .circle(p.insert_m3_hole_d / 2.0)\n        .extrude(insert_hole_depth\
    \ + 1.0)\n    )\n    box = box.cut(insert_holes)\n\n    # 8. USB-C charger access\
    \ window at 6 o'clock (bottom wall, bridged cleanly under 4 mm top rim)\n    usb_cut_h\
    \ = p.usb_cutout_z_max - p.usb_cutout_z_min\n    usb_window = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.usb_cutout_z_min)\n        .center(0.0, -r_out)\n\
    \        .rect(p.usb_cutout_w, 50.0)\n        .extrude(usb_cut_h)\n    )\n   \
    \ box = box.cut(usb_window)\n\n    return box\n"
  print_orientation: Back face (z = 0) flat on the print bed, with the open front
    and central mounting bosses facing up (+z); prints in one piece with zero supports
    and a 30 mm top rim bridge over the USB-C window.
  use_orientation: 'Back face (z = 0) flat against the wall on two #8 screws at 120
    mm horizontal spacing; USB-C access window at the bottom (6 o''clock, -y) and
    LED disk screwed onto the front face (z = 34 mm).'
