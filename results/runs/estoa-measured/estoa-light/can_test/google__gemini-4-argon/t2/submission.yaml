manual:
- n: '1'
  text: Slide the two ISO 4032 M3 hex nuts into the side-entry slots near the tops
    of the two central mounting pillars inside the box.
  parts:
  - box
  hardware:
  - led_nut
  tool: null
- n: '2'
  text: Set the perfboard (with the ESP32 plugged into its headers and its USB-C port
    facing the bottom window) onto the four lower standoffs, and fasten the four corners
    with the four M2 x 6 self-tapping screws.
  parts:
  - box
  hardware:
  - perfboard
  - esp32
  - perfboard_screw
  tool: Phillips or small screwdriver
- n: '3'
  text: 'Install two #8 round-head wall screws level with each other and 130 mm apart
    on the wall, leaving the underside of the screw heads about 3.5 mm off the wall.
    Hang the box on the two keyhole slots so the back sits flat against the wall (you
    can also tighten the wall screws directly through the open front before attaching
    the LED disk).'
  parts:
  - box
  hardware: []
  tool: Screwdriver and level
- n: '4'
  text: Connect the four wires between the perfboard and the LED disk, align the LED
    disk on the front rim with its input wires at 12 o'clock and its two central holes
    over the two pillars at 3 and 9 o'clock, and secure it with the two ISO 4762 M3x12
    socket head screws. Plug the USB-C charger cable straight up through the bottom
    access window into the ESP32.
  parts:
  - box
  hardware:
  - led_disk
  - led_screw
  tool: 2.5 mm hex key
