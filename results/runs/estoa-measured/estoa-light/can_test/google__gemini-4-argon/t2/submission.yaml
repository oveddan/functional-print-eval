parts:
- id: box
  role: final
  material: PLA
  code: "def build(p):\n    r_out = p.led_disk_d / 2.0\n    r_in = r_out - p.wall_t\n\
    \    hole_x = (p.led_disk_hole_inner_span + p.led_disk_hole_d) / 2.0\n\n    pf_hx\
    \ = p.perfboard_w / 2.0 - p.perfboard_hole_edge_inset - p.perfboard_hole_d / 2.0\n\
    \    pf_hy = p.perfboard_l / 2.0 - p.perfboard_hole_edge_inset - p.perfboard_hole_d\
    \ / 2.0\n    pf_cy = p.perfboard_center_y\n    standoff_top_z = p.back_t + p.standoff_h\n\
    \n    usb_x = p.perfboard_w / 2.0 - p.esp32_edge_to_perfboard_edge - p.esp32_usb_to_board_edge\
    \ - p.esp32_usb_w / 2.0\n    usb_z = standoff_top_z + p.perfboard_t + p.esp32_usb_bottom_above_pf\
    \ + p.esp32_usb_h / 2.0\n\n    # 1. Outer cylindrical shell and flat back wall\n\
    \    part = (\n        cq.Workplane(\"XY\")\n        .circle(r_out)\n        .extrude(p.box_depth)\n\
    \        .faces(\">Z\")\n        .workplane()\n        .circle(r_in)\n       \
    \ .cutBlind(-(p.box_depth - p.back_t))\n    )\n\n    # 2. Central M3 mounting\
    \ pillars and connecting web\n    pillars = (\n        cq.Workplane(\"XY\")\n\
    \        .pushPoints([(-hole_x, 0.0), (hole_x, 0.0)])\n        .circle(p.pillar_od\
    \ / 2.0)\n        .extrude(p.box_depth)\n    )\n    web = (\n        cq.Workplane(\"\
    XY\")\n        .box(2.0 * hole_x, 5.0, p.box_depth - 12.0, centered=(True, True,\
    \ False))\n    )\n    part = part.union(pillars).union(web)\n\n    # M3 clearance\
    \ holes in top of central pillars\n    part = (\n        part.faces(\">Z\")\n\
    \        .workplane()\n        .pushPoints([(-hole_x, 0.0), (hole_x, 0.0)])\n\
    \        .circle(p.m3_clearance_d / 2.0)\n        .cutBlind(-14.0)\n    )\n\n\
    \    # Side-entry M3 hex nut pockets in central pillars\n    nut_w = p.m3_nut_af\
    \ + p.nut_clearance\n    nut_h = p.m3_nut_h + p.nut_h_clearance\n    nut_z = p.box_depth\
    \ - p.nut_depth_from_top - nut_h\n    slot_len = p.pillar_od / 2.0 + p.m3_nut_af\
    \ / 2.0 + 1.0\n    left_nut_cut = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=nut_z)\n\
    \        .center(-hole_x - (p.pillar_od / 2.0 - slot_len / 2.0), 0.0)\n      \
    \  .box(slot_len, nut_w, nut_h, centered=(True, True, False))\n    )\n    right_nut_cut\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=nut_z)\n      \
    \  .center(hole_x + (p.pillar_od / 2.0 - slot_len / 2.0), 0.0)\n        .box(slot_len,\
    \ nut_w, nut_h, centered=(True, True, False))\n    )\n    part = part.cut(left_nut_cut).cut(right_nut_cut)\n\
    \n    # 3. Four perfboard standoffs and M2 pilot holes\n    standoff_pts = [\n\
    \        (-pf_hx, pf_cy - pf_hy),\n        (pf_hx, pf_cy - pf_hy),\n        (-pf_hx,\
    \ pf_cy + pf_hy),\n        (pf_hx, pf_cy + pf_hy),\n    ]\n    standoffs = (\n\
    \        cq.Workplane(\"XY\")\n        .pushPoints(standoff_pts)\n        .circle(p.standoff_od\
    \ / 2.0)\n        .extrude(standoff_top_z)\n    )\n    part = part.union(standoffs)\n\
    \n    pilot_cuts = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=standoff_top_z\
    \ - p.m2_screw_l)\n        .pushPoints(standoff_pts)\n        .circle(p.m2_pilot_d\
    \ / 2.0)\n        .extrude(p.m2_screw_l + 1.0)\n    )\n    part = part.cut(pilot_cuts)\n\
    \n    # 4. Two reinforced wall-mounting keyhole bosses and slots\n    kh_entry_d\
    \ = p.wall_screw_head_d + 1.6\n    boss_w = kh_entry_d + 7.4\n    for sx in (-1.0,\
    \ 1.0):\n        kx = sx * p.wall_mount_x\n        ky = p.wall_mount_y\n     \
    \   kh_boss = (\n            cq.Workplane(\"XY\")\n            .pushPoints([(kx,\
    \ ky), (kx, ky + p.keyhole_travel)])\n            .circle(boss_w / 2.0)\n    \
    \        .extrude(p.keyhole_boss_h)\n            .union(\n                cq.Workplane(\"\
    XY\")\n                .center(kx, ky + p.keyhole_travel / 2.0)\n            \
    \    .box(boss_w, p.keyhole_travel, p.keyhole_boss_h, centered=(True, True, False))\n\
    \            )\n        )\n        part = part.union(kh_boss)\n\n        # Entry\
    \ hole all the way through boss\n        entry_cut = (\n            cq.Workplane(\"\
    XY\")\n            .center(kx, ky)\n            .circle(kh_entry_d / 2.0)\n  \
    \          .extrude(p.keyhole_boss_h + 1.0)\n        )\n        # Narrow shaft\
    \ slot through the back wall (z = 0 to back_t)\n        shaft_slot = (\n     \
    \       cq.Workplane(\"XY\")\n            .center(kx, ky + p.keyhole_travel /\
    \ 2.0)\n            .box(p.wall_screw_shaft_slot_w, p.keyhole_travel, p.back_t\
    \ + 0.1, centered=(True, True, False))\n            .union(\n                cq.Workplane(\"\
    XY\")\n                .center(kx, ky + p.keyhole_travel)\n                .circle(p.wall_screw_shaft_slot_w\
    \ / 2.0)\n                .extrude(p.back_t + 0.1)\n            )\n        )\n\
    \        # Internal counterbore slot for screw head above back_t\n        head_cbore\
    \ = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=p.back_t)\n\
    \            .center(kx, ky + p.keyhole_travel / 2.0)\n            .box(kh_entry_d,\
    \ p.keyhole_travel, p.keyhole_boss_h, centered=(True, True, False))\n        \
    \    .union(\n                cq.Workplane(\"XY\")\n                .workplane(offset=p.back_t)\n\
    \                .center(kx, ky + p.keyhole_travel)\n                .circle(kh_entry_d\
    \ / 2.0)\n                .extrude(p.keyhole_boss_h)\n            )\n        )\n\
    \        part = part.cut(entry_cut).cut(shaft_slot).cut(head_cbore)\n\n    # 5.\
    \ Bottom USB-C charger access window through the lower wall\n    usb_cut = (\n\
    \        cq.Workplane(\"XY\")\n        .workplane(offset=usb_z - p.usb_window_h\
    \ / 2.0)\n        .center(usb_x, -r_out)\n        .box(p.usb_window_w, 40.0, p.usb_window_h,\
    \ centered=(True, True, False))\n    )\n    part = part.cut(usb_cut)\n\n    return\
    \ part\n"
  print_orientation: Back wall face down on the build plate (z = 0 on the bed); prints
    in one piece with no supports and a 36 mm top bridge over the USB-C window.
  use_orientation: Back wall (z = 0) flat against the room wall, +z out towards the
    LED disk, +y pointing up (12 o'clock) with the USB-C window at the bottom (6 o'clock).
