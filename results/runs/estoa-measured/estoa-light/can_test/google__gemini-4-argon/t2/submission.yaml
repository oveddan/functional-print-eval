task: estoa-light
note: 242 mm diameter wall-mount enclosure box for the Adafruit 255-LED DotStar disk,
  housing the 50 x 70 mm perfboard and ESP32-S3 with bottom USB-C charger access and
  recessed wall-screw keyholes. Prints flat on the bed in a single piece without supports.
