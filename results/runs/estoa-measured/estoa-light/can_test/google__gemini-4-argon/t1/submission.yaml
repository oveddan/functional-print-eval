task: estoa-light
note: The round wall box is 242 mm in outer diameter and 32 mm deep, printing flat
  on its back face without supports on the Bambu Lab X1C. The LED disk rests on the
  front rim and bolts to two central heat-set insert towers (spaced 33.5 mm apart
  at 3 and 9 o'clock) whose spider arms are recessed 6 mm behind the disk to clear
  rear solder joints and wires. The perfboard mounts on four standoffs in the lower
  half so the ESP32's USB-C port sits just inside the 6 o'clock bottom access window,
  allowing the USB-C charger plug to plug straight in from below while the box sits
  flush against the wall.
