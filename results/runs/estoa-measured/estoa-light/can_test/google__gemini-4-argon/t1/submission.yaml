parts:
- id: wall_box
  role: final
  material: PLA (matte white)
  code: "def build(p):\n    outer_r = p.disk_d / 2.0\n    inner_r = outer_r - p.wall_t\n\
    \    boss_x = p.disk_hole_pitch / 2.0\n    pb_hx = p.pb_w / 2.0 - p.pb_hole_edge\
    \ - p.pb_hole_d / 2.0\n    pb_hy = p.pb_l / 2.0 - p.pb_hole_edge - p.pb_hole_d\
    \ / 2.0\n\n    # 1. Base cylindrical shell (back plate + perimeter wall)\n   \
    \ part = (\n        cq.Workplane(\"XY\")\n        .circle(outer_r)\n        .extrude(p.box_h)\n\
    \        .faces(\">Z\")\n        .workplane()\n        .circle(inner_r)\n    \
    \    .cutBlind(-(p.box_h - p.back_t))\n    )\n\n    # 2. Stiffening spider ribs\
    \ & central bridge (recessed below the LED disk back face)\n    rib_h = p.box_h\
    \ - p.back_t - p.spider_recess\n    horiz_rib = (\n        cq.Workplane(\"XY\"\
    )\n        .workplane(offset=p.back_t)\n        .rect(inner_r * 2.0 + 2.0, p.spider_w)\n\
    \        .extrude(rib_h)\n    )\n    top_rib = (\n        cq.Workplane(\"XY\"\
    )\n        .workplane(offset=p.back_t)\n        .center(0.0, inner_r / 2.0)\n\
    \        .rect(p.spider_w, inner_r + 2.0)\n        .extrude(rib_h)\n    )\n  \
    \  part = part.union(horiz_rib).union(top_rib)\n\n    # 3. Two central LED disk\
    \ mounting towers at 3 o'clock and 9 o'clock\n    for sx in (-1.0, 1.0):\n   \
    \     tower = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=p.back_t)\n\
    \            .center(sx * boss_x, 0.0)\n            .circle(p.disk_boss_d / 2.0)\n\
    \            .extrude(p.box_h - p.back_t)\n        )\n        part = part.union(tower)\n\
    \n    # Cut heat-set insert pockets into the tops of the two LED disk towers\n\
    \    part = (\n        part.faces(\">Z\")\n        .workplane()\n        .pushPoints([(-boss_x,\
    \ 0.0), (boss_x, 0.0)])\n        .hole(p.insert_hole_d, p.insert_l + 3.0)\n  \
    \  )\n\n    # 4. Four perfboard standoffs in the lower half of the box\n    pb_pts\
    \ = [\n        (-pb_hx, p.pb_center_y - pb_hy),\n        (pb_hx, p.pb_center_y\
    \ - pb_hy),\n        (-pb_hx, p.pb_center_y + pb_hy),\n        (pb_hx, p.pb_center_y\
    \ + pb_hy),\n    ]\n    standoffs = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.back_t)\n\
    \        .pushPoints(pb_pts)\n        .circle(p.pb_standoff_d / 2.0)\n       \
    \ .extrude(p.pb_standoff_h)\n    )\n    part = part.union(standoffs)\n\n    for\
    \ px, py in pb_pts:\n        pilot = (\n            cq.Workplane(\"XY\")\n   \
    \         .workplane(offset=p.back_t + p.pb_standoff_h)\n            .center(px,\
    \ py)\n            .circle(p.m2_pilot_d / 2.0)\n            .extrude(-(p.pb_standoff_h\
    \ + 4.5))\n        )\n        part = part.cut(pilot)\n\n    # 5. Bottom USB-C\
    \ plug access tunnel and rear vertical cable exit groove\n    # Opens the bottom\
    \ wall from z = 12 mm to z = 32 mm so the front rim stays continuous only if bridged,\n\
    \    # or open to z = 32 mm as a clean U-notch at 6 o'clock (requires zero bridging\
    \ and allows easy plug insertion).\n    usb_z_min = p.back_t + p.pb_standoff_h\
    \ + p.pb_t + 2.0\n    usb_cut = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=usb_z_min)\n\
    \        .center(0.0, -outer_r + 35.0)\n        .rect(p.usb_slot_w, 80.0)\n  \
    \      .extrude(p.box_h - usb_z_min + 1.0)\n    )\n    part = part.cut(usb_cut)\n\
    \n    # Rear cable exit channel on the wall side (z = 0 to 4.0 mm) at 6 o'clock\
    \ so the cord exits flush against the wall\n    cable_channel = (\n        cq.Workplane(\"\
    XY\")\n        .center(0.0, -outer_r + 25.0)\n        .rect(16.0, 60.0)\n    \
    \    .extrude(4.0)\n    )\n    part = part.cut(cable_channel)\n\n    # 6. Two\
    \ print-friendly keyhole mounts on the back face (z = 0)\n    # Placed at Y =\
    \ +40 mm, X = +/- 60 mm (120 mm spacing).\n    # Internal ceiling of head pocket\
    \ has a 45-degree chamfer along Y so there is no flat unsupported roof.\n    kh_y\
    \ = 40.0\n    kh_x = p.wall_screw_spacing / 2.0\n    entry_r = (p.wall_screw_head_d\
    \ + 2.0) / 2.0  # 5.5 mm radius (11 mm dia)\n    slot_r = (p.wall_screw_shaft_d\
    \ + 1.0) / 2.0  # 2.6 mm radius (5.2 mm width)\n    slot_len = 12.0\n    pocket_z1\
    \ = 2.5  # clamping web thickness behind screw head (fits 3.5 mm screw standoff\
    \ with 1 mm head clearance)\n    pocket_z2 = p.back_t + 6.0  # opens into the\
    \ box interior so there is zero unsupported horizontal ceiling!\n\n    for sx\
    \ in (-1.0, 1.0):\n        kx = sx * kh_x\n        # Entry hole from z = 0 up\
    \ into interior\n        entry_cyl = (\n            cq.Workplane(\"XY\")\n   \
    \         .center(kx, kh_y)\n            .circle(entry_r)\n            .extrude(pocket_z2)\n\
    \        )\n        # Narrow shaft slot from z = 0 up into interior (extending\
    \ to kh_y + slot_len)\n        shaft_slot = (\n            cq.Workplane(\"XY\"\
    )\n            .center(kx, kh_y + slot_len / 2.0)\n            .rect(slot_r *\
    \ 2.0, slot_len)\n            .extrude(pocket_z2)\n            .union(\n     \
    \           cq.Workplane(\"XY\")\n                .center(kx, kh_y + slot_len)\n\
    \                .circle(slot_r)\n                .extrude(pocket_z2)\n      \
    \      )\n        )\n        # Wide head clearance pocket from z = pocket_z1 up\
    \ into the box interior (zero overhang!)\n        head_pocket = (\n          \
    \  cq.Workplane(\"XY\")\n            .workplane(offset=pocket_z1)\n          \
    \  .center(kx, kh_y + slot_len / 2.0)\n            .rect(entry_r * 2.0, slot_len)\n\
    \            .extrude(pocket_z2 - pocket_z1)\n            .union(\n          \
    \      cq.Workplane(\"XY\")\n                .workplane(offset=pocket_z1)\n  \
    \              .center(kx, kh_y + slot_len)\n                .circle(entry_r)\n\
    \                .extrude(pocket_z2 - pocket_z1)\n            )\n        )\n \
    \       # Protective collar wall inside the box around the keyhole opening so\
    \ wires stay clear of the screw heads\n        collar = (\n            cq.Workplane(\"\
    XY\")\n            .workplane(offset=p.back_t)\n            .center(kx, kh_y +\
    \ slot_len / 2.0)\n            .rect(entry_r * 2.0 + 5.0, slot_len + entry_r *\
    \ 2.0 + 5.0)\n            .extrude(3.0)\n        )\n        part = part.union(collar).cut(entry_cyl).cut(shaft_slot).cut(head_pocket)\n\
    \n    return part\n"
  print_orientation: Back wall face flat on the build plate (z = 0 on the bed, +z
    pointing up towards the LED disk seat)
  use_orientation: Back face (z = 0) flat against the wall; +z pointing away from
    the wall; +y pointing straight up (12 o'clock)
- id: perfboard_usb_coupon
  role: coupon
  material: PLA (matte white)
  code: "def build(p):\n    pb_hx = p.pb_w / 2.0 - p.pb_hole_edge - p.pb_hole_d /\
    \ 2.0\n    pb_hy = p.pb_l / 2.0 - p.pb_hole_edge - p.pb_hole_d / 2.0\n    base_t\
    \ = 3.0\n\n    # Small test plate holding the 4 perfboard standoffs and the bottom\
    \ wall segment with the USB-C notch\n    plate = (\n        cq.Workplane(\"XY\"\
    )\n        .center(0.0, p.pb_center_y - 4.0)\n        .rect(p.pb_w + 10.0, p.pb_l\
    \ + 20.0)\n        .extrude(base_t)\n    )\n\n    pb_pts = [\n        (-pb_hx,\
    \ p.pb_center_y - pb_hy),\n        (pb_hx, p.pb_center_y - pb_hy),\n        (-pb_hx,\
    \ p.pb_center_y + pb_hy),\n        (pb_hx, p.pb_center_y + pb_hy),\n    ]\n  \
    \  standoffs = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=base_t)\n\
    \        .pushPoints(pb_pts)\n        .circle(p.pb_standoff_d / 2.0)\n       \
    \ .extrude(p.pb_standoff_h)\n    )\n    part = plate.union(standoffs)\n\n    for\
    \ px, py in pb_pts:\n        pilot = (\n            cq.Workplane(\"XY\")\n   \
    \         .workplane(offset=base_t + p.pb_standoff_h)\n            .center(px,\
    \ py)\n            .circle(p.m2_pilot_d / 2.0)\n            .extrude(-(p.pb_standoff_h\
    \ + 2.5))\n        )\n        part = part.cut(pilot)\n\n    return part\n"
  print_orientation: Flat on the build plate (z = 0 on bed)
  use_orientation: Test fit for the perfboard corner holes and M2x6 self-tapping screws
