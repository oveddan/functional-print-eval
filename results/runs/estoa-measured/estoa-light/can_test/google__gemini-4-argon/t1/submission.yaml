criteria:
- id: disk_mount_fit
  part: wall_box
  feature: front_rim_and_disk_bosses
  relation: supports
  hardware: led_disk
  clearance_mm: 0.0
  params:
  - disk_d
  - disk_hole_pitch
  - disk_hole_d
  - insert_hole_d
  check:
    method: measure
    ref: own:led-disk
    description: Check that the two central M3 mounting holes of the LED disk align
      with the heat-set insert bosses and the outer rim supports the 242 mm disk.
- id: perfboard_mount_fit
  part: wall_box
  feature: perfboard_standoffs
  relation: supports
  hardware: perfboard
  clearance_mm: 0.0
  params:
  - pb_w
  - pb_l
  - pb_hole_d
  - pb_hole_edge
  - m2_pilot_d
  check:
    method: coupon
    ref: perfboard_usb_coupon
    description: Verify that the 50 x 70 mm perfboard corner holes align with the
      four M2 self-tapping standoffs.
- id: usb_plug_access
  part: wall_box
  feature: usb_access_opening
  relation: clears
  hardware: esp32
  clearance_mm: 2.0
  params:
  - esp_usb_x_offset
  - esp_usb_z_above_pb
  - esp_usb_h
  - esp_usb_w
  - plug_w
  - plug_t
  - plug_metal_l
  check:
    method: coupon
    ref: perfboard_usb_coupon
    description: Verify that the USB-C charger plug reaches through the bottom access
      tunnel and seats fully into the ESP32 USB-C receptacle.
- id: wall_keyhole_fit
  part: wall_box
  feature: wall_keyholes
  relation: engages
  hardware: null
  clearance_mm: 0.5
  params:
  - wall_screw_head_d
  - wall_screw_shaft_d
  - wall_screw_standoff
  - wall_screw_spacing
  check:
    method: measure
    ref: null
    description: 'Check that the #8 wall screw heads pass into the keyhole entry and
      slide into the countersunk slot with 3.5 mm standoff.'
manual:
- n: '1'
  text: Use a soldering iron to press the two M3x4x5 heat-set threaded inserts flush
    into the top of the two central mounting towers on the wall_box.
  parts:
  - wall_box
  hardware:
  - disk_inserts
  tool: soldering iron
- n: '2'
  text: Place the perfboard (with the ESP32 plugged into its headers and its USB-C
    port facing down towards the bottom notch at 6 o'clock) onto the four lower standoffs
    inside the wall_box. Secure the corners using the four M2x6 self-tapping screws.
  parts:
  - wall_box
  hardware:
  - perfboard
  - esp32
  - perfboard_screws
  tool: Phillips screwdriver
- n: '3'
  text: Connect the 4-pin input wires from the perfboard to the back of the LED disk
    (oriented with the input wires at 12 o'clock). Seat the back of the LED disk flat
    against the outer rim and central towers of the wall_box, aligning the two centre
    holes at 3 and 9 o'clock, and fasten with two ISO 4762 M3x8 socket head cap screws.
  parts:
  - wall_box
  hardware:
  - led_disk
  - disk_screws
  tool: 2.5 mm hex key
- n: '4'
  text: 'Install your two #8 wall screws into wall anchors horizontally level and
    spaced 120.0 mm apart, leaving the undersides of the screw heads 3.5 mm out from
    the wall. Plug the USB-C charger cable upwards through the bottom opening into
    the ESP32, route the cord down the rear vertical channel, and hang the box flat
    on the two wall screws via the rear keyhole slots.'
