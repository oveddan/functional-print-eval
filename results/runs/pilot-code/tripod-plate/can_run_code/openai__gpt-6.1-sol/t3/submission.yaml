task: tripod-plate
note: 'INCOMPLETE MOUNT: bolt-fit coupon only, NOT a camera-supporting quick-release
  plate. A flat plate can sometimes be printed for temporary light-duty use, but its
  retaining geometry must match the actual tripod. Do not print a load-bearing camera
  screw in PLA. Use the existing metal webcam bolt only after verifying thread, engagement
  and socket depth. Repeated measurement requests returned clamp style rather than
  dimensions, so no mating geometry or load rating is claimed. Buy the head-specific
  replacement plate if those dimensions cannot be obtained.'
questions:
- text: Clamp style?
  answer: Drop-in jaws with angled lips, tightened by a knob.
- text: Camera socket thread?
  answer: Reported as 1/4-20.
- text: Bottom and top jaw gaps, lip height, channel length, adjustment range and
    end-stop geometry?
  answer: null
- text: Camera model, mass, socket usable depth and flat seating footprint?
  answer: null
- text: Webcam bolt dimensions?
  answer: Approximately 15 mm across the head, 5 mm head height, 10 mm length under
    head. Thread compatibility still requires checking.
