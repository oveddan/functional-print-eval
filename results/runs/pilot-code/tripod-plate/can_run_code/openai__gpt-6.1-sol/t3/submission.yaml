parts:
- id: bolt_fit_coupon
  role: coupon
  material: Black high-speed PLA
  code: "def build(p):\n    s = cq.Workplane('XY').box(p.coupon_w, p.coupon_l, p.coupon_t,\
    \ centered=(True, True, False))\n    for y, d in [(-p.hole_offset, p.bolt_thread_d\
    \ + p.shank_diametral_allowance), (p.hole_offset, p.bolt_head_across + p.head_diametral_allowance)]:\n\
    \        cutter = cq.Workplane('XY').center(0, y).circle(d/2).extrude(p.coupon_t)\n\
    \        s = s.cut(cutter)\n    label = cq.Workplane('XY').workplane(offset=p.coupon_t-p.label_depth).text('TEST\
    \ ONLY', p.label_size, p.label_depth, combine=False)\n    return s.cut(label)\n"
  print_orientation: Broad flat face on the bed at z=0; engraved TEST ONLY faces upward.
  use_orientation: Hand-held fit gauge only; never attach it between camera and tripod.
hardware:
- id: webcam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints: []
criteria:
- id: shank_clearance
  part: bolt_fit_coupon
  feature: Smaller through-hole
  relation: clears
  hardware: webcam_bolt
  clearance_mm: 0.275
  params:
  - bolt_thread_d
  - shank_diametral_allowance
  check:
    method: coupon
    ref: bolt_fit_coupon
    description: Metal bolt threads slide through without turning or force. This verifies
      clearance only, not thread compatibility or mounting strength.
- id: head_envelope
  part: bolt_fit_coupon
  feature: Larger through-hole
  relation: clears
  hardware: webcam_bolt
  clearance_mm: 0.4
  params:
  - bolt_head_across
  - head_diametral_allowance
  check:
    method: coupon
    ref: bolt_fit_coupon
    description: Check whether entire head passes through freely. This is only an
      envelope test, not a load-bearing recess.
manual:
- n: '1'
  text: This file is a bolt-fit gauge, not the missing quick-release plate. Do not
    mount a camera with it. Print at 0.2 mm layers, three walls and 20% infill; no
    supports required.
  parts:
  - bolt_fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Away from the camera, slide the webcam bolt through the small hole and test
    the head in the large hole. Do not force either fit. Record any interference;
    do not treat a successful test as approval of a camera mount.
  parts:
  - bolt_fit_coupon
  hardware:
  - webcam_bolt
  tool: null
- n: '3'
  text: Before a usable plate can be designed, obtain numerical bottom and top jaw
    gaps, lip height, length along the jaws, clamp adjustment range, and safety-stop
    geometry. Also establish the camera mass, seating footprint and usable socket
    depth. A head model number or original plate drawing may identify the required
    geometry.
  parts: []
  hardware: []
  tool: null
- n: '4'
  text: A future plate must retain the camera with the clamp fully engaged, accommodate
    the real metal bolt head, and leave adequate verified thread engagement without
    bottoming the bolt in the camera. The present information does not determine that
    thickness. Do not substitute a printed screw.
  parts: []
  hardware: []
  tool: null
- n: '5'
  text: 'Until the missing dimensions are known, use a replacement plate specified
    for the tripod head. Even a subsequently verified PLA plate should be treated
    as a supervised light-duty temporary solution: no carrying the tripod by the camera,
    unattended use, heat exposure, or overhead mounting.'
  parts: []
  hardware: []
  tool: null
