task: tripod-plate
note: UNLOADED FIT SAMPLE ONLY—not a replacement plate. Printing the flat plate may
  be feasible after measuring the head. Use a metal camera screw, not a printed screw.
  Jaw geometry remains unknown, so the 38 mm trial width and 45-degree sides are guesses,
  not an identified tripod standard. No camera hole is provided deliberately. Obtain
  the correct metal replacement plate for immediate camera use.
questions:
- text: Tripod mounting type?
  answer: Knob-tightened angled jaws; plate drops in from above.
- text: Camera thread?
  answer: 1/4-20.
- text: Webcam bolt dimensions, approximately?
  answer: 15 mm head diameter, 5 mm head height, 10 mm under-head length.
- text: Jaw dimensions, angle, travel, safety stops, head model, camera mass and socket
    usable depth?
  answer: null
