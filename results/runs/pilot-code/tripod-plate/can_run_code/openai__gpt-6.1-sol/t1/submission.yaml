parts:
- id: unloaded_profile_test
  role: coupon
  material: PLA
  code: "def build(p):\n    w=p.trial_width\n    h=p.coupon_height\n    r=h*p.side_run_per_rise\n\
    \    s=cq.Workplane('XZ').polyline([(-w/2,0),(w/2,0),(w/2-r,h),(-w/2+r,h)]).close().extrude(p.coupon_length).translate((0,p.coupon_length/2,0))\n\
    \    label=cq.Workplane('XY').workplane(offset=h-p.label_depth).text('TEST',p.label_size,p.label_depth+p.cut_overrun,combine=True)\n\
    \    return s.cut(label)"
  print_orientation: Wide rectangular face on bed at z=0, narrow engraved face up.
    No supports.
  use_orientation: 'Unloaded only: wide face down, slopes toward jaws. Never mount
    a camera on this sample.'
hardware: []
joints: []
criteria:
- id: trial_profile
  part: unloaded_profile_test
  feature: Unverified sloped side faces
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - trial_width
  - coupon_height
  - side_run_per_rise
  check:
    method: coupon
    ref: unloaded_profile_test
    description: With no camera, check whether both slopes contact the jaws rather
      than only their edges, and whether adjustment travel remains. A snug fit does
      not establish safe retention or permit camera use.
manual:
- n: '1'
  text: This is an optional unloaded fit sample, not a finished replacement. Keep
    the camera off the tripod. For immediate use, obtain the correct metal replacement
    plate.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print in PLA at 0.2 mm layers, four walls, 100% infill, wide face down, no
    supports. Remove first-layer flare without altering the sloped faces.
  parts:
  - unloaded_profile_test
  hardware: []
  tool: null
- n: '3'
  text: 'Over a table, without a camera, open the jaws and try the sample label upward,
    slopes facing the jaws. Tighten gently by hand only. If it does not drop in naturally,
    conflicts with stops, or the faces do not match, stop: this guessed profile is
    unsuitable.'
  parts:
  - unloaded_profile_test
  hardware: []
  tool: null
- n: '4'
  text: Record whether it rests on the clamp floor, both angled faces contact, and
    knob adjustment remains. Remove afterward. A successful dry fit does not prove
    load capacity or pull-out resistance.
  parts: []
  hardware: []
  tool: null
- n: '5'
  text: 'Before a functional plate can be designed, establish actual jaw top/bottom
    gaps, lip height/angle, usable plate length, clamp travel, safety-stop layout,
    and camera/lens mass. Measure camera socket usable depth gently with a nonmetal
    probe. Confirm the metal bolt dimensions: plate thickness must permit adequate
    metal thread engagement without bottoming out. Do not print the screw, drill this
    sample for a camera, or mount a camera on it.'
  parts: []
  hardware: []
  tool: null
