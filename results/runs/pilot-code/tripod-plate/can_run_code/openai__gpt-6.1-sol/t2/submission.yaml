task: tripod-plate
note: 'Measurement aid only: NOT a quick-release plate and NOT safe to mount a camera
  on. A temporary printed flat plate may be feasible after measuring the specific
  clamp; do not print the camera screw. The available metal webcam bolt is a possible
  fastener, but its length and the camera''s permitted engagement still need verification.
  No camera-holding design is supplied because critical clamp dimensions are unknown.'
questions:
- text: What are the upper lip opening, bottom jaw spacing, floor-to-lip height, and
    usable rail length, all with the knob at the same position?
  answer: null
- text: What is the camera model, camera-plus-lens mass, and manufacturer's permitted
    mounting-screw engagement?
  answer: null
- text: What are the webcam bolt head diameter, head height, and under-head length?
  answer: Approximately 15 mm diameter, 5 mm high, and 10 mm under-head length; measured
    by user.
