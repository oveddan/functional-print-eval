parts:
- id: clamp_measuring_ruler
  role: coupon
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    ruler = cq.Workplane(\"XY\").box(p.ruler_length, p.ruler_width,\
    \ p.ruler_thickness, centered=(False, True, False))\n    for i in range(1, int(p.scale_length)+1):\n\
    \        tick_len = 4.5 if i % 10 == 0 else (3.0 if i % 5 == 0 else 1.8)\n   \
    \     tick = cq.Workplane(\"XY\").box(p.tick_width, tick_len, p.engrave_depth+0.1,\
    \ centered=(True,False,False)).translate((i,p.ruler_width/2-tick_len,p.ruler_thickness-p.engrave_depth))\n\
    \        ruler = ruler.cut(tick)\n    for i in range(10, int(p.scale_length)+1,\
    \ 10):\n        label = cq.Workplane(\"XY\").text(str(i), 2.6, p.engrave_depth+0.1,\
    \ combine=True).translate((i,-1.5,p.ruler_thickness-p.engrave_depth))\n      \
    \  ruler = ruler.cut(label)\n    return ruler"
  print_orientation: Flat unmarked underside on bed, z=0; engraved marks face upward.
  use_orientation: Handheld measuring aid only; x=0 square end is scale zero. Never
    clamp it as a camera plate.
hardware: []
joints: []
criteria:
- id: ruler_scale_check
  part: clamp_measuring_ruler
  feature: Distance between 10 and 80 engraved tick centres
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - scale_length
  - tick_width
  check:
    method: measure
    ref: null
    description: Compare the 70 mm tick separation with a trusted ruler if available.
      Remove any first-layer edge flare before using the x=0 end as zero. Printed
      ruler readings are approximate, not a certified fit check.
manual:
- n: '1'
  text: This print is only a measuring tool. Do not attach a camera to it. Obtain
    your friend's permission before experimenting with the borrowed tripod.
  parts:
  - clamp_measuring_ruler
  hardware: []
  tool: null
- n: '2'
  text: Print flat in PLA at 0.2 mm layers with the 0.4 mm nozzle. No supports required.
    Remove brim or first-layer flare carefully without shortening the square zero
    end.
  parts:
  - clamp_measuring_ruler
  hardware: []
  tool: Bambu Lab X1C
- n: '3'
  text: The square end nearest the 10 label is zero; each tick is 1 mm, numbered ticks
    are 10 mm apart. Check the scale against a trusted ruler if possible. Use tick
    centres, not tick edges, for readings.
  parts:
  - clamp_measuring_ruler
  hardware: []
  tool: null
- n: '4'
  text: With no camera fitted, keep the clamp knob at one fixed position. Measure
    the opening between upper lip edges, jaw spacing at the support floor, floor-to-top-of-lip
    height, and usable front-to-back rail length. Use a caliper or another narrow
    ruler if this tool cannot reach a feature. Do not force it beneath the lips. Record
    which jaw moves and whether the knob can close farther.
  parts:
  - clamp_measuring_ruler
  hardware: []
  tool: null
- n: '5'
  text: Report those measurements plus the tripod and camera models, camera-plus-lens
    weight, and any safety stop or retaining-pin features. The dimensions and lip
    profile must be established before designing a plate.
  parts: []
  hardware: []
  tool: null
- n: '6'
  text: Keep the metal webcam bolt for possible later use, but do not force it into
    the camera or use it to probe socket depth. Find the camera manufacturer's allowed
    screw engagement. A future plate must accommodate the measured head and leave
    the correct protrusion without bottoming the screw. Do not substitute a printed
    screw.
  parts: []
  hardware: []
  tool: null
- n: '7'
  text: Until a compatible plate and fastener arrangement are verified, use the original
    or a manufacturer-compatible replacement. Even an eventual temporary PLA plate
    should be used only low down, attended, independently tethered, and never for
    carrying the tripod with the camera attached.
  parts: []
  hardware: []
  tool: null
