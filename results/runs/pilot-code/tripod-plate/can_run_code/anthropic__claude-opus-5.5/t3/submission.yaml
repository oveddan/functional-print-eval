task: tripod-plate
note: Arca-style quick-release plate using the salvaged 1/4-20 bolt. The dovetail
  sizes are Arca standard values and a guess, not measurements, so the coupon checks
  them first.
questions: []
params:
  arca_width:
    value: 38
    unit: mm
    kind: world
    source: datasheet
    note: Arca-Swiss standard plate width at the bottom; clamp not measured, verify
      with coupon
  bevel_h:
    value: 5
    unit: mm
    kind: world
    source: guessed
    note: 45 deg dovetail bevel height; jaws' lips not measured
  plate_t:
    value: 10
    unit: mm
    kind: design
    source: design
    note: ''
  plate_len:
    value: 60
    unit: mm
    kind: design
    source: design
    note: ''
  slot_len:
    value: 20
    unit: mm
    kind: design
    source: design
    note: camera fore/aft adjustment travel
  head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: webcam bolt head, 'about 15'
  head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bolt_len:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: under head; with 4.5 mm floor leaves ~5.5 mm into the camera
  bolt_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 major diameter
  coupon_len:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: plate
  role: final
  material: PLA
  code: "def build(p):\n    W=p.arca_width; b=p.bevel_h; t=p.plate_t; L=p.plate_len\n\
    \    top_w=W-2*b\n    prof=(cq.Workplane('YZ').polyline([(-W/2,0),(W/2,0),(top_w/2,b),(top_w/2,t),(-top_w/2,t),(-top_w/2,b)]).close().extrude(L).translate((-L/2,0,0)))\n\
    \    sl=p.slot_len\n    head=cq.Workplane('XY').slot2D(sl+p.head_d+1.0,p.head_d+1.0).extrude(p.head_h+0.5)\n\
    \    thru=cq.Workplane('XY').slot2D(sl+p.bolt_d+0.6,p.bolt_d+0.6).extrude(t+1)\n\
    \    return prof.cut(head).cut(thru)\n"
  print_orientation: wide 38 mm bottom face (the clamp side) on the bed; bolt-head
    counterbore opens to the bed, its 16 mm ceiling bridges
  use_orientation: bottom face down into the tripod clamp, camera sits on the top
    face
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    W=p.arca_width; b=p.bevel_h; t=p.plate_t; L=p.coupon_len\n\
    \    top_w=W-2*b\n    return cq.Workplane('YZ').polyline([(-W/2,0),(W/2,0),(top_w/2,b),(top_w/2,t),(-top_w/2,t),(-top_w/2,b)]).close().extrude(L)\n"
  print_orientation: wide bottom face on the bed
  use_orientation: dropped into the tripod clamp to test the dovetail fit
hardware:
- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_screw
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: counterbored slot
    role: head_seat
  - part: plate
    feature: through slot
    role: clearance
  nut: null
  external: camera's 1/4-20 tripod socket
criteria:
- id: dovetail_fit
  part: fit_coupon
  feature: 45 deg side bevels
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - arca_width
  - bevel_h
  check:
    method: coupon
    ref: fit_coupon
    description: Coupon drops into the opened clamp and locks firmly when the knob
      is tightened, without sliding out
- id: bolt_reach
  part: plate
  feature: slot floor
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - head_h
  - bolt_len
  - plate_t
  check:
    method: measure
    ref: null
    description: Bolt tip sticks out about 5-5.5 mm above the plate top; it shouldn't
      bottom out in the camera before it's tight
manual:
- n: '1'
  text: Print fit_coupon (a 2 cm slice, takes a few minutes). Open the clamp knob,
    drop it in, tighten it. If it holds firmly, go to step 2. If it's too wide to
    drop in or too loose to hold, tell me how much and I'll change arca_width.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Print the plate flat, wide face down, at 100% infill or 5+ walls so it's stiff.
  parts:
  - plate
  hardware: []
  tool: null
- n: '3'
  text: Push the webcam bolt up from underneath through the slot so its head sits
    in the recess. Screw it into the camera's tripod socket and tighten it by hand.
    Slide it along the slot to balance the camera first.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '4'
  text: Loosen the clamp knob, drop the plate in (wide face down), and tighten firmly.
    Hold onto the camera the first time you tilt the head.
  parts:
  - plate
  hardware: []
  tool: null
