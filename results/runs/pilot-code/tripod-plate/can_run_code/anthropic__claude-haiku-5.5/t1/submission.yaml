parts:
- id: groove-coupon
  role: coupon
  material: PLA (black, high-speed)
  code: "def build(p):\n    L = p.length; W = p.width; T = p.thickness\n    blk =\
    \ cq.Workplane('XY').box(L, W, T).translate((0, 0, T/2))\n    widths = [p.w1,\
    \ p.w2, p.w3, p.w4, p.w5]\n    xs = [-32, -16, 0, 16, 32]\n    for w, x in zip(widths,\
    \ xs):\n        cut = cq.Workplane('XY').box(w, p.groove_depth*2, p.groove_z*2).translate((x,\
    \ -W/2, T - p.groove_z + p.groove_z))\n        blk = blk.cut(cut)\n    return\
    \ blk\n"
  print_orientation: flat face down (thickness vertical, notches on top)
  use_orientation: test only
