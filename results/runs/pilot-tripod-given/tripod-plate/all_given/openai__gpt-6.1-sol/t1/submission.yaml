parts:
- id: jaw_fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    b = p.clamp_bottom_width-p.profile_width_clearance\n \
    \   t = p.clamp_top_width-p.profile_width_clearance\n    h = p.clamp_lip_height\n\
    \    if not (b > t > 0 and h > 0 and 0 < p.coupon_length <= p.usable_clamp_length):\n\
    \        raise ValueError('Requires unobstructed straight wider-at-bottom dovetail.')\n\
    \    body = cq.Workplane('XZ').polyline([(-b/2,0),(b/2,0),(t/2,h),(-t/2,h)]).close().extrude(p.coupon_length/2,both=True)\n\
    \    deck = cq.Workplane('XY').workplane(offset=h).rect(t,p.coupon_length).extrude(p.coupon_deck_thickness)\n\
    \    return body.union(deck)\n"
  print_orientation: Wide flat base at z=0 on bed, Y along jaws. No supports.
  use_orientation: Z upward from clamp floor. Unloaded profile gauge only; never mount
    a camera.
- id: temporary_plate
  role: final
  material: PLA
  code: "def build(p):\n    if not p.fit_verified or not p.bolt_verified or p.socket_usable_depth\
    \ is None:\n        raise ValueError('STOP: missing measurements or verification.')\n\
    \    b = p.clamp_bottom_width-p.profile_width_clearance\n    t = p.clamp_top_width-p.profile_width_clearance\n\
    \    h = p.clamp_lip_height\n    L = p.usable_clamp_length-p.length_end_clearance\n\
    \    pd = p.bolt_head_diameter+p.head_pocket_diametral_allowance\n    recess =\
    \ p.bolt_head_height+p.head_recess_extra_depth\n    e = p.target_thread_engagement\n\
    \    web = p.bolt_underhead_length-e\n    H = recess+web\n    bore = p.bolt_nominal_diameter+p.shaft_diametral_clearance\n\
    \    if not (b > t > pd and h > 0 and L > pd):\n        raise ValueError('Incompatible\
    \ profile or pocket.')\n    if min(t,L) < pd+2*p.minimum_pocket_sidewall:\n  \
    \      raise ValueError('Insufficient pocket walls.')\n    if web < p.minimum_plate_web\
    \ or H < h+p.minimum_deck_above_lips:\n        raise ValueError('Insufficient\
    \ web or deck clearance.')\n    if e < p.minimum_engaged_turns*p.bolt_pitch or\
    \ e+p.socket_bottom_margin > p.socket_usable_depth:\n        raise ValueError('Unsafe\
    \ thread engagement or bottoming risk.')\n    if max(b,L,H) > 256:\n        raise\
    \ ValueError('Exceeds printer envelope.')\n    body = cq.Workplane('XZ').polyline([(-b/2,0),(b/2,0),(t/2,h),(-t/2,h)]).close().extrude(L/2,both=True)\n\
    \    deck = cq.Workplane('XY').workplane(offset=h).rect(t,L).extrude(H-h)\n  \
    \  pocket = cq.Workplane('XY').circle(pd/2).extrude(recess)\n    hole = cq.Workplane('XY').circle(bore/2).extrude(H)\n\
    \    return body.union(deck).cut(pocket).cut(hole)\n"
  print_orientation: Wide base at z=0 on bed, pocket opening downward. Default pocket
    roof bridge is 23 mm, below stated 50 mm capability. No inaccessible internal
    supports.
  use_orientation: Z up from clamp floor, camera on top, bolt enters from below. X
    across jaws; Y along jaws.
