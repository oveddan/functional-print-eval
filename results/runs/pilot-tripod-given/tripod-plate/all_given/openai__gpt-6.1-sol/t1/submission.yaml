task: tripod-plate
note: Conditional sizing model, NOT a verified replacement. Jaw dimensions and length
  are guessed placeholders. Final generation is blocked until real dimensions, bolt
  drive and camera socket are checked. Use the metal webcam bolt, not a printed screw.
  No load rating or reliable safety retention has been established.
