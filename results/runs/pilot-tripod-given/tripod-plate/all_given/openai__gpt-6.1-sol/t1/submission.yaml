  - 0.0
  - 1.0
  seats:
  - part: temporary_plate
    feature: Annular underside pocket roof
    role: head_seat
  - part: temporary_plate
    feature: Central through-bore
    role: clearance
  nut: null
  external: Camera 1/4-20 socket; requires verified usable depth and manufacturer-approved
    engagement.
criteria:
- id: capture
  part: temporary_plate
  feature: Sloped longitudinal faces and base
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - clamp_bottom_width
  - clamp_top_width
  - clamp_lip_height
  - profile_width_clearance
  check:
    method: coupon
    ref: jaw_fit_coupon
    description: Unloaded gauge seats on floor, both lips capture it, knob has travel,
      gauge resists upward hand withdrawal and releases normally. Does not prove load
      capacity or full-length fit.
- id: envelope
  part: temporary_plate
  feature: Full plate envelope
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - usable_clamp_length
  - length_end_clearance
  - fit_verified
  check:
    method: measure
    ref: null
    description: Check length, stops, pins and flat camera footprint. Model has no
      safety-pin recess; stop if one is needed.
- id: bolt_seat
  part: temporary_plate
  feature: Pocket roof and bore
  relation: seats
  hardware: camera_bolt
  clearance_mm: null
  params:
  - bolt_head_diameter
  - bolt_head_height
  - head_pocket_diametral_allowance
  - shaft_diametral_clearance
  check:
    method: measure
    ref: null
    description: Head seats flat, clears clamp floor and permits proper tightening-tool
      access. Shank slides freely. Reject defective bridge roof.
- id: thread_depth
  part: temporary_plate
  feature: Bolt protrusion above camera contact face
  relation: supports
  hardware: camera_bolt
  clearance_mm: null
  params:
  - target_thread_engagement
  - socket_usable_depth
  - socket_bottom_margin
  - bolt_verified
  check:
    method: measure
    ref: null
    description: Measure actual exposed thread with head seated. Meet camera manufacturer's
      engagement requirements, leave bottom margin, and confirm flat clamping without
      bottoming.
manual:
- n: '1'
  text: Do not mount a camera. The 40/34/5 mm profile and 45 mm length defaults are
    guesses. Replace with measured bottom jaw gap, gap at lip height, lip height above
    floor, and usable length, all at the same knob setting. This model only suits
    straight wider-at-bottom dovetail jaws and a flat floor. Check pins and stops;
    do not bypass safety features.
  parts: []
  hardware: []
  tool: Calipers
- n: '2'
  text: 'Print jaw_fit_coupon at 0.2 mm layers, 5 walls, 100% infill. Keep fit_verified
    false. Test unloaded: floor contact, both lips captured, gentle knob closure with
    travel remaining, resistance to lifting, normal release. Adjust total width clearance
    and reprint as needed. Never use coupon to mount a camera.'
  parts:
  - jaw_fit_coupon
  hardware: []
  tool: Slicer
- n: '3'
  text: Separately verify full plate length, obstructions and flat camera footprint.
    Confirm actual bolt maximum head envelope, height, under-head length and accessible
    drive. User bolt measurements were approximate. Obtain usable socket depth and
    allowed engagement from camera instructions or gentle measurement. Do not force
    anything into the socket.
  parts: []
  hardware:
  - camera_bolt
  tool: Calipers and camera instructions
- n: '4'
  text: 'Enter socket_usable_depth. Default thread protrusion is provisionally 4 mm,
    about 3.15 turns, not a camera specification. Adjust target_thread_engagement
    to manufacturer requirements while retaining bottom margin and web thickness.
    Set fit_verified and bolt_verified true only after all interface checks pass.
    If generation rejects dimensions, do not bypass checks: redesign is required.'
  parts: []
  hardware: []
  tool: null
- n: '5'
  text: Generate temporary_plate and print at 0.2 mm layers, 6 walls, 100% infill.
    No supports in pocket. Inspect roof bridge and layers; reject cracks, gaps, warping
    or loose strands. Default joint head underside Z is 0.4 mm; if dimensions change
    it equals head_recess_extra_depth.
  parts:
  - temporary_plate
  hardware: []
  tool: Slicer
- n: '6'
  text: Off tripod, insert camera_bolt from below and seat head against pocket roof.
    Measure actual exposed thread and confirm socket limit again. Tighten gently with
    the proper accessible drive tool until camera contacts plate flat. Stop if resistance
    comes before contact, tool cannot reach, or camera rotates easily. Do not force
    or use a printed screw. No padding or anti-rotation pin is provided; stop if camera
    requires them.
  parts:
  - temporary_plate
  hardware:
  - camera_bolt
  tool: Calipers and matching bolt-head tool
- n: '7'
  text: Support camera fully by hand while dropping plate into open jaws and closing
    knob gently. Check floor seating, both lips captured, bolt head clear of floor,
    no sliding and adequate knob travel. Coupon alone did not verify full assembly.
    Stop if uncertain.
  parts:
  - temporary_plate
  hardware:
  - camera_bolt
  tool: null
- n: '8'
  text: No load capacity is established. Use only briefly, attended, low over a soft
    surface with camera independently supported. No heavy cameras, long lenses, motion,
    elevated use, heat or use over people. PLA may creep or crack. Inspect frequently,
    remove after use, and replace promptly with correct manufacturer plate.
  parts:
  - temporary_plate
  hardware:
  - camera_bolt
  tool: null
