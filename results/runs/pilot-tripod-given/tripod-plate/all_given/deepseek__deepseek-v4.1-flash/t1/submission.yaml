  ps_head_chamfer:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: ''
  ps_tip_chamfer:
    value: 0.7
    unit: mm
    kind: design
    source: design
    note: Lead-in on the shank tip.
  gauge_w1:
    value: 35.0
    unit: mm
    kind: design
    source: design
    note: Tile 1, 1 notch.
  gauge_w2:
    value: 39.0
    unit: mm
    kind: design
    source: design
    note: Tile 2, 2 notches.
  gauge_w3:
    value: 43.0
    unit: mm
    kind: design
    source: design
    note: Tile 3, 3 notches. If this is the one that fits, keep plate_w = 42.4.
  gauge_w4:
    value: 47.0
    unit: mm
    kind: design
    source: design
    note: Tile 4, 4 notches.
  gauge_seg_len:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: ''
  gauge_gap:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Gap between tiles, spanned by a snap-off bridge.
  gauge_bridge_h:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: ''
  gauge_t:
    value: 10.3
    unit: mm
    kind: design
    source: design
    note: Same thickness as the plate, so the tiles also test the pocket depth.
parts:
- id: plate
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    L = p.plate_len\n    W = p.plate_w\n  \
    \  T = p.plate_t\n    bev = p.top_bevel_h\n    tan_a = math.tan(math.radians(p.lip_angle_deg))\n\
    \    inset = bev * tan_a\n\n    # flat slab, bottom face on the bed\n    plate\
    \ = cq.Workplane(\"XY\").box(L, W, T, centered=(True, True, False))\n    plate\
    \ = plate.edges(\"|Z\").fillet(p.corner_r)\n\n    # top edges bevel so the plate\
    \ WIDENS going down: that is the surface the\n    # angled jaw lips wedge against,\
    \ and it is why the plate cannot lift out.\n    for s in (1.0, -1.0):\n      \
    \  pts = [(s * (W / 2.0 - inset), T),\n               (s * (W / 2.0 + 1.0), T),\n\
    \               (s * (W / 2.0 + 1.0), T - bev - 1.0)]\n        cut = (cq.Workplane(\"\
    YZ\", origin=(-L / 2.0 - 1.0, 0, 0))\n               .polyline(pts).close().extrude(L\
    \ + 2.0))\n        plate = plate.cut(cut)\n\n    # bolt head pocket, opening downwards\n\
    \    plate = plate.cut(cq.Workplane(\"XY\").circle(p.cb_dia / 2.0).extrude(p.cb_depth))\n\
    \    # shank clearance hole, right through\n    plate = plate.cut(cq.Workplane(\"\
    XY\").circle(p.shank_hole_d / 2.0).extrude(T + 2.0))\n\n    # anti-rotation rib\
    \ on the top face (camera back edge bears on it)\n    rx = -(L / 2.0 - p.rib_inset\
    \ - p.rib_len_x / 2.0)\n    rib = (cq.Workplane(\"XY\", origin=(rx, 0, T))\n \
    \          .box(p.rib_len_x, p.rib_w, p.rib_h, centered=(True, True, False)))\n\
    \    plate = plate.union(rib)\n    return plate"
  print_orientation: 'As modelled: bottom face (the face with the Ø15.4 pocket opening)
    flat on the bed, z = 0 at the bottom face. No supports - the 2.5 mm top bevel
    is a 45 deg overhang, which an X1C prints cleanly.'
  use_orientation: 'Exactly as printed: pocket side down into the clamp, beveled top
    face up against the camera''s base. The bolt''s head lives in the pocket and its
    thread points up into the camera.'
- id: screw_printed
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    head_h = p.ps_head_h\n    shank = p.ps_shank_len\n\
    \    total = head_h + shank\n    rc = (p.ps_major_d - p.ps_ridge_d) / 2.0\n\n\
    \    head = cq.Workplane(\"XY\").circle(p.ps_head_d / 2.0).extrude(head_h)\n \
    \   try:\n        head = head.faces(\">Z\").chamfer(p.ps_head_chamfer)\n    except\
    \ Exception:\n        pass\n\n    rod = cq.Workplane(\"XY\").circle(p.ps_core_d\
    \ / 2.0).extrude(total)\n    try:\n        rod = rod.faces(\">Z\").chamfer(p.ps_tip_chamfer)\n\
    \    except Exception:\n        pass\n\n    screw = head.union(rod)\n\n    # helical\
    \ bump thread: a round ridge swept along a helix, buried in the core.\n    # Prints\
    \ with no sharp crests and beds into the camera's metal socket.\n    try:\n  \
    \      h = total - 1.0\n        helix = cq.Wire.makeHelix(pitch=p.bolt_pitch,\
    \ height=h, radius=rc)\n        prof_wire = cq.Wire.makeCircle(p.ps_ridge_d /\
    \ 2.0,\n                                       cq.Vector(rc, 0, 0),\n        \
    \                               cq.Vector(0, 1, 0))\n        prof = cq.Workplane(obj=prof_wire)\n\
    \        thread = prof.sweep(cq.Workplane(obj=helix), isFrenet=True, makeSolid=True)\n\
    \        screw = screw.union(thread)\n    except Exception:\n        # falls back\
    \ to the plain shank; reprint from the source if this triggers\n        pass\n\
    \    return screw"
  print_orientation: Head down on the bed (z = 0), shank pointing up. One piece, no
    supports.
  use_orientation: 'As printed: head sunk in the plate''s Ø15.4 pocket, ridge thread
    pointing up into the camera''s 1/4-20 socket.'
- id: fit_gauge
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    T = p.gauge_t\n    seg = p.gauge_seg_len\n\
    \    gap = p.gauge_gap\n    bev = p.top_bevel_h\n    tan_a = math.tan(math.radians(p.lip_angle_deg))\n\
    \    inset = bev * tan_a\n    widths = [p.gauge_w1, p.gauge_w2, p.gauge_w3, p.gauge_w4]\n\
    \    pitch = seg + gap\n\n    body = None\n    for i, w in enumerate(widths):\n\
    \        x0 = i * pitch\n        b = (cq.Workplane(\"XY\", origin=(x0 + seg /\
    \ 2.0, 0, 0))\n             .box(seg, w, T, centered=(True, True, False)))\n \
    \       # same top bevel as the plate\n        for s in (1.0, -1.0):\n       \
    \     pts = [(s * (w / 2.0 - inset), T),\n                   (s * (w / 2.0 + 1.0),\
    \ T),\n                   (s * (w / 2.0 + 1.0), T - bev - 1.0)]\n            cut\
    \ = (cq.Workplane(\"YZ\", origin=(x0 - 1.0, 0, 0))\n                   .polyline(pts).close().extrude(seg\
    \ + 2.0))\n            b = b.cut(cut)\n        # identification notches, i+1 of\
    \ them: 1=35, 2=39, 3=43, 4=47\n        for k in range(i + 1):\n            nx\
    \ = x0 + 1.8 + k * 2.4\n            b = b.cut(cq.Workplane(\"XY\", origin=(nx,\
    \ 0, T - 1.0))\n                      .box(1.2, 3.0, 2.0, centered=(True, True,\
    \ False)))\n        body = b if body is None else body.union(b)\n\n    # snap-off\
    \ bridges holding the set together for printing\n    for i in range(len(widths)\
    \ - 1):\n        xc = i * pitch + seg + gap / 2.0\n        br = (cq.Workplane(\"\
    XY\", origin=(xc, 0, T))\n              .box(4.0, 6.0, p.gauge_bridge_h, centered=(True,\
    \ True, False)))\n        body = body.union(br)\n    return body"
  print_orientation: 'Lay it flat: all four tile bottoms on the bed (z = 0), notches
    on top. No supports.'
  use_orientation: Coupon, not part of the finished assembly. Snap or cut the four
    tiles apart, then drop each one into the clamp; the widest tile that drops in
    and sits flat on the pocket floor gives you plate_w.
hardware:
- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: bolt_to_camera
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 5.3
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: counterbore ceiling Ø15.4 (head seat)
    role: head_seat
  - part: plate
    feature: shank clearance hole Ø6.9
    role: clearance
  nut: null
  external: camera base 1/4-20 UNC socket (ISO 1222)
criteria:
- id: c_drop_in
  part: plate
  feature: outline between the jaw lip tips (max width 42.4 mm)
  relation: clears
  hardware: null
  clearance_mm: 0.25
  params:
  - plate_w
  - clamp_mouth_w
  - clearance_side
  check:
    method: coupon
    ref: fit_gauge
    description: With the knob loose, drop each tile in. The widest tile that drops
      in AND sits flat on the pocket floor is the correct width. If it is the 43 mm
      tile (3 notches), keep plate_w = 42.4. Otherwise set plate_w to that tile's
      width (35/39/43/47) and re-slice.
- id: c_lip_grip
  part: plate
  feature: top bevel (2.5 mm, 45 deg) under the jaw lips
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - plate_t
  - top_bevel_h
  - lip_angle_deg
  - clamp_lip_h
  - clamp_depth
  check:
    method: measure
    ref: null
    description: 'Knob tight, push the camera firmly upwards: the plate must not lift
      out. Retention needs plate_t > clamp_depth - clamp_lip_h (10.3 > 7.5), i.e.
      the plate''s top face above the lip tips. If it lifts, the plate is too narrow
      - go one gauge step up. If the jaw lip angle looks much steeper or shallower
      than 45 deg, change lip_angle_deg.'
- id: c_pocket_depth
  part: plate
  feature: bottom face on the clamp's pocket floor
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - plate_t
  - clamp_depth
  check:
    method: measure
    ref: null
    description: 'The plate must sit flat with the lip tops above it: plate_t < clamp_depth.
      If the gauge tiles will not sit flat, the pocket is shallower than 10.3 mm -
      reduce plate_t (and gauge_t) 1-2 mm and reprint the gauge before the plate.'
- id: c_head_seat
  part: plate
  feature: counterbore Ø15.4 x 5.3 opening downwards
  relation: contains
  hardware: bolt
  clearance_mm: 0.2
  params:
  - cb_dia
  - cb_depth
  - bolt_head_d
  - bolt_head_h
  check:
    method: template
    ref: null
    description: The bolt head (Ø15 x 5) drops into the pocket from below and its
      top face bears on the pocket ceiling. To tighten, grip the plate's edges and
      turn the camera - or pre-thread the bolt by hand first.
- id: c_shank_clear
  part: plate
  feature: shank hole Ø6.9 through the plate
  relation: clears
  hardware: bolt
  clearance_mm: 0.27
  params:
  - shank_hole_d
  - bolt_thread_d
  check:
    method: template
    ref: null
    description: The 1/4-20 thread passes freely and the head cannot fall through,
      so the screw stays captured in the plate.
- id: c_thread_engagement
  part: plate
  feature: thread standing 5.0 mm above the top face
  relation: engages
  hardware: bolt
  clearance_mm: null
  params:
  - protrusion
  - cb_depth
  - bolt_len
  - plate_t
  - cam_socket_depth
  check:
    method: measure
    ref: null
    description: 'Thread the bolt into the camera: about 4 turns, and the plate must
      come up flush against the camera''s base. If it bottoms out (a gap you cannot
      close), the socket is shallower than 5 mm: shorten the bolt ~2 mm with a hacksaw
      and clean the thread, or set ps_shank_len shorter and reprint the screw.'
- id: c_printed_head
  part: screw_printed
  feature: head Ø14.8 x 5 in the plate's pocket
  relation: clears
  hardware: null
  clearance_mm: 0.3
  params:
  - ps_head_d
  - ps_head_h
  - cb_dia
  - cb_depth
  check:
    method: template
    ref: null
    description: Printed screw and salvaged bolt share the same envelope, so either
      one seats in the pocket.
- id: c_printed_thread
  part: screw_printed
  feature: helical ridge thread, major Ø6.2, pitch 1.27 mm
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - ps_major_d
  - ps_ridge_d
  - ps_core_d
  - bolt_pitch
  - cam_socket_d
  check:
    method: measure
    ref: null
    description: 'Turn it into the camera''s socket by hand: it should run in and
      tighten. PLA is soft - snug, not gorilla-tight. If it feels loose, wrap one
      turn of PTFE tape or use the metal bolt.'
- id: c_gauge_range
  part: fit_gauge
  feature: four tiles, 35 / 39 / 43 / 47 mm
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - gauge_w1
  - gauge_w2
  - gauge_w3
  - gauge_w4
  - clamp_mouth_w
  check:
    method: coupon
    ref: null
    description: Covers a 33-48 mm clamp opening. If no tile drops in, the clamp is
      either narrower than 35 mm (reprint the gauge narrower) or the tiles are too
      thick for its pocket (reduce gauge_t).
manual:
- n: '1'
  text: Print fit_gauge first - it is the thing that tells you whether the plate will
    fit your borrowed clamp. PLA, 0.2 mm layers, flat on the bed as supplied, 2 walls,
    15% infill, no supports. About 20 minutes; you can stop the plate print later,
    but do this one now.
  parts:
  - fit_gauge
  hardware: []
  tool: null
- n: '2'
  text: Snap the four tiles apart (or nip the little top bridges with side cutters
    - they are 1 mm thick on purpose).
  parts:
  - fit_gauge
  hardware: []
  tool: side cutters
- n: '3'
  text: 'Loosen the tripod''s clamp knob a few turns. Try each tile in the clamp in
    turn: find the widest tile that drops in from above AND sits flat on the clamp''s
    pocket floor. Identify it by its notches: 1 = 35 mm, 2 = 39 mm, 3 = 43 mm, 4 =
    47 mm. Then tighten the knob and confirm that tile is gripped and cannot be lifted
    out.'
  parts:
  - fit_gauge
  hardware: []
  tool: tripod clamp
- n: '4'
  text: 'Act on what the gauge told you. If the 43 mm tile (3 notches) is the winner,
    change nothing. If another tile wins, open the plate''s code and set plate_w to
    that tile''s width, then re-slice. If the jaws close all the way without gripping
    any tile, your clamp is wider than my guess: set plate_w about 1 mm less than
    the clamp''s full opening. If NO tile drops in flat, the pocket is shallower than
    10.3 mm: reduce plate_t (and gauge_t) by 1-2 mm - never below 6 mm, or the bolt
    head will not fit inside - and reprint the gauge.'
  parts:
  - fit_gauge
  - plate
  hardware: []
  tool: null
- n: '5'
  text: 'Print the plate as supplied: flat on its bottom face (the face with the pocket
    opening down), no supports. About 1 hour, ~30 g.'
  parts:
  - plate
  hardware: []
  tool: null
- n: '6'
  text: 'Optional: print the screw if you want a spare or an all-plastic version.
    Head down on the bed, no supports. The salvaged 1/4-20 bolt from the webcam mount
    is stronger and is the one to use first - it is the same thread as a camera.'
  parts:
  - screw_printed
  hardware: []
  tool: null
- n: '7'
  text: 'Hold the camera upside down. Drop the salvaged webcam bolt down into the
    plate from underneath: the head sinks into the Ø15.4 pocket and the thread pokes
    up out of the plate''s top face. Screw the thread two or three turns into the
    camera''s base socket by hand.'
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '8'
  text: 'Press the plate up against the camera''s base and tighten: grip the plate''s
    edges and turn the camera (or turn the plate) until the plate''s top face is firmly
    in contact with the camera''s base. The small rib on the top face should end up
    against the camera''s back edge - that is what stops the camera spinning. If the
    screw slips in the pocket instead of turning, pre-thread it by hand as in step
    7, then press down on the plate while turning.'
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '9'
  text: 'Check the thread is not bottoming out: there must be no gap between the plate''s
    top face and the camera''s base. If a gap remains, the socket is shallower than
    5 mm - shorten the bolt about 2 mm with a hacksaw, clean the thread with a file,
    or print the screw with a shorter ps_shank_len.'
  parts:
  - plate
  - screw_printed
  hardware:
  - bolt
  tool: hacksaw, file
- n: '10'
  text: Loosen the clamp's knob and drop the camera + plate in from above, seating
    the plate flat on the pocket floor. Tighten the knob firmly. The angled lips should
    wedge the plate down onto the floor.
  parts:
  - plate
  hardware: []
  tool: tripod clamp
- n: '11'
  text: 'Test before you trust it: with the knob tight, push the camera firmly upwards,
    sideways and try to twist it. Nothing should move and the plate must not lift
    out. If it lifts out, the plate is too narrow - step up one gauge size and reprint.'
  parts:
  - plate
  hardware: []
  tool: tripod clamp
- n: '12'
  text: 'Use it like the temporary part it is: PLA, not metal. Keep a hand on the
    camera while you carry the tripod, re-check the knob each session, and do not
    leave anything valuable or heavy hanging off it.'
  parts:
  - plate
  - screw_printed
  hardware: []
  tool: null
