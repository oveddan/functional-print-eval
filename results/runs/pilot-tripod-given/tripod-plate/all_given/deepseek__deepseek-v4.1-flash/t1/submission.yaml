task: tripod-plate
note: 'How hard is it? Two very different answers.


  THE PLATE (the flat part) — easy. It''s a flat slab: prints flat on the bed in one
  piece, no supports, ~1 hour, ~30 g of PLA, and it''s the part that actually does
  the work. This is the part worth printing.


  THE SCREW — printable but it''s the weak link. A 1/4-20 thread in PLA is soft; it
  will hold a light camera, but it will not survive being cross-threaded or over-tightened.
  More importantly, you already own the right screw: the salvaged webcam-mount bolt
  is a 1/4-20 (that is literally the camera thread), Ø15 head, 10 mm under the head.
  Use it as the primary screw. I''ve still included the printed screw (print it as
  a spare or if you want an all-plastic one); its thread is modelled as a helical
  bump ridge (Ø6.2 major, 1.27 mm pitch) rather than a sharp UNC profile, because
  that prints cleanly at 0.2 mm layers and beds into the camera''s metal socket instead
  of shredding.


  THE ONE THING I COULD NOT GET: your borrowed clamp''s actual dimensions (opening
  width, pocket depth, lip depth). Two measurement rounds came back with the same
  notes rather than numbers, so plate_w / plate_t / clamp_depth are my guesses for
  a common small-tripod quick-release (43 mm opening, 11 mm deep pocket). Because
  that guess decides whether the thing drops in at all, I included a COUPON - fit_gauge
  - a break-away set of four tiles (35/39/43/47 mm, identified by how many notches
  they carry: 1 = 35, 2 = 39, 3 = 43, 4 = 47). Print that first (20 min), find the
  widest tile that drops into your clamp and sits flat, and if it isn''t the 43 mm
  one, change plate_w to that number and re-slice. That converts an unmeasurable clamp
  into a 20-minute test instead of a wasted plate.


  Key numbers: plate is 50 x 42.4 x 10.3 mm with a Ø15.4 x 5.3 head pocket opening
  downwards and a Ø6.9 shank hole; the bolt''s thread stands 5.0 mm proud of the plate''s
  top face (~4 threads into the camera - enough, and it won''t bottom out in a typical
  6.5 mm socket). The plate''s top edges bevel 2.5 mm at 45° so the jaw lips wedge
  it down; the plate''s top face ends up 2.8 mm above the lip tips, which is what
  stops it lifting out.


  This is a temporary, plastic substitute: check it''s tight every time, keep a hand
  on the camera, and don''t hang anything valuable off it.'
questions:
- text: How wide is the clamp's opening between the two jaw lip tips, with the knob
    loosened a few turns (nearest mm)? This is the one number that decides whether
    the plate drops in - the printed fit_gauge will tell you, but a real measurement
    would let me size the plate exactly.
  answer: null
- text: How deep is the clamp's pocket, from the jaw top face down to the floor the
    plate rests on (nearest mm)? That sets the plate's thickness, which is what stops
    it lifting out under the lips.
  answer: null
- text: How deep is the 1/4-20 threaded socket in the base of the camera you are mounting
    (nearest mm)? It decides how much thread may stand proud of the plate's top face.
  answer: null
params:
  bolt_thread_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 UNC major diameter (0.25 in).
  bolt_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 = 20 tpi.
  bolt_head_d:
    value: 15.0
    unit: mm
    kind: hardware
    source: asked
    note: Salvaged webcam bolt head across, ~15 mm.
  bolt_head_h:
    value: 5.0
    unit: mm
    kind: hardware
    source: asked
    note: Salvaged webcam bolt head height.
  bolt_len:
    value: 10.0
    unit: mm
    kind: hardware
    source: asked
    note: Salvaged webcam bolt length under the head.
  cam_socket_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: Camera base socket is the standard 1/4-20.
  clamp_mouth_w:
    value: 43.0
    unit: mm
    kind: world
    source: guessed
    note: Opening between the jaw lip tips on the borrowed clamp (200PL/RC2 class).
      Never measured - the fit_gauge coupon determines the real value.
  clamp_channel_w:
    value: 49.0
    unit: mm
    kind: world
    source: guessed
    note: Widest internal width of the jaw channel, below the lips.
  clamp_lip_h:
    value: 3.5
    unit: mm
    kind: world
    source: guessed
    note: Depth of the lip overhang below the jaw top face.
  clamp_depth:
    value: 11.0
    unit: mm
    kind: world
    source: guessed
    note: Jaw top face down to the floor the plate rests on.
  clamp_len:
    value: 52.0
    unit: mm
    kind: world
    source: guessed
    note: Length of the clamp opening end to end.
  lip_angle_deg:
    value: 45.0
    unit: deg
    kind: world
    source: guessed
    note: Jaw lip faces measured from vertical; the plate's top bevel matches it so
      the two faces wedge face-to-face.
  cam_socket_depth:
    value: 6.5
    unit: mm
    kind: world
    source: guessed
    note: Typical 1/4-20 socket depth in a camera base. Sets how much thread may stand
      proud.
  clearance_side:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: Drop-in clearance per side against the clamp opening.
  plate_w:
    value: 42.4
    unit: mm
    kind: design
    source: design
    note: '= clamp_mouth_w - 2*clearance_side. THE NUMBER TO EDIT: set it to the widest
      fit_gauge tile that drops in.'
  plate_t:
    value: 10.3
    unit: mm
    kind: design
    source: design
    note: '= clamp_depth - 0.7, and <= cb_depth + bolt_len - min_engagement (5.3+10-4.5=10.8).
      As thick as the clamp allows: that overlap is what keeps the plate under the
      lips.'
  plate_len:
    value: 50.0
    unit: mm
    kind: design
    source: design
    note: = clamp_len - 2.
  top_bevel_h:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: Height of the downward-widening bevel on the two long top edges; it is the
      surface the jaw lips bite.
  corner_r:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: Plan-view corner radius, to help it drop past the lips.
  cb_dia:
    value: 15.4
    unit: mm
    kind: design
    source: design
    note: = bolt_head_d + 0.4. Bolt head pocket, opening downwards.
  cb_depth:
    value: 5.3
    unit: mm
    kind: design
    source: design
    note: = bolt_head_h + 0.3. Leaves 5.0 mm of plate above the head.
  shank_hole_d:
    value: 6.9
    unit: mm
    kind: design
    source: design
    note: = bolt_thread_d + 0.55; clears both the metal bolt and the printed screw.
  min_engagement:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: Minimum thread into the camera (3.5 threads).
  protrusion:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: = cb_depth + bolt_len - plate_t. Thread standing above the plate face -
      ~4 turns in the camera, and less than cam_socket_depth so the plate still seats.
  rib_h:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: Anti-rotation rib height on the top face.
  rib_w:
    value: 36.0
    unit: mm
    kind: design
    source: design
    note: Rib length across the plate, inside the bevel.
  rib_len_x:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: Rib thickness along the plate.
  rib_inset:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: Rib position from the plate end.
  ps_head_d:
    value: 14.8
    unit: mm
    kind: design
    source: design
    note: Printed screw head, to match the salvaged bolt's envelope.
  ps_head_h:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: ''
  ps_core_d:
    value: 4.9
    unit: mm
    kind: design
    source: design
    note: Core under the thread ridge; small enough to enter the socket's minor diameter.
  ps_ridge_d:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: Diameter of the helical ridge swept along the shank - printable overhang,
      no sharp crests.
  ps_major_d:
    value: 6.2
    unit: mm
    kind: design
    source: design
    note: Effective major diameter of the printed thread (0.15 mm under nominal so
      it beds in).
  ps_shank_len:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: = protrusion + (plate_t - cb_depth). EDIT ONLY if the camera's socket is
