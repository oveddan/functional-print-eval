  - pocket_af
  - pocket_depth
  - entry_h
  check:
    method: measure
    ref: null
    description: Unverified. Nut must seat with thumb pressure only, resist turning,
      and stay in place when the knob is inverted and gently tapped. If any check
      fails, the fit needs revision before use.
- id: recess
  part: hand_knob
  feature: Nut pocket floor 2.8 mm below top
  relation: contains
  hardware: m3_nut
  clearance_mm: null
