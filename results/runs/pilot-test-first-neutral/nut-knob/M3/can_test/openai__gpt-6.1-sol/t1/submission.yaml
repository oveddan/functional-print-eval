  - nut_h
  - pocket_depth
  check:
    method: measure
    ref: null
    description: With the nut fully seated, its upper face should be approximately
      0.4 mm below the knob top.
- id: captive_floor
  part: hand_knob
  feature: 3.6 mm solid floor around the 3.5 mm through-bore
  relation: supports
  hardware: m3_nut
  clearance_mm: null
  params:
  - knob_h
  - pocket_depth
  - nut_af
  - bolt_d
  - bore_clearance
  check:
    method: measure
    ref: null
    description: Confirm the nut bears on the pocket floor and cannot pass through
      the bolt hole.
manual:
- n: '1'
  text: Print hand_knob with the pocket upward, using the 0.4 mm nozzle and 0.2 mm
    layers. Use 4 walls and 100% infill; no supports.
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '2'
  text: 'Remove any loose burrs or strings from the through-hole and pocket entrance.
    Do not enlarge the hex flats: they provide retention.'
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '3'
  text: Align the M3 nut with the hex pocket and press it down squarely using thumb
    pressure only. It must seat on the floor with its top fully recessed. Stop if
    it will not seat; do not hammer it or pull it in using a bolt.
  parts:
  - hand_knob
  hardware:
  - m3_nut
  tool: null
- n: '4'
  text: Turn the knob pocket-down over a tray and gently tap it. The nut must remain
    seated. Also check that the nut cannot rotate inside the pocket. This fit is unverified;
    if it falls out, spins, or cannot be inserted by hand, do not use the knob until
    the pocket fit is revised.
  parts:
  - hand_knob
  hardware:
  - m3_nut
  tool: null
- n: '5'
  text: Use with your M3 bolt as a hand-tightened threaded knob. Place the closed
    face toward the work and thread the bolt through the central hole and nut; the
    bolt can emerge through the open pocket face. Choose bolt length for your workpiece,
    allow full nut engagement, and tighten lightly by hand only. This captures a nut,
    not the head of a bolt.
  parts:
  - hand_knob
  hardware:
  - m3_nut
  tool: null
