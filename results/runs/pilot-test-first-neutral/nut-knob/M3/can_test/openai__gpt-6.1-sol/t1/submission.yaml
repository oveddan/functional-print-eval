parts:
- id: hand_knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    import math\n    body = cq.Workplane('XY').circle(p.knob_d/2).extrude(p.knob_h)\n\
    \    for i in range(int(p.scallop_count)):\n        a = 2*math.pi*i/p.scallop_count\n\
    \        x = p.scallop_center_r*math.cos(a)\n        y = p.scallop_center_r*math.sin(a)\n\
    \        cutter = cq.Workplane('XY').center(x,y).circle(p.scallop_r).extrude(p.knob_h)\n\
    \        body = body.cut(cutter)\n    floor = p.knob_h-p.pocket_depth\n    pocket\
    \ = cq.Workplane('XY').workplane(offset=floor).polygon(6,p.pocket_af/math.cos(math.pi/6)).extrude(p.pocket_depth)\n\
    \    entry = cq.Workplane('XY').workplane(offset=p.knob_h-p.entry_h).polygon(6,p.pocket_af/math.cos(math.pi/6)).workplane(offset=p.entry_h).polygon(6,(p.pocket_af+p.entry_af_extra)/math.cos(math.pi/6)).loft()\n\
    \    bore = cq.Workplane('XY').circle((p.bolt_d+p.bore_clearance)/2).extrude(p.knob_h)\n\
    \    return body.cut(pocket).cut(entry).cut(bore)"
  print_orientation: Flat closed face on bed at z=0; hex nut pocket faces upward.
    No supports.
  use_orientation: Axis of the bolt aligns with Z. For clamping, put the closed face
    against the work and leave the nut-pocket face outward.
