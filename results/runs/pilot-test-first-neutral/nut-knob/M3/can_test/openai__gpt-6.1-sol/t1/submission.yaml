task: nut-knob/M3
note: 'One-piece, approximately 20 mm scalloped hand knob with a recessed M3 nut pocket,
  entry chamfer, and through-hole. The solid floor prevents the nut passing through
  the opposite side. Retention is NOT yet verified: 5.35 and 5.45 mm pockets were
  too tight; results for 5.55 and 5.65 mm were unavailable. The design uses 5.55 mm
  as an unverified fit candidate, not a confirmed press fit. Check retention before
  use; do not use glue or force the nut in with tools.'
