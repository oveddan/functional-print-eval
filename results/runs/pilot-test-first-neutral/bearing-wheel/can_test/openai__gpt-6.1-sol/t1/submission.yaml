task: bearing-wheel
note: '50 × 16 mm flat-tread wheel, UNLOADED BENCH PROTOTYPE ONLY—not an approved
  closet-door repair. Two 608 bearings rotate around a stationary M8 axle. Bearing
  fit remains unverified: the tight coupon failed and no usable results were obtained
  for the other sizes. Track shape, mounting clearance, axle dimensions and door load
  are unknown. Do not install under a door or use as a top hanger. PLA spacers are
  for gentle bench evaluation only; they are not a substitute for a validated metal
  spacer in a loaded assembly.'
questions:
- text: Track profile, mounting arrangement, door load and available bracket clearance?
  answer: User cannot measure; unknown.
- text: Successful bearing-pocket fit?
  answer: Approximately 21.95 mm coupon rejected; larger coupon results unavailable.
- text: Existing M8 bolt length and head dimensions?
  answer: Only approximately 8 mm shank confirmed. Do not assume it matches the specified
    bench-test screw.
