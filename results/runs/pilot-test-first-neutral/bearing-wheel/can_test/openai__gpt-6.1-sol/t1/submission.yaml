parts:
- id: wheel
  role: final
  material: Black PLA
  code: "def build(p):\n    depth = p.bearing_width + p.bearing_recess\n    w = cq.Workplane('XY').circle(p.wheel_od/2).extrude(p.wheel_width)\n\
    \    w = w.edges('%Circle').chamfer(p.rim_chamfer)\n    core = cq.Workplane('XY').circle(p.shoulder_bore/2).extrude(p.wheel_width)\n\
    \    lower = cq.Workplane('XY').circle(p.seat_d/2).extrude(depth)\n    upper =\
    \ cq.Workplane('XY').workplane(offset=p.wheel_width-depth).circle(p.seat_d/2).extrude(depth)\n\
    \    return w.cut(core).cut(lower).cut(upper)"
  print_orientation: Flat side on bed, axle vertical, z=0 to 16. No supports in bearing
    pockets.
  use_orientation: Bench only. Bearings enter from opposite faces. In use the wheel
    would rotate about its Z axis.
- id: centre_spacer
  role: final
  material: Black PLA
  code: "def build(p):\n    length = p.wheel_width - 2*(p.bearing_width+p.bearing_recess)\n\
    \    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.bearing_bore+p.axle_clearance)/2).extrude(length)"
  print_orientation: Flat annular face on bed, z=0; nominal height 1.8 mm.
  use_orientation: Between inner rings; assembled z=7.1 to 8.9 in wheel frame. Temporary
    bench spacer only.
- id: end_spacer_head
  role: final
  material: Black PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.bearing_bore+p.axle_clearance)/2).extrude(p.end_spacer_length)"
  print_orientation: Flat annular face on bed, z=0.
  use_orientation: Against head-side bearing inner ring, assembled z=-1.9 to 0.1 in
    wheel frame.
- id: end_spacer_nut
  role: final
  material: Black PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.bearing_bore+p.axle_clearance)/2).extrude(p.end_spacer_length)"
  print_orientation: Flat annular face on bed, z=0.
  use_orientation: Against nut-side bearing inner ring, assembled z=15.9 to 17.9 in
    wheel frame.
