manual:
- n: '1'
  text: Treat this as an unloaded prototype. Secure the door independently and leave
    it out of service; do not remove a load-bearing roller from an unsupported door.
    Unknown track and bracket geometry prevent approval for installation.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print all four parts at 0.2 mm layers with 6 walls and 100% infill. Use the
    specified orientations. Do not add supports inside wheel pockets. Remove elephant
    foot and burrs carefully without enlarging the bearing seats.
  parts:
  - wheel
  - centre_spacer
  - end_spacer_head
  - end_spacer_nut
  hardware: []
  tool: Deburring tool or fine file
- n: '3'
  text: Check both bearings spin freely. Try each wheel pocket by hand. The failed
    tight coupon does not establish a usable fit. Do not hammer bearings in, force
    them with the bolt, glue a loose bearing, or proceed with a rocking fit. Adjust
    seat_d and repeat a small ring test if needed.
  parts:
  - wheel
  hardware:
  - bearings
  tool: null
- n: '4'
  text: Confirm the central shoulder touches only the bearing outer races and every
    small spacer touches only inner rings. Insert one bearing from one side, place
    centre_spacer in the middle, then insert the second bearing. Press only on the
    outer races. Both bearing faces should sit approximately 0.1 mm below the adjacent
    wheel side.
  parts:
  - wheel
  - centre_spacer
  hardware:
  - bearings
  tool: null
- n: '5'
  text: 'For bench testing ONLY, stack: M8x35 screw head, washer, end_spacer_head,
    first bearing inner ring, centre_spacer, second bearing inner ring, end_spacer_nut,
    washer, M8 nylon locknut. Keep the centre spacer aligned using the screw. Use
    the specified screw unless the existing bolt is positively verified to have suitable
    length and threads; no bracket is included in this stack.'
  parts:
  - wheel
  - centre_spacer
  - end_spacer_head
  - end_spacer_nut
  hardware:
  - bench_axle
  - bearings
  - axle_washers
  - axle_nut
  tool: null
- n: '6'
  text: Hold the screw and advance the locknut only until axial play is just removed.
    Nylon drag is not evidence that the stack is clamped. Do not apply standard M8
    tightening torque to PLA spacers. Check that the thread passes fully through the
    nylon and that both washers remain clear of the wheel and shields. Stop if spinning
    becomes harder as the nut advances.
  parts: []
  hardware:
  - bench_axle
  - axle_nut
  - axle_washers
  tool: 6 mm hex key and 13 mm wrench
- n: '7'
  text: Spin by hand on the bench only. Reject cracks, wobble, rubbing, bearing migration
    or spacer crushing. This test establishes neither load capacity nor long-term
    durability. Before an actual repair, verify track profile, bracket gap and axle
    support, door load and retention; provide a properly dimensioned rigid metal inner-ring
    spacer and evaluate the wheel under guarded load. Otherwise use a compatible replacement
    roller assembly rather than this prototype.
  parts:
  - wheel
  - centre_spacer
  hardware: []
  tool: null
