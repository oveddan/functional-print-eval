task: bearing-wheel
note: 'Plain cylindrical tread (50 x 16 mm, 1 mm chamfers), because the rail profile
  could not be measured. If your old wheel had a groove or flanges to match the track,
  tell me and I''ll add them. Pocket fit was tested with a coupon (22.3 mm seat).
  The bracket gap and bolt length are also unmeasured. The bolt must carry the load:
  the printed wheel only transfers load to the bearings. Door weight on two 608 bearings
  is fine.'
questions: []
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel about 50 mm
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel about 16 mm; check it fits your bracket gap
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: measured ~22, matches 608 datasheet 22.000
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: measured ~7, 608 nominal 7
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: M8 shank ~8 mm
  pocket_clear:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: 'diametral clearance; from coupon: +0.3 slides in, holds upside down; +0
      won''t go in'
  web_hole_clear:
    value: 2
    unit: mm
    kind: design
    source: design
    note: extra diameter on web hole so the web never touches the bolt
  edge_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    w = p.wheel_w\n    pocket_d = p.bearing_od + p.pocket_clear\n\
    \    body = cq.Workplane('XY').circle(p.wheel_od / 2).extrude(w)\n    body = body.faces('>Z').edges().chamfer(p.edge_chamfer).faces('<Z').edges().chamfer(p.edge_chamfer)\n\
    \    # pocket from bottom (bed side) and top\n    bot = cq.Workplane('XY').circle(pocket_d\
    \ / 2).extrude(p.bearing_w)\n    top = cq.Workplane('XY').workplane(offset=w -\
    \ p.bearing_w).circle(pocket_d / 2).extrude(p.bearing_w)\n    hole = cq.Workplane('XY').circle((p.bolt_d\
    \ + p.web_hole_clear) / 2).extrude(w)\n    return body.cut(bot).cut(top).cut(hole)"
  print_orientation: one flat face on the bed, axis vertical; the bearing pocket on
    the bed side is bridged by the 2 mm web (22 mm span, well under 50 mm)
  use_orientation: axis horizontal, on the M8 bolt
hardware:
- id: bearing
  ref: 608ZZ
  qty: 2
- id: washer
  ref: ISO 7089 M8
  qty: 2
joints: []
criteria:
- id: c1
  part: wheel
  feature: bottom and top bearing pockets (22.3 mm dia, 7 mm deep)
  relation: seats
  hardware: bearing
  clearance_mm: 0.3
  params:
  - bearing_od
  - pocket_clear
  - bearing_w
  check:
    method: coupon
    ref: fit-coupon
    description: Coupon showed the 22.29 mm seat accepts a 608 by hand and holds it;
      21.99 will not go in.
- id: c2
  part: wheel
  feature: central web hole (10 mm)
  relation: clears
  hardware: null
  clearance_mm: 1.0
  params:
  - bolt_d
  - web_hole_clear
  check:
    method: measure
    ref: null
    description: The M8 bolt passes through the web hole without touching.
- id: c3
  part: wheel
  feature: overall width 16 mm
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - wheel_w
  check:
    method: measure
    ref: null
    description: Check the wheel (plus a washer each side, about 3.2 mm total) fits
      between your bracket arms. If the gap is tighter, leave the washers off.
manual:
- n: '1'
  text: Print the wheel flat on the bed (PLA, 0.2 mm layers, at least 4 walls and
    25%+ infill, for strength).
  parts:
  - wheel
  hardware: []
  tool: null
- n: '2'
  text: Press one 608 bearing into each pocket, one from each face, until flush with
    the face. The fit is snug and holds by hand. Use a flat piece of wood or a vise
    and press on the outer ring only.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '3'
  text: Slide an M8 washer onto the bolt, then the wheel, then another washer. The
    washers should touch the inner rings only so the wheel spins freely. Skip the
    washers if the bracket gap is tight.
  parts:
  - wheel
  hardware:
  - washer
  tool: null
- n: '4'
  text: 'Mount the bolt in the door bracket as the old wheel was mounted and tighten.
    Spin the wheel by hand: it should turn freely without rubbing the bracket.'
  parts: []
  hardware: []
  tool: null
