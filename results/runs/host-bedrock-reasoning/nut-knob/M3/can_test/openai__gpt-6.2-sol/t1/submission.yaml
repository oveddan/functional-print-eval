task: nut-knob/M3
note: ''
questions: []
params:
  af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  nh:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bd:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  od:
    value: 20
    unit: mm
    kind: world
    source: asked
    note: ''
  fit:
    value: -0.06
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n h=3+p.nh+0.4\n r=p.od/2\n b=cq.Workplane('XY').circle(r).extrude(h)\n\
    \ for i in range(8):\n  a=i*math.pi/4\n  b=b.cut(cq.Workplane('XY').center(r*math.cos(a),r*math.sin(a)).circle(2).extrude(h))\n\
    \ d=(p.af+p.fit)/math.cos(math.pi/6)\n b=b.cut(cq.Workplane('XY').workplane(offset=3).polygon(6,d).extrude(h-3))\n\
    \ b=b.cut(cq.Workplane('XY').workplane(offset=h-0.3).polygon(6,d).workplane(offset=0.3).polygon(6,d+0.6/math.cos(math.pi/6)).loft())\n\
    \ return b.cut(cq.Workplane('XY').circle((p.bd+0.4)/2).extrude(h))"
  print_orientation: Flat face down, pocket up
  use_orientation: Bolt enters flat face
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print flat face down at 0.2 mm without supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align the flats and press the nut in squarely by thumb until it bottoms below
    the rim. Invert and lightly shake to check retention. If loose, decrease fit by
    0.05 mm and reprint; if too tight to seat by hand, increase fit by 0.05 mm and
    reprint.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Thread your M3 bolt in from the flat face. Allow more than 5.8 mm of bolt
    protrusion from the mating surface for the tip to emerge. Hand-tighten only; the
    shoulder under the nut prevents push-through.
  parts:
  - knob
  hardware:
  - nut
  tool: null
