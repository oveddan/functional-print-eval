parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n k=cq.Workplane('XY').circle(10).extrude(6)\n\
    \ for i in range(8):\n  a=i*math.pi/4\n  k=k.cut(cq.Workplane('XY').center(11*math.cos(a),11*math.sin(a)).circle(2.2).extrude(6))\n\
    \ d=(p.af+p.fit)/math.cos(math.pi/6)\n z=6-p.h-0.4\n k=k.cut(cq.Workplane('XY').workplane(offset=z).polygon(6,d).extrude(6-z))\n\
    \ k=k.cut(cq.Workplane('XY').workplane(offset=5.3).polygon(6,d).workplane(offset=0.7).polygon(6,(p.af+0.4)/math.cos(math.pi/6)).loft())\n\
    \ return k.cut(cq.Workplane('XY').circle((p.d+0.5)/2).extrude(6))"
  print_orientation: Flat base down, pocket up.
  use_orientation: Flat base toward workpiece.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print pocket up without supports. Align the nut flats and thumb-press until
    the nut bottoms below the rim. Invert and lightly tap to check retention. If loose,
    decrease fit by 0.05 mm; if too tight for hand insertion, increase fit by 0.05
    mm and reprint.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '2'
  text: Thread your M3 bolt in from the flat face and check that it exits the pocket.
    The shoulder around the clearance bore stops the nut from passing through the
    flat face.
  parts:
  - knob
  hardware:
  - nut
  tool: null
