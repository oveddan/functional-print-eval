- id: c5
  part: coupon
  feature: test hex pockets
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - coupon_af_max
  - coupon_af_step
  - coupon_count
  check:
    method: coupon
    ref: coupon
    description: The first pocket is the knob's shipping value (7.85 mm across the
      flats); if the nut drops out when the coupon is inverted, the next pocket to
      the right is the new pocket_af, 0.10 mm at a time.
manual:
- n: '1'
  text: Print coupon (PLA, 0.2 mm layers, no supports). It lies flat with six hex
    pockets opening upward; nothing overhangs and nothing bridges.
  parts:
  - coupon
  hardware: []
  tool: null
- n: '2'
  text: Lying flat as printed, long axis left-right, the pockets are 7.85, 7.75, 7.65,
    7.55, 7.45 and 7.35 mm across the flats from left to right. Start with the leftmost,
    7.85 mm - that is exactly what the knob is set to. Press your M5 hex nut into
    it, flat face up, straight down; it should take a firm push, starting in the 45
    degree flare at the mouth.
  parts:
  - coupon
  hardware:
  - nut
  tool: fingers; a light tap with a mallet handle is fine
- n: '3'
  text: Turn the coupon upside down and tap it on the bench. If the nut stays in the
    7.85 mm pocket, leave the knob as it is. If it drops out, press the nut into the
    next pocket to the right (7.75 mm) and test that one the same way. Keep moving
    right until the nut stays in, then write down that across-flats number - it is
    your pocket_af. If a pocket is too tight to press in, do not force it; use the
    pocket to its left instead.
  parts:
  - coupon
  hardware:
  - nut
  tool: null
- n: '4'
  text: Print knob with its pocket_af set to the number you wrote down (it ships at
    7.85). Change nothing else. PLA, 0.2 mm layers, no supports, flat bottom on the
    bed, hex pocket opening up.
  parts:
  - knob
  hardware: []
  tool: null
- n: '5'
  text: Press the M5 hex nut down into the knob's hex pocket from the top face, square
    to the pocket, until it bottoms out on the floor. Its top face should end up about
    0.8 mm below the knob's rim, so the nut is fully inside. A firm push by hand;
    if it feels too stiff, a light tap with a mallet handle, or warm the knob in hot
    (not boiling) water for a minute first.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '6'
  text: Turn the knob upside down and tap it. The nut must stay in place. If it falls
    out, reprint the knob with the next pocket size down from the coupon (0.10 mm
    less across the flats) and press the nut into that one.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '7'
  text: Feed the M5 bolt up through the clearance hole in the knob's underside and
    turn it into the nut by hand until the threaded tip comes out of the top of the
    knob. The bolt passes through the nut and out of the far side; the nut itself
    can never pass the floor.
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: null
- n: '8'
  text: 'To use: hold the knob and turn it by hand. The trapped nut turns with the
    knob and drives the bolt, so the joint can be tightened and released without a
    wrench.'
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: null
