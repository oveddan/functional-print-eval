task: nut-knob/M5
note: 'Resubmitted with one substantive change: the nut pocket is no longer sized
  from a nut measurement that doesn''t exist. `pocket_af` is now a directly set design
  value, 7.85 mm across the flats — 0.15 mm (0.075 per flat) smaller than the catalog-nominal
  8.00 mm nut, a firm hand press in PLA that grips by friction alone — and it is exactly
  the value of coupon A''s first pocket, so the coupon reads directly onto the knob''s
  parameter with no arithmetic.


  Unchanged: the knob is a single print, 30 mm across with 12 finger grooves, printed
  flat (bottom on the bed, hex pocket opening up) with no supports and no bridging
  anywhere. The nut presses in from the top face, bottoms out on a 6.5 mm thick floor,
  and its top face ends up 0.8 mm below the rim, so it is fully inside. The floor''s
  5.5 mm clearance hole is far smaller than the 8 mm nut, so the nut can never be
  pushed out of the far side. The M5 bolt enters that hole from below, threads through
  the nut and its threaded tip comes out of the open top. Retention when inverted
  is the pocket''s interference fit; the 45 degree flare at the mouth only eases the
  start of the press by reducing the entry interference.


  Because the fit is the only uncertain thing, coupon A now steps 7.85 down to 7.35
  mm in 0.10 mm increments — its first pocket is the knob''s shipping value, so the
  user tries that one first, and if the nut drops out when the coupon is inverted,
  moves one pocket right and types that number into the knob''s `pocket_af`. If nothing
  is loose and nothing needs forcing, the knob prints as shipped. Fallbacks are in
  the manual (light mallet tap or a minute in hot water if snug; the next pocket down
  if loose).'
questions:
- text: Which way does the bolt pass through the knob?
  answer: 'Assumed from below: the shank enters the 5.5 mm clearance hole in the knob''s
    underside (the pocket floor), threads into the nut, and the threaded tip comes
    out of the open top. The knob''s underside is flat — it does not seat a bolt head;
    the head bears on whatever is being clamped.'
- text: What holds the nut in when the knob is upside down?
  answer: The hex pocket's interference fit (pocket 0.15 mm smaller across the flats
    than a nominal nut, gripping six flats over the nut's full 4.7 mm height), backed
    up by the pocket floor so the nut can never be pushed through. No glue, no snap
    lip, no second nut. If the user's nut sits at the small end of the ISO 4032 band,
    coupon A's next pocket down fixes it by 0.10 mm steps.
- text: Why is the pocket not tapered or lipped?
  answer: A lip that would retain even a 7.64 mm nut must be about 0.2 mm per side
    smaller than even an 8.00 mm nut, which a rigid PLA pocket can only pass by yielding
    at its corners — an unverifiable risk of a cracked or unusable part. A straight
    pocket at 0.15 mm interference is the version that both presses and holds for
    a nut anywhere near nominal, and the coupon covers the rest.
- text: Which M5 bolt is listed?
  answer: ISO 4762 M5x20 as the demonstrator; any ISO 4762 M5 of 16 mm or longer brings
    the thread out of the knob's top face.
params:
  bolt_clear_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: 'Clearance hole through the pocket floor: 0.5 mm over the M5 shank. Far
      smaller than the 8 mm nut, so the nut cannot be pushed out of the far side.'
  bolt_shank_d:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 nominal shank diameter.
  coupon_af_max:
    value: 7.85
    unit: mm
    kind: design
    source: design
    note: Across flats of coupon A's first (largest) pocket, at the -X end. Deliberately
      equal to the knob's pocket_af so the coupon reads straight onto the part.
  coupon_af_step:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: 'Reduction in across flats per coupon pocket: 7.85, 7.75, 7.65, 7.55, 7.45,
      7.35 mm.'
  coupon_count:
    value: 6
    unit: mm
    kind: design
    source: design
    note: Number of test pockets in coupon A.
  coupon_h:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: 'Coupon A thickness: same 5.5 mm pocket depth and 2.5 mm floor as the knob.'
  coupon_l:
    value: 85.0
    unit: mm
    kind: design
    source: design
    note: Coupon A length.
  coupon_pitch:
    value: 13.0
    unit: mm
    kind: design
    source: design
    note: Centre-to-centre spacing of the coupon's pockets.
  coupon_w:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: Coupon A width.
  grip_flutes:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Number of vertical finger grooves around the rim.
  groove_depth:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: Depth of each finger groove; the cutter centre radius = knob_d/2 + groove_r
      - groove_depth, so the knob stays 30 mm at its lobes.
  groove_r:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: Radius of the cutter that forms each finger groove, leaving ~2.6 mm ridges.
  knob_d:
    value: 30.0
    unit: mm
    kind: design
    source: asked
    note: User asked for about 30 mm across; this is the diameter at the un-grooved
      lobes.
  knob_h:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: Knob height, chosen so the pocket floor under the nut is 6.5 mm thick while
      leaving a 12 mm tall rim to grip.
  lead_in:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Depth of the 45 degree flare at the mouth of the hex pocket; it reduces
      the entry interference so the nut starts square and by hand.
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: 'ISO 4032 M5 hex nut across the flats, catalog nominal (max 8.00, min 7.64).
      Not measured: the user could not measure their nut, so the spread is covered
      by coupon A.'
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut height; sets the pocket depth and the nut's 4.7 mm of
      gripping wall.
  pocket_af:
    value: 7.85
    unit: mm
    kind: design
    source: design
    note: 'Across flats of the knob''s hex nut pocket: 0.15 mm (0.075 per flat) smaller
      than the catalog-nominal nut, giving a press fit by hand and friction retention.
      Ships at 7.85 = coupon A''s first pocket; change only if the coupon says so.'
  pocket_recess:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Distance from the knob's top face down to the nut's top face, so the nut
      sits fully inside the knob.
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef hex_pts(af, dx=0.0):\n    # regular hexagon defined by\
    \ its width across flats, vertices at 0, 60, ... deg\n    R = af / (3 ** 0.5)\n\
    \    return [(dx + R * math.cos(math.radians(60 * i)),\n             R * math.sin(math.radians(60\
    \ * i))) for i in range(6)]\n\ndef build(p):\n    # body: plain cylinder, axis\
    \ = Z, flat bottom on the bed\n    body = cq.Workplane(\"XY\").circle(p.knob_d\
    \ / 2).extrude(p.knob_h)\n\n    # vertical finger grooves around the rim (no overhangs\
    \ anywhere)\n    ctr_r = p.knob_d / 2 + p.groove_r - p.groove_depth\n    n = int(p.grip_flutes)\n\
    \    for i in range(n):\n        a = 2 * math.pi * i / n\n        body = body.cut(\n\
    \            cq.Workplane(\"XY\")\n            .moveTo(ctr_r * math.cos(a), ctr_r\
    \ * math.sin(a))\n            .circle(p.groove_r)\n            .extrude(p.knob_h))\n\
    \n    top = p.knob_h\n    floor_z = top - (p.nut_h + p.pocket_recess)\n\n    #\
    \ hex nut pocket: straight walls, open at the top face\n    pocket = (cq.Workplane(\"\
    XY\").workplane(offset=floor_z)\n              .polyline(hex_pts(p.pocket_af)).close()\n\
    \              .extrude(top - floor_z + 0.5))\n    body = body.cut(pocket)\n\n\
    \    # 45 degree lead-in flare at the mouth of the pocket\n    lead = (cq.Workplane(\"\
    XY\").workplane(offset=top - p.lead_in)\n            .polyline(hex_pts(p.pocket_af)).close()\n\
    \            .workplane(offset=p.lead_in + 0.5)\n            .polyline(hex_pts(p.pocket_af\
    \ + 2 * (p.lead_in + 0.5))).close()\n            .loft())\n    body = body.cut(lead)\n\
    \n    # M5 clearance hole through the pocket floor, out through the bottom\n \
    \   body = body.cut(cq.Workplane(\"XY\")\n                    .circle(p.bolt_clear_d\
    \ / 2)\n                    .extrude(p.knob_h))\n\n    return body\n"
  print_orientation: Flat bottom face on the bed, knob axis vertical (Z); the hex
    pocket opens upward, so every wall is vertical or a 45 degree flare - nothing
    overhangs and there is no bridging.
  use_orientation: 'Axis vertical, hex pocket up: the nut presses in from the top
    face and the M5 bolt comes up from below through the clearance hole and out of
    the open top.'
- id: coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef hex_pts(af, dx=0.0):\n    # regular hexagon defined by\
    \ its width across flats, vertices at 0, 60, ... deg\n    R = af / (3 ** 0.5)\n\
    \    return [(dx + R * math.cos(math.radians(60 * i)),\n             R * math.sin(math.radians(60\
    \ * i))) for i in range(6)]\n\ndef build(p):\n    plate = cq.Workplane(\"XY\"\
    ).box(p.coupon_l, p.coupon_w, p.coupon_h,\n                                  \
    \  centered=(True, True, False))\n    n = int(p.coupon_count)\n    floor_z = p.coupon_h\
    \ - (p.nut_h + p.pocket_recess)\n\n    for k in range(n):\n        af = p.coupon_af_max\
    \ - k * p.coupon_af_step\n        x = -p.coupon_pitch * (n - 1) / 2.0 + k * p.coupon_pitch\n\
    \n        # hex pocket: same depth and floor as the knob\n        pocket = (cq.Workplane(\"\
    XY\").workplane(offset=floor_z)\n                  .polyline(hex_pts(af, dx=x)).close()\n\
    \                  .extrude(p.coupon_h - floor_z + 0.5))\n        plate = plate.cut(pocket)\n\
    \n        # same 45 degree lead-in flare as the knob\n        lead = (cq.Workplane(\"\
    XY\").workplane(offset=p.coupon_h - p.lead_in)\n                .polyline(hex_pts(af,\
    \ dx=x)).close()\n                .workplane(offset=p.lead_in + 0.5)\n       \
    \         .polyline(hex_pts(af + 2 * (p.lead_in + 0.5), dx=x)).close()\n     \
    \           .loft())\n        plate = plate.cut(lead)\n\n        # bolt clearance\
    \ hole through the floor\n        plate = plate.cut(cq.Workplane(\"XY\").moveTo(x,\
    \ 0)\n                          .circle(p.bolt_clear_d / 2)\n                \
    \          .extrude(p.coupon_h))\n\n    return plate\n"
  print_orientation: Flat bottom face on the bed, the six hex pockets opening upward;
    no supports needed.
  use_orientation: 'Flat, pockets up: press the nut into a pocket, then hold the coupon
    upside down and tap it to see whether that pocket holds.'
