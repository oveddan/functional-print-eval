    description: The nut presses by hand into the pocket and seats on the floor with
      its top face 0.8 mm below the knob's top face, i.e. fully inside. The pocket
      is 0.15 mm smaller across the flats than the catalog-nominal nut; coupon A steps
      the same pocket from 7.85 down to 7.35 mm so a nut anywhere in the ISO 4032
      band of 7.64-8.00 has a pocket that holds it.
- id: c2
