  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - pocket_af
  - nut_af
  - nut_h
  check:
    method: coupon
    ref: coupon
    description: 'With the knob (or the matching coupon pocket) turned upside down
      and tapped, the nut stays put: six flats grip over the nut''s full 4.7 mm height,
      with no glue and no retaining feature.'
- id: c3
