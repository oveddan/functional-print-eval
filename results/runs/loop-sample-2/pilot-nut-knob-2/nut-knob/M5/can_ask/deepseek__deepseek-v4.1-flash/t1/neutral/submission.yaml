task: nut-knob/M5
note: 'A 30 mm across-the-lobes hand knob for an M5 bolt, printed flat as one piece,
  no supports, and with no bridging anywhere (the knob axis is vertical, the hex pocket
  opens upward, and the finger grooves are vertical slots).


  The M5 hex nut presses in from the top face into a hex pocket whose across-flats
  is slightly smaller than the nut. The nut bottoms out on a 6.5 mm thick floor pierced
  by a 5.5 mm clearance hole, so: the nut sits fully inside (its top face ends up
  0.8 mm below the rim), it cannot be pushed out of the far side (a 5.5 mm hole will
  not pass an 8 mm-across-flats nut), and it is held against falling out when you
  turn the knob upside down by the pocket''s interference fit alone — no glue, no
  snap, no second nut. The M5 bolt runs through the nut and out of the far face, and
  because that hole is a straight clearance hole, the bolt can be fed from whichever
  side suits your fixture: up from the underside (shank passes the floor hole first,
  then threads into the nut, tip emerging from the open top) or down from above (threads
  down through the nut, tip emerging below).


  The one thing that could not be measured is the user''s own nut, and ISO 4032 M5
  nuts run from 7.64 to 8.00 mm across flats — a 0.36 mm band, which is several times
  the interference a press fit needs. So the pocket size is not guessed: coupon A
  prints six hex pockets in 0.10 mm steps, 7.95 down to 7.45 mm across the flats,
  which covers every legal nut combined with anywhere from no grip to a very tight
  press. The user tries the nut in each and keeps the smallest pocket that goes in
  by hand and still holds the nut when the coupon is inverted and tapped; that number
  goes straight into the knob''s pocket_af (default 7.85). The coupon has the same
  pocket depth, floor and clearance hole as the knob, and a 3 mm marker hole near
  one end so the pocket sizes can be named without depending on which way you pick
  it up.'
questions:
- text: Which way does the bolt pass through the knob?
  answer: 'Documented as from below (shank enters the 5.5 mm clearance hole in the
    underside, threads into the nut, tip comes out of the open top), but the part
    does not care: the through hole is a straight clearance hole, so feeding the bolt
    from the top face works equally well, with the head bearing on the knob''s top
    face. The knob''s underside is flat and does not seat a bolt head.'
- text: What holds the nut in when the knob is upside down?
  answer: Only the interference fit of the hex pocket walls, verified on coupon A.
    There is no glue, lip, set screw or second nut, which keeps the part a single
    print — but it means the pocket size must be taken from the coupon result rather
    than assumed, since the nut was not measurable.
- text: Which M5 bolt is listed?
  answer: ISO 4762 M5x20 as the demonstrator. M5x20 is fully threaded (b = 22 mm),
    and 16 mm is already long enough to clear the 6.5 mm floor plus the 4.7 mm nut
    and come out of the far face; longer bolts also work and just protrude further.
params:
  bolt_clear_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: 'Clearance hole straight through the pocket floor: 0.5 mm over the M5 shank,
      and far smaller than the nut, which is what traps the nut.'
  bolt_shank_d:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 nominal shank diameter.
  coupon_af_max:
    value: 7.95
    unit: mm
    kind: design
    source: design
    note: Across-flats of the coupon's largest pocket, nearest the marker-hole end.
  coupon_af_step:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: 'Reduction in across-flats from one coupon pocket to the next: 7.95, 7.85,
      7.75, 7.65, 7.55, 7.45.'
  coupon_count:
    value: 6
    unit: mm
    kind: design
    source: design
    note: Number of test pockets in coupon A; spans every ISO 4032 M5 nut (7.64-8.00)
      from a loose fit to a very tight press.
  coupon_h:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: Coupon thickness; pocket depth and floor thickness match the knob (4.7 +
      0.8 pocket, 2.5 floor).
  coupon_l:
    value: 94.0
    unit: mm
    kind: design
    source: design
    note: Coupon length; the plain end margin carries the 3 mm orientation marker
      hole.
  coupon_mark_d:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: Diameter of the through hole that marks the -X end of the coupon, so the
      pocket sizes can be named regardless of which way the plate is picked up.
  coupon_mark_inset:
    value: 4.0
    unit: mm
    kind: design
    source: design
    note: Distance from the marked end of the coupon to the centre of the marker hole.
  coupon_pitch:
    value: 13.0
    unit: mm
    kind: design
    source: design
    note: Centre-to-centre spacing of the coupon's pockets.
  coupon_w:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: Coupon width; leaves about 5 mm of wall either side of a pocket.
  grip_flutes:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Number of vertical finger grooves around the rim.
  groove_depth:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: Depth of each finger groove; cutter centre radius = knob_d/2 + groove_r
      - groove_depth = 17.3.
  groove_r:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: Radius of the cutter that forms each finger groove; gives a 5.3 mm wide
      groove with 2.6 mm ridges between.
  knob_d:
    value: 30.0
    unit: mm
    kind: design
    source: asked
    note: User asked for about 30 mm across. This is the diameter over the un-grooved
      lobes; the finger grooves are cut inside it.
  knob_h:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: Knob height, chosen so there is 6.5 mm of solid floor under the nut and
      a 12 mm rim to grip.
  lead_in:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Depth of the 45 degree flare at the mouth of the hex pocket, so the nut
      can be started square by hand.
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut, width across the flats; catalog max 8.00, min 7.64.
      The user could not measure theirs, so the whole tolerance band is covered by
      coupon A.
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut height.
  pocket_af:
    value: 7.85
    unit: mm
    kind: design
    source: design
    note: Width across flats of the knob's hex nut pocket. Default 7.85 (= 0.15 mm
      interference on a nominal 8.00 nut); replace it with the winning pocket size
      from coupon A before printing.
  pocket_recess:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: From the knob's top face down to the nut's top face, so the nut ends up
      fully inside the knob.
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef hex_pts(af, dx=0.0):\n    # regular hexagon defined by\
    \ its width across flats, one vertex on +X\n    R = af / (3 ** 0.5)\n    return\
    \ [(dx + R * math.cos(math.radians(60 * i)),\n             R * math.sin(math.radians(60\
    \ * i))) for i in range(6)]\n\ndef build(p):\n    # body: plain cylinder, axis\
    \ = Z, flat bottom on the bed\n    body = cq.Workplane(\"XY\").circle(p.knob_d\
    \ / 2).extrude(p.knob_h)\n\n    # vertical finger grooves around the rim (no overhang,\
    \ no bridge)\n    ctr_r = p.knob_d / 2 + p.groove_r - p.groove_depth\n    n =\
    \ int(p.grip_flutes)\n    for i in range(n):\n        a = 2 * math.pi * i / n\n\
    \        body = body.cut(\n            cq.Workplane(\"XY\")\n            .moveTo(ctr_r\
    \ * math.cos(a), ctr_r * math.sin(a))\n            .circle(p.groove_r)\n     \
    \       .extrude(p.knob_h))\n\n    top = p.knob_h\n    floor_z = top - (p.nut_h\
    \ + p.pocket_recess)\n\n    # hex nut pocket: straight walls, open at the top\
    \ face\n    pocket = (cq.Workplane(\"XY\").workplane(offset=floor_z)\n       \
    \       .polyline(hex_pts(p.pocket_af)).close()\n              .extrude(top -\
    \ floor_z + 0.5))\n    body = body.cut(pocket)\n\n    # 45 degree lead-in flare\
    \ at the mouth of the pocket\n    lead = (cq.Workplane(\"XY\").workplane(offset=top\
    \ - p.lead_in)\n            .polyline(hex_pts(p.pocket_af)).close()\n        \
    \    .workplane(offset=p.lead_in + 0.5)\n            .polyline(hex_pts(p.pocket_af\
    \ + 2 * (p.lead_in + 0.5))).close()\n            .loft())\n    body = body.cut(lead)\n\
    \n    # M5 clearance hole straight through the pocket floor\n    body = body.cut(cq.Workplane(\"\
    XY\")\n                    .circle(p.bolt_clear_d / 2)\n                    .extrude(p.knob_h))\n\
    \n    return body\n"
  print_orientation: Flat bottom face on the bed, knob axis vertical (Z), hex pocket
    opening upward.
  use_orientation: Axis vertical, hex pocket up. The nut presses in from the top face;
    the M5 bolt runs through the nut and out of the far face (up from below, or down
    from above - the floor hole is a straight clearance hole).
- id: coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef hex_pts(af, dx=0.0):\n    # regular hexagon defined by\
    \ its width across flats, one vertex on +X\n    R = af / (3 ** 0.5)\n    return\
    \ [(dx + R * math.cos(math.radians(60 * i)),\n             R * math.sin(math.radians(60\
    \ * i))) for i in range(6)]\n\ndef build(p):\n    plate = cq.Workplane(\"XY\"\
    ).box(p.coupon_l, p.coupon_w, p.coupon_h,\n                                  \
    \  centered=(True, True, False))\n    n = int(p.coupon_count)\n    floor_z = p.coupon_h\
    \ - (p.nut_h + p.pocket_recess)\n\n    for k in range(n):\n        af = p.coupon_af_max\
    \ - k * p.coupon_af_step\n        x = -p.coupon_pitch * (n - 1) / 2.0 + k * p.coupon_pitch\n\
    \n        # hex pocket: same depth, floor and clearance hole as the knob\n   \
    \     pocket = (cq.Workplane(\"XY\").workplane(offset=floor_z)\n             \
    \     .polyline(hex_pts(af, dx=x)).close()\n                  .extrude(p.coupon_h\
    \ - floor_z + 0.5))\n        plate = plate.cut(pocket)\n\n        # same 45 degree\
    \ lead-in flare as the knob\n        lead = (cq.Workplane(\"XY\").workplane(offset=p.coupon_h\
    \ - p.lead_in)\n                .polyline(hex_pts(af, dx=x)).close()\n       \
    \         .workplane(offset=p.lead_in + 0.5)\n                .polyline(hex_pts(af\
    \ + 2 * (p.lead_in + 0.5), dx=x)).close()\n                .loft())\n        plate\
    \ = plate.cut(lead)\n\n        # bolt clearance hole through the floor\n     \
    \   plate = plate.cut(cq.Workplane(\"XY\").moveTo(x, 0)\n                    \
    \      .circle(p.bolt_clear_d / 2)\n                          .extrude(p.coupon_h))\n\
    \n    # orientation marker: through hole naming the largest-pocket end\n    plate\
    \ = plate.cut(cq.Workplane(\"XY\")\n                      .moveTo(-(p.coupon_l\
    \ / 2 - p.coupon_mark_inset), 0)\n                      .circle(p.coupon_mark_d\
    \ / 2)\n                      .extrude(p.coupon_h))\n\n    return plate\n"
  print_orientation: Flat bottom face on the bed, hex pockets opening upward.
  use_orientation: 'Flat, pockets up: press the nut into each pocket in turn, then
    hold the coupon upside down and tap it to see which pockets hold.'
