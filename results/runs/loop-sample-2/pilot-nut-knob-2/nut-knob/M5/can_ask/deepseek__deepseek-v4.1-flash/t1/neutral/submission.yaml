manual:
- n: '1'
  text: Print coupon in PLA at 0.2 mm layers, no supports. It lies flat with the six
    hex pockets opening upward; nothing overhangs and nothing bridges.
  parts:
  - coupon
  hardware: []
  tool: null
- n: '2'
  text: Find the end of the coupon with the extra 3 mm hole through it - that is the
    big-pocket end. Lying flat on the bench, the six pockets from that end are 7.95,
    7.85, 7.75, 7.65, 7.55 and 7.45 mm across the flats.
  parts:
  - coupon
  hardware: []
  tool: null
- n: '3'
  text: Press your M5 hex nut into a pocket, flat face up, starting square in the
    45 degree flare at the mouth. Work from the big-pocket end toward the small-pocket
    end until a pocket gets too tight to push in by hand.
  parts:
  - coupon
  hardware:
  - nut
  tool: fingers (a light tap with a mallet handle is fine)
- n: '4'
  text: For the pockets the nut went into by hand, turn the coupon pocket-down and
    tap the edge on the bench. The nut should stay put. The winning pocket is the
    smallest one that the nut went into by hand and that still holds the nut when
    inverted; note its across-flats size. (The nut can never fall through - the 5.5
    mm floor hole is far smaller than the nut.)
  parts:
  - coupon
  hardware:
  - nut
  tool: null
- n: '5'
  text: Open the knob part and set pocket_af to the size you noted (it ships at 7.85).
    Print knob in PLA at 0.2 mm layers, no supports, flat bottom on the bed, hex pocket
    opening upward.
  parts:
  - knob
  hardware: []
  tool: null
- n: '6'
  text: Press the M5 hex nut down into the knob's hex pocket from the top face, square
    to the pocket, until it bottoms on the floor. Its top face should finish about
    0.8 mm below the knob's rim, fully inside.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '7'
  text: 'Turn the knob upside down and tap it: the nut must stay in. If it drops out,
    reprint the knob with the next pocket size down from the coupon (0.10 mm less
    across the flats).'
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '8'
  text: Run the M5 bolt through the nut. Feeding it up from below, the shank passes
    the clearance hole in the underside first, then threads into the nut, and the
    threaded tip comes out of the open top. Feeding it down from above, it threads
    down through the nut and the tip comes out of the underside; the head then bears
    on the knob's top face.
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: null
- n: '9'
  text: 'To use: hold the knob and turn it by hand. The trapped nut turns with the
    knob and drives the bolt in or out, so you can tighten the joint without a wrench.'
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: null
