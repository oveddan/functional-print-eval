task: nut-knob/M3
note: 'One printed knob, 20 mm across, that holds an ISO 4032 M3 nut. Print the knob
  and the coupon in PLA at 0.2 mm layers, no supports: both are modelled bed-face-down
  and every hole widens going up (0.2 mm-wide bed edge = the flat far face, which
  is the knob''s bearing face).


  WHAT IT IS: a gripped nut. The far face (the flat Ø20 face with the small Ø3.4 hole)
  goes against your work. From that face: Ø3.4 hole -> 2.5 mm wall -> hexagonal pocket
  -> Ø6.6 x 3.2 mouth counterbore, open at the mouth.


  NUT RETENTION (no glue). The hex pocket''s across-flats is 0.08 mm smaller than
  the nut''s 5.5, so the nut presses into the pocket by hand and is held by friction
  on its six flats; the pocket is 2.8 mm deep for the 2.4 mm nut, so the nut sits
  fully inside, 3.6 mm behind the mouth. The wall between the nut and the far face
  is pierced only by the Ø3.4 hole — far smaller than the nut''s 5.5 across-flats
  and 6.35 across-corners — so the nut cannot be pushed out of the far face however
  hard you push. The mouth counterbore has to be wider than the nut''s 6.35 across-corners
  so the nut can be pressed through it into the pocket.


  LOAD PATH WHEN TIGHTENING. The nut bottoms on the roof of its pocket (an annulus
  about 23 mm2 around the bolt hole) — that is the strongest surface in the part —
  and that load crosses the 2.5 mm wall into the flat far face and onto the work.
  Torque is carried by the pocket''s six flats in shear (a form fit, not just friction).
  The nut therefore presses into solid material when you tighten, not against the
  thin lip at the mouth; the lip plus friction only has to hold the nut against gravity.


  THE BOLT. It enters through the Ø3.4 hole in the far face, threads through the nut,
  and comes out the mouth side: its tip arrives in the Ø6.6 x 3.2 counterbore, which
  hides up to 3.2 mm of thread. Classic hand-knob arrangement: bolt through the work,
  knob screwed onto the protruding thread, flat far face bearing on the work, grip
  the fluted rim and turn. The bolt''s 5.5 head cannot enter the knob, so if it comes
  up to the far face it simply bears on it.


  CAVEAT ON THE HARDWARE NUMBERS: I could not get the nut or the bolt measured (no
  calipers to hand), so nut_af/nut_h and the screw dimensions are catalog values.
  nut_pocket_af is therefore a guess (5.5 - 0.08) and the print''s hole tolerance
  will dominate it. That is exactly why the coupon is included: it tests 5.30 / 5.40
  / 5.50 / 5.60 across-flats at the knob''s real 2.8 mm engagement depth, so the press
  fit can be dialled in for this printer and this nut before committing to the knob.
  If none of the four pockets does both jobs, move the range by another 0.05.'
questions: []
params:
  knob_od:
    value: 20.0
    unit: mm
    kind: design
    source: asked
    note: 'user: hand knob about 20 mm across — diameter across the grip lobes'
  grip_count:
    value: 12
    unit: count
    kind: design
    source: design
    note: vertical finger grooves; vertical walls, no supports
  grip_groove_r:
    value: 1.8
    unit: mm
    kind: design
    source: design
    note: cutter radius; the valleys come out about 16.4 mm across
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across-flats; could not be measured
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height; could not be measured
  nut_ac:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: across-corners, = nut_af / cos30 = 5.5/0.86603
  screw_shank_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3 shank
  screw_head_d:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: socket head diameter; > bolt_hole_d, so the head cannot enter the knob
  screw_head_h:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: socket head height
  screw_len:
    value: 16.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3x16, fully threaded (threaded-to-head max 20). Any fully threaded
      M3 works; a shorter one keeps the tip inside the Ø6.6 counterbore
  bolt_hole_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: = screw_shank_d + 0.4 entry clearance in the far face; far smaller than
      nut_af, which is what stops the nut leaving the far face
  mouth_cb_d:
    value: 6.6
    unit: mm
    kind: design
    source: design
    note: must exceed nut_ac (6.35) so the nut can be pressed through it into the
      pocket; doubles as relief for the bolt tip
  mouth_cb_depth:
    value: 3.2
    unit: mm
    kind: design
    source: design
    note: hides up to 3.2 mm of protruding bolt thread and gives the nut a clear entry
  nut_pocket_af:
    value: 5.42
    unit: mm
    kind: design
    source: design
    note: 'press fit: nut_af - 0.08. Set this from the coupon test before printing
      the knob'
  nut_pocket_depth:
    value: 2.8
    unit: mm
    kind: design
    source: design
    note: = nut_h + 0.4, so the nut is fully inside the knob; also the coupon's pocket
      depth
  ceiling_t:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: wall between the nut pocket roof and the far bearing face; pierced only
      by bolt_hole_d
  coupon_len:
    value: 56.0
    unit: mm
    kind: design
    source: design
    note: coupon blank length
  coupon_w:
    value: 16.0
    unit: mm
    kind: design
    source: design
    note: coupon blank width
  coupon_pitch:
    value: 13.0
    unit: mm
    kind: design
    source: design
    note: spacing of the four test pockets
  coupon_floor_t:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: floor under the test pockets; the nut's 6.35 across-corners cannot pass
      it
  coupon_push_hole_d:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: '> a 4 mm pusher so a stuck nut can be pushed back out; < nut_af so the
      nut still stops on the floor'
  coupon_af_1:
    value: 5.3
    unit: mm
    kind: design
    source: design
    note: 'tightest pocket: 0.20 mm interference on the nut''s 5.5 across-flats'
  coupon_af_2:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: 0.10 mm interference
  coupon_af_3:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: nominal, zero interference
  coupon_af_4:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: 'loosest pocket: 0.10 mm clearance, for an undersized print'
parts:
- id: knob
  role: final
  material: PLA (high-speed, black)
  code: "import math\n\n\ndef build(p):\n    # Print frame: z = 0 is the bed = the\
    \ knob's FAR face (the flat bearing face\n    # with the Ø3.4 hole). Every hole\
    \ widens going up, so nothing overhangs and\n    # no supports are needed:\n \
    \   #   z = 0            .. ceiling_t                          far wall, Ø3.4\
    \ hole\n    #   z = ceiling_t    .. +nut_pocket_depth                  hex nut\
    \ pocket\n    #   z = ...          .. H (open)                           mouth\
    \ counterbore\n    H = p.ceiling_t + p.nut_pocket_depth + p.mouth_cb_depth\n \
    \   R = p.knob_od / 2.0\n\n    body = cq.Workplane(\"XY\").circle(R).extrude(H)\n\
    \n    # 12 vertical finger grooves (vertical walls: no supports, no bridges)\n\
    \    n = int(round(p.grip_count))\n    for i in range(n):\n        a = 2.0 * math.pi\
    \ * i / n\n        body = body.cut(\n            cq.Workplane(\"XY\")\n      \
    \      .center(R * math.cos(a), R * math.sin(a))\n            .circle(p.grip_groove_r)\n\
    \            .extrude(H)\n        )\n\n    # bolt entry hole through the far wall\
    \ (far smaller than the nut: it can't pass)\n    body = body.cut(cq.Workplane(\"\
    XY\").circle(p.bolt_hole_d / 2.0).extrude(H))\n\n    # hex pocket for the ISO\
    \ 4032 M3 nut; across-flats = nut_pocket_af (press fit)\n    rv = (p.nut_pocket_af\
    \ / math.cos(math.radians(30.0))) / 2.0\n    pts = [(rv * math.cos(math.radians(60.0\
    \ * i)),\n            rv * math.sin(math.radians(60.0 * i))) for i in range(6)]\n\
    \    body = body.cut(\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.ceiling_t)\n\
    \        .polyline(pts).close()\n        .extrude(p.nut_pocket_depth)\n    )\n\
    \n    # mouth counterbore: the nut is pressed through this into the pocket, and\
    \ the\n    # protruding tip of the bolt ends up in it\n    body = body.cut(\n\
    \        cq.Workplane(\"XY\")\n        .workplane(offset=p.ceiling_t + p.nut_pocket_depth)\n\
    \        .circle(p.mouth_cb_d / 2.0)\n        .extrude(p.mouth_cb_depth)\n   \
    \ )\n    return body\n"
  print_orientation: 'Far face on the bed: z = 0 is the flat Ø20 face with the small
    Ø3.4 hole (the bearing face that goes against the work); the hex pocket and the
    Ø6.6 mouth counterbore open upward at z = 8.5. No supports.'
  use_orientation: Far face (small Ø3.4 hole) against the work as the bearing face;
    the fluted rim is gripped and turned; the mouth counterbore faces the hand, and
    the bolt's protruding tip arrives in it.
- id: coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "import math\n\n\ndef build(p):\n    # Print frame: z = 0 is the bed = the\
    \ thin floor with the push-out holes;\n    # the four hex test pockets open upward.\n\
    \    T = p.coupon_floor_t + p.nut_pocket_depth\n    body = cq.Workplane(\"XY\"\
    ).rect(p.coupon_len, p.coupon_w).extrude(T)\n\n    afs = [p.coupon_af_1, p.coupon_af_2,\
    \ p.coupon_af_3, p.coupon_af_4]\n    x0 = -p.coupon_pitch * (len(afs) - 1) / 2.0\n\
    \    for i, af in enumerate(afs):\n        x = x0 + i * p.coupon_pitch\n     \
    \   # push-out hole in the floor\n        body = body.cut(\n            cq.Workplane(\"\
    XY\").center(x, 0.0)\n            .circle(p.coupon_push_hole_d / 2.0)\n      \
    \      .extrude(p.coupon_floor_t + 0.2)\n        )\n        # hex test pocket:\
    \ same depth as the knob's nut pocket, different across-flats\n        rv = (af\
    \ / math.cos(math.radians(30.0))) / 2.0\n        pts = [(x + rv * math.cos(math.radians(60.0\
    \ * k)),\n                rv * math.sin(math.radians(60.0 * k))) for k in range(6)]\n\
    \        body = body.cut(\n            cq.Workplane(\"XY\").workplane(offset=p.coupon_floor_t)\n\
    \            .polyline(pts).close()\n            .extrude(p.nut_pocket_depth +\
    \ 0.2)\n        )\n\n    # small nub marking the end nearest the tightest (5.30)\
    \ pocket\n    body = body.union(\n        cq.Workplane(\"XY\").workplane(offset=T)\n\
    \        .center(x0 - 5.5, 6.5)\n        .circle(1.0)\n        .extrude(1.5)\n\
    \    )\n    return body\n"
  print_orientation: Thin floor (with the four Ø4.5 push-out holes) on the bed at
    z = 0; the four hex test pockets open upward. No supports (each pocket widens
    toward the top of the print).
  use_orientation: Flat on the bench, pockets up. Press the M3 nut into each pocket
    from above, flats aligned; test that it holds when the coupon is turned upside
    down; push a stuck nut back out from below through the Ø4.5 hole with a 4 mm pusher.
hardware:
- id: nut_m3
  ref: ISO 4032 M3
  qty: 1
- id: screw_m3
  ref: ISO 4762 M3x16
  qty: 1
joints:
- id: j_screw
  fastener: screw_m3
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: Ø3.4 bolt entry hole in the far bearing face (z = 0)
    role: clearance
  - part: knob
    feature: hex nut pocket (across-flats = nut_pocket_af, 2.8 deep)
    role: nut_pocket
  - part: knob
    feature: mouth counterbore Ø6.6 x 3.2 (relief for the bolt's protruding tip)
    role: clearance
  nut: null
  external: null
- id: j_nut
  fastener: nut_m3
  axis_origin:
  - 0.0
  - 0.0
  - 2.5
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: pocket roof at z = 2.5 (the nut's bearing face when you tighten) and
      the six pocket flats that carry the torque
    role: nut_pocket
  nut: null
  external: null
criteria:
- id: c1_nut_press_fit
  part: knob
  feature: hex nut pocket (six flats, across-flats = nut_pocket_af, 2.8 mm deep, roof
    at z = 2.5)
  relation: engages
  hardware: nut_m3
  clearance_mm: -0.08
  params:
  - nut_pocket_af
  - nut_af
  - nut_pocket_depth
  - nut_h
  check:
    method: coupon
    ref: coupon
    description: Print the coupon, then press the M3 nut into each of the four test
      pockets in turn, starting at the end marked by the nub (5.30). Keep the tightest
      across-flats that presses in by hand AND holds the nut when the coupon is turned
      upside down and tapped. Set nut_pocket_af to that value before printing the
      knob.
- id: c2_nut_fully_inside
  part: knob
  feature: nut pocket + the Ø6.6 mouth counterbore the nut passes through on its way
    in
  relation: contains
  hardware: nut_m3
  clearance_mm: null
  params:
  - nut_pocket_depth
  - nut_h
  - mouth_cb_d
  - nut_ac
  check:
    method: measure
    ref: null
    description: Pocket depth 2.8 > nut height 2.4, so the nut ends up fully inside
      the knob, 3.6 mm behind the mouth; mouth_cb_d 6.6 > the nut's 6.35 across-corners,
      so the nut can be pressed through the counterbore into the pocket.
- id: c3_nut_cannot_leave_far_face
  part: knob
  feature: 'far wall beyond the nut: 2.5 mm thick, pierced only by the Ø3.4 hole'
  relation: faces
  hardware: nut_m3
  clearance_mm: null
  params:
  - ceiling_t
  - bolt_hole_d
  - nut_af
  - nut_ac
  check:
    method: measure
    ref: null
    description: The only opening beyond the nut is the Ø3.4 hole (and the 2.5 mm
      wall around it); both are far smaller than the nut's 5.5 across-flats / 6.35
      across-corners, so the nut has no path out of the far face however hard it is
      pushed.
- id: c4_bolt_through_and_out
  part: knob
  feature: Ø3.4 bolt entry hole in the far face + hex pocket + Ø6.6 x 3.2 mouth counterbore
  relation: clears
  hardware: screw_m3
  clearance_mm: null
  params:
  - bolt_hole_d
  - screw_shank_d
  - mouth_cb_d
  - mouth_cb_depth
  - screw_head_d
  - screw_len
  check:
    method: measure
    ref: null
    description: The bolt enters the Ø3.4 hole in the far face (clearance on the 3.0
      shank), threads through the nut, and its tip comes out on the mouth side into
      the Ø6.6 x 3.2 counterbore, which hides up to 3.2 mm of thread. The 5.5 head
      cannot enter the Ø3.4 hole, so if it comes up to the knob it simply bears on
      the far face.
- id: c5_grip_od
  part: knob
  feature: 'finger grip: 12 vertical grooves, outer lobes'
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - knob_od
  - grip_count
  - grip_groove_r
  check:
    method: measure
    ref: null
    description: 'Outer diameter across the lobes ≈ 20 mm as asked (about 16.4 mm
      across the valleys): a two-finger hand knob.'
- id: c6_coupon_pockets
  part: coupon
  feature: four hex test pockets, across-flats coupon_af_1..4, each 2.8 mm deep over
    a Ø4.5 push-out hole
  relation: contains
  hardware: nut_m3
  clearance_mm: null
  params:
  - coupon_af_1
  - coupon_af_2
  - coupon_af_3
  - coupon_af_4
  - nut_pocket_depth
  - coupon_push_hole_d
  check:
    method: measure
    ref: null
    description: Pockets span 0.20 mm interference (5.30), 0.10 mm interference (5.40),
      nominal (5.50) and 0.10 mm clearance (5.60) around the nut's 5.5 across-flats,
      all at the knob's real 2.8 mm engagement depth; the Ø4.5 floor hole lets a 4
      mm pusher free a stuck nut.
manual:
- n: '1'
  text: 'Print `coupon` in PLA at 0.2 mm layers exactly as modelled, no supports:
    the thin floor with the four Ø4.5 holes sits on the bed and the four hex pockets
    open upward.'
  parts:
  - coupon
  hardware: []
  tool: Bambu Lab X1C
- n: '2'
  text: 'Press the M3 hex nut into the test pocket nearest the small nub on the top
    face — that end is the tightest (5.30 across-flats). Align the nut''s flats with
    the pocket''s flats and push with your thumb. Then try the next pockets along
    the row: 5.40, 5.50, 5.60. If one will not go in by hand, do not force it.'
  parts:
  - coupon
  hardware:
  - nut_m3
  tool: null
- n: '3'
  text: 'Test each pocket you filled: turn the coupon upside down and tap it on the
    bench. The nut must stay in. Note the across-flats of the tightest pocket that
    both pressed in by hand AND holds the nut upside down — that is your press fit.
    If a nut is stuck in a pocket that was too tight, push it back out from below
    with a 4 mm pusher through the Ø4.5 hole.'
  parts:
  - coupon
  hardware:
  - nut_m3
  tool: 4 mm pusher (blunt drill shank, hex key)
- n: '4'
  text: 'Set the knob''s `nut_pocket_af` to the across-flats you noted (default 5.42,
    i.e. 0.08 mm of interference) and print `knob` in PLA at 0.2 mm layers exactly
    as modelled, no supports: the flat far face with the small Ø3.4 hole on the bed,
    the wide Ø6.6 counterbore facing up.'
  parts:
  - knob
  hardware: []
  tool: Bambu Lab X1C
- n: '5'
  text: 'Press the M3 hex nut into the knob: feed it into the wide Ø6.6 counterbore
    at the mouth (it passes straight through), line its flats up with the pocket''s
    flats, and push it home with your thumb until it stops against the roof of the
    pocket. The nut then sits fully inside, about 3.6 mm behind the mouth.'
  parts:
  - knob
  hardware:
  - nut_m3
  tool: null
- n: '6'
  text: 'Turn the knob upside down and tap it on the bench: the nut must stay in without
    glue. If it falls out the pocket is too loose — reprint the knob with a smaller
    `nut_pocket_af`, or re-check the coupon. If you cannot press it in at all, go
    the other way (the pocket is too tight).'
  parts:
  - knob
  hardware:
  - nut_m3
  tool: null
- n: '7'
  text: 'Thread the M3 bolt in from the flat far face: push its tip into the small
    Ø3.4 hole and turn it into the nut. The tip comes out of the mouth side into the
    Ø6.6 counterbore — up to 3.2 mm of thread hides in there. The bolt''s head cannot
    enter the knob (5.5 head vs 3.4 hole), so it stops at the far face; that far face
    is also the knob''s bearing face.'
  parts:
  - knob
  hardware:
  - screw_m3
  tool: 2.5 mm hex key (only to start it; the knob is meant to be turned by hand)
- n: '8'
  text: 'To use it: put the bolt through your work (head on the far side, as normal),
    thread the knob onto the protruding end with its flat far face toward the work,
    and grip the fluted rim to turn it tight. The trapped nut turns with the knob,
    so the knob winds down the bolt and its far face clamps the work. Turn the other
    way to release.'
  parts:
  - knob
  hardware:
  - screw_m3
  tool: null
- n: '9'
  text: 'Checks with the hardware fitted: with the bolt out, push the nut hard from
    the mouth side — it must not come out of the far face, because the only hole there
    is Ø3.4. With the bolt in, the head stays outside the knob and the thread runs
    right through the nut and out the other side.'
  parts:
  - knob
  hardware:
  - nut_m3
  - screw_m3
  tool: null
