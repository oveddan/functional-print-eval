criteria:
- id: c1_nut_press_fit
  part: knob
  feature: hex nut pocket (six flats, across-flats = nut_pocket_af, 2.8 mm deep, open
    at the counterbore floor)
  relation: engages
  hardware: nut_m3
  clearance_mm: -0.15
  params:
  - nut_pocket_af
  - nut_af
  - print_err_mm
  - nut_pocket_depth
  - nut_h
  check:
    method: coupon
    ref: coupon
    description: Print the new coupon and press the M3 nut into each of the four pockets
      in turn (5.65 / 5.70 / 5.75 / 5.80). The knob already carries the 5.65 value;
      if a different pocket is the one that presses in by hand and holds the nut upside
      down, change nut_pocket_af to that number and reprint the knob.
- id: c2_nut_fully_inside
  part: knob
  feature: nut pocket (2.8 mm deep, floor 3.2 mm behind the open face) and the Ø6.6
    counterbore the nut passes through
  relation: contains
  hardware: nut_m3
  clearance_mm: null
  params:
  - nut_pocket_depth
  - nut_h
  - head_pocket_d
  - nut_ac
  check:
    method: measure
    ref: null
    description: Pocket depth 2.8 > nut height 2.4, and head_pocket_d 6.6 > nut across-corners
      6.35 so the nut can be pressed in through the counterbore; the nut therefore
      ends up fully inside the knob, recessed behind the open face.
- id: c3_nut_cannot_leave_far_side
  part: knob
  feature: 'far end of the nut pocket: 2.5 mm ceiling wall pierced by the Ø3.4 bolt
    hole'
  relation: faces
  hardware: nut_m3
  clearance_mm: null
  params:
  - ceiling_t
  - bolt_hole_d
  - nut_af
  - nut_ac
  check:
    method: measure
    ref: null
    description: The only opening beyond the nut is Ø3.4, far smaller than the nut's
      5.5 across-flats / 6.35 across-corners, so the nut has no path out of the far
      face however hard it is pushed.
- id: c4_bolt_through_and_out
  part: knob
  feature: Ø3.4 bolt hole through the ceiling plus the Ø6.6 x 3.2 counterbore
  relation: clears
  hardware: screw_m3
  clearance_mm: null
  params:
  - bolt_hole_d
  - screw_shank_d
  - head_pocket_d
  - head_pocket_depth
  - screw_head_d
  - screw_head_h
  - screw_len
  check:
    method: measure
    ref: null
    description: 'Drop the M3x16 into the counterbore and turn it into the nut: the
      Ø3.4 hole clears the 3.0 shank, the tip comes out of the far face by about 7.7
      mm, and the 5.5 x 3.0 head sits in the Ø6.6 x 3.2 recess 0.2 mm behind the open
      face.'
- id: c5_grip_od
  part: knob
  feature: 'finger grip: 12 vertical grooves; outer lobes'
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - knob_od
  - grip_count
  - grip_groove_r
  check:
    method: measure
    ref: null
    description: Outer diameter across the lobes ≈ 20 mm as asked (across the valleys
      ≈ 16.4 mm), so it is a two-finger hand knob.
- id: c6_coupon_pockets
  part: coupon
  feature: four hex test pockets, across-flats coupon_af_1..4, each 2.8 mm deep over
    a Ø4.5 push-out hole
  relation: contains
  hardware: nut_m3
  clearance_mm: null
  params:
  - coupon_af_1
  - coupon_af_2
  - coupon_af_3
  - coupon_af_4
  - nut_pocket_depth
  - coupon_push_hole_d
  check:
    method: measure
    ref: null
    description: Pockets are 5.65 / 5.70 / 5.75 / 5.80 across-flats against the nut's
      5.5, all at the knob's real 2.8 mm engagement depth — the window just above
      the 5.60 that already pressed in on this printer. The Ø4.5 floor hole lets a
      4 mm pusher free a stuck nut.
manual:
- n: '1'
  text: 'Print `knob` in PLA at 0.2 mm layers exactly as modelled, no supports: the
    flat far face with the small Ø3.4 hole on the bed, the wide Ø6.6 counterbore and
    the hex pocket facing up. Its nut pocket is now 5.65 mm across-flats (it was 5.42)
    — that is 0.15 mm bigger than the nut, which is what your coupon said this printer
    needs.'
  parts:
  - knob
  hardware: []
  tool: Bambu Lab X1C
- n: '2'
  text: Press the M3 hex nut into the hex pocket, entering from the wide Ø6.6 counterbore
    (the nut passes straight through it). Line the nut's flats up with the pocket's
    flats and push with your thumb; the last couple of millimetres should need a firm
    push. It seats 2.8 mm deep, so the nut disappears inside the knob.
  parts:
  - knob
  hardware:
  - nut_m3
  tool: null
- n: '3'
  text: 'Turn the knob upside down and tap it on the bench. The nut must stay in,
    held by the six flats alone — no glue. If it simply drops in and falls straight
    back out, the pocket came out oversized: reprint with `nut_pocket_af` at 5.60.
    If it will not go in at all by hand, go up to 5.70.'
  parts:
  - knob
  hardware:
  - nut_m3
  tool: null
- n: '4'
  text: 'Drop the ISO 4762 M3x16 bolt into the Ø6.6 counterbore tip-first and turn
    it into the nut by hand. Keep turning: the thread runs through the nut and about
    7 mm of it comes out of the far face. The head comes to rest in the counterbore,
    0.2 mm inside the open face, and it cannot fall back out because the 5.5 head
    is wider than the pocket''s 5.4 across-flats inscribed width.'
  parts:
  - knob
  hardware:
  - screw_m3
  tool: 2.5 mm hex key (optional, only to start the bolt)
- n: '5'
  text: 'To use it: grip the 20 mm grooved rim, poke the bolt''s protruding tip into
    the hole you are clamping, and turn the knob. The trapped nut turns with the knob,
    so the knob winds itself along the bolt and clamps. Turn the other way to release.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '6'
  text: 'Optional check (about 10 minutes of printing): print `coupon` in PLA at 0.2
    mm layers as modelled — thin floor with the four Ø4.5 holes on the bed, the four
    hex pockets opening upward, tightest (5.65) nearest the little nub. Press the
    nut into each pocket in turn and turn the coupon upside down. If 5.65 presses
    in by hand and holds, your knob was already right; if another pocket is clearly
    better, that pocket''s across-flats is the number to put in `nut_pocket_af` before
    reprinting the knob. Free a stuck nut by pushing it out from below through the
    Ø4.5 hole.'
  parts:
  - coupon
  hardware:
  - nut_m3
  tool: Bambu Lab X1C
