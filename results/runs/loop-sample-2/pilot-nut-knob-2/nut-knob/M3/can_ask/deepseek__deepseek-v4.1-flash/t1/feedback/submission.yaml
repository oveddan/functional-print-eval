task: nut-knob/M3
note: 'CHANGE FROM WHAT YOU PRINTED: the knob''s hex nut pocket is now 5.65 mm across-flats
  instead of 5.42 mm, and the coupon now tests 5.65 / 5.70 / 5.75 / 5.80 instead of
  5.30 / 5.40 / 5.50 / 5.60. Nothing else about the knob changed.


  Why: your coupon told me the numbers I need. A pocket designed at 5.60 (which on
  paper is 0.10 mm of clearance on a 5.5 mm nut) still really struggled, and 5.50
  would not go in at all. So this printer is making the hex pockets roughly 0.15 mm
  tight — the walls come out undersized by about the same amount on a feature this
  size. That is normal for FDM, and it means the pocket must be drawn BIGGER than
  the nut rather than smaller. 5.65 across-flats is 0.15 mm bigger than the nut''s
  5.5, which after the ~0.15 mm the printer takes back lands right on a light thumb
  press with the nut still gripped.


  What to print:

  1. `knob` (PLA, 0.2 mm layers, no supports) — this is the part you want. Its pocket
  is 5.65 across-flats. Its far face (the flat Ø20 face with the small Ø3.4 hole,
  the face the bolt tip exits) goes on the bed; the wide Ø6.6 counterbore and the
  hex pocket face up.

  2. Optional, 10 minutes, worth it if you want certainty: `coupon`, which now has
  the same 2.8 mm-deep pockets at 5.65 / 5.70 / 5.75 / 5.80 (tightest nearest the
  little nub). Press the nut into each and turn it upside down. If 5.65 presses in
  by hand and holds, you are done — your knob is already that size. If 5.65 is still
  too tight and, say, 5.70 or 5.75 is the nice one, the ONLY number to change is `nut_pocket_af`
  on the knob; set it to that value and reprint the knob. If 5.65 simply drops in
  and the nut falls straight back out, go the other way to 5.60.


  Assembly: press the M3 hex nut into the hex pocket from the wide Ø6.6 counterbore
  (the nut passes right through it), flats lined up with the pocket''s flats, thumb
  pressure over the last couple of millimetres. It ends up fully inside — the pocket
  is 2.8 mm deep for a 2.4 mm nut, so it sits recessed and cannot be pushed out of
  the far face, because the only opening beyond it is the Ø3.4 bolt hole. Turn the
  knob upside down and tap it: it stays, no glue, held by the six flats. Then drop
  the ISO 4762 M3x16 in tip-first from the same side and turn it into the nut until
  about 7 mm of thread pokes out of the far face; the 5.5 head comes to rest in the
  Ø6.6 recess 0.2 mm inside the open face, and it cannot fall back out either, because
  5.5 is wider than the pocket''s 5.4-across-flats inscribed width.


  Everything prints support-free in this orientation: with the far face on the bed,
  every hole either widens toward the top of the print (Ø3.4 -> hex pocket -> Ø6.6)
  or is a plain vertical wall, including the 12 finger grooves.


  Fit numbers, for the record: the pocket across-flats 5.65 (design, = nut 5.5 + 0.15
  inferred printer undersize); pocket depth 2.8 (= nut height 2.4 + 0.4); counterbore
  Ø6.6 x 3.2 deep (head 5.5 x 3.0, and big enough that the 6.35 across-corners nut
  passes through it); far wall 2.5 thick with a Ø3.4 hole; knob Ø20 across the grip
  lobes, 8.5 tall.'
questions: []
params:
  bolt_hole_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: = screw_shank_d + 0.4 clearance; far smaller than nut_af, which is what
      stops the nut leaving the far face
  ceiling_t:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: wall between the nut pocket and the far face, pierced by bolt_hole_d
  coupon_af_1:
    value: 5.65
    unit: mm
    kind: design
    source: design
    note: 'tightest coupon pocket, nearest the nub: at the person''s print offset
      this is the intended light press fit'
  coupon_af_2:
    value: 5.7
    unit: mm
    kind: design
    source: design
    note: coupon pocket, one step looser
  coupon_af_3:
    value: 5.75
    unit: mm
    kind: design
    source: design
    note: coupon pocket, two steps looser
  coupon_af_4:
    value: 5.8
    unit: mm
    kind: design
    source: design
    note: loosest coupon pocket
  coupon_floor_t:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: thin floor under the test pockets; the nut's 6.35 across-corners cannot
      pass
  coupon_len:
    value: 56.0
    unit: mm
    kind: design
    source: design
    note: coupon blank length
  coupon_pitch:
    value: 13.0
    unit: mm
    kind: design
    source: design
    note: spacing of the four test pockets along the coupon
  coupon_push_hole_d:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: '> a 4 mm pusher so a stuck nut can be pushed back out; < nut_af so the
      nut still stops on the floor'
  coupon_w:
    value: 16.0
    unit: mm
    kind: design
    source: design
    note: coupon blank width
  grip_count:
    value: 12
    unit: count
    kind: design
    source: design
    note: vertical finger grooves around the rim; vertical walls, no supports
  grip_groove_r:
    value: 1.8
    unit: mm
    kind: design
    source: design
    note: radius of the cutter cylinder centred on the rim; valleys end up ~16.4 mm
      across
  head_pocket_d:
    value: 6.6
    unit: mm
    kind: design
    source: design
    note: must be >= nut_ac (6.35) so the nut can be pressed in through it; leaves
      0.55 mm around the 5.5 head
  head_pocket_depth:
    value: 3.2
    unit: mm
    kind: design
    source: design
    note: = screw_head_h + 0.2, so the head sits fully inside, 0.2 mm behind the open
      face
  knob_od:
    value: 20.0
    unit: mm
    kind: design
    source: asked
    note: 'user: hand knob about 20 mm across — this is the diameter across the grip
      lobes'
  nut_ac:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: across-corners, = nut_af / cos30 = 5.5/0.86603
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across-flats; person could not measure it, catalog value used
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height
  nut_pocket_af:
    value: 5.65
    unit: mm
    kind: design
    source: design
    note: 'CHANGED from 5.42 to 5.65 after the coupon print: = nut_af + print_err_mm.
      Single number to adjust if the new coupon points elsewhere'
  nut_pocket_depth:
    value: 2.8
    unit: mm
    kind: design
    source: design
    note: = nut_h + 0.4, so the nut is fully inside the knob and recessed from the
      open face; also the coupon's pocket depth
  print_err_mm:
    value: 0.15
    unit: mm
    kind: world
    source: guessed
    note: 'amount this printer leaves a hex pocket tight, inferred from the person''s
      coupon: 5.60 (0.10 clearance on paper) still really struggled and 5.50 would
      not go in at all. Drives nut_pocket_af = nut_af + print_err_mm'
  screw_head_d:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3 socket head diameter
  screw_head_h:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3 socket head height
  screw_len:
    value: 16.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3x16, fully threaded (threaded-to-head max 20). Head underside
      sits 8.3 mm from the far face, so the tip leaves the far face by ~7.7 mm
  screw_shank_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3 shank
parts:
- id: knob
  role: final
  material: PLA (high-speed, black)
  code: "import math\n\n\ndef build(p):\n    # Print frame: z = 0 is the bed = the\
    \ knob's FAR face (the face the bolt tip exits).\n    # Going up, every hole widens\
    \ (Ø3.4 -> hex pocket -> Ø6.6), so nothing overhangs.\n    H = p.ceiling_t + p.nut_pocket_depth\
    \ + p.head_pocket_depth\n    R = p.knob_od / 2.0\n\n    # knob body\n    body\
    \ = cq.Workplane(\"XY\").circle(R).extrude(H)\n\n    # 12 vertical finger grooves\
    \ (vertical walls: printable, no supports)\n    n = int(round(p.grip_count))\n\
    \    for i in range(n):\n        a = 2.0 * math.pi * i / n\n        body = body.cut(\n\
    \            cq.Workplane(\"XY\")\n            .center(R * math.cos(a), R * math.sin(a))\n\
    \            .circle(p.grip_groove_r)\n            .extrude(H)\n        )\n\n\
    \    # bolt shank hole through the far wall (smaller than the nut: nut can never\
    \ pass)\n    body = body.cut(cq.Workplane(\"XY\").circle(p.bolt_hole_d / 2.0).extrude(H))\n\
    \n    # hex pocket for the ISO 4032 M3 nut, across-flats = nut_pocket_af\n   \
    \ # (= nut_af + print_err_mm, so it lands on a light press fit on this printer)\n\
    \    rv = (p.nut_pocket_af / math.cos(math.radians(30.0))) / 2.0  # across-corners\
    \ / 2\n    pts = [(rv * math.cos(math.radians(60.0 * i)),\n            rv * math.sin(math.radians(60.0\
    \ * i))) for i in range(6)]\n    body = body.cut(\n        cq.Workplane(\"XY\"\
    )\n        .workplane(offset=p.ceiling_t)\n        .polyline(pts).close()\n  \
    \      .extrude(p.nut_pocket_depth)\n    )\n\n    # counterbore for the bolt head,\
    \ open at the top: big enough for the nut to be pressed through\n    body = body.cut(\n\
    \        cq.Workplane(\"XY\")\n        .workplane(offset=p.ceiling_t + p.nut_pocket_depth)\n\
    \        .circle(p.head_pocket_d / 2.0)\n        .extrude(p.head_pocket_depth)\n\
    \    )\n    return body\n"
  print_orientation: 'Far face on the bed: z = 0 is the flat Ø20 face pierced by the
    small Ø3.4 hole (the face the bolt tip exits); the hex nut pocket and the Ø6.6
    counterbore open upward at z = 8.5. No supports.'
  use_orientation: Held in the hand with the far face (where the threaded tip sticks
    out) pointing at the workpiece and the wide Ø6.6 counterbore facing the hand;
    the nut is pressed in from the counterbore side and the bolt is dropped in from
    that same side.
- id: coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "import math\n\n\ndef build(p):\n    # Print frame: z = 0 is the bed = the\
    \ coupon's thin floor (with the push-out holes).\n    T = p.coupon_floor_t + p.nut_pocket_depth\n\
    \    L = p.coupon_len\n    W = p.coupon_w\n    body = cq.Workplane(\"XY\").box(L,\
    \ W, T, centered=(False, True, False))\n\n    afs = [p.coupon_af_1, p.coupon_af_2,\
    \ p.coupon_af_3, p.coupon_af_4]\n    x0 = (L - p.coupon_pitch * (len(afs) - 1))\
    \ / 2.0\n    for i, af in enumerate(afs):\n        x = x0 + i * p.coupon_pitch\n\
    \        # push-out hole in the floor\n        body = body.cut(\n            cq.Workplane(\"\
    XY\").center(x, 0.0)\n            .circle(p.coupon_push_hole_d / 2.0)\n      \
    \      .extrude(p.coupon_floor_t + 0.2)\n        )\n        # hex test pocket:\
    \ same depth as the knob's nut pocket, different across-flats\n        rv = (af\
    \ / math.cos(math.radians(30.0))) / 2.0\n        pts = [(x + rv * math.cos(math.radians(60.0\
    \ * k)),\n                rv * math.sin(math.radians(60.0 * k))) for k in range(6)]\n\
    \        body = body.cut(\n            cq.Workplane(\"XY\")\n            .workplane(offset=p.coupon_floor_t)\n\
    \            .polyline(pts).close()\n            .extrude(p.nut_pocket_depth +\
    \ 0.2)\n        )\n\n    # small nub marking the end nearest the tightest (5.65)\
    \ pocket\n    body = body.union(\n        cq.Workplane(\"XY\").workplane(offset=T)\n\
    \        .center(x0 - 4.5, 6.0)\n        .circle(1.0)\n        .extrude(1.5)\n\
    \    )\n    return body\n"
  print_orientation: Thin floor with the four Ø4.5 push-out holes on the bed (z =
    0); the four hex test pockets open upward. No supports (each pocket widens toward
    the top of the print).
  use_orientation: Flat on the bench, pockets up. Press the M3 nut into each pocket
    from above, flats aligned; test retention; push a stuck nut back out from below
    through the Ø4.5 hole with a 4 mm pusher.
