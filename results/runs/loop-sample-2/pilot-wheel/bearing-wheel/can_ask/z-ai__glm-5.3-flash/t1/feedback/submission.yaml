task: bearing-wheel
note: 'Redesigned after the coupon results. What failed: the flat roof over the coupon
  pocket was a 4.8 mm annular overhang that drooped into the pocket (loops, tangles,
  partly closed hole) and blocked the bearing - the old pocket also had zero depth
  tolerance. New wheel: a plain tube, OD 50 x 16 wide, with a through-bore and a 45
  degree cone waist at mid-height. There are no overhangs anywhere - only rings and
  45 degree cones - so the droop failure cannot recur. Each 608 presses in from an
  end and seats on its cone with its face 0.25 mm recessed. Clamp: bolt head - washer
  - bracket - washer - race face ... race face - washer - lock nut; the three ISO
  7089 M8 washers (OD 16) drop inside the 22.05 bore mouths and grip only the inner
  races, and tightening locks the wheel axially between the two cone seats while it
  spins freely on the bearings. The little spacer part is gone: the 1.5 mm gap between
  the race faces never needs closing. Bore target 22.05: your coupon printed a 22.0
  target at 21.99, so this should come out ~22.04 - light slip fit; sand if tight,
  one CA drop if loose. Kit bolt M8x40 clamps brackets up to ~10.7 mm thick with up
  to ~9 mm of bolt past the nut; your own bolt is ideal if it is the old axle (under-head
  = bracket thickness + ~29 mm). Assumptions still to eyeball before final assembly:
  flat track floor (no raised rib), plain pass-through bracket hole, and side clearance
  for the wheel in the channel.'
questions: []
params:
  bearing_id:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: nominal 8.0 matches M8 bolt; owner's reading 7.94
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: catalog
    note: nominal; the 21.22 caliper reading was jaw-pinched, nominal 22.0 used
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: nominal width, not measured
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8; owner's spare bolt shank measured ~8 mm and is a drop-in substitute
      if long enough
  bolt_len:
    value: 40
    unit: mm
    kind: hardware
    source: catalog
    note: covers bracket thickness 2-10.7 mm with up to ~9 mm of bolt past the lock
      nut
  bore_d:
    value: 22.05
    unit: mm
    kind: design
    source: design
    note: 'owner''s coupon printed a 22.0 target at 21.99, so this should print ~22.04:
      light slip fit over the 21.99 bearing; sand if tight, CA glue if loose'
  bracket_t:
    value: 3
    unit: mm
    kind: world
    source: guessed
    note: not measured; only affects the bolt-length check, covered by M8x40 up to
      10.7 mm
  cone_h:
    value: 0.75
    unit: mm
    kind: design
    source: design
    note: '45 deg cone: radial step (22.05-20.55)/2 = 0.75 matches cone height, so
      the cones print fully supported'
  locknut_h:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8
  seat_recess:
    value: 0.25
    unit: mm
    kind: design
    source: design
    note: bearing face sits 0.25 below each wheel face so the washers grip only the
      steel race
  washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8, qty 3
  waist_d:
    value: 20.55
    unit: mm
    kind: design
    source: design
    note: bore_d - 2 x cone_h = 20.55; stops the bearings at mid-height and takes
      the clamp load
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: as reported by owner ('about 50 mm across')
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: as reported by owner ('about 16 mm wide')
parts:
- id: wheel
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    wheel = cq.Workplane(\"XY\").circle(p.wheel_od / 2.0).extrude(p.wheel_w)\n\
    \    z1 = p.bearing_w + p.seat_recess          # 7.25 lower cone start\n    z2\
    \ = z1 + p.cone_h                        # 8.00 waist plane (min dia)\n    z3\
    \ = z2 + p.cone_h                        # 8.75 upper cone end\n    # lower bore:\
    \ bearing A seat\n    wheel = wheel.cut(\n        cq.Workplane(\"XY\").circle(p.bore_d\
    \ / 2.0).extrude(z1))\n    # lower 45 deg cone: bore_d -> waist_d (prints fully\
    \ supported)\n    wheel = wheel.cut(\n        cq.Workplane(\"XY\").workplane(offset=z1).circle(p.bore_d\
    \ / 2.0)\n        .workplane(offset=p.cone_h).circle(p.waist_d / 2.0).loft())\n\
    \    # upper 45 deg cone: waist_d -> bore_d\n    wheel = wheel.cut(\n        cq.Workplane(\"\
    XY\").workplane(offset=z2).circle(p.waist_d / 2.0)\n        .workplane(offset=p.cone_h).circle(p.bore_d\
    \ / 2.0).loft())\n    # upper bore: bearing B seat\n    wheel = wheel.cut(\n \
    \       cq.Workplane(\"XY\").workplane(offset=z3).circle(p.bore_d / 2.0)\n   \
    \     .extrude(p.wheel_w - z3))\n    return wheel"
  print_orientation: flat face on the bed, wheel axis vertical (z=0 face down, as
    modeled)
  use_orientation: axis horizontal on the bolt, tread rolling on the track
- id: coupon_bearing_fit
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    z1 = p.bearing_w + p.seat_recess   # 7.25\n    c = cq.Workplane(\"\
    XY\").circle(17.0).extrude(z1 + p.cone_h)   # 8.0 tall\n    c = c.cut(cq.Workplane(\"\
    XY\").circle(p.bore_d / 2.0).extrude(z1))\n    c = c.cut(\n        cq.Workplane(\"\
    XY\").workplane(offset=z1).circle(p.bore_d / 2.0)\n        .workplane(offset=p.cone_h).circle(p.waist_d\
    \ / 2.0).loft())\n    return c"
  print_orientation: flat face on the bed, bore opening at z=0 (as modeled)
  use_orientation: hand test only
hardware:
- id: bearings_608
  ref: 608ZZ
  qty: 2
- id: bolt_m8
  ref: ISO 4762 M8x40
  qty: 1
- id: washer_m8
  ref: ISO 7089 M8
  qty: 3
- id: locknut_m8
  ref: ISO 10511 M8
  qty: 1
joints:
- id: axle
  fastener: bolt_m8
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel
    feature: bolt passes through both inner-race bores and the 20.55 waist
    role: clearance
  - part: wheel
    feature: 'bracket-side inner-race face 0.25 recessed in the bore mouth: washer
      w2 bears it'
    role: washer
  - part: wheel
    feature: 'outboard inner-race face 0.25 recessed: washer w3 bears it under the
      lock nut'
    role: washer
  - part: wheel
    feature: '45 deg cone seats at z=7.25 and z=8.75: outer races bear the cones and
      clamp the wheel axially between them'
    role: washer
  nut: locknut_m8
  external: door hanger bracket bolt hole (assumed plain pass-through; head + washer
    on the door side clamp the bracket between head and race stack)
criteria:
- id: bore_press_fit
  part: wheel
  feature: through-bore 22.05, bearing seated 0.25 recessed on the cone
  relation: engages
  hardware: bearings_608
  clearance_mm: null
  params:
  - bore_d
  - bearing_od
  check:
    method: coupon
    ref: coupon_bearing_fit
    description: Bore must take the 608 with firm hand pressure and seat on the cone;
      verify on the new coupon (no roof to droop this time)
- id: bolt_through_races
  part: wheel
  feature: inner-race bores
  relation: clears
  hardware: bolt_m8
  clearance_mm: null
  params:
  - bearing_id
  - bolt_d
  check:
    method: coupon
    ref: coupon_bearing_fit
    description: Thread crests must pass through the 8 mm bearing bore; push the bolt
      through the pressed bearing on the coupon
- id: cone_retains_wheel
  part: wheel
  feature: 45 deg cone seats at z=7.25 and z=8.75 clamp the wheel axially between
    the outer races
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - bore_d
  - waist_d
  - cone_h
  - seat_recess
  - bearing_w
  - wheel_w
  check:
    method: none
    ref: null
    description: 'At assembly: with washers snugged on both race faces, the wheel
      must not slide along the bolt - the cone seats carry it'
- id: washer_bears_race_only
  part: wheel
  feature: race faces recessed 0.25 inside both bore mouths
  relation: seats
  hardware: washer_m8
  clearance_mm: null
  params:
  - bore_d
  - washer_t
  check:
    method: none
    ref: null
    description: Washer OD 16 < bore 22.05, so it descends into the bore mouth and
      bears only the steel race face, never the plastic face ring
- id: bolt_reach
  part: wheel
  feature: clamped stack between bolt head and lock nut
  relation: supports
  hardware: bolt_m8
  clearance_mm: null
  params:
  - bolt_len
  - bracket_t
  - washer_t
  - bearing_w
  - locknut_h
  check:
    method: none
    ref: null
    description: Under-head length >= bracket_t + 3x1.6 washers + 15.5 between race-face
      planes + 8 lock nut + ~1 protrusion = bracket_t + 29.3; M8x40 covers bracket_t
      up to ~10.7 mm
- id: tread_matches_track
  part: wheel
  feature: flat tread 50 x 16 wide
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - wheel_w
  check:
    method: none
    ref: null
    description: Matches the old wheel; verify against the track before rehanging.
      NOT valid if the track has a raised center rib
manual:
- n: '1'
  text: Print coupon_bearing_fit first (PLA, flat face down as modeled, 3+ perimeters).
    This new coupon has no overhang roof - the drooped roof is what blocked your first
    coupon's bearing.
  parts:
  - coupon_bearing_fit
  hardware: []
  tool: null
- n: '2'
  text: 'Coupon test: press a 608 into the bore from the flat face - firm push or
    a light tap with a block; it stops on the 45 degree cone with its face 0.25 mm
    below the surface. Push the M8 bolt through the bearing bore, add a washer and
    the lock nut, and snug them: the inner race must clamp to the bolt while the OUTER
    race still spins freely. If the bearing won''t press in, open the bore with 30
    seconds of rolled sandpaper; if it slides in loosely, plan on one drop of superglue
    around each bearing at step 4.'
  parts:
  - coupon_bearing_fit
  hardware:
  - bearings_608
  - bolt_m8
  - washer_m8
  - locknut_m8
  tool: null
- n: '3'
  text: 'Print the wheel: flat face down exactly as modeled; 4+ perimeters and at
    least 60% infill (it carries the door). The bore prints as plain rings plus two
    45 degree cones - no bridges, no overhangs.'
  parts:
  - wheel
  hardware: []
  tool: null
- n: '4'
  text: 'Press one bearing into each end of the wheel: support the wheel on a ring
    or socket and tap them home with a wood block until each bearing stops on its
    cone, face 0.25 mm recessed. Add a small drop of superglue around each bearing
    rim now if the coupon fit was loose.'
  parts:
  - wheel
  hardware:
  - bearings_608
  tool: null
- n: '5'
  text: 'Dry-run on the bolt (no bracket yet): bolt head -> washer -> wheel (the bore
    swallows the washer until it sits on the bracket-side race face) -> washer ->
    lock nut. Hold the bolt with a 6 mm Allen key and tighten until the washers just
    grip the race faces, then a small extra tug - no more (the bearings carry this
    axial load like a skateboard axle does). Spin the wheel: it must turn freely and
    quietly, and the wheel must not slide along the bolt.'
  parts:
  - wheel
  hardware:
  - bolt_m8
  - washer_m8
  - locknut_m8
  tool: null
- n: '6'
  text: 'Install through the door bracket: head -> washer -> bracket hole -> washer
    -> wheel -> washer -> lock nut, tightened exactly as in step 5. The bolt tip sticks
    out up to ~9 mm past the lock nut - confirm it can''t touch the track wall or
    floor.'
  parts:
  - wheel
  hardware:
  - bolt_m8
  - washer_m8
  - locknut_m8
  tool: null
- n: '7'
  text: 'Before rehanging the door: confirm the track floor is flat and the 50 x 16
    wheel sits in the channel with side clearance like the old one. If the track has
    a raised center rib, stop - the tread needs a groove and this wheel must not be
    forced onto it.'
  parts:
  - wheel
  hardware: []
  tool: null
- n: '8'
  text: 'Variant: if the bracket hole is threaded (bolt screws in), you need a fully
    threaded M8 bolt of about engagement + 27 mm (your own bolt if it qualifies -
    the kit socket screw''s 28 mm of thread is only enough for ~1 mm engagement).
    Then: bracket face -> washer -> wheel -> washer -> lock nut; set ride height,
    then tighten. Also: if your own M8 bolt is the old axle, it is the ideal length
    - use it instead of the kit screw whenever its under-head length is about bracket
    thickness + 29 mm.'
  parts:
  - wheel
  hardware:
  - bolt_m8
  - washer_m8
  - locknut_m8
  tool: null
