    note: ISO 7089 M8, qty 2 (head side, nut side)
  web_hole_d:
    value: 12.4
    unit: mm
    kind: design
    source: design
    note: clears the 11.6 spacer so the web is never clamped
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
