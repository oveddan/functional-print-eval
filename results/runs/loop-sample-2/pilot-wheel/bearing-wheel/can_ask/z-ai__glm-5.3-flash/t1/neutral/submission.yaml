manual:
- n: '1'
  text: Print coupon_bearing_fit first (PLA, flat face down as modeled, 3+ perimeters).
  parts:
  - coupon_bearing_fit
  hardware: []
  tool: null
- n: '2'
  text: 'Coupon test: press a 608 bearing into the coupon pocket — firm thumb pressure
    or a light tap with a block, ending flush with the surface. Push the M8 bolt through
    the bore (threads pass with slight drag; if a smooth shank section feels snug,
    rotate while pushing). Slide the thrust_disc over the bolt, add a washer and the
    lock nut, and snug them: the inner race must clamp to the bolt while the OUTER
    race still spins freely. If the bearing drops in too easily, plan on a drop of
    superglue in the wheel pockets at step 4; if it won''t go in, open the pocket
    a touch with a rolled strip of sandpaper.'
  parts:
  - coupon_bearing_fit
  - thrust_disc
  hardware:
  - bearings_608
  - bolt_m8
  - washer_m8
  - locknut_m8
  tool: null
- n: '3'
  text: Print the wheel (flat face down as modeled; 4+ perimeters and at least 60%
    infill — it carries the door), the race_spacer (standing on end; a small brim
    helps) and the thrust_disc (flat on the bed).
  parts:
  - wheel
  - race_spacer
  - thrust_disc
  hardware: []
  tool: null
- n: '4'
  text: 'Press one bearing into each face of the wheel: support the wheel rim on a
    ring or socket so the middle isn''t loaded, and tap them home with a wood block
    until each bearing sits flush with its wheel face. Add a small drop of superglue
    around each pocket rim now if the coupon fit was loose.'
  parts:
  - wheel
  hardware:
  - bearings_608
  tool: null
- n: '5'
  text: 'Dry-run (no bracket): slide a washer onto the bolt against the head, then
    the thrust_disc. Hold the wheel with its bracket-side face toward the bolt head
    and start the tip into that bearing''s bore; push until the tip pokes into the
    middle, then drop the race_spacer over the tip — it falls through the center hole
    and rests on the far bearing. Push the bolt the rest of the way so the wheel''s
    face seats on the disc and the tip exits the other side. Add the second washer
    and the lock nut; hold the bolt with a 6 mm Allen key and tighten only until the
    washers just grip the race faces — the spacer gets pulled square between the races
    automatically. Do not crush: spin the wheel, it must turn freely and quietly,
    and the races must not slide on the bolt.'
  parts:
  - wheel
  - race_spacer
  - thrust_disc
  hardware:
  - bolt_m8
  - washer_m8
  - locknut_m8
  tool: null
- n: '6'
  text: 'Install on the door: unscrew the nut and slide the wheel stack off (retrieve
    the spacer from a pocket). Poke the bolt through the bracket hole from the door
    side with the washer under the head, slide the disc onto the tip, then rebuild
    exactly as in step 5 with the bracket between washer and disc. The disc covers
    bracket holes up to about 20 mm; the M8x40 bolt covers brackets up to about 10
    mm thick — thicker, and you should use your own M8 bolt with an under-head length
    of at least bracket thickness + 30 mm. Confirm the bolt tip (up to ~9 mm past
    the nut on thin brackets) can''t foul the track wall or floor.'
  parts:
  - wheel
  - race_spacer
  - thrust_disc
  hardware:
  - bolt_m8
  - washer_m8
  - locknut_m8
  tool: null
- n: '7'
  text: 'Before rehanging the door: confirm the track floor is flat — this wheel has
    no groove — and that the 50 x 16 wheel sits in the channel with side clearance
    like the old one. If the track has a raised center rib, stop: the tread needs
    a groove and this wheel must not be forced onto it.'
  parts:
  - wheel
  hardware: []
  tool: null
- n: '8'
  text: 'Variant: if the bracket hole turns out to be threaded (bolt screws in), you
    need a fully threaded M8 bolt of about engagement + 27 mm — the kit socket screw''s
    threads won''t reach for a meaningful engagement, but your own bolt may qualify.
    Order: bracket face → disc → wheel → spacer → washer → lock nut; set ride height,
    then tighten.'
  parts:
  - wheel
  - race_spacer
  - thrust_disc
  hardware:
  - bolt_m8
  - washer_m8
  - locknut_m8
  tool: null
- n: '9'
  text: Rehang the door and roll. Check now and then that the lock nut stays snug
    and the tread isn't wearing a flat spot; the sealed 608 bearings need no maintenance.
  parts:
  - wheel
  hardware: []
  tool: null
