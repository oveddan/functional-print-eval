task: bearing-wheel
note: 'Reviewed and corrected before this resubmission. Concept: printed wheel 50
  x 16 (matches the old wheel) with BOTH 608 bearings pressed in face-to-face (7 +
  7 mm). The M8 bolt passes through the bearing bores; the lock nut clamps the two
  INNER races to the bolt, so the wheel spins on the bearings instead of on the bolt
  threads. Changes from the first draft: (1) added a printed thrust disc (20 x 1.2)
  between the bracket and the bracket-side race — the bracket face never touches the
  wheel face (they would otherwise be coplanar and drag), and it covers bracket holes
  up to about 20 mm, which a 16 mm washer could not; (2) washers reduced to two (head
  side, nut side); (3) the race spacer cannot be slid on after the wheel is on the
  bolt (11.6 OD won''t pass an 8 mm bore) — the manual now drops it into a pocket
  before the bolt goes through, and the clamp pulls it square; (4) verified the M8x40
  gives full 8 mm lock-nut thread engagement for bracket thickness up to ~11 mm, with
  up to ~9 mm of bolt tip past the nut on thin brackets. Remaining assumptions: track
  floor is flat (no groove in the tread), bracket hole is a plain pass-through, your
  own bolt is a drop-in substitute if its under-head length is bracket thickness +
  ~30 mm. Print the coupon first to calibrate the bearing press fit.'
questions: []
params:
  bearing_id:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: nominal 8.0 matches M8 bolt; owner's reading 7.94
  bearing_od:
