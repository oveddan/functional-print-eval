manual:
- n: '1'
  text: 'Print the coupon flat, no supports. Three checks: (a) a bearing slips into
    the bore marked 21.4 with light finger pressure; (b) press the bearing against
    the little lip tab with your thumb - it should flex and snap back against the
    bearing''s face without cracking; this is exactly how firm the wheel''s lips will
    feel; (c) the M8x50 socket-cap screw slips through a bearing''s bore and the bearing
    spins freely on the smooth shank - if it is stiff, a few strokes of fine emery
    cloth on the shank will free it.'
  parts:
  - coupon
  hardware:
  - bearing-608
  - axle-bolt
  tool: null
- n: '2'
  text: Print 1 wheel per broken roller - flat, the z=0 face (a snap-lip mouth) on
    the bed, no supports, 3-4 wall loops for strength. Print 3 thrust washers and
    1 press plate (an assembly aid, not part of the finished roller).
  parts:
  - wheel
  - thrust_washer
  - press_plate
  hardware: []
  tool: null
- n: '3'
  text: 'First bearing, wheel as it comes off the bed (that mouth up): drop a bearing
    into the open mouth - it stops with its rim held by the near lip. Push it steadily
    straight down about 7 mm with your thumb; you will feel the lip gripping the whole
    way, then the bearing suddenly lets go and drops onto the far ledge with a click.
    It is now seated ~7 mm down and cannot fall out.'
  parts:
  - wheel
  hardware:
  - bearing-608
  tool: null
- n: '4'
  text: 'Second bearing: turn the wheel over so the other mouth faces up. Drop the
    bearing in - it stops at the near lip. Push it through that lip (~1 mm, a firm
    click); it then free-falls ~6 mm inside the bore, and its rim engages the far
    lip: give the last ~1 mm a firm push and it seats onto the first bearing, its
    face ending ~0.8 mm below flush. Check both bearings spin freely with a finger
    through the bore. If a lip ever feels too hard for thumbs, use the backup press:
    press plate against the wheel''s far face, M8x50 screw tip-first up through the
    plate and bore with its head under the plate, then thrust washer + M8 washer +
    plain M8 nut over the tip, and tighten until the bearing pulls home (the threads
    will lightly score the bearing bore as they pass - cosmetic only, the wheel runs
    on the smooth shank).'
  parts:
  - wheel
  hardware:
  - bearing-608
  tool: null
- n: '5'
  text: 'Offer the axle to the roller bracket still on the door. (a) Plain opening
    >= 8.5 mm: pass the screw through from the track side, washer under the head on
    the bracket face. (b) Threaded M8 socket: screw in only 4-6 mm so the wheel lands
    on smooth shank, or drill the socket out to 8.5 mm and use it as a plain hole.
    (c) Opening smaller than 8.5 mm: drill it to 8.5 mm. Your own M8 bolt (shank measured
    ~8 mm) replaces the supplied screw if at least 30 mm can protrude past the bracket
    face with at least 17 mm of smooth shank where the wheel will sit - threads under
    the bearings would damage them.'
  parts: []
  hardware:
  - axle-bolt
  - axle-washer
  tool: 8.5 mm drill bit (only if the bracket opening is undersized)
- n: '6'
  text: Slide the wheel onto the axle (either flat face outward), then a printed thrust
    washer with its face against the bearing, an M8 washer, and the M8 nyloc. Tighten
    until the axial play just disappears and the wheel still spins freely by flicking
    it; back off an eighth of a turn if it drags. The third thrust washer is a spare,
    or use it under the bolt head if the bracket opening is much bigger than the bolt.
  parts:
  - wheel
  - thrust_washer
  hardware:
  - axle-bolt
  - axle-washer
  - axle-nyloc
  tool: null
- n: '7'
  text: Hang the door and roll it. The wheel is 50 x 16 like the old one, so ride
    height should be unchanged; take up any small height error at the bracket if it
    has adjustment.
  parts: []
  hardware: []
  tool: null
