task: bearing-wheel
note: 'Assumptions: the bolt is M8 and long enough to pass through both bracket arms,
  wheel and washers. I used M8x40 as a placeholder, so use your own bolt. I couldn''t
  get the bracket gap, so check that the wheel (16 mm) plus two 1.6 mm washers (about
  19.2 mm) fits between the arms. If it doesn''t, leave out the washers and check
  the arms don''t rub. The tread is flat PLA, which is hard and may be noisy on a
  metal track. You can fit a rubber O-ring or TPU tire if you want it quieter. PLA
  may creep under a heavy door, so use PETG if you have it.'
questions:
- text: What is the gap inside the bracket where the wheel sits? I need to know it's
    at least about 19.2 mm (wheel plus two washers).
  answer: null
- text: Does the old wheel have a groove or crown on its rim to match the track?
  answer: null
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel about 50 mm across
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel about 16 mm wide
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: user measured about 22; matches 608 nominal 22.0
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: user measured about 7; 608 nominal 7
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 bore 8.0
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: M8 bolt
  pocket_clear:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: diametral clearance added to bearing OD for a press fit in PLA; tune with
      the coupon
  pocket_chamfer:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: lead-in chamfer at each pocket mouth; also cancels elephant foot on the
      bed-side pocket
  web_bore:
    value: 13.5
    unit: mm
    kind: design
    source: design
    note: hole through the centre web; clears the bearing inner race (about 12 to
      12.5 OD) and the spacer, while the web still supports the outer race (ID about
      19)
  spacer_od:
    value: 11
    unit: mm
    kind: design
    source: design
    note: contacts the inner races only; stays inside web_bore
  spacer_clear:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: diametral clearance of spacer ID on the bolt
  spacer_extra:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: spacer is this much longer than the web so tightening always clamps the
      inner races, even if the bearings are a bit under 7 mm wide
  washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 thickness; lifts the bracket arms off the wheel and outer races
  coupon_t:
    value: 3
    unit: mm
    kind: design
    source: design
    note: thickness of the fit test ring
  coupon_od:
    value: 32
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: wheel
  role: final
  material: PLA (black), 4 walls, 25% gyroid infill
  code: "def build(p):\n    pocket_d = p.bearing_od + p.pocket_clear\n    r = pocket_d\
    \ / 2\n    c = p.pocket_chamfer\n    w = cq.Workplane('XY').circle(p.wheel_od/2).extrude(p.wheel_w)\n\
    \    bottom = cq.Workplane('XY').circle(r).extrude(p.bearing_w)\n    top = cq.Workplane('XY').workplane(offset=p.wheel_w\
    \ - p.bearing_w).circle(r).extrude(p.bearing_w)\n    bore = cq.Workplane('XY').circle(p.web_bore/2).extrude(p.wheel_w)\n\
    \    cone_b = cq.Workplane('XY').add(cq.Solid.makeCone(r + c, r, c, cq.Vector(0,\
    \ 0, 0), cq.Vector(0, 0, 1)))\n    cone_t = cq.Workplane('XY').add(cq.Solid.makeCone(r,\
    \ r + c, c, cq.Vector(0, 0, p.wheel_w - c), cq.Vector(0, 0, 1)))\n    return w.cut(bottom).cut(top).cut(bore).cut(cone_b).cut(cone_t)\n"
  print_orientation: flat, one flat face on the bed, axle axis vertical (z)
  use_orientation: axle horizontal, rolling on the door track
- id: spacer
  role: final
  material: PLA (black)
  code: "def build(p):\n    web = p.wheel_w - 2*p.bearing_w\n    return (cq.Workplane('XY').circle(p.spacer_od/2).circle((p.bolt_d\
    \ + p.spacer_clear)/2).extrude(web + p.spacer_extra))\n"
  print_orientation: flat on the bed, axis vertical
  use_orientation: sits in the wheel's centre bore between the two bearing inner races
    on the bolt
- id: fit_coupon
  role: coupon
  material: PLA (black)
  code: "def build(p):\n    r = (p.bearing_od + p.pocket_clear) / 2\n    c = p.pocket_chamfer\n\
    \    ring = cq.Workplane('XY').circle(p.coupon_od/2).circle(r).extrude(p.coupon_t)\n\
    \    cone = cq.Workplane('XY').add(cq.Solid.makeCone(r + c, r, c, cq.Vector(0,\
    \ 0, 0), cq.Vector(0, 0, 1)))\n    return ring.cut(cone)\n"
  print_orientation: flat on the bed
  use_orientation: 'test only: press one bearing in to check the fit'
hardware:
- id: bearing
  ref: 608ZZ
  qty: 2
- id: bolt
  ref: ISO 4762 M8x40
  qty: 1
- id: washer
  ref: ISO 7089 M8
  qty: 2
- id: locknut
  ref: ISO 10511 M8
  qty: 1
joints:
- id: axle
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - -1.6
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel
    feature: bearing pockets and centre bore (bolt passes through the bearing inner
      races)
    role: clearance
  - part: spacer
    feature: bore
    role: clearance
  - part: wheel
    feature: face at the bolt head side (washer between this face and the bracket
      arm)
    role: washer
  nut: locknut
  external: null
criteria:
- id: c1
  part: wheel
  feature: bearing pockets (both)
  relation: contains
  hardware: null
  clearance_mm: 0.1
  params:
  - bearing_od
  - pocket_clear
  - bearing_w
  - pocket_chamfer
  check:
    method: coupon
    ref: fit_coupon
    description: Print the coupon first. A 608 bearing should press in with firm thumb
      pressure and not fall out. If loose, set pocket_clear to 0; if too tight, set
      it to 0.2.
- id: c2
  part: spacer
  feature: bore
  relation: clears
  hardware: null
  clearance_mm: 0.2
  params:
  - bolt_d
  - spacer_clear
  check:
    method: measure
    ref: null
    description: Bolt slides through spacer freely.
- id: c3
  part: spacer
  feature: outer surface
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - spacer_od
  - web_bore
  check:
    method: measure
    ref: null
    description: Spacer sits inside the web bore without touching the wheel.
- id: c4
  part: spacer
  feature: end faces
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - wheel_w
  - bearing_w
  - spacer_extra
  check:
    method: measure
    ref: null
    description: Spacer is about 2.2 mm long, slightly longer than the 2 mm web gap,
      so tightening the nut clamps both inner races.
- id: c5
  part: wheel
  feature: centre web shelf
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - bearing_w
  - wheel_w
  - web_bore
  check:
    method: measure
    ref: null
    description: Both bearings seat against the web shelf and sit about flush with
      the wheel faces.
- id: c6
  part: wheel
  feature: side faces
  relation: clears
  hardware: null
  clearance_mm: 1.6
  params:
  - washer_t
  check:
    method: measure
    ref: null
    description: With a washer between each bracket arm and the bearing inner race,
      the wheel faces are held about 1.6 mm off the arms, so the wheel does not rub.
manual:
- n: '1'
  text: Print the fit coupon (fit_coupon) first; it takes a few minutes. Press one
    608 bearing into it from the chamfered (bed-side) face. It should need firm thumb
    pressure and then stay put. If it falls out, set pocket_clear to 0 and reprint;
    if you can't press it in, set it to 0.2.
  parts:
  - fit_coupon
  hardware:
  - bearing
  tool: null
- n: '2'
  text: Print the wheel and the spacer flat on the bed, 4 walls, about 25% infill.
    No supports are needed.
  parts:
  - wheel
  - spacer
  hardware: []
  tool: null
- n: '3'
  text: Press one bearing into each side of the wheel until it seats against the centre
    web. Push squarely using a flat block of wood over the bearing. Don't hammer on
    the inner race.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '4'
  text: Drop the spacer into the wheel's centre between the two bearings, lined up
    with the bearing bores.
  parts:
  - wheel
  - spacer
  hardware: []
  tool: null
- n: '5'
  text: Put the bolt through one bracket arm, then a washer, then the wheel (through
    both bearings and the spacer), then the second washer, then the other bracket
    arm. Fit the lock nut. The washers must touch only the bearing inner races, not
    the wheel body.
  parts:
  - wheel
  - spacer
  hardware:
  - bolt
  - washer
  - locknut
  tool: 13 mm spanner and 6 mm hex key
- n: '6'
  text: Tighten until the wheel has no side play but still spins freely by hand. Rehang
    the door.
  parts:
  - wheel
  hardware:
  - bolt
  - locknut
  tool: null
