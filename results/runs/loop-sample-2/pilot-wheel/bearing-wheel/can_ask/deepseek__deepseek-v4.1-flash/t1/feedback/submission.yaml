task: bearing-wheel
note: 'The coupon told me something important: all four of the first ladder (21.70-21.95)
  refused the bearing, including the 21.94 one that was only 0.06 mm under the bearing''s
  22.000 OD. A 0.06 mm interference is a light press that should go in with a push,
  so this printer is printing those vertical bores undersize, by at least 0.1-0.2
  mm (unfortunately you can''t tell me by exactly how much without calipers). I have
  therefore moved the wheel''s bearing seat up to 22.20 mm in CAD, which should print
  at roughly the bearing''s own 22.000 and give the press fit we want, and I have
  re-cut the coupon as a second ladder: 22.00 / 22.10 / 22.20 / 22.30. The wheel is
  drawn at 22.20 (3 dots). Everything else about the wheel is unchanged: Ø50 x 16,
  two 608ZZ pressed in back to back, each bottoming on the 2 mm web so its face ends
  up flush with the wheel''s face, two 11 mm printed spacer rings that land on the
  bearing inner rings (never on the shield), M8 bolt through the existing bracket,
  washer and ISO 10511 lock nut, 2.5 mm of rim clearance each side. Recommended route:
  print the 20-minute coupon first and press the bearing into each bore with a vise;
  if the winner is not 22.20, edit wheel_bearing_bore_d before slicing the wheel.
  Note that the wheel''s seat is surrounded by much more plastic than the coupon''s
  8 mm walls, so where two coupon bores are both workable, the wheel wants the larger
  (looser) one. If you print the wheel straight away at 22.20: press with a vise using
  a flat block on the bearing''s outer ring; if it will not start, warm the wheel
  in water at about 60 C for a minute and press it while warm; if instead a bearing
  drops in with no resistance at all, bed it with two or three drops of superglue
  around the outer ring or one wrap of PTFE tape around the outer ring.'
questions:
- text: Can you get hold of calipers or a micrometer? Knowing the printed bore size
    (or the printed coupon bores) to a hundredth would end the guesswork on the press
    fit - the coupon can only tell me tight/loose, not how far off.
  answer: null
- text: Is the old wheel's running surface flat, or does it have a groove down the
    middle (for a raised rail)? I assumed flat - if it was grooved, tell me the rail's
    width and I will set tread_groove_w/tread_groove_d so you can reprint just the
    wheel.
  answer: null
- text: How long is your own M8 bolt under the head, and how thick is the bracket
    plate it passes through? I assumed a 3 mm plate and an M8x40; the clamped stack
    needs at least 35 mm of bolt.
  answer: null
params:
  axle_stack_len:
    value: 35.2
    unit: mm
    kind: design
    source: design
    note: 'washer + bracket + ring + wheel(16) + ring + washer + lock nut measured
      from under the head, with a 3 mm bracket: the bolt needs at least this much
      length'
  bolt_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8 shank
  bolt_head_d:
    value: 13.0
    unit: mm
    kind: hardware
    source: catalog
    note: socket head diameter
  bolt_head_h:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: socket head height
  bolt_len:
    value: 40.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8x40 axle bolt; covers bracket plates from ~0 to 6 mm. Your own
      M8 bolt works if it has at least 35 mm under the head
  bolt_thread_len:
    value: 28.0
    unit: mm
    kind: hardware
    source: catalog
    note: thread length from the tip on an M8x40 (M8 is fully threaded up to 35 mm);
      the lock nut lands well inside it
  bracket_hole_d:
    value: 9.0
    unit: mm
    kind: world
    source: guessed
    note: axle hole in the existing bracket; must clear 8.4 mm for the M8 bolt - ream
      it out if it is smaller
  bracket_t:
    value: 3.0
    unit: mm
    kind: world
    source: guessed
    note: thickness of the plate the axle passes through - could not be measured;
      drives the axle bolt length
  brg_bore:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ bore 8.000 - the M8 shank passes through both bearings
  brg_inner_ring_od:
    value: 11.6
    unit: mm
    kind: hardware
    source: guessed
    note: 608 inner-ring shoulder; the 11 mm axle ring must sit inside it and press
      the inner ring only
  brg_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ outside diameter 22.000 (person measured 'about 22')
  brg_w:
    value: 7.0
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ width 7.000 - sets the seat depth
  coupon_a:
    value: 22.0
    unit: mm
    kind: design
    source: design
    note: fit coupon bore, 1 dot
  coupon_b:
    value: 22.1
    unit: mm
    kind: design
    source: design
    note: fit coupon bore, 2 dots
  coupon_c:
    value: 22.2
    unit: mm
    kind: design
    source: design
    note: fit coupon bore, 3 dots - the value the wheel is drawn with
  coupon_d:
    value: 22.3
    unit: mm
    kind: design
    source: design
    note: fit coupon bore, 4 dots
  edge_chamfer:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: lead-in chamfer at the two bearing seat mouths, and an ease on the tread
      edges
  locknut_h:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 nylon-insert lock nut height (AF 13)
  printer_bore_undersize:
    value: 0.2
    unit: mm
    kind: world
    source: guessed
    note: 'how much smaller this printer makes a vertical 22 mm bore than the CAD
      value: the first coupon ladder (21.70-21.95) all refused the bearing, so it
      is at least 0.1-0.2 mm and the seat is drawn 0.2 mm oversize to compensate'
  ring_id:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: matches the ISO 7089 M8 washer bore (0.4 mm clearance on the bolt)
  ring_od:
    value: 11.0
    unit: mm
    kind: design
    source: design
    note: axle ring OD - inside the 608 inner ring (11.6) so it can never touch the
      shield or the outer ring
  ring_t:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: 'axle ring thickness = the rim-to-plate clearance: the ring stands 2.5 mm
      proud of the wheel face'
  seat_depth:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: = the 608 width, so each bearing presses in until it bottoms on the web,
      flush with the wheel face
  tread_groove_d:
    value: 0.0
    unit: mm
    kind: design
    source: design
    note: 0 = flat tread; set to about 3 mm together with tread_groove_w if the wheel
      runs on a raised rail
  tread_groove_w:
    value: 0.0
    unit: mm
    kind: design
    source: design
    note: 0 = flat tread (assumed, since the old tyre could not be measured). If it
      had a groove, set this to the rail width + 0.5
  washer_id:
    value: 8.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 washer bore - also the axle ring's bore
  washer_od:
    value: 16.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 washer outside diameter
  washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 washer thickness; one under the head, one under the nut
  web_bore_d:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: bolt clearance hole through the 2 mm web (web thickness = wheel_w - 2 x
      seat_depth = 2.0)
  wheel_bearing_bore_d:
    value: 22.2
    unit: mm
    kind: design
    source: measured
    note: 'what the coupon test changed: all four bores of the first ladder (21.70-21.95)
      refused a 22.000 bearing, so those bores print undersize on this printer. 22.20
      is drawn deliberately 0.20 mm over the bearing OD so it prints at about 22.000
      and gives a press fit. This is the value the wheel is sliced with unless the
      new coupon ladder says otherwise'
  wheel_od:
    value: 50.0
    unit: mm
    kind: world
    source: asked
    note: old wheel was 'about 50 mm across'; keeping it keeps the door at the same
      height above the track
  wheel_w:
    value: 16.0
    unit: mm
    kind: world
    source: asked
    note: old wheel was 'about 16 mm wide'; two 608s (14 mm) plus a 2 mm web fits
      inside it
parts:
- id: wheel
  role: final
  material: PLA (high-speed black)
  code: "import cadquery as cq\n\n\ndef build(p):\n    od = p.wheel_od\n    h = p.wheel_w\n\
    \    sd = p.seat_depth\n    bd = p.wheel_bearing_bore_d\n\n    body = cq.Workplane(\"\
    XY\").circle(od / 2).extrude(h)\n\n    # bearing seat cut from each face; the\
    \ web left between them is the pressing depth stop\n    body = body.cut(cq.Workplane(\"\
    XY\").circle(bd / 2).extrude(sd))\n    body = body.cut(\n        cq.Workplane(\"\
    XY\", origin=(0, 0, h - sd)).circle(bd / 2).extrude(sd)\n    )\n\n    # bolt clearance\
    \ hole through the central web\n    body = body.cut(\n        cq.Workplane(\"\
    XY\", origin=(0, 0, sd))\n        .circle(p.web_bore_d / 2)\n        .extrude(h\
    \ - 2 * sd)\n    )\n\n    # lead-in chamfers at the two bearing seat mouths\n\
    \    r = bd / 2\n    c = p.edge_chamfer\n    body = body.cut(cq.Workplane(obj=cq.Solid.makeCone(r\
    \ + c, r, c, cq.Vector(0, 0, 0))))\n    body = body.cut(\n        cq.Workplane(obj=cq.Solid.makeCone(r,\
    \ r + c, c, cq.Vector(0, 0, h - c)))\n    )\n\n    # optional tread groove (skipped\
    \ while tread_groove_d == 0, i.e. flat tread)\n    if p.tread_groove_d > 0 and\
    \ p.tread_groove_w > 0:\n        zi = h / 2 - p.tread_groove_w / 2\n        zo\
    \ = h / 2 + p.tread_groove_w / 2\n        rin = od / 2 - p.tread_groove_d\n  \
    \      rout = od / 2 + 1\n        prof = (\n            cq.Workplane(\"XZ\")\n\
    \            .moveTo(rin, zi)\n            .lineTo(rout, zi)\n            .lineTo(rout,\
    \ zo)\n            .lineTo(rin, zo)\n            .close()\n            .revolve(360,\
    \ (0, 0, 0), (0, 0, 1))\n        )\n        body = body.cut(prof)\n\n    # ease\
    \ the tread edges so the rim does not catch on the track\n    try:\n        body\
    \ = body.edges(cq.selectors.NearestToPointSelector((od / 2, 0, 0))).chamfer(0.6)\n\
    \        body = body.edges(cq.selectors.NearestToPointSelector((od / 2, 0, h))).chamfer(0.6)\n\
    \    except Exception:\n        pass\n\n    return body\n"
  print_orientation: 'flat on one rim face: the wheel''s axis is vertical (Z), z =
    0 is the lower rim face. Bearing pockets open up and down, no supports, no bridging
    except the 6.7 mm ring that becomes the central web.'
  use_orientation: 'axis horizontal, perpendicular to the door: the lower face (as
    printed) faces the bracket plate, the upper face faces the nut; the tread runs
    on the track.'
- id: axle_ring
  role: final
  material: PLA (high-speed black)
  code: "import cadquery as cq\n\n\ndef build(p):\n    ring = cq.Workplane(\"XY\"\
    ).circle(p.ring_od / 2).extrude(p.ring_t)\n    return ring.cut(cq.Workplane(\"\
    XY\").circle(p.ring_id / 2).extrude(p.ring_t))\n"
  print_orientation: 'flat: one ring face on the bed, axis vertical (Z). Print 2 identical
    rings.'
  use_orientation: axis horizontal, coaxial with the M8 bolt; the +Z face lands on
    a bearing's inner ring, the bed face (z = 0) takes the bracket plate on one side
    and the washer + lock nut on the other.
- id: fit_coupon
  role: coupon
  material: PLA (high-speed black)
  code: "import cadquery as cq\n\n\ndef build(p):\n    bores = [p.coupon_a, p.coupon_b,\
    \ p.coupon_c, p.coupon_d]\n    t = p.seat_depth  # same depth as the wheel's bearing\
    \ seats\n    pitch = 30.0\n    w = 38.0\n    length = pitch * (len(bores) - 1)\
    \ + w\n\n    plate = cq.Workplane(\"XY\").box(length, w, t).translate((0, 0, t\
    \ / 2))\n    x0 = -pitch * (len(bores) - 1) / 2\n    for i, d in enumerate(bores):\n\
    \        x = x0 + i * pitch\n        plate = plate.cut(cq.Workplane(\"XY\").moveTo(x,\
    \ 0).circle(d / 2).extrude(t))\n        # dots mark the bore: 1 dot = smallest\
    \ ... 4 dots = largest\n        for k in range(i + 1):\n            plate = plate.cut(\n\
    \                cq.Workplane(\"XY\")\n                .moveTo(x - 6 + 4 * k,\
    \ -15)\n                .circle(0.9)\n                .extrude(t)\n          \
    \  )\n    return plate\n"
  print_orientation: 'flat on the bed: bores vertical (Z), 7 mm deep, printed exactly
    like the wheel''s seats but with 8 mm walls instead of 14 mm.'
  use_orientation: 'a test piece only: press a 608ZZ into each bore, 1 dot (22.00)
    to 4 dots (22.30), and pick the firm push fit.'
hardware:
- id: brg
  ref: 608ZZ
  qty: 2
- id: axle_bolt
  ref: ISO 4762 M8x40
  qty: 1
- id: washer_head
  ref: ISO 7089 M8
  qty: 1
- id: washer_nut
  ref: ISO 7089 M8
  qty: 1
- id: locknut
  ref: ISO 10511 M8
  qty: 1
joints:
- id: axle
  fastener: axle_bolt
  axis_origin:
  - 0.0
  - 0.0
  - -4.6
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: axle_ring
    feature: shoulder_face_a
    role: head_seat
  - part: wheel
    feature: web_bore
    role: clearance
  - part: axle_ring
    feature: shoulder_face_b
    role: washer
  nut: locknut
  external: null
criteria:
- id: bearing_press_fit
  part: wheel
  feature: bearing_seat
  relation: seats
  hardware: brg
  clearance_mm: 0.2
  params:
  - wheel_bearing_bore_d
  - brg_od
  - seat_depth
  - printer_bore_undersize
  check:
    method: coupon
    ref: fit_coupon
    description: 'SECOND ROUND: the first ladder (21.70-21.95) all refused a 22.000
      bearing, so those bores print undersize here. Press a 608ZZ into each new bore
      - 1 dot 22.00, 2 dots 22.10, 3 dots 22.20, 4 dots 22.30 - with a vise, and take
      the smallest bore that a firm straight push accepts without cracking. The wheel
      is drawn at 22.20 (3 dots). The coupon walls are 8 mm and the wheel''s are 14
      mm, so the wheel grips harder than the coupon: where two bores are both workable,
      the wheel wants the larger one'
- id: web_bore_clears_bolt
  part: wheel
  feature: web_bore
  relation: clears
  hardware: axle_bolt
  clearance_mm: 0.4
  params:
  - web_bore_d
  - bolt_d
  check:
    method: none
    ref: null
    description: the 8.4 mm web hole clears the 8 mm shank; the web is 2 mm thick
      (= wheel_w - 2 x seat_depth)
- id: ring_bore_clears_bolt
  part: axle_ring
  feature: bolt_bore
  relation: clears
  hardware: axle_bolt
  clearance_mm: 0.4
  params:
  - ring_id
  - bolt_d
  check:
    method: none
    ref: null
    description: the ring slides on the shank and is clamped by the head (through
      the washer and bracket) and by the lock nut
- id: ring_presses_inner_ring_only
  part: axle_ring
  feature: shoulder_face_a
  relation: seats
  hardware: brg
  clearance_mm: 0.6
  params:
  - ring_od
  - brg_inner_ring_od
  check:
    method: measure
    ref: null
    description: 'measure across the 608''s inner-ring face (the ring around the 8
      mm bore): it must be wider than 11.6 mm so the 11.0 mm ring lands on the inner
      ring and never rubs the shield or the balls'
- id: rim_clearance
  part: wheel
  feature: side_face
  relation: clears
  hardware: null
  clearance_mm: 2.5
  params:
  - ring_t
  - seat_depth
  - brg_w
  check:
    method: none
    ref: null
    description: 'with each bearing pressed home on the web, its face is flush with
      a wheel face, so the 2.5 mm ring reaches 2.5 mm past the rim: neither the bracket
      plate nor the washer can touch the spinning rim'
- id: axle_length
  part: axle_ring
  feature: shoulder_face_b
  relation: engages
  hardware: axle_bolt
  clearance_mm: null
  params:
  - axle_stack_len
  - bolt_len
  - bolt_thread_len
  - bracket_t
  - locknut_h
  check:
    method: none
    ref: null
    description: with a 3 mm bracket the clamped stack is 35.2 mm from under the head;
      an M8x40 leaves the lock nut fully inside the thread with ~4.8 mm spare and
      covers plates up to ~6 mm
- id: tread_matches_track
  part: wheel
  feature: tread
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - wheel_w
  - tread_groove_w
  - tread_groove_d
  check:
    method: none
    ref: null
    description: 'assumed flat: 16 mm wide, 50 mm across, the same as the old wheel.
      If the old tyre had a groove for a raised rail, set tread_groove_w = rail width
      + 0.5 and tread_groove_d = 3 and reprint'
manual:
- n: '1'
  text: 'Print the fit coupon, flat on the bed, PLA 0.2 mm. Its four bores are the
    second ladder, biggest end last: 1 dot = 22.00, 2 dots = 22.10, 3 dots = 22.20,
    4 dots = 22.30. Press one 608ZZ into each bore with a vise, using a flat block
    on the bearing''s outer ring, straight and square. Take the SMALLEST bore that
    accepts a firm, straight push and grips. Two notes: the wheel''s seat is walled
    by 14 mm of plastic against the coupon''s 8 mm, so it grips harder than the coupon
    - where two bores are both workable, the wheel wants the larger one; and the wheel
    is drawn at 22.20 (3 dots).'
  parts:
  - fit_coupon
  hardware:
  - brg
  tool: vise
- n: '2'
  text: Print the wheel flat on one rim face (bearing pockets opening up and down),
    PLA 0.2 mm, 4 perimeters, no supports. If your coupon winner was not 22.20, edit
    wheel_bearing_bore_d to that number and slice again - the coupon costs 20 minutes
    and about 15 g, the wheel costs an hour and about 30 g.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '3'
  text: Print the axle ring twice, flat on the bed (PLA, 0.2 mm, 4 perimeters).
  parts:
  - axle_ring
  hardware: []
  tool: null
- n: '4'
  text: Press one 608ZZ into each face of the wheel. Push squarely with a vise or
    a mallet and a flat block that bears on the bearing's OUTER ring only, never on
    the shield. Each bearing bottoms on the web inside, so its face ends up flush
    with the wheel's face. If it will not start, warm the wheel in water at about
    60 C for a minute and press while warm. If instead a bearing drops in with no
    resistance at all, seat it with two or three drops of superglue around the outer
    ring, or one wrap of PTFE tape around the outer ring.
  parts:
  - wheel
  hardware:
  - brg
  tool: vise, hot water
- n: '5'
  text: 'Check the door''s bracket: the axle hole must clear the M8 bolt, so at least
    8.4 mm across - drill or ream it to 8.5 mm if it is smaller. The plate the axle
    passes through should be under about 6 mm thick for the M8x40.'
  parts: []
  hardware:
  - axle_bolt
  tool: drill
- n: '6'
  text: Slide a washer onto the bolt, push the bolt through the bracket's axle hole
    from the outside, then slide an axle ring over the shank, then the wheel with
    its bearings, then the second axle ring, the second washer, and finally the ISO
    10511 M8 lock nut. Each ring must rest on the bearing's inner ring - it is only
    11 mm across, so it cannot land anywhere else. Snug it up by hand plus a light
    nip with a wrench.
  parts:
  - axle_ring
  - wheel
  hardware:
  - axle_bolt
  - washer_head
  - washer_nut
  - locknut
  tool: wrench
- n: '7'
  text: 'Spin test: the wheel should turn freely with about a 2.5 mm gap between the
    rim and the bracket plate and the nut-side washer. If it drags, back the lock
    nut off a touch; if the wheel rocks sideways, give it another light nip.'
  parts:
  - wheel
  - axle_ring
  hardware:
  - locknut
  tool: null
- n: '8'
  text: Refit the door on its track and roll it end to end. If the door now rides
    1-2 mm high or low, the new tyre is slightly different across from the old one
    and the door's height adjustment needs a turn.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '9'
  text: 'Only if your old wheel had a groove in its running surface (i.e. it ran on
    a raised rail instead of a flat surface): set tread_groove_w to the rail''s width
    + 0.5 and tread_groove_d to about 3, reprint the wheel, and press the bearings
    out of the old one to reuse them.'
  parts:
  - wheel
  hardware: []
  tool: null
