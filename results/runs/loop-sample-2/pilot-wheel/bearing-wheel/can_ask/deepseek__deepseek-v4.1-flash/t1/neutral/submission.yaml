task: bearing-wheel
note: 'CHANGED SINCE LAST SEND: (1) the M8 washer that was under the bolt head now
  goes between the bracket plate and the axle ring, so the ring is always pressed
  even if the bracket''s axle hole is oversized (8.4-16 mm all work); the stack length
  is unchanged at 35.2 mm with a 3 mm plate. (2) The coupon instructions now account
  for its 8 mm walls vs the wheel''s 14 mm seat wall, and its bores have the same
  0.6 mm lead-in chamfer as the wheel. Everything else is as before: a Ø50 x 16 mm
  wheel carrying both 608ZZ bearings pressed in back to back (0.15 mm interference,
  bottoming on a 2 mm web that also sets the pressing depth and carries the clamp
  load), two 11 mm printed axle rings that land on the bearings'' inner rings only
  and hold the rim 2.5 mm clear of the plate and washer, and an ISO 4762 M8x40 axle
  with a nylon-insert lock nut. Assumptions I could not measure: flat 16 mm tread
  (a groove is supported - set tread_groove_w/tread_groove_d and reprint the wheel
  alone), a 3 mm bracket plate, and a bolt with at least 35 mm under the head. Print
  the coupon first; it is the only way to pin the press fit for your printer.'
questions:
- text: Is the old wheel's running surface flat, or does it have a groove down the
    middle (for a raised rail)? I assumed flat - if it was grooved, tell me the rail's
    width and I will set tread_groove_w / tread_groove_d so you can reprint just the
    wheel.
  answer: null
- text: How long is your own M8 bolt under the head? The axle needs at least 35 mm
    with a 3 mm bracket, and an ISO 4762 M8x40 covers plates up to ~6 mm. If yours
    is shorter, buy the M8x40; if it is longer, it will simply stick out past the
    lock nut.
  answer: null
- text: How thick is the bracket plate the axle passes through, and how big is its
    axle hole? I assumed 3 mm and that it will clear 8.4 mm for the M8 bolt (anything
    up to 16 mm is fine).
  answer: null
params:
  axle_stack_len:
    value: 35.2
    unit: mm
    kind: design
    source: design
    note: 'washer + bracket + washer + ring + wheel(16) + ring + washer + lock nut
      measured from under the head, with a 3 mm bracket: the axle bolt must be at
      least this long'
  bracket_hole_d:
    value: 9.0
    unit: mm
    kind: world
    source: guessed
    note: axle hole in the existing bracket; must clear 8.4 mm for the M8 bolt - ream
      it out if smaller. Up to 16 mm is fine because the M8 washer sits between the
      plate and the ring
  bracket_t:
    value: 3.0
    unit: mm
    kind: world
    source: guessed
    note: thickness of the plate the axle passes through - could not be measured;
      drives the axle bolt length
  bracket_t_max:
    value: 6.0
    unit: mm
    kind: design
    source: design
    note: thickest bracket plate an M8x40 axle still covers (clamp stack + lock nut)
  brg_bore:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ bore 8.000 - the M8 shank passes through both bearings
  brg_inner_ring_od:
    value: 11.6
    unit: mm
    kind: hardware
    source: guessed
    note: 608 inner-ring shoulder; the axle ring must sit inside it and press only
      the inner ring
  brg_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ outside diameter 22.000 (person measured 'about 22')
  brg_w:
    value: 7.0
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ width 7.000 - sets the seat depth
  bolt_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8 shank
  bolt_head_d:
    value: 13.0
    unit: mm
    kind: hardware
    source: catalog
    note: socket head diameter - presses straight onto the bracket plate
  bolt_head_h:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: socket head height
  bolt_len:
    value: 40.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8x40 axle bolt; covers bracket plates from ~0 to 6 mm
  bolt_thread_len:
    value: 28.0
    unit: mm
    kind: hardware
    source: catalog
    note: thread length from the tip on an M8x40 (M8 is fully threaded up to 35 mm);
      the lock nut lands well inside it
  coupon_a:
    value: 21.7
    unit: mm
    kind: design
    source: design
    note: 1 dot - tightest coupon bore
  coupon_b:
    value: 21.8
    unit: mm
    kind: design
    source: design
    note: 2 dots
  coupon_c:
    value: 21.85
    unit: mm
    kind: design
    source: design
    note: 3 dots - the value the wheel is drawn with
  coupon_d:
    value: 21.95
    unit: mm
    kind: design
    source: design
    note: 4 dots - loosest coupon bore
  edge_chamfer:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: lead-in at both bearing seat mouths (and on the coupon bores), plus an ease
      on the tread edges
  locknut_h:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 nylon-insert lock nut height (AF 13)
  ring_id:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: matches the ISO 7089 M8 washer bore (0.4 mm clearance on the bolt)
  ring_od:
    value: 11.0
    unit: mm
    kind: design
    source: design
    note: axle ring OD - inside the 608 inner ring (11.6) so it can never touch the
      shield or the outer ring
  ring_t:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: 'axle ring thickness = the rim-to-plate clearance: the ring stands 2.5 mm
      proud of the wheel face'
  seat_depth:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: = the 608 width, so each bearing presses in until it bottoms on the web,
      flush with the wheel face
  tread_groove_d:
    value: 0.0
    unit: mm
    kind: design
    source: design
    note: 0 = flat tread; set to about 3 mm together with tread_groove_w if the wheel
      runs on a raised rail
  tread_groove_w:
    value: 0.0
    unit: mm
    kind: design
    source: design
    note: 0 = flat tread (assumed, since the old tyre could not be measured). If it
      had a groove, set this to the rail width + 0.5
  washer_id:
    value: 8.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 washer bore - also the axle ring's bore
  washer_od:
    value: 16.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 washer outside diameter - this is what makes an oversized bracket
      hole harmless
  washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 washer thickness; one between bracket plate and ring, one under
      the lock nut
  web_bore_d:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: bolt clearance hole through the 2 mm web (web thickness = wheel_w - 2 x
      seat_depth = 2.0)
  wheel_bearing_bore_d:
    value: 21.85
    unit: mm
    kind: design
    source: design
    note: 0.15 mm interference on the 22.000 bearing OD; confirmed or adjusted with
      the fit coupon before printing the wheel
  wheel_od:
    value: 50.0
    unit: mm
    kind: world
    source: asked
    note: old wheel was 'about 50 mm across'; keeping it keeps the door at the same
      height above the track
  wheel_w:
    value: 16.0
    unit: mm
    kind: world
    source: asked
    note: old wheel was 'about 16 mm wide'; two 608s (14 mm) plus a 2 mm web fits
      inside it
parts:
- id: wheel
  role: final
  material: PLA (high-speed black)
  code: "import cadquery as cq\n\n\ndef build(p):\n    od = p.wheel_od\n    h = p.wheel_w\n\
    \    sd = p.seat_depth\n    bd = p.wheel_bearing_bore_d\n\n    body = cq.Workplane(\"\
    XY\").circle(od / 2).extrude(h)\n\n    # bearing seat cut from each face; the\
    \ 2 mm web left between them\n    # is both the pressing depth stop and the clamp\
    \ load path\n    body = body.cut(cq.Workplane(\"XY\").circle(bd / 2).extrude(sd))\n\
    \    body = body.cut(\n        cq.Workplane(\"XY\", origin=(0, 0, h - sd)).circle(bd\
    \ / 2).extrude(sd)\n    )\n\n    # bolt clearance hole through the web\n    body\
    \ = body.cut(\n        cq.Workplane(\"XY\", origin=(0, 0, sd))\n        .circle(p.web_bore_d\
    \ / 2)\n        .extrude(h - 2 * sd)\n    )\n\n    # lead-in chamfers at the two\
    \ bearing seat mouths\n    r = bd / 2\n    c = p.edge_chamfer\n    body = body.cut(cq.Workplane(obj=cq.Solid.makeCone(r\
    \ + c, r, c, cq.Vector(0, 0, 0))))\n    body = body.cut(\n        cq.Workplane(obj=cq.Solid.makeCone(r,\
    \ r + c, c, cq.Vector(0, 0, h - c)))\n    )\n\n    # optional tread groove (skipped\
    \ while tread_groove_d == 0, i.e. flat tread)\n    if p.tread_groove_d > 0 and\
    \ p.tread_groove_w > 0:\n        zi = h / 2 - p.tread_groove_w / 2\n        zo\
    \ = h / 2 + p.tread_groove_w / 2\n        rin = od / 2 - p.tread_groove_d\n  \
    \      rout = od / 2 + 1\n        prof = (\n            cq.Workplane(\"XZ\")\n\
    \            .moveTo(rin, zi)\n            .lineTo(rout, zi)\n            .lineTo(rout,\
    \ zo)\n            .lineTo(rin, zo)\n            .close()\n            .revolve(360,\
    \ (0, 0, 0), (0, 0, 1))\n        )\n        body = body.cut(prof)\n\n    # ease\
    \ the tread edges so the rim does not catch on the track\n    try:\n        body\
    \ = body.edges(cq.selectors.NearestToPointSelector((od / 2, 0, 0))).chamfer(0.6)\n\
    \        body = body.edges(cq.selectors.NearestToPointSelector((od / 2, 0, h))).chamfer(0.6)\n\
    \    except Exception:\n        pass\n\n    return body\n"
  print_orientation: 'flat on one rim face: the wheel''s axis is vertical (Z), z =
    0 is the lower rim face, both bearing pockets open up and down. No supports. The
    only bridge is the 6.7 mm ring that becomes the central web.'
  use_orientation: 'axis horizontal, pointing away from the door: the lower face (as
    printed) faces the bracket plate, the upper face faces the lock nut, the tread
    runs on the track.'
- id: axle_ring
  role: final
  material: PLA (high-speed black)
  code: "import cadquery as cq\n\n\ndef build(p):\n    ring = cq.Workplane(\"XY\"\
    ).circle(p.ring_od / 2).extrude(p.ring_t)\n    return ring.cut(cq.Workplane(\"\
    XY\").circle(p.ring_id / 2).extrude(p.ring_t))\n"
  print_orientation: 'flat: one ring face on the bed, axis vertical (Z), z = 0 is
    the bed face (shoulder_face_b). Print 2 identical rings.'
  use_orientation: 'axis horizontal, coaxial with the M8 bolt: the +Z face (shoulder_face_a)
    lands on a bearing''s inner ring, the bed face (shoulder_face_b) takes the M8
    washer on one side, and the other ring''s bed face takes the nut-side washer.'
- id: fit_coupon
  role: coupon
  material: PLA (high-speed black)
  code: "import cadquery as cq\n\n\ndef build(p):\n    bores = [p.coupon_a, p.coupon_b,\
    \ p.coupon_c, p.coupon_d]\n    t = p.seat_depth  # same seat depth as the wheel\n\
    \    pitch = 30.0\n    w = 38.0\n    length = pitch * (len(bores) - 1) + w\n\n\
    \    plate = cq.Workplane(\"XY\").box(length, w, t).translate((0, 0, t / 2))\n\
    \    x0 = -pitch * (len(bores) - 1) / 2\n    c = p.edge_chamfer\n    for i, d\
    \ in enumerate(bores):\n        x = x0 + i * pitch\n        r = d / 2\n      \
    \  plate = plate.cut(cq.Workplane(\"XY\").moveTo(x, 0).circle(r).extrude(t))\n\
    \        # same lead-in chamfer as the wheel's seat mouths\n        plate = plate.cut(\n\
    \            cq.Workplane(obj=cq.Solid.makeCone(r + c, r, c, cq.Vector(x, 0, 0)))\n\
    \        )\n        plate = plate.cut(\n            cq.Workplane(obj=cq.Solid.makeCone(r,\
    \ r + c, c, cq.Vector(x, 0, t - c)))\n        )\n        # dots mark the bore:\
    \ 1 dot = smallest ... 4 dots = largest\n        for k in range(i + 1):\n    \
    \        plate = plate.cut(\n                cq.Workplane(\"XY\").moveTo(x - 6\
    \ + 4 * k, -15).circle(0.9).extrude(t)\n            )\n    return plate\n"
  print_orientation: 'flat on the bed: bores vertical (Z), 7 mm deep, printed in the
    same orientation as the wheel''s seats.'
  use_orientation: 'test piece only: press a 608ZZ into each bore, 1 dot (21.70) through
    4 dots (21.95), and pick your printer''s number.'
hardware:
- id: brg
  ref: 608ZZ
  qty: 2
- id: axle_bolt
  ref: ISO 4762 M8x40
  qty: 1
- id: washer_bracket
  ref: ISO 7089 M8
  qty: 1
- id: washer_nut
  ref: ISO 7089 M8
  qty: 1
- id: locknut
  ref: ISO 10511 M8
  qty: 1
joints:
- id: axle
  fastener: axle_bolt
  axis_origin:
  - 0.0
  - 0.0
  - -4.6
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: axle_ring
    feature: shoulder_face_a
    role: head_seat
  - part: wheel
    feature: web_bore
    role: clearance
  - part: axle_ring
    feature: shoulder_face_b
    role: washer
  nut: locknut
  external: null
criteria:
- id: bearing_press_fit
  part: wheel
  feature: bearing_seat
  relation: seats
  hardware: brg
  clearance_mm: -0.15
  params:
  - wheel_bearing_bore_d
  - brg_od
  - seat_depth
  check:
    method: coupon
    ref: fit_coupon
    description: 'press a 608ZZ into each coupon bore (1 dot 21.70, 2 dots 21.80,
      3 dots 21.85, 4 dots 21.95). The coupon''s walls are 8 mm and the wheel''s seat
      wall is 14 mm, so the wheel always feels tighter: the bore that takes a firm
      thumb push in the coupon is the one to use. The wheel is drawn at 21.85 (3 dots);
      if that bore will not go in with a firm push, print the wheel at 21.95, and
      if it drops in with no effort, print at 21.80.'
- id: web_bore_clears_bolt
  part: wheel
  feature: web_bore
  relation: clears
  hardware: axle_bolt
  clearance_mm: 0.4
  params:
  - web_bore_d
  - bolt_d
  check:
    method: none
    ref: null
    description: the 8.4 mm web hole clears the 8 mm shank; the web is 2 mm thick
      (= wheel_w - 2 x seat_depth)
- id: ring_bore_clears_bolt
  part: axle_ring
  feature: bolt_bore
  relation: clears
  hardware: axle_bolt
  clearance_mm: 0.4
  params:
  - ring_id
  - bolt_d
  check:
    method: none
    ref: null
    description: the ring slides on the shank and is clamped by the bracket plate
      (through the washer) and by the lock nut
- id: ring_presses_inner_ring_only
  part: axle_ring
  feature: shoulder_face_a
  relation: seats
  hardware: brg
  clearance_mm: 0.6
  params:
  - ring_od
  - brg_inner_ring_od
  check:
    method: measure
    ref: null
    description: 'measure across the 608''s inner-ring face (the ring around the 8
      mm bore): it must be wider than 11.6 mm so the 11.0 mm ring lands on the inner
      ring and never rubs the shield or the balls'
- id: rim_clearance
  part: wheel
  feature: side_face
  relation: clears
  hardware: null
  clearance_mm: 2.5
  params:
  - ring_t
  - seat_depth
  - brg_w
  check:
    method: none
    ref: null
    description: with each bearing pressed flush with a wheel face, the 2.5 mm ring
      reaches 2.5 mm past the rim, so neither the bracket plate nor the washer can
      touch the spinning rim
- id: plate_presses_ring
  part: axle_ring
  feature: shoulder_face_b
  relation: faces
  hardware: washer_bracket
  clearance_mm: null
  params:
  - ring_od
  - washer_od
  - bracket_hole_d
  - bracket_t
  check:
    method: none
    ref: null
    description: the M8 washer sits between the bracket plate and the ring, so the
      ring is pressed even if the bracket's axle hole is oversized - anything from
      8.4 up to 16 mm works
- id: axle_length
  part: axle_ring
  feature: shoulder_face_b
  relation: engages
  hardware: axle_bolt
  clearance_mm: null
  params:
  - axle_stack_len
  - bolt_len
  - bolt_thread_len
  - bracket_t
  - bracket_t_max
  - locknut_h
  check:
    method: none
    ref: null
    description: with a 3 mm bracket the clamped stack is 35.2 mm from under the head;
      an M8x40 leaves the lock nut fully inside the thread with ~4.8 mm spare and
      covers plates up to ~6 mm
- id: tread_matches_track
  part: wheel
  feature: tread
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - wheel_w
  - tread_groove_w
  - tread_groove_d
  check:
    method: none
    ref: null
    description: 'assumed flat: 16 mm wide, 50 mm across, the same as the old wheel.
      If the old tyre had a groove for a raised rail, set tread_groove_w = rail width
      + 0.5 and tread_groove_d = 3 and reprint the wheel'
manual:
- n: '1'
  text: 'Print the fit coupon flat on the bed (PLA, 0.2 mm layers, 4 perimeters).
    Press one 608ZZ into each of the four bores, smallest end first: 1 dot = 21.70,
    2 dots = 21.80, 3 dots = 21.85, 4 dots = 21.95. Push straight with your thumbs,
    a light mallet tap if needed. Note two things: the largest bore that still grips
    the bearing, and the smallest that goes in without a hammer. The wheel is drawn
    at 21.85 (3 dots). If 21.85 will not take a firm push, slice the wheel with wheel_bearing_bore_d
    = 21.95; if it drops in with no effort, use 21.80.'
  parts:
  - fit_coupon
  hardware:
  - brg
  tool: mallet
- n: '2'
  text: Print the wheel flat on one rim face (both bearing pockets opening up and
    down), PLA 0.2 mm, 4 perimeters, no supports. Check the bottom rim edge before
    you take it off the plate - if the tread edge chamfer did not slice, it does not
    matter, the wheel still works.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '3'
  text: Print the axle ring twice, flat on the bed (PLA, 0.2 mm, 4 perimeters). They
    are identical.
  parts:
  - axle_ring
  hardware: []
  tool: null
- n: '4'
  text: Press one 608ZZ into each face of the wheel. Push squarely with a vise, or
    a mallet and a flat block that bears on the bearing's OUTER ring only - never
    on the shield. Each bearing bottoms on the 2 mm web inside, so its face ends up
    flush with the wheel's face and the two bearings sit back to back. If they fight
    you, put the bearings in the freezer for 15 minutes first.
  parts:
  - wheel
  hardware:
  - brg
  tool: vise or mallet and flat block
- n: '5'
  text: 'Check the door''s bracket. The axle hole only has to clear the M8 shank:
    8.4 mm across, so drill or ream it to 8.5 mm if it is smaller. Anything bigger
    is fine up to 16 mm - the M8 washer covers the slack. The plate the axle passes
    through should be under about 6 mm thick for an M8x40.'
  parts: []
  hardware:
  - axle_bolt
  tool: drill
- n: '6'
  text: 'Push the bolt through the bracket''s axle hole from the outside (head on
    the outside of the bracket). Then, in order: M8 washer, axle ring, wheel with
    its bearings, second axle ring, second M8 washer, ISO 10511 M8 lock nut. Each
    ring must land on a bearing''s inner ring - at 11 mm across it cannot reach anything
    else. The bolt''s plain shank is sometimes a light tap fit in the 608 bores; if
    it is, tap it through gently with a soft mallet before you add the nut. Snug the
    nut by hand plus a light nip with a wrench - the clamp load runs through the printed
    web, so do not lean on it.'
  parts:
  - axle_ring
  - wheel
  hardware:
  - axle_bolt
  - washer_bracket
  - washer_nut
  - locknut
  tool: wrench
- n: '7'
  text: 'Spin test: the wheel should turn freely with about 2.5 mm of daylight between
    the rim and the bracket plate on one side and the washer on the other. If it drags,
    back the lock nut off a little; if the wheel rocks sideways on the axle, give
    it another light nip.'
  parts:
  - axle_ring
  - wheel
  hardware:
  - locknut
  tool: null
- n: '8'
  text: Refit the door on its track and roll it end to end. If the door now rides
    a millimetre or two high or low, the new tyre is slightly different across from
    the old one and the door's height adjustment needs a turn.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '9'
  text: 'Only if the old wheel had a groove down the middle of its running surface
    (i.e. it ran on a raised rail rather than a flat face): set tread_groove_w to
    the rail''s width + 0.5 and tread_groove_d to about 3, reprint the wheel, and
    press the bearings out of the old one to reuse them.'
  parts:
  - wheel
  hardware: []
  tool: null
