task: bearing-wheel
note: 'REVISED. A printed 50 x 16 wheel with two 608ZZ pressed in from either face;
  the M8 bolt is the axle and the wheel turns on the bearing outer rings. What changed
  from the first version: (1) the bearing sockets are cut exactly one bearing-width
  deep and the middle ring is 1.9 mm, so the clamp - bolt head, plate, ring, inner
  ring, middle ring, inner ring, ring, nut - always seats without jamming the bearings
  off their shoulder (a 2.0 mm ring in a 2.0 mm gap is an over-constrained loop that
  preloads the bearings); (2) the manual now gives the only workable order: bearing
  A, then the middle ring through the 14 mm shoulder bore, then bearing B - the middle
  ring cannot pass a bearing bore, so pressing both bearings first would dead-end
  the build; (3) the press instructions use a vise or a mallet through a socket on
  the bearing OUTER ring, since the kit has no washer big enough to draw a bearing
  in with the bolt. Design logic: the wheel width is exactly 2 x bearing width + a
  2 mm shoulder = 16, so the shoulder locates both outer rings and makes the 608 width
  tolerance (0/-0.12) irrelevant; the shoulder bore is 14, larger than the 608 inner-ring
  OD (about 12.7), so the shoulder touches only the rotating outer rings; the printed
  rings are 12 across - smaller than the inner-ring OD, larger than the inner radius
  of the nut face (6.5) - so they press the inner ring only, never the shield, and
  they hold the hanger plate 1.9 mm clear of the spinning wheel. The socket is printed
  at 21.9 (0.1 interference on a 22.000/-0.008 bearing) and is gauged with a 5-hole
  coupon first, because printed hole sizes vary per machine. Unconfirmed assumptions:
  the hanger plate is about 3 mm thick (guessed) and the bolt is a 35 mm ISO 4762
  (catalog) through a ~9 mm hole (guessed). The M8x35 leaves about 4 mm of thread
  past the lock nut; if your plate is thicker than about 6 mm use the plain ISO 4032
  M8 nut or a 40 mm bolt, and cut the excess thread if it fouls the door. Note that
  an M8x35 has only about 7 mm of unthreaded shank, so the bearing bores sit on thread
  crests - harmless here because the inner rings are clamped and never rotate on the
  bolt, but a smooth-shanked M8x50 (22 mm of shank) is the clean fix if you want it.
  The rim is flat with a 1.5 mm roundover so it runs on a flat track or a rail; tell
  me if the old wheel was grooved for a rail and I will cut the groove.'
questions:
- text: How long is your own M8 bolt from under the head to the tip? The stack needs
    30.8 mm (3 mm plate + 1.9 + 16 + 1.9 + 8 mm lock nut), so anything from 33 mm
    to 45 mm works. The catalog M8x35 leaves about 4 mm of thread past the nut.
  answer: null
- text: How thick is the hanger plate at the wheel? Above about 6 mm, swap the lock
    nut for the shorter ISO 4032 M8 nut (6.8 mm) or use a 40 mm bolt.
  answer: null
- text: Is the track a flat strip, a raised rail, or a channel? The rim is currently
    flat with a 1.5 mm roundover. If the old wheel had a groove that rode on a rail,
    tell me and I will cut a matching groove.
  answer: null
- text: How many rollers does the door have? Print one wheel per roller - two 608
    bearings per wheel, and you have two, so one wheel is covered.
  answer: null
params:
  wheel_od:
    value: 50.0
    unit: mm
    kind: world
    source: asked
    note: old wheel measured about 50 mm across (the user's own figure)
  wheel_w:
    value: 16.0
    unit: mm
    kind: world
    source: asked
    note: old wheel about 16 mm wide; set equal to 2 x bearing width + the 2 mm shoulder
  bearing_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: measured
    note: 608ZZ outer diameter; user measured about 22 mm, datasheet 22.000 -0.008
  bearing_w:
    value: 7.0
    unit: mm
    kind: hardware
    source: measured
    note: 608ZZ width; user measured about 7 mm. Class 0 tolerance is 0/-0.12, which
      does not matter here because the shoulder, not the bearing, sets the stack
  bearing_bore:
    value: 8.0
    unit: mm
    kind: hardware
    source: measured
    note: 608ZZ bore; user measured about 8 mm
  bearing_inner_ring_od:
    value: 12.7
    unit: mm
    kind: hardware
    source: guessed
    note: typical 608 inner-ring OD, not in the supplied data. The shoulder bore and
      the printed rings are sized from it so neither can rub a shield.
  bolt_shank_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: measured
    note: user measured the M8 shank at about 8 mm
  bolt_len:
    value: 35.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8x35 - the shortest catalog bolt that spans plate + ring + wheel
      + ring + lock nut with a few mm to spare
  bolt_head_d:
    value: 13.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8 head diameter; radius 6.5, so the head fully covers the 12 mm
      ring that seats on the bearing inner ring
  nut_h:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 nylon-insert lock nut height
  shoulder_w:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: width of the internal shoulder both bearing outer rings seat against; it
      also sets the gap between the two inner rings
  shoulder_bore_d:
    value: 14.0
    unit: mm
    kind: design
    source: design
    note: central bore through the shoulder; 1.3 mm larger than the 608 inner-ring
      OD, so the shoulder touches only the outer rings, and wide enough to drop the
      middle ring in
  socket_d:
    value: 21.9
    unit: mm
    kind: design
    source: design
    note: printed bore for the 608 press fit, 0.1 mm interference. Start value only
      - the coupon tells you the right number for your printer, and it is the single
      value you change
  lead_d:
    value: 22.9
    unit: mm
    kind: design
    source: design
    note: lead-in counterbore at each face so a bearing can be started square
  lead_t:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: depth of the lead-in counterbore
  rim_round:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: roundover on the two rim edges; the rim itself stays cylindrical (flat)
      so it works on a flat track or on a rail
  ring_od:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: smaller than the 608 inner-ring OD (12.7) so it presses the inner ring only
      and misses the shield, and larger than the inner radius of the nut face (6.5)
      so it is fully covered and cannot be extruded outward
  ring_id:
    value: 8.3
    unit: mm
    kind: design
    source: design
    note: clears the M8 shank (about 7.9 mm) by about 0.4 mm
  ring_len:
    value: 1.9
    unit: mm
    kind: design
    source: design
    note: deliberately 0.1 mm shorter than the 2 mm gap between the inner rings, so
      the clamp always seats and the mismatch becomes a few microns of axial shift
      in the bearings instead of a preload. All three rings share this length
  plate_t:
    value: 3.0
    unit: mm
    kind: world
    source: guessed
    note: hanger plate thickness; the user could not measure it. With this value the
      M8x35 leaves about 4 mm of thread past the lock nut
  plate_hole_d:
    value: 9.0
    unit: mm
    kind: world
    source: guessed
    note: hole the bolt passes through in the door's hanger plate, a standard M8 clearance
      hole. If yours is smaller than 8.4 mm, drill it to 9 mm
parts:
- id: wheel
  role: final
  material: PLA (high-speed, black) - 0.4 mm nozzle, 0.2 mm layers, 4 walls, 30% infill,
    6 solid top/bottom layers
  code: "import cadquery as cq\n\n\ndef build(p):\n    R = p.wheel_od / 2.0\n    W\
    \ = p.wheel_w\n    bz = p.bearing_w\n    sw = p.shoulder_w\n    sock_r = p.socket_d\
    \ / 2.0\n    lead_r = p.lead_d / 2.0\n    sho_r = p.shoulder_bore_d / 2.0\n  \
    \  rr = p.rim_round\n\n    # tyre: plain disc, axis vertical, z = 0 on the bed\n\
    \    w = cq.Workplane(\"XY\").circle(R).extrude(W)\n    w = w.faces(\">Z\").edges(\"\
    %CIRCLE\").fillet(rr)\n    w = w.faces(\"<Z\").edges(\"%CIRCLE\").fillet(rr)\n\
    \n    # one bearing socket from each face, exactly bearing_w deep, ending on the\
    \ shoulder\n    w = w.cut(cq.Workplane(\"XY\").workplane(offset=-1.0).circle(sock_r).extrude(bz\
    \ + 1.0))\n    w = w.cut(cq.Workplane(\"XY\").workplane(offset=bz + sw).circle(sock_r).extrude(bz\
    \ + 1.0))\n\n    # lead-in counterbore at each face so a bearing can be started\
    \ square\n    w = w.cut(cq.Workplane(\"XY\").workplane(offset=-0.5).circle(lead_r).extrude(p.lead_t\
    \ + 0.5))\n    w = w.cut(cq.Workplane(\"XY\").workplane(offset=W - p.lead_t).circle(lead_r).extrude(p.lead_t\
    \ + 0.5))\n\n    # shoulder bore: larger than the 608 inner ring, so only the\
    \ outer rings seat on the shoulder\n    w = w.cut(cq.Workplane(\"XY\").workplane(offset=bz\
    \ - 1.0).circle(sho_r).extrude(sw + 2.0))\n    return w\n"
  print_orientation: 'As modelled: flat, wheel axis vertical, z = 0 on the bed. The
    bearing sockets print as vertical round bores, which is the same orientation the
    coupon gauges.'
  use_orientation: Wheel axis horizontal on the M8 bolt as its axle; the flat rim
    rolls on the door track.
- id: ring
  role: final
  material: PLA (high-speed, black) - 0.4 mm nozzle, 0.2 mm layers. Print 3 per wheel;
    all three are this one part.
  code: "import cadquery as cq\n\n\ndef build(p):\n    od = p.ring_od / 2.0\n    idr\
    \ = p.ring_id / 2.0\n    t = p.ring_len\n    r = cq.Workplane(\"XY\").circle(od).extrude(t)\n\
    \    r = r.cut(cq.Workplane(\"XY\").circle(idr).extrude(t))\n    return r\n"
  print_orientation: 'As modelled: flat, ring axis vertical, z = 0 on the bed.'
  use_orientation: Slides on the M8 bolt. One goes in the middle of the wheel (in
    the dia 14 shoulder bore, between the two bearing inner rings) and one on each
    outside face - those two press the inner rings and hold the hanger plate and the
    lock nut off the bearing shields.
- id: coupon
  role: coupon
  material: PLA (high-speed, black) - same filament and layer height as the wheel
  code: "import cadquery as cq\n\n\ndef build(p):\n    L, Wd, H = 140.0, 32.0, 12.0\n\
    \    ds = [p.socket_d - 0.30, p.socket_d - 0.15, p.socket_d,\n          p.socket_d\
    \ + 0.15, p.socket_d + 0.30]\n    xs = [16.0, 43.0, 70.0, 97.0, 124.0]\n    body\
    \ = cq.Workplane(\"XY\").box(L, Wd, H, centered=(False, True, False))\n    for\
    \ x, d in zip(xs, ds):\n        body = body.cut(cq.Workplane(\"XY\").center(x,\
    \ 0.0).circle(d / 2.0).extrude(H + 1.0))\n    return body\n"
  print_orientation: 'As modelled: flat, holes vertical - the same orientation as
    the wheel''s bearing sockets.'
  use_orientation: Not part of the door. Press a 608 bearing into each of the five
    holes (21.60 to 22.20) and pick the one that grips firmly with no rock and no
    rattle.
hardware:
- id: bolt
  ref: ISO 4762 M8x35
  qty: 1
- id: nut
  ref: ISO 10511 M8
  qty: 1
- id: bearing
  ref: 608ZZ
  qty: 2
joints:
- id: axle
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - -4.9
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel
    feature: bearing socket, face at z = 0 (dia 21.9 x 7 deep)
    role: clearance
  - part: ring
    feature: bore - outer ring A, between the hanger plate and the wheel
    role: clearance
  - part: wheel
    feature: shoulder bore dia 14 (pocket for the middle ring)
    role: clearance
  - part: ring
    feature: bore - middle ring, between the two bearing inner rings
    role: clearance
  - part: wheel
    feature: bearing socket, face at z = 16 (dia 21.9 x 7 deep)
    role: clearance
  - part: ring
    feature: bore - outer ring B, between the wheel and the lock nut
    role: clearance
  - part: ring
    feature: outer face where the lock nut lands
    role: nut_pocket
  nut: nut
  external: the door's hanger plate - the bolt passes through its axle hole and its
    head clamps the outside face
criteria:
- id: c_press
  part: wheel
  feature: bearing sockets, both faces (dia socket_d x 7 deep)
  relation: contains
  hardware: bearing
  clearance_mm: -0.1
  params:
  - socket_d
  - bearing_od
  - bearing_w
  check:
    method: coupon
    ref: coupon
    description: Negative clearance = press fit. Print the coupon and press a 608
      into each hole; if the best hole is not 21.9, set socket_d to that value and
      re-slice the wheel. If a bearing ever goes in loose, a drop of cyanoacrylate
      on the outer ring will retain it.
- id: c_shoulder
  part: wheel
  feature: internal shoulder, 2 mm wide, between the two sockets
  relation: supports
  hardware: bearing
  clearance_mm: null
  params:
  - wheel_w
  - bearing_w
  - shoulder_w
  check:
    method: none
    ref: null
    description: wheel_w = 2 x bearing_w + shoulder_w = 16.0, so each bearing bottoms
      on the shoulder and finishes flush with its face, and the bearing width tolerance
      drops out.
- id: c_shoulder_clear
  part: wheel
  feature: shoulder bore dia 14
  relation: clears
  hardware: bearing
  clearance_mm: 1.3
  params:
  - shoulder_bore_d
  - bearing_inner_ring_od
  check:
    method: none
    ref: null
    description: 1.3 mm larger than the 608 inner-ring OD, so the shoulder touches
      only the rotating outer rings; and larger than the 12 mm middle ring, which
      must be dropped through it.
- id: c_ring_seat
  part: ring
  feature: dia 12 face
  relation: seats
  hardware: bearing
  clearance_mm: 0.7
  params:
  - ring_od
  - bearing_inner_ring_od
  check:
    method: none
    ref: null
    description: The ring is 0.7 mm smaller than the inner-ring OD, so it bears on
      the inner ring and misses the shield.
- id: c_ring_cover
  part: ring
  feature: dia 12 outer face
  relation: seats
  hardware: bolt
  clearance_mm: null
  params:
  - ring_od
  - bolt_head_d
  check:
    method: none
    ref: null
    description: The bolt head (13.0 across) and the lock nut (13 A/F) both fully
      cover the 12 mm ring face, so the clamping load enters the ring as compression,
      not bending.
- id: c_ring_bore
  part: ring
  feature: bore dia 8.3
  relation: clears
  hardware: bolt
  clearance_mm: 0.4
  params:
  - ring_id
  - bolt_shank_d
  check:
    method: measure
    ref: null
    description: All three rings must slide onto the bolt's shank with a little play.
- id: c_spacer_fit
  part: ring
  feature: middle ring, 1.9 mm long
  relation: clears
  hardware: null
  clearance_mm: 0.1
  params:
  - ring_len
  - shoulder_w
  check:
    method: none
    ref: null
    description: The middle ring is 0.1 mm shorter than the 2 mm shoulder gap on purpose,
      so the clamp always closes and matches up as a few microns of axial shift in
      the bearings rather than a preload.
- id: c_plate_clear
  part: wheel
  feature: outer face at z = 0
  relation: clears
  hardware: null
  clearance_mm: 1.9
  params:
  - ring_len
  - plate_t
  check:
    method: measure
    ref: null
    description: Outer ring A stands 1.9 mm proud of the wheel face, so the stationary
      hanger plate clears the spinning wheel. Check with a feeler gauge or by eye
      once the nut is snug.
- id: c_bolt_reach
  part: ring
  feature: outer face at the lock nut
  relation: engages
  hardware: bolt
  clearance_mm: null
  params:
  - bolt_len
  - plate_t
  - ring_len
  - wheel_w
  - nut_h
  check:
    method: measure
    ref: null
    description: Needs bolt_len >= plate_t + 2 x ring_len + wheel_w + nut_h = 30.8
      mm; the M8x35 gives about 4 mm of thread past the lock nut. Check your own bolt
      against this before assembling.
manual:
- n: '1'
  text: Print the coupon in PLA at 0.2 mm layers, flat, as sliced. Press one 608ZZ
    bearing into each of the five holes by hand or in a vise - they are through-holes,
    so push each bearing back out from underneath. Pick the hole that grips the bearing
    firmly with no rock and no rattle but can still be pressed in by hand.
  parts:
  - coupon
  hardware:
  - bearing
  tool: vise
- n: '2'
  text: If that best hole is not the 21.9 one, open the wheel file and change socket_d
    to that diameter (the five holes are 21.6, 21.75, 21.9, 22.05, 22.2). This is
    the only value you need to change.
  parts:
  - wheel
  hardware: []
  tool: ''
- n: '3'
  text: 'Print the wheel flat, as sliced: 0.2 mm layers, 4 walls, 30% infill, 6 solid
    top/bottom layers, same filament as the coupon. Print one wheel per roller you
    are replacing - the one that snapped, plus its partner on the other side of the
    door if it is worn.'
  parts:
  - wheel
  hardware: []
  tool: ''
- n: '4'
  text: 'Print three rings per wheel. All three are the same 1.9 mm part: one for
    the middle, two for the outside faces.'
  parts:
  - ring
  hardware: []
  tool: ''
- n: '5'
  text: 'Press one bearing into face A of the wheel, squarely, until it stops on the
    internal shoulder - its outer face should then sit flush with the wheel face.
    Push only on the bearing''s OUTER ring: a vise with flat jaws, or a soft mallet
    tapping a socket or short pipe that rests on the outer ring. Never press on the
    inner ring or on the shield. If it is very tight, stand the wheel in roughly 60
    C water for a minute first; PLA softens and the bearing will press in, then grips
    hard as it cools.'
  parts:
  - wheel
  hardware:
  - bearing
  tool: vise, or mallet plus a socket or pipe, and a warm water bath
- n: '6'
  text: Drop one ring into the middle of the wheel. It sits in the dia 14 bore and
    rests on the first bearing's inner ring. Do this now, before the second bearing
    goes in - the ring is 12 mm across and will not pass through a bearing bore.
  parts:
  - wheel
  - ring
  hardware: []
  tool: ''
- n: '7'
  text: Press the second bearing into face B the same way, outer ring only, until
    it stops on the shoulder. It closes onto the middle ring, which is now trapped
    between the two inner rings.
  parts:
  - wheel
  - ring
  hardware:
  - bearing
  tool: vise, or mallet plus a socket or pipe
- n: '8'
  text: 'Sit one ring over each bearing''s exposed face, on the outside of the wheel.
    You now have ring - wheel - ring, with nothing touching the shields. Spin test
    on the bench: slide the bolt through the stack of inner rings and turn the wheel.
    It must turn freely and evenly with no scraping and no rocking.'
  parts:
  - wheel
  - ring
  hardware:
  - bolt
  - bearing
  tool: ''
- n: '9'
  text: 'On the door: pass the M8x35 bolt through the axle hole in the hanger plate
    from the outside, then slide on the wheel assembly, then spin on the lock nut.
    Order from the head: head, plate, ring, wheel, ring, lock nut. If the plate''s
    hole is smaller than 8.4 mm, drill it out to 9 mm first.'
  parts:
  - wheel
  - ring
  hardware:
  - bolt
  - nut
  tool: 6 mm hex key and 13 mm spanner (drill only if the plate hole needs opening
    out)
- n: '10'
  text: Tighten the lock nut just snug - enough to take up the play, not to crush
    the printed rings. The clamp runs head, plate, ring, inner ring, middle ring,
    inner ring, ring, nut, so the bolt is locked to the door and the wheel turns on
    the bearings. Check that the wheel spins freely, that it turns without scraping,
    and that its face clears the hanger plate by about 1.9 mm. If your bolt sticks
    out a long way past the nut, cut the excess thread off with a hacksaw and tidy
    the end with a file.
  parts:
  - wheel
  - ring
  hardware:
  - bolt
  - nut
  tool: 6 mm hex key and 13 mm spanner
- n: '11'
  text: Refit the door on the track. The rim is flat with a rounded edge, so the wheel
    runs on a flat track or on a rail, and it should not need to be perfectly centred.
    Roll the door its full length and check it runs smoothly, then adjust the door's
    height/guide hardware as you normally would.
  parts:
  - wheel
  hardware: []
  tool: ''
