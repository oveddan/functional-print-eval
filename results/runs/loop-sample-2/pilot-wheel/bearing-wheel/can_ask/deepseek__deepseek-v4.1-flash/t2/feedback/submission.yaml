criteria:
- id: c_seat
  part: wheel
  feature: bearing seat, both faces (Ã¸socket_d x bearing_w deep)
  relation: contains
  hardware: bearing
  clearance_mm: 0.2
  params:
  - socket_d
  - bearing_od
  - bearing_w
  check:
    method: coupon
    ref: coupon
    description: 'Your coupon run: the Ã¸21.59, Ã¸21.74 and Ã¸21.89 seats would not
      take a 608 bearing; the Ã¸22.19 seat accepted one and held it upside down. socket_d
      is therefore set to 22.20, the proven value. If the real wheel''s seats turn
      out looser than the coupon suggested, add a wrap of PTFE tape or a drop of cyanoacrylate
      - the bearings are retained by friction alone, so the seat must grip.'
- id: c_shoulder
  part: wheel
  feature: internal shoulder (2 mm wide, between the two seats)
  relation: supports
  hardware: bearing
  clearance_mm: null
  params:
  - wheel_w
  - bearing_w
  - shoulder_w
  check:
    method: none
    ref: null
    description: wheel_w = 2 x bearing_w + shoulder_w = 16.0, so both outer rings
      butt on the shoulder and each bearing finishes flush with its face.
- id: c_shoulder_clear
  part: wheel
  feature: shoulder bore Ã¸14
  relation: clears
  hardware: bearing
  clearance_mm: 1.3
  params:
  - shoulder_bore_d
  - bearing_inner_ring_od
  check:
    method: none
    ref: null
    description: 1.3 mm larger than the 608 inner-ring OD, so the shoulder touches
      only the rotating outer rings and no stationary part can drag on the wheel.
- id: c_ring_seat
  part: ring
  feature: Ã¸12 face
  relation: seats
  hardware: bearing
  clearance_mm: 0.7
  params:
  - ring_od
  - bearing_inner_ring_od
  check:
    method: none
    ref: null
    description: The ring is 0.7 mm smaller than the inner-ring OD, so it presses
      the inner ring only and never the shield; the nut (13 A/F) and the bolt head
      (Ã¸13) both land on the ring, not on the bearing.
- id: c_ring_bore
  part: ring
  feature: bore Ã¸8.4
  relation: clears
  hardware: bolt
  clearance_mm: 0.4
  params:
  - ring_id
  - bolt_shank_d
  check:
    method: measure
    ref: null
    description: The three rings must slide onto the bolt's shank with a little play.
- id: c_plate_clear
  part: wheel
  feature: outer face at z = 0
  relation: clears
  hardware: null
  clearance_mm: 2.0
  params:
  - ring_len
  - plate_t
  check:
    method: measure
    ref: null
    description: Outer ring A stands 2 mm proud of the wheel face, so the stationary
      hanger plate clears the spinning wheel by 2 mm when the stack is snug.
- id: c_bolt_reach
  part: ring
  feature: outer face at the lock nut
  relation: engages
  hardware: bolt
  clearance_mm: null
  params:
  - bolt_len
  - plate_t
  - ring_len
  - wheel_w
  - nut_h
  check:
    method: measure
    ref: null
    description: Needs bolt_len >= plate_t + 2 x ring_len + wheel_w + nut_h = 31 mm;
      the M8x35 gives 4 mm of thread past the lock nut. Check your own bolt against
      this before assembling.
manual:
- n: '1'
  text: 'Coupon done: the Ã¸22.19 seat held a 608 upside down, so socket_d is now
    22.20 and there is nothing left to test. Skip the coupon and go straight to printing
    (it is in the parts list for the record only).'
  parts: []
  hardware: []
  tool: ''
- n: '2'
  text: 'Print the wheel flat, as modelled, in PLA at 0.2 mm layers - the same filament
    and layer height you used for the coupon. Print one wheel for every roller you
    are replacing: the one that snapped, and its partner on the other side of the
    door if it is worn.'
  parts:
  - wheel
  hardware: []
  tool: ''
- n: '3'
  text: 'Print three rings per wheel (part: ring). They are all identical - two for
    the outside faces and one for the middle.'
  parts:
  - ring
  hardware: []
  tool: ''
- n: '4'
  text: 'Press one bearing into one face of the wheel and one into the other face,
    from opposite sides, until each bearing sits flush with the wheel face. Do not
    press either one in past its face: the two bearings meet on the 2 mm shoulder
    in the middle. Start them in the Ã¸23.2 lead-in counterbore and draw them down
    squarely - a bolt, two nuts and a washer through the bearing bore works as a press
    if hand pressure is not enough.'
  parts:
  - wheel
  hardware:
  - bearing
  - bolt
  - nut
  tool: vice, or an M8 bolt used as a press
- n: '5'
  text: Drop one ring into the middle of the wheel so it sits between the two bearing
    inner rings, inside the Ã¸14 bore. Check by eye that it fills the gap without
    rattling.
  parts:
  - wheel
  - ring
  hardware: []
  tool: ''
- n: '6'
  text: 'Bench spin test: slide the bolt through the stack of inner rings and turn
    the wheel. It must spin freely with no scraping and no rocking. If a bearing turns
    in its seat instead of the wheel turning on the bearing, that seat is too loose
    - pull the bearing out and add a wrap of PTFE tape or a drop of cyanoacrylate.'
  parts:
  - wheel
  - ring
  hardware:
  - bolt
  - bearing
  tool: ''
- n: '7'
  text: 'On the door: pass the M8x35 bolt through the axle hole in the hanger plate
    from the outside, then slide on one ring, then the wheel assembly, then the second
    ring, then spin on the lock nut. Order from the bolt head: plate, ring, wheel,
    ring, lock nut. If the plate''s hole is under Ã¸8.4, drill it out to 9 mm first.'
  parts:
  - wheel
  - ring
  hardware:
  - bolt
  - nut
  tool: drill (only if the plate hole needs opening out)
- n: '8'
  text: 'Tighten the lock nut snugly - just enough to take up the play. The clamping
    force runs head-plate-ring-inner ring-spacer ring-inner ring-ring-nut, so the
    bolt is locked to the door and the wheel turns on the bearings. Do not over-tighten:
    the rings are PLA. Check that the wheel spins freely and that its face clears
    the hanger plate by about 2 mm.'
  parts:
  - wheel
  - ring
  hardware:
  - bolt
  - nut
  tool: 6 mm hex key and 13 mm spanner
- n: '9'
  text: Refit the door on the track. The rim is flat with a rounded edge, so it runs
    on a flat track or a raised rail; the wheel should sit on the track without the
    plate or the bolt end fouling anything. Roll the door its full length and check
    it runs smoothly.
  parts:
  - wheel
  hardware: []
  tool: ''
