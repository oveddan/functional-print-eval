  - part: ring
    feature: bore - spacer between the two bearing inner rings
    role: clearance
  - part: wheel
    feature: bearing seat, face at z = 16 (Ã¸22.20 x 7)
    role: clearance
  - part: ring
    feature: bore - outer ring B, between the wheel and the lock nut
