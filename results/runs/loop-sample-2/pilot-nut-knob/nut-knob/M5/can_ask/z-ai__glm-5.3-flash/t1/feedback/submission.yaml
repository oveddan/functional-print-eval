task: nut-knob/M5
note: 'Fluted hand knob Ø30 × 15 for an M5 bolt. The ISO 4032 M5 nut presses by hand
  into a blind hex pocket in the top face and is captured by an internal snap ring:
  the ring''s across-flats is 0.15 mm under the nut, so once past it the nut cannot
  come back out the mouth (it would take deliberate force, not gravity — upside-down
  safe), and the solid floor means it can never be pushed out the far side. No glue.
  Since the first coupon''s fit wasn''t reported, the ring was softened from 0.25
  to 0.15 mm undersize for an easier thumb press; if the coupon shows the middle pocket
  too tight, reprint with p.pocket_snap_under = 0.10, and if the nut rattles or drops
  out, use 0.25. Manual includes a bolt-plunger insertion method as the high-force
  fallback.'
questions:
- text: 'If you can check the updated coupon: which pocket presses in with a firm
    thumb press AND holds the nut upside-down? (1 dot = 0.10, 2 dots = 0.15 shipped
    in the knob, 3 dots = 0.25 mm undersize)'
  answer: null
- text: In the knob, did the nut pass the snap ring and sit about 0.4 mm below the
    top surface? If it stopped proud of the surface, it did not pass the ring — use
    the bolt-plunger method from the manual.
  answer: null
params:
  bolt_hole_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: M5 shank Ø5.0 -> 0.5 mm clearance
  coupon_dia:
    value: 44
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_t:
    value: 6
    unit: mm
    kind: design
    source: design
    note: ''
  flute_n:
    value: 12
    unit: count
    kind: design
    source: design
    note: ''
  flute_r:
    value: 2.2
    unit: mm
    kind: design
    source: design
    note: ''
  flute_stick:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: flute depth = flute_r - flute_stick = 1.6 mm
  knob_h:
    value: 15
    unit: mm
    kind: design
    source: design
    note: clears the 5.1 mm pocket with a solid floor for the bolt
  knob_od:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: 'user: ''about 30 mm across'''
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats; actual nut not measurable — coupon covers the
      delta
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 nut thickness
  pocket_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: 45 deg lead-in at the pocket mouth
  pocket_recess:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: nut top sits 0.4 mm below the face -> fully inside
  pocket_slip_add:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: 'slip zones: across flats = nut_af + 0.10'
  pocket_slip_zone:
    value: 2.2
    unit: mm
    kind: design
    source: design
    note: height of the slip zone above the ring
  pocket_snap_under:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: snap ring across flats = nut_af - 0.15; softened from 0.25 after no coupon
      feedback — easier hand press, still a mechanical capture gravity cannot defeat
  snap_ring_h:
    value: 0.9
    unit: mm
    kind: design
    source: design
    note: snap ring band height
parts:
- id: hand_knob
  role: final
  material: PLA (high-speed, black)
  code: "import math\n\ndef build(p):\n    od = p.knob_od\n    h = p.knob_h\n    ch\
    \ = p.pocket_chamfer\n    C = math.cos(math.pi / 6.0)\n    af1 = p.nut_af + p.pocket_slip_add\
    \      # slip zone across flats\n    af2 = p.nut_af - p.pocket_snap_under    #\
    \ snap ring across flats\n    depth = p.nut_h + p.pocket_recess       # blind\
    \ pocket depth\n    s1 = p.pocket_slip_zone                 # slip zone above\
    \ the ring\n    ring = p.snap_ring_h                    # snap ring band height\n\
    \    s2 = depth - ch - s1 - ring             # slip zone below the ring\n    assert\
    \ s2 > 0.3, \"pocket too shallow for zone stack\"\n\n    # body: fluted cylinder,\
    \ bolt-exit face down (z=0)\n    k = cq.Workplane(\"XY\").circle(od / 2.0).extrude(h)\n\
    \    k = k.edges(\">Z\").chamfer(1.0)\n    k = k.edges(\"<Z\").chamfer(0.6)\n\n\
    \    # bolt through-hole with countersink on the exit face\n    k = (k.faces(\"\
    <Z\").workplane()\n           .cskHole(p.bolt_hole_d, p.bolt_hole_d + 1.8, 90))\n\
    \n    def hexp(x, af, z0, z1):\n        return (cq.Workplane(\"XY\", origin=(x,\
    \ 0.0, z0))\n                .polygon(6, af / C).extrude(z1 - z0))\n\n    # nut\
    \ pocket: blind hex cavity, snap ring near the floor\n    k = k.cut(hexp(0.0,\
    \ af1, h - ch - s1, h - ch + 0.01))\n    k = k.cut(hexp(0.0, af2, h - ch - s1\
    \ - ring, h - ch - s1 + 0.01))\n    k = k.cut(hexp(0.0, af1, h - depth, h - ch\
    \ - s1 - ring + 0.01))\n\n    # 45 deg lead-in at the mouth (lofted hex, extended\
    \ past the face for a clean cut)\n    mouth = (cq.Workplane(\"XY\", origin=(0.0,\
    \ 0.0, h - ch))\n             .polygon(6, af1 / C)\n             .workplane(offset=ch\
    \ + 0.5)\n             .polygon(6, (af1 + 2.0 * (ch + 0.5)) / C)\n           \
    \  .loft(ruled=True))\n    k = k.cut(mouth)\n\n    # vertical flutes for grip\n\
    \    for i in range(int(p.flute_n)):\n        a = 2.0 * math.pi * i / p.flute_n\n\
    \        cx = (od / 2.0 + p.flute_stick) * math.cos(a)\n        cy = (od / 2.0\
    \ + p.flute_stick) * math.sin(a)\n        k = k.cut(cq.Workplane(\"XY\", origin=(cx,\
    \ cy, -0.01))\n                  .circle(p.flute_r).extrude(h + 0.02))\n    return\
    \ k"
  print_orientation: 'As modeled: bolt-exit face down on the bed, nut pocket opening
    up — pocket prints support-free'
  use_orientation: Bolt-exit face down against the work; flutes gripped by thumb and
    fingers; nut pocket face up
- id: nut_fit_coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "import math\n\ndef build(p):\n    dia = p.coupon_dia\n    t = p.coupon_t\n\
    \    ch = p.pocket_chamfer\n    C = math.cos(math.pi / 6.0)\n    af1 = p.nut_af\
    \ + p.pocket_slip_add\n    depth = p.nut_h + p.pocket_recess\n    s1 = p.pocket_slip_zone\n\
    \    ring = p.snap_ring_h\n    s2 = depth - ch - s1 - ring\n    assert s2 > 0.3\
    \ and (t - depth) >= 0.8\n\n    c = cq.Workplane(\"XY\").circle(dia / 2.0).extrude(t)\n\
    \    c = c.edges(\">Z\").chamfer(0.5)\n\n    undersizes = [0.10, 0.15, 0.25]\n\
    \    xs = [-14.0, 0.0, 14.0]\n    for x, u in zip(xs, undersizes):\n        af2\
    \ = p.nut_af - u\n\n        def hexp(x0, af, z0, z1):\n            return (cq.Workplane(\"\
    XY\", origin=(x0, 0.0, z0))\n                    .polygon(6, af / C).extrude(z1\
    \ - z0))\n\n        c = c.cut(hexp(x, af1, t - ch - s1, t - ch + 0.01))\n    \
    \    c = c.cut(hexp(x, af2, t - ch - s1 - ring, t - ch - s1 + 0.01))\n       \
    \ c = c.cut(hexp(x, af1, t - depth, t - ch - s1 - ring + 0.01))\n        mouth\
    \ = (cq.Workplane(\"XY\", origin=(x, 0.0, t - ch))\n                 .polygon(6,\
    \ af1 / C)\n                 .workplane(offset=ch + 0.5)\n                 .polygon(6,\
    \ (af1 + 2.0 * (ch + 0.5)) / C)\n                 .loft(ruled=True))\n       \
    \ c = c.cut(mouth)\n\n    # engraved dot marks: 1 dot = 0.10, 2 dots = 0.15, 3\
    \ dots = 0.25 undersize\n    for i, x in enumerate(xs):\n        for j in range(i\
    \ + 1):\n            dx = x + (j - i / 2.0) * 3.6\n            c = c.cut(cq.Workplane(\"\
    XY\", origin=(dx, -11.5, t - 0.7))\n                      .circle(1.1).extrude(0.8))\n\
    \    return c"
  print_orientation: Flat on the bed, pockets up, dots up — all features support-free
  use_orientation: 'Pockets up, dots toward you: left = 1 dot (0.10), middle = 2 dots
    (0.15, matches the knob), right = 3 dots (0.25) mm undersize'
hardware:
- id: m5_nut
  ref: ISO 4032 M5
  qty: 1
joints:
- id: nut_capture
  fastener: m5_nut
  axis_origin:
  - 0.0
  - 0.0
  - 15.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: hand_knob
    feature: 'blind hex nut pocket: 45° lead-in, snap ring at nut_af-0.15, floor at
      nut_h+0.4'
    role: nut_pocket
  nut: null
  external: 'user''s own M5 bolt: threads through the captured nut and out the bolt-exit
    face'
criteria:
- id: c_press
  part: hand_knob
  feature: nut pocket mouth, slip zones and snap ring
  relation: engages
  hardware: m5_nut
  clearance_mm: null
  params:
  - nut_af
  - pocket_slip_add
  - pocket_snap_under
  - pocket_chamfer
  - pocket_slip_zone
  - snap_ring_h
  check:
    method: coupon
    ref: nut_fit_coupon
    description: Nut presses into the pocket with a firm thumb press (or the bolt-plunger
      method) and clicks past the snap ring without stopping proud of the surface
- id: c_retain
  part: hand_knob
  feature: snap ring
  relation: contains
  hardware: m5_nut
  clearance_mm: null
  params:
  - nut_af
  - pocket_snap_under
  - snap_ring_h
  check:
    method: coupon
    ref: nut_fit_coupon
    description: 'Hold the coupon pocket-down and tap it on the table: the nut must
      not drop out. A hex opening 0.15 mm narrower across flats than the nut cannot
      be passed by gravity'
- id: c_blind
  part: hand_knob
  feature: pocket floor
  relation: supports
  hardware: m5_nut
  clearance_mm: null
  params:
  - nut_h
  - pocket_recess
  check:
    method: none
    ref: null
    description: 'Pocket depth is nut_h + 0.4: the nut''s top sits 0.4 mm below the
      face, fully inside, and the floor blocks any push toward the far side; only
      the Ø5.5 bolt hole pierces the floor'
- id: c_bolt
  part: hand_knob
  feature: centre hole with countersink
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - bolt_hole_d
  check:
    method: none
    ref: null
    description: M5 bolt shank Ø5.0 passes the Ø5.5 hole with 0.5 mm clearance and
      threads through the captured nut; threads passing through are fine at this size
manual:
- n: '1'
  text: 'Print the fit-test coupon flat (pockets and dots up), no supports. Three
    pockets, marked with 1, 2, 3 engraved dots: 0.10 / 0.15 / 0.25 mm undersize. The
    knob is built with the middle (2-dot) pocket.'
  parts:
  - nut_fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: On a hard surface, press the M5 nut straight down into the middle pocket with
    your thumb, turning it slightly as it goes. It should take a firm press and click
    in, ending about 1 mm below the coupon's surface. Compare with the 1-dot pocket
    (easier) and the 3-dot pocket (firmer).
  parts:
  - nut_fit_coupon
  hardware:
  - m5_nut
  tool: null
- n: '3'
  text: 'Turn the coupon pocket-down and tap it on the table: the nut must not drop
    out. If the middle pocket is too tight to press by hand, reprint the knob with
    pocket_snap_under = 0.10; if the nut drops or rattles out, use 0.25.'
  parts:
  - nut_fit_coupon
  hardware:
  - m5_nut
  tool: null
- n: '4'
  text: Print the knob, bolt-exit face down, pocket opening up, no supports.
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '5'
  text: Press the nut into the knob's top pocket exactly as you did with the coupon's
    middle pocket, until its top sits about 0.4 mm below the surface with a click
    past the snap ring.
  parts:
  - hand_knob
  hardware:
  - m5_nut
  tool: null
- n: 5b
  text: 'Fallback if the press is too firm: thread your M5 bolt about five turns into
    the nut, lower the assembly nut-first into the pocket, and push down on the bolt
    head with your palm — the bolt acts as a plunger and drives the nut past the ring.
    Then hold the bolt shank and unscrew the bolt out of the captured nut; the pocket
    keeps the nut from spinning.'
  parts:
  - hand_knob
  hardware:
  - m5_nut
  tool: null
- n: '6'
  text: Thread your M5 bolt up through the countersunk centre hole into the nut and
    turn the knob by the flutes to tighten. The captured nut drives the bolt; the
    bolt tail passes out the other side.
  parts:
  - hand_knob
  hardware:
  - m5_nut
  tool: null
- n: '7'
  text: 'To remove the nut later (it is captured, not glued): lever it out with a
    small flat screwdriver at the snap-ring lip — tilt one end of the nut up past
    the ring and it pops out.'
  parts:
  - hand_knob
  hardware:
  - m5_nut
  tool: null
