task: nut-knob/M5
note: 'REVISED after re-checking v1: the pocket is flipped so retention is geometric,
  not friction. The capture collar sits just inside the mouth; after the nut snaps
  through it, its face seats against the wide pocket floor, and the collar''s ledge
  sits 0.2 mm above the nut''s other face - a hard stop when the knob is inverted
  (no glue, no friction reliance). Clamp load path: the bolt''s thread thrust always
  presses the nut INTO the pocket against the ~29 mm2 floor annulus - the thin ledge
  above never carries the load. Torque comes from near-flush drive walls (nut_af +
  0.20). Print the coupon first: three pockets with collar undersize 0.10/0.20/0.30
  (dots 1/2/3) to pick the press feel; the knob ships with 0.20 (set p.pocket_snap_under
  to 0.10 or 0.30 and reprint if preferred). The nut is a permanent capture - pry
  it out to reclaim it.'
questions:
- text: 'Coupon: which pocket pressed in by hand and held the nut when inverted? (1
    dot = 0.10, 2 dots = 0.20, 3 dots = 0.30 mm collar undersize)'
  answer: null
- text: 'In the knob: did the nut seat about 2 mm below the mouth face, stop dead
    when inverted, and drive without free-spinning when you turn the knob on the bolt?'
  answer: null
params:
  bolt_hole_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: M5 shank dia 5.0 -> 0.25/side clearance; threads pass through the nut and
      out the top
  capture_gap:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: gap between the seated nut's mouth-side face and the ledge when the nut
      bears on the floor - this makes the inverted stop geometric
  collar_h:
    value: 1
    unit: mm
    kind: design
    source: design
    note: capture collar band height
  coupon_dia:
    value: 44
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_t:
    value: 8
    unit: mm
    kind: design
    source: design
    note: pocket depth 6.9 + 1.1 floor
  drive_add:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: 'drive zone across flats = nut_af + 0.20: wall-contact hex drive, tolerant
      of FDM hole undersize'
  flute_n:
    value: 12
    unit: count
    kind: design
    source: design
    note: ''
  flute_r:
    value: 2.2
    unit: mm
    kind: design
    source: design
    note: ''
  flute_stick:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: flute depth = flute_r - flute_stick = 1.6 mm
  knob_h:
    value: 15
    unit: mm
    kind: design
    source: design
    note: 6.9 mm pocket + 8.1 mm floor
  knob_od:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: 'user: about 30 mm across'
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats; actual nut could not be measured - the coupon
      brackets the press feel
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 nut thickness
  pocket_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: 45 deg lead-in at the mouth
  pocket_snap_under:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: collar across flats = nut_af - 0.20; middle coupon variant
parts:
- id: hand_knob
  role: final
  material: PLA (high-speed, black)
  code: "import math\n\ndef build(p):\n    od = p.knob_od\n    h = p.knob_h\n    ch\
    \ = p.pocket_chamfer\n    C = math.cos(math.pi / 6.0)\n    af_drive = p.nut_af\
    \ + p.drive_add      # torque-drive hex walls\n    af_ring = p.nut_af - p.pocket_snap_under\
    \  # capture collar\n    ring = p.collar_h\n    gap = p.capture_gap\n    assert\
    \ gap > 0.05\n    depth = p.nut_h + gap + ring + ch      # mouth -> pocket floor\n\
    \    z_floor = h - depth\n    z_led = h - ch - ring                  # capture\
    \ ledge plane\n\n    # body: fluted cylinder, bolt-exit face down (z=0), mouth\
    \ up (z=h)\n    k = cq.Workplane(\"XY\").circle(od / 2.0).extrude(h)\n    k =\
    \ k.edges(\">Z\").chamfer(1.0)\n    k = k.edges(\"<Z\").chamfer(0.6)\n\n    #\
    \ bolt through-hole with chamfer on the exit face\n    k = (k.faces(\"<Z\").workplane()\n\
    \           .cskHole(p.bolt_hole_d, p.bolt_hole_d + 1.2, 90))\n\n    def hexp(af,\
    \ z0, z1):\n        return (cq.Workplane(\"XY\", origin=(0.0, 0.0, z0))\n    \
    \            .polygon(6, af / C).extrude(z1 - z0))\n\n    # drive zone: pocket\
    \ floor up to the capture ledge\n    k = k.cut(hexp(af_drive, z_floor - 0.01,\
    \ z_led + 0.01))\n    # capture collar: narrow band just inside the mouth\n  \
    \  k = k.cut(hexp(af_ring, z_led - 0.01, h - ch + 0.01))\n    # 45 deg lead-in\
    \ from the collar to the mouth (overshoot for clean cut)\n    mouth = (cq.Workplane(\"\
    XY\", origin=(0.0, 0.0, h - ch))\n             .polygon(6, af_ring / C)\n    \
    \         .workplane(offset=ch + 0.5)\n             .polygon(6, (af_ring + 2.0\
    \ * (ch + 0.5)) / C)\n             .loft(ruled=True))\n    k = k.cut(mouth)\n\n\
    \    # vertical flutes for grip\n    for i in range(int(p.flute_n)):\n       \
    \ a = 2.0 * math.pi * i / p.flute_n\n        cx = (od / 2.0 + p.flute_stick) *\
    \ math.cos(a)\n        cy = (od / 2.0 + p.flute_stick) * math.sin(a)\n       \
    \ k = k.cut(cq.Workplane(\"XY\", origin=(cx, cy, -0.01))\n                  .circle(p.flute_r).extrude(h\
    \ + 0.02))\n    return k"
  print_orientation: 'As modeled: bolt-exit face down on the bed, pocket opening up;
    only overhang is the 0.2 mm ledge annulus - no supports needed'
  use_orientation: Mouth (pocket opening) down against the work - the ring around
    the mouth is the clamping face; flutes for fingers; bolt tip runs up through the
    nut and out the hole in the top
- id: nut_fit_coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "import math\n\ndef build(p):\n    dia = p.coupon_dia\n    t = p.coupon_t\n\
    \    ch = p.pocket_chamfer\n    C = math.cos(math.pi / 6.0)\n    af_drive = p.nut_af\
    \ + p.drive_add\n    ring = p.collar_h\n    gap = p.capture_gap\n    depth = p.nut_h\
    \ + gap + ring + ch\n    assert (t - depth) >= 0.8\n    z_floor = t - depth\n\
    \    z_led = t - ch - ring\n\n    c = cq.Workplane(\"XY\").circle(dia / 2.0).extrude(t)\n\
    \    c = c.edges(\">Z\").chamfer(0.5)\n\n    undersizes = [0.10, 0.20, 0.30]\n\
    \    xs = [-14.0, 0.0, 14.0]\n    for x, u in zip(xs, undersizes):\n        af_ring\
    \ = p.nut_af - u\n\n        def hexp(x0, af, z0, z1):\n            return (cq.Workplane(\"\
    XY\", origin=(x0, 0.0, z0))\n                    .polygon(6, af / C).extrude(z1\
    \ - z0))\n\n        c = c.cut(hexp(x, af_drive, z_floor - 0.01, z_led + 0.01))\n\
    \        c = c.cut(hexp(x, af_ring, z_led - 0.01, t - ch + 0.01))\n        mouth\
    \ = (cq.Workplane(\"XY\", origin=(x, 0.0, t - ch))\n                 .polygon(6,\
    \ af_ring / C)\n                 .workplane(offset=ch + 0.5)\n               \
    \  .polygon(6, (af_ring + 2.0 * (ch + 0.5)) / C)\n                 .loft(ruled=True))\n\
    \        c = c.cut(mouth)\n\n    # engraved dot marks: 1 dot = 0.10, 2 dots =\
    \ 0.20, 3 dots = 0.30 undersize\n    for i, x in enumerate(xs):\n        for j\
    \ in range(i + 1):\n            dx = x + (j - i / 2.0) * 3.6\n            c =\
    \ c.cut(cq.Workplane(\"XY\", origin=(dx, -11.5, t - 0.7))\n                  \
    \    .circle(1.1).extrude(0.8))\n    return c"
  print_orientation: Flat on the bed, pockets up, dots up - no supports
  use_orientation: 'Pockets up, dots toward you: left = 1 dot (0.10), middle = 2 dots
    (0.20), right = 3 dots (0.30) mm collar undersize'
