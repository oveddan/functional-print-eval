task: nut-knob/M3
note: 20 mm scalloped knob with three press-fit ribs, a positive nut stop, and a 3.5
  mm through-hole. Fit is untested.
questions: []
params:
  af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  nh:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bd:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  od:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
  crush:
    value: 0.18
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n h=7; d=p.nh+0.6; z=h-d; a=(p.af+0.16)/2\n b=cq.Workplane('XY').circle(p.od/2).extrude(h)\n\
    \ for i in range(8):\n  t=i*math.pi/4\n  b=b.cut(cq.Workplane('XY').center(p.od/2*math.cos(t),p.od/2*math.sin(t)).circle(1.5).extrude(h))\n\
    \ pts=[(a/math.cos(math.pi/6)*math.cos(i*math.pi/3+math.pi/6),a/math.cos(math.pi/6)*math.sin(i*math.pi/3+math.pi/6))\
    \ for i in range(6)]\n pocket=cq.Workplane('XY',origin=(0,0,z)).polyline(pts).close().extrude(d)\n\
    \ for i in (0,2,4):\n  rib=cq.Workplane('XY').box(0.7,0.85,d-0.45,centered=(True,True,False)).translate((a-p.crush+0.35,0,z)).rotate((0,0,0),(0,0,1),60*i)\n\
    \  pocket=pocket.cut(rib)\n return b.cut(pocket).cut(cq.Workplane('XY').circle((p.bd+0.5)/2).extrude(h))"
  print_orientation: Flat shoulder down, pocket up.
  use_orientation: Pocket faces incoming bolt.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print pocket up without supports; clear any strings.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align the flats and press the nut squarely by hand until it bottoms below
    the rim.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Invert and lightly shake to verify retention. Thread your M3 bolt through
    and verify it exits freely. If loose, increase crush by 0.05 mm and reprint; if
    too tight for hand insertion, decrease crush by 0.05 mm and reprint.
  parts:
  - knob
  hardware:
  - nut
  tool: null
