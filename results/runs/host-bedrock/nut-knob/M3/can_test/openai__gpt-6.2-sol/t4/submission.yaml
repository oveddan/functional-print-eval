task: nut-knob/M3
note: ''
questions: []
params:
  od:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
  af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  nh:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  pinch:
    value: 0.18
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n s=cq.Workplane('XY').circle(p.od/2).extrude(7)\n\
    \ for i in range(8):\n  a=i*math.pi/4\n  s=s.cut(cq.Workplane('XY').center(p.od/2*math.cos(a),p.od/2*math.sin(a)).circle(2).extrude(7))\n\
    \ k=2/math.sqrt(3)\n h=p.nh+0.6\n pocket=cq.Workplane('XY').workplane(offset=7-h).polygon(6,k*(p.af-p.pinch)).workplane(offset=h).polygon(6,k*(p.af+0.25)).loft(ruled=True)\n\
    \ return s.cut(pocket).cut(cq.Workplane('XY').circle(1.75).extrude(7))"
  print_orientation: Round-hole face at z=0; pocket up.
  use_orientation: Round-hole face toward work.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print pocket up without supports. Check that your M3 bolt slips through the
    round bore.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align the flats and press the nut straight in by hand until it bottoms below
    the rim. Invert and gently shake over a tray. If loose, increase pinch slightly
    and reprint; if too tight to seat by hand, decrease pinch slightly and reprint.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Thread your bolt through the nut and confirm it exits the opposite face. Use
    with the round-hole face toward the work so tightening seats the nut against the
    internal shoulder.
  parts:
  - knob
  hardware:
  - nut
  tool: null
