task: nut-knob/M3
note: 20 mm scalloped knob with a recessed hex press fit and a solid shoulder around
  the through-hole.
questions: []
params:
  af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  fit:
    value: -0.06
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    w=cq.Workplane('XY').circle(10).extrude(7)\n\
    \    for i in range(12):\n        a=i*math.pi/6\n        w=w.cut(cq.Workplane('XY').center(10*math.cos(a),10*math.sin(a)).circle(1.6).extrude(7))\n\
    \    d=(p.af+p.fit)/math.cos(math.pi/6)\n    w=w.cut(cq.Workplane('XY').circle((p.d+0.5)/2).extrude(7))\n\
    \    w=w.cut(cq.Workplane('XY').workplane(offset=7-p.h-0.6).polygon(6,d).extrude(p.h+0.6))\n\
    \    return w.cut(cq.Workplane('XY').workplane(offset=6.6).polygon(6,d).workplane(offset=0.4).polygon(6,d+0.8).loft())"
  print_orientation: Exit face on bed; pocket up.
  use_orientation: Nut recess toward bolt entry.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print pocket up without supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align flats and press the nut in by hand until it bottoms. Verify it is below
    the rim and stays in when inverted. If loose, decrease fit by 0.05 mm and reprint;
    if too tight to press in by hand, increase fit by 0.05 mm and reprint.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Start your M3 bolt from the recessed nut side and check that it emerges freely
    from the opposite face.
  parts: []
  hardware: []
  tool: null
