parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    s=cq.Workplane('XY').circle(p.diameter/2).extrude(8)\n\
    \    for i in range(8):\n        a=i*math.pi/4\n        s=s.cut(cq.Workplane('XY').center(10.9*math.cos(a),10.9*math.sin(a)).circle(2).extrude(8))\n\
    \    z=8-p.nut_h-0.4\n    r=(p.af+0.2)/math.sqrt(3)\n    pts=[(r*math.cos(i*math.pi/3),r*math.sin(i*math.pi/3))\
    \ for i in range(6)]\n    s=s.cut(cq.Workplane('XY',origin=(0,0,z)).polyline(pts).close().extrude(8-z))\n\
    \    for i in range(3):\n        a=(2*i+0.5)*math.pi/3\n        d=p.af/2-p.bite+0.48\n\
    \        s=s.union(cq.Workplane('XY',origin=(d*math.cos(a),d*math.sin(a),z)).circle(0.48).extrude(p.nut_h))\n\
    \    return s.cut(cq.Workplane('XY').circle((p.bolt_d+0.5)/2).extrude(8))"
  print_orientation: Flat underside at z=0, pocket up.
  use_orientation: Pocket toward work.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print pocket up at 0.2 mm layers without supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align the flats and press the nut in by hand until it bottoms below the rim.
    Invert and lightly shake. If loose, increase bite and reprint; if too tight for
    hand insertion, decrease bite and reprint.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Verify your M3 bolt threads through and exits the opposite face. Face the
    recess toward the work and hand-tighten only.
  parts:
  - knob
  hardware:
  - nut
  tool: null
