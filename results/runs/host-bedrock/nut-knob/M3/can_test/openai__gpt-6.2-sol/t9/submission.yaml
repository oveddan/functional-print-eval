task: nut-knob/M3
note: One-piece scalloped knob with a chamfered press-fit pocket and an integral stop
  shoulder. Retention is printer-dependent and has not been tested.
questions: []
params:
  af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  od:
    value: 20
    unit: mm
    kind: world
    source: asked
    note: ''
  fit:
    value: -0.06
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n b=cq.Workplane('XY').circle(p.od/2).extrude(8)\n\
    \ for i in range(8):\n  t=i*math.pi/4\n  b=b.cut(cq.Workplane('XY').center((p.od/2+0.7)*math.cos(t),(p.od/2+0.7)*math.sin(t)).circle(1.65).extrude(8))\n\
    \ b=b.cut(cq.Workplane('XY').circle((p.d+0.5)/2).extrude(8))\n a=(p.af+p.fit)/math.cos(math.pi/6)\n\
    \ z=8-p.h-0.5\n pocket=cq.Workplane('XY').workplane(offset=z).polygon(6,a).extrude(8-z)\n\
    \ lead=cq.Workplane('XY').workplane(offset=7.5).polygon(6,a).workplane(offset=0.5).polygon(6,a+0.65).loft()\n\
    \ return b.cut(pocket.union(lead))"
  print_orientation: Flat closed-shoulder face down, pocket up.
  use_orientation: Pocket faces workpiece.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print pocket up at 0.2 mm layers, no supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align the flats and thumb-press the nut squarely until it bottoms below the
    rim.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Invert and lightly shake over your palm, then check that your M3 bolt threads
    through and exits freely. If the nut falls out, reduce fit by 0.05 mm and reprint.
    If it will not seat by hand, increase fit by 0.05 mm and reprint; do not hammer
    it.
  parts:
  - knob
  hardware:
  - nut
  tool: null
