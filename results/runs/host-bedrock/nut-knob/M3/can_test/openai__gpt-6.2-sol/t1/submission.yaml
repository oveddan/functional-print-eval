task: nut-knob/M3
note: 20 mm scalloped knob with a recessed press-fit hex pocket and a solid shoulder
  that prevents the nut pushing through. Check actual retention before use.
questions: []
params:
  dia:
    value: 20
    unit: mm
    kind: world
    source: asked
    note: ''
  af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  nh:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bd:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  fit:
    value: 0.04
    unit: mm
    kind: design
    source: design
    note: ''
  clear:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: ''
  recess:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: ''
  base:
    value: 4
    unit: mm
    kind: design
    source: design
    note: ''
  lead:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: ''
  grip:
    value: 2
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    d=p.nh+p.recess\n    h=p.base+d\n    a=p.af-p.fit\n\
    \    k=2/math.sqrt(3)\n    r=p.dia/2\n    w=cq.Workplane('XY').circle(r).extrude(h)\n\
    \    pts=[(r*math.cos(i*math.pi/4),r*math.sin(i*math.pi/4)) for i in range(8)]\n\
    \    w=w.cut(cq.Workplane('XY').pushPoints(pts).circle(p.grip).extrude(h))\n \
    \   w=w.cut(cq.Workplane('XY').circle((p.bd+p.clear)/2).extrude(h))\n    pocket=cq.Workplane('XY',origin=(0,0,p.base)).polygon(6,k*a).extrude(d)\n\
    \    mouth=cq.Workplane('XY',origin=(0,0,h-p.lead)).polygon(6,k*a).workplane(offset=p.lead).polygon(6,k*(a+2*p.lead)).loft()\n\
    \    return w.cut(pocket).cut(mouth)"
  print_orientation: Flat exit face down, hex pocket up.
  use_orientation: Hex pocket toward incoming bolt.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print pocket-up without supports at 0.2 mm layers.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align the flats and press the nut in by hand until it bottoms below the rim.
    Invert and lightly shake to check retention. If it falls out, increase fit by
    0.05 mm and reprint. If it won't seat by hand, decrease fit by 0.05 mm and reprint.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Thread your M3 bolt in from the pocket side and verify that it exits the opposite
    face freely. Tighten by hand.
  parts:
  - knob
  hardware:
  - nut
  tool: null
