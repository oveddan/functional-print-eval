task: nut-knob/M3
note: Three crush ribs retain the recessed nut; the shoulder around the through-hole
  prevents push-through. Fit is not print-tested.
questions: []
params:
  od:
    value: 20
    unit: mm
    kind: world
    source: asked
    note: ''
  af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bite:
    value: 0.14
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    a=p.af+0.15\n    r=a/math.sqrt(3)\n    pts=[(r*math.cos(i*math.pi/3),r*math.sin(i*math.pi/3))\
    \ for i in range(6)]\n    b=cq.Workplane('XY').circle(p.od/2).extrude(8)\n   \
    \ for i in range(8):\n        t=i*math.pi/4\n        b=b.cut(cq.Workplane('XY').center((p.od/2+0.6)*math.cos(t),(p.od/2+0.6)*math.sin(t)).circle(2).extrude(8))\n\
    \    b=b.cut(cq.Workplane('XY').circle((p.bolt_d+0.5)/2).extrude(8))\n    z=8-p.nut_h-0.4\n\
    \    b=b.cut(cq.Workplane('XY').workplane(offset=z).polyline(pts).close().extrude(8-z))\n\
    \    for i in (0,2,4):\n        t=(i+0.5)*math.pi/3\n        x,y=math.cos(t),math.sin(t)\n\
    \        q=[((a/2+u)*x-v*y,(a/2+u)*y+v*x) for u,v in [(-p.bite,0),(0.35,-0.65),(0.35,0.65)]]\n\
    \        b=b.union(cq.Workplane('XY').workplane(offset=z).polyline(q).close().extrude(p.nut_h))\n\
    \    return b"
  print_orientation: Flat shoulder end on bed, pocket up.
  use_orientation: Pocket faces incoming bolt for tightening; bolt exits through shoulder.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print pocket up at 0.2 mm without supports. Clear strings from the pocket
    and bore.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align the hex flats and press the nut straight in by hand until it bottoms
    below the rim. Invert and gently shake the knob to check retention.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Thread your M3 bolt in from the pocket side and check that it exits freely.
    If the nut will not seat by hand, reduce bite by 0.05 mm and reprint; if loose,
    increase bite by 0.05 mm and reprint.
  parts:
  - knob
  hardware: []
  tool: null
