task: nut-knob/M3
note: 20 mm scalloped knob with six grip ribs, a solid nut-stop shoulder and a 3.5
  mm through bore.
questions: []
params:
  af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  nh:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bd:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  fit:
    value: 0.12
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    s=cq.Workplane('XY').circle(10).extrude(9)\n\
    \    for i in range(8):\n        a=i*math.pi/4\n        s=s.cut(cq.Workplane('XY').center(10*math.cos(a),10*math.sin(a)).circle(1.5).extrude(9))\n\
    \    z=9-p.nh-0.5\n    s=s.cut(cq.Workplane('XY').workplane(offset=z).polygon(6,(p.af+p.fit)/math.cos(math.pi/6)).extrude(p.nh+0.5))\n\
    \    for i in range(6):\n        a=(i+0.5)*math.pi/3\n        r=(p.af+p.fit)/2+0.22\n\
    \        s=s.union(cq.Workplane('XY').workplane(offset=z).center(r*math.cos(a),r*math.sin(a)).circle(0.34).extrude(p.nh+0.15))\n\
    \    return s.cut(cq.Workplane('XY').circle((p.bd+0.5)/2).extrude(9))"
  print_orientation: Flat exit face at z=0
  use_orientation: Pocket toward incoming bolt
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print flat without supports. Align the nut flats and press the nut squarely
    into the pocket by hand until it bottoms below the rim.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '2'
  text: Invert over a table and shake lightly. If loose, decrease fit by 0.05 mm and
    reprint; if too tight for hand insertion, increase fit by 0.05 mm and reprint.
    Start the M3 bolt from the pocket side and check that it exits the flat face.
  parts: []
  hardware: []
  tool: null
