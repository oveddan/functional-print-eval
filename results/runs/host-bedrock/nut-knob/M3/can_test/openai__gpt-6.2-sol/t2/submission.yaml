task: nut-knob/M3
note: Single-piece 20 mm scalloped knob with a chamfered interference pocket. Retention
  is by friction, without glue; verify fit on your printer.
questions: []
params:
  d:
    value: 20
    unit: mm
    kind: world
    source: asked
    note: ''
  af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  t:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  m:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  fit:
    value: -0.08
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n h=4+p.t+0.4\n a=p.af+p.fit\n w=cq.Workplane('XY').circle(p.d/2).extrude(h)\n\
    \ for i in range(8):\n  t=i*math.pi/4\n  w=w.cut(cq.Workplane('XY').center((p.d/2+0.6)*math.cos(t),(p.d/2+0.6)*math.sin(t)).circle(2).extrude(h))\n\
    \ def pts(f):\n  return [(f/math.sqrt(3)*math.cos(i*math.pi/3),f/math.sqrt(3)*math.sin(i*math.pi/3))\
    \ for i in range(6)]\n w=w.cut(cq.Workplane('XY').workplane(offset=4).polyline(pts(a)).close().extrude(h-4))\n\
    \ w=w.cut(cq.Workplane('XY').workplane(offset=h-0.5).polyline(pts(a)).close().workplane(offset=0.5).polyline(pts(a+1)).close().loft())\n\
    \ return w.cut(cq.Workplane('XY').circle((p.m+0.5)/2).extrude(h))"
  print_orientation: Flat exit face on bed, pocket up.
  use_orientation: Pocket toward work.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print flat side down at 0.2 mm, no supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align the flats and thumb-press the nut to the shoulder. Verify it is below
    the rim and stays seated when inverted and lightly tapped. If too tight increase
    fit by 0.05 mm and reprint; if loose decrease fit by 0.05 mm and reprint.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Thread onto your M3 bolt, pocket toward work. The bolt passes through the
    3.5 mm exit hole; the shoulder stops the nut. Tighten by hand only.
  parts:
  - knob
  hardware:
  - nut
  tool: null
