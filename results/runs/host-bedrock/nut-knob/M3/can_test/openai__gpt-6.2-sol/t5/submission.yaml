parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    pts=[((p.diameter/2-(i%2)*0.85)*math.cos(i*math.pi/12),(p.diameter/2-(i%2)*0.85)*math.sin(i*math.pi/12))\
    \ for i in range(24)]\n    b=cq.Workplane('XY').polyline(pts).close().extrude(8)\n\
    \    b=b.cut(cq.Workplane('XY').circle(1.75).extrude(8))\n    d=(p.af+p.fit)/math.cos(math.pi/6)\n\
    \    b=b.cut(cq.Workplane('XY').workplane(offset=8-p.nut_h-0.8).polygon(6,d).extrude(p.nut_h+0.8))\n\
    \    return b.cut(cq.Workplane('XY').workplane(offset=7.55).polygon(6,d).workplane(offset=0.45).polygon(6,d+0.9/math.cos(math.pi/6)).loft())"
  print_orientation: Flat face down at z=0, pocket up, no supports.
  use_orientation: Pocket toward work.
