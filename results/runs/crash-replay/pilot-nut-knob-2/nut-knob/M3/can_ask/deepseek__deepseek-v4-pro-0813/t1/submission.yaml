task: nut-knob/M3
note: ''
questions: []
params:
  knob_od:
    value: 20
    unit: mm
    kind: design
    source: design
    note: overall knob diameter
  knob_height:
    value: 12
    unit: mm
    kind: design
    source: design
    note: grip height of the knob
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height
  pocket_af:
    value: 5.35
    unit: mm
    kind: design
    source: design
    note: hex pocket across flats, slight interference for press fit
  pocket_depth:
    value: 2.6
    unit: mm
    kind: design
    source: design
    note: nut pocket depth, stop so nut can't pass through
  bolt_clearance_d:
    value: 3.3
    unit: mm
    kind: hardware
    source: catalog
    note: clearance hole for M3 bolt shank
  exit_hole_d:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: back exit hole, slightly larger than bolt
  corner_relief_r:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: radius of corner relief holes in the nut pocket
parts:
- id: hand_knob
  role: final
  material: PLA
  code: "import cadquery as cq\nimport math\n\ndef build(p):\n    R = p.knob_od /\
    \ 2.0\n    H = p.knob_height\n    PAF = p.pocket_af\n    PD = p.pocket_depth\n\
    \n    # main cylinder\n    knob = cq.Workplane('XY').circle(R).extrude(H)\n\n\
    \    # knurl splines: vertical grooves around the perimeter, as a cut from the\
    \ solid\n    for i in range(24):\n        ang = i * 360.0 / 24\n        groove\
    \ = (\n            cq.Workplane('XY')\n            .transformed(rotate=(0, 0,\
    \ ang))\n            .center(R - 0.9, 0)\n            .rect(1.0, H + 2, centered=True)\n\
    \            .extrude(H + 2)\n        )\n        knob = knob.cut(groove)\n\n \
    \   # hex nut pocket from the back face (top, +Z)\n    hex_pocket = (\n      \
    \  cq.Workplane('XY')\n        .workplane(offset=H - PD)\n        .polygon(6,\
    \ PAF, circumscribed=False)\n        .extrude(PD)\n    )\n    knob = knob.cut(hex_pocket)\n\
    \n    # corner relief cylinders at each nut corner\n    for i in range(6):\n \
    \       ang = math.radians(i * 60.0 + 30.0)\n        cx = PAF * 0.5774 * math.cos(ang)\n\
    \        cy = PAF * 0.5774 * math.sin(ang)\n        rel = (\n            cq.Workplane('XY')\n\
    \            .workplane(offset=H - PD)\n            .center(cx, cy)\n        \
    \    .circle(p.corner_relief_r)\n            .extrude(PD)\n        )\n       \
    \ knob = knob.cut(rel)\n\n    # bolt clearance hole through the knob, from front\
    \ into the nut pocket\n    knob = knob.cut(\n        cq.Workplane('XY').circle(p.bolt_clearance_d\
    \ / 2).extrude(H)\n    )\n\n    # exit hole through the pocket stop on the back\
    \ side\n    knob = knob.cut(\n        cq.Workplane('XY')\n        .workplane(offset=H)\n\
    \        .circle(p.exit_hole_d / 2)\n        .cutBlind(-(H - PD))\n    )\n\n \
    \   return knob\n"
  print_orientation: nut pocket face down on the bed (z=0 at the pocket opening),
    so the hex pocket prints without overhangs
  use_orientation: knob stands upright; nut presses into the back, bolt enters from
    the front
hardware:
- id: m3_nut
  ref: ISO 4032 M3
  qty: 1
joints:
- id: nut_press
  fastener: m3_nut
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: hand_knob
    feature: nut_pocket
    role: nut_pocket
  nut: null
  external: null
criteria:
- id: nut_seats_flush
  part: hand_knob
  feature: nut_pocket
  relation: seats
  hardware: m3_nut
  clearance_mm: 0.05
  params:
  - nut_af
  - pocket_af
  - pocket_depth
  check:
    method: coupon
    ref: null
    description: print a small hex-pocket coupon and press the nut in by hand; it
      must sit flush or sub-flush and stay put when held upside down
- id: nut_no_through
  part: hand_knob
  feature: nut_pocket_stop
  relation: contains
  hardware: m3_nut
  clearance_mm: null
  params:
  - pocket_depth
  check:
    method: coupon
    ref: null
    description: nut cannot be pushed out through the far side; a bolt tightened through
      the nut bears against the stop
- id: bolt_passes
  part: hand_knob
  feature: bolt_hole
  relation: clears
  hardware: m3_nut
  clearance_mm: 0.15
  params:
  - bolt_clearance_d
  check:
    method: measure
    ref: null
    description: an M3 bolt threads through the clearance hole into the nut and out
      the back
manual:
- n: '1'
  text: Print hand_knob with the nut pocket face down on the bed (as oriented in the
    file). Remove any corner-relief stringing.
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '2'
  text: Align the M3 hex nut with the hex pocket and press it in by hand until it
    bottoms out on the stop. It should sit flush or slightly below the surface.
  parts:
  - hand_knob
  hardware:
  - m3_nut
  tool: null
- n: '3'
  text: Check the nut stays in when you turn the knob upside down. Thread the M3 bolt
    in from the front; it should engage the nut and pass out the back.
  parts:
  - hand_knob
  hardware:
  - m3_nut
  tool: null
