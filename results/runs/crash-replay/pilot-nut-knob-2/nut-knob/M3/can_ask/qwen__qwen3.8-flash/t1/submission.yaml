task: nut-knob/M3
note: 'Same design as before, only the modelling calls changed (no makeLoft: hex seat
  = Workplane.polygon+extrude cut, funnel/chamfer = Solid.makeCone, grooves and holes
  = Solid.makeCylinder). One-piece hand knob, Ø20 x 15 mm with 12 vertical grip flutes,
  printed base-down, no supports. An M3 hex nut is pressed in from the top into a
  hex seat printed at nut_af - seat_interference (default 5.45 vs a 5.5 nut) and lies
  on the seat floor 0.7 mm below the top face, so it sits fully inside. A cone above
  the nut only (never touching its flats) flares the mouth to a Ø6.9 circle so the
  nut starts square. The far side is a Ø3.8 hole: passes an M3 shaft, blocks the 5.5
  mm nut by 1.7 mm, so it cannot be pushed or shaken out; the seat floor also takes
  the tightening load. No glue. Because the nut could not be measured, the fit is
  one param and the 4-pocket coupon (0.00 / -0.05 / -0.10 / -0.15 mm interference,
  pocket 2 = the knob as modelled) lets the fit be chosen by hand before/after printing.'
questions:
- text: What is your M3 hex nut's actual across-flats, and can you measure it with
    calipers?
  answer: Could not measure; using ISO 4032 catalog 5.5 mm and a press-fit coupon
    to choose the interference.
- text: Should the bolt head need to be captured inside the knob (a deeper chamber)?
  answer: No - you said the bolt goes through the nut and out the other side, so only
    a 3.8 mm shaft-clearance hole is provided.
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut across flats; user could not measure, so the seat size
      is left parametric and chosen with the coupon
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 nut height
  bolt_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: M3 thread nominal diameter (ISO 4762)
  seat_interference:
    value: 0.05
    unit: mm
    kind: design
    source: design
    note: how much smaller than the nut the hex seat is printed, across flats (seat
      = 5.45). 0.05 = coupon pocket 2; raise to 0.10 (pocket 3) for a firmer grab,
      lower to 0.00 if it will not press in by thumb
  nut_top_cover:
    value: 0.7
    unit: mm
    kind: design
    source: design
    note: 'plastic above the nut''s top face: the nut sits fully inside and cannot
      be flicked out; also fixes where the mouth funnel begins'
  funnel_undercut:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: the mouth funnel starts this far below the top of the nut's seat level,
      and its root radius is inside the hex flats, so it never reduces the grip band
  funnel_overcut:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: how far above the top face the funnel cone extends, to clear the surface
      cleanly
  funnel_root_r:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: funnel radius at its lower end (inside the seat's apothem 2.73, so it cuts
      nothing there)
  mouth_extra:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: funnel radius at its top = seat circumradius + this, giving a ~Ø6.9 mouth
      that admits the nut's corners (3.18) freely
  bolt_hole_clearance:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: far-side hole = bolt_d + this = 3.8 mm; passes the M3 shaft, blocks the
      5.5 mm nut
  bolt_hole_chamfer:
    value: 0.7
    unit: mm
    kind: design
    source: design
    note: entry flare on the base side so the bolt tip finds the hole
  knob_dia:
    value: 20
    unit: mm
    kind: design
    source: design
    note: requested ~20 mm across
  knob_h:
    value: 15
    unit: mm
    kind: design
    source: design
    note: ''
  n_flutes:
    value: 12
    unit: count
    kind: design
    source: design
    note: ''
  flute_depth:
    value: 1
    unit: mm
    kind: design
    source: design
    note: 'groove depth: 20 mm over the ridges, 18 mm in the valleys'
  flute_r:
    value: 2.2
    unit: mm
    kind: design
    source: design
    note: groove cutter radius; adjacent cutters miss each other, leaving ~1.7 mm
      ridges
  flute_start_z:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: full-diameter base rim, for bed adhesion and for bearing on the workpiece
  coupon_l:
    value: 48
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_w:
    value: 16
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_t:
    value: 6.2
    unit: mm
    kind: design
    source: design
    note: pocket depth (nut_h + nut_top_cover) + 3.1 mm floor, mirroring the knob
  coupon_spacing:
    value: 10
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_end_gap:
    value: 8
    unit: mm
    kind: design
    source: design
    note: from the notched end to pocket 1's centre; the far end gap is 10 mm, so
      the order cannot be read backwards
  coupon_step:
    value: 0.05
    unit: mm
    kind: design
    source: design
    note: each pocket one step tighter than the last, from the notched end
  coupon_pockets:
    value: 4
    unit: count
    kind: design
    source: design
    note: ''
  coupon_notch_r:
    value: 2
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: hand_knob
  role: final
  material: PLA
  code: "import math\n\nCORNER = 1.0 / math.cos(math.pi / 6.0)   # hexagon circumradius\
    \ / across-flats\n\n\ndef build(p):\n    R = p.knob_dia / 2.0\n    H = p.knob_h\n\
    \    seat_af = p.nut_af - p.seat_interference\n    r_seat = seat_af * CORNER /\
    \ 2.0                 # circumradius of the seat hexagon\n    seat_depth = p.nut_h\
    \ + p.nut_top_cover\n    z_seat = H - seat_depth                         # socket\
    \ floor = top of the base wall\n    hole_r = (p.bolt_d + p.bolt_hole_clearance)\
    \ / 2.0\n\n    # 1. blank\n    w = cq.Workplane(\"XY\").circle(R).extrude(H)\n\
    \n    # 2. grip flutes: vertical grooves, left solid for flute_start_z of the\
    \ base\n    n = int(p.n_flutes)\n    cg = R - p.flute_depth + p.flute_r      \
    \        # cutter centres\n    for k in range(n):\n        a = 2.0 * math.pi *\
    \ k / n\n        w = w.cut(cq.Solid.makeCylinder(p.flute_r, H - p.flute_start_z\
    \ + 0.6,\n                                        cq.Vector(cg * math.cos(a),\
    \ cg * math.sin(a),\n                                                  p.flute_start_z),\
    \ cq.Vector(0, 0, 1)))\n\n    # 3. hex seat: straight prism, interference fit\
    \ along the nut's whole thickness\n    w = (w.faces(\">Z\").workplane(centerOption=\"\
    ProjectedOrigin\")\n           .polygon(6, r_seat).extrude(-seat_depth))\n\n \
    \   # 4. mouth funnel: widens upward only, and only above the nut, so nothing\
    \ blocks it\n    z0 = H - p.nut_top_cover - p.funnel_undercut\n    w = w.cut(cq.Solid.makeCone(p.funnel_root_r,\
    \ r_seat + p.mouth_extra,\n                                H + p.funnel_overcut\
    \ - z0, cq.Vector(0, 0, z0),\n                                cq.Vector(0, 0,\
    \ 1)))\n\n    # 5. far side: bolt clearance hole too small for the nut, with an\
    \ entry chamfer\n    w = w.cut(cq.Solid.makeCylinder(hole_r, z_seat + 0.5,\n \
    \                                   cq.Vector(0, 0, -0.25), cq.Vector(0, 0, 1)))\n\
    \    w = w.cut(cq.Solid.makeCone(hole_r + p.bolt_hole_chamfer, hole_r,\n     \
    \                           p.bolt_hole_chamfer + 0.25,\n                    \
    \            cq.Vector(0, 0, -0.25), cq.Vector(0, 0, 1)))\n    return w"
  print_orientation: 'Base face (the flat Ø20 face with the Ø3.8 bolt hole) on the
    bed, knob axis vertical, hex socket mouth pointing up (part frame z = 0 is that
    base face). Nothing overhangs: the flutes are vertical grooves that start 1.2
    mm above the bed, the seat is a straight vertical hex hole in the top 3.1 mm,
    and the funnel and base chamfer both widen towards the bed. No supports.'
  use_orientation: 'Used as printed, axis vertical: the flat base rim bears on the
    workpiece, the M3 bolt enters through the Ø3.8 hole from the work side and its
    tip comes out of the socket mouth; the captive nut is pressed in from that same
    mouth. Turn the knob clockwise, seen from above the mouth, to tighten.'
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\nCORNER = 1.0 / math.cos(math.pi / 6.0)   # hexagon circumradius\
    \ / across-flats\n\n\ndef build(p):\n    T = p.coupon_t\n    seat_depth = p.nut_h\
    \ + p.nut_top_cover\n    z_floor = T - seat_depth\n    hole_r = (p.bolt_d + p.bolt_hole_clearance)\
    \ / 2.0\n\n    # plate, lying flat, plus a half-round index notch on the end where\
    \ pocket 1 sits\n    w = cq.Workplane(\"XY\").box(p.coupon_l, p.coupon_w, T, centered=(True,\
    \ True, False))\n    w = w.cut(cq.Solid.makeCylinder(p.coupon_notch_r, T + 2.0,\n\
    \                                    cq.Vector(-p.coupon_l / 2.0, 0.0, -1.0),\n\
    \                                    cq.Vector(0, 0, 1)))\n\n    n = int(p.coupon_pockets)\n\
    \    x0 = -p.coupon_l / 2.0 + p.coupon_end_gap\n    for i in range(n):\n     \
    \   x = x0 + i * p.coupon_spacing\n        r_seat = (p.nut_af - i * p.coupon_step)\
    \ * CORNER / 2.0\n        # pocket, same shape and depth as the knob's seat\n\
    \        w = (w.faces(\">Z\").workplane(centerOption=\"ProjectedOrigin\")\n  \
    \             .center(x, 0.0).polygon(6, r_seat).extrude(-seat_depth))\n     \
    \   z0 = T - p.nut_top_cover - p.funnel_undercut\n        w = w.cut(cq.Solid.makeCone(p.funnel_root_r,\
    \ r_seat + p.mouth_extra,\n                                    T + p.funnel_overcut\
    \ - z0, cq.Vector(x, 0.0, z0),\n                                    cq.Vector(0,\
    \ 0, 1)))\n        # far-side stop, exactly as in the knob: the nut cannot pass\
    \ this hole\n        w = w.cut(cq.Solid.makeCylinder(hole_r, z_floor + 0.5,\n\
    \                                        cq.Vector(x, 0.0, -0.25), cq.Vector(0,\
    \ 0, 1)))\n    return w"
  print_orientation: Flat on the bed, pocket mouths facing up. The pockets sit in
    the top 3.1 mm, above the squish of the first layers, the same way the knob's
    seat sits in the top of its own print.
  use_orientation: Test piece, not part of the knob. Pocket 1 is the one by the half-round
    index notch; 1, 2, 3, 4 run from loosest to tightest (nut_af, -0.05, -0.10, -0.15
    mm across flats). Pocket 2 is the size the knob is modelled at.
hardware:
- id: m3_nut
  ref: ISO 4032 M3
  qty: 1
- id: m3_bolt
  ref: ISO 4762 M3x20
  qty: 1
joints:
- id: nut_press_fit
  fastener: m3_nut
  axis_origin:
  - 0.0
  - 0.0
  - 11.9
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: hand_knob
    feature: nut_seat
    role: nut_pocket
  - part: hand_knob
    feature: seat_floor
    role: head_seat
  nut: null
  external: null
- id: bolt_through_knob
  fastener: m3_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: hand_knob
    feature: bolt_hole
    role: clearance
  - part: hand_knob
    feature: nut_seat
    role: thread
  nut: m3_nut
  external: null
criteria:
- id: nut_press_fit
  part: hand_knob
  feature: nut_seat
  relation: engages
  hardware: m3_nut
  clearance_mm: -0.05
  params:
  - nut_af
  - nut_h
  - seat_interference
  check:
    method: coupon
    ref: fit_coupon
    description: 'Hex seat is printed at nut_af - seat_interference across flats (negative
      clearance = interference). Coupon pocket 2 is this exact size, with the same
      wall arrangement above the bed: press a nut into it and pick the tightest size
      you can still seat with your thumb, then set seat_interference to match.'
- id: nut_holds_upside_down
  part: hand_knob
  feature: nut_seat
  relation: seats
  hardware: m3_nut
  clearance_mm: null
  params:
  - nut_af
  - seat_interference
  - nut_h
  - nut_top_cover
  check:
    method: measure
    ref: null
    description: 'Turn the knob upside down over a soft surface and shake hard: the
      nut must not move or fall out. Interference friction along the nut''s full 2.4
      mm of flats, plus 0.7 mm of socket above it, holds it with no glue.'
- id: nut_cannot_exit_far_side
  part: hand_knob
  feature: bolt_hole
  relation: supports
  hardware: m3_nut
  clearance_mm: -1.7
  params:
  - bolt_d
  - bolt_hole_clearance
  - nut_af
  check:
    method: coupon
    ref: fit_coupon
    description: The far-side opening is bolt_d + 0.8 = 3.8 mm, 1.7 mm smaller than
      the nut's 5.5 mm across flats, so the nut cannot be pushed or shaken out through
      it. The coupon's Ø3.8 holes under each pocket let this be seen first hand.
- id: nut_fully_inside
  part: hand_knob
  feature: nut_seat
  relation: contains
  hardware: m3_nut
  clearance_mm: null
  params:
  - nut_h
  - nut_top_cover
  - seat_interference
  - knob_h
  check:
    method: none
    ref: null
    description: Socket depth = nut_h + nut_top_cover, so with the nut on the seat
      floor its top face is 0.7 mm below the knob's top face and nothing breaks out
      of the knob's 20 x 15 mm envelope.
- id: bolt_passes_out
  part: hand_knob
  feature: bolt_hole
  relation: clears
  hardware: m3_bolt
  clearance_mm: 0.8
  params:
  - bolt_d
  - bolt_hole_clearance
  - bolt_hole_chamfer
  check:
    method: measure
    ref: null
    description: An M3 shaft slips through the base hole with 0.8 mm clearance, guided
      by the 0.7 mm entry chamfer, then through the nut and out of the mouth.
- id: tightening_load_path
  part: hand_knob
  feature: seat_floor
  relation: supports
  hardware: m3_nut
  clearance_mm: null
  params:
  - knob_h
  - nut_h
  - nut_top_cover
  - bolt_d
  - bolt_hole_clearance
  check:
    method: none
    ref: null
    description: 'Tightening pulls the nut down onto the seat floor (a ~14 mm2 ring
      around the Ø3.8 hole) and the load passes through 11.9 mm of solid body into
      the flat base rim on the workpiece. Hand-tight only: PLA creeps.'
- id: grip_size
  part: hand_knob
  feature: grip_flutes
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - knob_dia
  - flute_depth
  - flute_r
  - n_flutes
  - flute_start_z
  check:
    method: none
    ref: null
    description: 20 mm over the flute ridges, 18 mm in the valleys, 13.8 mm of fluted
      height for fingers; all groove walls are vertical so no supports are needed.
- id: coupon_order_identifiable
  part: fit_coupon
  feature: index_notch
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - coupon_end_gap
  - coupon_spacing
  - coupon_pockets
  - coupon_step
  - coupon_notch_r
  check:
    method: none
    ref: null
    description: Pockets run 0.00, -0.05, -0.10, -0.15 mm interference from the notched
      end; end gaps differ (8 mm vs 10 mm centre-to-end) and the notch itself marks
      pocket 1, so the order cannot be read backwards.
manual:
- n: '1'
  text: 'Print both parts in PLA at 0.2 mm layers, no supports. hand_knob: stand it
    on its flat Ø20 base (the face with the small hole), hex socket mouth up. fit_coupon:
    flat on the bed, pocket mouths up. The seat is printed in the upper part of each
    piece, away from first-layer squish, so it measures close to nominal.'
  parts:
  - hand_knob
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Read the coupon: pocket 1 is next to the half-round index notch, then 2,
    3, 4 going the other way. Their seats are 5.50, 5.45, 5.40, 5.35 mm across flats
    - pocket 2 is what the knob is modelled at.'
  parts:
  - fit_coupon
  hardware:
  - m3_nut
  tool: null
- n: '3'
  text: Drop a nut into each pocket and press it down onto the pocket floor with your
    thumb. Note which you can seat by hand, and which still hold the nut when you
    turn the coupon upside down and shake it hard. Also confirm no nut can be pushed
    through the Ø3.8 hole underneath - that is the same far-side stop the knob uses.
  parts:
  - fit_coupon
  hardware:
  - m3_nut
  - m3_bolt
  tool: thumb
- n: '4'
  text: Choose the interference. If pocket 2 pressed in comfortably and held, print
    the knob as modelled (seat_interference = 0.05). If pocket 2 let the nut fall
    out but pocket 3 pressed in by hand, set seat_interference = 0.10. If even pocket
    2 needed real force, set it to 0.00-0.03. The knob's walls are much thicker and
    stiffer than the coupon's, so the same size feels slightly tighter in the knob
    - take the looser pocket if in doubt.
  parts:
  - hand_knob
  hardware: []
  tool: slicer / CAD param
- n: '5'
  text: 'Fit the nut: drop it into the knob''s hex socket, flat-side down. Seat it
    with the bolt rather than a press - pass the M3 bolt up through the Ø3.8 hole
    in the base so its tip goes through the nut, then turn the knob clockwise; it
    walks itself down and draws the nut onto the seat floor, finishing 0.7 mm below
    the top face. Back the bolt out. Do not hammer the nut in - driving it past the
    seat leaves it loose.'
  parts:
  - hand_knob
  hardware:
  - m3_nut
  - m3_bolt
  tool: M3 bolt
- n: '6'
  text: 'Check before use: grip the knob by its flutes, turn it upside down over a
    soft surface and shake - the nut must not move. Push the nut with your thumb -
    it must not pass through the base hole, because 5.5 mm across flats will not fit
    through 3.8 mm.'
  parts:
  - hand_knob
  hardware:
  - m3_nut
  tool: null
- n: '7'
  text: 'Use: put the bolt through what you are clamping, tip up into the knob''s
    base hole, and turn the knob clockwise until its flat base bears on the work and
    snugs up. Hand-tight plus a quarter turn is the limit - never a spanner or a drill
    on it, PLA slowly creeps under constant clamp load.'
  parts:
  - hand_knob
  hardware:
  - m3_bolt
  tool: null
- n: '8'
  text: If the seat wears loose later, reprint with seat_interference raised by 0.05,
    or open the seat out to Ø4.3 and heat-set the M3x4x5 insert instead. To free the
    nuts from the coupon, the pockets are flush-depth so you can grip a nut's top
    edge with pliers or lever under one flat with a small screwdriver.
  parts:
  - hand_knob
  - fit_coupon
  hardware:
  - m3_nut
  tool: pliers or small screwdriver
