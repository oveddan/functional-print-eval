task: nut-knob/M5
note: 'Rebuilt both parts using only what this environment injects: no sqrt / cos
  / sin / radians anywhere. The hex across-flats to across-corners factor is now `2.0
  / 3.0 ** 0.5`, and the six finger scallops are placed with CadQuery''s own `polarArray(rc,
  0.0, flute_n)` instead of my own trig, so flute_n can still be changed freely.


  Every boolean in both parts is now a single-wire circle/polygon/rect extrude and
  a cut - no nested wires, no chamfer, no cone, no revolve. The 45° top chamfer is
  gone: the knob is a straight Ø30 blank with the scallops running from 1.2 mm to
  14.8 mm, leaving an unfluted Ø30 band at the bed and a clean round rim at the top.
  Nothing changed functionally.


  Stack-up, knob axis = z, flat base on the bed:

  - z 0 -> 5.0: shoulder, with the Ø5.6 far-side exit bore through it (the nut''s
  8.0 across flats cannot pass it)

  - z 5.0 -> 9.5: press-fit hex pocket at 7.85 A/F (0.15 mm diametral interference
  on the 8.00 nut)

  - z 9.5 -> 10.3: 0.8 mm lead-in hex at 8.45 A/F, so the nut starts square and the
  last 0.2 mm of it is unrestrained

  - z 10.3 -> 10.5: 0.2 mm relief step - nothing printed touches the nut''s top face

  - z 10.5 -> 16.0: mouth bore Ø9.6, the nut''s insertion opening and an M5 socket
  head''s parking space


  Retention with the knob upside down is pure press fit on the six flats, which is
  why the coupon exists: three pockets at 7.70 / 7.85 / 8.00 printed in the same wall
  orientation as the knob, plus a copy of the Ø5.6 bore, so the fit is chosen on your
  machine before the knob is printed.'
questions:
- text: Is your M5 bolt a socket head cap screw (ISO 4762, Ø8.5 head)? You couldn't
    measure it, so the mouth is sized 9.6 to pass both the nut and an M5 cap head
    - a pan or flange head may need that widened.
  answer: null
- text: Do you want the coupon printed first, and should I record the press fit you
    end up choosing once it's tested?
  answer: null
params:
  bolt_clear_hole:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: 'Ø through the shoulder: M5 passes, the nut (8.0 A/F) cannot'
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: M5 thread major dia, ISO 4762 M5
  bolt_head_d:
    value: 8.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 socket head dia, max. Your bolt could not be measured - widen
      insert_min_open if it is a pan or flange head.
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 socket head height
  body_h:
    value: 16
    unit: mm
    kind: design
    source: design
    note: minimum 15.7 so an M5 head can sit inside above the nut; build() takes max(body_h,
      that minimum)
  coupon_af_loose:
    value: 8
    unit: mm
    kind: design
    source: design
    note: coupon pocket 3 - free, reference only
  coupon_af_nom:
    value: 7.85
    unit: mm
    kind: design
    source: design
    note: coupon pocket 2 = the knob's fit
  coupon_af_tight:
    value: 7.7
    unit: mm
    kind: design
    source: design
    note: coupon pocket 1 - very firm
  coupon_h:
    value: 8
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_wall:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: ''
  floor_t:
    value: 5
    unit: mm
    kind: design
    source: design
    note: far-side shoulder the nut stands on
  flute_cutter_d:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Ø of the vertical rod that cuts each scallop
  flute_depth:
    value: 2.2
    unit: mm
    kind: design
    source: design
    note: scallop into the rim -> 25.6 mm over the flutes
  flute_n:
    value: 6
    unit: count
    kind: design
    source: design
    note: ''
  flute_z0:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: 'scallops run from here to 1.2 mm below the top: full Ø30 band on the bed,
      clean round rim at the top'
  head_top_clear:
    value: 1
    unit: mm
    kind: design
    source: design
    note: an M5 head swallowed through the mouth stays this far below the knob's top
      face
  insert_min_open:
    value: 9.6
    unit: mm
    kind: design
    source: design
    note: 'mouth bore: must pass the nut''s 9.24 across-corners (it is the nut''s
      insertion opening) and an M5 head'
  knob_dia:
    value: 30
    unit: mm
    kind: design
    source: design
    note: over the flute crests - the ~30 mm asked for
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut, across flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 nut thickness
  nut_top_clear:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: hex pocket depth = nut_h + this, so the nut is buried and fully inside
  pocket_af:
    value: 7.85
    unit: mm
    kind: design
    source: design
    note: press-fit hex pocket across flats = 0.15 mm diametral interference on the
      nut. This is the one number to tune with the coupon.
  pocket_lead_af:
    value: 8.45
    unit: mm
    kind: design
    source: design
    note: lead-in at the pocket mouth, free of the nut
  pocket_lead_len:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: ''
  relief_wall:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: step above the nut's top face
parts:
- id: knob
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    # everything from hardware / the real world arrives as\
    \ a param\n    af  = p.nut_af            # M5 hex nut across flats\n    nh  =\
    \ p.nut_h             # M5 hex nut thickness\n    cb  = p.bolt_clear_hole   #\
    \ far-side exit bore (the nut cannot pass it)\n    mo  = p.insert_min_open   #\
    \ mouth bore: nut goes in and the bolt head passes\n    pa  = p.pocket_af    \
    \     # press-fit hex pocket across flats\n    la  = p.pocket_lead_af    # lead-in\
    \ at the pocket mouth\n    ll  = p.pocket_lead_len\n    tf  = p.floor_t      \
    \     # shoulder the nut stands on\n    R   = p.knob_dia / 2.0\n    k   = 2.0\
    \ / 3.0 ** 0.5    # across flats -> across corners (1/cos30), no math module needed\n\
    \n    hex_c  = pa * k\n    lead_c = la * k\n    pk_h   = nh + p.nut_top_clear\
    \          # pocket depth: nut + room above it\n    pk_top = tf + pk_h\n    mtop\
    \   = pk_top + p.relief_wall        # mouth bore starts here\n    H      = max(p.body_h,\
    \ tf + nh + p.bolt_head_h + p.head_top_clear)  # tall enough to swallow an M5\
    \ head\n\n    s = cq.Workplane(\"XY\").circle(R).extrude(H)                  \
    \     # plain Ø30 blank\n    s = s.cut(cq.Workplane(\"XY\").workplane(offset=mtop)\
    \                # mouth bore, opens upward\n             .circle(mo / 2.0).extrude(H\
    \ - mtop + 1.0))\n    s = s.cut(cq.Workplane(\"XY\").workplane(offset=pk_top -\
    \ ll)         # lead-in hex, 0.8 mm\n             .polygon(6, lead_c).extrude(ll\
    \ + 1.0))\n    s = s.cut(cq.Workplane(\"XY\").workplane(offset=tf)           \
    \       # press-fit hex pocket\n             .polygon(6, hex_c).extrude(pk_h -\
    \ ll))\n    s = s.cut(cq.Workplane(\"XY\").circle(cb / 2.0).extrude(tf + 1.0))\
    \   # far-side exit bore\n    rc = R - p.flute_depth + p.flute_cutter_d / 2.0\
    \                    # scallop centres, 25.6 over the cuts\n    s = s.cut(cq.Workplane(\"\
    XY\").workplane(offset=p.flute_z0)          # 6 vertical finger scallops\n   \
    \          .polarArray(rc, 0.0, int(p.flute_n))\n             .circle(p.flute_cutter_d\
    \ / 2.0)\n             .extrude(H - 2.0 * p.flute_z0))\n    return s"
  print_orientation: 'Flat base (the annular face around the Ø5.6 exit bore) down
    on the bed, knob axis vertical, hex pocket and mouth facing up. 0.2 mm layers,
    3 perimeters, no supports: every wall is vertical and nothing spans.'
  use_orientation: Axis along the bolt. The flat base (printed z=0, the Ø5.6 exit-bore
    side) faces the workpiece and rests on it; the bolt tip leaves through that bore
    and the mouth faces away.
- id: knob_press_test
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    # three hex pockets printed like the knob's, plus a copy\
    \ of the Ø5.6 exit bore\n    afs  = [p.coupon_af_tight, p.coupon_af_nom, p.coupon_af_loose]\n\
    \    wall = p.coupon_wall\n    H    = p.coupon_h\n    nh   = p.nut_h\n    cb \
    \  = p.bolt_clear_hole\n    k    = 2.0 / 3.0 ** 0.5                 # across flats\
    \ -> across corners\n    hexc = [a * k for a in afs]\n    xs = [0.0]\n    for\
    \ i in range(1, len(afs)):\n        xs.append(xs[-1] + (hexc[i - 1] + hexc[i])\
    \ / 2.0 + wall)\n    hmax = max(hexc)\n    x0, x1 = xs[0] - hmax / 2.0 - wall,\
    \ xs[-1] + hmax / 2.0 + wall\n    ytop = hmax / 2.0 + wall\n    yb   = -(hmax\
    \ / 2.0 + wall + cb / 2.0)  # centre of the bolt-passing test bore\n    ybot =\
    \ yb - cb / 2.0 - wall\n    blk = (cq.Workplane(\"XY\")\n           .center((x0\
    \ + x1) / 2.0, (ytop + ybot) / 2.0)\n           .rect(x1 - x0, ytop - ybot).extrude(H))\n\
    \    depth = nh + 0.7                        # blind, same pocket depth as the\
    \ knob\n    for x, a in zip(xs, afs):\n        blk = blk.cut(cq.Workplane(\"XY\"\
    ).workplane(offset=H - depth).center(x, 0.0)\n                      .polygon(6,\
    \ a * k).extrude(depth + 1.0))\n    blk = blk.cut(cq.Workplane(\"XY\").center(xs[0],\
    \ yb)\n                  .circle(cb / 2.0).extrude(H + 1.0))\n    return blk"
  print_orientation: Flat block on the bed, the three hex pockets facing up - same
    wall orientation as the knob's pocket, so the fit it shows is the fit the knob
    gives.
  use_orientation: Not fitted to anything; it is the fit test. Turn it upside down
    and shake to see whether a pocket holds the nut.
