- id: nut_m5
  ref: ISO 4032 M5
  qty: 1
- id: bolt_m5
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: nut_in_pocket
  fastener: nut_m5
  axis_origin:
  - 0.0
  - 0.0
  - 5.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: nut_pocket
    role: nut_pocket
  - part: knob
    feature: shoulder
    role: head_seat
  nut: null
  external: null
- id: bolt_through_knob
  fastener: bolt_m5
  axis_origin:
  - 0.0
  - 0.0
  - 15.7
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: mouth_bore
    role: head_seat
  - part: knob
    feature: nut_pocket
    role: thread
  - part: knob
    feature: far_side_bore
    role: clearance
  nut: null
  external: null
criteria:
- id: press_fit
  part: knob
  feature: nut_pocket
  relation: seats
  hardware: nut_m5
  clearance_mm: null
  params:
  - pocket_af
  - nut_af
  - nut_h
  check:
    method: coupon
    ref: knob_press_test
    description: 'Press a nut into the 7.85 pocket of the coupon with your thumb:
      it should need real pressure, seat squarely, and stay in when the block is turned
      upside down and shaken. If it falls out, lower pocket_af by 0.1; if you cannot
      push it in, raise it by 0.05-0.1.'
- id: nut_held_inverted
  part: knob
  feature: nut_pocket
  relation: seats
  hardware: nut_m5
  clearance_mm: null
  params:
  - pocket_af
  - nut_top_clear
  check:
    method: measure
    ref: null
    description: 'With the nut seated, hold the knob mouth-down over a soft surface
      and shake it: the nut must not move. If it does, the pocket printed loose -
      reprint with pocket_af 0.1 lower.'
- id: cannot_be_pushed_out_far_side
  part: knob
  feature: far_side_bore
  relation: supports
  hardware: nut_m5
  clearance_mm: null
  params:
  - bolt_clear_hole
  - nut_af
  - floor_t
  check:
    method: measure
    ref: null
    description: The far-side bore is Ø5.6 against the nut's 8.00 across flats / 9.24
      across corners, and the shoulder behind it is 5 mm thick, so the nut cannot
      be pushed or fall out that way.
- id: nut_fully_inside
  part: knob
  feature: nut_pocket
  relation: contains
  hardware: nut_m5
  clearance_mm: null
  params:
  - floor_t
  - nut_h
  - nut_top_clear
  - body_h
  - insert_min_open
  check:
    method: measure
    ref: null
    description: 'The nut''s top face sits at 5.0 + 4.7 = 9.7 mm from the base: 0.6
      mm below the mouth of the pocket and 6.3 mm below the knob''s top face, so nothing
      of the nut shows and it cannot be pushed out of the mouth by the bolt tip.'
- id: bolt_passes_far_side
  part: knob
  feature: far_side_bore
  relation: clears
  hardware: bolt_m5
  clearance_mm: 0.3
  params:
  - bolt_clear_hole
  - bolt_d
  check:
    method: coupon
    ref: knob_press_test
    description: The M5 bolt must slide freely through the Ø5.6 test bore in the coupon
      - a printed hole of the same size and orientation as the knob's. If it binds,
      open bolt_clear_hole to 5.8.
- id: head_passes_mouth
  part: knob
  feature: mouth_bore
  relation: clears
  hardware: bolt_m5
  clearance_mm: 0.55
  params:
  - insert_min_open
  - bolt_head_d
  check:
    method: measure
    ref: null
    description: 'Mouth bore Ø9.6 against the bolt head Ø8.5: the head drops in and
      lands on the nut. Check against your actual bolt - if it is a pan or flange
      head, widen insert_min_open, which must stay above 9.3 or the nut will not go
      in at all.'
- id: head_stays_inside
  part: knob
  feature: mouth_bore
  relation: faces
  hardware: bolt_m5
  clearance_mm: null
  params:
  - floor_t
  - nut_h
  - bolt_head_h
  - head_top_clear
  - body_h
  check:
    method: measure
    ref: null
    description: With the head seated on the nut, its top face must be below the knob's
      top face so the knob lies flat on the work.
- id: grip_size
  part: knob
  feature: flutes
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - knob_dia
  - flute_depth
  - flute_n
  check:
    method: none
    ref: null
    description: 'Ø30 over the crests, 25.6 mm over the six scallops, 16 mm tall:
      pinch it between thumb and fingers in the grooves.'
manual:
- n: '1'
  text: Print knob_press_test and knob in PLA, 0.2 mm layers, 3 perimeters, no supports.
    Both sit flat on the bed with their holes facing up - that is what makes the coupon's
    fit match the knob's fit. Print the coupon first if you would rather check before
    committing.
  parts:
  - knob_press_test
  - knob
  hardware: []
  tool: null
- n: '2'
  text: 'On the coupon, press one M5 hex nut by hand into each of the three pockets:
    7.70 (very firm), 7.85 (what the knob uses), 8.00 (free, reference only). Turn
    the block upside down over a table and shake it.'
  parts:
  - knob_press_test
  hardware:
  - nut_m5
  tool: null
- n: '3'
  text: Read the fit off the coupon before touching the knob. If the nut fell out
    of 7.85, reprint the knob with pocket_af 0.1 lower (7.75). If 7.70 could not be
    pushed in by hand, raise pocket_af by 0.05. The fit you want needs firm thumb
    pressure and then holds.
  parts:
  - knob_press_test
  hardware:
  - nut_m5
  tool: null
- n: '4'
  text: 'Test the bolt bore: the M5 bolt should slide freely through the small round
    hole at the front of the coupon. It is the same Ø5.6 as the knob''s far-side exit
    bore.'
  parts:
  - knob_press_test
  hardware:
  - bolt_m5
  tool: calipers, optional
- n: '5'
  text: 'Seat the nut in the knob: stand the knob mouth-up, drop the nut through the
    mouth, then put the M5 bolt tip-down into the mouth and press on the bolt head
    - the Ø8.5 head is wider than the nut, so it acts as a ram and drives the nut
    the last 6 mm until it stands on the shoulder. The nut''s top face ends up 0.6
    mm below the mouth roof, fully buried.'
  parts:
  - knob
  hardware:
  - nut_m5
  - bolt_m5
  tool: null
- n: '6'
  text: 'Check it: turn the knob upside down and shake - the nut must not stir. Then
    try to push the nut toward the small far-side hole with a rod: the Ø5.6 bore is
    smaller than the nut''s 8.0 mm across flats, so it stops against the shoulder.
    If either check fails, the press fit is too loose; reprint with pocket_af 0.1
    lower and change nothing else.'
  parts:
  - knob
  hardware:
  - nut_m5
  tool: null
- n: '7'
  text: 'As a handle: pass the bolt head-first through the mouth, thread it into the
    nut and let the tip come out of the Ø5.6 bore in the base. Stand the flat base
    on the work and turn; clockwise tightens. The head stays inside the mouth bore,
    below the top face.'
  parts:
  - knob
  hardware:
  - bolt_m5
  tool: null
- n: '8'
  text: 'To drive a bolt that stands proud of the work: settle the nut in the pocket,
    rest the knob''s base on the work, and pass the exposed threaded end up through
    the base bore into the nut. Same part either way, and no glue anywhere.'
  parts:
  - knob
  hardware:
  - nut_m5
  - bolt_m5
  tool: null
