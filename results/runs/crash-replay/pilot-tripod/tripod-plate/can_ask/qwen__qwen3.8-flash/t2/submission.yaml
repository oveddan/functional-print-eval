task: tripod-plate
note: 'Fixes in this pass: (1) qr_plate and jaw_gauge no longer use cq.selectors.DirectionSelector
  - that call raised the tuple/getAngle error because it wants a Vector, and worse,
  had it merely matched nothing the plate would have printed as a square-edged slab
  that skates out of angled jaw lips. The 45 deg jaw chamfers are now part of an explicit
  polygonal cross-section in the YZ plane, extruded along the plate length, so the
  taper is guaranteed to exist. (2) thumb_screw and jaw_gauge no longer call Workplane.cone,
  which does not exist in this build; the thread lead-in is now three stacked cylinders
  of rising radius, all plain circle/extrude/union calls.


  Handoff: I still cannot run CadQuery here, so I cannot see the solids. The one untestable
  piece left is the actual helical thread: it is a 0.84 mm circle swept along a 1.27
  mm pitch helix at radius 2.73 mm with Wire.makeHelix plus makePipeShell, which is
  the part of the code I am least sure this build accepts. It is wrapped in try/except:
  on failure thumb_screw and the gauge stub fall back to stacked annular ridges and
  the code prints a NEEDS-EYEBALL flag. Do not force the fallback version into your
  camera - ridges are not a helix, they would have to crush their way in. The gauge''s
  4-turn stub is the cheap way to find out: if the stub starts and turns in by hand,
  the sweep worked and the full screw is safe to print. If the preview shows a plain
  core with no ridge at all, or a wedge of material where the thread should be, the
  sweep half-failed and you should use the salvaged steel bolt only.


  The numbers still guessed: plate_grip_t = 8.0 mm, because you could not measure
  the jaw gap - the coupon exists to replace it. If the gauge says the jaws only grip
  6 mm or less, the code prints the plate with no head recess and the bolt head hangs
  about 5 mm below the plate, so confirm the jaws have that room before trusting it.
  thr_wire_dia and thr_root_dia are tuned so the ridge sits on the insert''s 5.35
  mm minor dia and is just over one full perimeter wide; crest held 0.05 under nominal
  so it starts by hand. And the whole thing assumes a light camera.'
questions: []
params:
  cam_thread_major_dia:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 UNC external major dia; your camera socket is 1/4-20
  cam_thread_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 = 20 tpi
  cam_thread_min_engage:
    value: 5
    unit: mm
    kind: design
    source: design
    note: engagement I require in the camera socket, about 4 full turns
  bolt_head_dia:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam bolt head across - you measured about 15 mm
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: salvaged bolt head thickness - you measured about 5 mm
  bolt_thread_len:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: thread under the head - you measured about 10 mm
  plate_len:
    value: 52
    unit: mm
    kind: design
    source: design
    note: along the jaws
  plate_width:
    value: 34
    unit: mm
    kind: design
    source: design
    note: across the pinch axis; wider than any small tripod jaw opening
  plate_grip_t:
    value: 8
    unit: mm
    kind: design
    source: guessed
    note: thickness the jaws pinch. Default 8.0 GUESSED - the jaw gap could not be
      measured. Set it to the thickest gauge step the jaws grip firmly and re-slice
  grip_chamfer:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: 45 deg chamfer on both faces of the two pinched edges, to meet the angled
      jaw lips
  grip_flat_band:
    value: 2
    unit: mm
    kind: design
    source: design
    note: flat band the code always leaves between the two jaw chamfers, so the lips
      have something to sit on; the chamfer is clamped down if the plate is too thin
      to keep it
  web_min:
    value: 1.6
    unit: mm
    kind: design
    source: design
    note: least PLA left over the buried fastener head before the head recess is dropped
  shank_clear_dia:
    value: 6.9
    unit: mm
    kind: design
    source: design
    note: 'through hole for the shank or printed thread: 6.35 + 0.55'
  pocket_radial_clear:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: ''
  pocket_axial_clear:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: ''
  screw_head_dia:
    value: 15
    unit: mm
    kind: design
    source: design
    note: printed screw head, matched to the bolt head so one recess fits both
  screw_head_t:
    value: 4.6
    unit: mm
    kind: design
    source: design
    note: kept under bolt_head_h + pocket_axial_clear so it seats in the same recess
  thr_crest_dia:
    value: 6.3
    unit: mm
    kind: design
    source: design
    note: printed thread crest, 0.05 under the 6.35 nominal so it starts by hand in
      the steel insert
  thr_root_dia:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: core dia of the printed shank
  thr_wire_dia:
    value: 0.84
    unit: mm
    kind: design
    source: design
    note: dia of the circle swept along the helix. Lands the ridge on the insert minor
