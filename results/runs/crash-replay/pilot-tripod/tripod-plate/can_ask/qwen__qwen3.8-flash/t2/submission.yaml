manual:
- n: '1'
  text: Print jaw_gauge first, on its own, about 8 minutes. Nothing else here can
    be sized until you know what your jaws will grip, and that gap could not be measured.
  parts:
  - jaw_gauge
  hardware: []
  tool: null
- n: '2'
  text: 'Gauge test, no tools: slide the gauge into the jaws the way the plate will
    go in - chamfered long edges against the angled lips, steps along the jaw axis
    - and tighten the knob. Work down from the 8 mm step. Write down the thickest
    step that goes in without forcing the knob, and the thinnest step you cannot pull
    out with a firm tug. plate_grip_t must land between those two. If even the 4 mm
    step will not enter, this clamp wants a plate thinner than PLA can hold a camera
    on - stop and find the real part.'
  parts:
  - jaw_gauge
  hardware: []
  tool: none
- n: '3'
  text: 'Thread test with the same coupon: press the upright 4-turn stub into your
    camera tripod socket and turn it by hand. It must start on its own and screw in
    at least 4 mm with no creaking and no force. Pass means a printed PLA thread works
    in your camera and thumb_screw is a usable spare. Fail, or a stub that came out
    as a plain plug with no ridge, means forget the printed screw and use the salvaged
    webcam bolt as the fastener. Camera face-down on a soft cloth, hold the body only,
    never push axially hard.'
  parts:
  - jaw_gauge
  hardware: []
  tool: none
- n: '4'
  text: 'Set plate_grip_t to a value between the two numbers from step 2 - 8.0 is
    the default and the strongest, because it lets the fastener head sink completely
    into the recess. Re-slice qr_plate at that thickness: flat, camera-side face on
    the bed, no supports, no raft, roughly 35-45 min. Use 3 top and 3 bottom perimeters
    and about 20 percent infill - the strength is all in the skin around the head
    recess. If the slicer shows square edges instead of a taper, the plate is too
    thin for a 2.5 mm chamfer: it has been clamped for you and the build printed a
    flag, so check that flag.'
  parts:
  - qr_plate
  hardware: []
  tool: null
- n: '5'
  text: Print thumb_screw only if step 3 passed and you want a printed spare, or if
    the salvaged bolt head will not sink into the recess and its 10 mm of thread is
    too short for the plate thickness you landed on. Stand it on its tip, no supports,
    about 10 minutes. In the preview check the driver slot reads as an opening and
    not a bridged roof, and that the thread ridge is more than one hairline wide -
    if it is thin, raise thr_wire_dia by 0.1 mm at a time, not thr_crest_dia, already
    0.05 under the steel crest for clearance.
  parts:
  - thumb_screw
  hardware: []
  tool: null
- n: '6'
  text: 'Clean up by hand: clear the 6.9 mm shank hole and the 15.8 x 5.3 mm recess
    of strings, and run an 8 mm socket or a drill bit through the hole once if it
    feels tight. Then test-fit the fastener - its head must drop into the recess and
    finish BELOW the plate underside, and the shank must pass freely. This is the
    one thing that stops the plate sitting in the jaws, so check it before anything
    goes into your camera.'
  parts:
  - qr_plate
  - thumb_screw
  hardware:
  - webcam-mount-bolt
  tool: craft knife
- n: '7'
  text: 'Assemble off the tripod, on a table, camera face-down on a soft cloth with
    its base towards you. Hold the plate flat against the camera base with one hand
    and start the fastener from the recess side of the plate, through the hole, into
    the socket, so the plate is never hanging the camera. With the salvaged bolt:
    tighten by hand to first real resistance, then a further quarter turn on the head
    with a driver. With thumb_screw: a screwdriver laid into the recess at an angle
    onto its slot - finger tight plus a short nudge, about 1 Nm. Back off an eighth
    of a turn if it squeaks: PLA swells with warmth, and a jammed thread is how people
    crack a camera insert.'
  parts:
  - qr_plate
  - thumb_screw
  hardware:
  - webcam-mount-bolt
  tool: small screwdriver or hex key
- n: '8'
  text: Drop the plate into the jaws from above, chamfered long edges against the
    lips, and tighten the tripod knob. Then pull hard on the camera by hand; it must
    not slide or lift out. Skating off a lip means raise grip_chamfer by 0.5 mm and
    reprint, as long as grip_flat_band still leaves 2 mm of flat between the chamfers.
    Loose all round means plate_grip_t was too optimistic for the closed gap - go
    one gauge step thinner and reprint.
  parts:
  - qr_plate
  - thumb_screw
  hardware:
  - webcam-mount-bolt
  tool: null
- n: '9'
  text: 'Temporary means temporary. PLA softens around 55-60 C and creeps slowly under
    a constant load. So: compact or light mirrorless with a pancake lens only, never
    a DSLR with a zoom; strap round your wrist; take the camera off when you stop
    rather than leaving it mounted; keep it out of direct sun and a hot car. Look
    at the recess and the thread before each use and bin the plate if the recess starts
    to dome or the thread crests go shiny or flat.'
  parts:
  - qr_plate
  - thumb_screw
  hardware:
  - webcam-mount-bolt
  tool: null
- n: '10'
  text: The two ISO 4762 M5x12 screws are spares only - nothing in this design threads
    into them, and the 1/4-20 fastener carries the camera by itself. If you want to
    stiffen this for a heavier body, print a 10 mm thick plate and add an M5 through-pin
    beside the 1/4-20 into a hole you drill near the plate edge, then clamp that pin
    too; but for real weight buy a proper quick-release plate and keep this one for
    small cameras.
  parts:
  - qr_plate
  hardware:
  - iso4762-m5x12
  tool: null
