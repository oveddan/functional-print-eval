parts:
- id: qr_plate
  role: final
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    L = p.plate_len\n    W = p.plate_width\n    T = p.plate_grip_t\n\
    \    ch = p.grip_chamfer\n    hole_r = p.shank_clear_dia / 2.0\n    pocket_r =\
    \ (p.bolt_head_dia + 2.0 * p.pocket_radial_clear) / 2.0\n    pocket_t = p.bolt_head_h\
    \ + p.pocket_axial_clear\n    flags = []\n    band = p.grip_flat_band\n    if\
    \ 2.0 * ch > T - band:\n        ch = (T - band) / 2.0\n        flags.append('grip_chamfer_clamped_to_keep_a_flat_band_for_the_jaw_lips')\n\
    \    if ch > W / 2.0 - 0.5:\n        ch = W / 2.0 - 0.5\n        flags.append('grip_chamfer_clamped_to_plate_width')\n\
    \    if p.shank_clear_dia < p.cam_thread_major_dia + 0.2:\n        flags.append('shank_clear_hole_would_cut_thread_crests')\n\
    \    if p.bolt_head_dia > W:\n        flags.append('bolt_head_wider_than_the_plate')\n\
    \    pocket_ok = (T - pocket_t) >= p.web_min\n    if not pocket_ok:\n        flags.append('head_recess_dropped_fastener_head_will_hang_below_the_plate')\n\
    \    elif hole_r > pocket_r:\n        flags.append('shank_hole_larger_than_head_recess')\n\
    \    hw = W / 2.0\n    pts = [(hw - ch, 0.0), (-(hw - ch), 0.0), (-hw, ch), (-hw,\
    \ T - ch), (-(hw - ch), T), (hw - ch, T), (hw, T - ch), (hw, ch)]\n    body =\
    \ cq.Workplane('YZ').polyline(pts).close().extrude(L).translate(cq.Vector(-L /\
    \ 2.0, 0.0, 0.0))\n    solid = body.cut(cq.Workplane('XY', origin=(0.0, 0.0, -1.0)).circle(hole_r).extrude(T\
    \ + 2.0))\n    if pocket_ok:\n        solid = solid.cut(cq.Workplane('XY', origin=(0.0,\
    \ 0.0, T - pocket_t)).circle(pocket_r).extrude(pocket_t + 1.0))\n    for f in\
    \ flags:\n        print('NEEDS-EYEBALL: ' + f + ' - confirm against the jaw_gauge\
    \ coupon before printing')\n    return solid"
  print_orientation: 'Flat, camera-side face down on the bed: z=0 is the face the
    camera base rests on, the section is extruded along X. The 6.9 mm shank hole and
    the head recess both open upward, so no bridging and no supports; the only non-vertical
    faces are the 45 deg jaw chamfers built into the cross-section. Length 52 along
    X, width 34 along Y (the pinch axis), thickness 8 up Z.'
  use_orientation: The bed face (z=0 side) points UP to the camera base; the head-recess
    side (z=plate_grip_t) points DOWN into the jaws, so the plate is used rotated
    180 deg about X from how it prints. The fastener head sits in that recess and
    its shank stands up out of the camera-side face into the camera socket.
- id: thumb_screw
  role: final
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    pitch = p.cam_thread_pitch\n    c = p.thr_crest_dia /\
    \ 2.0\n    r = p.thr_root_dia / 2.0\n    r_w = p.thr_wire_dia / 2.0\n    tl =\
    \ p.thr_len\n    lead = p.thr_lead_in\n    head_t = p.screw_head_t\n    head_r\
    \ = p.screw_head_dia / 2.0\n    pocket_t = p.bolt_head_h + p.pocket_axial_clear\n\
    \    pocket_ok = (p.plate_grip_t - pocket_t) >= p.web_min\n    map_z = (p.plate_grip_t\
    \ - pocket_t) if pocket_ok else p.plate_grip_t\n    flags = []\n    if tl - map_z\
    \ < p.cam_thread_min_engage:\n        flags.append('thread_too_short_for_this_plate_thickness_use_the_salvaged_bolt')\n\
    \    if not pocket_ok:\n        flags.append('plate_has_no_head_recess_this_screw_will_not_sit_flush')\n\
    \    if p.screw_head_t > pocket_t + 0.05:\n        flags.append('screw_head_thicker_than_the_recess')\n\
    \    if p.screw_head_dia > p.bolt_head_dia + 2.0 * p.pocket_radial_clear - 0.4:\n\
    \        flags.append('screw_head_needs_the_recess_widened')\n    if p.slot_len\
    \ > p.bolt_head_dia + 2.0 * p.pocket_radial_clear - 1.0:\n        flags.append('driver_slot_needs_the_recess_widened_or_shortened')\n\
    \    solid = cq.Workplane('XY', origin=(0.0, 0.0, lead)).circle(r).extrude(tl\
    \ - lead)\n    steps = 3\n    step_h = lead / float(steps)\n    for i in range(steps):\n\
    \        rr = r - (steps - i) * p.thr_lead_in_step\n        if rr < 0.8:\n   \
    \         rr = 0.8\n        solid = solid.union(cq.Workplane('XY', origin=(0.0,\
    \ 0.0, i * step_h)).circle(rr).extrude(step_h + 0.002))\n    helix_h = tl - lead\
    \ - p.thread_top_clear\n    try:\n        import math\n        r_h = c - r_w\n\
    \        w = math.sqrt(r_h * r_h + (pitch / (2.0 * math.pi)) ** 2)\n        n\
    \ = max(int((helix_h / pitch) * 28.0), 2)\n        wires = []\n        for i in\
    \ range(n + 1):\n            t = 2.0 * math.pi * i / float(n)\n            px\
    \ = r_h * math.cos(t)\n            py = r_h * math.sin(t)\n            pz = lead\
    \ + (pitch / (2.0 * math.pi)) * t\n            tx = -r_h * math.sin(t) / w\n \
    \           ty = r_h * math.cos(t) / w\n            tz = (pitch / (2.0 * math.pi))\
    \ / w\n            wires.append(cq.Wire.makeCircle(r_w, cq.Vector(px, py, pz),\
    \ cq.Vector(tx, ty, tz)))\n        helix = cq.Wire.makeHelix(pitch, helix_h, r_h)\n\
    \        band = helix.makePipeShell(wires[1:], makeSolid=True, isFrenet=True)\n\
    \        solid = solid.union(wires[0]).union(band)\n    except Exception:\n  \
    \      n_r = max(int(round(helix_h / pitch)), 2)\n        stp = helix_h / float(n_r)\n\
    \        for i in range(n_r):\n            z0 = lead + i * stp\n            ring\
    \ = cq.Workplane('XY', origin=(0.0, 0.0, z0 - 0.001)).circle(c + p.thread_root_margin).extrude(stp\
    \ * 0.52 + 0.002)\n            up = cq.Workplane('XY', origin=(0.0, 0.0, z0 +\
    \ stp * 0.52)).circle(r - p.thread_root_margin).extrude(stp * 0.48)\n        \
    \    solid = solid.union(ring).union(up)\n        flags.append('helical_thread_fell_back_to_straight_ridges_do_not_force_it_in')\n\
    \    solid = solid.union(cq.Workplane('XY', origin=(0.0, 0.0, tl)).circle(head_r).extrude(head_t))\n\
    \    solid = solid.cut(cq.Workplane('XY', origin=(-p.slot_len / 2.0, -p.slot_w\
    \ / 2.0, tl + head_t - p.slot_depth)).box(p.slot_len, p.slot_w, p.slot_depth +\
    \ 0.6))\n    solid = solid.translate(cq.Vector(0.0, 0.0, map_z - tl))\n    for\
    \ f in flags:\n        print('NEEDS-EYEBALL: ' + f + ' - confirm against the jaw_gauge\
    \ coupon before printing')\n    return solid"
  print_orientation: 'Stands on its faceted lead-in tip, axis vertical: tip at z=0,
    head at the top, so the thread crest ridges face up and the driver slot opens
    upward and needs no bridge. The tip is three stacked cylinders (3.2, 3.8, 4.4
    mm dia over 1.5 mm) giving a solid 3.2 mm first-layer circle. No supports.'
  use_orientation: 'Installed the other way round from how it prints: in the plate
    frame the head drops into the recess on the clamp side of the plate and the thread
    points up through the 6.9 mm hole into the camera, so the head driver face ends
    up about 1 mm below the plate underside, reachable through the 15.8 mm recess
    mouth with a small driver held at a slight angle.'
- id: jaw_gauge
  role: coupon
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    c = p.thr_crest_dia / 2.0\n    r_w = p.thr_wire_dia /\
    \ 2.0\n    pitch = p.cam_thread_pitch\n    ch = p.grip_chamfer\n    n_st = int(p.gauge_n_steps)\n\
    \    step_len = p.gauge_step_len\n    W = p.gauge_width\n    hw = W / 2.0\n  \
    \  t_min = p.gauge_t_min\n    t_max = p.gauge_t_max\n    flags = []\n    if n_st\
    \ * step_len > p.gauge_len:\n        flags.append('gauge_steps_overrun_gauge_length')\n\
    \    if p.bolt_head_dia > W:\n        flags.append('gauge_narrower_than_the_fastener_head')\n\
    \    solid = None\n    for i in range(n_st):\n        t_i = t_min + (t_max - t_min)\
    \ * i / float(max(n_st - 1, 1))\n        ch_g = ch\n        if 2.0 * ch_g > t_i\
    \ - 1.0:\n            ch_g = (t_i - 1.0) / 2.0\n        if ch_g > hw - 0.5:\n\
    \            ch_g = hw - 0.5\n        x_i = (i - (n_st - 1) / 2.0) * step_len\n\
    \        pts = [(hw - ch_g, 0.0), (-(hw - ch_g), 0.0), (-hw, ch_g), (-hw, t_i\
    \ - ch_g), (-(hw - ch_g), t_i), (hw - ch_g, t_i), (hw, t_i - ch_g), (hw, ch_g)]\n\
    \        blk = cq.Workplane('YZ').polyline(pts).close().extrude(step_len).translate(cq.Vector(x_i\
    \ - step_len / 2.0, 0.0, 0.0))\n        solid = blk if solid is None else solid.union(blk)\n\
    \    t_hi = t_max\n    x0 = -(n_st - 1) / 2.0 * step_len\n    stub_h = p.gauge_stub_turns\
    \ * pitch\n    try:\n        import math\n        r_h = c - r_w\n        w = math.sqrt(r_h\
    \ * r_h + (pitch / (2.0 * math.pi)) ** 2)\n        n = max(int(p.gauge_stub_turns\
    \ * 28), 2)\n        wires = []\n        for i in range(n + 1):\n            t\
    \ = 2.0 * math.pi * i / float(n)\n            px = x0 + r_h * math.cos(t)\n  \
    \          py = r_h * math.sin(t)\n            pz = t_hi + (pitch / (2.0 * math.pi))\
    \ * t\n            tx = -r_h * math.sin(t) / w\n            ty = r_h * math.cos(t)\
    \ / w\n            tz = (pitch / (2.0 * math.pi)) / w\n            wires.append(cq.Wire.makeCircle(r_w,\
    \ cq.Vector(px, py, pz), cq.Vector(tx, ty, tz)))\n        helix = cq.Wire.makeHelix(pitch,\
    \ stub_h, r_h)\n        band = helix.translate(cq.Vector(x0, 0.0, t_hi)).makePipeShell(wires[1:],\
    \ makeSolid=True, isFrenet=True)\n        solid = solid.union(cq.Workplane('XY',\
    \ origin=(x0, 0.0, t_hi)).circle(c - p.thread_side_clear).extrude(stub_h))\n \
    \       solid = solid.union(wires[0]).union(band)\n    except Exception:\n   \
    \     solid = solid.union(cq.Workplane('XY', origin=(x0, 0.0, t_hi)).circle(c\
    \ - p.thread_side_clear - p.thread_root_margin).extrude(stub_h))\n        flags.append('stub_thread_fell_back_to_a_plain_plug_diameter_check_only')\n\
    \    for f in flags:\n        print('NEEDS-EYEBALL: ' + f + ' - adjust the gauge\
    \ or plate params and re-slice')\n    return solid"
  print_orientation: Flat, all steps sharing one bottom plane on the bed (z=0), each
    step an extruded chamfered cross-section along X. Five blocks from 4 mm to 8 mm
    thick, 6 mm long, with 45 deg jaw chamfers top and bottom on the long edges; a
    4-turn test thread stands upright on the tallest step. No supports, no bridging.
  use_orientation: Not a load-bearing part. It goes into the tripod jaws exactly the
    way the plate does - chamfered long edges against the angled lips, steps along
    the jaw axis - and its upright thread stub is pressed into the camera socket to
    test a printed PLA thread.
