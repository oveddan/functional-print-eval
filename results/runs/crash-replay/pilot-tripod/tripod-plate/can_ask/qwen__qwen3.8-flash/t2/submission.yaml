criteria:
- id: grip_thickness_fits_jaws
  part: jaw_gauge
  feature: gauge_steps
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - plate_grip_t
  - grip_chamfer
  - gauge_t_min
  - gauge_t_max
  - gauge_n_steps
  check:
    method: coupon
    ref: jaw_gauge
    description: 'The unknown that governs everything: the gap between the jaw lips.
      Push each of the five steps (4, 5, 6, 7, 8 mm) into the jaws and tighten the
      knob. The thickest step that goes in without forcing the knob, and that you
      cannot pull out with a firm tug, becomes plate_grip_t. Re-slice qr_plate at
      that value, then print it.'
- id: grip_faces_wedged_not_skated
  part: qr_plate
  feature: grip_chamfer
  relation: seats
  hardware: null
  clearance_mm: 0.0
  params:
  - grip_chamfer
  - grip_flat_band
  - plate_grip_t
  - plate_width
  check:
    method: measure
    ref: jaw_gauge
    description: The cross-section carries 45 deg chamfers on both faces of both long
      edges, so the angled lips bear on a matching taper and pull the plate down instead
      of skating off a square edge. grip_flat_band keeps at least 2 mm of flat band
      between them; the code clamps grip_chamfer and prints a flag if the plate is
      too thin to keep it. If your lips are flat and parallel, keep the chamfer anyway.
- id: camera_face_bears_on_camera
  part: qr_plate
  feature: camera_face
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - plate_len
  - plate_width
  - plate_grip_t
  - shank_clear_dia
  check:
    method: none
    ref: null
    description: The 52 x 34 face at z=0, the bed face so the flattest one, is what
      the camera base sits on. Nothing stands proud of it - only the thread passes
      through.
- id: shank_hole_clears_fastener
  part: qr_plate
  feature: shank_hole
  relation: clears
  hardware: webcam-mount-bolt
  clearance_mm: 0.275
  params:
  - shank_clear_dia
  - cam_thread_major_dia
  check:
    method: measure
    ref: null
    description: 'Drop the bolt through from the recess side: it must pass freely
      - 6.9 mm hole against a 6.35 mm thread crest is 0.275 mm radius clearance. Do
      not close this down to the crest dia or less, or the printed screw crests shear
      off during assembly.'
- id: head_pocket_seats_fastener
  part: qr_plate
  feature: head_pocket
  relation: seats
  hardware: webcam-mount-bolt
  clearance_mm: 0.4
  params:
  - bolt_head_dia
  - bolt_head_h
  - pocket_radial_clear
  - pocket_axial_clear
  - screw_head_dia
  - screw_head_t
  check:
    method: measure
    ref: null
    description: The 15.8 x 5.3 mm recess on the clamp side is sized to the head you
