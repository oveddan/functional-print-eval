  tool: coarse file
- n: '7'
  text: 'Attach to the camera. Stand the plate foot-up on the table, drop the salvaged
    1/4-20 bolt into the cavity so its head sits down on the ledge around the hole,
    then drive it up into the camera''s socket by hand for the first turns and tighten
    with whatever suits the head. All 10 mm of thread should be in use: 4 mm through
    the deck web leaves 6 mm biting the camera. Don''t overtighten - you are clamping
    a plastic ledge, and there is no metal shoulder here.'
  parts:
  - camera_plate
  hardware:
  - webcam_bolt
  tool: null
- n: '8'
  text: 'The printed spare screw, if you must: first run the metal bolt through its
    thread to form the crests, then start it in the camera by hand with no force and
    back it out if it binds at any point. It is not a real helical thread, it''s ridges
    at the correct 1.27 mm pitch, so it cuts rather than rolls. A stripped PLA stud
    jammed inside a camera socket is a far worse job than a missing plate - metal
    bolt first, always.'
  parts:
  - camera_screw
  hardware:
  - webcam_bolt
  tool: null
- n: '9'
  text: 'Mount: seat the plate in the jaws, tighten the knob, then tug the camera
    along all three axes and watch the deck for tilt or slide. Keep the camera strap
    round your neck until you''re confident.'
  parts:
  - camera_plate
  hardware: []
  tool: null
- n: '10'
  text: It's temporary on purpose. Re-check the knob and the plate after the first
    hour and whenever it gets warm - PLA softens near 55 C and creeps under a standing
    load, which slowly turns a tight grip into a loose one. Take it off when you find
    the real plate, and don't hang anything over it you'd cry about.
  parts:
  - camera_plate
