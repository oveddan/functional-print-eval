task: tripod-plate
note: 'Difficulty: low. The flat plate is the easy part and prints with no supports.
  Do NOT print the 1/4-20 screw that goes into the camera - printed threads in that
  joint are the classic way to wreck a camera socket, and you already own a steel
  1/4-20 bolt (the webcam one: 15 mm head, 5 mm head height, 10 mm of thread), which
  is exactly a tripod screw. So: a printed plate that the jaws grip, plus the printed
  "part that screws in" being a knurled thumb-cap that holds that bolt''s head and
  gives you something to turn by hand.


  Build fixes this round: cap and jaw-coupon both failed on ''float object cannot
  be interpreted as an integer''. Cause was CadQuery''s n-gon call - the leading argument
  is read as the side count, so polygon(radius, 6) hands it a float where it wants
  an int - and polarArray, which wants an int count while cap_scallop_n arrives as
  a float. Both hexagons are now drawn as explicit six-point wires (moveTo / lineTo
  / close, using circumradius = across_flats / sqrt(3)) and the scallop count is wrapped
  in int(). The plate was already building because it uses no polygon or polarArray,
  so its geometry is untouched. If the cap still errors, it would now only be the
  scallop array call, and int() covers that.


  Load path (all real thread, all the time): bolt threads into the camera''s steel
  1/4-20 socket -> bolt head pushes up on the thumb-cap''s ceiling -> cap pushes up
  on the plate''s underside pad -> plate pushes up on the camera''s base -> the jaws
  pinch the plate''s dovetail shank. Nothing printed is ever asked to carry a threaded
  joint.


  Thread budget (the thing worth checking): the cap''s ceiling is 1.6 mm and the plate
  is 3.8 mm at the hole, so of the bolt''s 10 mm of thread about 4.6 mm (3.5 turns)
  stands above the plate for the camera to bite into. Enough for a light compact or
  webcam-class camera on a small tripod; not enough for a DSLR with a lens, and not
  enough if the socket is deep - manual step 8 has you count turns before you trust
  it.


  Fit uncertainty handled the only honest way: the tripod jaw numbers never arrived,
  so grip_across (the width the jaws pinch) is a guess, 32 mm, deliberately at the
  small end. The coupon carries three dovetail tongues at 26 / 32 / 38 mm, dimensionally
  identical to the real plate, plus two 5.4 mm-deep test recesses (15.6 A/F hex and
  16.4 round) to find out what your bolt head actually is - that one choice sets one
  cap parameter.


  Safety notes baked into the manual: temporary only, light camera, tighten the jaws
  hard, a little grease on the bolt so the steel does the work and the PLA is only
  located, and if the cap ever feels loose stop and turn the bolt with a screwdriver
  instead.'
questions:
- text: How wide is the gap between the jaw faces when the knob is fully open - the
    width the plate drops through?
  answer: 'No number available - the only record is qualitative: jaws with angled
    lips, tightened by a knob, plate drops in from above. Handled by making grip_across
    a param and printing the sizing coupon first.'
- text: How far do the angled lips reach inboard, and how tall do they stand above
    the jaw faces (how deep a bite do they take)?
  answer: No number available. Handled by the coupon tongues, by keeping the cap slim
    (28 mm), and by a manual check that the 5.5 mm of lip travel does not meet it.
- text: Is the 15 mm bolt head hex (15 across flats, so 17.3 across corners) or round
    (15 diameter), and is it slotted or hex-keyed so a screwdriver can reach it?
  answer: Only 'about 15 mm across, 5 mm high, 10 mm of thread under the head' on
    record. The coupon has both recesses; then cap_bore_af is set to match.
- text: Is the camera's 1/4-20 socket recessed in a counterbore, and roughly how deep
    does the threaded hole go?
  answer: Not known. The stack as designed offers 4.6 mm. Manual step 8 says to watch
    it thread in by hand and stop if it bottoms out or only two or three turns bite.
- text: How much room does the clamp body give along the plate's length, and how much
    open space is there below the jaws?
  answer: No number available. plate_len is 58 mm and the coupon card is the same
    58 mm, so it can be held against the clamp before committing (manual step 6).
- text: Both the cap and the coupon failed to build with 'float object cannot be interpreted
    as an integer' - was that my code?
  answer: 'Fixed and resubmitted: the n-gon helper was being handed a float where
    it wants an integer side count, and the scallop array count likewise arrived as
    a float. Hexagons are now built as explicit six-point wires and the count is wrapped
    in int(). The plate needed no change.'
params:
  bolt_clr_hole_d:
    value: 7.6
    unit: mm
    kind: design
    source: design
    note: 'thread clearance through the plate and through the cap''s ceiling: 1/4-20
      major 6.35 plus about 0.6 mm per side for printed crests'
  bolt_thread_len:
    value: 10
    unit: mm
    kind: world
    source: measured
    note: thread under the head, measured by you; sets the whole stack budget
  cap_bore_af:
    value: 15.6
    unit: mm
    kind: design
    source: design
    note: hex bore across flats = head_across + 0.6. Fits a 15 A/F hex head and also
      a round 15 head. If the coupon says the head is round and it spins in the bore,
      go to 15.8 and turn the bolt with a screwdriver
  cap_bore_depth:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: head_h + 0.4; this depth is what lets the cap's ceiling sit above the ledge
      plane, and it costs the thread 1.6 mm
  cap_ceiling_t:
    value: 1.6
    unit: mm
    kind: design
    source: design
    note: between the head's top face and the plate's underside; the only printed
      thing in compression, over about 150 mm2 of annulus
  cap_od:
    value: 28
    unit: mm
    kind: design
    source: design
    note: 'thumb-cap body: hand-turnable, and slim (28) enough to pass between the
      lips, since 2*14 < slot_top_d'
  cap_scallop_d:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: finger scallops cut around the cap
  cap_scallop_n:
    value: 12
    unit: count
    kind: design
    source: design
    note: number of finger scallops; passed to polarArray through int()
  gasket_t:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: coupon gasket strip thickness, for if the lips need a little more height
      to bite
  grip_across:
    value: 32
    unit: mm
    kind: world
    source: guessed
    note: width of the plate's shank where the jaws pinch; deliberate guess at the
      small end of the plausible range - set it from the coupon
  head_across:
    value: 15
    unit: mm
    kind: world
    source: measured
    note: salvaged bolt head, measured by you
  head_h:
    value: 5
    unit: mm
    kind: world
    source: measured
    note: salvaged bolt head height, measured by you
  layer_h:
    value: 0.2
    unit: mm
    kind: world
    source: asked
    note: their printer's usual layer height; used only in the manual
  pad_d:
    value: 23
    unit: mm
    kind: design
    source: design
    note: printed pad spanning the slot's middle at the ledge plane; the cap's ceiling
      pushes up on it, and it keeps the ledge continuous so the plate cannot be pulled
      through
  pad_rise:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: how far the pad reaches below the ledge plane, so the cap's ceiling meets
      plate material instead of an open span
  pitch_1420:
    value: 1.27
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 pitch, from the hardware list; gives about 3.5 turns of steel engagement
      at the camera
  plate_len:
    value: 58
    unit: mm
    kind: design
    source: design
    note: plate length along the jaws; CHECK against the clamp body before printing
      (manual step 6)
  rail_lead:
    value: 1.1
    unit: mm
    kind: design
    source: design
    note: lead-in chamfer on the shank's bottom outer edges; also makes the shank
      33 vs a 32 nominal gap for a two-plane pinch
  shank_t:
    value: 5.8
    unit: mm
    kind: design
    source: design
    note: height of the wedge that goes between the jaws
  slot_bottom_w:
    value: 33
    unit: mm
    kind: world
    source: guessed
    note: 'jaw gap depth: the plate''s own shank is rail_lead narrower than the slot
      at each level, so the gap is partly unknown; 33 here, 7 less than slot_top_d'
  slot_top_d:
    value: 39
    unit: mm
    kind: world
    source: guessed
    note: inside width at the mouth of the jaws' slot, where the lips bite; must be
      at least grip_across + 2x lip bite
  test_bore_af:
    value: 15.6
    unit: mm
    kind: design
    source: design
    note: hex test recess on the coupon, same size as the cap bore
  test_bore_d:
    value: 16.4
    unit: mm
    kind: design
    source: design
    note: 'round test recess on the coupon: takes a round 15 head, too small for a
      15 A/F hex head (17.3 across corners)'
  thread_major:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 UNC major diameter, from the hardware list
  top_slab_t:
    value: 3.8
    unit: mm
    kind: design
    source: design
    note: plate thickness at the bolt; it is the ledge the lips bite and it eats 3.8
      mm of the bolt's 10 mm of thread
  tongue_len:
    value: 20
    unit: mm
    kind: design
    source: design
    note: length of each coupon tongue
  tongue_pitch:
    value: 29
    unit: mm
    kind: design
    source: design
    note: spacing of the three tongues; the widest is grip_across+6 = 38 across, so
      29 clears it
  wing:
    value: 6.4
    unit: mm
    kind: design
    source: design
    note: plate edge overhang beyond the shank side = 3.0 mm horizontal bite + 3.4
      mm of angled lip above it
parts:
- id: plate
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    # Flat drop-in plate for the tripod's jaw clamp, printed\
    \ lying on its\n    # camera-side face, so the dovetail narrows going up and needs\
    \ no supports.\n    # print frame: z=0 is the camera-side face; +z points down\
    \ toward the jaws.\n    L = p.plate_len\n    h = p.top_slab_t                \
    \    # ledge plane sits at z = h\n    Wt = p.grip_across + 2.0 * p.wing   # full\
    \ (camera-side) width\n\n    def slab(w):\n        # racetrack w wide, L long,\
    \ h thick, sitting on the bed, z 0..h\n        half = (L - w) / 2.0\n        s\
    \ = cq.Workplane('XY').box(L - w, w, h, centered=(True, True, False))\n      \
    \  s = s.union(cq.Workplane('XY').center(half, 0).circle(w / 2.0).extrude(h))\n\
    \        s = s.union(cq.Workplane('XY').center(-half, 0).circle(w / 2.0).extrude(h))\n\
    \        return s\n\n    # full-width top slab, then cut the jaws' slot out of\
    \ it: the slot's mouth\n    # is wider (39) than its bottom (33) so the jaws grip\
    \ the shank on two planes\n    plate = slab(Wt).cut(slab(p.slot_top_d)).cut(slab(p.grip_across))\n\
    \n    # wedge shank that goes between the jaws, with lead-in chamfers on its bottom\
    \ edges\n    rail = (cq.Workplane('XY')\n            .box(L - p.grip_across, p.grip_across,\
    \ p.shank_t, centered=(True, True, False))\n            .union(cq.Workplane('XY').center((L\
    \ - p.grip_across) / 2.0, 0)\n                   .circle(p.grip_across / 2.0).extrude(p.shank_t))\n\
    \            .union(cq.Workplane('XY').center(-(L - p.grip_across) / 2.0, 0)\n\
    \                   .circle(p.grip_across / 2.0).extrude(p.shank_t)))\n    rail\
    \ = (rail.edges('<Z').chamfer(p.rail_lead)\n                .faces('>X').chamfer(p.rail_lead)\n\
    \                .faces('<X').chamfer(p.rail_lead))\n    plate = plate.union(rail.translate(cq.Vector(0,\
    \ 0, h)))\n\n    # pad across the slot's middle at the ledge plane: the cap's\
    \ ceiling pushes\n    # up on this rather than on a thin unsupported span of the\
    \ top slab\n    plate = plate.union(cq.Workplane('XY').circle(p.pad_d / 2.0).extrude(h\
    \ + p.pad_rise))\n\n    # clearance for the bolt thread, generous enough for printed\
    \ thread crests\n    plate = plate.cut(cq.Workplane('XY').circle(p.bolt_clr_hole_d\
    \ / 2.0)\n                      .extrude(h + p.shank_t + p.pad_rise + 3.0))\n\
    \    return plate"
  print_orientation: camera-side face (the widest, fully flat 47 mm-wide face) down
    on the bed; the dovetail shank points up at the nozzle so every layer is narrower
    than the one below it - no overhangs, no supports
  use_orientation: 'lift off the bed and turn it over 180 degrees about the plate''s
    long (y) axis: the face that was on the bed now points up and carries the camera,
    the shank points down between the jaws, the ledge faces up into the jaws'' lips,
    and the pad reaches 1.2 mm below the ledge'
- id: cap
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    # The \"part that screws in\": a knurled thumb cap holding\
    \ the salvaged\n    # 1/4-20 bolt's head. Printed mouth-down on the bed, so the\
    \ hex bore is a\n    # blind hole opening at the bed - no overhangs, no supports.\n\
    \    # print frame: z=0 is the bore mouth plane, z grows toward the plate.\n \
    \   #\n    # the hexagon is drawn as an explicit wire rather than with polygon(),\n\
    \    # whose leading argument is read as a side count and rejects a float.\n \
    \   zc = p.cap_bore_depth + p.cap_ceiling_t     # mouth plane to plate face\n\
    \    R = p.cap_bore_af * 0.5773502692            # across flats / sqrt(3)\n  \
    \  k = 0.8660254038                            # sqrt(3)/2\n    pts = [(R, 0.0),\
    \ (0.5 * R, k * R), (-0.5 * R, k * R),\n           (-R, 0.0), (-0.5 * R, -k *\
    \ R), (0.5 * R, -k * R)]\n\n    cap = cq.Workplane('XY').circle(p.cap_od / 2.0).extrude(zc)\n\
    \n    # blind hex bore the bolt head drops into (a round 15 mm head fits inside\
    \ it too)\n    hexwire = cq.Workplane('XY').moveTo(pts[0][0], pts[0][1])\n   \
    \ for q in pts[1:]:\n        hexwire = hexwire.lineTo(q[0], q[1])\n    cap = cap.cut(hexwire.close().extrude(p.cap_bore_depth))\n\
    \n    # the thread passes here; the annulus left between this hole and the 15\
    \ mm\n    # head is the bearing that carries the whole camera\n    cap = cap.cut(cq.Workplane('XY').circle(p.bolt_clr_hole_d\
    \ / 2.0).extrude(zc + 2.0))\n\n    # finger scallops all the way round, above\
    \ and below mid height\n    sc = (cq.Workplane('XY').workplane(offset=zc / 2.0,\
    \ centerOption='CenterOfMass')\n          .circle(p.cap_od / 2.0 + p.cap_scallop_d\
    \ / 2.0 - 0.4)\n          .polarArray(int(p.cap_scallop_n))\n          .circle(p.cap_scallop_d\
    \ / 2.0)\n          .extrude(zc + 4.0, both=True))\n    cap = cap.cut(sc)\n  \
    \  return cap"
  print_orientation: bore-mouth face (the face with the hexagonal hole in it) down
    on the bed; the bore prints as an unsupported blind hole going up, the ceiling
    is the last layer, the scalloped outside is vertical
  use_orientation: turn it over so its flat ceiling face points up and presses on
    the plate's underside pad, and the hex bore points down with the bolt head sitting
    in it; the bolt's thread sticks up through the 7.6 mm hole in the ceiling
- id: jaw-coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    # One cheap print that answers everything that could not\
    \ be measured: which\n    # width the jaws grip, whether the lips clear the cap,\
    \ and whether the bolt\n    # head is hex or round. Printed flat, card face down,\
    \ no supports.\n    #\n    # hexagons here are explicit six-point wires, not polygon()\
    \ calls, so no\n    # float ever lands where a side count is expected.\n    h\
    \ = p.top_slab_t\n    st = p.shank_t\n    lead = p.rail_lead\n    L = p.tongue_len\n\
    \    k = 0.8660254038\n\n    def rail(w, x, ytop):\n        b = cq.Workplane('XY').center(x,\
    \ ytop).rect(w, L).extrude(st)\n        return (b.edges('<Z').chamfer(lead)\n\
    \                  .faces('>X').chamfer(lead)\n                  .faces('<X').chamfer(lead))\n\
    \n    widths = [p.grip_across - 6.0, p.grip_across, p.grip_across + 6.0]\n   \
    \ spines, wings = [], []\n    for i, w in enumerate(widths):\n        y = -p.slot_top_d\
    \ - 2.0 - i * lead\n        spines.append(rail(w, 0.0, y))\n        wings.append(cq.Workplane('XY').center(0.0,\
    \ y)\n                     .box(w + 2.0 * p.wing, p.slot_top_d + 12.0, h,\n  \
    \                        centered=(True, True, False)))\n    card = cq.Workplane('XY').box(p.grip_across\
    \ + 2.0 * p.wing, 84.0, h,\n                                 centered=(True, True,\
    \ False))\n    out = card\n    for s in spines:\n        out = out.union(s.translate(cq.Vector(0,\
    \ 0, h)))\n    for w in wings:\n        out = out.union(w.translate(cq.Vector(0,\
    \ 0, h)))\n\n    def hexprism(cx, cy, af, depth):\n        R = af * 0.5773502692\
    \            # across flats / sqrt(3)\n        pts = [(R, 0.0), (0.5 * R, k *\
    \ R), (-0.5 * R, k * R),\n               (-R, 0.0), (-0.5 * R, -k * R), (0.5 *\
    \ R, -k * R)]\n        wp = cq.Workplane('XY').center(cx, cy).moveTo(pts[0][0],\
    \ pts[0][1])\n        for q in pts[1:]:\n            wp = wp.lineTo(q[0], q[1])\n\
    \        return wp.close().extrude(depth)\n\n    # two 5.4-deep test recesses\
    \ in the card's middle: drop the bolt head into\n    # each - whichever fits tells\
    \ you the head shape for the cap's bore\n    out = out.cut(hexprism(-8.0, 8.0,\
    \ p.test_bore_af, p.cap_bore_depth))\n    out = out.cut(cq.Workplane('XY').center(8.0,\
    \ 8.0)\n                  .circle(p.test_bore_d / 2.0).extrude(p.cap_bore_depth))\n\
    \n    # gasket strip, 0.4 mm thick, if the lips sit too low to bite the ledge\n\
    \    out = out.union(cq.Workplane('XY').center(0.0, 30.0)\n                  \
    \  .box(p.grip_across + 2.0 * p.wing, 12.0, p.gasket_t,\n                    \
    \     centered=(True, True, False)))\n    return out"
  print_orientation: card face down on the bed (the test recesses show as blind holes
    on the other side); the three tongues and their wings are laid flat beside it,
    so nothing overhangs
  use_orientation: each tongue is a finished length of the plate's dovetail in plan
    view - flat card face up, wedge end down, dropped straight into the jaws and tightened;
    used as a test piece, never assembled
hardware:
- id: bolt-webcam
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: bolt-to-camera
  fastener: bolt-webcam
  axis_origin:
  - 0.0
  - 0.0
  - -12.2
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: cap
    feature: bore
    role: insert
  - part: plate
    feature: bolt-hole
    role: clearance
  nut: null
  external: camera's 1/4-20 UNC tripod socket
- id: plate-in-jaws
  fastener: bolt-webcam
  axis_origin:
  - 0.0
  - 0.0
  - -12.2
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: shank
    role: thread
  - part: jaw-coupon
    feature: tongue
    role: thread
  nut: null
  external: tripod jaw clamp, tightened by its own knob
criteria:
- id: ledge-bite
  part: plate
  feature: ledge
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - grip_across
  - slot_top_d
  - wing
  - top_slab_t
  - shank_t
  check:
    method: coupon
    ref: jaw-coupon
    description: the tongue of the width you chose must drop into the jaws and resist
      hand pull-out, proving the lips reach about 3 mm inboard of the ledge and stand
      about 3.4 mm above it
- id: shank-fits-slot
  part: plate
  feature: shank
  relation: clears
  hardware: null
  clearance_mm: 0.5
  params:
  - grip_across
  - slot_top_d
  - rail_lead
  check:
    method: coupon
    ref: jaw-coupon
    description: the narrow end of a tongue must drop into the slot without forcing;
      the 33 mm nominal face against a 32 mm jaw gap gives a two-plane pinch
- id: thread-clears-plate
  part: plate
  feature: bolt-hole
  relation: clears
  hardware: bolt-webcam
  clearance_mm: 0.6
  params:
  - bolt_clr_hole_d
  - thread_major
  - top_slab_t
  check:
    method: coupon
    ref: jaw-coupon
    description: the bolt must pass through 3.8 mm of printed plate and still leave
      about 4.6 mm of clean thread above it; the coupon wings are the same 3.8 mm
      thick, so try the bolt through one before printing the plate
- id: head-in-bore
  part: cap
  feature: bore
  relation: contains
  hardware: bolt-webcam
  clearance_mm: null
  params:
  - head_across
  - head_h
  - cap_bore_af
  - cap_bore_depth
  check:
    method: coupon
    ref: jaw-coupon
    description: 'step 4: the head must enter either the 15.6 A/F hex recess or the
      16.4 round recess, both 5.4 deep; that tells you the head shape and whether
      the cap can drive the bolt'
- id: ceiling-bears-on-plate
  part: cap
  feature: ceiling
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - cap_ceiling_t
  - pad_d
  - pad_rise
  - grip_across
  check:
    method: coupon
    ref: jaw-coupon
    description: the cap's 1.6 mm ceiling presses the 23 mm pad on the ledge plane,
      inside the 25 mm lip of the slot; the coupon tongue's ledge is the same 3.8
      mm plate at the same plane, so assemble bolt + cap + a tongue and confirm the
      stack is tight with no rocking before printing the plate
- id: cap-clears-lips
  part: cap
  feature: body
  relation: clears
  hardware: null
  clearance_mm: 1.0
  params:
  - cap_od
  - slot_top_d
  - cap_bore_depth
  check:
    method: coupon
    ref: jaw-coupon
    description: 'step 5: the cap hangs below the ledge plane and must pass between
      the lips'' inner edges - 28 mm cap in a 39 mm-wide slot at that level, with
      about 5.5 mm of inward lip travel before contact'
- id: thread-engages-camera
  part: plate
  feature: top-face
  relation: engages
  hardware: bolt-webcam
  clearance_mm: null
  params:
  - bolt_thread_len
  - top_slab_t
  - cap_ceiling_t
  - cap_bore_depth
  - pitch_1420
  check:
    method: measure
    ref: null
    description: at least four full turns of steel thread (about 5 mm) must enter
      the camera socket; here 10 - 1.6 - 3.8 = 4.6 mm, so watch it thread in by hand
      in step 8 and stop if the bolt bottoms out or only two or three turns bite
- id: plate-length-clears-clamp
  part: plate
  feature: outline
  relation: clears
  hardware: null
  clearance_mm: 2.0
  params:
  - plate_len
  check:
    method: coupon
    ref: jaw-coupon
    description: 'step 6: the coupon card is 58 mm wide, the same as the plate''s
      length, so holding it against the clamp tests the length before committing to
      the plate'
- id: camera-seats-on-plate
  part: plate
  feature: top-face
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - plate_len
  - grip_across
  - pad_d
  - bolt_clr_hole_d
  check:
    method: none
    ref: null
    description: the camera rests on the plate's flat printed bed face - 58 x 47 mm
      of bearing with a 7.6 mm hole at the centre; if the socket sits in a deep counterbore
      the bolt must still reach, checked in step 8
manual:
- n: '1'
  text: 'Print the coupon (jaw-coupon) first; print the plate and cap only after step
    6. Everything prints at 0.2 mm layer height, 3 perimeters, 100% infill on the
    cap and plate (they are small and they carry the camera), no supports - all three
    are shaped so nothing overhangs. Respect the print orientations in each part''s
    note: the plate lies on its big flat camera-side face, the cap lies on the face
    with the hexagonal hole in it.'
  parts:
  - plate
  - cap
  - jaw-coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Snap the three tongues off the coupon card. Each is exactly the plate''s
    cross-section: a 9.6 mm-tall section (3.8 mm ledge slab plus 5.8 mm wedge) whose
    narrow end is 26, 32 or 38 mm across. Drop the narrow (26 mm) tongue wedge-first
    into the open jaws, tighten the knob, then try to pull it out by hand. Repeat
    with the other two. The right one is the one you cannot pull out with firm hand
    force and that does not rock when tightened. Note which it was.'
  parts:
  - jaw-coupon
  hardware: []
  tool: null
- n: '3'
  text: While a tongue is clamped, look at the mouth of the jaws' slot. The lips should
    bite roughly 3 mm inboard of the plate's edge and stand about 3.4 mm above the
    ledge. If they sit lower than that, glue the coupon's 0.4 mm gasket strip(s) onto
    the ledge, or print the plate with a thinner top_slab_t so the ledge sits lower.
    If the jaws had to close almost fully onto the tongue that fit, leave grip_across
    as it is; if they still had several millimetres of travel left, raise grip_across
    by that much (keeping slot_top_d and slot_bottom_w seven millimetres above it)
    and reprint the coupon.
  parts:
  - jaw-coupon
  - plate
  hardware: []
  tool: ruler or calipers
- n: '4'
  text: 'Drop the salvaged bolt head-first into each of the two 5.4 mm-deep recesses
    in the middle of the coupon card: one is a 15.6 mm hexagon across flats, the other
    a 16.4 mm circle. Whichever the head enters is your head shape. Hex: leave cap_bore_af
    at 15.6, the cap will positively drive the bolt. Round: the head will spin inside
    the bore, so set cap_bore_af to 15.8 and expect to turn the bolt with a screwdriver
    on its head rather than by the cap.'
  parts:
  - jaw-coupon
  - cap
  hardware:
  - bolt-webcam
  tool: null
- n: '5'
  text: Check the stack against the clamp. With the head in its bore the cap hangs
    about 11 mm below the ledge plane and the bolt head's underside ends up about
    13 mm below it; the cap is 28 mm across while the slot is 39 mm wide at that level,
    leaving about 5.5 mm for a lip to travel inward before it meets the cap. Clamp
    a tongue and confirm there is that much room, and about 13 mm of clear space below
    the jaws. If it fouls, reduce cap_bore_depth to 5.2 and cap_bore_af by 0.4, or
    thin the cap, and re-check.
  parts:
  - cap
  - jaw-coupon
  hardware:
  - bolt-webcam
  tool: ruler or calipers
- n: '6'
  text: 'Before printing the plate, hold the coupon card up to the clamp: the card
    is 58 mm wide, the same as the finished plate''s length, so it shows whether plate_len
    fouls the clamp body or the knob. Edit plate_len if needed, then print the plate
    and the cap.'
  parts:
  - plate
  - jaw-coupon
  hardware: []
  tool: null
- n: '7'
  text: Push the bolt's head into the cap's bore, head first, bore mouth facing you,
    until the head is fully home against the bore floor. The thread comes out through
    the 7.6 mm hole in the cap's ceiling and should stand about 4.5 mm clear above
    that ceiling face. If the head will not enter, open cap_bore_af by 0.4 mm and
    reprint the cap - it is a three-minute print.
  parts:
  - cap
  hardware:
  - bolt-webcam
  tool: fingers
- n: '8'
  text: 'Screw the bolt up into the camera''s 1/4-20 socket by hand and count the
    turns: you should get at least four. Wipe a little grease or machine oil on the
    thread - the steel must do all the turning and all of the holding, the printed
    bore only locates the head. If the bolt bottoms out before four turns, or the
    socket sits in a deep recess, stop: this bolt is too short for this camera and
    you need a longer 1/4-20 stud.'
  parts:
  - cap
  hardware:
  - bolt-webcam
  tool: null
- n: '9'
  text: Feed the bolt's thread up through the plate's 7.6 mm centre hole from the
    shank side and seat the cap's flat ceiling face on the 23 mm pad at the ledge
    plane. The head is now trapped between the cap's ceiling and that pad, so tightening
    the bolt clamps the plate up against the camera's base.
  parts:
  - plate
  - cap
  hardware:
  - bolt-webcam
  tool: null
- n: '10'
  text: With the knob open, drop the plate's shank into the jaws, wedge end down,
    so the ledge rests on the lips and the camera sits flat on the plate. Tighten
    the knob hard. Then turn the cap by hand (or the bolt with a screwdriver, if the
    head is round and spins) just until the camera stops rocking on the plate - do
    not force it past hand tight.
  parts:
  - plate
  - cap
  hardware:
  - bolt-webcam
  tool: fingers, or a screwdriver for the bolt head
- n: '11'
  text: 'Stand the tripod on a bench and test it by hand before anything expensive
    goes on it: grip the camera and try to twist and lift it while your other hand
    holds the clamp. There must be no movement between cap, plate and camera, no cracking
    from the plate, and the ledge must stay seated on the lips. If the plate flexes
    or the ledge rides up, reprint with a larger grip_across and a shallower top_slab_t.'
  parts:
  - plate
  - cap
  hardware: []
  tool: null
- n: '12'
  text: 'Treat this as exactly what it is: a temporary stand-in for the lost plate.
    Light cameras only, hand-tightened only, nothing hung off the camera, never left
    unattended outside. Inspect the cap''s ceiling and the plate''s ledge before every
    use and bin both parts at the first crack, at any play between the bolt head and
    the bore, or if the hole in the ceiling has worn oval. Replace it properly with
    a real 1/4-20 quick-release plate when you can.'
  parts:
  - plate
  - cap
  hardware:
  - bolt-webcam
  tool: null
- n: '13'
  text: When storing it in the tripod bag, leave the bolt threaded a few turns into
    the camera, or tape it to the plate - the one metal part in this design is the
    part most likely to get lost next time.
  parts:
  - plate
  - cap
  hardware:
  - bolt-webcam
  tool: null
