parts:
- id: knob
  role: final
  material: High-speed PLA, black
  code: "def build(p):\n    from math import sqrt, cos, sin, tau\n    h = p.floor_t\
    \ + p.nut_h + p.recess\n    body = cq.Workplane('XY').circle(p.knob_od / 2).extrude(h)\n\
    \    for k in range(p.flute_count):\n        a = tau * k / p.flute_count\n   \
    \     xy = (p.flute_center_r * cos(a), p.flute_center_r * sin(a))\n        flute\
    \ = cq.Workplane('XY').pushPoints([xy]).circle(p.flute_r).extrude(h)\n       \
    \ body = body.cut(flute)\n    pitch_d = 2 * p.pocket_af / sqrt(3)\n    entry_d\
    \ = 2 * p.entry_af / sqrt(3)\n    pocket = (cq.Workplane('XY').workplane(offset=p.floor_t)\n\
    \              .polygon(6, pitch_d)\n              .workplane(offset=h-p.floor_t-p.lead_h).polygon(6,\
    \ pitch_d)\n              .workplane(offset=p.lead_h).polygon(6, entry_d)\n  \
    \            .loft(ruled=True))\n    bore = cq.Workplane('XY').circle(p.pass_d\
    \ / 2).extrude(h)\n    return body.cut(pocket).cut(bore)"
  print_orientation: Flat small-hole face on bed at z=0, hex pocket facing up. Print
    at 0.2 mm layers with no supports and the same fit-related slicer settings as
    coupon D.
  use_orientation: Orient the small-hole face toward the incoming bolt and the recessed
    nut face outward so the bolt tip can emerge there. Turn the fluted rim by hand.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: press-fit
  part: knob
  feature: Hex pocket with lead-in
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - pocket_af
  - nut_af
  - entry_af
  - lead_h
  check:
    method: coupon
    ref: D-565
    description: Coupon D retained the actual nut. On the finished knob verify full
      finger seating and no fallout on inversion and a light finger tap.
- id: recess
  part: knob
  feature: Recessed hex pocket and stop shoulder
  relation: contains
  hardware: nut
  clearance_mm: 0.4
  params:
  - floor_t
  - recess
  - nut_h
  - pass_d
  - nut_af
  check:
    method: measure
    ref: null
    description: With the nut seated on the shoulder, check that its exposed face
      lies below the rim (nominally 0.4 mm). The 3.5 mm bore leaves a continuous shoulder
      under the nut and is too small for it to pass.
- id: bolt-pass
  part: knob
  feature: Axial through-hole
  relation: clears
  hardware: null
  clearance_mm: 0.5
  params:
  - pass_d
  - bolt_d
  check:
    method: none
    ref: null
    description: 0.5 mm nominal diametral clearance. Before installing the nut, confirm
      the mating bolt slides freely through the printed bore.
manual:
- n: '1'
  text: Print the knob flat with the small bolt hole down and the hex pocket up. Use
    the same PLA and slicer settings as coupon D, 0.2 mm layers, and no supports.
    Before fitting the nut, check that your M3 bolt slides through the small hole.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align the nut flats with the pocket. Press the nut straight in with your thumb
    until it meets the shoulder and its top is below the rim. Do not hammer it or
    use glue. Turn the knob upside down and give it a light finger tap to verify the
    nut stays in.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Offer the small-hole face to your M3 bolt. Turn the knob by hand to engage
    the nut. With enough threaded length, the bolt tip will emerge from the recessed
    face. Tighten by hand only.
  parts:
  - knob
  hardware:
  - nut
  tool: null
