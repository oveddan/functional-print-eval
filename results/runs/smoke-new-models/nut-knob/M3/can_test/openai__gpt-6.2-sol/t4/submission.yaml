task: nut-knob/M3
note: One-piece, 20 mm fluted PLA hand knob. The 5.65 mm hex pocket matches coupon
  D, which retained the actual nut. The nut is recessed 0.4 mm nominally, and a solid
  shoulder stops it from passing through while leaving a 3.5 mm through-hole for the
  M3 bolt.
questions: []
params:
  knob_od:
    value: 20
    unit: mm
    kind: design
    source: design
    note: Nominal maximum diameter; user requested about 20 mm.
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
