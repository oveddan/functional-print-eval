task: nut-knob/M3
note: One-piece, approximately 20 mm six-scallop knob with a recessed M3 hex nut and
  an open through-bore. Three small crush ribs retain the nut when inverted; the solid
  shoulder stops it from passing through the opposite face. The fit-strip trial was
  inconclusive, so the retention fit is not yet verified on this printer.
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 nominal width across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 nominal thickness
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
