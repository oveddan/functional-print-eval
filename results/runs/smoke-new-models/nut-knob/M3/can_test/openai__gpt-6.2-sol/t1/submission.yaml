parts:
- id: knob
  role: final
  material: Black high-speed PLA
  code: "from math import sin, cos, pi, sqrt\n\ndef profile(af, tip, w):\n    a =\
    \ af/2\n    pts = []\n    for i in range(6):\n        th = i*pi/3\n        nx,ny\
    \ = cos(th),sin(th)\n        tx,ty = -ny,nx\n        pts.append((a*nx-a/sqrt(3)*tx,a*ny-a/sqrt(3)*ty))\n\
    \        if i%2==0 and w>0:\n            pts.extend([(a*nx-w/2*tx,a*ny-w/2*ty),(tip/2*nx,tip/2*ny),(a*nx+w/2*tx,a*ny+w/2*ty)])\n\
    \    return pts\n\ndef build(p):\n    h = p.base+p.nut_h+p.recess\n    af = p.nut_af+p.pocket_extra\n\
    \    s = cq.Workplane('XY').circle(p.outer_d/2).extrude(h)\n    for i in range(int(p.scallop_count)):\n\
    \        th = 2*pi*i/p.scallop_count\n        x,y = p.scallop_center_r*cos(th),p.scallop_center_r*sin(th)\n\
    \        s = s.cut(cq.Workplane('XY').center(x,y).circle(p.scallop_r).extrude(h))\n\
    \    hole = cq.Workplane('XY').circle((p.bolt_d+p.bore_extra)/2).extrude(h)\n\
    \    pocket = cq.Workplane('XY',origin=(0,0,p.base)).polyline(profile(af,p.rib_tip_af,p.rib_width)).close().extrude(h-p.base)\n\
    \    lead = cq.Workplane('XY',origin=(0,0,h-p.lead_depth)).polyline(profile(p.rib_tip_af-p.lead_overlap,0,0)).close().workplane(offset=p.lead_depth).polyline(profile(af+p.mouth_extra,0,0)).close().loft()\n\
    \    return s.cut(hole).cut(pocket).cut(lead)"
  print_orientation: Flat underside at z=0; hex pocket faces up. Print at 0.2 mm with
    no supports.
  use_orientation: Turn the scalloped edge by hand. For clamping onto a protruding
    bolt, place the flat bearing face against the work and leave the recessed nut
    face outward.
hardware:
- id: m3-nut
  ref: ISO 4032 M3
  qty: 1
- id: check-bolt
  ref: ISO 4762 M3x16
  qty: 1
joints: []
criteria:
- id: retention
  part: knob
  feature: Top-loading hex pocket and three crush ribs
  relation: engages
  hardware: m3-nut
  clearance_mm: null
  params:
  - nut_af
  - pocket_extra
  - rib_tip_af
  - rib_width
  - lead_depth
  check:
    method: measure
    ref: null
    description: Nut seats with firm thumb pressure. It does not drop out when the
      knob is inverted and lightly tapped, and does not rotate during finger tightening.
- id: recess-and-stop
  part: knob
  feature: Recess and solid annular stop shoulder
  relation: contains
  hardware: m3-nut
  clearance_mm: null
  params:
  - base
  - nut_h
  - recess
  - bore_extra
  check:
    method: measure
    ref: null
    description: When seated flush against the floor, the nut is entirely below the
      outer face and cannot pass through the smaller 3.5 mm opening on the far side.
- id: bolt-passage
  part: knob
  feature: Coaxial clearance bore and open nut thread
  relation: clears
  hardware: check-bolt
  clearance_mm: 0.5
  params:
  - bolt_d
  - bore_extra
  check:
    method: measure
    ref: null
    description: Before seating the nut, verify the M3 shank slides through the bore.
      After seating, hand-thread it until the tip emerges from the opposite face.
manual:
- n: '1'
  text: Print the knob flat side down in PLA at 0.2 mm layers without supports. Clear
    any loose strands and check that the M3 bolt slips through the round opening before
    installing the nut.
  parts:
  - knob
  hardware:
  - check-bolt
  tool: null
- n: '2'
  text: Set the knob flat side down on a table. Line up the nut flats with the hex
    pocket. Press the nut in squarely with your thumb until it rests on the bottom
    shoulder. It should sit below the opening. Do not hammer it or add glue.
  parts:
  - knob
  hardware:
  - m3-nut
  tool: null
- n: '3'
  text: Turn the knob upside down over the table and tap it lightly. The nut must
    stay in place. Hand-thread an M3 bolt until its tip emerges from the opposite
    side. If the nut will not seat by hand or falls out, adjust rib_tip_af upward
    for a looser fit or downward for a tighter fit and reprint.
  parts:
  - knob
  hardware:
  - m3-nut
  - check-bolt
  tool: null
- n: '4'
  text: Use the scallops to tighten by hand. When threading the knob onto a bolt already
    protruding from the work, start from the flat underside so that the printed shoulder
    carries the clamp load. The M3×16 screw is a check bolt; use a bolt long enough
    for your actual workpiece.
  parts:
  - knob
  hardware: []
  tool: null
