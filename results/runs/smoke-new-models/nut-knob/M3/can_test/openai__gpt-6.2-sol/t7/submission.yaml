task: nut-knob/M3
note: One-piece, 20 mm fluted hand knob. The 5.70 mm hex pocket was selected because
  the actual nut pressed in snugly and stayed in when the test print was inverted
  and shaken. A solid shoulder stops the nut from passing through the knob; the central
  bore remains open for the M3 bolt.
