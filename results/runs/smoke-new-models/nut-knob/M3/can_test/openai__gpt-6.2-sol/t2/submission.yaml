task: nut-knob/M3
note: One-piece, 20 mm scalloped M3 hand knob. The 5.65 mm hex pocket is the fit that
  held in the PLA test. A recessed shoulder stops the nut, and a 3.5 mm through-bore
  lets the bolt pass through.
