  - knob_h
  - bore_d
  - nut_af
  check:
    method: measure
    ref: null
    description: The seated nut should rest flat on the shoulder and must not pass
      through the 3.5 mm bore.
- id: bolt-pass
  part: m3-knob
  feature: Coaxial through-bore
  relation: clears
  hardware: null
  clearance_mm: 0.5
  params:
  - bore_d
  - bolt_d
  check:
    method: measure
    ref: null
    description: Thread the intended M3 bolt through the nut and verify that the shank
      passes freely through the PLA bore and emerges from the opposite face if long
      enough.
manual:
- n: '1'
  text: Print flat with the hex pocket up at 0.2 mm layers in high-speed PLA, with
    no supports. Use the same slicer settings as the fit coupon.
  parts:
  - m3-knob
  hardware: []
  tool: null
- n: '2'
  text: With the knob on a flat surface, align the nut flats with the hex pocket and
    thumb-press it squarely down until it bottoms on the shoulder. Its top should
    sit about 0.4 mm below the face. Do not use glue or hammer it in.
  parts:
  - m3-knob
  hardware:
  - m3-nut
  tool: null
- n: '3'
  text: Turn the knob upside down over your palm and tap it lightly. The nut should
    stay put. Thread the M3 bolt through by hand and check that it passes through
    the knob without rubbing or binding.
  parts:
  - m3-knob
  hardware:
  - m3-nut
  tool: null
- n: '4'
  text: When tightening onto a protruding bolt, face the small-hole side toward the
    work and turn the knob by hand. Use finger torque only.
  parts:
  - m3-knob
  hardware:
  - m3-nut
  tool: null
