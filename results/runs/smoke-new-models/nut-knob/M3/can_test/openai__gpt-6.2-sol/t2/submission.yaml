parts:
- id: m3-knob
  role: final
  material: Black high-speed PLA
  code: "import math\n\ndef build(p):\n    h = p.knob_h\n    shoulder_z = h - p.pocket_depth\n\
    \    lead_z = h - p.lead_height\n    hex_d = 2*p.pocket_af/math.sqrt(3)\n    mouth_d\
    \ = 2*(p.pocket_af+p.mouth_extra_af)/math.sqrt(3)\n    knob = cq.Workplane('XY').circle(p.knob_d/2).extrude(h)\n\
    \    for i in range(int(p.scallop_count)):\n        a = 2*math.pi*(i+0.5)/p.scallop_count\n\
    \        x = p.scallop_center_radius*math.cos(a)\n        y = p.scallop_center_radius*math.sin(a)\n\
    \        knob = knob.cut(cq.Workplane('XY').center(x,y).circle(p.scallop_radius).extrude(h))\n\
    \    bore = cq.Workplane('XY').circle(p.bore_d/2).extrude(h)\n    hex_pocket =\
    \ cq.Workplane('XY').workplane(offset=shoulder_z).polygon(6,hex_d).extrude(lead_z-shoulder_z)\n\
    \    lead = cq.Workplane('XY').workplane(offset=lead_z).polygon(6,hex_d).workplane(offset=p.lead_height).polygon(6,mouth_d).loft(combine=False,ruled=True)\n\
    \    return knob.cut(bore).cut(hex_pocket.union(lead))"
  print_orientation: Flat face with the small through-hole on the bed at z=0, nut
    pocket facing up. No supports.
  use_orientation: Press the nut into the hex-pocket face. When using the knob as
    a nut on a projecting bolt, place the flat, small-hole face toward the work so
    tightening pulls the nut onto its shoulder.
hardware:
- id: m3-nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: nut-recess
  part: m3-knob
  feature: Hex pocket and entry lead-in
  relation: contains
  hardware: m3-nut
  clearance_mm: null
