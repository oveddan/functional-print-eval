task: nut-knob/M3
note: One-piece, 20 mm fluted knob with a recessed press-fit M3 nut, a solid seating
  shoulder, and a through-bore. The fit strip did not give a confirmed result; the
  selected rib fit is a design estimate and should be checked with the actual nut
  before use.
