  - nut_h
  - recess
  check:
    method: measure
    ref: null
    description: Verify the nut is flat on the shoulder and its top is below the rim.
- id: nut-stop
  part: thumb-knob
  feature: Shoulder around the through-bore
  relation: supports
  hardware: hex-nut
  clearance_mm: null
