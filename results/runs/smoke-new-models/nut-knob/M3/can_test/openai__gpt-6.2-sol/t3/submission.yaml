  - nut_af
  - height
  - nut_h
  - recess
  - bolt_major_d
  - bore_extra
  check:
    method: measure
    ref: null
    description: The nut bears on the 4 mm thick floor; it cannot pass through the
      3.5 mm bore.
- id: bolt-pass
  part: thumb-knob
  feature: Coaxial full-length passage through bore and nut
  relation: clears
  hardware: null
  clearance_mm: 0.5
  params:
  - bolt_major_d
  - bore_extra
  check:
    method: measure
    ref: null
    description: Before assembly, slide the M3 bolt through the empty knob. After
      seating the nut, thread the bolt by hand from the flat side and check that the
      tip can emerge past the nut.
manual:
- n: '1'
  text: Print the knob flat-side down in PLA at 0.2 mm layers, with no supports. Let
    it cool. Make sure the through-hole and pocket have no loose strings.
  parts:
  - thumb-knob
  hardware: []
  tool: null
- n: '2'
  text: With the pocket facing up, align the nut flats with the pocket and press the
    nut straight down with your thumb until it seats below the rim. Do not hammer
    it or use the bolt to force it in.
  parts:
  - thumb-knob
  hardware:
  - hex-nut
  tool: null
- n: '3'
  text: Invert the knob over a tray and gently shake it. If the nut drops out, reprint
    with rib_undersize = 0.32 mm. If the nut cannot be seated with firm thumb pressure,
    reprint with rib_undersize = 0.04 mm. Retest the fit; do not use glue.
  parts:
  - thumb-knob
  hardware:
  - hex-nut
  tool: null
- n: '4'
  text: Put the flat side toward the work and start the M3 bolt through that side
    by hand. Check that the bolt threads smoothly through the nut and that a sufficiently
    long bolt can emerge from the pocket side. Tighten by hand only.
  parts:
  - thumb-knob
  hardware:
  - hex-nut
  tool: null
