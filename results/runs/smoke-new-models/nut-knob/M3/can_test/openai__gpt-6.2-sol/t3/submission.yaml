task: nut-knob/M3
note: One-piece, 20 mm six-lobe thumb nut. Three shallow ribs retain the recessed
  M3 nut when inverted; the solid shoulder is the load-bearing stop. The fit strip
  did not yield a confirmed result, so the middle rib setting is the nominal starting
  point, not a verified fit. Check with the actual nut before use.
