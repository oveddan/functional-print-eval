parts:
- id: thumb-knob
  role: final
  material: Black high-speed PLA
  code: "import math\n\ndef build(p):\n    b = cq.Workplane('XY').circle(p.core_r).extrude(p.height)\n\
    \    for i in range(6):\n        ang = i*math.pi/3\n        r = p.grip_d/2-p.lobe_r\n\
    \        x,y = r*math.cos(ang),r*math.sin(ang)\n        b = b.union(cq.Workplane('XY').center(x,y).circle(p.lobe_r).extrude(p.height))\n\
    \n    floor = p.height-p.nut_h-p.recess\n    a = (p.nut_af+p.hex_extra)/2\n  \
    \  def profile(z, ap, rib):\n        pts=[]\n        s=ap/math.sqrt(3)\n     \
    \   for i in range(6):\n            t=i*math.pi/3\n            c,d=math.cos(t),math.sin(t)\n\
    \            local=[(ap,-s)]\n            if i%2==0:\n                local +=\
    \ [(ap,-p.rib_width/2),(ap-rib,0),(ap,p.rib_width/2)]\n            for u,v in\
    \ local:\n                pts.append((u*c-v*d,u*d+v*c))\n        return cq.Workplane('XY').workplane(offset=z).polyline(pts).close().val()\n\
    \    rib=(p.hex_extra+p.rib_undersize)/2\n    pocket=cq.Solid.makeLoft([\n   \
    \     profile(floor,a,rib),\n        profile(p.height-p.lead_h,a,rib),\n     \
    \   profile(p.height+0.02,a+p.lead_extra/2,0.02)\n    ], True)\n    radius=(p.bolt_major_d+p.bore_extra)/2\n\
    \    bore=cq.Solid.makeCylinder(radius,p.height+0.2,cq.Vector(0,0,-0.1))\n   \
    \ return b.cut(pocket).cut(bore)"
  print_orientation: Place the full flat bearing face at z = 0 on the bed. Hex pocket
    faces straight up; no supports.
  use_orientation: The flat face bears against the work. The M3 bolt enters the flat
    face, engages the nut, and can extend out of the recessed hex side.
