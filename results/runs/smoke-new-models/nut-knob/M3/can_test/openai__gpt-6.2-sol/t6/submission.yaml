task: nut-knob/M3
note: One-piece 20 mm six-scallop thumb knob. The final geometry matches the 5.65
  mm coupon, which held the test nut. The 3.2 mm-deep socket recesses the nominal
  2.4 mm nut by 0.8 mm. A solid shoulder around the 3.6 mm through-bore prevents the
  nut from passing through the far side.
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal ISO 4032 M3 width across flats; actual width could not be measured.
  nut_height:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  test_bolt_length:
    value: 12
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  knob_od:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
  height:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: ''
  floor:
    value: 2.4
    unit: mm
    kind: design
    source: design
    note: Axial thickness of the shoulder below the nut.
  bore:
    value: 3.6
    unit: mm
