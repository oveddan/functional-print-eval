parts:
- id: knob
  role: final
  material: Black high-speed PLA
  code: "import math\n\ndef build(p):\n    def hexpts(af):\n        r = af / math.sqrt(3)\n\
    \        return [(r * math.cos(i * math.pi / 3), r * math.sin(i * math.pi / 3))\
    \ for i in range(6)]\n\n    h = p.knob_h\n    body = cq.Workplane('XY').circle(p.knob_od\
    \ / 2).extrude(h)\n    centers = [(p.flute_center_r * math.cos(2 * math.pi * i\
    \ / p.flute_count), p.flute_center_r * math.sin(2 * math.pi * i / p.flute_count))\
    \ for i in range(p.flute_count)]\n    flutes = cq.Workplane('XY').pushPoints(centers).circle(p.flute_radius).extrude(h)\n\
    \    bore = cq.Workplane('XY').circle(p.bolt_clear_d / 2).extrude(h)\n    pocket\
    \ = (cq.Workplane('XY').workplane(offset=h-p.pocket_depth)\n              .polyline(hexpts(p.pocket_af)).close().extrude(p.pocket_depth-p.entry_height))\n\
    \    lead = (cq.Workplane('XY').workplane(offset=h-p.entry_height)\n         \
    \   .polyline(hexpts(p.pocket_af)).close().workplane(offset=p.entry_height)\n\
    \            .polyline(hexpts(p.mouth_af)).close().loft(ruled=True))\n    return\
    \ body.cut(flutes).cut(bore).cut(pocket).cut(lead)"
  print_orientation: Flat face with only the round bore on the bed at z=0; hex pocket
    faces up. Print as modeled without supports.
  use_orientation: Normally put the flat round-hole face against the work and the
    recessed nut face outward, so tightening pulls the nut into the pocket floor.
    The bolt tip emerges at the recessed face.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
- id: test-bolt
  ref: ISO 4762 M3x12
  qty: 1
joints: []
criteria:
- id: hand-fit
  part: knob
  feature: Straight hex pocket with flared lead-in
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - pocket_af
  - mouth_af
  - entry_height
  - nut_af
  check:
    method: coupon
    ref: E
    description: Coupon E accepted the nut with hand pushing and retained it when
      inverted and shaken. Repeat on the finished print before use.
- id: nut-recess
  part: knob
  feature: Nut seat 3 mm below the pocket rim
  relation: contains
  hardware: nut
  clearance_mm: 0.6
  params:
  - pocket_depth
  - nut_h
  check:
    method: measure
    ref: null
    description: With the nut resting flat on the pocket floor, confirm that its entire
      top face is below the rim.
- id: nut-stop
  part: knob
  feature: Solid pocket floor around the central bore
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - bolt_clear_d
  - nut_af
  - knob_h
  - pocket_depth
  check:
    method: measure
    ref: null
    description: Confirm the floor is intact and the seated nut stops against it without
      passing into the round bore.
- id: bolt-through
  part: knob
  feature: Coaxial round through-bore
  relation: clears
  hardware: test-bolt
  clearance_mm: 0.25
  params:
  - bolt_clear_d
  - bolt_d
  - knob_h
  - test_bolt_length
  check:
    method: measure
    ref: null
    description: Nominal radial clearance is 0.25 mm. Finger-thread the test bolt
      from the flat face until the tip emerges past the recessed face.
manual:
- n: '1'
  text: Print one knob flat-side down at 100% scale, using the same PLA profile as
    coupon E, a 0.4 mm nozzle and 0.2 mm layers. Leave supports off. Let it cool before
    removing it.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Set the knob hex-side up on a flat surface. Align the nut flats with the pocket
    and press squarely with your thumb until it rests flat on the floor, entirely
    below the rim. Do not hammer it or draw it in with a screw. If it cannot be fully
    seated by hand, check for stray filament and confirm the print matches coupon
    E.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Turn the knob pocket-side down over a tray and shake it lightly. The nut must
    stay in without the bolt fitted. If it drops out, do not use that print.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Insert the test bolt through the flat face and turn the knob by hand until
    the bolt tip emerges past the hex-pocket face. In use, keep the flat face against
    the work and choose an M3 bolt with enough exposed thread to pass through the
    knob after accounting for the workpiece thickness. Tighten by hand only.
  parts:
  - knob
  hardware:
  - nut
  - test-bolt
  tool: null
