task: nut-knob/M3
note: 'One-piece Ø20 × 8 mm fluted PLA hand knob. The 5.70 mm hex pocket reproduces
  coupon E: the nut pressed in snugly and stayed in during an upside-down shake. The
  pocket floor stops the nut from passing through; only the M3 bolt passes through
  the smaller bore. A fully seated nominal nut is 0.6 mm below the rim. No supports,
  glue, or installation tool needed.'
