parts:
- id: knob
  role: final
  material: Black high-speed PLA
  code: "from math import pi, cos, sin\n\ndef build(p):\n    h = p.knob_height\n \
    \   z = h - p.pocket_depth\n    a = (p.nut_af + p.pocket_extra_af)/2\n    r =\
    \ a/cos(pi/6)\n    bore_d = p.bolt_nominal_d + p.bolt_pass_extra_d\n    hexpts\
    \ = [(r*cos(pi/6+i*pi/3), r*sin(pi/6+i*pi/3)) for i in range(6)]\n    body = cq.Workplane('XY').circle(p.knob_d/2).extrude(h)\n\
    \    grippts = [(p.scallop_center_r*cos(2*pi*i/int(p.scallop_count)), p.scallop_center_r*sin(2*pi*i/int(p.scallop_count)))\
    \ for i in range(int(p.scallop_count))]\n    body = body.cut(cq.Workplane('XY').pushPoints(grippts).circle(p.scallop_r).extrude(h))\n\
    \    body = body.cut(cq.Workplane('XY').workplane(offset=z).polyline(hexpts).close().extrude(p.pocket_depth))\n\
    \    tip = p.rib_effective_af/2\n    root = a + p.rib_root_overlap\n    rib =\
    \ cq.Workplane('XZ').polyline([(tip,z),(root,z),(root,z+p.rib_ramp_end),(a,z+p.rib_ramp_end),(tip,z+p.rib_straight_h)]).close().extrude(p.rib_width/2,both=True)\n\
    \    for angle in (0,120,240):\n        body = body.union(rib.rotate((0,0,0),(0,0,1),angle))\n\
    \    return body.cut(cq.Workplane('XY').circle(bore_d/2).extrude(h))"
  print_orientation: Flat bearing face at z=0 on the bed; hex recess opens up. No
    supports.
  use_orientation: Flat bearing face toward the work; hex recess away from the work.
    The bolt enters from the bearing face and can protrude through the nut into and
    past the recess.
