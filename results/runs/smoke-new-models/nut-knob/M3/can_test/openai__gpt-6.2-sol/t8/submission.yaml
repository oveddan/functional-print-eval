task: nut-knob/M3
note: One-piece Ø20 × 8 mm scalloped PLA knob. Three tapered ribs grip the nut, the
  hex flats resist rotation, and a 4.8 mm thick floor stops the nut while leaving
  a through-bore for the bolt. The nominal nut face is recessed 0.8 mm. The fit test
  did not yield a usable result; the selected 5.40 mm rib setting is unverified. The
  M3×12 screw is a fit-check example, not a required bolt length.
