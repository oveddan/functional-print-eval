  qty: 1
joints: []
criteria:
- id: nut_recessed
  part: knob
  feature: Hex pocket and annular floor
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_height
  - pocket_depth
  - nut_af
  - pocket_extra_af
  check:
    method: measure
    ref: null
    description: Seat the nut flat on the floor and lay a straightedge across the
      top; the entire nut must be below it. Verify the floor extends under the nut
      all around the bore.
- id: inversion
  part: knob
  feature: Three tapered retention ribs
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - rib_effective_af
  - rib_width
  - rib_straight_h
  - rib_ramp_end
  check:
    method: measure
    ref: null
    description: The nut must seat with thumb pressure, then stay in when inverted
      and lightly tapped with no bolt installed.
- id: bolt_exit
  part: knob
  feature: Axial through-bore
  relation: clears
  hardware: test_bolt
  clearance_mm: 0.25
  params:
  - bolt_nominal_d
  - bolt_pass_extra_d
  - knob_height
  check:
    method: measure
    ref: null
    description: Radial clearance stated for the unthreaded printed bore only. Spin
      an M3 screw in from the flat side by hand; it must engage the nut and emerge
      from the open side without binding on the PLA.
manual:
- n: '1'
  text: Print knob flat-side down with the recess facing up, using 0.2 mm layers and
    no supports. Let it cool before removing it. Clear any loose strands or burrs
    from the bore and recess without trimming the ribs.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Set knob flat-side down on a firm surface. Line up the nut flats with the
    hex recess and press the nut straight in with your thumb until it sits flat on
    the floor, below the rim. Do not hammer it in or use the bolt to pull it in.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Before installing a bolt, turn knob recess-down over the bench and give it
    a few light taps. The nut must stay seated. If it falls out, reduce rib_effective_af
    by 0.10 mm and reprint; if it cannot be seated by thumb pressure, increase rib_effective_af
    by 0.10 mm and reprint.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Start your M3 bolt from the flat side and turn knob by hand. An M3×12 screw
    can be used to verify through travel on the bench; for use, choose a bolt that
    leaves more than 8 mm projecting from the work if you want it to emerge beyond
    the knob. Hand-tighten only.
  parts:
  - knob
  hardware:
  - nut
  - test_bolt
  tool: null
