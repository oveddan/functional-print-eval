manual:
- n: '1'
  text: Check the original track and roller by sight before installing anything. Proceed
    only if this is a non-load-bearing guide on a flat running surface, it does not
    rely on a groove or flange to keep the door on track, and the bracket is a single-sided
    through-bolt type. If you can't confirm those conditions, don't install this prototype.
    Support the door before removing any hardware.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print the wheel and three spacers with the same printer settings as the successful
    fit coupon. Let the parts cool. Inspect both bearing shoulders and remove only
    stray strings and burrs; don't enlarge a snug pocket. Stop if the shoulder is
    distorted, the part is cracked, or a bearing rocks in the pocket.
  parts:
  - wheel
  - inner-spacer
  - head-spacer
  - bracket-spacer
  hardware:
  - bearings
  tool: null
- n: '3'
  text: Dry-fit the spacers on the smooth axle and against the bearings. Each spacer
    must touch only the inner ring, not the shield or outer ring. With a washer backed
    against the head spacer, turn the bearing outer ring to confirm no rubbing. Confirm
    that the actual bolt slides by hand through both bearings and the bracket. In
    the shown stack the far bearing ends 19.2 mm from under the head, so both bearings
    must sit on smooth shank through at least that point, with no thread runout in
    either bore. The M8×50 is a candidate; use your own M8 bolt only if it also passes
    these checks and the final thread and clearance checks.
  parts:
  - inner-spacer
  - head-spacer
  - bracket-spacer
  hardware:
  - bearings
  - axle
  - washers
  tool: Calipers or ruler
- n: '4'
  text: Seat one bearing squarely by pressing on its outer ring only. Put the center
    spacer into the wheel, align it on the axle, then seat the second bearing by its
    outer ring. The bearings should sit flush and turn smoothly. Do not hammer the
    bearings, press on the shields, or use the axle nut to force them into their seats.
  parts:
  - wheel
  - inner-spacer
  hardware:
  - bearings
  - axle
  tool: null
- n: '5'
  text: 'Assemble from head to tip: washer → head spacer → wheel with both bearings
    and center spacer → bracket spacer → fixed bracket → washer → locknut. Snug only
    enough to remove axial play; do not crush the PLA spacers. Confirm the nut clamps
    the stack without bottoming on the smooth shoulder and at least two full threads
    are visible beyond the nylon. Check that the protruding tip clears the door and
    track. The wheel must spin as freely after snugging as before, without wobble
    or rubbing. If it binds, don''t leave the nut loose as a workaround; take it apart
    and correct the fit or use a replacement roller.'
  parts:
  - wheel
  - inner-spacer
  - head-spacer
  - bracket-spacer
  hardware:
  - axle
  - bearings
  - washers
  - locknut
  tool: Hex key and wrench
- n: '6'
  text: With the door supported, move it slowly through its full travel. Stop if the
    wheel climbs the track, rubs, or changes door alignment. Recheck for loose bearings,
    cracked PLA, spacer creep, or axle play after the first few passes and periodically
    thereafter. Replace the prototype if any appear.
  parts:
  - wheel
  - inner-spacer
  - head-spacer
  - bracket-spacer
  hardware:
  - bearings
  - axle
  - locknut
  tool: null
