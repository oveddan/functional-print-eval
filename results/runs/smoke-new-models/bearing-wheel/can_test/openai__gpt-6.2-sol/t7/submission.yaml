parts:
- id: wheel
  role: final
  material: High-speed PLA
  code: "def build(p):\n    h=2*p.bearing_width+p.web_t\n    r=p.seat_d/2\n    def\
    \ cylinder(d,z,l):\n        return cq.Workplane('XY').workplane(offset=z).circle(d/2).extrude(l)\n\
    \    wheel=cylinder(p.wheel_od,0,h)\n    wheel=wheel.cut(cylinder(p.web_opening,-1,h+2))\n\
    \    wheel=wheel.cut(cylinder(p.seat_d,-1,p.bearing_width+1))\n    wheel=wheel.cut(cylinder(p.seat_d,p.bearing_width+p.web_t,p.bearing_width+1))\n\
    \    wheel=wheel.cut(cq.Solid.makeCone(r+p.lead_radial,r,p.lead_depth,cq.Vector(0,0,0)))\n\
    \    return wheel.cut(cq.Solid.makeCone(r,r+p.lead_radial,p.lead_depth,cq.Vector(0,0,h-p.lead_depth)))"
  print_orientation: Lower annular face at z=0, bearing axis vertical. Print without
    supports at 0.2 mm, with six walls and 100% infill. The internal shoulder steps
    inward only 1.55 mm radially; inspect the lower shoulder after printing.
  use_orientation: Axle through both bearing bores. Flat OD runs on the flat track.
    Bearing pockets face away from one another.
- id: inner-spacer
  role: final
  material: High-speed PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_bore/2).extrude(p.web_t)"
  print_orientation: Flat annular face on bed at z=0, no supports, solid.
  use_orientation: Between the two bearing inner races inside the wheel.
- id: head-spacer
  role: final
  material: High-speed PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_bore/2).extrude(p.outboard_t)"
  print_orientation: Flat annular face on bed at z=0, no supports, solid.
  use_orientation: Between the washer under the screw head and the first bearing inner
    race, z pointing toward nut.
- id: bracket-spacer
  role: final
  material: High-speed PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_bore/2).extrude(p.outboard_t)"
  print_orientation: Flat annular face on bed at z=0, no supports, solid.
  use_orientation: Between the second bearing inner race and the fixed bracket.
