task: bearing-wheel
note: Flat-tread 50 × 16 mm prototype using two 608ZZ bearings. The 22.10 mm printed
  seat was snug and held the bearing upside down in the test. This design assumes
  a flat track, a non-load-bearing guide wheel, and a single-sided through-bolt bracket.
  None of those were verified. Do not install it on a top-hung or otherwise weight-bearing
  door, a grooved/flanged track, or an incompatible bracket; use a rated replacement
  roller for a load-bearing door. The 16 mm tread needs 19.2 mm between its stationary
  stop faces with the two spacers installed, plus room for the fastener stack.
