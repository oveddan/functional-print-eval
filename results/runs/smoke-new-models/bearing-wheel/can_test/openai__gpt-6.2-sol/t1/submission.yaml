task: bearing-wheel
note: A support-free, flat-tread prototype, nominally 50 mm OD and 16 mm across the
  installed bearings. The two 608s turn with the wheel on a stationary M8 axle. The
  22.10 mm CAD seat matches the snug 22.09 mm test pocket. Track profile, bracket
  fit, and the existing bolt’s usable length remain unverified. Use only on a compatible,
  captive bottom roller or non-load-bearing guide on a lightweight, non-glass door.
  Do not use for a top-hung, mirrored, glass, or heavy door; use a rated replacement
  assembly instead.
questions: []
params:
  old_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: Approximate.
  old_width:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: Approximate; used as width across installed bearings, excluding spacers
      and hardware.
  track_profile:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: Model assumes a flat tread. Check against intact roller and track before
      use.
  bracket_gap:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: Check assembled width and hardware clearance before mounting.
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 nominal, consistent with the user's approximate measurement.
  bearing_width:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 nominal, consistent with the user's approximate measurement.
