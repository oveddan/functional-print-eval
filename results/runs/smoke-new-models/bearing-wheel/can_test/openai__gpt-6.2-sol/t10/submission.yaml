    ref: fit-gauge
    description: The nominal 22.10 mm coupon fit snugly. Confirm both final pockets
      accept a bearing squarely by hand and neither bearing rocks.
- id: isolated-inner-races
  part: race-sleeve
  feature: three 11 mm OD sleeve faces
  relation: seats
  hardware: bearings
  clearance_mm: null
  params:
  - sleeve_od
  - bearing_bore
  - wheel_width
  - bearing_width
  check:
    method: measure
    ref: null
    description: Check that sleeve ends bear only on the inner races and the installed
      wheel rolls freely after the inner stack is snug.
- id: bracket-fit
  part: wheel
  feature: tread, faces, and 20 mm nominal assembled sleeve-to-sleeve span
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - wheel_width
  - bearing_width
  - axle_d
  - bracket_gap
  check:
    method: measure
    ref: null
    description: Verify the track matches a flat tread, both axle holes accept the
      bolt, and the sleeves reach the ears without spreading or bending them. Verify
      tread and faces clear stationary parts through a full turn.
manual:
- n: '1'
  text: Secure the door before removing the old roller. Compare the old roller and
    track to this design before printing. Use it only for a light bottom-running door
    with a flat running surface, a sound two-ear bracket and intact guides/anti-lift
    retainers. If the original is grooved, flanged, top-hung, or has an axle adjustment
    that this bolt cannot preserve, use a matching replacement roller instead.
  parts:
  - wheel
  hardware: []
  tool: Straightedge or calipers
- n: '2'
  text: 'Print one wheel and three race sleeves in PLA, at 0.2 mm layers, with no
    supports. Use at least five walls and solid infill. Remove any brim or first-layer
    lip that interferes with the bearing entrances or sleeve bores. The sleeves should
    slide over the bolt without forcing. Dry-fit a sleeve against each face of a bearing:
    the sleeve must touch only the inner race, and the outer ring must turn freely.'
  parts:
  - wheel
  - race-sleeve
  hardware:
  - bearings
  - axle
  tool: null
- n: '3'
  text: Press one bearing squarely into the flat-shoulder (print-top) side, using
    thumb pressure on its outer rim. Place one sleeve in the center, then press in
    the second bearing from the tapered side, again on the outer rim. Aim for both
    bearing faces approximately flush. Do not hammer them in or press through the
    inner race; stop if a pocket cracks, the bearing rocks, or a shoulder rubs the
    shield.
  parts:
  - wheel
  - race-sleeve
  hardware:
  - bearings
  tool: null
- n: '4'
  text: 'Dry-fit in this order: bolt head, washer, first bracket ear, outer sleeve,
    wheel assembly with its center sleeve, outer sleeve, second ear, washer, locknut.
    The nominal span across the outer sleeve ends is 20 mm. Do not pull widely spaced
    ears inward or force the wheel into a narrow bracket. The listed 40 mm bolt is
    a candidate, not a confirmed fit: before tightening, make sure the nut can reach
    the washer without bottoming on the unthreaded shank, and that at least two complete
    threads extend past the locknut after assembly. Reuse your bolt only if it meets
    these checks and clears surrounding parts.'
  parts:
  - wheel
  - race-sleeve
  hardware:
  - axle
  - bearings
  - washers
  - locknut
  tool: Hex key and wrench
- n: '5'
  text: 'Snug the bolt to immobilize the inner-race stack without crushing the PLA
    sleeves. With the door still supported, spin and wiggle the wheel: it must turn
    freely without scraping or noticeable side play, and the axle must not move in
    the bracket. If tightening makes it bind, correct the fit; do not run with a loose
    axle. Refit the door with its retainers and slide it slowly by hand through its
    travel. Stop using the print if it deforms, cracks, loosens, rubs or starts climbing
    the track. Recheck after the first few cycles and periodically; PLA can creep
    and wear.'
  parts:
  - wheel
  - race-sleeve
  hardware:
  - axle
  - locknut
  tool: Hex key and wrench
