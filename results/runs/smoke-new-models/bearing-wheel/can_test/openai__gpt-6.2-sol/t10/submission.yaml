task: bearing-wheel
note: Flat-tread, 50 × 16 mm prototype for a light, bottom-running closet door with
  a compatible flat track, a two-ear axle bracket, and intact door retainers. The
  22.10 mm bearing seat is based on the successful snug-fit coupon (reported as 22.09
  mm). The track profile and bracket dimensions were not confirmed. Do not use this
  print for a top-hung door, on a track that requires a groove or flange, or where
  the original axle provides an adjustment this bolt cannot preserve.
questions:
- text: What are the original tread profile and exact roller and track dimensions?
  answer: null
- text: What are the bracket style, clear gap, axle-hole diameter, ear thicknesses,
    and original axle adjustment?
  answer: null
- text: What are the existing bolt's diameter, length under the head, and smooth-shank
    length?
  answer: Approximately 8 mm across the shank; lengths unconfirmed.
