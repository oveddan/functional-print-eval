parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    R = p.wheel_od/2\n    H = p.wheel_width\n    b = p.bearing_width\n\
    \    r = (p.bearing_od+p.seat_allowance)/2\n    a = p.web_opening/2\n    e = p.entry_chamfer\n\
    \    t = p.tread_chamfer\n    z_taper_end = b + r-a\n    assert z_taper_end <\
    \ H-b and 0 < e < b and 0 < a < r < R-t\n    section = [(r+e,0),(R-t,0),(R,t),(R,H-t),(R-t,H),\n\
    \               (r+e,H),(r,H-e),(r,H-b),(a,H-b),\n               (a,z_taper_end),(r,b),(r,e)]\n\
    \    return cq.Workplane('XZ').polyline(section).close().revolve(360,(0,0),(0,1))"
  print_orientation: Axis vertical; face with the tapered internal shoulder at z=0
    on the bed. The taper grows inward at 45 degrees, so no internal supports are
    needed.
  use_orientation: Axle horizontal, along the original axle line. The flat OD rolls
    on a compatible flat track. Bearings enter from opposite faces.
- id: race-sleeve
  role: final
  material: PLA
  code: "def build(p):\n    h = p.wheel_width - 2*p.bearing_width\n    assert h >\
    \ 0\n    return cq.Workplane('XY').circle(p.sleeve_od/2).circle((p.bearing_bore+p.sleeve_clearance)/2).extrude(h)"
  print_orientation: Flat annular face on bed. Print three identical copies; keep
    both faces flat.
  use_orientation: One sleeve goes between the inner races and one outside each bearing.
    All three are coaxial with the axle and must not touch any shield or outer race.
