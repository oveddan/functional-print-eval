task: bearing-wheel
note: '50 × 16 mm flat-tread, split PLA roller with two 608ZZ bearings. This is a
  guide-only design, not a replacement for a load-bearing or anti-derailment roller.
  The track and bracket were not identified: use only after confirming a flat tread,
  a compatible through-bolt bracket, and a light, non-glass door whose weight and
  retention are handled by other hardware. If any of that is uncertain, use the correct
  manufacturer replacement.'
questions:
- text: Does the original roller have a flat tread, and is it only a lateral guide
    on a non-glass door?
  answer: null
- text: What are the bracket hole and thickness, and the existing bolt's usable length?
  answer: Only the approximate 8 mm shank diameter was provided.
