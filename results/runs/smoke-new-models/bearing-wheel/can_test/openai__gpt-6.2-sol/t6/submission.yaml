parts:
- id: wheel-head-half
  role: final
  material: PLA
  code: "def build(p):\n    from math import pi, cos, sin\n    pts=[(p.fixing_r*cos(2*pi*i/p.fixing_count),\
    \ p.fixing_r*sin(2*pi*i/p.fixing_count)) for i in range(p.fixing_count)]\n   \
    \ s=cq.Workplane('XY').circle(p.wheel_od/2).extrude(p.wheel_width/2)\n    s=s.faces('>Z').workplane().hole(p.shoulder_bore)\n\
    \    s=s.faces('>Z').workplane().circle((p.bearing_od+p.seat_allowance)/2).cutBlind(-p.seat_depth)\n\
    \    s=s.faces('>Z').workplane().pushPoints(pts).hole(p.m3_clearance)\n    return\
    \ s.faces('>Z').workplane().pushPoints(pts).circle((p.m3_head_d+p.m3_head_d_allowance)/2).cutBlind(-p.m3_head_recess)"
  print_orientation: Flat mating face at z=0; bearing pocket and counterbores face
    up. No supports.
  use_orientation: Mating face against wheel-nut-half; bearing seat and screw heads
    face outward.
- id: wheel-nut-half
  role: final
  material: PLA
  code: "def build(p):\n    from math import pi, cos, sin, sqrt\n    pts=[(p.fixing_r*cos(2*pi*i/p.fixing_count),\
    \ p.fixing_r*sin(2*pi*i/p.fixing_count)) for i in range(p.fixing_count)]\n   \
    \ s=cq.Workplane('XY').circle(p.wheel_od/2).extrude(p.wheel_width/2)\n    s=s.faces('>Z').workplane().hole(p.shoulder_bore)\n\
    \    s=s.faces('>Z').workplane().circle((p.bearing_od+p.seat_allowance)/2).cutBlind(-p.seat_depth)\n\
    \    s=s.faces('>Z').workplane().pushPoints(pts).hole(p.m3_clearance)\n    d=2*(p.m3_nut_af+p.m3_nut_af_allowance)/sqrt(3)\n\
    \    return s.faces('>Z').workplane().pushPoints(pts).polygon(6,d).cutBlind(-p.m3_nut_recess)"
  print_orientation: Flat mating face at z=0; bearing pocket and hex pockets face
    up. No supports.
  use_orientation: Flip against wheel-head-half. The symmetric three-hole pattern
    aligns; nuts face outward.
- id: center-spacer
  role: final
  material: PLA
  code: "def build(p):\n    t=p.wheel_width-2*p.seat_depth+p.inner_axial_relief\n\
    \    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_id/2).extrude(t)"
  print_orientation: Flat annular face at z=0.
  use_orientation: Between the two bearing inner rings, concentric with the axle.
- id: outer-spacer-head
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_id/2).extrude(p.outer_spacer_t)"
  print_orientation: Flat annular face at z=0.
  use_orientation: Between head-side M8 washer and adjacent bearing inner ring. In
    the joint frame, +Z faces the washer.
- id: outer-spacer-bracket
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_id/2).extrude(p.outer_spacer_t)"
  print_orientation: Flat annular face at z=0.
  use_orientation: Between bracket and adjacent bearing inner ring.
