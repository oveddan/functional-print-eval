manual:
- n: '1'
  text: Confirm the old roller only guides sideways and is not required to carry the
    door or keep it from falling or jumping the track. Do not use this print on a
    mirrored or glass door, a grooved or flanged track, or an unidentified bracket.
    This design assumes a single-sided bracket with an M8 clearance hole, access to
    both sides and 2–6 mm thickness. Brace the door or take it out of service before
    working on it.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print both halves and all three spacers in PLA at 0.2 mm, mating faces and
    spacer faces on the bed. Use no supports, at least five walls on the halves, and
    solid spacers. Remove any first-layer lip so the seam closes flush and the spacer
    faces sit flat. Do not enlarge the pockets by forcing a bearing.
  parts:
  - wheel-head-half
  - wheel-nut-half
  - center-spacer
  - outer-spacer-head
  - outer-spacer-bracket
  hardware: []
  tool: null
- n: '3'
  text: Align the three holes with the halves flat-face to flat-face. Hold the nuts
    in their hex pockets and snug the three screws evenly from the other face. Heads,
    nuts and screw tips must all remain below the side faces. Do not crush the PLA.
  parts:
  - wheel-head-half
  - wheel-nut-half
  hardware:
  - wheel-screws
  - wheel-nuts
  tool: M3 socket hex key
- n: '4'
  text: Seat one bearing squarely by pressing only its outer ring against the pocket
    shoulder. Flip the wheel, drop in the center spacer, and use the loose axle to
    center it while seating the second bearing the same way. Both bearings must seat
    squarely and securely without hammering. Check that the shoulders clear the shields
    and that each spacer touches only an inner ring.
  parts:
  - wheel-head-half
  - wheel-nut-half
  - center-spacer
  hardware:
  - bearings
  - axle
  tool: null
- n: '5'
  text: 'Assemble in this order: bolt head, M8 washer, outer spacer, bearing–center
    spacer–bearing, outer spacer, bracket, M8 washer, M8 locknut. The nominal clamp
    stack before the locknut is 24.2 mm plus bracket thickness. Use the specified
    M8×40 or reuse your bolt only if it slides through both bearings by hand, clamps
    before running out of thread, and leaves at least one full thread past the nylon
    without fouling the door or track. Tighten only enough to remove stack looseness;
    the locknut provides retention.'
  parts:
  - outer-spacer-head
  - wheel-head-half
  - center-spacer
  - wheel-nut-half
  - outer-spacer-bracket
  hardware:
  - axle
  - axle-washers
  - axle-nut
  - bearings
  tool: Hex key and wrench for M8 hardware
- n: '6'
  text: With the door still secured, spin the wheel and check that the tread does
    not rub the bracket, washers or track sides. Move the door slowly over its full
    travel, then recheck the seam and axle for play. Stop using it if it binds, wobbles,
    cracks, deforms or loosens.
  parts: []
  hardware: []
  tool: null
