task: bearing-wheel
note: A 50 × 16 mm flat-tread prototype using two 608ZZ bearings on a stationary M8
  axle. The fit coupon was snug and held the bearing upside down. The original tread,
  bracket geometry, and whether the roller carries the door's weight were not confirmed.
  Use this design only as a light-duty guide after checking the fit. If the roller
  supports the door, the track requires a groove or ridge, or the bracket needs drilling
  to take M8, use the correct replacement roller assembly instead.
questions: []
params:
  old_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: Approximate diameter reported by user; used as prototype tread diameter.
  old_width:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: Approximate tread width reported by user; not a measurement of the available
      axle stack clearance.
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: Approximate and agrees with nominal 608.
  bearing_width:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: Approximate and agrees with nominal 608.
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: Approximate and agrees with nominal 608.
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: Approximate shank diameter of the user's bolt; length and grip still unknown.
  bearing_seat_allowance:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: Diametral CAD allowance. A nominal 22.10 mm test seat printed at 22.09 mm
      and fit snugly.
  shoulder_id:
    value: 20.6
    unit: mm
    kind: design
    source: design
    note: Verify that the seat shoulder touches the outer race only.
  seat_lead:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: 45-degree mouth relief on both bearings; also relieves first-layer squeeze.
  tread_chamfer:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: ''
  spacer_bore_clearance:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: Diametral clearance over the larger of nominal bolt and bearing bore.
  spacer_od:
    value: 10.8
    unit: mm
    kind: design
    source: design
    note: Verify against the real inner-race land; neither spacer face may rub a shield.
  center_extra:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: Makes the center spacer 2.2 mm long so the two outer races are not forced
      against both shoulders at once.
  end_spacer_height:
    value: 2.4
    unit: mm
    kind: design
    source: design
    note: ''
  washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8; one under head and one under nut.
  nut_height:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8.
  thread_pitch:
    value: 1.25
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  reference_length:
    value: 50
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  reference_thread_b:
    value: 28
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal threaded length; verify actual smooth grip and thread runout.
  bracket_thickness:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: ''
  axle_space:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: ''
  user_bolt_length:
    value: null
    unit: mm
    kind: hardware
    source: unknown
    note: ''
  user_bolt_grip:
    value: null
    unit: mm
    kind: hardware
    source: unknown
    note: ''
parts:
- id: wheel
  role: final
  material: High-speed PLA
  code: "def build(p):\n    h = p.old_width\n    d = p.bearing_width\n    R = p.old_od\
    \ / 2\n    s = (p.bearing_od + p.bearing_seat_allowance) / 2\n    a = p.shoulder_id\
    \ / 2\n    c = p.tread_chamfer\n    f = p.seat_lead\n    profile = [(s+f,0),(R-c,0),(R,c),(R,h-c),(R-c,h),(s+f,h),(s,h-f),(s,h-d),(a,h-d),(a,d),(s,d),(s,f)]\n\
    \    return cq.Workplane('XZ').polyline(profile).close().revolve(360,(0,0),(0,1))"
  print_orientation: Flat annular face on bed at z=0, axle vertical. No supports.
    The underside pocket has a 0.75 mm radial lip; inspect it before fitting a bearing.
  use_orientation: Axis along the fixed M8 bolt, with the flat tread centered on the
    track.
- id: center-spacer
  role: final
  material: High-speed PLA
  code: "def build(p):\n    h = p.old_width - 2*p.bearing_width + p.center_extra\n\
    \    r = (max(p.bolt_d,p.bearing_bore)+p.spacer_bore_clearance)/2\n    return\
    \ cq.Workplane('XY').circle(p.spacer_od/2).circle(r).extrude(h)"
  print_orientation: Flat annular end at z=0. No supports. Print solid.
  use_orientation: Between the two bearing inner races, coaxial with bolt.
- id: head-spacer
  role: final
  material: High-speed PLA
  code: "def build(p):\n    r = (max(p.bolt_d,p.bearing_bore)+p.spacer_bore_clearance)/2\n\
    \    return cq.Workplane('XY').circle(p.spacer_od/2).circle(r).extrude(p.end_spacer_height)"
  print_orientation: Flat annular end at z=0. No supports. Print solid.
  use_orientation: Between the head washer and the first bearing inner race; z=0 toward
    the head.
- id: bracket-spacer
  role: final
  material: High-speed PLA
  code: "def build(p):\n    r = (max(p.bolt_d,p.bearing_bore)+p.spacer_bore_clearance)/2\n\
    \    return cq.Workplane('XY').circle(p.spacer_od/2).circle(r).extrude(p.end_spacer_height)"
  print_orientation: Flat annular end at z=0. No supports. Print solid.
  use_orientation: Between the second bearing inner race and the bracket.
hardware:
- id: bearings
  ref: 608ZZ
  qty: 2
- id: axle
  ref: ISO 4762 M8x50
  qty: 1
- id: washers
  ref: ISO 7089 M8
  qty: 2
- id: locknut
  ref: ISO 10511 M8
  qty: 1
joints:
- id: fixed-axle
  fastener: axle
  axis_origin:
  - 0.0
  - 0.0
  - -1.6
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: head-spacer
    feature: 8.4 mm through bore; washer bears on face at z=0
    role: clearance
  - part: center-spacer
    feature: 8.4 mm bore between the inner races
    role: clearance
  - part: bracket-spacer
    feature: 8.4 mm bore between inner race and bracket
    role: clearance
  nut: locknut
  external: Reference stack uses an existing single-sided through bracket that already
    fits M8. Steel head and nut washers are external to the printed parts; both bearings
    are on the smooth grip.
criteria:
- id: bearing-fit
  part: wheel
  feature: Two opposite 22.10 mm bearing pockets and outer-race shoulders
  relation: seats
  hardware: bearings
  clearance_mm: null
  params:
  - bearing_od
  - bearing_width
  - bearing_seat_allowance
  - shoulder_id
  check:
    method: coupon
    ref: fit-ring
    description: Test seat printed at 22.09 mm and held the bearing upside down. Check
      both final pockets too, especially the bed-side lip. Require snug fit, no rocking
      or shield rubbing.
- id: track-fit
  part: wheel
  feature: 50 mm flat tread, 16 mm body width
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - old_od
  - old_width
  - axle_space
  check:
    method: measure
    ref: null
    description: Confirm the track takes a flat tread, check clearance for the wheel
      and whole axle stack, and confirm guide-only service before installation.
- id: spin-check
  part: center-spacer
  feature: Inner-race-only contact faces
  relation: seats
  hardware: bearings
  clearance_mm: null
  params:
  - spacer_od
  - center_extra
  - end_spacer_height
  check:
    method: measure
    ref: null
    description: Check all spacer faces against the inner-race lands. After snugging
      the axle, the wheel must spin freely with no rubbing or perceptible axial slop.
manual:
- n: '1'
  text: Before printing, secure the door and confirm this wheel only guides it, the
    track takes a flat 50 mm tread, and the existing bracket has a through-hole that
    accepts M8 without forcing. This mounting stack is for a single-sided bracket.
    The nominal wheel-and-bearing pack is 16.2 mm wide; the pack with both end spacers
    is 21.0 mm. Check the room for that stack plus the bracket, bolt head, washers,
    nut and protruding tip through the full travel. Stop if the door is weight-bearing
    at this roller or if the mount or track does not match.
  parts:
  - wheel
  - head-spacer
  - center-spacer
  - bracket-spacer
  hardware:
  - axle
  - washers
  - locknut
  tool: null
- n: '2'
  text: Print as oriented, in PLA at 0.2 mm layers, with no supports. Use at least
    5 wall loops and 50% infill for the wheel; print the spacers solid. Inspect both
    bearing pockets. Remove only burrs or first-layer flash; reject a cracked wheel,
    a distorted shoulder, or a loose bearing seat.
  parts:
  - wheel
  - head-spacer
  - center-spacer
  - bracket-spacer
  hardware: []
  tool: null
- n: '3'
  text: Press the first bearing squarely to its shoulder by pushing only on its outer
    race. Insert the center spacer from the other face. Press in the second bearing
    by its outer race until the inner races just meet the spacer. One bearing can
    stand about 0.2 mm proud; don't force both flush. Verify that each spacer touches
    only the inner-race land, not a shield.
  parts:
  - wheel
  - center-spacer
  - head-spacer
  - bracket-spacer
  hardware:
  - bearings
  tool: null
- n: '4'
  text: 'Dry-fit the axle. From the head: washer, head spacer, wheel with both bearings
    and center spacer, bracket spacer, existing bracket, washer, locknut. Use your
    existing M8 bolt only if it meets the same fit checks as the listed reference:
    slides through by hand, has smooth shank under both bearings, has threads where
    the nut sits, and leaves at least two full threads past the nylon after tightening.
    With this stack the smooth shank must reach at least 20.2 mm from under the head.
    Check that the unused tip clears everything; the nominal 50 mm reference is not
    a confirmed fit for your bracket.'
  parts:
  - wheel
  - center-spacer
  - head-spacer
  - bracket-spacer
  hardware:
  - axle
  - bearings
  - washers
  - locknut
  tool: null
- n: '5'
  text: Hold the bolt and snug the locknut only enough to secure the axle and remove
    play. Do not crush the printed spacers or leave the axle loose to get free rotation.
    If it binds with a snug axle, disassemble and check spacer contact, bearing seating
    and bracket clearance. Move the door slowly by hand through its full travel; stop
    if it rubs, wobbles, cracks or tends to climb the track. Recheck for play after
    the first few cycles.
  parts:
  - wheel
  - center-spacer
  - head-spacer
  - bracket-spacer
  hardware:
  - axle
  - locknut
  tool: Hex key and wrench
