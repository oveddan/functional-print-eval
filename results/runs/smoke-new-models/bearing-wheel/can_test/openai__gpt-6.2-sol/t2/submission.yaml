task: bearing-wheel
note: 50 × 16 mm flat-tread trial wheel for a non-load-bearing, non-retaining closet-door
  guide only. The door support and rail profile could not be confirmed. Do not install
  unless you can independently confirm that this wheel neither supports the door nor
  keeps it from falling or leaving its track, and that the existing wheel and rail
  take a flat tread. Otherwise use the matching factory roller assembly. The 22.10
  mm CAD seat printed at about 22.09 mm and was the only test seat that accepted the
  bearing snugly. Collar contact, final wheel fit, and axle stack are not yet verified.
questions:
- text: Does the wheel carry weight or retain the door, and what tread does the rail
    require?
  answer: null
- text: Does the existing M8 bolt slip through both bearings, and what are its usable
    length and bracket clearances?
  answer: Shank reported as about 8 mm. Pass-through fit, length, and clearances are
    unconfirmed.
