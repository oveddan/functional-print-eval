task: bearing-wheel
note: 'Flat-tread 50 × 16 mm prototype with two 608 bearings on a stationary M8 axle.
  The 22.1 mm CAD seat was the snug fit in the printed coupon. The track profile,
  bracket, and load path could not be verified: bench-test this design first, and
  use it on the door only if the original is a confirmed non-load-bearing flat-tread
  guide and the complete assembly fits. If the roller supports the door, or you cannot
  tell, use a rated replacement assembly instead.'
