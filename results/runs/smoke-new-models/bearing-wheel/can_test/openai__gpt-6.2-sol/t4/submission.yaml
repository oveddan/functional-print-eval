    method: measure
    ref: null
    description: Check both faces and spin after snugging. Stop if anything rubs or
      a spacer deforms.
- id: track-fit
  part: wheel
  feature: Flat tread and full assembled envelope fit the actual guide track and bracket
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - old_od
  - old_width
  - bracket_clear_span
  - end_spacer_width
  check:
    method: template
    ref: null
    description: Compare with an intact roller or matching original assembly before
      installation. Check axle center height, profile, and bracket/track clearance
      through full travel. Nominal stack across the two end spacer outer faces is
      20.8 mm before washers or bracket.
manual:
- n: '1'
  text: Confirm that the original roller is only a guide and that the track takes
    a flat tread. If the door rides on or hangs from the roller, if the tread is grooved
    or flanged, or if you can't establish the load path or profile, do not install
    this prototype. Bench testing is still possible.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print the wheel, one center spacer and two end spacers in PLA at 0.2 mm, no
    supports. Use at least five walls for the wheel and make the small rings solid.
    Remove any first-layer lip or loose strands; reject cracked or distorted parts.
  parts:
  - wheel
  - center-spacer
  - end-spacer
  hardware: []
  tool: null
- n: '3'
  text: 'Check each spacer and both bearings on the actual axle: they must slide on
    by hand without force. Hold a spacer against each bearing face and turn the outer
    race. The ring must bear only on the inner race, never on a shield. Press the
    first bearing squarely into the wheel by its outer race, place the center spacer
    inside, then press in the second bearing by its outer race. Use firm hand pressure,
    not a hammer. Stop at spacer contact; the center land is a backstop, not a reason
    to force both bearings deeper. Reject a loose or tilted bearing.'
  parts:
  - wheel
  - center-spacer
  - end-spacer
  hardware: []
  tool: null
- n: '4'
  text: 'Bench-assemble in order: bolt head, washer, end spacer, first bearing inner
    race, center spacer, second bearing inner race, end spacer, washer, locknut. Neither
    washer goes directly against a bearing. Hold the bolt and snug the nut only enough
    to remove stack play without crushing the PLA rings; the nylon must fully engage
    and at least two threads should project. The wheel must spin freely without rubbing,
    noticeable wobble, or movement of the bearings in the wheel. If snugging adds
    drag, disassemble and find the interference rather than running with a loose nut.'
  parts:
  - wheel
  - center-spacer
  - end-spacer
  hardware:
  - bench-bolt
  - washers
  - locknut
  tool: Hex key and wrench
- n: '5'
  text: The M8×35 stack above is for bench testing, not a confirmed bracket fit. For
    a verified guide, use the existing M8 bolt only if it provides a secure stationary
    axle, its smooth shank spans both bearing bores, and the mounting allows full
    locknut engagement with adequate thread projection. Compare the entire stack and
    tread position with the original; don't drill or weaken the bracket, force a fit,
    or substitute this design for a riveted or otherwise incompatible axle. Support
    the door during any work. If everything checks out, move it slowly through full
    travel by hand, then recheck fastener security, free spin, and bearing retention.
    Remove the prototype if it loosens, cracks, rubs, or develops play.
  parts:
  - wheel
  - center-spacer
  - end-spacer
  hardware:
  - locknut
  - washers
  tool: null
