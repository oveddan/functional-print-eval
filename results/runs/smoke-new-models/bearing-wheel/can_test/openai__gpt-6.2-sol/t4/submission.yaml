parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    h=p.old_width; r=p.old_od/2; e=p.edge_break\n    a=p.seat_d/2;\
    \ b=p.land_opening_d/2; l=p.seat_lead\n    s=(h-p.land_thickness)/2\n    # Revolve\
    \ in XZ about the local vertical (global Z) axis.\n    outer=[(0,0),(r-e,0),(r,e),(r,h-e),(r-e,h),(0,h)]\n\
    \    bore=[(0,0),(a+l,0),(a,l),(a,s),(b,s),(b,h-s),(a,h-s),(a,h-l),(a+l,h),(0,h)]\n\
    \    def rev(points):\n        return cq.Workplane('XZ').polyline(points).close().revolve(360,(0,0),(0,1))\n\
    \    return rev(outer).cut(rev(bore))"
  print_orientation: As modeled, annular face flat on the bed at z=0, axle vertical.
    No supports; the short inner ledge reproduces the tested seat coupon.
  use_orientation: Axis along the fixed axle, tread centered over a verified flat
    track; one bearing enters from each face.
- id: center-spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_bore/2).extrude(p.center_spacer_width)"
  print_orientation: Flat annular face on bed at z=0; no supports.
  use_orientation: One ring, coaxial with the axle, between the two bearing inner
    races.
- id: end-spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_bore/2).extrude(p.end_spacer_width)"
  print_orientation: Flat annular face on bed at z=0; no supports. Print two copies.
  use_orientation: One ring against each outward-facing bearing inner race, separating
    the bearing from stationary hardware.
