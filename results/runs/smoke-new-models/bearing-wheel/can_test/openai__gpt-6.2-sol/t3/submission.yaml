task: bearing-wheel
note: 50 × 16 mm flat-tread wheel for two 608ZZ bearings on the existing M8 axle.
  The 22.10 mm bearing-seat model follows the snug coupon result; use the same PLA,
  slicer and XY compensation. Only use this as a non-load-bearing guide on a track
  that accepts a flat tread. The original tread, bracket geometry, axle length and
  bearing-to-axle fit were not verified. If the roller carries the door’s weight,
  keeps it from falling or derailing, or needs a groove or flange, use the correct
  replacement roller instead.
