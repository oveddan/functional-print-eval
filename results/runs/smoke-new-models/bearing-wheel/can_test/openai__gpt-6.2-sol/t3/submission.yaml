manual:
- n: '1'
  text: Confirm this is only a guide, that the track accepts a flat wheel, and that
    the mount can safely retain a through-axle. If any of these are uncertain, use
    the correct replacement assembly. Before printing the full parts, slide both bearings
    by hand onto the smooth section of your M8 bolt. Do not force them on or run them
    on the threads.
  parts: []
  hardware:
  - bearings
  tool: null
- n: '2'
  text: Print both halves, one middle collar and two end collars flat in black PLA
    at 0.2 mm, no supports. Use the successful coupon settings, at least four walls
    and solid infill for the collars. Remove any first-layer flash that keeps the
    mating faces from closing or interferes with rolling; do not sand a correctly
    fitting bearing seat.
  parts:
  - head-half
  - nut-half
  - middle-collar
  - end-collar
  hardware: []
  tool: null
- n: '3'
  text: 'Check each collar against a loose bearing: it must touch only the inner steel
    ring, not the shield. Press one bearing squarely into each half with firm hand
    pressure on the outer ring only. Each should bottom on its shoulder, sit approximately
    flush, and spin freely. Stop if the pocket is loose, the bearing does not seat,
    or the shoulder rubs.'
  parts:
  - head-half
  - nut-half
  - middle-collar
  - end-collar
  hardware:
  - bearings
  tool: null
- n: '4'
  text: Bring the two flat mating faces together with the middle collar trapped between
    the bearings. Use the smooth axle to keep the collar centered while closing the
    halves. Seat the four M3 nuts in their hex pockets and fit the four M3 screws
    from the other face. Snug in a cross pattern until the seam closes. Check that
    all screw heads and tips stay below the outer faces.
  parts:
  - head-half
  - nut-half
  - middle-collar
  hardware:
  - wheel-screws
  - wheel-nuts
  tool: 2.5 mm hex key
- n: '5'
  text: Install on the compatible through-axle mount with one end collar against each
    bearing inner ring. The nominal stack is 24 mm before bracket thickness and locknut.
    Check that both bearings sit completely on the smooth shank, that the locknut
    clamps the stack without bottoming on the shoulder, and that a full thread shows
    beyond its nylon insert. Tighten only until axial looseness is gone; do not crush
    the printed collars. If the bolt cannot meet these checks, do not install it.
  parts:
  - head-half
  - nut-half
  - middle-collar
  - end-collar
  hardware:
  - bearings
  - axle-locknut
  tool: Wrench and the tool for your existing bolt head
- n: '6'
  text: Spin the assembled wheel by hand. It must turn freely without axial play,
    bearing movement in the pockets, or rubbing on the bracket. Slowly cycle the door
    through its full travel and verify the wheel stays properly in the track. Remove
    the guide if it binds, loosens, cracks, or shows tread deformation; recheck after
    the first few uses.
  parts:
  - head-half
  - nut-half
  - middle-collar
  - end-collar
  hardware: []
  tool: null
