parts:
- id: head-half
  role: final
  material: Black PLA
  code: "def build(p):\n    h=p.wheel_width/2\n    ledge=h-p.bearing_w\n    body=cq.Workplane('XY').circle(p.wheel_od/2).circle(p.ledge_bore/2).extrude(h)\n\
    \    body=body.cut(cq.Workplane('XY',origin=(0,0,ledge)).circle(p.bearing_seat_d/2).extrude(p.bearing_w))\n\
    \    r=p.bolt_circle_r\n    pts=[(r,0),(0,r),(-r,0),(0,-r)]\n    body=body.cut(cq.Workplane('XY').pushPoints(pts).circle(p.screw_clearance_d/2).extrude(h))\n\
    \    recess=cq.Workplane('XY',origin=(0,0,h-p.recess_depth)).pushPoints(pts).circle(p.head_recess_d/2).extrude(p.recess_depth)\n\
    \    return body.cut(recess)"
  print_orientation: Flat mating face on z=0, bearing pocket and screw-head recesses
    up. No supports.
  use_orientation: Mating face against nut-half, bearing and head recesses outboard.
- id: nut-half
  role: final
  material: Black PLA
  code: "def build(p):\n    h=p.wheel_width/2\n    ledge=h-p.bearing_w\n    body=cq.Workplane('XY').circle(p.wheel_od/2).circle(p.ledge_bore/2).extrude(h)\n\
    \    body=body.cut(cq.Workplane('XY',origin=(0,0,ledge)).circle(p.bearing_seat_d/2).extrude(p.bearing_w))\n\
    \    r=p.bolt_circle_r\n    pts=[(r,0),(0,r),(-r,0),(0,-r)]\n    body=body.cut(cq.Workplane('XY').pushPoints(pts).circle(p.screw_clearance_d/2).extrude(h))\n\
    \    recess=cq.Workplane('XY',origin=(0,0,h-p.recess_depth)).pushPoints(pts).polygon(6,p.nut_recess_af/0.8660254037844386).extrude(p.recess_depth)\n\
    \    return body.cut(recess)"
  print_orientation: Flat mating face on z=0, bearing pocket and hex recesses up.
    No supports.
  use_orientation: Flip over relative to head-half so the mating faces meet and the
    hex recesses face outboard.
- id: middle-collar
  role: final
  material: Black PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.collar_od/2).circle(p.collar_bore/2).extrude(p.wheel_width-2*p.bearing_w)"
  print_orientation: Flat annular face on z=0; no supports.
  use_orientation: On the axle between the two inner rings; nominally 2 mm long.
- id: end-collar
  role: final
  material: Black PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.collar_od/2).circle(p.collar_bore/2).extrude(p.end_collar_t)"
  print_orientation: Print two copies, flat annular face on z=0; no supports.
  use_orientation: One on each side of the wheel, contacting the inner ring only.
