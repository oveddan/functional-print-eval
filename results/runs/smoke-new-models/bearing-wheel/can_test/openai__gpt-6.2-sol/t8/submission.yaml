parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    R = p.wheel_od/2\n    W = p.wheel_width\n    b = p.bearing_width\n\
    \    r = (p.bearing_od+p.seat_allowance)/2\n    q = p.shoulder_id/2\n    k = p.edge_break\n\
    \    f = r-p.shoulder_land\n    rise = f-q\n    section = [(r+k,0),(R-k,0),(R,k),(R,W-k),(R-k,W),(r+k,W),(r,W-k),(r,W-b),(f,W-b),(q,W-b-rise),(q,b+rise),(f,b),(r,b),(r,k)]\n\
    \    return cq.Workplane('XZ').polyline(section).close().revolve(360,(0,0),(0,1))"
  print_orientation: Flat annular side on the bed at z=0, axle vertical; supports
    off. Lower seat has a narrow flat land with a tapered web above it.
  use_orientation: Axle through the center. Flat rim runs on a compatible flat track;
    either face can face the bracket.
- id: center-spacer
  role: final
  material: PLA
  code: "def build(p):\n    h = p.wheel_width-2*p.bearing_width+p.center_spacer_trim\n\
    \    return cq.Workplane('XY').circle(p.collar_od/2).circle((p.axle_d+p.spacer_bore_extra)/2).extrude(h)"
  print_orientation: Annular face on the bed at z=0; no supports.
  use_orientation: Between the two inner races, on the axle. Not attached to the wheel.
- id: head-collar
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.collar_od/2).circle((p.axle_d+p.spacer_bore_extra)/2).extrude(p.collar_height)"
  print_orientation: Annular face on the bed at z=0; no supports.
  use_orientation: Between the head-side washer and the adjacent bearing inner race.
- id: bracket-collar
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.collar_od/2).circle((p.axle_d+p.spacer_bore_extra)/2).extrude(p.collar_height)"
  print_orientation: Annular face on the bed at z=0; no supports.
  use_orientation: Between the bracket and the adjacent bearing inner race.
