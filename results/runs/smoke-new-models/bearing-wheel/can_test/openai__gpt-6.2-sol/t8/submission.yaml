task: bearing-wheel
note: 50 × 16 mm flat-tread replacement for a non-load-bearing closet-door guide,
  using both 608ZZ bearings. Uses the 22.10 mm CAD pocket that printed at 22.09 mm
  and held the bearing snugly in the coupon. Track profile, door support arrangement
  and bracket fit are unverified. Do not use this PLA design to carry the door, keep
  it from falling, or replace a grooved/flanged wheel; if its role is uncertain, use
  a matching rated replacement.
