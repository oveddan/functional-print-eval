criteria:
- id: bearing-fit
  part: wheel
  feature: Opposed cylindrical bearing seats with outer-race stops
  relation: seats
  hardware: bearings
  clearance_mm: null
  params:
  - bearing_od
  - bearing_width
  - seat_allowance
  - shoulder_land
  - shoulder_id
  check:
    method: coupon
    ref: seat-fit
    description: '22.10 mm CAD seat selected from coupon. Verify both final seats,
      especially the bed-side one: bearing sits square on the stop without shield
      contact, stays put inverted, and turns smoothly.'
- id: spacer-fit
  part: center-spacer
  feature: Flat faces between the inner races, without shield contact
  relation: supports
  hardware: bearings
  clearance_mm: null
  params:
  - collar_od
  - center_spacer_trim
  - bearing_width
  - wheel_width
  check:
    method: measure
    ref: null
    description: Dry-fit the assembled stack. Minimal clamp must not add drag, shift
      either bearing off its seat or leave side play. Match the spacer thickness to
      the gap between the fully seated inner-race faces if necessary.
- id: bracket-clearance
  part: bracket-collar
  feature: Wheel and bracket axial spacing
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - collar_height
  - wheel_width
  - available_stack_width
  - bracket_thickness
  check:
    method: measure
    ref: null
    description: 22.4 mm between head-side washer and bracket face; allow room for
      head, washers, bracket and locknut. Verify that the wheel and hardware clear
      the bracket and door throughout travel.
manual:
- n: '1'
  text: Confirm the old wheel ran on a flat track and served only as a guide. Hold
    the door safely in place before removing the broken part. Check the proposed 50
    mm diameter and 16 mm tread against the track, and check for an existing metal
    bracket with a compatible M8 through-hole and access for a rear nut. Do not drill
    or modify an incompatible bracket for this design. If the wheel supports the door,
    is needed to keep it from falling, or you cannot tell, stop and source a matching
    rated roller.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print the wheel and three rings as oriented, in PLA at 0.2 mm with supports
    off. Use at least five walls for the wheel and solid infill for the rings. Remove
    any first-layer lip or strings without enlarging the bearing seats. Check that
    the collars and spacer slide onto the smooth shank and that their faces touch
    only the inner races, not the shields or outer races.
  parts:
  - wheel
  - center-spacer
  - head-collar
  - bracket-collar
  hardware:
  - axle
  - bearings
  tool: null
- n: '3'
  text: Seat one bearing squarely against its stop, using pressure only on its outer
    race. Insert the center spacer, then seat the second bearing the same way. Use
    the axle to line up the spacer if needed. Do not hammer the bearings or pull them
    into place using the axle nut. Both should stay seated when the wheel is inverted
    and spin smoothly before clamping. Reject a cracked, distorted or loose seat.
  parts:
  - wheel
  - center-spacer
  hardware:
  - bearings
  - axle
  tool: null
- n: '4'
  text: 'Dry-fit in this order: bolt head, washer, head collar, bearing–spacer–bearing
    inside the wheel, bracket collar, metal bracket, washer, locknut. Verify the smooth
    shank spans both bearing bores, the thread transition does not block seating,
    and at least two full threads extend past the nylon locknut. The bolt tip must
    not foul the door or track. Use the existing bolt only if it meets the same checks
    and accepts the M8 locknut.'
  parts:
  - head-collar
  - wheel
  - center-spacer
  - bracket-collar
  hardware:
  - axle
  - bearings
  - washers
  - locknut
  tool: Hex key and wrench
- n: '5'
  text: Tighten only enough to seat the stationary stack and remove looseness; do
    not crush the PLA rings. The wheel must still spin freely with no rubbing or obvious
    side play. If it binds when the stack is seated, check for shield contact and
    a too-short spacer. If the spacer holds a bearing off its stop, it is too long.
    Correct the spacer length and repeat the dry fit rather than leaving the hardware
    loose.
  parts:
  - wheel
  - center-spacer
  - head-collar
  - bracket-collar
  hardware:
  - axle
  - locknut
  tool: Hex key and wrench
- n: '6'
  text: Move the door slowly through its full travel while observing the guide. Stop
    if the wheel rubs, climbs out of the track, or shifts on the axle. Recheck for
    looseness, cracks and bearing movement after the first few cycles and periodically
    thereafter.
  parts:
  - wheel
  hardware:
  - axle
  - locknut
  tool: null
