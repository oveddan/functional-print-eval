  entry_chamfer:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: ''
  tread_chamfer:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: ''
  collar_od:
    value: 11.4
    unit: mm
    kind: design
    source: design
    note: Must fit entirely on the raised inner-race face; not confirmed by coupon.
  collar_h:
    value: 1.6
    unit: mm
    kind: design
    source: design
    note: ''
