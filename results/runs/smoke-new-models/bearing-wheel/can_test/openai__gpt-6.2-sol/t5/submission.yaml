task: bearing-wheel
note: Prototype for a flat-running, non-load-bearing closet-door guide only. The PLA
  wheel body is 50 × 16 mm; the two-bearing axle stack with collars is about 20 mm
  wide before the bracket, washers and nut. The 22.10 mm coupon gave a snug hand fit.
  Track profile, load, bracket dimensions and actual bolt length remain unverified;
  do not install if any compatibility check fails. Do not use this for a roller that
  carries the door or keeps it from falling or leaving the track.
questions: []
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: Approximate old wheel outside diameter; copied as the target.
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: Approximate old wheel width; copied as the target for the plastic body.
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: Approximate; confirmed by coupon fit.
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: Approximate width of each 608.
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: Approximate. Actual slip fit on bolt not verified.
  axle_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: Approximate existing bolt shank diameter.
  existing_bolt_length:
    value: null
    unit: mm
    kind: hardware
    source: unknown
    note: Measure from under the head before reuse.
  seat_allowance:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: Diametral addition selected from the printed 22.10 mm coupon.
  seat_depth:
    value: 6.8
    unit: mm
    kind: design
    source: design
    note: Upper pocket depth; lower pocket is cylindrical to this depth and then tapers.
  web_bore:
    value: 19.8
    unit: mm
    kind: design
    source: design
    note: Wide opening to clear the inner ring and shield; verify shoulder touches
