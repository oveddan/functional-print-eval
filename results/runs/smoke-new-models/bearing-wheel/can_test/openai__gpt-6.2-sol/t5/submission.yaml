parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    R = p.wheel_od/2\n    W = p.wheel_w\n    r = (p.bearing_od+p.seat_allowance)/2\n\
    \    s = p.web_bore/2\n    d = p.seat_depth\n    a = p.entry_chamfer\n    c =\
    \ p.tread_chamfer\n    z = d+r-s\n    points = [(r+a,0),(R-c,0),(R,c),(R,W-c),(R-c,W),(r+a,W),(r,W-a),(r,W-d),(s,W-d),(s,z),(r,d),(r,a)]\n\
    \    return cq.Workplane('XZ').polyline(points).close().revolve(360,(0,0),(0,1))"
  print_orientation: As modeled, annular face at z=0, axle vertical. No supports;
    pocket roof on the bed side transitions inward at 45 degrees.
  use_orientation: Axle coaxial with both bearing pockets; flat tread rolls against
    a compatible track.
- id: side-collar
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.collar_od/2).circle((p.axle_d+p.axle_clearance)/2).extrude(p.collar_h)"
  print_orientation: Flat annular face down; print two copies.
  use_orientation: One on each outer bearing face, between the inner race and the
    bracket.
- id: center-spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.collar_od/2).circle((p.axle_d+p.axle_clearance)/2).extrude(p.center_h)"
  print_orientation: Flat annular face down.
  use_orientation: Between bearing inner races, coaxial with bolt; never between the
    outer races.
hardware:
- id: bearings
  ref: 608ZZ
  qty: 2
- id: axle
  ref: ISO 4762 M8x40
  qty: 1
- id: locknut
  ref: ISO 10511 M8
  qty: 1
- id: washers
  ref: ISO 7089 M8
  qty: 2
joints: []
criteria:
- id: seat-fit
  part: wheel
  feature: opposed 22.10 mm bearing pockets
  relation: contains
  hardware: bearings
  clearance_mm: null
  params:
  - bearing_od
  - seat_allowance
  - seat_depth
  check:
    method: coupon
    ref: fit-rings
    description: 22.10 mm was snug on the coupon. Check both finished pockets by hand;
      bearings must stay square and not shift or rock. A coupon is not an in-service
      retention test.
- id: inner-contact
  part: side-collar
  feature: annular end faces
  relation: seats
  hardware: bearings
  clearance_mm: null
  params:
  - collar_od
  - collar_h
  check:
    method: measure
    ref: null
    description: Verify with the actual bearing that the flat end lies entirely on
      the inner-race seating face and clears the shield. Do the same with both ends
      of the center spacer.
- id: fork-fit
  part: wheel
  feature: assembled width and tread
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - bearing_w
  - center_h
  - collar_h
  - bracket_gap
  - wheel_od
  - wheel_w
  check:
    method: measure
    ref: null
    description: Measure the actual bearing-and-collar stack and compare it to the
      fork; no bending the ears or allowing axial slop. With the unloaded guide in
      the track, check free rotation and clearance throughout the full travel.
manual:
- n: '1'
  text: Confirm the roller is only a guide, the original tread is flat, and the intact
    bracket is a two-ear fork that accepts an M8 axle. If you cannot confirm those
    points, use a matching replacement roller assembly instead. Support the door independently
    before touching its hardware.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print the wheel, two side collars and one center spacer in PLA at 0.2 mm with
    no supports. Use five walls and at least five top and bottom layers for the wheel;
    print the collars and spacer solid. Remove any brim or deburr the pocket lips
    without enlarging the seats.
  parts:
  - wheel
  - side-collar
  - center-spacer
  hardware: []
  tool: null
- n: '3'
  text: Slide the bolt through both bearings and all three printed rings by hand.
    Verify that the printed rings touch only the inner races, not the shields. Seat
    one bearing squarely to the lower taper using pressure on its outer race only.
    Place the center spacer on the bolt as an alignment guide and hand-seat the second
    bearing from the other face. Stop when the inner races contact the spacer; the
    second bearing may stand slightly proud. Do not hammer the bearings or pull them
    in with the axle nut. Reject a cracked, loose, crooked or binding assembly.
  parts:
  - wheel
  - center-spacer
  - side-collar
  hardware:
  - bearings
  - axle
  tool: null
- n: '4'
  text: 'Measure the assembled stack with both side collars in place (nominally 20.0
    mm). It must fit the fork without spreading or pinching the ears. Dry-assemble
    in order: bolt head, washer, first ear, side collar, bearing/spacer/wheel assembly,
    side collar, second ear, washer, locknut. Reuse your M8 bolt only if it fits by
    hand and satisfies the same length and thread checks. The M8×40 is a candidate,
    not a confirmed match: the nut must reach the washer without bottoming on the
    shank, have at least two full threads past its nylon end, and the bolt tip and
    head must clear the door and track.'
  parts:
  - wheel
  - side-collar
  - center-spacer
  hardware:
  - axle
  - washers
  - bearings
  - locknut
  tool: null
- n: '5'
  text: Snug the locknut only enough to remove axle play without bending the bracket
    or crushing the printed rings. The wheel must turn freely by hand after snugging,
    with no axial shift of the bearings and no scraping. If tightening changes how
    it spins, stop and do not use it. Check slow full travel before normal use; inspect
    again after the first few cycles and stop if the guide loosens, wears or cracks.
  parts:
  - wheel
  - side-collar
  - center-spacer
  hardware:
  - axle
  - locknut
  - washers
  tool: M8 socket-head hex key and wrench
