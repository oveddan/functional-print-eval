manual:
- n: '1'
  text: Print back_box in matte white PLA with the flat back wall (z = 0) on the build
    plate, 0.2 mm layer height, and supports disabled. The 40 mm wide USB-C slot bridges
    cleanly without supports.
  parts:
  - back_box
  hardware: []
  tool: 3D printer (0.4 mm nozzle, 0.2 mm layers)
- n: '2'
  text: Press one M3x4x5 heat-set insert straight and flush into the top of each of
    the two central bosses using a soldering iron. Let cool completely.
  parts:
  - back_box
  hardware:
  - m3_insert
  tool: Soldering iron
- n: '3'
  text: Place the perfboard (with the ESP32 plugged in) onto the four corner standoffs
    near the bottom (6 o'clock) wall, oriented so the ESP32's USB-C port faces straight
    down toward the cutout. Fasten the four corners with the four M2x6 self-tapping
    screws.
  parts:
  - back_box
  hardware:
  - perfboard
  - esp32
  - m2_screw
  tool: Small Phillips/hex screwdriver
- n: '4'
  text: Tuck the four connecting wires neatly inside the box cavity. Set the LED disk
    onto the front rim with its 12 o'clock input wires at the top (away from the USB-C
    cutout) and its two 3.3 mm holes aligned over the central bosses. Place an M3
    plain washer on each M3x8 screw and tighten both into the heat-set inserts.
  parts:
  - back_box
  hardware:
  - led_disk
  - m3_screw
  - m3_washer
  tool: 2.5 mm hex key
- n: '5'
  text: 'Drive two #8 round-head wall screws (<= 9 mm head diameter) horizontally
    130 mm apart into wall anchors, leaving ~4-5 mm protruding. Hang the closed box
    over the lower keyhole entry circles and slide it straight down to lock flat against
    the wall, then plug the USB-C charger straight into the ESP32 through the bottom
    cutout.'
  parts:
  - back_box
  hardware: []
  tool: Screwdriver / drill for wall anchors
