parts:
- id: back_box
  role: final
  material: PLA
  code: "def build(p):\n    r_outer = p.led_disk_od / 2.0\n    r_inner = r_outer -\
    \ p.wall_t\n\n    # 1. Back plate (z = 0 to back_t)\n    part = cq.Workplane(\"\
    XY\").circle(r_outer).extrude(p.back_t)\n\n    # 2. Outer cylindrical wall (z\
    \ = back_t to box_h)\n    wall = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.back_t)\n\
    \        .circle(r_outer)\n        .circle(r_inner)\n        .extrude(p.box_h\
    \ - p.back_t)\n    )\n    part = part.union(wall)\n\n    # 3. USB-C access cutout\
    \ at 6 o'clock (-Y wall)\n    usb_z_center = (\n        p.back_t\n        + p.perf_standoff_h\n\
    \        + p.perfboard_t\n        + p.esp32_usb_bottom_above_perf\n        + p.esp32_usb_h\
    \ / 2.0\n    )\n    usb_cut = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=usb_z_center\
    \ - p.usb_slot_h / 2.0)\n        .center(0.0, -r_outer)\n        .rect(p.usb_slot_w,\
    \ 20.0)\n        .extrude(p.usb_slot_h)\n    )\n    part = part.cut(usb_cut)\n\
    \n    # 4. Two keyhole slots in the back wall for #8 wall screws\n    for sx in\
    \ (-1.0, 1.0):\n        kx = sx * p.keyhole_x\n        head_hole = (\n       \
    \     cq.Workplane(\"XY\")\n            .center(kx, p.keyhole_y - p.keyhole_drop)\n\
    \            .circle(p.keyhole_head_d / 2.0)\n            .extrude(p.back_t)\n\
    \        )\n        shaft_top = (\n            cq.Workplane(\"XY\")\n        \
    \    .center(kx, p.keyhole_y)\n            .circle(p.keyhole_slot_w / 2.0)\n \
    \           .extrude(p.back_t)\n        )\n        shaft_rect = (\n          \
    \  cq.Workplane(\"XY\")\n            .center(kx, p.keyhole_y - p.keyhole_drop\
    \ / 2.0)\n            .rect(p.keyhole_slot_w, p.keyhole_drop)\n            .extrude(p.back_t)\n\
    \        )\n        part = part.cut(head_hole).cut(shaft_top).cut(shaft_rect)\n\
    \n    # 5. Two central M3 bosses for the LED disk\n    led_hole_pitch = p.led_hole_inner_dist\
    \ + p.led_hole_d\n    for sx in (-1.0, 1.0):\n        bx = sx * (led_hole_pitch\
    \ / 2.0)\n        boss = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=p.back_t)\n\
    \            .center(bx, 0.0)\n            .circle(p.led_boss_od / 2.0)\n    \
    \        .extrude(p.box_h - p.back_t)\n        )\n        part = part.union(boss)\n\
    \n        insert_bore = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=p.box_h\
    \ - p.led_boss_insert_depth)\n            .center(bx, 0.0)\n            .circle(p.insert_hole_d\
    \ / 2.0)\n            .extrude(p.led_boss_insert_depth)\n        )\n        tip_bore\
    \ = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=p.box_h\
    \ - p.led_boss_screw_clear_depth)\n            .center(bx, 0.0)\n            .circle((p.led_hole_d\
    \ + 0.1) / 2.0)\n            .extrude(p.led_boss_screw_clear_depth)\n        )\n\
    \        part = part.cut(insert_bore).cut(tip_bore)\n\n    # 6. Stiffening ribs\
    \ along X at y = 0 from central bosses to outer wall\n    boss_edge_x = led_hole_pitch\
    \ / 2.0 + p.led_boss_od / 2.0 - 1.0\n    rib_len = r_inner - boss_edge_x + 1.0\n\
    \    for sx in (-1.0, 1.0):\n        rx = sx * (boss_edge_x + rib_len / 2.0)\n\
    \        rib = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=p.back_t)\n\
    \            .center(rx, 0.0)\n            .rect(rib_len, p.rib_w)\n         \
    \   .extrude(p.rib_h)\n        )\n        part = part.union(rib)\n\n    # 7. Four\
    \ perfboard standoffs with M2 pilot holes\n    hole_margin = p.perfboard_hole_edge_margin\
    \ + p.perfboard_hole_d / 2.0\n    px_off = p.perfboard_w / 2.0 - hole_margin\n\
    \    py_off = p.perfboard_l / 2.0 - hole_margin\n    for sx in (-1.0, 1.0):\n\
    \        for sy in (-1.0, 1.0):\n            hx = sx * px_off\n            hy\
    \ = p.perf_y_center + sy * py_off\n            standoff = (\n                cq.Workplane(\"\
    XY\")\n                .workplane(offset=p.back_t)\n                .center(hx,\
    \ hy)\n                .circle(p.perf_standoff_od / 2.0)\n                .extrude(p.perf_standoff_h)\n\
    \            )\n            part = part.union(standoff)\n            pilot = (\n\
    \                cq.Workplane(\"XY\")\n                .workplane(offset=p.back_t\
    \ + 0.5)\n                .center(hx, hy)\n                .circle(p.perf_pilot_d\
    \ / 2.0)\n                .extrude(p.perf_standoff_h - 0.5)\n            )\n \
    \           part = part.cut(pilot)\n\n    return part\n"
  print_orientation: Back wall flat on the build plate (z = 0), open front rim and
    standoffs pointing +z
  use_orientation: Back wall flat against the wall (z = 0), +y pointing up (12 o'clock)
    with keyhole slots at the top and USB-C cutout at the bottom (6 o'clock)
