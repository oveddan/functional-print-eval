parts:
- id: back_box
  role: final
  material: PLA
  code: "def build(p):\n    r_outer = p.led_disk_d / 2.0\n    r_inner = r_outer -\
    \ p.wall_t\n\n    # 1) Main circular shell: solid floor + outer cylindrical wall\n\
    \    part = cq.Workplane(\"XY\").circle(r_outer).extrude(p.box_depth)\n    cavity\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.floor_t)\n  \
    \      .circle(r_inner)\n        .extrude(p.box_depth - p.floor_t)\n    )\n  \
    \  part = part.cut(cavity)\n\n    # 2) Central M3 heat-set insert towers (33.5\
    \ mm pitch along X at y = 0)\n    led_pitch = p.led_hole_inner_gap + p.led_hole_d\n\
    \    lx = led_pitch / 2.0\n    led_pts = [(-lx, 0.0), (lx, 0.0)]\n    towers =\
    \ (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.floor_t)\n    \
    \    .pushPoints(led_pts)\n        .circle(p.m3_boss_od / 2.0)\n        .extrude(p.box_depth\
    \ - p.floor_t)\n    )\n    part = part.union(towers)\n\n    # Stiffening web tying\
    \ the two central towers together (z = floor_t to 14 mm)\n    center_web = (\n\
    \        cq.Workplane(\"XY\")\n        .workplane(offset=p.floor_t)\n        .rect(led_pitch,\
    \ 4.0)\n        .extrude(12.0)\n    )\n    part = part.union(center_web)\n\n \
    \   # Insert bores + screw-tip clearance bores from top face\n    insert_depth\
    \ = p.insert_len + 4.5\n    tip_depth = p.insert_len + 7.0\n    for bx, by in\
    \ led_pts:\n        ibore = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=p.box_depth\
    \ - insert_depth)\n            .center(bx, by)\n            .circle(p.insert_hole_d\
    \ / 2.0)\n            .extrude(insert_depth)\n        )\n        tbore = (\n \
    \           cq.Workplane(\"XY\")\n            .workplane(offset=p.box_depth -\
    \ tip_depth)\n            .center(bx, by)\n            .circle((p.m3_screw_d +\
    \ 0.4) / 2.0)\n            .extrude(tip_depth)\n        )\n        part = part.cut(ibore).cut(tbore)\n\
    \n    # 3) Low floor stiffening ribs (z = floor_t to floor_t + 3.5 mm)\n    rib_h\
    \ = 3.5\n    rib_w = 2.5\n    horiz_rib = (\n        cq.Workplane(\"XY\")\n  \
    \      .workplane(offset=p.floor_t)\n        .rect(2.0 * r_inner, rib_w)\n   \
    \     .extrude(rib_h)\n    )\n    vert_rib = (\n        cq.Workplane(\"XY\")\n\
    \        .workplane(offset=p.floor_t)\n        .center(0.0, r_inner / 2.0)\n \
    \       .rect(rib_w, r_inner)\n        .extrude(rib_h)\n    )\n    part = part.union(horiz_rib).union(vert_rib)\n\
    \n    # 4) Perfboard 4-corner M2 standoffs\n    inset = p.perf_hole_edge_gap +\
    \ p.perf_hole_d / 2.0\n    px = p.perf_w / 2.0 - inset\n    py = p.perf_l / 2.0\
    \ - inset\n    standoff_pts = [\n        (-px, p.perf_yc - py),\n        (px,\
    \ p.perf_yc - py),\n        (-px, p.perf_yc + py),\n        (px, p.perf_yc + py),\n\
    \    ]\n    standoffs = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.floor_t)\n\
    \        .pushPoints(standoff_pts)\n        .circle(p.standoff_od / 2.0)\n   \
    \     .extrude(p.standoff_h)\n    )\n    part = part.union(standoffs)\n    for\
    \ sx, sy in standoff_pts:\n        pilot = (\n            cq.Workplane(\"XY\"\
    )\n            .workplane(offset=p.floor_t)\n            .center(sx, sy)\n   \
    \         .circle(p.m2_pilot_d / 2.0)\n            .extrude(p.standoff_h)\n  \
    \      )\n        part = part.cut(pilot)\n\n    # 5) Two 45-degree self-tightening\
    \ keyhole pockets for #8 wall screws\n    w_slot = p.wall_screw_shaft_d + 0.6\n\
    \    w_pocket = p.wall_screw_head_d + 2.0\n    d_entry = p.wall_screw_head_d +\
    \ 1.5\n    t_lip = 2.2\n    flare_h = (w_pocket - w_slot) / 2.0\n    h_pocket\
    \ = 8.5\n    boss_h = 10.5\n    slot_len = p.keyhole_slot_len\n    pocket_len\
    \ = slot_len + 4.0\n\n    for kh_x in (-p.keyhole_x, p.keyhole_x):\n        kh_boss\
    \ = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=p.floor_t)\n\
    \            .center(kh_x, p.keyhole_entry_y + pocket_len / 2.0 - 2.0)\n     \
    \       .rect(17.0, 31.0)\n            .extrude(boss_h - p.floor_t)\n        )\n\
    \        part = part.union(kh_boss)\n\n        entry_cut = (\n            cq.Workplane(\"\
    XY\")\n            .center(kh_x, p.keyhole_entry_y)\n            .circle(d_entry\
    \ / 2.0)\n            .extrude(h_pocket)\n        )\n        slot_cut = (\n  \
    \          cq.Workplane(\"XY\")\n            .center(kh_x, p.keyhole_entry_y +\
    \ slot_len / 2.0)\n            .rect(w_slot, slot_len)\n            .extrude(t_lip)\n\
    \        )\n        flare_cut = (\n            cq.Workplane(\"XY\")\n        \
    \    .workplane(offset=t_lip)\n            .center(kh_x, p.keyhole_entry_y + slot_len\
    \ / 2.0)\n            .rect(w_slot, slot_len)\n            .workplane(offset=flare_h)\n\
    \            .center(0.0, (pocket_len - slot_len) / 2.0)\n            .rect(w_pocket,\
    \ pocket_len)\n            .loft(ruled=True)\n        )\n        upper_cut = (\n\
    \            cq.Workplane(\"XY\")\n            .workplane(offset=t_lip + flare_h)\n\
    \            .center(kh_x, p.keyhole_entry_y + pocket_len / 2.0)\n           \
    \ .rect(w_pocket, pocket_len)\n            .extrude(h_pocket - t_lip - flare_h)\n\
    \        )\n        part = part.cut(entry_cut).cut(slot_cut).cut(flare_cut).cut(upper_cut)\n\
    \n    # 6) USB-C charger access slot at 6 o'clock\n    usbc_cz = (\n        p.floor_t\n\
    \        + p.standoff_h\n        + p.perf_t\n        + p.usbc_bottom_above_perf\n\
    \        + p.usbc_receptacle_h / 2.0\n    )\n    usbc_z0 = usbc_cz - p.usbc_slot_h\
    \ / 2.0\n    cut_y_start = -r_inner + 2.5\n    cut_y_end = -r_outer - 3.0\n  \
    \  cut_y_len = cut_y_start - cut_y_end\n    cut_y_mid = (cut_y_start + cut_y_end)\
    \ / 2.0\n    usbc_cut = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=usbc_z0)\n\
    \        .center(0.0, cut_y_mid)\n        .rect(p.usbc_slot_w, cut_y_len)\n  \
    \      .extrude(p.usbc_slot_h)\n    )\n    part = part.cut(usbc_cut)\n\n    return\
    \ part\n"
  print_orientation: Back face (wall side) flat on the print bed (z = 0)
  use_orientation: Wall-facing back at z = 0, USB-C slot down (6 o'clock), LED disk
    mounted at z = 34 mm
