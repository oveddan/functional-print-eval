task: estoa-light
note: '242 mm circular wall-mount enclosure box behind the Adafruit DotStar 255-LED
  disk. Provides full 360-degree rim support plus M3 heat-set insert towers at 33.5
  mm pitch, 4x M2x6 standoffs placing the perfboard near 6 o''clock, a 41 x 10 mm
  support-free USB-C plug slot clearing either ESP32 header orientation and USB/UART
  port offset, and two 45-degree self-tightening keyhole pockets at 140 mm spacing
  for #8 wall screws. Note: assembly.parts[0].code was mistakenly written as ''back_box''
  in draft — wait: check assembly.parts schema! It expects ''part'' = ''back_box'',
  not ''code''! Fixed below.'
