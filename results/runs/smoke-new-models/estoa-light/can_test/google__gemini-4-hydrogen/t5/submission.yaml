manual:
- n: '1'
  text: Print back_box in PLA with its flat back face (z = 0) on the build plate and
    supports disabled. The 41 mm USB-C slot and 11 mm keyhole pockets bridge cleanly
    without supports.
  parts:
  - back_box
  hardware: []
  tool: 3D printer
- n: '2'
  text: Using a soldering iron, press one insert M3x4x5 heat-set insert straight down
    into each of the two 4.3 mm bores in the central towers until flush with the top
    face (z = 34 mm).
  parts:
  - back_box
  hardware:
  - m3_insert
  tool: soldering iron
- n: '3'
  text: Place the perfboard (with the ESP32 seated in its headers) onto the four 5.5
    mm standoffs in the lower half of the box, with the USB-C end of the ESP32 pointing
    down toward the 41 x 10 mm slot at 6 o'clock. Fasten the four corners with the
    four M2x6 self-tapping screws.
  parts:
  - back_box
  hardware:
  - perfboard
  - esp32
  - m2_screw
  tool: small Phillips screwdriver
- n: '4'
  text: Verify the four input wires between the perfboard and the LED disk's 12 o'clock
    input connector are connected and tuck any slack cleanly into the open upper cavity
    above the central stiffening web.
  parts:
  - back_box
  hardware:
  - led_disk
  - perfboard
  tool: null
- n: '5'
  text: Rest the LED disk on the circular perimeter rim and central towers with its
    4-pin input wires at 12 o'clock (top, opposite the USB-C slot). Place an ISO 7089
    M3 washer under each ISO 4762 M3x8 screw and tighten both screws through the two
    centre holes into the heat-set inserts.
  parts:
  - back_box
  hardware:
  - led_disk
  - m3_screw
  - m3_washer
  tool: 2.5 mm hex key
- n: '6'
  text: 'Install two #8 round-head wall screws horizontally 140 mm apart into wall
    anchors, leaving the underside of the screw heads ~4-5 mm off the wall. Align
    the two back keyhole entry holes over the screw heads and slide the box straight
    down so it seats flat against the wall.'
  parts:
  - back_box
  hardware: []
  tool: screwdriver
- n: '7'
  text: Plug the USB-C charger straight through the bottom 6 o'clock slot into the
    ESP32's USB-C port.
  parts:
  - back_box
  hardware:
  - esp32
  tool: null
