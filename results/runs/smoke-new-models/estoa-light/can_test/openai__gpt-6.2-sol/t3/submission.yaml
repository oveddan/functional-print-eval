manual:
- n: '1'
  text: 'Before the full print, try your M2 screw through a perfboard corner on the
    pilot coupon already printed; the center boss is 1.7 mm. Use light hand pressure
    and confirm it grips without splitting. Check the 3.2 mm wall-land gauge on both
    actual #8 wall screws. The 4 mm sample did not fit at the old screw setting. Aim
    for about 3.6 mm between wall and head underside only if the anchor instructions
    allow that setting with adequate engagement. If not, stop rather than hanging
    the light on partially engaged anchors.'
  parts:
  - wall-land-gauge
  hardware:
  - perfboard
  - perf-screws
  tool: Calipers and matching screwdriver
- n: '2'
  text: Print the chassis wall-face down without supports. Use 0.2 mm layers, at least
    five walls and six top and bottom layers. Clear any first-layer lip in the rear
    keyholes and remove stray strands from the side-loading nut pockets. Keep the
    slots narrow enough to retain the wall screw heads.
  parts:
  - rear-chassis
  hardware: []
  tool: null
- n: '3'
  text: With power disconnected, set the perfboard on the four bosses with the ESP32
    port facing the wide bottom notch. Rotate the perfboard 180° in its own plane
    if needed to make the port point down. Check underneath for solder clearance,
    then fasten all four corners gently. Dry-fit the charger plug before covering
    the cavity.
  parts:
  - rear-chassis
  hardware:
  - perfboard
  - esp32
  - perf-screws
  tool: Matching hand screwdriver
- n: '4'
  text: Lay the chassis wall-face down. Slide one M3 nut into each tower from the
    outward-facing side, with flats parallel to the channel walls. Place the disk
    with LEDs out and input at the top. Route the four wires through the top notch
    if they approach from the rim, or directly into the cavity if they exit inside
    the box. Before closing, check that the wires reach without tension, do not cross
    either pad or keyhole, and cannot be pinched. Check that all rear connector and
    component protrusions clear the disk and both pads land on flat PCB. Start both
    M3 screws by hand before tightening either one; snug them only enough to hold
    the PCB without flexing it.
  parts:
  - rear-chassis
  hardware:
  - disk
  - disk-nuts
  - disk-screws
  - perfboard
  tool: 2.5 mm hex key
- n: '5'
  text: Use the actual rear keyholes as a marking template for the two level wall
    anchors, 72 mm center to center. Follow the anchor instructions for your wall
    substrate and verify the head gap with the gauge. Unplug the cable, pass both
    heads through the round entries, and lower the case 10 mm until both heads reach
    the slot ends. Support it while confirming that the back lies flat and cannot
    pull straight away. Lift to remove; do not carry it by the disk.
  parts:
  - rear-chassis
  - wall-land-gauge
  hardware: []
  tool: Level, ruler and tools specified by the wall-anchor manufacturer
- n: '6'
  text: Plug in from below and verify full USB-C engagement after hanging. Do not
    run the 255-LED disk at unrestricted brightness through the ESP32 board. Verify
    that LED power does not pass through a GPIO or the 3.3 V regulator, and set a
    current limit within the verified ratings of the charger, cable, board power path,
    connectors and wiring before use. Test at your intended brightness and stop if
    the plug, boards or PLA get hot or soften. Recheck temperatures and preserve the
    USB and wire openings when you add the diffuser.
  parts:
  - rear-chassis
  hardware:
  - disk
  - perfboard
  - esp32
  tool: null
