parts:
- id: rear-chassis
  role: final
  material: Matte-white PLA; standard black PLA is suitable for fit checks
  code: "def build(p):\n    def wp(z=0):\n        return cq.Workplane('XY').workplane(offset=z)\n\
    \    def rect(x,y,w,h,z,d):\n        return wp(z).center(x,y).rect(w,h).extrude(d)\n\
    \    def rr(x,y,w,h,z,d,r):\n        return rect(x,y,w,h,z,d).edges('|Z').fillet(r)\n\
    \    def cyl(x,y,d,z,h):\n        return wp(z).center(x,y).circle(d/2).extrude(h)\n\
    \    e=0.2\n    yc=(p.case_y0+p.case_y1)/2\n    h=p.case_y1-p.case_y0\n    a=rr(0,yc,p.case_w,h,0,p.rim_z,p.corner_r)\n\
    \    a=a.cut(rr(0,yc,p.case_w-2*p.wall_t,h-2*p.wall_t,p.base_t,p.rim_z-p.base_t+e,p.corner_r-p.wall_t))\n\
    \    for y,w,z in [(p.case_y0,p.usb_open_w,p.usb_open_bottom),(p.case_y1,p.wire_open_w,p.wire_open_bottom)]:\n\
    \        a=a.cut(rect(0,y,w,2*(p.wall_t+e),z,p.rim_z-z+e))\n    for x in [-p.wall_pitch/2,p.wall_pitch/2]:\n\
    \        y=p.wall_entry_y\n        q=cyl(x,y,p.wall_entry_d,-e,p.base_t+2*e)\n\
    \        q=q.union(rect(x,y+p.wall_drop/2,p.wall_slot_d,p.wall_drop,-e,p.base_t+2*e))\n\
    \        q=q.union(cyl(x,y+p.wall_drop,p.wall_slot_d,-e,p.base_t+2*e))\n     \
    \   a=a.cut(q)\n        a=a.cut(rr(x,y+p.wall_drop/2,14,p.wall_drop+14,p.wall_land_t,p.base_t-p.wall_land_t+e,3))\n\
    \    bx=p.perf_w/2-p.perf_hole_edge_gap-p.perf_hole_d/2\n    by=p.perf_l/2-p.perf_hole_edge_gap-p.perf_hole_d/2\n\
    \    bz=p.base_t+p.perf_standoff_h\n    for x in [-bx,bx]:\n        for y in [p.perf_y-by,p.perf_y+by]:\n\
    \            a=a.union(cyl(x,y,p.perf_boss_d,p.base_t-e,p.perf_standoff_h+e))\n\
    \            a=a.cut(cyl(x,y,p.perf_pilot_d,bz-(p.m2_l-p.perf_t)-0.7,(p.m2_l-p.perf_t)+0.7+e))\n\
    \    a=a.union(rect(0,0,p.disk_hole_pitch,6,p.base_t-e,25))\n    for side in [-1,1]:\n\
    \        x=side*p.disk_hole_pitch/2\n        loft=wp(p.base_t-e).center(x,0).rect(19,16).workplane(offset=29-(p.base_t-e)).rect(13,11).loft(combine=True)\n\
    \        a=a.union(loft)\n        block_top=p.disk_back_z-1.6\n        a=a.union(rect(x,0,13,11,29-e,block_top-29+e))\n\
    \        a=a.union(cyl(x,0,p.disk_pad_d,block_top-e,1.6+e))\n        nut_top=p.disk_back_z-p.nut_roof_t\n\
    \        a=a.cut(rect(x+side*1.25,0,11.5,p.nut_pocket_w,nut_top-p.nut_pocket_h,p.nut_pocket_h))\n\
    \        z=p.disk_back_z+p.disk_t-p.m3_l-1.2\n        a=a.cut(wp(z).center(x,0).slot2D(p.screw_slot_l,p.screw_slot_w,0).extrude(p.disk_back_z-z+e))\n\
    \    return a"
  print_orientation: Wall-facing back on the bed, z = 0; component bosses and sides
    up. Print without supports. The sideways nut-pocket ceiling spans at most about
    6 mm.
  use_orientation: Wall-facing back against the wall; keyhole slots point upward from
    their round entries, and the wide USB notch is at the bottom.
- id: wall-land-gauge
  role: coupon
  material: PLA
  code: "def build(p):\n    e=0.2\n    a=cq.Workplane('XY').center(0,p.wall_drop/2).rect(24,p.wall_drop+22).extrude(p.wall_land_t)\n\
    \    w=cq.Workplane('XY').workplane(offset=-e)\n    a=a.cut(w.circle(p.wall_entry_d/2).extrude(p.wall_land_t+2*e))\n\
    \    a=a.cut(cq.Workplane('XY').workplane(offset=-e).center(0,p.wall_drop/2).rect(p.wall_slot_d,p.wall_drop).extrude(p.wall_land_t+2*e))\n\
    \    return a.cut(cq.Workplane('XY').workplane(offset=-e).center(0,p.wall_drop).circle(p.wall_slot_d/2).extrude(p.wall_land_t+2*e))"
  print_orientation: Flat on the bed.
  use_orientation: Round entry below the slot. Test on the actual installed wall screws
    before printing or loading the chassis.
