task: estoa-light
note: One-piece rear chassis only; the frosted front and sides are not included. The
  chassis is 112 × 139 mm in plan and reaches 45 mm from the wall to the back of the
  centered 242 mm disk. The disk mounts on two small pads with laterally floating
  M3 nuts. The bottom opening accepts the USB-C plug without relying on the unconfirmed
  exact port position. The wall coupon printed correctly but did not engage the screws
  at their existing setting; the final design uses a thinner 3.2 mm hanging land and
  still requires a verified under-head gap. Print in matte-white PLA if available;
  fit checks can be made in the supplied black PLA.
questions:
- text: What is the exact USB-C mouth center in the perfboard frame?
  answer: Not confirmed. Assembly shows a nominal position inferred from the reported
    offsets. Orient the board with its USB-C port down; the 64 mm-wide opening accommodates
    lateral uncertainty.
- text: What are the disk’s rear connector clearance and the maximum installed perfboard
    envelope?
  answer: Not confirmed. Dry-fit the connected boards before wall installation. Check
    the rear of the disk at both support pads, the connector and wires, solder-lead
    clearance, and all component heights.
