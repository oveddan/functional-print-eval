task: estoa-light
note: 'Two-piece, support-free wall box: a wall tray and a removable crossbar. The
  LED disk itself closes the front; no diffuser or transparent sides are included.
  The under-edge USB opening is deliberately wide because the exact USB-C mouth position
  was not obtained. The assembly shows its estimated position, not a drilled-port
  location. Use matte white PLA if available; the confirmed black PLA is a fit-test
  or fallback material. The user''s #8 screws and anchors are external wall fixings.'
questions:
- text: What is the actual spacing of the disk mounting holes?
  answer: 33.50 mm centre-to-centre, derived from the measured 30.20 mm inside-edge
    gap plus the 3.30 mm hole diameter.
- text: Does the insert pilot fit the actual inserts?
  answer: The printed coupon confirmed that both 4.3 mm pilots seated and held an
    insert. It did not confirm the complete PCB fit or the M2 pilot.
- text: What is still to verify on the actual assembly?
  answer: USB direction, mouth position and cable clearance; wire reach and rear protrusions
    on the disk; tallest non-ESP32 component and solder clearance; and actual fit
    of the installed wall screw heads and shanks.
