manual:
- n: '1'
  text: Print the tray and crossbar in the supplied orientations, at 0.2 mm with the
    0.4 mm nozzle, supports off. Use four or five walls; inspect the two keyhole necks
    for first-layer flare and remove any burrs without widening the necks. Use matte
    white PLA for the visible finish if you have it; black high-speed PLA works for
    fit checking.
  parts:
  - wall-tray
  - disk-crossbar
  hardware: []
  tool: null
- n: '2'
  text: With the electronics away from the workbench, heat-set two M3 inserts flush
    or just below the tops of the tray towers and two flush or just below the crossbar's
    raised disk pads. Keep the inserts square. Let them cool, then check that both
    screw lengths start freely in their respective locations.
  parts:
  - wall-tray
  - disk-crossbar
  hardware:
  - inserts
  - disk-screws
  - bar-screws
  tool: Heat-set tip and 2.5 mm hex key
- n: '3'
  text: Bench-fit the perfboard component-side up with the USB mouth pointing toward
    the broad bottom opening. The two boss patterns allow the 70 mm or 50 mm edge
    to run along the vertical axis; choose the set that points the USB downward. Check
    solder clearance and try one self-tapper in an unused boss. Then use four M2x6
    screws, starting them by hand and stopping when snug; the perfboard holes are
    close to the edges. With the crossbar loosely fitted, verify capacitor clearance
    and try the actual USB plug. If the mouth does not face out of the lower opening
    or the plug cannot fully insert, correct the fit before installing on the wall;
    do not force the plug.
  parts:
  - wall-tray
  - disk-crossbar
  hardware:
  - perf
  - esp
  - board-screws
  - bar-screws
  tool: Driver matched to the M2 screws, 2.5 mm hex key
- n: '4'
  text: 'Use the actual tray as a template. Mark the centres of the two narrow upper
    keyhole ends, 92 mm apart on a level line. Use the user''s #8 screws and 1/4-inch
    anchors only if rated for the actual wall and installed per their instructions;
    check for concealed services before drilling. Start with about 3.5 mm from the
    wall to the underside of each head, while preserving the required anchor engagement.
    Pass the round entries over both heads, then lower the tray about 10 mm. Verify
    that both heads capture the narrow ends and the tray sits flat; adjust gaps if
    needed. Route the charger lead so it cannot tug or lift the tray out of its keyholes.'
  parts:
  - wall-tray
  hardware: []
  tool: Level, drill and driver appropriate to the wall fixings
- n: '5'
  text: Secure the crossbar with the two recessed M3x12 screws with the disk pads
    facing out. Support the unpowered disk close to the tray and connect the four
    wires. Route them directly into the open cavity if they emerge on the back, or
    through the top relief if they approach from the rim. Keep wires out of the screw
    seats, avoid sharp bends, and leave enough slack to start both disk screws. Confirm
    rear components clear the pads and rails; never draw the disk down against a protrusion
    or a trapped wire.
  parts:
  - wall-tray
  - disk-crossbar
  hardware:
  - disk
  - perf
  - bar-screws
  tool: 2.5 mm hex key
- n: '6'
  text: With the input-wire side at 12 o'clock, pass both M3x6 screws through the
    disk holes and start both before tightening gently and evenly. Recheck USB-C access
    from below with the disk installed. Before powering the LEDs, verify the disk
    gets regulated 5 V and that the supply, connector, perfboard wiring and power
    path can handle the configured maximum LED current. Do not assume the DevKit's
    USB-C power path can supply this 255-pixel disk, and do not enable full brightness
    without verifying the power path and temperature. Keep both openings clear.
  parts:
  - wall-tray
  - disk-crossbar
  hardware:
  - disk
  - esp
  - disk-screws
  tool: 2.5 mm hex key
