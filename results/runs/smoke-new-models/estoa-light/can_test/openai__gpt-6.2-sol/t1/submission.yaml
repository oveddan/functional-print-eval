parts:
- id: wall-tray
  role: final
  material: Matte white PLA if available; otherwise black high-speed PLA
  code: "def build(p):\n    def rect(w,l,h,x=0,y=0,z=0):\n        return cq.Workplane('XY').workplane(offset=z).center(x,y).rect(w,l).extrude(h)\n\
    \    def cyl(d,h,x,y,z):\n        return cq.Workplane('XY').workplane(offset=z).center(x,y).circle(d/2).extrude(h)\n\
    \    w,L,H,t=p.box_w,p.box_y,p.rim_z,p.wall_t\n    tray=rect(w,L,H).cut(rect(w-2*t,L-2*t,H,0,0,p.floor_t))\n\
    \    # Open-ended cable portals; never bridge across them.\n    tray=tray.cut(rect(p.usb_open_w,2*t,H,0,-L/2,p.usb_open_sill_z))\n\
    \    tray=tray.cut(rect(p.wire_open_w,2*t,H,0,L/2,p.wire_open_sill_z))\n    seat_z=H-p.crossbar_t\n\
    \    for sign in (-1,1):\n        x=sign*p.tower_x\n        tray=tray.union(cyl(p.tower_d,seat_z,x,0,0))\n\
    \        tray=tray.cut(cyl(p.insert_pilot,p.insert_tray_bore_depth+0.1,x,0,seat_z-p.insert_tray_bore_depth))\n\
    \        for sy in (-1,1):\n            tray=tray.union(rect(t,p.rim_pad_length,p.pad_raise+0.2,sign*(w-t)/2,sy*p.rim_pad_y,H-0.2))\n\
    \    # Two interchangeable PCB rotations; unused bosses sit outside the board\
    \ footprint.\n    off=p.perf_hole_edge_gap+p.perf_hole_d/2\n    a=p.perf_width/2-off\n\
    \    b=p.perf_length/2-off\n    for hx,hy in ((a,b),(b,a)):\n        for sx in\
    \ (-1,1):\n            for sy in (-1,1):\n                x,y=sx*hx,sy*hy\n  \
    \              tray=tray.union(cyl(p.perf_boss_d,p.perf_bottom_z,x,y,0))\n   \
    \             tray=tray.cut(cyl(p.m2_pilot,p.m2_length+0.1,x,y,p.perf_bottom_z-p.m2_length))\n\
    \    for x in (-p.wall_pitch/2,p.wall_pitch/2):\n        y=p.wall_key_entry_y\n\
    \        end=y+p.wall_key_travel\n        k=p.wall_key_neck\n        entry=cyl(p.wall_head_d_max+p.wall_entry_extra,p.floor_t+2,x,y,-1)\n\
    \        neck=rect(k,p.wall_key_travel,p.floor_t+2,x,(y+end)/2,-1)\n        cap=cyl(k,p.floor_t+2,x,end,-1)\n\
    \        tray=tray.cut(entry.union(neck).union(cap))\n    return tray"
  print_orientation: Wall-contact back flat on bed, open cavity and all insert/pilot
    bores upward. No supports.
  use_orientation: Back against wall; broad USB opening at bottom, wire notch at top.
    PCB component side faces forward.
- id: disk-crossbar
  role: final
  material: Matte white PLA if available; otherwise black high-speed PLA
  code: "def build(p):\n    h=p.crossbar_t\n    bar=cq.Workplane('XY').rect(p.crossbar_x,p.crossbar_y).extrude(h)\n\
    \    pitch=p.disk_inside_gap+p.disk_hole_d\n    for x in (-pitch/2,pitch/2):\n\
    \        bar=bar.union(cq.Workplane('XY').workplane(offset=h-0.2).center(x,0).circle(p.disk_pad_d/2).extrude(p.pad_raise+0.2))\n\
    \        bar=bar.cut(cq.Workplane('XY').workplane(offset=-1).center(x,0).circle(p.insert_pilot/2).extrude(h+p.pad_raise+2))\n\
    \    depth=p.m3_head_h+p.recess_extra_depth\n    for x in (-p.tower_x,p.tower_x):\n\
    \        bar=bar.cut(cq.Workplane('XY').workplane(offset=-1).center(x,0).circle(p.crossbar_clear_d/2).extrude(h+2))\n\
    \        bar=bar.cut(cq.Workplane('XY').workplane(offset=h-depth).center(x,0).circle((p.m3_head_d+p.recess_extra_d)/2).extrude(depth+1))\n\
    \    return bar"
  print_orientation: Flat underside on bed, contact pads and counterbores upward.
    No supports.
  use_orientation: Horizontal across tray; pad faces toward the LED disk.
