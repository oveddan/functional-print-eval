parts:
- id: rear_box
  role: final
  material: Matte-white PLA
  code: "def build(p):\n    def poly(pts,z,h):\n        return cq.Workplane('XY',origin=(0,0,z)).polyline(pts).close().extrude(h)\n\
    \    def box(x,y,z,w,l,h):\n        return cq.Workplane('XY',origin=(x,y,z)).box(w,l,h,centered=(True,True,False))\n\
    \    def cyl(x,y,z,d,h):\n        return cq.Workplane('XY',origin=(x,y,z)).circle(d/2).extrude(h)\n\
    \    f,front,r = p.base_t,p.front_z,p.rim_t\n    rz = front-p.rim_gap\n    out\
    \ = [(-62,-90),(-48,-110),(48,-110),(62,-90),(62,69),(-62,69)]\n    a = 62-r\n\
    \    inn = [(-a,-88),(-45,-110+r),(45,-110+r),(a,-88),(a,69-r),(-a,69-r)]\n  \
    \  w = poly(out,0,rz).cut(poly(inn,f,front))\n    w = w.cut(box(0,-104,f,p.usb_bay_w,54,front)).cut(box(0,69,f,p.wire_bay_w,24,front))\n\
    \    for s in (-1,1):\n        for y in (24,-58):\n            w = w.union(box(s*(62-r/2),y,rz-0.2,r,8,p.rim_gap+0.2))\n\
    \        x,yh = s*p.wall_pitch/2,p.wall_y\n        ye = yh-p.wall_drop\n     \
    \   w = w.cut(cyl(x,ye,-0.2,p.wall_entry,f+0.4))\n        w = w.cut(box(x,(ye+yh)/2,-0.2,p.wall_slot,p.wall_drop,f+0.4))\n\
    \        w = w.cut(cyl(x,yh,-0.2,p.wall_slot,f+0.4))\n        x = s*p.disk_pitch/2\n\
    \        tower = cq.Workplane('XY',origin=(x,0,f-0.2)).circle(9).workplane(offset=front-f-5.8).circle(6).loft(combine=True)\n\
    \        cap = cq.Workplane('XY',origin=(x,0,front-6.1)).circle(6).workplane(offset=6.1).circle(4).loft(combine=True)\n\
    \        w = w.union(tower).union(cap)\n        w = w.cut(cyl(x,0,front-p.insert_depth,p.insert_bore,p.insert_depth+0.2))\n\
    \        for v in (-1,1):\n            sx,sy = s*p.carrier_half_pitch,p.carrier_y+v*p.carrier_half_pitch\n\
    \            w = w.union(cyl(sx,sy,f-0.2,10,p.landing_h+0.2))\n            if\
    \ v==1:\n                w = w.cut(cyl(sx,sy,f+p.landing_h-p.insert_depth,p.insert_bore,p.insert_depth+0.2))\n\
    \    return w"
  print_orientation: Flat wall-facing back at z=0, open front up; no supports.
  use_orientation: Flat against wall, +Y up, wide USB bay below; top opening for wiring
    and ventilation.
- id: perf_carrier
  role: final
  material: Matte-white PLA
  code: "def build(p):\n    d,w,t = p.carrier_half_pitch,8,p.carrier_t\n    e = p.perf_edge_gap+p.perf_hole_d/2\n\
    \    a,b = p.perf_w/2-e,p.perf_l/2-e\n    def bar(x,y,dx,dy):\n        return\
    \ cq.Workplane('XY',origin=(x,y,0)).box(dx,dy,t,centered=(True,True,False))\n\
    \    s = bar(0,d,2*d+w,w).union(bar(-d,0,w,2*d+w)).union(bar(0,-d,2*d+w,w)).union(bar(d,0,w,2*d+w))\n\
    \    for x in (-a,a):\n        s = s.union(bar(x,0,8,2*d+w))\n        for y in\
    \ (-b,b):\n            s = s.union(cq.Workplane('XY',origin=(x,y,t-0.2)).circle(3.5).extrude(p.perf_post_h+0.2))\n\
    \            s = s.cut(cq.Workplane('XY',origin=(x,y,t+p.perf_post_h-p.m2_pilot_depth)).circle(p.m2_pilot/2).extrude(p.m2_pilot_depth+0.2))\n\
    \    for x in (-d,d):\n        for y in (-d,d):\n            s = s.cut(cq.Workplane('XY',origin=(x,y,-0.2)).circle(p.m3_clear/2).extrude(t+0.4))\n\
    \    return s"
  print_orientation: Lattice flat at z=0; posts up, no supports.
  use_orientation: Posts toward LED disk. Rotate in 90-degree increments until USB
    points out of the lower bay.
