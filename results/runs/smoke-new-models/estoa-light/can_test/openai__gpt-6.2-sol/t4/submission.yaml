manual:
- n: '1'
  text: Print both parts flat at 0.20 mm with at least four walls and no supports.
    Use matte-white PLA for the final parts if available; the specified black PLA
    is suitable for fit checks. Deburr the rear keyholes and remove stringing from
    bores.
  parts:
  - rear_box
  - perf_carrier
  hardware: []
  tool: null
- n: '2'
  text: 'Heat-set four inserts: two in the disk towers and two in the upper carrier
    landings. Keep the inserts perpendicular, about 0.4 mm below the seating faces.
    The lower carrier landings are plain supports. Let all inserts cool before threading
    screws.'
  parts:
  - rear_box
  hardware:
  - inserts
  tool: Heat-set tip or temperature-controlled soldering iron
- n: '3'
  text: Dry-fit the populated perfboard on the four posts; confirm solder tails clear
    the plastic and screw heads miss exposed conductors. Gently start and snug the
    four M2 self-tappers. Rotate the carrier until USB points down through the wide
    opening. Use two M3×8 screws in the carrier holes nearest the top and leave the
    other two holes empty.
  parts:
  - rear_box
  - perf_carrier
  hardware:
  - perf
  - esp
  - perf_screws
  - carrier_screws
  tool: null
- n: '4'
  text: With power disconnected, orient the disk LEDs-out and input wires up at 12
    o’clock. Route the input wiring through the upper opening as needed. Verify the
    wire reaches with service slack, the tallest components and rear solder clear
    the disk, and nothing is trapped on a rim or tower. Both M3 heads must rest flat
    on electrically safe lands. Start both M3×6 screws by hand, then gently snug.
    Stop if the board rocks, the holes do not line up freely, or a screw head fouls
    a component or conductor.
  parts:
  - rear_box
  - perf_carrier
  hardware:
  - disk
  - perf
  - disk_screws
  tool: null
- n: '5'
  text: Before drilling the wall, place the back flush against a flat surface and
    fully seat and remove the actual USB-C plug from below with the disk fitted. Leave
    space for fingers and cable bend. If it does not seat by hand, do not force it.
    Verify current against every part of the charger-to-disk power path, including
    the DevKit and wiring; do not run unrestricted full white through the DevKit.
    Use a conservative brightness/current limit and verify temperatures stay suitable
    for PLA. Keep both bays open.
  parts:
  - rear_box
  - perf_carrier
  hardware:
  - disk
  - perf
  - esp
  tool: null
- n: '6'
  text: 'Mark two level wall screw centers 86 mm apart. Use the supplied #8 round-head
    screws and 1/4-inch anchors only if rated for the actual wall and completed light.
    Leave about 3.5 mm between the wall and each head underside. With the light unplugged
    and supported, put the two heads through the large entries and lower the box 9
    mm to the closed ends. Check that the back is flat, both heads are captured and
    there is minimal play. Support the case when disconnecting USB; lift the box off
    both screws for service rather than pulling on the disk.'
  parts:
  - rear_box
  hardware: []
  tool: Level, drill appropriate to wall and anchors, screwdriver
