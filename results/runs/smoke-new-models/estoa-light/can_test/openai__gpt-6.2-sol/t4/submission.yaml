task: estoa-light
note: 'Support-free rear wall box and rotatable perfboard carrier only; no diffuser
  or decorative sides. DotStar PCB is the removable front. The two user-supplied #8
  wall screws and their anchors are external wall fixtures, not catalog assembly hardware.
  Their nominal head centers are (-43,48,3.5) and (43,48,3.5) mm in the assembly frame,
  pointing toward the wall. The exact USB mouth position and exit edge were not confirmed:
  the assembly shows a nominal short-edge exit; rotate the carrier as needed and validate
  access with the real cable before wall installation.'
questions:
- text: LED PCB mounting pitch?
  answer: 33.5 mm, from 30.2 mm between the inner edges of two 3.3 mm holes.
- text: Does the insert pilot work?
  answer: Both 4.3 mm coupon pilots accepted their inserts and held. Actual disk seating
    and head clearance were not reported.
