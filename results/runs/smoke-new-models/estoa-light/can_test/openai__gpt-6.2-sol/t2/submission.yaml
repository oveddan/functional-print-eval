parts:
- id: wall_box
  role: final
  material: Matte white PLA
  code: "def build(p):\n    eps=0.15\n    w=p.case_w; lo=p.case_y_min; hi=p.case_y_max;\
    \ t=p.case_wall_t\n    def slab(x0,x1,y0,y1,z0,z1):\n        return (cq.Workplane('XY',origin=((x0+x1)/2,(y0+y1)/2,z0))\n\
    \                .rect(x1-x0,y1-y0).extrude(z1-z0))\n    def cyl(x,y,z,r,h):\n\
    \        return cq.Workplane('XY',origin=(x,y,z)).circle(r).extrude(h)\n    a=slab(-w/2,w/2,lo,hi,0,p.rim_z)\n\
    \    a=a.cut(slab(-w/2+t,w/2-t,lo+t,hi-t,p.base_t,p.rim_z+eps))\n    a=a.cut(slab(-p.usb_open_w/2,p.usb_open_w/2,lo-eps,lo+t+eps,p.usb_open_floor,p.rim_z+eps))\n\
    \    a=a.cut(slab(-p.wire_notch_w/2,p.wire_notch_w/2,hi-t-eps,hi+eps,p.wire_notch_floor,p.rim_z+eps))\n\
    \    for x in (-p.wall_screw_pitch/2,p.wall_screw_pitch/2):\n        y=p.wall_entry_y\n\
    \        a=a.cut(cyl(x,y,-eps,p.wall_entry_d/2,p.base_t+2*eps))\n        throat=(cq.Workplane('XY',origin=(x,y+p.wall_slide/2,-eps))\n\
    \                .slot2D(p.wall_slide+p.wall_throat_w,p.wall_throat_w,90)\n  \
    \              .extrude(p.base_t+2*eps))\n        a=a.cut(throat)\n    for sign\
    \ in (-1,1):\n        x=sign*(p.disc_hole_gap+p.disc_hole_d)/2\n        z=p.base_t-eps\n\
    \        flare=cq.Solid.makeCone(p.disc_boss_base_d/2,p.disc_boss_d/2,p.disc_boss_flare_h,cq.Vector(x,0,z),cq.Vector(0,0,1))\n\
    \        a=a.union(flare).union(cyl(x,0,z,p.disc_boss_d/2,p.disc_back_z-z))\n\
    \        a=a.cut(cyl(x,0,p.disc_back_z-p.insert_pilot_depth,p.insert_pilot_d/2,p.insert_pilot_depth+eps))\n\
    \    edge=p.perf_hole_edge_gap+p.perf_hole_d/2\n    top=p.base_t+p.perf_standoff_h\n\
    \    for sx in (-1,1):\n        for sy in (-1,1):\n            x=sx*(p.perf_w/2-edge);\
    \ y=p.perf_y+sy*(p.perf_l/2-edge)\n            a=a.union(cyl(x,y,p.base_t-eps,p.perf_standoff_d/2,p.perf_standoff_h+eps))\n\
    \            a=a.cut(cyl(x,y,p.base_t,p.m2_pilot_d/2,p.perf_standoff_h+eps))\n\
    \    return a.clean()"
  print_orientation: Flat wall face on the bed (z=0), open front up. No supports.
    Use 4–5 perimeter walls at 0.2 mm layer height; check the keyhole mouths for first-layer
    flare.
  use_orientation: Flat back against the wall, disk facing outward (+z), wire notch
    up and USB opening down.
