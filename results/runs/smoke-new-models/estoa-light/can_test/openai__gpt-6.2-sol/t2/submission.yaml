task: estoa-light
note: One-piece, open-front wall box, 72 × 141 × 38 mm, concealed behind the measured
  Ø242 mm disk in a straight-on view. The disk mounts on two heat-set bosses; the
  perfboard sits below them. A broad bottom opening gives the USB-C plug a straight
  approach after the disk is installed, and a separate top notch routes the disk wires
  without pinching them. The coupon confirmed the 4.3 mm insert pocket only. Verify
  the remaining fits on the bench before mounting. Matte white PLA is the requested
  finish; the listed black PLA is suitable for a fit print. The diffuser and transparent
  sides are out of scope.
questions:
- text: Where is the disk’s rear connector, and how much free wire is available?
  answer: Not confirmed. The front is open and the top rim is notched for wires coming
    from outside the box footprint. Check connector clearance and wire slack with
    the disk resting on both bosses.
- text: Was the exact USB-C mouth location confirmed?
  answer: No. The assembly shows an approximate mouth location. The large bottom opening
    is not indexed to its lateral position. Orient the 50 mm perfboard edge with the
    USB-C port toward the bottom and dry-fit the actual plug before hanging.
