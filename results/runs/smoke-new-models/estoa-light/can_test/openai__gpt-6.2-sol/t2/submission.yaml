manual:
- n: '1'
  text: 'Print the box wall-face down. Clean any first-layer lip from the keyholes
    and keep the screw pilots round. Before adding electronics, try both existing
    #8 screws in the keyholes: heads enter the round openings, shanks slide into the
    narrow ends, and the heads cannot pull through there.'
  parts:
  - wall_box
  hardware: []
  tool: Deburring tool if needed
- n: '2'
  text: Heat-set the two M3 inserts straight into the tall bosses, flush or just below
    their faces. Let them cool. Check the disk rests on the two pads and that both
    M3x6 screws start easily without a head or pad bearing on a nearby electronic
    component. Remove the disk again.
  parts:
  - wall_box
  hardware:
  - disk_insert
  - disk
  - disk_screw
  tool: Heat-set tip and 2.5 mm hex key
- n: '3'
  text: Place the perfboard over the four short standoffs, component side outward,
    USB-C mouth facing the wide lower opening. Check solder tails and terminals clear
    the box. Start all four M2x6 screws before snugging any of them. Tighten by hand
    only until the board stops moving.
  parts:
  - wall_box
  hardware:
  - perfboard
  - esp32
  - perf_screw
  tool: Driver matching the M2 screws
- n: '4'
  text: Connect the disk wires. If they approach the box from above, run them through
    the upper notch. Leave service slack inside, away from keyholes and screw tips.
    Check the rear plug and wiring do not lift the disk off either pad. Fit both M3x6
    screws finger-snug, without flexing the PCB. Hold the back against a flat surface
    and confirm the charger plug can be fully seated and removed from below with the
    disk in place.
  parts:
  - wall_box
  hardware:
  - perfboard
  - esp32
  - disk
  - disk_screw
  tool: 2.5 mm hex key
- n: '5'
  text: 'Using the existing #8 screws and suitable anchors, set the screw centers
    level and 50 mm apart. In the final hanging position the centers will be 21 mm
    above the disk center. Aim for 4.5 mm from the wall to each head underside, but
    only if the screws still engage the anchors adequately. Keep the cable unplugged.
    Support the box, pass both heads through the round entries, and lower it 9 mm
    into the narrow ends. Verify both heads are captured and the back sits flat before
    letting go.'
  parts:
  - wall_box
  hardware: []
  tool: Level, ruler, and driver matching the wall screws
- n: '6'
  text: 'Plug in from below without levering on the USB-C port. Start at low brightness.
    Don''t route full-disk current through the ESP32 board: verify the current limit
    of the existing power path and set a brightness limit accordingly. Check for heating
    before prolonged use, and repeat that check when the diffuser is added.'
  parts:
  - wall_box
  hardware:
  - disk
  - perfboard
  - esp32
  tool: null
