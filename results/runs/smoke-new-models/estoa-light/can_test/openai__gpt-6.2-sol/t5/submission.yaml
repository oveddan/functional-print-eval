manual:
- n: '1'
  text: Print both parts as modeled, flat on the bed, at 0.20 mm with at least four
    wall loops and supports off. Matte white PLA gives the requested finish if available.
    Check the keyholes and remove first-layer flash without widening the narrow slots
    unnecessarily.
  parts:
  - wall-box
  - disk-bridge
  hardware: []
  tool: null
- n: '2'
  text: Dry-fit before heat-setting or drilling. Try the wall screws in both keyholes.
    Place the perfboard on the posts and check underside solder and above-board component
    clearance with the bridge in place. Check both contact areas on the disk and the
    wire slack. With the box against a flat surface and the disk held in position,
    try reaching and seating the actual USB-C plug. Stop if any check fails; those
    clearances have not all been measured.
  parts:
  - wall-box
  - disk-bridge
  hardware:
  - disk-screw
  - led
  - perf
  - esp
  tool: null
- n: '3'
  text: With electronics removed, heat-set two M3 inserts flush into the box bosses
    and two flush into the disk pads. Keep them square and allow the PLA to cool.
  parts:
  - wall-box
  - disk-bridge
  hardware:
  - m3-insert
  tool: Soldering iron with heat-set tip
- n: '4'
  text: Install the perfboard with components facing out and the USB-C port pointing
    down toward the wide notch. Start the four M2 self-tapping screws straight and
    snug gently. Check that no solder touches the floor and the board is flat.
  parts:
  - wall-box
  hardware:
  - perf
  - esp
  - perf-screw
  tool: Driver matching the M2 screws
- n: '5'
  text: Fasten the bridge with the two M3x12 screws and washers, initially leaving
    it just loose enough to shift. With power disconnected, route the four wires around
    the bridge and use the upper notch if needed. Trial-fit both M3x6 disk screws,
    center the disk, then remove it and snug the bridge screws without shifting the
    bridge. Refit the disk, starting both M3x6 screws before snugging either. Do not
    force alignment, pinch the wires or substitute longer disk screws.
  parts:
  - wall-box
  - disk-bridge
  hardware:
  - bridge-screw
  - bridge-washer
  - disk-screw
  - led
  - perf
  tool: 2.5 mm hex key
- n: '6'
  text: 'Confirm the user''s 1/4-inch anchors and #8 round-head screws are suitable
    for the actual wall and the completed light including the later diffuser. Mark
    the upper ends of the two narrow slots level and 68 mm apart. Follow the anchor
    instructions and leave about 4.2 mm under each screw head only if that preserves
    required engagement. Pass the two round entries over the heads and lower the box
    13 mm so both shanks settle into the upper ends. Check that both heads are captured,
    the box is close to the wall, and it does not rock. Support the light when applying
    any upward force; the gravity keyholes can lift off.'
  parts:
  - wall-box
  hardware: []
  tool: Level, drill and driver suited to the existing wall fixings
- n: '7'
  text: 'Support the light against lifting and plug in from below. Check that the
    intended brightness fits the ratings of the charger, ESP32 supply path, connectors
    and wiring. Do not test at full-white/full-brightness by default: 255 LEDs can
    draw more current than the dev-board USB supply path can carry. Check operating
    temperatures and repeat the check after adding the diffuser.'
  parts:
  - wall-box
  - disk-bridge
  hardware:
  - esp
  - led
  - perf
  tool: null
