task: estoa-light
note: 'Rear enclosure only. Two no-support prints: a wall box and detachable disk
  bridge. The open bottom notch provides direct ESP32 USB-C access with the disk on.
  The user''s existing #8 wall screws and 1/4-inch anchors are external wall hardware,
  not catalog parts. Nominal seated screw-head undersides are at (±34,29,4.2) mm,
  pointing into the wall.'
