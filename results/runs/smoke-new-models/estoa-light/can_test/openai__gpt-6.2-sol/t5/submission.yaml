parts:
- id: wall-box
  role: final
  material: PLA (matte white if available, otherwise listed black PLA)
  code: "def build(p):\n    def slab(w,l,h,x=0,y=0,z=0):\n        return cq.Workplane('XY').workplane(offset=z).center(x,y).rect(w,l).extrude(h)\n\
    \    def cyl(d,h,x,y,z):\n        return cq.Workplane('XY').workplane(offset=z).center(x,y).circle(d/2).extrude(h)\n\
    \    e=0.02\n    b=slab(p.box_w,p.box_l,p.box_h)\n    b=b.cut(slab(p.box_w-2*p.shell_t,p.box_l-2*p.shell_t,p.box_h-p.floor_t+e,z=p.floor_t))\n\
    \    for s in (-1,1):\n        x=s*p.bridge_bolt_pitch/2\n        b=b.union(cyl(p.bridge_box_boss_d,p.box_h-p.floor_t+e,x,0,p.floor_t-e))\n\
    \        b=b.cut(cyl(p.insert_pilot_d,p.insert_bore_depth+e,x,0,p.box_h-p.insert_bore_depth))\n\
    \    for s,w,z in ((-1,p.usb_open_w,p.usb_open_low),(1,p.wire_open_w,p.wire_open_low)):\n\
    \        b=b.cut(slab(w,p.shell_t+2*e,p.box_h-z+e,y=s*(p.box_l-p.shell_t)/2,z=z))\n\
    \    for s in (-1,1):\n        x=s*p.key_pitch/2\n        y=p.key_entry_y\n  \
    \      h=p.floor_t+2*e\n        b=b.cut(cyl(p.key_entry_d,h,x,y,-e))\n       \
    \ b=b.cut(slab(p.key_slot_w,p.key_travel,h,x,y+p.key_travel/2,-e))\n        b=b.cut(cyl(p.key_slot_w,h,x,y+p.key_travel,-e))\n\
    \    setback=p.perf_hole_edge_gap+p.perf_hole_d/2\n    for sx in (-1,1):\n   \
    \     for sy in (-1,1):\n            x=sx*(p.perf_w/2-setback)\n            y=sy*(p.perf_l/2-setback)\n\
    \            b=b.union(cyl(p.perf_post_d,p.perf_seat_z-p.floor_t+e,x,y,p.floor_t-e))\n\
    \            b=b.cut(cyl(p.m2_pilot,p.m2_pilot_depth+e,x,y,p.perf_seat_z-p.m2_pilot_depth))\n\
    \    return b"
  print_orientation: Exterior wall-contact face on the bed, at local z=0. Cavity and
    all pilots up. No supports.
  use_orientation: Back against the wall, broad USB notch down, smaller wire notch
    up.
- id: disk-bridge
  role: final
  material: PLA (matte white if available, otherwise listed black PLA)
  code: "def build(p):\n    e=0.02\n    b=cq.Workplane('XY').rect(p.bridge_w,p.bridge_y_size).extrude(p.bridge_t)\n\
    \    for s in (-1,1):\n        x=s*p.bridge_bolt_pitch/2\n        cutter=cq.Workplane('XY').workplane(offset=-e).center(x,0).slot2D(p.bridge_slot_l,p.bridge_slot_w,0).extrude(p.bridge_t+2*e)\n\
    \        b=b.cut(cutter)\n    seat=p.bridge_t+p.disk_pad_h\n    for s in (-1,1):\n\
    \        x=s*(p.disk_hole_inner_gap+p.disk_hole_d)/2\n        pad=cq.Workplane('XY').workplane(offset=p.bridge_t-e).center(x,0).circle(p.disk_pad_d/2).extrude(p.disk_pad_h+e)\n\
    \        b=b.union(pad)\n        bore=cq.Workplane('XY').workplane(offset=seat-p.insert_bore_depth).center(x,0).circle(p.insert_pilot_d/2).extrude(p.insert_bore_depth+e)\n\
    \        b=b.cut(bore)\n    return b"
  print_orientation: Flat underside of bridge on the bed at local z=0. Pads and blind
    insert bores up. No supports.
  use_orientation: Horizontal across the open wall box, with pads facing the disk.
