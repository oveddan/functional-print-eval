  bearing_depth:
    value: 7
    unit: mm
    kind: design
    source: design
    note: One bearing thickness; two seats leave a 2 mm center web in the 16 mm wheel.
  axle_clearance_d:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: Clearance through printed center web for a nominal M8 bolt.
  coupon_l:
    value: 50
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_w:
    value: 25
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_t:
    value: 3
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_depth:
    value: 2
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_seat_tight:
    value: 21.9
    unit: mm
    kind: design
    source: design
    note: ''
