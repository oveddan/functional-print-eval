task: bearing-wheel
note: A 50 mm flat-tread replacement wheel with two 608 bearing seats. The bearing
  OD was reported as about 22 mm; the coupon lets you test the fit before printing
  the full wheel. This assumes the original wheel has a flat running surface and that
  its existing door bracket/axle can retain the wheel. I couldn't verify the old tread
  profile or mounting arrangement, so this may not match a grooved track or a nonstandard
  mount. Print the wheel flat on one circular side, with the axle direction vertical;
  press one bearing into each face. If the coupon's 21.9 mm seat is too tight or loose,
  adjust the seat diameter before printing the wheel.
questions: []
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: Approximate old wheel outside diameter.
  wheel_width:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: Approximate old wheel width.
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: User remeasured one 608 bearing, approximately 22 mm.
  bearing_width:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 nominal width.
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 nominal bore; matches nominal M8 axle.
  seat_d:
    value: 21.9
    unit: mm
    kind: design
    source: design
    note: Initial press-fit seat, 0.1 mm below reported bearing OD; check coupon and
