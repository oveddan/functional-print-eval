task: bearing-wheel
note: 'This is a generic flat-tread replacement, not a guaranteed match to the closet
  track: the original wheel profile and the bracket spacing could not be checked.
  Use it only if the old wheel has a flat tread and the 16 mm wheel fits the bracket.
  The wheel is 50 mm OD x 16 mm wide, with two 608 bearings side-by-side and an 8.6
  mm through-hole for your M8 bolt. Print and test the fit coupon first; adjust bearing_seat_d
  in the wheel to the coupon size that gives a firm press fit. Do not force a bearing
  into a seat that is too tight. The bolt, bracket and any nut are not included in
  the print.'
questions: []
params:
  wheel_od:
    value: 50
    unit: mm
    kind: design
    source: asked
    note: Approximate outside diameter of the old wheel, as stated by the user.
  wheel_width:
    value: 16
    unit: mm
    kind: design
    source: asked
    note: Approximate old wheel width, as stated by the user.
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: Nominal 608 bearing outside diameter.
  bearing_width:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: Nominal 608 bearing width.
  bearing_seat_d:
    value: 22
    unit: mm
    kind: design
    source: design
    note: Starting nominal seat diameter; calibrate using the coupon and tune for
      the actual printer/bearings.
  bearing_seat_depth:
    value: 7.1
    unit: mm
    kind: design
    source: design
    note: Two opposing pockets leave a 1.8 mm center web in the 16 mm wheel.
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: asked
    note: User reports having an M8 bolt.
  axle_hole_d:
    value: 8.6
    unit: mm
    kind: design
    source: design
    note: Clearance hole for the reported M8 bolt; check fit with the actual bolt.
