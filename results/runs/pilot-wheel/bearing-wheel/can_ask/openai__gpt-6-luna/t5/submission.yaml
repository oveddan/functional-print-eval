task: bearing-wheel
note: A printable, plain-tread prototype sized to your approximate 50 mm × 16 mm wheel,
  with two opposed seats for your 608 bearings. I used a flat tread because the old
  wheel/track profile couldn't be measured; this may not track correctly if the original
  wheel was grooved or crowned. Print the coupon and test bearing fit and the M8 shank
  before printing the full wheel. Reuse the door's existing axle/bracket arrangement;
  this part does not replace or establish the axle's axial retainers.
questions: []
params:
  wheel_d:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: Approximate old wheel diameter stated by user.
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: Approximate old wheel width stated by user.
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 nominal OD; supplied bearing notes use 22.0 mm.
  bearing_id:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 nominal bore.
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 nominal width.
  seat_clearance_diametral:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: Starting FDM fit allowance; verify with coupon.
  seat_depth:
    value: 7.1
    unit: mm
    kind: design
    source: design
    note: Small axial relief so bearing faces are slightly recessed.
  edge_break:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Chamfer on the outer tread edges.
  axle_clearance:
    value: 8.5
    unit: mm
    kind: design
    source: design
    note: Clearance through printed center web; bearings' own bores fit the nominal
      M8 axle.
  coupon_od:
    value: 28
    unit: mm
    kind: design
    source: design
    note: Small test coupon outer diameter.
  coupon_floor:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: Thin floor under coupon pocket.
parts:
- id: wheel
  role: final
  material: PLA high-speed (black)
  code: "def build(p):\n    import cadquery as cq\n    seat_d = p.bearing_od + p.seat_clearance_diametral\n\
    \    w = p.wheel_w\n    depth = p.seat_depth\n    part = cq.Workplane('XY').circle(p.wheel_d\
    \ / 2).extrude(w)\n    part = part.edges('%Circle').chamfer(p.edge_break)\n  \
    \  lower = cq.Workplane('XY').circle(seat_d / 2).extrude(depth)\n    upper = cq.Workplane('XY').workplane(offset=w\
    \ - depth).circle(seat_d / 2).extrude(depth)\n    part = part.cut(lower).cut(upper)\n\
    \    part = part.faces('>Z').workplane().hole(p.axle_clearance)\n    return part"
  print_orientation: Lay one flat side on the build plate; wheel axis is Z, with the
    lower bearing pocket open toward the plate. No supports should be needed.
  use_orientation: Install the wheel with its axis horizontal, through the two bearings
    and existing M8 axle/bracket. The bearing pockets face the bracket sides.
- id: bearing_coupon
  role: coupon
  material: PLA high-speed (black)
  code: "def build(p):\n    import cadquery as cq\n    seat_d = p.bearing_od + p.seat_clearance_diametral\n\
    \    blank = cq.Workplane('XY').circle(p.coupon_od / 2).extrude(p.bearing_w)\n\
    \    pocket = cq.Workplane('XY').workplane(offset=p.coupon_floor).circle(seat_d\
    \ / 2).extrude(p.bearing_w)\n    return blank.cut(pocket)"
  print_orientation: Print flat on its circular bottom face, with the bearing pocket
    facing up.
  use_orientation: Test whether a 608 bearing can be pressed into the pocket by hand
    and removed without damage. Verify that the M8 bolt shank passes freely through
    a bearing.
hardware:
- id: bearings
  ref: 608ZZ
  qty: 2
joints: []
criteria:
- id: bearing-seat-fit
  part: wheel
  feature: opposed cylindrical 608 outer-race seats, nominal diameter 22.3 mm
  relation: seats
  hardware: bearings
  clearance_mm: 0.15
  params:
  - bearing_od
  - seat_clearance_diametral
  - seat_depth
  check:
    method: coupon
    ref: bearing_coupon
    description: Print the coupon first. The bearing should seat by hand without splitting
      the coupon or excessive force. Adjust seat_clearance_diametral and retest if
      needed.
- id: axle-path
  part: wheel
  feature: central 8.5 mm through-clearance in web; bearing bore is nominal 8 mm
  relation: clears
  hardware: null
  clearance_mm: 0.5
  params:
  - axle_clearance
  - bearing_id
  check:
    method: measure
    ref: null
    description: Check the user-supplied M8 bolt shank passes through the bearing
      bores without force; do not force a tight bolt into a bearing.
- id: approx-envelope
  part: wheel
  feature: outer diameter and overall width
  relation: contains
  hardware: null
  clearance_mm: null
  params:
  - wheel_d
  - wheel_w
  check:
    method: measure
    ref: null
    description: Confirm the approximate diameter and width suit the available door
      space before installation.
manual:
- n: '1'
  text: Print the bearing_coupon flat, using the same filament and settings intended
    for the wheel. Test-fit one bearing. If too tight or loose, adjust seat_clearance_diametral
    and reprint the coupon.
  parts:
  - bearing_coupon
  hardware: []
  tool: null
- n: '2'
  text: Print the wheel flat on one side as specified. Remove brim or elephant-foot
    material from the bearing-seat mouths without enlarging the seats unevenly.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '3'
  text: Press one 608 bearing into each opposite-side pocket. Support the wheel around
    each pocket while pressing; avoid pressing on the bearing shields or inner race
    alone.
  parts:
  - wheel
  hardware:
  - bearings
  tool: Hand press or vise with flat protective plates
- n: '4'
  text: Pass the M8 bolt through the bearing bores and mount the wheel in the existing
    door bracket. Reuse the existing bracket's spacers and retainers if present. Ensure
    the axle arrangement retains the inner races while the wheel's outer races rotate
    freely. Confirm free spin and track alignment by hand before loading the door.
  parts:
  - wheel
  hardware: []
  tool: Existing door hardware
