task: bearing-wheel
note: Rim profile couldn't be measured, so the rim is flat with 1 mm chamfers. If
  the old wheel had a groove that rode on a track lip, tell me and I'll add one. You
  can use your own M8 bolt if it's at least ~30 mm long or fits your bracket.
questions:
- text: Did the old wheel have a groove (V or U) in its rim that rides on a rail?
  answer: null
- text: What's the inside gap between the bracket arms?
  answer: null
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel about 50 mm across
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel about 16 mm wide; bracket gap not measured
  bearing_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: measured
    note: re-measured ~22 mm; 608 nominal 22.000
  bearing_w:
    value: 7.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 nominal width
  bearing_inner_race_od:
    value: 12.0
    unit: mm
    kind: hardware
    source: datasheet
    note: approximate 608 inner race land OD
  bolt_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: measured
    note: ''
  pocket_fit:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: added to bearing OD for a press fit; confirm with coupon
  bearing_proud:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: bearings stand 0.3 mm proud of each face so washers touch bearing, not plastic
  web_hole_d:
    value: 16.0
    unit: mm
    kind: design
    source: design
    note: between inner race OD (~12) and outer race inner edge (~19)
  rim_chamfer:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: ''
  spacer_od:
    value: 11.5
    unit: mm
    kind: design
    source: design
    note: ''
  spacer_id:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    depth = p.bearing_w - p.bearing_proud\n    pd = p.bearing_od\
    \ + p.pocket_fit\n    w = cq.Workplane('XY').circle(p.wheel_od/2).extrude(p.wheel_w)\n\
    \    w = w.edges('%CIRCLE').chamfer(p.rim_chamfer)\n    low = cq.Workplane('XY').circle(pd/2).extrude(depth)\n\
    \    high = cq.Workplane('XY').workplane(offset=p.wheel_w-depth).circle(pd/2).extrude(depth)\n\
    \    hole = cq.Workplane('XY').circle(p.web_hole_d/2).extrude(p.wheel_w)\n   \
    \ return w.cut(low).cut(high).cut(hole)\n"
  print_orientation: flat face down, axle vertical
  use_orientation: axle horizontal in door bracket
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    web = p.wheel_w - 2*(p.bearing_w - p.bearing_proud)\n\
    \    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_id/2).extrude(web)\n"
  print_orientation: flat end down
  use_orientation: on the bolt between the two bearing inner races
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    plate = cq.Workplane('XY').box(90, 30, 4, centered=(True,\
    \ True, False))\n    for i, d in enumerate([-0.05, 0.0, 0.05]):\n        x = (i-1)*29\n\
    \        h = cq.Workplane('XY').center(x, 0).circle((p.bearing_od + p.pocket_fit\
    \ + d)/2).extrude(4)\n        plate = plate.cut(h)\n    plate = plate.cut(cq.Workplane('XY').center(44,\
    \ 0).rect(3, 3).extrude(4))\n    return plate\n"
  print_orientation: flat
  use_orientation: test only
hardware:
- id: bearing
  ref: 608ZZ
  qty: 2
- id: bolt
  ref: ISO 4762 M8x30
  qty: 1
- id: locknut
  ref: ISO 10511 M8
  qty: 1
- id: washer
  ref: ISO 7089 M8
  qty: 2
joints:
- id: axle
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - -5.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel
    feature: web hole (clears bolt and inner races)
    role: clearance
  - part: spacer
    feature: bore
    role: clearance
  nut: locknut
  external: door roller bracket arms (clamped outside the washers)
criteria:
- id: c1
  part: wheel
  feature: bearing pockets
  relation: seats
  hardware: bearing
  clearance_mm: null
  params:
  - bearing_od
  - pocket_fit
  check:
    method: coupon
    ref: fit_coupon
    description: 'Middle hole must be a firm thumb press-fit. If it''s loose use the
      left (smaller) hole''s value, if it won''t go in use the right one: change pocket_fit
      by -0.05 / +0.05.'
- id: c2
  part: wheel
  feature: web hole
  relation: clears
  hardware: bearing
  clearance_mm: null
  params:
  - web_hole_d
  - bearing_inner_race_od
  check:
    method: measure
    ref: null
    description: After pressing in, the inner race spins freely with the wheel held.
- id: c3
  part: wheel
  feature: overall width incl. bearings
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - wheel_w
  - bearing_proud
  check:
    method: measure
    ref: null
    description: Total 16.6 mm across bearings plus 2 washers (3.2) must fit the bracket
      gap; drop washers if tight.
manual:
- n: '1'
  text: Print fit_coupon (the small square notch marks the largest hole). Press a
    bearing into the middle hole by hand. Firm but doable is right. If it's loose
    or won't go in, change pocket_fit as described and re-generate the wheel.
  parts:
  - fit_coupon
  hardware:
  - bearing
  tool: null
- n: '2'
  text: Print wheel and spacer flat, 4+ walls and 40% infill for strength. Remove
    any elephant-foot lip at the bottom pocket entry with a knife.
  parts:
  - wheel
  - spacer
  hardware: []
  tool: null
- n: '3'
  text: Press one bearing into each side of the wheel until it sits on the centre
    ring. Use a vise or a flat block on the outer race, not the shield. Each bearing
    ends up slightly proud of the face.
  parts:
  - wheel
  hardware:
  - bearing
  tool: vise or flat block
- n: '4'
  text: Push the bolt through the bracket arm, a washer, the first bearing, the spacer
    (from inside the wheel), the second bearing, a washer and the other bracket arm.
    Then fit the lock nut.
  parts:
  - wheel
  - spacer
  hardware:
  - bolt
  - washer
  - locknut
  tool: 6 mm hex key, 13 mm spanner
- n: '5'
  text: Tighten just until snug. The inner races are clamped through the spacer, so
    the wheel should still spin freely. If the wheel doesn't fit the bracket gap,
    leave out one or both washers.
  parts: []
  hardware:
  - locknut
  tool: null
