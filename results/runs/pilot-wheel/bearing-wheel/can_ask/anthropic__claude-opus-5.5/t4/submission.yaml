task: bearing-wheel
note: 'Your existing M8 bolt can be used in place of the listed M8x30 if it''s long
  enough: bracket thickness + 18 mm + nut. The rim is flat with 1 mm chamfers, since
  the rail profile couldn''t be measured. If the old wheel had a groove, say so and
  a grooved rim can be cut.'
questions:
- text: Was the old wheel's running surface flat, or did it have a groove or V to
    fit a rounded rail?
  answer: null
- text: What is the gap inside the bracket where the wheel fits, so the washer stack
    and bolt length can be set exactly?
  answer: null
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel about 50 mm across
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel about 16 mm wide
  rim_chamfer:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: ''
  bearing_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: measured
    note: re-measured ~22, matches 608 nominal
  bearing_w:
    value: 7.0
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bearing_inner_race_od:
    value: 12.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 inner race land ~12 mm; spacer must stay under this
  press_allow:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: added to bearing OD for the pocket; tune with coupon
  shoulder_id:
    value: 16.0
    unit: mm
    kind: design
    source: design
    note: between inner race OD (~12) and outer race bore (~19), so the shoulder only
      touches outer races
  bolt_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bolt_clear:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: ''
  spacer_od:
    value: 11.5
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_od:
    value: 30
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_h:
    value: 5
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    pd = p.bearing_od + p.press_allow\n    return cq.Workplane('XY').circle(p.coupon_od/2).circle(pd/2).extrude(p.coupon_h)\n"
  print_orientation: flat face on bed
  use_orientation: test only
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    w = cq.Workplane('XY').circle(p.wheel_od/2).extrude(p.wheel_w)\n\
    \    w = w.edges().chamfer(p.rim_chamfer)\n    pd = p.bearing_od + p.press_allow\n\
    \    w = w.cut(cq.Workplane('XY').circle(pd/2).extrude(p.bearing_w))\n    w =\
    \ w.cut(cq.Workplane('XY').workplane(offset=p.wheel_w - p.bearing_w).circle(pd/2).extrude(p.bearing_w))\n\
    \    w = w.cut(cq.Workplane('XY').circle(p.shoulder_id/2).extrude(p.wheel_w))\n\
    \    return w\n"
  print_orientation: one flat face on bed, axis vertical
  use_orientation: axis horizontal on the M8 bolt, rim on the track
- id: race_spacer
  role: final
  material: PLA
  code: "def build(p):\n    t = p.wheel_w - 2*p.bearing_w\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.bolt_d\
    \ + p.bolt_clear)/2).extrude(t)\n"
  print_orientation: flat on bed
  use_orientation: on the bolt between the two bearing inner races
hardware:
- id: bearing
  ref: 608ZZ
  qty: 2
- id: bolt
  ref: ISO 4762 M8x30
  qty: 1
- id: washer
  ref: ISO 7089 M8
  qty: 2
- id: locknut
  ref: ISO 10511 M8
  qty: 1
joints:
- id: axle
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - -3.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel
    feature: shoulder bore (bolt passes through bearings)
    role: clearance
  - part: race_spacer
    feature: bore
    role: clearance
  nut: locknut
  external: null
criteria:
- id: press
  part: wheel
  feature: bearing pockets
  relation: seats
  hardware: bearing
  clearance_mm: null
  params:
  - bearing_od
  - press_allow
  check:
    method: coupon
    ref: fit_coupon
    description: Bearing presses into the coupon firmly by hand or vise and doesn't
      fall out; if loose lower press_allow to 0.0, if it won't go raise to 0.2
- id: spin
  part: race_spacer
  feature: faces
  relation: supports
  hardware: bearing
  clearance_mm: null
  params:
  - spacer_od
  - bearing_inner_race_od
  check:
    method: measure
    ref: null
    description: 'With the nut tightened, the wheel still spins freely: spacer carries
      the clamp load on inner races only'
- id: fit_door
  part: wheel
  feature: rim width and OD
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - wheel_w
  check:
    method: measure
    ref: null
    description: Wheel fits in the bracket gap with washers and the door sits at the
      old height
manual:
- n: '1'
  text: Print fit_coupon (5 min). Press a 608 bearing in. It should need firm thumb
    or vise pressure and stay put. If it's loose, set press_allow to 0.0; if it won't
    go in, set it to 0.2. Then print the wheel.
  parts:
  - fit_coupon
  hardware:
  - bearing
  tool: null
- n: '2'
  text: Print the wheel lying flat with 5 walls and 40%+ infill (or 100% for a heavy
    door). Print race_spacer too. The 3 mm ledge in the middle of the bore prints
    as a small overhang; scrape off any droop so the bearing seats fully.
  parts:
  - wheel
  - race_spacer
  hardware: []
  tool: null
- n: '3'
  text: Press one bearing into each side of the wheel until it rests on the middle
    ledge, using a vise or a socket that pushes on the outer ring only. Before you
    press in the second bearing, drop race_spacer into the bore between them.
  parts:
  - wheel
  - race_spacer
  hardware:
  - bearing
  tool: vise or socket
- n: '4'
  text: Push the M8 bolt through the bracket, a washer, the wheel and a second washer,
    then out through the other side of the bracket, and fit the lock nut. Tighten
    until the wheel has no wobble but still spins freely. If the bracket gap is wider
    than 18 mm, stack extra washers on each side, never against the outer ring of
    the bearing.
  parts:
  - wheel
  hardware:
  - bolt
  - washer
  - locknut
  tool: 6 mm hex key, 13 mm spanner
