task: bearing-wheel
note: Single-piece 50x16 mm closet door roller wheel using two back-to-back 608ZZ
  bearings on an M8 bolt. Both bearings press in from one side against a 1.0 mm bed-side
  outer-race lip (eliminating internal mid-air overhangs), sitting symmetrically at
  z=1..15 mm with their inner races touching in the middle so tightening the M8 bolt
  will not axially bind the bearings. Two 1.4 mm thick x 11.2 mm OD inner-race spacers
  sit in the 1.0 mm outer recesses and protrude 0.4 mm past each wheel face so the
  bracket and M8 washers clamp only the bearing inner rings.
questions:
- text: Exact dimensions of the old roller wheel, bracket clearance, 608ZZ bearing
    width, and M8 bolt
  answer: about 8 mm (shank), bearing width about 7 mm; old wheel and bracket couldn't
    be measured beyond ~50 mm OD x ~16 mm wide
params:
  flange_bore_d:
    value: 18
    unit: mm
    kind: design
    source: design
    note: Bore diameter of the bottom retaining lip; supports 22 mm outer ring while
      clearing bearing shield and inner spacer
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: Outer diameter of old closet door roller wheel (~50 mm)
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: Width of old closet door roller wheel (~16 mm)
  coupon_od:
    value: 30
    unit: mm
    kind: design
    source: design
    note: Outer diameter of the bearing fit test coupon
  spacer_t:
    value: 1.4
    unit: mm
    kind: design
    source: design
    note: Thickness of each inner-race spacer (fills 1.0 mm recess plus 0.4 mm stand-off
      clearance past the wheel face)
  flange_t:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Thickness of the bottom outer-race retaining flange (centers the two 7 mm
      bearings in the 16 mm wheel)
  bolt_clearance:
    value: 0.25
    unit: mm
    kind: design
    source: design
    note: Diametral clearance for M8 bolt through inner race spacers
  bearing_fit_clearance:
    value: 0.12
    unit: mm
    kind: design
    source: design
    note: Diametral clearance for snug press-fit of 608ZZ outer ring in PLA
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: M8 bolt shank diameter (measured ~8 mm)
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ outer diameter
  rim_chamfer:
    value: 2
    unit: mm
    kind: design
    source: design
    note: 45-degree chamfer on top and bottom outer rim edges for smooth track tracking
      and clean printing
  spacer_od:
    value: 11.2
    unit: mm
    kind: design
    source: design
    note: Outer diameter of inner-race spacer so it contacts only the 608ZZ inner
      ring without rubbing the dust shield
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ nominal bore diameter
  top_recess:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Recess from top face of wheel to top face of second bearing, matching flange_t
      for symmetry
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: 608ZZ width (measured 7 mm, nominal 7.0 mm)
parts:
- id: bearing_fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    pocket_d = p.bearing_od + p.bearing_fit_clearance\n  \
    \  coupon_h = p.flange_t + p.bearing_w\n    body = (\n        cq.Workplane(\"\
    XY\")\n        .circle(p.coupon_od / 2.0)\n        .extrude(coupon_h)\n    )\n\
    \    through_hole = (\n        cq.Workplane(\"XY\")\n        .circle(p.flange_bore_d\
    \ / 2.0)\n        .extrude(coupon_h)\n    )\n    bearing_pocket = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.flange_t)\n        .circle(pocket_d / 2.0)\n\
    \        .extrude(p.bearing_w)\n    )\n    return body.cut(through_hole).cut(bearing_pocket)\n"
  print_orientation: Flat on bed (z=0 is the bottom flange face)
  use_orientation: Test coupon only; press 608ZZ bearing in from top (+Z)
- id: roller_wheel
  role: final
  material: PLA
  code: "def build(p):\n    pocket_d = p.bearing_od + p.bearing_fit_clearance\n  \
    \  pocket_depth = 2 * p.bearing_w + p.top_recess\n    flange_t = p.wheel_w - pocket_depth\n\
    \    wheel = (\n        cq.Workplane(\"XY\")\n        .circle(p.wheel_od / 2.0)\n\
    \        .extrude(p.wheel_w)\n        .edges(\"%CIRCLE\")\n        .chamfer(p.rim_chamfer)\n\
    \    )\n    through_hole = (\n        cq.Workplane(\"XY\")\n        .circle(p.flange_bore_d\
    \ / 2.0)\n        .extrude(p.wheel_w)\n    )\n    bearing_pocket = (\n       \
    \ cq.Workplane(\"XY\")\n        .workplane(offset=flange_t)\n        .circle(pocket_d\
    \ / 2.0)\n        .extrude(pocket_depth)\n    )\n    return wheel.cut(through_hole).cut(bearing_pocket)\n"
  print_orientation: Flat on bed with bottom retaining flange at z=0 (no supports
    needed)
  use_orientation: Axis horizontal along M8 axle bolt inside closet door roller bracket
- id: inner_spacer_bottom
  role: final
  material: PLA
  code: "def build(p):\n    bore_d = p.bolt_d + p.bolt_clearance\n    return (\n \
    \       cq.Workplane(\"XY\")\n        .circle(p.spacer_od / 2.0)\n        .circle(bore_d\
    \ / 2.0)\n        .extrude(p.spacer_t)\n    )\n"
  print_orientation: Flat on bed (z=0)
  use_orientation: Coaxial with M8 bolt, seated against bottom bearing inner race
- id: inner_spacer_top
  role: final
  material: PLA
  code: "def build(p):\n    bore_d = p.bolt_d + p.bolt_clearance\n    return (\n \
    \       cq.Workplane(\"XY\")\n        .circle(p.spacer_od / 2.0)\n        .circle(bore_d\
    \ / 2.0)\n        .extrude(p.spacer_t)\n    )\n"
  print_orientation: Flat on bed (z=0)
  use_orientation: Coaxial with M8 bolt, seated against top bearing inner race
hardware:
- id: bearing_608
  ref: 608ZZ
  qty: 2
- id: axle_bolt
  ref: ISO 4762 M8x30
  qty: 1
- id: axle_washer
  ref: ISO 7089 M8
  qty: 2
- id: axle_locknut
  ref: ISO 10511 M8
  qty: 1
joints:
- id: axle_joint
  fastener: axle_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 18.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: inner_spacer_top
    feature: washer_top
    role: washer
  - part: inner_spacer_top
    feature: spacer_bore_top
    role: clearance
  - part: roller_wheel
    feature: bearing_pocket
    role: clearance
  - part: inner_spacer_bottom
    feature: spacer_bore_bottom
    role: clearance
  - part: inner_spacer_bottom
    feature: washer_bottom
    role: washer
  nut: axle_locknut
  external: closet door roller bracket
criteria:
- id: bearing_press_fit
  part: roller_wheel
  feature: bearing_pocket
  relation: seats
  hardware: bearing_608
  clearance_mm: 0.12
  params:
  - bearing_od
  - bearing_w
  - bearing_fit_clearance
  - flange_t
  - flange_bore_d
  check:
    method: coupon
    ref: bearing_fit_coupon
    description: Press a 608ZZ bearing into the bearing_fit_coupon pocket; it should
      seat firmly by hand/thumb pressure against the bottom lip without cracking the
      ring.
- id: flange_clears_shield
  part: roller_wheel
  feature: bottom_retaining_flange
  relation: supports
  hardware: bearing_608
  clearance_mm: 1.0
  params:
  - flange_bore_d
  - flange_t
  check:
    method: coupon
    ref: bearing_fit_coupon
    description: Verify the bottom flange supports the 608ZZ outer ring while clearing
      the shield and inner ring.
- id: spacer_clears_bolt_and_shield
  part: inner_spacer_bottom
  feature: spacer_bore_and_face
  relation: clears
  hardware: axle_bolt
  clearance_mm: 0.25
  params:
  - bolt_d
  - bolt_clearance
  - spacer_od
  - spacer_t
  check:
    method: measure
    ref: null
    description: Slide the inner spacer onto the M8 bolt and verify it turns freely
      and contacts only the bearing inner race without rubbing the bearing shield.
- id: wheel_envelope
  part: roller_wheel
  feature: outer_rim
  relation: engages
  hardware: null
  clearance_mm: 0.0
  params:
  - wheel_od
  - wheel_w
  - rim_chamfer
  check:
    method: measure
    ref: null
    description: Check outer diameter and width of the printed wheel against the closet
      door track and bracket.
manual:
- n: '1'
  text: Print the bearing_fit_coupon first and test-press one of your 608ZZ bearings
    into the pocket until it seats against the 1 mm bottom lip. If the fit is good,
    print the roller_wheel and the two inner spacers (inner_spacer_bottom and inner_spacer_top).
    Recommend 4+ wall loops and 40%+ infill on the roller_wheel for high radial load
    strength.
  parts:
  - bearing_fit_coupon
  hardware:
  - bearing_608
  tool: null
- n: '2'
  text: Press the first 608ZZ bearing into the open top side of the roller_wheel until
    it seats flat against the 1 mm bottom retaining lip. Press the second 608ZZ bearing
    in directly on top of the first so the two bearings sit back-to-back in the center
    of the wheel, recessed 1 mm inside each face.
  parts:
  - roller_wheel
  hardware:
  - bearing_608
  tool: null
- n: '3'
  text: Place inner_spacer_bottom and inner_spacer_top into the 1 mm recesses on each
    side of the wheel against the 608ZZ inner races (these stand proud by 0.4 mm per
    side so standard M8 washers and the door bracket clamp only the inner races and
    never rub the bearing shields or wheel faces). Slide the M8 bolt (with an ISO
    7089 M8 washer under the head and under the nut as needed for your bracket) through
    the bracket, spacers, and bearings, and secure with the ISO 10511 M8 locknut.
  parts:
  - roller_wheel
  - inner_spacer_bottom
  - inner_spacer_top
  hardware:
  - axle_bolt
  - axle_washer
  - axle_locknut
  tool: 6 mm hex key and 13 mm wrench
