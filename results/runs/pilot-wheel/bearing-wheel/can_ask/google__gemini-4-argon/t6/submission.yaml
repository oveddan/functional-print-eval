task: bearing-wheel
note: Two 608ZZ bearings (7 mm wide each = 14 mm total) sit back-to-back inside the
  16 mm wide wheel against a 2 mm bottom outer-race lip. The two printed inner-race
  spacers bear exclusively on the 608ZZ inner rings (OD 11.2 mm) and stand 0.8 mm
  proud of each wheel face so tightening the M8 axle bolt clamps the bearing inner
  rings together without rubbing the dust shields or pinching the PLA wheel.
questions:
- text: Does the closet door track have a flat bottom or a raised rail/V-groove that
    would require a deeper groove in the outer rim of the wheel?
  answer: null
- text: What is the exact inside spacing between the walls of the closet door roller
    bracket?
  answer: null
