task: bearing-wheel
note: 'The wheel is a 50 x 16 mm disc. Two 608 bearings press into pockets, one from
  each face, with a 2 mm web between them. The M8 bolt runs through both inner races
  and is clamped between M8 washers, so the wheel spins on the bearings. Open assumptions:
  the bracket gap and the bolt length were not measured. The tread is flat, and a
  hard PLA tread will be louder than the original. Print the coupon first to check
  the press fit.'
questions:
- text: What is the gap between the bracket arms, and how long is your bolt? You could
    not measure these. The design assumes a gap of at least 17.2 mm and a bolt of
    about 50 mm. A longer or shorter bolt, or a smaller gap, changes the washer stack.
  answer: null
- text: What shape is the rail? I made a flat tread. If the rail is a V or round profile,
    the tread needs a groove.
  answer: null
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel about 50 mm across
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel about 16 mm wide
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: user reads about 22; 608 nominal 22.000
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: user reads about 7; 608 nominal 7
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 bore nominal 8
  bolt_d:
    value: 8
    unit: mm
    kind: world
    source: measured
    note: user's M8 bolt shank about 8; length not measured
  fit_clearance:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: added to bearing OD for the pocket diameter. Gives a snug press fit on a
      0.4 nozzle. Tune with the coupon.
  web_hole_d:
    value: 13
    unit: mm
    kind: design
    source: design
    note: hole through the centre web. Clears the inner race (about 12 mm OD) so only
      the outer races touch the wheel.
  edge_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
  washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8
  washer_od:
    value: 16
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8; smaller than the 19 mm or so inside the outer race, so it touches
      only the inner race
  washer_id:
    value: 8.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bracket_gap:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: The user could not measure this. The design needs at least 2*washer_t +
      2*bearing_w = 17.2 mm between the bracket arms.
  bolt_length:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: Not measured. The bolt must span the bracket gap plus both arms, a lock
      nut and washers.
  coupon_h:
    value: 4
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_od:
    value: 34
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    r = p.wheel_od / 2.0\n    w = p.wheel_w\n    body = cq.Workplane('XY').circle(r).extrude(w)\n\
    \    body = body.faces('>Z or <Z').edges().chamfer(p.edge_chamfer)\n    pd = p.bearing_od\
    \ + p.fit_clearance\n    lower = cq.Workplane('XY').circle(pd / 2.0).extrude(p.bearing_w)\n\
    \    upper = cq.Workplane('XY').workplane(offset=w - p.bearing_w).circle(pd /\
    \ 2.0).extrude(p.bearing_w)\n    thru = cq.Workplane('XY').circle(p.web_hole_d\
    \ / 2.0).extrude(w)\n    return body.cut(lower).cut(upper).cut(thru)\n"
  print_orientation: Flat face down on the bed with the axis vertical. The lower bearing
    pocket opens onto the bed. The web ring bridges at most 22 mm.
  use_orientation: Axis horizontal, rolling on the rail. Two 608 bearings are pressed
    into the pockets, one from each face.
- id: bearing-fit-coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    pd = p.bearing_od + p.fit_clearance\n    return cq.Workplane('XY').circle(p.coupon_od\
    \ / 2.0).circle(pd / 2.0).extrude(p.coupon_h)\n"
  print_orientation: Flat on the bed.
  use_orientation: Test piece only. Press a bearing into it to check the fit.
hardware:
- id: bolt
  ref: ISO 4762 M8x50
  qty: 1
- id: washers
  ref: ISO 7089 M8
  qty: 2
- id: locknut
  ref: ISO 10511 M8
  qty: 1
joints:
- id: axle
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - -10.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel
    feature: web_hole
    role: clearance
  nut: locknut
  external: null
criteria:
- id: c1
  part: wheel
  feature: bearing pockets (both faces)
  relation: contains
  hardware: null
  clearance_mm: null
  params:
  - bearing_od
  - fit_clearance
  - bearing_w
  check:
    method: coupon
    ref: bearing-fit-coupon
    description: Press a 608 into the coupon. It should go in with firm hand or vise
      pressure and not fall out. If it is loose, add a drop of glue or a wrap of tape.
      If it will not go in, ream it gently.
- id: c2
  part: wheel
  feature: central web ledge
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - bearing_w
  - wheel_w
  check:
    method: measure
    ref: null
    description: Each bearing bottoms out on the 2 mm web, leaving both bearing faces
      flush with the wheel faces.
- id: c3
  part: wheel
  feature: web through hole
  relation: clears
  hardware: null
  clearance_mm: 0.5
  params:
  - web_hole_d
  check:
    method: measure
    ref: null
    description: The 13 mm hole clears the inner races. Spin the wheel by hand and
      it should turn freely.
- id: c4
  part: wheel
  feature: bearing bores
  relation: clears
  hardware: bolt
  clearance_mm: null
  params:
  - bolt_d
  - bearing_bore
  check:
    method: measure
    ref: null
    description: The M8 bolt slides through both bearing bores. This is the bearings'
      own bore, not a printed hole.
manual:
- n: '1'
  text: Print the bearing-fit-coupon first. It takes a few minutes. Press one 608
    bearing into it. It should be snug and not fall out. If it is loose or too tight,
    tell me before printing the wheel.
  parts:
  - bearing-fit-coupon
  hardware: []
  tool: null
- n: '2'
  text: Print the wheel flat, with 4 or more walls and 30% or more infill, in PLA.
    Remove any elephant-foot ridge from the pocket edge with a knife.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '3'
  text: Press one 608 bearing into each face of the wheel until it is flush with the
    face and sits on the central web. Push on the outer ring only. Use a vise or a
    flat board.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '4'
  text: Check that the wheel spins freely on the bearings. The inner rings must not
    touch the plastic.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '5'
  text: 'Stack on the M8 bolt: one washer, the wheel with its bearings, then the second
    washer. Each washer must touch only the bearing inner ring, which it does. Put
    the bolt through the bracket and tighten the lock nut. The inner races will clamp
    between the washers. The wheel should still spin freely.'
  parts:
  - wheel
  hardware:
  - bolt
  - washers
  - locknut
  tool: 13 mm spanner and 6 mm hex key
- n: '6'
  text: Check the fit. The wheel with its 2 washers needs about 17.2 mm between the
    bracket arms. If the gap is 16 mm, use only 1 washer or none and shim the wheel.
    Make sure the bolt does not bottom out on the bracket and that the outer race
    does not rub the arms.
  parts: []
  hardware: []
  tool: null
