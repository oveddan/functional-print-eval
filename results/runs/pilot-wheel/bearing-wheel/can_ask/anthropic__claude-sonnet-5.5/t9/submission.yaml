manual:
- n: '1'
  text: Print the fit coupon first (about 10 minutes). Press one of your 608 bearings
    into its pocket. It should need firm thumb pressure and then stay put. If it's
    loose, reduce the fit_clear param. If it won't go in, increase it. Reprint the
    coupon after any change.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Print the wheel and the spacer. Use the flat face on the bed, 4 or more walls,
    and 25% infill. A wheel that carries a door's weight needs the walls.
  parts:
  - wheel
  - spacer
  hardware: []
  tool: null
- n: '3'
  text: Press one 608 bearing into each pocket. Use the flat of a vise, or push with
    a socket or washer that sits on the outer race only. Don't push on the inner race.
    Both bearings should end up flush with the wheel faces.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '4'
  text: Drop the spacer into the centre hole of the wheel, between the two bearings.
    Check that the wheel spins freely on the bearings.
  parts:
  - wheel
  - spacer
  hardware: []
  tool: null
- n: '5'
  text: Put the wheel in the door bracket. Slide the M8 bolt through the bracket arm,
    then a washer, the bearings and the spacer, then the second washer and the other
    bracket arm. Fasten with the lock nut. Tighten until the bracket just holds the
    washers against the inner races. The wheel must spin freely and not wobble. The
    washers hold the bracket arms off the wheel's rim, so only the inner races touch
    them.
  parts:
  - wheel
  - spacer
  hardware:
  - bolt
  - washer
  - locknut
  tool: 13 mm spanner and 6 mm hex key
