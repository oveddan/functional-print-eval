manual:
- n: '1'
  text: Print the fit coupon first (about 10 minutes). Press a 608 bearing into the
    pocket. It should go in with firm thumb pressure and not fall out. If it is loose
    or won't go in, tell me or change fit_clearance by 0.05 to 0.1 mm.
  parts:
  - fit-coupon
  hardware:
  - bearing
  tool: null
- n: '2'
  text: Measure the empty gap between your bracket arms. The spacer thickness is (gap
    - 16 - 0.5) / 2, and I assumed 1.0 mm (an 18 mm gap). If your gap is different,
    change spacer_t before printing. If the gap is 17 mm or less, the wheel will not
    fit with spacers and you'd need a narrower wheel.
  parts:
  - end_spacer
  hardware: []
  tool: null
- n: '3'
  text: Print the wheel, 2 end spacers and 1 mid spacer. Use 4 or more walls and at
    least 40% infill, preferably gyroid. Bed side down, and leave the supports off.
  parts:
  - wheel
  - end_spacer
  - mid_spacer
  hardware: []
  tool: null
- n: '4'
  text: Press one bearing into each side of the wheel until it bottoms on the centre
    web. Use a vise or clamp with a flat block, and press on the outer race only.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '5'
  text: 'Put the bolt through the bracket arm, then in this order: an end spacer,
    the wheel and bearing stack with the mid spacer in the centre between the inner
    races, and the other end spacer. Pass the bolt through the other arm and tighten
    it. The wheel must spin freely by hand, with the bearings'' inner races clamped
    and the outer races not touching the bracket.'
  parts:
  - end_spacer
  - mid_spacer
  - wheel
  hardware:
  - bolt
  - bearing
  tool: null
