task: bearing-wheel
note: 'Assumptions: the bolt is M8 and long enough to span the bracket (I used M8x40
  as a placeholder, so use your own bolt). I couldn''t get the bracket gap, so I didn''t
  check that the 16 mm wheel fits. Check this before printing. The tread is flat PLA,
  which is hard and may be noisy on a metal track. You can glue or stretch a rubber
  O-ring or TPU tire on if you need quiet running. PLA may creep under a heavy door,
  so use PETG if you have it.'
questions:
- text: What is the gap inside the bracket where the wheel sits? I need to know it's
    at least 16 mm plus washers.
  answer: null
- text: Does the old wheel have a groove or crown on its rim to match the track?
  answer: null
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel about 50 mm across
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel about 16 mm wide
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: user measured about 22; matches 608 nominal 22.0
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: user measured about 7; 608 nominal 7
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 bore 8.0
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: M8 bolt
  pocket_clear:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: diametral clearance added to bearing OD for a press fit in PLA; tune with
      the coupon
  web_bore:
    value: 12.5
    unit: mm
    kind: design
    source: design
    note: hole through the centre web; clears bearing inner race shoulders and the
      spacer, still leaves the outer race supported
  spacer_od:
    value: 11
    unit: mm
    kind: design
    source: design
    note: touches inner races only (inner race OD about 12 to 13), stays inside web_bore
  spacer_clear:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: diametral clearance of spacer ID on the bolt
  coupon_t:
    value: 3
    unit: mm
    kind: design
    source: design
    note: thickness of the fit test ring
  coupon_od:
    value: 32
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: wheel
  role: final
  material: PLA (black), 4 walls, 25% gyroid infill
  code: "def build(p):\n    pocket_d = p.bearing_od + p.pocket_clear\n    w = cq.Workplane('XY').circle(p.wheel_od/2).extrude(p.wheel_w)\n\
    \    bottom = cq.Workplane('XY').circle(pocket_d/2).extrude(p.bearing_w)\n   \
    \ top = cq.Workplane('XY').workplane(offset=p.wheel_w - p.bearing_w).circle(pocket_d/2).extrude(p.bearing_w)\n\
    \    bore = cq.Workplane('XY').circle(p.web_bore/2).extrude(p.wheel_w)\n    return\
    \ w.cut(bottom).cut(top).cut(bore)\n"
  print_orientation: flat, one flat face on the bed, axle axis vertical (z)
  use_orientation: axle horizontal, rolling on the door track
- id: spacer
  role: final
  material: PLA (black)
  code: "def build(p):\n    web = p.wheel_w - 2*p.bearing_w\n    return (cq.Workplane('XY').circle(p.spacer_od/2).circle((p.bolt_d\
    \ + p.spacer_clear)/2).extrude(web))\n"
  print_orientation: flat on the bed, axis vertical
  use_orientation: sits between the two bearing inner races on the bolt
- id: fit_coupon
  role: coupon
  material: PLA (black)
  code: "def build(p):\n    pocket_d = p.bearing_od + p.pocket_clear\n    return (cq.Workplane('XY').circle(p.coupon_od/2).circle(pocket_d/2).extrude(p.coupon_t))\n"
  print_orientation: flat on the bed
  use_orientation: 'test only: press one bearing in to check the fit'
hardware:
- id: bearing
  ref: 608ZZ
  qty: 2
- id: bolt
  ref: ISO 4762 M8x40
  qty: 1
- id: washer_head
  ref: ISO 7089 M8
  qty: 1
- id: locknut
  ref: ISO 10511 M8
  qty: 1
joints:
- id: axle
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - -1.6
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel
    feature: bearing pockets and centre bore (bolt passes through bearing inner races)
    role: clearance
  - part: spacer
    feature: bore
    role: clearance
  - part: wheel
    feature: bolt head side face
    role: washer
  nut: locknut
  external: null
criteria:
- id: c1
  part: wheel
  feature: bearing pockets (both)
  relation: contains
  hardware: null
  clearance_mm: 0.1
  params:
  - bearing_od
  - pocket_clear
  - bearing_w
  check:
    method: coupon
    ref: fit_coupon
    description: Print the coupon first. A 608 bearing should press in by hand or
      with light thumb pressure and not fall out. If loose, reduce pocket_clear to
      0; if too tight, raise it to 0.2.
- id: c2
  part: spacer
  feature: bore
  relation: clears
  hardware: null
  clearance_mm: 0.2
  params:
  - bolt_d
  - spacer_clear
  check:
    method: measure
    ref: null
    description: Bolt slides through spacer freely.
- id: c3
  part: spacer
  feature: outer surface
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - spacer_od
  - web_bore
  check:
    method: measure
    ref: null
    description: Spacer spins freely inside the web bore without touching the wheel.
- id: c4
  part: spacer
  feature: end faces
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - wheel_w
  - bearing_w
  check:
    method: measure
    ref: null
    description: Spacer length equals the web thickness (2 mm) so tightening the nut
      clamps both inner races, not the wheel.
- id: c5
  part: wheel
  feature: centre web
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - bearing_w
  - wheel_w
  check:
    method: measure
    ref: null
    description: Both bearings sit flush with the wheel faces.
manual:
- n: '1'
  text: Print the fit coupon (fit_coupon) first; it takes a few minutes. Press one
    608 bearing into it. It should need firm thumb pressure and then stay put. If
    it falls out, set pocket_clear to 0 and reprint the wheel; if you can't press
    it in, set it to 0.2.
  parts:
  - fit_coupon
  hardware:
  - bearing
  tool: null
- n: '2'
  text: Print the wheel and the spacer flat on the bed, 4 walls, about 25% infill.
    No supports needed.
  parts:
  - wheel
  - spacer
  hardware: []
  tool: null
- n: '3'
  text: Press one bearing into each side of the wheel until it is flush with the face.
    Push it in squarely using a flat block, such as the other bearing's flat face
    or a piece of wood, over it. Don't hammer on the inner race.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '4'
  text: Slide the bolt through the washer, then through the first bearing, the spacer
    (in the wheel's centre) and the second bearing. Check that the spacer sits between
    the two inner races.
  parts:
  - wheel
  - spacer
  hardware:
  - bolt
  - washer_head
  - bearing
  tool: null
- n: '5'
  text: Mount the bolt through the door bracket and fit the lock nut. Tighten until
    the wheel has no side play but still spins freely. Spin the wheel by hand to check,
    then rehang the door.
  parts:
  - wheel
  hardware:
  - bolt
  - locknut
  tool: 13 mm spanner and 6 mm hex key
