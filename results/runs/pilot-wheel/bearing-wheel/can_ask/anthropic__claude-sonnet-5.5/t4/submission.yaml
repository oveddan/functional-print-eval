task: bearing-wheel
note: The wheel is a 50 mm disc, 16 mm wide, with a 608 bearing pressed into each
  face and an M8 bolt through both. A 3 mm web between the pockets holds the outer
  races apart. Its bore is 14 mm, so only the outer rings carry load. The bearings
  stick out 0.5 mm each side, so the washers and bracket touch the spinning inner
  races and the wheel doesn't rub. You couldn't measure the bracket gap, the track
  profile or the bolt length, so I assumed a flat tread and an M8x40 bolt. I flagged
  all three as open questions. Check them against the old wheel, and change the tread
  if the track has a groove or ridge. Print the coupon first to check the bearing
  fit. PLA is fine for a light closet door. It can creep under a heavy door, so use
  PETG or ABS if the door is heavy.
questions:
- text: What is the gap in the bracket the wheel sits in? The wheel plus bearings
    is about 17 mm wide, so this needs checking.
  answer: null
- text: 'What shape is the track: a flat rail, a V-groove, or a round rail? The tread
    is flat, with no groove or flange.'
  answer: null
- text: How long is the M8 bolt, and does it fit through the bracket with room for
    a lock nut? I assumed an M8x40 as a placeholder.
  answer: null
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel about 50 mm
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel about 16 mm wide. Bracket gap not measured
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 OD is 22.000. User measured about 22
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 nominal width 7. Not measured
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: M8 shank, about 8 mm
  pocket_clear:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: diametral clearance for a snug press fit. Check with the coupon
  pocket_depth:
    value: 6.5
    unit: mm
    kind: design
    source: design
    note: less than bearing width, so each bearing sticks out 0.5 mm and the inner
      race, not the wheel, touches the washer and bracket
  web_bore:
    value: 14
    unit: mm
    kind: design
    source: design
    note: bigger than the inner race OD (about 12.6) so only the outer races touch
      the wheel
  edge_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_od:
    value: 32
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_pocket_depth:
    value: 4
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_h:
    value: 6
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    r = p.wheel_od/2.0\n    pr = (p.bearing_od + p.pocket_clear)/2.0\n\
    \    body = cq.Workplane('XY').circle(r).extrude(p.wheel_w)\n    body = body.faces('>Z').edges().chamfer(p.edge_chamfer).faces('<Z').edges().chamfer(p.edge_chamfer)\n\
    \    bot = cq.Workplane('XY').circle(pr).extrude(p.pocket_depth)\n    top = cq.Workplane('XY').workplane(offset=p.wheel_w-p.pocket_depth).circle(pr).extrude(p.pocket_depth)\n\
    \    bore = cq.Workplane('XY').circle(p.web_bore/2.0).extrude(p.wheel_w)\n   \
    \ return body.cut(bot).cut(top).cut(bore)\n"
  print_orientation: Flat on the bed, one flat face down. Both bearing pockets are
    open faces, so there are no supports.
  use_orientation: Axle horizontal, rolling on the door track. The two bearings sit
    in pockets on opposite faces.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    pr = (p.bearing_od + p.pocket_clear)/2.0\n    d = cq.Workplane('XY').circle(p.coupon_od/2.0).extrude(p.coupon_h)\n\
    \    pocket = cq.Workplane('XY').workplane(offset=p.coupon_h-p.coupon_pocket_depth).circle(pr).extrude(p.coupon_pocket_depth)\n\
    \    bore = cq.Workplane('XY').circle(p.web_bore/2.0).extrude(p.coupon_h)\n  \
    \  return d.cut(pocket).cut(bore)\n"
  print_orientation: Flat, pocket facing up
  use_orientation: 'Test only: press a 608 bearing into the pocket to check the fit
    before printing the wheel.'
hardware:
- id: bearing
  ref: 608ZZ
  qty: 2
- id: bolt
  ref: ISO 4762 M8x40
  qty: 1
- id: washer
  ref: ISO 7089 M8
  qty: 2
- id: locknut
  ref: ISO 10511 M8
  qty: 1
