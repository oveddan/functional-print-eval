parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    r_out = p.wheel_od / 2.0\n    w = p.wheel_width\n    r_pocket\
    \ = (p.bearing_od + p.bearing_press_clearance) / 2.0\n    d_pocket = p.bearing_width\n\
    \    r_sh = p.wheel_shoulder_id / 2.0\n    r_seat = 10.0\n    z_chamfer_end =\
    \ d_pocket + (r_seat - r_sh)\n    groove_depth = p.wheel_groove_depth\n\n    pts\
    \ = [\n        (r_pocket, 0.5),\n        (r_pocket, d_pocket),\n        (r_seat,\
    \ d_pocket),\n        (r_sh, z_chamfer_end),\n        (r_sh, w - d_pocket),\n\
    \        (r_pocket, w - d_pocket),\n        (r_pocket, w - 0.5),\n        (r_pocket\
    \ + 0.5, w),\n        (r_out - 1.0, w),\n        (r_out, w - 1.0),\n        (r_out,\
    \ w - 3.0),\n    ]\n\n    s = cq.Workplane(\"XZ\").moveTo(r_pocket + 0.5, 0.0)\n\
    \    for pt in pts:\n        s = s.lineTo(pt[0], pt[1])\n\n    s = s.threePointArc((r_out\
    \ - groove_depth, w / 2.0), (r_out, 3.0))\n    s = s.lineTo(r_out, 1.0)\n    s\
    \ = s.lineTo(r_out - 1.0, 0.0)\n    s = s.close()\n\n    wheel = s.revolve()\n\
    \    return wheel\n"
  print_orientation: Bottom flat face on print bed (z=0). Revolves around Z axis;
    internal shoulder features a 45-degree self-supporting chamfer so no support material
    is needed.
  use_orientation: Z axis aligned with M8 bolt axle; rotates freely in closet door
    track.
- id: inner_spacer
  role: final
  material: PLA
  code: "def build(p):\n    id_val = p.bolt_d + p.bolt_clearance\n    od_val = p.bearing_inner_ring_od\n\
    \    h = p.inner_spacer_length\n    spacer = (\n        cq.Workplane(\"XY\")\n\
    \        .circle(od_val / 2.0)\n        .extrude(h)\n        .faces(\">Z\")\n\
    \        .hole(id_val)\n    )\n    return spacer\n"
  print_orientation: Flat annular face on print bed (z=0). Extrudes upward along Z
    to height = 2.0 mm. No supports needed.
  use_orientation: Centered on M8 bolt between inner rings of bearing_1 and bearing_2.
- id: outer_spacer
  role: final
  material: PLA
  code: "def build(p):\n    id_val = p.bolt_d + p.bolt_clearance\n    od_val = p.outer_spacer_od\n\
    \    h = p.outer_spacer_length\n    spacer = (\n        cq.Workplane(\"XY\")\n\
    \        .circle(od_val / 2.0)\n        .extrude(h)\n        .faces(\">Z\")\n\
    \        .hole(id_val)\n    )\n    return spacer\n"
  print_orientation: Flat annular face on print bed (z=0). Extrudes upward along Z
    to height = 3.0 mm. Print 2 copies. No supports needed.
  use_orientation: Positioned on M8 bolt on outer side of each bearing inner ring,
    spacing the wheel away from bracket and bolt head.
- id: bearing_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    size = p.coupon_size\n    h = p.coupon_height\n    pocket_d\
    \ = p.bearing_od + p.bearing_press_clearance\n    pocket_depth = p.bearing_width\n\
    \    thru_d = p.wheel_shoulder_id\n\n    coupon = (\n        cq.Workplane(\"XY\"\
    )\n        .rect(size, size)\n        .extrude(h)\n        .faces(\">Z\")\n  \
    \      .workplane()\n        .hole(thru_d)\n        .faces(\">Z\")\n        .workplane()\n\
    \        .circle(pocket_d / 2.0)\n        .cutBlind(-pocket_depth)\n    )\n  \
    \  return coupon\n"
  print_orientation: Flat bottom face on print bed (z=0), counterbore opening facing
    upward (+Z). No supports needed.
  use_orientation: Bench test fixture to verify bearing fit before printing the full
    wheel.
