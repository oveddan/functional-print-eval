task: bearing-wheel
note: Heavy-duty replacement sliding closet door roller wheel (50 mm OD x 16 mm width)
  running on two 608ZZ bearings and an M8 bolt axle. Features an internal retaining
  shoulder with 45-degree self-supporting bridge chamfer, a captive inner race spacer
  preventing axial preload, two standoff outer spacers to prevent wheel rubbing, and
  a universal concave running groove with flat shoulders for both flat channels and
  rounded rails.
questions:
- text: What cross-sectional track profile does the wheel accommodate?
  answer: 'The wheel has a universal profile: a shallow concave central arc flanked
    by flat cylindrical shoulders, allowing it to self-center on convex round bead
    tracks while also rolling smoothly on flat channel tracks.'
- text: Can the M8 axle bolt be tightened securely without binding the bearings?
  answer: Yes. A 2.0 mm captive inner race spacer sleeve sits between the two bearing
    inner rings, matching the internal outer-race shoulder thickness. When the M8
    lock nut is tightened, clamping forces pass through the inner rings and sleeve
    without axially preloading or binding the ball bearings.
