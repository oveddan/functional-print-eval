manual:
- n: '1'
  text: Print the bearing fit coupon (bearing_coupon) first to verify the 608 bearing
    pocket fit on your printer. Press a 608 bearing into the coupon pocket; it should
    seat firmly by hand or with light table pressure without cracking the plastic.
  parts:
  - bearing_coupon
  hardware:
  - bearing_1
  tool: null
- n: '2'
  text: Print the wheel (wheel), one inner spacer (inner_spacer), and two outer spacers
    (outer_spacer) in PLA at 0.2 mm layer height with at least 4 perimeters/wall loops
    and 40% infill for strength under door weight.
  parts:
  - wheel
  - inner_spacer
  - outer_spacer
  hardware: []
  tool: null
- n: '3'
  text: Press the first 608ZZ bearing into one side of the wheel until it seats flat
    against the internal shoulder at 7.0 mm depth.
  parts:
  - wheel
  hardware:
  - bearing_1
  tool: null
- n: '4'
  text: Drop the inner spacer (inner_spacer) into the wheel bore so it sits against
    the inner ring of the first bearing. Then press the second 608ZZ bearing into
    the opposite side of the wheel until it seats against the shoulder. The inner
    spacer is now captive between the two bearing inner rings, preventing any bearing
    preload when the axle bolt is tightened.
  parts:
  - wheel
  - inner_spacer
  hardware:
  - bearing_2
  tool: null
- n: '5'
  text: Slide an ISO 7089 M8 washer onto the ISO 4762 M8x40 bolt, followed by the
    first outer spacer (outer_spacer). Push the bolt through the wheel assembly. Slide
    the second outer spacer (outer_spacer) onto the protruding bolt on the other side.
  parts:
  - wheel
  - outer_spacer
  hardware:
  - axle_bolt
  - washer
  tool: null
- n: '6'
  text: Insert the bolt through the closet door mounting bracket. Place the second
    ISO 7089 M8 washer over the bolt and thread on the ISO 10511 M8 nylon-insert lock
    nut. Tighten with a 6 mm hex key and 13 mm wrench until snug. Verify the wheel
    spins completely freely on the bearings without axial play or rubbing.
  parts:
  - outer_spacer
  hardware:
  - lock_nut
  - washer
  tool: 6 mm hex key, 13 mm wrench
- n: '7'
  text: Hang the door assembly back onto the closet track and test the sliding action.
  parts:
  - wheel
  hardware: []
  tool: null
