  inner_spacer_id:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: Inner bore of center spacer clearing M8 bolt
  shoulder_id:
    value: 18
    unit: mm
    kind: design
    source: design
    note: Bore of central retention shoulder, clearing bearing shields
  outer_spacer_boss_h:
    value: 1.5
    unit: mm
