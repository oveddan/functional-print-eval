task: bearing-wheel
note: Replacement heavy-duty sliding closet door roller wheel engineered for two 608
  bearings and an M8 axle bolt. Includes dual-profile tread (concave groove for round
  tracks, flat shoulders for flat tracks) and dedicated inner/outer spacers to ensure
  friction-free rotation under full clamp load.
questions: []
