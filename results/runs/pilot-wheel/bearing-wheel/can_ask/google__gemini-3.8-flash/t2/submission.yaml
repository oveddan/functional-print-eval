parts:
- id: wheel
  role: final
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    r_pocket = p.bearing_pocket_d\
    \ / 2.0\n    r_shoulder = p.shoulder_id / 2.0\n    r_outer = p.wheel_od / 2.0\n\
    \    h = p.wheel_width\n    d_pocket = p.bearing_pocket_depth\n    c = p.outer_chamfer\n\
    \    gw = p.groove_width\n    gd = p.groove_depth\n\n    dz_chamfer = r_pocket\
    \ - r_shoulder\n    z_shoulder_top = d_pocket + dz_chamfer\n\n    z_groove_top\
    \ = h / 2.0 + gw / 2.0\n    z_groove_mid = h / 2.0\n    z_groove_bot = h / 2.0\
    \ - gw / 2.0\n    r_groove_mid = r_outer - gd\n\n    pts_before_arc = [\n    \
    \    (r_pocket, 0.0),\n        (r_pocket, d_pocket),\n        (r_shoulder, z_shoulder_top),\n\
    \        (r_pocket, z_shoulder_top),\n        (r_pocket, h),\n        (r_outer\
    \ - c, h),\n        (r_outer, h - c),\n        (r_outer, z_groove_top),\n    ]\n\
    \n    pts_after_arc = [\n        (r_outer, c),\n        (r_outer - c, 0.0),\n\
    \    ]\n\n    wp = cq.Workplane(\"XZ\").moveTo(pts_before_arc[0][0], pts_before_arc[0][1])\n\
    \    for pt in pts_before_arc[1:]:\n        wp = wp.lineTo(pt[0], pt[1])\n\n \
    \   wp = wp.threePointArc((r_groove_mid, z_groove_mid), (r_outer, z_groove_bot))\n\
    \n    for pt in pts_after_arc:\n        wp = wp.lineTo(pt[0], pt[1])\n\n    wheel\
    \ = wp.close().revolve(360, (0, 0, 0), (0, 1, 0))\n    return wheel\n"
  print_orientation: Flat circular face on the bed (z = 0), revolving axis parallel
    to Z, printing upright without supports.
  use_orientation: Wheel axis horizontal, spinning on the M8 bolt axle inside the
    closet door track.
- id: inner_spacer
  role: final
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    s = (\n        cq.Workplane(\"\
    XY\")\n        .circle(p.inner_spacer_od / 2.0)\n        .circle(p.inner_spacer_id\
    \ / 2.0)\n        .extrude(p.inner_spacer_length)\n    )\n    return s\n"
  print_orientation: Flat face on the bed (z = 0), extruding 2.1 mm vertically.
  use_orientation: Centered between the two 608 bearings' inner races inside the wheel
    bore.
- id: outer_spacer
  role: final
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    s = (\n        cq.Workplane(\"\
    XY\")\n        .circle(p.outer_spacer_od / 2.0)\n        .extrude(p.outer_spacer_flange_h)\n\
    \    )\n    s = (\n        s.faces(\">Z\")\n        .workplane()\n        .circle(p.outer_spacer_contact_od\
    \ / 2.0)\n        .extrude(p.outer_spacer_boss_h)\n    )\n    s = s.faces(\"<Z\"\
    ).workplane().circle(p.outer_spacer_id / 2.0).cutThruAll()\n    return s\n"
  print_orientation: Wide 15 mm flange flat on the bed (z = 0), boss stepping upward
    to z = 4 mm.
  use_orientation: Narrow boss seated against bearing inner race, wide flange seated
    against washer/bracket.
- id: coupon_bearing
  role: coupon
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    h = 8.0\n    coupon = (\n   \
    \     cq.Workplane(\"XY\")\n        .rect(30.0, 30.0)\n        .extrude(h)\n \
    \       .faces(\">Z\")\n        .workplane()\n        .circle(p.bearing_pocket_d\
    \ / 2.0)\n        .cutBlind(-p.bearing_pocket_depth)\n        .faces(\"<Z\")\n\
    \        .workplane()\n        .circle(p.shoulder_id / 2.0)\n        .cutThruAll()\n\
    \    )\n    return coupon\n"
  print_orientation: Bottom flat face on the bed (z = 0), pocket open to top face.
  use_orientation: Test coupon for checking 608 bearing push-fit before printing the
    wheel.
