manual:
- n: '1'
  text: Print the bearing fit coupon first (takes ~12 minutes). Test-fit one of your
    608 bearings into the pocket. It should press in firmly by hand. If it is too
    tight or loose, adjust bearing_pocket_d slightly in the params before printing
    the full wheel.
  parts:
  - coupon_bearing
  hardware:
  - bearing
  tool: null
- n: '2'
  text: Print the wheel, one inner_spacer, and two copies of outer_spacer flat on
    the build plate. Use 4-5 perimeters and at least 40% infill for durability under
    door load. No supports are needed.
  parts:
  - wheel
  - inner_spacer
  - outer_spacer
  hardware: []
  tool: null
- n: '3'
  text: Press the first 608 bearing into the bottom pocket of the wheel until it seats
    flush against the internal shoulder.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '4'
  text: Drop the inner_spacer into the center of the wheel bore so it rests on the
    first bearing's inner race. Then press the second 608 bearing into the opposite
    side of the wheel until it seats firmly against the internal shoulder.
  parts:
  - wheel
  - inner_spacer
  hardware:
  - bearing
  tool: null
- n: '5'
  text: Slide an M8 washer onto your M8x40 bolt, followed by the first outer_spacer
    (wide 15 mm flange facing the washer, narrow 11.2 mm boss facing outward).
  parts:
  - outer_spacer
  hardware:
  - bolt
  - washer
  tool: null
- n: '6'
  text: Push the bolt through the assembled wheel with its two bearings and center
    spacer. Then slide the second outer_spacer onto the bolt (narrow 11.2 mm boss
    facing the bearing, wide 15 mm flange facing outward).
  parts:
  - wheel
  - outer_spacer
  hardware:
  - bolt
  tool: null
- n: '7'
  text: Pass the bolt through the mounting hole on the closet door hanger bracket.
    Add the second M8 washer and thread on the M8 nylon lock nut.
  parts: []
  hardware:
  - bolt
  - washer
  - lock_nut
  tool: 13 mm wrench or socket
- n: '8'
  text: Tighten the lock nut firmly with a wrench. The clamping force transfers through
    the outer spacers, inner bearing rings, and the inner spacer, leaving the wheel
    spinning completely smoothly with zero wobble or binding. Hang the door back on
    the track.
  parts: []
  hardware:
  - lock_nut
  tool: 13 mm wrench or socket, 6 mm hex key
