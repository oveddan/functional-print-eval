    value: 2
    unit: mm
    kind: design
    source: design
    note: Bottom retaining flange thickness in test coupon
  flange_opening_d:
    value: 16
    unit: mm
    kind: design
    source: design
    note: Retaining flange inner opening diameter, overlapping bearing outer ring
      while clearing shields and inner race
  wheel_width:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: Overall width of closet door roller wheel, measured from original part
  groove_depth:
