    value: 8
    unit: mm
    kind: design
    source: design
    note: Total height of test coupon
  spacer_id:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: Clearance hole diameter for M8 bolt shank through spacer
  wheel_od:
    value: 50
    unit: mm
    kind: world
