  coupon_size:
    value: 30
    unit: mm
    kind: design
    source: design
    note: Width and length of test coupon block
  spacer_length:
    value: 4
    unit: mm
    kind: design
    source: design
    note: Length of spacer bushing providing axial clearance between rotating wheel
      and mounting bracket/bolt head
  groove_radius:
    value: 8
    unit: mm
    kind: design
    source: design
    note: Radius of concave circular groove profile to track standard closet door
      round rails
  spacer_od:
    value: 11.5
    unit: mm
    kind: design
    source: design
    note: Spacer outer diameter, contacting only the 608 inner race (~12 mm OD) without
      rubbing on shields or outer race
parts:
- id: wheel
  role: final
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    # Base solid cylinder\n    wheel\
    \ = cq.Workplane(\"XY\").circle(p.wheel_od / 2.0).extrude(p.wheel_width)\n   \
    \ \n    # Pocket for the two 608 bearings from top face\n    wheel = (\n     \
    \   wheel.faces(\">Z\")\n        .circle(p.bearing_bore_d / 2.0)\n        .cutBlind(-p.bearing_pocket_depth)\n\
    \    )\n    \n    # Flange center clearance opening from bottom face\n    wheel\
    \ = (\n        wheel.faces(\"<Z\")\n        .circle(p.flange_opening_d / 2.0)\n\
    \        .cutThruAll()\n    )\n    \n    # Concave track groove on the outer rim\n\
    \    r_bottom = p.wheel_od / 2.0 - p.groove_depth\n    r_center = r_bottom + p.groove_radius\n\
    \    z_center = p.wheel_width / 2.0\n    cutter = (\n        cq.Workplane(\"XZ\"\
    )\n        .moveTo(r_center, z_center)\n        .circle(p.groove_radius)\n   \
    \     .revolve()\n    )\n    wheel = wheel.cut(cutter)\n    \n    return wheel\n"
  print_orientation: z=0 face on build plate (flat retaining-flange side down, bearing
    pocket opening facing up)
  use_orientation: vertical, rolling on closet door track with M8 axle bolt through
    center bore
- id: spacer
  role: final
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    spacer = (\n        cq.Workplane(\"\
    XY\")\n        .circle(p.spacer_od / 2.0)\n        .circle(p.spacer_id / 2.0)\n\
    \        .extrude(p.spacer_length)\n    )\n    return spacer\n"
  print_orientation: z=0 face on build plate
  use_orientation: axial bushing seated against 608 inner race on M8 bolt
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    coupon = (\n        cq.Workplane(\"\
    XY\")\n        .rect(p.coupon_size, p.coupon_size)\n        .extrude(p.coupon_h)\n\
    \        .faces(\">Z\")\n        .circle(p.bearing_bore_d / 2.0)\n        .cutBlind(-(p.coupon_h\
    \ - p.coupon_flange_t))\n        .faces(\"<Z\")\n        .circle(p.flange_opening_d\
    \ / 2.0)\n        .cutThruAll()\n    )\n    return coupon\n"
  print_orientation: z=0 face on build plate
  use_orientation: bench test coupon for verifying 608 bearing press fit
