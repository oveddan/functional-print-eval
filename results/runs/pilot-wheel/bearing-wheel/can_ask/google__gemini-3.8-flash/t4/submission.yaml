manual:
- n: '1'
  text: Print the fit_coupon first (approx. 10 minutes). Push one of your 608 bearings
    into the pocket. It should be a snug press-fit requiring firm thumb pressure.
    If too loose or too tight on your printer, adjust bearing_bore_d before printing
    the wheel.
  parts:
  - fit_coupon
  hardware:
  - bearing
  tool: calipers or fingers
- n: '2'
  text: 'Print the wheel (print orientation: flat on bed, z=0 face down) and print
    two copies of the spacer bushing in PLA. For the wheel, use at least 4 perimeters
    and 30%+ infill for strength under door load.'
  parts:
  - wheel
  - spacer
  hardware: []
  tool: 3D printer
- n: '3'
  text: Press the first 608 bearing into the open bore of the wheel until it seats
    firmly against the bottom retaining flange. Then press the second 608 bearing
    directly in behind it until flush against the first bearing. Both bearings fit
    neatly into the 14.2 mm deep pocket.
  parts:
  - wheel
  hardware:
  - bearing
  tool: bench vise or gentle clamp
- n: '4'
  text: Slide one M8 washer onto the M8 bolt, followed by one printed spacer. Insert
    the bolt through the two bearings inside the wheel from the open side. On the
    protruding bolt end (flange side), slide the second printed spacer, pass the bolt
    through the closet door mounting bracket hole, add the second M8 washer, and tighten
    the M8 lock nut securely. Verify the wheel spins completely freely without binding
    against the bracket or bolt head.
  parts:
  - wheel
  - spacer
  hardware:
  - bolt
  - washer
  - nut
  tool: 6 mm hex key, 13 mm wrench
- n: '5'
  text: Reinstall the closet door onto the overhead or floor track. Confirm the wheel
    rides centered on the track rail/channel, and test smooth sliding movement.
  parts:
  - wheel
  hardware: []
  tool: null
