task: bearing-wheel
note: Heavy-duty replacement closet door roller wheel engineered for two stacked 608
  skateboard bearings on an M8 bolt axle. Features a dual-profile rim with a central
  concave groove and flat outer shoulders to ride on either round rail beads or flat
  box channels. Includes printed precision inner-ring spacers to prevent rubbing against
  brackets or bolt heads.
questions:
- text: Does the closet door bracket accommodate an M8 bolt?
  answer: The design uses standard M8 hardware. Standard closet door brackets have
    1/4" to 5/16" (8 mm) holes or slots. If the existing bracket hole is 1/4" (~6.4
    mm), drilling it out with an 8 mm or 5/16" drill bit allows the M8 bolt to pass
    through cleanly.
- text: Is the closet door track round or flat?
  answer: 'The wheel incorporates a dual-profile tread: a central 8 mm radius concave
    groove for round rail tracks, flanked by flat outer shoulders for flat tracks
    and box channels. It rolls smoothly on both types.'
