task: bearing-wheel
note: ''
questions:
- text: What is the length and head size of your M8 bolt? I did not measure it, so
    I could not confirm it fits your bracket. The M8x30 entry is a placeholder.
  answer: null
- text: Are the bearings and bolt going into the same bracket the old wheel used,
    and do you have an M8 washer and nut?
  answer: null
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: Old wheel's rolling diameter, as reported
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: Old wheel's width, as reported
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: 608 outer race OD, about 22 mm
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: 608 width, about 7 mm
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 bore, nominal 8.0
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: M8 shank, about 8 mm
  pocket_d:
    value: 21.9
    unit: mm
    kind: design
    source: design
    note: Bearing pocket 0.1 mm under OD for a press fit in PLA
  axle_clear_d:
    value: 8.5
    unit: mm
    kind: design
    source: design
    note: Clearance through the centre web for the M8 bolt
parts:
- id: wheel
  role: final
  material: PLA (black)
  code: "def build(p):\n    r = p.wheel_od / 2.0\n    body = cq.Workplane('YZ', origin=(0,\
    \ 0, r)).circle(r).extrude(p.wheel_w)\n    pocket_a = cq.Workplane('YZ', origin=(0,\
    \ 0, r)).circle(p.pocket_d / 2.0).extrude(p.bearing_w)\n    pocket_b = cq.Workplane('YZ',\
    \ origin=(0, 0, r)).workplane(offset=p.wheel_w - p.bearing_w).circle(p.pocket_d\
    \ / 2.0).extrude(p.bearing_w)\n    axle = cq.Workplane('YZ', origin=(0, 0, r)).circle(p.axle_clear_d\
    \ / 2.0).extrude(p.wheel_w)\n    return body.cut(pocket_a).cut(pocket_b).cut(axle)\n"
  print_orientation: Lying on its side, wheel axis parallel to the bed (rim touches
    bed)
  use_orientation: Axle horizontal, rolling on the track
hardware:
- id: bolt
  ref: ISO 4762 M8x30
  qty: 1
joints: []
criteria:
- id: c1
  part: wheel
  feature: bearing pockets (21.9 mm x 7 mm, both ends)
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - pocket_d
  - bearing_od
  - bearing_w
  check:
    method: measure
    ref: null
    description: 'Test-fit one bearing in a pocket: it should press in and stay put
      without rattling.'
- id: c2
  part: wheel
  feature: axle hole 8.5 mm
  relation: clears
  hardware: bolt
  clearance_mm: null
  params:
  - axle_clear_d
  - bolt_d
  check:
    method: measure
    ref: null
    description: The M8 bolt should slide through the hole without binding.
manual:
- n: '1'
  text: Print the wheel lying on its side so the axle hole runs parallel to the bed.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '2'
  text: Press one 608 skateboard bearing (22 mm OD, 8 mm bore, 7 mm wide) into each
    end pocket (21.9 mm). Press on the outer race only. If it is loose, check the
    fit before using it.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '3'
  text: Slide your M8 bolt through the wheel's centre hole and both bearing bores,
    and attach it to the door bracket the way the old wheel was attached. Use the
    bolt length your bracket needs; the M8x30 entry is a placeholder.
  parts:
  - wheel
  hardware:
  - bolt
  tool: null
