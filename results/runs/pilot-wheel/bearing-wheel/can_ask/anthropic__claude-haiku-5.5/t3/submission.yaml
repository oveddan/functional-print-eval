task: bearing-wheel
note: ''
questions: []
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel 'about 50 mm across'
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel 'about 16 mm wide'
  bearing_od:
    value: 22
    unit: mm
    kind: world
    source: measured
    note: 608 OD ~22 mm; re-check with calipers flat
  bearing_w:
    value: 7
    unit: mm
    kind: world
    source: measured
    note: 608 width ~7 mm
  axle_d:
    value: 8
    unit: mm
    kind: world
    source: measured
    note: M8 bolt shank ~8 mm; bearing bore ~8 mm, so the fit is snug
  pocket_dia_clear:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: ''
  pocket_clear:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: ''
  hole_clear:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    wheel = cq.Workplane('XY').circle(p.wheel_od / 2).extrude(p.wheel_w)\n\
    \    depth = p.bearing_w + p.pocket_clear\n    pocket = (cq.Workplane('XY')\n\
    \              .workplane(offset=p.wheel_w - depth)\n              .circle((p.bearing_od\
    \ + p.pocket_dia_clear) / 2)\n              .extrude(depth + 1))\n    hole = (cq.Workplane('XY')\n\
    \            .circle((p.axle_d + p.hole_clear) / 2)\n            .extrude(p.wheel_w))\n\
    \    return wheel.cut(pocket).cut(hole)\n"
  print_orientation: lying flat, bearing pocket facing up (z = 0 on bed, axis vertical)
  use_orientation: rolling on axle, axis horizontal, tread down on the track
hardware: []
joints: []
criteria:
- id: bearing_seat
  part: wheel
  feature: bearing pocket
  relation: seats
  hardware: null
  clearance_mm: 0.2
  params:
  - bearing_od
  - bearing_w
  - pocket_dia_clear
  - pocket_clear
  check:
    method: measure
    ref: null
    description: Bearing seats fully in the pocket with its outer race on the pocket
      floor; pocket diameter about 22.4 mm
- id: axle_clear
  part: wheel
  feature: centre hole
  relation: clears
  hardware: null
  clearance_mm: 0.2
  params:
  - axle_d
  - hole_clear
  check:
    method: measure
    ref: null
    description: M8 bolt passes freely through the centre hole (about 8.4 mm)
manual:
- n: '1'
  text: Print the wheel with the bearing pocket facing up. PLA, 0.2 mm layers.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '2'
  text: Clean any stringing from the pocket and the centre hole. If the bearing is
    tight in the pocket, sand the pocket lightly. Do not force it.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '3'
  text: Press one 608 skateboard bearing (22 x 8 x 7 mm) into the pocket from the
    top until its outer race sits on the pocket floor. It will sit just below the
    top face.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '4'
  text: Slide the M8 bolt through the bearing bore and the wheel's centre hole, and
    mount it on the door bracket the way the old wheel was mounted. Spin the wheel
    before tightening. If the bearing binds on the bolt, lightly file the bolt threads
    or ream the bearing bore.
  parts:
  - wheel
  hardware: []
  tool: null
