task: bearing-wheel
note: ''
questions:
- text: How long is the M8 bolt from under the head to the tip, and does it thread
    into the door bracket or need a nut? The design uses an assumed ISO 4762 M8x30
    as the axle.
  answer: null
- text: Does the old wheel have a flanged or grooved tread that rides in a track?
    This design is a plain flat rim; a lip or groove needs a different profile.
  answer: null
- text: Does the 8 mm bolt fit through the 8 mm bearing bore with the inner race free
    to turn? The bore measured about 7.94 mm, so it may be tight and need reaming.
  answer: null
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel about 50 mm across
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel about 16 mm wide
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: 608 OD about 22 mm
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: 608 width about 7 mm
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: 608 bore about 8 mm (7.94 on calipers); rides on the axle
  axle_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: M8 bolt shank about 8 mm; same as bearing bore, so fit is tight, may need
      reaming
  pocket_clear:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: radial clearance for pressing bearings into the pockets
  pocket_depth_extra:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: pocket depth beyond bearing width
  axle_hole_d:
    value: 8.5
    unit: mm
    kind: design
    source: design
    note: clearance hole in the web for the axle
parts:
- id: wheel
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    r = p.wheel_od / 2\n    pocket_d = p.bearing_od + p.pocket_clear\n\
    \    depth = p.bearing_w + p.pocket_depth_extra\n    body = cq.Workplane('XY').circle(r).extrude(p.wheel_w)\n\
    \    for z0 in [0, p.wheel_w - depth]:\n        pocket = cq.Workplane('XY').workplane(offset=z0).circle(pocket_d\
    \ / 2).extrude(depth)\n        body = body.cut(pocket)\n    hole = cq.Workplane('XY').circle(p.axle_hole_d\
    \ / 2).extrude(p.wheel_w)\n    body = body.cut(hole)\n    return body\n"
  print_orientation: wheel lying flat on the bed (axle vertical, tread on the bed)
  use_orientation: axle horizontal, tread rolling on the track
hardware:
- id: axle
  ref: ISO 4762 M8x30
  qty: 1
- id: nut
  ref: ISO 10511 M8
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print the wheel flat on the bed, tread down, at 0.2 mm layer height. No supports
    are needed.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '2'
  text: Test-fit one of your 608 bearings in each pocket. It should press in by hand
    or with light pressure, seated flush with the wheel face. If it is tight, lightly
    ream the pocket with a 22.5 mm drill bit or sand the wall. Do not force it.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '3'
  text: Press one 608 bearing into the top pocket and one into the bottom pocket,
    so both are flush with their faces and the 1.6 mm web sits between them.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '4'
  text: 'Test the axle: slide the M8 bolt through both bearing bores. If it is tight,
    lightly ream the bores with an 8.1 mm drill by hand, or use a slightly smaller
    bolt. The inner race must turn freely on the axle before you install.'
  parts: []
  hardware:
  - axle
  tool: 8.1 mm drill bit (optional)
- n: '5'
  text: 'Mount the wheel: put the bolt through the bracket where the old wheel attached,
    through the wheel''s centre, and tighten the M8 nut on the other side. Hold the
    bolt head still while tightening. The wheel should spin freely with no side play.'
  parts: []
  hardware:
  - axle
  - nut
  tool: 13 mm wrench
