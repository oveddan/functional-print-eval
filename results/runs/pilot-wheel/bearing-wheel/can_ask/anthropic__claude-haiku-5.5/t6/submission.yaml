parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    r = p.wheel_od / 2.0\n    w = p.wheel_w\n    body = cq.Workplane('XY').circle(r).extrude(w).edges().fillet(1.0)\n\
    \    pocket_d = p.bearing_od + p.pocket_clear\n    depth = p.bearing_w + p.seat_extra\n\
    \    body = body.cut(cq.Workplane('XY').circle(pocket_d / 2.0).extrude(depth))\n\
    \    body = body.cut(cq.Workplane('XY').workplane(offset=w - depth).circle(pocket_d\
    \ / 2.0).extrude(depth))\n    body = body.cut(cq.Workplane('XY').circle(p.bolt_hole_d\
    \ / 2.0).extrude(w))\n    return body\n"
  print_orientation: flat, axis vertical (z = axis)
  use_orientation: rolls on track, axis horizontal
