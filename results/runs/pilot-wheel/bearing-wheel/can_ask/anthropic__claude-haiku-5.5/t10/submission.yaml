task: bearing-wheel
note: ''
questions:
- text: How long is the M8 bolt, from under the head to the tip? I need this to check
    it reaches through the wheel and the bracket.
  answer: null
- text: What is the inside width of the track channel the wheel runs in, and how much
    space is on each side of the wheel?
  answer: null
- text: 'How was the old wheel held on the bracket: bolt with a nut, a washer on each
    side, or a fixed axle? Does the bolt have to pass straight through to the other
    side?'
  answer: null
- text: Does the old wheel have a groove or flange, or is the rolling face flat?
  answer: null
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: Old wheel was about 50 mm across, per the user
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: Old wheel was about 16 mm wide, per the user. Not verified against the track
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: 608 OD, about 22 mm per user
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: 608 width, about 7 mm per user
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: 608 bore measured 7.94 mm; nominal 8.0
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: M8 shank, about 8 mm per user
  bolt_length:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: Not yet measured. Needed to check the bolt passes through the wheel and
      bracket
  track_width:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: Track channel width not measured. Needed to confirm 16 mm width clears
  pocket_clear:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: Radial and axial clearance around the bearing in its pocket
  bore_clear:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: Clearance so the bolt passes through the wheel hub
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    r = p.wheel_od / 2.0\n    w = cq.Workplane('XY').circle(r).extrude(p.wheel_w)\n\
    \    pocket_d = p.bearing_od + p.pocket_clear\n    pocket_depth = p.bearing_w\
    \ + 0.3\n    pocket = (cq.Workplane('XY').workplane(offset=p.wheel_w - pocket_depth)\n\
    \              .circle(pocket_d / 2.0).extrude(pocket_depth + 1))\n    w = w.cut(pocket)\n\
    \    bore = (cq.Workplane('XY').circle((p.bolt_d + p.bore_clear) / 2.0)\n    \
    \        .extrude(p.wheel_w + 2).translate((0, 0, -1)))\n    return w.cut(bore)\n"
  print_orientation: wheel lying with its axis vertical, bearing pocket facing up
    (z=0 on the bed)
  use_orientation: axis horizontal, rolling on the track, bearing pocket facing the
    bolt head side
hardware: []
joints: []
criteria: []
manual:
- n: '1'
  text: Print the wheel with its axis vertical, pocket facing up. Check the print
    is round and the bearing pocket is clean.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Press one 608 skateboard bearing (22 mm OD, 7 mm wide, 8 mm bore) into the
    pocket from the top, so it sits flush or slightly recessed. If it is loose, a
    drop of CA glue on the pocket wall holds it.
  parts: []
  hardware: []
  tool: null
- n: '3'
  text: Reuse the existing bracket and your M8 bolt the way the old wheel was mounted.
    Slide the wheel onto the bolt through the bearing bore. If the bolt will not pass
    the bearing, do not force it; ream the bore carefully or use a slightly smaller
    bolt.
  parts: []
  hardware: []
  tool: null
- n: '4'
  text: Check the wheel spins freely and runs in the track without rubbing the sides.
    Adjust washers if needed.
  parts: []
  hardware: []
  tool: null
