task: bearing-wheel
note: "Replacement roller wheel for a sliding closet door, spinning on two 608ZZ bearings\
  \ on an M8 bolt axle.\n\nWHAT I COULD AND COULDN'T FIND OUT\nYou gave the old wheel\
  \ as ~50 mm across and ~16 mm wide, so I used those. You couldn't measure the tread\
  \ profile or the bracket, so two things are assumptions:\n (1) I modelled a FLAT\
  \ tread with 2 mm broken edges (no groove, no flanges). If your original wheel was\
  \ grooved to run on a raised rail, this will still roll but may wander — tell me\
  \ and I'll add a V/U groove.\n (2) I assumed the axle bolt passes through a bracket\
  \ whose plates squeeze the two bearing INNER rings, with the printed wheel free\
  \ between them. The wheel + its two collars is 18 mm wide; the wheel alone is 16\
  \ mm. If the gap between your bracket plates is under 18 mm, edit collar_t from\
  \ 2.0 to 1.0 (collars then sit flush, total 16 mm) and accept a little side play.\n\
  \nHOW IT WORKS\nThe two 608 bearings are pressed into a Ø21.9 x 16 mm bore in the\
  \ wheel and meet in the middle, so each sits 1 mm below its face. The 8 mm M8 shank\
  \ is the shaft through both bearing bores; the wheel spins on the bearing OUTER\
  \ rings while the inner rings stay clamped by the bolt head and nut. Two printed\
  \ collars (Ø10.5 x Ø8.2 x 2 mm) drop into the 1 mm recesses and sit only on the\
  \ bearing inner rings — an M8 washer is Ø16 and would rub the shields, which is\
  \ why the collars are there instead. The collars stand 1 mm proud of each face so\
  \ the wheel face can't rub the bracket.\n\nFIT\nPLA shrinks and FDM round holes\
  \ print undersized, so 21.9 mm is a guess. Print the coupon first and press a bearing\
  \ into each hole; whichever hole holds the bearing with a firm hand press is your\
  \ real seat diameter — put that number in bearing_seat_d before printing the wheel.\n\
  \nHARDWARE\nBolt length depends on your bracket. ISO 4762 M8x40 covers a two-plate\
  \ fork with up to ~3 mm plates; M8x35 is tidier for a single plate. Use what your\
  \ existing bolt measures if it's in that range."
questions:
- text: Is the tread of the old wheel flat, or does it have a groove/flange, and what
    does the door track look like (a raised rail, or a channel)?
  answer: null
- text: Does the axle bolt go through the outside of a single flat bracket plate,
    or between the two plates of a fork?
  answer: null
- text: What is the inside gap between the bracket plates (or the plate thickness),
    so the bolt length and collar thickness are exact?
  answer: null
params:
  wheel_od:
    value: 50.0
    unit: mm
    kind: world
    source: asked
    note: Old wheel 'about 50 mm across'; tread diameter. Kept so door height and
      track contact stay the same.
  wheel_w:
    value: 16.0
    unit: mm
    kind: world
    source: asked
    note: Old wheel 'about 16 mm wide' along the axle.
  axle_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: M8 nominal shank/thread diameter; this is the shaft the 608 bore rides on.
  axle_len:
    value: 40.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8x40 chosen to span wheel + 2 collars + a two-plate bracket +
      washer + lock nut (grip ~34 mm). M8x35 works for a single thin plate.
  brg_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ outside diameter (22.000 -0.008). The field reading of 21.22 was taken
      with the bearing pinched in a jaw, so nominal is used.
  brg_bore:
    value: 8.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ bore.
  brg_w:
    value: 7.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ width; two of them = 14 mm of the 16 mm bore.
  brg_inner_ring_od:
    value: 11.0
    unit: mm
    kind: hardware
    source: guessed
    note: 608 inner-ring OD, from pitch dia ~15 minus ball dia ~4. Used to keep the
      collar OD below it so the clamp load never reaches the shield.
  nut_h:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 nylon-insert lock nut height (af 13).
  washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 plain washer, for the nut side only.
  bearing_seat_d:
    value: 21.9
    unit: mm
    kind: design
    source: guessed
    note: 'Printed bore diameter: 0.1 mm interference on the 22.0 bearing OD. CONFIRM
      WITH THE COUPON and edit before printing the wheel.'
  rim_chamfer:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: Break on the tread edges so the rim doesn't catch the track.
  bore_chamfer:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: Lead-in at each bore mouth. 2 x 1 mm leaves exactly the 14 mm the two bearings
      need.
  collar_od:
    value: 10.5
    unit: mm
    kind: design
    source: design
    note: Only just under the guessed 11 mm inner-ring OD, so the collar bears on
      the inner ring and misses the shield (r 5.25 vs 5.5).
  collar_id:
    value: 8.2
    unit: mm
    kind: design
    source: design
    note: 0.2 mm clearance on the M8 shank.
  collar_t:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: 1 mm to fill the bearing recess plus 1 mm proud. Set to 1.0 if the bracket
      gap is under 18 mm.
  coupon_len:
    value: 126.0
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_w:
    value: 30.0
    unit: mm
    kind: design
    source: design
    note: Leaves 4 mm of wall around the largest test hole.
  coupon_t:
    value: 6.0
    unit: mm
    kind: design
    source: design
    note: Enough grip length to feel the press fit.
  coupon_n:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: Number of test holes.
  coupon_spacing:
    value: 24.0
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_d0:
    value: 21.6
    unit: mm
    kind: design
    source: design
    note: Smallest test hole.
  coupon_step:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: Holes go 21.6, 21.7, 21.8, 21.9, 22.0 from the notched end.
  coupon_mark:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: Corner notch marking the small-hole end of the coupon.
parts:
- id: wheel
  role: final
  material: PLA (high-speed, black)
  code: "import cadquery as cq\nfrom cadquery.selectors import NearestToPointSelector\n\
    \ndef build(p):\n    ro  = p.wheel_od / 2.0\n    w   = p.wheel_w\n    rb  = p.bearing_seat_d\
    \ / 2.0\n    rim = p.rim_chamfer\n    bch = p.bore_chamfer\n\n    # solid disc:\
    \ z = 0 .. wheel_w\n    body = cq.Workplane(\"XY\").circle(ro).extrude(w)\n  \
    \  # press-fit bore right through\n    body = body.cut(\n        cq.Workplane(\"\
    XY\", origin=(0, 0, -1)).circle(rb).extrude(w + 2)\n    )\n    # break the tread\
    \ edges\n    body = body.edges(NearestToPointSelector((ro, 0, 0))).chamfer(rim)\n\
    \    body = body.edges(NearestToPointSelector((ro, 0, w))).chamfer(rim)\n    #\
    \ lead-ins on the bore mouths (kept to 1 mm so the 14 mm bearing seat survives)\n\
    \    body = body.edges(NearestToPointSelector((rb, 0, 0))).chamfer(bch)\n    body\
    \ = body.edges(NearestToPointSelector((rb, 0, w))).chamfer(bch)\n    return body"
  print_orientation: 'Exactly as modelled: the flat annular face at z=0 on the bed,
    wheel axis vertical. No supports needed; the 45 deg bore and rim chamfers are
    self-supporting.'
  use_orientation: Axis horizontal. The M8 bolt goes through the two bearings in the
    central bore and through the door bracket; the tread rolls on the track.
- id: collar
  role: final
  material: PLA (high-speed, black)
  code: "import cadquery as cq\n\ndef build(p):\n    ro = p.collar_od / 2.0\n    ri\
    \ = p.collar_id / 2.0\n    t  = p.collar_t\n    body = cq.Workplane(\"XY\").circle(ro).extrude(t)\n\
    \    body = body.cut(\n        cq.Workplane(\"XY\", origin=(0, 0, -1)).circle(ri).extrude(t\
    \ + 2)\n    )\n    return body"
  print_orientation: 'Exactly as modelled: flat face on the bed, axis vertical. A
    2 mm ring, no supports. Print two.'
  use_orientation: 'One each side of the wheel: sits in the 1 mm bearing recess, its
    inner 1 mm inside the bore and 1 mm proud of the wheel face, flat against the
    bearing inner ring.'
- id: coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "import cadquery as cq\n\ndef build(p):\n    L, W, T = p.coupon_len, p.coupon_w,\
    \ p.coupon_t\n    n  = int(p.coupon_n)\n    sp = p.coupon_spacing\n    body =\
    \ cq.Workplane(\"XY\").box(L, W, T, centered=(True, True, False))\n    for i in\
    \ range(n):\n        x = -sp * (n - 1) / 2.0 + i * sp\n        d = p.coupon_d0\
    \ + i * p.coupon_step\n        body = body.cut(\n            cq.Workplane(\"XY\"\
    , origin=(x, 0, -1)).circle(d / 2.0).extrude(T + 2)\n        )\n    # corner notch\
    \ marks the small-hole end\n    notch = (cq.Workplane(\"XY\", origin=(-L / 2.0,\
    \ W / 2.0, -1))\n             .polyline([(0, 0), (p.coupon_mark, 0), (0, -p.coupon_mark)]).close()\n\
    \             .extrude(T + 2))\n    body = body.cut(notch)\n    return body"
  print_orientation: 'Exactly as modelled: flat plate on the bed, test holes vertical
    so they print round like the wheel bore.'
  use_orientation: Bench test only. Press one 608ZZ into each test hole and find the
    one that grips with a firm hand press.
hardware:
- id: axle_bolt
  ref: ISO 4762 M8x40
  qty: 1
- id: brg608
  ref: 608ZZ
  qty: 2
- id: lock_nut
  ref: ISO 10511 M8
  qty: 1
- id: washer
  ref: ISO 7089 M8
  qty: 1
joints:
- id: J_axle
  fastener: axle_bolt
  axis_origin:
  - 0.0
  - 0.0
  - -1.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel
    feature: central bearing bore, Ø21.9 through — the bolt runs inside the two 608
      inner rings
    role: clearance
  - part: collar
    feature: Ø8.2 bore
    role: clearance
  - part: collar
    feature: Ø8.2 bore (second collar, far side of the wheel)
    role: clearance
  nut: lock_nut
  external: 'The door bracket''s axle hole: the M8 bolt passes through it and the
    bracket is clamped between collar B and the washer. Ream the hole to 8.5 mm if
    it is under 8.2 mm.'
criteria:
- id: c_bearing_fit
  part: wheel
  feature: bearing_bore (Ø21.9 x 16)
  relation: contains
  hardware: brg608
  clearance_mm: null
  params:
  - bearing_seat_d
  - brg_od
  check:
    method: coupon
    ref: coupon
    description: Press one 608ZZ into each of the five coupon holes. The hole that
      holds it with a firm hand press sets bearing_seat_d. If the value that works
      is not 21.9, edit bearing_seat_d before printing the wheel.
- id: c_collar_clear
  part: collar
  feature: Ø8.2 bore
  relation: clears
  hardware: axle_bolt
  clearance_mm: 0.2
  params:
  - collar_id
  - axle_d
  check:
    method: none
    ref: null
    description: Nominal 0.2 mm annular clearance on the M8 shank.
- id: c_collar_inner_ring
  part: collar
  feature: outer rim face
  relation: seats
  hardware: brg608
  clearance_mm: null
  params:
  - collar_od
  - brg_inner_ring_od
  check:
    method: none
    ref: null
    description: Collar OD 10.5 mm sits inside the ~11 mm inner-ring OD, so the bolt-head
      and nut load goes into the stationary inner ring and never drags the shield
      or outer ring.
- id: c_tread_od
  part: wheel
  feature: tread
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  check:
    method: measure
    ref: null
    description: 'Measure the printed tread across its widest point: should be 50
      mm to match the old wheel and keep the door at the same height on the track.'
- id: c_frame_clearance
  part: collar
  feature: outer face (1 mm proud of the wheel face)
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - collar_t
  - wheel_w
  check:
    method: measure
    ref: null
    description: Wheel + 2 collars = 18 mm. Measure the bracket gap; if under 18 mm
      set collar_t to 1.0 so the assembly is 16 mm.
manual:
- n: '1'
  text: Print the press-fit coupon flat, as modelled. It is a 126 x 30 x 6 mm bar
    with five vertical holes, 21.6, 21.7, 21.8, 21.9, 22.0 mm, increasing from the
    end with the corner notch.
  parts:
  - coupon
  hardware: []
  tool: printer
- n: '2'
  text: Press one 608ZZ bearing into each coupon hole by hand. Find the hole that
    grips the bearing firmly without forcing and without it dropping out — that diameter
    is your real bearing seat.
  parts:
  - coupon
  hardware:
  - brg608
  tool: null
- n: '3'
  text: If the best hole is not 21.9 mm, edit bearing_seat_d in the wheel code to
    that value.
  parts:
  - coupon
  hardware: []
  tool: null
- n: '4'
  text: Print the wheel flat, exactly as modelled — one face on the bed, wheel axis
    vertical. Solid 50 mm disc, 16 mm wide, central bore. No supports.
  parts:
  - wheel
  hardware: []
  tool: printer
- n: '5'
  text: Print two collars flat.
  parts:
  - collar
  hardware: []
  tool: printer
- n: '6'
  text: 'Check the printed bore: press one 608ZZ into the wheel bore from one face
    until its outer race is 1 mm below the face; press the second in from the other
    face until it meets the first in the middle. Each bearing should end up 1 mm below
    its face and the two should butt at mid-width. If a bearing is too tight to press,
    sand the bore lightly; if it drops in loose, reprint with a smaller bearing_seat_d.'
  parts:
  - wheel
  hardware:
  - brg608
  tool: null
- n: '7'
  text: Drop a collar into the 1 mm recess at each face, flat against the bearing
    so it rests on the bearing's inner ring. It should stand 1 mm proud of the wheel
    face.
  parts:
  - wheel
  - collar
  hardware: []
  tool: null
- n: '8'
  text: Push the M8 bolt through collar, bearing, bearing, collar, so the bolt head
    ends up flat against the outer collar.
  parts:
  - wheel
  - collar
  hardware:
  - axle_bolt
  tool: null
- n: '9'
  text: Offer the bolt up to the door bracket and pass it through the bracket's axle
    hole. If the hole is under 8.2 mm, ream it to 8.5 mm first. Check the wheel is
    clear of the bracket faces by about 1 mm on each side.
  parts:
  - wheel
  - collar
  hardware:
  - axle_bolt
  tool: drill
- n: '10'
  text: Fit the M8 washer and the M8 nylon-insert lock nut on the far side of the
    bracket. Tighten until snug, then back the nut off about a quarter turn — the
    clamp must reach the bearing inner rings only. If the bracket gap is under 18
    mm and the parts will not close up, stop and reprint the collars 1 mm thick (collar_t
    = 1.0).
  parts: []
  hardware:
  - washer
  - lock_nut
  tool: 8 mm spanner
- n: '11'
  text: 'Spin the wheel by hand: it should turn freely and smoothly, carried by the
    bearings, with no rock and no rubbing on the bracket. If it is stiff, the inner
    rings are being pinched — loosen the nut. If it wobbles, the collars are too thick
    for the gap.'
  parts:
  - wheel
  - collar
  hardware:
  - lock_nut
  tool: null
- n: '12'
  text: Refit the door on its track and roll it along. The wheel should run true down
    the track; if it wanders sideways, the original wheel was probably grooved and
    a V-groove needs adding to the tread.
  parts:
  - wheel
  hardware: []
  tool: null
