manual:
- n: '1'
  text: Print fit-coupon. 10 mm bar, four blind pockets left to right Ø21.70, 21.85,
    22.00, 22.15, each 6.2 mm deep. Lay it flat, 0.2 mm layers, 3 walls, 15 percent
    infill, no supports.
  parts:
  - fit-coupon
  hardware: []
  tool: 3D printer
- n: '2'
  text: Press one 608 bearing into each pocket in turn. The one that takes a firm
    thumb-press - snug, no rock, but pushable out with a screwdriver - is your printer's
    true hole size. Ø22.00 is what the wheel is modelled at. If the 22.00 pocket is
    too tight, add about +0.15 mm XY hole compensation in the slicer; if too loose,
    -0.15 mm.
  parts: []
  hardware:
  - bearing
  tool: null
- n: '3'
  text: Print wheel. It is modelled lying flat with the axle vertical - print it that
    way so both pockets and the hub bore come out round. 0.2 mm layers, 4 walls, 5
    top/bottom layers, 30 percent infill, no supports, no brim.
  parts:
  - wheel
  hardware: []
  tool: 3D printer
- n: '4'
  text: Press one bearing into each face of the wheel until it bottoms on the central
    shoulder. They should finish 0.8 mm proud of the wheel faces. Use a vise or a
    mallet and a flat block, tapping straight in. If a bearing drops in loose, wick
    a drop of cyanoacrylate around its outer race.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '5'
  text: Take the broken wheel off the roller fitting on the door and leave the fitting
    in place. If the fitting's axle hole is smaller than 8.5 mm, drill it out to 8.5
    mm so the M8 bolt passes through.
  parts: []
  hardware: []
  tool: drill
- n: '6'
  text: 'Thread the axle: M8x35 bolt, then a washer, then through the door fitting,
    then through the wheel (and both bearings), then the second washer, then the lock
    nut.'
  parts:
  - wheel
  hardware:
  - bolt
  - washer
  - nut
  tool: null
- n: '7'
  text: Hold the bolt's head still and tighten the lock nut. Clamp until the wheel
    cannot rock side to side but still spins freely, with about a 0.8 mm gap between
    the fitting and each face of the wheel.
  parts:
  - wheel
  hardware:
  - nut
  tool: spanner
- n: '8'
  text: Hang the door back on its track. Check the wheel runs centred and quiet and
    that the rim sits on the same part of the track as before. Back the nut off a
    quarter turn if it feels tight, and re-check after a day's use.
  parts:
  - wheel
  hardware: []
  tool: null
