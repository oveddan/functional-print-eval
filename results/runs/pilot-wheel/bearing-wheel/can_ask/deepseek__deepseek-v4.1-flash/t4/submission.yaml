parts:
- id: wheel
  role: final
  material: PLA
  code: "import cadquery as cq\n\n\ndef build(p):\n    V = cq.Vector\n    up = V(0,\
    \ 0, 1)\n    R = p.wheel_od / 2.0\n    W = p.wheel_width\n    ec = p.rim_chamfer\n\
    \    pr = (p.bearing_od - p.press_fit) / 2.0\n    pd = p.bearing_width - p.protrusion\n\
    \    pch = p.pocket_chamfer\n    ar = (p.bolt_d + p.axle_clr) / 2.0\n\n    body\
    \ = cq.Solid.makeCylinder(R, W, V(0, 0, 0), up)\n\n    ring_t = cq.Solid.makeCylinder(R,\
    \ ec, V(0, 0, W - ec), up)\n    cone_t = cq.Solid.makeCone(R - ec, R, ec, V(0,\
    \ 0, W - ec), up)\n    body = body.cut(ring_t.cut(cone_t))\n\n    ring_b = cq.Solid.makeCylinder(R,\
    \ ec, V(0, 0, 0), up)\n    cone_b = cq.Solid.makeCone(R, R - ec, ec, V(0, 0, 0),\
    \ up)\n    body = body.cut(ring_b.cut(cone_b))\n\n    cyl_t = cq.Solid.makeCylinder(pr,\
    \ pd - pch, V(0, 0, W - pd), up)\n    cne_t = cq.Solid.makeCone(pr, pr + pch,\
    \ pch, V(0, 0, W - pch), up)\n    cyl_b = cq.Solid.makeCylinder(pr, pd - pch,\
    \ V(0, 0, pch), up)\n    cne_b = cq.Solid.makeCone(pr, pr + pch, pch, V(0, 0,\
    \ pch), V(0, 0, -1))\n    body = body.cut(cyl_t.fuse(cne_t))\n    body = body.cut(cyl_b.fuse(cne_b))\n\
    \n    body = body.cut(cq.Solid.makeCylinder(ar, W + 2.0, V(0, 0, -1.0), up))\n\
    \    return body\n"
  print_orientation: Wheel lying flat on the bed, axle axis vertical (world Z), z
    = 0 on the bed. Support-free; the pockets and hub bore come out as true circles.
  use_orientation: Axle horizontal, wheel standing upright, sandwiched on the M8 bolt
    between the door's roller fitting and the lock nut; rim sits on the track.
- id: fit-coupon
  role: coupon
  material: PLA
  code: "import cadquery as cq\n\n\ndef build(p):\n    up = cq.Vector(0, 0, 1)\n \
    \   dias = [p.fit_a, p.fit_b, p.fit_c, p.fit_d]\n    pitch = p.fit_pitch\n   \
    \ t = p.fit_bar_t\n    pd = p.bearing_width - p.protrusion\n    pch = p.pocket_chamfer\n\
    \    n = len(dias)\n    L = pitch * (n - 1) + 24.0\n    Wd = 24.0\n    body =\
    \ cq.Solid.makeBox(L, Wd, t, cq.Vector(-L / 2.0, -Wd / 2.0, 0.0))\n    x0 = -L\
    \ / 2.0 + 12.0\n    for i, d in enumerate(dias):\n        pr = d / 2.0\n     \
    \   x = x0 + i * pitch\n        cyl = cq.Solid.makeCylinder(pr, pd - pch, cq.Vector(x,\
    \ 0, t - pd), up)\n        cne = cq.Solid.makeCone(pr, pr + pch, pch, cq.Vector(x,\
    \ 0, t - pch), up)\n        body = body.cut(cyl.fuse(cne))\n    return body\n"
  print_orientation: Bar flat on the bed, pockets opening upward, z = 0 on the bed.
  use_orientation: Hand-held only; not part of the finished door.
