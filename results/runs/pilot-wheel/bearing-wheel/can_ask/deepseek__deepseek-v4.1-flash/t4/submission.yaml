task: bearing-wheel
note: 'A replacement roller wheel that spins on an M8 bolt on two 608 bearings. Printed
  flat (axle vertical) so both 22 mm bearing pockets come out round. One bearing presses
  into a pocket in each face and bottoms on a 3.6 mm central shoulder, standing 0.8
  mm proud so neither face of the wheel can rub the door fitting. The bolt passes
  through the wheel''s hub bore and both bearing bores; the inner races clamp between
  the fitting and a lock nut, so the bolt stays still and the wheel spins on the bearing
  outer races. Rim is 50 x 16 mm, matching the old wheel, with 2 mm chamfered shoulders.
  A fit coupon is included because the bearing press-fit varies printer to printer:
  print it first and set ''XY hole compensation'' accordingly. The rim profile, track
  width and fitting plate thickness could not be measured and are assumed - see the
  questions.'
questions:
- text: Does the old wheel have a groove around the middle of its rim (to ride a rail),
    or is the running surface plain? I modelled a plain 16 mm running band, 50 mm
    OD, with 2 mm chamfered shoulders. If it was grooved, tell me the groove width
    and depth and I will add it.
  answer: null
- text: How thick is the plate of the door's roller fitting where the axle passes
    through? I assumed 3 mm, which the M8x35 bolt covers up to about 6 mm. Thicker
    than that needs an M8x40.
  answer: null
- text: Is your own M8 bolt at least 35 mm long under the head? If it is shorter,
    use the ISO 4762 M8x35 from the list instead.
  answer: null
- text: What is the inside width and depth of the track channel the wheel runs in?
    I matched the rim to the old wheel's 16 mm width instead of measuring the track.
  answer: null
