task: bearing-wheel
note: 'A replacement 50 mm x 16 mm roller that spins on your own M8 bolt, running
  on the two 608 bearings. Two bearings fill 14 of the 16 mm width, so the wheel is
  a drum with a 22 mm pocket 7 mm deep opening on each face and a 2 mm web between
  them - and that web is bored out to 13 mm on purpose: the wheel must NOT sit between
  the two inner rings, or tightening the axle would squeeze the wheel solid. The clamp
  load instead goes head -> side spacer -> inner ring -> 2 mm mid spacer -> inner
  ring -> side spacer -> bracket -> lock nut, which is exactly the skateboard arrangement
  (bearing spacer plus speed rings). The 11.4 mm-OD side spacers are printed because
  the M8 washers in the hardware list are 16 mm across - wide enough to rub the rotating
  shield - and the list has no shoulder washer or ground 8 mm axle, so the far inner
  ring rides on thread crests (harmless here: the inner rings do not rotate relative
  to the bolt). THE ONE THING TO PROVE FIRST is the bearing pocket diameter, which
  is what the coupon is for: 22.05 mm is a light press on a 22.0 bearing in PLA, but
  printed holes come out undersized by 0.1-0.3 mm, so press a bearing into all four
  coupon bores and pick the smallest that grips without cracking. Three values are
  still guesses and flagged as such: the bracket thickness (3 mm, sets only the bolt
  length), the bracket hole (8.4 mm), and the old wheel''s OD and track shape (50
  mm, flat tread assumed from your \"about 50 mm across\").'
questions:
- text: What diameter does the old wheel actually measure across the tread, with the
    two broken halves held together? If it's more than about a millimetre off 50 mm
    I'll rescale the wheel so the door hangs at the same height.
  answer: null
- text: How does the axle mount - is there a bracket with a hole the bolt passes through
    with a nut on the far side, and roughly how thick is that material? That fixes
    the bolt length (3 mm assumed).
  answer: null
- text: Was the old wheel's rim flat and smooth across its whole width, or was there
    a groove in the middle (i.e. does it roll on a raised rail rather than sitting
    in a channel)? And how wide is the track where it runs?
  answer: null
- text: How long is your own M8 bolt from under the head to the tip? If it's 37-45
    mm you can use it and skip the catalog screw; over 45 mm I'll add washers or you
    can cut it down.
  answer: null
- text: Which coupon bore grips a bearing best - how many dots? If it isn't the 2-dot
    (22.05 mm) bore, I'll change pocket_dia and you reprint one coupon to confirm.
  answer: null
params:
  axle_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: M8 nominal shank. A real M8 screw measures 7.76-7.98 over the crests, so
      the bearings have a few hundredths of play on the thread.
  axle_len:
    value: 40.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8x40. 36 mm must be under the head with a 3 mm bracket; this leaves
      ~4 mm past the nut. Your own M8 bolt is fine if it's 37-45 mm under the head.
  bracket_hole_d:
    value: 8.4
    unit: mm
    kind: world
    source: guessed
    note: The existing hole the axle slides through; assumed a clearance hole for
      M8.
  bracket_t:
    value: 3.0
    unit: mm
    kind: world
    source: guessed
    note: Thickness of the door/bracket material the axle passes through - this is
      the measurement that didn't come back, so I assumed 3 mm. It only affects the
      bolt length (criterion c7).
  brg_bore:
    value: 8.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ bore - the M8 axle passes through it.
  brg_ir_od:
    value: 11.9
    unit: mm
    kind: hardware
    source: guessed
    note: 608 inner-ring outside diameter - the hard ceiling on the printed spacer
      rings. Anything wider rubs the shield/seal and drags on the spinning wheel.
  brg_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ outer diameter, 22.000 -0.008. The 21.22 caliper reading looks like
      it was taken across the jaw tips at an angle.
  brg_w:
    value: 7.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ width. Two of them = 14 mm of the 16 mm wheel width.
  head_d:
    value: 13.0
    unit: mm
    kind: hardware
    source: catalog
    note: M8 socket head diameter - it fully covers the 11.4 mm spacer ring, so no
      washer is needed under the head.
  head_h:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: M8 socket head height.
  nut_h:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 nylon-insert lock nut height.
  pocket_chamfer:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: 45 deg lead-in at each pocket mouth so the bearings press in without cracking
      the printed lip.
  pocket_dia:
    value: 22.05
    unit: mm
    kind: design
    source: design
    note: Bearing pocket - a light press on a 22.0 bearing. This is the one dimension
      worth proving on the coupon before printing the wheel.
  spacer_id:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: Clearance bore over the M8 shank.
  spacer_mid_t:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: wheel_w - 2 x brg_w = 16 - 14. Sits between the two inner rings so the bolt
      clamps the inner rings, not the wheel - the job a skateboard bearing spacer
      does.
  spacer_od:
    value: 11.4
    unit: mm
    kind: design
    source: design
    note: Spacer ring OD - deliberately under the 11.9 mm inner-ring OD so the rings
      touch the inner ring only. This is what stands in for the shoulder washer that
      isn't in the hardware list.
  spacer_side_t:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: Thickness of each side spacer ring (two off). Lifts the screw head and the
      bracket clear of the rotating shields and gives a 3 mm gap between the wheel
      and the bracket.
  track_clear_w:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: Clear width of the track channel, and its shape - never measured. Must be
      more than 16 mm or the tread will rub the sides.
  tread_chamfer:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: 45 deg lead on both tread edges so the wheel finds the track without a sharp
      catching lip.
  washer_t:
    value: 1.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 plain washer thickness (used under the nut, bracket side).
  web_bore:
    value: 13.0
    unit: mm
    kind: design
    source: design
    note: Bore through the 2 mm centre web. Must be bigger than the 11.9 inner-ring
      OD so the web doesn't sit between the two inner rings (that would clamp the
      wheel solid).
  wheel_od:
    value: 50.0
    unit: mm
    kind: world
    source: asked
    note: '"about 50 mm across". Drives the door''s ride height - if you can get a
      caliper on the broken halves and it''s more than ~1 mm off, tell me and I''ll
      rescale.'
  wheel_w:
    value: 16.0
    unit: mm
    kind: world
    source: asked
    note: '"about 16 mm wide". Must be narrower than the track channel''s clear width.'
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    R = p.wheel_od / 2.0\n    w = p.wheel_w\n    rp = p.pocket_dia\
    \ / 2.0\n    rw = p.web_bore / 2.0\n    bw = p.brg_w\n    c = p.tread_chamfer\n\
    \    c2 = p.pocket_chamfer\n    # Cross-section in the r-z plane; z is the print\
    \ axis, 0 = the bed face.\n    # A 22 mm bearing pocket opens on each face, 7\
    \ deep, with a 2 mm web\n    # between them, bored to 13 so it cannot trap the\
    \ two inner rings.\n    pts = [\n        (rp + c2, 0.0),      # bed face, inner\
    \ edge (pocket mouth chamfer)\n        (R - c, 0.0),        # bed face out to\
    \ the rim\n        (R, c),              # rim chamfer\n        (R, w - c),   \
    \       # tread\n        (R - c, w),          # rim chamfer\n        (rp + c2,\
    \ w),        # top face\n        (rp, w - c2),        # far pocket mouth chamfer\n\
    \        (rp, w - bw),        # far pocket wall down to its shoulder\n       \
    \ (rw, w - bw),        # far pocket floor in to the web bore\n        (rw, bw),\
    \            # web bore wall\n        (rp, bw),            # near pocket floor\n\
    \        (rp, c2),            # near pocket wall up to the mouth\n    ]\n    return\
    \ (cq.Workplane(\"XZ\")\n            .polyline(pts).close()\n            .revolve(360.0,\
    \ (0, 0, 0), (0, 1, 0)))"
  print_orientation: 'Flat: the z = 0 face (a bearing pocket mouth) on the bed, print
    axis = the axle axis, vertical. No supports; the only bridge is the ~4.5 mm-wide
    ring over the lower pocket''s ceiling. 0.2 mm layers, 4+ perimeters, same profile
    as the coupon.'
  use_orientation: Axle axis horizontal. The z = 0 face points at the screw head,
    the z = 16 face at the door bracket; the tread lands on the track. Symmetric front-to-back,
    so either face can go on the bed.
- id: spacer_side
  role: final
  material: PLA
  code: "def build(p):\n    return (cq.Workplane(\"XY\")\n            .circle(p.spacer_od\
    \ / 2.0)\n            .extrude(p.spacer_side_t)\n            .faces(\">Z\").workplane()\n\
    \            .circle(p.spacer_id / 2.0)\n            .cutThruAll())"
  print_orientation: Flat ring, axis vertical, on the bed. Print two.
  use_orientation: 'One on each side of the wheel on the M8 axle: the head-side one
    between the screw head and the first bearing''s inner ring, the other between
    the far inner ring and the door bracket. It presses the inner ring only - its
    11.4 mm OD stays clear of the 11.9 mm inner-ring edge and of everything that rotates.'
- id: spacer_mid
  role: final
  material: PLA
  code: "def build(p):\n    return (cq.Workplane(\"XY\")\n            .circle(p.spacer_od\
    \ / 2.0)\n            .extrude(p.spacer_mid_t)\n            .faces(\">Z\").workplane()\n\
    \            .circle(p.spacer_id / 2.0)\n            .cutThruAll())"
  print_orientation: Flat ring, axis vertical, on the bed. Print one.
  use_orientation: Dropped into the far pocket so it lands between the two bearing
    inner rings, inside the wheel's 13 mm web bore. It carries the clamp load from
    one inner ring to the other, like a skateboard bearing spacer - without it the
    wheel would slide 2 mm along the axle and the web would be squeezed.
- id: coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    L, Wd, T = 130.0, 42.0, 8.0\n    dias = [p.pocket_dia\
    \ - 0.15, p.pocket_dia, p.pocket_dia + 0.15, p.pocket_dia + 0.30]\n    plate =\
    \ cq.Workplane(\"XY\").box(L, Wd, T).translate((0, 0, T / 2.0))\n    for i, d\
    \ in enumerate(dias):\n        hole = (cq.Workplane(\"XY\")\n                .center(-45.0\
    \ + i * 30.0, 0)\n                .circle(d / 2.0)\n                .extrude(T\
    \ + 40.0)\n                .translate((0, 0, -20.0)))\n        plate = plate.cut(hole)\n\
    \    # count-the-dots marker: 1 dot = smallest bore, 4 dots = largest\n    for\
    \ i in range(4):\n        for j in range(i + 1):\n            dot = (cq.Workplane(\"\
    XY\")\n                   .center(-50.0 + 6.0 * j, 15.0)\n                   .circle(1.2)\n\
    \                   .extrude(T)\n                   .translate((0, 0, T - 2.0)))\n\
    \            plate = plate.cut(dot)\n    return plate"
  print_orientation: Flat on the bed, 8 mm thick, the four bores vertical - the same
    direction the wheel's bearing pockets print, so the fit transfers. Same profile/settings
    as the wheel.
  use_orientation: Test only. Left to right the bores are 21.90 / 22.05 / 22.20 /
    22.35 mm, marked by 1 / 2 / 3 / 4 dots along the top edge.
hardware:
- id: brg
  ref: 608ZZ
  qty: 2
- id: axle
  ref: ISO 4762 M8x40
  qty: 1
- id: locknut
  ref: ISO 10511 M8
  qty: 1
- id: washer
  ref: ISO 7089 M8
  qty: 1
- id: axle_long
  ref: ISO 4762 M8x45
  qty: 1
joints:
- id: axle_joint
  fastener: axle
  axis_origin:
  - 0.0
  - 0.0
  - -3.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: spacer_side
    feature: outer face, screw-head side (the head bears here)
    role: head_seat
  - part: wheel
    feature: bearing pockets and 13 mm web bore (axle passes clear through)
    role: clearance
  - part: spacer_mid
    feature: 8.4 mm bore
    role: clearance
  - part: spacer_side
    feature: outer face, bracket side
    role: washer
  nut: locknut
  external: 'the door''s existing roller fitting: a plain clearance hole (assumed
    8.4 mm) through the bracket/door material (assumed 3 mm thick) that the axle passes
    through'
criteria:
- id: c1_pocket_fit
  part: wheel
  feature: bearing pockets on both faces (22.05 dia x 7 deep)
  relation: contains
  hardware: brg
  clearance_mm: -0.05
  params:
  - pocket_dia
  - brg_od
  check:
    method: coupon
    ref: coupon
    description: Press a 608 into each of the four coupon bores, supporting the plate
      flat on a vice jaw or wood block and pushing on the outer ring. Pick the smallest
      bore that needs a firm straight push, holds the bearing so it can't be shaken
      out, and doesn't crack the plate. Count the dots; if it isn't the 2-dot (22.05
      mm) bore, set pocket_dia to that number and print the coupon again before the
      wheel.
- id: c2_shoulder
  part: wheel
  feature: pocket shoulders - the web faces at z = 7 and z = 9
  relation: supports
  hardware: brg
  clearance_mm: null
  params:
  - brg_w
  - wheel_w
  check:
    method: none
    ref: null
    description: Pocket depth equals the 7 mm bearing width, so each outer ring bottoms
      flat on its shoulder with its outer face flush with the wheel's face. That flush
      face is what sets the 3 mm side spacer height.
- id: c3_web_bore
  part: wheel
  feature: 13 mm web bore
  relation: clears
  hardware: axle
  clearance_mm: 5.0
  params:
  - web_bore
  - axle_d
  check:
    method: none
    ref: null
    description: Diametral clearance over the M8 shank.
- id: c4_web_clears_rings
  part: wheel
  feature: 13 mm web bore vs the bearing inner rings
  relation: clears
  hardware: brg
  clearance_mm: 1.1
  params:
  - web_bore
  - brg_ir_od
  check:
    method: none
    ref: null
    description: 'Diametral: a 13.0 bore against a ~11.9 inner-ring OD. This gap is
      deliberate - it lets the clamp load pass bearing-to-bearing through the mid
      spacer instead of squeezing the web, which would lock the wheel.'
- id: c5_spacer_od
  part: spacer_mid
  feature: 11.4 mm OD rim
  relation: clears
  hardware: brg
  clearance_mm: 0.5
  params:
  - spacer_od
  - brg_ir_od
  check:
    method: none
    ref: null
    description: 'Radial: 11.4 mm spacer OD against a ~11.9 mm inner-ring OD. A wider
      spacer would rub the shield and drag on the spinning wheel.'
- id: c6_head_seat
  part: spacer_side
  feature: outer face, screw-head side
  relation: seats
  hardware: axle
  clearance_mm: null
  params:
  - spacer_side_t
  - head_d
  check:
    method: none
    ref: null
    description: The 13 mm socket head covers the 11.4 mm spacer face completely and
      sits 3 mm off the wheel, so it never touches the rotating shield.
- id: c7_axle_length
  part: spacer_side
  feature: outer face, bracket side (the stack the axle spans)
  relation: engages
  hardware: axle
  clearance_mm: null
  params:
  - wheel_w
  - spacer_side_t
  - bracket_t
  - washer_t
  - nut_h
  - axle_len
  check:
    method: template
    ref: required under-head length = 3 + 16 + 3 + bracket_t + 1 + 8 + 2 = 36 mm with
      a 3 mm bracket; ISO 4762 M8x40 (40 mm) covers brackets up to 6 mm with ~4 mm
      past the nut
    description: Measure the bracket thickness where the axle passes through and check
      the bolt reaches through it with the nut fully engaged. Thicker than ~6 mm,
      use the M8x45 (or add M8 washers under the nut); more than a few mm sticking
      out past the nut, file it flush or pack with washers.
- id: c8_track
  part: wheel
  feature: 16 mm wide tread, 50 mm OD
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - wheel_w
  - wheel_od
  - track_clear_w
  check:
    method: measure
    ref: null
    description: 'Check against the track itself: the 16 mm tread must sit in the
      channel without rubbing the sides, and the new OD has to match the old wheel
      closely enough that the door still hangs at the right height. Track shape and
      the old wheel''s OD were never measured - tell me both and I''ll adjust wheel_od
      and the tread.'
manual:
- n: '1'
  text: 'Print the fit coupon first, on its own, with the profile you intend to use
    for the wheel (0.2 mm layers, 4+ perimeters, no supports, hole compensation left
    as it is). Work down the four bores left to right - 21.90, 22.05, 22.20, 22.35
    mm, marked by 1, 2, 3 and 4 dots along the top edge. Press a 608 into each: support
    the plate flat on a vice jaw or hardwood block and push on the bearing''s OUTER
    ring only, never the seal or the inner ring. The right bore is the smallest that
    needs a firm straight push, holds the bearing so it can''t be shaken out, and
    doesn''t crack or craze the plate. If it isn''t the 2-dot bore, tell me the dot
    count - I''ll set pocket_dia to it and you print one more coupon to confirm before
    the wheel.'
  parts:
  - coupon
  hardware:
  - brg
  tool: vice or clamp, flat plate to press with
- n: '2'
  text: 'Print the wheel and the three rings: wheel x1 with its flat face on the bed
    (no supports), spacer_side x2, spacer_mid x1. Same filament profile as the coupon
    - do not tweak hole compensation between the coupon and the wheel, or the fit
    will not transfer.'
  parts:
  - wheel
  - spacer_side
  - spacer_mid
  hardware: []
  tool: printer
- n: '3'
  text: Press one 608 into the pocket on the wheel's bed-side face until it bottoms
    out 7 mm in. Press on the outer ring only and squarely - a vice or a clamp with
    a flat plate across the bearing is ideal. Never press on the inner ring or the
    seal.
  parts:
  - wheel
  hardware:
  - brg
  tool: vice or clamp, flat plate
- n: '4'
  text: Turn the wheel over and drop the 2.0 mm spacer_mid into the open pocket. It
    falls through the web bore and comes to rest flat on the first bearing's inner
    ring.
  parts:
  - wheel
  - spacer_mid
  hardware: []
  tool: null
- n: '5'
  text: Press the second 608 into the other pocket until it stops. It traps the mid
    spacer against the first bearing's inner ring. Both outer rings should now be
    flush with the wheel's faces. Slide the axle through and check the wheel spins
    freely with no wobble and no axial rattle.
  parts:
  - wheel
  - spacer_mid
  hardware:
  - brg
  - axle
  tool: vice or clamp, 6 mm hex key
- n: '6'
  text: 'Assemble on the door: slide a spacer_side onto the M8x40 screw (the head
    will press it), then the wheel assembly, then the other spacer_side, then push
    the screw through the bracket''s existing hole. Add the M8 washer and thread on
    the M8 lock nut. Hold the screw head (6 mm hex key) and tighten the nut (13 mm
    spanner) firmly - the head pulls one inner ring, the bracket the other, so the
    bearings stay clamped while the wheel spins. Your own M8 bolt replaces the catalog
    screw if it has 37-45 mm under the head.'
  parts:
  - wheel
  - spacer_side
  - spacer_mid
  hardware:
  - axle
  - locknut
  - washer
  tool: 6 mm hex key, 13 mm spanner
- n: '7'
  text: 'Check the joint: the wheel turns freely by hand, has no side-to-side rock,
    sits about 3 mm clear of the bracket, and the screw does not stick out more than
    a few mm past the nut (file it flush, or pack it with M8 washers, if it does).'
  parts:
  - wheel
  - spacer_side
  hardware:
  - axle
  - locknut
  tool: calipers
- n: '8'
  text: 'Fit it to the door and run it in the track: nothing should rub the track''s
    sides, the tread should roll on the same surface the old wheel did, and the door
    should hang at the same height (use the roller''s height adjustment if it has
    one). Load the door and roll it through its full travel - if it binds, or the
    door sits high or low, tell me the old wheel''s OD and the track''s shape and
    I''ll adjust wheel_od and the tread.'
  parts:
  - wheel
  hardware:
  - locknut
  tool: null
- n: '9'
  text: After a week of use, re-check that the lock nut is still tight and that the
    bearing outer rings have not started turning in their pockets (a scored ring around
    a pocket mouth means the fit was loose - report it and I'll open pocket_dia up
    a step).
  parts:
  - wheel
  hardware:
  - locknut
  tool: 13 mm spanner
