- id: c_halves_face
  part: wheel_half_screw
  feature: mating_face
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - half_t
  check:
    method: none
    ref: null
    description: The two mating faces sit flat against each other when the four M3
      screws are snug.
- id: c_spin_free
  part: wheel_half_screw
  feature: central_through_bore
  relation: clears
  hardware: m8_bolt
  clearance_mm: null
  params:
  - lip_t
  - m8_washer_t
  check:
    method: measure
    ref: null
    description: Assemble the axle and spin the wheel by hand. It must turn freely;
      the bolt head and nut should clamp only the two bearing inner races, not the
      printed wheel.
manual:
- n: '1'
  text: 'Print the three parts in PLA at 0.2 mm layers: wheel_half_screw, wheel_half_insert,
    and bearing_fit_coupon. Use the print orientation given for each part: outer face
    (z=0) on the bed, pocket opening upward. 4 perimeters and about 40% infill is
    plenty.'
  parts:
  - wheel_half_screw
  - wheel_half_insert
  - bearing_fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Test the coupon: press a 608ZZ bearing into the coupon pocket from the open
    side. It should seat on the 1 mm lip with light hand pressure. If it is too tight,
    sand or ream the pocket; if too loose, wrap one turn of tape around the bearing
    OD.'
  parts:
  - bearing_fit_coupon
  hardware:
  - bearing
  tool: null
- n: '3'
  text: Install the four M3 heat-set inserts (insert M3x4x5) into the four holes on
    the mating face of wheel_half_insert. Heat them with a soldering iron and set
    them flush with the mating face.
  parts:
  - wheel_half_insert
  hardware:
  - m3_insert
  tool: soldering iron
- n: '4'
  text: Press one 608ZZ bearing into each half's bearing pocket, inserting it from
    the mating face (the open side). Push it down until the bearing's outer face contacts
    the 1 mm lip. The bearing's inner face should finish flush with the mating face.
  parts:
  - wheel_half_screw
  - wheel_half_insert
  hardware:
  - bearing
  tool: null
- n: '5'
  text: Bring the two halves together with their mating faces in contact, aligning
    the four screw holes. Insert four ISO 4762 M3x10 screws through the counterbored
    holes in wheel_half_screw and tighten them into the inserts, alternating around
    the pattern. Do not over-tighten; the halves should close completely.
  parts:
  - wheel_half_screw
  - wheel_half_insert
  hardware:
  - m3_screw
  tool: 2.5 mm hex key
- n: '6'
  text: Slide one M8 washer (ISO 7089 M8) onto the M8x40 bolt. Push the bolt through
    the wheel's central bore so the washer sits against the bearing inner race. Add
    the second M8 washer on the far side and thread on the ISO 10511 M8 lock nut.
  parts:
  - wheel_half_screw
  - wheel_half_insert
  hardware:
  - m8_bolt
  - m8_washer
  - m8_nut
  tool: null
- n: '7'
  text: 'Mount the wheel in the existing door bracket: pass the bolt through the bracket,
    keeping the washers between the bracket and the bearing inner races. Tighten the
    lock nut until the inner races are firmly clamped but the wheel still spins freely.
    The printed wheel must not be pinched and the washers must not rub the wheel.'
  parts:
  - wheel_half_screw
  - wheel_half_insert
  hardware:
  - m8_bolt
  - m8_washer
  - m8_nut
  tool: 13 mm wrench / hex key
- n: '8'
  text: 'Check the finished wheel: it should spin smoothly on the bolt with no wobble
    or rubbing. Allow about 17.2 mm across the assembled washer faces; if the bracket
    gap is tighter than that, measure the gap and I can revise the wheel or add thin
    spacers.'
  parts:
  - wheel_half_screw
  - wheel_half_insert
  hardware:
  - m8_bolt
  - m8_washer
  - m8_nut
  tool: null
