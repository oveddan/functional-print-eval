task: bearing-wheel
note: 'Design: a split 50 mm x 16 mm wheel that houses two 608ZZ bearings, pressed
  in from the mating faces and trapped by 1 mm outer lips. The two PLA halves bolt
  together with 4x M3x10 screws into M3 heat-set inserts. The M8x40 axle passes through
  both bearing inner races; two M8 washers and an M8 lock nut clamp only the inner
  races, so the printed wheel spins on the bearing outer races. Assembled width across
  the washers is about 17.2 mm (the washers protrude ~0.6 mm past each 16 mm face).
  I designed the running surface as a plain 50 mm cylinder because the track/rail
  and old wheel profile could not be measured; if the old wheel had a groove or flange,
  tell me and I will adjust it. I also assumed a standard ISO 4762 M8x40 / ISO 10511
  M8 axle stack; if your bracket is thicker or your salvaged M8 bolt is a different
  length, substitute an M8x45 or M8x50.'
questions:
- text: What is the gap between the two bracket sides where the old wheel sat? I assumed
    at least 17.2 mm to clear the two washers.
  answer: null
- text: Is the track a flat surface or a raised rail, and if a rail, how wide and
    how high is it? I made the running surface a plain 50 mm cylinder because I could
    not measure the old wheel's profile.
  answer: null
- text: Is your M8 bolt an ISO 4762 socket-head screw, and what length is it under
    the head? I specified M8x40; a shorter salvaged bolt may need the washers omitted
    or a thinner lock nut.
  answer: null
params:
  wheel_od:
    value: 50.0
    unit: mm
    kind: world
    source: asked
    note: old wheel outside diameter, reported as about 50 mm
  wheel_width:
    value: 16.0
    unit: mm
    kind: world
    source: asked
    note: old wheel width, reported as about 16 mm
  half_t:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: each printed half; wheel_width/2
  bearing_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ nominal OD; measured 21.22 was a caliper-pinch artifact, so 22.0 used
  bearing_bore:
    value: 8.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ bore, nominal 8.0; slips onto the M8 bolt
  bearing_width:
    value: 7.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ width
  pocket_dia:
    value: 22.2
    unit: mm
    kind: design
    source: design
    note: bearing_od + 0.2 mm radial clearance for a light press/loose fit
  pocket_depth:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: equals bearing_width; bearing inner face finishes flush with the mating
      face
  lip_t:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: outer annular lip that captures the bearing outer race; half_t - pocket_depth
  hub_bore:
    value: 18.0
    unit: mm
    kind: design
    source: design
    note: central through-bore; clears M8 washer OD 16, M8 lock-nut corners ~15, and
      M8 socket head OD 13
  screw_r:
    value: 18.5
    unit: mm
    kind: design
    source: design
    note: M3 screw pattern radius; outside the 22.2 bearing pocket and inside the
      50 OD
  n_screws:
    value: 4
    unit: count
    kind: design
    source: design
    note: four M3 screws at 0/90/180/270 degrees
  screw_clear_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: M3 clearance hole
  counterbore_d:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: counterbore for the M3 socket head (head_d 5.5)
  counterbore_depth:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: flush counterbore depth for the M3 socket head (head_h 3)
  insert_hole_d:
    value: 4.3
    unit: mm
    kind: hardware
    source: catalog
    note: hole diameter specified for insert M3x4x5
  insert_hole_depth:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: insert is 4 mm long and sits flush at the mating face; extra depth avoids
      the M3x10 screw bottoming before the halves close
  pocket_chamfer:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: 45-degree funnel at the pocket mouth to ease bearing insertion
  m8_bolt_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8 shank diameter; user measured about 8 mm across the shank
  m8_bolt_head_d:
    value: 13.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8 socket head diameter
  m8_bolt_head_h:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8 socket head height
  m8_nut_h:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 nylon-insert lock nut height
  m8_washer_od:
    value: 16.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 washer OD; must clear the 18 mm hub bore
  m8_washer_id:
    value: 8.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 washer ID
  m8_washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 washer thickness
  m3_screw_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3 shank
  m3_screw_len:
    value: 10.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3x10; 5 mm through the screw half plus 4 mm of insert engagement
  insert_od:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: M3x4x5 heat-set insert outside diameter
  insert_len:
    value: 4.0
    unit: mm
    kind: hardware
    source: catalog
    note: M3x4x5 heat-set insert length
parts:
- id: wheel_half_screw
  role: final
  material: PLA
  code: "def build(p):\n    d = p.half_t\n    def cyl(r, z0, z1, x=0.0, y=0.0):\n\
    \        return (cq.Workplane(\"XY\").circle(r)\n                .extrude(z1 -\
    \ z0)\n                .translate((x, y, z0)))\n    wheel = cq.Workplane(\"XY\"\
    ).circle(p.wheel_od / 2.0).extrude(d)\n    # central through-bore for the M8 axle\
    \ and inner-race washers\n    wheel = wheel.cut(cyl(p.hub_bore / 2.0, -1.0, d\
    \ + 1.0))\n    # bearing pocket: opens at the mating face (z=d), outer lip floor\
    \ at z=lip_t\n    wheel = wheel.cut(cyl(p.pocket_dia / 2.0, p.lip_t, d + 1.0))\n\
    \    # funnel at the pocket mouth to help press the bearing in\n    cone = cq.Solid.makeCone(\n\
    \        p.pocket_dia / 2.0,\n        p.pocket_dia / 2.0 + p.pocket_chamfer,\n\
    \        p.pocket_chamfer,\n        cq.Vector(0, 0, d - p.pocket_chamfer),\n \
    \       cq.Vector(0, 0, 1),\n    )\n    wheel = wheel.cut(cone)\n    # M3 counterbores\
    \ (open at outer face z=0) and clearance holes\n    for (x, y) in [(p.screw_r,\
    \ 0.0), (0.0, p.screw_r), (-p.screw_r, 0.0), (0.0, -p.screw_r)]:\n        wheel\
    \ = wheel.cut(cyl(p.counterbore_d / 2.0, -1.0, p.counterbore_depth, x, y))\n \
    \       wheel = wheel.cut(cyl(p.screw_clear_d / 2.0, p.counterbore_depth, d +\
    \ 1.0, x, y))\n    return wheel"
  print_orientation: Outer face (z=0) on the bed; mating face (z=8) and bearing pocket
    opening up.
  use_orientation: Mating face against wheel_half_insert; bolt head side, wheel axis
    horizontal through the M8 axle.
- id: wheel_half_insert
  role: final
  material: PLA
  code: "def build(p):\n    d = p.half_t\n    def cyl(r, z0, z1, x=0.0, y=0.0):\n\
    \        return (cq.Workplane(\"XY\").circle(r)\n                .extrude(z1 -\
    \ z0)\n                .translate((x, y, z0)))\n    wheel = cq.Workplane(\"XY\"\
    ).circle(p.wheel_od / 2.0).extrude(d)\n    wheel = wheel.cut(cyl(p.hub_bore /\
    \ 2.0, -1.0, d + 1.0))\n    wheel = wheel.cut(cyl(p.pocket_dia / 2.0, p.lip_t,\
    \ d + 1.0))\n    cone = cq.Solid.makeCone(\n        p.pocket_dia / 2.0,\n    \
    \    p.pocket_dia / 2.0 + p.pocket_chamfer,\n        p.pocket_chamfer,\n     \
    \   cq.Vector(0, 0, d - p.pocket_chamfer),\n        cq.Vector(0, 0, 1),\n    )\n\
    \    wheel = wheel.cut(cone)\n    # M3 heat-set insert holes, opening at the mating\
    \ face (z=d)\n    for (x, y) in [(p.screw_r, 0.0), (0.0, p.screw_r), (-p.screw_r,\
    \ 0.0), (0.0, -p.screw_r)]:\n        wheel = wheel.cut(cyl(p.insert_hole_d / 2.0,\
    \ d - p.insert_hole_depth, d + 1.0, x, y))\n    return wheel"
  print_orientation: Outer face (z=0) on the bed; mating face (z=8) and bearing pocket
    opening up.
  use_orientation: Mating face against wheel_half_screw; lock-nut side, wheel axis
    horizontal through the M8 axle.
- id: bearing_fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    d = p.half_t\n    def cyl(r, z0, z1, x=0.0, y=0.0):\n\
    \        return (cq.Workplane(\"XY\").circle(r)\n                .extrude(z1 -\
    \ z0)\n                .translate((x, y, z0)))\n    coupon = cq.Workplane(\"XY\"\
    ).circle(15.0).extrude(d)\n    coupon = coupon.cut(cyl(p.hub_bore / 2.0, -1.0,\
    \ d + 1.0))\n    coupon = coupon.cut(cyl(p.pocket_dia / 2.0, p.lip_t, d + 1.0))\n\
    \    cone = cq.Solid.makeCone(\n        p.pocket_dia / 2.0,\n        p.pocket_dia\
    \ / 2.0 + p.pocket_chamfer,\n        p.pocket_chamfer,\n        cq.Vector(0, 0,\
    \ d - p.pocket_chamfer),\n        cq.Vector(0, 0, 1),\n    )\n    coupon = coupon.cut(cone)\n\
    \    return coupon"
  print_orientation: Outer face (z=0) on the bed; pocket opening up.
  use_orientation: 'Test coupon: press one 608ZZ bearing into the pocket and check
    the fit before printing the halves.'
