criteria:
- id: c_bearing_fit
  part: wheel_half_screw
  feature: bearing_pocket
  relation: contains
  hardware: bearing
  clearance_mm: 0.1
  params:
  - bearing_od
  - pocket_dia
  check:
    method: coupon
    ref: bearing_fit_coupon
    description: Press a 608ZZ into the coupon pocket. It should bottom on the 1 mm
      lip with light hand pressure. If too tight, sand/ream the pocket; if loose,
      wrap the bearing OD with one layer of tape.
- id: c_bearing_fit_insert
  part: wheel_half_insert
  feature: bearing_pocket
  relation: contains
  hardware: bearing
  clearance_mm: 0.1
  params:
  - bearing_od
  - pocket_dia
  check:
    method: none
    ref: null
    description: Same pocket and coupon as wheel_half_screw, so the coupon check covers
      it.
- id: c_washer_clear
  part: wheel_half_screw
  feature: central_through_bore
  relation: clears
  hardware: m8_washer
  clearance_mm: 1.0
  params:
  - hub_bore
  - m8_washer_od
  check:
    method: measure
    ref: null
    description: After printing, slide an M8 washer through the 18 mm central bore;
      it should pass freely with about 1 mm radial clearance.
- id: c_head_clear
  part: wheel_half_screw
  feature: central_through_bore
  relation: clears
  hardware: m8_bolt
  clearance_mm: 2.5
  params:
  - hub_bore
  - m8_bolt_head_d
  check:
    method: none
    ref: null
    description: The 18 mm bore clears the 13 mm M8 socket head, so the head can reach
      the inner race without touching the printed wheel.
- id: c_screw_clear
  part: wheel_half_screw
  feature: screw_clearance_hole
  relation: clears
  hardware: m3_screw
  clearance_mm: 0.2
  params:
  - screw_clear_d
  - m3_screw_d
  check:
    method: none
    ref: null
    description: M3 screw drops through the 3.4 mm clearance hole.
- id: c_insert_engage
  part: wheel_half_insert
  feature: insert_hole
  relation: contains
  hardware: m3_insert
  clearance_mm: 0.0
  params:
  - insert_hole_d
  - insert_od
  check:
    method: none
    ref: null
    description: Heat-set insert M3x4x5 is set flush in the 4.3 mm hole at the mating
