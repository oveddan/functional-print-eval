manual:
- n: '1'
  text: 'Print C1 (about 25 min): 0.2 mm layers, 3 walls, no supports - its flat base
    plate sits on the bed.'
  parts:
  - C1
  hardware: []
  tool: null
- n: '2'
  text: Fit test on C1, using one of your 608 bearings. Press it into each of the
    three pockets - hand pressure first, then a clamp or vise if needed, pushing on
    the OUTER ring only. The notched corner marks the Ø21.7 pocket; the middle is
    Ø21.9 (the size W1's bore is printed at); then Ø22.1. Push the bearing back out
    through the Ø16 hole underneath with a bolt or a punch. You now know what your
    printer does with this fit.
  parts:
  - C1
  hardware: []
  tool: vise or clamp
- n: '3'
  text: 'Print W1 (about 45 min), same settings: the face with the Ø19 opening goes
    on the bed, no supports, 3-4 walls, 25% infill.'
  parts:
  - W1
  hardware: []
  tool: null
- n: '4'
  text: 'Match W1 to the fit test. Middle pocket took a bearing with a firm press:
    nothing to change. Too tight to press by hand: ream W1''s bore (240-grit wrapped
    on a 20 mm dowel, or a 22 mm drill bit) until a bearing presses in firmly by hand.
    Loose, or the bearing falls in: keep thin superglue ready for step 5.'
  parts:
  - W1
  hardware: []
  tool: null
- n: '5'
  text: Press both 608 bearings into W1's hub from the top face (the face with the
    ring-shaped pocket). Push on the OUTER ring only - a 22 mm socket or a scrap of
    wood with a matching hole is ideal; never push on the shield or the inner ring.
    Bearing 1 goes in until it stops on the lip, so its top face ends up 14 mm below
    W1's top face. Bearing 2 goes on top of it until its outer face is flush with
    W1's top face. If the fit felt loose, run a few drops of superglue around the
    outer ring only (never into the balls or the shield gap) as you press it home.
  parts:
  - W1
  hardware: []
  tool: vise or clamp + 22 mm socket
- n: '6'
  text: 'Build the axle, wheel first: slide the M8x50 bolt through the wheel - head
    down into the hub so it lands on the top bearing''s inner ring, with the 22 mm
    plain shank inside the bore. Then a washer, then the ISO 4032 hex nut. Thread
    that bolt through the hanger''s existing hole, then add the second washer and
    the ISO 10511 lock nut on the far side.'
  parts:
  - W1
  hardware:
  - bolt
  - washer
  - nutA
  - nutB
  tool: 6 mm hex key, 13 mm spanner
- n: '7'
  text: 'Set the preload: hold the bolt head with the hex key and tighten the hex
    nut (nutA) until the wheel has no side-to-side play, then flick it - it must spin
    freely. If it drags, back nutA off an eighth of a turn: a drag means the washer
    or the bolt head is rubbing the bearing''s shield. Then snug the lock nut (nutB)
    against the hanger so the plate cannot move.'
  parts:
  - W1
  hardware:
  - nutA
  - nutB
  tool: 6 mm hex key, 13 mm spanner
- n: '8'
  text: 'Hang the door and check: the tread should sit on the rail across its width,
    the door should hang at its old height, and it should roll with no wobble or rattle.
    If a rattle comes from the bolt being loose in the hanger''s hole, that hole is
    oversized and wants a printed bushing - tell me its diameter and I will size one.
    If the bolt''s threaded end sticks out far past nutB, hacksaw it flush so it cannot
    catch the door or the frame.'
  parts:
  - W1
  hardware:
  - bolt
  tool: null
- n: '9'
  text: 'Note on the plain tread: it is deliberately a smooth Ø50 cylinder, because
    the rail could not be measured. It rolls correctly on a flat steel bar and on
    a rounded rib. If the door wanders sideways on a rib rail, the wheel can be reprinted
    with a groove: set groove_depth/groove_width in the model to suit your rib and
    print the same code again.'
  parts:
  - W1
  hardware: []
  tool: null
