task: bearing-wheel
note: 'One printed wheel (W1) replaces the broken roller: a Ø50 x 16 mm PLA tyre whose
  hub is a press fit for both of your 608ZZ bearings, stacked side by side (2 x 7
  mm) inside a 14 mm deep Ø21.9 bore and stopped by a 2 mm internal lip, so the wheel
  spins on the bearings and the bearings spin on your M8 bolt''s plain shank. The
  two 608s are your own parts, so they are not in the hardware catalogue - they appear
  only in the model''s parameters (Ø22.0 od, Ø8.0 bore, 7.0 wide) and in the manual.
  C1 is a throw-away fit-test coupon: three pockets at Ø21.7 / Ø21.9 / Ø22.1 let you
  find the bore your printer actually produces BEFORE committing to the 45-minute
  wheel - the middle one is the size the wheel uses (0.1 mm interference on the 22.0
  mm bearing OD). Two design points worth knowing: (1) the tread is a plain cylinder
  on purpose, because neither the broken wheel''s profile nor the rail could be measured
  - a plain tread rolls on both a flat bar and a rib, and the code accepts a groove
  if you later measure a rib; (2) the 2 mm lip is sized around the 1.6 mm washer,
  so the washer and the hex nut can pass through the Ø19 lip opening and clamp the
  bearing''s INNER ring - that is what makes the wheel spin rather than rub. Axle
  stack, head to tip: bolt head (in the hub, on the top bearing''s inner ring) | wheel
  | washer | ISO 4032 hex nut | hanger plate | ISO 10511 lock nut. About 31 mm is
  needed plus your hanger''s thickness, which is why the catalogue M8x50 (22 mm plain
  shank, then thread) is called up; your own bolt works if it is at least ~40 mm under
  the head and has a plain shank through the wheel. Costs: a test print, the wheel,
  one screw, two nuts, two washers and the two bearings you already have - no glue
  or inserts are strictly needed, though a drop of superglue around the bearing''s
  outer ring is the fallback if your printer''s bore comes out loose. Keep the 608
  bearings in the wheel and let the bolt be the axle: do not press the bolt itself
  into plastic, it will wallow out.'
questions:
- text: How thick is the hanger plate the axle passes through, and what diameter is
    the axle hole in it? (The axle stack needs the thickness, and the hole diameter
    tells me whether the M8 bolt fits snugly or needs a printed bushing.)
  answer: null
- text: Is the rail the wheel rolls on a flat steel bar, or a rib/rail that a grooved
    wheel would sit on? (Everything works with the plain tread as submitted, but a
    measured rib lets me add the groove.)
  answer: null
- text: How long is your own M8 bolt from under the head to the tip? (If it is shorter
    than about 40 mm there will not be enough thread left for the lock nut, and the
    catalogue M8x50 should be used instead.)
  answer: null
params:
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ bore; the M8 bolt's ~8 mm shank runs in it
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ nominal OD 22.000 -0.008. An early caliper reading of 21.22 was a
      jaw-angle error (bearing pinched at the jaw tips), so the nominal value is used
  bearing_width:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ width; two stacked = 14.0 mm
  bolt_len:
    value: 50
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8x50 socket head cap screw
  bolt_plain_len:
    value: 22
    unit: mm
    kind: hardware
    source: catalog
    note: 50 - 28 mm thread = 22 mm plain shank, which covers the 16 mm wheel plus
      the 1.6 mm washer before the threads start; the bearings run on plain metal,
      not on thread
  groove_depth:
    value: 0
    unit: mm
    kind: design
    source: design
    note: 'PLAIN tread, deliberately: the rail could not be measured, and a plain
      cylinder rolls correctly on both a flat bar and a rounded rib, whereas a grooved
      wheel only works on a rib. Set >0 (and groove_width) to add a round groove'
  groove_width:
    value: 4
    unit: mm
    kind: design
    source: design
    note: used only if groove_depth is changed to > 0; sized for a ~4 mm rib
  lip_id:
    value: 19
    unit: mm
    kind: design
    source: design
    note: small enough to catch the bearing's outer ring (face spans Ø16.5-22), large
      enough to clear the shield (~Ø16.5), the Ø16 washer, the Ø15 nut corners and
      the bolt
  lip_t:
    value: 2
    unit: mm
    kind: design
    source: design
    note: 0.4 mm deeper than the 1.6 mm washer, so the washer and the nut can reach
      the bearing's inner ring inside the lip while the nut's face stops 0.4 mm clear
      of the hub face
  nut_a_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M8 hex nut - clamps the wheel's inner rings
  nut_b_h:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 nylon-insert lock nut - traps the hanger plate so vibration
      cannot loosen the axle
  recess_depth:
    value: 2
    unit: mm
    kind: design
    source: design
    note: opens upward when printed flat, so no supports and no bridging
  recess_id:
    value: 28
    unit: mm
    kind: design
    source: design
    note: leaves a 3 mm wall around the bearing hub
  recess_od:
    value: 46
    unit: mm
    kind: design
    source: design
    note: 'top-face lightening pocket: leaves a 2 mm rim at the tread'
  seat_bore_d:
    value: 21.9
    unit: mm
    kind: design
    source: design
    note: 0.1 mm diametral interference on the 22.0 bearing OD - a firm press fit
      in PLA. Verify with coupon C1 before printing the wheel
  shaft_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: 'owner''s reading across the M8 bolt''s shank: ''about 8 mm'''
  washer_od:
    value: 16
    unit: mm
    kind: hardware
    source: catalog
    note: fits through the Ø19 lip recess and lands on the bearing's inner ring without
      touching the hub
  washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: the broken wheel was 'about 50 mm across'; the pieces could not be re-measured,
      so this stands as given. Keeps the door at its old height
  wheel_width:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: '''about 16 mm wide''. Holds two 7 mm 608 bearings (14 mm) plus the 2 mm
      retaining lip'
parts:
- id: W1
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    R = p.wheel_od / 2.0          # tread radius\n    W =\
    \ p.wheel_width             # overall width\n    seat_r = p.seat_bore_d / 2.0\
    \  # bearing press-fit bore\n    lip_r = p.lip_id / 2.0\n    t = p.lip_t\n\n \
    \   s = cq.Solid.makeCylinder(R, W, cq.Vector(0, 0, 0))\n\n    # optional round\
    \ tread groove - skipped while groove_depth = 0 (plain tread)\n    if p.groove_depth\
    \ > 0.01:\n        gd = p.groove_depth\n        gw = p.groove_width\n        rg\
    \ = (gd * gd + (gw / 2.0) ** 2) / (2.0 * gd)   # arc through the groove edges\n\
    \        s = s.cut(cq.Solid.makeTorus(R - gd + rg, rg, cq.Vector(0, 0, W / 2.0)))\n\
    \n    # 0.6 x 45 chamfer on the bed-side running edge (kills the elephant-foot\
    \ flare)\n    ch = 0.6\n    tool = cq.Solid.makeCylinder(R + 1.0, 2.0, cq.Vector(0,\
    \ 0, -1.0))\n    tool = tool.cut(cq.Solid.makeCone(R - ch - 1.0, R - ch + 1.0,\
    \ 2.0, cq.Vector(0, 0, -1.0)))\n    s = s.cut(tool)\n\n    # bearing seat: two\
    \ 7 mm 608s (14 mm), open at the top face\n    s = s.cut(cq.Solid.makeCylinder(seat_r,\
    \ W - t + 0.5, cq.Vector(0, 0, t)))\n    # retaining lip: catches the outer ring,\
    \ clears shield / washer / nut / bolt\n    s = s.cut(cq.Solid.makeCylinder(lip_r,\
    \ t + 0.5, cq.Vector(0, 0, -0.5)))\n    # lead-in chamfer at the seat mouth (45\
    \ deg, ~1 mm)\n    s = s.cut(cq.Solid.makeCone(seat_r - 0.2, seat_r + 1.5, 1.7,\
    \ cq.Vector(0, 0, W - 1.2)))\n\n    # lightening pocket in the top face\n    ro\
    \ = p.recess_od / 2.0\n    ri = p.recess_id / 2.0\n    pk = cq.Solid.makeCylinder(ro,\
    \ p.recess_depth + 0.5, cq.Vector(0, 0, W - p.recess_depth))\n    pk = pk.cut(cq.Solid.makeCylinder(ri,\
    \ p.recess_depth + 2.0, cq.Vector(0, 0, W - p.recess_depth - 1.0)))\n    s = s.cut(pk)\n\
    \    return s\n"
  print_orientation: 'Flat, wheel axis vertical: the bottom face (with the Ø19 lip
    opening) on the bed, the ring-shaped lightening pocket facing up. No supports,
    no bridging, 3-4 walls, 25% infill.'
  use_orientation: Axis horizontal on the M8 bolt, Ø50 tread running on the rail;
    the lip/recess face points up (the part is handed but either face works against
    the rail).
- id: C1
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    pl, pw, pt = 108.0, 40.0, 3.0     # base plate\n    bod,\
    \ bh = 30.0, 10.0              # boss on which each test bore sits\n\n    s =\
    \ cq.Solid.makeBox(pl, pw, pt, cq.Vector(-pl / 2.0, -pw / 2.0, 0.0))\n    # three\
    \ test bores: seat_bore_d -0.2, seat_bore_d (what W1 is printed at), +0.2\n  \
    \  for i, d in enumerate((p.seat_bore_d - 0.2, p.seat_bore_d, p.seat_bore_d +\
    \ 0.2)):\n        x = -32.0 + 32.0 * i\n        b = cq.Solid.makeCylinder(bod\
    \ / 2.0, bh + 0.5, cq.Vector(x, 0.0, pt - 0.5))\n        b = b.cut(cq.Solid.makeCylinder(d\
    \ / 2.0, bh + 2.0, cq.Vector(x, 0.0, pt - 1.0)))\n        b = b.cut(cq.Solid.makeCone(d\
    \ / 2.0, d / 2.0 + 1.0, 1.0, cq.Vector(x, 0.0, pt + bh - 1.0)))\n        b = b.cut(cq.Solid.makeCylinder(8.0,\
    \ 4.0, cq.Vector(x, 0.0, -1.0)))   # Ø16 push-out hole\n        s = s.union(b)\n\
    \    # corner notch marks the SMALLEST bore (left-hand end)\n    s = s.cut(cq.Solid.makeBox(10.0,\
    \ 10.0, pt + bh + 6.0, cq.Vector(-pl / 2.0, pw / 2.0 - 10.0, -2.0)))\n    return\
    \ s\n"
  print_orientation: 'Flat: the 108 x 40 x 3 base plate on the bed, the three Ø30
    bosses pointing up. No supports.'
  use_orientation: Handling test piece only, used before W1 is printed; press one
    608 into each pocket.
