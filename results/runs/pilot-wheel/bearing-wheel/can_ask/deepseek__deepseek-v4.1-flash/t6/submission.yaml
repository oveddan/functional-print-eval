task: bearing-wheel
note: 'A printed 608-bearing wheel for the closet door, sized off the old one (50
  x 16 mm) and the M8 shank you measured (8 mm). Three printed parts: the wheel (two
  608s pressed in from each side, seated on a 2 mm centre web), a 2 mm spacer that
  goes between the two bearings'' inner races so the axle nut clamps the races instead
  of the balls, and a fit coupon to dial in the bearing press before you commit to
  the wheel. Two ISO 7089 M8 washers do double duty: the one on the hanger side holds
  the bracket 1.6 mm clear of the wheel''s rotating side face. Assumptions I had to
  make because the wheel and bracket couldn''t be measured: wheel OD 50 mm and tread
  width 16 mm taken from your description, tread modelled flat with chamfered edges,
  hanger plate assumed 3 mm and single-plate (this sets which bolt length you need).
  Bolt length is the main variable — check step 1. Print the wheel flat (axle axis
  vertical): the bearing bores come out round and the press hoop stress runs along
  the strands, not across the layers.'
questions:
- text: How thick is the hanger plate, and is the wheel between two plates (a yoke)
    or beside a single plate? I assumed a single 3 mm plate, which sets the screw
    length.
  answer: null
- text: Was the old wheel's tread flat straight across, or grooved/flanged? I modelled
    it flat with chamfered edges because the broken wheel couldn't be measured.
  answer: null
- text: How long is your own M8 bolt from under the head to the tip? I assumed you
    will use an ISO 4762 M8x40, or your bolt if it is 35 mm or more under the head.
  answer: null
- text: Are you printing the wheel in the same black high-speed PLA, or something
    tougher? PLA is fine for a closet door wheel at this size, but PETG or ABS/ASA
    would survive a hot car-shed or a slammed door better.
  answer: null
params:
  wheel_od:
    value: 50.0
    unit: mm
    kind: world
    source: asked
    note: the broken wheel was described as 'about 50 mm across'; can't be measured
      now
  wheel_width:
    value: 16.0
    unit: mm
    kind: world
    source: asked
    note: old wheel described as about 16 mm wide across the tread
  bracket_t:
    value: 3.0
    unit: mm
    kind: world
    source: guessed
    note: assumed flat hanger plate thickness; person could not measure. Sets the
      required screw length
  axle_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: measured
    note: 'person: ''bolt across: about 8 mm (the shank)'' - confirms M8'
  axle_len:
    value: 40
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8x40 socket head screw; M8x35 also works if the hanger is a single
      thin plate. Their own M8 bolt is fine if >= 35 mm under the head
  washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 plain washer thickness; it is what keeps the hanger 1.6 mm clear
      of the wheel's side face
  nut_h:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 nylon-insert lock nut height (af 13)
  bearing_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ nominal 22.000/-0.008; the recorded 21.22 was a pinched/angled caliper
      reading, not used
  bearing_bore:
    value: 8.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ nominal 8; measured 7.94
  bearing_width:
    value: 7.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ nominal width; sets the seat depth
  bearing_seat_d:
    value: 21.9
    unit: mm
    kind: design
    source: design
    note: 0.10 mm interference on the 22.0 bearing OD - a firm hand/vice press in
      PLA. Coupon brackets this value with 21.80/22.00/22.10 alternatives
  bearing_seat_depth:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: one bearing width; each bearing bottoms on the centre web, so the outer
      faces finish flush with the wheel faces
  web_thickness:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: = wheel_width - 2 x bearing_width; also the gap between the two inner races
  web_hole_d:
    value: 14.0
    unit: mm
    kind: design
    source: design
    note: 'centre hole: clears the bearing inner races (about 12.6 OD) and houses
      the spacer'
  seat_chamfer:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: 45 deg lead-in at both bearing seat mouths so the bearings start square
  tread_chamfer:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: 45 deg break on both tread edges
  spacer_od:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: fits the 14 mm web hole and bears on the inner race faces
  spacer_bore:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: 0.4 mm clearance on the M8 shank
  spacer_len:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: = web_thickness; sanded to a slip fit after the bearings are pressed
  coupon_t:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: thicker than the 7 mm bearing so the press is representative
  coupon_len:
    value: 110.0
    unit: mm
    kind: design
    source: design
    note: four test bores on a 26 mm pitch
  coupon_w:
    value: 30.0
    unit: mm
    kind: design
    source: design
    note: leaves about 4 mm of material around each 22 mm bore
  coupon_pitch:
    value: 26.0
    unit: mm
    kind: design
    source: design
    note: bore spacing; the 22.15 bore would merge with the next at any smaller pitch
  coupon_bore_1:
    value: 21.8
    unit: mm
    kind: design
    source: design
    note: 0.20 interference - leftmost bore
  coupon_bore_2:
    value: 21.9
    unit: mm
    kind: design
    source: design
    note: 0.10 interference - same as the wheel's seat, second bore
  coupon_bore_3:
    value: 22.0
    unit: mm
    kind: design
    source: design
    note: line-to-line, third bore
  coupon_bore_4:
    value: 22.1
    unit: mm
    kind: design
    source: design
    note: 0.10 clearance - rightmost bore
parts:
- id: wheel
  role: final
  material: PLA (black, high-speed; 0.2 mm layers, 4-5 walls, 25-30% infill, no supports)
  code: "import cadquery as cq\n\n\ndef build(p):\n    R = p.wheel_od / 2.0      \
    \    # tread radius, 25\n    W = p.wheel_width             # 16\n    Rs = p.bearing_seat_d\
    \ / 2.0   # bearing bore radius, 10.95\n    Rw = p.web_hole_d / 2.0       # centre\
    \ hole radius, 7\n    d = p.bearing_seat_depth      # 7 - one 608 each side\n\
    \    c = p.tread_chamfer           # 1.5\n    g = p.seat_chamfer            #\
    \ 1.0 lead-in\n\n    # Half cross-section as (radius, height above the bed), revolved\
    \ about Z.\n    # z = 0 is the bed face; the part is symmetric about z = W/2.\n\
    \    prof = [\n        (Rs + g, 0.0),      # bottom seat mouth, lead-in chamfer\n\
    \        (Rs, g),\n        (Rs, d),            # bottom seat floor - bearing A\
    \ bottoms here\n        (Rw, d),            # centre web, lower face\n       \
    \ (Rw, W - d),        # centre hole wall\n        (Rs, W - d),        # centre\
    \ web, upper face - bearing B bottoms here\n        (Rs, W - g),\n        (Rs\
    \ + g, W),        # top seat mouth\n        (R - c, W),\n        (R, W - c), \
    \        # tread\n        (R, c),\n        (R - c, 0.0),\n    ]\n    return (cq.Workplane(\"\
    XZ\")\n            .polyline(prof)\n            .close()\n            .revolve(360.0,\
    \ (0.0, 0.0), (0.0, 1.0)))"
  print_orientation: 'Flat: bottom face (z = 0) on the bed, wheel/axle axis vertical,
    tread running up the outside of a 16 mm tall cylinder.'
  use_orientation: Axle horizontal in use. The wheel rolls on the tread; the bolt
    passes through the two pressed-in bearings and the spacer sits between their inner
    races.
- id: spacer
  role: final
  material: PLA (print 2)
  code: "import cadquery as cq\n\n\ndef build(p):\n    return (cq.Workplane(\"XY\"\
    )\n            .circle(p.spacer_od / 2.0)\n            .circle(p.spacer_bore /\
    \ 2.0)\n            .extrude(p.spacer_len))"
  print_orientation: Flat on the bed, ring axis vertical (printed height is the 2.0
    mm length, 10 layers).
  use_orientation: Inside the wheel's 14 mm centre hole, between the two bearings'
    inner races. Carries the axle nut's clamp load so the bearings' balls are not
    preloaded.
- id: coupon
  role: coupon
  material: PLA (same filament and profile as the wheel)
  code: "import cadquery as cq\n\n\ndef build(p):\n    t = p.coupon_t\n    bores =\
    \ [p.coupon_bore_1, p.coupon_bore_2, p.coupon_bore_3, p.coupon_bore_4]\n    plate\
    \ = (cq.Workplane(\"XY\")\n             .box(p.coupon_len, p.coupon_w, t)\n  \
    \           .translate((0.0, 0.0, t / 2.0)))\n    for i, dia in enumerate(bores):\n\
    \        x = (i - 1.5) * p.coupon_pitch\n        cutter = (cq.Workplane(\"XY\"\
    )\n                  .center(x, 0.0)\n                  .circle(dia / 2.0)\n \
    \                 .extrude(t + 2.0)\n                  .translate((0.0, 0.0, -1.0)))\n\
    \        plate = plate.cut(cutter)\n    return plate"
  print_orientation: 'Flat: bottom face (z = 0) on the bed, bores vertical - exactly
    like the wheel''s bearing seats.'
  use_orientation: Test piece only. Press a 608 into each bore and pick the fit; left
    to right the bores are 21.80, 21.90 (the wheel's value), 22.00 and 22.10 mm.
hardware:
- id: brg
  ref: 608ZZ
  qty: 2
- id: axle
  ref: ISO 4762 M8x40
  qty: 1
- id: washer
  ref: ISO 7089 M8
  qty: 2
- id: lock_nut
  ref: ISO 10511 M8
  qty: 1
joints:
- id: axle_joint
  fastener: axle
  axis_origin:
  - 0.0
  - 0.0
  - -4.6
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel
    feature: web clearance hole Ø14
    role: clearance
  - part: wheel
    feature: bearing seat Ø21.9 x 7 (near bearing, inner race)
    role: clearance
  - part: spacer
    feature: Ø8.4 bore
    role: clearance
  - part: wheel
    feature: bearing seat Ø21.9 x 7 (far bearing, inner race)
    role: clearance
  nut: lock_nut
  external: null
criteria:
- id: c_seat_fit
  part: wheel
  feature: bearing seat Ø21.90 x 7.0 deep, one at each face
  relation: contains
  hardware: brg
  clearance_mm: -0.1
  params:
  - bearing_seat_d
  - bearing_od
  - bearing_seat_depth
  - bearing_width
  check:
    method: coupon
    ref: coupon
    description: 'Press a 608 into the coupon''s 21.90 mm bore. The wheel''s seat
      is the same size: it must need a firm press (vice or clamp) and hold the bearing
      with no wobble, but not crack the hub.'
- id: c_shoulder
  part: wheel
  feature: 2.0 mm centre web with the Ø14 to Ø21.90 shoulder
  relation: supports
  hardware: brg
  clearance_mm: null
  params:
  - web_thickness
  - web_hole_d
  - bearing_seat_depth
  check:
    method: measure
    ref: null
    description: After pressing, each bearing's outer ring must sit flat on the web
      at 7.0 mm depth - no rocking, both outer faces flush with the wheel's faces.
- id: c_spacer_len
  part: spacer
  feature: 2.0 mm length between the two inner races
  relation: faces
  hardware: brg
  clearance_mm: 0.0
  params:
  - spacer_len
  - web_thickness
  check:
    method: measure
    ref: null
    description: Measure the gap between the pressed bearings' inner races through
      the centre hole; sand the spacer flat until it just slips in with no axial play
      (a hair short is better than proud).
- id: c_web_clears_axle
  part: wheel
  feature: Ø14 centre hole
  relation: clears
  hardware: axle
  clearance_mm: 6.0
  params:
  - web_hole_d
  - axle_d
  check:
    method: none
    ref: null
    description: ''
- id: c_coupon_bores
  part: coupon
  feature: four test bores 21.80 / 21.90 / 22.00 / 22.10
  relation: contains
  hardware: brg
  clearance_mm: null
  params:
  - coupon_bore_1
  - coupon_bore_2
  - coupon_bore_3
  - coupon_bore_4
  - bearing_od
  - coupon_t
  check:
    method: coupon
    ref: coupon
    description: Find the bore that grips a 608 firmly and can still be pressed in
      and out. If it is not the 21.90 bore, reprint the wheel with bearing_seat_d
      set to the winner, or bond the bearing with Loctite 638 / a drop of cyanoacrylate.
manual:
- n: '1'
  text: 'Check the axle length before printing. The stack is: hanger plate + 1.6 mm
    washer + the 16 mm wheel + 1.6 mm washer + the 8 mm lock nut = about 33 mm of
    screw under the head for a 3 mm single-plate hanger (add the second plate''s thickness
    if your hanger is a yoke with the wheel between two plates). ISO 4762 M8x40 covers
    it; M8x35 only for a single thin plate. Your own M8 bolt is fine if it measures
    35 mm or more under the head.'
  parts: []
  hardware:
  - axle
  tool: calipers or a ruler
- n: '2'
  text: 'Print the fit coupon: PLA, 0.2 mm layers, 4 walls, 25% infill, no supports,
    kept flat with the bores vertical. It is 110 x 30 x 8 mm, four bores on a 26 mm
    pitch.'
  parts:
  - coupon
  hardware: []
  tool: Bambu Lab X1C, 0.4 mm nozzle
- n: '3'
  text: Press one 608 into each coupon bore (push on the metal outer ring, never on
    the shield or the balls - a vice or a clamp with flat jaws, a 22 mm socket makes
    a good pusher). Left to right the bores are 21.80, 21.90, 22.00 and 22.10 mm.
    Remember which one grips firmly with no wobble but can still be pressed in and
    levered back out.
  parts:
  - coupon
  hardware:
  - brg
  tool: vice or clamp + 22 mm socket
- n: '4'
  text: Print the wheel and two spacers with the same settings as the coupon, wheel
    flat on the bed (axle axis vertical, no supports). The wheel is about 31 g.
  parts:
  - wheel
  - spacer
  hardware: []
  tool: null
- n: '5'
  text: 'Fit note: the wheel''s bearing seats are printed at 21.90 mm. If step 3 shows
    the bearing is loose in the 21.90 bore, or the hub cracked, either reprint the
    wheel with bearing_seat_d set to the coupon bore that worked, or keep the 21.90
    wheel and bond the bearing in place with a drop of Loctite 638 (or cyanoacrylate)
    around its outer ring.'
  parts:
  - wheel
  - coupon
  hardware:
  - brg
  tool: null
- n: '6'
  text: Press bearing A into the bottom seat, square to the bore, until its outer
    ring bottoms on the centre web (7 mm deep, its face flush with the wheel's face).
    Use the vice or a clamp with a 22 mm socket or a short length of pipe pressing
    only on the outer ring. Go slowly - the fit is intentional.
  parts:
  - wheel
  hardware:
  - brg
  tool: vice or clamp + 22 mm socket
- n: '7'
  text: Flip the wheel and press bearing B into the other seat the same way, until
    its outer ring bottoms on the web. Both outer faces should finish flush with the
    wheel's faces.
  parts:
  - wheel
  hardware:
  - brg
  tool: null
- n: '8'
  text: Measure the gap between the two bearings' inner races, seen through the centre
    hole - it should be about 2.0 mm. Lay the printed spacer on 400-grit paper and
    sand its two flat faces until it just slips into that gap with no axial play.
    A tenth of a millimetre short is better than a hair long; then drop the spacer
    in so it rests between the two inner races.
  parts:
  - wheel
  - spacer
  hardware: []
  tool: calipers, 400-grit paper
- n: '9'
  text: 'Mount it on the hanger: slide the axle through the hanger plate from the
    outside, then slide a washer down the shank to sit against the plate''s inner
    face, then slide the wheel on so the axle runs through both bearings and the spacer.
    Add the second washer and thread on the lock nut. The washer on the hanger side
    is what keeps the plate 1.6 mm clear of the wheel''s rotating side face.'
  parts:
  - wheel
  - spacer
  hardware:
  - axle
  - washer
  - lock_nut
  tool: 6 mm hex key, 13 mm spanner
- n: '10'
  text: Tighten the lock nut until the wheel has no side-to-side play on the axle
    but still spins freely. The nut only clamps the two inner races and the spacer,
    so a snug nip is all it needs - the nylon insert holds it there.
  parts: []
  hardware:
  - lock_nut
  tool: 13 mm spanner
- n: '11'
  text: 'Spin check before you re-hang the door: the wheel must turn freely and nothing
    - hanger plate, washer or nut - may touch the wheel''s side faces. If your hanger
    is a yoke with a plate on each side of the wheel, put a washer between each plate
    and its bearing (that needs about 3 mm more screw length, so use M8x45) and check
    the wheel still clears.'
  parts:
  - wheel
  - spacer
  hardware:
  - washer
  - axle
  tool: calipers or a feeler gauge
- n: '12'
  text: Re-hang the door and check it still runs at the right height and clears the
    track and the floor. If the door sits too high or too low, tell me the old wheel's
    exact diameter and tread profile (flat, grooved or flanged) and I will re-cut
    the wheel; nothing else on the drawing changes.
  parts:
  - wheel
  hardware: []
  tool: null
