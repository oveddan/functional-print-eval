params:
  access_d:
    value: 17
    unit: mm
    kind: design
    source: design
    note: washer access hole in the closed face; wider than the 16 mm washer, narrower
      than the 22 mm bearing OD so the outer ring is still stopped
  access_t:
    value: 1
    unit: mm
    kind: design
    source: design
    note: thickness of the closed face / bearing seat at z=0; 1.6 mm washer stands
      0.6 mm proud of it
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: M8 nominal; this is what you measured across the shank
  bolt_len:
    value: 40
    unit: mm
    kind: hardware
    source: design
    note: 'M8x40 ISO 4762 covers a bracket up to ~14 mm thick: 17.2 mm steel stack
      + bracket + 8 mm nut'
  brg_bore:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ bore; the M8 shank slips inside it
  brg_od:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ OD 22.000; the 21.22 reading was the bearing pinched at the jaw tips
      and reads low
  brg_w:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ width; two stacked give the 14 mm the bore is sized for
  coupon_len:
    value: 104
    unit: mm
    kind: design
    source: design
    note: coupon plate length
  coupon_t:
    value: 10
    unit: mm
    kind: design
    source: design
    note: coupon plate thickness, i.e. test bore depth
  coupon_w:
    value: 30
    unit: mm
    kind: design
    source: design
    note: coupon plate width
  coupon_x_in:
    value: 13
    unit: mm
    kind: design
    source: design
    note: inner pair of test bores, 26 mm from centre
  coupon_x_out:
    value: 39
    unit: mm
    kind: design
    source: design
    note: outer pair of test bores, 78 mm apart
  lead_in:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: lead-in at the bore mouth so the bearing starts square
  nut_h:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 lock nut height
  pocket_d:
    value: 21.9
    unit: mm
    kind: design
    source: design
    note: press-fit bore for the 608 outer ring; confirm on coupon_fit and change
      if the winner is a different size
  pocket_dep:
    value: 15
    unit: mm
    kind: design
    source: design
    note: depth of the bearing bore, z=1 to z=16; holds both 7 mm bearings plus the
      1 mm mouth lip
  rim_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: chamfer on both outer rim edges
  screw_head_d:
    value: 8.5
    unit: mm
    kind: hardware
    source: datasheet
    note: ISO 4762 M8 head diameter
  screw_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: datasheet
    note: ISO 4762 M8 head height
  test_d1:
    value: 21.7
    unit: mm
    kind: design
    source: design
    note: coupon test bore 1 (left-most), 0.2 mm under nominal
  test_d2:
    value: 21.9
    unit: mm
    kind: design
