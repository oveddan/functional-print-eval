parts:
- id: wheel
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    r_out = p[\"wheel_od\"] / 2.0\n    w     = p[\"wheel_w\"\
    ]\n    r_pk  = p[\"pocket_d\"] / 2.0\n    r_acc = p[\"access_d\"] / 2.0\n    t_acc\
    \ = p[\"access_t\"]\n    ch    = p[\"rim_chamfer\"]\n    lead  = p[\"lead_in\"\
    ]\n\n    # Cross-section of the wheel in the r-z plane, revolved about Z.\n  \
    \  # Print frame: z=0 is the bed = the closed face; the bearing bore opens upward\
    \ to z=w.\n    pts = [\n        (r_acc, 0.0),               # bottom face at the\
    \ access hole\n        (r_out - ch, 0.0),          # bottom face out to the rim\
    \ chamfer\n        (r_out, ch),                # rim chamfer\n        (r_out,\
    \ w - ch),            # rim: the rolling surface\n        (r_out - ch, w),   \
    \         # top rim chamfer\n        (r_pk + lead, w),           # top face at\
    \ the bore mouth lead-in\n        (r_pk, w - lead),           # lead-in down into\
    \ the bore\n        (r_pk, t_acc),              # bore wall down to the seat\n\
    \        (r_acc, t_acc),             # the 1 mm seat that stops the bearing outer\
    \ ring\n        (r_acc, 0.0),               # access hole wall\n    ]\n    return\
    \ (\n        cq.Workplane(\"XZ\")\n        .polyline(pts)\n        .close()\n\
    \        .revolve(360.0, (0, 0, 0), (0, 1, 0))\n    )\n"
  print_orientation: closed face (the 17 mm hole) flat on the bed, bearing bore opening
    upward; z=0 is the bed, wheel axis vertical
  use_orientation: axis horizontal, the 17 mm access hole facing the bracket, so the
    head washer drops into the recess and seats on the near bearing's inner ring
- id: coupon_fit
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    L  = p[\"coupon_len\"]\n    W  = p[\"coupon_w\"]\n   \
    \ T  = p[\"coupon_t\"]\n    xs = [-p[\"coupon_x_out\"], -p[\"coupon_x_in\"], p[\"\
    coupon_x_in\"], p[\"coupon_x_out\"]]\n    ds = [p[\"test_d1\"], p[\"test_d2\"\
    ], p[\"test_d3\"], p[\"test_d4\"]]\n\n    plate = cq.Workplane(\"XY\").box(L,\
    \ W, T, centered=(True, True, False))\n    for x, d in zip(xs, ds):\n        plate\
    \ = plate.cut(\n            cq.Workplane(\"XY\", origin=(x, 0, 0)).circle(d /\
    \ 2.0).extrude(T)\n        )\n    return plate\n"
  print_orientation: flat on the bed, test bores vertical, z=0 on the bed
  use_orientation: press one 608 into each bore in turn; keep the one that needs firm
    hand pressure
