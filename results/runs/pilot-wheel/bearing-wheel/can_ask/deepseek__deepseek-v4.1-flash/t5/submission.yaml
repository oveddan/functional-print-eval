task: bearing-wheel
note: 'Yes, this works well. Two stacked 608s are exactly 14 mm wide, which is why
  your old wheel was about 16 mm wide: the new wheel is a 50 x 16 mm roller with a
  21.9 mm bore that both bearings press into, and your M8 bolt becomes the axle.


  The one part worth understanding. Both bearings go in from the SAME side and butt
  face to face in the middle, so their two inner rings touch. That matters: the two
  M8 washers clamp the inner rings against each other, so the tightening load never
  passes through the balls and never passes through the plastic. Nothing is preloaded,
  the wheel ends up located axially with only the bearings'' own internal clearance,
  and you can tighten the nut as firmly as you like. That is why there is no spacer
  or shoulder between the bearings - the washer reaches the inner ring through a 17
  mm hole in the closed face. 17 mm is chosen deliberately: wide enough for the 16
  mm washer to drop through, narrow enough that the 22 mm bearing outer ring is still
  stopped by the 1 mm seat.


  Two smaller points:

  - The washer has to stick out of the wheel, otherwise your bracket presses on the
  spinning wheel face instead. The closed face is 1 mm thick and an ISO 7089 M8 washer
  is 1.6 mm, so it stands 0.6 mm proud. Use the standard 1.6 mm washers.

  - The bearing bore has to be a press fit, and that is the one thing a printer cannot
  be trusted to hit. Print coupon_fit first and press a bearing into each of the four
  bores; the winner is the one that needs firm hand pressure and will not pull out.
  If it is not 21.9 mm, change pocket_d on the wheel to that number and re-export.
  21.9 mm is the default.


  Print the wheel closed-face down with the bore opening up: no supports, no bridge
  over 2.45 mm, and the rolling rim is solid through its full 16 mm.


  Bolt length: the clamped steel stack is 1.6 + 7 + 7 + 1.6 = 17.2 mm. Add your bracket
  thickness and about 8 mm for the lock nut, so M8x40 covers a bracket up to roughly
  14 mm thick. Use M8x45 or M8x50 if yours is thicker - the bearings slide over the
  thread fine if it comes to that.


  One thing I could not get: every attempt to measure the bracket or the bolt came
  back as the bolt''s shank diameter (8 mm), which did confirm the M8 but left the
  bracket''s slot width and plate thickness unknown. So the design is dimensioned
  around the wheel and the bearings, and the manual covers both a single-plate bracket
  and a U-shaped one. If your bracket holds the wheel between two ears with a fixed
  gap, nothing changes - the bolt just passes through both ears and the wheel.'
