  qty: 1
joints:
- id: axle
  fastener: axle_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: thrust_washer
    feature: centre hole Ø8.5 — bolt shank passes through; washer back face rests
      on the bracket face
    role: clearance
  - part: wheel_hub
    feature: centre bore through both 608 inner races (Ø8.0 stack) — wheel spins on
      the stationary bolt
    role: clearance
  nut: null
  external: 'door-bracket axle hole: must accept the Ø8 bolt (open to Ø8.5 if under);
    washer + bolt head clamp the bracket from the door side'
- id: axle_nut
  fastener: locknut_m8
  axis_origin:
  - 0.0
  - 0.0
  - 14.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel_hub
    feature: far 608 inner-race face — nyloc face clamps it; Ø~14.4 across-corners
      stays inside the Ø21.9 bore mouth, clear of the hub face
    role: nut_pocket
  nut: null
  external: 'M8x50 socket screw: thread run-out at 22 mm from under-head; nyloc engages
    ~7.6 mm of thread at its seat'
criteria:
- id: bearing_press
  part: wheel_hub
  feature: Ø21.9 bearing bore
  relation: contains
  hardware: bearing_608
  clearance_mm: null
  params:
  - hub_bore_d
  - bearing_od
  check:
    method: coupon
    ref: coupon_bearing_fit
    description: 'press one 608 into the coupon bore: firm press; once flush the outer
      race must not rotate or pull out by hand. Too loose -> reprint hub with hub_bore_d
      -0.05; too tight -> warm part in hot water while pressing or reprint +0.05'
- id: bolt_clears_bearings
  part: wheel_hub
  feature: assembled bearing bore stack
  relation: clears
  hardware: axle_bolt
  clearance_mm: null
  params:
  - bearing_bore
  - bolt_d
  check:
    method: none
    ref: null
    description: Ø8.0 inner-race stack vs Ø8.0 shank; catalog M8x50 has a 22 mm smooth
      grip so the full stack rides on smooth shank
- id: nyloc_clears_hub
  part: wheel_hub
  feature: far face annulus Ø21.9-50
  relation: clears
  hardware: locknut_m8
  clearance_mm: null
  params:
  - nyloc_af
  - hub_bore_d
  check:
    method: none
    ref: null
    description: nyloc face circle (~Ø14.4 across corners) stays inside the Ø21.9
      bore mouth and never touches the rotating hub face
- id: thrust_locates_wheel
  part: thrust_washer
  feature: front face Ø22
  relation: supports
  hardware: bearing_608
  clearance_mm: null
  params:
  - tw_od
  - tw_t
  check:
    method: none
    ref: null
    description: front face bears on the near outer-race face and hub face annulus;
      2 mm standoff keeps the hub face off the bracket; total stack 2+14 = 16 = old
      wheel width
- id: bracket_hole_fit
  part: thrust_washer
  feature: centre hole Ø8.5
  relation: clears
  hardware: axle_bolt
  clearance_mm: null
  params:
  - tw_id
  - bolt_d
  check:
    method: measure
    ref: door-bracket axle hole
    description: the M8 bolt must slide through the bracket hole; drill or file to
      Ø8.5 if it is smaller
- id: profile_match
  part: wheel_hub
  feature: tread Ø50 x 16 stack (flat)
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - hub_od
  - old_wheel_od
  - tw_t
  - hub_width
  - groove_w
  - groove_d
  check:
    method: none
    ref: null
    description: replaces the old Ø50x16 wheel so ride height holds; verify the tread
      against the track - reprint with groove params if the track is a round rail
manual:
- n: '1'
  text: Print coupon_bearing_fit flat, no supports. Press one 608ZZ into its bore
    (vise between two flat blocks, or slow clamping pressure). It must need firm force
    and, once flush, the outer race must NOT spin or pull out by hand. Too loose ->
    reprint the hub with hub_bore_d 0.05 smaller; won't go in -> warm the coupon in
    hot water while pressing, or reprint 0.05 larger.
  parts:
  - coupon_bearing_fit
  hardware: []
  tool: vise or clamp
- n: '2'
  text: Print wheel_hub and thrust_washer flat on the bed, no supports needed.
  parts:
  - wheel_hub
  - thrust_washer
  hardware: []
  tool: null
- n: '3'
  text: Press both 608ZZ into wheel_hub, one from each face, until each outer face
    is flush with its hub face (vise between two flat scrap blocks). They end up back-to-back,
    touching in the middle, faces flush both sides.
  parts:
  - wheel_hub
  hardware:
  - bearing_608
  tool: null
- n: '4'
  text: 'Check the bracket''s axle hole: the axle bolt must slide through. If it is
    smaller, drill or file it to Ø8.5 mm. (If the old axle screwed into a threaded
    hole instead, just thread the bolt in — the rest of the assembly is identical.)'
  parts:
  - thrust_washer
  hardware: []
  tool: null
- n: '5'
  text: 'Assemble on the axle bolt, from the door side: bolt head -> ISO 7089 M8 washer
    -> through the bracket hole -> thrust_washer -> wheeled wheel_hub -> ISO 10511
    M8 nyloc. Hold the nyloc with a 13 mm wrench and tighten until the stack is snug:
    the bearing inner races must be clamped (no sideways wobble) while the wheel still
    spins freely by hand. That clamp is what keeps the wheel from sliding off. (Your
    own M8 bolt can substitute if it''s at least the bracket thickness + ~41 mm long
    — keep threads out of the bearings if you can.)'
  parts:
  - thrust_washer
  - wheel_hub
  hardware:
  - axle_bolt
  - washer_m8
  - locknut_m8
  - bearing_608
  tool: 13 mm wrench
- n: '6'
  text: 'Check protrusion: the M8x50 leaves ~20 mm of bolt past the nyloc, which can
    foul the floor or the adjacent door. Thread the nyloc ~10 mm past the intended
    cut line, cut the bolt with a hacksaw, file the end, then unscrew the nyloc to
    clean the threads before final tightening. Aim to leave ~3-5 mm of thread proud
    of the nyloc.'
  parts: []
  hardware:
  - locknut_m8
  - axle_bolt
  tool: hacksaw, file
- n: '7'
  text: 'Sanity check after tightening: wheel spins freely, no sideways rock. If it
    rocks, tighten the nyloc a touch more; if it drags, back off slightly — the nyloc''s
    nylon insert keeps it from loosening.'
  parts: []
  hardware:
  - axle_bolt
  tool: null
- n: '8'
  text: 'Hang the door: the wheel should roll freely and sit centred on the track.
    If a wheel face rubs the bracket, add a second thrust_washer. If the track turns
    out to be a round rail rather than a flat guide, reprint wheel_hub with groove_w
    ~ rail diameter + 1 mm and groove_d ~ 0.4 x rail diameter.'
  parts:
  - wheel_hub
  - thrust_washer
  hardware: []
  tool: null
