task: bearing-wheel
note: 'Roller wheel rebuilt skateboard-style: printed Ø50x14 hub carries both 608s
  back-to-back in a Ø21.9 press-fit bore (faces flush); a printed 2 mm thrust washer
  makes the total stack 16 mm = the old wheel width, so ride height is preserved.
  Axle = ISO 4762 M8x50 socket screw (22 mm smooth grip keeps threads out of the bearing
  bores; the user''s own M8 bolt substitutes if long enough — manual step 5), clamped
  washer+head to nyloc through the bracket; the ISO 10511 M8 nyloc squeezes the bearing
  inner races onto the bolt so the hub spins freely and never rubs the bracket (nyloc
  face Ø~14.4 stays inside the Ø21.9 bore mouth). ASSUMPTIONS (measuring only returned
  the bolt shank ~8 mm): tread left FLAT (most bypass-door bottom guides are flat/channels)
  — if the track is a round rail, reprint the hub with groove_w = rail Ø + 1 and groove_d
  ≈ 0.4 x rail Ø (params already in the code, 0 = flat). Bracket hole assumed to need
  opening to Ø8.5 (conditional manual step). Bolt tail is likely long → cut-to-length
  step included. Press fit is verified first via the coupon before printing the hub.'
questions: []
params:
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 nominal bore 8.0 (their caliper reading 7.94)
  bearing_od:
