    note: = old_wheel_od so ride height is unchanged
  hub_width:
    value: 14
    unit: mm
    kind: design
    source: design
    note: = 2 x bearing_w; both bearings back-to-back, faces flush with hub faces
  groove_d:
    value: 0
    unit: mm
    kind: design
    source: design
    note: 0 = flat tread; if the track is a round rail set to ~0.4 x rail Ø
  groove_w:
    value: 0
    unit: mm
    kind: design
    source: design
    note: 0 = flat tread; if the track is a round rail set to rail Ø + 1
  nyloc_af:
    value: 13
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 across flats
  nyloc_h:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 height
  old_wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: 'your words: ''about 50 mm across'''
  old_wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: 'your words: ''about 16 mm wide'''
  rim_chamfer:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: outer edge chamfers so the wheel enters a guide channel cleanly
  tw_id:
