    note: ISO 7089 M8 thickness
parts:
- id: wheel_hub
  role: final
  material: PLA (black)
  code: "def build(p):\n    R = p.hub_od / 2.0\n    W = p.hub_width\n    r = p.hub_bore_d\
    \ / 2.0\n    c = p.bore_chamfer\n    e = p.rim_chamfer\n    gw = p.groove_w\n\
    \    gd = p.groove_d\n\n    z0, z1 = e, W - e\n    pts = [(r + c, 0.0), (R - e,\
    \ 0.0), (R, z0)]\n    if gd > 0 and gw > 0:\n        zc = W / 2.0\n        pts\
    \ += [(R, zc - gw / 2.0), (R - gd, zc), (R, zc + gw / 2.0)]\n    pts += [(R, z1),\
    \ (R - e, W), (r + c, W), (r, W - c), (r, c)]\n    prof = cq.Workplane(\"XZ\"\
    ).polyline(pts).close()\n    return prof.revolve(360, (0, 0), (0, 1))"
  print_orientation: flat side face on the bed, exactly as modeled (part is symmetric,
    either face works)
  use_orientation: 'bore axis along the bolt: vertical for a bottom roller, horizontal
    for top-hung; symmetric so either works'
- id: thrust_washer
  role: final
  material: PLA (black)
  code: "def build(p):\n    return (cq.Workplane(\"XY\")\n            .circle(p.tw_od\
    \ / 2.0)\n            .circle(p.tw_id / 2.0)\n            .extrude(p.tw_t))"
  print_orientation: flat on the bed, as modeled
  use_orientation: flat against the bracket face, on the bolt
- id: coupon_bearing_fit
  role: coupon
  material: PLA (black)
  code: "def build(p):\n    r = p.hub_bore_d / 2.0\n    c = p.bore_chamfer\n    R\
    \ = 16.0\n    W = 6.0\n    pts = [(r + c, 0.0), (R, 0.0), (R, W), (r + c, W),\
    \ (r, W - c), (r, c)]\n    return cq.Workplane(\"XZ\").polyline(pts).close().revolve(360,\
    \ (0, 0), (0, 1))"
  print_orientation: flat on the bed, as modeled
  use_orientation: flat on the bench for the press-fit test
hardware:
- id: axle_bolt
  ref: ISO 4762 M8x50
  qty: 1
- id: bearing_608
  ref: 608ZZ
  qty: 2
- id: washer_m8
  ref: ISO 7089 M8
  qty: 1
- id: locknut_m8
