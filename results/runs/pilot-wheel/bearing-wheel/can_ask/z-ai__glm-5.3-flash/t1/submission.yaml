task: bearing-wheel
note: 'Concept: printed wheel 50 x 16 (matches the old wheel) with BOTH 608 bearings
  pressed in face-to-face (7 + 7 mm). The M8 bolt passes through the bearing bores;
  three washers and the M8 lock nut clamp the two INNER races to the bolt, so the
  wheel spins on the bearings instead of on the bolt threads (a printed 11.6 spacer
  floats on the bolt between the races, and the wheel''s 2 mm web hole is oversized
  so it is never clamped). Assumptions to check before final assembly: (1) track floor
  is flat — if there is a raised center rib the tread needs a groove, don''t force
  it; (2) bracket hole is a plain pass-through (bolt head + washer clamps the bracket
  between head and race stack); if it is threaded you need a fully threaded M8 bolt
  ~engagement+27 mm; (3) bracket thickness 2-10 mm (kit bolt M8x40 covers this; your
  own bolt is ideal if it is the old axle — use it if its under-head length is bracket
  thickness + ~29 mm). Print the coupon first to calibrate the bearing press fit.'
questions: []
params:
  bearing_id:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: nominal 8.0 matches M8 bolt; owner's reading 7.94
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: catalog
    note: nominal; the 21.22 caliper reading was jaw-pinched, nominal 22.0 used
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: nominal width, not measured
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8; owner's spare bolt shank measured ~8 mm and is a drop-in substitute
      if long enough
  bolt_len:
    value: 40
    unit: mm
    kind: hardware
    source: catalog
    note: 'chosen unmeasured: covers bracket thickness 2-10 mm with up to ~8 mm of
      bolt past the lock nut'
  bracket_t:
    value: 3
    unit: mm
    kind: world
    source: guessed
    note: not measured; only affects the bolt-length check, covered by M8x40 up to
      10 mm
  locknut_h:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8
  pocket_d:
    value: 22
    unit: mm
    kind: design
    source: design
    note: designed equal to bearing OD so FDM shrink yields a light press; coupon
      calibrates; glue fallback if loose
  pocket_depth:
    value: 7
    unit: mm
    kind: design
    source: design
    note: bearing sits flush with each wheel face
  spacer_id:
    value: 8.35
    unit: mm
    kind: design
    source: design
    note: clears M8 threads
  spacer_len:
    value: 2.05
    unit: mm
    kind: design
    source: design
    note: race gap 2.0 mm + 0.05 slight preload
  spacer_od:
    value: 11.6
    unit: mm
    kind: design
    source: design
    note: bears on the inner-race faces around the bore chamfer
  washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8, qty 3
  web_hole_d:
    value: 12.4
    unit: mm
    kind: design
    source: design
    note: clears the 11.6 spacer so the web is never clamped
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: as reported by owner ('about 50 mm across')
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: as reported by owner ('about 16 mm wide')
parts:
- id: wheel
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    wheel = cq.Workplane(\"XY\").circle(p.wheel_od / 2.0).extrude(p.wheel_w)\n\
    \    # bearing pocket, bracket-side face (z = 0)\n    wheel = wheel.cut(\n   \
    \     cq.Workplane(\"XY\").circle(p.pocket_d / 2.0).extrude(p.pocket_depth))\n\
    \    # bearing pocket, outboard face\n    wheel = wheel.cut(\n        cq.Workplane(\"\
    XY\").workplane(offset=p.wheel_w - p.pocket_depth)\n        .circle(p.pocket_d\
    \ / 2.0).extrude(p.pocket_depth))\n    # web hole between the two races: oversized\
    \ so the clamp never grips the web\n    wheel = wheel.cut(\n        cq.Workplane(\"\
    XY\").workplane(offset=p.pocket_depth)\n        .circle(p.web_hole_d / 2.0)\n\
    \        .extrude(p.wheel_w - 2 * p.pocket_depth))\n    return wheel"
  print_orientation: flat face on the bed, wheel axis vertical (z=0 face down, as
    modeled)
  use_orientation: axis horizontal on the bolt, tread rolling on the track
- id: race_spacer
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    return (cq.Workplane(\"XY\").circle(p.spacer_od / 2.0)\n\
    \            .circle(p.spacer_id / 2.0)\n            .extrude(p.spacer_len))"
  print_orientation: standing on end, bore axis vertical (as modeled)
  use_orientation: on the bolt between the two bearing inner races
- id: coupon_bearing_fit
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    c = cq.Workplane(\"XY\").circle(17.0).extrude(9.0)\n \
    \   c = c.cut(cq.Workplane(\"XY\").circle(p.pocket_d / 2.0).extrude(p.pocket_depth))\n\
    \    c = c.cut(cq.Workplane(\"XY\").circle(p.web_hole_d / 2.0).extrude(9.0))\n\
    \    return c"
  print_orientation: flat face on the bed, pocket opening at z=0 (as modeled)
  use_orientation: hand test only
