manual:
- n: '1'
  text: Print coupon_bearing_fit first (PLA, flat face down as modeled, 3+ perimeters).
  parts:
  - coupon_bearing_fit
  hardware: []
  tool: null
- n: '2'
  text: 'Coupon test: press a 608 bearing into the coupon pocket — it should need
    firm thumb pressure or a light tap with a block and end up flush with the surface.
    Push the M8 bolt through the bore, add a washer and the lock nut, and snug them:
    the inner race must clamp to the bolt while the OUTER race still spins freely.
    If the bearing drops in too easily, plan on a drop of superglue in the wheel pockets
    at step 4; if it won''t go in, open the pocket a touch with a rolled strip of
    sandpaper.'
  parts:
  - coupon_bearing_fit
  hardware:
  - bearings_608
  - bolt_m8
  - washer_m8
  - locknut_m8
  tool: null
- n: '3'
  text: Print the wheel (flat face down as modeled; 4+ perimeters and at least 60%
    infill — it carries the door) and the race_spacer (standing on end; a small brim
    helps).
  parts:
  - wheel
  - race_spacer
  hardware: []
  tool: null
- n: '4'
  text: 'Press one bearing into each face of the wheel: support the wheel on a ring
    or socket so the middle isn''t loaded, and tap them home with a wood block until
    each bearing sits flush with its wheel face. Add a small drop of superglue around
    each pocket rim now if the coupon fit was loose.'
  parts:
  - wheel
  hardware:
  - bearings_608
  tool: null
- n: '5'
  text: 'Dry-run on the bolt (no bracket yet): bolt head → washer → wheel (the washer
    drops into the pocket mouth and sits on the bearing''s inner-race face) → race_spacer
    over the bolt between the two races → washer → lock nut. Hold the bolt with a
    6 mm Allen key and tighten the lock nut only until the washers just grip the race
    faces — the bearings must not slide on the bolt, but do not crush. Spin the wheel:
    it must turn freely and quietly.'
  parts:
  - wheel
  - race_spacer
  hardware:
  - bolt_m8
  - washer_m8
  - locknut_m8
  tool: null
- n: '6'
  text: 'Install through the door bracket: head → washer → bracket hole → washer →
    wheel → spacer → washer → lock nut, and tighten exactly as in step 5. The bolt
    tip sticks out up to ~8 mm past the lock nut — confirm it can''t touch the track
    wall or floor.'
  parts:
  - wheel
  - race_spacer
  hardware:
  - bolt_m8
  - washer_m8
  - locknut_m8
  tool: null
- n: '7'
  text: 'Before rehanging the door: confirm the track floor is flat and the 50 x 16
    wheel sits in the channel with side clearance like the old one. If the track has
    a raised center rib, stop — the tread needs a groove and this wheel must not be
    forced onto it.'
  parts:
  - wheel
  hardware: []
  tool: null
- n: '8'
  text: 'Variant: if the bracket hole is threaded (bolt screws in), you need a fully
    threaded M8 bolt of about engagement + 27 mm (your own bolt if it qualifies —
    the kit socket screw''s 28 mm of thread is only enough for ~1 mm engagement).
    Then: bracket face → washer → wheel → spacer → washer → lock nut; set ride height,
    then tighten. Rehang the door and roll.'
  parts:
  - wheel
  - race_spacer
  hardware:
  - bolt_m8
  - washer_m8
  - locknut_m8
  tool: null
