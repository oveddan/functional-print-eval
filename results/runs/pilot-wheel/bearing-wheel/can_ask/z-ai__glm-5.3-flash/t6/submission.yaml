task: bearing-wheel
note: 'Replacement closet-door roller: printed 50x16 wheel carrying two 608ZZ bearings
  (one per face, 0.2 mm recessed), spinning on an M8 axle. Printed 2 mm spacers let
  the lock nut clamp the bearing inner races so the wheel spins freely on the bearings.
  Your own M8 bolt is the preferred axle (it''s what the door fitting was made for);
  the catalog ISO 4762 M8x45 is the listed fallback. Includes a 3-pocket fit coupon
  to dial in the 22 mm bearing pocket before printing the wheel. Manual covers both
  a plain bracket hole and a threaded fitting.'
questions:
- text: Does the roller mount to a plain hole in a bracket (bolt through, head on
    top) or to a threaded fitting the bolt screws into? The manual covers both, but
    tell me which you have if anything feels off in step 4.
  answer: null
- text: Roughly how long is your M8 bolt (under the head to the tip)? It needs ~30
    mm below the fitting/bracket, or use the listed ISO 4762 M8x45.
  answer: null
params:
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: measured 7.94 earlier; nominal 8.0 used - the axle runs in the bearing bores
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 OD 22.000 -0.008; the earlier 21.22 reading was a pinch artifact
  bearing_width:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: two side by side + web gives the ~16 mm width
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: 'owner measured the shank of their own bolt: about 8 mm; same nominal as
      the listed M8 screw'
  bolt_head_d:
    value: 13
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8 head; the owner bolt's head type is unverified, only used for
      hole/height checks
  bolt_head_h:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  coupon_l:
    value: 75
    unit: mm
    kind: design
    source: design
    note: fit coupon length, three pockets at x = -24/0/+24
  coupon_step:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: 'pocket size spread on the coupon: 22.05 / 22.15 / 22.25'
  coupon_t:
    value: 8
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_w:
    value: 34
    unit: mm
    kind: design
    source: design
    note: ''
  edge_round:
    value: 3
    unit: mm
    kind: design
    source: design
    note: rounded tread edges suit flat or U-section tracks
  inner_race_od:
    value: 11.5
    unit: mm
    kind: hardware
    source: guessed
    note: typical 608 inner ring OD ~11.5-12.2; spacer OD chosen just below it so
      the nut clamps the race, not the shield
  locknut_af:
    value: 13
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  locknut_h:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  pocket_d:
    value: 22.15
    unit: mm
    kind: design
    source: design
    note: slip fit over the 22.0 bearing; coupon tunes +/-0.1; loose fits get CA glue
  pocket_depth:
    value: 7.2
    unit: mm
    kind: design
    source: design
    note: 0.2 mm recess of the 7.0 bearing on each face
  screw_len:
    value: 45
    unit: mm
    kind: hardware
    source: catalog
    note: 'ISO 4762 M8x45: head 8 + shank 37 covers bracket up to ~7 mm plus the 27.6
      mm wheel stack'
  spacer_exposure:
    value: 1.8
    unit: mm
    kind: design
    source: design
    note: spacer_t - (pocket_depth - bearing_width); clearance between wheel face
      and door fitting / nut
  spacer_id:
    value: 8.3
    unit: mm
    kind: design
    source: design
    note: slip fit on the M8 bolt
  spacer_od:
    value: 11
    unit: mm
    kind: design
    source: design
    note: under the bearing inner race so the nut clamps the race, not the shield
  spacer_t:
    value: 2
    unit: mm
    kind: design
    source: design
    note: ''
  stack_below_nominal:
    value: 27.6
    unit: mm
    kind: design
    source: design
    note: 2*spacer_exposure + wheel_width + locknut_h; axle must show ~30 mm below
      the fitting (add ~2 threads)
  web_bore:
    value: 12.5
    unit: mm
    kind: design
    source: design
    note: clears the bolt and the bearing inner races so the wheel never rubs the
      axle
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: 'owner: old wheel ''about 50 mm across'''
  wheel_width:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: 'owner: old wheel ''about 16 mm wide''; two 7 mm bearings + 2 mm web = 16
      mm'
parts:
- id: wheel
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    w = p.wheel_width\n    body = cq.Workplane(\"XY\").circle(p.wheel_od\
    \ / 2.0).extrude(w)\n    body = body.edges(\"%CIRCLE\").fillet(p.edge_round)\n\
    \    body = body.cut(\n        cq.Workplane(\"XY\").circle(p.web_bore / 2.0).extrude(w))\n\
    \    body = body.cut(\n        cq.Workplane(\"XY\", origin=(0, 0, -0.5))\n   \
    \     .circle(p.pocket_d / 2.0).extrude(p.pocket_depth + 0.5))\n    body = body.cut(\n\
    \        cq.Workplane(\"XY\", origin=(0, 0, w - p.pocket_depth))\n        .circle(p.pocket_d\
    \ / 2.0).extrude(p.pocket_depth + 0.5))\n    return body\n"
  print_orientation: 'flat: bottom face on bed, wheel axle along Z'
  use_orientation: axle along the bolt axis on the door fitting (printed orientation
    is just for manufacture)
- id: spacer
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    return (cq.Workplane(\"XY\")\n            .circle(p.spacer_od\
    \ / 2.0)\n            .circle(p.spacer_id / 2.0)\n            .extrude(p.spacer_t))\n"
  print_orientation: flat on bed
  use_orientation: on the bolt between bearing face and door fitting / lock nut
- id: coupon-bearing-fit
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    T = p.coupon_t\n    xs = [-24.0, 0.0, 24.0]\n    ds =\
    \ [p.pocket_d - p.coupon_step, p.pocket_d, p.pocket_d + p.coupon_step]\n    bar\
    \ = cq.Workplane(\"XY\").box(p.coupon_l, p.coupon_w, T,\n                    \
    \             centered=(True, True, False))\n    for x, d in zip(xs, ds):\n  \
    \      bar = bar.cut(\n            cq.Workplane(\"XY\", origin=(x, 0, T - p.pocket_depth))\n\
    \            .circle(d / 2.0).extrude(p.pocket_depth + 0.5))\n    for x, label\
    \ in zip(xs, [\"1\", \"2\", \"3\"]):\n        bar = bar.cut(\n            cq.Workplane(\"\
    XY\", origin=(0, 0, T))\n            .center(x, 14.0).text(label, 6.0, 1.0, cut=True))\n\
    \    return bar\n"
  print_orientation: flat, pockets up
  use_orientation: hand test only, not used on the door
