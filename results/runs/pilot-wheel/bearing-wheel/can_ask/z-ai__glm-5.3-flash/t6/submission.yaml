manual:
- n: '1'
  text: 'Print coupon-bearing-fit flat (pockets up), PLA. Press one 608ZZ bearing
    into each labelled pocket: 1 = 22.05 mm (press fit), 2 = 22.15 mm (the size the
    wheel uses), 3 = 22.25 mm (loose). Note which pocket holds the bearing with firm
    thumb pressure and no rattle.'
  parts:
  - coupon-bearing-fit
  hardware: []
  tool: null
- n: '2'
  text: Print the wheel flat, tread down, 4 wall loops and at least 25% infill. Print
    spacer twice. If coupon pocket 3 was the only one the bearing fit into, expect
    to glue the bearings in step 3; if pocket 1 was needed, sand the wheel pockets
    lightly with a rolled-up strip of sandpaper.
  parts:
  - wheel
  - spacer
  hardware: []
  tool: null
- n: '3'
  text: Press one 608ZZ into each wheel pocket, one from each face; they should sit
    ~0.2 mm below the wheel faces. If a bearing rattles, put 3-4 small dabs of CA
    glue (or epoxy) around its outer race in the pocket, press it in flush, and let
    it cure before step 4.
  parts:
  - wheel
  - spacer
  hardware:
  - bearing-608
  tool: null
- n: '4'
  text: 'Assemble on the door. (A) Bracket with a plain hole: drop the M8 screw down
    through it, head on top (add the ISO 7089 washer under the head only if the hole
    is bigger than the 13 mm head). From below fit: spacer, wheel (bearings on the
    screw), spacer, then the lock nut. (B) Threaded fitting above the wheel: screw
    the axle up into the fitting until ~30 mm of shank hangs below it, then fit spacer,
    wheel, spacer, lock nut from below; the head hanging below the nut is dead length,
    that''s normal. Required below the fitting: about 30 mm (1.8 + 16 + 1.8 + 8 +
    2). Your own M8 bolt can be used instead of the listed screw if it gives at least
    that much length.'
  parts: []
  hardware:
  - axle-screw
  - washer-m8
  - locknut-m8
  tool: null
- n: '5'
  text: 'Hold the screw head with the 6 mm hex key and tighten the ISO 10511 M8 lock
    nut with the 13 mm wrench until the stack is clamped - the spacers should bear
    on the bearing inner races and the wheel face should stand ~1.8 mm clear of the
    door fitting. Spin the wheel by hand: it must turn freely. If it drags, back the
    nut off an eighth turn at a time until it spins free.'
  parts: []
  hardware:
  - locknut-m8
  tool: 13 mm wrench + 6 mm hex key
- n: '6'
  text: 'Set the door height: slacken the lock nut, slide the assembly to height (the
    screw shank moves in the bracket hole), retighten, and roll the door back and
    forth a few times. The wheel should spin freely and clear the track sides; reprint
    a fresh wheel if the tread ever wears down.'
  parts: []
  hardware:
  - locknut-m8
  tool: null
