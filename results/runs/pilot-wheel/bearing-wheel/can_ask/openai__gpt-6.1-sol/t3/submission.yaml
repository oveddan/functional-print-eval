task: bearing-wheel
note: Provisional 50 × 16 mm flat-tread wheel with two 608 bearings. Bench prototype
  only until track and mounting compatibility are confirmed. Not load-rated; not suitable
  for a hanging door or sole anti-derailment restraint. PLA creeps under sustained
  load and softens in heat. Door weight, bracket, track shape and original bolt length
  are unknown. CAD has not been executed or tested here.
questions:
- text: Wheel dimensions?
  answer: User estimates 50 mm diameter, 16 mm wide.
- text: Bearing dimensions?
  answer: User measured approximately 22 mm OD and 7 mm width.
- text: Axle diameter?
  answer: User measured approximately 8 mm.
- text: Track shape, door weight, bracket geometry and bolt length?
  answer: null
