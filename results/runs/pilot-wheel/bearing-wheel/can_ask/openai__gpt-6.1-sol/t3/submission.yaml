parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    d = p.bearing_od+p.fit_add\n    assert p.wheel_w > 2*p.bearing_w\n\
    \    w = cq.Workplane('XY').circle(p.wheel_d/2).extrude(p.wheel_w)\n    w = w.cut(cq.Workplane('XY').circle(p.web_bore/2).extrude(p.wheel_w))\n\
    \    w = w.cut(cq.Workplane('XY').circle(d/2).extrude(p.bearing_w))\n    return\
    \ w.cut(cq.Workplane('XY').workplane(offset=p.wheel_w-p.bearing_w).circle(d/2).extrude(p.bearing_w))\n"
  print_orientation: Axis vertical, lower bearing opening on bed at z=0. Use build-plate-only
    support inside lower pocket under central shoulder; remove before assembly.
  use_orientation: Bearings at z=0..7 and z=9..16; flat cylindrical tread on track.
- id: center_spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.axle_d+p.axle_clearance)/2).extrude(p.center_spacer_h)\n"
  print_orientation: Flat annular face on bed.
  use_orientation: Between bearing inner races, floating inside web opening.
- id: end_spacer_head
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.axle_d+p.axle_clearance)/2).extrude(p.end_spacer_h)\n"
  print_orientation: Flat annular face on bed.
  use_orientation: Between head-side washer and bearing inner race.
- id: end_spacer_nut
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.axle_d+p.axle_clearance)/2).extrude(p.end_spacer_h)\n"
  print_orientation: Flat annular face on bed.
  use_orientation: Between nut-side washer and bearing inner race.
- id: bearing_fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    result = None\n    for i in range(int(p.coupon_count)):\n\
    \        x = i*p.coupon_pitch\n        ring = cq.Workplane('XY').center(x,0).circle(p.coupon_od/2).extrude(p.coupon_floor+p.bearing_w)\n\
    \        ring = ring.cut(cq.Workplane('XY').center(x,0).circle(p.web_bore/2).extrude(p.coupon_floor+p.bearing_w))\n\
    \        pocket = cq.Workplane('XY').workplane(offset=p.coupon_floor).center(x,0).circle((p.bearing_od+i*p.coupon_step)/2).extrude(p.bearing_w)\n\
    \        ring = ring.cut(pocket)\n        result = ring if result is None else\
    \ result.union(ring)\n    span = (p.coupon_count-1)*p.coupon_pitch\n    return\
    \ result.union(cq.Workplane('XY').center(span/2,p.coupon_link_y).rect(span,p.coupon_link_w).extrude(p.coupon_link_h))\n"
  print_orientation: Floors on bed; pockets face upward, no supports.
  use_orientation: Bench test; pockets along +X are 22.0, 22.1, 22.2, 22.3 mm.
