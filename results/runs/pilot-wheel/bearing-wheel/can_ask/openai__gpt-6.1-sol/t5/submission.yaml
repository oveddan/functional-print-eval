task: bearing-wheel
note: '50 x 16 mm flat-tread, two-piece wheel capturing two abutting 608 bearings.
  SUPPORTED-DOOR FIT/SPIN PROTOTYPE ONLY: track profile, mounting and load are unverified.
  Do not put the door''s weight on this prototype or operate the door with it installed.
  PLA and the printed axle spacers are not qualified for sustained door loads. Use
  an OEM/load-rated replacement if this is a supporting roller. Assembly includes
  a standalone test axle, not an invented door mounting. Existing bolt length is unknown;
  use the specified catalog bolt for the bench assembly.'
questions:
- text: Original tread profile, track geometry and whether the roller supports the
    door?
  answer: User could not measure; unknown. Flat tread is a prototype choice, not a
    verified match.
- text: Existing bolt length and door attachment geometry?
  answer: Not supplied; existing bolt is not specified for the test assembly.
