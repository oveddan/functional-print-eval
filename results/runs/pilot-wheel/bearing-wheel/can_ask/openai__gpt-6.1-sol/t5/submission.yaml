parts:
- id: wheel_head_half
  role: final
  material: PLA (black)
  code: "import math\n\ndef build(p):\n    h=p.wheel_w/2\n    depth=p.bearing_w+p.axial_allowance_half\n\
    \    lip=h-depth\n    s=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n  \
    \  s=s.edges('%Circle').chamfer(p.edge_chamfer)\n    s=s.cut(cq.Workplane('XY').circle(p.lip_opening/2).extrude(h))\n\
    \    s=s.cut(cq.Workplane('XY').workplane(offset=lip).circle((p.bearing_od+p.bearing_clearance)/2).extrude(depth))\n\
    \    for i in range(int(p.screw_count)):\n        a=2*math.pi*i/p.screw_count\n\
    \        x,y=p.screw_circle_r*math.cos(a),p.screw_circle_r*math.sin(a)\n     \
    \   s=s.cut(cq.Workplane('XY').center(x,y).circle((p.m3_d+p.screw_clearance)/2).extrude(h))\n\
    \        s=s.cut(cq.Workplane('XY').center(x,y).circle((p.m3_head_d+p.head_clearance)/2).extrude(p.m3_head_h+p.head_depth_extra))\n\
    \    return s"
  print_orientation: Outward wheel face on bed, z=0; open bearing pocket faces up.
    No support needed.
  use_orientation: Outward head-side face z=0; mating face z=8. Axle along +Z.
- id: wheel_nut_half
  role: final
  material: PLA (black)
  code: "import math\n\ndef build(p):\n    h=p.wheel_w/2\n    depth=p.bearing_w+p.axial_allowance_half\n\
    \    lip=h-depth\n    s=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n  \
    \  s=s.edges('%Circle').chamfer(p.edge_chamfer)\n    s=s.cut(cq.Workplane('XY').circle(p.lip_opening/2).extrude(h))\n\
    \    s=s.cut(cq.Workplane('XY').workplane(offset=lip).circle((p.bearing_od+p.bearing_clearance)/2).extrude(depth))\n\
    \    for i in range(int(p.screw_count)):\n        a=2*math.pi*i/p.screw_count\n\
    \        x,y=p.screw_circle_r*math.cos(a),p.screw_circle_r*math.sin(a)\n     \
    \   s=s.cut(cq.Workplane('XY').center(x,y).circle((p.m3_d+p.screw_clearance)/2).extrude(h))\n\
    \        s=s.cut(cq.Workplane('XY').center(x,y).polygon(6,2*(p.m3_nut_af+p.nut_clearance)/math.sqrt(3)).extrude(p.m3_nut_h+p.nut_depth_extra))\n\
    \    return s"
  print_orientation: Outward nut-side face on bed, z=0; open bearing pocket up. Nut
    recess roof spans under 7 mm; no supports.
  use_orientation: Flip 180 degrees about X then translate +16 mm in Z relative to
    head half. Its mating face meets head half at z=8; outward face at z=16.
- id: axle_spacer_a
  role: final
  material: PLA (black), prototype only
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.bolt_d+p.spacer_id_clearance)/2).extrude(p.spacer_length)"
  print_orientation: Annular end on bed, axis vertical.
  use_orientation: Between first washer and head-side bearing inner race; passes inside
    retaining lip without contact.
- id: axle_spacer_b
  role: final
  material: PLA (black), prototype only
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.bolt_d+p.spacer_id_clearance)/2).extrude(p.spacer_length)"
  print_orientation: Annular end on bed, axis vertical.
  use_orientation: Between nut-side bearing inner race and second washer.
- id: bearing_fit_coupon
  role: coupon
  material: PLA (black)
  code: "def build(p):\n    s=cq.Workplane('XY').box(3*p.coupon_pitch,p.coupon_width,p.coupon_thickness,centered=(True,True,False))\n\
    \    for i in range(3):\n        x=(i-1)*p.coupon_pitch\n        s=s.cut(cq.Workplane('XY').center(x,0).circle((p.bearing_od+i*p.coupon_step)/2).extrude(p.coupon_thickness))\n\
    \    return s"
  print_orientation: Large flat face on bed.
  use_orientation: From x negative to positive, bores are nominal bearing OD +0.00,
    +0.15, +0.30 mm.
