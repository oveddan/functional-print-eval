criteria:
- id: bearing_fit
  part: wheel_head_half
  feature: Bearing bore (same in both halves)
  relation: contains
  hardware: bearings
  clearance_mm: 0.15
  params:
  - bearing_od
  - bearing_clearance
  check:
    method: coupon
    ref: bearing_fit_coupon
    description: Choose the smallest bore allowing full insertion by hand without
      force or appreciable rocking. Update bearing_clearance in both halves if needed.
      Do not hammer a bearing or enlarge it by tightening shell screws.
- id: outer_race_retention
  part: wheel_nut_half
  feature: Retaining lip
  relation: seats
  hardware: bearings
  clearance_mm: null
  params:
  - lip_opening
  - bearing_od
  - bearing_w
  - axial_allowance_half
  check:
    method: measure
    ref: null
    description: Confirm lip contacts only the metal outer race, not the shield, and
      that both bearings can touch each other while shell mating faces close completely.
- id: inner_race_spacer
  part: axle_spacer_a
  feature: End annulus, also check spacer B
  relation: seats
  hardware: bearings
  clearance_mm: null
  params:
  - spacer_od
  - spacer_id_clearance
  - spacer_length
  check:
    method: measure
    ref: null
    description: End annulus must lie entirely on inner race and not contact shield.
      Check bore clears bolt and neither spacer rubs retaining lip. Stop if this cannot
      be verified.
- id: test_axle_engagement
  part: axle_spacer_b
  feature: Standalone axle stack
  relation: clears
  hardware: test_axle
  clearance_mm: null
  params:
  - bearing_w
  - spacer_length
  - m8_washer_t
  - m8_locknut_h
  - test_bolt_length
  check:
    method: measure
    ref: null
    description: 'Nominal stack excluding locknut: 23.2 mm. Including locknut: 31.2
      mm; 35 mm bolt leaves 3.8 mm beyond nut. Confirm at least two complete threads
      beyond nylon and that wheel spins freely. No door bracket included in this stack.'
- id: track_compatibility
  part: wheel_head_half
  feature: Flat tread and full assembled hardware envelope
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - wheel_d
  - wheel_w
  check:
    method: template
    ref: null
    description: With door independently supported, compare assembled prototype with
      old wheel and track. Flat tread must match original function, hardware must
      clear, and retention against derailment must be established. This check alone
      does not qualify a load-bearing application.
manual:
- n: '1'
  text: Support and secure the door independently against falling and tipping before
    touching the original roller. Do not rely on this print to support it. Unknown
    load/track geometry prevents approval as a working replacement.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print the bearing-fit coupon at 0.2 mm layers. Identify the holes in left-to-right
    order before removing it from the bed. Test the actual bearings by hand and adjust
    bearing_clearance to the smallest freely sliding fit. If none fits, adjust and
    reprint the coupon.
  parts:
  - bearing_fit_coupon
  hardware:
  - bearings
  tool: null
- n: '3'
  text: 'Print both wheel halves and both spacers in their specified orientations:
    5 walls, 6 top/bottom layers, 60% infill. No supports. Remove elephant-foot burrs
    from mating faces, bearing pockets and axle bores without changing the fits.'
  parts:
  - wheel_head_half
  - wheel_nut_half
  - axle_spacer_a
  - axle_spacer_b
  hardware: []
  tool: Deburring tool
- n: '4'
  text: Place one bearing in each half. Confirm retaining lips touch only outer races.
    Bring open faces together and align three holes. Bearings must abut and plastic
    faces must meet without force; do not use screws to pull an interfering assembly
    together.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - bearings
  tool: null
- n: '5'
  text: Insert three M3 nuts into outward hex recesses and the three M3x12 screws
    through the opposite recessed seats. Hold nuts initially if loose. Tighten evenly,
    only finger-snug with the short end of the hex key; stop before crushing plastic.
    Verify screw tips and nuts remain recessed and bearing rotation is smooth.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - shell_screws
  - shell_nuts
  tool: 2.5 mm hex key
- n: '6'
  text: 'For a standalone bench axle, assemble: M8x35 bolt head, M8 washer, spacer
    A, both bearing inner rings, spacer B, M8 washer, M8 locknut. Neither washer may
    touch the rotating shell. Verify spacers touch only the inner races. Tighten only
    enough to remove end play; the locknut resists loosening without heavy preload.
    The printed spacers are for this test only.'
  parts:
  - axle_spacer_a
  - axle_spacer_b
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - test_axle
  - axle_washers
  - axle_locknut
  - bearings
  tool: 6 mm hex key and 13 mm wrench
- n: '7'
  text: Hold the axle stationary and spin the wheel by hand. Reject binding, rubbing,
    wobble, shell separation or movement of bearings in their bores. Confirm at least
    two bolt threads protrude through the locknut. Do not add a bracket to this specified
    bolt stack without rechecking length and engagement.
  parts: []
  hardware:
  - test_axle
  - axle_locknut
  tool: null
- n: '8'
  text: Compare fit with the old roller and track only while the door remains independently
    supported; do not roll or load the door. A flat-tread prototype is unsuitable
    if the original needs a groove, crown or different retention geometry. Obtain
    the correct rated roller for a weight-bearing door; further mounting and track
    measurements are needed before a functional replacement can be designed.
  parts: []
  hardware: []
  tool: null
