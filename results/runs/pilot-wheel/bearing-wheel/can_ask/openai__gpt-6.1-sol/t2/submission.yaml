  - 0.0
  - 0.0
  - -3.6
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: left_spacer
    feature: Axial bore and head-side annular face behind washer
    role: clearance
  - part: inner_spacer
    feature: Axial bore between bearing inner rings
    role: clearance
  - part: right_spacer
    feature: Axial bore and nut-side annular face behind washer
    role: clearance
  nut: axle_nut
