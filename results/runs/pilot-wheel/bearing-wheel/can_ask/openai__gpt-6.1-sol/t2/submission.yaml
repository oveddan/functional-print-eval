parts:
- id: bearing_fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    h=p.bearing_width+p.coupon_floor\n    s=cq.Workplane('XY').circle(p.coupon_od/2).circle(p.shoulder_bore/2).extrude(h)\n\
    \    cut=cq.Workplane('XY').workplane(offset=p.coupon_floor).circle((p.bearing_od+p.bearing_diametral_clearance)/2).extrude(p.bearing_width)\n\
    \    return s.cut(cut)\n"
  print_orientation: Annular floor at z=0; pocket upward.
  use_orientation: Finger-test bearing in pocket.
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    if p.wheel_width<=2*p.bearing_width:\n        raise ValueError('Positive\
    \ central shoulder required')\n    s=cq.Workplane('XY').circle(p.wheel_od/2).extrude(p.wheel_width)\n\
    \    s=s.edges('%Circle').chamfer(p.edge_chamfer)\n    s=s.cut(cq.Workplane('XY').circle(p.shoulder_bore/2).extrude(p.wheel_width))\n\
    \    r=(p.bearing_od+p.bearing_diametral_clearance)/2\n    a=cq.Workplane('XY').circle(r).extrude(p.bearing_width)\n\
    \    b=cq.Workplane('XY').workplane(offset=p.wheel_width-p.bearing_width).circle(r).extrude(p.bearing_width)\n\
    \    return s.cut(a).cut(b)\n"
  print_orientation: Flat side at z=0; axle vertical. Shoulder radial overhang only
    2.1 mm; no support intended.
  use_orientation: Axle on z axis. Bearings occupy z=0..7 and 9..16.
- id: inner_spacer
  role: final
  material: PLA
  code: "def build(p):\n    h=p.wheel_width-2*p.bearing_width\n    if h<=0:\n    \
    \    raise ValueError('Positive spacer length required')\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_bore/2).extrude(h)\n"
  print_orientation: Annular end at z=0.
  use_orientation: Translate to wheel z=7..9, between inner rings.
- id: left_spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_bore/2).extrude(p.end_spacer_length)\n"
  print_orientation: Annular end at z=0.
  use_orientation: Translate to wheel z=-2..0; inner-ring contact only.
- id: right_spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_bore/2).extrude(p.end_spacer_length)\n"
  print_orientation: Annular end at z=0.
  use_orientation: Translate to wheel z=16..18; inner-ring contact only.
