    z=19.6. Actual bracket mounting unresolved.
criteria:
- id: bearing_fit
  part: wheel
  feature: Two bearing seats
  relation: contains
  hardware: bearing_left
  clearance_mm: 0.2
  params:
  - bearing_od
  - bearing_width
  - bearing_diametral_clearance
  check:
    method: coupon
    ref: bearing_fit_coupon
    description: Test both bearings. Finger pressure must seat fully without visible
      rocking. Clearance is diametral. Adjust allowance and reprint coupon if needed;
      do not hammer.
- id: second_fit
  part: wheel
  feature: Opposite seat
  relation: contains
  hardware: bearing_right
  clearance_mm: null
  params:
  - bearing_od
  - bearing_width
  check:
    method: coupon
    ref: bearing_fit_coupon
    description: Confirm second bearing fits equally well.
- id: inner_ring_stack
  part: inner_spacer
  feature: 2 mm inner-ring spacer
  relation: seats
  hardware: bearing_left
  clearance_mm: null
  params:
  - wheel_width
  - bearing_width
  - spacer_od
  check:
    method: measure
    ref: null
    description: Actual bearings must be 7 mm wide and spacer 2 mm. Ends touch inner
      rings only. Wheel must spin freely with nut snug.
- id: left_contact
  part: left_spacer
  feature: Inner-ring-only stand-off
  relation: seats
  hardware: bearing_left
  clearance_mm: null
  params:
  - spacer_od
  - end_spacer_length
  check:
    method: measure
    ref: null
    description: No shield/outer-ring contact; washer clears wheel.
- id: right_contact
  part: right_spacer
  feature: Inner-ring-only stand-off
  relation: seats
  hardware: bearing_right
  clearance_mm: null
  params:
  - spacer_od
  - end_spacer_length
  check:
    method: measure
    ref: null
    description: No shield/outer-ring contact; washer clears wheel.
- id: mount_gate
  part: wheel
  feature: Flat tread and spacer stack
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - wheel_width
  - end_spacer_length
  check:
    method: measure
    ref: null
    description: 'Unresolved: establish bracket gap, track profile and door loading.
      Inner stack needs 20 mm. Do not bend bracket to fit. Reject flat tread if groove/flange
      required. No safe door load established.'
- id: bolt_engagement
  part: right_spacer
  feature: Axle stack
  relation: clears
  hardware: axle
  clearance_mm: null
  params:
  - bolt_length
  - bolt_threaded_length
  - nut_height
  - thread_pitch
  - washer_thickness
  check:
    method: measure
    ref: null
    description: Installed under-head stack plus 8 mm nut plus two thread pitches
      must fit within 40 mm. Nylon must fully engage threads; nut cannot stop on shank.
      Head/tip must clear track.
manual:
- n: '1'
  text: Safely support and unload the door. Do not remove a roller with the door resting
    on it. This design is only an unloaded-fit prototype.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '2'
  text: Print bearing_fit_coupon in PLA, 0.2 mm layers, four walls, solid fill. Test
    both bearings with fingers. Adjust bearing_diametral_clearance and repeat if tight
    or loose.
  parts:
  - bearing_fit_coupon
  hardware:
  - bearing_left
  - bearing_right
  tool: null
- n: '3'
  text: Print wheel with six walls, six top/bottom layers and 100% infill. Print all
    spacers solid. Use stated orientations without supports. Remove brim/elephant
    foot without changing seat geometry; reject cracks or incomplete layers.
  parts:
  - wheel
  - inner_spacer
  - left_spacer
  - right_spacer
  hardware: []
  tool: null
- n: '4'
  text: Seat first bearing, insert inner_spacer through opposite side and align bores,
    then seat second bearing. Bearing outer faces should be flush with wheel sides.
    Wheel's central shoulder locates outer rings; inner_spacer separates inner rings.
  parts:
  - wheel
  - inner_spacer
  hardware:
  - bearing_left
  - bearing_right
  tool: null
- n: '5'
  text: 'Bench assembly order: M8x40 head, washer, left_spacer, first bearing in wheel,
    inner_spacer, second bearing in wheel, right_spacer, washer, lock nut. Spacers
    must contact inner rings only. Never place full-size washers directly against
    shields.'
  parts:
  - wheel
  - inner_spacer
  - left_spacer
  - right_spacer
  hardware:
  - axle
  - axle_washers
  - axle_nut
  - bearing_left
  - bearing_right
  tool: null
- n: '6'
  text: Gently snug nut while holding bolt head. Do not apply steel-joint M8 torque
    to PLA. Wheel must spin freely without bolt turning. Binding requires dismantling
    and checking spacer lengths, burrs and shield contact—not leaving nut loose. PLA
    spacers can creep; this is not a qualified permanent clamped joint.
  parts:
  - wheel
  - inner_spacer
  - left_spacer
  - right_spacer
  hardware:
  - axle
  - axle_nut
  tool: 6 mm hex key and 13 mm spanner
- n: '7'
  text: Before installation resolve track profile, bracket geometry, roller loading
    and lateral retention. Wheel width is 16 mm but spacer stack is 20 mm, or 23.2
    mm with washers. Do not bend bracket to fit. Verify full nylon engagement with
    two threads beyond nut, no shank interference and head/tip clearance. Existing
    bolt length is unknown. Bench joint does not specify a bracket mounting.
  parts:
  - wheel
  - left_spacer
  - right_spacer
  hardware:
  - axle
  - axle_washers
  - axle_nut
  tool: null
- n: '8'
  text: Do not return a load-bearing door to service on this unvalidated PLA prototype.
    Use a correctly profiled, load-rated replacement roller for permanent service.
    Unloaded fit/spin tests do not establish capacity, creep resistance or derailment
    safety.
  parts:
  - wheel
  hardware: []
  tool: null
