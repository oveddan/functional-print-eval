task: bearing-wheel
note: 'Bench-test prototype only: a 50 mm flat-tread split wheel with two 608 bearings.
  The track profile, door load, bracket clearance, original bolt length, and bearing
  width were not established. Do NOT install this as a weight-bearing door roller
  on the information available. PLA can creep and split under sustained load; a successful
  spin test does not establish load capacity. The design uses a known M8x40 catalog
  screw instead of the unidentified-length existing bolt. A commercial replacement
  roller is preferable for a heavy or suspended door.'
questions:
- text: Old wheel diameter and width?
  answer: User estimates about 50 mm diameter and 16 mm width; not verified.
- text: Track/tread profile and whether roller carries the door?
  answer: User cannot measure; unknown. Flat tread is a prototype assumption only.
- text: Existing bolt dimensions?
  answer: Shank approximately 8 mm; length and smooth-shank length remain unknown.
- text: Bearing and bracket dimensions?
  answer: Bearing OD approximately 22 mm. Bearing width and bracket gap not measured.
