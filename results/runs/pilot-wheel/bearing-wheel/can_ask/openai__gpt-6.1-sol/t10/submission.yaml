manual:
- n: '1'
  text: Keep the door safely supported independently and do not remove a weight-bearing
    roller unless the door is secured. This design is only a bench prototype. Unknown
    load and track geometry prevent approval for door use.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print bearing_fit_coupon and the three spacer/collar rings in PLA at 0.2 mm
    layers. Use 5 walls and 100% infill for rings. No supports. Measure actual bearing
    width and test both bearing fits in the coupon. Do not hammer bearings into PLA.
    Correct parameters and reprint if fit is not a gentle hand slip fit.
  parts:
  - bearing_fit_coupon
  - inner_spacer
  - outer_collar_head
  - outer_collar_nut
  hardware:
  - bearings
  tool: Calipers
- n: '3'
  text: 'Test each collar against a bearing: its face must lie entirely on the inner
    ring and clear the shield. Slide the M8 screw through both bearings and rings
    by hand. Reject interference, rubbing, or a collar that bridges onto the shield.'
  parts:
  - inner_spacer
  - outer_collar_head
  - outer_collar_nut
  hardware:
  - bearings
  - axle
  tool: null
- n: '4'
  text: Print both wheel halves mating-face down, using 6 walls, 6 top/bottom layers
    and 60% or greater infill. No supports. Remove only loose strings and first-layer
    burrs; preserve flat mating faces and bearing shoulders. Check for cracks or layer
    defects.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware: []
  tool: null
- n: '5'
  text: Put inner_spacer inside the central opening between the halves. Mate their
    flat bed faces and align screw holes. Hold three M3 nuts in the outward-facing
    hex pockets and insert three M3x12 screws from the other side. Tighten evenly
    only until the halves close flat. The nuts and screw heads must remain below the
    outer wheel faces; do not crush PLA.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  hardware:
  - joining_screws
  - joining_nuts
  tool: 2.5 mm hex key
- n: '6'
  text: Insert one bearing from each outside face, seating its outer ring on its pocket
    shoulder. Center the inner spacer using the axle temporarily. At nominal sizes
    both bearing outer faces are flush with the wheel faces. If either bearing sits
    proud, the halves separate, or the inner spacer has an axial gap, stop and correct
    dimensions.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  hardware:
  - bearings
  - axle
  tool: null
- n: '7'
  text: 'Assemble the bench axle in this order: M8x40 head, steel M8 washer, outer_collar_head,
    first bearing, inner_spacer, second bearing, outer_collar_nut, steel M8 washer,
    M8 locknut. Keep the steel washers off the bearing shields. Tighten gently until
    axial looseness disappears, then check free rotation. Do not force a binding assembly
    or apply structural bolt torque to the printed rings.'
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  - outer_collar_head
  - outer_collar_nut
  hardware:
  - axle
  - axle_washers
  - axle_nut
  - bearings
  tool: 6 mm hex key and 13 mm wrench
- n: '8'
  text: Hold the axle and spin the wheel by hand. Look for wobble, rubbing, loose
    bearings, opening seams or spacer compression. Stop if any occurs. Passing this
    test proves fit and rotation only, not safe door load capacity. Do not run the
    door on this prototype. Obtain the track profile, bracket dimensions, load requirements
    and a verified suitable material/design—or fit a commercial replacement roller—before
    returning the door to service.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware: []
  tool: null
