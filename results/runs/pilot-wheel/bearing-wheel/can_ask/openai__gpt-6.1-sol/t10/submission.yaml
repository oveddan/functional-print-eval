parts:
- id: wheel_head_half
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    h=p.wheel_w/2\n    floor=h-p.bearing_w\n\
    \    if floor <= 0: raise ValueError('Wheel too narrow for bearings')\n    w=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n\
    \    w=w.cut(cq.Workplane('XY').circle(p.web_hole_d/2).extrude(h))\n    w=w.cut(cq.Workplane('XY').workplane(offset=floor).circle((p.bearing_od+p.bearing_diam_clearance)/2).extrude(p.bearing_w))\n\
    \    for i in range(int(p.fastener_count)):\n        a=2*math.pi*i/p.fastener_count\n\
    \        x,y=p.fastener_radius*math.cos(a),p.fastener_radius*math.sin(a)\n   \
    \     w=w.cut(cq.Workplane('XY').center(x,y).circle(p.screw_clearance_d/2).extrude(h))\n\
    \        w=w.cut(cq.Workplane('XY').workplane(offset=h-p.recess_depth).center(x,y).circle(p.head_recess_d/2).extrude(p.recess_depth))\n\
    \    return w"
  print_orientation: Flat mating face on bed at z=0; bearing pocket and head counterbores
    face upward. No supports.
  use_orientation: Mating face against wheel_nut_half. Bearing pocket faces outward.
    Axle lies on local Z.
- id: wheel_nut_half
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    h=p.wheel_w/2\n    floor=h-p.bearing_w\n\
    \    if floor <= 0: raise ValueError('Wheel too narrow for bearings')\n    w=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n\
    \    w=w.cut(cq.Workplane('XY').circle(p.web_hole_d/2).extrude(h))\n    w=w.cut(cq.Workplane('XY').workplane(offset=floor).circle((p.bearing_od+p.bearing_diam_clearance)/2).extrude(p.bearing_w))\n\
    \    for i in range(int(p.fastener_count)):\n        a=2*math.pi*i/p.fastener_count\n\
    \        x,y=p.fastener_radius*math.cos(a),p.fastener_radius*math.sin(a)\n   \
    \     w=w.cut(cq.Workplane('XY').center(x,y).circle(p.screw_clearance_d/2).extrude(h))\n\
    \        w=w.cut(cq.Workplane('XY').workplane(offset=h-p.recess_depth).center(x,y).polygon(6,2*p.nut_pocket_af/math.sqrt(3)).extrude(p.recess_depth))\n\
    \    return w"
  print_orientation: Flat mating face on bed at z=0; bearing pocket and hex nut pockets
    face upward. No supports.
  use_orientation: Flip over to mate z=0 faces with wheel_head_half; align the three
    screw holes. Bearing pocket faces outward.
- id: inner_spacer
  role: final
  material: PLA
  code: "def build(p):\n    t=p.wheel_w-2*p.bearing_w\n    if t <= 0: raise ValueError('No\
    \ space for inner spacer')\n    return cq.Workplane('XY').circle(p.collar_od/2).circle(p.collar_bore/2).extrude(t)"
  print_orientation: Annular face on bed, z=0. No supports.
  use_orientation: Inside the wheel, between the two bearing inner rings; coaxial
    with axle.
- id: outer_collar_head
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.collar_od/2).circle(p.collar_bore/2).extrude(p.outer_collar_t)"
  print_orientation: Annular face on bed, z=0. No supports.
  use_orientation: Between head-side bearing inner ring and M8 washer.
- id: outer_collar_nut
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.collar_od/2).circle(p.collar_bore/2).extrude(p.outer_collar_t)"
  print_orientation: Annular face on bed, z=0. No supports.
  use_orientation: Between nut-side bearing inner ring and M8 washer.
- id: bearing_fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    h=p.wheel_w/2\n    floor=h-p.bearing_w\n    w=cq.Workplane('XY').circle(p.coupon_od/2).extrude(h)\n\
    \    w=w.cut(cq.Workplane('XY').circle(p.web_hole_d/2).extrude(h))\n    return\
    \ w.cut(cq.Workplane('XY').workplane(offset=floor).circle((p.bearing_od+p.bearing_diam_clearance)/2).extrude(p.bearing_w))"
  print_orientation: Closed shoulder on bed at z=0; bearing pocket faces upward. No
    supports.
  use_orientation: Test piece only; not installed.
