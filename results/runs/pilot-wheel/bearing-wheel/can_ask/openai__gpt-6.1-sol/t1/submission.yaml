    method: coupon
    ref: bearing_fit_coupon
    description: Finger-pressure fit, no wobble; lip touches outer ring only, never
      shield. Adjust clearance/lip opening and reprint as needed.
- id: inner_stack
  part: inner_ring_spacer
  feature: Inner-ring spacer
  relation: supports
  hardware: bearings
  clearance_mm: null
  params:
  - wheel_w
  - bearing_w
  - lip_t
  - axle_spacer_od
  check:
    method: measure
    ref: null
    description: Thickness must equal wheel_w minus twice lip_t minus sum of actual
      bearing widths. Nominal 0.8 mm. Axle tightening must not bind bearings.
- id: shield_clearance
  part: outer_spacer_left
  feature: Inner-ring-only contact
  relation: clears
  hardware: bearings
  clearance_mm: null
  params:
  - axle_spacer_od
  - outer_spacer_t
  check:
    method: measure
    ref: null
    description: All three spacers contact inner rings only. Exterior washers clear
