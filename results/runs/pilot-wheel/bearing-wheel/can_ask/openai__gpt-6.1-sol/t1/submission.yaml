manual:
- n: '1'
  text: Fit prototype only. Secure door independently before removing roller. Do not
    suspend a door on this PLA wheel or rely on it for retention. Use a rated replacement
    for load-bearing service. Grooved or rounded original tread is not reproduced.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: 'Print bearing_fit_coupon in PLA at 0.2 mm layers. Test both bearings: finger-pressure
    fit without wobble; lip touches outer ring only. Adjust bearing_fit_allowance
    or lip_open_d and reprint if necessary. Never hammer bearings into PLA.'
  parts:
  - bearing_fit_coupon
  hardware:
  - bearings
  tool: null
- n: '3'
  text: Print final parts with 5 walls, 100% infill, 0.2 mm layers, no supports. Remove
    elephant-foot burrs without thinning seats. Verify actual bearing widths and printed
    dimensions. If bearing widths differ, set bearing_w to their average and regenerate
    center spacer; nominal thickness is 0.8 mm.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_ring_spacer
  - outer_spacer_left
  - outer_spacer_right
  hardware: []
  tool: null
- n: '4'
  text: Seat a bearing in each half from the open mating side, against exterior lip.
    Inner rings must turn freely without PLA or shield contact. Center inner_ring_spacer
    between inner rings and bring mating faces together; do not trap spacer under
    outer ring.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_ring_spacer
  hardware:
  - bearings
  tool: null
- n: '5'
  text: Insert M3 nuts into hex pockets and M3x12 screws through opposite recesses.
    Tighten evenly and gently until halves meet. Do not crush PLA. Verify full nut
    engagement and no protruding screw tips.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - join_screws
  - join_nuts
  tool: 2.5 mm hex key
- n: '6'
  text: 'Bench stack: M8x35 bolt head, M8 washer, outer_spacer_left, first bearing,
    inner_ring_spacer, second bearing, outer_spacer_right, M8 washer, M8 lock nut.
    Axle must pass through by hand. Snug nut only enough to remove play without compressing
    spacers. Wheel must rotate smoothly while inner rings and bolt stay still. Binding
    means stop and correct spacer dimensions; do not leave nut loose as a workaround.'
  parts:
  - wheel_head_half
  - wheel_nut_half
  - outer_spacer_left
  - inner_ring_spacer
  - outer_spacer_right
  hardware:
  - axle
  - axle_washers
  - axle_nut
  - bearings
  tool: 6 mm hex key and 13 mm wrench
- n: '7'
  text: 'Offer to unloaded track/bracket only. Confirm profile, clearance, retention
    and bolt-end clearance. Existing bolt length is unknown: reuse only after verifying
    mounting and full lock-nut engagement. Bench M8x35 does not establish bracket
    compatibility. No bracket modification is specified.'
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - axle
  - axle_nut
  tool: null
- n: '8'
  text: Hand spinning does not establish load capacity. PLA creep, wear and door loads
    remain unqualified. Keep away from heat and inspect after each prototype test
    for cracks or loose hardware. Obtain a rated roller for supporting the door.
  parts: []
  hardware: []
  tool: null
