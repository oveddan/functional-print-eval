parts:
- id: wheel_head_half
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    h=p.wheel_w/2\n    s=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n\
    \    s=s.cut(cq.Workplane('XY').circle(p.lip_open_d/2).extrude(h))\n    s=s.cut(cq.Workplane('XY').workplane(offset=p.lip_t).circle((p.bearing_od+p.bearing_fit_allowance)/2).extrude(h))\n\
    \    for a in (0,120,240):\n        x=p.join_radius*math.cos(math.radians(a));\
    \ y=p.join_radius*math.sin(math.radians(a))\n        s=s.cut(cq.Workplane('XY').center(x,y).circle(p.join_hole_d/2).extrude(h))\n\
    \        s=s.cut(cq.Workplane('XY').center(x,y).circle(p.join_head_pocket_d/2).extrude(p.join_head_seat_depth))\n\
    \    return s"
  print_orientation: Exterior face down at z=0, mating face up. No supports.
  use_orientation: 'Assembly reference: exterior z=0, mating z=8; axle along +Z.'
- id: wheel_nut_half
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    h=p.wheel_w/2\n    s=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n\
    \    s=s.cut(cq.Workplane('XY').circle(p.lip_open_d/2).extrude(h))\n    s=s.cut(cq.Workplane('XY').workplane(offset=p.lip_t).circle((p.bearing_od+p.bearing_fit_allowance)/2).extrude(h))\n\
    \    d=(p.join_nut_af+p.join_nut_af_allowance)/math.cos(math.pi/6)\n    for a\
    \ in (0,120,240):\n        x=p.join_radius*math.cos(math.radians(a)); y=p.join_radius*math.sin(math.radians(a))\n\
    \        s=s.cut(cq.Workplane('XY').center(x,y).circle(p.join_hole_d/2).extrude(h))\n\
    \        s=s.cut(cq.Workplane('XY').center(x,y).polygon(6,d).extrude(p.join_nut_pocket_depth))\n\
    \    return s"
  print_orientation: Exterior face and nut openings down at z=0. No supports; pocket
    roof bridges under 7 mm.
  use_orientation: Rotate 180 degrees about X then translate Z by wheel_w. Exterior
    assembly z=16, mating z=8.
- id: inner_ring_spacer
  role: final
  material: PLA
  code: "def build(p):\n    t=p.wheel_w-2*(p.lip_t+p.bearing_w)\n    if t<=0: raise\
    \ ValueError('Insufficient wheel width')\n    return cq.Workplane('XY').circle(p.axle_spacer_od/2).circle(p.axle_spacer_id/2).extrude(t)"
  print_orientation: Flat annular face at z=0; nominal thickness 0.8 mm.
  use_orientation: Between inner rings; assembly z=7.6 to 8.4 nominal.
- id: outer_spacer_left
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.axle_spacer_od/2).circle(p.axle_spacer_id/2).extrude(p.outer_spacer_t)"
  print_orientation: Flat annular face at z=0.
  use_orientation: Head-side inner ring to washer; assembly z=-1.4 to 0.6 nominal.
- id: outer_spacer_right
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.axle_spacer_od/2).circle(p.axle_spacer_id/2).extrude(p.outer_spacer_t)"
  print_orientation: Flat annular face at z=0.
  use_orientation: Nut-side inner ring to washer; assembly z=15.4 to 17.4 nominal.
- id: bearing_fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    h=p.lip_t+p.bearing_w+p.coupon_extra_depth\n    s=cq.Workplane('XY').circle(p.coupon_od/2).extrude(h)\n\
    \    s=s.cut(cq.Workplane('XY').circle(p.lip_open_d/2).extrude(h))\n    return\
    \ s.cut(cq.Workplane('XY').workplane(offset=p.lip_t).circle((p.bearing_od+p.bearing_fit_allowance)/2).extrude(h))"
  print_orientation: Lip down at z=0, pocket up. No supports.
  use_orientation: Bench fit test only.
