task: bearing-wheel
note: 50 x 16 mm flat-tread FIT PROTOTYPE only, not a load-rated replacement. Do not
  suspend a door on it or use as the sole restraint. Door load, tread profile, bracket
  clearance and existing bolt length remain unknown. M8x35 is a bench axle selection,
  not a confirmed bracket fit. CAD has not been executed or print-tested.
