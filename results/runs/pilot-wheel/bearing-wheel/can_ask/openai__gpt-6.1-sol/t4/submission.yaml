criteria:
- id: bearing_fit
  part: wheel_head_half
  feature: Both bearing pockets; repeat for nut half
  relation: seats
  hardware: bearings
  clearance_mm: 0.15
  params:
  - bearing_od
  - bearing_w
  - bearing_fit_allowance
  - bearing_recess
  check:
    method: coupon
    ref: bearing_fit_coupon
    description: Check both actual bearings. Require snug hand insertion without hammering,
      cracks, rocking or binding. Adjust allowance and regenerate both halves if necessary.
- id: inner_race_contact
  part: inner_spacer
  feature: Annular bearing-contact ends; same OD applies to external spacers
  relation: seats
  hardware: bearings
  clearance_mm: null
  params:
  - inner_spacer_od
  - spacer_bore_d
  - wheel_w
  - bearing_w
  - bearing_recess
  check:
    method: measure
    ref: null
    description: Confirm ends contact metal inner race only, never shields or outer
      races. Spacer length must equal actual gap between seated inner races; adjust
      to actual measurements and reprint if not.
- id: axle_clearance
  part: inner_spacer
  feature: Axle bore
  relation: clears
  hardware: axle
  clearance_mm: 0.5
  params:
  - spacer_bore_d
  - axle_shank_d
  check:
    method: measure
    ref: null
    description: All spacers slide freely along axle; both bearings also fit the axle
      without force.
- id: track_match
  part: wheel_head_half
  feature: Assembled flat tread and complete 16 mm wheel envelope
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - wheel_d
  - wheel_w
  - old_wheel_d
  - old_wheel_w
  - bracket_gap
  check:
    method: template
    ref: null
    description: With door separately supported, compare against original and track.
      Reject if track needs groove/crown, rim rubs bracket, screw heads protrude,
      or wheel can climb out of track. No operating-load approval follows from fit
      alone.
- id: rotation
  part: outer_spacer_head
  feature: Both outer spacer offsets
  relation: clears
  hardware: axle_washers
  clearance_mm: null
  params:
  - external_spacer_l
  - bearing_recess
  - axle_washer_od
  check:
    method: measure
    ref: null
    description: Washer and bracket must clear wheel and bearing shields at all angles.
      Snug axle must not reduce free rotation or leave perceptible side play. Binding
      indicates spacer/contact error, not a need for a looser retaining nut.
manual:
- n: '1'
  text: Keep the door independently supported or remove it safely. Inspect track and
    mounting bracket. This design assumes a flat cylindrical tread. If the original
    is grooved/rounded, the bracket is damaged, or failure could let a heavy door
    fall, do not use this prototype as a repair.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print bearing_fit_coupon at 0.2 mm layers. Test both bearings in the three
    sizes. Choose snug hand fit; update bearing_fit_allowance if needed. Do not hammer
    bearings into PLA. The split coupon is an initial check, not a guarantee of full-ring
    fit.
  parts:
  - bearing_fit_coupon
  hardware:
  - bearings
  tool: null
- n: '3'
  text: Print both wheel halves split-face down with 6 walls, 100% infill, at least
    5 top/bottom layers. Print all three spacers solid. No supports. Deburr bed-edge
    elephant foot without changing spacer end-face lengths. Check flatness and reject
    cracks or poor layer bonding.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  - outer_spacer_head
  - outer_spacer_nut
  hardware: []
  tool: null
- n: '4'
  text: Insert one bearing from each half's outside, pressing on its outer race only.
    Measure actual inner-race contact land and seated gap. Spacer OD must touch only
    inner-race metal. The nominal internal gap is 1.6 mm; correct and reprint the
    internal spacer if actual gap differs. Do not clamp against a short spacer or
    shields.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  hardware:
  - bearings
  tool: Calipers
- n: '5'
  text: Place the internal spacer between bearings. Mate the split faces, rotate the
    flipped nut half to align holes, and insert three M3 nuts into its outer hex pockets.
    Insert M3x12 screws from the other side. Tighten evenly by hand until the split
    closes, without crushing PLA. Heads should be flush and screw tips recessed. No
    glue required.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  hardware:
  - half_screws
  - half_nuts
  tool: 2.5 mm hex key
- n: '6'
  text: Bench assemble axle through washer, outer spacer, first bearing, internal
    spacer, second bearing, other outer spacer, washer and M8 locknut. The nominal
    stack including locknut is 30.8 mm, leaving about 9.2 mm on a 40 mm bolt before
    adding bracket thickness. Require at least two full threads beyond the locknut,
    so total added bracket thickness must be at most about 6.7 mm. Check head clearance
    and that the nut reaches threads rather than bottoming on the unthreaded shank.
    Do not substitute the unknown-length original bolt without these checks.
  parts:
  - inner_spacer
  - outer_spacer_head
  - outer_spacer_nut
  hardware:
  - axle
  - axle_washers
  - axle_nut
  - bearings
  tool: 6 mm hex key and 13 mm wrench
- n: '7'
  text: Snug the axle only enough to seat the spacer/inner-race stack and eliminate
    axial looseness; do not apply normal steel-joint M8 torque to PLA spacers. Wheel
    must still spin smoothly. If tightening binds it, stop and correct the spacer
    length/contact. Do not solve binding by leaving the axle loose. Printed spacers
    can creep and are not suitable for high bolt preload.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  - outer_spacer_head
  - outer_spacer_nut
  hardware:
  - axle
  - axle_nut
  tool: null
- n: '8'
  text: 'With door still independently supported, trial-fit in the original bracket
    using the same inner-race spacer isolation. Washers stay outside the rotating
    envelope; bracket layout must not bypass an outer spacer or contact a shield.
    Verify free travel, lateral retention, thread engagement and clearance along the
    entire track. The actual mounting arrangement is unverified: if it cannot preserve
    this load path, stop rather than improvising.'
  parts: []
  hardware: []
  tool: null
- n: '9'
  text: No safe door-weight rating has been established. Use the assembly for supported
    fit testing only until its profile, mounting and load capacity are independently
    validated; otherwise obtain the correct replacement roller. Inspect for cracks,
    tread deformation, spacer creep, rubbing and loose fasteners after every trial.
    Do not leave a door relying on an unvalidated PLA roller.
  parts: []
  hardware: []
  tool: null
