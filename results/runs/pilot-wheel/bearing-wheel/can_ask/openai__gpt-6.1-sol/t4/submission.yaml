parts:
- id: wheel_head_half
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    h = p.wheel_w/2\n    floor = h-p.bearing_recess-p.bearing_w\n\
    \    r = cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n    r = r.cut(cq.Workplane('XY').circle(p.web_bore_d/2).extrude(h))\n\
    \    r = r.cut(cq.Workplane('XY').workplane(offset=floor).circle((p.bearing_od+p.bearing_fit_allowance)/2).extrude(h-floor))\n\
    \    for i in range(int(p.screw_count)):\n        a = 2*math.pi*i/p.screw_count\n\
    \        x,y = p.screw_circle_r*math.cos(a),p.screw_circle_r*math.sin(a)\n   \
    \     r = r.cut(cq.Workplane('XY').center(x,y).circle(p.m3_clearance_d/2).extrude(h))\n\
    \        r = r.cut(cq.Workplane('XY').workplane(offset=h-p.head_pocket_depth).center(x,y).circle(p.head_pocket_d/2).extrude(p.head_pocket_depth))\n\
    \    return r"
  print_orientation: Flat split face at z=0; bearing and screw-head pockets open upward.
    No supports.
  use_orientation: Split face meets nut half at z=0. Outer face is z=8; bearing enters
    from that outer face.
- id: wheel_nut_half
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    h = p.wheel_w/2\n    floor = h-p.bearing_recess-p.bearing_w\n\
    \    r = cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n    r = r.cut(cq.Workplane('XY').circle(p.web_bore_d/2).extrude(h))\n\
    \    r = r.cut(cq.Workplane('XY').workplane(offset=floor).circle((p.bearing_od+p.bearing_fit_allowance)/2).extrude(h-floor))\n\
    \    for i in range(int(p.screw_count)):\n        a = 2*math.pi*i/p.screw_count\n\
    \        x,y = p.screw_circle_r*math.cos(a),p.screw_circle_r*math.sin(a)\n   \
    \     r = r.cut(cq.Workplane('XY').center(x,y).circle(p.m3_clearance_d/2).extrude(h))\n\
    \        r = r.cut(cq.Workplane('XY').workplane(offset=h-p.nut_pocket_depth).center(x,y).polygon(6,2*p.nut_pocket_af/math.sqrt(3)).extrude(p.nut_pocket_depth))\n\
    \    return r"
  print_orientation: Flat split face at z=0; bearing and nut pockets open upward.
    No supports.
  use_orientation: Rotate 180 degrees about X, then match the three screw holes to
    the head half. Its outer face is at assembly z=-8.
- id: inner_spacer
  role: final
  material: PLA
  code: "def build(p):\n    length = p.wheel_w-2*(p.bearing_recess+p.bearing_w)\n\
    \    return cq.Workplane('XY').circle(p.inner_spacer_od/2).circle(p.spacer_bore_d/2).extrude(length)"
  print_orientation: Annular end face on bed; axis vertical. Print solid.
  use_orientation: Between the two inner races, concentric with axle. Nominal length
    1.6 mm; cannot be omitted.
- id: outer_spacer_head
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.inner_spacer_od/2).circle(p.spacer_bore_d/2).extrude(p.external_spacer_l)"
  print_orientation: Annular end face on bed; axis vertical. Print solid.
  use_orientation: Between head-side bearing inner race and its washer or mounting
    face; isolates large washer from shield and wheel.
- id: outer_spacer_nut
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.inner_spacer_od/2).circle(p.spacer_bore_d/2).extrude(p.external_spacer_l)"
  print_orientation: Annular end face on bed; axis vertical. Print solid.
  use_orientation: Between nut-side bearing inner race and its washer or mounting
    face.
- id: bearing_fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    result = cq.Workplane('XY')\n    depth = p.bearing_w+p.bearing_recess\n\
    \    for i in range(3):\n        d = p.bearing_od+p.bearing_fit_allowance+(i-1)*p.coupon_fit_step\n\
    \        od = d+2*p.coupon_wall\n        x = i*(od+2*p.coupon_wall)\n        ring\
    \ = cq.Workplane('XY').center(x,0).circle(od/2).extrude(depth+p.coupon_floor)\n\
    \        ring = ring.cut(cq.Workplane('XY').workplane(offset=p.coupon_floor).center(x,0).circle(d/2).extrude(depth))\n\
    \        ring = ring.cut(cq.Workplane('XY').center(x,0).circle(p.web_bore_d/2).extrude(depth+p.coupon_floor))\n\
    \        ring = ring.cut(cq.Workplane('XY').center(x,0).box(od+2*p.coupon_wall,p.coupon_split_w,depth+p.coupon_floor,centered=(True,True,False)))\n\
    \        result = result.union(ring)\n    return result"
  print_orientation: All six semicircular shells on bed, bearing pockets upward; arrange
    separated shells together in slicer without changing scale.
  use_orientation: Not installed. Left to right uses +0.05, +0.15, +0.25 mm diametral
    allowance; split shells permit bearing removal. Final unsplit bore may fit slightly
    tighter.
