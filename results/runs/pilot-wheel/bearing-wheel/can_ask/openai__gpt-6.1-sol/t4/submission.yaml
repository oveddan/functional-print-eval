task: bearing-wheel
note: 'Provisional flat-tread 50 x 16 mm wheel with two 608 bearings. Not a certified
  load-bearing door repair: keep the door independently supported during testing,
  and do not return a heavy or derailment-prone door to service on this untested PLA
  prototype. A grooved or crowned original requires a different tread. Both wheel
  halves print split-face down; flip the nut half across the split plane during assembly.
  Use only indoors away from heat. No numerical load rating is claimed.'
questions:
- text: Exact original tread shape, diameter, width, track shape and whether this
    roller supports door weight?
  answer: Could not measure; approximately 50 mm diameter and 16 mm wide supplied
    initially. Other details unknown.
- text: Bearing outside diameter, width and axle shank diameter?
  answer: About 22 mm, about 7 mm and about 8 mm respectively.
- text: Mounting bracket gap, bracket thickness, original bolt length and support
    arrangement?
  answer: Unknown; must be checked before installation.
