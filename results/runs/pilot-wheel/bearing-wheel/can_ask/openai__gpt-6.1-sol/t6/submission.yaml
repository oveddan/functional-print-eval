  qty: 2
- id: wheel_screws
  ref: ISO 4762 M3x12
  qty: 3
- id: wheel_nuts
  ref: ISO 4032 M3
  qty: 3
- id: axle
  ref: ISO 4762 M8x30
  qty: 1
- id: axle_nut
  ref: ISO 10511 M8
  qty: 1
- id: axle_washers
  ref: ISO 7089 M8
  qty: 2
joints:
- id: wheel_closure
  fastener: wheel_screws
  axis_origin:
  - 17.5
  - 0.0
  - 3.2
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel_head_half
    feature: Three cylindrical recess floors, repeated at 120 degrees; screw underside
      seats at assembly z=3.2.
    role: head_seat
  - part: wheel_head_half
    feature: Three 3.4 mm through holes.
    role: clearance
  - part: wheel_nut_half
    feature: Aligned through holes.
    role: clearance
  - part: wheel_nut_half
    feature: Three outward-opening hex pockets; assembly floors at z=12.8.
    role: nut_pocket
  nut: wheel_nuts
  external: null
- id: conditional_axle
  fastener: axle
  axis_origin:
  - 0.0
  - 0.0
  - -3.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: head_side_spacer
    feature: 8.5 mm axial bore.
    role: clearance
  - part: inner_spacer
    feature: 8.5 mm axial bore.
    role: clearance
  - part: nut_side_spacer
    feature: 8.5 mm axial bore.
    role: clearance
  nut: axle_nut
  external: Actual bracket is unmeasured. Axis origin assumes a bench stack with no
    bracket; installation requires a verified stack and accessibility.
criteria:
- id: bearing_slip_fit
  part: wheel_head_half
  feature: 22.2 mm bearing pocket
  relation: contains
  hardware: bearings
  clearance_mm: 0.2
  params:
  - bearing_od
  - bearing_fit_allowance
  check:
    method: coupon
    ref: bearing_fit_coupon
    description: Both bearings must enter by hand without forcing and without appreciable
      rocking. Adjust diametral allowance and reprint coupon if needed.
- id: inner_race_contact
  part: inner_spacer
  feature: Spacer end faces
  relation: seats
  hardware: bearings
  clearance_mm: null
  params:
  - spacer_od
  - axle_clearance_d
  - centre_gap
  check:
    method: measure
    ref: null
    description: Confirm ring faces contact metal inner races only, not bearing shields
      or outer races. Reject if not verifiable. Spacer must sit flat and remain intact.
- id: rotating_clearance
  part: head_side_spacer
  feature: Projection beyond wheel face
  relation: clears
  hardware: axle_washers
  clearance_mm: null
  params:
  - wheel_w
  - bearing_w
  - centre_gap
  - outer_spacer_w
  - face_opening_d
  check:
    method: measure
    ref: null
    description: Nominal spacer projection is 1.4 mm. Washers and bracket must not
      contact the wheel or bearing shields throughout rotation. Verify both sides.
- id: track_fit
  part: wheel_head_half
  feature: Flat cylindrical tread and wheel envelope
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - wheel_d
  - wheel_w
  check:
    method: template
    ref: null
    description: With door independently supported, compare assembled wheel to original
      and track without loading it. Flat tread is an unverified assumption. Reject
      for a groove, crown, flange requirement, interference or loss of retention.
- id: axle_length_check
  part: nut_side_spacer
  feature: Complete stationary axle stack
  relation: engages
  hardware: axle
  clearance_mm: null
  params:
  - m8_length
  - bearing_w
  - centre_gap
  - outer_spacer_w
  - m8_washer_t
  - m8_nut_h
  - m8_pitch
  - bracket_stack
  check:
    method: measure
    ref: null
    description: 'Bench grip is 22 mm before nut: 14 mm bearings + 0.8 mm centre spacer
      + 4 mm outer spacers + 3.2 mm washers. M8x30 only reaches nominal end of an
      8 mm nut with NO bracket, so is NOT approved for bracket installation. Installed
      bolt must exceed full grip plus bracket thickness plus 8 mm nut plus at least
      one 1.25 mm thread. Use only a verified suitable listed length; otherwise stop.'
manual:
- n: '1'
  text: Secure the door independently so it cannot fall, tip or leave its track. Do
    not remove a supporting roller without appropriate support. If this is top-hung,
    or you cannot establish how the door is supported and retained, stop at bench
    testing and obtain the correct rated replacement.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print bearing_fit_coupon at 0.2 mm layers and check both bearings. Use a hand
    slip fit, not a forced interference fit. Do not hammer bearings into PLA.
  parts:
  - bearing_fit_coupon
  hardware:
  - bearings
  tool: null
- n: '3'
  text: Print the six final parts in their specified orientations, 0.2 mm layers,
    at least six walls and 100% infill. No supports are needed; the small screw/nut
    recess roofs bridge under 7 mm. Remove burrs and inspect the thin exterior bearing-retention
    lips for missing layers or cracks.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  - head_side_spacer
  - nut_side_spacer
  hardware: []
  tool: null
- n: '4'
  text: Lay wheel_head_half exterior face down. Seat one bearing in its upward pocket.
    Place inner_spacer on the inner race. Verify it touches only that race. Place
    the second bearing on the spacer, then lower the flipped wheel_nut_half over it.
    Align the screw holes. Bearings seat against the outside lips; their outer races
    are separated by 0.8 mm at nominal dimensions.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  hardware:
  - bearings
  tool: null
- n: '5'
  text: Insert three M3 nuts into the exterior hex pockets and the three M3x12 screws
    from the opposite exterior face. Tighten evenly only until split faces meet and
    screws are snug. Nominal nut engagement is full 2.4 mm, with screw tips recessed.
    Stop if the split will not close, bearings bind, or PLA distorts. Recheck screw
    security frequently; no threadlocker is specified.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - wheel_screws
  - wheel_nuts
  tool: 2.5 mm hex key
- n: '6'
  text: 'Bench axle order: M8 bolt head, washer, head_side_spacer, first bearing inner
    race, inner_spacer, second bearing inner race, nut_side_spacer, washer, locknut.
    Ensure the bearing bores slide onto the axle without force. The M8x30 is only
    a nominal bench-stack bolt: it has no length allowance for a bracket or a protruding
    thread. Do not interpret this as approval to install it on the door.'
  parts:
  - head_side_spacer
  - inner_spacer
  - nut_side_spacer
  hardware:
  - axle
  - axle_washers
  - axle_nut
  - bearings
  tool: null
- n: '7'
  text: For any later mounting trial, first measure the bracket and axle stack. Require
    a verified M8 length giving full locknut engagement and at least one thread beyond
    the nut; use an appropriate listed ISO 4762 length only if it fits the actual
    mounting arrangement. The user's existing bolt is unidentified beyond approximate
    shank diameter. If a suitable axle cannot be verified, stop. Never tighten directly
    against the rotating wheel or outer bearing races.
  parts: []
  hardware:
  - axle
  - axle_nut
  - axle_washers
  tool: null
- n: '8'
  text: Tighten the bench axle gently while turning the wheel. Only the inner races
    and spacers should be clamped. Stop if rotation becomes rough, the wheel rubs
    the washers, or spacers crush. Do not solve binding by leaving the axle loose.
    Printed spacers can creep and do not establish a permanent structural joint.
  parts:
  - inner_spacer
  - head_side_spacer
  - nut_side_spacer
  hardware:
  - axle
  - axle_nut
  tool: null
- n: '9'
  text: With the door still independently supported, compare the wheel's flat tread,
    diameter, width, side clearance and retention with the track and original roller.
    Any mismatch means reject this design. Do not put the door's weight on the prototype
    based on this fit check. Unknown load and track geometry prevent a safe service
    rating; obtain a matching rated roller for normal use.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware: []
  tool: null
