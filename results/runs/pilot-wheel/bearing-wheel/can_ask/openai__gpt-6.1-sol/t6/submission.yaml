parts:
- id: bearing_fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    d=p.bearing_od+p.bearing_fit_allowance\n    return cq.Workplane('XY').circle(d/2+p.coupon_wall).circle(d/2).extrude(p.coupon_h)\n"
  print_orientation: Flat annular face on bed, z=0.
  use_orientation: Test bearing outside diameter only; not part of assembly.
- id: wheel_head_half
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    h=p.wheel_w/2\n    lip=(p.wheel_w-2*p.bearing_w-p.centre_gap)/2\n\
    \    if lip <= 0: raise ValueError('Insufficient wheel width for bearings and\
    \ spacer')\n    s=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n    s=s.cut(cq.Workplane('XY').circle(p.face_opening_d/2).extrude(h))\n\
    \    s=s.cut(cq.Workplane('XY').workplane(offset=lip).circle((p.bearing_od+p.bearing_fit_allowance)/2).extrude(h-lip))\n\
    \    for i in range(int(p.fastener_count)):\n        a=2*math.pi*i/p.fastener_count\n\
    \        x,y=p.fastener_radius*math.cos(a),p.fastener_radius*math.sin(a)\n   \
    \     s=s.cut(cq.Workplane('XY').center(x,y).circle((p.m3_d+p.m3_clearance)/2).extrude(h))\n\
    \        s=s.cut(cq.Workplane('XY').center(x,y).circle((p.m3_head_d+p.m3_head_clearance)/2).extrude(p.recess_depth))\n\
    \    return s\n"
  print_orientation: Exterior face z=0 on bed; large bearing pocket opens upward.
    Small underside head recess roofs bridge approximately 6 mm.
  use_orientation: 'Assembly coordinates unchanged: exterior z=0; split face z=8.'
- id: wheel_nut_half
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    h=p.wheel_w/2\n    lip=(p.wheel_w-2*p.bearing_w-p.centre_gap)/2\n\
    \    if lip <= 0: raise ValueError('Insufficient wheel width for bearings and\
    \ spacer')\n    s=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n    s=s.cut(cq.Workplane('XY').circle(p.face_opening_d/2).extrude(h))\n\
    \    s=s.cut(cq.Workplane('XY').workplane(offset=lip).circle((p.bearing_od+p.bearing_fit_allowance)/2).extrude(h-lip))\n\
    \    for i in range(int(p.fastener_count)):\n        a=2*math.pi*i/p.fastener_count\n\
    \        x,y=p.fastener_radius*math.cos(a),p.fastener_radius*math.sin(a)\n   \
    \     s=s.cut(cq.Workplane('XY').center(x,y).circle((p.m3_d+p.m3_clearance)/2).extrude(h))\n\
    \        s=s.cut(cq.Workplane('XY').center(x,y).polygon(6,2*(p.m3_nut_af+p.nut_clearance)/math.sqrt(3)).extrude(p.recess_depth))\n\
    \    return s\n"
  print_orientation: Exterior face z=0 on bed; bearing pocket upward. Nut recess roofs
    bridge less than 7 mm.
  use_orientation: 'Flip 180 degrees about X, then translate +16 mm in Z: split faces
    meet at assembly z=8. Align three screw holes.'
- id: inner_spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.axle_clearance_d/2).extrude(p.centre_gap)\n"
  print_orientation: Flat ring on bed, z=0; four layers at 0.2 mm.
  use_orientation: Between the two bearing inner races, assembly z=7.6 to 8.4 at nominal
    dimensions.
- id: head_side_spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.axle_clearance_d/2).extrude(p.outer_spacer_w)\n"
  print_orientation: Flat ring on bed.
  use_orientation: On axle against first bearing inner race; projects beyond wheel
    face.
- id: nut_side_spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.axle_clearance_d/2).extrude(p.outer_spacer_w)\n"
  print_orientation: Flat ring on bed.
  use_orientation: On axle against second bearing inner race; projects beyond wheel
    face.
