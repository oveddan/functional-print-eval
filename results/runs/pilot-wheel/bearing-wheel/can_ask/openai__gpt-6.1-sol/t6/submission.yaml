task: bearing-wheel
note: Conditional fit prototype, not a certified door repair. Flat-tread 50 × 16 mm
  split wheel for two nominal 608 bearings. Track profile, door support arrangement,
  load, bracket clearance and existing bolt length remain unknown. Do not install
  on a top-hung door or rely on it to retain a door. Do not put the door's weight
  on this prototype until compatibility and safe support have been established. PLA
  creep and wear make this unsuitable as an unqualified permanent replacement. A matching
  manufacturer-rated roller is preferred.
questions:
- text: Track profile, mounting arrangement and whether the door is top-hung?
  answer: User could not measure; unknown.
- text: Existing bolt length, bracket thickness and door weight?
  answer: Not supplied. Existing shank is about 8 mm; this does not establish usable
    bolt length.
