task: bearing-wheel
note: Conditional flat-tread prototype, not a load-rated closet-door replacement.
  The rail profile, door weight, mounting arrangement and original bolt length could
  not be established. Do not use this to support the door until those are checked;
  a grooved or profiled original requires a different wheel. Nominal wheel is 50 x
  16 mm with two 608 bearings. No CAD execution or physical testing was available.
  Keep the door independently supported during fitting. Use a known catalog bolt rather
  than assuming the unidentified bolt is suitable.
questions:
- text: Does this wheel carry the door weight, and what load must it carry?
  answer: null
- text: What tread profile and rail clearances are required?
  answer: null
- text: What are the bracket thickness, axle support arrangement, and original bolt
    length?
  answer: null
