task: bearing-wheel
note: 'Fit-test prototype only: two bolted PLA wheel halves capture two touching 608
  bearings. The bearings'' inner races rotate freely relative to the wheel and are
  clamped on the axle through small printed standoffs. Flat tread is provisional.
  Do not install on a top-hung door or put a door''s weight on this prototype: mounting
  geometry, track profile, door load, and adequate PLA strength have not been established.
  No load rating is claimed. The supplied bolt''s length is unknown; the specified
  catalog axle is an alternative, not an identification of that bolt.'
questions:
- text: Bearing outside diameter and width?
  answer: About 22 mm OD and 7 mm wide.
- text: Existing wheel size?
  answer: About 50 mm diameter and 16 mm wide.
- text: Axle diameter?
  answer: About 8 mm shank.
- text: Track profile, mounting arrangement, and whether the door hangs from the wheel?
  answer: Could not determine; flat tread is only a provisional design choice.
- text: Available bolt length and mounting bracket thickness?
  answer: null
