parts:
- id: wheel_head_half
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    t=p.half_t\n    depth=p.bearing_w+p.bearing_depth_clearance\n\
    \    a=cq.Workplane('XY').circle(p.wheel_d/2).extrude(t)\n    a=a.cut(cq.Workplane('XY').circle(p.lip_bore/2).extrude(t))\n\
    \    a=a.cut(cq.Workplane('XY').workplane(offset=t-depth).circle((p.bearing_od+p.bearing_diam_clearance)/2).extrude(depth))\n\
    \    for i in range(int(p.screw_count)):\n        theta=2*math.pi*i/p.screw_count\n\
    \        x=p.screw_circle_r*math.cos(theta); y=p.screw_circle_r*math.sin(theta)\n\
    \        a=a.cut(cq.Workplane('XY').center(x,y).circle(p.screw_clearance/2).extrude(t))\n\
    \        a=a.cut(cq.Workplane('XY').center(x,y).circle(p.head_pocket_d/2).extrude(p.head_pocket_depth))\n\
    \    return a"
  print_orientation: External face on bed at z=0; bearing cavity opens upward. Bottom
    head recesses have short printable roofs.
  use_orientation: External face outward; open bearing cavity faces the other half.
    Three screw heads are recessed in the external face.
- id: wheel_nut_half
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    t=p.half_t\n    depth=p.bearing_w+p.bearing_depth_clearance\n\
    \    a=cq.Workplane('XY').circle(p.wheel_d/2).extrude(t)\n    a=a.cut(cq.Workplane('XY').circle(p.lip_bore/2).extrude(t))\n\
    \    a=a.cut(cq.Workplane('XY').workplane(offset=t-depth).circle((p.bearing_od+p.bearing_diam_clearance)/2).extrude(depth))\n\
    \    for i in range(int(p.screw_count)):\n        theta=2*math.pi*i/p.screw_count\n\
    \        x=p.screw_circle_r*math.cos(theta); y=p.screw_circle_r*math.sin(theta)\n\
    \        a=a.cut(cq.Workplane('XY').center(x,y).circle(p.screw_clearance/2).extrude(t))\n\
    \        a=a.cut(cq.Workplane('XY').center(x,y).polygon(6,2*p.nut_pocket_af/math.sqrt(3)).extrude(p.nut_pocket_depth))\n\
    \    return a"
  print_orientation: External nut-pocket face on bed at z=0; bearing cavity upward.
    Hex pocket roofs span less than 7 mm.
  use_orientation: Flip so its cavity faces the head half's cavity; align the three
    holes. Assembled width is 2*half_t.
- id: standoff_left
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.standoff_od/2).circle(p.standoff_id/2).extrude(p.standoff_t)"
  print_orientation: Flat annular face on bed.
  use_orientation: Coaxial with axle, between left bearing inner race and external
    metal washer.
- id: standoff_right
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.standoff_od/2).circle(p.standoff_id/2).extrude(p.standoff_t)"
  print_orientation: Flat annular face on bed.
  use_orientation: Coaxial with axle, between right bearing inner race and external
    metal washer.
- id: bearing_fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.coupon_od/2).circle((p.bearing_od+p.bearing_diam_clearance)/2).extrude(p.coupon_t)"
  print_orientation: Flat annulus on bed; through bore vertical.
  use_orientation: Hand-test each bearing in the bore before printing wheel halves.
