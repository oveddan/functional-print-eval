  - half_t
  - standoff_t
  - bearing_w
  - axle_l
  check:
    method: template
    ref: null
    description: Unloaded fit check only, with door independently supported and restrained.
      Verify flat tread suits track and entire axle/head/nut envelope clears. Bearing/standoff
      span is 18.8 mm, washer-to-washer outside span is 22 mm, plus head, nut and
      protruding bolt. Do not force it into a 16 mm-wide mounting fork.
manual:
- n: '1'
  text: Keep the door independently supported and restrained. Do not remove a load-carrying
    roller while the door can fall. This is a dimensional/rotation prototype, not
    an approved PLA replacement for a door-support wheel.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print bearing_fit_coupon in PLA at 0.2 mm layers. Use the same hole compensation
    and settings intended for the wheel. Check both bearings; adjust bearing_diam_clearance
    and reprint if necessary.
  parts:
  - bearing_fit_coupon
  hardware:
  - bearings
  tool: null
- n: '3'
  text: 'Print both wheel halves and both standoffs with 6 walls, 100% infill, and
    0.2 mm layers. No supports: the small recessed fastener pocket roofs bridge less
    than 7 mm. Keep bearing cavities upward. Remove elephant-foot burrs, strings and
    any loose bridging strands without enlarging bearing seats unevenly.'
  parts:
  - wheel_head_half
  - wheel_nut_half
  - standoff_left
  - standoff_right
  hardware: []
  tool: null
- n: '4'
  text: Insert one bearing into each half by hand. Put the cavities face-to-face,
    bearings touching, and align holes. The printed split faces must close. Bearings
    are trapped between outer lips, with approximately 0.2 mm total axial float; they
    must not be squeezed by closing the halves.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - bearings
  tool: null
- n: '5'
  text: Push each M3 nut fully into its external hex pocket, flat against the pocket
    roof. Fit the three M3x12 screws through the opposite head recesses. Tighten evenly
    just enough to close the split; do not crush PLA. Heads and nuts must remain below
    the external wheel faces. Verify all three nuts have full thread engagement.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - half_screws
  - half_nuts
  tool: 2.5 mm hex key
- n: '6'
  text: 'Bench assembly only: use M8x40 bolt, washer, left standoff, bearing pair,
    right standoff, washer, locknut, in that order. The two bearings'' inner races
    touch directly; no central spacer is needed. Each standoff enters a 13 mm lip
    hole and contacts only an inner race. Check this visually before tightening. Do
    not substitute the existing bolt until its length, thread and engagement are verified.'
  parts:
  - standoff_left
  - standoff_right
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - axle
  - axle_washers
  - axle_nut
  - bearings
  tool: 6 mm hex key and 13 mm wrench
- n: '7'
  text: 'Snug the axle locknut only enough to remove axial looseness, not to normal
    steel-joint torque. PLA standoffs can creep under clamp load. Hold the bolt stationary
    and spin the wheel by hand: it must spin smoothly without rubbing, binding or
    visible wobble. Stop if washers touch the wheel, standoffs touch shields, the
    split opens or any part cracks. This check is not a load test.'
  parts:
  - wheel_head_half
  - wheel_nut_half
  - standoff_left
  - standoff_right
  hardware:
  - axle
  - axle_nut
  tool: null
- n: '8'
  text: Before considering any service replacement, establish door weight/load per
    roller, track profile, mount dimensions and retention method. Check the unloaded
    prototype against the mount only with the door safely supported. Reject it if
    the track needs a groove or space is insufficient. Do not hang or run the door
    on this prototype. Use an appropriately rated commercial replacement for a top-hung
    door; a service design needs validated material, spacers, strength and retention.
  parts: []
  hardware: []
  tool: null
