parts:
- id: seat_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    h = p.bearing_w + p.coupon_floor\n    a = cq.Workplane('XY').circle(p.coupon_od/2).extrude(h)\n\
    \    a = a.cut(cq.Workplane('XY').circle(p.web_bore/2).extrude(h))\n    seat =\
    \ cq.Workplane('XY').workplane(offset=p.coupon_floor).circle((p.bearing_od+p.bearing_seat_allowance)/2).extrude(p.bearing_w)\n\
    \    return a.cut(seat)\n"
  print_orientation: Flat annular bottom at z=0; bearing opening upward; no supports.
  use_orientation: Bench fit gauge only.
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    d = p.old_wheel_d\n    w = p.old_wheel_w\n    if w <=\
    \ 2*p.bearing_w:\n        raise ValueError('Wheel must be wider than two bearings')\n\
    \    a = cq.Workplane('XY').circle(d/2).extrude(w)\n    a = a.edges('%Circle').chamfer(p.edge_chamfer)\n\
    \    a = a.cut(cq.Workplane('XY').circle(p.web_bore/2).extrude(w))\n    r = (p.bearing_od+p.bearing_seat_allowance)/2\n\
    \    low = cq.Workplane('XY').circle(r).extrude(p.bearing_w)\n    high = cq.Workplane('XY').workplane(offset=w-p.bearing_w).circle(r).extrude(p.bearing_w)\n\
    \    return a.cut(low).cut(high)\n"
  print_orientation: One circular side on bed, axle vertical; z=0 to 16. No supports;
    the internal seat shoulder overhang spans only about 3.1 mm radially.
  use_orientation: Axle through center; plain cylindrical tread with small edge chamfers.
    Bench use only until actual track compatibility is established.
- id: inner_spacer
  role: final
  material: PLA
  code: "def build(p):\n    h = p.old_wheel_w-2*p.bearing_w\n    if h <= 0:\n    \
    \    raise ValueError('Positive inner spacer length required')\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.axle_d+p.axle_clearance)/2).extrude(h)\n"
  print_orientation: Annular face on bed, z=0; print solid.
  use_orientation: Between inner races, assembled z=7 to 9 in wheel frame; prototype
    only, not a substitute for a precision metal spacer.
- id: outer_spacer_a
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.axle_d+p.axle_clearance)/2).extrude(p.outer_spacer_w)\n"
  print_orientation: Annular face on bed, z=0; print solid.
  use_orientation: Head-side inner-race standoff, assembled z=-3 to 0 in wheel frame.
- id: outer_spacer_b
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.axle_d+p.axle_clearance)/2).extrude(p.outer_spacer_w)\n"
  print_orientation: Annular face on bed, z=0; print solid.
  use_orientation: Nut-side inner-race standoff, assembled z=16 to 19 in wheel frame.
hardware:
- id: bearings
  ref: 608ZZ
  qty: 2
- id: bench_axle
  ref: ISO 4762 M8x40
  qty: 1
- id: bench_nut
  ref: ISO 10511 M8
  qty: 1
- id: bench_washers
  ref: ISO 7089 M8
  qty: 2
joints:
- id: unloaded_bench_axle
  fastener: bench_axle
  axis_origin:
  - 0.0
  - 0.0
  - -4.6
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel
    feature: Central axis through bearing bores; 16 mm center relief does not bear
      on bolt.
    role: clearance
  - part: outer_spacer_a
    feature: 8.5 mm clearance bore; washer outside and bearing inner race inside.
    role: clearance
  - part: inner_spacer
    feature: 8.5 mm clearance bore between bearing inner races.
    role: clearance
  - part: outer_spacer_b
    feature: 8.5 mm clearance bore; bearing inner race inside and washer outside.
    role: clearance
  nut: bench_nut
  external: 'None: unloaded bench assembly only, not attached to door.'
criteria:
- id: bearing_fit
  part: wheel
  feature: Two 22.25 mm diameter × 7 mm deep bearing pockets.
  relation: seats
  hardware: bearings
  clearance_mm: 0.25
  params:
  - bearing_od
  - bearing_w
  - bearing_seat_allowance
  check:
    method: coupon
    ref: seat_coupon
    description: Both bearings must seat squarely with hand pressure, without hammering,
      cracking or noticeable rocking. Adjust allowance and reprint coupon if needed.
- id: inner_spacing
  part: inner_spacer
  feature: 2 mm axial gap between inner races.
  relation: supports
  hardware: bearings
  clearance_mm: null
  params:
  - old_wheel_w
  - bearing_w
  - spacer_od
  - bearing_inner_race_face_od
  check:
    method: measure
    ref: null
    description: Measure finished spacer and actual gap; ends must be parallel and
      contact only inner-race metal. Any mismatch, shield contact or binding fails
      the test.
- id: outer_contact
  part: outer_spacer_a
  feature: Small-diameter standoff keeps large washer off bearing shields.
  relation: seats
  hardware: bearings
  clearance_mm: null
  params:
  - spacer_od
  - outer_spacer_w
  - bearing_inner_race_face_od
  check:
    method: measure
    ref: null
    description: Check both outer spacers seat only on inner races and hold washers
      away from shields and wheel faces.
- id: track_fit_unresolved
  part: wheel
  feature: 50 mm diameter, 16 mm wide flat tread is an unverified assumption.
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - old_wheel_d
  - old_wheel_w
  check:
    method: template
    ref: null
    description: Compare prototype with old wheel and track while door is independently
      secured. Wrong tread, height, width, retention or clearance means reject; do
      not operate the door.
manual:
- n: '1'
  text: Do not remove supporting door hardware unless the door is independently secured.
    This design is an unloaded fit prototype, not permission to hang or support the
    door on PLA.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print seat_coupon at 0.2 mm layers with 5 walls. Remove elephant-foot burrs
    without enlarging the seat arbitrarily. Try both bearings individually; they must
    seat by hand without rocking. If fit fails, adjust bearing_seat_allowance and
    repeat.
  parts:
  - seat_coupon
  hardware:
  - bearings
  tool: null
- n: '3'
  text: 'Print wheel flat as modeled: 6 walls, 6 top/bottom layers, 100% infill, no
    supports. Print all three spacers solid. Check for cracks, rough seats and distorted
    spacer ends; reject defective prints.'
  parts:
  - wheel
  - inner_spacer
  - outer_spacer_a
  - outer_spacer_b
  hardware: []
  tool: null
- n: '4'
  text: Seat one bearing in the wheel. Place inner_spacer inside against its inner
    race, then seat the other bearing. Both bearing outside faces should be flush
    with the wheel faces. The spacer must fit between inner races without pushing
    either bearing out. If not, stop and correct the measured stack dimensions.
  parts:
  - wheel
  - inner_spacer
  hardware:
  - bearings
  tool: null
- n: '5'
  text: 'For an unloaded bench test only, stack on the selected M8x40 bolt: washer,
    outer_spacer_a, bearing/wheel assembly with inner_spacer, outer_spacer_b, washer,
    M8 lock nut. Verify both outer spacers contact only inner-race metal. In the wheel
    frame washers occupy z=-4.6 to -3 and z=19 to 20.6; nut starts at z=20.6. Do not
    substitute the existing bolt until its length and thread engagement are known.'
  parts:
  - wheel
  - inner_spacer
  - outer_spacer_a
  - outer_spacer_b
  hardware:
  - bench_axle
  - bench_washers
  - bench_nut
  - bearings
  tool: null
- n: '6'
  text: Hold the bolt and advance the lock nut only enough to remove loose axial play;
    do not apply normal M8 tightening torque to PLA spacers. The nylon locking section
    must fully engage the threads. Turn the wheel by hand. Stop if shields rub, bearings
    bind, the wheel rocks or spacers compress. Do not power-spin or apply door weight.
  parts:
  - wheel
  - inner_spacer
  - outer_spacer_a
  - outer_spacer_b
  hardware:
  - bench_axle
  - bench_nut
  tool: Matching hex key and wrench
- n: '7'
  text: Before any door installation, obtain the original tread/track profile, supported
    load, bracket thickness, axle clearance and bolt length. A correctly rated replacement
    wheel is preferable for a load-bearing door. A load-bearing redesign also needs
    an accurately sized metal inner-race spacer and verification of mounting and retention.
    Do not install this prototype as the finished repair.
  parts:
  - wheel
  hardware: []
  tool: null
