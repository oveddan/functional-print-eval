task: bearing-wheel
note: 50 × 16 mm flat-tread, two-608 bench-fit prototype only. NOT approved for installation
  on the closet door, especially a top-hung/load-bearing door. Track profile, supported
  load, bracket geometry and existing bolt length are unknown. PLA and printed spacers
  can creep. Fit success is not a load rating. The optional axle assembly below is
  for unloaded hand testing only; it does not include the door bracket.
questions:
- text: What tread shape and track profile does the original wheel use?
  answer: null
- text: Does this wheel carry the door's weight, and what load does it support?
  answer: null
- text: What are the bracket thickness, available axial clearance and existing bolt's
    under-head length?
  answer: null
params:
  old_wheel_d:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: User's approximate old diameter; not confirmed.
  old_wheel_w:
