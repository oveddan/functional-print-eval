- id: c6_nut_engage
  part: wheel
  feature: axle_hole
  relation: engages
  hardware: nut_m8
  clearance_mm: null
  params:
  - wheel_width
  - bolt_shank_d
  check:
    method: measure
    ref: null
    description: At least 6.8 mm of thread has to be left past the wheel (and past
      the bracket plates if the bolt goes through them) for the lock nut.
- id: c7_retention
  part: wheel
  feature: bearing_pocket
  relation: contains
  hardware: null
  clearance_mm: null
  params:
  - bearing_seat_interference
  - bearing_seat_depth
  check:
    method: measure
    ref: null
    description: A correct press fit is the only thing holding the bearings - and
      so the wheel - on the axle. This is the one to be pickiest about.
manual:
- n: '1'
  text: 'Slice both files. Print settings that matter: 0.2 mm layers, 5 or more wall
    lines, 30-40% gyroid infill, no supports, 3 solid top/bottom layers. Put wheel.stl
    lying flat on one face (axle axis vertical) and fit_coupon.stl flat too. Print
    one coupon plus the number of wheels you need - the X1C bed takes 4 wheels and
    the coupon in one go. Each wheel needs two 608 skateboard bearings (22 mm outside,
    7 mm thick, 8 mm bore).'
  parts:
  - wheel
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Check the bearing fit before printing more wheels. Press one 608 into each
    of the coupon''s three pockets (21.6, then 21.8, then 22.0) and push it back out
    with your thumb. Right answer: the bearing needs firm, straight hand pressure
    to enter and will not fall out when you tip the coupon upside down. If only the
    22.0 pocket lets it in by thumb, the wheel is too tight - raise bearing_seat_d
    by 0.1. If it falls out of the 21.8 pocket, lower it by 0.1. The same change is
    got in the slicer by scaling the wheel: +0.5% opens the pocket by about 0.1 mm.'
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '3'
  text: Lay the wheel flat with a pocket facing up, drop a 608 bearing in, and press
    on the bearing's OUTER ring only (never on the thin ring around the centre hole)
    until it hits the printed web in the middle. Repeat on the other face. Both bearing
    faces should finish flush with the wheel faces - run a fingernail across, no ridge.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '4'
  text: Slide the wheel onto the bare M8 bolt and spin it. It should turn smoothly
    and quietly on the bolt with no wobble and no rubbing on the bolt. Gritchy or
    notchy means a bearing is not home against the central web - push it square again.
  parts:
  - wheel
  hardware:
  - bolt_m8
  tool: null
- n: '5'
  text: 'Dry-fit at the door. Drop the wheel into the bracket and check the two plates
    do not press on the wheel''s faces: the old wheel was about 16 mm wide, this one
    is 15.5 mm, so it should slide in and still free-spin. If the gap is tighter than
    15.5 mm, scale the wheel to 99% and reprint. If your old design clamped the wheel
    faces directly under the bolt head and nut, stop and tell me - that needs a printed
    retaining collar, not a smaller wheel.'
  parts:
  - wheel
  hardware:
  - bolt_m8
  tool: null
- n: '6'
  text: 'Axle length: you need at least 28 mm of bolt under the head to clear the
    15.5 mm wheel plus two bracket plates plus the nut. Check yours with a ruler;
    if it is shorter, M8x30 (ISO 4762) is the length to buy.'
  parts:
  - wheel
  hardware:
  - bolt_m8
  - nut_m8
  tool: ruler
- n: '7'
  text: 'Assemble: bolt through one bracket plate, through the wheel, through the
    far plate, nut on the end. Tighten until the wheel stops rattling side to side
    but still spins freely - you are clamping the bracket, not the wheel. If the bolt
    turns with the nut, hold the head with a spanner, or screw the bolt into the bracket
    if one plate is tapped.'
  parts:
  - wheel
  hardware:
  - bolt_m8
  - nut_m8
  tool: spanner or socket for M8
- n: '8'
  text: 'Hang the door back on it. Its weight now sits on printed PLA, so check the
    door bottom still clears the track by a few mm (this wheel is the same 50 mm as
    the old one) and that the tread sits down in the channel rather than riding on
    an edge. Slide the door 10 times: the wheel should roll, not skid. Re-check the
    nut after a week.'
  parts:
  - wheel
  hardware: []
  tool: null
- n: '9'
  text: 'Only if the track has a raised centre rail the old wheel straddled: in the
    wheel''s build(p), set tread_groove_w = 6.0 and tread_groove_d = rail height +
    1.0. Leave both at 0 for a plain channel - flat is what is printed today.'
  parts:
  - wheel
  hardware: []
  tool: null
