    role: head_seat
  nut: nut_m8
  external: existing roller bracket plates (not part of this design)
criteria:
- id: c1_seat_fit
  part: wheel
  feature: bearing_pocket
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - bearing_od
  - bearing_seat_d
  - bearing_seat_interference
  - bearing_count
  check:
    method: coupon
    ref: fit_coupon
    description: The 22.0 outer ring presses into the 21.8 pocket with firm, straight
      hand pressure and stays put; the coupon shows which diameter that is before
      you print a wheel. Two 608 skateboard bearings per wheel.
- id: c2_bearing_axial
  part: wheel
  feature: central_web
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - bearing_width
  - wheel_width
  - central_web
  check:
    method: measure
    ref: null
    description: Both bearings seat fully against the 1.5 mm central web, so neither
      can drift inward and the two pockets are truly back to back.
- id: c3_axle_clears
  part: wheel
  feature: axle_hole
  relation: clears
