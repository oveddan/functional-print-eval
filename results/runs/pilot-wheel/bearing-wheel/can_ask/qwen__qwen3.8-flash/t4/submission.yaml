task: bearing-wheel
note: 'Yes - it works as a wheel rolling on a fixed axle. Two 608 skateboard bearings
  (22 OD x 7 wide x 8 bore, 2 per wheel - they are yours, not catalog hardware, so
  they carry through the parameters and steps rather than the hardware list) press
  outer-race-first into a single 50 mm dia x 15.5 mm wheel, back to back against a
  printed 1.5 mm central web; the M8 bolt goes through both 8 mm bores and stays still,
  so the wheel rolls on the bearings rather than on plastic. Your old wheel''s 16
  mm width is almost exactly what two 608s want (14 mm of bearing), so no compromise
  on bearing size was needed. Fits chosen: 21.8 mm pocket for a 22.00 mm bearing (0.2
  mm diametral interference) and a 9.0 mm bolt hole (1 mm over the 8 mm shank you
  measured, which also clears an M8 thread crest). Printed flat/coin-wise so the load-carrying
  perimeter loops run around the wheel and the bearing pockets are cut by wall lines
  rather than infill. The press fit is the only thing retaining the bearings, so step
  2 (the coupon) is the step not to skip - especially since an earlier caliper reading
  on these bearings came back low (21.2) from being pinched at an angle. Three things
  I had to assume, all flagged: bracket plate spacing (~16 mm, hence a 15.5 mm wheel),
  track profile (flat tread, centre groove switchable via two params), and whether
  a head or nut ever clamps the wheel faces - by design the 8.5 mm socket head cannot
  reach the wheel body at all, which is exactly what keeps the wheel free.'
questions:
- text: How many wheels per roller - one, or two side by side like a tandem closet-door
    roller? It changes nothing in the design, just how many you slice.
  answer: null
- text: 'Look into the floor track: is the running surface flat, or is there a raised
    ridge the wheel has to straddle? Flat is what I printed; if there is a ridge,
    tell me its width and height and I''ll put the centre groove in properly rather
    than you editing the script.'
  answer: null
- text: Is the wheel held between two plates of a bracket (bolt through both), or
    did the old bolt screw up into the bottom of the door with the wheel hanging off
    one side? If a head or nut had to clamp the wheel's faces directly, say so - that
    version needs a printed retaining collar.
  answer: null
- text: Can you check your bolt's length under the head with a ruler? I need 28 mm
    or more to get through 15.5 mm of wheel plus two plates plus the nut.
  answer: null
params:
  axle_clearance:
    value: 1
    unit: mm
    kind: design
    source: design
    note: 0.5 mm per side over the shank, enough to clear an M8 thread crest as well
  axle_hole_d:
    value: 9
    unit: mm
    kind: design
    source: design
    note: bolt_shank_d + axle_clearance
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 bore 8.00, which is why your M8 bolt is the right axle
  bearing_count:
    value: 2
    unit: count
    kind: hardware
    source: datasheet
    note: 608 bearings pressed into each wheel, one per pocket
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 outer ring 22.00 -0.008; you re-measured about 22 straight across the
      outer ring
  bearing_seat_d:
    value: 21.8
    unit: mm
    kind: design
    source: design
    note: bearing_od - bearing_seat_interference
  bearing_seat_depth:
    value: 7
    unit: mm
    kind: design
    source: design
    note: = bearing_width, so the bearings finish flush with the wheel faces
  bearing_seat_interference:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: diametral press fit on the bearing's outer ring; dialled in with the coupon
  bearing_width:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 section, you re-measured about 7; two side by side = 14 mm of the 15.5
      mm wheel
  bolt_shank_d:
    value: 8
    unit: mm
    kind: world
    source: measured
    note: you measured about 8 mm across the shank of your M8 bolt
  central_web:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: 'wheel_width - 2 x bearing_seat_depth: the printed axial stop both bearings
      seat against'
  coupon_l:
    value: 73
    unit: mm
    kind: design
    source: design
    note: three pockets at 23 mm spacing plus end margins
  coupon_seat_d_a:
    value: 22
    unit: mm
    kind: design
    source: design
    note: loose pocket - a bearing that drops in by thumb means the wheel needs a
      smaller seat
  coupon_seat_d_b:
    value: 21.8
    unit: mm
    kind: design
    source: design
    note: the diameter the wheel is modelled at
  coupon_seat_d_c:
    value: 21.6
    unit: mm
    kind: design
    source: design
    note: tight pocket - shows what too much interference feels like
  coupon_t:
    value: 7
    unit: mm
    kind: design
    source: design
    note: = bearing_seat_depth, so a test bearing sits flush and can be tipped out
  coupon_w:
    value: 24
    unit: mm
    kind: design
    source: design
    note: 2 mm of wall left between neighbouring pockets
  old_wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: 'your estimate of the broken wheel: about 50 mm across'
  old_wheel_width:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: 'your estimate: about 16 mm wide'
  seat_leadin:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: 45-degree funnel at each pocket mouth so a bearing starts square
  tread_groove_d:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: only used if tread_groove_w is switched on
  tread_groove_w:
    value: 0
    unit: mm
    kind: design
    source: design
    note: 0 = flat tread. Set to 6.0 if the wheel has to straddle a raised centre
      rail
  wheel_od:
    value: 50
    unit: mm
    kind: design
    source: design
    note: = old_wheel_od, so the door hangs at the height it did before
  wheel_width:
    value: 15.5
    unit: mm
    kind: design
    source: design
    note: old_wheel_width - 0.5, so it cannot pinch between plates spaced for a 16
      mm wheel
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    W = p.wheel_width\n    R = p.wheel_od / 2.0\n    sr =\
    \ p.bearing_seat_d / 2.0\n    ar = p.axle_hole_d / 2.0\n    sd = p.bearing_seat_depth\n\
    \    li = p.seat_leadin\n\n    w = cq.Workplane(\"XY\").circle(R).extrude(W)\n\
    \n    # Bearing pockets: one turned up from the bed face, one down from the far\n\
    \    # face. They meet in the middle, leaving a central web that is the axial\n\
    \    # stop for both bearings.\n    w = w.cut(cq.Workplane(\"XY\").workplane(offset=W\
    \ - sd).circle(sr).extrude(sd))\n    w = w.cut(cq.Workplane(\"XY\").circle(sr).extrude(sd))\n\
    \n    # 45-degree lead-in funnels at both pocket mouths so a bearing starts square.\n\
    \    if li > 0:\n        w = w.cut(cq.Workplane(\"XY\", origin=cq.Vector(0, 0,\
    \ 0)).cone(sr + li, sr, li))\n        w = w.cut(cq.Workplane(\"XY\", origin=cq.Vector(0,\
    \ 0, W - li)).cone(sr, sr + li, li))\n\n    # Axle clearance hole: the M8 bolt\
    \ passes through and stays still.\n    w = w.cut(cq.Workplane(\"XY\").workplane(offset=-1.0).circle(ar).extrude(W\
    \ + 2.0))\n\n    # Optional centre groove, only when tread_groove_w is switched\
    \ on (0 = flat).\n    if p.tread_groove_w > 0:\n        gw = p.tread_groove_w\n\
    \        gd = p.tread_groove_d\n        g1 = R - gd\n        pts = [(g1, -gw /\
    \ 2.0 - 2.0), (R + 2.0, -gw / 2.0 - 2.0),\n               (R + 2.0, gw / 2.0 +\
    \ 2.0), (g1, gw / 2.0 + 2.0)]\n        cutter = cq.Workplane(\"XY\", origin=cq.Vector(0,\
    \ 0, 0.0)).polyline(pts).close().extrude(W, symmetric=False)\n        w = w.cut(cutter)\n\
    \n    return w"
  print_orientation: 'Lying flat like a coin: one wheel face (z = 0) on the bed, the
    axle/bearing axis vertical pointing up.'
  use_orientation: Axis horizontal along the axle bolt, either face outwards (the
    wheel is symmetrical); the axle axis is the part's own Z.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    L = p.coupon_l\n    Wp = p.coupon_w\n    T = p.coupon_t\n\
    \    ds = [p.coupon_seat_d_a, p.coupon_seat_d_b, p.coupon_seat_d_c]\n    ar =\
    \ p.axle_hole_d / 2.0\n\n    w = cq.Workplane(\"XY\").box(L, Wp, T, centered=(True,\
    \ True, False))\n\n    xs = [(-0.5 * L) + 13.0 + 23.0 * i for i in range(len(ds))]\n\
    \    for x, d in zip(xs, ds):\n        r = d / 2.0\n        depth = T\n      \
    \  w = w.cut(cq.Workplane(\"XY\", origin=cq.Vector(x, 0, T - depth)).circle(r).extrude(depth))\n\
    \        w = w.cut(cq.Workplane(\"XY\", origin=cq.Vector(x, 0, 0)).cone(r + 0.6,\
    \ r, 0.6))\n        w = w.cut(cq.Workplane(\"XY\", origin=cq.Vector(x, 0, T -\
    \ depth)).cone(r, r + 0.6, 0.6))\n\n    # Through-hole at the true axle size,\
    \ to check the bolt slides freely.\n    w = w.faces(\">Z\").workplane().center(-0.5\
    \ * L + 3.5, 0).hole(2 * ar)\n\n    return w"
  print_orientation: Flat on the bed, z = 0 down; the three test pockets open upwards
    and are 7 mm deep.
  use_orientation: Not fitted to the door - a throwaway test print, discard once the
    fits are checked.
