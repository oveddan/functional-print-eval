criteria:
- id: c_bore_left
  part: wheel
  feature: bearing_seat_left
  relation: engages
  hardware: bearing_608
  clearance_mm: null
  params:
  - bearing_od
  - bearing_bore_dia
  check:
    method: coupon
    ref: fit_coupon
    description: Print the coupon first and press a bearing into each blind bore.
      Pick the bore where the bearing needs firm, steady thumb pressure, goes in square
      and does not fall out and does not crack the plastic. bearing_bore_dia must
      be set to that bore before printing wheel - it is built at 21.65.
- id: c_bore_right
  part: wheel
  feature: bearing_seat_right
  relation: engages
  hardware: bearing_608
  clearance_mm: null
  params:
  - bearing_od
  - bearing_bore_dia
  check:
    method: coupon
    ref: fit_coupon
    description: Same bore as bearing_seat_left; both bores are printed identically
      from the same face.
- id: c_bearing_flush
  part: wheel
  feature: bearing_seat_left
  relation: seats
  hardware: bearing_608
  clearance_mm: null
  params:
  - pocket_depth
  - bearing_width
  check:
    method: measure
    ref: null
    description: Each bearing should finish flush with the wheel's side face (pocket_depth
      = 7.0 = bearing width). If it stands proud, it will rub the fork cheek - push
      it home, do not sand the bearing.
- id: c_axle_clears
  part: wheel
  feature: axle_bore
  relation: clears
  hardware: bolt_m8
  clearance_mm: 0.5
  params:
  - axle_bore_dia
  - bolt_d
  check:
    method: measure
    ref: null
    description: 'Dry fit before the bearings go in: slide the bare wheel on the bolt
      and spin it - it must turn freely on the smooth bore with no rubbing.'
- id: c_fork_fit
  part: wheel
  feature: tire
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - wheel_width
  - fork_inside_width
  check:
    method: measure
    ref: null
    description: The 16 mm body has to sit between the fork cheeks with a little side
      play, and fit the floor channel. Test-fit before pressing bearings in; if it
      is tight, tell me the inside width and I will shave wheel_width rather than
      you sanding it.
- id: c_no_preload
  part: wheel
  feature: face_left
  relation: faces
  hardware: nut_m8
  clearance_mm: null
  params:
  - wheel_width
  - fork_hole_dia
  check:
    method: measure
    ref: null
    description: Bolt head and nut must bear on the OUTSIDE faces of the two fork
      cheeks only - never on the wheel's faces and never down a bore onto a bearing.
      Wheel spins between them, clamped parts are steel on steel.
- id: c_thread_reach
  part: wheel
  feature: axle_bore
  relation: engages
  hardware: bolt_m8
  clearance_mm: null
  params:
  - wheel_width
  - fork_cheek_t
  - nut_h
  - axle_thread_needed
  check:
    method: measure
    ref: null
    description: The bolt's thread has to reach about 24 mm from under its head (see
      axle_thread_needed). M8x30 fits, M8x25 is marginal, M8x16/20 is not enough -
      then use axle_end_cap.
- id: c_cap_grip
  part: axle_end_cap
  feature: thread_bore
  relation: engages
  hardware: bolt_m8
  clearance_mm: null
  params:
  - bolt_d
  - cap_thread_form_dia
  check:
    method: measure
    ref: null
    description: 'Thread-forming, not a printed thread: screw the bolt''s tip in by
      hand, square, 6+ full turns. Snug only - the PLA thread retains the axle, it
      does not replace a steel nut.'
manual:
- n: '1'
  text: Print fit_coupon and wheel. Both lie flat as described, 0.2 mm layers, 3 walls,
    ~25% rectilinear infill, no supports. Print the coupon FIRST - it decides the
    wheel's bore size. Print axle_end_cap only if step 8 says you need it.
  parts:
  - fit_coupon
  - wheel
  - axle_end_cap
  hardware: []
  tool: printer
- n: '2'
  text: 'Find your press fit. Push a 608 bearing into each blind bore in the coupon,
    left to right: 21.45, 21.65, 21.85, 22.05. You want the bore where the bearing
    needs firm steady pressure, enters square, stays put when you tip the bar, and
    does not split the plastic. 21.45 will likely need a press and 22.05 will be loose;
    21.65 is what the wheel is built at. If the right one is not 21.65, tell me which
    and I''ll reprint the wheel at that size.'
  parts:
  - fit_coupon
  hardware:
  - bearing_608
  tool: null
- n: '3'
  text: 'Optional but recommended: the bearings are held in the PLA purely by that
    press fit, so put 2-3 drops of thin superglue around each bore before you press
    them in. Skip it if you want the wheel serviceable.'
  parts:
  - wheel
  hardware: []
  tool: null
- n: '4'
  text: 'Press the bearings in, one per bore, from the two flat faces. Push on the
    OUTER race only - if you push on the inner race you ruin the bearing. Good trick:
    put the wheel on the bench bore-up, drop a bearing loosely in each bore, pass
    the M8 bolt through the middle with one ISO 7089 M8 washer on each side resting
    on the bearing faces, and draw the nut down. The washers (16 mm, so they bridge
    the 22 mm bore without touching the inner race) pull both bearings in evenly and
    square, flush with the faces.'
  parts:
  - wheel
  hardware:
  - bolt_m8
  - nut_m8
  - washer_m8
  - bearing_608
  tool: 13 mm spanner
- n: '5'
  text: 'Undo the bolt, take the washers off, and check both bearings are flush or
    just proud-free of the wheel faces and the wheel still spins on its two inner
    races when you roll it on the bench. Spin the bare assembly: it should coast freely.
    Any grit or drag means a bearing is not home - push it in.'
  parts:
  - wheel
  hardware:
  - bearing_608
  tool: null
- n: '6'
  text: Take the old broken wheel out of the door's roller fork and slide the new
    wheel in between the cheeks. The bolt goes through the fork hole and through the
    wheel's 9 mm bore, so it passes both bearings' 8 mm inner races. The wheel must
    sit between the cheeks without touching them - if it rubs, stop and tell me the
    inside width.
  parts:
  - wheel
  hardware:
  - bearing_608
  - bolt_m8
  tool: null
- n: '7'
  text: 'Fit the bolt with its head bearing on the OUTSIDE face of one cheek, and
    the ISO 10511 M8 nylon lock nut on the OUTSIDE face of the other. Tighten only
    enough to stop the fork rattling: the clamp is steel cheek to steel bolt, and
    the wheel must still be free to spin. If tightening the nut makes the wheel bind,
    the nut or head is touching the wheel or a bearing face - back off and check step
    6.'
  parts:
  - wheel
  hardware:
  - bolt_m8
  - nut_m8
  tool: 13 mm spanner
- n: '8'
  text: 'Reach test: you need about 24 mm of threaded bolt past the head (cheek +
    16 mm wheel + cheek + the 8 mm nut). M8x30 is comfortable, M8x25 is marginal,
    a shorter bolt is not enough. If your bolt falls short, print axle_end_cap and
    screw its 7.9 mm bore onto the bolt''s tip - it thread-forms into the PLA, so
    start it by hand and keep it square, and give it 6 or more full turns. Its 20
    mm flange then bears on the outside of the far cheek and holds the axle in. That
    is a retention aid, not a nut: it will not stand up to a heavy clamp.'
  parts:
  - axle_end_cap
  hardware:
  - bolt_m8
  tool: 13 mm spanner
- n: '9'
  text: Rehang the door and roll it a dozen times. Watch the wheel run true in the
    floor channel with no chattering and no sideways rubbing, then re-check the nut
    after a week - PLA takes a set and the fork can work loose.
  parts:
  - wheel
  hardware: []
  tool: null
