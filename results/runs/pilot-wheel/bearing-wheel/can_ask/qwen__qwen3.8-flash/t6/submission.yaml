    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ outside diameter, 22.000 -0.008. The 21.22 caliper reading was the
      bearing pinched at an angle - wrong, use 22
  bearing_bore_d:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 inside diameter; the 7.94 reading is the bore squashed by the caliper
  bearing_width:
