task: bearing-wheel
note: 'Yes, this works: the two 608s press into the wheel and the wheel spins on them,
  while the M8 bolt stays fixed in the door''s fork. It''s one printed part (plus
  a fit coupon and an optional axle end cap).\n\nHow it''s built: a 50 mm flat-tread
  tyre, 16 mm wide to match the old wheel, with a 21.65 mm press-fit bore 7.0 mm deep
  in each face so both bearings finish flush, a 2 mm solid hub between them, and a
  9 mm axle bore through the middle (0.5 mm/side clearance on the M8, so plastic never
  rubs the bolt). There is deliberately NO internal spacer and NO sleeve: the clamp
  is bolt head on one fork cheek, lock nut on the other, so the only parts in compression
  are steel; nothing bears on the bearing faces and the bearings cannot be preloaded
  and jammed. I dropped the spacer idea because a tube long enough to stand proud
  of both wheel faces and press the inner races would foul the bearings themselves,
  and because PLA creeping on a thread is why printed rollers bind.\n\nThree things
  I could not measure and had to guess, all flagged as guessed params - please check
  them, any one is a reason to reprint:\n1) Bolt length. The design wants ~24 mm of
  thread past the head, i.e. M8x25 minimum, M8x30 comfortable. Every measurement you
  took came back as ''about 8 mm'', which is the shank dia, not the length. If yours
  is shorter, axle_end_cap thread-forms onto the tip as a retention aid.\n2) Width
  16 mm. I matched the old wheel, but the real limits are the fork''s inside width
  and the floor channel, neither of which you could measure. 16.0 is the safe-looking
  number; tell me the actual inside width if the test fit is tight.\n3) Flat tread.
  Most closet-door tracks want a flat tyre, but if the old wheel had a centre rib
  or V to straddle a ridge, tell me and I''ll cut it in.\n\nAlso worth knowing: the
  bearings are retained purely by the press fit, so I made the fit coupon the first
  print - that bore size (21.45/21.65/21.85/22.05) is the one dimension I genuinely
  cannot predict for your printer, and thin CA around the seat is the belt-and-braces
  if a bearing ever walks out. What I wanted but couldn''t do: a printed-in-place
  swivel flange that would captivate the axle and let a short bolt work - it needs
  a known bracket hole to bite on and no room in the wheel next to a press-fit 608.'
questions: []
params:
  wheel_dia:
    value: 50
    unit: mm
    kind: design
    source: design
    note: Set to the old wheel's ~50 mm (see old_wheel_dia). Flat tread - tell me
      if your floor track has a ridge the old wheel straddled and I'll cut a groove
      or V.
  wheel_width:
    value: 16
    unit: mm
    kind: design
    source: design
    note: Body width; set equal to the old wheel's ~16 mm. Must clear BOTH the fork
      cheeks and the floor channel.
  old_wheel_dia:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: '''about 50 mm across'' - your estimate, not measured'
  old_wheel_width:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: '''about 16 mm wide'' - your estimate; the broken pieces could not be measured'
  fork_inside_width:
    value: 16
    unit: mm
    kind: world
