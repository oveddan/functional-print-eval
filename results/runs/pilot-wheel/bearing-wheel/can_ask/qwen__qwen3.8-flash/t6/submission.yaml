    unit: mm
    kind: hardware
    source: catalog
    note: M8 major dia (your 'about 8 mm shank' confirms it)
  bolt_head_d:
    value: 13
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_head_h:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  nut_af:
    value: 13
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 lock nut across flats; across corners 15.0
  nut_h:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  washer_od:
    value: 16
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 - used only as a drift to pull the bearings in evenly
  washer_id:
    value: 8.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  washer_t:
    value: 1
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  axle_thread_needed:
    value: 24
    unit: mm
    kind: design
    source: guessed
    note: 'Thread the bolt must have past its head: cheek + wheel + cheek + nut. M8x30
      clears it; M8x20 does not unless you fit the end cap'
  bearing_bore_dia:
    value: 21.65
    unit: mm
    kind: design
    source: design
    note: 'Printed bore for the 22.0 outer race: 0.35 mm total interference (~0.18
      mm/side). THE number to check with the coupon before printing the wheel'
