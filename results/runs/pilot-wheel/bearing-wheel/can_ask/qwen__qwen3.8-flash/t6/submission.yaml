parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    Ro = p.wheel_dia / 2.0          # tread radius\n    W\
    \  = p.wheel_width              # body width, matches the old wheel\n    dp =\
    \ p.pocket_depth             # bearing pocket depth (= 608 width -> bearings sit\
    \ flush)\n    bd = p.bearing_bore_dia / 2.0   # printed bore for the 22 mm outer\
    \ race (press fit)\n    ad = p.axle_bore_dia / 2.0      # bore the M8 axle turns\
    \ in\n    ch = p.tread_chamfer            # lead-in at each bore mouth + tread\
    \ edge break\n    # half section (radius, axial z), z=0 is the bed = the face\
    \ the bolt head is on\n    pts = [(ad, dp), (ad, W - dp), (bd, W - dp), (bd, W\
    \ - ch), (bd + ch, W),\n           (Ro - ch, W), (Ro, W - ch), (Ro, ch), (Ro -\
    \ ch, 0), (bd + ch, 0),\n           (bd, ch), (bd, dp)]\n    return cq.Workplane('XZ').polyline(pts).close().revolve(360,\
    \ (0, 0), (0, 1))"
  print_orientation: Lies flat on one side face; wheel axis vertical (part +Z), bed
    at z=0. No supports. Both bearing bores and the axle bore print as vertical holes;
    each pocket ceiling is only a 6.3 mm-wide bridge.
  use_orientation: Part +Z = the axle axis, pointing from the bolt head toward the
    nut; part origin at the centre of the wheel face the bolt head sits against; XY
    centred on the axle.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    bores = [p.coupon_bore_1, p.coupon_bore_2, p.coupon_bore_3,\
    \ p.coupon_bore_4]\n    n = len(bores)\n    big = max(bores)\n    L  = p.coupon_pitch\
    \ * (n - 1) + big + 2 * p.coupon_wall\n    Wd = big + 2 * p.coupon_wall\n    T\
    \  = p.coupon_thickness\n    w = cq.Workplane('XY').box(L, Wd, T, centered=(True,\
    \ True, False))\n    for i, d in enumerate(bores):\n        x = (i - (n - 1) /\
    \ 2.0) * p.coupon_pitch\n        cyl = (cq.Workplane('XY').workplane(offset=T\
    \ + 1.0).center(x, 0.0)\n                 .circle(d / 2.0).extrude(-(p.coupon_bore_depth\
    \ + 1.0)))\n        w = w.cut(cyl)\n    return w"
  print_orientation: Flat on the bed, blind bores pointing up (same bore/print conditions
    as the wheel). No supports.
  use_orientation: Not used in the assembly - a fit check; keep the bore that worked
    for reference.
- id: axle_end_cap
  role: final
  material: PLA
  code: "def build(p):\n    af = p.nut_af                    # same across-flats as\
    \ the nut, so one spanner fits both\n    rc = af / (3.0 ** 0.5)           # across-corners\
    \ radius for a hex with that across-flats\n    r  = (p.bolt_d - 0.1) / 2.0   \
    \   # thread-forming bore: the M8 crest cuts its thread in PLA\n    ft = p.cap_flange_t\n\
    \    bl = p.cap_body_len\n    fr = p.cap_flange_dia / 2.0\n    L  = ft + bl\n\
    \    w = cq.Workplane('XY').polygon(6, 2 * rc, circumscribed=True).extrude(L)\n\
    \    w = w.union(cq.Workplane('XY').circle(fr).extrude(ft))\n    w = w.cut(cq.Workplane('XY').workplane(offset=-0.5).circle(r).extrude(L\
    \ + 1.0))\n    return w"
  print_orientation: Flange flat on the bed, axis vertical (part +Z up through the
    hex body). No supports.
  use_orientation: 'Optional. Only fitted if the bolt is too short for the nut to
    reach past the far cheek: cap axis on the axle, flange face hard against the OUTSIDE
    of the far cheek, hex body pointing away from the wheel, bolt tip screwed into
    its bore.'
