task: bearing-wheel
note: 'A 50 x 16 mm all-PLA roller wheel, printed lying flat with the bore axis vertical
  and no supports. Two 608ZZ bearings press into 21.8 mm blind seats and stop on an
  integral 19 mm shoulder. That shoulder touches only the flat face of the outer race,
  clear of the inner race and the shield, so the load path is wheel, outer race, balls,
  inner race, fixed M8 bolt, bracket plates. The bolt passes the 19 mm window with
  5.5 mm per side to spare and never touches plastic. The bearings sit 0.15 mm below
  the wheel faces so the bracket plates cannot rub them. A fit coupon lets you choose
  the real seat size on your printer before committing to the wheel, and the wear
  band check in step 9 tells us whether your track wants a grooved tread instead of
  this flat 12 mm band. Because the bracket measurements would not come back, two
  things are assumed: the 16 mm width from your old wheel, which is one param to trim
  if the plate gap is tighter, and bracket axle holes that clear an M8. The M8x30
  screw and lock nut are listed as fallbacks, so your own bolt is fine if it is long
  enough.'
questions: []
params:
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 inner race bore, rides on the M8 shank.
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 outer race OD, 22.000 minus 0.008. Your 21.22 reading pinched the bearing
      at an angle, so it is disregarded.
  bearing_recess:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: Seat is this much deeper than the bearing, so the bearing faces sit below
      the wheel faces and the plates cannot rub them.
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 width, both races flush at each face.
  bolt_d:
    value: 7.8
    unit: mm
    kind: hardware
    source: measured
    note: You measured your M8 shank at about 8 mm; an M8 external thread crests at
      7.8 to 7.9.
  bracket_hole_d:
    value: 8.5
    unit: mm
    kind: world
    source: guessed
    note: Assumed the bracket axle holes clear an M8 bolt. Not measured; checked in
      step 1 and step 8.
  mouth_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Lead-in at each seat mouth to start the bearing squarely.
  seat_d:
    value: 21.8
    unit: mm
    kind: design
    source: guessed
    note: Printed bearing seat, 0.2 mm interference on a 22.0 bearing. Confirm with
      the fit coupon before printing the wheel, then step by 0.1 mm if needed.
  tread_chamfer:
    value: 2
    unit: mm
    kind: design
    source: design
    note: 45 degree break at both tread edges so the wheel cannot dig an edge into
      the track.
  wheel_d:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: Your old wheel, about 50 mm across. Contact band is 12 mm wide between the
      tread chamfers.
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: Your old wheel, about 16 mm wide. Needs a bracket plate gap of about 17
      mm. Do not go below 15.5, which is two 7 mm bearings plus 1.2 mm shoulder.
  window_d:
    value: 19
    unit: mm
    kind: design
    source: design
    note: The shoulder between the two seats. Clears the 608 inner race at about 13
      and its shield at about 18, and bears only on the flat face of the outer race.
      Also gives the bolt 5.5 mm radial clearance.
parts:
- id: wheel
  role: final
  material: PLA (high-speed black)
  code: "def build(p):\n    # Roller wheel for two 608 skateboard bearings on a fixed\
    \ M8 bolt.\n    # Modelled in its print orientation: bore axis = Z, z = 0 is the\
    \ bed.\n    R = p.wheel_d / 2.0\n    rs = p.seat_d / 2.0\n    rw = p.window_d\
    \ / 2.0\n    w = p.wheel_w\n    ct = p.tread_chamfer\n    cm = p.mouth_chamfer\n\
    \    # Seat depth = bearing width + recess, but never leave less than\n    # 1.2\
    \ mm of locating shoulder.\n    sd = min(p.bearing_w + p.bearing_recess, (w -\
    \ 1.2) / 2.0)\n\n    body = cq.Workplane(\"XY\").circle(R).extrude(w)\n    low\
    \ = cq.Workplane(\"XY\").circle(rs).extrude(sd)\n    up = cq.Workplane(\"XY\"\
    ).workplane(offset=w - sd).circle(rs).extrude(sd)\n    mid = cq.Workplane(\"XY\"\
    ).workplane(offset=sd).circle(rw).extrude(w - 2.0 * sd)\n    part = body.cut(low).cut(up).cut(mid)\n\
    \n    # Lead-ins at the mouths, then the two tread chamfers.\n    part = part.edges(cq.NearestToPointSelector((rs,\
    \ 0, 0))).chamfer(cm)\n    part = part.edges(cq.NearestToPointSelector((rs, 0,\
    \ w))).chamfer(cm)\n    part = part.edges(cq.NearestToPointSelector((R, 0, 0))).chamfer(ct)\n\
    \    part = part.edges(cq.NearestToPointSelector((R, 0, w))).chamfer(ct)\n   \
    \ return part"
  print_orientation: 'As modelled: wheel lies on its z=0 face, bore axis vertical,
    tread wall one continuous full-height cylinder. No supports.'
  use_orientation: Bore axis horizontal and parallel to the bracket plates, so the
    part local Z is the M8 axle. Symmetrical, so either face may carry the bolt head.
- id: fit_coupon
  role: coupon
  material: PLA (high-speed black)
  code: "def build(p):\n    # Press fit finder: three through holes sized around the\
    \ wheel seat,\n    # labelled 1 / 2 / 3 by engraved dots. One dot is the tightest.\n\
    \    ds = [p.seat_d - 0.2, p.seat_d, p.seat_d + 0.2]\n    xs = [-25.0, 0.0, 25.0]\n\
    \    out = cq.Workplane(\"XY\").box(80.0, 32.0, 8.0, centered=(True, True, False))\n\
    \    for x, d in zip(xs, ds):\n        out = out.faces(\">Z\").workplane(centerOption=\"\
    CenterOfBoundBox\").center(x, 0.0).hole(d)\n    for i, x in enumerate(xs, start=1):\n\
    \        for k in range(i):\n            out = (out.faces(\">Z\").workplane(centerOption=\"\
    CenterOfBoundBox\")\n                       .center(x + (k - (i - 1) / 2.0) *\
    \ 4.0, 13.5).hole(1.6, depth=1.2))\n    return out"
  print_orientation: Flat on the bed as modelled, 8 mm tall, engraved dots facing
    up.
  use_orientation: Fit check only, never fitted to the door.
