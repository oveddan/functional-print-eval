criteria:
- id: press_fit
  part: wheel
  feature: lower_seat
  relation: seats
  hardware: bearing_608
  clearance_mm: null
  params:
  - seat_d
  - bearing_od
  check:
    method: coupon
    ref: fit_coupon
    description: 'Press a bearing into the 2 dot hole, 21.8 mm. It should start squarely
      under steady thumb pressure and end with no play when you try to tilt it. Too
      hard to start: set seat_d to 21.9. Loose with tilt: set seat_d to 21.6.'
- id: bearings_below_faces
  part: wheel
  feature: lower_seat
  relation: seats
  hardware: bearing_608
  clearance_mm: null
  params:
  - bearing_w
  - bearing_recess
  - wheel_w
  check:
    method: measure
    ref: null
    description: 'Seat depth is 7.15 mm against a 7.0 mm bearing, so both bearing
      faces end 0.15 mm below the wheel faces. Lay each face on a flat table: plastic
      touches first, metal does not.'
- id: shoulder_clears_race
  part: wheel
  feature: window
  relation: clears
  hardware: bearing_608
  clearance_mm: 0.5
  params:
  - window_d
  - bearing_bore
  check:
    method: measure
    ref: null
    description: 'Flick the wheel with both bearings in: it must spin freely. If it
      binds, or a bearing will not reach the shoulder, the 19 mm window is standing
      on the shield, so open window_d to 19.5 and reprint.'
- id: bolt_clears_window
  part: wheel
  feature: window
  relation: clears
  hardware: bolt_m8
  clearance_mm: 5.5
  params:
  - window_d
  - bolt_d
  check:
    method: measure
    ref: null
    description: The bolt must pass the wheel without touching it, because the bearings
      locate the wheel. 19 mm window over a 7.8 mm shank.
- id: bolt_through_bracket
  part: wheel
  feature: window
  relation: engages
  hardware: bolt_m8
  clearance_mm: null
  params:
  - bracket_hole_d
  - bolt_d
  check:
    method: measure
    ref: null
    description: 'Slide the bolt through both bracket holes first: it must pass freely,
      and head and nut must bear on the plates rather than on the wheel. If the holes
      are tight, hold the head with a key so it does not spin as the nut goes in.'
- id: width_between_plates
  part: wheel
  feature: lower_seat
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - wheel_w
  check:
    method: measure
    ref: null
    description: The wheel must drop between the bracket plates with about 0.5 mm
      to spare per side. If it will not, reduce wheel_w, never below 15.5 mm, and
      note the bearing recess shrinks as you narrow it.
- id: tread_on_track
  part: wheel
  feature: tread
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - wheel_d
  - tread_chamfer
  check:
    method: measure
    ref: null
    description: 'Refit the door, roll a dozen passes, then read the wear mark: it
      should be a band centred between the two chamfers. Wear out at one chamfer,
      or a wheel that walks sideways, means the rail has a flange or ridge the old
      wheel straddled.'
manual:
- n: '1'
  text: 'Check the space before printing anything. Take the door off and look at the
    bracket the wheel lived in. This wheel is 16 mm wide, so the gap between the two
    plates needs to be about 17 mm, and your M8 bolt has to pass both holes freely
    and stick out far enough to go through the 14 mm bearing stack plus washer and
    nut. If the plate gap is under 15.5 mm, stop and tell me: two 7 mm bearings plus
    the internal shoulder cannot be squeezed narrower than that.'
  parts:
  - wheel
  hardware: []
  tool: ruler or calipers
- n: '2'
  text: 'Print fit_coupon flat on the bed, no supports: 0.2 mm layers, 4 perimeters,
    25 percent infill. About ten minutes, and it is the step that makes the press
    fit right on your machine rather than on mine.'
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '3'
  text: 'Choose the fit. The three holes are labelled by engraved dots on the top
    face: 1 dot is 21.6 mm and the tightest, 2 dots is 21.8 mm which is what the wheel
    is modelled at, 3 dots is 22.0 mm. Press a bearing squarely into each in turn
    over a flat table. The right hole is the smallest one where the bearing starts
    under steady thumb pressure, goes in without rocking, and has no play when you
    try to tip it. If 21.8 is a hammer fit, set seat_d to 21.9. If even 22.0 has no
    wobble, set seat_d to 21.6. The wheel then uses that value.'
  parts:
  - fit_coupon
  hardware:
  - bearing_608
  tool: thumb and a flat table
- n: '4'
  text: 'Print the wheel lying on its face exactly as modelled, so the bore axis is
    vertical and the tread wall is one continuous cylinder: 0.2 mm layers, 5 perimeters
    because the bearing seat is carried by perimeter shells and not infill, 25 to
    30 percent infill, no supports, no raft. Print a second one while you are at it,
    since this is the wear item on the door.'
  parts:
  - wheel
  hardware: []
  tool: null
- n: '5'
  text: Clear the bore. Tip the first few millimetres of each seat with a folded strip
    of 400 grit paper, or run a 22 mm socket through by hand, to break off stringing
    or blobs at the mouth. Do not open the seat beyond the diameter you picked in
    step 3.
  parts:
  - wheel
  hardware: []
  tool: 400 grit paper or a 22 mm socket
- n: '6'
  text: Press the bearings in. Stand the wheel over a hole bigger than 22 mm, a deep
    socket or two blocks with a gap between them, lay a bearing square in the mouth,
    and push on the outer race only, a ring about 20 mm across, never on the inner
    race. Drive it a few millimetres, flip the wheel, repeat with the other bearing,
    alternating sides until both stop on the internal shoulder. The two bearings finish
    side by side in the middle of the bore.
  parts:
  - wheel
  hardware:
  - bearing_608
  tool: 20 mm socket or drift
- n: '7'
  text: 'Two checks before fitting. Lay each face of the wheel on a flat table: the
    plastic must touch, not the metal. Then flick it: it must spin freely on the bearing
    stack. If it binds, or a bearing never reached the shoulder, the 19 mm window
    is standing on the shield, so open window_d to 19.5 and reprint.'
  parts:
  - wheel
  hardware: []
  tool: flat table
- n: '8'
  text: Assemble. Slide the M8 bolt through both bracket holes from the head side,
    drop the wheel bearings onto the protruding shank, then fit washer and nut. Hold
    the bolt head with a key so it does not spin, and tighten only enough to kill
    the rattle. You are clamping the plates together, not squeezing the wheel. Head
    and nut stay outside the plates, with the plastic wheel faces towards the plates.
  parts:
  - wheel
  hardware:
  - bolt_m8
  - washer_m8
  - nut_m8
  tool: Allen key and spanner
- n: '9'
  text: 'Rehang the door and roll it a dozen passes. Read the wear band on the tread:
    it should sit centred between the two chamfers. Wear out at one edge, or a wheel
    that wanders, means your track has a flange or ridge that the old wheel straddled.
    Tell me roughly what the rail looks like and I will cut a matching groove.'
  parts:
  - wheel
  hardware:
  - bolt_m8
  - nut_m8
  tool: null
- n: '10'
  text: After a week, check the nut is still tight and look at the wear band again.
    If the seat has opened up and a bearing spins in the bore, reprint the wheel and
    drop seat_d by 0.1 mm. Keep the spare on the shelf.
  parts:
  - wheel
  hardware:
  - nut_m8
  - bearing_608
  tool: null
