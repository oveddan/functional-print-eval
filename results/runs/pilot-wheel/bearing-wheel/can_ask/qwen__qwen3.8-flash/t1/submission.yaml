parts:
- id: wheel
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    # wheel.bearing_seat_a / .bearing_seat_b : the two 608\
    \ seats\n    # wheel.shoulder_a / .shoulder_b        : the faces each outer ring\
    \ bottoms on\n    # wheel.centre_web                      : the 2 mm web that\
    \ spaces the bearings\n    # wheel.axle_bore                       : clearance\
    \ hole for the fixed axle\n    # wheel.tread                           : the rolling\
    \ band, wheel.face_a / .face_b\n    R = p.wheel_od / 2.0\n    W = p.wheel_w\n\
    \    e = p.tread_edge\n    c1 = cq.Workplane(\"XY\").circle(R - e).extrude(e)\n\
    \    c2 = cq.Workplane(\"XY\", origin=(0, 0, e)).circle(R).extrude(W - 2 * e)\n\
    \    c3 = cq.Workplane(\"XY\", origin=(0, 0, W - e)).circle(R - e).extrude(e)\n\
    \    body = c1.union(c2).union(c3)\n    seat_a = cq.Workplane(\"XY\").circle(p.seat_d\
    \ / 2.0).extrude(p.bearing_w)\n    lead_a = cq.Workplane(\"XY\").circle((p.seat_d\
    \ + p.lead_in_d) / 2.0).extrude(p.lead_in_h)\n    seat_b = cq.Workplane(\"XY\"\
    , origin=(0, 0, W - p.bearing_w)).circle(p.seat_d / 2.0).extrude(p.bearing_w)\n\
    \    lead_b = cq.Workplane(\"XY\", origin=(0, 0, W - p.lead_in_h)).circle((p.seat_d\
    \ + p.lead_in_d) / 2.0).extrude(p.lead_in_h)\n    bore = cq.Workplane(\"XY\",\
    \ origin=(0, 0, -1.0)).circle(p.axle_clr / 2.0).extrude(W + 2.0)\n    body = body.cut(seat_a).cut(lead_a).cut(seat_b).cut(lead_b).cut(bore)\n\
    \    return body"
  print_orientation: 'Axis vertical: one flat face (z = 0, wheel.face_a) on the bed,
    the axle axis pointing up. No supports, no bridging - both bearing seats are straight
    vertical bores and the axle hole runs through the 2 mm centre web as a vertical
    wall.'
  use_orientation: 'As printed. The wheel''s Z axis is the axle: z = 0 is the bolt-head
    end, z = 16 the nut end. Both outer rings sit flush with the two faces, so the
    wheel free-spins on the bearings while the bolt stays fixed in the bracket.'
- id: axle_sleeve
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    # axle_sleeve.sleeve_face = the end that presses the bearing's\
    \ inner ring\n    # axle_sleeve.sleeve_back = the end the bracket cheek bears\
    \ on\n    # axle_sleeve.sleeve_bore = clearance over the 8 mm shank\n    ring\
    \ = cq.Workplane(\"XY\").circle(p.sleeve_od / 2.0).extrude(p.sleeve_len)\n   \
    \ bore = cq.Workplane(\"XY\", origin=(0, 0, -1.0)).circle(p.sleeve_id / 2.0).extrude(p.sleeve_len\
    \ + 2.0)\n    return ring.cut(bore)"
  print_orientation: Lying flat as modelled, z = 0 on the bed. It is 1.2 mm tall,
    so it prints in a few seconds; print four at a time so you have spares and can
    stack two if the bracket gap turns out wide.
  use_orientation: Slipped over the axle between each bracket cheek and each bearing.
    Its outer diameter is deliberately smaller than the bearing's inner ring, so it
    presses only the inner (stationary) ring and never touches the outer ring the
    wheel turns on.
- id: bearing_head_side
  role: final
  material: 608ZZ steel skateboard bearing (bought, not printed)
  code: "def build(p):\n    ring = cq.Workplane(\"XY\").circle(p.bearing_od / 2.0).extrude(p.bearing_w)\n\
    \    hole = cq.Workplane(\"XY\", origin=(0, 0, -1.0)).circle(p.bearing_bore /\
    \ 2.0).extrude(p.bearing_w + 2.0)\n    return ring.cut(hole)"
  print_orientation: Not printed - one of the two 608ZZ bearings you already have;
    modelled standing on its own face so you can see the clamp stack.
  use_orientation: Press-fit into wheel.bearing_seat_a, axis on the wheel's Z axis,
    its faces flush with wheel.face_a. The bolt head (or the sleeve from that side)
    clamps its inner ring.
- id: bearing_nut_side
  role: final
  material: 608ZZ steel skateboard bearing (bought, not printed)
  code: "def build(p):\n    ring = cq.Workplane(\"XY\").circle(p.bearing_od / 2.0).extrude(p.bearing_w)\n\
    \    hole = cq.Workplane(\"XY\", origin=(0, 0, -1.0)).circle(p.bearing_bore /\
    \ 2.0).extrude(p.bearing_w + 2.0)\n    return ring.cut(hole)"
  print_orientation: Not printed - the second 608ZZ bearing.
  use_orientation: Press-fit into wheel.bearing_seat_b from the other face, axis on
    the wheel's Z axis, its faces flush with wheel.face_b (wheel frame z = 16 mm).
    The nut (or the sleeve from that side) clamps its inner ring.
- id: fit_coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    # three bearing-seat test bores + four feeler tabs to\
    \ size the axle sleeves\n    plate = cq.Workplane(\"XY\").box(p.coupon_L, p.coupon_W,\
    \ p.coupon_t, centered=(True, True, False))\n    for i, d in enumerate([p.coupon_bore_tight,\
    \ p.seat_d, p.coupon_bore_loose]):\n        x = (i - 1) * p.coupon_pitch\n   \
    \     c = cq.Workplane(\"XY\", origin=(x, 0, -1.0)).circle(d / 2.0).extrude(p.coupon_t\
    \ + 2.0)\n        plate = plate.cut(c)\n    for i, t in enumerate([p.feeler_1,\
    \ p.feeler_2, p.feeler_3, p.feeler_4]):\n        x = p.feeler_x0 + i * p.feeler_pitch\n\
    \        tab = cq.Workplane(\"XY\", origin=(x, 0, p.coupon_t)).box(t, p.feeler_len,\
    \ p.feeler_h, centered=(True, True, False))\n        plate = plate.union(tab)\n\
    \    return plate"
  print_orientation: Flat, as modelled, z = 0 on the bed. No supports. The four feeler
    tabs stand 12 mm proud of the plate.
  use_orientation: Test piece only, nothing fitted. From the bolt-head end of the
    plate the three bores are tight (21.70), wheel's own size (21.85), loose (22.00);
    past them the four feeler tabs are 0.6 / 1.2 / 1.8 / 2.4 mm thick.
