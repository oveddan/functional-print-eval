task: bearing-wheel
note: 'Everything is sized off what you told me plus the two bearings and the bolt:
  50 mm diameter, 16 mm wide, two 7 mm 608s side by side with a 2 mm printed web between
  them, on an 8 mm shank. That web is the hub spacer, and it means the clamp never
  has to grip plastic to hold the bearings.


  Three things I could not measure were handled in the print instead of by guessing
  at the model: the bearing seat fit (three bores on the coupon, the middle one is
  what the wheel is printed at), the bracket cheek gap (four feeler tabs, which set
  the sleeve length), and the track channel width (step 4 uses the bare wheel blank
  as its own gauge).


  Please do steps 2-5 before pressing bearings in, and tell me the answers: which
  coupon bore gripped, which tab matched the gap, and whether the old tread was flat
  or grooved. The sleeve length is a placeholder at 1.2 mm and that param is the only
  one you need to change and re-slice after step 3. If the old wheel''s tread had
  a centre groove for the track, I need to know before you rely on it, since a flat
  tread on a rod track will walk off.'
questions:
- text: Which coupon bore actually gripped a bearing - 21.70, 21.85 or 22.00?
  answer: Unknown at hand-in; step 2 of the manual is the test, and the wheel is printed
    at 21.85 (0.15 mm interference), with 21.70 as the fallback if your printer cuts
    this bore oversize.
- text: How thick a feeler tab slides into the gap beside the wheel - 0.6, 1.2, 1.8
    or 2.4 mm, or none at all because the bracket is a single tab?
  answer: Unknown at hand-in; sleeve_len is set to a placeholder 1.2 mm and step 3
    tells you how to change it from the tabs. Arrangement A (no cheek beside the bearings,
    sleeves skipped) and B (cheeks clamped through the sleeves) are both written up
    in step 7.
- text: Was the old wheel's tread flat, or did it have a centre groove or crown to
    sit on a rod track?
  answer: No answer - the person could not measure or describe the old wheel. Modelled
    flat with 0.6 mm edge breaks to match a 16 mm band, with an explicit check in
    step 4.
- text: Is the bracket hole a plain 8.5-9 mm hole the bolt passes through, or tapped
    M8 so the axle screws in as a stud?
  answer: Unknown; the design works either way (step 5 and step 7), with the nut or
    the stud shoulder doing the clamping.
params:
  wheel_od:
    value: 50
    unit: mm
    kind: design
    source: asked
    note: You said the old wheel was 'about 50 mm across'. Matching it keeps the axle
      at the same height so the door hangs where it did.
  wheel_w:
    value: 16
    unit: mm
    kind: design
    source: asked
    note: You said 'about 16 mm wide'. Two 7 mm bearings side by side need 14 mm,
      so 16 leaves a 2 mm centre web. Track channel width could not be measured -
      step 4 checks the bare blank drops in before anything is pressed.
  tread_edge:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Outer 0.6 mm of each face turned down 0.6 mm, so the wheel eases into the
      channel instead of biting its edges.
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 outer ring 22.000 -0.008. The 21.22 caliper reading in your sheet was
      the bearing pinched at an angle between the jaws - not used.
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 width; also the seat depth, so each outer ring ends flush with a wheel
      face.
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: Inner ring ID, nominal 8.0; the 7.94 reading was caliper tips inside the
      bore.
  inner_race_od:
    value: 12.4
    unit: mm
    kind: hardware
    source: guessed
    note: 'Typical 608 inner ring outside diameter, about 12.4. Sizes the axle sleeve:
      the sleeve must clear the outer ring (starts at about 19.4) but still cover
      the inner ring.'
  axle_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: 'What you measured: ''bolt across: about 8 mm (the shank)''. Taken as M8
      with the standard 1.25 pitch.'
  axle_clr:
    value: 8.6
    unit: mm
    kind: design
    source: design
    note: Wheel centre web rides over the fixed bolt with 0.3 mm per side.
  sleeve_od:
    value: 12.2
    unit: mm
    kind: design
    source: design
    note: 0.1 mm shy of the inner ring, and 7.2 mm clear of the outer ring, so the
      sleeve can only ever press the stationary ring.
  sleeve_id:
    value: 8.8
    unit: mm
    kind: design
    source: design
    note: 0.4 mm per side over the 8 mm shank so the sleeve slips onto the axle by
      hand.
  sleeve_len:
    value: 1.2
    unit: mm
    kind: design
    source: guessed
    note: 'PLACEHOLDER until you read the bracket gap with the coupon''s feeler tabs
      (step 3): set sleeve_len = the tab that slides into the gap beside the wheel,
      plus 0.3 mm. They print in seconds - reprint, or stack two thin ones, rather
      than force a wrong length.'
  seat_d:
    value: 21.85
    unit: mm
    kind: design
    source: design
    note: 'Bearing seat bore: 0.15 mm diametral interference on a 22.00 outer ring,
      checked against the middle bore of the coupon in step 2.'
  lead_in_d:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Each seat mouth opened 1 mm in diameter, so the bearing starts square; grip
      is kept over the other 6.5 mm.
  lead_in_h:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: ''
  thread_engage_min:
    value: 6
    unit: mm
    kind: design
    source: design
    note: Full threads the nut must run on past the far bearing face, i.e. shank at
      least 16 + 6 = 22 mm; with a nut that has to reach past a bracket cheek on each
      side, allow the cheek thickness too.
  bolt_head_d:
    value: 13
    unit: mm
    kind: hardware
    source: catalog
    note: 'ISO 4762 M8: 13 head across, 8 high. Radius 6.5 - it falls inside the 10.9
      mm seat mouth and onto the inner ring, never onto the plastic.'
  bolt_head_h:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  nut_af:
    value: 13
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M8 hex nut, 13 across flats, 6.8 high (corner radius 7.5, still
      inside the seat mouth).
  nut_h:
    value: 6.8
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  washer_od:
    value: 16
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8, 16 OD / 8.4 ID / 1.6 t. Only used outboard, against the bracket
      cheeks - see the note on why it cannot replace the sleeve.
  bracket_gap:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: UNKNOWN - inside gap between the bracket cheeks the axle passes through.
      Not needed in any geometry; read it in step 3 with the coupon's feeler tabs
      to set sleeve_len. Needs to be at least 17 mm for the 16 mm wheel to clear.
  track_channel_width:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: UNKNOWN - the channel the wheel rolls in. Nothing in the model depends on
      it except wheel_w, which is taken from the old wheel; step 4 is the fit check.
  coupon_L:
    value: 176
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_W:
    value: 26
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_t:
    value: 8
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_pitch:
    value: 44
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_bore_tight:
    value: 21.7
    unit: mm
    kind: design
    source: design
    note: 0.3 mm interference - the fallback if the wheel's seats turn out loose.
  coupon_bore_loose:
    value: 22
    unit: mm
    kind: design
    source: design
    note: Nominal, should be a free slip fit - proves the printer is cutting bores
      undersize at all.
  feeler_1:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: ''
  feeler_2:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: ''
  feeler_3:
    value: 1.8
    unit: mm
    kind: design
    source: design
    note: ''
  feeler_4:
    value: 2.4
    unit: mm
    kind: design
    source: design
    note: ''
  feeler_x0:
    value: 64
    unit: mm
    kind: design
    source: design
    note: ''
  feeler_pitch:
    value: 7
    unit: mm
    kind: design
    source: design
