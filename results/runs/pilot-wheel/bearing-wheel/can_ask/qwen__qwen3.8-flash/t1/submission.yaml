criteria:
- id: seat_grip_a
  part: wheel
  feature: bearing_seat_a
  relation: contains
  hardware: null
  clearance_mm: -0.15
  params:
  - seat_d
  - bearing_od
  - bearing_w
  check:
    method: coupon
    ref: fit_coupon
    description: 'The outer ring must be gripped over 6.5 mm of its 7 mm width (the
      0.5 mm x 1 mm seat-mouth lead-in does not count). Test all three coupon bores
      before touching the wheel: the middle one is the size the wheel is printed at.
      Right answer = needs firm steady thumb pressure and the bearing will not push
      back out with a finger.'
- id: seat_grip_b
  part: wheel
  feature: bearing_seat_b
  relation: contains
  hardware: null
  clearance_mm: -0.15
  params:
  - seat_d
  - bearing_od
  - bearing_w
  check:
    method: coupon
    ref: fit_coupon
    description: Identical bore printed in the same slab as bearing_seat_a, so one
      coupon reading settles both.
- id: race_located
  part: wheel
  feature: shoulder_a
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - bearing_w
  - wheel_w
  - seat_d
  check:
    method: measure
    ref: null
    description: Each outer ring bottoms on its printed shoulder and its face finishes
      flush with the wheel face (within about 0.2 mm, never proud) - that is what
      lets the sleeves and the nut grip the inner rings while the wheel's faces stay
      free.
- id: axle_clears_web
  part: wheel
  feature: axle_bore
  relation: clears
  hardware: axle_bolt
  clearance_mm: 0.6
  params:
  - axle_clr
  - axle_d
  check:
    method: measure
    ref: null
    description: 'The fixed bolt must slide through the centre web without rubbing:
      8.6 over the 8.0 shank you measured. The web doubles as the spacer between the
      inner rings, so the bolt must not have to carry the clamp through this hole.'
- id: sleeve_presses_inner_ring_only
  part: axle_sleeve
  feature: sleeve_face
  relation: seats
  hardware: bearing_608
  clearance_mm: 3.6
  params:
  - sleeve_od
  - inner_race_od
  - bearing_od
  - sleeve_len
  - bracket_gap
  check:
    method: measure
    ref: null
    description: 'Sleeve OD 12.2 covers the 12.4 inner ring and clears the outer ring,
      which starts at about 19.4, by 3.6 mm radial - so the clamp can only ever reach
      the stationary ring. Length is set from the feeler tabs, not from this model:
      sleeve_len = gap beside the wheel + 0.3 mm.'
- id: clamp_reaches_bearings
  part: wheel
  feature: face_a
  relation: faces
  hardware: axle_bolt
  clearance_mm: null
  params:
  - bolt_head_h
  - nut_h
  - bracket_gap
  - sleeve_len
  check:
    method: measure
    ref: null
    description: 'Two arrangements, find out which one your bracket is: (A) open space
      beside each cheek, so the 8 mm head and the 6.8 mm nut clamp the inner rings
      directly through the sleeves; (B) cheeks sit about 17 mm apart with the wheel
      between them, so the head and nut clamp the CHEEKS and the two sleeves carry
      that grip in to the inner rings. Either way the wheel faces must not be pinched
      - spin it with the nut just snug and it must free-run.'
- id: wheel_fits_track
  part: wheel
  feature: tread
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - wheel_w
  - wheel_od
  - track_channel_width
  - tread_edge
  check:
    method: measure
    ref: null
    description: 'The one number nobody could measure. Before the bearings go in,
      drop the bare blank into the track and roll it: it must enter and run with about
      0.5-1 mm spare each side. Too tight, and the fix is wheel_w, not a narrower
      bearing stack - keep wheel_w at 15 mm or more so the centre web stays 1 mm thick.'
- id: door_hangs_right_height
  part: wheel
  feature: tread
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  check:
    method: none
    ref: null
    description: At 50 mm the new wheel is the same diameter as the old one, so the
      axle stays at the same height above the track and the door bottom clears the
      floor as it did.
- id: bolt_grips_nut
  part: wheel
  feature: axle_bore
  relation: engages
  hardware: axle_nut_lock
  clearance_mm: 0.4
  params:
  - thread_engage_min
  - wheel_w
  check:
    method: measure
    ref: null
    description: At least 6 mm of full thread must stand proud of the far face for
      the nut. With the 30 mm bolt the tip is 14 mm past the wheel, so there is room
      for both cheeks and a washer; a 24 mm shank still works if the clamp is the
      direct arrangement.
manual:
- n: '1'
  text: 'Print three things together, as modelled: the wheel (axis vertical, one flat
    face on the bed), the fit_coupon (flat), and four of the axle_sleeve (flat, they
    are 1.2 mm tall - a handful of seconds each; you want spares to stack).


    Settings: 0.2 mm layers, 5-6 wall perimeters, 20-25% infill (gyroid or cubic),
    100% top and bottom, supports OFF. Leave hole/arc compensation OFF - the seats
    are already sized at 21.85 for a 22.00 bearing. Printing the wheel with its axis
    up is what makes this part work: both bearing bores come out as round vertical
    walls, the tread is one continuous perimeter loop, and the door''s load runs in-plane
    around the ring instead of trying to peel layers apart. Let it cool on the bed
    before peeling it off or the seats distort.'
  parts:
  - wheel
  - fit_coupon
  - axle_sleeve
  hardware: []
  tool: null
- n: '2'
  text: 'Settle the bearing fit with the coupon before you touch the wheel. Press
    one bearing into each of the three bores - thumb on a flat bench, or lay the wheel
    flat on the bench and stand the coupon on top of the bearing and lean on it. From
    the bolt-head end of the plate: tight = 21.70, the wheel''s own size = 21.85,
    loose = 22.00 (that one is a free slip fit, and it is only drilled 7 mm deep,
    which is how you can tell them apart without marking anything).


    If 21.85 needs firm steady pressure and the bearing then refuses to push back
    out, carry on. If it is loose, your printer is cutting this bore oversize and
    the seats in the wheel will be too - reprint the wheel after raising seat_d nothing
    (leave it as sent) but pressing with the wheel warmed first: 5 minutes in hot
    tap water, about 60 C, not boiling, press both bearings in square, and let it
    cool before moving on. Cooling shrinks the seat back onto the ring.'
  parts:
  - wheel
  - fit_coupon
  hardware:
  - bearing_608
  tool: null
- n: '3'
  text: 'Read the bracket gap - this sizes the sleeves and it is the one number the
    calipers could not give you. With the bolt loose through the bracket and the bare
    16 mm wheel sitting between the cheeks, slide a feeler tab from the coupon into
    the gap beside the wheel face: 0.6, then 1.2, then 1.8, then 2.4. The tab that
    just goes in with a light drag is the play you have. Set sleeve_len in the model
    to that reading + 0.3 mm and reprint the sleeves (that is why there are four).
    If even 2.4 goes in loose, stack two sleeves per side or print longer ones - do
    not try to squeeze a short one, it will shatter into the clamp stack.


    If there is no cheek beside the bearings at all (a single tab, or the axle screwed
    into the door as a stud), you can skip the sleeves entirely and clamp with the
    head and nut - still print two, they cost nothing and are the spare part for arrangement
    B.'
  parts:
  - fit_coupon
  - axle_sleeve
  hardware:
  - axle_bolt
  tool: nothing - the coupon's tabs are the gauge
- n: '4'
  text: 'Still before pressing anything, drop the bare wheel into the track and roll
    it along. It must enter and run with about 0.5-1 mm spare each side; this is the
    check on the channel width nobody could measure. If it is pinched, the only change
    to make is wheel_w, down to channel width minus 1 mm, and it must stay at 15 mm
    or above or the 2 mm centre web between the bearings gets too thin. Also hold
    the blank against the pieces of the old wheel: as sent, the tread is flat with
    0.6 mm edge breaks. If the old tread had a centre groove or a crown to suit a
    rod track, say so and I will model that profile - do not run a flat tread on a
    grooved rod track, it will walk off.'
  parts:
  - wheel
  hardware: []
  tool: null
- n: '5'
  text: 'Check the bolt. M8 machine thread, 1.25 mm pitch - it must run into the nut
    by hand with no forcing; if it fights, the old roller''s stem was a fine thread
    and it will not suit these bearings'' clamp, so use the M8x30 from the list. Then
    check reach: measure the shank from under the head to the tip. It needs 22 mm
    (16 wheel + 6 of thread for the nut) for the direct clamp, and add the thickness
    of both cheeks if you are using the sleeves. A 24 mm shank takes the plain nut,
    a 26 mm one the lock nut; shorter, use the M8x30, and trim nothing - extra thread
    standing proud of the nut is harmless here.'
  parts: []
  hardware:
  - axle_bolt
  - axle_nut
  - axle_nut_lock
  tool: ruler or the feeler plate against the bolt
- n: '6'
  text: 'Press the bearings in, one from each face. Bear on the FLAT FACE of the outer
    ring only - never push on the inner ring or on the shield, or you wreck the bearing.
    Use the coupon as the pusher: stand a bearing on the seat, lay the coupon plate
    flat on its outer face and lean on the plate, so the force is spread square and
    the ring cannot tip. Press until you feel it seat on the shoulder; both rings
    should finish flush with the wheel faces and never proud of them.'
  parts:
  - wheel
  - fit_coupon
  hardware:
  - bearing_608
  tool: null
- n: '7'
  text: 'Build the clamp stack, head to tip. Arrangement A - open space beside each
    bearing: bolt head, one axle_sleeve, wheel with its bearings, second sleeve, washer,
    nut. Arrangement B - the bracket cheeks sit about 17 mm apart with the wheel between
    them: bolt head, washer, cheek, sleeve, bearing, wheel web, bearing, sleeve, washer,
    cheek, nut. Whichever it is, the rule is the same and it is the whole point of
    the design: the gripping force must arrive at the bearings'' INNER rings (through
    the sleeves, whose 12.2 mm diameter clears the spinning outer rings), and the
    wheel''s own faces must never be pinched by the cheeks or the nut.'
  parts:
  - wheel
  - axle_sleeve
  - bearing_head_side
  - bearing_nut_side
  hardware:
  - axle_bolt
  - axle_nut
  - axle_nut_lock
  - washer_m8
  tool: null
- n: '8'
  text: 'Tighten to the point where side play just disappears, then stop. Hand spanner
    plus finger torque, not a ratchet: the clamp lands on a 1.2 mm printed sleeve
    and a 2 mm printed web, and over-tightening crushes them, binds the wheel, and
    creeps the PLA within a week. Spin the wheel as you tighten - any notchiness or
    a sudden stiff spot means the clamp is on the wrong ring or you are a quarter
    turn too far. Use the ISO 10511 lock nut if you have the thread for it.'
  parts:
  - wheel
  - axle_sleeve
  hardware:
  - axle_nut
  - axle_nut_lock
  - axle_bolt
  tool: 13 mm spanner
- n: '9'
  text: 'Hang the door back. Check it sits at its old height (the wheel is 50 mm like
    the old one), rolls quietly along the track without binding, does not rub the
    channel sides, and does not wobble side to side more than about a millimetre.
    Load it, then spin by hand again: it should turn several times. If it drags, back
    the nut off a quarter turn - a dragged bearing eats the sleeve first.'
  parts:
  - wheel
  hardware:
  - axle_bolt
  tool: null
- n: '10'
  text: 'Maintenance, because this is PLA under a static load: check the nut after
    a week and then every few months - the sleeve and web will creep and the grip
    will go slack. Re-snug, and if the sleeves have taken a set, print fresh ones
    at the tab reading from step 3. If the wheel ever starts to walk loose on its
    bearings, the seat has opened up: reprint at the coupon''s tight bore (21.70)
    or press with the wheel warmed in hot water, and if you have it, a little cyano
    around the seat gap before pressing. The other rollers on the door are the same
    age and the same brittle - put a second wheel on the bed now while settings are
    proven: slice ''wheel'' 2 up, or duplicate it on the plate.'
  parts:
  - wheel
  - axle_sleeve
  - fit_coupon
  hardware:
  - bearing_608
  - axle_nut
  tool: null
