task: bearing-wheel
note: 'A 50 mm diameter, 16 mm wide roller carrying the owner''s two 608ZZ bearings
  back-to-back in one printed hub, spinning on their fixed M8 bolt. Load path is track
  -> tread -> 14 mm solid rim -> bearing outer race -> balls -> inner race -> bolt
  -> bracket, so the plastic is only ever in compression against the races and never
  in the clamp path. The hub is deliberately 7 + 2 + 7 = 16 mm so the bearings come
  home flush and self-register: an M8 nut bears on a circle of about 11.7 mm, inside
  the 12 mm inner race and 10.9 mm clear of the plastic face, so no small speed washer
  is needed and tightening cannot crush the bearing stack or pinch the printed spacer.
  Print flat, axis vertical: no supports, no span over 6.6 mm. The press-fit is the
  one printer-dependent number, which is what fit_coupon settles; the wheel''s seat
  diameter is a single param off that result. The two bearings and the M8 bolt are
  the owner''s own parts and are carried as params (bearing_od / bearing_width / bearing_bore
  / bolt_shank_d) rather than as catalog hardware, since the catalog takes no bearing
  reference.'
questions:
- text: How long is the M8 bolt, from under the head to the tip, and is it threaded
    all the way?
  answer: 'The measurement tool returned only one reading for every request: about
    8 mm across the shank, which confirms M8. Nothing came back on length.'
- text: Is the bracket a single strap with a hole, or a fork with two plates the 16
    mm wheel sits between, and how far apart are the plates?
  answer: 'No reading came back. Sized around it: the hub is 16 mm wide with the bearings
    flush, so nothing but steel races sits in the clamp path.'
- text: What is the track - flat strip, channel, or rail with a centre fin, and did
    the old wheel have a rib or groove running in it?
  answer: No reading came back. Went with 16 mm of flat tread chamfered both edges,
    which runs on a flat strip, a rounded rail, or inside a channel. If the old tread
    had a rib or a groove, say so and I will add it.
- text: Which coupon seat gripped best, and what did your bolt measure for length?
    Send those two back and I will lock in seat_interference and bolt_length.
  answer: null
params:
  bolt_length:
    value: 30
    unit: mm
    kind: hardware
    source: unknown
    note: 'Could not be measured - the measure tool kept returning the shank diameter.
      30 mm is the ISO 4762 length assumed: it must clear a 16 mm wheel plus up to
      8 mm of bracket tab and leave about 5 mm of thread for the lock nut. A longer
      bolt just pokes past the nut; anything under 25 mm will not reach through a
      double-tab bracket.'
  bolt_shank_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: The person measured 'about 8 mm across the shank' - so it is an M8 bolt
      and it goes straight through the 608 bores.
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 bore; measured 7.94 mm against a nominal 8 mm race bore. The bolt slips
      through the inner races.
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ outer diameter, 22.000 -0.008. The 21.22 mm reading on file was taken
      with the bearing pinched at an angle between the caliper jaws and is rejected.
  bearing_width:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: '608 width. This single number is what makes the hub work: 7 + 2 + 7 equals
      the 16 mm wheel width exactly.'
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: '''about 50 mm across'' - the old wheel, kept so the door hangs at its old
      height. 50 mm over a 22 mm bearing leaves a 14 mm rim of solid plastic, which
      is where the strength lives.'
  wheel_width:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: '''about 16 mm wide'' - the old wheel. Kept exactly, because the 16 mm width
      is also what sets the 2 mm integral spacer between the bearings.'
  seat_interference:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: 'Seat modelled at bearing_od - 0.15 mm on diameter = 21.85 mm: a firm hand
      press in PLA. THE COUPON DECIDES THIS - it tests 0.40 / 0.15 / -0.10 mm. Change
      this one param to whatever the coupon says grips.'
  axle_hole_d:
    value: 8.6
    unit: mm
    kind: design
    source: design
    note: 'Through-hole for the M8 bolt: shank + 0.6 mm, so it passes freely even
      if the hole prints a little small, and the wheel pulls off without drilling.'
  tread_chamfer:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Chamfer both tread edges. Stops the plastic edge digging into a channel
      rail and stops the corners chipping first.
  mouth_chamfer:
    value: 0.7
    unit: mm
    kind: design
    source: design
    note: Lead-in at each seat mouth so the bearing starts square and the steel race
      edge does not peel the first perimeter of the seat.
  lightening_hole_d:
    value: 8
    unit: mm
    kind: design
    source: design
    note: Five holes in the rim, 2 mm clear of the seat bore and 4 mm clear of the
      tread. Saves filament and time; the door load runs straight from tread to seat,
      which these do not touch.
  lightening_hole_count:
    value: 5
    unit: count
    kind: design
    source: design
    note: Five holes at 17 mm pitch radius leave 12 mm webs between them - far more
      than the door needs.
  lightening_hole_pitch_r:
    value: 17
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_seat_lo_d:
    value: 21.6
    unit: mm
    kind: design
    source: design
    note: Hard press, 0.40 mm interference.
  coupon_seat_mid_d:
    value: 21.85
    unit: mm
    kind: design
    source: design
    note: The wheel as submitted, 0.15 mm interference.
  coupon_seat_hi_d:
    value: 22.1
    unit: mm
    kind: design
    source: design
    note: 'Loose, -0.10 mm: shows what a miss feels like, so you can tell a good seat
      from a bad one.'
parts:
- id: wheel
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    import math\n    R  = p.wheel_od / 2.0\n    W  = p.wheel_width\n\
    \    bw = p.bearing_width\n    sd = (p.bearing_od - p.seat_interference) / 2.0\n\
    \    ax = p.axle_hole_d / 2.0\n    tc = p.tread_chamfer\n    mc = p.mouth_chamfer\n\
    \n    body = cq.Workplane(\"XY\").circle(R).extrude(W)\n\n    # Chamfer both tread\
    \ edges (the two big circular edges of the disc)\n    body = body.edges(\"<Z\"\
    ).chamfer(tc)\n    body = body.edges(\">Z\").chamfer(tc)\n\n    # Axle clearance\
    \ hole, through everything including the 2 mm spacer\n    axle = cq.Workplane(\"\
    XY\", origin=(0, 0, -1.0)).circle(ax).extrude(W + 2.0)\n    body = body.cut(axle)\n\
    \n    # Bearing seat opening from the bed-side face, blind, exactly one bearing\
    \ wide.\n    # Floor of this seat is the underside of the printed spacer web.\n\
    \    seat_a = cq.Workplane(\"XY\", origin=(0, 0, 0.0)).circle(sd).extrude(bw)\n\
    \    body = body.cut(seat_a)\n\n    # Second bearing seat from the top face, back-to-back\
    \ with the first.\n    seat_b = cq.Workplane(\"XY\", origin=(0, 0, W - bw)).circle(sd).extrude(bw\
    \ + 1.0)\n    body = body.cut(seat_b)\n\n    # Lead-in chamfers at both seat mouths\n\
    \    lead_a = cq.Workplane(\"XY\", origin=(0, 0, 0.0)).cone(sd + mc, sd, mc)\n\
    \    body = body.cut(lead_a)\n    lead_b = cq.Workplane(\"XY\", origin=(0, 0,\
    \ W - mc)).cone(sd, sd + mc, mc)\n    body = body.cut(lead_b)\n\n    # Five lightening\
    \ holes through the width, clear of seat bore and tread\n    n = int(p.lightening_hole_count)\n\
    \    for i in range(n):\n        a = 2.0 * math.pi * i / n\n        x = p.lightening_hole_pitch_r\
    \ * math.cos(a)\n        y = p.lightening_hole_pitch_r * math.sin(a)\n       \
    \ h = cq.Workplane(\"XY\", origin=(0, 0, -1.0)).circle(p.lightening_hole_d / 2.0).extrude(W\
    \ + 2.0)\n        body = body.cut(h.translate(cq.Vector(x, y, 0)))\n\n    return\
    \ body"
  print_orientation: 'Lying flat: the closed bed-side face of the wheel on the bed,
    hub axis vertical along +Z. No supports - the only horizontal span is the 2 mm
    integral spacer bridging a 6.6 mm annulus between the seat wall and the axle hole,
    far inside the 50 mm this printer bridges cleanly.'
  use_orientation: In service the hub axis is horizontal, along the M8 bolt (the bolt
    is parallel to the floor). The wheel's z-axis becomes the axle line, so the two
    bearing seats sit either side of the roller bracket and the tread sits in the
    track.
- id: fit_coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    L, Wd, H = 96.0, 30.0, 10.0\n    d = p.bearing_width\n\
    \    blk = cq.Workplane(\"XY\").box(L, Wd, H, centered=(True, True, False))\n\
    \    blk = blk.edges(\"<Z\").fillet(4.0)\n    diameters = [p.coupon_seat_lo_d,\
    \ p.coupon_seat_mid_d, p.coupon_seat_hi_d]\n    for i, dia in enumerate(diameters):\n\
    \        x = -35.0 + 25.0 * i\n        c = cq.Workplane(\"XY\", origin=(x, 0.0,\
    \ H - d)).circle(dia / 2.0).extrude(d + 1.0)\n        blk = blk.cut(c)\n     \
    \   lead = cq.Workplane(\"XY\", origin=(x, 0.0, H - 0.7)).cone(dia / 2.0, dia\
    \ / 2.0 + 0.7, 0.7)\n        blk = blk.cut(lead)\n    # bolt clearance check,\
    \ free end of the coupon\n    thru = cq.Workplane(\"XY\", origin=(35.0, 0.0, -1.0)).circle(p.axle_hole_d\
    \ / 2.0).extrude(H + 2.0)\n    blk = blk.cut(thru)\n    return blk"
  print_orientation: Lying flat on its large face, z=0 on the bed - the same layer
    direction as the wheel, so the three test seats print the way the wheel's do.
    About 15 minutes at 0.2 mm; print it before the wheel.
  use_orientation: Flat on the bench while you push a 608 into each seat to settle
    the interference, and slide the M8 bolt through the end hole to check clearance.
hardware:
- id: axle_bolt
  ref: ISO 4762 M8x30
  qty: 1
- id: locknut
  ref: ISO 10511 M8
  qty: 1
- id: washer_h
  ref: ISO 7089 M8
  qty: 1
- id: washer_n
  ref: ISO 7089 M8
  qty: 1
joints:
- id: axle
  fastener: axle_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel
    feature: axle_hole
    role: clearance
  nut: locknut
  external: the roller bracket's axle hole - the bolt is held there, so the bracket
    and not the plastic carries the door's weight into the axle; both 608 inner races
    bear on this shank
criteria:
- id: seat_a_fit
  part: wheel
  feature: seat_a
  relation: contains
  hardware: null
  clearance_mm: null
  params:
  - bearing_od
  - seat_interference
  - bearing_width
  check:
    method: coupon
    ref: fit_coupon
    description: A 608 must go into seat_a with firm thumb pressure and no tapping,
      and must not walk out under the door's load. The coupon's middle seat is the
      same diameter, printed the same way.
- id: seat_b_fit
  part: wheel
  feature: seat_b
  relation: contains
  hardware: null
  clearance_mm: null
  params:
  - bearing_od
  - seat_interference
  - bearing_width
  check:
    method: coupon
    ref: fit_coupon
    description: Second seat, a blind bore from the opposite face over a bridged roof;
      check it grips like the coupon's middle seat.
- id: spacer_positions_bearings
  part: wheel
  feature: spacer
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - wheel_width
  - bearing_width
  check:
    method: measure
    ref: null
    description: 'Push both bearings home: their outer faces end flush with the wheel''s
      two side faces. If they are flush, the nut can never crush the bearings and
      never touches plastic.'
- id: axle_clearance
  part: wheel
  feature: axle_hole
  relation: clears
  hardware: null
  clearance_mm: 0.3
  params:
  - axle_hole_d
  - bolt_shank_d
  check:
    method: coupon
    ref: fit_coupon
    description: The M8 shank must slide through the 8.6 mm hole with no force (0.3
      mm radial clearance) so the wheel comes off without drilling. Test at the coupon's
      through-hole.
- id: nut_clears_bearing_and_plastic
  part: wheel
  feature: seat_a_floor
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - bearing_od
  - wheel_width
  - bearing_width
  check:
    method: none
    ref: null
    description: Both bearing faces sit proud of the plastic side faces by no more
      than a hair, so the lock nut's ~11.7 mm bearing circle lands on the 12 mm inner
      race and never on plastic.
- id: tread_in_track
  part: wheel
  feature: tread
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - tread_chamfer
  check:
    method: measure
    ref: null
    description: 50 mm of flat tread, 1.5 mm chamfer each edge. The door must hang
      at its old height and the tread sit square in the track with both chamfers clear.
      The track could not be measured, so check with a straightedge across the two
      rollers.
- id: web_not_undersized
  part: wheel
  feature: seat_a_floor
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - bearing_od
  - seat_interference
  - wheel_width
  check:
    method: none
    ref: null
    description: 'The seat floors are the underside of a 2 mm bridged spacer: expect
      them slightly rippled and about 0.1 mm shallower than nominal. Press the bearings
      home and trust flushness, not the depth.'
manual:
- n: '1'
  text: 'You need two things that are not in the hardware list but which you already
    own: the two 608 skateboard bearings (22 x 7 x 8 mm) and your M8 bolt. Print fit_coupon
    first - 15 minutes, 0.2 mm, 3 perimeters, no supports, lying flat. Push one 608
    into each of its three seats. The middle seat (21.85 mm) is what the wheel is
    modelled with. Take the largest seat that still needs real thumb pressure to start
    and still holds the bearing when you turn the coupon upside down. If the 21.60
    mm seat is the one that grips, set seat_interference to 0.40 before printing the
    wheel - that is one number in the wheel''s params.'
  parts:
  - fit_coupon
  hardware: []
  tool: hands
- n: '2'
  text: In the same coupon, slide the M8 bolt through the 8.6 mm hole at the free
    end. It should move with no force at all. If your bolt reads fat (some M8 bolts
    measure 8.1 mm across), widen axle_hole_d to 8.8 before printing the wheel.
  parts:
  - fit_coupon
  hardware: []
  tool: vernier
- n: '3'
  text: Print the wheel lying flat exactly as oriented - bed face down, hub axis vertical,
    no supports. Use 5-6 perimeter walls and 40-50% gyroid; the only thing that matters
    is that the walls gripping the bearing outer races are solid and round. If the
    door has two rollers, print the second wheel on the same plate - the other one
    will go next year.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '4'
  text: 'Knock up any stringing or a lifted first-layer lip inside the two seat floors:
    run a 22 mm socket, or a length of dowel, through each seat from the outside.
    Wipe the axle hole clear.'
  parts:
  - wheel
  hardware: []
  tool: 22 mm socket or 8 mm drift
- n: '5'
  text: Press the bearings in using the bolt as the press - never hammer them. Bolt
    through the wheel's axle hole from one side; slip a 608 onto the bolt on the other
    side with its face square to the seat; M8 washer on top of the bearing; then the
    lock nut. Tighten the nut and it draws the bearing in square and home. Repeat
    from the opposite face for the second bearing. Stop as soon as both bearing faces
    sit flush with the plastic side faces - that is fully home, and the 2 mm spacer
    will not let anything over-crush.
  parts:
  - wheel
  hardware: []
  tool: spanner on the M8 nut
- n: '6'
  text: Clean the bracket and its axle hole. Roll the bolt on a bench to check it
    is straight, and polish any score marks on the shank with emery cloth - the wheel
    now spins through the bearings on that surface, so it wants to be smooth and clean.
  parts: []
  hardware: []
  tool: emery cloth
- n: '7'
  text: 'Fit it: bolt through the bracket hole, through the wheel, M8 washer, nylon-insert
    lock nut. Tighten only until the wheel still spins freely with no sideways wobble
    - a lock nut holds at far lower torque than a plain one, which is exactly what
    you want here. Give it a spin: it should turn 5-10 revolutions on its own.'
  parts:
  - wheel
  hardware: []
  tool: 13 mm spanner
- n: '8'
  text: Hang the door and check the tread meets the track squarely and the door hangs
    at its old height. Then listen for a click once per revolution - that means the
    tread is running slightly out of round from a lifted first layer, and the fix
    is more perimeters next time, not a different design.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '9'
  text: 'Recheck after a week: finger the lock nut for slack and look at the tread
    for one-sided wear. PLA creeps slowly under standing load, so if the door has
    settled, retorque lightly. If the bearings have begun to mark or loosen in their
    seats, reprint with seat_interference moved up by 0.1 mm.'
  parts:
  - wheel
  hardware: []
  tool: null
