task: bearing-wheel
note: 'Design idea: a single printed wheel that spins on your existing M8 bolt, with
  the two 608 bearings'' outer races captured in light press-fit pockets (Ø21.9) and
  their inner races riding on the bolt. The 2.6 mm integral web in the middle does
  the job of a bearing spacer, so there is no separate sleeve to lose.


  The one thing you couldn''t measure - the gap between the fork plates - is designed
  out rather than guessed: the wheel is 15.6 mm wide (0.4 under the old 16) and each
  pocket is 6.5 mm deep, so the bearings stand 0.5 mm PROUD of the wheel''s faces.
  The plates therefore bite on the bearings, never on the printed plastic, so the
  wheel can''t be pinched or rub for any gap between roughly 15.8 and 17.5 mm. Axial
  capture is positive (plates outboard, web inboard), so nothing depends on the press
  fit being perfect.


  Printed lying flat, axis vertical: the bearing seats and the tread are continuous
  hoop perimeters, so the door''s radial load runs along the print lines; the only
  bridged surface is the 21.9 mm pocket floor, well inside the 50 mm bridge this printer
  already handles.


  Hardware note: the axle is your own M8 bolt - I referenced ISO 4762 M8x30 because
  that''s the closest catalog entry (Ø8 shank, 13 mm head) and 30 mm gives enough
  grip past the fork + washers + lock nut. Any M8 bolt of ~28-35 mm under-head length
  works; reuse yours if it fits. The lock nut (ISO 10511 M8) is there because a sliding
  door backs off a plain nut.


  Deliberate choices you may want changed: tread left flat with 2 mm chamfers because
  I couldn''t measure the track or check for a guiding rib; wheel kept at your stated
  Ø50 since that sets door height.'
questions:
- text: How wide is the gap between the two plates of the fork really (or the outside
    span across them plus one plate thickness)? That tells me whether to make the
    bearings proud by more or less than 0.5 mm.
  answer: Could not measure - both attempts returned only the bolt's 8 mm shank. The
    design is tolerant of 15.8-17.5 mm, so no answer needed.
- text: Is the old wheel's tread flat, rounded, or grooved down the middle, and is
    Ø50 right? A centre groove or a track rib would need matching in the new wheel.
  answer: Could not measure. Tread modelled flat, 15.6 mm band, 2 mm x 45 deg chamfers,
    per the stated 'about 50 mm across'.
- text: Does the fork have one wheel position or two, and is the bolt clamped with
    a nut on the far side?
  answer: Unknown; manual step 8 covers it (second wheel + bearing pair + bolt per
    position).
- text: How long is the bolt under the head, and what shape/size is its head? An M8
    lock nut (8 mm tall) plus two washers (1 mm) needs about 10 mm of thread past
    the far plate, and the head has to clear the bracket.
  answer: Unknown - only the shank reading came back. Manual step 5 has them check
    protrusion and chase the threads.
params:
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: 608/61808 outer race 22.000 -0.008. Their caliper read ~22; the earlier
      21.22 reading was the bearing pinched at an angle.
  bearing_width:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 width 7.0. Their reading agreed. Sets pocket depth and the web.
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: Inner race bore, slip fit on the M8 shank.
  bolt_shank_d:
    value: 8
    unit: mm
    kind: world
    source: measured
    note: Their M8 bolt, read 'about 8 mm across the shank' - the only measurement
      they could take.
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: '''about 50 mm across'' for the old wheel. This sets how high the door hangs,
      so it is the one number worth re-checking; change it and nothing else moves.'
  wheel_width:
    value: 15.6
    unit: mm
    kind: design
    source: design
    note: 0.4 mm under the old 16 mm so the side faces can never touch the fork plates,
      whatever the unknown gap turns out to be.
  bearing_pocket_depth:
    value: 6.5
    unit: mm
    kind: design
    source: design
    note: 'Bearing width 7.0 minus 0.5, so each bearing stands 0.5 mm proud of the
      wheel''s faces: the plates clamp the bearings, not the plastic. Web = wheel_width
      - 2 x pocket_depth = 2.6 mm.'
  bearing_seat_d:
    value: 21.9
    unit: mm
    kind: design
    source: design
    note: '0.1 mm under the bearing OD - a light press fit, tuned against the coupon.
      Retention does not depend on it: the plates and the web capture the bearings,
      so a slip fit still works.'
  axle_bore_d:
    value: 11
    unit: mm
    kind: design
    source: design
    note: Through-bore in the web; clears the M8 shank and its threads by 1.5 mm radial
      so nothing in the wheel bears on the bolt.
  tread_chamfer:
    value: 2
    unit: mm
    kind: design
    source: design
    note: '45 degrees both tread edges: rolls over track seams and stops the edges
      biting into the channel.'
  seat_chamfer:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Lead-in at each pocket mouth so the outer race starts squarely.
  coupon_bore_step:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: Coupon test bores at seat_d - 0.15 / seat_d / seat_d + 0.15 = 21.75 / 21.90
      / 22.05.
  bracket_gap:
    value: 16.4
    unit: mm
    kind: world
    source: guessed
    note: 'Distance between the fork plates'' inner faces - they could not measure
      it. NOT used to size anything: the design works for any gap from ~15.8 to ~17.5
      mm. 16.4 is just the likely value for a fork that held a 16 mm wheel.'
parts:
- id: wheel
  role: final
  material: PLA (their high-speed black PLA)
  code: "def build(p):\n    R  = p.wheel_od / 2.0\n    W  = p.wheel_width\n    dp\
    \ = p.bearing_pocket_depth\n    rs = p.bearing_seat_d / 2.0\n    rb = p.axle_bore_d\
    \ / 2.0\n    ct = p.tread_chamfer\n    ce = p.seat_chamfer\n\n    # meridian section:\
    \ local x = radius, local y = along the wheel axis (= global Z, bed at 0)\n  \
    \  pts = [\n        (rb, dp),            # bore wall meets the left pocket floor\n\
    \        (rs, dp),            # left pocket floor out to the seat wall\n     \
    \   (rs, ce),            # up the seat wall to the entry chamfer\n        (rs\
    \ + ce, 0.0),      # entry chamfer opens onto the face\n        (R - ct, 0.0),\
    \       # across the face to the tread chamfer\n        (R, ct),             #\
    \ tread chamfer\n        (R, W - ct),         # flat tread band\n        (R -\
    \ ct, W),         # top tread chamfer\n        (rs + ce, W),        # across the\
    \ right face\n        (rs, W - ce),        # right entry chamfer\n        (rs,\
    \ W - dp),        # down the right seat wall to its floor\n        (rb, W - dp),\
    \        # right pocket floor back to the bore\n    ]\n    wp = cq.Workplane(\"\
    XZ\")\n    wp = wp.moveTo(pts[0][0], pts[0][1])\n    for q in pts[1:]:\n     \
    \   wp = wp.lineTo(q[0], q[1])\n    wp = wp.close()\n    return wp.revolve(360)"
  print_orientation: 'Lying flat on one side face: the wheel axis (and the M8 bolt
    axis) is vertical, straight up off the bed. z=0 is the wheel''s left side face.
    No supports, no brim needed (50 mm dia footprint).'
  use_orientation: As printed, global Z is the wheel axis. In service that axis is
    the horizontal M8 bolt through the door's roller fork, so the part is tipped 90
    degrees; nothing about the geometry changes.
- id: bearing_fit_coupon
  role: coupon
  material: PLA (same spool as the wheel)
  code: "def build(p):\n    step  = p.coupon_bore_step\n    d     = [p.bearing_seat_d\
    \ - step, p.bearing_seat_d, p.bearing_seat_d + step]\n    depth = p.bearing_width\
    \ - 1.0\n    L     = 80.0\n    Wb    = p.bearing_od + 8.0\n    H     = depth +\
    \ 2.0\n    blk   = cq.Workplane(\"XY\").box(L, Wb, H, centered=(True, True, False))\n\
    \    res   = blk\n    for x, dia in ((-26.0, d[0]), (0.0, d[1]), (26.0, d[2])):\n\
    \        peg = (cq.Workplane(\"XY\")\n               .workplane(offset=H - depth\
    \ - 0.5)\n               .center(x, 0.0)\n               .circle(dia / 2.0)\n\
    \               .extrude(depth + 0.5))\n        res = res.cut(peg)\n    return\
    \ res"
  print_orientation: Flat on the bed, the three test bores pointing up, so they print
    as vertical holes with a bridged floor exactly like the wheel's pockets. Supports
    off.
  use_orientation: Bench gauge only - not part of the door. Tightest bore at one end,
    loosest at the other, middle bore equals the wheel's pockets.
hardware:
- id: brg608
  ref: 608ZZ
  qty: 2
- id: m8_bolt
  ref: ISO 4762 M8x30
  qty: 1
- id: m8_locknut
  ref: ISO 10511 M8
  qty: 1
- id: m8_washer
  ref: ISO 7089 M8
  qty: 2
joints:
- id: axle_joint
  fastener: m8_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel
    feature: axle_bore
    role: clearance
  - part: wheel
    feature: bearing_seat_left
    role: insert
  nut: m8_locknut
  external: 'the door''s roller fork: shank passes the fork''s ~9 mm clearance holes,
    head and lock nut seat OUTSIDE the two plates over the washers'
criteria:
- id: seat_grips_bearing
  part: wheel
  feature: bearing_seat_left / bearing_seat_right
  relation: contains
  hardware: brg608
  clearance_mm: null
  params:
  - bearing_seat_d
  - bearing_od
  - bearing_width
  - bearing_pocket_depth
  check:
    method: coupon
    ref: bearing_fit_coupon
    description: The middle coupon bore is the same size as the wheel's pockets. The
      bearing must enter it under firm thumb pressure and stay put when tipped. If
      it will not start, the wheel's seats need opening; if it drops through freely,
      the seats are a slip fit and the bearings live on the bracket plates instead.
- id: bearing_sits_proud
  part: wheel
  feature: bearing_seat_left
  relation: seats
  hardware: brg608
  clearance_mm: null
  params:
  - bearing_width
  - bearing_pocket_depth
  - wheel_width
  check:
    method: measure
    ref: null
    description: With both bearings pushed home against the pocket floors, each bearing's
      outer face must stand ~0.5 mm PROUD of the wheel's side faces (6.5 deep pocket
      vs 7.0 wide bearing). That is what keeps the fork plates on the bearings and
      off the printed plastic.
- id: wheel_clears_fork
  part: wheel
  feature: face_left / face_right
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - wheel_width
  - bracket_gap
  check:
    method: measure
    ref: null
    description: 'Drop the wheel into the fork: the side faces must not touch either
      plate, and because the bearings stand proud the plates touch the bearings first.
      At 15.6 mm wide, a fork that took the old 16 mm wheel has room; if it binds,
      rub the faces on 240 paper on a flat bench.'
- id: axle_clears_bore
  part: wheel
  feature: axle_bore
  relation: clears
  hardware: m8_bolt
  clearance_mm: 1.5
  params:
  - axle_bore_d
  - bolt_shank_d
  check:
    method: measure
    ref: null
    description: 'Ø11.0 bore over the Ø8 shank: the bolt, including its threaded part,
      passes the wheel''s centre without touching, so no door load is carried by plastic
      on steel.'
- id: web_stops_bearings
  part: wheel
  feature: bearing_pocket_floor_left
  relation: engages
  hardware: brg608
  clearance_mm: null
  params:
  - wheel_width
  - bearing_pocket_depth
  - bearing_width
  check:
    method: none
    ref: null
    description: The 2.6 mm integral web is the inboard stop for both outer races
      and doubles as the spacer that holds the two inner races apart - no separate
      sleeve needed.
- id: tread_on_track
  part: wheel
  feature: tread
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - tread_chamfer
  check:
    method: none
    ref: null
    description: 'Flat tread band with 2 mm x 45 deg chamfers, Ø50 like the old wheel.
      Roll the door by hand, then look at where the tread polishes: if the wear band
      drifts to one edge the track wants a guiding rib or groove - tell me and I will
      add it.'
- id: print_holds_load
  part: wheel
  feature: seat_wall
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - bearing_seat_d
  - wheel_od
  check:
    method: none
    ref: null
    description: 14 mm of solid PLA from the bearing seat to the tread, printed as
      continuous hoop perimeters so the door's radial load runs along the print lines
      rather than across them. 4 perimeters, 25% infill, 3+ top/bottom shells.
manual:
- n: '1'
  text: Print both parts in PLA, 0.2 mm layers, 4 perimeters, 3 top/bottom shells,
    25% infill, supports OFF. The wheel lies flat on one side face with its axis vertical;
    the coupon lies flat with its three bores up. Print the coupon by itself first
    - its only job is to check your bearing fit before you commit to the wheel.
  parts:
  - bearing_fit_coupon
  - wheel
  hardware: []
  tool: null
- n: '2'
  text: 'Fit test. Push a 608 bearing into the MIDDLE coupon bore (Ø21.90, the same
    size as the wheel''s pockets). You want it to need firm thumb pressure and to
    stay put when you tip the block over. The end bores are references: 21.75 is ''too
    tight'', 22.05 is ''too loose''. If the bearing will not start in 21.90, your
    printer runs undersize - wrap a bearing on a strip of 240 paper, spin it in each
    pocket a few strokes, or chase the pockets with a 22 mm drill until it matches
    the coupon. If it drops straight through 21.90, the seats are a slip fit: still
    usable, because step 6 lets the fork plates capture the bearings, but a drop of
    superglue around each pocket wall will keep them from creeping.'
  parts:
  - wheel
  - bearing_fit_coupon
  hardware:
  - brg608
  tool: null
- n: '3'
  text: Press the bearings in square. Slide the M8 bolt through the wheel's centre
    bore and hold it there; drop a bearing into each pocket, chamfered side facing
    out, and press each one home onto the bolt until it hits the pocket floor. The
    bolt keeps the two bores coaxial so nothing goes in crooked. Pull the bolt out
    afterwards. Both bearings must finish standing about 0.5 mm PROUD of the wheel's
    side faces - that is deliberate, not a mistake.
  parts:
  - wheel
  hardware:
  - brg608
  - m8_bolt
  tool: null
- n: '4'
  text: Dry-fit in the door. Drop the wheel into the fork between the two plates.
    It is 15.6 mm wide (the old one was 16), so the plates should close over it without
    touching the printed faces - check with a strip of paper or a feeler. If it binds,
    lay 240 paper flat on a bench and rub the wheel's two side faces until it drops
    in freely.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '5'
  text: Sort the bolt. Screw the lock nut all the way in by hand first to chase out
    rust or paint from the fork holes and the threads, and check there is no burr
    at the bolt tip (the bearings slide over that part). Confirm the head is bigger
    than the fork hole and that about 10 mm of thread sticks past the far plate once
    the wheel is in; if the bolt is short, swap in an M8 x 30.
  parts: []
  hardware:
  - m8_bolt
  - m8_locknut
  - m8_washer
  tool: wire brush, M8 nut as a chasing nut
- n: '6'
  text: 'Assemble: bolt through the fork from the head side, then ISO 7089 M8 washer
    OUTSIDE the plate, then the wheel, then the far plate, then washer, then the ISO
    10511 M8 nylon-insert lock nut. Tighten only until the wheel''s side-to-side wobble
    just stops, then back off about an eighth of a turn. The clamp must be taken up
    by the plates biting on the bearing faces and on the printed 2.6 mm web between
    them - never by squeezing the wheel''s faces. Flick it: it should spin 3-4 free
    turns.'
  parts:
  - wheel
  hardware:
  - m8_bolt
  - m8_locknut
  - m8_washer
  - brg608
  tool: 13 mm spanner (M8, af 13)
- n: '7'
  text: 'Hang the door and check two things: it sits at its old height (Ø50 tread
    - if it hangs high or low, reprint with wheel_od changed; nothing else moves),
    and the wheel rolls in the track without chattering. Check the spin again after
    a week, since PLA takes a few cycles to bed in.'
  parts:
  - wheel
  hardware: []
  tool: null
- n: '8'
  text: 'Housekeeping: if the fork has a second wheel position, print a second wheel
    and get another bearing pair, bolt and lock nut - this design is one wheel per
    bolt. PLA softens around 60 C, so keep it away from a hot attic or boiler run,
    and put grease on the track rather than on the bearings, which are ZZ-sealed.'
  parts:
  - wheel
  hardware:
  - brg608
  tool: null
