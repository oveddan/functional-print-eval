task: bearing-wheel
note: 'Yes - it works well. Summary, plus the two judgement calls I had to make because
  the bracket and the track couldn''t be measured.


  MECHANISM: a D50 x 15.8 mm wheel with two blind 21.85 x 7.2 mm pockets, one from
  each face, separated by a 1.4 mm centre web. A 608 presses into each pocket and
  the whole wheel spins on the bearing outer races. The M8 bolt goes through the D9.2
  mm hole in the web with 0.6 mm of radial play, and the bolt head/nut clamp the two
  bracket cheeks together - NOT the wheel. That is the whole trick: if the nut could
  squeeze the wheel''s faces it would preload the bearings and the wheel would skid
  along the track and scuff the PLA. The wheel is deliberately 0.2 mm narrower than
  your old one, and the bearings sit 0.2 mm below each face, for the same reason.


  Load path is short and stout: tread -> ~14 mm of printed ring -> bearing outer race,
  so the pocket walls are nowhere near their limit under a closet door.


  Print it flat on one face, axis vertical. That orientation is not cosmetic: the
  bearing bores and the bolt hole print as vertical cylinders (round, on-size, no
  bridging) and the 50 mm rolling surface prints as vertical perimeter walls, which
  is the smoothest possible tread. No supports; nothing overhangs beyond about 34
  degrees.


  GUESSES, and how they get checked: (1) bearing pocket fit, bolt clearance and bracket
  slot width are all verified by the fit_coupon before the wheel is printed - the
  coupon''s pocket is the same diameter and depth, its hole the same diameter, and
  its tab exactly the finished wheel width. (2) The track profile is the one thing
  I truly could not verify, so the tread is flat with a shallow 5.4 x 1.8 mm centre
  groove: it straddles a raised fin, still runs on two solid 5.2 mm bands on a flat
  bar or a tube, and does no harm in a U channel. groove_depth / groove_bottom_w are
  params and PLA files easily, so it is cheap to adapt.


  ABOUT THE FASTENER: you said you already have the M8 bolt, so treat "ISO 4762 M8x30"
  as the minimum spec - it must clear both cheeks plus the 15.8 mm wheel plus one
  nut with about 8 mm of thread to spare. A longer bolt is harmless (it just protrudes)
  as long as it does not reach anything behind the door. Its head is captive on the
  bracket, not on the printed part, so head style does not matter to this design.


  TUNE THESE IF THE COUPON SAYS SO: press_fit 0.15 diametral interference (0.25-0.35
  if a bearing can be spun or pushed out, 0.05 if it cannot be started by hand), hub_clearance
  1.2, side_clearance_total 0.2. Long-term watch item: PLA creeps under steady load,
  so a bearing can slowly walk outward - step 13 checks that, step 9 fixes it.'
questions:
- text: How long is the M8 bolt, head to tip? It has to clear both bracket cheeks
    plus the 15.8 mm wheel plus one nut, with about 8 mm of thread to spare.
  answer: null
- text: 'What does the track look like under the wheel: flat bar, round tube, a U
    channel the wheel sits inside, or a thin fin it must straddle? If it is a fin
    taller than 1.4 mm or wider than 3 mm across the top, the tread groove needs resizing.'
  answer: null
- text: What is the gap between the two bracket cheeks the wheel sits between (inner
    faces)? Under 15.8 mm and the web has to come down so the bearings sit flush with
    the faces instead of recessed.
  answer: null
- text: Is the bolt held by a nut on the far side, or does it thread into a tapped
    hole in the bracket? Either works here - I listed an ISO 10511 M8 lock nut in
    case the original nut is missing or the bracket is not tapped.
  answer: null
params:
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: measured ~22 mm; 608ZZ datasheet OD 22.000 -0.008
  bearing_width:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: measured ~7 mm; 608ZZ datasheet width 7.0
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: '608ZZ bore, nominal 8.0 (the earlier 7.94 reading was the caliper pinching
      the race at an angle). Informational only: the bolt passes through it, nothing
      is modelled on it'
  bolt_shank_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: your M8 bolt's shank measured ~8 mm
  bolt_length:
    value: null
    unit: mm
    kind: hardware
    source: unknown
    note: not measured. Must clear both bracket cheeks + the 15.8 mm wheel + one M8
      nut, with ~8 mm of thread engagement; ISO 4762 M8x30 is the minimum spec, longer
      is harmless
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: your old wheel was 'about 50 mm across'; matching it keeps the door riding
      at its old height
  old_wheel_width:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: your old wheel was 'about 16 mm wide' - consistent with two 608s (14 mm)
      plus a web
  bracket_slot_width:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: inner width between the two cheeks the wheel sits between, could not be
      measured. The wheel is 0.2 mm under the old wheel's width as the best available
      proxy, and the coupon's tab gauges it
  track_profile:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: 'shape of the running surface could not be measured. Tread is flat with
      a shallow 5.4 x 1.8 mm centre groove: straddles a fin, still runs on two solid
      bands on a flat bar, a tube, or a channel bottom'
  press_fit:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: 'diametral interference on the bearing OD. Tune with the coupon: 0.25-0.35
      if a bearing can be spun or pushed out, 0.05 if it cannot be started by hand'
  recess:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: pockets are 0.2 mm deeper than the bearing, so the outer races sit below
      the wheel faces and a bracket cheek can never touch a race
  side_clearance_total:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: wheel is 15.8 mm wide against the old 16 mm, so the nut clamps the bracket
      cheeks, not the wheel
  hub_clearance:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: 'centre web hole = 9.2 mm over an 8 mm shank: the wheel floats on the bolt
      and is only located sideways by this hole'
  mouth_chamfer:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: 45-degree lead-in at each pocket mouth so a bearing starts square
  edge_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: breaks the tread edges so they cannot dig into a rail lip
  groove_open_w:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: groove width at the running surface
  groove_bottom_w:
    value: 3
    unit: mm
    kind: design
    source: design
    note: groove width at the bottom; the 1.2 mm per-side difference makes sloped
      flanks that print without supports
  groove_depth:
    value: 1.8
    unit: mm
    kind: design
    source: design
    note: how much groove depth is available for a fin or ridge in the track
  plate_t:
    value: 3
    unit: mm
    kind: design
    source: design
    note: coupon base plate thickness
  coupon_wall:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: coupon ring wall around the test pocket
  coupon_headroom:
    value: 1
    unit: mm
    kind: design
    source: design
    note: solid floor under the coupon's test pocket, so it is a blind pocket like
      the wheel's
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    # axis = Z, z=0 is one flat face of the wheel (the face\
    \ that sits on the bed)\n    R    = p.wheel_od / 2.0                      # tread\
    \ radius\n    po_r = (p.bearing_od - p.press_fit) / 2.0    # pocket radius, press\
    \ fit on the 608 OD\n    pd   = p.bearing_width + p.recess            # blind\
    \ pocket depth (bearing sits recessed)\n    W    = p.old_wheel_width - p.side_clearance_total\n\
    \    hb_r = (p.bolt_shank_d + p.hub_clearance) / 2.0\n    cm   = p.mouth_chamfer\
    \                       # 45-degree lead-in at each pocket mouth\n    tc   = p.edge_chamfer\
    \                        # tread edge break\n    gd   = p.groove_depth\n    hz\
    \   = W / 2.0\n    pts = [\n        (hb_r, pd),              # web face, pocket\
    \ A side\n        (po_r, pd),              # pocket A floor\n        (po_r, cm),\
    \              # pocket A wall\n        (po_r + cm, 0.0),        # pocket A mouth\
    \ chamfer\n        (R - tc, 0.0),           # flat face\n        (R, tc),    \
    \             # tread edge chamfer\n        (R, hz - p.groove_open_w / 2.0), \
    \        # lower tread band\n        (R - gd, hz - p.groove_bottom_w / 2.0), \
    \ # groove flank\n        (R - gd, hz + p.groove_bottom_w / 2.0),  # groove bottom\n\
    \        (R, hz + p.groove_open_w / 2.0),         # groove flank\n        (R,\
    \ W - tc),             # upper tread band\n        (R - tc, W),             #\
    \ tread edge chamfer\n        (po_r + cm, W),          # flat face\n        (po_r,\
    \ W - cm),          # pocket B mouth chamfer\n        (po_r, W - pd),        \
    \  # pocket B wall\n        (hb_r, W - pd),          # pocket B floor\n    ]\n\
    \    wp = cq.Workplane(\"XZ\").polyline(pts).close().revolve(360)\n    s = wp.val()\n\
    \    bb = s.BoundingBox()\n    if abs(bb.zmin) > 1e-6:\n        s = s.translate((0,\
    \ 0, -bb.zmin))\n    return s"
  print_orientation: 'Lying on one flat face: z=0 is a wheel face, the wheel axis
    (and the bolt axis) is vertical, perpendicular to the bed. The part is symmetric
    so either face can be down. No supports, nothing to bridge.'
  use_orientation: 'As modelled: Z is the axle axis. Either flat face sits outboard
    toward a bracket cheek; the 1.4 mm centre web with the 9.2 mm hole is where the
    M8 bolt passes through.'
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    # one print that checks the three things I had to guess:\n\
    \    #  1) bearing pocket diameter and depth, 2) bolt clearance in the centre\
    \ hole,\n    #  3) whether the finished wheel width fits the bracket slot (the\
    \ tab is exactly wheel width)\n    po_r = (p.bearing_od - p.press_fit) / 2.0\n\
    \    pd   = p.bearing_width + p.recess\n    W    = p.old_wheel_width - p.side_clearance_total\n\
    \    hb_r = (p.bolt_shank_d + p.hub_clearance) / 2.0\n    t    = p.plate_t\n \
    \   hr   = p.coupon_headroom\n    cx   = -12.0\n    base = cq.Workplane(\"XY\"\
    ).box(56.0, 33.0, t, centered=(True, True, False))\n    ring = cq.Workplane(\"\
    XY\", origin=(cx, 0.0, t)).circle(po_r + p.coupon_wall).extrude(pd + hr)\n   \
    \ tab  = cq.Workplane(\"XY\", origin=(15.0, 0.0, t)).box(16.0, W, pd + hr, centered=(True,\
    \ True, False))\n    part = base.union(ring).union(tab)\n    # test pocket: same\
    \ diameter, same depth as the real wheel's pockets, blind like them\n    pocket\
    \ = cq.Workplane(\"XY\", origin=(cx, 0.0, t + hr)).circle(po_r).extrude(pd + 1.0)\n\
    \    # centre hole: same diameter as the wheel's web hole, through the plate\n\
    \    hub = cq.Workplane(\"XY\", origin=(cx, 0.0, -1.0)).circle(hb_r).extrude(t\
    \ + hr + pd + 3.0)\n    part = part.cut(pocket).cut(hub)\n    s = part.val()\n\
    \    bb = s.BoundingBox()\n    if abs(bb.zmin) > 1e-6:\n        s = s.translate((0,\
    \ 0, -bb.zmin))\n    return s"
  print_orientation: Flat on the bed, z=0 is the underside of the 3 mm base plate;
    the test pocket bore and the centre hole are both vertical. No supports.
  use_orientation: Used as printed, on the bench and at the door. Never fitted to
    the door - discard once the three fits are confirmed.
hardware:
- id: bearing
  ref: 608ZZ
  qty: 2
- id: axle_bolt
  ref: ISO 4762 M8x30
  qty: 1
- id: locknut
  ref: ISO 10511 M8
  qty: 1
joints:
- id: axle
  fastener: axle_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel
    feature: hub_bore
    role: clearance
  nut: locknut
  external: 'the door bracket: the bolt head bears on one cheek, the M8 lock nut on
    the other. The clamp load is taken metal-to-metal across the bracket, never through
    the wheel - that is what lets the wheel spin on its bearings.'
criteria:
- id: bearing_press_fit
  part: wheel
  feature: pocket_a
  relation: seats
  hardware: bearing
  clearance_mm: null
  params:
  - bearing_od
  - press_fit
  - bearing_width
  check:
    method: coupon
    ref: fit_coupon
    description: each 608 must press into a 21.85 mm pocket with hard thumb pressure
      and stay put. The coupon's pocket is the same diameter and the same 7.2 mm depth
      - tune press_fit on the coupon before printing the wheel
- id: races_recessed
  part: wheel
  feature: face_a
  relation: clears
  hardware: bearing
  clearance_mm: 0.2
  params:
  - recess
  - bearing_width
  check:
    method: measure
    ref: null
    description: 'with both bearings home, a straightedge across the wheel faces must
      not touch either bearing: the outer races sit ~0.2 mm below the faces, so a
      bracket cheek can never preload them'
- id: bolt_clears_web
  part: wheel
  feature: hub_bore
  relation: clears
  hardware: axle_bolt
  clearance_mm: 0.6
  params:
  - bolt_shank_d
  - hub_clearance
  check:
    method: coupon
    ref: fit_coupon
    description: the M8 bolt must slide through the coupon's 9.2 mm hole without rubbing,
      so a tightened nut cannot transmit clamp force through the printed web
- id: wheel_fits_slot
  part: wheel
  feature: tread
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - old_wheel_width
  - side_clearance_total
  - bearing_width
  - recess
  check:
    method: coupon
    ref: fit_coupon
    description: the coupon's tab is exactly the finished wheel width (15.8 mm). It
      must slide into the bracket slot in and out without forcing
- id: tread_on_track
  part: wheel
  feature: tread
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - groove_open_w
  - edge_chamfer
  - track_profile
  check:
    method: measure
    ref: null
    description: 'rest the wheel in the track before bolting it up: both flat tread
      bands (5.2 mm each) must sit solidly on the rail, and the door must hang at
      its old height because the diameter matches the old 50 mm wheel'
- id: groove_clears_fin
  part: wheel
  feature: groove
  relation: clears
  hardware: null
  clearance_mm: 0.4
  params:
  - groove_depth
  - groove_bottom_w
  - track_profile
  check:
    method: measure
    ref: null
    description: if the track has a fin or ridge it must drop into the groove with
      ~0.4 mm to spare; if it touches the groove bottom, widen/deepen the groove params
      or open it with a round file
- id: load_path
  part: wheel
  feature: pocket_a
  relation: supports
  hardware: bearing
  clearance_mm: null
  params:
  - bearing_od
  - press_fit
  check:
    method: none
    ref: null
    description: door weight goes tread -> 14 mm thick printed rim -> both bearing
      outer races -> bolt. Each pocket wall is ~14 mm of solid ring around the race,
      far more than a closet door needs
- id: spin_free
  part: wheel
  feature: hub_bore
  relation: engages
  hardware: axle_bolt
  clearance_mm: null
  params:
  - bracket_slot_width
  - side_clearance_total
  - hub_clearance
  check:
    method: measure
    ref: null
    description: 'after bolting up, spin the wheel by hand: it must coast freely for
      more than half a turn with the nut fully snugged'
manual:
- n: '1'
  text: Print fit_coupon first, flat on the bed (3 mm plate down), PLA, 0.2 mm layers,
    6 wall loops, 30% infill, no supports, no raft. About 15 minutes, and it checks
    every dimension I had to guess.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Press a 608 into the coupon's pocket. It should need real thumb pressure and
    a light tap to go home, and once seated it should not twist or push out by hand.
    Too easy? Raise press_fit to 0.25-0.35. Cannot get it started square? Drop press_fit
    to 0.05, or warm the coupon in hot water (~60 C) for a minute and push while warm.
    Bear on the OUTER race only - a short tube or socket that lands on the race rim,
    never on the inner race.
  parts:
  - fit_coupon
  hardware:
  - bearing
  tool: a tube or deep socket that bears only on the bearing's outer race
- n: '3'
  text: Push the M8 bolt through the bearing's bore and then through the 9.2 mm hole
    in the coupon's base. The bolt must slide freely and never rub printed plastic.
    If it binds, open hub_clearance to 1.6.
  parts:
  - fit_coupon
  hardware:
  - axle_bolt
  tool: null
- n: '4'
  text: 'Slide the coupon''s rectangular tab - it is exactly the finished wheel width,
    15.8 mm - into the slot between the two bracket cheeks. It must go in and come
    out with no forcing. If it does not, the wheel will bind once bolted up: tell
    me the gap, or note how much you would have to take off the two flat faces.'
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '5'
  text: Check the track before you commit. The tread is flat with a shallow 5.4 x
    1.8 mm centre groove. On a flat bar, a round tube or a channel bottom, both flat
    bands must land solidly on the rail. If the track has a fin standing up, it must
    drop into the groove with about 0.4 mm of depth still free; a bigger fin means
    opening the groove (round file, or raise groove_depth / groove_bottom_w and reprint).
  parts:
  - fit_coupon
  hardware: []
  tool: ruler or caliper
- n: '6'
  text: Print wheel, lying flat on one face with its axis vertical. PLA, 0.2 mm layers,
    6 wall loops, 30% infill, no supports. Keep whatever press_fit you settled on
    in step 2. The part is symmetric, so either face can be down.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '7'
  text: Press both 608s into the wheel, one from each face, so they meet with the
    1.4 mm web between them. Warm the wheel in ~60 C water for a minute, chill the
    bearings in the freezer for 15 minutes, start each one square by hand, then drive
    it home on its OUTER race until it sits about 0.2 mm below the wheel face. Let
    the wheel return to room temperature before fitting.
  parts:
  - wheel
  hardware:
  - bearing
  tool: tube or socket bearing on the outer race only
- n: '8'
  text: 'Confirm the recess: lay a straightedge across each flat face of the wheel.
    It must bridge over the bearing without touching the shiny outer ring. This is
    what stops a bracket cheek from preloading the bearing.'
  parts:
  - wheel
  hardware:
  - bearing
  tool: straightedge or ruler
- n: '9'
  text: 'Optional, if the bearings felt loose in step 2: a few drops of cyanoacrylate
    or a bead of epoxy around the pocket mouth before pressing the bearing in. Keep
    it out of the bore and off the seals.'
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '10'
  text: 'Fit: pass the M8 bolt through one bracket cheek, through the wheel''s centre
    hole, and thread it into the other cheek or into the ISO 10511 M8 lock nut. Snug
    it only until the bracket stops rattling - the head and nut must clamp the two
    cheeks together, not the wheel. The wheel has 0.6 mm of free play around the shank
    each side and must still coast.'
  parts:
  - wheel
  hardware:
  - axle_bolt
  - locknut
  tool: hex key or spanner for the M8 bolt
- n: '11'
  text: 'Spin test: flick the wheel. It must coast at least half a turn. Dragging?
    Back the nut off first. Still dragging means the bracket is squeezing the wheel
    - take it off and sand its two flat faces on 120 grit paper laid on a bench, 0.2
    mm at a time, keeping both faces even so the bearings stay recessed. PLA sands
    easily.'
  parts:
  - wheel
  hardware: []
  tool: 120 grit sandpaper on a flat surface
- n: '12'
  text: Hang the door and roll it ten times. The door should sit at its usual height
    (same 50 mm diameter as the old wheel) and the tread should run quietly without
    chattering, climbing the rail edge, or rubbing the sides of the slot.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '13'
  text: After about a week, pull the wheel off and check both bearings are still seated
    and still recessed. PLA creeps under a steady load, so a bearing can work outward
    slowly. If either has moved, glue it (step 9) or raise press_fit and reprint.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
