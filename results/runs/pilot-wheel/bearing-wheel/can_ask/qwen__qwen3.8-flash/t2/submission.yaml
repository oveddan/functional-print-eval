joints:
- id: axle
  fastener: axle_screw
  axis_origin:
  - 0.0
  - 0.0
  - 0.2
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel
    feature: bearing_seat
    role: clearance
  nut: nut_m8
  external: null
criteria:
- id: seat_grip
  part: wheel
  feature: bearing_seat
  relation: engages
  hardware: bearing_608
  clearance_mm: null
  params:
  - bearing_od
  - bearing_seat_d
  check:
    method: coupon
    ref: seat_coupon
    description: 'A 608 outer ring must press into the seat and stay there. Proved
      on the coupon first: the 2-dot hole is the wheel''s size (21.85), the 1-dot
      hole is 21.60 and the 3-dot hole is 22.10.'
- id: races_spaced_not_wheel
  part: wheel
  feature: bearing_seat
  relation: seats
  hardware: washer_m8
  clearance_mm: 0.2
  params:
  - wheel_width
  - bearing_width
  - washer_t
  - bearing_setback
  check:
    method: measure
    ref: null
    description: The spacer washer (1.6) plus two 7 mm bearings is 15.6 mm inside
      a 16 mm bore, so the nut's clamp lands on the inner rings and the washer only
      - each bearing ends up ~0.2 mm below its wheel face and the wheel body is never
      squeezed.
- id: spacer_on_inner_ring_only
  part: wheel
  feature: bearing_seat
  relation: clears
  hardware: washer_m8
  clearance_mm: 0.5
  params:
  - washer_od
  - bearing_inner_ring_od
  - bearing_outer_ring_shoulder_id
  check:
    method: measure
    ref: null
    description: The 16 mm spacer presses the inner ring annulus (bore 8 to ~12.4)
      and stops short of the outer ring's inside shoulder (~17), so the bearing is
      not winded or preloaded by the clamp.
- id: bolt_runs_through
  part: wheel
  feature: bearing_seat
  relation: clears
  hardware: axle_screw
  clearance_mm: 0.4
  params:
  - bolt_shank_d
  - bearing_bore
  - washer_id
  check:
    method: measure
    ref: null
    description: The M8 passes through the 8 mm inner-ring bores and the 8.4 mm washer
      bore. On a fully threaded bolt the rings grip the crests - expect a touch of
      drag at first, which frees in after a few spins.
- id: head_and_nut_reach_races
  part: wheel
  feature: bore_mouth
  relation: clears
  hardware: nut_m8
  clearance_mm: null
  params:
  - bearing_seat_d
  - nut_face_d
  - bolt_head_max_d
  check:
    method: measure
    ref: null
    description: Both the bore mouths (21.85, collared to 22.45) are far wider than
      the nut face (~12.5) or a 15 mm head, so either can seat on the inner ring without
      touching printed material.
- id: width_in_bracket
  part: wheel
  feature: wheel_face
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - wheel_width
  - bracket_gap
  check:
    method: measure
    ref: null
    description: 'Test-fit between the bracket legs: 0.3-0.5 mm total side play. The
      bracket gap could not be measured, so this is the one step that can send you
      back to a reprint - drop wheel_width 0.4 mm if it binds.'
- id: tread_on_track
  part: wheel
  feature: tread
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - tread_chamfer
  check:
    method: measure
    ref: null
    description: Same 50 mm diameter as the old wheel so the door hangs at its original
      height; the flat tread with 1.5 mm edge breaks runs on the rail without chattering
      or clipping the channel walls.
manual:
- n: '1'
  text: Print seat_coupon and wheel in the same job, both flat on the bed, same filament,
    same temperature. The coupon is only 10 mm tall and takes about 15 minutes; it
    exists because the bearing seat is the one fit that a caliper cannot guarantee
    on your printer. Do not press bearings into the wheel until you have read step
    2.
  parts:
  - wheel
  - seat_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Pick the press fit. Press one 608 into each of the three holes in seat_coupon,
    counting the engraved dots beside each hole: 1 dot = 21.60 mm, 2 dots = 21.85
    mm (what the wheel is modelled at), 3 dots = 22.10 mm. The right answer is the
    hole where the bearing needs firm, sustained thumb pressure, goes in square, and
    cannot be shifted side-to-side once home. If only the 1-dot hole grips, set bearing_seat_d
    to 21.60 and reprint the wheel. If even the 2-dot hole drops in with no pressure,
    set bearing_seat_d to 21.70; if the 1-dot hole will not accept a bearing at all,
    raise it to 22.00 and ream the wheel''s bore instead of reprinting.'
  parts:
  - seat_coupon
  hardware:
  - bearing_608
  tool: null
- n: '3'
  text: 'Chill both bearings in the freezer for 10 minutes and warm the wheel with
    a hair dryer - the seat is a press fit and PLA is at its least stubborn when warm.
    Start bearing A into one face of the wheel square by hand, then press it in on
    its OUTER ring only (a socket or tube about 19-20 mm OD resting on the ring''s
    outer edge). Never push on the inner ring or through the centre hole: that puts
    your load through the balls and ruins the bearing. Leave the bearing''s shield
    flush-ish, about 1 mm shy of home.'
  parts:
  - wheel
  hardware:
  - bearing_608
  tool: null
- n: '4'
  text: 'Take one ISO 7089 M8 washer - this is the spacer, not a fastener part - and
    drop it into the open bore from the far side, where it rests against bearing A''s
    back face. Now press bearing B in from that side until it bottoms on the washer.
    The washer is your depth stop: 7 + 1.6 + 7 = 15.6 mm inside a 16 mm bore, so both
    bearings finish about 0.2 mm below their faces and the shields stay clear of everything.
    If bearing A gets pushed out of its face instead of holding, your seat is loose
    - go back to step 2 with the tighter size.'
  parts:
  - wheel
  hardware:
  - bearing_608
  - washer_m8
  tool: null
- n: '5'
  text: 'Slide the wheel onto the axle. Use your M8 bolt if it is 40 mm or longer
    under the head; otherwise use ISO 4762 M8x40. Test-fit the wheel between the bracket
    legs - you want 0.3 to 0.5 mm of total side-to-side play. I could not measure
    your bracket, so this is the step that decides whether the wheel width is right:
    if the faces rub the legs, lower wheel_width to 15.6 mm and reprint (two 7 mm
    bearings then sit flush, which is still fine); if the wheel wanders, stack the
    remaining M8 washers outboard as locators.'
  parts:
  - wheel
  hardware:
  - axle_screw
  - washer_m8
  tool: 13 mm spanner or the hex key for the bolt you use
- n: '6'
  text: 'Thread on the ISO 4032 M8 nut and tighten it only until the side play just
    disappears, then back it off a quarter turn. The clamp must be carried by the
    bolt head, the two bearing inner rings and the spacer washer inside the bore -
    never by the wheel''s faces, or the printed body binds against the races and grins
    itself round over a week. Spin the wheel: it should give five or six free revolutions
    and stop with no rubbing tick. If your bolt is threaded all the way to the head
    the inner rings grip the crests and the wheel will feel notchy for the first minute
    of spinning; that frees up. A ground-smooth-shank bolt makes it truer.'
  parts:
  - wheel
  hardware:
  - axle_screw
  - nut_m8
  - bearing_608
  - washer_m8
  tool: 13 mm spanner
- n: '7'
  text: Put the door back on its track and load it. Check by hand that the panel rolls
    without hop or squeal and that the wheel does not climb the channel wall. If the
    nut works loose over the next week - vibration will do it - swap in the ISO 10511
    M8 nylon-insert lock nut, still adjusted to free-spin, and re-check after a month
    of use for any ovalising of the bore from the door's weight.
  parts:
  - wheel
  hardware:
  - lock_nut_m8
  - axle_screw
  tool: null
- n: '8'
  text: Print a spare wheel while the coupon numbers are still fresh. One wheel is
    a repair; two is a service item, and the PLA tread will wear faster and run noisier
    on the metal track than the original did.
  parts:
  - wheel
  hardware: []
  tool: null
