task: bearing-wheel
note: 'One printed part does the job: a 50 x 16 mm wheel with a single 21.85 mm through
  seat for the two 608 outer rings. The load path is skateboard-standard - tread to
  bore wall in-plane (strongest direction for a flat print), outer rings gripped by
  the press fit, inner rings riding the M8, and one steel ISO 7089 M8 washer living
  inside the bore as the spacer so the nut''s clamp goes through the races and the
  washer and never through printed PLA. That is what keeps the wheel free after the
  nut is tightened, and it is also why no printed sleeve of an unknown length is needed.
  The two dimensions I could not get - bracket gap and track profile - are handled
  by a test-fit step with an explicit reprint rule, and the bearing seat is verified
  on a coupon before the wheel is trusted. Everything else (bolt length, head size)
  is only ever checked for clearance, so the unknown measurements cannot make the
  part fail to assemble.'
questions:
- text: 608 outer race diameter, measured flat with the jaws rather than pinched at
    an angle?
  answer: about 22 mm - confirms the nominal 22.000; the earlier 21.22 was a bad reading
- text: 608 width and bore diameter?
  answer: about 7 mm wide, about 8 mm bore
- text: 'M8 bolt: overall length under the head, smooth unthreaded shank length, shank
    diameter?'
  answer: about 8 mm across the shank; length and shank/thread split not obtained
- text: M8 bolt head diameter and height?
  answer: not obtained - assumed worst case 15 mm across corners; the 21.85 mm bore
    mouth clears it either way
- text: 'Roller bracket: does the wheel sit between two legs (fork) or cantilever
    off a single plate, and what is the inside gap?'
  answer: could not measure - designed for the fork case, step 5 test-fits it and
    gives the reprint rule if it binds
- text: 'Track channel: inside width, wall height, and is the rail flat, rounded or
    two raised edges?'
  answer: could not measure - flat 16 mm tread with 1.5 mm edge breaks chosen as the
    neutral answer
- text: 'Old wheel tread: flat, crowned, or grooved/ribbed?'
  answer: could not measure - diameter 50 mm and width 16 mm taken from your estimate,
    tread left flat
params:
  bearing_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: measured
    note: 608 outer race, re-measured flat with the caliper jaws; matches nominal
      22.000 -0.008. The earlier 21.22 reading was the jaws pinching the bearing at
      an angle.
  bearing_width:
    value: 7.0
    unit: mm
    kind: hardware
    source: measured
    note: 608 width, both bearings read ~7 mm
  bearing_bore:
    value: 8.0
    unit: mm
    kind: hardware
    source: measured
    note: inner ring bore; the axle runs through here
  bearing_inner_ring_od:
    value: 12.4
    unit: mm
    kind: hardware
    source: guessed
    note: typical 608 inner ring outside dia - the internal spacer must land on this
      annulus, not on the outer ring
  bearing_outer_ring_shoulder_id:
    value: 17.0
    unit: mm
    kind: hardware
    source: guessed
    note: typical 608 outer ring inside shoulder dia - the spacer must clear this
  bolt_shank_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: measured
    note: the person's M8 bolt measures ~8 mm at the jaws; whether that is smooth
      shank or thread crest is unknown, so the design works either way
  bolt_head_max_d:
    value: 15.0
    unit: mm
    kind: hardware
    source: guessed
    note: worst case M8 hex head across corners; ISO 4762 socket head is 13. Must
      pass through the 21.85 bore mouth to reach the inner ring.
  nut_face_d:
    value: 12.5
    unit: mm
    kind: hardware
    source: datasheet
    note: 'ISO 4032 M8 finished bearing face (across flats 8.0? no: af 13 for M8),
      must pass through the bore mouth'
  axle_screw_len:
    value: 40.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8x40 - long enough to span the bracket ears plus the 16 mm wheel
      and still take 6+ thread turns. The salvaged M8 bolt can be used instead if
      it is at least this long.
  washer_od:
    value: 16.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8
  washer_id:
    value: 8.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 - clears the 8 mm bolt
  washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 - this is the internal spacer between the bearing inner rings
  wheel_od:
    value: 50.0
    unit: mm
    kind: world
    source: asked
    note: old wheel 'about 50 mm across' - keeps the door's ride height unchanged
  wheel_width:
    value: 16.0
    unit: mm
    kind: world
    source: asked
    note: old wheel 'about 16 mm wide'. Two 7 mm bearings plus the 1.6 mm spacer washer
      make a 15.6 mm stack, so each bearing ends up 0.2 mm below its face.
  bracket_gap:
    value: 16.6
    unit: mm
    kind: world
    source: guessed
    note: COULD NOT BE MEASURED. Assumed the old 16 mm wheel width plus ~0.6 mm total
      side play. Step 5 test-fits it; if it binds, lower wheel_width 0.4 mm and reprint.
  bearing_seat_d:
    value: 21.85
    unit: mm
    kind: design
    source: design
    note: 'the bore the outer rings press into: 0.15 mm diametral interference on
      22.00. Confirmed against the coupon before the wheel is trusted - move to 21.60
      or 22.10 if the coupon says so.'
  lead_in_clear:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: 'per side: the 0.8 mm deep collar at each bore mouth is 22.45 mm so the
      bearing''s corner chamfer and the first-layer elephant foot never rub the seat'
  lead_in_depth:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: ''
  tread_chamfer:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: breaks both tread edges so the wheel cannot dig into the track wall or chatter
      on a rail edge
  bearing_setback:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: emerges from (wheel_width - 2*bearing_width - washer_t)/2 - keeps the shields
      and races out of the track and away from the bracket legs
  coupon_hole_count:
    value: 3
    unit: count
    kind: design
    source: design
    note: ''
  coupon_seat_step:
    value: 0.25
    unit: mm
    kind: design
    source: design
    note: the coupon tests bearing_seat_d -0.25, bearing_seat_d, and +0.25
  coupon_hole_pitch:
    value: 24.0
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_edge:
    value: 6.0
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_thickness:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: deeper than the 7 mm bearing so the fit is felt over the full ring width,
      and the same wall build-up as the wheel
  coupon_dimple_d:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: 'engraved dots identify the holes: 1 dot = tightest, 2 = the wheel''s size,
      3 = loosest'
  coupon_dimple_depth:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_dimple_pitch:
    value: 4.0
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: wheel
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    W = p.wheel_width\n    R = p.wheel_od / 2.0\n    rs =\
    \ p.bearing_seat_d / 2.0\n    rl = (p.bearing_seat_d + 2.0 * p.lead_in_clear)\
    \ / 2.0\n    li = p.lead_in_depth\n    c = p.tread_chamfer\n\n    # Blank: 50\
    \ dia x 16 wide, printed flat so both the tread and the bearing\n    # seat are\
    \ vertical perimeter walls (round, in-plane loaded, no bridging).\n    body =\
    \ cq.Workplane(\"XY\").circle(R).extrude(W)\n    body = body.edges(\">Z\").chamfer(c)\n\
    \    body = body.edges(\"<Z\").chamfer(c)\n\n    # One through seat for both 608\
    \ outer rings, plus a slightly wider lead-in\n    # collar at each mouth so the\
    \ bearing corner and the first layer never rub.\n    seat = cq.Workplane(\"XY\"\
    ).workplane(offset=-0.5).circle(rs).extrude(W + 1.0)\n    top_collar = (cq.Workplane(\"\
    XY\").workplane(offset=W - li - 0.1)\n                  .circle(rl).extrude(li\
    \ + 0.2))\n    bot_collar = (cq.Workplane(\"XY\").workplane(offset=-0.1)\n   \
    \               .circle(rl).extrude(li + 0.2))\n\n    return body.cut(seat).cut(top_collar).cut(bot_collar)"
  print_orientation: 'Flat on one face: the bore axis is vertical (z=0 is the face
    that touches the bed), 50 x 50 mm footprint, 16 mm tall. No supports, no brim
    needed. 4 perimeters, 25% infill, 0.2 mm layers, ironing off.'
  use_orientation: Bore axis horizontal along the axle bolt, wheel faces vertical,
    spinning in the bracket between the track and the door.
- id: seat_coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    n = int(p.coupon_hole_count)\n    pitch = p.coupon_hole_pitch\n\
    \    t = p.coupon_thickness\n    edge = p.coupon_edge\n    seat = p.bearing_seat_d\n\
    \    step = p.coupon_seat_step\n    dd = p.coupon_dimple_d / 2.0\n    dp = p.coupon_dimple_pitch\n\
    \    dep = p.coupon_dimple_depth\n\n    lx = (n - 1) * pitch + seat + 2 * step\
    \ + 2 * edge\n    ly = seat + 2 * step + 2 * edge\n    body = cq.Workplane(\"\
    XY\").box(lx, ly, t, centered=(True, True, False))\n    yd = ly / 2.0 - edge /\
    \ 2.0 - 1.0\n\n    for i in range(n):\n        d = seat + (i - 1) * step     \
    \     # tight, nominal, loose\n        x = (i - (n - 1) / 2.0) * pitch\n     \
    \   body = body.cut(cq.Workplane(\"XY\").workplane(offset=-0.5)\n            \
    \            .center(x, 0).circle(d / 2.0).extrude(t + 1.0))\n        k = i +\
    \ 1                          # 1 dot = tightest hole\n        for j in range(k):\n\
    \            dx = x + (j - (k - 1) / 2.0) * dp\n            body = body.cut(cq.Workplane(\"\
    XY\").workplane(offset=t - dep)\n                            .center(dx, yd).circle(dd).extrude(dep\
    \ + 0.2))\n    return body"
  print_orientation: Flat, holes vertical - deliberately the same orientation, wall
    count and temperature as the wheel so the fit you feel transfers to it.
  use_orientation: Not installed; a test piece. Print it with (or before) the wheel
    and press a bearing into each hole to pick the seat size.
