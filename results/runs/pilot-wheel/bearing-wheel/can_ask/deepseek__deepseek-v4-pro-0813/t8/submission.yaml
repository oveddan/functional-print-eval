task: bearing-wheel
note: 50 mm closet-door roller wheel with two pressed-in 608 bearings running on an
  M8 bolt axle. Print flat (bore vertical, no supports). Print the coupon first to
  verify the bearing press fit, then print the wheel. Before final assembly, confirm
  your bracket arms clear the 16 mm-wide wheel and that its axle holes are at least
  8 mm for the M8 bolt.
questions: []
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: 'User: the old wheel was about 50 mm across.'
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: 'User: about 16 mm wide.'
  bearing_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ nominal OD.
  bearing_bore:
    value: 8.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ nominal bore; the M8 rides inside the bearings.
  bearing_w:
    value: 7.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ nominal width.
  bearing_fit:
    value: -0.2
    unit: mm
    kind: design
    source: design
    note: Pocket diameter undersize vs the 22.0 mm bearing OD for a light press fit;
      verified with the coupon.
  mouth_chamfer:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: 45 degree lead-in chamfer on the bore mouths and tread shoulders.
  coupon_od:
    value: 30
    unit: mm
    kind: design
    source: design
    note: Outer diameter of the test ring.
  m8_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8 major diameter; user measured the bolt shank at about 8 mm.
  m8_nut_h:
    value: 6.8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 nut height.
  m8_washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 washer thickness.
  m8_bolt_len:
    value: 40
    unit: mm
    kind: design
    source: catalog
    note: Chosen from the ISO 4762 M8 lengths; M8x40 is long enough when the bracket
      arm thickness is unknown (assumed ~2 mm per arm, gap ~16-20 mm).
  bracket_gap:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: Could not be measured; verify the 16 mm wheel has a little side play before
      final tightening.
  bracket_hole_d:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: Could not be measured; bracket axle holes must be >= 8.2 mm for the M8 bolt
      (drill out if smaller).
  bracket_arm_t:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: Could not be measured; assumed about 2 mm per arm when choosing M8x40.
parts:
- id: wheel
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    r = p.wheel_od / 2.0\n    pocket_r = (p.bearing_od + p.bearing_fit)\
    \ / 2.0\n    wheel = (\n        cq.Workplane(\"XY\")\n        .circle(r)\n   \
    \     .extrude(p.wheel_w)\n        .cut(\n            cq.Workplane(\"XY\")\n \
    \           .circle(pocket_r)\n            .extrude(p.wheel_w)\n        )\n  \
    \  )\n    wheel = wheel.edges(\">Z\").chamfer(p.mouth_chamfer, p.mouth_chamfer)\n\
    \    return wheel\n"
  print_orientation: Flat on the bed with the bore axis vertical; z = 0 is one side
    face.
  use_orientation: Bore axis horizontal; tread rolls on the 50 mm outside surface;
    one 608 bearing is pressed into each end until flush; the M8 bolt passes through
    both bearing bores as the axle.
- id: bearing_fit_coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    pocket_r = (p.bearing_od + p.bearing_fit) / 2.0\n    coupon\
    \ = (\n        cq.Workplane(\"XY\")\n        .circle(p.coupon_od / 2.0)\n    \
    \    .extrude(p.bearing_w)\n        .cut(\n            cq.Workplane(\"XY\")\n\
    \            .circle(pocket_r)\n            .extrude(p.bearing_w)\n        )\n\
    \    )\n    coupon = coupon.edges(\">Z\").chamfer(p.mouth_chamfer, p.mouth_chamfer)\n\
    \    return coupon\n"
  print_orientation: Flat on the bed, bore axis vertical.
  use_orientation: 'Test ring: press one 608 bearing into the bore to check the press
    fit before printing the full wheel.'
hardware:
- id: bearing_608
  ref: 608ZZ
  qty: 2
- id: m8_bolt
  ref: ISO 4762 M8x40
  qty: 1
- id: m8_locknut
  ref: ISO 10511 M8
  qty: 1
- id: m8_washers
  ref: ISO 7089 M8
  qty: 2
joints:
- id: axle
  fastener: m8_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel
    feature: through bore via the two 608 bearing inner races (8 mm)
    role: clearance
  nut: m8_locknut
  external: 'sliding-door roller bracket arms (not printed): the M8 bolt passes through
    one arm, the wheel, and the other arm; plain M8 washers go inside the head and
    under the nut.'
criteria:
- id: bearing_press
  part: wheel
  feature: bearing pocket (21.8 mm bore)
  relation: engages
  hardware: bearing_608
  clearance_mm: null
  params: []
  check:
    method: coupon
    ref: bearing_fit_coupon
    description: One 608 bearing should press in with a firm push or light tap and
      must not spin in the pocket.
- id: bolt_slides
  part: wheel
  feature: axle bore (8 mm through both bearing inner races)
  relation: clears
  hardware: m8_bolt
  clearance_mm: 0.2
  params: []
  check:
    method: measure
    ref: null
    description: The M8 bolt should slide through both bearings end-to-end without
      being forced; it does not need to be tight.
- id: tread_diameter
  part: wheel
  feature: outer tread (50 mm running surface)
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  check:
    method: measure
    ref: null
    description: Check the printed wheel OD against the old wheel (~50 mm) and adjust
      wheel_od if the door height needs it.
- id: bracket_side_clearance
  part: wheel
  feature: side faces
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - wheel_w
  check:
    method: measure
    ref: null
    description: The 16 mm-wide wheel must sit between the bracket arms with a little
      side play; if the arms pinch, sand a touch off each side face of the wheel.
manual:
- n: '1'
  text: Print the bearing-fit coupon (bearing_fit_coupon) flat, no supports, 0.2 mm
    layers.
  parts:
  - bearing_fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Press one 608 bearing into the coupon. It should seat with a firm push or
    light tap and not spin. Too tight: lightly sand the bore. Too loose: reprint with
    bearing_fit a little more negative and try again.'
  parts:
  - bearing_fit_coupon
  hardware:
  - bearing_608
  tool: flat plate or vise
- n: '3'
  text: Print the wheel (wheel) flat on one side face, no supports.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '4'
  text: Press one 608 bearing into each end of the wheel until the bearing's side
    face is flush with the wheel's side face. Press squarely, using something flat
    that only touches the outer race or the whole bearing face. A thin smear of superglue
    on the pocket wall is optional insurance.
  parts:
  - wheel
  hardware:
  - bearing_608
  tool: flat plate or vise
- n: '5'
  text: Check the M8 bolt slides freely through both bearing bores end-to-end. If
    it binds, do not force it; lightly dress the inside of the bearings or use another
    M8 bolt.
  parts:
  - wheel
  hardware:
  - m8_bolt
  tool: null
- n: '6'
  text: Confirm the bracket axle holes are at least 8 mm (drill to 8.2 mm if they
    are smaller) and that the arms clear the 16 mm-wide wheel with a little side play.
  parts: []
  hardware:
  - m8_bolt
  tool: drill (only if holes are smaller than 8.2 mm)
- n: '7'
  text: 'Assemble: M8 bolt through one arm, one washer, the wheel, the other washer,
    the other arm, then the M8 nylock nut. Tighten until just snug; the wheel must
    still spin freely. If your existing M8 bolt is a different length, use the shortest
    one that leaves at least two threads showing past the nut.'
  parts:
  - wheel
  hardware:
  - m8_bolt
  - m8_washers
  - m8_locknut
  tool: hex key / spanner
- n: '8'
  text: Refit the door and check it rolls and the height matches the old wheel. If
    it sags or binds, change wheel_od and reprint only the wheel.
  parts:
  - wheel
  hardware: []
  tool: null
