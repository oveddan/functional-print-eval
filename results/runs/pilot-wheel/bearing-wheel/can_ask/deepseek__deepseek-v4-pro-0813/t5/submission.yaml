  wheel_width:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: User said old wheel was about 16 mm wide
  bearing_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ outer diameter
  bearing_bore:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ bore (nominal)
  bearing_width:
    value: 7.0
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ width
  m8_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  m8_head_d:
    value: 13.0
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  m8_head_h:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  m8_nut_af:
    value: 13.0
    unit: mm
    kind: hardware
