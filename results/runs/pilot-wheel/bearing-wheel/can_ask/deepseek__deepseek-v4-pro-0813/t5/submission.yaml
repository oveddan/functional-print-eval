parts:
- id: roller_wheel
  role: final
  material: PLA
  code: "def build(p):\n    import cadquery as cq\n    od = p.wheel_od\n    w = p.wheel_width\n\
    \    bod = p.bearing_od\n    bw = p.bearing_width\n    bore = p.bearing_bore\n\
    \    clear = p.clearing_d\n\n    # Inset each bearing from the outer face so the\
    \ rolling surface is defined outward\n    bearing_seat_depth = bw + 0.5  # allow\
    \ both bearings side by side with a shoulder\n\n    # Main wheel body: outer cylinder\n\
    \    wheel = cq.Workplane('XY').circle(od/2).extrude(w)\n\n    # Bore through\
    \ for the bolt shank (fixed axle), this diameter NEVER touches the bolt;\n   \
    \ # the bearing inner races carry the load.\n    wheel = wheel.faces('>Z').workplane().hole(clear)\n\
    \n    # Counterbore from each side to seat a 608 bearing (press fit into the plastic).\n\
    \    # Bearing OD pocket with a small interference.\n    pocket = bod - 0.15 \
    \ # light press fit\n    depth = bw + 0.25   # seat depth so the bearing sits\
    \ slightly proud of the face\n    wheel = wheel.faces('<Z').workplane().cboreHole(pocket,\
    \ clear, depth, None)\n    wheel = wheel.faces('>Z').workplane().cboreHole(pocket,\
    \ clear, depth, None)\n\n    return wheel"
  print_orientation: flat, one 16 mm face on the bed; bore and counterbores are vertical
    (printed lying down)
  use_orientation: wheel spins with axles horizontal; bolt passes through the central
    bore
hardware:
- id: axle_bolt
  ref: ISO 4762 M8x50
  qty: 1
- id: axle_nut
  ref: ISO 10511 M8
  qty: 1
- id: washer_a
  ref: ISO 7089 M8
  qty: 2
joints:
- id: axle_joint
  fastener: axle_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 1.0
  - 0.0
  - 0.0
  seats:
  - part: roller_wheel
    feature: central bore
    role: clearance
  - part: roller_wheel
    feature: bearing counterbore
    role: insert
  nut: null
  external: null
criteria:
- id: bearing_press_fit
  part: roller_wheel
  feature: bearing counterbore
  relation: engages
  hardware: null
  clearance_mm: null
  params: []
  check:
    method: coupon
    ref: null
    description: Print a small test cylinder with the same counterbore size and confirm
      each 608 bearing presses in snugly without cracking and doesn't spin in the
      plastic.
- id: bearing_clear_shank
  part: roller_wheel
  feature: central bore
  relation: clears
  hardware: axle_bolt
  clearance_mm: 0.75
  params: []
  check:
    method: coupon
    ref: null
    description: Confirm the M8 shank slides freely through the bore and the bearing
      inner races take the load.
manual:
- n: '1'
  text: Print roller_wheel lying flat on its face (bore vertical).
  parts:
  - roller_wheel
  hardware: []
  tool: null
- n: '2'
  text: Press one 608ZZ bearing into each counterbore until seated against the shoulders.
  parts:
  - roller_wheel
  hardware: []
  tool: press by hand or with a flat plate
- n: '3'
  text: Slide the M8 bolt through the wheel's central bore.
  parts: []
  hardware:
  - axle_bolt
  tool: null
- n: '4'
  text: Put an M8 washer on each side of the wheel where the door bracket arms will
    sit, then fit the wheel into the bracket and thread on the M8 lock nut.
  parts: []
  hardware:
  - washer_a
  - axle_nut
  tool: 6 mm hex key and 13 mm spanner (or adjustable)
- n: '5'
  text: Tighten the lock nut just enough to take out play; the wheel must spin freely
    on the bolt.
  parts: []
  hardware:
  - axle_nut
  tool: null
