task: bearing-wheel
note: 'Wheel built from your description (old wheel ~50 mm OD x ~16 mm wide). Assumptions
  because the old wheel/bracket couldn''t be measured: flat tread with rounded edges
  (no centre groove), and the bracket arms locate the wheel by its plastic faces with
  the two bearings recessed ~1 mm per side. If your M8 bolt is shorter than ~40 mm,
  use the referenced ISO 4762 M8x40. Print the coupon first; the middle ring is the
  target press fit, the left is slip and the right is tighter — pick whichever presses
  firmly without cracking, then set that value as press_interference for the wheel.'
questions:
- text: Does the old wheel have a flat tread, or a groove/rail running around the
    middle? The printed tread is flat with rounded edges.
  answer: null
- text: What is the inside width between the two bracket arms the axle bolt passes
    through? This confirms the M8 bolt length and any washers/spacers.
  answer: null
params:
  wheel_od:
    value: 50.0
    unit: mm
    kind: world
    source: asked
    note: Old wheel diameter you described as 'about 50 mm'.
  wheel_w:
    value: 16.0
    unit: mm
    kind: world
    source: asked
    note: Old wheel width you described as 'about 16 mm'.
  bearing_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: measured
    note: 608 bearing outside diameter you measured (~22 mm).
  bearing_bore:
    value: 8.0
    unit: mm
    kind: hardware
    source: measured
    note: 608 bearing bore you measured (~8 mm); the M8 axle slips through it.
  bearing_w:
    value: 7.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 bearing width, nominal 7 mm.
  bolt_shank_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: measured
    note: M8 shank you measured (~8 mm).
  press_interference:
    value: 0.08
    unit: mm
    kind: design
    source: design
    note: Radial press fit on the bearing pocket; 0 means slip. Confirm with the coupon
      before printing the wheel.
  lead_chamfer:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Size (radial and depth) of the lead-in counterbore at each pocket mouth,
      so the bearing starts easily.
  rim_fillet:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Rounding on the two outer edges of the tread.
  coupon_l:
    value: 78.0
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_w:
    value: 26.0
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_h:
    value: 9.0
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_hole_spacing:
    value: 30.0
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_rim_fillet:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_press_0:
    value: 0.0
    unit: mm
    kind: design
    source: design
    note: 'Left/slip ring: bore = bearing_od.'
  coupon_press_1:
    value: 0.08
    unit: mm
    kind: design
    source: design
    note: 'Middle/target ring: bore = bearing_od - 0.08.'
  coupon_press_2:
    value: 0.16
    unit: mm
    kind: design
    source: design
    note: 'Right/tighter ring: bore = bearing_od - 0.16.'
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    bore = p.bearing_od - p.press_interference\n    lead_d\
    \ = bore + 2.0 * p.lead_chamfer\n\n    r = (\n        cq.Workplane(\"XY\")\n \
    \       .circle(p.wheel_od / 2.0)\n        .extrude(p.wheel_w)\n    )\n    r =\
    \ r.edges(\"|Z\").fillet(p.rim_fillet)\n    r = r.faces(\">Z\").workplane().cboreHole(bore,\
    \ lead_d, p.lead_chamfer)\n    r = r.faces(\"<Z\").workplane().cboreHole(bore,\
    \ lead_d, p.lead_chamfer)\n    return r"
  print_orientation: Flat on the build plate with one face on the bed (z = 0); the
    bearing bore is vertical.
  use_orientation: Mounted on the door with the axle horizontal through the central
    bore.
- id: bearing_fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    r = (\n        cq.Workplane(\"XY\")\n        .rect(p.coupon_l,\
    \ p.coupon_w, centered=True)\n        .extrude(p.coupon_h)\n    )\n    r = r.edges(\"\
    |Z\").fillet(p.coupon_rim_fillet)\n\n    jobs = [\n        (-p.coupon_hole_spacing,\
    \ p.coupon_press_0),\n        (0.0, p.coupon_press_1),\n        (p.coupon_hole_spacing,\
    \ p.coupon_press_2),\n    ]\n    for x, off in jobs:\n        d = p.bearing_od\
    \ - off\n        lead_d = d + 2.0 * p.lead_chamfer\n        r = r.faces(\">Z\"\
    ).workplane().center(x, 0).cboreHole(d, lead_d, p.lead_chamfer)\n    return r"
  print_orientation: Flat on the build plate (z = 0); holes vertical. Left = slip,
    middle = target press, right = tighter press.
  use_orientation: Test piece; press a 608 bearing into each ring from the chamfered
    top.
hardware:
- id: h_axle
  ref: ISO 4762 M8x40
  qty: 1
- id: h_locknut
  ref: ISO 10511 M8
  qty: 1
- id: h_washer
  ref: ISO 7089 M8
  qty: 4
joints:
- id: axle
  fastener: h_axle
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel
    feature: bearing_pocket
    role: clearance
  nut: h_locknut
  external: the sliding-door roller bracket (the bolt passes through both bracket
    arms and clamps them onto the wheel faces)
criteria:
- id: bearing_press_fit
  part: wheel
  feature: bearing_pocket
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - bearing_od
  - press_interference
  check:
    method: coupon
    ref: bearing_fit_coupon
    description: Press a 608 bearing into each coupon ring (left slip 22.0, middle
      21.92, right 21.84). Pick the ring that gives a firm, non-cracking press and
      set press_interference to that size before printing the wheel.
- id: axle_clearance
  part: wheel
  feature: bearing_pocket
  relation: clears
  hardware: h_axle
  clearance_mm: null
  params:
  - bearing_bore
  - bolt_shank_d
  check:
    method: measure
    ref: null
    description: Slide the M8 bolt through a 608 bearing bore; it should slip through
      freely.
- id: tread_diameter
  part: wheel
  feature: tread
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  check:
    method: none
    ref: null
    description: Tread is 50 mm so it runs on the same track as the old wheel.
- id: bearing_recess
  part: wheel
  feature: bearing_pocket
  relation: contains
  hardware: null
  clearance_mm: null
  params:
  - bearing_w
  - wheel_w
  check:
    method: none
    ref: null
    description: Two 7 mm bearings (14 mm total) sit inside the 16 mm width with ~1
      mm recess each side, so only the plastic face contacts the bracket arms.
manual:
- n: '1'
  text: Remove the old wheel. Check your M8 bolt passes through both bracket holes
    and through a 608 bearing bore (8 mm); if a bracket hole is tight, drill it out
    to 8 mm. Confirm the bolt is at least ~40 mm long under the head.
  parts: []
  hardware:
  - h_axle
  tool: null
- n: '2'
  text: Print the bearing_fit_coupon (flat, holes vertical). Press a 608 bearing into
    each ring from the chamfered side, first by hand then with a light tap from a
    flat block. Left = slip (22.0 mm), middle = target press (21.92 mm), right = tighter
    press (21.84 mm).
  parts:
  - bearing_fit_coupon
  hardware: []
  tool: null
- n: '3'
  text: Print the wheel using the press_interference that matched the best coupon
    ring (default 0.08 mm same as the middle ring). Print it flat with one face on
    the bed.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '4'
  text: Press one 608 bearing into each side of the wheel until its face sits about
    1 mm below the wheel face (just past the lead-in lip). Use a flat block or a vise;
    the two bearings end up touching in the middle and the outer faces stay recessed.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '5'
  text: Slide the M8 bolt through one bracket arm, then through the wheel, then the
    other bracket arm. If there is side-to-side play, add h_washer washers between
    a bracket arm and the wheel face so the wheel sits centred with only a hair of
    clearance.
  parts:
  - wheel
  hardware:
  - h_axle
  - h_washer
  tool: null
- n: '6'
  text: Add one h_washer under the h_locknut and thread the lock nut on. Tighten only
    until the bracket arms lightly touch the wheel faces and the wheel spins freely;
    the nylon insert stops it backing off.
  parts:
  - wheel
  hardware:
  - h_washer
  - h_locknut
  tool: null
