task: bearing-wheel
note: Flat non-load-bearing guide only; not for supporting the door or preventing
  derailment.
questions: []
params:
  od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: ''
  w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: ''
  b:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: ''
  h:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: ''
  fit:
    value: 0.05
    unit: mm
    kind: design
    source: design
    note: ''
  a:
    value: 18
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n r=p.od/2; b=(p.b+p.fit)/2; a=p.a/2; w=p.w; h=p.h\n return\
    \ cq.Workplane('XZ').polyline([(a,0),(r,0),(r,w),(b,w),(b,w-h),(a,w-h)]).close().revolve(360,(0,0),(0,1))"
  print_orientation: Annular face on bed, pocket up.
  use_orientation: Coaxial with bolt.
hardware:
- id: bolt
  ref: ISO 4762 M8x30
  qty: 1
- id: nut
  ref: ISO 10511 M8
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Support the door. Verify the original is only a guide and a flat tread fits
    the track; otherwise use a matching rated replacement.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print wheel without supports with six walls. Seat one 608ZZ by pressing squarely
    on its outer race. Adjust fit and reprint if loose or excessively tight.
  parts: []
  hardware: []
  tool: null
- n: '3'
  text: Dry-fit bolt and nut in existing bracket without modifying it. Only use if
    bracket reaches the recessed inner race without touching wheel or shield and bolt
    fully emerges through locknut. Clamp only inner race.
  parts: []
  hardware: []
  tool: null
- n: '4'
  text: Verify free spin, bearing retention and slow full travel without binding.
    Stop using if loose or cracked.
  parts: []
  hardware: []
  tool: null
