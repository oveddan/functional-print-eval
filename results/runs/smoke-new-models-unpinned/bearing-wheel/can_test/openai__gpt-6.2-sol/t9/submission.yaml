task: bearing-wheel
note: Flat-track guide only. If weight-bearing or unknown, use a rated replacement.
questions: []
params:
  od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: ''
  width:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: ''
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: ''
  bearing_width:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: ''
  fit:
    value: 0.05
    unit: mm
    kind: design
    source: design
    note: ''
  relief:
    value: 18
    unit: mm
    kind: design
    source: design
    note: ''
  edge:
    value: 0.8
    unit: mm
    kind: design
    source: design
