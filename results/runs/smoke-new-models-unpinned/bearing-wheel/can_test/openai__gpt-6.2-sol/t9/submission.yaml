parts:
- id: roller
  role: final
  material: PLA
  code: "def build(p):\n r=p.od/2; h=p.width; e=p.edge; b=(p.bearing_od+p.fit)/2;\
    \ a=p.relief/2\n return cq.Workplane('XZ').polyline([(a,0),(r-e,0),(r,e),(r,h-e),(r-e,h),(b,h),(b,h-2*p.bearing_width),(a,h-2*p.bearing_width)]).close().revolve(360,(0,0),(0,1))"
  print_orientation: Shoulder down, pocket up, no supports.
  use_orientation: Bolt along print Z.
hardware:
- id: bearings
  ref: 608ZZ
  qty: 2
- id: bolt
  ref: ISO 4762 M8x35
  qty: 1
- id: nut
  ref: ISO 10511 M8
  qty: 1
- id: washer
  ref: ISO 7089 M8
  qty: 3
joints: []
criteria: []
manual:
- n: '1'
  text: Secure the door. Confirm the roller only guides it, the mount accepts an M8
    through-bolt, and the track accepts a flat tread.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print with six walls. Press both bearings into the pocket by their outer rings.
    Adjust fit and reprint if either bearing is loose or requires hammering.
  parts:
  - roller
  hardware:
  - bearings
  tool: null
- n: '3'
  text: Dry-fit bolt, washer, bearing pair, washer, bracket, washer and locknut. Bolt
    must slide through by hand and fully engage nylon with a thread showing. Bearing-side
    washers must touch only inner races; if they touch shields, outer races or wheel,
    do not install. Verify free spin tightened and no rubbing throughout travel. Stop
    if wheel cracks or develops play.
  parts:
  - roller
  hardware:
  - bolt
  - washer
  - bearings
  - nut
  tool: null
