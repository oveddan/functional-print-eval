parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    r=p.diameter/2\n    s=(p.bearing_od+p.allowance)/2\n \
    \   b=p.web_bore/2\n    w=p.width\n    d=(w-p.washer_t)/2\n    c=p.edge\n    return\
    \ cq.Workplane('XZ').polyline([(s,0),(r-c,0),(r,c),(r,w-c),(r-c,w),(s,w),(s,w-d),(b,w-d),(b,d),(s,d)]).close().revolve(360,(0,0),(0,1))"
  print_orientation: Annular face on bed, axle vertical.
  use_orientation: Axle horizontal across track.
hardware:
- id: washers
  ref: ISO 7089 M8
  qty: 3
- id: nut
  ref: ISO 10511 M8
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Support the door independently. Confirm the track accepts a flat 50 mm tread
    and the original mount accepts your M8 through-bolt and approximately 19 mm washer-and-wheel
    stack. Do not modify the mount or use on a hanging door.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print wheel at 0.2 mm with six walls and no supports. Press one 608 bearing
    squarely into each face by the outer race, placing one M8 washer between the bearings
    before seating the second. Reject loose or cracked seats.
  parts: []
  hardware: []
  tool: null
- n: '3'
  text: Pass your M8 bolt through the bearings and spacer by hand, using the remaining
    washers outside the bearings. Verify all washers contact only inner races, not
    shields or outer races. If they do not, stop. Secure in the original mount with
    the locknut fully engaged and threads visible beyond nylon. Verify free spin and
    no wobble after tightening.
  parts: []
  hardware: []
  tool: null
- n: '4'
  text: With the door supported, check track engagement, anti-lift retention and clearance
    through full travel. Load gradually and roll slowly by hand. Stop if the roller
    rubs, binds, climbs the track or deforms. Use an OEM replacement if any check
    fails.
  parts: []
  hardware: []
  tool: null
