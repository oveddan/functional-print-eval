manual:
- n: '1'
  text: Before considering installation, confirm the old tread was flat and that another
    assembly carries the full door weight. Do not use this for a hanger, support roller,
    or in a position where failure can release the door. If you can't confirm its
    role, keep the print off the door and match the old roller or bracket to a rated
    replacement.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print both halves and all three spacers flat in PLA, 0.2 mm layers, no supports.
    Use the same XY compensation as the coupon, five perimeters, and high infill (e.g.
    60%) in the halves. Remove only loose burrs or first-layer flare so the halves
    close flush and the tread seam has no ridge.
  parts:
  - head_half
  - nut_half
  - center_spacer
  - head_spacer
  - mount_spacer
  hardware: []
  tool: null
- n: '3'
  text: Seat the three M3 locknuts in the hex pockets with the nylon collars facing
    out. Put the two flat faces together, align the holes and insert the screws from
    the round pockets. Snug evenly without crushing the plastic. Verify that the mating
    faces close, heads and tips are recessed, and one full thread is visible past
    each nylon collar.
  parts:
  - head_half
  - nut_half
  hardware:
  - join_screw
  - join_nut
  tool: 2.5 mm hex key
- n: '4'
  text: Push the first bearing in squarely with pressure on its outer ring. Lay the
    center spacer inside from the opposite side, then insert the second bearing the
    same way. Do not hammer or draw bearings in with the axle nut. Verify each fits
    snugly, both are square, and no shield contacts a shoulder or spacer. The center
    ring is designed to leave a little axial float rather than preload the bearings.
  parts:
  - head_half
  - nut_half
  - center_spacer
  hardware:
  - bearing
  tool: null
- n: '5'
  text: 'Bench-test the stack in this order: bolt head, steel washer, head spacer,
    first bearing, center spacer, second bearing, mount spacer. Use your M8 bolt if
    it fits; an M8x50 is only a catalog candidate. With the under-head washer fitted,
    the second bearing ends about 20.6 mm from the head underside. Both bores must
    actually slide free on smooth shank and stay clear of thread runout. The printed
    spacer-and-bearing stack is about 21.4 mm wide before washers or bracket. Turn
    the wheel while holding the bolt and lightly squeezing the stack by the stationary
    end spacers: it must spin freely, with no rubbing, loose bearing fit, or pronounced
    wobble.'
  parts:
  - head_half
  - nut_half
  - center_spacer
  - head_spacer
  - mount_spacer
  hardware:
  - bearing
  - axle_option
  - axle_washer
  tool: null
- n: '6'
  text: 'Only for a confirmed flat-track guide with a compatible through-hole bracket:
    dry-fit the stack, mount, outer steel washer and M8 locknut. Check that the nut
    can clamp the stack before it runs into the shoulder, that threads pass fully
    through the nylon, and that the axle end, bracket and track have clearance through
    the full travel. Do not drill or alter the door to make this fit. Snug only enough
    to remove play in the stationary stack; the wheel must still spin freely and the
    spacers must not crush. Check by moving the door slowly by hand, then inspect
    for rubbing, cracks, loose hardware or play. Stop using it if any appear.'
  parts:
  - head_half
  - nut_half
  - center_spacer
  - head_spacer
  - mount_spacer
  hardware:
  - bearing
  - axle_option
  - axle_washer
  - axle_nut
  tool: Hex key matched to axle head and 13 mm wrench
