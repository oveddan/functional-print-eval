task: bearing-wheel
note: Flat-tread 50 × 16 mm roller with two 608 bearings and an M8 axle. The 22.09
  mm bearing wells are based on the snug coupon fit. The mount, rail profile, axle
  length, and load-bearing role could not be verified. Treat this as a bench prototype
  unless you can confirm the door is supported independently, the original tread was
  flat, and the full axle stack fits. If the roller carries the door or you cannot
  tell, use a compatible rated replacement assembly instead.
