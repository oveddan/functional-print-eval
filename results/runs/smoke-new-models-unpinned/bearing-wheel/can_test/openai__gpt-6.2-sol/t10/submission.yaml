parts:
- id: head_half
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    h=p.old_width/2\n    s=cq.Workplane('XY').circle(p.old_od/2).extrude(h)\n\
    \    s=s.cut(cq.Workplane('XY').circle(p.shoulder_id/2).extrude(h))\n    s=s.cut(cq.Workplane('XY',origin=(0,0,h-p.seat_depth)).circle(p.seat_d/2).extrude(p.seat_depth))\n\
    \    for i in range(3):\n        a=2*math.pi*i/3\n        x=p.fastener_radius*math.cos(a)\n\
    \        y=p.fastener_radius*math.sin(a)\n        s=s.cut(cq.Workplane('XY').center(x,y).circle(p.m3_clearance/2).extrude(h))\n\
    \        s=s.cut(cq.Workplane('XY',origin=(0,0,h-p.head_pocket_depth)).center(x,y).circle(p.head_pocket_d/2).extrude(p.head_pocket_depth))\n\
    \    return s"
  print_orientation: Flat mating face on bed at z=0, pockets up. No supports.
  use_orientation: Outboard face toward M8 axle head; flat face against nut_half.
- id: nut_half
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    h=p.old_width/2\n    s=cq.Workplane('XY').circle(p.old_od/2).extrude(h)\n\
    \    s=s.cut(cq.Workplane('XY').circle(p.shoulder_id/2).extrude(h))\n    s=s.cut(cq.Workplane('XY',origin=(0,0,h-p.seat_depth)).circle(p.seat_d/2).extrude(p.seat_depth))\n\
    \    for i in range(3):\n        a=2*math.pi*i/3\n        x=p.fastener_radius*math.cos(a)\n\
    \        y=p.fastener_radius*math.sin(a)\n        s=s.cut(cq.Workplane('XY').center(x,y).circle(p.m3_clearance/2).extrude(h))\n\
    \        s=s.cut(cq.Workplane('XY',origin=(0,0,h-p.nut_pocket_depth)).center(x,y).polygon(6,p.nut_pocket_af/math.cos(math.pi/6)).extrude(p.nut_pocket_depth))\n\
    \    return s"
  print_orientation: Flat mating face on bed at z=0, pockets up. No supports.
  use_orientation: Flip relative to head_half so the flat faces meet, then align all
    three fastener holes.
- id: center_spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.axle_spacer_od/2).circle(p.axle_spacer_id/2).extrude(p.center_spacer_t)"
  print_orientation: Ring flat on bed at z=0, no supports.
  use_orientation: Between the two bearing inner races, coaxial with the M8 bolt.
- id: head_spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.axle_spacer_od/2).circle(p.axle_spacer_id/2).extrude(p.end_spacer_t)"
  print_orientation: Ring flat on bed at z=0, no supports.
  use_orientation: Between the head-side axle washer and first bearing inner race.
- id: mount_spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.axle_spacer_od/2).circle(p.axle_spacer_id/2).extrude(p.end_spacer_t)"
  print_orientation: Ring flat on bed at z=0, no supports.
  use_orientation: Between the second bearing inner race and the stationary mount.
