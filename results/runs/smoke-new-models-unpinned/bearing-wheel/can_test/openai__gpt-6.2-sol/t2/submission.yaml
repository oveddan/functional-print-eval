task: bearing-wheel
note: '50 × 16 mm flat-tread replacement using two 608 bearings. The 22.10 mm CAD
  pocket was selected from the printed fit test: the 22.09 mm as-printed seat was
  snug and retained the bearing upside down. This is a closet-door GUIDE wheel only,
  not a load-bearing roller or hanger. The track profile and bracket dimensions are
  unverified: use it only after confirming a flat tread is correct, the wheel carries
  no door weight, and the existing bracket accepts the axle and stack without modification.
  If you can''t confirm those conditions, use a matching replacement roller assembly.'
