parts:
- id: head-half
  role: final
  material: High-speed PLA
  code: "def build(p):\n    h=p.old_w/2\n    web=h-p.bearing_w\n    d=p.bearing_od+p.seat_offset\n\
    \    s=cq.Workplane('XY').circle(p.old_od/2).extrude(h)\n    s=s.cut(cq.Workplane('XY').circle(p.shoulder_id/2).extrude(h))\n\
    \    s=s.cut(cq.Workplane('XY').workplane(offset=web).circle(d/2).extrude(p.bearing_w))\n\
    \    s=s.cut(cq.Solid.makeCone(d/2,d/2+p.lead,p.lead,cq.Vector(0,0,h-p.lead)))\n\
    \    r=p.screw_r\n    pts=[(r,0),(-r,0),(0,r),(0,-r)]\n    s=s.cut(cq.Workplane('XY').pushPoints(pts).circle(p.rim_hole/2).extrude(h))\n\
    \    return s.cut(cq.Workplane('XY').workplane(offset=h-p.head_depth).pushPoints(pts).circle(p.head_pocket/2).extrude(p.head_depth))\n"
  print_orientation: Mating face at Z=0; bearing seat and screw counterbores open
    upward.
  use_orientation: Bearing pocket faces out; bed face mates with nut-half.
- id: nut-half
  role: final
  material: High-speed PLA
  code: "def build(p):\n    import math\n    h=p.old_w/2\n    web=h-p.bearing_w\n\
    \    d=p.bearing_od+p.seat_offset\n    s=cq.Workplane('XY').circle(p.old_od/2).extrude(h)\n\
    \    s=s.cut(cq.Workplane('XY').circle(p.shoulder_id/2).extrude(h))\n    s=s.cut(cq.Workplane('XY').workplane(offset=web).circle(d/2).extrude(p.bearing_w))\n\
    \    s=s.cut(cq.Solid.makeCone(d/2,d/2+p.lead,p.lead,cq.Vector(0,0,h-p.lead)))\n\
    \    r=p.screw_r\n    pts=[(r,0),(-r,0),(0,r),(0,-r)]\n    s=s.cut(cq.Workplane('XY').pushPoints(pts).circle(p.rim_hole/2).extrude(h))\n\
    \    return s.cut(cq.Workplane('XY').workplane(offset=h-p.nut_depth).pushPoints(pts).polygon(6,p.nut_af/math.cos(math.pi/6)).extrude(p.nut_depth))\n"
  print_orientation: Mating face at Z=0; bearing seat and hex pockets open upward.
  use_orientation: Flip relative to head-half so the bed faces meet and the nut pockets
    face out.
- id: center-spacer
  role: final
  material: High-speed PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.bearing_bore+p.spacer_bore_extra)/2).extrude(p.old_w-2*p.bearing_w)\n"
  print_orientation: Flat annular face at Z=0.
  use_orientation: Between bearings, around axle, contacting inner races only.
- id: outer-spacer
  role: final
  material: High-speed PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.bearing_bore+p.spacer_bore_extra)/2).extrude(p.outer_spacer_t)\n"
  print_orientation: Flat annular face at Z=0; print two copies.
  use_orientation: One on each exterior bearing face, touching the inner race only;
    keep wheel clear of bracket and metal washers.
