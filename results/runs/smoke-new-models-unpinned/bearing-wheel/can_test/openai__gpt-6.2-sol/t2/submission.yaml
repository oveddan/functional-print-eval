manual:
- n: '1'
  text: Keep the door supported. Confirm this wheel only guides the door and that
    the old tread was flat, not grooved, crowned, or flanged. Check the new 50 × 16
    mm envelope against the track. Confirm the original bracket already accepts an
    8 mm bolt and has room for the wheel, spacers and fasteners throughout travel.
    A fork needs room for the actual stack, nominally 19.2 mm between the ears; do
    not bend the ears or drill them. If any check fails or the wheel supports the
    door, stop and get the correct replacement assembly.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print both halves, one center spacer and two outer spacers in PLA at 0.2 mm,
    supports off. Use five walls on the halves and solid spacers. Lay the halves on
    their mating faces. Remove any first-layer lip or burr that prevents the mating
    faces from meeting, without altering the bearing fits.
  parts:
  - head-half
  - nut-half
  - center-spacer
  - outer-spacer
  hardware: []
  tool: null
- n: '3'
  text: Dry-fit each bearing in its pocket using even pressure on the outer race only.
    It should sit against the shoulder, approximately flush with the wheel face, fit
    snugly and spin freely. Check that each small spacer contacts only the inner race,
    with visible clearance from the shield or outer race. Check the axle slips through
    both bearings and all spacers. Do not force any fit.
  parts:
  - head-half
  - nut-half
  - center-spacer
  - outer-spacer
  hardware:
  - bearing
  - axle
  tool: null
- n: '4'
  text: With the bearings seated, place the center spacer between the inner races.
    Use the loose axle as an alignment pin. Mate the two flat back faces. Insert the
    four nuts and screws from opposite sides and snug evenly in a cross pattern. Check
    the seam closes without force and all four heads and tips sit below the wheel
    faces. If the center spacer holds the halves apart, or if clamping the inner races
    causes drag, verify the actual seated inner-race gap and reprint the spacer to
    match rather than overtightening.
  parts:
  - head-half
  - nut-half
  - center-spacer
  hardware:
  - rim-screw
  - rim-nut
  - bearing
  - axle
  tool: M3 socket-head hex key
- n: '5'
  text: Select the axle length for the actual bracket. The listed M8×40 is an example,
    not a measured fit; reuse your M8 bolt if suitable, or choose a listed M8 length.
    Add bracket thickness, actual wheel-and-spacer stack, and both washer thicknesses
    for the grip. Allow another 10.5 mm for the locknut and two full threads beyond
    it. Verify the nut reaches the threads before bottoming on any smooth shank and
    that the tip cannot hit the track or door.
  parts: []
  hardware:
  - axle
  - axle-washer
  - axle-nut
  tool: null
- n: '6'
  text: In a fork mount, stack washer, first ear, outer spacer, wheel, outer spacer,
    second ear, washer and locknut. For an existing one-sided through-bolt bracket
    only, put the bracket between the bracket-side outer spacer and its washer; keep
    one spacer on each wheel face. Do not substitute this for a captive or threaded
    axle mount. Hold the bolt while snugging the locknut just enough to remove play.
    The axle should stay still and the wheel should spin freely; washers and bracket
    must not touch the wheel or bearing shields. If it binds or still rocks, stop
    and correct the fit.
  parts:
  - head-half
  - nut-half
  - center-spacer
  - outer-spacer
  hardware:
  - axle
  - axle-washer
  - axle-nut
  tool: M8 socket-head hex key and 13 mm wrench
- n: '7'
  text: With the door still supported, move it slowly by hand through its full travel
    and check for side rub, wobble or derailment. Recheck after the first few uses.
    Stop using it if the wheel loosens, cracks, binds, or develops play.
  parts: []
  hardware: []
  tool: null
