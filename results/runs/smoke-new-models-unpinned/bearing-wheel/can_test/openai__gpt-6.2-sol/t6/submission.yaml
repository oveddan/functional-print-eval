task: bearing-wheel
note: Flat-tread trial wheel only for a captive bottom-running door. Use a rated replacement
  if failure could let the door fall.
questions: []
params:
  od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: ''
  w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: ''
  bearing:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: ''
  depth:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: ''
  fit:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: ''
  lip:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    a=cq.Workplane('XY').circle(p.od/2).circle(p.lip/2).extrude(p.w)\n\
    \    for z in (0,p.w-p.depth):\n        a=a.cut(cq.Workplane('XY').workplane(offset=z).circle((p.bearing+p.fit)/2).extrude(p.depth))\n\
    \    return a"
  print_orientation: Annular face at z=0 on bed.
  use_orientation: Axis along M8 bolt.
hardware:
- id: bolt
  ref: ISO 4762 M8x35
  qty: 1
- id: nut
  ref: ISO 10511 M8
  qty: 1
- id: washers
  ref: ISO 7089 M8
  qty: 2
joints: []
criteria: []
manual:
- n: '1'
  text: Support door independently. Verify flat tread matches track and wheel clears
    bracket. Print without supports with six walls and solid infill.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Seat one of your 608ZZ bearings from each end, pressing only outer races.
    Reject cracked or loose fits.
  parts: []
  hardware: []
  tool: null
- n: '3'
  text: 'Mount wheel on bolt with washers outside bearings and secure with locknut.
    Verify axle is retained, threads emerge through nylon, and washers clear shields
    and wheel. There is no inner spacer: set nut for free spin and minimal play, not
    hard clamping. Stop if bracket needs a torqued stack or bolt length is incompatible.'
  parts: []
  hardware: []
  tool: null
- n: '4'
  text: Verify track capture and free rotation before transferring load. Test slowly;
    stop for wobble, cracks, binding or nut movement.
  parts: []
  hardware: []
  tool: null
