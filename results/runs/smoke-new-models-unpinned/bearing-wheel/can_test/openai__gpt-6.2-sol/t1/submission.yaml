parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n w=cq.Workplane('XY').circle(p.od/2).circle(p.relief/2).extrude(p.w)\n\
    \ return w.faces('>Z').workplane().circle((p.bd+p.fit)/2).cutBlind(-p.bw)"
  print_orientation: Flat annulus down.
  use_orientation: Tread on track.
- id: long
  role: final
  material: PLA
  code: "def build(p):\n return cq.Workplane('XY').circle(p.s/2).circle(p.b/2).extrude(p.w-p.bw+p.extra)"
  print_orientation: End down.
  use_orientation: Recess side against inner race.
- id: short
  role: final
  material: PLA
  code: "def build(p):\n return cq.Workplane('XY').circle(p.s/2).circle(p.b/2).extrude(p.extra)"
  print_orientation: End down.
  use_orientation: Pocket side against inner race.
hardware:
- id: bolt
  ref: ISO 4762 M8x35
  qty: 1
- id: nut
  ref: ISO 10511 M8
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Verify the track accepts a flat tread and the bracket accepts M8 and has room
    for wheel, spacers and fastener. Do not use on top-hung doors or doors that can
    fall if a roller fails.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print support-free with six walls and solid infill. Press one 608 squarely
    into the pocket by its outer race. Keep the second as a spare. Adjust fit and
    reprint if loose or too tight to seat without damage.
  parts:
  - wheel
  - long
  - short
  hardware: []
  tool: null
- n: '3'
  text: Stack bolt head, short spacer, bearing in wheel, long spacer, bracket, locknut.
    Both spacers must touch only the inner race, not the shields. Use your M8 bolt
    if it fits and threads fully through the locknut; verify the listed bolt likewise.
    Snug without crushing spacers. Check the wheel spins freely and the axle stays
    fixed.
  parts:
  - wheel
  - long
  - short
  hardware:
  - bolt
  - nut
  tool: null
- n: '4'
  text: Reinstall original guides and retainers. Test slowly by hand. Stop if it binds,
    climbs, cracks or loosens. Inspect after initial use and periodically; prefer
    a factory roller for permanent service.
  parts: []
  hardware: []
  tool: null
