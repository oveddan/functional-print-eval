task: bearing-wheel
note: Flat-tread prototype only for bottom-supported doors with independent anti-lift
  retention. Use a rated replacement for permanent service.
questions: []
params:
  d:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: ''
  w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: ''
  b:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: ''
  h:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: ''
  a:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: ''
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    w=cq.Workplane('XY').circle(p.d/2).circle(9.5).extrude(p.w)\n\
    \    for z in (0,p.w-p.h):\n        w=w.cut(cq.Workplane('XY',origin=(0,0,z)).circle((p.b+0.1)/2).extrude(p.h))\n\
    \    return w"
  print_orientation: Annular face down, no supports
  use_orientation: Axle through center; tread on flat track
- id: collar
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(5.5).circle((p.a+0.4)/2).extrude((p.w-2*p.h)/2)"
  print_orientation: Flat on bed; print four
  use_orientation: Two between inner races and one outside each bearing
hardware:
- id: nut
  ref: ISO 10511 M8
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Confirm flat track, bottom support, anti-lift retention, and space for wheel
    and collars. If unconfirmed, do not install. Print wheel solid with six perimeters.
  parts:
  - wheel
  - collar
  hardware: []
  tool: null
- n: '2'
  text: Seat bearings from opposite faces with two collars between them. Push only
    on outer races; reject loose seats or cracked PLA. Add one collar outside each
    bearing. Check collars contact inner races only, not shields.
  parts:
  - wheel
  - collar
  hardware: []
  tool: null
- n: '3'
  text: Use existing M8 bolt only if bracket positively captures it, both bearings
    fit the smooth shank, and locknut fully engages. Snug the inner-race stack and
    verify free spinning without play or rubbing. Test slowly with door supported.
    Stop if binding, cracking or looseness occurs.
  parts:
  - wheel
  - collar
  hardware:
  - nut
  tool: null
