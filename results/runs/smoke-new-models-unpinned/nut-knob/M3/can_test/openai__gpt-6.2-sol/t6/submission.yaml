task: nut-knob/M3
note: One-piece, 20 mm six-scallop PLA hand knob. The 5.65 mm modeled hex pocket was
  the only tested size that accepted and held the nut. A solid shoulder under the
  nut prevents push-through while leaving a central M3 clearance bore.
questions: []
