task: nut-knob/M3
note: One-piece, 20 mm scalloped M3 thumb knob. The ISO 4032 nut presses into the
  top and sits nominally 0.6 mm below the rim. Three small ribs retain it; a solid
  shoulder stops it from passing through the bottom, while a Ø3.5 mm through-hole
  clears the bolt. The coupon fit was not confirmed, so the final model uses the middle
  rib size as a starting point.
questions: []
