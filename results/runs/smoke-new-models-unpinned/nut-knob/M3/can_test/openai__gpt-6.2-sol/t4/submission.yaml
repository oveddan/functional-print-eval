task: nut-knob/M3
note: A single Ø20 mm scalloped PLA knob with a recessed hex pocket, three small press-fit
  ribs, and a through-hole for your existing M3 bolt. The solid shoulder stops the
  nut from passing through the underside; the ribs retain it when the pocket faces
  down. The coupon results were inconclusive, so the middle rib fit is the starting
  point and should be checked with your nut before use.
