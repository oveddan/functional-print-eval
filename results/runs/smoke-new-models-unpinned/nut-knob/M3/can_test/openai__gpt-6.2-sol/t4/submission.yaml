parts:
- id: knob
  role: final
  material: Black high-speed PLA
  code: "import math\n\ndef build(p):\n    h=p.part_height\n    pocket_depth=p.nut_height+p.pocket_recess\n\
    \    a=(p.nut_af+p.pocket_extra_af)/2\n    bore_r=(p.bolt_nominal_d+p.bore_diametral_clearance)/2\n\
    \    s=cq.Workplane('XY').circle(p.knob_od/2).extrude(h)\n    for i in range(int(p.scallop_count)):\n\
    \        t=2*math.pi*i/p.scallop_count\n        r=p.scallop_center_radius\n  \
    \      s=s.cut(cq.Workplane('XY').center(r*math.cos(t),r*math.sin(t)).circle(p.scallop_radius).extrude(h))\n\
    \    pts=[]\n    for i in range(6):\n        t=i*math.pi/3\n        c,d=math.cos(t),math.sin(t)\n\
    \        row=[(a,-a/math.sqrt(3))]\n        if i%2==0:\n            row.extend([(a,-p.rib_base/2),(a-p.rib_inset,-p.rib_tip/2),(a-p.rib_inset,p.rib_tip/2),(a,p.rib_base/2)])\n\
    \        pts.extend((u*c-v*d,u*d+v*c) for u,v in row)\n    straight=cq.Workplane('XY',origin=(0,0,h-pocket_depth)).polyline(pts).close().extrude(pocket_depth)\n\
    \    k=1+p.lead_radial/a\n    lead=cq.Workplane('XY',origin=(0,0,h-p.lead_height)).polyline(pts).close().workplane(offset=p.lead_height).polyline([(k*x,k*y)\
    \ for x,y in pts]).close().loft(ruled=True)\n    bore=cq.Workplane('XY').circle(bore_r).extrude(h)\n\
    \    relief=cq.Workplane('XY').circle(bore_r+p.bore_entry_relief).workplane(offset=p.bore_entry_relief).circle(bore_r).loft(ruled=True)\n\
    \    return s.cut(straight).cut(lead).cut(bore).cut(relief)"
  print_orientation: Flat bearing face at z=0; hex pocket up. Print without supports.
  use_orientation: Flat bearing face toward the workpiece in normal use; the nut pocket
    faces outward. The bolt can thread through from either side.
