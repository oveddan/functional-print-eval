  - bolt_nominal_d
  - bore_diametral_clearance
  - part_height
  check:
    method: measure
    ref: null
    description: Thread your M3 bolt through the seated nut. With adequate threaded
      length, it should emerge from the opposite face without rubbing or binding in
      the PLA.
manual:
- n: '1'
  text: Print the knob with the flat face on the bed and the hex pocket up, at 0.2
    mm layers, with four walls and no supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align the nut’s flats with the hex pocket. Press it in squarely with your
    thumb until it rests on the shoulder and is fully below the rim. Do not hammer
    it or use the bolt to force it in. If it will not seat by hand, regenerate with
    rib_inset = 0.20 mm. If it seats but falls out, try 0.36 mm instead.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: With no bolt installed, turn the knob pocket-side down and give it a light
    shake. The nut must stay seated. Then thread the knob onto your M3 bolt by hand,
    normally with the flat face toward the workpiece. Check that the bolt passes through
    and that the nut does not spin in the pocket. Use finger torque only.
  parts:
  - knob
  hardware:
  - nut
  tool: null
