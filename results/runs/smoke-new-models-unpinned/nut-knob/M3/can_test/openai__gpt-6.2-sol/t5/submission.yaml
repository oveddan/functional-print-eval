task: nut-knob/M3
note: One-piece 20 mm scalloped knob. The pocket shoulder stops nut push-through while
  the 3.5 mm bore passes the bolt. Press fit is not print-verified.
questions: []
params:
  af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  od:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
  fit:
    value: -0.05
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n s=cq.Workplane('XY').circle(p.od/2).extrude(7)\n\
    \ for i in range(8):\n  a=i*math.pi/4\n  r=p.od/2+0.6\n  s=s.cut(cq.Workplane('XY').center(r*math.cos(a),r*math.sin(a)).circle(2).extrude(7))\n\
    \ s=s.cut(cq.Workplane('XY').circle((p.d+0.5)/2).extrude(7))\n z=7-p.h-0.4\n D=2*(p.af+p.fit)/math.sqrt(3)\n\
    \ pocket=cq.Workplane('XY').workplane(offset=z).polygon(6,D).extrude(7-z)\n lead=cq.Workplane('XY').workplane(offset=6.65).polygon(6,D).workplane(offset=0.35).polygon(6,D+1.4/math.sqrt(3)).loft()\n\
    \ return s.cut(pocket).cut(lead)"
  print_orientation: Flat face at z=0 down, pocket up.
  use_orientation: Flat face toward work.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print flat without supports at 0.2 mm layers.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align the hex and thumb-press the nut until it bottoms below the rim. Invert
    and gently shake to verify retention. If too tight to seat by hand, increase fit
    by 0.05 mm and reprint; if loose, decrease fit by 0.05 mm and reprint.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Feed your M3 bolt from the flat face and thread it through until it emerges
    on the pocket side. Hand-tighten only.
  parts:
  - knob
  hardware:
  - nut
  tool: null
