task: nut-knob/M3
note: One-piece 20 mm scalloped knob with recessed press-fit nut and a solid stop
  shoulder around the 3.5 mm through-hole.
questions: []
params:
  af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  nh:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bd:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n s=cq.Workplane('XY').circle(10).extrude(7)\n\
    \ for i in range(8):\n  a=i*math.pi/4\n  s=s.cut(cq.Workplane('XY').center(10*math.cos(a),10*math.sin(a)).circle(2).extrude(7))\n\
    \ s=s.cut(cq.Workplane('XY').circle((p.bd+.5)/2).extrude(7))\n d=p.nh+.45\n f=p.af-.06\n\
    \ return s.cut(cq.Workplane('XY').workplane(offset=7-d).polygon(6,2*f/math.sqrt(3)).extrude(d)).cut(cq.Workplane('XY').workplane(offset=6.6).polygon(6,2*f/math.sqrt(3)).workplane(offset=.4).polygon(6,2*(p.af+.4)/math.sqrt(3)).loft())"
  print_orientation: Flat base down
  use_orientation: Pocket toward incoming bolt
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print pocket up without supports at 0.2 mm layers.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align flats and thumb-press the nut to the shoulder below the rim. Invert
    and shake gently over a table to check retention. If loose, decrease f by 0.05
    mm and reprint; if too tight for hand insertion, increase f by 0.05 mm and reprint.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Thread the M3 bolt in from the pocket side and confirm it exits the flat face
    freely.
  parts:
  - knob
  hardware:
  - nut
  tool: null
