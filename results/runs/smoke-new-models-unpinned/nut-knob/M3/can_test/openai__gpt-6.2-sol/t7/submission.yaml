task: nut-knob/M3
note: One-piece, six-scallop, Ø20 × 6.2 mm hand knob. Uses the 5.72 mm CAD pocket
  from test D, which held the nut on the user's printer. The recessed hex prevents
  rotation, the press fit retains the unloaded nut, and the solid shoulder around
  the through-bore backs the nut during tightening. Test D is geometrically identical
  to the final part and can be used directly if it passes the final checks.
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
