task: nut-knob/M3
note: ''
questions: []
params:
  od:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
  af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  fit:
    value: -0.08
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n a=p.af+p.fit\n s=cq.Workplane('XY').circle(p.od/2).extrude(6)\n\
    \ for i in range(8):\n  t=i*math.pi/4\n  s=s.cut(cq.Workplane('XY').center((p.od/2+0.6)*math.cos(t),(p.od/2+0.6)*math.sin(t)).circle(2).extrude(6))\n\
    \ s=s.cut(cq.Workplane('XY').circle((p.d+0.5)/2).extrude(6))\n s=s.cut(cq.Workplane('XY').workplane(offset=6-p.h-0.4).polygon(6,2*a/math.sqrt(3)).extrude(p.h+0.4))\n\
    \ return s.cut(cq.Workplane('XY').workplane(offset=5.6).polygon(6,2*a/math.sqrt(3)).workplane(offset=0.4).polygon(6,2*(a+0.4)/math.sqrt(3)).loft())"
  print_orientation: Pocket up, flat bottom at z=0
  use_orientation: Pocket faces incoming bolt
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print pocket up without supports. Align the nut flats and thumb-press until
    the nut bottoms below the rim. Flip and lightly shake to verify retention. If
    loose, decrease fit by 0.05 mm; if too tight, increase fit by 0.05 mm and reprint.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '2'
  text: Start the M3 bolt from the pocket side and confirm it exits the other side
    freely. Tighten by hand.
  parts:
  - knob
  hardware:
  - nut
  tool: null
