task: nut-knob/M3
note: One-piece 20 mm PLA hand knob. The 5.65 mm across-flats hex pocket is the fit
  that held in the printed coupon; the 5.35 and 5.50 mm pockets did not accept the
  nut. The pocket has a thumb-start lead-in, and its floor is a solid shoulder around
  the through-bore. The shoulder, not the press fit, takes the tightening load when
  the flat face is toward the work. Use the existing M3 bolt; its required length
  depends on the workpiece.
questions: []
