  diam:
    value: 20
    unit: mm
    kind: world
    source: asked
    note: ''
  af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  nh:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  rib:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n h=8\n d=p.nh+0.6\n a=p.af/2+0.06\n s=cq.Workplane('XY').circle(p.diam/2).extrude(h)\n\
    \ for i in range(8):\n  t=i*math.pi/4\n  s=s.cut(cq.Workplane('XY').center(p.diam/2*math.cos(t),p.diam/2*math.sin(t)).circle(2).extrude(h))\n\
    \ s=s.cut(cq.Workplane('XY').circle((p.bolt+0.5)/2).extrude(h))\n s=s.cut(cq.Workplane('XY').workplane(offset=h-d).polygon(6,4*a/math.sqrt(3)).extrude(d))\n\
    \ for t in (30,150,270):\n  b=cq.Workplane('XY').center(a+0.25-p.rib,0).rect(0.5,0.8).extrude(d-0.5).translate((0,0,h-d)).rotate((0,0,0),(0,0,1),t)\n\
    \  s=s.union(b)\n return s"
  print_orientation: Flat base at z=0; pocket up.
  use_orientation: Pocket faces workpiece.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print pocket up without supports at 0.2 mm layer height.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align flats and press the nut in by hand until it bottoms out below the rim.
    Invert and lightly shake to check retention. If loose, increase rib by 0.04 mm
    and reprint; if too tight, reduce it by 0.04 mm.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Start your M3 bolt from the pocket side. Check that it exits freely through
    the flat end. The pocket floor stops the nut from passing through.
  parts:
  - knob
  hardware:
  - nut
  tool: null
