parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    r=p.diameter/2\n    h=p.height\n    depth=p.nut_h+p.recess\n\
    \    s=cq.Workplane('XY').circle(r).extrude(h)\n    pts=[(r*math.cos(i*math.pi/4),r*math.sin(i*math.pi/4))\
    \ for i in range(8)]\n    s=s.cut(cq.Workplane('XY').pushPoints(pts).circle(p.scallop).extrude(h))\n\
    \    c=math.cos(math.pi/6)\n    d=(p.af+p.fit)/c\n    s=s.cut(cq.Workplane('XY').workplane(offset=h-depth).polygon(6,d).extrude(depth))\n\
    \    s=s.cut(cq.Workplane('XY').workplane(offset=h-p.lead).polygon(6,d).workplane(offset=p.lead).polygon(6,d+2*p.lead/c).loft())\n\
    \    return s.cut(cq.Workplane('XY').circle((p.bolt_d+p.extra)/2).extrude(h))"
  print_orientation: Flat shoulder-side face on bed; pocket up, no supports.
  use_orientation: Bolt enters from recessed nut side and exits through round bore.
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print at 0.2 mm layer height with no supports. Remove any burrs from the pocket
    and bore.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align the flats and press the nut squarely into the pocket by hand until it
    bottoms below the rim. Invert and shake gently to verify retention. If the nut
    will not seat by hand, increase fit by 0.05 mm and reprint. If it falls out, decrease
    fit by 0.05 mm and reprint.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Start your M5 bolt from the recessed nut side and turn by hand until the bolt
    emerges from the round bore. This direction loads the solid shoulder rather than
    relying on friction to resist tightening.
  parts:
  - knob
  hardware:
  - nut
  tool: null
