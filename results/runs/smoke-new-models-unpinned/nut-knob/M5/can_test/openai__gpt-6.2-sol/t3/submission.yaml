  od:
    value: 30
    unit: mm
    kind: design
    source: design
    note: ''
  af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  nh:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bd:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
