parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n r=p.od/2; a=p.af+p.fit; d=p.nh+0.6; h=6+d\n\
    \ s=cq.Workplane('XY').circle(r).extrude(h)\n for i in range(8):\n  t=i*math.pi/4\n\
    \  s=s.cut(cq.Workplane('XY').center(r*math.cos(t),r*math.sin(t)).circle(3).extrude(h))\n\
    \ s=s.cut(cq.Workplane('XY').circle((p.bd+0.5)/2).extrude(h))\n s=s.cut(cq.Workplane('XY').workplane(offset=6).polygon(6,2*a/math.sqrt(3)).extrude(d))\n\
    \ return s.cut(cq.Workplane('XY').workplane(offset=h-0.6).polygon(6,2*a/math.sqrt(3)).workplane(offset=0.6).polygon(6,2*(a+1.2)/math.sqrt(3)).loft())"
  print_orientation: Flat underside on bed, pocket up.
  use_orientation: Pocket faces incoming bolt.
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print flat-side down in PLA at 0.2 mm, no supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align flats and press the nut in by hand until it seats below the rim against
    the shoulder. Invert over a tray; the nut must stay in. If loose, decrease fit
    by 0.05 mm and reprint; if too tight to seat by hand, increase fit by 0.05 mm
    and reprint.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Thread your M5 bolt in from the nut side and verify it exits freely through
    the opposite face.
  parts:
  - knob
  hardware:
  - nut
  tool: null
