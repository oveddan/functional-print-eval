task: nut-knob/M5
note: 30 mm scalloped hand knob with a recessed press-fit hex pocket, positive stop
  shelf, and 5.6 mm through-bore. No glue required; check retention with your actual
  nut.
questions: []
params:
  af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  fit:
    value: -0.08
    unit: mm
    kind: design
    source: design
    note: ''
  bore:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: ''
  diameter:
    value: 30
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n r=p.diameter/2\n h=10\n z=h-p.nut_h-0.5\n s=cq.Workplane('XY').circle(r).extrude(h)\n\
    \ for i in range(8):\n  a=i*math.pi/4\n  s=s.cut(cq.Workplane('XY').center(r*math.cos(a),r*math.sin(a)).circle(3).extrude(h))\n\
    \ s=s.cut(cq.Workplane('XY').circle(p.bore/2).extrude(h))\n def pts(af):\n  return\
    \ [(af/math.sqrt(3)*math.cos(i*math.pi/3),af/math.sqrt(3)*math.sin(i*math.pi/3))\
    \ for i in range(6)]\n af=p.af+p.fit\n s=s.cut(cq.Workplane('XY').workplane(offset=z).polyline(pts(af)).close().extrude(h-z))\n\
    \ return s.cut(cq.Workplane('XY').workplane(offset=h-0.8).polyline(pts(af)).close().workplane(offset=0.8).polyline(pts(af+1.6)).close().loft())"
  print_orientation: Flat face at z=0, pocket up
  use_orientation: Pocket toward workpiece; bolt exits flat face.
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print pocket-up at 0.2 mm with four walls and no supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align the flats and press the nut squarely by hand until it bottoms on the
    shelf, below the rim. If it will not seat by hand, increase fit by 0.10 mm and
    reprint.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Invert and gently shake over a tray. If the nut is loose, decrease fit by
    0.10 mm and reprint. Check that your M5 bolt threads through the nut and exits
    the flat face freely.
  parts:
  - knob
  hardware:
  - nut
  tool: null
