task: nut-knob/M5
note: One-piece, 30 mm six-scallop hand knob. The final 8.10 mm hex pocket matches
  the coupon that seated snugly and retained the nut when inverted and shaken. The
  nut sits nominally 1.50 mm below the open face. A solid shoulder stops the nut,
  while a coaxial round hole lets the M5 bolt pass through.
