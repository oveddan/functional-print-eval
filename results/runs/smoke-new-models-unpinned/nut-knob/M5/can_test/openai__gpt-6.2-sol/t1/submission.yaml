manual:
- n: '1'
  text: Print with the round-hole face flat on the bed and the hex pocket up. Use
    the same PLA and dimensional settings as the successful coupon, at 0.2 mm layers
    with no supports.
  parts:
  - m5-hand-knob
  hardware: []
  tool: null
- n: '2'
  text: With the print off the bed, align the nut flats with the pocket and press
    it in squarely by thumb until it sits flat on the shoulder. The entire nut should
    be below the rim. Do not hammer it or add glue.
  parts:
  - m5-hand-knob
  hardware:
  - m5-nut
  tool: null
- n: '3'
  text: Invert the assembled knob over your palm and shake it gently. The nut should
    stay put before the bolt is installed.
  parts:
  - m5-hand-knob
  hardware:
  - m5-nut
  tool: null
- n: '4'
  text: Start your M5 bolt from the open hex face, turn the knob by hand, and check
    that the tip emerges through the round hole without rubbing or binding. Use a
    bolt long enough to do so once installed. Hand-tighten only.
  parts:
  - m5-hand-knob
  hardware:
  - m5-nut
  tool: null
