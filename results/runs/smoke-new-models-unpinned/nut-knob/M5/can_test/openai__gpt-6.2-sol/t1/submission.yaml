parts:
- id: m5-hand-knob
  role: final
  material: Black high-speed PLA
  code: "from math import sqrt, cos, sin, pi\n\ndef build(p):\n    body = cq.Workplane('XY').circle(p.knob_od/2).extrude(p.height)\n\
    \    n = int(p.scallop_count)\n    for i in range(n):\n        a = 2*pi*i/n\n\
    \        x = p.scallop_pitch_radius*cos(a)\n        y = p.scallop_pitch_radius*sin(a)\n\
    \        cutter = cq.Workplane('XY',origin=(x,y,-1)).circle(p.scallop_radius).extrude(p.height+2)\n\
    \        body = body.cut(cutter)\n    d = 2*p.pocket_af/sqrt(3)\n    pocket =\
    \ cq.Workplane('XY',origin=(0,0,p.floor_t)).polygon(6,d).extrude(p.height-p.floor_t)\n\
    \    lead = cq.Workplane('XY',origin=(0,0,p.height-p.lead_h)).polygon(6,d).workplane(offset=p.lead_h).polygon(6,2*(p.pocket_af+p.lead_af)/sqrt(3)).loft(ruled=True)\n\
    \    exit_hole = cq.Workplane('XY',origin=(0,0,-1)).circle(p.exit_d/2).extrude(p.floor_t+2)\n\
    \    return body.cut(pocket).cut(lead).cut(exit_hole)"
  print_orientation: Flat face with the round exit on the bed at z=0; hex pocket opens
    upward. No supports.
  use_orientation: Press the nut into the open hex face. Start the M5 bolt from that
    face so its tip exits through the round hole in the opposite face.
