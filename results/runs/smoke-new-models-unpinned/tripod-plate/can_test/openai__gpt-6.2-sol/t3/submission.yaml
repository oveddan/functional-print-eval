task: tripod-plate
note: Unloaded fit prototype only. Width alone does not identify the clamp. Use a
  matching metal plate to hold the camera.
questions: []
params:
  width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: ''
  head:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: ''
  shaft:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  slope:
    value: 3
    unit: mm
    kind: world
    source: guessed
    note: ''
parts:
- id: plate
  role: final
  material: PLA
  code: "def build(p):\n a=p.width/2\n b=a-p.slope\n s=cq.Workplane('XZ').polyline([(-a,0),(a,0),(b,p.slope),(b,11),(-b,11),(-b,p.slope)]).close().extrude(22.5,both=True)\n\
    \ return s.cut(cq.Workplane('XY').circle((p.head+0.8)/2).extrude(5.4)).cut(cq.Workplane('XY').circle((p.shaft+0.5)/2).extrude(11))"
  print_orientation: Wide face at z=0, no supports
  use_orientation: Wide face toward clamp floor
hardware:
- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Check unloaded fit only. The assumed 45-degree dovetail must match screw-operated
    jaws; do not use in a lever latch.
  parts:
  - plate
  hardware: []
  tool: null
- n: '2'
  text: Insert the metal screw from below to check head clearance. Do not print the
    screw. Before using a matching metal replacement, verify camera thread, usable
    socket depth and required engagement. A bottomed screw can feel tight without
    holding the camera.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
