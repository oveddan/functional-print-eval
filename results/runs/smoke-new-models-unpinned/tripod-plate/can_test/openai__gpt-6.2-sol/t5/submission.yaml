task: tripod-plate
note: Fit gauge only; not approved for mounting a camera. The trial printed cleanly,
  but the 38 mm width does not establish the jaw profile or positive retention, and
  the camera's allowable screw insertion depth is unknown. A printed PLA screw is
  not recommended. For camera use, identify the tripod head and get its matching quick-release
  plate with a metal 1/4-20 camera screw.
questions: []
params:
  receiver_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: Reported width of plate accepted by the clamp; not a complete profile.
  fit_allowance:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: Total width reduction for this trial.
  jaw_rise:
    value: 3
    unit: mm
    kind: world
    source: guessed
    note: Trial bevel rises 3 mm and runs 3 mm per side; not a measured clamp dimension.
  gauge_length:
    value: 42
    unit: mm
    kind: design
    source: design
    note: ''
  plate_height:
    value: 11.4
    unit: mm
    kind: design
    source: design
    note: ''
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Approximate width across the salvaged head.
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Approximate.
  bolt_length:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: Approximate length from underside of head to tip.
  bolt_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal 1/4-20.
  pocket_d_clearance:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: Diametral allowance on the estimated head width.
  pocket_depth:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: ''
  shank_hole_d:
    value: 7
    unit: mm
    kind: design
    source: design
    note: ''
  camera_insertion_max:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: Check the camera manufacturer's specification; do not use the gauge on the
      camera.
parts:
- id: fit-gauge
  role: coupon
  material: High-speed PLA, black
  code: "def build(p):\n    w = p.receiver_width-p.fit_allowance\n    h = p.plate_height\n\
    \    r = p.jaw_rise\n    narrow = w-2*r\n    g = (cq.Workplane('XY').rect(narrow,p.gauge_length).workplane(offset=h-r).rect(narrow,p.gauge_length).workplane(offset=r).rect(w,p.gauge_length).loft(ruled=True))\n\
    \    s = cq.Workplane('XY').circle(p.shank_hole_d/2).extrude(h)\n    pocket =\
    \ cq.Workplane('XY').workplane(offset=h-p.pocket_depth).circle((p.bolt_head_d+p.pocket_d_clearance)/2).extrude(p.pocket_depth)\n\
    \    return g.cut(s).cut(pocket)"
  print_orientation: Flat narrow face on bed at z=0; head recess opens upward. Print
    at 0.2 mm without supports.
  use_orientation: Flip the wide, recessed face down into the empty tripod receiver.
    Never attach a camera to this coupon.
hardware:
- id: bench-bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints: []
criteria:
- id: jaw-fit
  part: fit-gauge
  feature: Trial bevels and clamp-side face
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - receiver_width
  - fit_allowance
  - jaw_rise
  check:
    method: coupon
    ref: fit-gauge
    description: With no camera or screw present, check for flat seating, visible
      lip overlap on both sides, and knob travel left after gripping. Check by hand
      for sliding, rocking, or lifting. A pass is a geometry check, not a load test.
- id: bench-head-fit
  part: fit-gauge
  feature: Head recess and shank clearance hole
  relation: clears
  hardware: bench-bolt
  clearance_mm: null
  params:
  - bolt_head_d
  - bolt_head_h
  - bolt_length
  - pocket_depth
  - plate_height
  - shank_hole_d
  check:
    method: measure
    ref: null
    description: Off the tripod, seat the loose screw and measure tip protrusion beyond
      the narrow face. Confirm the head does not stand proud of the wide face. Expected
      tip protrusion is about 4 mm, not a verified safe insertion depth.
manual:
- n: '1'
  text: Use the already printed fit gauge, or print it narrow-face down without supports.
    Remove any brim or loose strings before checking fit.
  parts:
  - fit-gauge
  hardware: []
  tool: null
- n: '2'
  text: With the tripod empty, open the knob and place the gauge wide face down. Snug
    the knob by hand. Look for flat seating and overlap on both bevels, then gently
    check for sliding, rocking, or lifting. Remove it after the check. Do not force
    the knob or treat a snug fit as proof that the plate can carry a camera.
  parts:
  - fit-gauge
  hardware: []
  tool: null
- n: '3'
  text: 'Optional bench check only: with the gauge off the tripod, place the salvaged
    screw in the recess and measure the protrusion above the opposite face. Do not
    thread the screw into the camera as a depth test.'
  parts:
  - fit-gauge
  hardware:
  - bench-bolt
  tool: Calipers
- n: '4'
  text: For actual use, ask your friend for the tripod head model and locate the original
    plate or get the matching replacement with its metal camera screw. Follow the
    camera and plate manufacturers' fit instructions.
  parts: []
  hardware: []
  tool: null
