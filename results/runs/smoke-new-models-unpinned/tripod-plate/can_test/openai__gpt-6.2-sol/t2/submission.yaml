parts:
- id: plate
  role: final
  material: PLA
  code: "def build(p):\n w=p.w/2; a=w-p.j\n plate=cq.Workplane('XZ').polyline([(-w,0),(w,0),(a,p.j),(a,p.t),(-a,p.t),(-a,p.j)]).close().extrude(p.l/2,both=True)\n\
    \ return plate.cut(cq.Workplane('XY').circle((p.d+1)/2).extrude(p.h+0.6)).cut(cq.Workplane('XY').circle((p.s+0.55)/2).extrude(p.t))"
  print_orientation: Wide face down at z=0; no supports.
  use_orientation: Wide face down in clamp.
hardware:
- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: 'Print with five walls and solid infill. Test the empty plate: both lips must
    overlap and contact the bevels broadly, with no rocking, sliding or lift-out under
    hand pressure. Reject any mismatch; the jaw profile is guessed.'
  parts:
  - plate
  hardware: []
  tool: null
- n: '2'
  text: Insert the metal bolt from below. Verify the head is recessed, the camera
    socket is 1/4-20, and measured protrusion (nominal 4.6 mm) is within the camera
    manufacturer's allowed engagement. Do not proceed if unknown or if the bolt bottoms
    before the camera sits flush.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '3'
  text: Use only briefly with a lightweight camera supported by hand at low height.
    Hand-snug only. Never use overhead or unattended. Replace with the correct metal
    plate.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
