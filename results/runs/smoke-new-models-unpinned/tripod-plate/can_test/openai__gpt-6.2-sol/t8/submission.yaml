task: tripod-plate
note: 'Fit prototype only: the 38 mm width does not establish the dovetail profile.
  Use the original metal plate for camera use.'
questions: []
params:
  wide:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: ''
  neck:
    value: 32
    unit: mm
    kind: world
    source: guessed
    note: ''
  depth:
    value: 3
    unit: mm
    kind: world
    source: guessed
    note: ''
  head:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: ''
  hh:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bolt_length:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: ''
  diam:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: ''
parts:
- id: plate
  role: final
  material: PLA
  code: "def build(p):\n    a,b=p.neck/2,p.wide/2\n    h=11\n    z=h-p.depth\n   \
    \ q=cq.Workplane('XZ').polyline([(-a,0),(a,0),(a,z),(b,h),(-b,h),(-a,z)]).close().extrude(21,both=True)\n\
    \    q=q.cut(cq.Workplane('XY').circle((p.diam+0.45)/2).extrude(h))\n    d=p.hh+0.4\n\
    \    return q.cut(cq.Workplane('XY').workplane(offset=h-d).circle((p.head+0.8)/2).extrude(d))"
  print_orientation: Camera face on bed at z=0.
  use_orientation: Broad dovetail face toward tripod.
hardware:
- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print without supports. Test the empty plate only in a screw-tightened dovetail
    clamp, not a drop-in latch. Both angled faces must seat without rocking or slipping
    under a firm hand pull and twist.
  parts:
  - plate
  hardware: []
  tool: null
- n: '2'
  text: Insert the metal bolt from the recessed face. Confirm its head sits below
    the clamp face. Nominal thread projection is 4.4 mm; measure it and confirm the
    camera socket is matching 1/4-20 and deep enough that the bolt cannot bottom before
    the plate seats. Do not print the screw or use this prototype to support the camera.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
