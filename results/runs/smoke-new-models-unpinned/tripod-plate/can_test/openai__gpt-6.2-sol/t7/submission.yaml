task: tripod-plate
note: Provisional 38 mm drop-in dovetail plate for a knob-tightened tripod clamp,
  with a recessed salvaged metal 1/4-20 camera screw. The coupon printed cleanly,
  but jaw engagement and socket depth were not verified. The 45-degree flank and interpretation
  of 38 mm as the widest edge are assumptions. Do not mount a camera unless all fit
  checks pass. A compatible metal replacement is the safer choice, particularly for
  a heavy or valuable camera.
questions: []
params:
  receiver_plate_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: Reported width of plate the clamp takes; assumes widest edge, not confirmed.
  jaw_angle:
    value: null
    unit: deg
    kind: world
    source: unknown
    note: ''
  camera_socket_depth:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: Usable depth from actual camera contact plane; verify before use.
  bolt_length:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: Approximate under-head length; measure actual projection after seating.
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Approximate maximum width across head.
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Approximate.
  bolt_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
