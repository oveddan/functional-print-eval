parts:
- id: backbox
  role: final
  material: PLA
  code: "def build(p):\n def b(x,y,z,w,l,h):\n  return cq.Workplane('XY').workplane(offset=z).center(x,y).rect(w,l).extrude(h)\n\
    \ def c(x,y,z,d,h):\n  return cq.Workplane('XY').workplane(offset=z).center(x,y).circle(d/2).extrude(h)\n\
    \ s=b(0,0,0,p.w+30,p.l+26,4)\n for x in (-23,23):\n  s=s.union(b(x,40,4,16,16,7)).cut(c(x,37,-1,p.head+0.7,13)).cut(b(x,40.5,-1,p.shank+0.6,7,13)).cut(c(x,44,-1,p.shank+0.6,13))\n\
    \ for i in (-1,1):\n  for j in (-1,1):\n   x=i*(p.w/2-p.edge-p.pcb_hole/2); y=j*(p.l/2-p.edge-p.pcb_hole/2)\n\
    \   s=s.union(c(x,y,4,8,6)).cut(c(x,y,5,1.65,6))\n  s=s.union(b(i*(p.w/2+7),0,4,14,14,p.depth-4))\n\
    \ s=s.union(b(0,0,p.depth-8,p.w+28,14,8))\n for i in (-1,1):\n  s=s.cut(c(i*(p.gap+p.hole)/2,0,p.depth-5,p.insert_bore,6))\n\
    \ return s"
  print_orientation: Rear face on bed; no supports
  use_orientation: Rear face against wall
