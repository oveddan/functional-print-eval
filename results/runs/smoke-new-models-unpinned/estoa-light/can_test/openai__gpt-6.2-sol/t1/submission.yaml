manual:
- n: '1'
  text: 'Before printing, relocate both towers and the crossbar together along Y in
    the CAD if needed to clear the actual USB plug. As modeled the towers occupy y=-7
    to +7 at both side edges, so a centered side-facing plug will be blocked. Keep
    the crossbar at y=0 for the disk holes: offset only the towers and widen the crossbar
    in Y to overlap them, checking component clearance under it (26.4 mm above board
    top). Confirm wiring reach and access behind the disk.'
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print rear down. Confirm slicer bridge lines span the 50 mm gap along X. Inspect
    bridge and heat-set inserts flush.
  parts: []
  hardware: []
  tool: null
- n: '3'
  text: Use two M5 screws spaced 46 mm apart with an 11 mm under-head gap in a suitable
    existing load-bearing M5 threaded wall fixture only. Pass heads through the round
    openings and lower chassis into the narrow slots. Check retention before loading.
  parts: []
  hardware: []
  tool: null
- n: '4'
  text: Secure perfboard with four M2 screws, route wires through the open perimeter,
    and attach disk with the two M3 screws. Verify the wiring, power path and charger
    are rated for the configured LED load.
  parts: []
  hardware: []
  tool: null
