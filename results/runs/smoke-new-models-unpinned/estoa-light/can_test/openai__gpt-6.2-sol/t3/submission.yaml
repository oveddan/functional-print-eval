parts:
- id: base
  role: final
  material: PLA
  code: "def build(p):\n b=cq.Workplane('XY').rect(108,94).extrude(4)\n for x in [-p.pitch/2,p.pitch/2]:\n\
    \  b=b.cut(cq.Workplane('XY').center(x,-6).circle((p.head+1)/2).extrude(4)).cut(cq.Workplane('XY').center(x,0).rect(4.8,12).extrude(4)).cut(cq.Workplane('XY').center(x,6).circle(2.4).extrude(4))\n\
    \ for i in [-1,1]:\n  for j in [-1,1]:\n   x=i*(p.bw/2-p.edge-p.bh/2); y=j*(p.bl/2-p.edge-p.bh/2)\n\
    \   b=b.union(cq.Workplane('XY',origin=(x,y,4)).circle(3.5).extrude(6)).cut(cq.Workplane('XY',origin=(x,y,5)).circle(.8).extrude(5))\n\
    \   x=i*46;y=j*38\n   b=b.union(cq.Workplane('XY',origin=(x,y,4)).circle(6).extrude(45)).cut(cq.Workplane('XY',origin=(x,y,43)).circle(p.insert/2).extrude(6))\n\
    \ return b"
  print_orientation: Wall face down
  use_orientation: Flat against wall
- id: front
  role: final
  material: PLA
  code: "def build(p):\n b=cq.Workplane('XY').rect(108,94).extrude(6)\n for x in [-46,46]:\n\
    \  for y in [-38,38]:\n   b=b.cut(cq.Workplane('XY').center(x,y).circle(1.7).extrude(6)).cut(cq.Workplane('XY').center(x,y).circle((p.cap+.7)/2).extrude(3.2))\n\
    \ for x in [-(p.gap+p.hole)/2,(p.gap+p.hole)/2]:\n  b=b.cut(cq.Workplane('XY').center(x,0).circle(p.insert/2).extrude(6))\n\
    \ return b.cut(cq.Workplane('XY').center(0,-39).rect(44,24).extrude(6))"
  print_orientation: Disk face down; counterbore shoulders bridge
  use_orientation: Flip about X
