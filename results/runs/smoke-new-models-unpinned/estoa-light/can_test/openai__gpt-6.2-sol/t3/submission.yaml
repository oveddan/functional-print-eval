manual:
- n: '1'
  text: Before printing, verify solder projects less than 6 mm below the board, and
    components and USB plug fit in the 37.4 mm above it. Mock up the 55 mm disk setback
    and check you can reach the port through an open side without hitting a pillar.
    The ESP32 location and direction in the assembly are placeholders; use its existing
    headers. Check disk rear protrusions clear the plate and wires reach the notch
    or open side.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print both parts support-free with four walls. Use matte white PLA if available,
    otherwise black PLA. Heat-set four inserts flush in pillar tops and two flush
    in the disk-facing holes.
  parts: []
  hardware: []
  tool: null
- n: '3'
  text: 'Install your two #8 screws and wall anchors horizontally 80 mm apart. Leave
    about 4.3 mm under the heads. Verify heads enter the round openings and cannot
    pass the 4.8 mm slots. Slip base over both heads and lower it to seat; adjust
    for a snug fit.'
  parts: []
  hardware: []
  tool: null
- n: '4'
  text: Fix perfboard with four M2 self-tappers. Fasten front with four M3x8 screws.
    Clear any bridge sag in the counterbores so heads sit below the disk seating face.
    Connect wires without pinching and fasten disk with two M3x6 screws, finger-snug.
  parts: []
  hardware: []
  tool: null
- n: '5'
  text: Plug USB-C in from the open side. Verify the charger, DevKit power path and
    wiring can carry the configured LED load before use. Do not run all 255 LEDs at
    full white through the DevKit USB power path.
  parts: []
  hardware: []
  tool: null
