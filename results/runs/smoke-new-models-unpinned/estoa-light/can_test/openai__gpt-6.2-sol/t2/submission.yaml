parts:
- id: tray
  role: final
  material: PLA
  code: "def build(p):\n def b(w,l,h,x,y,z):return cq.Workplane('XY').box(w,l,h,centered=(True,True,False)).translate((x,y,z))\n\
    \ def c(d,h,x,y,z):return cq.Workplane('XY').circle(d/2).extrude(h).translate((x,y,z))\n\
    \ a=b(102,82,3.2,0,0,0)\n for s in (-1,1):\n  x=s*p.pitch/2\n  a=a.cut(c(p.head+1.4,4,x,17,0).union(b(5,10,4,x,22,0)).union(c(5,4,x,27,0)))\n\
    \  a=a.union(b(8,82,36.8,s*47,0,3.2))\n  for j in (-1,1):\n   y=j*27\n   a=a.cut(c(p.pilot,5,s*46,y,35))\n\
    \   u=s*(p.bx/2-p.offset);v=j*(p.by/2-p.offset)\n   a=a.union(c(7,8.8,u,v,3.2)).cut(c(1.65,6,u,v,6))\n\
    \ return a"
  print_orientation: Back flat on bed
  use_orientation: Back against wall
- id: carrier
  role: final
  material: PLA
  code: "def build(p):\n def b(w,l,h,x):return cq.Workplane('XY').box(w,l,h,centered=(True,True,False)).translate((x,0,0))\n\
    \ def c(d,h,x,y,z):return cq.Workplane('XY').circle(d/2).extrude(h).translate((x,y,z))\n\
    \ a=b(102,14,4,0)\n for s in (-1,1):\n  a=a.union(b(10,64,4,s*46))\n  for y in\
    \ (-27,27):a=a.cut(c(3.4,4,s*46,y,0))\n  x=s*(p.gap+p.hole)/2\n  a=a.union(c(8,5,x,0,4)).cut(c(p.pilot,4.7,x,0,4.3))\n\
    \ return a"
  print_orientation: Flat underside on bed
  use_orientation: Disk bosses face outward
