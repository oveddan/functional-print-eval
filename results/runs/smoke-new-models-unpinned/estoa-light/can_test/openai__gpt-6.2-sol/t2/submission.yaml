manual:
- n: '1'
  text: Print flat in matte white PLA if available, four walls, no supports. Heat-set
    inserts flush into the four tray rail holes and two carrier bosses. Attach perfboard
    with M2 screws, USB toward an open end. Check solder clearance.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Attach carrier with M3x8 screws. Route wires beside its crossbar. Check that
    bosses and screw heads contact only bare PCB and rear components clear. Fit disk
    using M3x6 screws, finger snug. Verify the USB plug fully seats and can be removed
    from behind the disk before drilling. If access fails, do not proceed with wall
    mounting.
  parts: []
  hardware: []
  tool: null
- n: '3'
  text: 'Test your existing #8 screw heads and shanks in the keyholes. Install level
    82 mm apart with suitable anchors; start with 3.5 mm under each head, then adjust
    for a snug sliding fit. Slip openings over heads and lower chassis 10 mm. Verify
    both screws capture it and the back sits flat. Confirm wiring and supply ratings
    and limit LED current before powering; do not assume the DevKit can supply full
    disk current.'
  parts: []
  hardware: []
  tool: null
