parts:
- id: box
  role: final
  material: PLA
  code: "import math\ndef build(p):\n def c(x,y,z,r,h): return cq.Workplane('XY',origin=(x,y,z)).circle(r).extrude(h)\n\
    \ def b(x,y,z,w,l,h): return cq.Workplane('XY',origin=(x,y,z)).rect(w,l).extrude(h)\n\
    \ a=c(0,0,0,109,5).union(c(0,0,5,109,38).cut(c(0,0,5,106,38)).cut(b(0,-105,5,94,65,38)))\n\
    \ for x in (-p.pitch/2,p.pitch/2):\n  a=a.union(c(x,0,5,7,38)).cut(c(x,0,35,1.75,8)).cut(cq.Workplane('XY',origin=(x,0,43-p.nh-.15)).polygon(6,(p.af+.3)/math.cos(math.pi/6)).extrude(p.nh+.15))\n\
    \ for x in (-p.w/2+p.inset,p.w/2-p.inset):\n  for y in (-51-p.l/2+p.inset,-51+p.l/2-p.inset):\n\
    \   a=a.union(c(x,y,5,3.5,7)).cut(c(x,y,7,.8,5))\n for x in (-60,60):\n  r=(p.head+.7)/2;\
    \ s=(p.shank+.6)/2\n  a=a.cut(c(x,32,0,r,5)).cut(b(x,37,0,2*s,10,5)).cut(c(x,42,0,s,5)).cut(b(x,37,2,2*r,10,3)).cut(c(x,42,2,r,3))\n\
    \ return a"
  print_orientation: Wall face flat on bed, no supports
  use_orientation: Service opening down
