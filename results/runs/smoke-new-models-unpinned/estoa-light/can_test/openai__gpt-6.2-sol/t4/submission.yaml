manual:
- n: '1'
  text: 'Print the 218 mm box wall-face down at 0.2 mm with four perimeters and no
    supports. Matte white PLA if available. Clear and test both keyholes with your
    #8 screws.'
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Fit perfboard with USB facing down. Verify pins clear the floor and M2 heads
    overlap holes without touching traces. Drive M2 screws gently. The USB mouth pose
    is estimated; dry-fit the actual plug with the disk held in place.
  parts: []
  hardware: []
  tool: null
- n: '3'
  text: Seat two M3 nuts in the tower pockets. Route wires with service slack and
    check that the rear connector clears rim and towers. Check screw heads land on
    bare PCB, then install M3 screws from LED side. Stop if disk does not sit flat.
  parts: []
  hardware: []
  tool: null
- n: '4'
  text: 'Place suitable wall anchors and #8 screws level, 120 mm apart. Start with
    2.3 mm between wall and head underside and adjust for snug sliding engagement.
    Push over both heads and lower 10 mm. Check engagement before releasing.'
  parts: []
  hardware: []
  tool: null
- n: '5'
  text: Plug in from below. Verify a correctly rated 5 V current path and common ground
    before powering the disk; do not feed disk current through the ESP32 regulator
    or assume the DevKit USB path is rated for it. Limit current to suit the verified
    supply and wiring.
  parts: []
  hardware: []
  tool: null
