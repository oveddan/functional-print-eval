parts:
- id: box
  role: final
  material: PLA
  code: "def build(p):\n def b(w,l,h,x,y,z): return cq.Workplane('XY').box(w,l,h,centered=(True,True,False)).translate((x,y,z))\n\
    \ def c(d,h,x,y,z): return cq.Workplane('XY').circle(d/2).extrude(h).translate((x,y,z))\n\
    \ a=b(116,92,6,0,0,0).union(b(116,3,32,0,44.5,6))\n for s in [-1,1]:\n  a=a.union(b(3,92,32,s*56.5,0,6))\n\
    \  x=s*48\n  a=a.cut(c(9.8,6,x,12,0)).cut(b(5,12,6,x,18,0)).cut(c(5,6,x,24,0)).cut(b(9.8,12,3,x,18,3)).cut(c(9.8,3,x,24,3))\n\
    \  x=s*(p.gap+p.hole)/2\n  a=a.union(c(10,34,x,0,6)).cut(c(p.bore,5,x,0,35))\n\
    \  for t in [-1,1]:\n   x=s*(p.bw/2-p.edge-p.bh/2); y=t*(p.bl/2-p.edge-p.bh/2)\n\
    \   a=a.union(c(6,5,x,y,6)).cut(c(1.6,5,x,y,6))\n return a"
  print_orientation: Wall face flat on bed, no supports.
  use_orientation: Open edge down.
