manual:
- n: '1'
  text: Before printing, verify the perfboard clears both 10 mm diameter posts at
    x ±16.75, y 0 (including bare PCB), has less than 5 mm solder protrusion and fits
    below z=40. ESP32 pose is provisional. Verify USB faces the open edge and that
    the actual plug seats unobstructed. If fit fails, this layout needs revision.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print the box flat with four walls. Heat-set inserts flush, and attach perfboard
    with M2 screws.
  parts:
  - box
  hardware:
  - inserts
  - m2
  - board
  tool: null
- n: '3'
  text: Use two appropriately anchored wall screws 96 mm apart. Heads must fit the
    9.8 mm entries, be wider than 5 mm and no thicker than 3 mm; shanks must slide
    freely in the 5 mm slots. Slip the box on and lower 12 mm. Verify both heads retain
    the box flat before loading it.
  parts: []
  hardware: []
  tool: null
- n: '4'
  text: Route the wires over the upper rim without pinching, connect the disc and
    fasten it gently with M3 screws. Check that the screws clamp without bottoming.
    Plug in from below. Verify the charger and the entire power path can safely supply
    the configured LED current before use.
  parts: []
  hardware:
  - disk
  - m3
  - esp
  tool: null
