parts:
- id: box
  role: final
  material: PLA (high-speed, matte white)
  code: "def build(p):\n    Rd = p.disc_dia / 2.0\n    Rwo = Rd - p.disc_overhang\n\
    \    Rwi = Rwo - p.t_wall\n    H = p.box_depth\n    tb = p.t_back\n    solid =\
    \ cq.Workplane('XY').circle(Rwo).extrude(H)\n    cavity = cq.Workplane('XY').workplane(offset=tb).circle(Rwi).extrude(H\
    \ - tb + 0.5)\n    box = solid.cut(cavity)\n    pr = p.pillar_d / 2.0\n    for\
    \ sx in (-1, 1):\n        box = box.union(cq.Workplane('XY').workplane(offset=tb).center(sx\
    \ * p.disc_hole_pitch / 2.0, 0.0).circle(pr).extrude(H - tb))\n    sr = p.standoff_d\
    \ / 2.0\n    ox = p.perf_w / 2.0 - p.perf_hole_inset\n    oy = p.perf_l / 2.0\
    \ - p.perf_hole_inset\n    stands = []\n    for sx in (-1, 1):\n        for sy\
    \ in (-1, 1):\n            cx = p.perf_cx + sx * ox\n            cy = p.perf_cy\
    \ + sy * oy\n            stands.append((cx, cy))\n            box = box.union(cq.Workplane('XY').workplane(offset=tb).center(cx,\
    \ cy).circle(sr).extrude(p.standoff_h))\n    cuts = []\n    for sx in (-1, 1):\n\
    \        px = sx * p.disc_hole_pitch / 2.0\n        cuts.append(cq.Workplane('XY').workplane(offset=H\
    \ - p.insert_pocket_depth).center(px, 0.0).circle(p.insert_hole_d / 2.0).extrude(p.insert_pocket_depth\
    \ + 1.0))\n        cuts.append(cq.Workplane('XY').workplane(offset=H - p.insert_pocket_depth\
    \ - p.insert_relief_depth).center(px, 0.0).circle(p.insert_relief_d / 2.0).extrude(p.insert_relief_depth\
    \ + 0.4))\n    top = tb + p.standoff_h\n    for (cx, cy) in stands:\n        cuts.append(cq.Workplane('XY').workplane(offset=top\
    \ - p.standoff_pilot_depth).center(cx, cy).circle(p.standoff_pilot_d / 2.0).extrude(p.standoff_pilot_depth\
    \ + 0.5))\n    for sx in (-1, 1):\n        kx = sx * p.keyhole_x\n        ky =\
    \ p.keyhole_y\n        cuts.append(cq.Workplane('XY').workplane(offset=-1.0).center(kx,\
    \ ky).circle(p.keyhole_big_d / 2.0).extrude(tb + 2.0))\n        cuts.append(cq.Workplane('XY').workplane(offset=-1.0).center(kx,\
    \ ky + p.keyhole_slot_len / 2.0).rect(p.keyhole_slot_w, p.keyhole_slot_len).extrude(tb\
    \ + 2.0))\n    y0 = -(Rwo + 5.0)\n    y1 = -(Rwi - 3.0)\n    cuts.append(cq.Workplane('XY').workplane(offset=p.usb_win_z0).center(0.0,\
    \ (y0 + y1) / 2.0).rect(2.0 * p.usb_win_half_w, (y1 - y0)).extrude(p.usb_win_z1\
    \ - p.usb_win_z0))\n    wy0 = Rwi - 3.0\n    wy1 = Rwo + 3.0\n    cuts.append(cq.Workplane('XY').workplane(offset=H\
    \ - p.wire_notch_depth).center(0.0, (wy0 + wy1) / 2.0).rect(p.wire_notch_w, (wy1\
    \ - wy0)).extrude(p.wire_notch_depth + 1.0))\n    for c in cuts:\n        box\
    \ = box.cut(c)\n    return box"
  print_orientation: Back panel (z=0) on the bed, open front facing up. No supports;
    only a ~36 mm bridge at the top of the bottom USB-C opening.
  use_orientation: Back against the wall, open front out; the LED disc caps the front
    (LED side out), the perfboard/ESP32 inside.
