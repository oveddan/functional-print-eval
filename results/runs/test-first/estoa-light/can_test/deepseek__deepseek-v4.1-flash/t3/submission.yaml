task: estoa-light
note: 'A round, open-front white tub that sits behind the LED disc. The disc caps
  the front (LED side out), held by two M3x8 screws through its two near-centre holes
  into two M3 heat-set inserts in central posts; its rim also rests on the box''s
  top rim. The perfboard rides on four standoffs (M2 self-tapping screws) low in the
  box so the ESP32''s USB-C port lines up with an opening in the bottom edge. The
  disc''s four wires drop straight from its back into the open interior. Two keyholes
  in the back let it hang flat on two wall screws. Everything prints on the bed with
  the back panel down (no supports except a ~36 mm bridge at the top of the USB opening).
  KEY ASSUMPTIONS to confirm (see questions): the disc diameter is ~168 mm (derived
  from the two ~102.4 mm hole-to-edge readings taken as across-centre measurements),
  and the USB-C plug is inserted fully through the bottom opening to reach the port
  (~17 mm in). If the disc is actually larger, change disc_dia and recheck perf_cy.'
questions:
- text: 'The disc''s overall diameter: I read your two ~102.4 mm hole-to-edge numbers
    as measuring across the centre from each hole''s outer edge to the far rim, giving
    ~168 mm. Roughly how big is the disc across - closer to 168 mm, or nearer 240
    mm? This sets the whole box size.'
  answer: null
- text: Does the ESP32's USB-C port end point toward a 50 mm (short) edge of the perfboard
    (so it ends up at the bottom of the box as I've built it), and is the port set
    back about 4.8 mm from that ESP32 board edge?
  answer: null
- text: Are the disc's two mounting holes really 33.5 mm apart centre-to-centre (your
    30.2 mm gap between hole edges plus the 3.3 mm hole), and are they in line through
    the centre with the wires at 90 degrees (12 o'clock)?
  answer: null
