manual:
- n: '1'
  text: 'Print the box in matte-white PLA with the flat back panel on the bed (z=0)
    and the open front facing up. No supports: the only bridge is the ~36 mm top of
    the bottom USB-C opening.'
  parts:
  - box
  hardware: []
  tool: 3D printer (Bambu X1C)
- n: '2'
  text: Heat the two M3x4x5 heat-set inserts and press them into the two 4.3 mm pockets
    on the tops of the central posts, flush with the top.
  parts:
  - box
  hardware:
  - insert
  tool: soldering iron / insert tip
- n: '3'
  text: Sit the perfboard on the four standoffs, ESP32 side up and the USB-C port
    toward the bottom opening. Drive the four M2x6 self-tapping screws down through
    the perfboard's corner holes into the standoffs.
  parts:
  - box
  hardware:
  - m2screw
  tool: PH0 screwdriver
- n: '4'
  text: Solder the four wires from the disc's input on the perfboard, leaving enough
    length to reach the top of the box.
  parts: []
  hardware: []
  tool: null
- n: '5'
  text: 'Offer the disc to the front: holes at 3 & 9 o''clock over the two posts,
    wires at 12 o''clock. Feed the four wires into the open box and down to the perfboard,
    then drive the two M3x8 screws through the disc''s centre holes into the inserts
    until the disc rests flat on the rim and post tops.'
  parts:
  - box
  hardware:
  - m3screw
  tool: 2.5 mm hex key
- n: '6'
  text: 'Hang it: fix two wall screws 80 mm apart, level, heads ~8 mm proud. Pass
    the heads through the two keyholes'' large holes and slide the box down so the
    shanks sit in the slots.'
  parts:
  - box
  hardware: []
  tool: screwdriver (wall screws not supplied)
- n: '7'
  text: 'Power: push the USB-C charger plug through the bottom opening and seat it
    fully into the ESP32 port.'
  parts: []
  hardware: []
  tool: null
- n: '8'
  text: Fit the transparent front and sides (printed separately) over the disc.
  parts: []
  hardware: []
  tool: null
