manual:
- n: '1'
  text: 'Print the fit coupon first (matte white PLA, 0.2 mm, no supports) and check
    three things: an M3x4x5 insert presses into the round boss and an M3x10 screws
    into it; an M2x6 self-tapper bites in the small pilot hole; an M4x30''s head passes
    through the keyhole''s round hole and slides into the slot, with the head disappearing
    into the pocket. If the insert is loose or very tight, stop and tell me.'
  parts:
  - fit_coupon
  hardware:
  - ins_m3
  - m3x10
  - m2x6
  - m4x30
  tool: heat-set insert tip, screwdriver
- n: '2'
  text: Print the box (box.stl) with its big flat front face down on the bed — that
    face is the disc's seat. Print the back plate (back_plate.stl) with its inner
    face down, so the keyhole pockets and the four counterbores face up. Neither part
    needs supports.
  parts:
  - box
  - back_plate
  hardware: []
  tool: null
- n: '3'
  text: 'Heat-set the six M3x4x5 inserts: two into the two bosses on the inside of
    the box''s front plate (push them in from inside the box), and four into the ends
    of the four columns standing at the rim. Press each one in flush with the surrounding
    plastic.'
  parts:
  - box
  hardware:
  - ins_m3
  tool: soldering iron with insert tip
- n: '4'
  text: Screw the perfboard down onto the four M2 bosses with the four M2x6 self-tappers.
    Turn it so the ESP32's USB-C socket is at the bottom, over the notch in the rim
    — the board's edge nearest the socket should end up 5 mm inside the rim. The board's
    top face (with the ESP32) faces the back of the box.
  parts:
  - box
  hardware:
  - m2x6
  tool: small Phillips screwdriver
- n: '5'
  text: Feed the disc's 4-pin plug and its four wires from the front, down through
    the long radial slot in the front plate, so they hang inside the box. Settle the
    white connector body down into the slot at the bottom.
  parts:
  - box
  hardware:
  - led_disk
  tool: null
- n: '6'
  text: Lay the disc on the front face with the LED side out and the wires running
    down to the slot, line its two small holes up with the two inserts, and drive
    the two M3x10 screws through the disc into the box. The heads sit on the disc's
    front face; the clear front will hide them.
  parts:
  - box
  hardware:
  - led_disk
  - m3x10
  tool: 2.5 mm hex key
- n: '7'
  text: Inside, take the four wire ends around the near edge of the perfboard and
    fasten them into the screw terminals, keeping a little slack so nothing is pulled
    tight against the disc.
  parts:
  - box
  hardware:
  - perfboard
  tool: small flat screwdriver
- n: '8'
  text: 'Close the box: lay the back plate on the rim with the keyhole slots upright
    (both slots pointing up, round holes at the bottom), and drive the four M3x8 screws
    through its counterbores into the rim''s inserts. The screw heads finish just
    below the wall face.'
  parts:
  - box
  - back_plate
  hardware:
  - m3x8
  tool: 2.5 mm hex key
- n: '9'
  text: Fix the two M4x30 screws in the wall 80 mm apart, level, with their heads
    standing about 4 mm proud (use wall plugs or find a stud). Hang the box by dropping
    both keyholes over the heads and letting it slide down until it stops. It now
    sits flat against the wall.
  parts:
  - back_plate
  hardware:
  - m4x30
  tool: screwdriver, spirit level
- n: '10'
  text: 'Plug the USB-C charger straight into the ESP32: the plug goes in through
    the notch in the bottom of the rim. When you print the clear front and sides,
    leave the same opening at the bottom so the cable still gets in.'
  parts:
  - box
  hardware: []
  tool: null
