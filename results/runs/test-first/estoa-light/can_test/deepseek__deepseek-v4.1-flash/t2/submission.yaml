task: estoa-light
note: 'Two things you couldn''t measure are handled by tolerance rather than by numbers:
  the disc''s thickness (guessed 1.6 mm — the M3x10 engagement only needs the disc
  to be anywhere from 0.8 to 2.4 mm thick) and the disc''s 4-pin connector (its stand-off
  and its distance from the centre). Instead of a connector pocket I cut an 18 mm
  wide radial through-slot in the front plate from 15 to 112 mm off centre, so the
  connector sits in it wherever it is and the four wires drop straight into the box.
  If your connector is closer to the centre than 15 mm, tell me and I''ll lengthen
  the slot.


  The USB-C plug reaches the ESP32 through a notch in the bottom of the rim. I placed
  the perfboard so the ESP32''s socket end sits 5 mm inside the rim (the board''s
  far corners clear the rim by 4.8 mm) — the socket mouth then lands 20 mm in from
  the wall face, so the plug passes the wall and still reaches. The notch is 20 mm
  wide because your socket is 4 mm off the ESP32''s centreline and I don''t know which
  side; it also clears the plug''s overmould. When you print the clear front/sides
  later, leave a matching opening there.


  The two M4 wall screws are catalog machine screws; you''ll need wall plugs or a
  stud behind them (not in the parts list).'
questions:
- text: How far is the disc's 4-pin connector from the disc's centre (mm)? The radial
    wire slot spans 15-112 mm, so anything in that band is fine — outside it I'd have
    to move the slot.
  answer: null
- text: Does the USB-C socket end of the perfboard end up at the bottom once the board
    is on the four M2 bosses, with the socket facing the notch in the rim?
  answer: null
