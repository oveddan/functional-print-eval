parts:
- id: box
  role: final
  material: PLA (matte white)
  code: "import math\n\ndef build(p):\n    R = p.box_od / 2.0\n    Ri = R - p.wall_t\n\
    \    H = p.front_t + p.int_h\n\n    # front plate (0..front_t) plus rim wall up\
    \ to H\n    body = cq.Workplane(\"XY\").circle(R).extrude(H)\n    body = body.cut(cq.Workplane(\"\
    XY\").workplane(offset=p.front_t)\n                    .circle(Ri).extrude(p.int_h\
    \ + 2))\n\n    # two insert bosses inside the front plate, for the LED disc screws\n\
    \    half = p.disc_hole_pitch / 2.0\n    z_boss_top = p.front_t + p.insert_boss_h\n\
    \    z_ins_bot = z_boss_top - p.insert_hole_depth\n    for sx in (-1.0, 1.0):\n\
    \        x = sx * half\n        body = body.union(cq.Workplane(\"XY\").workplane(offset=p.front_t)\n\
    \                          .center(x, 0).circle(p.insert_boss_d / 2.0)\n     \
    \                     .extrude(p.insert_boss_h))\n        # 4.3 insert hole, pressed\
    \ flush from the inside   [disc_insert_L / disc_insert_R]\n        body = body.cut(cq.Workplane(\"\
    XY\").workplane(offset=z_ins_bot)\n                        .center(x, 0).circle(p.insert_hole_d\
    \ / 2.0)\n                        .extrude(p.insert_hole_depth + 2))\n       \
    \ # 3.4 clearance right through the plate and the boss's skirt  [disc_hole_L /\
    \ disc_hole_R]\n        body = body.cut(cq.Workplane(\"XY\").workplane(offset=-1)\n\
    \                        .center(x, 0).circle(p.screw_clear_d / 2.0)\n       \
    \                 .extrude(z_ins_bot + 1))\n\n    # four perfboard bosses with\
    \ M2 self-tapping pilots\n    y_board = -(Ri - p.pcb_edge_gap) + p.pcb_len / 2.0\n\
    \    hx = p.pcb_w / 2.0 - p.pcb_hole_inset\n    hy = p.pcb_len / 2.0 - p.pcb_hole_inset\n\
    \    z_pcb = p.front_t + p.pcb_standoff\n    for sx in (-1.0, 1.0):\n        for\
    \ sy in (-1.0, 1.0):\n            x = sx * hx\n            y = y_board + sy *\
    \ hy\n            body = body.union(cq.Workplane(\"XY\").workplane(offset=p.front_t)\n\
    \                              .center(x, y).circle(p.m2_boss_d / 2.0)\n     \
    \                         .extrude(p.pcb_standoff))\n            body = body.cut(cq.Workplane(\"\
    XY\").workplane(offset=z_pcb - p.m2_pilot_depth)\n                           \
    \ .center(x, y).circle(p.m2_pilot_d / 2.0)\n                            .extrude(p.m2_pilot_depth\
    \ + 2))   # pcb_pilot_A..D\n\n    # four rim columns carrying the back plate inserts\n\
    \    for a in (40.0, 140.0, 220.0, 320.0):\n        cx = p.col_r * math.cos(math.radians(a))\n\
    \        cy = p.col_r * math.sin(math.radians(a))\n        body = body.union(cq.Workplane(\"\
    XY\").workplane(offset=p.front_t)\n                          .center(cx, cy).circle(p.col_d\
    \ / 2.0).extrude(p.int_h))\n        body = body.cut(cq.Workplane(\"XY\").workplane(offset=H\
    \ - p.insert_hole_depth)\n                        .center(cx, cy).circle(p.insert_hole_d\
    \ / 2.0)\n                        .extrude(p.insert_hole_depth + 2))   # column_insert_A..D\n\
    \n    # radial through-slot in the front plate: disc connector + four wires\n\
    \    r0 = p.wire_slot_r0 + p.wire_slot_w / 2.0\n    r1 = p.wire_slot_r1 - p.wire_slot_w\
    \ / 2.0\n    slot = (cq.Workplane(\"XY\").workplane(offset=-1)\n            .center(0,\
    \ -(r0 + r1) / 2.0)\n            .rect(p.wire_slot_w, r1 - r0).extrude(p.front_t\
    \ + 3))\n    slot = slot.union(cq.Workplane(\"XY\").workplane(offset=-1)\n   \
    \                   .center(0, -r0).circle(p.wire_slot_w / 2.0)\n            \
    \          .extrude(p.front_t + 3))\n    slot = slot.union(cq.Workplane(\"XY\"\
    ).workplane(offset=-1)\n                      .center(0, -r1).circle(p.wire_slot_w\
    \ / 2.0)\n                      .extrude(p.front_t + 3))\n    body = body.cut(slot)\n\
    \n    # USB-C notch through the bottom of the rim, centred on the socket\n   \
    \ u_port = p.pcb_standoff + p.pcb_t + p.usb_port_bottom + p.usb_port_h / 2.0\n\
    \    z_notch = p.front_t + u_port - p.usb_notch_h / 2.0\n    body = body.cut(cq.Workplane(\"\
    XY\").workplane(offset=z_notch)\n                    .center(0, -(Ri + R) / 2.0)\n\
    \                    .rect(p.usb_notch_w, (R - Ri) + 6.0).extrude(H))\n    return\
    \ body\n"
  print_orientation: front plate's outer face (its own z = 0) on the bed, rim and
    bosses rising; nothing overhangs, no supports
  use_orientation: front plate's outer face forward, away from the wall; the USB notch
    and the wire slot at the bottom
- id: back_plate
  role: final
  material: PLA (matte white)
  code: "import math\n\ndef build(p):\n    R = p.back_plate_d / 2.0\n    t = p.back_plate_t\n\
    \    pl = cq.Workplane(\"XY\").circle(R).extrude(t)\n\n    # four M3 screws into\
    \ the rim columns\n    for a in (40.0, 140.0, 220.0, 320.0):\n        cx = p.col_r\
    \ * math.cos(math.radians(a))\n        cy = p.col_r * math.sin(math.radians(a))\n\
    \        pl = pl.cut(cq.Workplane(\"XY\").workplane(offset=-1).center(cx, cy)\n\
    \                    .circle(p.screw_clear_d / 2.0).extrude(t + 2))\n        pl\
    \ = pl.cut(cq.Workplane(\"XY\").workplane(offset=t - p.counterbore_depth)\n  \
    \                  .center(cx, cy).circle(p.counterbore_d / 2.0)\n           \
    \         .extrude(p.counterbore_depth + 2))\n\n    # two keyholes, round entry\
    \ hole low, slot up to the hung position at y = 0\n    yc = -p.key_slot_len\n\
    \    for sx in (-1.0, 1.0):\n        x = sx * p.key_x\n        pl = pl.cut(cq.Workplane(\"\
    XY\").workplane(offset=-1).center(x, yc)\n                    .circle(p.key_hole_d\
    \ / 2.0).extrude(t + 2))\n        pl = pl.cut(cq.Workplane(\"XY\").workplane(offset=-1).center(x,\
    \ yc / 2.0)\n                    .rect(p.key_slot_w, abs(yc)).extrude(t + 2))\n\
    \        pc = p.key_pocket_w / 2.0\n        pk = (cq.Workplane(\"XY\").workplane(offset=t\
    \ - p.key_pocket_depth)\n              .center(x, yc / 2.0).rect(p.key_pocket_w,\
    \ abs(yc))\n              .extrude(p.key_pocket_depth + 2))\n        pk = pk.union(cq.Workplane(\"\
    XY\").workplane(offset=t - p.key_pocket_depth)\n                      .center(x,\
    \ yc).circle(pc).extrude(p.key_pocket_depth + 2))\n        pk = pk.union(cq.Workplane(\"\
    XY\").workplane(offset=t - p.key_pocket_depth)\n                      .center(x,\
    \ 0).circle(pc).extrude(p.key_pocket_depth + 2))\n        pl = pl.cut(pk)\n  \
    \  return pl\n"
  print_orientation: inner face (its own z = 0) on the bed, keyhole pockets and counterbores
    facing up
  use_orientation: outer face against the wall; keyhole slots vertical, up
- id: fit_coupon
  role: coupon
  material: PLA (matte white)
  code: "def build(p):\n    # 3 mm plate like the box front, carrying one disc-insert\
    \ boss and one M2 pilot boss\n    c = cq.Workplane(\"XY\").rect(70, 60).extrude(p.front_t)\n\
    \    # 7 mm block like the back plate, carrying one keyhole\n    c = c.union(cq.Workplane(\"\
    XY\").center(50, 0).rect(38, 50)\n                .extrude(p.back_plate_t))\n\n\
    \    z_top = p.front_t + p.insert_boss_h\n    z_ins = z_top - p.insert_hole_depth\n\
    \    c = c.union(cq.Workplane(\"XY\").workplane(offset=p.front_t).center(-20,\
    \ 15)\n                .circle(p.insert_boss_d / 2.0).extrude(p.insert_boss_h))\n\
    \    c = c.cut(cq.Workplane(\"XY\").workplane(offset=z_ins).center(-20, 15)\n\
    \              .circle(p.insert_hole_d / 2.0).extrude(p.insert_hole_depth + 2))\n\
    \    c = c.cut(cq.Workplane(\"XY\").workplane(offset=-1).center(-20, 15)\n   \
    \           .circle(p.screw_clear_d / 2.0).extrude(z_ins + 1))\n\n    z_pcb =\
    \ p.front_t + p.pcb_standoff\n    c = c.union(cq.Workplane(\"XY\").workplane(offset=p.front_t).center(-20,\
    \ -15)\n                .circle(p.m2_boss_d / 2.0).extrude(p.pcb_standoff))\n\
    \    c = c.cut(cq.Workplane(\"XY\").workplane(offset=z_pcb - p.m2_pilot_depth)\n\
    \              .center(-20, -15).circle(p.m2_pilot_d / 2.0)\n              .extrude(p.m2_pilot_depth\
    \ + 2))\n\n    x = 50.0\n    yc = -p.key_slot_len\n    t = p.back_plate_t\n  \
    \  c = c.cut(cq.Workplane(\"XY\").workplane(offset=-1).center(x, yc)\n       \
    \       .circle(p.key_hole_d / 2.0).extrude(t + 2))\n    c = c.cut(cq.Workplane(\"\
    XY\").workplane(offset=-1).center(x, yc / 2.0)\n              .rect(p.key_slot_w,\
    \ abs(yc)).extrude(t + 2))\n    pc = p.key_pocket_w / 2.0\n    pk = (cq.Workplane(\"\
    XY\").workplane(offset=t - p.key_pocket_depth)\n          .center(x, yc / 2.0).rect(p.key_pocket_w,\
    \ abs(yc))\n          .extrude(p.key_pocket_depth + 2))\n    pk = pk.union(cq.Workplane(\"\
    XY\").workplane(offset=t - p.key_pocket_depth)\n                  .center(x, yc).circle(pc).extrude(p.key_pocket_depth\
    \ + 2))\n    pk = pk.union(cq.Workplane(\"XY\").workplane(offset=t - p.key_pocket_depth)\n\
    \                  .center(x, 0).circle(pc).extrude(p.key_pocket_depth + 2))\n\
    \    c = c.cut(pk)\n    return c\n"
  print_orientation: flat on the bed, all three test features standing up
  use_orientation: throw-away test piece
