parts:
- id: box
  role: final
  material: PLA (matte white)
  code: "import cadquery as cq\n\ndef build(p):\n    R = p.box_od / 2.0\n    inner\
    \ = R - p.rim_wall_t\n\n    # open-fronted dish: back panel + rim wall\n    part\
    \ = cq.Workplane(\"XY\").circle(R).extrude(p.back_t)\n    part = part.union(cq.Workplane(\"\
    XY\").circle(R).circle(inner).extrude(p.box_depth))\n\n    # the two pillars the\
    \ disc screws into\n    pr = p.disc_hole_pitch / 2.0\n    for sx in (-1.0, 1.0):\n\
    \        part = part.union(cq.Workplane(\"XY\").center(sx * pr, 0.0)\n       \
    \                   .circle(p.pillar_d / 2.0).extrude(p.box_depth))\n\n    # four\
    \ bosses for the perfboard\n    hx = p.perfboard_w / 2.0 - p.pb_hole_edge - p.pb_hole_d\
    \ / 2.0\n    hy = p.perfboard_l / 2.0 - p.pb_hole_edge - p.pb_hole_d / 2.0\n \
    \   holes = [(p.pb_x + sx * hx, p.pb_y + sy * hy)\n             for sx in (-1.0,\
    \ 1.0) for sy in (-1.0, 1.0)]\n    for (hxx, hyy) in holes:\n        part = part.union(cq.Workplane(\"\
    XY\").center(hxx, hyy)\n                          .circle(p.pb_boss_d / 2.0)\n\
    \                          .extrude(p.back_t + p.pb_boss_h))\n\n    # M3 heat-set\
    \ insert pockets in the tops of the pillars\n    for sx in (-1.0, 1.0):\n    \
    \    pocket = (cq.Workplane(\"XY\")\n                  .workplane(offset=p.box_depth\
    \ - p.insert_len)\n                  .center(sx * pr, 0.0).circle(p.insert_hole_d\
    \ / 2.0)\n                  .extrude(p.insert_len + 1.0))\n        relief = (cq.Workplane(\"\
    XY\").workplane(offset=p.back_t)\n                  .center(sx * pr, 0.0).circle(p.relief_d\
    \ / 2.0)\n                  .extrude(p.box_depth - p.insert_len - p.back_t))\n\
    \        part = part.cut(pocket).cut(relief)\n\n    # M2 pilot holes in the four\
    \ bosses\n    for (hxx, hyy) in holes:\n        part = part.cut(cq.Workplane(\"\
    XY\")\n                        .workplane(offset=p.back_t + p.pb_boss_h - p.pb_pilot_depth)\n\
    \                        .center(hxx, hyy).circle(p.pb_pilot_d / 2.0)\n      \
    \                  .extrude(p.pb_pilot_depth + 1.0))\n\n    # USB-C opening low\
    \ in the rim, centred on the port's height\n    zc = (p.back_t + p.pb_boss_h +\
    \ p.perfboard_t\n          + p.port_bottom_above_pb + p.port_h / 2.0)\n    ycen\
    \ = -((R + 2.0) + (inner - 2.0)) / 2.0\n    window = (cq.Workplane(\"XY\").workplane(offset=zc\
    \ - p.usb_window_h / 2.0)\n              .center(0.0, ycen).rect(p.usb_window_w,\
    \ p.rim_wall_t + 4.0)\n              .extrude(p.usb_window_h))\n    part = part.cut(window)\n\
    \n    # two keyholes in the back panel, entry hole low, slot running up\n    for\
    \ sx in (-1.0, 1.0):\n        kx = sx * p.keyhole_spacing / 2.0\n        entry\
    \ = (cq.Workplane(\"XY\").workplane(offset=-1.0)\n                 .center(kx,\
    \ -p.keyhole_slot_len)\n                 .circle(p.keyhole_entry_d / 2.0).extrude(p.back_t\
    \ + 2.0))\n        slot = (cq.Workplane(\"XY\").workplane(offset=-1.0)\n     \
    \           .center(kx, -p.keyhole_slot_len / 2.0)\n                .rect(p.keyhole_slot_w,\
    \ p.keyhole_slot_len)\n                .extrude(p.back_t + 2.0))\n        cap\
    \ = (cq.Workplane(\"XY\").workplane(offset=-1.0).center(kx, 0.0)\n           \
    \    .circle(p.keyhole_slot_w / 2.0).extrude(p.back_t + 2.0))\n        part =\
    \ part.cut(entry).cut(slot).cut(cap)\n\n    return part\n"
  print_orientation: back panel face down on the bed (z = 0), rim wall, pillars and
    bosses rising; no supports anywhere
  use_orientation: back panel flat against the wall, open front facing out of the
    wall with the disc screwed to it, USB opening at the bottom
- id: coupon_keyhole
  role: coupon
  material: PLA
  code: "def build(p):\n    part = cq.Workplane(\"XY\").box(70, 45, p.back_t, centered=(True,\
    \ True, False))\n    z0 = -1.0\n    entry = (cq.Workplane(\"XY\").workplane(offset=z0).center(0,\
    \ -p.slot_len)\n             .circle(p.entry_d / 2).extrude(p.back_t + 2))\n \
    \   slot = (cq.Workplane(\"XY\").workplane(offset=z0)\n            .center(0,\
    \ -p.slot_len / 2).rect(p.slot_w, p.slot_len).extrude(p.back_t + 2))\n    top\
    \ = (cq.Workplane(\"XY\").workplane(offset=z0)\n           .circle(p.slot_w /\
    \ 2).extrude(p.back_t + 2))\n    return part.cut(entry).cut(slot).cut(top)\n"
  print_orientation: flat, 3 mm plate on the bed
  use_orientation: hung on a wall screw
- id: coupon_bosses
  role: coupon
  material: PLA
  code: "def build(p):\n    part = cq.Workplane(\"XY\").box(40, 24, p.back_t, centered=(True,\
    \ True, False))\n    pillar = (cq.Workplane(\"XY\").center(-8, 0)\n          \
    \    .circle(p.pillar_d / 2).extrude(p.coupon_pillar_h))\n    boss = (cq.Workplane(\"\
    XY\").center(8, 0)\n            .circle(p.pb_boss_d / 2).extrude(p.pb_boss_h))\n\
    \    part = part.union(pillar).union(boss)\n    pocket = (cq.Workplane(\"XY\"\
    )\n              .workplane(offset=p.coupon_pillar_h - p.insert_len)\n       \
    \       .center(-8, 0).circle(p.insert_hole_d / 2).extrude(p.insert_len + 1))\n\
    \    relief = (cq.Workplane(\"XY\").workplane(offset=p.back_t)\n             \
    \ .center(-8, 0).circle(p.relief_d / 2)\n              .extrude(p.coupon_pillar_h\
    \ - p.insert_len - p.back_t))\n    pilot = (cq.Workplane(\"XY\")\n           \
    \  .workplane(offset=p.back_t + p.pb_boss_h - p.pb_pilot_depth)\n            \
    \ .center(8, 0).circle(p.pb_pilot_d / 2).extrude(p.pb_pilot_depth + 1))\n    return\
    \ part.cut(pocket).cut(relief).cut(pilot)\n"
  print_orientation: flat, base plate on the bed, pillar and boss up
  use_orientation: pillar takes an M3 insert, boss takes an M2 screw
