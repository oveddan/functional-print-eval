manual:
- n: '1'
  text: 'Print box.stl as it comes: back panel on the bed, rim wall, pillars and bosses
    rising. No supports. Then clear out the two 4.3 mm insert pockets in the pillars''
    tops and the four 1.6 mm pilot holes in the bosses.'
  parts:
  - box
  hardware: []
  tool: 3D printer, 0.4 mm nozzle, 0.2 mm layers, PLA
- n: '2'
  text: 'Dry-fit the disc: its two 3.3 mm holes at 3 and 9 o''clock should drop straight
    over the two pillars and its rim should land on the box''s front edge all the
    way round, with the disc''s wire exit at 12 o''clock.'
  parts:
  - box
  hardware:
  - hw_led_disk
  tool: null
- n: '3'
  text: 'Heat-set the two M3 inserts: from inside the box, press one into each pillar''s
    4.3 mm pocket with the iron at about 250 C, sinking it flush with the pillar''s
    top face. Let them cool.'
  parts:
  - box
  hardware:
  - hw_insert
  tool: soldering iron with a heat-set insert tip
- n: '4'
  text: 'Screw the perfboard down: set it on the four bosses, ESP32 on top, its USB-C
    port pointing at the opening low in the rim. Drive the four M2x6 screws down through
    the board''s corner holes into the pilots. Firm, not brutal - they cut their own
    thread in the plastic.'
  parts:
  - box
  hardware:
  - hw_m2
  - hw_perfboard
  tool: small cross-head screwdriver
- n: '5'
  text: 'Bring the disc on: plug the four wires into the disc''s input connector,
    then turn the disc LED side out, wire exit at 12 o''clock, and lay it on the box,
    feeding the wires in through the open front. Drive the two M3x10 screws down through
    the disc''s holes into the inserts - snug only, the insert gives about 4 mm of
    thread.'
  parts:
  - box
  hardware:
  - hw_m3
  - hw_led_disk
  tool: 2.5 mm hex key
- n: '6'
  text: 'Hang it: put your two #8 screws into their 1/4 in anchors 120 mm apart on
    a level line, leaving each head about 3.5 mm off the wall. Slip the box''s two
    keyholes over the heads and let it settle down onto the slots.'
  parts:
  - box
  hardware: []
  tool: screwdriver
- n: '7'
  text: 'Power it: push the USB-C plug through the opening low in the rim until it
    clicks into the ESP32''s port.'
  parts:
  - box
  hardware:
  - hw_esp32
  tool: null
- n: '8'
  text: 'When you print the transparent front and sides later: they must clear the
    two M3 screw heads, which stand about 3 mm proud of the disc''s face, and the
    side wall needs its own opening in front of the rim''s USB opening so the plug
    can still get in.'
  parts:
  - box
  hardware: []
  tool: null
