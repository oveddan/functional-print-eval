task: estoa-light
note: 'The box is a 241.6 mm dish: 3 mm back panel against the wall, 38 mm deep rim,
  open front capped by your LED disc. The disc screws to two 8 mm pillars at 3 and
  9 o''clock (M3x10 into M3x4x5 heat-set inserts, 33.5 mm apart as measured), and
  its rim lands on the box''s front edge all round. Your perfboard (50x70) screws
  to four bosses, 6 mm off the back panel, the ESP32 uppermost with its USB-C port
  at the bottom, and the plug comes in through a 30 x 12 mm opening low in the rim.
  Two keyholes in the back panel, 120 mm apart and level, take your own two #8 wall
  screws (the format would not let me list them as hardware, so they are the outside
  world the box hangs on): the plate there is deliberately 3 mm - thinner than the
  3.5 mm standoff you leave - so the heads cannot jam in the 5 mm slots; they trap
  the box and it sits about 0.5 mm forward on them. Everything prints flat, no supports,
  longest bridge 30 mm.


  Three things to check when it comes off the printer, because they rest on dimensions
  I never got:

  1. The disc''s diameter. Your caliper readings (102.54 + 3.3 + 30.2 + 3.3 + 102.24)
  give 241.6 mm, which is what the box matches. If the disc is a hair under, the front
  edge shows a thin lip; a hair over and the disc overhangs slightly. Either is wearable,
  but if it is out by more than about 1 mm, tell me and I will re-cut the outside.

  2. The disc''s board thickness. I assumed 1.6 mm and used M3x10, which covers anything
  from 1.5 to 4.5 mm because the pillar has a 3.4 mm relief hole under the insert
  for the screw tip.

  3. The USB-C port''s lateral position. It is the one thing I could not pin down:
  the opening is 30 mm wide and the perfboard sits 7 mm left of centre, so the port
  should land near the middle. If the plug does not line up, the opening is wide enough
  to file sideways, and I can move the perfboard bosses if you measure the port''s
  distance from the perfboard''s long edges.'
questions:
- text: Which long edge of the perfboard is the USB-C port nearer, and how far is
    the port's centre from each long edge?
  answer: null
- text: How thick is the LED disc's board (ruler against a straight edge is fine)?
  answer: null
- text: Where on the disc's back face is its input connector - how far from the disc's
    centre, and how far does it stand off the board?
  answer: null
