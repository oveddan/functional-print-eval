task: estoa-light
note: 'One printed part: the white box that sits behind the disc. It''s a cup - flat
  back plate (which goes against the wall) + a 3 mm side wall - with the disc closing
  the front. It prints flat on its back face, no supports, no bridge over 20 mm.\n\nWhat
  it does:\n- Two posts inside, 33.5 mm apart, carry M3 heat-set inserts. The disc''s
  two centre holes go over them, and the disc is held by two M3x6 screws + washers
  from the front.\n- The disc does not sit straight on the rim: four small pads hold
  it 5 mm clear of the wall''s top face. That 5 mm slot is where the four wires leave
  the disc, so it doesn''t matter exactly where on the back of the disc the input
  sits, and nothing on the disc''s back can foul the rim.\n- Four bosses take the
  perfboard''s corner holes with your own M2x6 self-tapping screws, ESP32 up, USB-C
  socket pointing at 12 o''clock.\n- A 20 x 12 mm window in the wall sits right in
  front of the USB-C socket. The plug''s body passes through it; the socket mouth
  ends up about 19 mm inside the outer face of the wall, so the plug needs roughly
  20 mm of reach from its tip - any ordinary USB-C cable has that.\n- Two keyhole
  slots in the back plate (100 mm apart, level) hang it on two #8 screws in your 1/4
  in anchors. The plate''s face lies flat on the wall; the heads sit in the plate''s
  thickness on the room side.\n\nThe front and sides you''ll print later in transparent
  PLA just have to skirt the box''s 232 mm outside and sit over the disc.\n\nUnmeasured
  things I had to assume (please check): the disc''s board is 1.6 mm thick (it sets
  the screw engagement); the tallest thing on the perfboard is the USB-C socket, which
  leaves about 11 mm of clear air under the disc; the ESP32''s socket points out through
  a short 50 mm edge of the perfboard (that is what its pin rows 2-23 imply). The
  window is 20 mm wide, enough for the socket either side of the ESP32''s centreline,
  and its height comes from your measured socket height, so it should be right whichever
  end of the board the socket is at - just fit the perfboard with the socket pointing
  up at the window.'
