parts:
- id: box
  role: final
  material: PLA, matte white
  code: "import math\nimport cadquery as cq\n\ndef build(p):\n    R = p.box_od / 2.0\n\
    \    Ri = R - p.wall_t\n    Hwall = p.disc_plane - p.rim_gap\n\n    # cup: back\
    \ plate + side wall, open at the front (the disc closes it)\n    box = cq.Workplane(\"\
    XY\").circle(R).extrude(Hwall)\n    box = box.cut(\n        cq.Workplane(\"XY\"\
    ).workplane(offset=p.back_t).circle(Ri).extrude(Hwall + 1.0)\n    )\n\n    # two\
    \ posts carrying the disc's M3 heat-set inserts\n    for sx in (-1.0, 1.0):\n\
    \        x = sx * p.post_offset_x\n        post = (\n            cq.Workplane(\"\
    XY\").center(x, 0).circle(p.post_d / 2.0)\n            .extrude(p.disc_plane -\
    \ p.back_t).translate((0, 0, p.back_t))\n        )\n        box = box.union(post)\n\
    \        hole = (\n            cq.Workplane(\"XY\").center(x, 0).circle(p.m3_insert_hole_d\
    \ / 2.0)\n            .extrude(p.m3_insert_hole_depth + 1.0)\n            .translate((0,\
    \ 0, p.disc_plane - p.m3_insert_hole_depth))\n        )\n        box = box.cut(hole)\n\
    \n    # four pads on the rim set the disc's plane; the gap under the disc is the\n\
    \    # wire exit, all the way round\n    pad_r = R - p.wall_t / 2.0\n    for ang\
    \ in (45.0, 135.0, 225.0, 315.0):\n        pad = (\n            cq.Workplane(\"\
    XY\").box(p.pad_w, p.wall_t, p.rim_gap)\n            .translate((0, pad_r, Hwall\
    \ + p.rim_gap / 2.0))\n            .rotate((0, 0, 0), (0, 0, 1), ang)\n      \
    \  )\n        box = box.union(pad)\n\n    # bosses for the perfboard's four corner\
    \ screws\n    edge_y = math.sqrt((Ri - p.perf_corner_clear) ** 2 - (p.perf_w /\
    \ 2.0) ** 2)\n    oy = edge_y - p.perf_l / 2.0\n    hx = p.perf_w / 2.0 - p.perf_hole_inset\n\
    \    hy = p.perf_l / 2.0 - p.perf_hole_inset\n    for sx in (-1.0, 1.0):\n   \
    \     for sy in (-1.0, 1.0):\n            bx, by = sx * hx, oy + sy * hy\n   \
    \         boss = (\n                cq.Workplane(\"XY\").center(bx, by).circle(p.perf_boss_d\
    \ / 2.0)\n                .extrude(p.perf_standoff).translate((0, 0, p.back_t))\n\
    \            )\n            box = box.union(boss)\n            pilot = (\n   \
    \             cq.Workplane(\"XY\").center(bx, by).circle(p.m2_pilot_d / 2.0)\n\
    \                .extrude(p.m2_pilot_depth + 1.0)\n                .translate((0,\
    \ 0, p.back_t + p.perf_standoff - p.m2_pilot_depth))\n            )\n        \
    \    box = box.cut(pilot)\n\n    # keyhole hangers: big hole + slot, with a shallow\
    \ inside boss for depth\n    for sx in (-1.0, 1.0):\n        kx = sx * p.key_pitch\
    \ / 2.0\n        boss = (\n            cq.Workplane(\"XY\").center(kx, p.key_y).circle(p.key_boss_d\
    \ / 2.0)\n            .extrude(p.key_boss_h).translate((0, 0, p.back_t))\n   \
    \     )\n        box = box.union(boss)\n        big = (\n            cq.Workplane(\"\
    XY\").center(kx, p.key_y).circle(p.key_big_d / 2.0)\n            .extrude(p.back_t\
    \ + p.key_boss_h + 2.0).translate((0, 0, -1.0))\n        )\n        slot = (\n\
    \            cq.Workplane(\"XY\").center(kx, p.key_y - p.key_slot_len / 2.0)\n\
    \            .rect(p.key_slot_w, p.key_slot_len)\n            .extrude(p.back_t\
    \ + p.key_boss_h + 2.0).translate((0, 0, -1.0))\n        )\n        box = box.cut(big).cut(slot)\n\
    \n    # window in the side wall, in front of the ESP32's USB-C socket\n    win\
    \ = (\n        cq.Workplane(\"XY\").box(p.window_w, 40.0, p.window_h)\n      \
    \  .translate((p.window_x, R, p.window_z))\n    )\n    box = box.cut(win)\n\n\
    \    return box"
  print_orientation: back plate's outer face (z = 0) on the bed, wall and posts standing
    up; no supports
  use_orientation: 'as printed: back plate against the wall, opening facing into the
    room, disc screwed onto the front'
