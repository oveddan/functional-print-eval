manual:
- n: '1'
  text: Print the box in matte white PLA, back face down on the bed (the flat face
    that will touch the wall), no supports. The two posts, the bosses and the pads
    all stand up, and the only bridging is over the 20 x 12 mm window and the keyhole
    slots.
  parts:
  - box
  hardware: []
  tool: null
- n: '2'
  text: Push the two M3 heat-set inserts into the two holes in the tops of the two
    posts (the posts are 33.5 mm apart, at 3 and 9 o'clock). Heat them in so their
    tops are flush with the posts' tops.
  parts:
  - box
  hardware:
  - insert_m3
  tool: soldering iron
- n: '3'
  text: Set the perfboard on the four bosses inside the box, ESP32 side up, with the
    ESP32's USB-C socket pointing at the window in the wall (12 o'clock). Fix it with
    the four M2x6 self-tapping screws down through its corner holes.
  parts:
  - box
  hardware:
  - m2x6
  tool: small cross screwdriver
- n: '4'
  text: Plug the four wires from the perfboard into the disc's input, then dress them
    down into the box. They can go down anywhere round the rim - the disc stands 5
    mm clear of the rim, so there is a slot all the way round for them.
  parts:
  - box
  hardware: []
  tool: null
- n: '5'
  text: 'Lower the disc onto the box: its back face rests on the four pads on the
    rim, the input wires at 12 o''clock (up), and its two centre holes over the two
    posts. Screw it down from the front with the two M3x6 screws, each with an M3
    washer under its head.'
  parts:
  - box
  hardware:
  - m3x6
  - washer_m3
  tool: 3 mm hex key
- n: '6'
  text: 'Put the two #8 screws with their 1/4 in anchors in the wall, 100 mm apart
    and level, leaving about 5 mm of bare shank showing (heads about 8 mm off the
    wall).'
  parts: []
  hardware: []
  tool: screwdriver
- n: '7'
  text: 'Hang the box: bring it up so the two screw heads go through the two big holes
    in its back, then let it drop so the shanks settle at the bottoms of the slots.
    Its back face should sit flat on the wall.'
  parts:
  - box
  hardware: []
  tool: null
- n: '8'
  text: Plug the USB-C charger into the ESP32's socket through the window in the wall.
    The disc, the perfboard and the ESP32 all stay in place - only the plug goes in
    and out.
  parts:
  - box
  hardware: []
  tool: null
