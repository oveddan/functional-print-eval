manual:
- n: '1'
  text: 'Print the box in matte white PLA: back face flat on the bed, 0.2 mm layers,
    3 walls, no supports. It is 235.6 mm across and 32 mm deep, so it just fits the
    X1C''s 256 mm bed with about 10 mm to spare each side. If you want to check the
    two fiddly fits first, print coupon_base and coupon_disc as well: press an insert
    into each boss, lay coupon_disc across them and drive the two M3x8 screws, try
    an M2x6 into a post, and try one of your #8 wall screws in the keyhole.'
  parts:
  - box
  - coupon_base
  - coupon_disc
  hardware: []
  tool: Bambu Studio
- n: '2'
  text: Press the two heat-set inserts into the two 4.3 mm holes in the top of the
    central tower, working from the open front. Keep the iron at about 230 C and each
    insert level, set flush to about 0.3 mm below the tower's top face.
  parts:
  - box
  hardware:
  - insert_m3
  tool: soldering iron with an insert tip
- n: '3'
  text: 'Trial-fit the disk: hold it LED side out and drop its two centre holes over
    the two inserts. Its back should meet the tower''s top and the box''s front rim
    together, and its 4-pin connector plus wires should sit in the 56 x 8 mm notch
    at 12 o''clock. If the connector holds the disk off the rim, tell me its size
    and I will deepen the notch.'
  parts:
  - box
  hardware:
  - leddisk
  tool: null
- n: '4'
  text: 'Screw the perfboard down onto the four standoffs with the four M2x6 screws,
    ESP32 on top and its USB-C port at the bottom, pointing at the window in the bottom
    wall. If the port you will use is at the board''s other end, turn the board 180
    degrees - the corner holes and standoffs are symmetric. Snug only: stop when the
    board touches the standoffs.'
  parts:
  - box
  hardware:
  - perfboard
  - m2screw
  tool: small cross-head screwdriver
- n: '5'
  text: 'Wire it up: fix the four wires into the perfboard''s screw terminals, then
    run them up and out through the tall notch at the top, around one end of the central
    tower, so there is slack to hold the disk in front of the box.'
  parts:
  - box
  hardware:
  - esp32
  - perfboard
  tool: null
- n: '6'
  text: 'Plug the disk''s 4-pin connector into the disk, then lay the disk on the
    front: its two centre holes over the inserts, connector and wires in the notch.
    Drive the two M3x8 screws through the disk''s holes into the inserts. Snug only
    - the disk is a PCB.'
  parts:
  - box
  hardware:
  - leddisk
  - m3screw
  tool: 2.5 mm hex key
- n: '7'
  text: 'Put two #8 screws in 1/4 inch anchors, level and 140 mm apart, with the heads
    about 3 mm off the wall. Slip the two 10 mm keyhole holes in the box''s back over
    the heads and let the box drop about 9 mm until the shanks sit at the tops of
    the slots.'
  parts:
  - box
  hardware: []
  tool: screwdriver and level
- n: '8'
  text: Plug the USB-C charger into the ESP32's port through the 28 x 10 mm window
    in the bottom wall, then dress the cable down the wall. Nothing needs to come
    off to unplug it.
  parts:
  - box
  hardware:
  - esp32
  tool: null
