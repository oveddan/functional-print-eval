parts:
- id: box
  role: final
  material: PLA, matte white
  code: "def build(p):\n    import cadquery as cq\n    r = p.box_od / 2.0\n    ri\
    \ = r - p.box_wall\n    hx = p.perfboard_w / 2.0 - p.perfboard_hole_inset\n  \
    \  hy = p.perfboard_l / 2.0 - p.perfboard_hole_inset\n    posts = [(p.board_x\
    \ + hx, p.board_y + hy), (p.board_x - hx, p.board_y + hy),\n             (p.board_x\
    \ + hx, p.board_y - hy), (p.board_x - hx, p.board_y - hy)]\n    s = cq.Workplane('XY').circle(r).extrude(p.box_back_t)\n\
    \    s = s.union(cq.Workplane('XY').workplane(offset=p.box_back_t)\n         \
    \       .circle(r).circle(ri).extrude(p.box_depth - p.box_back_t))\n    tower\
    \ = (cq.Workplane('XY').workplane(offset=p.box_back_t)\n             .box(p.tower_l,\
    \ p.tower_w, p.box_depth - p.box_back_t, centered=(True, True, False)))\n    tower\
    \ = tower.edges('|Z').fillet(4.0)\n    s = s.union(tower)\n    for px, py in posts:\n\
    \        s = s.union(cq.Workplane('XY').workplane(offset=p.box_back_t).center(px,\
    \ py)\n                    .circle(p.standoff_d / 2.0).extrude(p.standoff_h))\n\
    \    for dx in (-1.0, 1.0):\n        ix = dx * p.disc_hole_pitch / 2.0\n     \
    \   s = s.cut(cq.Workplane('XY').workplane(offset=p.box_depth).center(ix, 0)\n\
    \                  .circle(p.insert_hole_d / 2.0).extrude(-p.insert_hole_depth))\n\
    \        s = s.cut(cq.Workplane('XY').workplane(offset=p.box_depth - p.insert_hole_depth).center(ix,\
    \ 0)\n                  .circle(p.insert_relief_d / 2.0).extrude(-p.insert_relief_depth))\n\
    \    for px, py in posts:\n        s = s.cut(cq.Workplane('XY').workplane(offset=p.box_back_t\
    \ + p.standoff_h).center(px, py)\n                  .circle(p.pilot_d / 2.0).extrude(-p.pilot_depth))\n\
    \    for kx in (-p.keyhole_x, p.keyhole_x):\n        s = s.cut(cq.Workplane('XY').workplane(offset=-1.0).center(kx,\
    \ p.keyhole_hole_y)\n                  .circle(p.keyhole_head_d / 2.0).extrude(p.box_back_t\
    \ + 2.0))\n        s = s.cut(cq.Workplane('XY').workplane(offset=-1.0)\n     \
    \             .center(kx, p.keyhole_hole_y + p.keyhole_slot_l / 2.0)\n       \
    \           .box(p.keyhole_slot_w, p.keyhole_slot_l, p.box_back_t + 2.0, centered=(True,\
    \ True, False)))\n    win = (cq.Workplane('XY').workplane(offset=p.usb_z - p.win_h\
    \ / 2.0).center(0.0, -r)\n           .box(p.win_w, 60.0, p.win_h, centered=(True,\
    \ True, False)))\n    win = win.edges('|Y').fillet(3.0)\n    s = s.cut(win)\n\
    \    s = s.cut(cq.Workplane('XY').workplane(offset=p.box_depth - p.notch_depth).center(0.0,\
    \ r - 10.0)\n              .box(p.notch_w, 25.0, p.notch_depth + 1.0, centered=(True,\
    \ True, False)))\n    return s\n"
  print_orientation: Back face (the wall side) flat on the bed at z = 0, open front
    facing up; no supports needed.
  use_orientation: Back face against the wall, open front facing the room at z = 32,
    the LED disk screwed across the front. The 28 x 10 mm USB window is at the bottom,
    the connector notch at the top, the keyhole slots in the back plate.
- id: coupon_base
  role: coupon
  material: PLA, matte white
  code: "def build(p):\n    import cadquery as cq\n    plate = cq.Workplane('XY').box(100,\
    \ 45, p.coupon_t, centered=(True, True, False))\n    boss = (cq.Workplane('XY').workplane(offset=p.coupon_t).center(-22,\
    \ 0)\n            .box(p.tower_l, p.tower_w, p.boss_h, centered=(True, True, False)))\n\
    \    boss = boss.edges('|Z').fillet(4.0)\n    s = plate.union(boss)\n    for py\
    \ in (-8.0, 8.0):\n        s = s.union(cq.Workplane('XY').workplane(offset=p.coupon_t).center(45,\
    \ py)\n                    .circle(p.standoff_d / 2.0).extrude(p.standoff_h))\n\
    \    top = p.coupon_t + p.boss_h\n    for dx in (-1, 1):\n        hx = -22 + dx\
    \ * p.disc_hole_pitch / 2.0\n        s = s.cut(cq.Workplane('XY').workplane(offset=top).center(hx,\
    \ 0)\n                  .circle(p.insert_hole_d / 2.0).extrude(-p.insert_hole_depth))\n\
    \        s = s.cut(cq.Workplane('XY').workplane(offset=top - p.insert_hole_depth).center(hx,\
    \ 0)\n                  .circle(p.insert_relief_d / 2.0).extrude(-p.insert_relief_depth))\n\
    \    s = s.cut(cq.Workplane('XY').workplane(offset=-1).center(25, -10)\n     \
    \         .circle(p.keyhole_head_d / 2.0).extrude(p.coupon_t + 2))\n    s = s.cut(cq.Workplane('XY').workplane(offset=-1).center(25,\
    \ -10 + p.keyhole_slot_l / 2.0)\n              .box(p.keyhole_slot_w, p.keyhole_slot_l,\
    \ p.coupon_t + 2, centered=(True, True, False)))\n    for py in (-8.0, 8.0):\n\
    \        s = s.cut(cq.Workplane('XY').workplane(offset=p.coupon_t + p.standoff_h).center(45,\
    \ py)\n                  .circle(p.pilot_d / 2.0).extrude(-p.pilot_depth))\n \
    \   return s\n"
  print_orientation: 100 x 45 base plate's underside on the bed (z = 0), boss and
    posts rising.
  use_orientation: 'Test piece only: copies the box''s two insert bosses, an M2 standoff
    pilot and one keyhole slot.'
- id: coupon_disc
  role: coupon
  material: PLA, any colour
  code: "def build(p):\n    import cadquery as cq\n    s = cq.Workplane('XY').box(44,\
    \ 14, p.disc_t, centered=(True, True, False))\n    for dx in (-1, 1):\n      \
    \  s = s.cut(cq.Workplane('XY').workplane(offset=-1).center(dx * p.disc_hole_pitch\
    \ / 2.0, 0)\n                  .circle(p.disc_hole_d / 2.0).extrude(p.disc_t +\
    \ 2))\n    return s\n"
  print_orientation: Flat on the bed, 1.6 mm thick.
  use_orientation: Lay across coupon_base's two insert bosses as a stand-in for the
    disk, then drive the two M3x8 screws.
