task: estoa-light
note: 'Front/side cover excluded as asked — this is only the matte-white back box.
  Frames in the finished piece: wall plane z = 0, +z into the room, +y up, +x right
  (identical to the box''s own frame, so the box sits at the origin unrotated). Box
  back face on the wall; its front rim is at z = 32 and the disk screws to it. Disk
  (own:led-disk): origin (0, 0, 32), +x = (1,0,0), +z = (0,0,1) — back face resting
  on the box rim and on the tower''s two bosses, its 3 o''clock / 9 o''clock holes
  on the inserts, its 12 o''clock connector and wires inside the 56 x 8 mm notch.
  Perfboard (own:perfboard): origin (-8.89, -70, 10.6), +x = (1,0,0), +z = (0,0,1);
  its underside sits on the four standoffs at z = 9.0 and its four corner holes take
  the M2x6 screws. Rotate it 180 deg about +z if your USB-C port is at the board''s
  other end — the corner holes and standoffs are symmetric and the window clears both.
  ESP32 (own:esp32), port used: mouth centre (3.99, -92.67, 24.74), +x = (0,-1,0)
  straight down out of the port, +z = (0,0,1); the other port sits at x = -3.99 and
  is equally covered. The M3 heads sit on the disk''s LED side at z = 33.6, so the
  later transparent front/side part should clear about z = 37 and skirt the box''s
  235.6 mm outside. Box is 235.6 mm dia x 32 mm on a 256 mm bed; expect roughly 130-160
  g and 6-9 h with 3 walls and no supports.'
questions:
- text: How far is the disk's 4-pin connector from its centre, and how tall is it
    off the back face?
  answer: null
- text: What is the LED disk's board thickness at the rim?
  answer: null
- text: Did a USB-C plug reach and seat in the ESP32's port through the bottom window?
  answer: null
