parts:
- id: light_box
  role: final
  material: matte white PLA
  code: "def build(p):\n    # Base outer cylindrical enclosure\n    box = (\n    \
    \    cq.Workplane(\"XY\")\n        .circle(p.box_od / 2.0)\n        .extrude(p.box_height)\n\
    \    )\n\n    # Hollow cavity\n    inner_r = (p.box_od - 2.0 * p.box_wall_t) /\
    \ 2.0\n    cavity = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.box_back_t)\n\
    \        .circle(inner_r)\n        .extrude(p.box_height - p.box_back_t + 1.0)\n\
    \    )\n    box = box.cut(cavity)\n\n    # Central bosses for LED disc mounting\n\
    \    boss_pts = [(-p.disc_hole_pitch / 2.0, 0), (p.disc_hole_pitch / 2.0, 0)]\n\
    \    bosses = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.box_back_t)\n\
    \        .pushPoints(boss_pts)\n        .circle(p.boss_od / 2.0)\n        .extrude(p.box_height\
    \ - p.box_back_t)\n    )\n    box = box.union(bosses)\n\n    # Heat-set insert\
    \ holes in central bosses\n    insert_holes = (\n        cq.Workplane(\"XY\")\n\
    \        .workplane(offset=p.box_height)\n        .pushPoints(boss_pts)\n    \
    \    .circle(p.insert_hole_d / 2.0)\n        .extrude(-p.insert_hole_depth)\n\
    \    )\n    box = box.cut(insert_holes)\n\n    # Perfboard corner standoffs\n\
    \    p1 = (p.perfboard_x - p.perfboard_hole_pitch_x / 2.0, p.perfboard_y - p.perfboard_hole_pitch_y\
    \ / 2.0)\n    p2 = (p.perfboard_x + p.perfboard_hole_pitch_x / 2.0, p.perfboard_y\
    \ - p.perfboard_hole_pitch_y / 2.0)\n    p3 = (p.perfboard_x - p.perfboard_hole_pitch_x\
    \ / 2.0, p.perfboard_y + p.perfboard_hole_pitch_y / 2.0)\n    p4 = (p.perfboard_x\
    \ + p.perfboard_hole_pitch_x / 2.0, p.perfboard_y + p.perfboard_hole_pitch_y /\
    \ 2.0)\n    standoff_pts = [p1, p2, p3, p4]\n\n    standoffs = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.box_back_t)\n        .pushPoints(standoff_pts)\n\
    \        .circle(p.standoff_od / 2.0)\n        .extrude(p.standoff_h)\n    )\n\
    \    box = box.union(standoffs)\n\n    # Pilot holes for M2 self-tapping screws\
    \ in standoffs\n    standoff_holes = (\n        cq.Workplane(\"XY\")\n       \
    \ .workplane(offset=p.box_back_t + p.standoff_h)\n        .pushPoints(standoff_pts)\n\
    \        .circle(p.m2_pilot_hole_d / 2.0)\n        .extrude(-p.m2_pilot_hole_depth)\n\
    \    )\n    box = box.cut(standoff_holes)\n\n    # Keyhole slots in back wall\
    \ (for hanging flat on two #8 wall screws)\n    keyhole_pts = [(-p.wall_screw_spacing\
    \ / 2.0, p.keyhole_y), (p.wall_screw_spacing / 2.0, p.keyhole_y)]\n    kh_entry\
    \ = (\n        cq.Workplane(\"XY\")\n        .pushPoints(keyhole_pts)\n      \
    \  .circle(p.keyhole_entry_d / 2.0)\n        .extrude(p.box_back_t + 1.0)\n  \
    \  )\n    box = box.cut(kh_entry)\n\n    slot_pts = [\n        (-p.wall_screw_spacing\
    \ / 2.0, p.keyhole_y + p.keyhole_slot_len / 2.0),\n        (p.wall_screw_spacing\
    \ / 2.0, p.keyhole_y + p.keyhole_slot_len / 2.0),\n    ]\n    kh_slots = (\n \
    \       cq.Workplane(\"XY\")\n        .pushPoints(slot_pts)\n        .rect(p.keyhole_slot_w,\
    \ p.keyhole_slot_len)\n        .extrude(p.box_back_t + 1.0)\n    )\n    box =\
    \ box.cut(kh_slots)\n\n    slot_top_pts = [\n        (-p.wall_screw_spacing /\
    \ 2.0, p.keyhole_y + p.keyhole_slot_len),\n        (p.wall_screw_spacing / 2.0,\
    \ p.keyhole_y + p.keyhole_slot_len),\n    ]\n    kh_tops = (\n        cq.Workplane(\"\
    XY\")\n        .pushPoints(slot_top_pts)\n        .circle(p.keyhole_slot_w / 2.0)\n\
    \        .extrude(p.box_back_t + 1.0)\n    )\n    box = box.cut(kh_tops)\n\n \
    \   # USB-C port cutout in bottom wall (-y, 6 o'clock)\n    usb_cutout = (\n \
    \       cq.Workplane(\"XY\")\n        .workplane(offset=p.usb_cutout_z_min)\n\
    \        .center(p.usb_cutout_x, -p.box_od / 2.0)\n        .rect(p.usb_cutout_w,\
    \ p.box_wall_t * 4.0)\n        .extrude(p.box_height - p.usb_cutout_z_min + 1.0)\n\
    \    )\n    box = box.cut(usb_cutout)\n\n    # Wire clearance notch at top rim\
    \ (+y, 12 o'clock)\n    wire_notch = (\n        cq.Workplane(\"XY\")\n       \
    \ .workplane(offset=p.box_height - p.wire_notch_depth)\n        .center(0, p.box_od\
    \ / 2.0)\n        .rect(p.wire_notch_w, p.box_wall_t * 4.0)\n        .extrude(p.wire_notch_depth\
    \ + 1.0)\n    )\n    box = box.cut(wire_notch)\n\n    return box\n"
  print_orientation: Back face on the print bed (z = 0)
  use_orientation: Hangs flat against the wall on two screws with back at z = 0, +y
    pointing up
