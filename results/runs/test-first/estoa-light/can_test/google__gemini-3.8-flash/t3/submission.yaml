- id: crit_disc_boss_pitch
  part: light_box
  feature: central_bosses
  relation: engages
  hardware: led_disk
  clearance_mm: 0.0
  params:
  - disc_hole_pitch
  check:
    method: measure
    ref: null
    description: Check that the centre-to-centre distance between boss holes matches
      the LED disc mounting hole pitch (33.5 mm)
