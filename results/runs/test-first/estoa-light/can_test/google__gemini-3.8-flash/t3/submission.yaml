      charger cable overmolds
- id: crit_wall_keyholes
  part: light_box
  feature: keyhole_slots
  relation: clears
  hardware: null
  clearance_mm: 1.0
  params:
  - keyhole_entry_d
  - keyhole_slot_w
  - wall_screw_head_d
  check:
    method: measure
    ref: null
    description: 'Ensure keyhole entry holes clear 9 mm #8 screw heads and slots fit
      ~4.2 mm shanks'
manual:
- n: '1'
  text: Use a soldering iron with an M3 tip to press the two M3x4x5 heat-set inserts
    into the holes at the top face of the two central bosses inside the light box
    until they sit flush with the top surface.
  parts:
  - light_box
  hardware:
  - m3_insert_disc
  tool: soldering iron
- n: '2'
  text: Place your perfboard onto the four corner standoffs in the lower half of the
    box with the ESP32 facing up (+z) and its USB-C port facing down towards the cutout
    in the bottom rim. Fasten it down using the four M2 x 6 self-tapping screws.
  parts:
  - light_box
  hardware:
  - m2_screw_perfboard
  - perfboard
  tool: screwdriver
- n: '3'
  text: Route the four wires from the perfboard terminals upward through the open
    space between the central bosses towards 12 o'clock, and connect them to the input
    connector on the back of the DotStar LED disc. Ensure the wires nest into the
    top rim clearance notch.
  parts:
  - light_box
  hardware:
  - led_disk
  - perfboard
  tool: null
- n: '4'
  text: Place the LED disc onto the front rim and bosses of the box with its input
    wires at 12 o'clock. Secure it by driving two ISO 4762 M3x8 screws through the
    two mounting holes near its centre into the heat-set inserts.
  parts:
  - light_box
  hardware:
  - led_disk
  - m3_screw_disc
  tool: 2.5 mm hex key
- n: '5'
  text: 'Drive two #8 round-head screws with 1/4" wall anchors into your wall at an
    80 mm horizontal spacing, leaving the screw heads protruding approximately 4 mm.
    Align the keyhole entry holes on the back of the box over the screw heads, press
    against the wall, and slide the box down into the narrow slots until firmly seated.'
  parts:
  - light_box
  hardware: []
  tool: null
- n: '6'
  text: Plug your USB-C power charger cable straight into the exposed ESP32 port through
    the cutout at the bottom (6 o'clock) of the box.
  parts:
  - light_box
  hardware:
  - esp32
  tool: null
