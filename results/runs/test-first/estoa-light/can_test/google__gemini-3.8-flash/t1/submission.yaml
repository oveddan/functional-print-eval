  - keyhole_slot_w
  - keyhole_pitch
  check:
    method: measure
    ref: null
    description: 'Ensure #8 round-head screws (9mm head, 4.2mm shank) enter keyhole
      and slide securely into slot'
- id: crit_usb_access
  part: box
  feature: usb_cable_cutout
  relation: clears
  hardware: null
  clearance_mm: 1.5
  params:
  - box_height
  - floor_thickness
  check:
    method: measure
    ref: null
    description: Verify standard USB-C cable overmold clears the cutout pocket to
      plug fully into ESP32 port
manual:
- n: '1'
  text: Using a soldering iron set to ~220-240°C, heat-set the two M3x4x5 inserts
    into the two centre boss holes on the front of the box until they sit flush with
    the top surface. Allow them to cool completely.
  parts:
  - box
  hardware:
  - insert_disk
  tool: Soldering iron
- n: '2'
  text: Mount the perfboard onto the four standoffs inside the box with the ESP32
    USB-C port facing the bottom cutout (6 o'clock). Fasten with the four M2x6 self-tapping
    screws into the standoff pilot holes.
  parts:
  - box
  hardware:
  - screw_perfboard
  tool: Small Phillips or flathead screwdriver
- n: '3'
  text: Connect the four wires from the perfboard to the LED disc's input connector.
    Rest the LED disc on the box's outer rim and centre bridge, aligning its two central
    3.3mm holes with the heat-set inserts. Fasten with two ISO 4762 M3x8 socket head
    cap screws.
  parts:
  - box
  hardware:
  - screw_disk
  tool: 2.5mm hex key
- n: '4'
  text: 'Install two #8 round-head screws with wall anchors horizontally spaced 100
    mm apart on the wall, leaving the screw heads protruding approximately 3.5 to
    4 mm. Hang the box flat against the wall by pushing the keyholes over the screw
    heads and sliding the box down 10 mm.'
  parts:
  - box
  hardware: []
  tool: Level and drill/screwdriver
- n: '5'
  text: Plug your USB-C power charger cable through the bottom port opening directly
    into the ESP32's USB-C port.
  parts:
  - box
  hardware: []
  tool: null
