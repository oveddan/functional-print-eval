parts:
- id: box
  role: final
  material: PLA
  code: "def build(p):\n    outer_r = p.disk_od / 2.0\n    inner_r = outer_r - p.wall_thickness\n\
    \    box_h = p.box_height\n    floor_t = p.floor_thickness\n\n    # Base floor\
    \ disc\n    base = cq.Workplane(\"XY\").circle(outer_r).extrude(floor_t)\n\n \
    \   # Outer cylindrical rim\n    rim = (\n        cq.Workplane(\"XY\")\n     \
    \   .workplane(offset=floor_t)\n        .circle(outer_r)\n        .circle(inner_r)\n\
    \        .extrude(box_h - floor_t)\n    )\n    res = base.union(rim)\n\n    #\
    \ Central bridge for M3 heat-set inserts supporting the LED disc\n    bridge_l\
    \ = p.disk_hole_pitch + 16.0\n    bridge_w = 14.0\n    bridge = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=floor_t)\n        .slot2D(bridge_l, bridge_w)\n\
    \        .extrude(box_h - floor_t)\n    )\n    res = res.union(bridge)\n\n   \
    \ # Standoffs for perfboard mounting\n    perf_cx = -p.esp32_usb_center_x_offset\n\
    \    perf_cy = -75.0\n    dx = p.perfboard_width / 2.0 - p.perfboard_hole_edge_dist\n\
    \    dy = p.perfboard_length / 2.0 - p.perfboard_hole_edge_dist\n\n    standoff_pts\
    \ = [\n        (perf_cx - dx, perf_cy - dy),\n        (perf_cx + dx, perf_cy -\
    \ dy),\n        (perf_cx - dx, perf_cy + dy),\n        (perf_cx + dx, perf_cy\
    \ + dy),\n    ]\n\n    for sx, sy in standoff_pts:\n        so = (\n         \
    \   cq.Workplane(\"XY\")\n            .workplane(offset=floor_t)\n           \
    \ .transformed(offset=cq.Vector(sx, sy, 0))\n            .circle(p.perfboard_standoff_od\
    \ / 2.0)\n            .extrude(p.perfboard_standoff_h)\n        )\n        res\
    \ = res.union(so)\n\n    # Enclosure shroud for bottom USB-C port access channel\n\
    \    usb_pocket_w = 18.0\n    usb_pocket_wall = 2.4\n    usb_shroud_w = usb_pocket_w\
    \ + 2.0 * usb_pocket_wall\n    usb_y_inner = perf_cy - p.perfboard_length / 2.0\
    \ + 3.0\n    usb_shroud_len = outer_r + usb_y_inner  # length to reach outer wall\n\
    \    usb_shroud_cy = -outer_r + usb_shroud_len / 2.0\n\n    usb_shroud = (\n \
    \       cq.Workplane(\"XY\")\n        .workplane(offset=floor_t)\n        .transformed(offset=cq.Vector(0,\
    \ usb_shroud_cy, 0))\n        .rect(usb_shroud_w, usb_shroud_len)\n        .extrude(box_h\
    \ - floor_t)\n    )\n    res = res.union(usb_shroud)\n\n    # Protective shroud\
    \ walls around wall-hanging keyholes\n    kx_offset = p.keyhole_pitch / 2.0\n\
    \    ky_center = 45.0\n    shroud_h = 10.0\n    for kx in [-kx_offset, kx_offset]:\n\
    \        kshroud = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=floor_t)\n\
    \            .transformed(offset=cq.Vector(kx, ky_center, 0))\n            .rect(18.0,\
    \ 22.0)\n            .extrude(shroud_h)\n        )\n        res = res.union(kshroud)\n\
    \n    # Cut insert holes at the centre bridge\n    for hx in [-p.disk_hole_pitch\
    \ / 2.0, p.disk_hole_pitch / 2.0]:\n        # Heat-set insert cavity\n       \
    \ res = (\n            res.faces(\">Z\")\n            .workplane()\n         \
    \   .transformed(offset=cq.Vector(hx, 0, 0))\n            .circle(p.insert_hole_d\
    \ / 2.0)\n            .cutBlind(- (p.insert_length + 2.0))\n        )\n      \
    \  # Screw tip relief hole\n        res = (\n            res.faces(\">Z\")\n \
    \           .workplane()\n            .transformed(offset=cq.Vector(hx, 0, 0))\n\
    \            .circle((p.screw_disk_d + 0.4) / 2.0)\n            .cutBlind(- (p.screw_disk_length\
    \ + 2.0))\n        )\n\n    # Cut pilot holes in perfboard standoffs\n    for\
    \ sx, sy in standoff_pts:\n        res = (\n            res.faces(\">Z\")\n  \
    \          .workplane()\n            .transformed(offset=cq.Vector(sx, sy, 0))\n\
    \            .circle(p.perfboard_standoff_hole_d / 2.0)\n            .cutBlind(-p.perfboard_standoff_h)\n\
    \        )\n\n    # Cut keyhole slots through the back wall at (+/-50, 45)\n \
    \   for kx in [-kx_offset, kx_offset]:\n        # Entry circle for 9mm head\n\
    \        entry = (\n            cq.Workplane(\"XY\")\n            .transformed(offset=cq.Vector(kx,\
    \ 40.0, -1.0))\n            .circle(p.keyhole_entry_d / 2.0)\n            .extrude(floor_t\
    \ + 2.0)\n        )\n        res = res.cut(entry)\n        # Vertical slot for\
    \ 4.2mm shank\n        slot = (\n            cq.Workplane(\"XY\")\n          \
    \  .transformed(offset=cq.Vector(kx, 45.0, -1.0))\n            .slot2D(p.keyhole_slot_len,\
    \ p.keyhole_slot_w, 90.0)\n            .extrude(floor_t + 2.0)\n        )\n  \
    \      res = res.cut(slot)\n        # Pocket inside shroud to clear screw head\
    \ above floor\n        kpocket = (\n            cq.Workplane(\"XY\")\n       \
    \     .workplane(offset=floor_t)\n            .transformed(offset=cq.Vector(kx,\
    \ ky_center, 0))\n            .rect(13.2, 17.2)\n            .extrude(shroud_h\
    \ + 1.0)\n        )\n        res = res.cut(kpocket)\n\n    # Cut USB-C channel\
    \ through bottom shroud and outer rim\n    usb_cutout = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=floor_t)\n        .transformed(offset=cq.Vector(0,\
    \ usb_shroud_cy, 0))\n        .rect(usb_pocket_w, usb_shroud_len + 4.0)\n    \
    \    .extrude(box_h - floor_t + 1.0)\n    )\n    res = res.cut(usb_cutout)\n\n\
    \    return res\n"
  print_orientation: Back face flat on print bed (z = 0 is the bed)
  use_orientation: Back face flat against wall (z = 0), +y points vertically up against
    gravity, +z points away from wall into room
