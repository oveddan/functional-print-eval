criteria:
- id: crit_disc_mount
  part: box
  feature: disc_mount_bosses
  relation: supports
  hardware: own:led-disk
  clearance_mm: 0.5
  params:
  - disc_hole_pitch
  - m3_insert_hole_d
  check:
    method: measure
    ref: null
    description: Verify that the LED disc mounting holes align with the heat-set insert
      centres at 33.5 mm spacing
- id: crit_perfboard_mount
  part: box
  feature: perfboard_standoffs
  relation: supports
  hardware: own:perfboard
  clearance_mm: 0.3
  params:
  - perfboard_hole_pitch_x
  - perfboard_hole_pitch_y
  - standoff_hole_d
  check:
    method: measure
    ref: null
    description: Verify that the perfboard four corner mounting holes align with the
      standoffs
- id: crit_usb_access
  part: box
  feature: usb_port_cutout
  relation: clears
  hardware: own:esp32
  clearance_mm: 2.0
  params:
  - usb_cutout_w
  - usb_cutout_z_bottom
  check:
    method: measure
    ref: null
    description: Verify that a standard USB-C cable connector clears the wall cutout
      and plugs fully into the ESP32 port
- id: crit_wall_hanging
  part: box
  feature: wall_keyholes
  relation: engages
  hardware: null
  clearance_mm: 1.0
  params:
  - keyhole_entry_d
  - keyhole_slot_w
  - keyhole_spacing
  check:
    method: measure
    ref: null
    description: 'Verify that #8 wall mounting screw heads pass through keyhole entry
      holes and slide into slots'
manual:
- n: '1'
  text: Using a soldering iron, press the two M3x4x5 heat-set inserts into the holes
    at the top of the central mounting pillars until flush with the pillar top faces.
  parts:
  - box
  hardware:
  - m3_insert_1
  - m3_insert_2
  tool: soldering iron
- n: '2'
  text: Place the perfboard (with the ESP32 mounted) onto the four standoffs inside
    the box, orienting it so the ESP32's USB-C port faces the opening at the bottom
    rim (6 o'clock). Fasten with the four M2x6 self-tapping screws.
  parts:
  - box
  hardware:
  - own:perfboard
  - own:esp32
  - m2_perfboard_screw_1
  - m2_perfboard_screw_2
  - m2_perfboard_screw_3
  - m2_perfboard_screw_4
  tool: PH1 screwdriver
- n: '3'
  text: Connect the four wires from the perfboard to the LED disc's 4-pin input connector,
    routing the wiring neatly inside the box cavity towards 12 o'clock.
  parts:
  - box
  hardware:
  - own:led-disk
  tool: null
- n: '4'
  text: Place the LED disc onto the front rim and central pillars of the box with
    the input connector at 12 o'clock and the two central mounting holes aligned with
    the heat-set inserts. Secure the disc with the two M3x8 socket head cap screws.
  parts:
  - box
  hardware:
  - own:led-disk
  - m3_disc_screw_1
  - m3_disc_screw_2
  tool: 2.5 mm hex key
- n: '5'
  text: 'Drive two #8 round-head screws into wall anchors spaced 100 mm apart horizontally,
    leaving their heads protruding 3.5 to 4 mm from the wall surface. Align the keyhole
    entry holes on the back of the box with the screw heads, push the box against
    the wall, and slide down to lock into the slots.'
  parts:
  - box
  hardware: []
  tool: screwdriver
- n: '6'
  text: Plug your USB-C power supply cable through the bottom opening directly into
    the ESP32's USB-C port to power the light.
  parts:
  - box
  hardware: []
  tool: null
