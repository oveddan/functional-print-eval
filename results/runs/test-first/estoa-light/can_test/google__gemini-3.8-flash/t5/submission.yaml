parts:
- id: box
  role: final
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    box_od = p.box_od\n    box_wall_t\
    \ = p.box_wall_t\n    box_floor_t = p.box_floor_t\n    box_h = p.box_h\n\n   \
    \ # Outer solid cylinder\n    box = cq.Workplane(\"XY\").circle(box_od / 2.0).extrude(box_h)\n\
    \n    # Hollow cavity\n    inner_r = box_od / 2.0 - box_wall_t\n    cavity = (\n\
    \        cq.Workplane(\"XY\")\n        .workplane(offset=box_floor_t)\n      \
    \  .circle(inner_r)\n        .extrude(box_h)\n    )\n    box = box.cut(cavity)\n\
    \n    # Central mounting bosses and reinforcing rib for LED disc M3 screws\n \
    \   boss_od = p.m3_boss_od\n    boss_x = p.disc_hole_pitch / 2.0\n    boss_left\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=box_floor_t)\n\
    \        .transformed(offset=(-boss_x, 0, 0))\n        .circle(boss_od / 2.0)\n\
    \        .extrude(box_h - box_floor_t)\n    )\n    boss_right = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=box_floor_t)\n        .transformed(offset=(boss_x,\
    \ 0, 0))\n        .circle(boss_od / 2.0)\n        .extrude(box_h - box_floor_t)\n\
    \    )\n    rib_w = p.boss_rib_w\n    rib = (\n        cq.Workplane(\"XY\")\n\
    \        .workplane(offset=box_floor_t)\n        .rect(boss_x * 2.0, rib_w)\n\
    \        .extrude(box_h - box_floor_t)\n    )\n    box = box.union(boss_left).union(boss_right).union(rib)\n\
    \n    # Holes for M3 heat-set inserts at top of bosses\n    insert_hole_d = p.m3_insert_hole_d\n\
    \    insert_hole_depth = p.m3_insert_hole_depth\n    insert_holes = (\n      \
    \  cq.Workplane(\"XY\")\n        .workplane(offset=box_h)\n        .pushPoints([(-boss_x,\
    \ 0), (boss_x, 0)])\n        .circle(insert_hole_d / 2.0)\n        .extrude(-insert_hole_depth)\n\
    \    )\n    box = box.cut(insert_holes)\n\n    # Perfboard mounting standoffs\n\
    \    standoff_od = p.standoff_od\n    standoff_h = p.standoff_h\n    standoff_hole_d\
    \ = p.standoff_hole_d\n    pb_y = p.perfboard_y_centre\n    pb_hx = p.perfboard_hole_pitch_x\
    \ / 2.0\n    pb_hy = p.perfboard_hole_pitch_y / 2.0\n    standoff_pts = [\n  \
    \      (-pb_hx, pb_y - pb_hy),\n        (pb_hx, pb_y - pb_hy),\n        (-pb_hx,\
    \ pb_y + pb_hy),\n        (pb_hx, pb_y + pb_hy),\n    ]\n\n    standoffs = (\n\
    \        cq.Workplane(\"XY\")\n        .workplane(offset=box_floor_t)\n      \
    \  .pushPoints(standoff_pts)\n        .circle(standoff_od / 2.0)\n        .extrude(standoff_h)\n\
    \    )\n    box = box.union(standoffs)\n\n    pilot_holes = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=box_floor_t + standoff_h)\n        .pushPoints(standoff_pts)\n\
    \        .circle(standoff_hole_d / 2.0)\n        .extrude(-p.standoff_hole_depth)\n\
    \    )\n    box = box.cut(pilot_holes)\n\n    # Wall hanging keyhole slots on\
    \ back face\n    kh_x = p.keyhole_spacing / 2.0\n    kh_y = p.keyhole_y\n    kh_entry_d\
    \ = p.keyhole_entry_d\n    kh_slot_w = p.keyhole_slot_w\n    kh_len = p.keyhole_slot_len\n\
    \n    for sign in [-1, 1]:\n        kx = sign * kh_x\n        entry = (\n    \
    \        cq.Workplane(\"XY\")\n            .transformed(offset=(kx, kh_y, 0))\n\
    \            .circle(kh_entry_d / 2.0)\n            .extrude(box_floor_t * 2,\
    \ combine=False)\n        )\n        slot_rect = (\n            cq.Workplane(\"\
    XY\")\n            .transformed(offset=(kx, kh_y + kh_len / 2.0, 0))\n       \
    \     .rect(kh_slot_w, kh_len)\n            .extrude(box_floor_t * 2, combine=False)\n\
    \        )\n        slot_top = (\n            cq.Workplane(\"XY\")\n         \
    \   .transformed(offset=(kx, kh_y + kh_len, 0))\n            .circle(kh_slot_w\
    \ / 2.0)\n            .extrude(box_floor_t * 2, combine=False)\n        )\n  \
    \      box = box.cut(entry).cut(slot_rect).cut(slot_top)\n\n    # USB-C port cutout\
    \ in bottom wall (facing 6 o'clock)\n    usb_w = p.usb_cutout_w\n    usb_z_start\
    \ = p.usb_cutout_z_bottom\n    usb_cut = (\n        cq.Workplane(\"XY\")\n   \
    \     .workplane(offset=usb_z_start)\n        .transformed(offset=(0, -box_od\
    \ / 2.0, 0))\n        .rect(usb_w, box_wall_t * 4.0)\n        .extrude(box_h)\n\
    \    )\n    box = box.cut(usb_cut)\n\n    # Wire notch at 12 o'clock rim\n   \
    \ wire_cut = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=box_h\
    \ - p.wire_notch_depth)\n        .transformed(offset=(0, box_od / 2.0, 0))\n \
    \       .rect(p.wire_notch_w, box_wall_t * 4.0)\n        .extrude(p.wire_notch_depth\
    \ + 1.0)\n    )\n    box = box.cut(wire_cut)\n\n    return box\n"
  print_orientation: Back face flat on bed at z = 0, rim opening upwards at +z
  use_orientation: Back face flat against the wall (z = 0), +z into the room, +y points
    up against gravity
