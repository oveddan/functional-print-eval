parts:
- id: box
  role: final
  material: PLA (matte white)
  code: "def build(p):\n    r_outer = p.box_od / 2.0\n    r_inner = r_outer - p.wall_t\n\
    \    hole_pitch = p.led_disk_hole_inner_span + p.led_disk_hole_d\n    hole_x =\
    \ hole_pitch / 2.0\n\n    # 1. Outer cylindrical shell with solid back plate\n\
    \    part = cq.Workplane(\"XY\").circle(r_outer).extrude(p.box_depth)\n    cavity\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.back_t)\n   \
    \     .circle(r_inner)\n        .extrude(p.box_depth)\n    )\n    part = part.cut(cavity)\n\
    \n    # 2. Central mounting boss bar and upper support ribs (all rising from z=0\
    \ to z=box_depth)\n    central_bar = (\n        cq.Workplane(\"XY\")\n       \
    \ .rect(hole_pitch + 16.0, 14.0)\n        .extrude(p.box_depth)\n    )\n    part\
    \ = part.union(central_bar)\n\n    for sx in (-hole_x, hole_x):\n        pillar\
    \ = (\n            cq.Workplane(\"XY\")\n            .center(sx, 0.0)\n      \
    \      .circle(8.0)\n            .extrude(p.box_depth)\n        )\n        part\
    \ = part.union(pillar)\n\n    # Upper support rib from central bar towards 12\
    \ o'clock (stops short of wire relief)\n    upper_rib = (\n        cq.Workplane(\"\
    XY\")\n        .center(0.0, r_inner / 2.0)\n        .rect(4.0, r_inner - 16.0)\n\
    \        .extrude(p.box_depth)\n    )\n    part = part.union(upper_rib)\n\n  \
    \  # 3. Four perfboard mounting standoffs\n    pb_dx = p.perfboard_w / 2.0 - (p.perfboard_hole_edge\
    \ + p.perfboard_hole_d / 2.0)\n    pb_dy = p.perfboard_l / 2.0 - (p.perfboard_hole_edge\
    \ + p.perfboard_hole_d / 2.0)\n    standoff_top_z = p.back_t + p.standoff_h\n\n\
    \    for dx in (-pb_dx, pb_dx):\n        for dy in (-pb_dy, pb_dy):\n        \
    \    sx = p.pb_center_x + dx\n            sy = p.pb_center_y + dy\n          \
    \  post = (\n                cq.Workplane(\"XY\")\n                .center(sx,\
    \ sy)\n                .circle(p.standoff_d / 2.0)\n                .extrude(standoff_top_z)\n\
    \            )\n            part = part.union(post)\n\n    # 4. Internal reinforcement\
    \ bosses for the two wall-mounting keyholes\n    kh_y_mid = p.keyhole_y + p.keyhole_slot_l\
    \ / 2.0\n    kh_boss_l = p.keyhole_slot_l + p.keyhole_entry_d + 8.0\n    kh_boss_w\
    \ = p.keyhole_pocket_w + 8.0\n    for kx in (-p.keyhole_x, p.keyhole_x):\n   \
    \     kh_pad = (\n            cq.Workplane(\"XY\")\n            .center(kx, kh_y_mid)\n\
    \            .rect(kh_boss_w, kh_boss_l)\n            .extrude(p.keyhole_boss_h)\n\
    \        )\n        part = part.union(kh_pad)\n\n    # 5. Cut M2 self-tapping\
    \ pilot holes into the four standoffs\n    for dx in (-pb_dx, pb_dx):\n      \
    \  for dy in (-pb_dy, pb_dy):\n            sx = p.pb_center_x + dx\n         \
    \   sy = p.pb_center_y + dy\n            pilot = (\n                cq.Workplane(\"\
    XY\")\n                .workplane(offset=standoff_top_z - p.m2_length)\n     \
    \           .center(sx, sy)\n                .circle(p.m2_pilot_d / 2.0)\n   \
    \             .extrude(p.m2_length + 1.0)\n            )\n            part = part.cut(pilot)\n\
    \n    # 6. Cut M3 clearance holes and side-entry captive hex nut slots in central\
    \ mounting bosses\n    nut_slot_w = p.m3_nut_af + 0.25\n    nut_slot_h = p.m3_nut_h\
    \ + 0.35\n    nut_z_bottom = p.box_depth - p.boss_top_t - nut_slot_h\n\n    for\
    \ sx in (-hole_x, hole_x):\n        m3_bore = (\n            cq.Workplane(\"XY\"\
    )\n            .workplane(offset=p.box_depth - p.m3_length - 2.0)\n          \
    \  .center(sx, 0.0)\n            .circle(p.m3_clearance_d / 2.0)\n           \
    \ .extrude(p.m3_length + 3.0)\n        )\n        part = part.cut(m3_bore)\n\n\
    \        # Side-entry nut slot entering from the +y face of the central bar to\
    \ y = -nut_slot_w/2\n        nut_slot = (\n            cq.Workplane(\"XY\")\n\
    \            .workplane(offset=nut_z_bottom)\n            .center(sx, 4.0)\n \
    \           .rect(nut_slot_w, 8.0 + nut_slot_w)\n            .extrude(nut_slot_h)\n\
    \        )\n        part = part.cut(nut_slot)\n\n    # 7. Inner wire relief on\
    \ the top rim at 12 o'clock (+y) for LED disk input wires\n    wire_relief = (\n\
    \        cq.Workplane(\"XY\")\n        .workplane(offset=p.box_depth - 6.0)\n\
    \        .center(0.0, r_inner)\n        .rect(40.0, p.wall_t)\n        .extrude(7.0)\n\
    \    )\n    part = part.cut(wire_relief)\n\n    # 8. Bottom USB-C charger access\
    \ window at 6 o'clock (-y)\n    usb_win = (\n        cq.Workplane(\"XY\")\n  \
    \      .workplane(offset=p.usb_win_z_min)\n        .center(p.usb_win_x, -r_outer)\n\
    \        .rect(p.usb_win_w, 40.0)\n        .extrude(p.usb_win_h)\n    )\n    part\
    \ = part.cut(usb_win)\n\n    # 9. Cut the two wall-mounting keyhole slots on the\
    \ back face (z = 0)\n    for kx in (-p.keyhole_x, p.keyhole_x):\n        # Entry\
    \ circle through full keyhole boss + back plate\n        entry_hole = (\n    \
    \        cq.Workplane(\"XY\")\n            .center(kx, p.keyhole_y)\n        \
    \    .circle(p.keyhole_entry_d / 2.0)\n            .extrude(p.keyhole_boss_h -\
    \ 2.0)\n        )\n        part = part.cut(entry_hole)\n\n        # Narrow shaft\
    \ slot through clamping web (z = 0 to keyhole_web_t)\n        shaft_slot = (\n\
    \            cq.Workplane(\"XY\")\n            .center(kx, kh_y_mid)\n       \
    \     .rect(p.keyhole_slot_w, p.keyhole_slot_l)\n            .extrude(p.keyhole_web_t)\n\
    \        )\n        part = part.cut(shaft_slot)\n\n        slot_top_cap = (\n\
    \            cq.Workplane(\"XY\")\n            .center(kx, p.keyhole_y + p.keyhole_slot_l)\n\
    \            .circle(p.keyhole_slot_w / 2.0)\n            .extrude(p.keyhole_web_t)\n\
    \        )\n        part = part.cut(slot_top_cap)\n\n        # Internal wide pocket\
    \ for the #8 screw head behind the clamping web\n        head_pocket = (\n   \
    \         cq.Workplane(\"XY\")\n            .workplane(offset=p.keyhole_web_t)\n\
    \            .center(kx, kh_y_mid)\n            .rect(p.keyhole_pocket_w, p.keyhole_slot_l\
    \ + 2.0)\n            .extrude(p.keyhole_boss_h - p.keyhole_web_t - 2.0)\n   \
    \     )\n        part = part.cut(head_pocket)\n\n    return part\n"
  print_orientation: Back face flat on the print bed (z = 0 on the bed, +z up)
  use_orientation: Back face (z = 0) flat against the wall, +y pointing up (12 o'clock
    wire relief at top, USB-C window at 6 o'clock bottom), front rim at z = 30 mm
    supporting the LED disk
