manual:
- n: '1'
  text: Slide the two M3 hex nuts (ISO 4032 M3) into the side slots on the upper (+y)
    face of the central mounting bosses until they align with the vertical M3 holes.
  parts:
  - box
  hardware:
  - m3_nut
  tool: null
- n: '2'
  text: Place the perfboard (with the ESP32 plugged into its headers and its USB-C
    port facing down towards the bottom window of the box) onto the four internal
    standoffs, and fasten the four corners with the M2x6 self-tapping screws.
  parts:
  - box
  hardware:
  - perfboard
  - esp32
  - m2_screw
  tool: Phillips screwdriver
- n: '3'
  text: Route the four wires from the perfboard up to the LED disk's input at 12 o'clock
    (Resting in the inner rim relief at the top of the box), set the LED disk flat
    against the front rim and central bosses of the box, and fasten it through its
    two central holes using the two ISO 4762 M3x12 screws.
  parts:
  - box
  hardware:
  - led_disk
  - m3_screw
  tool: 2.5 mm hex key
- n: '4'
  text: 'Drive your two #8 wall screws into the wall 120 mm apart horizontally (leaving
    the underside of the screw heads about 2 mm off the wall), plug your USB-C charger
    cable straight into the ESP32 through the bottom window, and hang the box flat
    against the wall on the two keyhole slots.'
  parts:
  - box
  hardware: []
  tool: null
