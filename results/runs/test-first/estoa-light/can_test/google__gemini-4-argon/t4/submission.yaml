parts:
- id: wall_box
  role: final
  material: PLA
  code: "def build(p):\n    # Outer diameter of LED disk and box\n    disk_hole_pitch\
    \ = p.led_disk_between_holes + p.led_disk_hole_d\n    box_d = (\n        p.led_disk_hole_to_edge_1\n\
    \        + p.led_disk_hole_to_edge_2\n        + p.led_disk_between_holes\n   \
    \     + 2.0 * p.led_disk_hole_d\n    )\n    box_r = box_d / 2.0\n    inner_r =\
    \ box_r - p.box_wall_t\n\n    # 1. Main cylindrical shell with floor at z = 0..box_floor_t\n\
    \    outer_cyl = cq.Workplane(\"XY\").circle(box_r).extrude(p.box_depth)\n   \
    \ inner_cavity = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.box_floor_t)\n\
    \        .circle(inner_r)\n        .extrude(p.box_depth)\n    )\n    box = outer_cyl.cut(inner_cavity)\n\
    \n    # 2. Central M3 mounting pillars for LED disk + stiffening bridge web\n\
    \    pillar_h = p.box_depth - p.box_floor_t\n    pillars = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.box_floor_t)\n        .pushPoints([(-disk_hole_pitch\
    \ / 2.0, 0.0), (disk_hole_pitch / 2.0, 0.0)])\n        .circle(p.central_boss_d\
    \ / 2.0)\n        .extrude(pillar_h)\n    )\n    central_web = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.box_floor_t)\n        .box(disk_hole_pitch,\
    \ 5.0, pillar_h, centered=(True, True, False))\n    )\n    box = box.union(pillars).union(central_web)\n\
    \n    # Heat-set insert holes in the two central pillars\n    box = (\n      \
    \  box.faces(\">Z\")\n        .workplane()\n        .pushPoints([(-disk_hole_pitch\
    \ / 2.0, 0.0), (disk_hole_pitch / 2.0, 0.0)])\n        .hole(p.insert_m3_hole_d,\
    \ p.insert_m3_l + 4.5)\n    )\n\n    # 3. Four standoffs for the 50x70 mm perfboard\
    \ in the lower half of the box\n    hole_offset = p.perf_hole_edge + p.perf_hole_d\
    \ / 2.0\n    perf_pitch_x = p.perf_w - 2.0 * hole_offset\n    perf_pitch_y = p.perf_l\
    \ - 2.0 * hole_offset\n    perf_pts = [\n        (-perf_pitch_x / 2.0, p.perf_center_y\
    \ - perf_pitch_y / 2.0),\n        (perf_pitch_x / 2.0, p.perf_center_y - perf_pitch_y\
    \ / 2.0),\n        (-perf_pitch_x / 2.0, p.perf_center_y + perf_pitch_y / 2.0),\n\
    \        (perf_pitch_x / 2.0, p.perf_center_y + perf_pitch_y / 2.0),\n    ]\n\
    \    standoffs = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.box_floor_t)\n\
    \        .pushPoints(perf_pts)\n        .circle(p.perf_standoff_d / 2.0)\n   \
    \     .extrude(p.perf_standoff_h)\n    )\n    box = box.union(standoffs)\n\n \
    \   # Pilot holes for M2x6 self-tapping screws in the 4 standoffs\n    standoff_top_z\
    \ = p.box_floor_t + p.perf_standoff_h\n    pilot_cuts = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=standoff_top_z - (p.perf_standoff_h + 1.0))\n\
    \        .pushPoints(perf_pts)\n        .circle(p.m2_pilot_d / 2.0)\n        .extrude(p.perf_standoff_h\
    \ + 1.5)\n    )\n    box = box.cut(pilot_cuts)\n\n    # 4. Bridged USB-C access\
    \ window at the bottom wall (6 o'clock)\n    usb_center_z = (\n        p.box_floor_t\n\
    \        + p.perf_standoff_h\n        + p.perf_t\n        + p.esp32_usb_bottom_z\n\
    \        + p.esp32_usb_h / 2.0\n    )\n    usb_window = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=usb_center_z - p.usb_window_h / 2.0)\n      \
    \  .center(0.0, -box_r)\n        .box(p.usb_window_w, 36.0, p.usb_window_h, centered=(True,\
    \ True, False))\n    )\n    box = box.cut(usb_window)\n\n    # 5. Internal wire-clearance\
    \ relief at 12 o'clock (+y) on the inner upper rim\n    wire_relief = (\n    \
    \    cq.Workplane(\"XY\")\n        .workplane(offset=p.box_depth - 6.0)\n    \
    \    .center(0.0, inner_r)\n        .box(40.0, 3.0, 6.5, centered=(True, True,\
    \ False))\n    )\n    box = box.cut(wire_relief)\n\n    # 6. Two keyhole wall-mount\
    \ bosses and counterbored keyhole slots\n    kh_x = p.wall_screw_pitch / 2.0\n\
    \    kh_seat_y = p.wall_keyhole_y\n    kh_entry_y = kh_seat_y - p.wall_keyhole_slot_l\n\
    \    kh_mid_y = (kh_seat_y + kh_entry_y) / 2.0\n    entry_d = p.wall_screw_head_d\
    \ + 1.6\n    slot_w = p.wall_screw_shaft_d + 0.6\n    cbore_w = p.wall_screw_head_d\
    \ + 2.6\n    boss_h = 7.0\n\n    for sx in (-kh_x, kh_x):\n        boss = (\n\
    \            cq.Workplane(\"XY\")\n            .center(sx, kh_mid_y)\n       \
    \     .slot2D(p.wall_keyhole_slot_l + cbore_w + 8.0, cbore_w + 8.0, 90.0)\n  \
    \          .extrude(boss_h)\n        )\n        box = box.union(boss)\n\n    \
    \    # Through entry circle + narrow slot (z = 0 to boss_h)\n        entry_hole\
    \ = (\n            cq.Workplane(\"XY\")\n            .center(sx, kh_entry_y)\n\
    \            .circle(entry_d / 2.0)\n            .extrude(boss_h + 1.0)\n    \
    \    )\n        narrow_slot = (\n            cq.Workplane(\"XY\")\n          \
    \  .center(sx, kh_mid_y)\n            .slot2D(p.wall_keyhole_slot_l + slot_w,\
    \ slot_w, 90.0)\n            .extrude(boss_h + 1.0)\n        )\n        # Internal\
    \ counterbore above retaining lip (z = wall_keyhole_lip_t to boss_h, prints with\
    \ zero overhang)\n        head_cbore = (\n            cq.Workplane(\"XY\")\n \
    \           .workplane(offset=p.wall_keyhole_lip_t)\n            .center(sx, kh_mid_y)\n\
    \            .slot2D(p.wall_keyhole_slot_l + cbore_w, cbore_w, 90.0)\n       \
    \     .extrude(boss_h)\n        )\n        box = box.cut(entry_hole).cut(narrow_slot).cut(head_cbore)\n\
    \n    return box\n"
  print_orientation: Back wall flat on print bed (z = 0)
  use_orientation: Back wall flat against wall (z = 0), +y pointing up (12 o'clock),
    +z pointing away from wall
- id: disk_mount_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    pitch = p.led_disk_between_holes + p.led_disk_hole_d\n\
    \    bar = (\n        cq.Workplane(\"XY\")\n        .slot2D(pitch + 14.0, 12.0)\n\
    \        .extrude(6.0)\n        .faces(\">Z\")\n        .workplane()\n       \
    \ .pushPoints([(-pitch / 2.0, 0.0), (pitch / 2.0, 0.0)])\n        .hole(p.insert_m3_hole_d,\
    \ 5.5)\n    )\n    return bar\n"
  print_orientation: Bottom face on bed (z = 0)
  use_orientation: Top face against back of LED disk to check 33.5 mm hole pitch and
    M3 insert fit
- id: perfboard_usb_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    hole_offset = p.perf_hole_edge + p.perf_hole_d / 2.0\n\
    \    pitch_x = p.perf_w - 2.0 * hole_offset\n    base_h = 2.4\n    wall_h = base_h\
    \ + p.perf_standoff_h + p.perf_t + p.esp32_usb_bottom_z + p.esp32_usb_h + 6.0\n\
    \    usb_z = base_h + p.perf_standoff_h + p.perf_t + p.esp32_usb_bottom_z + p.esp32_usb_h\
    \ / 2.0\n\n    part = (\n        cq.Workplane(\"XY\")\n        .box(p.perf_w +\
    \ 6.0, 16.0, base_h, centered=(True, False, False))\n    )\n    wall = (\n   \
    \     cq.Workplane(\"XY\")\n        .box(p.perf_w + 6.0, p.box_wall_t, wall_h,\
    \ centered=(True, False, False))\n    )\n    standoffs = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=base_h)\n        .pushPoints([\n            (-pitch_x\
    \ / 2.0, p.box_wall_t + 3.0 + hole_offset),\n            (pitch_x / 2.0, p.box_wall_t\
    \ + 3.0 + hole_offset),\n        ])\n        .circle(p.perf_standoff_d / 2.0)\n\
    \        .extrude(p.perf_standoff_h)\n    )\n    part = part.union(wall).union(standoffs)\n\
    \    pilot_cuts = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=base_h\
    \ - 1.0)\n        .pushPoints([\n            (-pitch_x / 2.0, p.box_wall_t + 3.0\
    \ + hole_offset),\n            (pitch_x / 2.0, p.box_wall_t + 3.0 + hole_offset),\n\
    \        ])\n        .circle(p.m2_pilot_d / 2.0)\n        .extrude(p.perf_standoff_h\
    \ + 1.5)\n    )\n    part = part.cut(pilot_cuts)\n    cutout = (\n        cq.Workplane(\"\
    XZ\")\n        .workplane(offset=-1.0)\n        .center(0.0, usb_z)\n        .rect(p.usb_window_w,\
    \ p.usb_window_h)\n        .extrude(p.box_wall_t + 4.0)\n    )\n    part = part.cut(cutout)\n\
    \    return part\n"
  print_orientation: Bottom face on bed (z = 0)
  use_orientation: Perfboard mounted on standoffs, USB-C cable plugged through window
