task: estoa-light
note: 'The round wall box matches the 241.58 mm measured diameter of the Adafruit
  255-LED disk (102.54 + 102.24 + 30.2 + 2*3.3 mm) and fits within the 256 x 256 mm
  build plate of the Bambu Lab X1C without supports. The two central M3 bosses (33.5
  mm centre-to-centre) take M3x4x5 heat-set inserts for M3x8 screws. The 50 x 70 mm
  perfboard mounts on 5 mm standoffs in the lower half of the box (clear of the central
  bosses) with its four 2.4 mm corner holes (45.8 x 65.8 mm pitch) secured by the
  M2x6 self-tapping screws. A 46 x 14 mm bridged window at the bottom wall aligns
  with the ESP32''s USB-C receptacle (z = 23.74 mm) so any USB-C charger plug can
  reach straight into the port. Two counterbored keyhole slots spaced 120 mm apart
  in the upper half of the back wall accept #8 round-head screws (up to 9 mm head
  diameter) so the box hangs flat against the wall.'
