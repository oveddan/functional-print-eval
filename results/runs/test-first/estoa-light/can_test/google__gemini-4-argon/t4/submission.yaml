    (`led_disk`). Seat the LED disk on the front rim and central pillars of `wall_box`
    with its input wires at 12 o'clock (+y, nestled in the top internal wire relief)
    and the two central mounting holes at 3 and 9 o'clock. Fasten the LED disk using
    two ISO 4762 M3x8 screws (`m3_screw`).
  parts:
