manual:
- n: '1'
  text: Print `wall_box` in matte white PLA with its flat back face on the build plate
    (z = 0). No supports are needed. Using a soldering iron, press the two M3x4x5
    heat-set inserts (`m3_insert`) flush into the tops of the two central pillars
    at x = ±16.75 mm, y = 0.
  parts:
  - wall_box
  hardware:
  - m3_insert
  tool: soldering iron
- n: '2'
  text: Place the perfboard (`perfboard`, with `esp32` plugged into its female headers)
    onto the four standoffs in the lower half of `wall_box` so the ESP32's USB-C port
    faces downwards (-y) toward the bottom access window. Fasten the four corners
    using the four M2 x 6 self-tapping screws (`m2_screw`).
  parts:
