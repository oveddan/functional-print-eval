  - m3_screw
  tool: 2.5 mm hex key
- n: '4'
  text: 'Install two #8 round-head wall screws into wall anchors horizontally level
    and 120.0 mm apart, leaving the screw heads projecting ~2.5 mm from the wall.
    Plug the USB-C charger cable straight up through the bottom window into the ESP32''s
    USB-C port, fit the two keyhole openings on the back of `wall_box` over the wall
    screw heads, and slide the box down 12 mm to lock it flat against the wall.'
  parts:
  - wall_box
  hardware:
  - esp32
  tool: screwdriver
