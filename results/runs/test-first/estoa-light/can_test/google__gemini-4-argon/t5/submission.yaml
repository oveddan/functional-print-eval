manual:
- n: '1'
  text: Print the light_box flat on its back face without supports. Press the two
    M3x4x5 heat-set inserts flush into the two central mounting bosses at the front
    of the box using a soldering iron.
  parts:
  - light_box
  hardware:
  - disk_insert
  tool: soldering iron
- n: '2'
  text: Place the perfboard (with the ESP32 plugged into its headers and its USB-C
    port facing the bottom 6 o'clock window) onto the four lower standoffs inside
    the box, and fasten its four corners with the four M2x6 self-tapping screws.
  parts:
  - light_box
  hardware:
  - perfboard
  - esp32
  - perfboard_screw
  tool: Phillips screwdriver
- n: '3'
  text: Connect the four wires from the perfboard to the LED disk's 4-pin input connector,
    orient the LED disk with its input wires at 12 o'clock (aligned with the top inner
    rim relief), seat the disk onto the front of the box, and fasten it through its
    two centre holes with the two M3x8 socket head screws.
  parts:
  - light_box
  hardware:
  - led_disk
  - disk_screw
  tool: 2.5 mm hex key
- n: '4'
  text: 'Install the two #8 round-head wall screws horizontally 120 mm apart on the
    wall, leaving ~3 mm between the underside of the screw heads and the wall. Plug
    the USB-C charger cable into the ESP32 through the bottom window and hang the
    box flat against the wall on the two keyhole slots.'
  parts:
  - light_box
  hardware: []
  tool: drill and screwdriver
