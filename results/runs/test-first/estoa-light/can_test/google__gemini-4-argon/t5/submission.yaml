parts:
- id: light_box
  role: final
  material: PLA
  code: "def build(p):\n    disk_d = (\n        p.led_disk_hole_to_edge_1\n      \
    \  + p.led_disk_hole_to_edge_2\n        + p.led_disk_hole_between\n        + 2.0\
    \ * p.led_disk_hole_d\n    )\n    outer_r = disk_d / 2.0\n    inner_r = outer_r\
    \ - p.wall_t\n    hole_pitch = p.led_disk_hole_between + p.led_disk_hole_d\n \
    \   hole_x = hole_pitch / 2.0\n\n    # 1. Outer cylindrical shell (flat back plate\
    \ + cylindrical perimeter wall)\n    box = (\n        cq.Workplane(\"XY\")\n \
    \       .circle(outer_r)\n        .extrude(p.box_depth)\n        .faces(\">Z\"\
    )\n        .workplane()\n        .circle(inner_r)\n        .cutBlind(-(p.box_depth\
    \ - p.back_wall_t))\n    )\n\n    # 2. Central mounting pedestal for the LED disk\
    \ M3 heat-set inserts\n    pedestal = (\n        cq.Workplane(\"XY\")\n      \
    \  .workplane(offset=p.back_wall_t)\n        .slot2D(hole_pitch + 2.0 * p.disk_boss_r,\
    \ 2.0 * p.disk_boss_r, 0)\n        .extrude(p.box_depth - p.back_wall_t)\n   \
    \ )\n    box = box.union(pedestal)\n\n    # 3. Four intermediate support pillars\
    \ to keep the LED disk flat\n    support_pts = [(-75.0, 45.0), (75.0, 45.0), (-75.0,\
    \ -35.0), (75.0, -35.0)]\n    pillars = (\n        cq.Workplane(\"XY\")\n    \
    \    .workplane(offset=p.back_wall_t)\n        .pushPoints(support_pts)\n    \
    \    .circle(p.support_pillar_r)\n        .extrude(p.box_depth - p.back_wall_t)\n\
    \    )\n    box = box.union(pillars)\n\n    # 4. Perfboard corner standoffs (4x)\n\
    \    pb_dx = p.perfboard_w / 2.0 - (p.perfboard_hole_edge_dist + p.perfboard_hole_d\
    \ / 2.0)\n    pb_dy = p.perfboard_l / 2.0 - (p.perfboard_hole_edge_dist + p.perfboard_hole_d\
    \ / 2.0)\n    pb_pts = [\n        (-pb_dx, p.perfboard_center_y + pb_dy),\n  \
    \      (pb_dx, p.perfboard_center_y + pb_dy),\n        (-pb_dx, p.perfboard_center_y\
    \ - pb_dy),\n        (pb_dx, p.perfboard_center_y - pb_dy),\n    ]\n    standoffs\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.back_wall_t)\n\
    \        .pushPoints(pb_pts)\n        .circle(p.standoff_r)\n        .extrude(p.standoff_h)\n\
    \    )\n    box = box.union(standoffs)\n\n    # Pilot holes in standoffs for M2x6\
    \ self-tapping screws\n    box = (\n        box.faces(\">Z\")\n        .workplane(offset=-(p.box_depth\
    \ - (p.back_wall_t + p.standoff_h)))\n        .pushPoints(pb_pts)\n        .circle(p.m2_pilot_d\
    \ / 2.0)\n        .cutBlind(-p.m2_pilot_depth)\n    )\n\n    # 5. Heat-set insert\
    \ pockets and M3 tip clearance holes in central pedestal\n    disk_hole_pts =\
    \ [(-hole_x, 0.0), (hole_x, 0.0)]\n    box = (\n        box.faces(\">Z\")\n  \
    \      .workplane()\n        .pushPoints(disk_hole_pts)\n        .circle(p.insert_hole_d\
    \ / 2.0)\n        .cutBlind(-p.insert_length)\n        .faces(\">Z\")\n      \
    \  .workplane()\n        .pushPoints(disk_hole_pts)\n        .circle(p.m3_clearance_d\
    \ / 2.0)\n        .cutBlind(-(p.insert_length + 6.0))\n    )\n\n    # 6. Wall-mounting\
    \ keyholes (2x in upper half of back plate)\n    kh_x = p.keyhole_spacing / 2.0\n\
    \    kh_y = p.keyhole_y\n    kh_pts_bot = [(-kh_x, kh_y - p.keyhole_slot_l), (kh_x,\
    \ kh_y - p.keyhole_slot_l)]\n    kh_pts_mid = [(-kh_x, kh_y - p.keyhole_slot_l\
    \ / 2.0), (kh_x, kh_y - p.keyhole_slot_l / 2.0)]\n\n    kh_bosses = (\n      \
    \  cq.Workplane(\"XY\")\n        .workplane(offset=p.back_wall_t)\n        .pushPoints(kh_pts_mid)\n\
    \        .slot2D(p.keyhole_slot_l + 18.0, 20.0, 90)\n        .extrude(5.0)\n \
    \   )\n    box = box.union(kh_bosses)\n\n    kh_pockets = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.keyhole_web_t)\n        .pushPoints(kh_pts_mid)\n\
    \        .slot2D(p.keyhole_slot_l + p.wall_screw_head_d + 2.0, 12.0, 90)\n   \
    \     .extrude(p.box_depth)\n    )\n    box = box.cut(kh_pockets)\n\n    kh_entry\
    \ = (\n        cq.Workplane(\"XY\")\n        .pushPoints(kh_pts_bot)\n       \
    \ .circle((p.wall_screw_head_d + 1.0) / 2.0)\n        .extrude(p.back_wall_t +\
    \ 1.0)\n    )\n    kh_slot = (\n        cq.Workplane(\"XY\")\n        .pushPoints(kh_pts_mid)\n\
    \        .slot2D(p.keyhole_slot_l + p.wall_screw_shaft_d, p.wall_screw_shaft_d,\
    \ 90)\n        .extrude(p.back_wall_t + 1.0)\n    )\n    box = box.cut(kh_entry).cut(kh_slot)\n\
    \n    # 7. Top (12 o'clock, +y) wire/pad relief on the inner rim of the outer\
    \ wall\n    top_relief = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.box_depth\
    \ - 6.0)\n        .center(0.0, inner_r)\n        .rect(40.0, 4.0)\n        .extrude(6.0)\n\
    \    )\n    box = box.cut(top_relief)\n\n    # 8. Bottom (6 o'clock, -y) USB-C\
    \ access window & plug clearance recess\n    usb_cut = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.usb_window_z_min)\n        .center(p.usb_window_x_center,\
    \ -outer_r + 10.0)\n        .rect(p.usb_window_w, 40.0)\n        .extrude(p.box_depth\
    \ - p.usb_window_z_min)\n    )\n    box = box.cut(usb_cut)\n\n    return box\n"
  print_orientation: Back face (z = 0) flat on the print bed
  use_orientation: Back face (z = 0) flat against the wall, +y pointing up (12 o'clock),
    +z pointing out through the LED disk
