manual:
- n: '1'
  text: 'Optional quick check: print fit_coupon first, hold it against the two central
    mounting holes of the LED disk to verify the 33.5 mm hole spacing, and test-fit
    one M3x4x5 heat-set insert and one M2x6 self-tapping screw.'
  parts:
  - fit_coupon
  hardware:
  - led_disk
  - disk_inserts
  - perfboard_screws
  tool: soldering iron and Phillips/hex driver
- n: '2'
  text: Print the main box flat on its back face (no supports needed). Using a soldering
    iron, press the two M3x4x5 heat-set threaded inserts flush into the 4.3 mm bores
    at the tops of the two central mounting pillars.
  parts:
  - box
  hardware:
  - disk_inserts
  tool: soldering iron
- n: '3'
  text: Place the perfboard (with the ESP32 plugged into its female headers and its
    USB-C port facing the bottom access window of the box) onto the four lower standoffs,
    and fasten the four corners with the four M2x6 self-tapping screws.
  parts:
  - box
  hardware:
  - perfboard
  - esp32
  - perfboard_screws
  tool: screwdriver
- n: '4'
  text: Route the four input wires from the perfboard to the back of the LED disk
    (with the disk's 12 o'clock wire exit aligned towards the top of the box, opposite
    the USB-C window). Seat the LED disk onto the front rim and central pillars, and
    fasten it through its two central holes using the two ISO 4762 M3x8 socket head
    screws.
  parts:
  - box
  hardware:
  - led_disk
  - disk_screws
  tool: 2.5 mm hex key
- n: '5'
  text: Plug the USB-C charger cable straight into the ESP32 through the bottom access
    window, and hang the box flat against the wall on two wall screws spaced 100 mm
    apart horizontally using the two keyhole slots on the back.
  parts:
  - box
  hardware:
  - esp32
  tool: null
