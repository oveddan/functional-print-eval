parts:
- id: box
  role: final
  material: PLA
  code: "def build(p):\n    disk_hole_pitch = p.led_disk_between_holes + p.led_disk_hole_d\n\
    \    box_od = (\n        p.led_disk_hole_to_edge_1\n        + p.led_disk_hole_to_edge_2\n\
    \        + p.led_disk_between_holes\n        + 2.0 * p.led_disk_hole_d\n    )\n\
    \    box_r = box_od / 2.0\n    inner_r = box_r - p.side_wall_t\n\n    # 1. Outer\
    \ cylindrical shell with back wall at z = 0\n    body = cq.Workplane(\"XY\").circle(box_r).extrude(p.box_depth)\n\
    \    cavity = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.back_wall_t)\n\
    \        .circle(inner_r)\n        .extrude(p.box_depth)\n    )\n    body = body.cut(cavity)\n\
    \n    # 2. Central mounting pillars for the LED disk + connecting floor web\n\
    \    pillar_pts = [(-disk_hole_pitch / 2.0, 0.0), (disk_hole_pitch / 2.0, 0.0)]\n\
    \    pillars = (\n        cq.Workplane(\"XY\")\n        .pushPoints(pillar_pts)\n\
    \        .circle(p.center_pillar_od / 2.0)\n        .extrude(p.box_depth)\n  \
    \  )\n    pillar_web = (\n        cq.Workplane(\"XY\")\n        .box(disk_hole_pitch,\
    \ 5.0, 12.0, centered=(True, True, False))\n    )\n    body = body.union(pillars).union(pillar_web)\n\
    \n    # Heat-set insert bores and screw tip clearance in the two central pillars\n\
    \    insert_depth = p.m3_insert_len + 1.5\n    insert_bores = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.box_depth - insert_depth)\n        .pushPoints(pillar_pts)\n\
    \        .circle(p.m3_insert_hole_d / 2.0)\n        .extrude(insert_depth + 1.0)\n\
    \    )\n    screw_clear_depth = p.m3_screw_len + 4.0\n    screw_bores = (\n  \
    \      cq.Workplane(\"XY\")\n        .workplane(offset=p.box_depth - screw_clear_depth)\n\
    \        .pushPoints(pillar_pts)\n        .circle((p.m3_screw_d + 0.4) / 2.0)\n\
    \        .extrude(screw_clear_depth + 1.0)\n    )\n    body = body.cut(insert_bores).cut(screw_bores)\n\
    \n    # 3. Four standoffs for the perfboard (in the lower half of the box)\n \
    \   pf_hx = p.perfboard_w / 2.0 - p.perfboard_hole_edge_dist - p.perfboard_hole_d\
    \ / 2.0\n    pf_hy = p.perfboard_l / 2.0 - p.perfboard_hole_edge_dist - p.perfboard_hole_d\
    \ / 2.0\n    standoff_pts = [\n        (-pf_hx, p.perfboard_center_y + pf_hy),\n\
    \        (pf_hx, p.perfboard_center_y + pf_hy),\n        (-pf_hx, p.perfboard_center_y\
    \ - pf_hy),\n        (pf_hx, p.perfboard_center_y - pf_hy),\n    ]\n    standoff_top_z\
    \ = p.back_wall_t + p.perfboard_standoff_h\n    standoffs = (\n        cq.Workplane(\"\
    XY\")\n        .pushPoints(standoff_pts)\n        .circle(p.perfboard_standoff_od\
    \ / 2.0)\n        .extrude(standoff_top_z)\n    )\n    body = body.union(standoffs)\n\
    \n    pilot_depth = (p.m2_screw_len - p.perfboard_t) + 1.0\n    pilots = (\n \
    \       cq.Workplane(\"XY\")\n        .workplane(offset=standoff_top_z - pilot_depth)\n\
    \        .pushPoints(standoff_pts)\n        .circle(p.m2_pilot_d / 2.0)\n    \
    \    .extrude(pilot_depth + 0.5)\n    )\n    body = body.cut(pilots)\n\n    #\
    \ 4. Two keyhole slots in the back wall for hanging flat on two wall screws\n\
    \    kh_xs = [-p.wall_mount_pitch / 2.0, p.wall_mount_pitch / 2.0]\n    for kx\
    \ in kh_xs:\n        entry_cut = (\n            cq.Workplane(\"XY\")\n       \
    \     .center(kx, p.wall_mount_y - p.keyhole_slot_l)\n            .circle(p.keyhole_entry_d\
    \ / 2.0)\n            .extrude(p.back_wall_t + 2.0)\n        )\n        slot_cut\
    \ = (\n            cq.Workplane(\"XY\")\n            .center(kx, p.wall_mount_y\
    \ - p.keyhole_slot_l / 2.0)\n            .box(p.keyhole_slot_w, p.keyhole_slot_l,\
    \ p.back_wall_t + 2.0, centered=(True, True, False))\n        )\n        top_cut\
    \ = (\n            cq.Workplane(\"XY\")\n            .center(kx, p.wall_mount_y)\n\
    \            .circle(p.keyhole_slot_w / 2.0)\n            .extrude(p.back_wall_t\
    \ + 2.0)\n        )\n        body = body.cut(entry_cut).cut(slot_cut).cut(top_cut)\n\
    \n    # 5. USB-C charger access window through the bottom (-y) wall\n    usb_z\
    \ = (\n        p.back_wall_t\n        + p.perfboard_standoff_h\n        + p.perfboard_t\n\
    \        + p.esp32_usb_bottom_z\n        + p.esp32_usb_h / 2.0\n    )\n    usb_cut\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=usb_z - p.usb_cutout_h\
    \ / 2.0)\n        .center(0.0, -box_r)\n        .box(p.usb_cutout_w, 30.0, p.usb_cutout_h,\
    \ centered=(True, True, False))\n    )\n    body = body.cut(usb_cut)\n\n    #\
    \ 6. Internal wire solder-bump relief pocket at 12 o'clock (+y) on the inner top\
    \ wall\n    wire_relief = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.box_depth\
    \ - 6.0)\n        .center(0.0, inner_r)\n        .box(28.0, 3.0, 7.0, centered=(True,\
    \ True, False))\n    )\n    body = body.cut(wire_relief)\n\n    return body\n"
  print_orientation: Back wall flat on the build plate (z = 0 on the bed, open front
    facing +z)
  use_orientation: Back wall (z = 0) flat against the room wall, USB-C window at the
    bottom (-y), LED disk screwed onto the front (+z)
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    disk_hole_pitch = p.led_disk_between_holes + p.led_disk_hole_d\n\
    \    base_l = disk_hole_pitch + p.center_pillar_od + 12.0\n    base_w = p.center_pillar_od\
    \ + 6.0\n    base_h = 8.0\n\n    # Small test bar checking the 33.5 mm LED disk\
    \ hole pitch, M3x4x5 insert fit, and M2x6 pilot hole fit\n    coupon = cq.Workplane(\"\
    XY\").box(base_l, base_w, base_h, centered=(True, True, False))\n\n    pillar_pts\
    \ = [(-disk_hole_pitch / 2.0, 0.0), (disk_hole_pitch / 2.0, 0.0)]\n    insert_depth\
    \ = p.m3_insert_len + 1.5\n    insert_bores = (\n        cq.Workplane(\"XY\")\n\
    \        .workplane(offset=base_h - insert_depth)\n        .pushPoints(pillar_pts)\n\
    \        .circle(p.m3_insert_hole_d / 2.0)\n        .extrude(insert_depth + 1.0)\n\
    \    )\n    thru_bores = (\n        cq.Workplane(\"XY\")\n        .pushPoints(pillar_pts)\n\
    \        .circle((p.m3_screw_d + 0.4) / 2.0)\n        .extrude(base_h + 1.0)\n\
    \    )\n    m2_pilot = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=base_h\
    \ - 5.5)\n        .center(0.0, 0.0)\n        .circle(p.m2_pilot_d / 2.0)\n   \
    \     .extrude(6.0)\n    )\n    coupon = coupon.cut(insert_bores).cut(thru_bores).cut(m2_pilot)\n\
    \    return coupon\n"
  print_orientation: Bottom face flat on the build plate (z = 0 on the bed)
  use_orientation: Hold against the two central holes of the LED disk and test-fit
    one M3x4x5 insert and one M2x6 screw
