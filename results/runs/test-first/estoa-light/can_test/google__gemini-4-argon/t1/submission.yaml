task: estoa-light
note: The round back box matches the measured 241.58 mm outer diameter of the Adafruit
  255-LED DotStar disk (derived from 102.54 + 102.24 + 30.2 + 2 * 3.3 mm) and prints
  flat on the 256 x 256 mm bed without supports. The perfboard mounts in the lower
  half below the two central M3 mounting pillars so the pillars rise straight from
  the back wall without bridges, and the ESP32's USB-C port sits right behind a 34
  x 14 mm chamfered window at the bottom wall so any USB-C charger plug can plug straight
  in from outside.
questions:
- text: What are the positions and diameters of the two M3 mounting holes near the
    LED disk centre, and the outer diameter of the disk?
  answer: 3.3 mm diameter, 30.2 mm inner edge-to-edge (33.5 mm centre-to-centre),
    at 3 o'clock and 9 o'clock with input wires at 12 o'clock; 102.54 mm and 102.24
    mm from outside of holes to disk edges (241.58 mm outer diameter).
- text: What are the dimensions of the perfboard and the exact position of the ESP32's
    USB-C port relative to the perfboard?
  answer: 50 x 70 mm board with 2.4 mm corner holes 0.9 mm from each edge (45.8 x
    65.8 mm centre spacing). ESP32 stands 16 mm tall in female headers; USB-C receptacle
    bottom is 12.54 mm above the perfboard top face, 3.2 mm tall x 10.67 mm wide,
    4.80 mm from the ESP32 side edge which is 7.53 mm from the perfboard side edge.
