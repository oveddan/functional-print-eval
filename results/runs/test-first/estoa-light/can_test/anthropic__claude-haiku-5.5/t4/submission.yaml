parts:
- id: back-shell
  role: final
  material: PLA matte white
  code: "import math\ndef build(p):\n    R = p.box_r\n    Ri = R - p.rim_t\n    s\
    \ = cq.Workplane('XY').circle(R).extrude(p.back_t)\n    s = s.union(cq.Workplane('XY').circle(R).circle(Ri).extrude(p.rim_h))\n\
    \    xs = [p.pb_W/2 - p.pb_hole_edge, -(p.pb_W/2 - p.pb_hole_edge)]\n    ys =\
    \ [p.pb_top_y - p.pb_hole_edge, p.pb_top_y - p.pb_L + p.pb_hole_edge]\n    for\
    \ x in xs:\n        for y in ys:\n            post = cq.Workplane('XY').workplane(offset=p.back_t\
    \ - 0.01).center(x, y).circle(p.standoff_d/2).extrude(p.pb_bottom_z - p.back_t\
    \ + 0.01)\n            s = s.union(post)\n    bx0 = p.usb_x - p.block_w/2\n  \
    \  block = cq.Workplane('XY').box(p.block_w, 13.5, p.block_top - p.back_t, centered=False).translate((bx0,\
    \ p.pb_top_y + 0.5, p.back_t))\n    s = s.union(block)\n    zc = p.pb_bottom_z\
    \ + p.pb_t + p.usb_above_pb + p.usb_h/2\n    chan = cq.Workplane('XY').box(p.channel_w,\
    \ 30, p.channel_h).translate((p.usb_x, p.pb_top_y + 16, zc))\n    s = s.cut(chan)\n\
    \    for kx in (p.keyhole_x, -p.keyhole_x):\n        s = s.cut(cq.Workplane('XY').center(kx,\
    \ p.keyhole_y).circle(p.keyhole_d/2).extrude(p.back_t))\n        s = s.cut(cq.Workplane('XY').center(kx,\
    \ p.keyhole_y - 5).rect(p.keyhole_w, 10).extrude(p.back_t))\n    for x in xs:\n\
    \        for y in ys:\n            s = s.cut(cq.Workplane('XY').workplane(offset=1.5).center(x,\
    \ y).circle(p.pb_pilot_d/2).extrude(p.pb_bottom_z - 1.5))\n    for a in (45, 135,\
    \ 225, 315):\n        c = math.cos(math.radians(a)); sn = math.sin(math.radians(a))\n\
    \        sol = cq.Solid.makeCylinder(p.rim_hole_d/2, 5.0, cq.Vector((R+1)*c, (R+1)*sn,\
    \ p.rim_screw_z), cq.Vector(-c, -sn, 0))\n        s = s.cut(cq.Workplane('XY').add(sol))\n\
    \    return s\n"
  print_orientation: wall face (z=0) on the bed
  use_orientation: wall face at z=0, box extends toward +z (toward the disc)
- id: front-lid
  role: final
  material: PLA matte white
  code: "import math\ndef build(p):\n    RL = p.box_r + p.lid_over\n    Rin = p.box_r\
    \ + p.fit\n    plate = cq.Workplane('XY').circle(RL).extrude(p.lid_t)\n    skirt\
    \ = cq.Workplane('XY').workplane(offset=p.lid_t - 0.01).circle(RL).circle(Rin).extrude(p.skirt_h\
    \ + 0.01)\n    lid = plate.union(skirt)\n    h = p.disc_hole_c/2\n    for x in\
    \ (h, -h):\n        lid = lid.cut(cq.Workplane('XY').workplane(offset=-1).center(x,\
    \ 0).circle(p.disc_ins_hole/2).extrude(p.lid_t + 2))\n    lid = lid.cut(cq.Workplane('XY').workplane(offset=-1).center(0,\
    \ p.wire_slot_y).rect(p.wire_slot_w, p.wire_slot_h).extrude(p.lid_t + 2))\n  \
    \  lid = lid.cut(cq.Workplane('XY').workplane(offset=p.lid_t - p.groove_d).center(0,\
    \ (p.wire_slot_y + p.box_r)/2).rect(p.groove_w, p.box_r - p.wire_slot_y).extrude(p.groove_d\
    \ + 0.01))\n    zc = p.lid_top_z - p.rim_screw_z\n    for a in (45, 135, 225,\
    \ 315):\n        c = math.cos(math.radians(a)); sn = math.sin(math.radians(a))\n\
    \        sol = cq.Solid.makeCylinder(p.m3_clear/2, 4.0, cq.Vector((RL+1)*c, (RL+1)*sn,\
    \ zc), cq.Vector(-c, -sn, 0))\n        lid = lid.cut(cq.Workplane('XY').add(sol))\n\
    \    return lid\n"
  print_orientation: outer (disc-side) face on the bed
  use_orientation: outer face at z=31 facing the disc; skirt runs down over the rim
    to z=23
