  - standoff_d
  - pb_bottom_z
  check:
    method: measure
    ref: null
    description: Perfboard sits flat on standoffs with M2 screws holding
manual:
- n: '1'
  text: Print back-shell with the wall face on the bed, and front-lid with its outer
    face on the bed. No supports.
  parts:
  - back-shell
  - front-lid
  hardware: []
  tool: null
- n: '2'
  text: Heat-set the four M3x4x5 rim inserts radially into the outside of the rim
    wall at 45, 135, 225 and 315 degrees, centred 25 mm above the wall face. Do this
    before the lid goes on.
  parts:
  - back-shell
  hardware:
  - rim_insert
  tool: soldering iron with heat-set insert tip
- n: '3'
  text: Heat-set the two M3x4x5 disc inserts into the front-lid from its outer face
    at the two disc hole positions, 16.75 mm either side of centre.
  parts:
  - front-lid
  hardware:
  - disc_insert
  tool: soldering iron with heat-set insert tip
- n: '4'
  text: Screw the perfboard with the ESP32 on it onto the four standoffs using M2x6
    self-tapping screws through the corner holes, ESP32 side up, USB end toward the
    rim.
  parts:
  - back-shell
  hardware:
  - pb_screw
  - perfboard
  - esp32
  tool: small Phillips screwdriver
- n: '5'
  text: Solder the four disc input wires to the perfboard, then route them up through
    the front-lid's wire slot and along its groove to the disc's 4-pin connector.
  parts:
  - front-lid
  hardware:
  - perfboard
  - led_disk
  tool: null
- n: '6'
  text: Lower the front-lid over the rim so the skirt slides outside the rim and the
    wires come through the slot. Fit the four M3x6 socket screws through the skirt
    into the rim inserts and tighten.
  parts:
  - front-lid
  - back-shell
  hardware:
  - rim_screw
  tool: 2.5 mm hex key
- n: '7'
  text: Lay the LED disc on the front-lid with its input wires at the top, its back
    face on the lid. Fit the two M3x8 socket screws through the disc's two centre
    holes into the disc inserts.
  parts:
  - front-lid
  hardware:
  - disc_screw
  - led_disk
  tool: 2.5 mm hex key
- n: '8'
  text: 'Check the USB-C port is reachable through the rim channel at the top of the
    box, then plug in the charger. Hang the box by the keyholes on the two #8 wall
    screws 100 mm apart.'
  parts:
  - back-shell
  hardware:
  - esp32
  tool: null
