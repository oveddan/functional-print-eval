note: ''
questions:
- text: Which way is the ESP32's USB port offset from its centreline, and which column
    of the perfboard is column 1 (left or right when the USB end points up)? The USB
    position x=11.61 mm is a guess; if it's on the other side the channel must move.
  answer: null
- text: The ESP32 length (63.17 mm) plus the 7.53 mm edge gap does not fit on a 70
    mm perfboard. Please check the ESP32 length or its position on the board.
  answer: null
- text: Disc thickness and perfboard thickness are guessed at 1.6 mm each. Please
    check them with calipers if you can.
  answer: null
- text: Where does the disc's 4-pin input connector sit on the back, and do the wires
    reach the top edge of the disc? The design assumes the wires leave at 12 o'clock.
  answer: null
- text: Please confirm the wall-screw head is no more than 9 mm across and the screws
    will be 100 mm apart at the same height.
  answer: null
