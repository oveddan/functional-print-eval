note: ''
questions:
- text: 'LED disc outer diameter and thickness: I could not measure them, so disc_d=152
    mm and disc_t=2 mm are guesses. Please check against the datasheet; the box size
    depends on the diameter.'
  answer: null
- text: 'Perfboard thickness: I used 1.6 mm (guess).'
  answer: null
- text: Is trimming about 3.7 mm off the perfboard's ESP32 end, and narrowing its
    corners there, acceptable? Without it the port can't reach the outside of the
    wall.
  answer: null
- text: Only two corner bosses are modelled, at the far end; the near-end corners
    are trimmed. Check that the perfboard sits level on those two bosses.
  answer: null
- text: Which side of the ESP32 centreline is the USB port on (I placed it at +3.99
    mm)? Do the wall screws (9 mm heads, 60 mm apart, 80 mm above centre) suit your
    wall?
  answer: null
