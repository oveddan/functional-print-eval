parts:
- id: box
  role: final
  material: PLA matte white
  code: "import cadquery as cq\n\ndef build(p):\n    Ro = p.disc_d / 2.0\n    Ri =\
    \ Ro - p.wall\n    H = p.depth\n    T = p.front_t\n    ear = p.ear_len\n    ew\
    \ = p.ear_w / 2.0\n    outer = cq.Workplane('XY').circle(Ro).extrude(H)\n    outer\
    \ = outer.union(cq.Workplane('XY').center(ear / 2.0, 0).rect(ear, 2 * ew).extrude(H))\n\
    \    yc = -(p.tab_y0 + p.tab_y1) / 2.0\n    tl = p.tab_y1 - p.tab_y0\n    for\
    \ sx in (-p.key_sp / 2.0, p.key_sp / 2.0):\n        tab = cq.Workplane('XY').workplane(offset=H\
    \ - p.wall).center(sx, yc).rect(p.tab_w, tl).extrude(p.wall)\n        outer =\
    \ outer.union(tab)\n    inner = cq.Workplane('XY').workplane(offset=T).circle(Ri).extrude(H\
    \ - T + 1)\n    inner = inner.union(cq.Workplane('XY').workplane(offset=T).center((ear\
    \ - p.wall) / 2.0, 0).rect(ear - p.wall, 2 * (ew - p.wall)).extrude(H - T + 1))\n\
    \    body = outer.cut(inner)\n    for sy in (-1, 1):\n        yb = sy * p.perf_hole_y\n\
    \        body = body.union(cq.Workplane('XY').workplane(offset=T - 0.5).center(p.perf_hole_x,\
    \ yb).circle(p.boss_d / 2.0).extrude(p.boss_h + 0.5))\n        body = body.cut(cq.Workplane('XY').workplane(offset=T).center(p.perf_hole_x,\
    \ yb).circle(p.boss_hole_d / 2.0).extrude(p.boss_h + 0.1))\n    for sx in (-p.disc_hole_x,\
    \ p.disc_hole_x):\n        body = body.cut(cq.Workplane('XY').workplane(offset=-1).center(sx,\
    \ 0).circle(p.insert_hole_d / 2.0).extrude(T + 2))\n    for sx in (-p.key_sp /\
    \ 2.0, p.key_sp / 2.0):\n        body = body.cut(cq.Workplane('XY').workplane(offset=H\
    \ - p.wall - 1).center(sx, -p.key_y).circle(p.key_big / 2.0).extrude(p.wall +\
    \ 2))\n        body = body.cut(cq.Workplane('XY').workplane(offset=H - p.wall\
    \ - 1).center(sx, -(p.key_y - 5)).rect(p.key_slot, 10).extrude(p.wall + 2))\n\
    \    body = body.cut(cq.Workplane('XY').workplane(offset=T).center(0, -(Ro + Ri)\
    \ / 2.0).rect(p.notch_w, Ro - Ri + 4).extrude(6))\n    perf_top_use = H - T -\
    \ p.boss_h - p.perf_t\n    mouth_use = perf_top_use - p.port_centre_above_perf\n\
    \    z_win = H - mouth_use\n    body = body.cut(cq.Workplane('XY').workplane(offset=z_win\
    \ - p.usb_h / 2.0).center(ear - p.wall / 2.0, 0).rect(p.wall + 4, p.usb_w).extrude(p.usb_h))\n\
    \    return body\n"
  print_orientation: front face (the disc side) down on the bed, so z=0 is the outer
    face of the front plate and the open back is at the top
  use_orientation: back opening against the wall, front facing out, z=0 at the wall
