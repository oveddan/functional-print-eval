criteria: []
manual:
- n: '1'
  text: Print the box (matte white) with the front face on the bed. No supports.
  parts:
  - box
  hardware: []
  tool: null
- n: '2'
  text: Press a M3x4x5 heat-set insert into each of the two front-plate holes at 3
    and 9 o'clock, from the inside, until flush with the outer face.
  parts:
  - box
  hardware:
  - insert
  tool: null
- n: '3'
  text: Trim about 3.7 mm off the perfboard's ESP32 end (and narrow its corners there)
    so the USB port clears the wall. Mount the perfboard on the two far-end bosses
    with M2x6 self-tapping screws through the corner holes.
  parts:
  - box
  hardware:
  - m2_screw
  - perfboard
  tool: null
- n: '4'
  text: Run the four wires from the perfboard through the wire notch at the top of
    the box to the disc's 4-pin input.
  parts:
  - box
  hardware:
  - perfboard
  - led_disk
  tool: null
- n: '5'
  text: Hold the disc against the front face with its holes over the inserts. Fit
    two M3x8 socket screws through the disc into the inserts.
  parts:
  - box
  hardware:
  - disc_screw
  - led_disk
  tool: null
- n: '6'
  text: Hang the box on two wall screws (9 mm max heads, 60 mm apart) through the
    keyholes in the top tabs. Plug the USB-C charger into the ESP32 through the side
    window.
  parts:
  - box
  hardware:
  - esp32
  tool: null
