manual:
- n: '1'
  text: Print the box with the front plate flat on the bed, matte white PLA. No supports
    needed.
  parts:
  - box
  hardware: []
  tool: null
- n: '2'
  text: Press the two M3x4x5 heat-set inserts into the 4.3 mm holes on the outside
    of the front plate, at 16.75 mm either side of centre. Heat them with a soldering
    iron until they sink flush.
  parts:
  - box
  hardware:
  - insert
  tool: soldering iron
- n: '3'
  text: Fix the perfboard with the ESP32 to the four standoffs inside the box using
    the M2x6 self-tapping screws, driven from the ESP32 side. The ESP32 faces the
    open back (the wall). Check the USB-C port lines up with the wall opening at the
    lower edge.
  parts:
  - box
  hardware:
  - pb_screw
  - perfboard
  - esp32
  tool: screwdriver
- n: '4'
  text: Feed the four disc wires out through the 8 mm hole near the top of the front
    plate and lay them in the 6 mm channel running up to the edge. Connect the disc's
    4-pin connector to the perfboard wires.
  parts:
  - box
  hardware:
  - disc
  tool: null
- n: '5'
  text: Place the disc on the front plate, its holes over the inserts. Fit the two
    M3x6 socket screws through the disc holes and tighten into the inserts. Do not
    overtighten.
  parts:
  - box
  hardware:
  - disc
  - disc_screw
  tool: 2.5 mm hex key
- n: '6'
  text: Hang the box on the two wall screws through the keyholes at the top tab, sliding
    it down so the screw heads lock in the slots.
  parts:
  - box
  hardware: []
  tool: null
- n: '7'
  text: Plug the USB-C charger into the ESP32 port through the wall-side opening at
    the lower edge of the box.
  parts: []
  hardware:
  - esp32
  tool: null
