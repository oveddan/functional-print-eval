questions:
- text: Disc thickness (bare board, not counting LEDs) and whether anything sits on
    the disc's back face (connector, components). Affects the M3x6 screw length and
    clearance for the wires.
  answer: null
- text: Perfboard thickness, and whether the ESP32 sits centred across the perfboard's
    width (I assumed x=0).
  answer: null
- text: 'Wall screw spacing: I assumed the two wall screws are 40 mm apart horizontally,
    80 mm above the box centre. Please confirm, or give the spacing so I can move
    the keyholes.'
  answer: null
- text: Disc diameter is derived as about 241.6 mm from the hole-to-edge measurements.
    The box is only 150 mm, so the disc overhangs it by about 45 mm. Confirm that
    works for the later front and side pieces.
  answer: null
