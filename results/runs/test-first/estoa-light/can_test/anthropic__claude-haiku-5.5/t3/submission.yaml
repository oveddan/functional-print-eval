parts:
- id: box
  role: final
  material: PLA matte white
  code: "import cadquery as cq\n\ndef build(p):\n    R_out = p.box_od / 2.0\n    R_in\
    \ = R_out - p.wall_t\n    H = p.box_h\n    T = p.plate_t\n    body = cq.Workplane('XY').circle(R_out).extrude(H)\n\
    \    cav = cq.Workplane('XY').workplane(offset=T).circle(R_in).extrude(H - T +\
    \ 1.0)\n    box = body.cut(cav)\n    pb_front_use = p.pb_wall_face_z + p.pb_t\n\
    \    zs_top = H - pb_front_use\n    hx = p.pb_w / 2.0 - p.pb_hole_inset\n    hy\
    \ = p.pb_l / 2.0 - p.pb_hole_inset\n    corners = [(sx * hx, p.pb_cy + sy * hy)\
    \ for sx in (-1, 1) for sy in (-1, 1)]\n    for (x, y) in corners:\n        st\
    \ = cq.Workplane('XY').workplane(offset=T - 0.5).center(x, y).circle(p.standoff_d\
    \ / 2.0).extrude(zs_top - T + 0.5)\n        box = box.union(st)\n    for (x, y)\
    \ in corners:\n        pil = cq.Workplane('XY').workplane(offset=zs_top - 5.0).center(x,\
    \ y).circle(p.m2_pilot / 2.0).extrude(6.0)\n        box = box.cut(pil)\n    for\
    \ sx in (-1, 1):\n        ins = cq.Workplane('XY').workplane(offset=-1).center(sx\
    \ * p.disc_hole_x, 0).circle(p.insert_hole_d / 2.0).extrude(p.insert_depth + 1.0)\n\
    \        box = box.cut(ins)\n    wh = cq.Workplane('XY').workplane(offset=-1).center(0,\
    \ p.wire_y).circle(p.wire_hole_d / 2.0).extrude(T + 2.0)\n    box = box.cut(wh)\n\
    \    ch_len = R_out + 2.0 - p.wire_y\n    ch = cq.Workplane('XY').box(p.wire_w,\
    \ ch_len, 3.0).translate((0, p.wire_y + ch_len / 2.0, 0.5))\n    box = box.cut(ch)\n\
    \    port_use = p.pb_wall_face_z - (p.esp_pcb_under + p.esp_pcb_t + p.port_h /\
    \ 2.0)\n    zc = H - port_use\n    port = cq.Workplane('XY').box(p.port_clear_w,\
    \ p.wall_t + 6.0, p.port_clear_h).translate((0, -(R_out + R_in) / 2.0, zc))\n\
    \    box = box.cut(port)\n    tab_c_y = (p.tab_y0 + p.tab_y1) / 2.0\n    tab =\
    \ cq.Workplane('XY').box(2 * p.tab_half_w, p.tab_y1 - p.tab_y0, p.tab_t).translate((0,\
    \ tab_c_y, H - p.tab_t / 2.0))\n    box = box.union(tab)\n    for sx in (-1, 1):\n\
    \        x = sx * p.wall_screw_x\n        big = cq.Workplane('XY').workplane(offset=H\
    \ - p.tab_t - 1.0).center(x, p.wall_screw_y).circle(p.keyhole_big_d / 2.0).extrude(p.tab_t\
    \ + 2.0)\n        slot = cq.Workplane('XY').box(p.keyhole_slot_w, p.keyhole_slot_len,\
    \ p.tab_t + 2.0).translate((x, p.wall_screw_y - p.keyhole_slot_len / 2.0, H -\
    \ p.tab_t / 2.0))\n        box = box.cut(big).cut(slot)\n    return box\n"
  print_orientation: front plate (outside face, the disc side) flat on the bed
  use_orientation: open back against the wall, front plate facing out toward the viewer
    with the disc on it
