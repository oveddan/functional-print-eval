  check:
    method: measure
    ref: null
    description: Disc screws align with the front inserts
manual:
- n: '1'
  text: Print the shell with its front face down and the back plate with its wall
    face down, both in matte white PLA. Check the 4.3 mm insert holes and the 3.4
    mm counterbore clearance holes are open.
  parts:
  - shell
  - backplate
  hardware: []
  tool: null
- n: '2'
  text: Heat-set the two M3x4x5 inserts into the front plate holes at 3 and 9 o'clock,
    pressed in from inside the shell so they sit flush with the outside face.
  parts:
  - shell
  hardware:
  - insert_front
  tool: soldering iron with heat-set insert tip
- n: '3'
  text: Heat-set the four M3x4x5 inserts into the rim holes at the 45, 135, 225 and
    315 degree positions, from the open end.
  parts:
  - shell
  hardware:
  - insert_rim
  tool: soldering iron with heat-set insert tip
- n: '4'
  text: Stand the perfboard with the ESP32 on its top face on the four standoffs on
    the back plate, perfboard port end toward the bottom of the plate, and fix each
    corner with an M2x6 self-tapping screw.
  parts:
  - backplate
  hardware:
  - pb_screw
  - perfboard
  - esp32
  tool: screwdriver
- n: '5'
  text: Connect the four wires from the perfboard to the LED disc input connector.
    Route them out through the wire slot at the top of the shell.
  parts:
  - shell
  - backplate
  hardware:
  - led_disk
  tool: null
- n: '6'
  text: Lower the shell over the perfboard onto the back plate, so the USB-C tunnel
    lines up with the ESP32 port at the bottom. Pass the wires out through the top
    slot. Fix with four M3x8 socket screws from the wall side, through the counterbores,
    into the rim inserts.
  parts:
  - shell
  - backplate
  hardware:
  - back_screw
  - insert_rim
  tool: 2.5 mm hex key
- n: '7'
  text: Set the LED disc on the front plate, LED side out, with its two holes at 3
    and 9 o'clock over the front inserts and the input wires at 12 o'clock. Fix with
    two M3x6 socket screws from the LED side.
  parts:
  - shell
  hardware:
  - disc_screw
  - led_disk
  - insert_front
  tool: 2.5 mm hex key
- n: '8'
  text: 'Hang the box: fix two wall screws 60 mm apart with 3.5 mm standing out from
    the wall, then slide the keyhole slots of the back plate over them.'
  parts:
  - backplate
  hardware: []
  tool: null
- n: '9'
  text: Plug a USB-C charger into the ESP32 port through the tunnel opening at the
    bottom of the shell.
  parts:
  - shell
  - backplate
  hardware:
  - esp32
  tool: null
