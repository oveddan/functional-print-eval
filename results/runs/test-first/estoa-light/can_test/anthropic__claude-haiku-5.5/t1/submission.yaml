parts:
- id: shell
  role: final
  material: PLA matte white
  code: "def _box(x0,x1,y0,y1,z0,z1):\n    return cq.Workplane('XY').box(x1-x0, y1-y0,\
    \ z1-z0).translate(((x0+x1)/2,(y0+y1)/2,(z0+z1)/2))\n\ndef _cyl(x,y,z0,z1,d):\n\
    \    return cq.Workplane('XY').workplane(offset=z0).center(x,y).circle(d/2).extrude(z1-z0)\n\
    \ndef build(p):\n    import math\n    D=p.depth; zr=p.back_t; zf=D-p.front_t\n\
    \    pb_top = p.back_t + p.standoff_h + p.pb_t\n    port_z = pb_top + p.port_bot\
    \ + p.port_h/2\n    mouth_y = p.pb_yc - p.pb_len/2 + (p.esp_edge_in - p.port_to_edge)\n\
    \    s = cq.Workplane('XY').workplane(offset=zr).circle(p.shell_ro).extrude(D-zr)\n\
    \    s = s.cut(cq.Workplane('XY').workplane(offset=zr-1).circle(p.shell_ri).extrude(zf-zr+1))\n\
    \    px = p.port_off\n    s = s.union(_box(px-7.5, px+7.5, mouth_y-9, mouth_y,\
    \ port_z-3.75, port_z+3.75))\n    s = s.cut(_box(px-6, px+6, mouth_y-20, mouth_y,\
    \ port_z-2.25, port_z+2.25))\n    for x in (-p.disc_hole_c/2, p.disc_hole_c/2):\n\
    \        s = s.cut(_cyl(x,0,zf-1,D+1,p.insert_hole))\n    for a in (45,135,225,315):\n\
    \        r=p.cbore_r\n        s = s.cut(_cyl(r*math.cos(math.radians(a)), r*math.sin(math.radians(a)),\
    \ zr-0.5, zr+4, p.insert_hole))\n    s = s.cut(_box(-p.wire_w/2, p.wire_w/2, 98,\
    \ p.shell_ro+1, 27, D+1))\n    return s.rotate((0,0,0),(1,0,0),180).translate((0,0,D))\n"
  print_orientation: front (disc-facing) outer face down on the bed; the shell's open
    end points up
  use_orientation: front plate toward the LED disc (+z), open end down onto the back
    plate at the wall
- id: backplate
  role: final
  material: PLA matte white
  code: "def _box(x0,x1,y0,y1,z0,z1):\n    return cq.Workplane('XY').box(x1-x0, y1-y0,\
    \ z1-z0).translate(((x0+x1)/2,(y0+y1)/2,(z0+z1)/2))\n\ndef _cyl(x,y,z0,z1,d):\n\
    \    return cq.Workplane('XY').workplane(offset=z0).center(x,y).circle(d/2).extrude(z1-z0)\n\
    \ndef build(p):\n    import math\n    th=p.back_t; sh=p.standoff_h\n    yk=p.key_y;\
    \ ys=p.key_slot_end; hs=p.screw_spacing/2\n    plate = cq.Workplane('XY').circle(p.shell_ro).extrude(th)\n\
    \    for sx in (-1,1):\n        xc = sx*hs\n        plate = plate.union(_box(xc-9,\
    \ xc+9, 100, yk, 0, p.ear_t)).union(_cyl(xc,yk,0,p.ear_t,18))\n    cx = p.pb_w/2\
    \ - (p.pb_hole_edge + p.pb_hole_d/2)\n    cy = p.pb_len/2 - (p.pb_hole_edge +\
    \ p.pb_hole_d/2)\n    for x in (-cx, cx):\n        for y in (p.pb_yc-cy, p.pb_yc+cy):\n\
    \            plate = plate.union(_cyl(x,y,th,th+sh,p.standoff_od))\n         \
    \   plate = plate.cut(_cyl(x,y,th,th+sh,p.standoff_pilot))\n    for a in (45,135,225,315):\n\
    \        r=p.cbore_r\n        x=r*math.cos(math.radians(a)); y=r*math.sin(math.radians(a))\n\
    \        plate = plate.cut(_cyl(x,y,-1,3,p.m3_head_d)).cut(_cyl(x,y,-1,th+1,p.m3_clear))\n\
    \    for sx in (-1,1):\n        xc = sx*hs\n        plate = plate.cut(_cyl(xc,yk,-1,p.ear_t+1,p.key_large))\n\
    \        plate = plate.cut(_box(xc-p.key_slot/2, xc+p.key_slot/2, ys, yk, -1,\
    \ p.ear_t+1))\n    return plate\n"
  print_orientation: wall face (z=0) down on the bed
  use_orientation: wall face at z=0 against the wall, standoffs and perfboard toward
    +z
