questions:
- text: Is the ESP32 centred across the 50 mm width of the perfboard? I assumed yes,
    which puts its port 3.99 mm to one side of the box's centreline.
  answer: assumed yes
- text: What are the disc's and perfboard's thicknesses? I guessed 1.6 mm for both;
    the screw lengths and standoff heights depend on them.
  answer: guessed 1.6 mm each
- text: The ESP32 measurements (63.17 mm long, 7.53 mm from the perfboard edge) add
    to about 70.7 mm, 0.7 mm more than the 70 mm perfboard. Does the far end of the
    ESP32 overhang the board?
  answer: null
- text: Please confirm the 90 mm spacing between the two wall screws, and that a 238
    mm box under a 241.6 mm disc is fine on a 256 mm bed.
  answer: null
