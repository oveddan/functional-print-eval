manual:
- n: '1'
  text: Print the box in matte white PLA, back plate on the bed. No supports needed.
  parts:
  - box
  hardware: []
  tool: null
- n: '2'
  text: Heat-set the two M3x4x5 inserts into the two holes in the top bar of the box,
    from the front opening (at x = +/-16.75 mm, matching the disc holes).
  parts:
  - box
  hardware:
  - insert
  tool: soldering iron with heat-set tip
- n: '3'
  text: Fasten the perfboard (with the ESP32 plugged in and its four wires) to the
    four corner bosses with the four M2x6 self-tapping screws. The ESP32's USB-C port
    points toward the side of the box with the cut-out.
  parts:
  - box
  hardware:
  - perfboard
  - esp32
  - perf_screw
  tool: screwdriver
- n: '4'
  text: Route the four wires from the perfboard up through the notch at the top of
    the rim, and lay the disc's input wires out through the same notch.
  parts:
  - box
  hardware:
  - perfboard
  - disc
  tool: null
- n: '5'
  text: Set the disc (own LED disc) on the rim with its input wires at 12 o'clock,
    so its two mounting holes line up with the box's inserts at 3 and 9 o'clock.
  parts:
  - box
  hardware:
  - disc
  tool: null
- n: '6'
  text: Drive the two M3x8 socket head screws through the disc holes into the inserts.
  parts:
  - box
  hardware:
  - disc_screw
  - disc
  - insert
  tool: 2.5 mm hex key
- n: '7'
  text: 'Hang the box on your two #8 round-head wall screws, 90 mm apart, through
    the two keyholes at the top of the back plate. Put the screws in first so the
    heads stand about 3 mm off the wall.'
  parts:
  - box
  hardware: []
  tool: null
- n: '8'
  text: Plug the USB-C charger straight into the ESP32's port through the side slot
    in the box wall, at about the height of the perfboard's top plus 14 mm.
  parts: []
  hardware:
  - esp32
  tool: null
