parts:
- id: box
  role: final
  material: PLA matte white
  code: "import cadquery as cq\n\ndef build(p):\n    R = p.box_od / 2.0\n    H = p.depth\n\
    \    B = p.back_t\n    W = p.wall_t\n    body = cq.Workplane('XY').circle(R).extrude(H)\n\
    \    cav = cq.Workplane('XY').workplane(offset=B).circle(R - W).extrude(H)\n \
    \   cup = body.cut(cav)\n    xc = p.perf_xc\n    dx = p.perf_L / 2 - p.perf_hole_edge\
    \ - p.perf_hole_d / 2\n    dy = p.perf_W / 2 - p.perf_hole_edge - p.perf_hole_d\
    \ / 2\n    pts = [(xc + sx * dx, sy * dy) for sx in (-1, 1) for sy in (-1, 1)]\n\
    \    h_b = p.perf_z - B\n    bosses = cq.Workplane('XY').workplane(offset=B -\
    \ 0.01).pushPoints(pts).circle(p.boss_od / 2).extrude(h_b + 0.01)\n    cup = cup.union(bosses)\n\
    \    pilots = cq.Workplane('XY').workplane(offset=B).pushPoints(pts).circle(p.boss_hole_d\
    \ / 2).extrude(h_b)\n    cup = cup.cut(pilots)\n    post = cq.Workplane('XY').box(8,\
    \ 8, H - B, centered=(True, True, False)).translate((0, 0, B))\n    bar = cq.Workplane('XY').box(2\
    \ * p.bar_half, 8, p.bar_t, centered=(True, True, False)).translate((0, 0, H -\
    \ p.bar_t))\n    cup = cup.union(post).union(bar)\n    ins = cq.Workplane('XY').workplane(offset=H\
    \ - p.insert_L).pushPoints([(-p.disc_hole_x, 0), (p.disc_hole_x, 0)]).circle(p.insert_hole_d\
    \ / 2).extrude(p.insert_L + 1)\n    cup = cup.cut(ins)\n    notch = cq.Workplane('XY').box(12,\
    \ 12, 6, centered=(True, False, False)).translate((0, R - W - 3, H - 4))\n   \
    \ cup = cup.cut(notch)\n    port_z = p.perf_z + p.perf_t + p.esp_port_bottom +\
    \ p.port_h / 2\n    xw = xc + p.perf_L / 2 + 2 + 6.5\n    hole = cq.Workplane('XY').box(13,\
    \ p.port_slot_w, p.port_slot_h).translate((xw, p.port_y, port_z))\n    cup = cup.cut(hole)\n\
    \    for kx in (-p.hang_x, p.hang_x):\n        circ = cq.Workplane('XY').workplane(offset=-1).center(kx,\
    \ p.hang_y).circle(p.key_head_d / 2).extrude(B + 2)\n        slot = cq.Workplane('XY').workplane(offset=-1).center(kx,\
    \ p.hang_y - p.key_slot_len / 2).rect(p.key_slot_w, p.key_slot_len).extrude(B\
    \ + 2)\n        cup = cup.cut(circ).cut(slot)\n    return cup\n"
  print_orientation: back plate face (wall side) on the bed, opening facing up
  use_orientation: back plate flat against the wall, opening facing out toward the
    disc
