task: estoa-light
note: 'Front and sides (transparent) are not included. Box OD is 166 mm, 2 mm under
  the 168 mm disc (derived from the two hole-to-rim readings). The USB window is in
  the wall at the bottom, 30 x 15.5 mm, and the transparent sides will need a matching
  opening. Guessed or unmeasured: disc thickness (1.6), perfboard thickness (1.6),
  solder protrusion (2.5), USB plug body size, disc connector position and height,
  wall screw shank diameter, which of the two ESP32 ports is used and which way the
  ESP32 is offset on the perfboard (assumed offset toward +x of the perfboard, columns
  increasing with +x). Disc hole pitch 33.5 mm assumes the 30.2 mm reading was between
  the facing hole edges. The print test returned no results, so none of these are
  verified. Wire relief and slot positions are generous because the disc connector
  position is unknown.'
questions:
- text: Which USB-C port on the ESP32 do you use, and does the ESP32 sit toward the
    side of the perfboard with columns 8 to 18 as the higher-numbered columns on the
    left or right when the USB end faces you?
  answer: null
- text: How wide and thick is the plastic body of the charger plug where it meets
    the port? The window is 30 x 15.5 mm as a guess.
  answer: null
- text: Where is the disc's input connector (distance from the centre toward 12 o'clock)
    and how tall is it? The relief channel is 16 mm wide, 2.5 mm deep from 8 to 72
    mm.
  answer: null
