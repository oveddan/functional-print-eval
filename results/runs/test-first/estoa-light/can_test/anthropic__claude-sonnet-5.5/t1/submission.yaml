parts:
- id: box
  role: final
  material: PLA, matte white
  code: "import math\n\ndef build(p):\n    R = p.box_od / 2.0\n    Ri = R - p.wall\n\
    \    H = p.box_h\n    pt = p.plate_t\n\n    def cyl(x, y, z0, d, h):\n       \
    \ return cq.Workplane('XY').workplane(offset=z0).center(x, y).circle(d / 2.0).extrude(h)\n\
    \n    def rect(cx, cy, w, l, z0, h):\n        return cq.Workplane('XY').workplane(offset=z0).center(cx,\
    \ cy).rect(w, l).extrude(h)\n\n    body = cq.Workplane('XY').circle(R).extrude(H)\n\
    \    body = body.cut(cyl(0, 0, pt, 2 * Ri, H))\n\n    lid_pts = [(p.lid_boss_r\
    \ * math.cos(math.radians(a)), p.lid_boss_r * math.sin(math.radians(a))) for a\
    \ in (45, 135, 225, 315)]\n    for (x, y) in lid_pts:\n        body = body.union(cyl(x,\
    \ y, pt - 0.01, p.lid_boss_d, H - pt + 0.01))\n\n    hp = p.disc_hole_pitch /\
    \ 2.0\n    for x in (-hp, hp):\n        body = body.union(cyl(x, 0, pt - 0.01,\
    \ p.disc_boss_d, p.disc_boss_h + 0.01))\n\n    ix = p.pb_w / 2.0 - (p.pb_hole_edge\
    \ + p.pb_hole_d / 2.0)\n    iy = p.pb_l / 2.0 - (p.pb_hole_edge + p.pb_hole_d\
    \ / 2.0)\n    sp = []\n    for sx in (-1, 1):\n        for sy in (-1, 1):\n  \
    \          sp.append((sx * ix, p.pb_yc + sy * iy))\n    for (x, y) in sp:\n  \
    \      body = body.union(cyl(x, y, pt - 0.01, p.standoff_d, p.standoff_h + 0.01))\n\
    \n    # front relief and wire slot (cut after bosses so nothing refills them)\n\
    \    pl = p.pocket_y1 - p.pocket_y0\n    body = body.cut(rect(0, (p.pocket_y0\
    \ + p.pocket_y1) / 2.0, p.pocket_w, pl, -0.01, p.pocket_d + 0.01))\n    sl = p.slot_y1\
    \ - p.slot_y0\n    body = body.cut(rect(0, (p.slot_y0 + p.slot_y1) / 2.0, p.slot_w,\
    \ sl, -0.01, pt + 0.02))\n\n    # disc screw holes: M3 clearance through the plate,\
    \ insert hole in the boss\n    for x in (-hp, hp):\n        body = body.cut(cyl(x,\
    \ 0, -0.01, 3.0 + p.m3_clear + (p.disc_hole_d - 3.0) * 0 + 0.3, pt + 0.02))\n\
    \        body = body.cut(cyl(x, 0, pt, p.insert_hole_d, p.disc_boss_h + 0.01))\n\
    \n    # lid insert holes\n    for (x, y) in lid_pts:\n        body = body.cut(cyl(x,\
    \ y, H - p.lid_insert_depth, p.insert_hole_d, p.lid_insert_depth + 0.01))\n\n\
    \    # M2 pilot holes\n    for (x, y) in sp:\n        body = body.cut(cyl(x, y,\
    \ pt + p.standoff_h - p.pilot_depth, p.pilot_d, p.pilot_depth + 0.01))\n\n   \
    \ # USB plug window in the wall at the bottom (-y)\n    zc = pt + p.standoff_h\
    \ + p.pb_t + p.port_bottom + p.port_h / 2.0\n    z0 = zc - p.window_h / 2.0\n\
    \    body = body.cut(rect(p.esp_shift, -(R + Ri) / 2.0 - 2.0, p.window_w, (R -\
    \ Ri) + 14.0 + 4.0, z0, p.window_h))\n    return body\n"
  print_orientation: front face (the face the disc sits on) flat on the bed, open
    back facing up
  use_orientation: front face toward the viewer, open end toward the wall, USB window
    at the bottom
- id: lid
  role: final
  material: PLA, matte white
  code: "import math\n\ndef build(p):\n    R = p.box_od / 2.0\n    t = p.lid_t\n\n\
    \    def cyl(x, y, z0, d, h):\n        return cq.Workplane('XY').workplane(offset=z0).center(x,\
    \ y).circle(d / 2.0).extrude(h)\n\n    lid = cq.Workplane('XY').circle(R).extrude(t)\n\
    \    pts = [(p.lid_boss_r * math.cos(math.radians(a)), p.lid_boss_r * math.sin(math.radians(a)))\
    \ for a in (45, 135, 225, 315)]\n    for (x, y) in pts:\n        lid = lid.cut(cyl(x,\
    \ y, -0.01, 3.0 + p.m3_clear + 0.3, t + 0.02))\n        lid = lid.cut(cyl(x, y,\
    \ -0.01, p.m3_head_d + 0.6, p.m3_head_h + 0.3 + 0.01))\n\n    big = p.wall_screw_head_d\
    \ + p.keyhole_clr\n    sw = p.wall_screw_shank_d + 0.6\n    for sx in (-1, 1):\n\
    \        x = sx * p.wall_screw_spacing / 2.0\n        lid = lid.cut(cyl(x, 0,\
    \ -0.01, big, t + 0.02))\n        lid = lid.cut(cq.Workplane('XY').workplane(offset=-0.01).center(x,\
    \ p.keyhole_slot_len / 2.0).rect(sw, p.keyhole_slot_len).extrude(t + 0.02))\n\
    \        lid = lid.cut(cyl(x, p.keyhole_slot_len, -0.01, sw, t + 0.02))\n    return\
    \ lid\n"
  print_orientation: wall face (the face that goes against the wall) flat on the bed
  use_orientation: flat against the wall; long slots of the keyholes point up
