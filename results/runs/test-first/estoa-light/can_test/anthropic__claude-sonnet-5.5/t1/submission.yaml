manual:
- n: '1'
  text: Print the box (front face on the bed, matte white) and the lid (wall face
    on the bed). No supports.
  parts:
  - box
  - lid
  hardware: []
  tool: null
- n: '2'
  text: 'With a soldering iron, press the six M3 heat-set inserts in flush: two into
    the holes in the two bosses behind the front plate, four into the holes in the
    tall bosses at the open rim of the box. Press them in straight.'
  parts:
  - box
  hardware:
  - ins
  tool: soldering iron
- n: '3'
  text: Put the perfboard on the four standoffs with the ESP32 facing up (toward the
    open end) and the USB port end toward the window in the wall. The window is at
    the bottom; the ESP32 must be on the side nearer the window's centre. Secure it
    with four M2x6 self-tapping screws. If you can't reach the screw under the ESP32,
    unplug the ESP32 from its headers first and plug it back after.
  parts:
  - box
  hardware:
  - pcb
  - esp
  - m2
  tool: small Phillips screwdriver
- n: '4'
  text: Feed the four wires from the perfboard up through the long slot in the front
    plate, so they show in the relief channel on the front face.
  parts:
  - box
  hardware:
  - pcb
  tool: null
- n: '5'
  text: Lay the LED disc on the front face with its wires at 12 o'clock, plug in the
    connector, with the connector and wires lying in the relief. Fasten with two M3x12
    screws through the disc's two holes into the inserts. Stop when snug.
  parts:
  - box
  hardware:
  - disc
  - m3_disc
  tool: 2.5 mm hex key
- n: '6'
  text: Close the back with the lid, keyholes up and the counterbores facing away
    from the box. Fasten with four M3x8 screws into the rim inserts. Check the wires
    aren't trapped.
  parts:
  - lid
  - box
  hardware:
  - m3_lid
  tool: 2.5 mm hex key
- n: '7'
  text: 'On the wall, mark two points level with each other 100 mm apart, fit the
    #8 screws in their anchors so the heads stand about 6 to 7 mm off the wall, then
    push the back over the heads and slide the box down so the screws sit in the tops
    of the slots.'
  parts:
  - lid
  hardware: []
  tool: null
- n: '8'
  text: Plug the USB-C charger into the ESP32 port through the window at the bottom.
  parts:
  - box
  hardware:
  - esp
  tool: null
