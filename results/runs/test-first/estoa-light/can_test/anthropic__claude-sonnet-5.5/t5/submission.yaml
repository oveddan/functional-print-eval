parts:
- id: box-front
  role: final
  material: matte white PLA
  code: "import math\ndef build(p):\n    R_in = p.box_r_in\n    R_out = R_in + p.wall\n\
    \    H = p.plate_t + p.cavity_d\n    body = cq.Workplane('XY').circle(R_out).extrude(H)\n\
    \    body = body.cut(cq.Workplane('XY').workplane(offset=p.plate_t).circle(R_in).extrude(p.cavity_d))\n\
    \    pitch = p.disc_hole_gap + p.disc_hole_d\n    boss_top = p.m3_len - p.disc_t\n\
    \    boss_pts = [(-pitch/2, 0), (pitch/2, 0)]\n    body = body.union(cq.Workplane('XY').workplane(offset=p.plate_t\
    \ - 0.1).pushPoints(boss_pts).circle(p.boss_d/2).extrude(boss_top - p.plate_t\
    \ + 0.1))\n    l = p.lug_r/math.sqrt(2)\n    lug_pts = [(sx*l, sy*l) for sx in\
    \ (-1, 1) for sy in (-1, 1)]\n    body = body.union(cq.Workplane('XY').workplane(offset=p.plate_t\
    \ - 0.1).pushPoints(lug_pts).circle(p.lug_d/2).extrude(p.cavity_d + 0.1))\n  \
    \  hx = p.perf_w/2 - p.perf_hole_edge - p.perf_hole_d/2\n    hy = p.perf_l/2 -\
    \ p.perf_hole_edge - p.perf_hole_d/2\n    so_pts = [(sx*hx, p.perf_y + sy*hy)\
    \ for sx in (-1, 1) for sy in (-1, 1)]\n    body = body.union(cq.Workplane('XY').workplane(offset=p.plate_t\
    \ - 0.1).pushPoints(so_pts).circle(p.standoff_d/2).extrude(p.standoff_h + 0.1))\n\
    \    # disc screw holes: clearance through the skin, insert pocket from the boss\
    \ top\n    body = body.cut(cq.Workplane('XY').pushPoints(boss_pts).circle(p.m3_clear/2).extrude(boss_top\
    \ - p.insert_len + 0.1))\n    body = body.cut(cq.Workplane('XY').workplane(offset=boss_top\
    \ - p.insert_len).pushPoints(boss_pts).circle(p.insert_hole_d/2).extrude(p.insert_len\
    \ + 0.01))\n    # cover lugs: insert pocket + tip relief\n    body = body.cut(cq.Workplane('XY').workplane(offset=H\
    \ - p.insert_len).pushPoints(lug_pts).circle(p.insert_hole_d/2).extrude(p.insert_len\
    \ + 0.01))\n    body = body.cut(cq.Workplane('XY').workplane(offset=H - p.insert_len\
    \ - 3).pushPoints(lug_pts).circle(1.6).extrude(3.1))\n    # perfboard standoff\
    \ pilot holes\n    pil = p.m2_len - p.perf_t + 1.0\n    top = p.plate_t + p.standoff_h\n\
    \    body = body.cut(cq.Workplane('XY').workplane(offset=top - pil).pushPoints(so_pts).circle(p.m2_pilot/2).extrude(pil\
    \ + 0.01))\n    # wire / connector slot in the front plate\n    body = body.cut(cq.Workplane('XY').box(p.slot_w,\
    \ p.slot_y1 - p.slot_y0, p.plate_t + 0.2, centered=(True, False, False)).translate((0,\
    \ p.slot_y0, -0.1)))\n    # USB plug window in the rim at the bottom (-y)\n  \
    \  zc = p.plate_t + p.standoff_h + p.perf_t + p.usb_bottom + p.usb_h/2\n    body\
    \ = body.cut(cq.Workplane('XY').box(p.win_w, 14, p.win_h, centered=(True, False,\
    \ False)).translate((0, -(R_in - 6) - 14 - 0, zc - p.win_h/2)))\n    return body\n"
  print_orientation: front face (the face the LED disc touches) flat on the bed; the
    cup opens upwards
  use_orientation: front face towards the viewer, open side towards the wall, USB
    window at the bottom, wire slot at the top
- id: box-cover
  role: final
  material: matte white PLA
  code: "import math\ndef build(p):\n    R_out = p.box_r_in + p.wall\n    t = p.cover_t\n\
    \    c = cq.Workplane('XY').circle(R_out).extrude(t)\n    l = p.lug_r/math.sqrt(2)\n\
    \    pts = [(sx*l, sy*l) for sx in (-1, 1) for sy in (-1, 1)]\n    c = c.cut(cq.Workplane('XY').pushPoints(pts).circle(p.m3_clear/2).extrude(t))\n\
    \    c = c.cut(cq.Workplane('XY').pushPoints(pts).circle(p.m3_head_d/2 + 0.5).extrude(p.m3_head_h\
    \ + 0.2))\n    slot_d = p.wall_shank_d + 0.8\n    entry_d = p.wall_head_d + 1.5\n\
    \    for sx in (-1, 1):\n        x = sx*p.hang_x\n        c = c.cut(cq.Workplane('XY').center(x,\
    \ p.hang_y - p.hang_slot/2).slot2D(p.hang_slot + slot_d, slot_d, 90).extrude(t))\n\
    \        c = c.cut(cq.Workplane('XY').center(x, p.hang_y - p.hang_slot).circle(entry_d/2).extrude(t))\n\
    \    return c\n"
  print_orientation: wall face flat on the bed
  use_orientation: wall face against the wall, closing the open back of box-front
