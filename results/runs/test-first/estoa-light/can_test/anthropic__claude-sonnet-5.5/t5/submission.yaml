task: estoa-light
note: 'Several key values were not measured and are assumed (see the params): disc
  thickness 1.6 mm, perfboard thickness 1.6 mm, disc diameter about 168 mm (not used
  by the box), the connector position on the back of the disc (hence a long 14 mm
  slot), solder-joint height (about 4 mm clearance under the board), the charger plug
  size (window 40 x 10 mm), which side of the ESP32 the port is on, and the M2 pilot
  size. The two test coupons came back without results, so the 33.5 mm disc hole pitch
  (from the 30.2 mm inner-edge reading + 3.3) and the 1.8 mm pilot are unconfirmed.
  Check the disc against the front plate first, and ask for a re-print of the bosses
  if they don''t line up. The box is about 109 mm in diameter and 38 mm deep, smaller
  than the disc. The front plate holds the disc; the transparent front and sides can
  attach later.'
