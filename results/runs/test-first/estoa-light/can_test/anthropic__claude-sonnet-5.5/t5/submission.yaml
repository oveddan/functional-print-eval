manual:
- n: '1'
  text: Print box-front with its flat front face on the bed, and box-cover with its
    wall face on the bed, both in matte white PLA, no supports.
  parts:
  - box-front
  - box-cover
  hardware: []
  tool: null
- n: '2'
  text: 'With a soldering iron, press 6 heat-set inserts in from the open side of
    box-front, flush with the surface: one in each of the two round bosses behind
    the front plate (the pockets at 33.5 mm spacing), and one in the end of each of
    the four tall corner lugs.'
  parts:
  - box-front
  hardware:
  - insert
  tool: soldering iron
- n: '3'
  text: Put the box-front face-down on a soft surface. Lay the LED disc on it LEDs-down,
    wires at the top, same side as the long slot. Pass the 4-pin connector and wires
    through the slot to the back. Screw the disc on with 2 M3x8 screws through its
    two holes into the inserts. Don't overtighten.
  parts:
  - box-front
  hardware:
  - disc
  - m3-disc
  tool: 2.5 mm hex key
- n: '4'
  text: Unplug the ESP32 from the perfboard headers. Lay the perfboard on the four
    standoffs with the ESP32 header side facing away from the front plate, and the
    end where the USB-C port will be at the bottom (the window side). Fix it with
    4 M2x6 self-tapping screws. Plug the ESP32 back in and connect the disc wires.
    Check that the USB-C port faces the window.
  parts:
  - box-front
  hardware:
  - perfboard
  - esp32
  - m2
  tool: small Phillips screwdriver
- n: '5'
  text: Mount the two wall screws level, 34 mm apart horizontally, so that the underside
    of each head stands about 5.5 mm out of the wall.
  parts: []
  hardware: []
  tool: null
- n: '6'
  text: Place box-cover on the open back of box-front, with its keyhole slots at the
    top, and fix it with 4 M3x8 screws sunk into its pockets.
  parts:
  - box-cover
  - box-front
  hardware:
  - m3-cover
  tool: 2.5 mm hex key
- n: '7'
  text: Push the large keyhole holes over the wall screw heads, then slide the box
    down so the shanks sit at the top of the slots. Plug the USB-C charger through
    the window at the bottom into the ESP32.
  parts: []
  hardware: []
  tool: null
