manual:
- n: '1'
  text: Print box-tray front face down (open side up) and back-plate wall face down,
    both in matte white PLA, no supports.
  parts:
  - box-tray
  - back-plate
  hardware: []
  tool: 3D printer
- n: '2'
  text: 'Heat-set the six M3x4x5 inserts: two into the pockets on the inside of the
    tray''s front plate (at the 3 and 9 o''clock positions, on the centre line), and
    four into the holes in the top of the tray''s side walls. Push each in square
    until flush.'
  parts:
  - box-tray
  hardware:
  - insert
  tool: soldering iron with insert tip
- n: '3'
  text: Lay the LED disc on the front face of the tray, LED side facing out, input
    wires at 12 o'clock (the end with the wire window). Feed the disc's wire connector
    through the window. Screw it down with two M3x8 screws through its two holes into
    the inserts. Do not overtighten.
  parts:
  - box-tray
  hardware:
  - led-disk
  - m3_disc
  tool: 2.5 mm hex key
- n: '4'
  text: Orient the perfboard with the ESP32 side facing the open back and the USB-C
    port end towards the notch in the wall (6 o'clock). Connect the four wires through
    the window, then fix the perfboard to the four posts with M2x6 self-tapping screws
    through its corner holes.
  parts:
  - box-tray
  hardware:
  - perfboard
  - esp32
  - m2
  tool: small screwdriver
- n: '5'
  text: 'Close the box: put the back plate on the open side (keyhole slots running
    towards 12 o''clock) and fasten it with four M3x12 screws from the wall side,
    into the counterbores. The screw heads end up flush.'
  parts:
  - back-plate
  - box-tray
  hardware:
  - m3_back
  tool: 2.5 mm hex key
- n: '6'
  text: 'On the wall, mark two points level with each other, 40 mm apart. Fit the
    #8 screws with anchors so that the underside of each head stands about 3.5 to
    4 mm off the wall (the keyhole lip is 2.5 mm thick).'
  parts: []
  hardware: []
  tool: drill, screwdriver
- n: '7'
  text: Hold the box with the notch at the bottom, slip the screw heads into the large
    holes of the keyholes (the lower ones), then let the box slide down so the screws
    sit at the top of the slots.
  parts:
  - back-plate
  hardware: []
  tool: null
- n: '8'
  text: Plug the charger's USB-C plug into the ESP32 port through the notch at the
    bottom of the box.
  parts: []
  hardware: []
  tool: null
