task: estoa-light
note: 'Box is 69 x 89 mm and 42.6 mm deep, so it sits entirely behind the 241.6 mm
  disc (diameter worked out from the hole-to-edge readings). Only the tray and the
  back plate are made; the front and sides come later, and the sides will need a hole
  at 6 o''clock for the USB cable. Guessed values to check: disc board thickness (1.6),
  where its connector sits (the 20 x 32 mm through-window at 12 o''clock is a guess;
  it replaced a recess on the front face that printed badly in the coupon), perfboard
  thickness (1.6), USB port height (14.3 above the perfboard) and plug size (12 mm
  tall, 48 mm wide opening so either port works whichever side the ESP32 is on). The
  keyhole coupon result was not reported, so the keyholes are untested. The wall screw
  heads must stand about 3.5-4 mm off the wall. The ESP32 placement in the assembly
  assumes it sits at +x, which is a guess.'
questions:
- text: Which side of the perfboard is the ESP32 on, and where is the connector/pads
    on the back of the disc (distance from centre at 12 o'clock)?
  answer: null
- text: How thick is the disc board, and how big is the plug on your USB-C cable?
  answer: null
