parts:
- id: box-tray
  role: final
  material: PLA matte white
  code: "def build(p):\n    iw = p.perf_w + 2*p.perf_clear\n    il = p.perf_l + 2*p.perf_clear\n\
    \    W = iw + 2*p.wall_t\n    L = il + 2*p.wall_t\n    int_d = p.standoff_h +\
    \ p.perf_t + p.esp_h + p.top_clear\n    rim = p.front_t + int_d\n    body = cq.Workplane('XY').box(W,\
    \ L, rim, centered=(True, True, False)).edges('|Z').fillet(p.corner_r)\n    body\
    \ = body.cut(cq.Workplane('XY').workplane(offset=p.front_t).rect(iw, il).extrude(int_d\
    \ + 1))\n    # perfboard posts with M2 pilot holes\n    px = p.perf_w/2 - p.perf_hole_edge\
    \ - p.perf_hole_d/2\n    py = p.perf_l/2 - p.perf_hole_edge - p.perf_hole_d/2\n\
    \    for sx in (-1, 1):\n        for sy in (-1, 1):\n            post = cq.Workplane('XY').workplane(offset=p.front_t\
    \ - 0.5).center(sx*px, sy*py).circle(p.post_d/2).extrude(p.standoff_h + 0.5)\n\
    \            body = body.union(post)\n            pil = cq.Workplane('XY').workplane(offset=p.front_t\
    \ + p.standoff_h - p.pilot_depth).center(sx*px, sy*py).circle(p.m2_pilot/2).extrude(p.pilot_depth\
    \ + 1)\n            body = body.cut(pil)\n    # heat-set insert pockets for the\
    \ disc screws (pressed in from inside) + clearance holes\n    pitch = p.disc_hole_gap\
    \ + p.disc_hole_d\n    ih = p.insert_len + 0.5\n    for sx in (-1, 1):\n     \
    \   body = body.cut(cq.Workplane('XY').workplane(offset=p.front_t - ih).center(sx*pitch/2,\
    \ 0).circle(p.insert_hole_d/2).extrude(ih + 0.1))\n        body = body.cut(cq.Workplane('XY').workplane(offset=-0.1).center(sx*pitch/2,\
    \ 0).circle(p.m3_clear/2).extrude(p.front_t - ih + 0.2))\n    # through window\
    \ for wires / connector at 12 o'clock\n    win = cq.Workplane('XY').box(p.window_w,\
    \ p.window_y1 - p.window_y0, p.front_t + 0.2, centered=(True, False, False)).translate((0,\
    \ p.window_y0, -0.1))\n    body = body.cut(win)\n    # insert holes in the rim\
    \ for the back plate screws\n    for sx in (-1, 1):\n        for sy in (-1, 1):\n\
    \            x = sx*(iw/2 + p.wall_t/2)\n            y = sy*p.back_screw_y\n \
    \           body = body.cut(cq.Workplane('XY').workplane(offset=rim - (p.insert_len\
    \ + 1)).center(x, y).circle(p.insert_hole_d/2).extrude(p.insert_len + 1.1))\n\
    \    # USB-C notch in the end wall at -y, open to the rim\n    port_z = p.front_t\
    \ + p.standoff_h + p.perf_t + p.port_h_above_board\n    nz0 = port_z - p.plug_slot_h/2\n\
    \    notch = cq.Workplane('XY').box(p.port_notch_w, p.wall_t + 1.2, rim - nz0\
    \ + 1, centered=(True, False, False)).translate((0, -(il/2) - p.wall_t - 1, nz0))\n\
    \    body = body.cut(notch)\n    return body\n"
  print_orientation: front face (the face the LED disc sits on) on the bed, open side
    up
  use_orientation: front face towards the viewer, open side towards the wall, USB
    notch at the bottom
- id: back-plate
  role: final
  material: PLA matte white
  code: "def build(p):\n    iw = p.perf_w + 2*p.perf_clear\n    il = p.perf_l + 2*p.perf_clear\n\
    \    W = iw + 2*p.wall_t\n    L = il + 2*p.wall_t\n    plate = cq.Workplane('XY').box(W,\
    \ L, p.back_t, centered=(True, True, False)).edges('|Z').fillet(p.corner_r)\n\
    \    pd = p.wall_screw_head_d + 2*p.hang_clear\n    sw = p.wall_screw_shank_d\
    \ + 0.8\n    y0, y1 = p.hang_y0, p.hang_y1\n    for sx in (-1, 1):\n        x\
    \ = sx*p.hang_x\n        plate = plate.cut(cq.Workplane('XY').workplane(offset=-0.1).center(x,\
    \ y0).circle(pd/2).extrude(p.lip_t + 0.11))\n        plate = plate.cut(cq.Workplane('XY').workplane(offset=-0.1).center(x,\
    \ (y0 + y1)/2).slot2D((y1 - y0) + sw, sw, 90).extrude(p.lip_t + 0.11))\n     \
    \   plate = plate.cut(cq.Workplane('XY').workplane(offset=p.lip_t).center(x, (y0\
    \ + y1)/2).slot2D((y1 - y0) + pd, pd, 90).extrude(p.pocket_depth))\n    for sx\
    \ in (-1, 1):\n        for sy in (-1, 1):\n            x = sx*(iw/2 + p.wall_t/2)\n\
    \            y = sy*p.back_screw_y\n            plate = plate.cut(cq.Workplane('XY').workplane(offset=-0.1).center(x,\
    \ y).circle(p.cb_d/2).extrude(p.cb_depth + 0.1))\n            plate = plate.cut(cq.Workplane('XY').workplane(offset=-0.1).center(x,\
    \ y).circle(p.m3_clear/2).extrude(p.back_t + 0.2))\n    return plate\n"
  print_orientation: wall face (z=0) on the bed
  use_orientation: wall face against the wall, keyhole slots running upward
