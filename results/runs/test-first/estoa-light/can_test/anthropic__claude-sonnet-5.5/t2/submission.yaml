task: estoa-light
note: 'Box only, as asked. Unverified assumptions:

  1) The disc diameter was derived from the hole-to-rim readings (about 241.6 mm).
  The disc thickness (1.6 mm) and perfboard thickness (1.6 mm) are guesses.

  2) The 33.5 mm hole spacing assumes your 30.2 mm was the gap between the holes''
  inner edges. The coupon result wasn''t reported back, so it is untested.

  3) The wire connector''s position on the disc''s back wasn''t measured. I left a
  30 x 8 mm notch in the rim at 12 o''clock for it. The cavity is otherwise open.

  4) The ESP32 is assumed to sit toward the perfboard''s +x side, and the port left/right
  wasn''t confirmed. The rim opening is 38 x 11 mm, so it covers either case. The
  plug size wasn''t measured. The port mouth is about 12 mm inside the wall''s inner
  face, so the plug''s overmould must fit through the opening and reach in.

  5) The transparent sides must have a matching cut-out at 6 o''clock and clearance
  at 12 o''clock. Disc screw heads (about 3 mm) stand proud of the LED face, so the
  front needs clearance there.

  6) Screws on the wall: 100 mm apart, 37 mm above the light''s centre.'
questions: []
