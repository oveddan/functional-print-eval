parts:
- id: box
  role: final
  material: matte white PLA
  code: "def build(p):\n    R = p.box_od / 2\n    ft = p.floor_t\n    box = cq.Workplane('XY').circle(R).extrude(p.depth)\n\
    \    cav = cq.Workplane('XY').workplane(offset=ft).circle(R - p.wall_t).extrude(p.depth)\n\
    \    box = box.cut(cav)\n    h = p.hole_pitch / 2\n    # disc posts\n    posts\
    \ = (cq.Workplane('XY').pushPoints([(-h, 0), (h, 0)])\n             .circle(p.post_d\
    \ / 2).extrude(p.depth))\n    web = (cq.Workplane('XY').box(p.hole_pitch, p.web_t,\
    \ ft + p.web_h, centered=(True, True, False)))\n    box = box.union(posts).union(web)\n\
    \    bores = (cq.Workplane('XY').workplane(offset=p.depth - p.insert_bore_depth)\n\
    \             .pushPoints([(-h, 0), (h, 0)]).circle(p.insert_hole_d / 2)\n   \
    \          .extrude(p.insert_bore_depth))\n    box = box.cut(bores)\n    # perfboard\
    \ standoffs\n    hx = p.perf_w / 2 - p.perf_hole_edge - p.perf_hole_d / 2\n  \
    \  hy = p.perf_l / 2 - p.perf_hole_edge - p.perf_hole_d / 2\n    pts = [(sx *\
    \ hx, p.perf_cy + sy * hy) for sx in (-1, 1) for sy in (-1, 1)]\n    sh = ft +\
    \ p.standoff_h\n    so = cq.Workplane('XY').pushPoints(pts).circle(p.standoff_d\
    \ / 2).extrude(sh)\n    box = box.union(so)\n    pil = (cq.Workplane('XY').workplane(offset=sh\
    \ - p.pilot_depth)\n           .pushPoints(pts).circle(p.pilot_d / 2).extrude(p.pilot_depth))\n\
    \    box = box.cut(pil)\n    # keyholes (big hole low, slot up)\n    for sx in\
    \ (-1, 1):\n        cx = sx * p.key_x\n        big = cq.Workplane('XY').center(cx,\
    \ p.key_y).circle(p.keyhole_big_d / 2).extrude(ft)\n        slot = (cq.Workplane('XY').center(cx,\
    \ p.key_y + p.slot_len / 2)\n                .rect(p.slot_w, p.slot_len).extrude(ft))\n\
    \        cap = cq.Workplane('XY').center(cx, p.key_y + p.slot_len).circle(p.slot_w\
    \ / 2).extrude(ft)\n        box = box.cut(big).cut(slot).cut(cap)\n    # USB-C\
    \ opening at the bottom (-y)\n    zc = ft + p.standoff_h + p.perf_t + p.usb_bottom\
    \ + p.usb_h / 2\n    op = (cq.Workplane('XY').box(p.opening_w, 20, p.opening_h,\
    \ centered=(True, True, True))\n          .translate((0, -R, zc)))\n    box =\
    \ box.cut(op)\n    # connector relief notch at 12 o'clock\n    nt = (cq.Workplane('XY').box(p.notch_w,\
    \ 2 * p.wall_t + 2, p.notch_d + 1, centered=(True, True, False))\n          .translate((0,\
    \ R - p.wall_t, p.depth - p.notch_d)))\n    box = box.cut(nt)\n    return box\n"
  print_orientation: back face (z=0) on the bed, rim up
  use_orientation: back face flat against the wall, rim facing out
- id: coupon-disc-holes
  role: coupon
  material: PLA
  code: "def build(p):\n    w = p.hole_pitch + 24\n    plate = cq.Workplane('XY').box(w,\
    \ 36, 2, centered=(True, True, False))\n    h = p.hole_pitch / 2\n    pins = (cq.Workplane('XY').workplane(offset=2)\n\
    \            .pushPoints([(-h, 9), (h, 9)]).circle(p.pin_d / 2).extrude(5))\n\
    \    posts = (cq.Workplane('XY').workplane(offset=2)\n             .pushPoints([(-h,\
    \ -9), (h, -9)]).circle(p.post_d / 2).extrude(8))\n    bores = (cq.Workplane('XY').workplane(offset=10\
    \ - p.insert_bore_depth)\n             .pushPoints([(-h, -9), (h, -9)]).circle(p.insert_hole_d\
    \ / 2).extrude(p.insert_bore_depth))\n    return plate.union(pins).union(posts).cut(bores)\n"
  print_orientation: flat, plate on the bed
  use_orientation: test only
- id: coupon-keyhole
  role: coupon
  material: PLA
  code: "def build(p):\n    plate = cq.Workplane('XY').box(30, 40, p.floor_t, centered=(True,\
    \ True, False))\n    big = cq.Workplane('XY').center(0, -12).circle(p.keyhole_big_d\
    \ / 2).extrude(p.floor_t)\n    slot = (cq.Workplane('XY').center(0, -12 + p.slot_len\
    \ / 2)\n            .rect(p.slot_w, p.slot_len).extrude(p.floor_t))\n    cap =\
    \ cq.Workplane('XY').center(0, -12 + p.slot_len).circle(p.slot_w / 2).extrude(p.floor_t)\n\
    \    return plate.cut(big).cut(slot).cut(cap)\n"
  print_orientation: flat
  use_orientation: test only
