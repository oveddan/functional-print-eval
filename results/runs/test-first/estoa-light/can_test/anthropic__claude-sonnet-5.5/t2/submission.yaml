manual:
- n: '1'
  text: Print the box in matte white PLA, back face (the flat side with the two keyhole
    slots) on the bed, rim up, no supports. It's 238 mm across, so it fits on the
    bed.
  parts:
  - box
  hardware: []
  tool: null
- n: '2'
  text: Heat-set the two M3 inserts into the 4.3 mm holes in the tops of the two tall
    posts near the centre. Push them in flush with the post top.
  parts:
  - box
  hardware:
  - m3-insert
  tool: soldering iron
- n: '3'
  text: 'Put the perfboard on the four low standoffs with the ESP32 up and its USB-C
    end facing the opening at the bottom of the rim. Screw it down with M2 self-tapping
    screws through the corner holes: both USB-end corners, plus the antenna-end corner
    that the ESP32 doesn''t cover. If the ESP32 covers the far corner on the other
    side, use the opposite one. Leave the fourth standoff empty.'
  parts:
  - box
  hardware:
  - m2-screw
  - perfboard
  - esp32
  tool: screwdriver
- n: '4'
  text: Plug the four wires into the back of the LED disc, with its wire connector
    at 12 o'clock (top, over the notch in the rim). Lay the disc on the box with its
    two holes over the posts. Fasten it with two M3x8 screws, LED side up.
  parts:
  - box
  hardware:
  - led-disk
  - m3-screw
  tool: 2.5 mm hex key
- n: '5'
  text: 'On the wall, put two #8 screws in the 1/4 inch anchors, 100 mm apart horizontally.
    Leave them 3.5 mm out from the wall. Put them 37 mm above where the centre of
    the light should be. Push the box on so the heads go through the big holes of
    the keyholes, then let it slide down so the screws sit at the top of the slots.'
  parts:
  - box
  hardware: []
  tool: null
- n: '6'
  text: Push the USB-C charger plug through the opening at the bottom of the rim into
    the ESP32 port. The opening is wider than needed because I couldn't confirm which
    side of the ESP32 the port is on.
  parts:
  - box
  hardware:
  - esp32
  tool: null
