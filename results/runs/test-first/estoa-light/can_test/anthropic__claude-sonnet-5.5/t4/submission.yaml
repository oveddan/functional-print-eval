parts:
- id: box
  role: final
  material: matte white PLA
  code: "def build(p):\n    R = p.disc_d / 2.0\n    Ri = R - p.wall\n    top_b = p.back_t\
    \ + p.boss_h\n    board_top = top_b + p.perf_t\n    H = board_top + p.esp_h +\
    \ p.top_clear\n    pitch = p.disc_hole_gap + p.disc_hole_d\n\n    def cyl(x, y,\
    \ d, h, z0=0.0):\n        return cq.Workplane('XY').workplane(offset=z0).center(x,\
    \ y).circle(d / 2.0).extrude(h)\n\n    body = cyl(0, 0, 2 * R, H)\n    body =\
    \ body.cut(cyl(0, 0, 2 * Ri, H, p.back_t))\n\n    # disc posts and the rib joining\
    \ them\n    for sx in (-1, 1):\n        body = body.union(cyl(sx * pitch / 2.0,\
    \ 0, p.post_od, H))\n    rib = cq.Workplane('XY').rect(pitch, p.rib_t).extrude(H\
    \ - p.rib_gap)\n    body = body.union(rib)\n\n    # perfboard bosses\n    hx =\
    \ p.perf_w / 2.0 - p.perf_hole_edge - p.perf_hole_d / 2.0\n    hy = p.perf_l /\
    \ 2.0 - p.perf_hole_edge - p.perf_hole_d / 2.0\n    hole_pts = [(sx * hx, p.perf_cy\
    \ + sy * hy) for sx in (-1, 1) for sy in (-1, 1)]\n    for (x, y) in hole_pts:\n\
    \        body = body.union(cyl(x, y, p.boss_od, top_b))\n\n    # keyhole pads\n\
    \    key_hole_d = p.wall_head_d + 1.5\n    key_slot_w = p.wall_shank_d + 0.6\n\
    \    L = p.key_slot_len\n    yh = p.key_y - L\n    for sx in (-1, 1):\n      \
    \  pad = cq.Workplane('XY').center(sx * p.key_x, yh + L / 2.0).rect(p.pad_w, L\
    \ + 26).extrude(p.back_t + p.pad_t)\n        body = body.union(pad)\n\n    # cuts:\
    \ insert holes\n    for sx in (-1, 1):\n        body = body.cut(cyl(sx * pitch\
    \ / 2.0, 0, p.insert_hole_d, p.insert_hole_depth + 1, H - p.insert_hole_depth))\n\
    \    # cuts: M2 pilot holes\n    for (x, y) in hole_pts:\n        body = body.cut(cyl(x,\
    \ y, p.m2_pilot_d, p.m2_pilot_depth + 1, top_b - p.m2_pilot_depth))\n    # cuts:\
    \ keyholes (round entry at the bottom, slot going up)\n    for sx in (-1, 1):\n\
    \        body = body.cut(cyl(sx * p.key_x, yh, key_hole_d, 20, -1))\n        slot\
    \ = cq.Workplane('XY').workplane(offset=-1).center(sx * p.key_x, yh + L / 2.0).slot2D(L\
    \ + key_slot_w, key_slot_w, 90).extrude(20)\n        body = body.cut(slot)\n \
    \   # cut: rim relief at 12 o'clock\n    notch = cq.Workplane('XY').workplane(offset=H\
    \ - p.notch_d).center(0, R - 5).rect(p.notch_w, 20).extrude(p.notch_d + 1)\n \
    \   body = body.cut(notch)\n    # cut: USB-C plug opening in the bottom rim\n\
    \    zc = board_top + p.port_bottom_h + p.port_h / 2.0\n    cutout_w = 2 * p.port_off\
    \ + p.plug_w + 2 * p.cut_clear\n    cutout_h = p.plug_h + 2 * p.cut_clear\n  \
    \  cut = cq.Workplane('XY').workplane(offset=zc - cutout_h / 2.0).center(-p.esp_cx,\
    \ -(R + Ri) / 2.0).rect(cutout_w, p.wall + 6).extrude(cutout_h)\n    body = body.cut(cut)\n\
    \    return body\n"
  print_orientation: back face (z=0) flat on the bed, open side up; brim recommended
  use_orientation: back face against the wall, open side facing out, 12 o'clock (rim
    notch) at the top
