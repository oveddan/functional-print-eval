manual:
- n: '1'
  text: Print the box in matte white PLA with its flat back on the bed and the open
    side up. No supports. Use a brim, as it is a 241 mm round plate, and 5-6 perimeters.
  parts:
  - box
  hardware: []
  tool: 3D printer
- n: '2'
  text: Heat the soldering iron to about 220 C and press one heat-set insert into
    the top of each of the two centre posts. Keep it straight and push it in until
    it is flush with the post top. Let it cool.
  parts:
  - box
  hardware:
  - m3-insert
  tool: soldering iron
- n: '3'
  text: Hang the box. Drive the two wall screws into the 1/4 inch anchors 100 mm apart
    horizontally, on the same level. Leave each shank sticking out about 6 mm from
    the wall (head 6 mm off the wall). The slots in the box are 45 mm above the disc
    centre; the 12 o'clock rim notch is the top. Push the box onto the screws so the
    heads go through the round holes into the box, then let it slide down so the shanks
    end up at the top of the slots.
  parts:
  - box
  hardware: []
  tool: screwdriver
- n: '4'
  text: Mount the perfboard. Lay it ESP32-side up on the four bosses, with the ESP32's
    USB-C end toward the bottom rim and the cutout, and screw it down with the four
    M2x6 self-tapping screws. Stop when each head touches the board; don't over-tighten.
  parts:
  - box
  hardware:
  - perfboard
  - esp32
  - m2-screw
  tool: screwdriver
- n: '5'
  text: Plug the USB-C cable into the ESP32 through the opening in the bottom rim.
    Check the plug goes in fully and doesn't touch the edges. Lay the four disc wires
    up past the posts (they can cross over the rib), toward 12 o'clock.
  parts: []
  hardware:
  - esp32
  tool: null
- n: '6'
  text: Place the LED disc on the rim and posts with its wires at 12 o'clock, lined
    up with the rim notch, LEDs facing out. Fit an M3x8 screw through each of its
    two centre holes into the inserts and tighten gently until snug.
  parts:
  - box
  hardware:
  - disc
  - m3-screw
  tool: 2.5 mm hex key
