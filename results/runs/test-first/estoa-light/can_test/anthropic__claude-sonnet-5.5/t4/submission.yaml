task: estoa-light
note: 'The box is a round matte-white tray, the same diameter as the disc (241.6 mm;
  it fits the 256 mm bed). Its back sits flat on the wall. Four bosses hold the perfboard,
  with the USB-C end facing the bottom rim. A cutout in the bottom rim lets the cable
  plug into the ESP32 from outside. Two keyhole slots on a 100 mm spacing hang it
  on #8 screws with the heads inside the box. Two posts at the disc''s 3 and 9 o''clock
  holes carry heat-set M3 inserts, and a rib joins them. The rim and the posts form
  one plane that the disc rests on. Several inputs were not measured and are guesses:
  the disc''s thickness and wire pad height, the perfboard thickness, the plug size,
  and the perfboard orientation. The 24 mm opening and the 3 mm rim relief are there
  to cover them. The test coupon I sent came back without any result, so the pilot
  holes, the insert holes and the opening are all untested.'
questions:
- text: Looking down on the perfboard with the ESP32's USB end facing away, is the
    ESP32 offset toward the right edge (as the column numbers suggest)? If it's toward
    the left, the USB-C opening is on the wrong side of the box.
  answer: null
- text: Which of the two USB-C ports do you use, and what size is your charger's plug
    overmold? I guessed 14 x 9 mm and cut an opening wide enough for either port.
  answer: null
- text: How thick is the LED disc, and how far do its wire pads stick out of the back?
    I assumed a 1.6 mm board and a 3 mm relief at 12 o'clock.
  answer: null
- text: How will the transparent front and sides attach? I made the box the same diameter
    as the disc (241.6 mm) and left their fixings for later.
  answer: null
