task: estoa-light
note: 'Support-free round back box with two front-access M3 nut pockets, four perfboard
  mounting bosses, two wall keyholes and generous side USB-access windows. Fit remains
  UNVERIFIED: the test was printed but no fit observations were available. Do not
  treat the guessed disk dimensions or electronics placement as measured. Check the
  interfaces listed below before printing/using the final enclosure. Only the box
  is included, not the later diffuser/front/sides. The available filament is black
  PLA; matte-white PLA must be obtained separately to achieve the requested colour.
  Wall screws and anchors are existing, separately supplied fixings, not included
  hardware.'
questions:
- text: Does the actual disk cover a 140 mm diameter box, and do the 10 mm diameter
    posts contact component-free PCB?
  answer: null
- text: Do the four perfboard holes match the test, and do M2 self-tapping screws
    hold in its 1.7 mm pilots without splitting?
  answer: null
- text: Does the mounted electronics assembly clear the disk's rear connector and
    all rear components?
  answer: null
- text: Which way does the USB port face, and does the actual plug fit through a side
    window without loading the socket?
  answer: null
- text: Are four M2x6 screws and matte-white PLA available?
  answer: null
