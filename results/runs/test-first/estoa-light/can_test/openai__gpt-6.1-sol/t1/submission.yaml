parts:
- id: back_box
  role: final
  material: PLA (black available; obtain matte white PLA for requested finish)
  code: "def build(p):\n    r=p.box_od/2\n    s=cq.Workplane('XY').circle(r).extrude(p.base_t)\n\
    \    rim=cq.Workplane('XY').workplane(offset=p.base_t).circle(r).circle(r-p.wall_t).extrude(p.rim_h-p.base_t)\n\
    \    # Large open-topped side windows: no lintels or unsupported roofs.\n    cutter=cq.Workplane('XY').box(p.box_od+2,p.window_y_max-p.window_y_min,p.rim_h-p.window_sill_z+2,centered=(True,True,False)).translate((0,(p.window_y_max+p.window_y_min)/2,p.window_sill_z))\n\
    \    s=s.union(rim.cut(cutter))\n    for x in (-p.disk_hole_pitch/2,p.disk_hole_pitch/2):\n\
    \        post=cq.Workplane('XY').workplane(offset=p.base_t).center(x,0).circle(p.post_d/2).extrude(p.post_top-p.base_t)\n\
    \        s=s.union(post)\n        bore=cq.Workplane('XY').workplane(offset=p.post_top-p.post_bore_depth).center(x,0).circle(p.post_bore_d/2).extrude(p.post_bore_depth+1)\n\
    \        pocket=cq.Workplane('XY').workplane(offset=p.post_top-p.nut_pocket_depth).center(x,0).polygon(6,(p.m3_nut_af+p.nut_af_allowance)/0.866025403784).extrude(p.nut_pocket_depth+1)\n\
    \        s=s.cut(bore).cut(pocket)\n    for x in (-(p.board_long/2-p.board_hole_edge),p.board_long/2-p.board_hole_edge):\n\
    \        for y in (p.board_y-p.board_short/2+p.board_hole_edge,p.board_y+p.board_short/2-p.board_hole_edge):\n\
    \            boss=cq.Workplane('XY').workplane(offset=p.base_t).center(x,y).circle(p.board_boss_d/2).extrude(p.board_boss_top-p.base_t)\n\
    \            s=s.union(boss)\n            hole=cq.Workplane('XY').workplane(offset=p.pilot_floor).center(x,y).circle(p.pilot_d/2).extrude(p.board_boss_top-p.pilot_floor+1)\n\
    \            s=s.cut(hole)\n    for x in (-p.keyhole_half_spacing,p.keyhole_half_spacing):\n\
    \        entry=cq.Workplane('XY').center(x,p.keyhole_entry_y).circle(p.keyhole_entry_d/2).extrude(p.base_t+1)\n\
    \        neck=cq.Workplane('XY').center(x,(p.keyhole_entry_y+p.keyhole_seat_y)/2).rect(p.keyhole_neck_w,p.keyhole_seat_y-p.keyhole_entry_y).extrude(p.base_t+1)\n\
    \        seat=cq.Workplane('XY').center(x,p.keyhole_seat_y).circle(p.keyhole_neck_w/2).extrude(p.base_t+1)\n\
    \        s=s.cut(entry.union(neck).union(seat))\n    return s"
  print_orientation: Flat circular outside back at z=0 on the bed; cavity and posts
    upward. No supports. All holes and nut pockets open upward.
  use_orientation: Back at wall z=0; keyholes toward +y/up; large side access windows
    in the lower half. Disk input wires face +y.
