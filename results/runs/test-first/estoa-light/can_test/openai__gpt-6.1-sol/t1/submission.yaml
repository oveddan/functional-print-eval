manual:
- n: '1'
  text: Resolve the fit gates before committing to the full box. Use the existing
    layout_test for disk holes, board holes, post contact and self-tapping screw trials.
    Its print quality and fit have NOT been reported. Check disk coverage against
    a 140 mm paper circle. If any check fails, revise the dimensions rather than drilling
    or forcing the electronics.
  parts: []
  hardware: []
  tool: Ruler/calipers, paper template
- n: '2'
  text: Check clearance with the board rotated so its 70 mm direction runs left-right
    and its centre is 32 mm below the disk centre. A 2 mm solder gap is available
    under it in the final box. Hold the disk rear 40 mm from the wall plane and try
    the actual USB plug. Verify the port faces a side window and that components,
    connector and all four wires have clearance. The illustrated ESP32 coordinates
    are assumptions, not a confirmed placement.
  parts: []
  hardware:
  - led_disk
  - perfboard
  - esp32
  tool: null
- n: '3'
  text: Print back_box flat-back-down at 0.2 mm layers with no supports. Use 5 perimeters,
    at least 6 top/bottom layers and 30% infill. The base, bosses and narrow posts
    should have continuous perimeters. Inspect for cracks, lifted corners and incomplete
    keyhole edges. Matte white needs separately obtained filament; the currently listed
    black PLA also works mechanically.
  parts:
  - back_box
  hardware: []
  tool: Bambu Lab X1C
- n: '4'
  text: With power disconnected, lower the perfboard onto its four bosses. Install
    the four M2x6 screws by hand, stopping as soon as the board is held. Do not use
    a power driver. Verify screw heads bridge the holes, do not touch conductors,
    and that no tip emerges from the wall-facing back. Do not enlarge board holes
    or force a mismatched pattern.
  parts:
  - back_box
  hardware:
  - perfboard
  - esp32
  - board_screws
  tool: Screwdriver matching the existing M2 screws
- n: '5'
  text: Drop one M3 nut into each front-facing hex pocket. Each must sit fully down,
    slightly below the post face. Check that the disk rests on safe bare PCB at both
    posts. Position input wires at 12 o'clock, route the four wires with slack away
    from the posts, wall keyholes and screw tips, and connect them as in your existing
    wiring. Do not pinch wires between disk and posts or rim.
  parts:
  - back_box
  hardware:
  - disk_nuts
  - led_disk
  - perfboard
  tool: null
- n: '6'
  text: Install both M3x8 screws through the disk, loosely at first. Confirm at least
    1 mm of thread beyond each nut, no bottoming, and safe screw-head clearance on
    the LED side. Tighten only finger-snug with the short end of the hex key; do not
    bend the PCB. The disk stays 4 mm above the highest rim segments by design. This
    is a ventilated back box, not a dust-tight or touch-proof enclosure.
  parts:
  - back_box
  hardware:
  - disk_screws
  - disk_nuts
  - led_disk
  tool: 2.5 mm hex key
- n: '7'
  text: With the disk fitted, try the actual USB cable through the appropriate side
    window. Leave a free bend and avoid cable weight pulling on the ESP32 socket.
    Use only the existing correctly rated low-voltage USB supply and verified wiring.
    Do not assume this enclosure increases the electrical power capacity of the ESP32
    USB port or perfboard wiring. Start at limited LED brightness.
  parts:
  - back_box
  hardware:
  - esp32
  - perfboard
  - led_disk
  tool: null
- n: '8'
  text: 'For wall fixing, use your separately supplied #8 screws and wall-appropriate
    anchors; none are supplied by this design. Select a flat indoor wall. Mark two
    level screw centres 60 mm apart. Follow the anchor maker''s installation instructions.
    Start with the underside of each head 4.5 mm from the wall, then adjust for a
    secure sliding fit. Verify the actual head and shank fit the keyholes before hanging
    electronics.'
  parts:
  - back_box
  hardware: []
  tool: Wall-appropriate installation tools and level
- n: '9'
  text: 'With power unplugged, put both wall screw heads through the large keyhole
    entries, then slide the light DOWN 8 mm until both shanks reach the upper rounded
    seats. Check both heads retain the back and the box sits securely against the
    wall. It can lift off upward: keep it away from cable pull and accidental lifting.
    Plug in USB only after checking the mount. Run at intended brightness while monitoring
    for heat; stop if PLA softens, wiring heats, or the box distorts. Keep away from
