manual:
- n: '1'
  text: Print rear_box back-down at 0.2 mm layers, at least 4 walls, 5 top/bottom
    layers and 25% infill; no supports. Remove strings from pilots and nut tunnels.
    Reject cracked or delaminated nut-pocket roofs.
  parts:
  - rear_box
  hardware: []
  tool: null
- n: '2'
  text: Evaluate the previously printed board_fit and disc_fit coupons before proceeding.
    Holes must align without force. Test an M2x6 in one pilot; stop if it strips or
    splits. No usable test results were available, so fit is not established.
  parts: []
  hardware:
  - board_screws
  tool: null
- n: '3'
  text: Slide one M3 nut sideways into each tall post from the north-facing opening,
    flats parallel to tunnel walls. Centre the threads under the bores. Nuts must
    sit below the printed roofs; they do not load from the top.
  parts:
  - rear_box
  hardware:
  - disc_nuts
  tool: null
- n: '4'
  text: 'Place perfboard component-side forward on four short posts, USB end toward
    the open bottom. This orientation is assumed: check actual port direction and
    hole alignment. Verify solder clears the base and post faces touch no conductors.
    Secure gently with four M2x6 self-tappers. Stop if threads strip or posts crack.
    Leave unpowered.'
  parts:
  - rear_box
  hardware:
  - perfboard
  - esp32
  - board_screws
  tool: Small screwdriver matching the screw heads
- n: '5'
  text: Route the existing four wires to the disc without stretching or pinching.
    Hold disc input wires upward with the mounting holes horizontal. Verify post tops
    contact only clear PCB around the holes, screw heads clear LEDs/traces, and at
    least 2 mm separates backside components from electronics. Check wire slack while
    lowering disc; unknown wire length and projections must be resolved in this dry
    fit. Stop on interference.
  parts:
  - rear_box
  hardware:
  - disk
  - perfboard
  tool: null
- n: '6'
  text: 'Start both M3x16 screws through the disc into the captive nuts. Tighten only
    gently until seated; never bend PCB. With the assumed 1.6 mm PCB, tips remain
    in blind bores and nuts have full engagement. Actual PCB thickness is unknown:
    verify at least full nut-thickness engagement and that screws do not bottom before
    clamping. Stop if either condition fails; do not substitute longer screws without
    checking.'
  parts:
  - rear_box
  hardware:
  - disk
  - disc_screws
  - disc_nuts
  tool: 2.5 mm hex key
- n: '7'
  text: 'With disc fitted, insert and remove the actual USB plug through the broad
    bottom opening. Fingers and plug may enter the recessed bay, but the plug must
    connect without bending the port or crushing wiring. If access fails, stop and
    revise the enclosure: the true port position was not established.'
  parts:
  - rear_box
  hardware:
  - esp32
  - disk
  tool: null
- n: '8'
  text: 'Use the purchased #8 round-head wall screws and 1/4-inch anchors as external
    installation fixings. Confirm anchor suitability for wall and load, follow manufacturer
    drilling and screw-length requirements, and avoid hidden pipes/wiring. Do not
    substitute catalog machine screws. Place screws horizontally 70 mm apart; their
    final underside-head centres are (−35,35,3.5) and (35,35,3.5) in assembled coordinates,
    pointing into wall (−z). Leave about 3.5 mm under heads. Actual heads must be
    7–9 mm across and pass entry/retention checks.'
  parts:
  - rear_box
  hardware: []
  tool: Wall-appropriate drill and screwdriver
- n: '9'
  text: Pass both heads through large keyhole entries, then lower box 8 mm to seat
    shafts at tops of narrow slots. Check both are captured; adjust under-head gaps
    to remove wobble without bowing the back. Lift-off remains possible, so keep out
    of impact areas.
  parts:
  - rear_box
  hardware: []
  tool: null
- n: '10'
  text: Power only from an external low-voltage USB supply; no mains parts inside.
    Start at low brightness and monitor temperature. Do not assume ESP32 USB power
    can run all 255 LEDs at full white. Keep bottom access/ventilation unobstructed.
    Disconnect if connectors heat, supply resets or PLA softens. Later diffuser additions
    need a new thermal and clearance check.
  parts: []
  hardware:
  - esp32
  - disk
  tool: null
