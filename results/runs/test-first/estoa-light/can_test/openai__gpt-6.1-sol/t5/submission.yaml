task: estoa-light
note: 'Rear box only, with a deliberately broad open-bottom USB-access bay; no diffuser
  or outer rim. Available black PLA is specified; matte white requires a new spool.
  Fit is NOT verified: coupons were printed but not evaluated, PCB thicknesses/backside
  projections remain unknown, and USB coordinates are provisional. Dry-fit checks
  below are mandatory. The user''s confirmed #8 round-head wall screws and 1/4-inch
  anchors are external installation fixings: the schema rejects adding them as hardware,
  so their geometry and locations are documented as world parameters instead.'
questions:
- text: Do both fit coupons align, and does the M2 pilot grip?
  answer: Printed but not evaluated.
- text: PCB thicknesses, backside projections, and free wire length?
  answer: null
- text: Exact USB location and direction relative to perfboard?
  answer: Unconfirmed; provisional assembly placement and wide access opening used.
