parts:
- id: rear_box
  role: final
  material: PLA, available black
  code: "def build(p):\n    import math\n    W,H,D,b,t=p.box_w,p.box_h,p.box_depth,p.base_t,p.wall_t\n\
    \    s=cq.Workplane('XY').box(W,H,b,centered=(True,True,False))\n    for x in\
    \ [-W/2+t/2,W/2-t/2]:\n        s=s.union(cq.Workplane('XY').box(t,H,D,centered=(True,True,False)).translate((x,0,0)))\n\
    \    s=s.union(cq.Workplane('XY').box(W,t,D,centered=(True,True,False)).translate((0,H/2-t/2,0)))\n\
    \    sx=p.board_w-2*p.board_edge_gap-p.board_hole_d\n    sy=p.board_l-2*p.board_edge_gap-p.board_hole_d\n\
    \    for x in [-sx/2,sx/2]:\n        for y in [p.board_local_y-sy/2,p.board_local_y+sy/2]:\n\
    \            s=s.union(cq.Workplane('XY').workplane(offset=b).center(x,y).circle(p.board_post_r).extrude(p.board_seat_z-b))\n\
    \            s=s.cut(cq.Workplane('XY').workplane(offset=p.board_seat_z-p.m2_length).center(x,y).circle(p.m2_pilot/2).extrude(p.m2_length+1))\n\
    \    for x in [-p.disc_pitch/2,p.disc_pitch/2]:\n        y=p.disc_local_y\n  \
    \      s=s.union(cq.Workplane('XY').workplane(offset=b).center(x,y).circle(p.disc_post_r).extrude(D-b))\n\
    \        s=s.cut(cq.Workplane('XY').workplane(offset=p.disc_bore_bottom).center(x,y).circle(p.m3_clear/2).extrude(D-p.disc_bore_bottom+1))\n\
    \        R=p.nut_pocket_af/math.sqrt(3)\n        pts=[(x+R*math.cos(math.radians(30+60*i)),y+R*math.sin(math.radians(30+60*i)))\
    \ for i in range(6)]\n        pocket=cq.Workplane('XY').workplane(offset=p.nut_pocket_z).polyline(pts).close().extrude(p.nut_pocket_h)\n\
    \        tunnel=cq.Workplane('XY').box(p.nut_pocket_af,p.disc_post_r+2,p.nut_pocket_h,centered=(True,False,False)).translate((x,y,p.nut_pocket_z))\n\
    \        s=s.cut(pocket.union(tunnel))\n    for x in [-p.wall_spacing/2,p.wall_spacing/2]:\n\
    \        y=p.key_top_y\n        entry=cq.Workplane('XY').center(x,y-p.key_travel).circle(p.key_entry_d/2).extrude(b+1)\n\
    \        end=cq.Workplane('XY').center(x,y).circle(p.key_slot_w/2).extrude(b+1)\n\
    \        slot=cq.Workplane('XY').box(p.key_slot_w,p.key_travel,b+1,centered=(True,False,False)).translate((x,y-p.key_travel,0))\n\
    \        s=s.cut(entry.union(end).union(slot))\n    return s"
  print_orientation: Flat outside back at z=0 on bed, open front upward. No supports.
    Nut tunnels have 5.9 mm roof bridges.
  use_orientation: Back against wall; closed short wall upward, open short edge downward.
    Disc rests on two tall posts.
