parts:
- id: chassis
  role: final
  material: PLA, available black
  code: "def build(p):\n    import math\n    r=p.outer_r-p.wall_t\n    b=cq.Workplane('XY').circle(p.outer_r).extrude(p.floor_t)\n\
    \    b=b.union(cq.Workplane('XY').workplane(offset=p.floor_t).circle(p.outer_r).circle(r).extrude(p.body_h-p.floor_t))\n\
    \    for a in [45,135,225,315]:\n        x=p.deck_fix_r*math.cos(math.radians(a));\
    \ y=p.deck_fix_r*math.sin(math.radians(a))\n        b=b.union(cq.Workplane('XY').center(x,y).circle(p.deck_boss_r).extrude(p.body_h))\n\
    \    pts=[(-p.window_half_w,p.window_bottom),(p.window_half_w,p.window_bottom),(p.window_half_w,p.window_shoulder),(p.window_top_half_w,p.window_top),(-p.window_top_half_w,p.window_top),(-p.window_half_w,p.window_shoulder)]\n\
    \    cut=cq.Workplane('XZ',origin=(0,p.window_inner,0)).polyline(pts).close().extrude(-(p.outer_r-p.window_inner+2))\n\
    \    for a in [0,90,180,270]:\n        b=b.cut(cut.rotate((0,0,0),(0,0,1),a))\n\
    \    for a in [45,135,225,315]:\n        x=p.deck_fix_r*math.cos(math.radians(a));\
    \ y=p.deck_fix_r*math.sin(math.radians(a))\n        b=b.cut(cq.Workplane('XY').workplane(offset=p.body_h-p.short_screw_l-p.deck_t).center(x,y).circle(p.m3_clear/2).extrude(p.short_screw_l+p.deck_t+1))\n\
    \        h=cq.Workplane('XY').polygon(6,(p.m3_nut_af+p.nut_allowance)/math.cos(math.pi/6)).extrude(p.body_nut_depth+1).rotate((0,0,0),(0,0,1),30).translate((x,y,p.body_h-p.body_nut_depth))\n\
    \        b=b.cut(h)\n    for x,y in [(p.tray_fix_r,0),(-p.tray_fix_r,0),(0,-p.tray_fix_r)]:\n\
    \        b=b.cut(cq.Workplane('XY').center(x,y).circle(p.m3_clear/2).extrude(p.floor_t+1))\n\
    \        h=cq.Workplane('XY').polygon(6,(p.m3_nut_af+p.nut_allowance)/math.cos(math.pi/6)).extrude(p.base_nut_depth).rotate((0,0,0),(0,0,1),30).translate((x,y,0))\n\
    \        b=b.cut(h)\n    for x in [-p.wall_half_spacing,p.wall_half_spacing]:\n\
    \        y=p.key_entry_y\n        b=b.cut(cq.Workplane('XY').center(x,y).circle((p.wall_head_d+p.key_head_clearance)/2).extrude(p.floor_t+1))\n\
    \        b=b.cut(cq.Workplane('XY').center(x,y+p.key_travel/2).rect(p.key_neck,p.key_travel).extrude(p.floor_t+1))\n\
    \        b=b.cut(cq.Workplane('XY').center(x,y+p.key_travel).circle(p.key_neck/2).extrude(p.floor_t+1))\n\
    \    return b"
  print_orientation: Closed back flat on bed at z=0, open end up. No supports; window
    shoulders are 45 degrees and top bridges 40 mm.
  use_orientation: +y up, back against wall at z=0.
- id: electronics_tray
  role: final
  material: PLA, available black
  code: "def build(p):\n    b=cq.Workplane('XY').circle(p.tray_outer_r).circle(p.tray_inner_r).extrude(p.tray_t)\n\
    \    trim=cq.Workplane('XY').box(2*(p.outer_r+1),2*(p.outer_r+1),p.tray_seat_h+2,centered=(True,False,False)).translate((0,p.tray_trim_y,0))\n\
    \    b=b.cut(trim)\n    for x in [-p.board_w/2+p.board_hole_edge,p.board_w/2-p.board_hole_edge]:\n\
    \        for y in [-p.board_l/2+p.board_hole_edge,p.board_l/2-p.board_hole_edge]:\n\
    \            b=b.union(cq.Workplane('XY').center(x,y).circle(p.board_boss_r).extrude(p.tray_seat_h))\n\
    \            b=b.cut(cq.Workplane('XY').workplane(offset=p.pilot_bottom).center(x,y).circle(p.m2_pilot/2).extrude(p.tray_seat_h-p.pilot_bottom+1))\n\
    \    for x,y in [(p.tray_fix_r,0),(-p.tray_fix_r,0),(0,-p.tray_fix_r)]:\n    \
    \    b=b.cut(cq.Workplane('XY').center(x,y).circle(p.m3_clear/2).extrude(p.tray_t+1))\n\
    \    return b"
  print_orientation: Ring underside at z=0, board posts upward.
  use_orientation: Tray underside at finished z=5, missing upper ring segment toward
    keyholes (+y). Board underside seats at z=17.
- id: disk_bridge
  role: final
  material: PLA, available black
  code: "def build(p):\n    import math\n    r=p.outer_r-p.wall_t\n    b=cq.Workplane('XY').circle(p.outer_r).circle(r).extrude(p.deck_t)\n\
    \    b=b.union(cq.Workplane('XY').box(2*r+2,p.beam_w,p.deck_t,centered=(True,True,False)))\n\
    \    for a in [45,135,225,315]:\n        x=p.deck_fix_r*math.cos(math.radians(a));\
    \ y=p.deck_fix_r*math.sin(math.radians(a))\n        b=b.union(cq.Workplane('XY').center(x,y).circle(p.deck_boss_r).extrude(p.deck_t))\n\
    \        b=b.cut(cq.Workplane('XY').center(x,y).circle(p.m3_clear/2).extrude(p.deck_t+1))\n\
    \        b=b.cut(cq.Workplane('XY').workplane(offset=p.deck_t-p.head_recess).center(x,y).circle((p.m3_head_d+p.head_clearance)/2).extrude(p.head_recess+1))\n\
    \    for x in [-p.disk_pitch/2,p.disk_pitch/2]:\n        b=b.union(cq.Workplane('XY').workplane(offset=p.deck_t).center(x,0).circle(p.disk_boss_r).extrude(p.disk_standoff))\n\
    \        b=b.cut(cq.Workplane('XY').center(x,0).circle(p.m3_clear/2).extrude(p.deck_t+p.disk_standoff+1))\n\
    \        h=cq.Workplane('XY').polygon(6,(p.m3_nut_af+p.nut_allowance)/math.cos(math.pi/6)).extrude(p.side_nut_height).rotate((0,0,0),(0,0,1),30).translate((x,0,p.side_nut_floor))\n\
    \        slot=cq.Workplane('XY').workplane(offset=p.side_nut_floor).center(x,p.beam_w/4+0.5).rect(p.m3_nut_af+p.nut_allowance,p.beam_w/2+1).extrude(p.side_nut_height)\n\
    \        b=b.cut(h).cut(slot)\n    return b"
  print_orientation: Flat ring/beam underside at z=0, standoffs upward; side nut-pocket
    roofs bridge under 7 mm.
  use_orientation: Underside at finished z=54; beam horizontal, disk rear mounting
    face at z=65.
