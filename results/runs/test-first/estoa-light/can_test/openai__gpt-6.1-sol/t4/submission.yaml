manual:
- n: '1'
  text: Evaluate the already printed disk_gauge and perfboard_gauge before full printing.
    Their fit is not established. Both PCBs must align without force. If either does
    not fit, stop and correct the relevant parameters.
  parts: []
  hardware:
  - led
  - perf
  - board_screws
  tool: null
- n: '2'
  text: Print all three parts at 0.2 mm layers, 4 walls, at least 5 top/bottom layers
    and 25% infill, without supports. Use good bridge cooling. Inspect window and
    nut-pocket roofs and remove strings. Black PLA is available; matte-white requires
    separately obtained filament.
  parts:
  - chassis
  - electronics_tray
  - disk_bridge
  hardware: []
  tool: null
- n: '3'
  text: Insert three tray_nuts into underside chassis pockets. Fit electronics_tray
    with its missing ring segment toward the keyholes (+y), and secure using three
    M3x8 tray_screws. Hold nuts flush while tightening gently. Nothing may project
    beyond the chassis back.
  parts:
  - chassis
  - electronics_tray
  hardware:
  - tray_nuts
  - tray_screws
  tool: 2.5 mm hex key
- n: '4'
  text: Disconnect power. Seat perfboard solder-side down on four posts. It can be
    turned 180 degrees on this pattern to face USB toward the opposite opening. Inspect
    all underside clearance. Fit four own M2x6 screws gently by hand; stop on bottoming,
    splitting or contact with solder joints. Confirm actual USB plug seats without
    flexing the ESP32 or headers.
  parts:
  - electronics_tray
  hardware:
  - perf
  - esp
  - board_screws
  tool: Small screwdriver
- n: '5'
  text: Slide two disk_nuts into bridge side pockets and align with bores. Put four
    bridge_nuts into chassis boss pockets from above. Route disk wires clear of screw
    tips, beam and keyholes, leaving a service loop. Fit bridge with four M3x8 bridge_screws;
    heads must sit below its top surface.
  parts:
  - disk_bridge
  - chassis
  hardware:
  - disk_nuts
  - bridge_nuts
  - bridge_screws
  - led
  - perf
  tool: 2.5 mm hex key
- n: '6'
  text: 'Set disk rear face onto the two raised standoffs, wires toward +y/up. Check
    that only the intended mounting annuli touch. The bridge clearance is 6 mm but
    rear components were not measured: stop on any collision. Fit two M3x16 screws
    gently through the PCB into captive disk_nuts. Confirm heads clear LEDs and traces,
    full nut engagement with at least one exposed thread, and clear tips. Approximate
    suitable PCB thickness is 1–4 mm; measure actual stack rather than assuming fit.'
  parts:
  - disk_bridge
  hardware:
  - led
  - disk_screws
  - disk_nuts
  tool: 2.5 mm hex key
- n: '7'
  text: With disk installed, insert and remove the actual USB plug through a side
    opening. It must fully seat and withdraw without lever force, crushed cable or
    board flex. A precise small USB cutout is deliberately omitted because port placement
    was not confirmed. Do not proceed if the plug cannot reach freely.
  parts:
  - chassis
  hardware:
  - esp
  - perf
  - led
  tool: null
- n: '8'
  text: 'Use the reported external #8 round-head screws and 1/4-inch anchors, following
    their wall-specific installation instructions. They are not substitutes for the
    listed machine screws. Put screw centres level, 36 mm apart. Initially leave 5.5
    mm under each head. Final screw underside positions relative to the light are
    x=-18/+18, y=53, z=5.5 mm; screw axes point toward the wall. Disk centre will
    be 53 mm below the screw line. Verify anchors suit your wall.'
  parts:
  - chassis
  hardware: []
  tool: Level, wall-appropriate drill and screwdriver
- n: '9'
  text: Offer the two large keyhole circles over both wall heads, then lower the light
    10 mm into the narrow necks. Ensure heads do not hit the tray, wires or components
    anywhere along that movement. Adjust head gaps for a snug flat fit; gently check
    capture. The hanger is not lift-off locked. Connect USB with cable slack and no
    upward pull.
  parts:
  - chassis
  hardware:
  - esp
  tool: null
- n: '10'
  text: First run at reduced brightness while attended. Set a current/brightness limit
    suitable for the actual USB supply, wiring and power path; an ESP32 USB input
    does not establish safe full-white power for 255 LEDs. Keep openings clear. Stop
    if anything overheats or softens, and reassess heat before adding the future front
    diffuser.
  parts: []
  hardware:
  - led
  - perf
  - esp
  tool: null
