task: estoa-light
note: 'Provisional-fit 130 mm round rear chassis, removable disk bridge, and electronics
  tray. Four broad arched side openings avoid depending on the unconfirmed USB offset.
  Printed coupons were not evaluated: complete the mandatory dry-fit checks before
  powering or hanging. Black PLA is available; matte-white PLA must be obtained separately.
  The reported #8 wall screws and anchors cannot be represented as hardware by this
  submission''s fixed catalog; their locations are specified in parameters/manual
  instead. PCB thicknesses and ESP32 pose in the assembly are illustrative assumptions,
  not measured facts. No diffuser is included.'
questions:
- text: Disk hole pitch?
  answer: 33.5 mm centres = 30.2 mm measured inner gap + 3.3 mm hole diameter.
- text: Coupon results?
  answer: Printed, but user could not evaluate fit.
- text: PCB thicknesses, underside projections and precise USB pose?
  answer: null
- text: Wall hardware?
  answer: 'User has #8 round-head screws, heads at most 9 mm, with 1/4-inch anchors;
    spacing can be chosen.'
