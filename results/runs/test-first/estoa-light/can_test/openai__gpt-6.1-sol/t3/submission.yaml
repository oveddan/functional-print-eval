parts:
- id: back_box
  role: final
  material: PLA, available black; matte white PLA may be substituted
  code: "def build(p):\n    r=p.box_d/2\n    b=cq.Workplane('XY').circle(r).extrude(p.floor_t)\n\
    \    ring=cq.Workplane('XY').workplane(offset=p.floor_t).circle(r).circle(r-p.wall_t).extrude(p.shell_top-p.floor_t)\n\
    \    opening=cq.Workplane('XY').box(p.opening_w,p.box_d,p.disk_back_z,centered=(True,True,False)).translate((0,p.opening_start_y-p.box_d/2,p.floor_t))\n\
    \    b=b.union(ring.cut(opening))\n    for x in (-p.disk_pitch/2,p.disk_pitch/2):\n\
    \        b=b.union(cq.Workplane('XY').workplane(offset=p.floor_t).center(x,0).circle(p.post_d/2).extrude(p.disk_back_z-p.floor_t))\n\
    \        b=b.cut(cq.Workplane('XY').workplane(offset=p.disk_back_z-p.post_bore_depth).center(x,0).circle(p.shaft_clear/2).extrude(p.post_bore_depth))\n\
    \        b=b.cut(cq.Workplane('XY').workplane(offset=p.disk_back_z-p.insert_length).center(x,0).circle(p.insert_pilot/2).extrude(p.insert_length))\n\
    \    b=b.union(cq.Workplane('XY').workplane(offset=p.floor_t).center(0,p.carrier_y).circle(p.carrier_boss_d/2).extrude(p.carrier_seat_z-p.floor_t))\n\
    \    b=b.cut(cq.Workplane('XY').workplane(offset=p.floor_t).center(0,p.carrier_y).circle(p.shaft_clear/2).extrude(p.carrier_seat_z-p.floor_t))\n\
    \    b=b.cut(cq.Workplane('XY').workplane(offset=p.carrier_seat_z-p.insert_length).center(0,p.carrier_y).circle(p.insert_pilot/2).extrude(p.insert_length))\n\
    \    for x in (-p.key_x,p.key_x):\n        cut=cq.Workplane('XY').center(x,p.key_entry_y).circle(p.key_entry_d/2).extrude(p.floor_t)\n\
    \        cut=cut.union(cq.Workplane('XY').center(x,p.key_entry_y+p.key_travel/2).rect(p.key_neck,p.key_travel).extrude(p.floor_t))\n\
    \        cut=cut.union(cq.Workplane('XY').center(x,p.key_entry_y+p.key_travel).circle(p.key_neck/2).extrude(p.floor_t))\n\
    \        b=b.cut(cut)\n    return b"
  print_orientation: Flat outer back face on bed, z=0; cavity up. No supports.
  use_orientation: Back against wall, +y up, +z out. Broad service opening faces down.
- id: perfboard_carrier
  role: final
  material: PLA, available black; matte white PLA may be substituted
  code: "def build(p):\n    b=cq.Workplane('XY').circle(p.carrier_d/2).extrude(p.carrier_t)\n\
    \    top=p.carrier_t+p.pcb_standoff\n    for x in (-p.pcb_w/2+p.pcb_hole_edge,p.pcb_w/2-p.pcb_hole_edge):\n\
    \        for y in (-p.pcb_l/2+p.pcb_hole_edge,p.pcb_l/2-p.pcb_hole_edge):\n  \
    \          b=b.union(cq.Workplane('XY').workplane(offset=p.carrier_t).center(x,y).circle(p.pcb_boss_d/2).extrude(p.pcb_standoff))\n\
    \            b=b.cut(cq.Workplane('XY').workplane(offset=top-p.m2_pilot_depth).center(x,y).circle(p.m2_pilot/2).extrude(p.m2_pilot_depth))\n\
    \    return b.cut(cq.Workplane('XY').circle(p.shaft_clear/2).extrude(p.carrier_t))"
  print_orientation: Circular underside on bed at z=0, standoffs up. No supports.
  use_orientation: Underside z=11, centre (0,-53). Rotate around central screw so
    actual USB faces bottom opening. Assembly depicts provisional zero rotation.
