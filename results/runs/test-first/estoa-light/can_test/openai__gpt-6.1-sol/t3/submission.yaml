manual:
- n: '1'
  text: Print both parts with 0.2 mm layers, 4 perimeters, 5 top/bottom layers and
    roughly 25% infill. Use specified flat orientations, no supports. Brim is optional
    for the large back. Remove brim and hole-edge elephant foot. Only black PLA is
    currently listed; matte white requires obtaining that filament.
  parts:
  - back_box
  - perfboard_carrier
  hardware: []
  tool: Bambu Lab X1C
- n: '2'
  text: Disconnect power. Confirm both printed gauges actually fit the boards; their
    fit could not be reported. Both disk holes must accept M3 screws simultaneously
    without force. Inspect the 14 mm post contact areas and screw-head areas for components,
    solder and traces. Do not clamp components or force hole misalignment.
  parts: []
  hardware:
  - disk
  - perfboard
  - disk_screws
  - pcb_screws
  tool: null
- n: '3'
  text: 'Heat-set three M3x4x5 inserts: two flush with tall post tops at z=60, one
    flush with carrier boss at z=11. Use a temperature-controlled heat-set tool, press
    axially and allow full cooling. Avoid melting the supporting posts.'
  parts:
  - back_box
  hardware:
  - inserts
  tool: Temperature-controlled soldering iron with heat-set tip
- n: '4'
  text: Place carrier on its boss and loosely fit central M3x8 screw. Temporarily
    seat perfboard on standoffs. Rotate carrier so actual USB mouth faces down towards
    the broad service opening. Either a short-edge or long-edge port can be oriented
    down; depicted orientation is provisional.
  parts:
  - back_box
  - perfboard_carrier
  hardware:
  - carrier_screw
  - perfboard
  - esp32
  tool: 2.5 mm hex key
- n: '5'
  text: Temporarily position disk on post tops and test actual charger-plug insertion
    unpowered. Check full insertion/removal, finger access, cable bend, underside
    solder clearance and at least 3 mm clearance between disk rear components and
    electronics/wires. Disk back is 60 mm off wall; shell ends at 54 mm, leaving a
    deliberate 6 mm perimeter gap. This is not a sealed enclosure. If anything interferes,
    stop and revise dimensions rather than bending parts.
  parts:
  - back_box
  - perfboard_carrier
  hardware:
  - disk
  - perfboard
  - esp32
  tool: null
- n: '6'
  text: Remove perfboard, hold chosen carrier angle and snug central screw. Refit
    perfboard using four M2x6 screws. Start gently by hand and do not overtighten
    PLA. Confirm heads touch safe mounting areas only, at least 3 mm thread engages,
    and tips do not bottom. Assumed board thickness is 1.6 mm; verify actual fit and
    underside clearance.
  parts:
  - perfboard_carrier
  hardware:
  - carrier_screw
  - perfboard
  - pcb_screws
  tool: Correct driver for self-tapping screw heads
- n: '7'
  text: Route the four wires away from screw tips, sharp solder joints and keyholes,
    leaving a service loop. Place disk with input wires up (+y). Fit two M3x8 screws
    through central holes into post inserts. Verify at least 3 mm insert engagement,
    no bottoming and no component contact; snug only without flexing disk. Assumed
    disk thickness is 1.6 mm and remains unverified.
  parts:
  - back_box
  hardware:
  - disk
  - disk_screws
  - perfboard
  tool: 2.5 mm hex key
- n: '8'
  text: 'External wall interface: use the user''s confirmed #8 round-head screws with
    heads no larger than 9 mm and suitable 1/4-inch anchors, following their instructions
    for the wall substrate and assembled weight. These are not supplied printable-design
    hardware. Set screws level, 120 mm apart. Final screw centres are 64 mm above
    disk centre; head undersides about 3.5 mm off wall. Test empty box first: pass
    heads through round openings and lower box 9 mm to seat shafts at slot tops. Adjust
    gap to minimize wobble without binding. Do not substitute M3 machine screws for
    wall fixings.'
  parts:
  - back_box
  hardware: []
  tool: Level, ruler and wall-fixing tools appropriate to substrate
- n: '9'
  text: 'Hang assembled box on both external screws and gently check secure seating
    before release. Leave cable slack: upward cable pulls can lift keyholes free.
    Power only after mechanical checks. Independently verify wiring, charger rating
    and firmware current limit: 255 LEDs must not be assumed safe at full brightness
    through an ESP32 USB power path. Start dim and stop if wiring, connectors or PLA
    become hot. No electrical power-distribution validation is included.'
  parts:
  - back_box
  hardware:
  - disk
  - perfboard
  - esp32
  tool: null
- n: '10'
  text: For service unplug power, support box, lift 9 mm and remove from wall. Remove
    disk screws for electronics access. Do not support this box by a future unmeasured
    diffuser. Recheck heat and connector clearance before adding front/sides.
  parts:
  - back_box
  hardware:
  - disk_screws
  tool: null
