task: estoa-light
note: '224 mm back box, two disk posts, rotatable perfboard carrier and broad bottom
  service opening. No diffuser included. Available filament is black PLA; white PLA
  can use these files when obtained. Fit coupons were printed but their fit could
  not be reported. Disk thickness, rear-component envelope, underside solder and USB
  location remain unverified: complete mandatory dry-fit checks before fastening or
  powering. Electronics placements are provisional, including USB orientation. User-confirmed
  #8 wall screws and 1/4-inch anchors are external wall interfaces, omitted from hardware/assembly
  because the submission accepts only original hardware references. Their installed
  head-underside positions are (-60,64,3.5) and (60,64,3.5) mm, pointing into wall
  (-z).'
questions:
- text: Do mounting coupons fit?
  answer: Printed, but fit could not be reported.
- text: Actual disk thickness and rear-component height?
  answer: null
- text: Exact USB location and direction?
  answer: Not established. Carrier rotates; bottom opening is deliberately broad.
