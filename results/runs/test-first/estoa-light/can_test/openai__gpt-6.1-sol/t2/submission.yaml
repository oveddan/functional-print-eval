parts:
- id: rear_cup
  role: final
  material: 'PLA: black available; matte white if supplied'
  code: "def build(p):\n    import math\n    b=cq.Workplane('XY').circle(p.radius).extrude(p.base_t)\n\
    \    wall=cq.Workplane('XY').workplane(offset=p.base_t).circle(p.radius).circle(p.inner_radius).extrude(p.cup_h-p.base_t)\n\
    \    cutter=cq.Workplane('XY').box(4*p.radius,2*p.radius,p.cup_h+2,centered=(True,True,False)).translate((0,p.access_y-p.radius,p.base_t))\n\
    \    b=b.union(wall.cut(cutter))\n    for x in [-p.board_pitch_x/2,p.board_pitch_x/2]:\n\
    \        for y in [p.board_y-p.board_pitch_y/2,p.board_y+p.board_pitch_y/2]:\n\
    \            b=b.union(cq.Workplane('XY').workplane(offset=p.base_t).center(x,y).circle(p.board_boss_r).extrude(p.board_standoff_h))\n\
    \            b=b.cut(cq.Workplane('XY').workplane(offset=p.base_t+p.board_standoff_h-p.pilot_depth).center(x,y).circle(p.pilot_d/2).extrude(p.pilot_depth+1))\n\
    \    af=p.m3_nut_af+p.nut_allowance\n    ph=p.m3_nut_h+p.nut_axial_allowance\n\
    \    for a in [30,90,150]:\n        rad=math.radians(a)\n        x=p.rim_bolt_r*math.cos(rad);\
    \ y=p.rim_bolt_r*math.sin(rad)\n        b=b.union(cq.Workplane('XY').workplane(offset=p.base_t).center(x,y).circle(p.rim_boss_r).extrude(p.cup_h-p.base_t))\n\
    \        b=b.cut(cq.Workplane('XY').workplane(offset=p.cup_h-p.nut_roof-ph-1).center(x,y).circle(p.m3_clear_d/2).extrude(p.nut_roof+ph+2))\n\
    \        z=p.cup_h-p.nut_roof-ph\n        pocket=cq.Workplane('XY').workplane(offset=z).polygon(6,af/math.cos(math.pi/6)).extrude(ph).rotate((0,0,0),(0,0,1),a).translate((x,y,0))\n\
    \        slot=cq.Workplane('XY').box(2*p.rim_boss_r,af/math.cos(math.pi/6),ph,centered=(False,True,False)).translate((0,0,z)).rotate((0,0,0),(0,0,1),a).translate((x,y,0))\n\
    \        b=b.cut(pocket.union(slot))\n    for x in [-p.wall_half_spacing,p.wall_half_spacing]:\n\
    \        entry=cq.Workplane('XY').center(x,p.wall_entry_y).circle((p.wall_head_d+p.wall_entry_clear)/2).extrude(p.base_t+1)\n\
    \        slot=cq.Workplane('XY').center(x,p.wall_entry_y+p.wall_slot_travel/2).rect(p.wall_shank_d+p.wall_slot_clear,p.wall_slot_travel).extrude(p.base_t+1)\n\
    \        end=cq.Workplane('XY').center(x,p.wall_entry_y+p.wall_slot_travel).circle((p.wall_shank_d+p.wall_slot_clear)/2).extrude(p.base_t+1)\n\
    \        b=b.cut(entry.union(slot).union(end))\n    return b"
  print_orientation: Flat rear face z=0 on bed, open cup upward. Nut-entry roofs bridge
    less than 7 mm. No supports.
  use_orientation: 'Same axes as assembly: +y up wall, +z out toward disk; access
    opening downward.'
- id: disk_carrier
  role: final
  material: 'PLA: black available; matte white if supplied'
  code: "def build(p):\n    import math\n    b=cq.Workplane('XY').circle(p.radius).circle(p.carrier_inner_r).extrude(p.carrier_t)\n\
    \    spoke=cq.Workplane('XY').box(2*p.radius,p.spoke_w,p.carrier_t,centered=(True,True,False)).intersect(cq.Workplane('XY').circle(p.radius).extrude(p.carrier_t))\n\
    \    b=b.union(spoke)\n    h=p.carrier_t+p.disk_gap\n    for x in [-p.disk_pitch/2,p.disk_pitch/2]:\n\
    \        b=b.union(cq.Workplane('XY').center(x,0).circle(p.disk_boss_r).extrude(h))\n\
    \        b=b.cut(cq.Workplane('XY').center(x,0).circle(p.m3_clear_d/2).extrude(h+1))\n\
    \        b=b.cut(cq.Workplane('XY').center(x,0).polygon(6,(p.m3_nut_af+p.nut_allowance)/math.cos(math.pi/6)).extrude(p.m3_nut_h+p.nut_axial_allowance))\n\
    \    for a in [30,90,150]:\n        x=p.rim_bolt_r*math.cos(math.radians(a));\
    \ y=p.rim_bolt_r*math.sin(math.radians(a))\n        b=b.cut(cq.Workplane('XY').center(x,y).circle(p.m3_clear_d/2).extrude(p.carrier_t+1))\n\
    \    return b"
  print_orientation: Flat annulus/spoke back on bed at z=0, disk bosses upward. Nut
    pockets open to bed with short bridged roofs. No supports.
  use_orientation: Back at finished z55, boss tips at z71. Top rim hole points up.
