manual:
- n: '1'
  text: 'Print both parts in listed orientations: 0.2 mm layers, four walls, five
    top/bottom layers, 25% infill, no supports. Use black PLA available or obtain
    matte-white PLA. Clean hole rims and short nut-pocket bridges without enlarging
    keyhole necks.'
  parts:
  - rear_cup
  - disk_carrier
  hardware: []
  tool: Deburring tool
- n: '2'
  text: The coupon has NOT been verified. Dry-fit perfboard component side forward,
    USB pointing down. All four holes must align without bending; solder must clear
    base. Confirm M2 heads overlap holes and avoid traces. Test one screw gently;
    stop if binding or splitting and revise pilot diameter before proceeding.
  parts:
  - rear_cup
  hardware:
  - pcb
  - esp
  - pcb_screws
  tool: Small screwdriver
- n: '3'
  text: Slide three M3 nuts into cup's radial exterior slots and centre them under
    bores. Insert two M3 nuts into carrier underside pockets. Start matching screws
    by hand to verify threads, then remove screws. Hold nuts by fingertip if necessary;
    no adhesive needed.
  parts:
  - rear_cup
  - disk_carrier
  hardware:
  - nuts
  - rim_bolts
  - disk_bolts
  tool: null
- n: '4'
  text: Secure perfboard gently using four M2x6 screws. Assumed 1.6 mm board gives
    approximately 4.4 mm thread engagement. All components must remain at least 3
    mm below carrier underside z55. With cup against a wall, test the real USB plug
    through the bottom opening; port placement is unverified. If full insertion needs
    force, board movement or socket bending, stop and revise layout.
  parts:
  - rear_cup
  hardware:
  - pcb
  - esp
  - pcb_screws
  tool: Small screwdriver
- n: '5'
  text: Route the four disk wires through an open carrier sector with service slack,
    away from spoke and screw seats. Align top carrier hole with cup top boss. Attach
    carrier using three M3x12 screws and its side-loaded nuts; only snug. Do this
    BEFORE disk installation because disk covers rim screw heads.
  parts:
  - rear_cup
  - disk_carrier
  hardware:
  - disk
  - pcb
  - rim_bolts
  - nuts
  tool: 2.5 mm hex key
- n: '6'
  text: 'Power disconnected: place disk with input wires upward on two bosses. Verify
    bosses touch safe bare rear PCB, connector and wires clear carrier, and screw
    heads avoid LEDs/traces. Fit two M3x20 screws through disk into carrier nuts.
    Check tips clear electronics, then gently snug without flexing PCB. If thickness
    or rear components prevent safe seating, stop rather than clamping through interference.'
  parts:
  - disk_carrier
  hardware:
  - disk
  - disk_bolts
  - nuts
  tool: 2.5 mm hex key
- n: '7'
  text: 'Test external wall screws with empty cup before final installation. User''s
    #8 round-head screws with heads at most 9 mm must pass entry circles but not necks.
    Use the user''s 1/4-inch anchors only if suitable for wall and screws, following
    anchor instructions. Wall screw length and wall suitability are not established
    by this design.'
  parts:
  - rear_cup
  hardware: []
  tool: Drill and suitable wall-screw driver
- n: '8'
  text: 'Mark two wall screw axes 80 mm apart horizontally at equal height: finished
    enclosure coordinates x=-40,+40, y=47. These correspond to UPPER slot ends, not
    entry-circle centres. Leave about 3 mm plus sliding clearance below each head;
    test and adjust with cup removed. Head underside nominally z3, shaft points toward
    wall (-z).'
  parts:
  - rear_cup
  hardware: []
  tool: Level and wall-screw driver
- n: '9'
  text: 'Reassemble light if needed. Pass wall screw heads through lower round entries,
    then lower enclosure 12 mm so shafts reach upper slot ends. Verify both retain
    the enclosure and it rests flat. No anti-lift lock is provided: avoid locations
    where it may be knocked upward.'
  parts:
  - rear_cup
  - disk_carrier
  hardware: []
  tool: null
- n: '10'
  text: Insert low-voltage USB-C lead from below with slack so it does not pull socket.
    Use existing correctly wired electronics and current limiting appropriate to supply,
    LED disk, wiring and connectors; 255 LEDs at full white may exceed ordinary USB
    power. Run supervised low-brightness test and check for heating; PLA must stay
    cool. This is not sealed or mains-rated. Unplug before servicing; remove disk
    first to access the three carrier screws.
  parts:
  - rear_cup
  - disk_carrier
  hardware:
  - disk
  - pcb
  - esp
  tool: null
