task: estoa-light
note: 'Rear enclosure only: open-bottom cup plus removable disk carrier, no diffuser.
  Print in available black PLA, or obtain matte-white PLA for requested colour. User-supplied
  wall screws/anchors are external installation fixtures, represented by world parameters
  rather than catalog hardware. Their final shaft centres are (-40,47) and (40,47);
  underside of heads approximately z3, pointing into wall. Fit is provisional: the
  coupon was printed but not evaluated. Unmeasured thicknesses and USB placement are
  explicit assumptions; complete dry-fit checks before tightening or powering.'
questions:
- text: Disk and perfboard thickness, rear connector envelope, tallest component and
    exact USB position?
  answer: Not established. Provisional thicknesses and broad underside access used;
    physical checks required.
- text: Coupon fit verified?
  answer: Printed but user could not assess it.
- text: White PLA available?
  answer: null
