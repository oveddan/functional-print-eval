parts:
- id: tray
  role: final
  material: PLA matte white
  code: "import math\ndef build(p):\n    W = cq.Workplane\n    R = p.box_d/2; Ri =\
    \ R - p.wall_t; H = p.floor_t + p.inner_h\n    t = W('XY').circle(R).extrude(H)\n\
    \    t = t.cut(W('XY').workplane(offset=p.floor_t).circle(Ri).extrude(H))\n  \
    \  cols = [(p.col_r*math.cos(math.radians(a)), p.col_r*math.sin(math.radians(a)))\
    \ for a in (90, 210, 330)]\n    for x, y in cols:\n        t = t.union(W('XY').center(x,\
    \ y).circle(p.col_d/2).extrude(H))\n    t = t.intersect(W('XY').circle(R).extrude(H))\n\
    \    for x, y in cols:\n        t = t.cut(W('XY').center(x, y).circle(p.m3_clear_d/2).extrude(H+1))\n\
    \        t = t.cut(W('XY').center(x, y).circle(p.cbore_d/2).extrude(p.cbore_depth))\n\
    \    e = p.pb_hole_gap + p.pb_hole_d/2\n    hx = p.pb_w/2 - e; hy = p.pb_l/2 -\
    \ e\n    for sx in (-1, 1):\n        for sy in (-1, 1):\n            x = sx*hx;\
    \ y = p.pb_y + sy*hy\n            t = t.union(W('XY').workplane(offset=p.floor_t-0.01).center(x,\
    \ y).circle(p.boss_d/2).extrude(p.standoff_h+0.01))\n            t = t.cut(W('XY').workplane(offset=1.0).center(x,\
    \ y).circle(p.m2_pilot_d/2).extrude(p.floor_t+p.standoff_h))\n    for sx in (-1,\
    \ 1):\n        x = sx*p.key_x\n        t = t.cut(W('XY').workplane(offset=-0.5).center(x,\
    \ p.key_y).circle(p.wall_head_d/2+0.5).extrude(p.floor_t+1))\n        t = t.cut(W('XY').workplane(offset=-0.5).center(x,\
    \ p.key_y+p.key_travel/2).rect(p.wall_shank_d+0.5, p.key_travel).extrude(p.floor_t+1))\n\
    \    pz = p.floor_t + p.standoff_h + p.pb_t + p.usb_bottom_h + p.usb_h/2\n   \
    \ z0 = pz - p.usb_cut_h/2\n    t = t.cut(W('XY').workplane(offset=z0).center(p.usb_x,\
    \ -R).rect(p.usb_cut_w, 2*p.wall_t+6).extrude(H))\n    return t\n"
  print_orientation: back (wall side) face on the bed, open side up
  use_orientation: back flat against the wall, open side facing out, USB notch at
    the bottom
- id: lid
  role: final
  material: PLA matte white
  code: "import math\ndef build(p):\n    W = cq.Workplane\n    R = p.box_d/2; Ri =\
    \ R - p.wall_t\n    L = W('XY').circle(R).extrude(p.lid_t)\n    lip = W('XY').workplane(offset=p.lid_t-0.01).circle(Ri-p.fit_gap).circle(Ri-p.fit_gap-p.lip_w).extrude(p.lip_h+0.01)\n\
    \    cols = [(p.col_r*math.cos(math.radians(a)), -p.col_r*math.sin(math.radians(a)))\
    \ for a in (90, 210, 330)]\n    for x, y in cols:\n        lip = lip.cut(W('XY').center(x,\
    \ y).circle(p.col_d/2+0.6).extrude(50))\n    lip = lip.cut(W('XY').center(p.usb_x,\
    \ R).rect(p.usb_cut_w+2, 20).extrude(50))\n    L = L.union(lip)\n    for sx in\
    \ (-1, 1):\n        L = L.cut(W('XY').workplane(offset=-0.5).center(sx*p.disc_hole_pitch/2,\
    \ 0).circle(p.insert_hole_d/2).extrude(p.lid_t+1))\n    for x, y in cols:\n  \
    \      L = L.cut(W('XY').workplane(offset=p.lid_t-p.insert_len-0.6).center(x,\
    \ y).circle(p.insert_hole_d/2).extrude(50))\n    L = L.cut(W('XY').workplane(offset=-0.5).center(0,\
    \ -(p.slot_r0+p.slot_r1)/2).rect(p.slot_w, p.slot_r1-p.slot_r0).extrude(50))\n\
    \    return L\n"
  print_orientation: front face (disc side) on the bed, locating lip up
  use_orientation: sits on the tray rim, lip inside the tray; disc screwed to its
    front face; wire slot towards the top (12 o'clock)
