manual:
- n: '1'
  text: Print the tray (back face down) and the lid (front face down, lip up) in matte
    white PLA. No supports needed.
  parts:
  - tray
  - lid
  hardware: []
  tool: null
- n: '2'
  text: Lay the disc on the lid's front face with its wires towards the wire slot
    (12 o'clock). Check that its two holes line up with the two holes near the lid's
    centre.
  parts:
  - lid
  hardware:
  - disc
  tool: null
- n: '3'
  text: 'Use a soldering iron to press heat-set inserts into the lid: two from the
    front face into the centre holes, and three from the back into the holes inside
    the lip near the rim. Press them flush and let them cool.'
  parts:
  - lid
  hardware:
  - insert
  tool: soldering iron with insert tip
- n: '4'
  text: Screw the perfboard, ESP32 side up, onto the four bosses with the M2 self-tapping
    screws. Its USB-C port end goes towards the notch at the bottom of the tray wall.
    Don't overtighten.
  parts:
  - tray
  hardware:
  - pb
  - pb_screw
  tool: small screwdriver
- n: '5'
  text: Push the charger plug through the notch into the ESP32 port to check it fits,
    then unplug it.
  parts:
  - tray
  hardware:
  - esp
  tool: null
- n: '6'
  text: Pass the disc's four wires through the lid's wire slot from the back. Seat
    the lid on the tray with its lip inside the wall and the wire slot at the top.
    From the back of the tray, drive the three M3x30 screws through the columns into
    the lid's inserts.
  parts:
  - tray
  - lid
  hardware:
  - lid_screw
  tool: 2.5 mm hex key
- n: '7'
  text: Connect the wires to the disc. Lay the disc LED side out on the lid, wires
    at 12 o'clock, and fix it with the two M3x6 screws into the centre inserts.
  parts:
  - lid
  hardware:
  - disc
  - disc_screw
  tool: 2.5 mm hex key
- n: '8'
  text: 'Put two #8 screws in the wall, 72 mm apart and level, leaving about 3.5 mm
    between each head and the wall. Put the box''s large keyhole openings over the
    heads and slide it down. Plug in the charger through the bottom notch.'
  parts:
  - tray
  hardware: []
  tool: null
