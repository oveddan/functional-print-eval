task: estoa-light
note: 'Assumptions to check: the disc diameter (102 mm) comes from its part number.
  The perfboard thickness and the height of the solder joints underneath are guesses.
  I couldn''t confirm which side of the board''s centre line the USB-C port is on,
  or how far it sits back from the board edge, so the bottom notch is 28 mm wide and
  centred on the board. The board''s port edge sits 8.6 mm inside the wall. Where
  the disc''s back connector sits wasn''t measured either. The lid has an 18 mm wide
  slot from near the centre out towards 12 o''clock. If the connector is elsewhere,
  the disc won''t sit flat. Lid screws go in from the back, so the lid only comes
  off once the box is down off the wall. The future frosted sides need a matching
  cut-out at the bottom for the USB plug.'
