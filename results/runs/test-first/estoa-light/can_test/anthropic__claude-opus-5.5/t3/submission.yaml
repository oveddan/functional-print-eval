task: estoa-light
note: 'Box is 100 mm across and 38 mm deep. A round shell (front plus sides) screws
  onto a flat back plate with three M3 screws into heat-set inserts. The disc screws
  onto two inserts in the front. Guesses: the disc''s diameter (not measured, so I
  kept the box at 100 mm), the disc and perfboard thickness (1.6 mm), the ESP32 port
  sitting level with its board end, and which side of the ESP32 the port is on. That''s
  why the USB notch is 44 mm wide. The future frosted sides need a matching opening
  at the bottom. Check that nothing besides the connector sticks out of the disc''s
  back face more than 0.5 mm.'
