manual:
- n: '1'
  text: Print the shell with its front face on the bed and the back plate with its
    wall face on the bed, in matte white PLA, no supports.
  parts:
  - shell
  - back_plate
  hardware: []
  tool: null
- n: '2'
  text: 'Heat-set the inserts: one into each of the two holes in the shell''s front
    face (at 3 and 9 o''clock, pressed in from the outside) and one into the top of
    each of the three bosses around the inside of the rim.'
  parts:
  - shell
  hardware:
  - insert
  tool: soldering iron with insert tip
- n: '3'
  text: Put the perfboard ESP32-side up on the back plate's four standoffs, with the
    USB-C end facing the side away from the keyholes (the bottom), and fix it with
    the four M2x6 self-tapping screws.
  parts:
  - back_plate
  hardware:
  - pb_screw
  - perfboard
  - esp32
  tool: small screwdriver
- n: '4'
  text: Feed the four disc wires out through the rectangular opening in the shell's
    front face and plug them into the disc. Put the disc's back face on the shell's
    front with the wires at 12 o'clock (above the opening), line up its two centre
    holes with the inserts and screw on with two M3x8 screws. Don't overtighten.
  parts:
  - shell
  hardware:
  - disc
  - disc_screw
  tool: 2.5 mm hex key
- n: '5'
  text: Set the shell's rim on the back plate, with the wide notch in the wall over
    the ESP32's USB-C port (bottom) and the rim bosses over the three pads. From the
    wall side, drive three M3x8 screws through the counterbored holes into the rim
    inserts.
  parts:
  - shell
  - back_plate
  hardware:
  - joint_screw
  tool: 2.5 mm hex key
- n: '6'
  text: 'Hang it: put two #8 screws in the wall 64 mm apart and level, with their
    heads about 3.5 mm out from the wall. Put the heads into the round keyhole entries,
    push the box against the wall and let it slide down about 10 mm onto the slots.
    Plug the USB-C charger into the ESP32 through the notch at the bottom.'
  parts: []
  hardware: []
  tool: null
