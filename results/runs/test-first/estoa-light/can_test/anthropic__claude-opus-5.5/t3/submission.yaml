parts:
- id: shell
  role: final
  material: PLA (matte white)
  code: "import math\ndef build(p):\n    R=p.box_od/2; Ri=R-p.wall_t; H=p.shell_h\n\
    \    s=cq.Workplane('XY').circle(R).extrude(H)\n    s=s.cut(cq.Workplane('XY').workplane(offset=p.front_t).circle(Ri).extrude(H))\n\
    \    for x in (-p.disc_hole_pitch/2, p.disc_hole_pitch/2):\n        s=s.union(cq.Workplane('XY').center(x,0).circle(p.disc_boss_d/2).extrude(p.front_t+p.disc_boss_h))\n\
    \        s=s.cut(cq.Workplane('XY').center(x,0).circle(p.insert_hole_d/2).extrude(p.disc_insert_depth))\n\
    \    bh=H-p.pad_h\n    for a in (90,210,330):\n        x=p.joint_r*math.cos(math.radians(a));\
    \ y=p.joint_r*math.sin(math.radians(a))\n        s=s.union(cq.Workplane('XY').center(x,y).circle(p.joint_boss_d/2).extrude(bh))\n\
    \        s=s.cut(cq.Workplane('XY').workplane(offset=bh-p.joint_hole_depth).center(x,y).circle(p.insert_hole_d/2).extrude(p.joint_hole_depth+1))\n\
    \    s=s.cut(cq.Workplane('XY').center(0,(p.wire_hole_y0+p.wire_hole_y1)/2).rect(p.wire_hole_w,p.wire_hole_y1-p.wire_hole_y0).extrude(p.front_t+0.5))\n\
    \    z0=(p.back_t+H)-p.notch_top_box\n    s=s.cut(cq.Workplane('XY').workplane(offset=z0).center(0,-(R+Ri-8)/2-1).rect(p.notch_w,(R-(Ri-8))+2).extrude(H))\n\
    \    return s\n"
  print_orientation: front face (disc side) on the bed, open rim up
  use_orientation: front face against the disc's back, rim towards the wall
- id: back_plate
  role: final
  material: PLA (matte white)
  code: "import math\ndef build(p):\n    R=p.box_od/2\n    b=cq.Workplane('XY').circle(R).extrude(p.back_t)\n\
    \    for a in (90,210,330):\n        x=p.joint_r*math.cos(math.radians(a)); y=p.joint_r*math.sin(math.radians(a))\n\
    \        b=b.union(cq.Workplane('XY').workplane(offset=p.back_t).center(x,y).circle(p.pad_d/2).extrude(p.pad_h))\n\
    \        b=b.cut(cq.Workplane('XY').center(x,y).circle(p.m3_clear_d/2).extrude(p.back_t+p.pad_h+1))\n\
    \        b=b.cut(cq.Workplane('XY').center(x,y).circle(p.cb_d/2).extrude(p.cb_depth))\n\
    \    sx=p.pb_w/2-p.pb_hole_edge-p.pb_hole_d/2; sy=p.pb_l/2-p.pb_hole_edge-p.pb_hole_d/2\n\
    \    for x in (-sx,sx):\n        for y in (p.pb_yc-sy,p.pb_yc+sy):\n         \
    \   b=b.union(cq.Workplane('XY').workplane(offset=p.back_t).center(x,y).circle(p.standoff_d/2).extrude(p.standoff_h))\n\
    \            b=b.cut(cq.Workplane('XY').workplane(offset=p.back_t+p.standoff_h-p.m2_pilot_depth).center(x,y).circle(p.m2_pilot_d/2).extrude(p.m2_pilot_depth+1))\n\
    \    L=p.key_slot_len; bh=p.back_t+p.key_pocket_h+p.key_roof\n    for x in (-p.key_x,p.key_x):\n\
    \        ow=p.key_pocket_w+2*p.key_wall\n        b=b.union(cq.Workplane('XY').center(x,L/2).slot2D(L+ow,ow,90).extrude(bh))\n\
    \        b=b.cut(cq.Workplane('XY').center(x,0).circle(p.key_entry_d/2).extrude(p.back_t+0.01))\n\
    \        b=b.cut(cq.Workplane('XY').center(x,L/2).slot2D(L+p.key_slot_w,p.key_slot_w,90).extrude(p.back_t+0.01))\n\
    \        b=b.cut(cq.Workplane('XY').workplane(offset=p.back_t).center(x,L/2).slot2D(L+p.key_pocket_w,p.key_pocket_w,90).extrude(p.key_pocket_h))\n\
    \    return b\n"
  print_orientation: wall face on the bed
  use_orientation: flat against the wall, keyhole slots running upwards from the round
    entry holes
