task: estoa-light
note: 'Assumptions to check: the disk''s diameter (240 mm, from the datasheet) and
  thickness (1.6 mm) are not measured. The box is 180 mm across so it stays hidden
  behind the disk. Where the USB port sits on the perfboard was read from ambiguous
  measurements, so the bottom notch is 26 mm wide and open at the top: the plug''s
  grip slides in no matter which side of centre the port is on.'
questions:
- text: Is the disk really about 240 mm across? If it's smaller than 180 mm, the box
    needs shrinking.
  answer: null
- text: Where does the disk's 4-pin connector sit, and how far from the centre?
  answer: null
