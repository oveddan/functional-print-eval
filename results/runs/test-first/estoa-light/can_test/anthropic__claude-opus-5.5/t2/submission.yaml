parts:
- id: back_box
  role: final
  material: PLA matte white
  code: "def build(p):\n    R = p.box_od/2\n    H = p.box_h\n    fy = p.flat_y\n \
    \   w = p.wall\n    bt = p.back_t\n    outer = cq.Workplane('XY').circle(R).extrude(H)\n\
    \    clip = cq.Workplane('XY').center(0, (R-fy)/2).rect(2*R+2, R+fy).extrude(H)\n\
    \    body = outer.intersect(clip)\n    Ri = R - w\n    fyi = fy - w\n    inner\
    \ = cq.Workplane('XY').workplane(offset=bt).circle(Ri).extrude(H)\n    iclip =\
    \ cq.Workplane('XY').workplane(offset=bt).center(0, (Ri-fyi)/2).rect(2*Ri+2, Ri+fyi).extrude(H)\n\
    \    body = body.cut(inner.intersect(iclip))\n    hx = p.disk_hole_pitch/2\n \
    \   pts = [(hx, 0), (-hx, 0)]\n    body = body.union(cq.Workplane('XY').pushPoints(pts).circle(p.boss_d/2).extrude(H))\n\
    \    body = body.union(cq.Workplane('XY').box(2*hx, p.rib_w, H, centered=(True,\
    \ True, False)))\n    body = body.cut(cq.Workplane('XY').workplane(offset=H-p.insert_depth).pushPoints(pts).circle(p.insert_hole_d/2).extrude(p.insert_depth+1))\n\
    \    sx = p.pb_hole_sx/2\n    sy = p.pb_hole_sy/2\n    spts = [(sx, p.pb_cy+sy),\
    \ (-sx, p.pb_cy+sy), (sx, p.pb_cy-sy), (-sx, p.pb_cy-sy)]\n    st = bt + p.standoff_h\n\
    \    body = body.union(cq.Workplane('XY').pushPoints(spts).circle(p.standoff_d/2).extrude(st))\n\
    \    body = body.cut(cq.Workplane('XY').workplane(offset=1).pushPoints(spts).circle(p.m2_pilot_d/2).extrude(st))\n\
    \    kpts = [(p.key_x, p.key_y), (-p.key_x, p.key_y)]\n    for (kx, ky) in kpts:\n\
    \        pad = cq.Workplane('XY').center(kx, ky + p.key_travel/2).rect(p.key_head_hole+10,\
    \ p.key_travel+p.key_head_hole+10).extrude(p.key_pad_h)\n        body = body.union(pad)\n\
    \    for (kx, ky) in kpts:\n        cy = ky + p.key_travel/2\n        rec = cq.Workplane('XY').center(kx,\
    \ cy).slot2D(p.key_travel+p.key_head_hole, p.key_head_hole, 90).extrude(p.key_recess_h)\n\
    \        slot = cq.Workplane('XY').center(kx, cy).slot2D(p.key_travel+p.key_slot_w,\
    \ p.key_slot_w, 90).extrude(p.key_pad_h+1)\n        hole = cq.Workplane('XY').center(kx,\
    \ ky).circle(p.key_head_hole/2).extrude(p.key_pad_h+1)\n        body = body.cut(rec).cut(slot).cut(hole)\n\
    \    port_z = bt + p.standoff_h + p.pb_t + p.usb_bottom_h + p.usb_h/2\n    nb\
    \ = port_z - p.usb_notch_below\n    notch = cq.Workplane('XY').box(p.usb_notch_w,\
    \ w+2, H-nb+1, centered=(True, True, False)).translate((0, -fy+w/2, nb))\n   \
    \ body = body.cut(notch)\n    wn = cq.Workplane('XY').box(p.wire_notch_w, 8, p.wire_notch_d+1,\
    \ centered=(True, True, False)).translate((0, R-w/2, H-p.wire_notch_d))\n    body\
    \ = body.cut(wn)\n    return body\n"
  print_orientation: back face (the wall side) on the bed, open side up; no supports.
    The keyhole recess roofs are 10.5 mm bridges
  use_orientation: back against the wall, open side facing out with the disk across
    it, flat edge and USB notch at the bottom
- id: fit_coupon
  role: coupon
  material: PLA matte white
  code: "def build(p):\n    base = cq.Workplane('XY').box(70, 34, p.back_t, centered=(True,\
    \ True, False))\n    base = base.union(cq.Workplane('XY').center(-25, 0).circle(p.boss_d/2).extrude(12))\n\
    \    base = base.cut(cq.Workplane('XY').workplane(offset=12-p.insert_depth).center(-25,\
    \ 0).circle(p.insert_hole_d/2).extrude(p.insert_depth+1))\n    st = p.back_t +\
    \ p.standoff_h\n    base = base.union(cq.Workplane('XY').center(-8, 0).circle(p.standoff_d/2).extrude(st))\n\
    \    base = base.cut(cq.Workplane('XY').workplane(offset=1).center(-8, 0).circle(p.m2_pilot_d/2).extrude(st))\n\
    \    kx = 18\n    ky = -p.key_travel/2\n    cy = 0\n    base = base.union(cq.Workplane('XY').center(kx,\
    \ cy).rect(p.key_head_hole+10, 32).extrude(p.key_pad_h))\n    base = base.cut(cq.Workplane('XY').center(kx,\
    \ cy).slot2D(p.key_travel+p.key_head_hole, p.key_head_hole, 90).extrude(p.key_recess_h))\n\
    \    base = base.cut(cq.Workplane('XY').center(kx, cy).slot2D(p.key_travel+p.key_slot_w,\
    \ p.key_slot_w, 90).extrude(p.key_pad_h+1))\n    base = base.cut(cq.Workplane('XY').center(kx,\
    \ ky).circle(p.key_head_hole/2).extrude(p.key_pad_h+1))\n    return base\n"
  print_orientation: flat on the bed, bosses up
  use_orientation: 'test only: one heat-set insert boss, one M2 standoff and one keyhole'
