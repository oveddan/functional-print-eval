manual:
- n: '1'
  text: Print fit_coupon first. Melt an M3 insert into its tall boss, drive an M2
    self-tapper into its short standoff, and hang its keyhole on one of your wall
    screws. If all three work, print back_box with the back face down. Brim is optional.
  parts:
  - fit_coupon
  hardware:
  - m3_insert
  - m2_screw
  tool: null
- n: '2'
  text: Using a soldering iron at about 220 °C, press one M3 heat-set insert into
    the top of each of the two centre bosses until it's flush.
  parts:
  - back_box
  hardware:
  - m3_insert
  tool: soldering iron with insert tip
- n: '3'
  text: Put the perfboard on the four standoffs with the ESP32 up and its USB-C port
    facing the flat bottom edge, toward the open notch. Fix it with four M2x6 self-tapping
    screws. Don't overtighten.
  parts:
  - back_box
  hardware:
  - m2_screw
  - perfboard
  - esp32
  tool: small Phillips screwdriver
- n: '4'
  text: Route the four wires up past the centre bosses to the top (12 o'clock). If
    the disk's connector sits outside the box's rim, pass the wires through the notch
    at the top.
  parts:
  - back_box
  hardware:
  - led_disk
  tool: null
- n: '5'
  text: Lay the disk LED-side out across the open front, with its input wires at the
    top. Line its two centre holes up with the inserts and fasten with two M3x6 socket
    screws. Snug them up only.
  parts:
  - back_box
  hardware:
  - m3_screw
  - led_disk
  tool: 2.5 mm hex key
- n: '6'
  text: Put the two wall screws in level and 100 mm apart. Leave the heads standing
    about 3 mm off the wall. Push the box's round keyholes over the heads and let
    it drop about 10 mm so it locks. Then plug the USB-C charger in through the bottom
    notch.
  parts:
  - back_box
  hardware: []
  tool: null
