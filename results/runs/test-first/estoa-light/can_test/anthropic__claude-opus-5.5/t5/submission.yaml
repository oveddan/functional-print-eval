manual:
- n: '1'
  text: Print fit_coupon first. Melt an M3 insert into its tall boss, run an M2 self-tapper
    into the short post, and try the keyhole on a wall screw left 3.5 mm proud. If
    all three work, go on. If not, tell me which one didn't.
  parts:
  - fit_coupon
  hardware:
  - disc_insert
  - pb_screw
  tool: soldering iron with insert tip
- n: '2'
  text: Print back_box with its front face on the bed and no brim. It is 241.6 mm
    across, so it only just fits. Print disc_spacer flat.
  parts:
  - back_box
  - disc_spacer
  hardware: []
  tool: null
- n: '3'
  text: Working from inside the box, melt the two M3 inserts into the two tall bosses
    at the centre until they sit flush with the boss tops.
  parts:
  - back_box
  hardware:
  - disc_insert
  tool: soldering iron with insert tip
- n: '4'
  text: Lay the perfboard on the four short posts with the ESP32 facing out of the
    open back and the USB-C end towards the wide notch at the bottom of the box. Fix
    it with the four M2x6 self-tapping screws.
  parts:
  - back_box
  hardware:
  - pb
  - esp
  - pb_screw
  tool: small Phillips screwdriver
- n: '5'
  text: 'Feed the four disc wires out through the slot in the front face, just above
    the perfboard. Put disc_spacer across the two holes at the centre of the front
    face, and lay the disc on it with its input wires pointing up (towards the keyholes).
    Connect the 4-pin connector, then screw the disc down with two M3x20 screws through
    the disc, the spacer and the front face into the inserts. Stop once they''re snug:
    the disc is a PCB.'
  parts:
  - back_box
  - disc_spacer
  hardware:
  - disc
  - disc_screw
  tool: 2.5 mm hex key
- n: '6'
  text: 'Put two #8 screws in the wall, 140 mm apart and level, each standing 3.5
    mm out. When the light is hung, its centre ends up 50 mm below them. Put the screw
    heads into the round holes in the two blocks on the back, then slide the box down
    so it sits flat against the wall. Plug the USB-C charger in through the notch
    at the bottom.'
  parts:
  - back_box
  hardware: []
  tool: null
