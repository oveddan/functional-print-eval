parts:
- id: back_box
  role: final
  material: PLA matte white
  code: "def build(p):\n    R = p.disc_d/2\n    D = p.box_depth\n    t = p.front_t\n\
    \    w = p.wall_t\n    box = cq.Workplane('XY').circle(R).extrude(D)\n    box\
    \ = box.cut(cq.Workplane('XY').workplane(offset=t).circle(R-w).extrude(D))\n \
    \   xs = [-p.disc_hole_pitch/2, p.disc_hole_pitch/2]\n    for x in xs:\n     \
    \   box = box.union(cq.Workplane('XY').workplane(offset=t).center(x,0).circle(p.boss_d/2).extrude(p.boss_h))\n\
    \    yc = p.pb_bottom_y + p.pb_l/2\n    pts = [(sx*p.pb_hole_dx/2, yc+sy*p.pb_hole_dy/2)\
    \ for sx in (-1,1) for sy in (-1,1)]\n    for (x,y) in pts:\n        box = box.union(cq.Workplane('XY').workplane(offset=t).center(x,y).circle(p.so_d/2).extrude(p.so_h))\n\
    \    for sx in (-1,1):\n        x = sx*p.kh_x\n        yc2 = p.kh_y - p.kh_drop/2\
    \ - 3\n        box = box.union(cq.Workplane('XY').workplane(offset=t).center(x,yc2).rect(24,34).extrude(D-t))\n\
    \    for x in xs:\n        box = box.cut(cq.Workplane('XY').center(x,0).circle(p.m3_clear/2).extrude(t+p.boss_h))\n\
    \        box = box.cut(cq.Workplane('XY').workplane(offset=t+p.boss_h-p.insert_hole_depth).center(x,0).circle(p.insert_hole_d/2).extrude(p.insert_hole_depth+1))\n\
    \    for (x,y) in pts:\n        box = box.cut(cq.Workplane('XY').workplane(offset=t+0.5).center(x,y).circle(p.m2_pilot/2).extrude(p.so_h))\n\
    \    box = box.cut(cq.Workplane('XY').center(0,(p.slot_y0+p.slot_y1)/2).rect(p.slot_w,p.slot_y1-p.slot_y0).extrude(t+1))\n\
    \    box = box.cut(cq.Workplane('XY').workplane(offset=D-p.notch_h).center(0,-R+5).rect(p.notch_w,20).extrude(p.notch_h+1))\n\
    \    hd = p.wall_screw_head_d+1.5\n    sd = p.wall_screw_shank_d+0.8\n    for\
    \ sx in (-1,1):\n        x = sx*p.kh_x\n        ym = p.kh_y - p.kh_drop/2\n  \
    \      box = box.cut(cq.Workplane('XY').workplane(offset=D-p.kh_lip-p.kh_cav).center(x,ym).slot2D(p.kh_drop+hd,hd,90).extrude(p.kh_cav))\n\
    \        box = box.cut(cq.Workplane('XY').workplane(offset=D-p.kh_lip-0.01).center(x,ym).slot2D(p.kh_drop+sd,sd,90).extrude(p.kh_lip+1))\n\
    \        box = box.cut(cq.Workplane('XY').workplane(offset=D-p.kh_lip-p.kh_cav).center(x,p.kh_y-p.kh_drop).circle(hd/2).extrude(p.kh_lip+p.kh_cav+1))\n\
    \    return box\n"
  print_orientation: front face (where the disc mounts) on the bed, open back facing
    up
  use_orientation: open back against the wall, front face out
- id: disc_spacer
  role: final
  material: PLA matte white
  code: "def build(p):\n    s = cq.Workplane('XY').slot2D(p.spacer_l,p.spacer_w,0).extrude(p.spacer_h)\n\
    \    for sx in (-1,1):\n        s = s.cut(cq.Workplane('XY').center(sx*p.disc_hole_pitch/2,0).circle(p.m3_clear/2).extrude(p.spacer_h+1))\n\
    \    return s\n"
  print_orientation: flat, either face on the bed
  use_orientation: between the disc's back and the box front, across the two disc
    holes
- id: fit_coupon
  role: coupon
  material: PLA matte white
  code: "def build(p):\n    t = p.front_t\n    H = 13\n    c = cq.Workplane('XY').rect(60,40).extrude(t)\n\
    \    c = c.union(cq.Workplane('XY').workplane(offset=t).center(-20,8).circle(p.boss_d/2).extrude(p.boss_h))\n\
    \    c = c.union(cq.Workplane('XY').workplane(offset=t).center(-20,-10).circle(p.so_d/2).extrude(p.so_h))\n\
    \    c = c.union(cq.Workplane('XY').workplane(offset=t).center(14,0).rect(24,34).extrude(H-t))\n\
    \    c = c.cut(cq.Workplane('XY').center(-20,8).circle(p.m3_clear/2).extrude(t+p.boss_h))\n\
    \    c = c.cut(cq.Workplane('XY').workplane(offset=t+p.boss_h-p.insert_hole_depth).center(-20,8).circle(p.insert_hole_d/2).extrude(p.insert_hole_depth+1))\n\
    \    c = c.cut(cq.Workplane('XY').workplane(offset=t+0.5).center(-20,-10).circle(p.m2_pilot/2).extrude(p.so_h))\n\
    \    hd = p.wall_screw_head_d+1.5\n    sd = p.wall_screw_shank_d+0.8\n    ym =\
    \ 3 - p.kh_drop/2 + 3\n    c = c.cut(cq.Workplane('XY').workplane(offset=H-p.kh_lip-p.kh_cav).center(14,ym).slot2D(p.kh_drop+hd,hd,90).extrude(p.kh_cav))\n\
    \    c = c.cut(cq.Workplane('XY').workplane(offset=H-p.kh_lip-0.01).center(14,ym).slot2D(p.kh_drop+sd,sd,90).extrude(p.kh_lip+1))\n\
    \    c = c.cut(cq.Workplane('XY').workplane(offset=H-p.kh_lip-p.kh_cav).center(14,ym-p.kh_drop/2).circle(hd/2).extrude(p.kh_lip+p.kh_cav+1))\n\
    \    return c\n"
  print_orientation: plate on the bed
  use_orientation: 'test only: insert boss, M2 standoff, keyhole'
