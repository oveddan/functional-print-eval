task: estoa-light
note: 'The open-backed box is a single print with the disc''s front face on the bed,
  and the wall closes the back. It is the same diameter as the disc, so the USB-C
  port can be reached through a notch at the bottom rim. When you design the frosted
  sides, leave a matching gap at 6 o''clock. Unverified: the PCB thicknesses (1.6
  mm guessed), where the disc''s connector sits, which side of centre the USB port
  is on (the 40 mm notch covers every option), and whether anything on the perfboard''s
  7.5 mm end strip stands taller than about 10.9 mm above the board, which would get
  in the plug''s way.'
