task: estoa-light
note: I worked out the disc diameter as about 241.6 mm (102.54 + 102.24 + 30.2 + 2x3.3).
  The disc's holes are 33.5 mm apart centre to centre. The box (110x100x36 mm) stays
  hidden behind the disc. I guessed the disc and perfboard thicknesses (1.6 mm) and
  the charger plug's width. We don't know which side of the centreline the ESP32's
  USB port is on, so the bottom notch is wide enough for both. I also assumed the
  port is at, or a little inside, the perfboard's short edge. I also don't know what's
  on the back of the disc. If something sticks out of it, it may have to go in the
  wire slot.
