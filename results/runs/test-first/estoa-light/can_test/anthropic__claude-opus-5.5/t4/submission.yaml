manual:
- n: '1'
  text: Print the tray with its back on the bed and the lid with its front (flat)
    face on the bed, in matte white PLA. No supports.
  parts:
  - tray
  - lid
  hardware: []
  tool: null
- n: '2'
  text: Heat-set an insert into the top of each of the tray's 4 corner bosses. Then
    heat-set 2 inserts into the lid's two centre holes, pressing them in from the
    lid's FRONT (flat) face so they finish flush with it.
  parts:
  - tray
  - lid
  hardware:
  - insert
  tool: soldering iron with insert tip
- n: '3'
  text: Screw the perfboard, ESP32 side up, onto the 4 standoffs using the M2 self-tapping
    screws. The ESP32's USB-C port goes at the end next to the wide notch in the bottom
    wall. Don't overtighten.
  parts:
  - tray
  hardware:
  - m2
  - pb
  - esp
  tool: small screwdriver
- n: '4'
  text: 'Put 2 #8 screws in your wall anchors, 80 mm apart and level, leaving the
    heads sticking out about 4 mm. Hook the tray''s keyholes over the heads and slide
    it down so it locks.'
  parts:
  - tray
  hardware: []
  tool: null
- n: '5'
  text: Run the 4 disc wires up through the slot at the top of the lid. Put the lid
    on the tray with its flat face out, and fix it with 4 M3x8 screws through the
    corner counterbores into the tray inserts.
  parts:
  - lid
  - tray
  hardware:
  - m3x8
  tool: 2.5 mm hex key
- n: '6'
  text: Plug the wires into the disc. Lay the disc with its LED side out and wires
    at 12 o'clock, holes over the lid's inserts, and screw it on with 2 M3x8 screws
    through its 3 and 9 o'clock holes. Slack wire can lie in the lid slot under the
    disc.
  parts:
  - lid
  hardware:
  - m3x8
  - disk
  tool: 2.5 mm hex key
- n: '7'
  text: Plug the USB-C charger in through the notch at the bottom of the box.
  parts: []
  hardware:
  - esp
  tool: null
