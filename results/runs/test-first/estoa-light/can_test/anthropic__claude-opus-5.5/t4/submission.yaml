parts:
- id: tray
  role: final
  material: PLA (matte white)
  code: "def build(p):\n    W, H, D = p.box_w, p.box_h, p.tray_h\n    t, b = p.wall_t,\
    \ p.back_t\n    body = cq.Workplane('XY').rect(W, H).extrude(D).edges('|Z').fillet(p.corner_r)\n\
    \    inner = cq.Workplane('XY').workplane(offset=b).rect(W-2*t, H-2*t).extrude(D).edges('|Z').fillet(p.corner_r-t)\n\
    \    body = body.cut(inner)\n    cx = W/2 - t - p.lid_boss_inset\n    cy = H/2\
    \ - t - p.lid_boss_inset\n    pts = [(sx*cx, sy*cy) for sx in (-1, 1) for sy in\
    \ (-1, 1)]\n    ztop = D - p.lid_boss_h\n    boss = cq.Workplane('XY').pushPoints(pts).circle(p.corner_boss_d/2).extrude(ztop)\n\
    \    body = body.union(boss)\n    ih = cq.Workplane('XY').workplane(offset=ztop\
    \ - p.insert_hole_depth).pushPoints(pts).circle(p.insert_hole_d/2).extrude(p.insert_hole_depth\
    \ + 1)\n    body = body.cut(ih)\n    hx = p.pb_w/2 - p.pb_hole_edge - p.pb_hole_d/2\n\
    \    hy = p.pb_l/2 - p.pb_hole_edge - p.pb_hole_d/2\n    pcy = -H/2 + t + p.pb_gap\
    \ + p.pb_l/2\n    spts = [(sx*hx, pcy + sy*hy) for sx in (-1, 1) for sy in (-1,\
    \ 1)]\n    so = cq.Workplane('XY').workplane(offset=b - 0.01).pushPoints(spts).circle(p.standoff_d/2).extrude(p.standoff_h\
    \ + 0.01)\n    body = body.union(so)\n    zt = b + p.standoff_h\n    pil = cq.Workplane('XY').workplane(offset=zt\
    \ - p.m2_pilot_depth).pushPoints(spts).circle(p.m2_pilot_d/2).extrude(p.m2_pilot_depth\
    \ + 1)\n    body = body.cut(pil)\n    for sx in (-1, 1):\n        kx = sx*p.key_x\n\
    \        e = cq.Workplane('XY').workplane(offset=-1).center(kx, p.key_y).circle(p.key_entry_d/2).extrude(b\
    \ + 2)\n        s = cq.Workplane('XY').workplane(offset=-1).center(kx, p.key_y\
    \ + p.key_slot_l/2).rect(p.key_slot_w, p.key_slot_l).extrude(b + 2)\n        s2\
    \ = cq.Workplane('XY').workplane(offset=-1).center(kx, p.key_y + p.key_slot_l).circle(p.key_slot_w/2).extrude(b\
    \ + 2)\n        body = body.cut(e).cut(s).cut(s2)\n    port_z = b + p.standoff_h\
    \ + p.pb_t + p.usb_bottom_h + p.usb_h/2\n    z0 = port_z - p.notch_half_h\n  \
    \  nw = 2*p.usb_x_off + p.plug_w + 2*p.notch_margin\n    notch = cq.Workplane('XY').box(nw,\
    \ 4*t, D - z0 + 1, centered=(True, True, False)).translate((0, -H/2, z0))\n  \
    \  body = body.cut(notch)\n    return body\n"
  print_orientation: back face on the bed, open side up
  use_orientation: back flat against the wall, open side facing out, USB notch at
    the bottom
- id: lid
  role: final
  material: PLA (matte white)
  code: "def build(p):\n    W, H = p.box_w, p.box_h\n    t = p.wall_t\n    L = p.lid_t\n\
    \    plate = cq.Workplane('XY').rect(W, H).extrude(L).edges('|Z').fillet(p.corner_r)\n\
    \    cx = W/2 - t - p.lid_boss_inset\n    cy = H/2 - t - p.lid_boss_inset\n  \
    \  pts = [(sx*cx, sy*cy) for sx in (-1, 1) for sy in (-1, 1)]\n    c = p.lid_fit_clear\n\
    \    pocket = cq.Workplane('XY').workplane(offset=L - 0.01).rect(W-2*t-2*c, H-2*t-2*c).extrude(p.lid_boss_h\
    \ + 0.01).edges('|Z').fillet(p.corner_r - t - c)\n    cb = cq.Workplane('XY').workplane(offset=L\
    \ - 0.01).pushPoints(pts).circle(p.corner_boss_d/2).extrude(p.lid_boss_h + 0.01).intersect(pocket)\n\
    \    lid = plate.union(cb)\n    tot = L + p.lid_boss_h\n    th = cq.Workplane('XY').workplane(offset=-1).pushPoints(pts).circle(p.m3_clear_d/2).extrude(tot\
    \ + 2)\n    cbore = cq.Workplane('XY').workplane(offset=-1).pushPoints(pts).circle((p.m3_head_d\
    \ + p.cbore_clear)/2).extrude(p.m3_head_h + 0.3 + 1)\n    lid = lid.cut(th).cut(cbore)\n\
    \    dx = (p.disc_hole_inner_gap + p.disc_hole_d)/2\n    dpts = [(-dx, 0), (dx,\
    \ 0)]\n    db = cq.Workplane('XY').workplane(offset=L - 0.01).pushPoints(dpts).circle(p.disc_boss_d/2).extrude(p.disc_boss_h\
    \ + 0.01)\n    lid = lid.union(db)\n    ih = cq.Workplane('XY').workplane(offset=-1).pushPoints(dpts).circle(p.insert_hole_d/2).extrude(L\
    \ + p.disc_boss_h + 2)\n    lid = lid.cut(ih)\n    sl = H/2 + 1 - p.wire_slot_y0\n\
    \    slot = cq.Workplane('XY').workplane(offset=-1).center(0, -(p.wire_slot_y0\
    \ + sl/2)).rect(p.wire_slot_w, sl).extrude(L + 2)\n    lid = lid.cut(slot)\n \
    \   return lid\n"
  print_orientation: front face (the face the disc sits on) on the bed, bosses up
  use_orientation: closes the front of the tray; disc screws onto its front face;
    wire slot at the top
