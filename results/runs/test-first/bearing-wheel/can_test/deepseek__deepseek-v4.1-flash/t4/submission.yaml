  fit_d2:
    value: 22.05
    unit: mm
    kind: design
    source: design
    note: fit coupon hole 2
  fit_d3:
    value: 22.2
    unit: mm
    kind: design
    source: design
    note: fit coupon hole 3
  fit_d4:
    value: 22.35
    unit: mm
    kind: design
    source: design
    note: fit coupon hole 4 (loosest); the person measured this one at 22.34 mm, which
