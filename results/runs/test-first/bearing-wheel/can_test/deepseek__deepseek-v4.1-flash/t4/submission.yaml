      on the 22 mm bearing'
  bearing_pocket_depth:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: made equal to the bearing width so each bearing seats on the web with its
      face flush with the wheel face
  web_bore_d:
    value: 13.0
    unit: mm
    kind: design
    source: design
    note: 0.6 mm larger than the 608 inner ring shoulder, so the web seats on the
      outer ring only and never clamps the inner rings
  web_t:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: 16 mm wheel minus 7 + 7 mm pockets
  bridge_span:
    value: 4.6
    unit: mm
    kind: design
    source: design
