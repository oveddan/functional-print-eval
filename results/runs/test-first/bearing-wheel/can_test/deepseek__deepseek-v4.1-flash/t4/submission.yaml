  hole_pitch:
    value: 24.0
    unit: mm
    kind: design
    source: design
    note: spacing of the four coupon holes
parts:
- id: wheel
  role: final
  material: PLA (high-speed, black)
  code: "import cadquery as cq\n\ndef build(p):\n    w = p.wheel_w\n    ro = p.wheel_od\
    \ / 2.0\n\n    # solid tread disc, z = 0 on the bed up to the full width\n   \
    \ wheel = cq.Workplane(\"XY\").circle(ro).extrude(w)\n\n    # soften both tread\
    \ edges while the only circular edges are the two rims\n    try:\n        wheel\
    \ = wheel.edges(\"%CIRCLE\").chamfer(p.rim_chamfer)\n    except Exception:\n \
    \       pass\n\n    # one bearing pocket from each face: each bearing seats on\
    \ the web\n    wheel = (wheel.faces(\">Z\").workplane()\n             .circle(p.bearing_pocket_d\
    \ / 2.0)\n             .cutBlind(-p.bearing_pocket_depth))\n    wheel = (wheel.faces(\"\
    <Z\").workplane()\n             .circle(p.bearing_pocket_d / 2.0)\n          \
    \   .cutBlind(-p.bearing_pocket_depth))\n\n    # central bore through the 2 mm\
    \ web: bigger than the bearing's inner\n    # ring so the web bears on the outer\
    \ ring only\n    wheel = (wheel.faces(\">Z\").workplane()\n             .circle(p.web_bore_d\
    \ / 2.0)\n             .cutBlind(-(w + 1.0)))\n    return wheel"
  print_orientation: 'lying flat, axis vertical: the z = 0 face (the lower bearing
    pocket, mouth down) on the bed. No supports - the only overhang is the 2 mm web
    ring cantilevering 4.6 mm inward over the lower pocket, far under the 50 mm bridge
    the printer handles.'
  use_orientation: fitted on the M8 axle, axle horizontal, the Ø50 tread running in
    the door's track; each pocket holds one 608ZZ, outer rings seated on the web's
    shoulders.
- id: collar
  role: final
  material: PLA (high-speed, black)
  code: "import cadquery as cq\n\ndef build(p):\n    # print two of these: one each\
    \ side of the wheel\n    return (cq.Workplane(\"XY\")\n            .circle(p.collar_od\
    \ / 2.0)\n            .circle(p.collar_id / 2.0)\n            .extrude(p.collar_t))"
  print_orientation: flat, axis vertical, z = 0 on the bed (a thin ring standing 1.5
    mm tall). Print 2.
  use_orientation: on the M8 bolt, between the bolt head / washer and the outer face
    of each bearing; its 11.6 mm face presses the bearing's inner ring only.
- id: spacer
  role: final
  material: PLA (high-speed, black)
  code: "import cadquery as cq\n\ndef build(p):\n    return (cq.Workplane(\"XY\")\n\
    \            .circle(p.spacer_od / 2.0)\n            .circle(p.spacer_id / 2.0)\n\
    \            .extrude(p.spacer_len))"
  print_orientation: flat, axis vertical, z = 0 on the bed (a 2 mm tall ring). Print
    1.
  use_orientation: inside the wheel's web bore, lying between the two bearings' inner
    rings; it carries the clamp load so the inner rings cannot squeeze the outer rings.
- id: fit_coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "import cadquery as cq\n\ndef build(p):\n    plate = cq.Workplane(\"XY\").box(p.plate_len,\
    \ p.plate_w, p.plate_t)\n    plate = plate.translate((0, 0, p.plate_t / 2.0))\n\
    \    dias = [p.fit_d1, p.fit_d2, p.fit_d3, p.fit_d4]\n    for i, dia in enumerate(dias):\n\
    \        plate = (plate.faces(\">Z\").workplane()\n                 .center((i\
    \ - 1.5) * p.hole_pitch, 0.0)\n                 .circle(dia / 2.0)\n         \
    \        .cutBlind(-(p.plate_t + 5.0)))\n    return plate"
  print_orientation: flat as modelled, 104 x 28 face on the bed, holes vertical, same
    PLA and layer height as the wheel. No supports.
  use_orientation: 'test only: press a 608ZZ into each hole. Left to right: 21.9,
    22.05, 22.2, 22.35 mm. The wheel is printed with 21.9 mm pockets.'
hardware:
- id: axle_bolt
  ref: ISO 4762 M8x45
  qty: 1
- id: lock_nut
  ref: ISO 10511 M8
  qty: 1
- id: washer
  ref: ISO 7089 M8
  qty: 2
- id: bearing_a
  ref: 608ZZ
  qty: 1
- id: bearing_b
  ref: 608ZZ
  qty: 1
joints:
- id: axle
  fastener: axle_bolt
  axis_origin:
  - 0.0
  - 0.0
  - -1.5
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel
    feature: central Ø13 bore and both Ø21.9 bearing pockets - the bolt passes straight
      through with 2.5 mm of radial clearance
    role: clearance
  nut: lock_nut
  external: 'the door hanger''s axle hole (~Ø8.5 through a ~3 mm plate): the bolt
    passes through it and the washer/lock nut clamp it. The two printed collars sit
    between the bolt head / washer and the bearings'' inner rings.'
criteria:
- id: c1
  part: wheel
  feature: each Ø21.9 x 7 mm bearing pocket
  relation: contains
  hardware: bearing_a
  clearance_mm: -0.1
  params:
  - bearing_pocket_d
  - bearing_od
  check:
    method: coupon
    ref: fit_coupon
    description: '0.1 mm diametral interference grip on the 22 mm bearing. Confirmed
      by the coupon: the person''s 22.35 mm hole printed at 22.34 mm, so holes come
      out at nominal and 21.9 mm gives the intended press.'
- id: c2
  part: wheel
  feature: pocket depth
  relation: seats
  hardware: bearing_a
  clearance_mm: 0.0
  params:
  - bearing_pocket_depth
  - bearing_w
  check:
    method: template
    ref: null
    description: pocket depth equals the bearing width, so each bearing's outer face
      finishes flush with the wheel's face and the outer ring seats squarely on the
      web.
- id: c3
  part: wheel
  feature: Ø13 web bore
  relation: clears
  hardware: bearing_a
  clearance_mm: 0.6
  params:
  - web_bore_d
  - bearing_inner_ring_od
  check:
    method: template
    ref: null
    description: the web bore is 0.6 mm larger than the 608's inner-ring shoulder,
      so the web contacts the outer ring only. If it gripped the inner ring, the nut's
      clamp load would pass through the wheel and seize the bearing.
- id: c4
  part: collar
  feature: Ø11.6 outer face
  relation: clears
  hardware: bearing_a
  clearance_mm: 0.4
  params:
  - collar_od
  - bearing_inner_ring_od
  check:
    method: template
    ref: null
    description: the collar is 0.4 mm smaller than the bearing's inner-ring shoulder,
      so it presses the inner ring alone and cannot rub the outer ring or the shield.
- id: c5
  part: collar
  feature: Ø8.5 bore
  relation: clears
  hardware: axle_bolt
  clearance_mm: 0.25
  params:
  - collar_id
  - axle_bolt_d
  check:
    method: template
    ref: null
    description: slip fit over the measured 8 mm shank (the spacer uses the same bore).
- id: c6
  part: wheel
  feature: Ø13 web bore
  relation: clears
  hardware: axle_bolt
  clearance_mm: 2.5
  params:
  - web_bore_d
  - axle_bolt_d
  check:
    method: template
    ref: null
    description: 'the wheel never touches the bolt: the axle runs on the two bearing
      bores, not on the printed hub.'
- id: c7
  part: wheel
  feature: axle bolt's smooth shank under the bearings
  relation: supports
  hardware: null
  clearance_mm: 0.5
  params:
  - axle_bolt_len
  - thread_len_m8
  - collar_t
  - bearing_w
  - spacer_len
  check:
    method: template
    ref: null
    description: bearings occupy 1.5 to 17.5 mm from under the head. M8 is threaded
      for its last 28 mm, so a 45 mm bolt gives a 17 mm shank - the first bearing
      is fully on it and the second misses by 0.5 mm; a 50 mm bolt covers both. Flagged
      as an open question.
- id: c8
  part: wheel
  feature: 2 mm web ring over the lower bearing pocket
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - bearing_pocket_d
  - web_bore_d
  - bridge_span
  check:
    method: template
    ref: null
    description: the web's ring cantilevers 4.6 mm over the pocket at print time -
      well inside the 50 mm bridge this setup prints cleanly, so no supports are needed.
      Expect a slight droop on the pocket ceiling; harmless, the bearing only needs
      to seat somewhere on the outer ring.
- id: c9
  part: wheel
  feature: spins freely on the axle once assembled
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - stack_len
  check:
    method: measure
    ref: manual step 11
    description: after nipping the lock nut, flick the wheel - it should spin a turn
      or two with no drag. If it drags, back the nut off an eighth of a turn. Nothing
      but the collars may touch the wheel, so a light nip is enough.
manual:
- n: '1'
  text: Print the fit coupon first, in the same PLA and 0.2 mm layers you will use
    for the wheel, no supports. Press one of your 608 bearings into each of the four
    holes. Left to right they are 21.9, 22.05, 22.2 and 22.35 mm. The wheel is modelled
    with 21.9 mm pockets, which should give a firm push/press fit on a 22 mm bearing
    (your coupon showed a printed hole comes out at about nominal size, so 21.9 leaves
    about 0.1 mm of grip). If none of the four holes grips a bearing, stop and tell
    me before printing the wheel.
  parts:
  - fit_coupon
  hardware: []
  tool: your 608 bearings as gauges
- n: '2'
  text: Print the wheel, two collars and one spacer in PLA at 0.2 mm, no supports.
    The wheel lies flat, axis vertical, exactly as modelled. The only overhang is
    the 2 mm web ring that bridges the lower bearing pocket 4.6 mm of unsupported
    ring, which prints cleanly. Use three or more perimeters so the pockets have the
    wall strength the press fit needs.
  parts:
  - wheel
  - collar
  - spacer
  hardware: []
  tool: null
- n: '3'
  text: Press one 608 bearing into the wheel's lower pocket, the face that was on
    the bed. Line it up square and push or tap it in with a mallet and a flat block
    until it seats on the web; its outer face should finish flush with the wheel's
    face. The fit is an interference fit, so go in squarely and never lever it.
  parts:
  - wheel
  hardware:
  - bearing_a
  tool: mallet and a flat block, or a vice with soft jaws
- n: '4'
  text: Drop the spacer into the bore so it lies flat on the inner ring of the bearing
    you just fitted. It sits loose on the bolt and is trapped by the second bearing.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '5'
  text: Press the second 608 bearing into the other pocket the same way, until it
    seats on the web and its face finishes flush with the wheel's face.
  parts:
  - wheel
  hardware:
  - bearing_b
  tool: mallet and a flat block, or a vice with soft jaws
- n: '6'
  text: 'Flick the assembled hub: with both bearings seated, it should turn smoothly
    in the wheel.'
  parts:
  - wheel
  hardware: []
  tool: null
- n: '7'
  text: Slide one collar onto the M8 bolt, then push the bolt straight through the
    wheel so the head traps the collar against the first bearing's inner ring. The
    shank passes through both bearing bores and the spacer; you may need to turn the
    bolt as you feed it.
  parts:
  - wheel
  - collar
  hardware:
  - axle_bolt
  tool: null
- n: '8'
  text: Slide the second collar onto the bolt, flat against the second bearing's inner
    ring.
  parts:
  - collar
  hardware:
  - axle_bolt
  tool: null
- n: '9'
  text: Push the bolt through the axle hole in the hanger bracket, so the bracket
    sits beyond the wheel, on the far side of the bolt head. That way both bearings
    stay on the bolt's smooth shank. Only the collars and washer may touch anything
    - nothing may press on the wheel's own faces or it will drag.
  parts:
  - wheel
  - collar
  hardware:
  - axle_bolt
  tool: null
- n: '10'
  text: Fit the flat washer, then the nylon-insert lock nut. Tighten it SNUG only
    - just until the wheel stops rocking along the bolt, no more. Over-tightening
    preloads the bearing balls through the collars.
  parts:
  - collar
  hardware:
  - axle_bolt
  - lock_nut
  - washer
  tool: 6 mm hex key
- n: '11'
  text: 'Check the spin: flick the wheel. It should spin freely for a turn or two.
    If it drags, back the nut off an eighth of a turn. If instead the wheel rocks
    or slides along the bolt, nip the nut up a little.'
  parts:
  - wheel
  hardware: []
  tool: null
- n: '12'
  text: If the bracket's axle hole is bigger than about 11 mm, fit the second washer
    between the far collar and the bracket so the collar cannot drop into the hole.
  parts:
  - collar
  hardware:
  - washer
  tool: null
- n: '13'
  text: If the bolt's thread end stands proud of the nut and fouls the track, hacksaw
    it off flush with the nut, file the end, then run the nut on and off to clean
    the thread.
  parts: []
  hardware:
  - axle_bolt
  tool: hacksaw and file
- n: '14'
  text: 'Hang the door and run it along the track. A rumble means a bearing seated
    crooked: press it out with a drift and refit it square.'
  parts:
  - wheel
  hardware: []
  tool: null
