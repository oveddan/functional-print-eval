  spacer_len:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: 'matches the web thickness: it carries the nut''s clamp load between the
      two inner rings so the outer rings never see it'
  spacer_od:
    value: 11.6
    unit: mm
    kind: design
    source: design
    note: inside the 12.4 mm inner-ring shoulder, and inside the 13 mm web bore
  spacer_id:
    value: 8.5
    unit: mm
    kind: design
    source: design
    note: slip fit over the M8 bolt
  collar_od:
    value: 11.6
    unit: mm
    kind: design
    source: design
    note: one collar each side; sized to press the bearing's inner ring and clear
      the outer ring and the wheel's face
  collar_id:
    value: 8.5
    unit: mm
    kind: design
    source: design
    note: slip fit over the M8 bolt
  collar_t:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: sets the wheel's standoff from bolt head, bracket and washer; stack height
      driver
  rim_chamfer:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: 45 deg on both tread edges so the wheel doesn't catch on the track
  axle_bolt_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: measured
    note: the person's M8 bolt shank, calipered at ~8 mm
  axle_bolt_len:
    value: 45.0
    unit: mm
    kind: hardware
    source: catalog
    note: 'ISO 4762 M8x45 assumed: the person''s bolt length could not be measured.
      Drives the shank length available to the bearings.'
  thread_len_m8:
    value: 28.0
    unit: mm
    kind: hardware
    source: catalog
    note: M8 thread length (b) from the catalog, so a bolt's smooth shank is its length
