  plate_len:
    value: 104.0
    unit: mm
    kind: design
    source: design
    note: fit coupon plate length
  plate_w:
    value: 28.0
    unit: mm
    kind: design
    source: design
    note: fit coupon plate width
  plate_t:
    value: 9.0
    unit: mm
    kind: design
    source: design
