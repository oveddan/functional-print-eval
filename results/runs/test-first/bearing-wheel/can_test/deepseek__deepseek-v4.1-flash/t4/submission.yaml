task: bearing-wheel
note: 'A replacement Ø50 × 16 mm closet-door roller that runs on your two 608ZZ bearings
  and an M8 bolt. Print three parts in PLA (wheel ×1, collar ×2, spacer ×1), press
  one 608 into each side of the wheel, drop the spacer between them, and use the M8
  bolt as the axle with the two printed collars either side. The collars are the key
  detail: a plain M8 washer (16 mm OD) would sit on the bearing''s outer ring and
  brake the wheel, so the 11.6 mm collars press only the inner rings — nothing touches
  the wheel''s faces, so the wheel stays free however hard the nut is nipped up.


  Assumption to check: your M8 bolt''s length. The design gives a 31.6 mm stack from
  under the head (1.5 collar + 16 wheel + 1.5 collar + 1.6 washer + 3 bracket + 8
  lock nut). M8 carries 28 mm of thread, so a 45 mm bolt leaves a 17 mm smooth shank
  — enough for both bearings. A 50 mm bolt is better; anything under 35 mm will leave
  the outer bearing riding on threads. Also assumed: 3 mm bracket plate with an ~8.5
  mm axle hole, and a flat-tread original wheel (measured treads had no data).'
questions:
- text: What is the length of your M8 bolt under its head, and does it have at least
    17 mm of smooth (unthreaded) shank?
  answer: Unknown - it was never measured. The design assumes the catalog's M8x45,
    which leaves a 17 mm shank under 28 mm of thread. A shorter bolt, or one whose
    smooth shank is under 17 mm, would leave the outer bearing running on thread crests;
    the collars would need to be thinned to move the wheel inboard. If yours is not
    ~45 mm, tell me and I will re-cut the collars and spacer.
- text: What are the hanger bracket's plate thickness and axle hole diameter?
  answer: Unknown - could not be measured. Guessed at a 3 mm plate with an ~8.5 mm
    hole; those two numbers only affect the bolt length and whether the second washer
    is needed (manual step 12).
- text: Was the old wheel's tread flat, grooved or flanged, and were its 50 mm and
    16 mm exact?
  answer: Unknown - the broken wheel could not be measured. Modelled as a flat Ø50
    x 16 tread with 45 degree edges, from 'about 50 mm across and about 16 mm wide'.
- text: Did any of the fit coupon's holes grip a 608 firmly?
  answer: 'Only one data point came back: the 22.35 mm hole measured 22.34 mm, i.e.
    printed holes come out at nominal, so the wheel''s 21.9 mm pockets should give
    a 0.1 mm press. If none of the four holes actually held a bearing, the pockets
    need to go tighter before the wheel is printed.'
params:
  wheel_od:
    value: 50.0
    unit: mm
    kind: world
    source: asked
    note: 'the old roller: ''about 50 mm across'', as described by the person'
  wheel_w:
    value: 16.0
    unit: mm
    kind: world
    source: asked
    note: 'the old roller: ''about 16 mm wide'', as described by the person'
  bearing_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: measured
    note: 608ZZ outer ring, calipered by the person (~22 mm)
  bearing_bore:
    value: 8.0
    unit: mm
    kind: hardware
    source: measured
    note: 608ZZ bore, calipered by the person (~8 mm)
  bearing_w:
    value: 7.0
    unit: mm
    kind: hardware
    source: measured
    note: 608ZZ width, calipered by the person (~7 mm)
  bearing_inner_ring_od:
    value: 12.4
    unit: mm
    kind: hardware
    source: datasheet
    note: '608 inner-ring shoulder OD (d1 of a 608 series). Could not be measured,
      so taken from the bearing series data: it sets the largest collar that still
      touches the inner ring only.'
  bearing_pocket_d:
    value: 21.9
    unit: mm
    kind: design
    source: measured
    note: 'from the fit coupon: the person''s printed 22.35 mm hole measured 22.34
