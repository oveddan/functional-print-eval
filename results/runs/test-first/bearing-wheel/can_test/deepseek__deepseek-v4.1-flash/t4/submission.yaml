  locknut_h:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 nylon-insert lock nut height
  washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 plain washer thickness (OD 16, ID 8.4)
  bracket_t:
    value: 3.0
    unit: mm
    kind: world
    source: guessed
    note: 'hanger bracket plate thickness: not measured, assumed a typical 3 mm strap'
  bracket_hole_d:
    value: 8.5
    unit: mm
    kind: world
    source: guessed
    note: 'bracket axle hole: not measured; the original M8 bolt passed through it,
      so 8.5 is assumed'
  stack_len:
    value: 31.6
    unit: mm
    kind: design
    source: design
    note: collar 1.5 + wheel 16 + collar 1.5 + washer 1.6 + bracket 3 + lock nut 8,
      from under the bolt head. Sets the minimum bolt length.
  fit_d1:
    value: 21.9
    unit: mm
    kind: design
    source: design
    note: fit coupon hole 1 (tightest); this is the size the wheel's pockets are printed
