task: bearing-wheel
note: 'Replacement 50 x 16 mm closet-door roller wheel that runs on your two 608 bearings
  and the M8 bolt. Three printed parts: the wheel, a 2 mm spacer ring that sits between
  the two bearings'' inner races, and two 1 mm thrust washers.


  Why it is shaped this way:\n- The wheel prints flat (bore vertical, no supports,
  no bridges). Bearings drop into a 22.3 mm pocket from each face and bottom on a
  narrow internal lip - the 22.3 mm size and the lip both came out of your two test
  prints (22.0 mm pockets would not accept the bearing; the wide internal diaphragm
  I first tried printed as loose loops).\n- The pocket + lip set the two bearings
  exactly flush with the wheel''s faces, so the gap between their inner races is a
  fixed 2 mm and the printed spacer fills it.\n- The bolt clamps ONLY the two inner
  races (bolt head -> M8 washer -> thrust washer -> inner race -> spacer -> inner
  race -> thrust washer -> hanger -> washer -> nut). The hanger plate and the bolt
  head never touch the bearing shields or the wheel''s face, so the wheel spins on
  its bearings instead of rubbing. The thin printed thrust washers are what keep the
  metal parts off the shields.\n- Because the load path goes through the inner races
  and the spacer, tightening the nut cannot squeeze the balls.\n\nTest it before you
  trust it: with the nut snug (not cranked) the wheel must spin freely with no drag
  and no wobble. If it drags, back the nut off an eighth of a turn, then rub the spacer
  down a few strokes on 400 grit paper.'
questions:
- text: Is the wheel mounted beside a single hanger plate, or between two plates?
  answer: null
- text: How thick is the hanger plate the bolt passes through, and how long is your
    M8 bolt under its head?
  answer: null
- text: Does the bolt head stack (about 7.6 mm beyond the wheel's face) clear the
    track on the side it ends up on?
  answer: null
params:
  wheel_od:
    value: 50.0
    unit: mm
    kind: world
    source: asked
    note: your old wheel, 'about 50 mm across' - kept so the door hangs at the same
      height
  wheel_w:
    value: 16.0
    unit: mm
    kind: world
    source: asked
    note: your old wheel, 'about 16 mm wide'
  brg_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ outer diameter (max 21.992)
  brg_bore:
    value: 8.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ bore; takes an M8 shank
  brg_w:
    value: 7.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ width - sets the pocket depth
  pocket_d:
    value: 22.3
    unit: mm
    kind: design
    source: measured
    note: bearing pocket; a coupon ring modelled at 22.30 printed at 22.29 and held
      a 608 snugly (0.15 mm clearance), while 21.99 would not take it. Retention is
      by the internal lip and the bolt clamp, not by the press
  lip_d:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: bore of the internal lip the bearing outer races bottom on; wide enough
      to clear the spacer (11 OD) and the M8 thread, narrow enough that the 1.15 mm
      inward step prints cleanly
  lip_t:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: 'equals wheel_w - 2 x brg_w: the axial gap between the two bearings, and
      therefore the spacer thickness'
  mouth_chamfer:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: lead-in at each pocket mouth so the bearing starts squarely
  spacer_od:
    value: 11.0
    unit: mm
    kind: design
    source: design
    note: just under a 608 inner ring's OD (about 11.5), so the spacer presses only
      the inner races and never the cage or shields
  spacer_id:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: runs on the M8 thread (max major diameter 8.0)
  spacer_t:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: 10 x 0.2 mm layers; matches the bearing gap exactly, so the nut's load bypasses
      the balls
  thrust_od:
    value: 11.0
    unit: mm
    kind: design
    source: design
    note: ''
  thrust_id:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: ''
  thrust_t:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: 5 layers; spaces the bolt head / washer / hanger plate clear of the bearing
      shields and of the wheel's face
  bolt_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: measured
    note: you measured the M8 shank at 'about 8 mm'
  bolt_len:
    value: 35.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8x35. The stack needs about 28 mm of shank plus your hanger's
      thickness; your own M8 bolt is fine at 30-40 mm
  bolt_stack:
    value: 28.0
    unit: mm
    kind: design
    source: design
    note: M8 washer 1.6 + thrust 1.0 + wheel 16 + thrust 1.0 + hanger + M8 washer
      1.6 + M8 nut 6.8
  washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 plain washer thickness
  nut_h:
    value: 6.8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M8 nut height
  hanger_t:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: thickness of the hanger plate the bolt passes through - never measured;
      the bolt must leave about 7 mm of thread for the nut and washer past it
parts:
- id: wheel
  role: final
  material: PLA (high-speed), 0.4 mm nozzle, 0.2 mm layers, 4 perimeters, 25% infill,
    no supports
  code: "import cadquery as cq\n\nZ0 = cq.Vector(0, 0, 0)\nUP = cq.Vector(0, 0, 1)\n\
    \n\ndef build(p):\n    r_out = p.wheel_od / 2.0\n    r_pk = p.pocket_d / 2.0\n\
    \    r_lip = p.lip_d / 2.0\n    w = p.wheel_w\n    seat = p.brg_w\n    ch = p.mouth_chamfer\n\
    \n    # solid disc, full 16 mm wide\n    body = cq.Solid.makeCylinder(r_out, w,\
    \ Z0, UP)\n    # through hole at the lip diameter (leaves the 2 mm lip between\
    \ the pockets)\n    body = body.cut(cq.Solid.makeCylinder(r_lip, w, Z0, UP))\n\
    \    # bearing pocket from each face, one bearing wide, so the outer faces end\
    \ flush\n    body = body.cut(cq.Solid.makeCylinder(r_pk, seat, Z0, UP))\n    body\
    \ = body.cut(cq.Solid.makeCylinder(r_pk, seat, cq.Vector(0, 0, w - seat), UP))\n\
    \    # lead-in chamfers at both pocket mouths\n    body = body.cut(cq.Solid.makeCone(r_pk\
    \ + ch, r_pk, ch, Z0, UP))\n    body = body.cut(cq.Solid.makeCone(r_pk, r_pk +\
    \ ch, ch, cq.Vector(0, 0, w - ch), UP))\n    return body\n"
  print_orientation: bottom face on the bed, exactly as modelled (z=0 is the bed,
    wheel axis vertical, so the layers sit perpendicular to the axle and the door's
    weight acts along the layers)
  use_orientation: axis horizontal on the M8 axle bolt with a 608 in each pocket and
    the flat tread in the track
- id: spacer
  role: final
  material: PLA (high-speed), 0.4 mm nozzle, 0.2 mm layers, no supports
  code: "import cadquery as cq\n\nZ0 = cq.Vector(0, 0, 0)\nUP = cq.Vector(0, 0, 1)\n\
    \n\ndef build(p):\n    ch = 0.3\n    t = p.spacer_t\n    s = cq.Solid.makeCylinder(p.spacer_od\
    \ / 2.0, t, Z0, UP)\n    s = s.cut(cq.Solid.makeCylinder(p.spacer_id / 2.0, t,\
    \ Z0, UP))\n    s = s.cut(cq.Solid.makeCone(p.spacer_id / 2.0 + ch, p.spacer_id\
    \ / 2.0, ch, Z0, UP))\n    s = s.cut(cq.Solid.makeCone(p.spacer_id / 2.0, p.spacer_id\
    \ / 2.0 + ch, ch,\n                                cq.Vector(0, 0, t - ch), UP))\n\
    \    return s\n"
  print_orientation: flat on the bed, exactly as modelled (flat ring, bore vertical)
  use_orientation: inside the wheel on the bolt, between the two bearings' inner races
- id: thrust
  role: final
  material: PLA (high-speed), 0.4 mm nozzle, 0.2 mm layers, no supports - print two
  code: "import cadquery as cq\n\nZ0 = cq.Vector(0, 0, 0)\nUP = cq.Vector(0, 0, 1)\n\
    \n\ndef build(p):\n    ch = 0.2\n    t = p.thrust_t\n    s = cq.Solid.makeCylinder(p.thrust_od\
    \ / 2.0, t, Z0, UP)\n    s = s.cut(cq.Solid.makeCylinder(p.thrust_id / 2.0, t,\
    \ Z0, UP))\n    s = s.cut(cq.Solid.makeCone(p.thrust_id / 2.0 + ch, p.thrust_id\
    \ / 2.0, ch, Z0, UP))\n    s = s.cut(cq.Solid.makeCone(p.thrust_id / 2.0, p.thrust_id\
    \ / 2.0 + ch, ch,\n                                cq.Vector(0, 0, t - ch), UP))\n\
    \    return s\n"
  print_orientation: flat on the bed, exactly as modelled (flat ring, bore vertical)
  use_orientation: one on each side of the wheel, between a bearing's inner race and
    the bolt head / the hanger plate
