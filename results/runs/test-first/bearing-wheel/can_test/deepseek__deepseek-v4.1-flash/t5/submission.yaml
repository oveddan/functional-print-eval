criteria:
- id: c_pocket_fit
  part: wheel
  feature: bearing pocket (22.3 mm x 7 deep, both faces)
  relation: contains
  hardware: brg
  clearance_mm: 0.15
  params:
  - pocket_d
  - brg_od
  - brg_w
  check:
    method: coupon
    ref: mini_hub
    description: the 22.30 mm pocket couple printed at 22.29 and a 608 dropped in
      with light pressure and held upside down
- id: c_lip_seat
  part: wheel
  feature: internal lip, 20 mm bore x 2 mm thick
  relation: seats
  hardware: brg
  clearance_mm: null
  params:
  - lip_d
  - lip_t
  - brg_w
  - wheel_w
  check:
    method: coupon
    ref: mini_hub
    description: both bearings bottom on the lip and their outer faces end flush with
      the wheel's faces, so the inner races are exactly 2 mm apart; the narrow lip
      printed clean with no droop into the pocket
- id: c_spacer_on_bolt
  part: spacer
  feature: 8.4 mm centre bore
  relation: clears
  hardware: bolt
  clearance_mm: 0.4
  params:
  - spacer_id
  - bolt_d
  check:
    method: measure
    ref: null
    description: the M8 bolt slides freely through the printed spacer ring
- id: c_spacer_only_inner_race
  part: spacer
  feature: 11 mm OD flat faces
  relation: seats
  hardware: brg
  clearance_mm: null
  params:
  - spacer_od
  - spacer_t
  - brg_od
  - brg_w
  check:
    method: none
    ref: null
    description: the spacer's OD stays inside a 608 inner ring's OD (~11.5) and its
      2 mm thickness equals the gap between the inner races, so the nut's clamp load
      passes through the inner races and the spacer and never through the balls
- id: c_thrust_washer
  part: thrust
  feature: 11 mm OD flat faces
  relation: seats
  hardware: brg
  clearance_mm: null
  params:
  - thrust_od
  - thrust_t
  - brg_od
  check:
    method: none
    ref: null
    description: each thrust washer presses only a 608 inner race and holds the bolt
      head, the M8 washers and the hanger plate about 1 mm clear of the bearing shields
      and of the rotating wheel face
- id: c_bolt_length
  part: wheel
  feature: assembled hub stack (28 mm of shank)
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - bolt_len
  - bolt_stack
  - nut_h
  - washer_t
  - hanger_t
  check:
    method: measure
    ref: null
    description: with the wheel and the hanger plate on the bolt, the M8 nut screws
      on fully and 1-3 mm of bolt is left past it; if it runs out of thread use a
      longer bolt or drop the washer under the nut
- id: c_track_clearance
  part: wheel
  feature: tread (50 mm dia x 16 wide) and the 7.6 mm of bolt head stack past each
    face
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - wheel_w
  check:
    method: measure
    ref: null
    description: the wheel drops into the door's track and rolls, and the bolt head
      (about 7.6 mm of head + washer + thrust washer beyond the wheel's face) clears
      the track's walls and the door
- id: c_free_spin
  part: wheel
  feature: 'hub stack: two bearings, spacer between the inner races, nut snug'
  relation: supports
  hardware: brg
  clearance_mm: null
  params:
  - pocket_d
  - lip_t
  - spacer_t
  check:
    method: coupon
    ref: mini_hub
    description: with the nut snug the wheel spins freely on the bolt with no drag
      and no wobble; if it drags, back the nut off an eighth of a turn or rub the
      spacer thinner
manual:
- n: '1'
  text: 'Print the three parts in PLA at 0.2 mm layers with 4 perimeters and about
    25% infill, no supports: the wheel, one spacer ring, and two thrust washers. The
    wheel prints flat exactly as modelled - its bottom face on the bed, bore vertical.
    Do not rotate it on the plate.'
  parts:
  - wheel
  - spacer
  - thrust
  hardware: []
  tool: null
- n: '2'
  text: 'Test one 608 in the wheel: it should drop into a pocket with light thumb
    pressure and stop on the narrow internal lip, its outer face ending flush with
    the wheel''s face. If it will not start, scrape the pocket wall with a sharp knife.
    If it drops straight out again, that is fine - the lip and the bolt clamp take
    the load; a smear of superglue in the pocket will hold it.'
  parts:
  - wheel
  hardware:
  - brg
  tool: null
- n: '3'
  text: Set one bearing into a pocket from one face (push it until it bottoms on the
    lip). Drop the spacer ring in on top of it - it will fall through the lip's hole
    and land flat on that bearing's inner race. Then press the second bearing into
    the other pocket until it stops on the lip. The spacer now sits trapped between
    the two inner races.
  parts:
  - wheel
  - spacer
  hardware:
  - brg
  tool: null
- n: '4'
  text: Slide an M8 washer, then one thrust washer, onto the M8 bolt. Push the bolt
    through the wheel (through both bearings and the spacer). Slide the second thrust
    washer on against the far face of the wheel.
  parts:
  - wheel
  - thrust
  hardware:
  - bolt
  - washer
  tool: null
- n: '5'
  text: Push the bolt through the hole in the door's hanger plate, add the second
    M8 washer and the M8 nut. Tighten the nut until the wheel feels firm with no side
    play - snug, not cranked.
  parts: []
  hardware:
  - bolt
  - washer
  - nut
  tool: null
- n: '6'
  text: 'Spin the wheel. It must turn freely by hand with no drag and no wobble, because
    the bolt clamps only the two inner races. If it drags: back the nut off an eighth
    of a turn; if it still drags, take the wheel off and rub the spacer ring''s flat
    faces on 400 grit paper (a few strokes), then refit. If instead the wheel slides
    along the bolt, the spacer is too thin - it should be 2.0 mm, that is 10 layers.'
  parts:
  - wheel
  - spacer
  - thrust
  hardware: []
  tool: null
- n: '7'
  text: 'Check clearances: the bolt head, washers and thrust washer stick out about
    7.6 mm beyond the wheel''s face. Make sure that clears the track and the door,
    and that no thread sticks out past the nut where it could catch. Add washers or
    a shorter bolt if it fouls.'
  parts: []
  hardware:
  - bolt
  - washer
  - nut
  tool: null
- n: '8'
  text: 'Hang the door: the wheel is the same 50 mm as the old one, so the door should
    sit at the same height. Roll it along the track both ways and listen for rubbing.
    Adjust the hanger''s height screw if there is one.'
  parts:
  - wheel
  hardware: []
  tool: null
- n: '9'
  text: 'If your hanger holds the wheel between TWO plates (a fork) rather than beside
    one plate: put a thrust washer on each side of the wheel so the plates press the
    washers and not the wheel''s faces. That needs about 18 mm between the plates.
    If the fork is only about 16 mm wide the wheel will be pinched - keep the nut
    only finger-tight and check the wheel still spins.'
  parts:
  - wheel
  - thrust
  hardware: []
  tool: null
