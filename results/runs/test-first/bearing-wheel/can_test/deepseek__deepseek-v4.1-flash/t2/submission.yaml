task: bearing-wheel
note: 'A printed replacement for the 50 x 16 mm door roller that spins on your M8
  bolt via your two 608ZZ bearings. One revolved part: two bearing pockets (22.10
  mm dia, 6.4 mm deep) pressed in from opposite faces, each stopping on an internal
  shoulder that touches only the bearing''s OUTER ring; a 3.2 mm web separates the
  two inner rings, and a printed 3.2 mm spacer ring fills that gap so tightening the
  lock nut can never squeeze the balls - the clamp load travels through the spacer.
  An 18.4 mm centre relief keeps all printed material off both the rotating shield
  and the stationary inner ring, and two printed 1 mm thrust rings (the steel M8 washers
  are too big - they would rub the shields) take the load from the bolt head and the
  lock nut. The seat diameter, 22.10 mm, is the value your coupon proved: 21.94 would
  not accept a bearing, 22.09 was snug and held it upside down. Pocket depths and
  the spacer are whole 0.2 mm layers, so the printed gap matches the printed spacer
  exactly. The tread keeps the full 50 mm diameter on two 3.2 mm lands and has a shallow
  2.4 x 2.5 mm groove with 45 deg sides, so it works on a flat track or on a rail
  up to about 2.4 x 2.5 mm - the old wheel''s tread could not be measured, so this
  covers both. No supports, no bridges, no glue. Reuse your own M8 bolt if it has
  about 27 mm from under the head plus the bracket thickness; otherwise ISO 4762 M8x40
  with one M8 lock nut.'
questions:
- text: How long is your M8 bolt from under the head to the tip, and how thick is
    the door's roller bracket? (The stack needs 27.2 mm plus the bracket.)
  answer: null
- text: Does the door's track have a raised rail (so the old wheel was grooved), or
    is it a flat running surface?
  answer: null
- text: Did your M8 bolt slip through a 608ZZ bearing's bore on its own?
  answer: null
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: 'person''s description of the broken wheel: ''about 50 mm across'''
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: 'person''s description of the broken wheel: ''about 16 mm wide'''
  brg_od:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ OD 22.000 -0.008
  brg_bore:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ bore 8.000 +0/-0.008
  brg_w:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ width 7.000
  brg_inner_ring_od:
    value: 12
    unit: mm
    kind: hardware
    source: guessed
    note: not published; sets the 11.0 mm OD of the spacer and thrust rings so they
      bear on the inner ring only
  brg_shield_od:
    value: 18
    unit: mm
    kind: hardware
    source: guessed
    note: not published; sets the 18.4 mm web relief hole so the printed web misses
      the rotating shield
  bolt_shank_d:
    value: 8
    unit: mm
    kind: hardware
    source: asked
    note: 'person: ''bolt across: about 8 mm (the shank)''; an M8 thread''s crests
      are 7.76-7.97 so they still pass a 7.992-8.000 bore'
  head_d:
    value: 13
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8 head diameter; the head overhangs the 11 mm thrust ring, which
      is why the ring is a full 1.0 mm thick
  head_h:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8 head height
  nut_h:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 nylon-insert lock nut height (af 13)
  seat_d:
    value: 22.1
    unit: mm
    kind: design
    source: design
    note: 'bearing pocket diameter, from the fit coupon: the 22.10 pocket printed
      22.09, was snug and held a 608 upside down; the 21.95 one would not go in at
      all'
  pocket_depth:
    value: 6.4
    unit: mm
    kind: design
    source: design
    note: 32 whole layers at 0.2 mm; leaves a 3.2 mm web whose thickness equals the
      spacer length, so the two printed parts match exactly
  web_hole_d:
    value: 18.4
    unit: mm
    kind: design
    source: design
    note: 'relief hole between the two pockets: clears the shield (guess 18.0) and
      the inner ring (12.0), and leaves a 1.25 mm shoulder that bears on the outer
      ring''s face (r 8.75-11)'
  mouth_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: '45 deg lead-in at each pocket mouth: starts the bearing square and defeats
      elephant-foot bulge'
  shoulder_chamfer:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: 45 deg inside the web relief; keeps the printed hole edge off the shield's
      outer corner
  edge_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: '45 deg on both tread edges: no knife edge running on the track'
  groove_depth:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: the tread still carries the full 50 mm diameter on the lands either side,
      so the door height stays as it was
  groove_floor_w:
    value: 2.4
    unit: mm
    kind: design
    source: design
    note: groove floor spans z 6.8-9.2 (whole layers); 45 deg flanks widen the mouth
      to 7.4 mm and print without support
  spacer_od:
    value: 11
    unit: mm
    kind: design
    source: design
    note: bears on the inner ring's face (8-12 mm) and stops 0.5 mm short of the shield
  spacer_bore:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: 0.4 mm clearance on an 8 mm shank / M8 thread
  spacer_l:
    value: 3.2
    unit: mm
    kind: design
    source: design
    note: 16 whole layers = the shoulder-to-shoulder gap (16 - 2 x 6.4); the nut's
      clamp goes through this ring instead of through the balls
  tring_od:
    value: 11
    unit: mm
    kind: design
    source: design
    note: 'thrust ring OD: spans r 4.2-5.5, inside the inner ring and clear of the
      13 mm bolt head''s overhang'
  tring_bore:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: clearance on the bolt
  tring_t:
    value: 1
    unit: mm
    kind: design
    source: design
    note: 5 layers; thick enough that the bolt head / lock nut cannot reach the shield
      behind it
  fit_d_a:
    value: 21.95
    unit: mm
    kind: design
    source: design
    note: 'coupon pocket A - printed 21.94: the bearing would not go in'
  fit_d_b:
    value: 22.1
    unit: mm
    kind: design
    source: design
    note: 'coupon pocket B - printed 22.09: snug, held a 608 upside down. Chosen as
      seat_d'
  fit_d_c:
    value: 22.25
    unit: mm
    kind: design
    source: design
    note: coupon pocket C - result not reported
  fit_d_d:
    value: 22.4
    unit: mm
    kind: design
    source: design
    note: coupon pocket D - result not reported
  fit_depth:
    value: 6.5
    unit: mm
    kind: design
    source: design
    note: coupon pocket depth as printed (the final wheel uses 6.4 so it lands on
      whole layers)
  coupon_t:
    value: 8
    unit: mm
    kind: design
    source: design
    note: coupon plate thickness
  coupon_wall:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: material around each coupon pocket
  vent_d:
    value: 3
    unit: mm
    kind: design
    source: design
    note: vent through each coupon pocket floor so trapped air escapes when pressing
parts:
- id: wheel
  role: final
  material: PLA (high-speed, black)
  code: "import cadquery as cq\n\n\ndef build(p):\n    # one closed radial half-profile,\
    \ revolved about the print axis\n    R = p.wheel_od / 2.0\n    W = p.wheel_w\n\
    \    rs = p.seat_d / 2.0\n    rz = p.web_hole_d / 2.0\n    z1 = p.pocket_depth\n\
    \    z2 = W - p.pocket_depth\n    ch = p.mouth_chamfer\n    sh = p.shoulder_chamfer\n\
    \    ec = p.edge_chamfer\n    gd = p.groove_depth\n    rg = R - gd\n    gc = W\
    \ / 2.0\n    gz1 = gc - p.groove_floor_w / 2.0\n    gz2 = gc + p.groove_floor_w\
    \ / 2.0\n\n    pts = [\n        (R, ec),            # tread edge\n        (R,\
    \ gz1 - gd),      # down the outer land\n        (rg, gz1),          # 45 deg\
    \ lower groove flank\n        (rg, gz2),          # groove floor\n        (R,\
    \ gz2 + gd),      # 45 deg upper groove flank\n        (R, W - ec),\n        (R\
    \ - ec, W),        # top face\n        (rs + ch, W),\n        (rs, W - ch),  \
    \     # pocket mouth lead-in\n        (rs, z2),           # upper pocket wall\n\
    \        (rz + sh, z2),      # upper shoulder (outer ring seat)\n        (rz,\
    \ z2 - sh),\n        (rz, z1 + sh),      # web relief wall\n        (rz + sh,\
    \ z1),\n        (rs, z1),           # lower shoulder (outer ring seat)\n     \
    \   (rs, ch),           # lower pocket wall\n        (rs + ch, 0.0),\n       \
    \ (R - ec, 0.0),      # bottom face on the bed\n    ]\n    return (cq.Workplane(\"\
    XZ\")\n            .polyline(pts).close()\n            .revolve(360.0, (0, 0,\
    \ 0), (0, 1, 0)))\n"
  print_orientation: 'Flat on the bed: z=0 is the smooth bottom face, the axis is
    vertical, both bearing pockets open straight up/down and the groove''s two flanks
    are 45 deg cones - no supports and no bridges.'
  use_orientation: In use the axis is horizontal and the tread sits on the track.
    The part is symmetric about its mid-plane, so it fits on the bolt either way round;
    the bed face becomes one of the two side faces.
- id: spacer
  role: final
  material: PLA (high-speed, black)
  code: "import cadquery as cq\n\n\ndef build(p):\n    h = p.spacer_l\n    body =\
    \ cq.Workplane(\"XY\").circle(p.spacer_od / 2.0).extrude(h)\n    bore = (cq.Workplane(\"\
    XY\", origin=(0, 0, -0.5))\n            .circle(p.spacer_bore / 2.0).extrude(h\
    \ + 1.0))\n    return body.cut(bore)\n"
  print_orientation: Flat on the bed, z=0 at its lower face; a plain ring, vertical
    walls, nothing overhanging.
  use_orientation: Inside the wheel's 18.4 mm centre relief, sitting between the two
    bearings' inner rings; stationary with the axle. Print one.
- id: thrust_ring
  role: final
  material: PLA (high-speed, black)
  code: "import cadquery as cq\n\n\ndef build(p):\n    h = p.tring_t\n    body = cq.Workplane(\"\
    XY\").circle(p.tring_od / 2.0).extrude(h)\n    bore = (cq.Workplane(\"XY\", origin=(0,\
    \ 0, -0.5))\n            .circle(p.tring_bore / 2.0).extrude(h + 1.0))\n    return\
    \ body.cut(bore)\n"
  print_orientation: Flat on the bed, z=0 at its lower face; a plain thin ring, vertical
    walls, nothing overhanging. Print two.
  use_orientation: 'One on each side of the wheel: the bolt head presses the outer
    one and the M8 lock nut the other, each bearing on the bearing''s inner ring only
    so the steel faces never touch the shields. Stationary with the axle.'
- id: fit_coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "import cadquery as cq\n\n\ndef build(p):\n    ds = [p.fit_d_a, p.fit_d_b,\
    \ p.fit_d_c, p.fit_d_d]\n    depth = p.fit_depth\n    t = p.coupon_t\n    wall\
    \ = p.coupon_wall\n    dmax = max(ds)\n    pitch = dmax + wall\n    L = 2 * wall\
    \ + pitch * (len(ds) - 1) + dmax\n    W = dmax + 2 * wall\n    xs = [-L / 2 +\
    \ wall + dmax / 2 + i * pitch for i in range(len(ds))]\n\n    plate = cq.Workplane(\"\
    XY\").box(L, W, t, centered=(True, True, False))\n\n    cut = None\n    for d,\
    \ x in zip(ds, xs):\n        c = (cq.Workplane(\"XY\", origin=(x, 0, t - depth))\n\
    \             .circle(d / 2.0).extrude(depth + 1.0))\n        cut = c if cut is\
    \ None else cut.union(c)\n\n    vents = (cq.Workplane(\"XY\", origin=(0, 0, 0))\n\
    \             .pushPoints([(x, 0) for x in xs])\n             .circle(p.vent_d\
    \ / 2.0).extrude(t))\n\n    return plate.cut(cut).cut(vents)\n"
  print_orientation: 'Lying flat on the bed: z=0 is the plate''s bottom face and all
    four pockets open straight up (vertical walls, no supports, no bridges).'
  use_orientation: as printed
hardware:
- id: brg
  ref: 608ZZ
  qty: 2
- id: axle
  ref: ISO 4762 M8x40
  qty: 1
- id: nut_m8
  ref: ISO 10511 M8
  qty: 1
joints:
- id: axle_joint
  fastener: axle
  axis_origin:
  - 0.0
  - 0.0
  - -1.6
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel
    feature: bearing pockets (2x, dia seat_d x pocket_depth, with 1 mm mouth chamfers)
    role: clearance
  - part: spacer
    feature: bore (dia 8.4)
    role: clearance
  - part: thrust_ring
    feature: bore (dia 8.4)
    role: clearance
  nut: nut_m8
  external: the door's existing roller bracket - the bolt passes through it exactly
    as it did with the old wheel
criteria:
- id: c_seat
  part: wheel
  feature: bearing pockets (2x, dia seat_d x pocket_depth)
  relation: contains
  hardware: brg
  clearance_mm: 0.09
  params:
  - seat_d
  - pocket_depth
  - brg_od
  - brg_w
  check:
    method: coupon
    ref: fit_coupon
    description: 'Printed coupon: the 21.94 mm pocket refused the bearing, 22.09 mm
      was snug and held it upside down, so seat_d = 22.10. The bearings must need
      a firm press in and be held without the bolt.'
- id: c_spacer_len
  part: spacer
  feature: 3.2 mm length between the two bearings' inner rings
  relation: seats
  hardware: brg
  clearance_mm: 0.0
  params:
  - spacer_l
  - wheel_w
  - pocket_depth
  - brg_w
  check:
    method: template
    ref: null
    description: spacer_l == wheel_w - 2 x pocket_depth (3.2 = 16 - 2 x 6.4) and both
      are 16 whole 0.2 mm layers, so the printed gap matches the printed spacer. The
      nut's clamp travels through this ring, so the balls are never squeezed. If the
      second bearing stops short of its shoulder, sand the ring's ends flat and refit.
- id: c_web_clear
  part: wheel
  feature: web relief hole (dia 18.4) between the pockets
  relation: clears
  hardware: brg
  clearance_mm: 0.2
  params:
  - web_hole_d
  - brg_shield_od
  - brg_inner_ring_od
  check:
    method: measure
    ref: null
    description: 'No printed material may touch the rotating shield or the stationary
      inner ring: 0.2 mm clearance over a guessed 18.0 mm shield, 3.2 mm over a 12
      mm inner ring. Measure the shield''s OD with calipers if you can before pressing.'
- id: c_shoulder
  part: wheel
  feature: pocket-bottom shoulders (flat annulus r 9.8-11.05, one per bearing)
  relation: supports
  hardware: brg
  clearance_mm: 0.0
  params:
  - web_hole_d
  - shoulder_chamfer
  - seat_d
  check:
    method: none
    ref: null
    description: Each shoulder spans r 9.8-11.05 and meets the 608's outer-ring face
      (r 8.75-11), so the door's load leaves the wheel through the outer race. A 1.25
      mm wide annulus; the 1.25-1.85 mm overhangs behind it print without support.
- id: c_tring
  part: thrust_ring
  feature: 1.0 mm thick ring, OD 11.0, under the bolt head and the lock nut
  relation: faces
  hardware: brg
  clearance_mm: 1.0
  params:
  - tring_od
  - tring_t
  - head_d
  - brg_shield_od
  check:
    method: none
    ref: null
    description: The 13 mm head / lock nut overhangs the 11 mm ring by 1 mm radially,
      and the 1 mm thickness holds that overhang 1 mm clear of the shield behind it.
      The ISO 7089 M8 washer (16 mm OD) would NOT do this job - it would rub the shield.
- id: c_axle_bore
  part: wheel
  feature: path of the M8 bolt through the two 608 bores
  relation: clears
  hardware: axle
  clearance_mm: 0.02
  params:
  - brg_bore
  - bolt_shank_d
  check:
    method: measure
    ref: null
    description: A 608 bore is 7.992-8.000 and an M8 thread's crests are at most 7.97,
      so the bolt goes through either way - the plain shank slips in, the threaded
      length may need turning through. Confirm on your own bolt and bearing before
      pressing anything.
- id: c_tread
  part: wheel
  feature: 50 mm tread with a 2.4 x 2.5 mm groove and two 3.2 mm lands
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - wheel_w
  - groove_floor_w
  - groove_depth
  check:
    method: measure
    ref: null
    description: 'The old tread could not be measured, so this tolerates both cases:
      on a flat track the door runs on the two 3.2 mm lands at the full 50 mm diameter,
      and a rail up to about 2.4 mm wide and 2.5 mm tall drops into the groove. Compare
      with the old wheel and the track before running the door.'
- id: c_axle_len
  part: wheel
  feature: 'axle stack: 0.6 + 16 + 0.6 + two 1 mm rings + 8 mm lock nut = 27.2 mm'
  relation: engages
  hardware: axle
  clearance_mm: 2.0
  params:
  - wheel_w
  - pocket_depth
  - tring_t
  - nut_h
  check:
    method: measure
    ref: null
    description: The bolt needs 27.2 mm from under the head, plus the bracket's thickness,
      plus a couple of mm of thread past the nut (ISO 4762 M8x40 covers a bracket
      up to about 10 mm). Cross-check your own bolt's length before assembly.
manual:
- n: '1'
  text: 'Print the three final parts in PLA at 0.2 mm layers with no supports, each
    laid on the bed as it comes: the wheel (1 off), the spacer (1 off) and the thrust
    rings (2 off). Pick any elephant-foot bulge out of the two bearing pockets'' mouths
    with a knife - the 1 mm lead-in chamfer is there to keep the fit clean. (The fit
    coupon you already printed is what set the 22.10 mm pocket size.)'
  parts:
  - wheel
  - spacer
  - thrust_ring
  - fit_coupon
  hardware: []
  tool: knife or deburring tool
- n: '2'
  text: Press one 608ZZ bearing into a wheel pocket until it bottoms on the internal
    shoulder; the pocket's 1 mm lead-in chamfer squares it up. Press on the bearing's
    OUTER ring only (a vise, a clamp, or a bolt plus a socket) - never push on the
    shield. Either face works, the wheel is symmetric.
  parts:
  - wheel
  hardware:
  - brg
  tool: vise or clamp
- n: '3'
  text: Turn the wheel over and drop the printed spacer into the open centre hole.
    It slides past the seated bearing's inner ring and rests on it, centred.
  parts:
  - wheel
  - spacer
  hardware: []
  tool: null
- n: '4'
  text: Press the second 608ZZ into the opposite pocket, straight down, until it stops.
    Its outer face should finish about 0.6 mm proud of the wheel's face. If it stops
    early - the spacer holding it off its shoulder - take the spacer out, rub its
    ends flat on a sheet of sandpaper, and refit.
  parts:
  - wheel
  - spacer
  hardware:
  - brg
  tool: vise or clamp
- n: '5'
  text: 'Check the assembly: look through the 18.4 mm centre hole - the two bearings''
    inner faces must be 3.2 mm apart with the spacer between them, and both bearings
    hard against their shoulders (no gap under the outer rings). To get a bearing
    out, push it out from the other side through the centre hole; never lever it out.'
  parts:
  - wheel
  - spacer
  hardware:
  - brg
  tool: null
- n: '6'
  text: Slide the M8 bolt through both bearing bores and give the wheel a spin. It
    must turn freely with no detectable side-to-side rock. A threaded bolt may need
    to be turned through the bores.
  parts:
  - wheel
  hardware:
  - brg
  - axle
  tool: null
- n: '7'
  text: 'Refit the axle through the door''s existing roller bracket exactly as the
    old wheel was mounted, in this order: bolt head, bracket, thrust ring, wheel,
    thrust ring, M8 lock nut.'
  parts:
  - wheel
  - thrust_ring
  hardware:
  - axle
  - nut_m8
  tool: adjustable spanner or 13 mm spanner
- n: '8'
  text: Tighten the lock nut firmly - snug, then about an eighth of a turn. The clamp
    travels through the thrust rings and the spacer, so the wheel must still spin
    freely and have no axial play. If it drags, back the nut off slightly and re-check.
  parts:
  - wheel
  - thrust_ring
  hardware:
  - nut_m8
  tool: spanner
- n: '9'
  text: Check the tread against the track before running the door. On a flat track
    the door runs on the two 3.2 mm lands; a rail up to about 2.4 mm wide and 2.5
    mm tall drops into the groove. The rolling diameter is still 50 mm, so the door
    height should be close to before - adjust the hanger if it is not.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '10'
  text: Run the door back and forth a few times and re-check the lock nut and that
    the wheel still spins freely.
  parts:
  - wheel
  - thrust_ring
  hardware:
  - nut_m8
  tool: null
