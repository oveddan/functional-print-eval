manual:
- n: '1'
  text: 'Print the wheel flat: one Ø50 face on the bed, wheel axis vertical. No supports.
    Pick out any strings from the two Ø22 pockets.'
  parts:
  - wheel
  hardware: []
  tool: printer
- n: '2'
  text: 'Press one 608ZZ into the bottom pocket until it stops on the shoulder ring
    inside - it will end up about 0.2 mm below the face. Keep it square: squeeze it
    in a vice, or tap it with a mallet through a block of wood. If it will not go,
    sand the bore lightly rather than forcing it - PLA cracks.'
  parts:
  - wheel
  hardware:
  - bearing
  tool: vice, or mallet + wood block
- n: '3'
  text: Turn the wheel over and press the second 608ZZ into the other pocket the same
    way, until it stops on the shoulder ring.
  parts:
  - wheel
  hardware:
  - bearing
  tool: vice, or mallet + wood block
- n: '4'
  text: Drop one M8 washer in through the middle. It falls through the Ø17 hole and
    lands flat between the two bearings' inner races, filling the 1.6 mm gap.
  parts:
  - wheel
  hardware:
  - washer_mid
  tool: null
- n: '5'
  text: 'Spin test: poke a finger into each bearing bore and spin the wheel. It must
    turn freely and smoothly, with no rumble and no rock.'
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '6'
  text: 'Build the axle stack on the M8 bolt in this order: bolt head, M8 washer,
    wheel, M8 washer, bracket plate, M8 lock nut. The washers sit inside the Ø22 pocket
    mouths and must touch only the bearing faces - never the wheel''s rim.'
  parts:
  - wheel
  hardware:
  - bolt
  - washer_outer
  - locknut
  tool: null
- n: '7'
  text: Tighten the lock nut firmly but not hard - about 2 N·m with a short 13 mm
    spanner. The wheel must still spin freely and have no side-to-side rock. Over-tightening
    is what would load the bearings.
  parts:
  - wheel
  hardware:
  - locknut
  tool: 13 mm spanner
- n: '8'
  text: 'Check the clearance: there must be a visible gap (about 1.4 mm, the washer
    thickness) between each side of the Ø50 rim and the bracket. If the bracket touches
    or clamps the rim the wheel will not turn - add another M8 washer between the
    bracket and the washer already there, or move the wheel outboard of the bracket.'
  parts:
  - wheel
  hardware:
  - washer_outer
  tool: null
- n: '9'
  text: If your bracket is a U (two plates with the wheel between them), the gap between
    the plates needs to be about 18.8 mm - the 16 mm wheel plus one washer on each
    side. Space the plates out with extra M8 washers if the gap is bigger.
  parts:
  - wheel
  hardware:
  - washer_outer
  tool: null
- n: '10'
  text: Refit the wheel onto the door and run it along the track. It should roll smoothly
    with no side-to-side wander; the shoulder ring inside the wheel keeps the bearings
    (and the wheel) centred on the bolt.
  parts:
  - wheel
  hardware:
  - bolt
  - locknut
  tool: null
