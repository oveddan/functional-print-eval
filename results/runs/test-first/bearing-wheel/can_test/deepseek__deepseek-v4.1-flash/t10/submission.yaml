task: bearing-wheel
note: 'A replacement 50 x 16 mm closet-door roller wheel that spins on your M8 bolt
  through two 608ZZ bearings. One printed part plus the hardware you have.\n\nHow
  it works: the wheel is a plain disc with a bearing pocket in each face, 7.2 mm deep,
  so each 608 sits 0.2 mm below the face and stops on a shoulder ring moulded into
  the middle of the wheel. That shoulder locates the bearings (and therefore the wheel)
  axially, so the wheel cannot walk along the bolt. The M8 washers sit *inside* the
  pockets and press only on the bearings'' inner races, and the third washer in the
  middle of the wheel keeps the two inner races apart, so the bolt''s clamping force
  runs head -> washer -> inner race -> middle washer -> inner race -> washer -> nut
  and never squeezes the balls or the wheel''s rim. The wheel itself is only touched
  by the bearings'' outer races, so it spins free.\n\nPrint it flat (a Ø50 face on
  the bed, axis vertical). No supports. The only overhang is the 2.5 mm wide shoulder
  ring inside, which prints fine.\n\nThings I had to guess, because I could not get
  them measured:\n- The old wheel''s 50 mm / 16 mm came from your description (''about
  50 across, about 16 wide''). If it is a couple of mm off, the track clearance changes
  - measure it if you can and I will adjust.\n- Bearing pocket is Ø22.05 (0.05 mm
  over the 608 OD). On your X1C a vertical Ø22 hole normally prints a touch small,
  so this should be a light press. If it drops in loose it still works (the door load
  presses the wheel onto the outer race), but a wrap of tape or a drop of superglue
  on the outer race will firm it up. If it will not go in, sand the bore lightly -
  do NOT hammer it, PLA cracks.\n- The bracket is unknown: the design needs the wheel
  gripped only through its bearing inner races, with the bracket outside a washer.
  See steps 6-9.\n- Your M8 bolt''s length is unknown. The stack needs 18.8 mm of
  bolt for the wheel + two washers, plus the bracket thickness, plus 8 mm for the
  lock nut - so about 30-35 mm under the head. An ISO 4762 M8x35 is listed; your own
  bolt is fine if it is at least ~30 mm under the head.\n\nI printed a 4-hole bore
  gauge first to pin down the bearing fit, but the readout came back unreadable, so
  the 22.05 mm pocket is my best judgement rather than a verified number.'
questions:
- text: How long is your M8 bolt from under the head to the tip, and is the head a
    socket cap or a hex head?
  answer: null
- text: Is the roller bracket a single plate with the wheel beside it, or a U-shaped
    clevis with the wheel between two plates? (This decides how many washers to space
    it with.)
  answer: null
- text: Can you measure the old wheel's outside diameter and width accurately with
    calipers, so the track clearance is right?
  answer: null
- text: On the bore gauge you printed (holes 21.9 / 22.05 / 22.2 / 22.35), which hole
    gave a firm but pushable fit for the 608, and did any of them crack?
  answer: null
