parts:
- id: wheel
  role: final
  material: PLA (high-speed, black)
  code: "def cone(r1, r2, h, z):\n    return (cq.Workplane(\"XY\").workplane(offset=z).circle(r1)\n\
    \            .workplane(offset=h).circle(r2).loft())\n\n\ndef build(p):\n    w\
    \ = p.wheel_w\n    pd = p.pocket_depth\n    R = p.wheel_od / 2.0\n    # solid\
    \ disc\n    wp = cq.Workplane(\"XY\").circle(R).extrude(w)\n    # bearing pocket\
    \ from the bottom face\n    wp = wp.cut(cq.Workplane(\"XY\").circle(p.bore_d /\
    \ 2.0).extrude(pd))\n    # bearing pocket from the top face\n    wp = wp.cut(cq.Workplane(\"\
    XY\").workplane(offset=w - pd)\n                .circle(p.bore_d / 2.0).extrude(pd))\n\
    \    # through hole: leaves the shoulder ring between the two pockets\n    wp\
    \ = wp.cut(cq.Workplane(\"XY\").circle(p.shoulder_id / 2.0).extrude(w))\n    #\
    \ lead-in chamfers on both pocket mouths\n    c = p.chamfer\n    wp = wp.cut(cone(p.bore_d\
    \ / 2.0 + c, p.bore_d / 2.0, c, 0.0))\n    wp = wp.cut(cone(p.bore_d / 2.0, p.bore_d\
    \ / 2.0 + c, c, w - c))\n    return wp\n"
  print_orientation: 'Flat: one Ø50 face on the bed, wheel axis vertical (z). The
    two Ø22 pockets open up and down. No supports - the only overhang is the 2.5 mm
    wide shoulder ring inside, mid-height.'
  use_orientation: Wheel axis horizontal, M8 bolt through the bearing bores; the Ø50
    rim rolls on the track.
