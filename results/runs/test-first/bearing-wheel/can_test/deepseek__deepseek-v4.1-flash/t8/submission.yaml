task: bearing-wheel
note: 'A drop-in replacement roller for the sliding closet door: a 50 mm x 16 mm PLA
  wheel that houses both of your 608 bearings, running on your M8 bolt as a plain
  axle. Two small printed rings make it work properly: one sits between the two bearing
  inner rings (so tightening the axle nut can never pinch the wheel), one is a washer
  under the nut. Printed flat, no supports, no hardware beyond what you already have
  plus a nut.


  Why the rings matter: two 608s are 14 mm of a 16 mm wheel, leaving a 1 mm web between
  them. If you simply bolted it up, the nut would clamp the two inner rings straight
  onto that plastic web and the wheel would lock solid. The spacer ring holds the
  inner rings exactly 2.0 mm apart, so the clamp load passes through the ring and
  only the outer rings + wheel turn. The pocket is 7.5 mm deep (0.5 mm deeper than
  the bearing) so the inner rings stay 0.5 mm clear of the web on each side - a gap
  you can see, so it will not disappear into print tolerance.


  What I could not get, and how I covered it: the bolt''s length and the bracket''s
  thickness. The wheel needs 18 mm of bolt (wheel 16 + nut-side spacer 2) plus your
  bracket''s thickness plus the nut (4.7 mm) - so about 25 mm under the head plus
  the bracket. ISO 4762 M8x50 covers most hanger brackets; if your bolt is longer,
  add ISO 7089 M8 washers as take-up between the nut and the printed ring. Your own
  M8 bolt is fine if it is long enough. Keep the tread at 50 mm and the door will
  hang at the same height as before.'
questions:
- text: How thick is your hanger bracket where the axle passes through, and how long
    is your M8 bolt under the head? Those two numbers decide whether an M8x50 fits
    or you need take-up washers.
  answer: null
- text: Is the bracket's axle hole plain, or threaded (i.e. did the old wheel's axle
    screw into the bracket)? If it is threaded, the bolt will thread in and the wheel
    must still spin free - tell me and I will rework the clamp.
  answer: null
params:
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ nominal OD. The earlier caliper reading of 21.22 was taken across
      the jaw tips at an angle and reads low
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 bore - the bolt is the axle through here
  bearing_width:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 width; two of them are 14 of the wheel's 16 mm
  bearing_inner_ring_od:
    value: 14.5
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 inner-ring face OD; the printed spacer (14.0) and the bolt head (13.0)
      both land on this ring, not on the wheel
  bolt_shank_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: 'user: ''bolt across: about 8 mm (the shank)'''
  bolt_head_d:
    value: 13
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8 head
  bolt_head_h:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8 head height
  nut_af:
    value: 13
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M8 across flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M8 height - part of the bolt length the axle needs
  lock_nut_h:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 lock nut, optional upgrade; adds 3.3 mm to the stack
  washer_id:
    value: 8.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8
  washer_od:
    value: 16
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8; only used as take-up between the nut and the printed ring
  old_wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: 'user: ''about 50 mm across'''
  old_wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: 'user: ''about 16 mm wide'''
  wheel_od:
    value: 50
    unit: mm
    kind: design
    source: design
    note: matched to the old wheel so the door hangs at the same height
  wheel_w:
    value: 16
    unit: mm
    kind: design
    source: design
    note: matched to the old wheel and the bracket gap
  pocket_d:
    value: 22.2
    unit: mm
    kind: design
    source: design
    note: 'from the fit coupon: the 22.19 seat went in with a firm thumb press and
      held the bearing upside down'
  pocket_depth:
    value: 7.5
    unit: mm
    kind: design
    source: design
    note: 0.5 mm deeper than the 7.0 bearing, so with the 2.0 spacer the inner rings
      clear the web by 0.5 mm each side
  web_thickness:
    value: 1
    unit: mm
    kind: design
    source: design
    note: wheel_w - 2*pocket_depth; ties the two pocket walls together
  web_bore:
    value: 14.6
    unit: mm
    kind: design
    source: design
    note: 0.6 mm clearance around the 14.0 spacer OD
  rim_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: breaks the tread edges so they cannot snag the track
  mouth_chamfer:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: lead-in on each pocket mouth so the bearings press in squarely
  spacer_od:
    value: 14
    unit: mm
    kind: design
    source: design
    note: bears on the 608 inner-ring face (14.5 OD) and clears the web bore
  spacer_id:
    value: 8.5
    unit: mm
    kind: design
    source: design
    note: 0.5 mm clearance over the 8 mm shank
  spacer_t:
    value: 2
    unit: mm
    kind: design
    source: design
    note: equals the gap between the two inner rings; this is what stops the axle
      clamp pinching the wheel web
  axle_stack:
    value: 18
    unit: mm
    kind: design
    source: design
    note: wheel 16 + nut-side spacer 2 = length of bolt the wheel uses; the bolt needs
      this plus your bracket thickness plus the nut
  fit_d1:
    value: 22.05
    unit: mm
    kind: design
    source: design
    note: coupon pocket, loose end of the range
  fit_d2:
    value: 22.2
    unit: mm
    kind: design
    source: design
    note: coupon pocket - this is the one that fitted, now the wheel's pocket_d
  fit_d3:
    value: 22.35
    unit: mm
    kind: design
    source: design
    note: coupon pocket, tight end of the range
  coupon_t:
    value: 10
    unit: mm
    kind: design
    source: design
    note: coupon plate thickness; 2.5 mm of floor under each pocket
parts:
- id: wheel
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    od = p.wheel_od\n    w = p.wheel_w\n    pd = p.pocket_d\n\
    \    dep = p.pocket_depth\n    bore = p.web_bore\n    ch = p.rim_chamfer\n   \
    \ mc = p.mouth_chamfer\n    r_out = od / 2.0\n    r_p = pd / 2.0\n    r_b = bore\
    \ / 2.0\n    web = p.web_thickness\n\n    def cyl(r, h, z0):\n        return cq.Workplane(\"\
    XY\").workplane(offset=z0).circle(r).extrude(h)\n\n    def frustum(r1, r2, h,\
    \ z0):\n        return (cq.Workplane(\"XY\").workplane(offset=z0).circle(r1)\n\
    \                .workplane(offset=h).circle(r2).loft(ruled=True))\n\n    # tread\
    \ ring: solid from the pocket wall out to the tread, full width\n    wheel = cq.Workplane(\"\
    XY\").circle(r_out).circle(r_p).extrude(w)\n\n    # web joining the two pocket\
    \ floors (leaves a pocket at each end)\n    wheel = wheel.union(cyl(r_p, web,\
    \ dep).cut(cyl(r_b, web, dep)))\n\n    # rim chamfers, bottom then top\n    wheel\
    \ = wheel.cut(cyl(r_out + 2.0, ch, 0.0)\n                      .cut(frustum(r_out\
    \ - ch, r_out, ch, 0.0)))\n    wheel = wheel.cut(cyl(r_out + 2.0, ch, w - ch)\n\
    \                      .cut(frustum(r_out, r_out - ch, ch, w - ch)))\n\n    #\
    \ bearing pocket mouth chamfers, bottom then top\n    wheel = wheel.cut(frustum(r_p\
    \ + mc, r_p, mc, 0.0).cut(cyl(r_p, mc, 0.0)))\n    wheel = wheel.cut(frustum(r_p,\
    \ r_p + mc, mc, w - mc)\n                      .cut(cyl(r_p, mc, w - mc)))\n\n\
    \    return wheel"
  print_orientation: 'flat on the bed, exactly as modelled: z=0 is the face that goes
    down, the wheel''s axis is vertical. No supports - the only overhang is the 3.7
    mm-wide web bridging inwards over each pocket, well under the 50 mm limit. 3 perimeters,
    0.2 mm layers.'
  use_orientation: axis horizontal, spinning on the M8 bolt through the two 608 bearings;
    tread running on the door track.
- id: axle_spacer
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    return (cq.Workplane(\"XY\")\n            .circle(p.spacer_od\
    \ / 2.0)\n            .circle(p.spacer_id / 2.0)\n            .extrude(p.spacer_t))"
  print_orientation: flat on the bed, as modelled (z=0 is the underside). No supports.
    Print TWO.
  use_orientation: one sits in the wheel's web bore between the two 608 inner rings;
    the second sits on the bolt under the nut as a washer.
- id: fit_coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    dias = [p.fit_d1, p.fit_d2, p.fit_d3]\n    dep = p.pocket_depth\n\
    \    t = p.coupon_t\n    n = len(dias)\n    pitch = 26.0\n    L = pitch * (n -\
    \ 1) + 28.0\n    W = 28.0\n    plate = cq.Workplane(\"XY\").box(L, W, t, centered=(True,\
    \ True, False))\n    xs = [(i - (n - 1) / 2.0) * pitch for i in range(n)]\n  \
    \  for x, d in zip(xs, dias):\n        plate = plate.cut(\n            cq.Workplane(\"\
    XY\").workplane(offset=t - dep).circle(d / 2.0)\n            .extrude(dep + 1.0).translate((x,\
    \ 0, 0)))\n        plate = plate.cut(\n            cq.Workplane(\"XY\").circle(2.0).extrude(t).translate((x,\
    \ 0, 0)))\n    return plate"
  print_orientation: flat on the bed, as modelled. No supports.
  use_orientation: 'test piece only - already printed and reported: the 22.19 seat
    fitted.'
