      (wheel 16 + nut-side spacer 2 + nut 4.7) plus your bracket''s thickness. If
      it is short, get an ISO 4762 M8x50; if it is long, add ISO 7089 M8 take-up washers
      under the nut.'
- id: c7
  part: wheel
  feature: tread 50 dia x 16 wide
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - wheel_w
  - old_wheel_od
  - old_wheel_w
  check:
    method: measure
    ref: null
    description: 'caliper the printed tread: 49.8-50.2 mm across and 16.0 +/- 0.2
