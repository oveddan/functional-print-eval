manual:
- n: '1'
  text: Print the wheel flat as modelled (the pocket that faces down is chamfered
    and the web only bridges 3.7 mm, so no supports are needed). 0.2 mm layers, 3
    perimeters. This is the big print - about 25 g.
  parts:
  - wheel
  hardware: []
  tool: 3D printer
- n: '2'
  text: 'Print the two spacer rings, flat as modelled. They are identical: one becomes
    the spacer between the bearings, the other is the washer under the nut.'
  parts:
  - axle_spacer
  hardware: []
  tool: 3D printer
- n: '3'
  text: Press the first 608 bearing into the bottom pocket. Wheel flat on the bench,
    pocket up, bearing square, push it in with both thumbs until it seats on the pocket
    floor. It should be firm but never need a hammer - if it fights, stand the wheel
    in ~50 C water for a minute first.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '4'
  text: Flip the wheel over and press the second 608 into the other pocket the same
    way. Both bearings should sit flush with the wheel's faces.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '5'
  text: Drop one spacer ring into the middle. It sits in the web bore, centred between
    the two bearing inner rings - it should be loose in the bore and loose on the
    axle.
  parts:
  - wheel
  - axle_spacer
  hardware: []
  tool: null
- n: '6'
  text: 'Spin check before you fit anything: both bearings must turn freely and the
    spacer ring must be free to rattle sideways about 0.5 mm. That clearance is what
    keeps the wheel from being pinched by the axle clamp - do not remove it.'
  parts:
  - wheel
  - axle_spacer
  hardware: []
  tool: null
- n: '7'
  text: Push the M8 bolt through the wheel from the side that will face away from
    the hanger bracket. The 13 mm bolt head must land on a bearing's inner ring (14.5
    mm across), not on the plastic.
  parts:
  - wheel
  hardware:
  - axle_bolt
  tool: null
- n: '8'
  text: Slide the second spacer ring over the bolt and push it up against the far
    bearing's inner ring. This is the washer the nut will squeeze.
  parts:
  - axle_spacer
  hardware:
  - axle_bolt
  tool: null
- n: '9'
  text: Pass the bolt through the hanger bracket's axle hole, so the bracket sits
    between the wheel and the nut (the wheel on the outside, next to the bolt head).
    If your bolt is longer than the stack, add ISO 7089 M8 washers here, on top of
    the printed ring.
  parts: []
  hardware:
  - axle_bolt
  - takeup_washer
  tool: null
- n: '10'
  text: 'Fit the M8 nut (ISO 4032, or the ISO 10511 lock nut if you have one - better,
    since a door vibrates). Tighten it snug, then test: flick the wheel, it should
    spin freely and have no sideways rock. If it drags, back the nut off an eighth
    of a turn; if it rocks, a little more. Do not heave on it - the clamp load goes
    through the printed ring.'
  parts: []
  hardware:
  - axle_bolt
  - hex_nut
  tool: 10 mm spanner
- n: '11'
  text: Set the wheel on the track and hang the door. The tread is 50 mm like the
    old wheel, so the door should sit at the same height - adjust the other roller
    to match and check the door runs straight.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '12'
  text: 'Re-check after a few days of use: the nut should still be snug and the wheel
    still spinning free. If the wheel develops a sideways rock, the bearing pockets
    have relaxed - tighten the nut slightly, or reprint the wheel 0.05 mm tighter
    on the pockets.'
  parts:
  - wheel
  hardware:
  - hex_nut
  tool: null
