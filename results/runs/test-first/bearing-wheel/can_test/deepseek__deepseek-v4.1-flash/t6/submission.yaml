task: bearing-wheel
note: 'A 50 x 16 mm replacement roller that carries your two 608ZZ bearings pressed
  into its two faces, running on your M8 bolt as the axle. Bearings, not printed plastic,
  take the load and the rotation.


  Three things could not be measured (the broken wheel, the bolt''s length, the bracket),
  so: the wheel copies the 50 x 16 mm you told me with a flat, ungrooved tread (a
  plain cylinder rolls in a channel track or on a rail); the axle is specified as
  ISO 4762 M8x35 from the hardware list, which suits a bracket up to about 7 mm thick
  — your salvaged bolt is fine if it has 30 mm or more under the head; the bracket
  is assumed 2.5 mm thick with an 8.5 mm axle hole.


  The only fit I could not predict was a steel 608 pressed into a PLA pocket, so I
  had you print a coupon. Result: a 21.79 pocket would not take the bearing, a 22.09
  pocket took it with a snug push and held it upside down. The wheel''s pockets are
  22.1, 7.5 mm deep, with a 20 mm shelf between them, so each bearing lands 0.5 mm
  below the wheel face and cannot go in too far. If your pockets come out any looser
  than the coupon''s, a drop of superglue in each holds the outer rings.


  Note the washers bear on the bearings'' inner rings only if the nut is snugged,
  not cranked down — the lock nut is there so you can set it and leave it.'
questions:
- text: How long is your M8 bolt under the head, and how thick is the metal of the
    door bracket where the axle passes through?
  answer: Not measured - I specified ISO 4762 M8x35 from the hardware list and assumed
    a 2.5 mm bracket; anything from 30 to 40 mm under the head works.
- text: Did the old wheel have a groove round its tread, or was the running surface
    flat?
  answer: Could not be measured - I used a flat 16 mm cylinder, which rolls in a channel
    track or on a rail.
