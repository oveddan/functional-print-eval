parts:
- id: wheel
  role: final
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    ro = p.wheel_od / 2.0       \
    \   # 25.0\n    w = p.wheel_w                  # 16.0\n    sr = p.bearing_seat_d\
    \ / 2.0    # 11.05\n    sd = p.bearing_seat_depth      # 7.5\n    shr = p.shelf_d\
    \ / 2.0          # 10.0\n    ch = p.edge_chamfer            # 1.0\n    e = 0.5\
    \                        # overshoot, so no cutting face is flush with a part\
    \ face\n\n    # blank: 50 dia x 16 disc, z = 0 is the bed\n    wheel = cq.Workplane(\"\
    XY\").circle(ro).extrude(w)\n\n    # 20 mm bore right through, leaving a 1 mm\
    \ shelf between the two pockets\n    wheel = wheel.cut(\n        cq.Workplane(\"\
    XY\").workplane(offset=-e).circle(shr).extrude(w + 2 * e)\n    )\n    # bearing\
    \ pocket pressed in from the bottom face, floor at z = 7.5\n    wheel = wheel.cut(\n\
    \        cq.Workplane(\"XY\").workplane(offset=-e).circle(sr).extrude(sd + e)\n\
    \    )\n    # bearing pocket pressed in from the top face, floor at z = 8.5\n\
    \    wheel = wheel.cut(\n        cq.Workplane(\"XY\").workplane(offset=w - sd).circle(sr).extrude(sd\
    \ + e)\n    )\n\n    # 1 mm chamfers: both tread rims and both pocket mouths (bearing\
    \ lead-in)\n    wheel = wheel.faces(\">Z\").edges().chamfer(ch)\n    wheel = wheel.faces(\"\
    <Z\").edges().chamfer(ch)\n    return wheel\n"
  print_orientation: 'flat: one 50 mm face on the bed, bore axis vertical, z = 0 at
    the bed, 16 mm tall. No supports - the only overhang is the 1.05 mm shelf ledge
    at z = 8.5.'
  use_orientation: 'bore axis horizontal: a 608ZZ pressed into each face, your M8
    bolt through both bores as the axle, the 50 mm tread rolling on the door''s track'
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    L = p.coupon_l\n    W = p.coupon_w\n\
    \    T = p.coupon_t\n    pitch = p.coupon_pitch\n    depth = p.coupon_depth\n\
    \    ds = [p.coupon_d1, p.coupon_d2, p.coupon_d3, p.coupon_d4]\n    plate = cq.Workplane(\"\
    XY\").box(L, W, T, centered=(True, True, False))\n    n = len(ds)\n    for i,\
    \ d in enumerate(ds):\n        x = (i - (n - 1) / 2.0) * pitch\n        tool =\
    \ (cq.Workplane(\"XY\")\n                .workplane(offset=T - depth)\n      \
    \          .moveTo(x, 0)\n                .circle(d / 2.0)\n                .extrude(depth\
    \ + 1.0))\n        plate = plate.cut(tool)\n    return plate\n"
  print_orientation: flat on the bed, blind pockets opening upward, 10 mm tall
  use_orientation: 'a 608 bearing pushed into each pocket by hand (left to right:
    21.5, 21.8, 22.1, 22.4) to pick the pocket size for the wheel'
hardware:
- id: bearing_in
  ref: 608ZZ
  qty: 1
- id: bearing_out
  ref: 608ZZ
  qty: 1
- id: axle_bolt
  ref: ISO 4762 M8x35
  qty: 1
- id: washer_head
  ref: ISO 7089 M8
  qty: 1
- id: washer_bracket
  ref: ISO 7089 M8
  qty: 1
- id: axle_nut
  ref: ISO 10511 M8
  qty: 1
joints:
- id: axle
  fastener: axle_bolt
  axis_origin:
  - 0.0
  - 0.0
  - -1.1
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel
    feature: the two 608 bearing pockets - the bolt runs through the bearing bores,
      not through printed plastic
    role: clearance
  nut: axle_nut
  external: 'the door''s existing hanger bracket: the bolt passes through its axle
    hole, then the second washer, then the lock nut'
criteria:
- id: c_seat_low
  part: wheel
  feature: bearing pocket in the lower face (z = 0.5 to 7.5)
  relation: engages
  hardware: bearing_in
  clearance_mm: 0.05
  params:
  - bearing_seat_d
  - bearing_od
  - bearing_seat_depth
  check:
    method: coupon
    ref: fit_coupon
    description: coupon hole 3 (22.09 printed) took a 608 with a snug push and held
      it upside down; 21.79 would not go in. The pocket is 22.1.
- id: c_seat_up
  part: wheel
  feature: bearing pocket in the upper face (z = 8.5 to 15.5)
  relation: engages
  hardware: bearing_out
  clearance_mm: 0.05
  params:
  - bearing_seat_d
  - bearing_od
  - bearing_seat_depth
  check:
    method: coupon
    ref: fit_coupon
    description: same pocket size as the coupon's snug 22.09 hole
- id: c_shelf_low
  part: wheel
  feature: shelf face at z = 7.5 (20 mm bore, 1.05 mm wide)
  relation: supports
  hardware: bearing_in
  clearance_mm: null
  params:
  - bearing_seat_depth
  - shelf_d
  - bearing_w
  check:
    method: none
    ref: null
    description: the bearing's outer ring bottoms out here, so it finishes 0.5 mm
      below the wheel face and cannot be pushed in further
- id: c_shelf_up
  part: wheel
  feature: shelf face at z = 8.5
  relation: supports
  hardware: bearing_out
  clearance_mm: null
  params:
  - bearing_seat_depth
  - shelf_d
  - bearing_w
  check:
    method: none
    ref: null
    description: the second bearing bottoms out on the other side of the same 1 mm
      shelf, so the two bearings are symmetric about the wheel's mid-plane
- id: c_bolt_through
  part: wheel
  feature: the two 608 bores
  relation: clears
  hardware: axle_bolt
  clearance_mm: 0.0
  params:
  - bolt_shank_d
  - bearing_bore
  check:
    method: measure
    ref: null
    description: the shank measured about 8 mm against the 8 mm bearing bore - a light
      push; if your bolt is tight in the bore, polish the shank with a strip of wet-and-dry
- id: c_bolt_len
  part: wheel
  feature: 'the axle stack: washer + wheel + washer + bracket + lock nut'
  relation: contains
  hardware: axle_bolt
  clearance_mm: null
  params:
  - bolt_len
  - bolt_len_min
  - bracket_t
  - locknut_h
  - washer_t
  check:
    method: measure
    ref: null
    description: 'hold the bolt up against the assembled stack: it must reach right
      through the 8 mm lock nut. 30 mm under the head is the minimum; M8x35 covers
      a bracket up to about 7 mm thick'
- id: c_track
  part: wheel
  feature: 50 mm x 16 mm tread
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - wheel_w
  - old_wheel_od
  - old_wheel_w
  check:
    method: none
    ref: null
    description: same diameter and width as the wheel you are replacing, so it runs
      in the same track - check it rolls without rubbing before you hang the door
- id: c_print
  part: wheel
  feature: 1.05 mm shelf ceiling at z = 8.5, and the two pocket mouths
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - shelf_d
  - bearing_seat_d
  - edge_chamfer
  check:
    method: none
    ref: null
    description: the widest unsupported span in the whole part is that 1.05 mm ledge
      - far inside the 50 mm bridge limit - so it prints with no supports
manual:
- n: '1'
  text: Print the wheel flat on one of its 50 mm faces - no supports, 0.2 mm layers,
    4 walls, about 40% infill. The only overhang is the shelf ledge inside, which
    bridges on its own.
  parts:
  - wheel
  hardware: []
  tool: 3D printer
- n: '2'
  text: 'If you have not already tested the coupon: the 22.09 pocket took a 608 with
    a snug push and held it upside down, the 21.79 would not go in. The wheel''s pockets
    are 22.1, so the bearing should need a firm push.'
  parts:
  - fit_coupon
  hardware: []
  tool: calipers
- n: '3'
  text: Press one 608ZZ into the pocket in one face, going in straight, until its
    outer ring stops on the shelf inside - it finishes 0.5 mm below the face. If it
    is stiff, lay a washer over the bearing and draw it in with the M8 bolt and the
    lock nut. If it drops in with no resistance at all, wipe a drop of superglue round
    the pocket first.
  parts:
  - wheel
  hardware:
  - bearing_in
  - axle_bolt
  - washer_head
  - axle_nut
  tool: clamp or vice (optional)
- n: '4'
  text: Turn the wheel over and press the second 608ZZ into the other face the same
    way. Both bearings must sit square - put a finger through the bores and spin the
    wheel; it should run true with no wobble.
  parts:
  - wheel
  hardware:
  - bearing_out
  tool: null
- n: '5'
  text: 'Build the axle: M8 bolt, then a washer, then through both bearings, then
    the second washer, then through the hole in the door''s hanger bracket, then the
    ISO 10511 M8 lock nut.'
  parts:
  - wheel
  hardware:
  - axle_bolt
  - washer_head
  - washer_bracket
  - axle_nut
  tool: null
- n: '6'
  text: 'Tighten the lock nut until the wheel has no rattle, then check it spins freely.
    If it drags, back the nut off an eighth of a turn - the nylon insert holds it
    there. Do not crank it down: the washers bear on the bearings'' inner rings, and
    squeezing them onto the outer rings stops the wheel rolling.'
  parts: []
  hardware:
  - axle_nut
  - axle_bolt
  tool: 13 mm spanner
- n: '7'
  text: Hang the door back on its track and roll it. The new wheel is 50 mm across
    and 16 mm wide, the same as the old one, so it should sit in the track exactly
    where the old wheel ran.
  parts:
  - wheel
  hardware: []
  tool: null
