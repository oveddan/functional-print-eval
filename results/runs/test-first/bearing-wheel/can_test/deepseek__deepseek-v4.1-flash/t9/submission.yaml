    role: clearance
  - part: race_cup
    feature: flange outer face, nut side
    role: nut_pocket
  nut: lock_nut
  external: closet-door roller bracket - the two sides the old axle passed through
criteria:
- id: c1_bearing_seat
  part: wheel
  feature: Ø22.1 bearing bore
  relation: contains
  hardware: null
  clearance_mm: -0.1
  params:
  - bore_d
  - bearing_od
  check:
    method: coupon
    ref: fit_coupon
    description: coupon bore at the same nominal (22.10) was a snug hand press that
      held the bearing upside down; 21.95 was too tight. If the wheel's seat comes
      out tighter than the coupon, ream it or sand the bore lightly.
- id: c2_cup_on_inner_race
  part: race_cup
  feature: Ø10.4 boss end face
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - cup_boss_od
  - cup_boss_len
  - bearing_w
  check:
    method: measure
    ref: null
    description: with a bearing in the wheel, the cup's boss must land on the bearing's
      steel inner ring (the ring around the 8 mm hole) and not rock on the flat shield
      around it. If it rocks on the shield, the boss needs to come down in diameter.
- id: c3_cup_on_bolt
  part: race_cup
  feature: Ø8.4 bolt bore
  relation: clears
  hardware: axle
  clearance_mm: 0.4
  params:
  - cup_id
  - bolt_shank_d
  check:
    method: measure
    ref: null
    description: cup slides onto the M8 bolt with a little play
- id: c4_wheel_clears_bolt
  part: wheel
  feature: Ø22.1 bearing bore
  relation: clears
  hardware: axle
  clearance_mm: 14.1
  params:
  - bore_d
  - bolt_shank_d
  check:
    method: none
    ref: null
    description: the bolt passes through the two bearing bores, never touching the
      wheel itself
- id: c5_tread_matches_old_wheel
  part: wheel
  feature: tread, Ø50 x 16 wide
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - wheel_w
  check:
    method: measure
    ref: null
    description: same diameter and tread width as the old wheel, so the door sits
      at the same height and the tread fills the track the way the old one did
- id: c6_cup_needs_bracket_gap
  part: race_cup
  feature: flange outer face
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - cup_flange_t
  - cup_boss_len
  - wheel_w
  check:
    method: measure
    ref: null
    description: each cup needs about 1.6 mm between the wheel's face and the bracket's
      inner face, so the bracket gap needs to be roughly 19.5 mm or more. Tighter
      than that, mount without the cups and let the bracket guide the wheel (manual
      step 6).
- id: c7_bolt_shank_under_bearings
  part: wheel
  feature: bearing bore, both bearings
  relation: engages
  hardware: lock_nut
  clearance_mm: null
  params:
  - bearing_w
  - cup_flange_t
  - cup_boss_len
  check:
    method: none
    ref: null
    description: an ISO 4762 M8x50 has about 22 mm of unthreaded shank under the head,
      which covers both bearings (they sit about 7 to 21 mm under the head with a
      3 mm bracket side), so the bearings run on plain shank and only the lock nut
      sits on thread
manual:
- n: '1'
  text: 'Print the parts: wheel (flat on the bed, no supports), 2 x race_cup (print
    three or four, they are tiny), and the fit_coupon if you have not printed it yet.
    Layer height 0.2 mm, PLA, no supports anywhere.'
  parts:
  - wheel
  - race_cup
  - fit_coupon
  hardware: []
  tool: 3D printer
- n: '2'
  text: 'Press the two 608 bearings into the wheel''s central bore, one from each
    flat face, so they meet in the middle. Press the first one in until its face sits
    about 1 mm below the wheel''s face (a 1 mm washer or a steel rule makes a good
    gauge), then press the second one from the other side until it stops against the
    first. Keep them square: a vise works, or use the M8 bolt with a nut and a washer
    as a puller. If a bearing turns out loose rather than a snug press, keep it in
    with a drop of superglue.'
  parts:
  - wheel
  hardware:
  - axle
  - washer
  tool: vise or the M8 bolt as a press
- n: '3'
  text: Get the old wheel out of the door. If its axle is a rivet, drill or grind
    the head off and knock it out; keep the bracket. If the bracket's axle hole is
    smaller than 8.4 mm, drill or file it out to 8.4 mm so the M8 bolt slides through.
  parts: []
  hardware:
  - axle
  tool: drill / file
- n: '4'
  text: 'Bench-test the stack before it goes in the door: bolt head, washer, race_cup
    (boss toward the wheel), wheel with its bearings, race_cup (boss toward the wheel),
    washer, lock nut. Tighten the nut a little. The cups'' small bosses must sit on
    the bearings'' steel inner rings (the ring right around the 8 mm hole) and the
    wheel must spin freely, with no wobble and no binding. If a cup rocks on the flat
    shield instead of the inner ring, stop and tell me - the boss needs to be smaller
    in diameter.'
  parts:
  - wheel
  - race_cup
  hardware:
  - axle
  - washer
  - lock_nut
  tool: null
- n: '5'
  text: 'Fit it in the bracket in this order: bolt head, washer, one side of the bracket,
    race_cup (boss toward the wheel), the wheel, race_cup (boss toward the wheel),
    the other side of the bracket, washer, lock nut. Add extra M8 washers between
    the bracket''s inner faces and the cups until the cups are held snug against the
    bearings and the wheel has no side-to-side play. The washers must press the cups
    - nothing should press the wheel itself.'
  parts:
  - wheel
  - race_cup
  hardware:
  - axle
  - washer
  - lock_nut
  tool: two spanners/wrenches
- n: '6'
  text: 'Tighten the lock nut and check: the wheel spins freely, there is no side
    play, and the bracket''s sides are not touching the wheel''s faces. If the bracket''s
    gap is tighter than about 19.5 mm the cups will not fit - in that case leave the
    cups out, let the bracket''s two sides guide the wheel the way they guided the
    old one, and tighten the nut only until the wheel just stops rattling. It must
    still spin freely.'
  parts:
  - wheel
  - race_cup
  hardware:
  - lock_nut
  - washer
  tool: two spanners/wrenches
- n: '7'
  text: Hang the door back on its track and roll it a few times. Check the door sits
    at the same height as before and the tread runs in the track. If the bolt is longer
    than the stack, either leave the spare thread showing or trim it with a hacksaw
    - keep at least 3 mm of thread past the lock nut so it can still lock.
  parts: []
  hardware:
  - axle
  - lock_nut
  tool: hacksaw (optional)
