task: bearing-wheel
note: 'Wheel diameter and width are copied from your old wheel (about 50 x 16) so
  the door sits at the same height and the tread fills the track. The bearing seat
  (Ø22.1) comes straight from the coupon you printed: the 21.95 hole was too tight
  to press by hand and 22.10 was a snug press that held the bearing upside down. The
  axle is the M8 bolt through the two bearing bores; two small printed cups sit against
  the bearings'' inner rings so the washer stack and the bracket''s sides squeeze
  the inner rings (the stationary part) and never the wheel - that is what lets the
  wheel spin freely no matter how tight the nut is. Use the ISO 4762 M8x50 from the
  list if your own M8 bolt is shorter than about 45 mm or is threaded all the way
  to the head: a 50 mm bolt gives about 22 mm of plain shank, which is just enough
  for both bearings to sit on unthreaded metal. Two things I could not measure: the
  gap between the bracket''s two sides and your bolt''s length. If the gap is 19.5
  mm or more the cups go in as designed; if it is tighter, step 6 of the manual mounts
  the wheel without them, exactly like the original wheel was guided by the bracket.'
questions:
- text: What is the clear gap between the two sides of the bracket the old wheel sat
    in (the space the wheel's 16 mm width sat in)?
  answer: Could not be measured. The design uses the two race_cups if the gap is about
    19.5 mm or more; below that the manual's step 6 mounts the wheel without the cups
    and lets the bracket's sides guide it, as the original wheel was guided.
- text: How long is your M8 bolt under the head, and is it threaded all the way to
    the head?
  answer: Only the shank was reported (about 8 mm). The design is drawn around the
    ISO 4762 M8x50 from the catalog, whose plain shank is long enough that both bearings
    sit on unthreaded metal; a shorter or fully threaded bolt still works but the
    bearings will sit on thread.
- text: Does the tread of the old wheel have a groove or a raised flange, and is the
    track a flat rail or a channel with sides?
  answer: Not measured. The new tread is a plain flat Ø50 x 16 cylinder with chamfered
    edges, which runs on a flat rail and inside a channel alike.
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel was about 50 mm across; keeping it keeps the door at the same
      height on the track
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel was about 16 mm wide
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: 608 outer race, measured across the outer race with calipers
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: 608 race face to race face
  bearing_bore_d:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 bore; the M8 shank rides in it with a few hundredths of clearance
  bolt_shank_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: M8 shank as measured by the user (about 8 mm)
  bore_d:
    value: 22.25
    unit: mm
    kind: design
    source: design
    note: coupon hole 4 - not reported; the sparest fit if the chosen seat ever prints
      tight
  rim_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: 45 deg chamfer on both tread edges
  lead_chamfer:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: conical lead-in at each mouth of the bearing bore, to start the bearing
      square
  cup_flange_od:
    value: 15
    unit: mm
    kind: design
    source: design
    note: face the M8 washer stack presses; stays clear of the wheel because the wheel's
      plastic starts at r = 11
  cup_flange_t:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: ''
  cup_boss_od:
    value: 10.4
    unit: mm
    kind: design
    source: design
    note: must stay inside the 608 inner-race shoulder (about Ø12) so it presses the
      inner race only, never the shield - that is what keeps the wheel from being
      clamped solid
  cup_boss_len:
    value: 1.4
    unit: mm
    kind: design
    source: design
    note: reaches 1 mm into the bore mouth to touch the bearing face (the bearing
      sits 1 mm below the wheel's face) and still leaves the flange off the wheel
  cup_id:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: slip fit over the M8 shank and its thread crests
  coupon_l:
    value: 120
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_w:
    value: 26
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_h:
    value: 8
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_pitch:
    value: 30
    unit: mm
    kind: design
    source: design
    note: ''
  bore_a:
    value: 21.8
    unit: mm
    kind: design
    source: design
    note: coupon hole 1 (left, next to the notch) - printed too tight to press by
      hand
  bore_b:
    value: 21.95
    unit: mm
    kind: design
    source: design
    note: coupon hole 2 - printed too tight to press by hand
  bore_c:
    value: 22.1
    unit: mm
    kind: design
    source: design
    note: 'coupon hole 3 - snug press, holds the bearing upside down: this is the
      size used for the wheel'
  bracket_gap:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: 'clear gap between the bracket''s two sides: could not be measured. With
      the cups the design needs about 19.5 mm; below that, mount without the cups
      (step 6 of the manual)'
  bracket_ear_t:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: bracket side thickness; assumed about 3 mm when choosing the bolt length
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    R = p.wheel_od / 2.0\n    h = p.wheel_w\n    r = p.bore_d\
    \ / 2.0\n    c = p.rim_chamfer\n    lc = p.lead_chamfer\n    # solid disc, axis\
    \ vertical, bottom face on the bed\n    body = cq.Workplane(\"XY\").circle(R).extrude(h)\n\
    \    body = body.edges().chamfer(c)\n    # bearing bore with a conical lead-in\
    \ at each face\n    cutters = [\n        cq.Solid.makeCylinder(r, h + 2.0, cq.Vector(0,\
    \ 0, -1.0), cq.Vector(0, 0, 1)),\n        cq.Solid.makeCone(r + lc, r, lc, cq.Vector(0,\
    \ 0, -lc), cq.Vector(0, 0, 1)),\n        cq.Solid.makeCone(r, r + lc, lc, cq.Vector(0,\
    \ 0, h), cq.Vector(0, 0, 1)),\n    ]\n    for s in cutters:\n        body = body.cut(cq.Workplane(\"\
    XY\").newObject([s]))\n    return body\n"
  print_orientation: one flat face down on the bed, wheel axis vertical (z = 0 is
    that face). The 22.1 bore and both tread edges are vertical/perimeter features,
    so nothing overhangs and no supports are needed; the tread comes off the printer
    round and the bore comes out round for the press fit.
  use_orientation: axis horizontal, tread down on the track, the two flat faces vertical.
    Two 608 bearings are pressed into the central bore, one from each face, meeting
    in the middle.
- id: race_cup
  role: final
  material: PLA
  code: "def build(p):\n    fo = p.cup_flange_od / 2.0\n    ft = p.cup_flange_t\n\
    \    bo = p.cup_boss_od / 2.0\n    bl = p.cup_boss_len\n    ri = p.cup_id / 2.0\n\
    \    # flange on the bed, boss up: no overhangs\n    part = cq.Workplane(\"XY\"\
    ).circle(fo).extrude(ft)\n    part = part.faces(\">Z\").workplane().circle(bo).extrude(bl)\n\
    \    # through bore for the M8 bolt\n    part = part.cut(\n        cq.Workplane(\"\
    XY\").circle(ri).extrude(ft + bl + 2.0).translate((0, 0, -1.0))\n    )\n    return\
    \ part\n"
  print_orientation: wide flange face on the bed, small boss pointing up. No supports.
  use_orientation: slides on the M8 bolt with its boss toward the wheel, so the boss
    lands on the bearing's metal inner ring and the flange takes the washer stack.
    Print two (print a spare or two - they are tiny).
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    L, W, H = p.coupon_l, p.coupon_w, p.coupon_h\n    part\
    \ = cq.Workplane(\"XY\").box(L, W, H, centered=(True, True, False))\n    # orientation\
    \ notch at the -X end (marks the smallest bore)\n    notch = (\n        cq.Workplane(\"\
    XY\")\n        .center(-L / 2.0 + 3.0, 0)\n        .box(6.0, 8.0, H + 2.0, centered=(True,\
    \ True, False))\n        .translate((0, 0, -1.0))\n    )\n    part = part.cut(notch)\n\
    \    xs = [(-1.5 + i) * p.coupon_pitch for i in range(4)]\n    dias = [p.bore_a,\
    \ p.bore_b, p.bore_c, p.bore_d]\n    for x, d in zip(xs, dias):\n        tool\
    \ = (\n            cq.Workplane(\"XY\")\n            .center(x, 0)\n         \
    \   .circle(d / 2.0)\n            .extrude(H + 2.0)\n            .translate((0,\
    \ 0, -1.0))\n        )\n        part = part.cut(tool)\n    return part\n"
  print_orientation: flat, large face on the bed, holes vertical - same orientation
    as the wheel, so the press fit it reports matches the wheel.
  use_orientation: 'already printed and tested: left to right 21.80 / 21.95 / 22.10
    / 22.25 (the notch marks the 21.80 end). The 22.10 hole is the one that was a
    snug hand press, so that is the size used in the wheel.'
