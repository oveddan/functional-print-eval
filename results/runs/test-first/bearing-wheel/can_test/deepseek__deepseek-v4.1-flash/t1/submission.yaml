task: bearing-wheel
note: 'Yes - a printed wheel that spins on your M8 bolt is a good fit for this job,
  because the whole load path runs through the two 608s and the bolt, not through
  the plastic. The printed part only has to hold the outer rings (Ø22.10 pockets,
  the size your coupon proved grips while going in) and carry the door''s weight from
  the rim into those rings; the bolt''s 22 mm of plain shank passes through both inner
  rings, two 1.2 mm pads and a 2 mm spacer, so the clamp loads the inner rings only
  and nothing ever rubs the seals.


  Design summary: 50 x 16 mm wheel, two Ø22.10 x 7 mm pockets bottoming on a 2 mm
  central rib, rim chamfered 0.8 mm, pocket mouths chamfered 0.6 mm. Printed flat
  on its side face (axis vertical) so the bore prints round and the radial door load
  runs along the extrusion lines, not across layers. No supports needed anywhere -
  the only bridges are the rib and the pocket ceilings, both well under 22 mm.


  Two prints come out of this: the wheel/pads/spacer set, and a reusable press tool
  that squeezes both bearings in squarely using the M8 bolt itself as the drawbar.
  Assumptions I had to make, since the broken wheel and bracket gave no readings:
  the rim is a plain cylinder with chamfered edges (not grooved or flanged), the load
  is radial on the rim, and the hanger has a hole you can get the bolt through (drill
  it to 8.5 mm if not). If any of those is wrong - especially a groove in the old
  rim - the door may sit or track slightly differently, so check the first roll before
  you trust it with a heavy door. Also worth knowing: PLA creeps under sustained load,
  so this suits a normal interior door; if the door is solid oak, keep the weight
  per wheel modest and check the fit again after a month.'
questions:
- text: How much clear space is there between the two faces of the hanger bracket
    where the wheel sat? The assembled cartridge is 18.4 mm wide and needs about 18.9
    mm.
  answer: null
- text: Did the old wheel's rim have a V-groove, a flange, or was it a plain flat
    cylinder? I assumed a plain cylinder with 0.8 mm edge chamfers, which suits a
    rail or a flat channel.
  answer: null
- text: How long is your own M8 bolt under the head, and how much of that is unthreaded
    shank? I specified ISO 4762 M8x50 because it gives 22 mm of plain shank; yours
    is usable if it has at least 19 mm of shank and is at least 36 mm long.
  answer: null
- text: Is the wheel at the top of the door (the door hangs from it) or at the bottom?
    I assumed the load is radial on the rim, which is what the flat print orientation
    is chosen for.
  answer: null
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: the old wheel was about 50 mm across (person's estimate; the broken wheel
      could not be measured)
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: the old wheel was about 16 mm wide
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: 608ZZ outer diameter, confirmed by the person ('about 22 mm outside')
  bearing_id:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: 608ZZ bore ('about 8 mm - the hole')
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ width; sets the pocket depth so the ring finishes flush with the wheel
      face and bottoms on the rib
  bearing_pocket_d:
    value: 22.1
    unit: mm
    kind: hardware
    source: measured
    note: 'from the fit coupon: the 22.10 pocket took the bearing under thumb pressure
      and held it upside down; the 22.00 pocket would not accept it at all, so this
      printer''s holes run under the modelled size'
  bearing_pocket_depth:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: = the 608's width; two pockets of this depth leave the 2 mm central rib
      in a 16 mm wheel
  bolt_shank_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: the person's M8 bolt, measured across the shank ('about 8 mm')
  axle_bolt_len:
    value: 50
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8x50; needed for its 22 mm of unthreaded shank, see next param.
      The person's own M8 bolt is fine if it has >=19 mm of plain shank and is >=36
      mm long under the head
  axle_bolt_shank_len:
    value: 22
    unit: mm
    kind: hardware
    source: catalog
    note: 'ISO 4762 M8 is threaded b = 28 mm from the tip, so the 50 mm screw leaves
      22 mm of plain shank: covers the 18.4 mm cartridge plus the hanger, keeping
      thread out of both bearing bores'
  rim_chamfer:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: 45 deg chamfer on both rim edges so it enters the track cleanly
  pocket_mouth_chamfer:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: 45 deg lead-in on both pocket mouths so pressing the ring in cannot shave
      plastic
  rib_id:
    value: 15
    unit: mm
    kind: design
    source: design
    note: clearance bore through the central rib; must stay clear of the 11.4 mm spacer
      and of the spinning parts, see criteria
  pad_od:
    value: 11.4
    unit: mm
    kind: design
    source: design
    note: must stay inside the 608's seal bore (~12 mm) so the clamp never drags the
      seal, while still covering the inner ring's face
  pad_id:
    value: 8.2
    unit: mm
    kind: design
    source: design
    note: 0.2 mm clearance on the 8 mm shank
  pad_t:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: holds the bolt head and nut 1.2 mm off the bearing faces; two of these make
      the cartridge 18.4 mm wide, so the hanger needs ~18.9 mm of clear space
  spacer_od:
    value: 11.4
    unit: mm
    kind: design
    source: design
    note: 'same as the pads: inside the seal bore, clear of the 15 mm rib bore by
      1.8 mm radially'
  spacer_id:
    value: 8.2
    unit: mm
    kind: design
    source: design
    note: slips onto the shank between the two inner rings
  spacer_t:
    value: 2
    unit: mm
    kind: design
    source: design
    note: must equal the rib thickness (wheel_w - 2 x bearing_w) so the inner rings
      and the printed stack are clamped solid instead of preloading the balls
  bracket_gap_min:
    value: 18.9
    unit: mm
    kind: design
    source: design
    note: clear space the hanger must have for the wheel plus both pads
  press_od:
    value: 34
    unit: mm
    kind: design
    source: design
    note: 'press tool body: wide enough to rest on the wheel''s face outside the 22.1
      pocket'
  press_t:
    value: 6
    unit: mm
    kind: design
    source: design
    note: ''
  press_hole:
    value: 9
    unit: mm
    kind: design
    source: design
    note: centre hole for the M8 bolt used as the drawbar
  press_cb:
    value: 22.6
    unit: mm
    kind: design
    source: design
    note: counterbore that locates the bearing's outer ring, 0.6 mm of clearance on
      it
  press_cb_d:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: depth of that counterbore
  press_relief:
    value: 18
    unit: mm
    kind: design
    source: design
    note: relief that clears the seal and inner ring so only the outer ring is pressed
  press_relief_d:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: 1 mm deeper than the counterbore floor, leaving a 9-11.3 mm radius pressing
      annulus on the outer ring
  fit_d_1:
    value: 21.8
    unit: mm
    kind: design
    source: design
    note: 'coupon pocket, smallest end (marker hole end): would not go in'
  fit_d_2:
    value: 21.9
    unit: mm
    kind: design
    source: design
    note: 'coupon pocket: would not go in'
  fit_d_3:
    value: 22
    unit: mm
    kind: design
    source: design
    note: 'coupon pocket: would not go in'
  fit_d_4:
    value: 22.1
    unit: mm
    kind: design
    source: design
    note: 'coupon pocket, far end: goes in snug and holds upside down - the winner
