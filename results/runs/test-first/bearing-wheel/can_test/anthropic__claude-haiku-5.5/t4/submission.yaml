task: bearing-wheel
note: ''
questions:
- text: Does the old wheel have a groove or a flat tread, and how wide is the rail
    it rides on? The new wheel is modelled as a flat-tread cylinder 16 mm wide.
  answer: Unknown. Groove and rail width not measured; flat tread assumed.
- text: Is the bolt shank 8.0 mm or slightly smaller, and what is its length? The
    bearing bore measured about 8 mm, so the bolt must pass through it. The hardware
    ref 'ISO 4762 M8x30' is a placeholder for your bolt.
  answer: Shank about 8 mm; bolt length and head size not measured.
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel, about 50 mm across
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel, about 16 mm wide
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: 608 OD, about 22 mm
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: about 7 mm
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: about 8 mm
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: M8 shank about 8 mm
  pocket_d:
    value: 22.2
    unit: mm
    kind: design
    source: design
    note: 'tested: 21.9 would not seat, 22.2 seats and holds'
  hole_d:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: clearance for the bolt through the floor
parts:
- id: wheel
  role: final
  material: PLA high-speed black
  code: "def build(p):\n    R = p.wheel_od / 2\n    w = p.wheel_w\n    body = cq.Workplane('XY').circle(R).extrude(w)\n\
    \    depth = p.bearing_w\n    pocket = cq.Workplane('XY').workplane(offset=w -\
    \ depth).circle(p.pocket_d / 2).extrude(depth + 1)\n    body = body.cut(pocket)\n\
    \    hole = cq.Workplane('XY').circle(p.hole_d / 2).extrude(w)\n    body = body.cut(hole)\n\
    \    return body\n"
  print_orientation: wheel lies flat on its bottom face (axle vertical)
  use_orientation: axle horizontal, wheel rolls on track
hardware:
- id: bearing
  ref: 608ZZ
  qty: 1
- id: bolt
  ref: ISO 4762 M8x30
  qty: 1
joints: []
criteria:
- id: bearing-seat
  part: wheel
  feature: 608 bearing pocket, 22.2 mm dia x 7 mm deep from the top
  relation: seats
  hardware: bearing
  clearance_mm: null
  params:
  - pocket_d
  - bearing_od
  - bearing_w
  check:
    method: coupon
    ref: null
    description: 'Test print: 22.2 mm pocket takes the 608 bearing and holds it upside
      down. 21.9 mm did not fit.'
- id: bolt-clear
  part: wheel
  feature: 8.4 mm bore through the floor for the M8 bolt
  relation: clears
  hardware: bolt
  clearance_mm: 0.4
  params:
  - hole_d
  - bolt_d
  - bearing_bore
  check:
    method: measure
    ref: null
    description: Confirm the bolt passes through the bearing bore and wheel floor
      and the bearing spins freely.
manual:
- n: '1'
  text: Print the wheel flat on its bottom face. Remove any stringing or brim.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '2'
  text: Press one 608 bearing into the wheel pocket from the top until it sits 7 mm
    down, flush with the wheel's top face. A light press with fingers or a vise is
    enough. If it is loose, add a drop of CA glue to the pocket wall.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '3'
  text: Slide the M8 bolt through the bearing bore. The bearing inner race should
    spin freely on the bolt shank.
  parts: []
  hardware:
  - bolt
  - bearing
  tool: null
- n: '4'
  text: Refit the wheel assembly to the door roller bracket in place of the old wheel,
    using the original mounting nut and washer. Tighten until the wheel spins freely
    with no side play.
  parts: []
  hardware:
  - bolt
  tool: null
