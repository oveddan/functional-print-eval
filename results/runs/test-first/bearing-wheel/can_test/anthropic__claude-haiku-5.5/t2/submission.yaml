task: bearing-wheel
note: ''
questions:
- text: What is the length of your M8 bolt (the placeholder M8x40 is an assumption),
    and how thick is the gap between the bracket arms? The 16 mm wheel plus washers
    and nut must fit; please confirm before printing.
  answer: null
- text: Does the bearing slide onto the bolt shank? Bore measured 7.94 and shank ~8
    mm, so it may need light sanding or reaming.
  answer: null
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: ''
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: ''
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: ''
  bearing_bore:
    value: 7.94
    unit: mm
    kind: hardware
    source: measured
    note: ''
  pocket_d:
    value: 22.3
    unit: mm
    kind: design
    source: design
    note: ''
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: ''
  axle_clear:
    value: 8.5
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: wheel
  role: final
  material: PLA high-speed black
  code: "def build(p):\n    R = p.wheel_od / 2\n    w = p.wheel_w\n    bd = p.bearing_w\n\
    \    wheel = cq.Workplane('XY').circle(R).extrude(w)\n    wheel = wheel.cut(cq.Workplane('XY').circle(p.pocket_d\
    \ / 2).extrude(bd))\n    wheel = wheel.cut(cq.Workplane('XY').workplane(offset=w\
    \ - bd).circle(p.pocket_d / 2).extrude(bd))\n    wheel = wheel.cut(cq.Workplane('XY').circle(p.axle_clear\
    \ / 2).extrude(w))\n    return wheel\n"
  print_orientation: 'axis vertical: wheel face on the bed'
  use_orientation: axis horizontal, rolling on the track
hardware:
- id: bolt
  ref: ISO 4762 M8x40
  qty: 1
- id: bearing
  ref: 608ZZ
  qty: 2
- id: nut
  ref: ISO 4032 M8
  qty: 1
- id: washer
  ref: ISO 7089 M8
  qty: 2
joints: []
criteria: []
manual:
- n: '1'
  text: Print the wheel with its flat face on the bed (axis vertical). No supports
    needed.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '2'
  text: Press one 608 bearing into the bottom pocket from below and the other into
    the top pocket from above. Push on the outer ring only.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '3'
  text: Pass the M8 bolt through the bracket arm, a washer, the wheel's bearing bores,
    a second washer, then the nut. Tighten so the wheel still spins freely.
  parts:
  - wheel
  hardware:
  - bolt
  - nut
  - washer
  tool: null
