task: bearing-wheel
note: 'Plain PLA bushing instead of 608 bearings. The M8 bolt shank is 8 mm, the same
  as the 608 bearing bore (7.94 measured), so the bolt can''t pass through the bearings
  without reaming, which would damage them. A PLA wheel riding directly on the steel
  bolt will be slower and wear faster than a bearing wheel. The hardware ref is a
  placeholder: the user''s own M8 bolt is reused, so its length is not known. Bracket
  gap and bolt length were not measured, so fit is unverified.'
questions:
- text: 'Bracket gap where the wheel sits: does a 16 mm wheel fit between the bracket
    faces?'
  answer: null
- text: 'Bolt length, from under the head to the tip: does it reach through the bracket
    and still clear the wheel?'
  answer: null
params:
  od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel diameter as described by user
  width:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel width as described by user
  bore:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: 8 mm bolt shank plus 0.4 mm clearance for printed PLA
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: M8 bolt shank diameter
  bolt_len:
    value: null
    unit: mm
    kind: hardware
    source: unknown
    note: not measured; does not affect this part
parts:
- id: wheel
  role: final
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    return (cq.Workplane('XY')\n            .circle(p.od /\
    \ 2)\n            .circle(p.bore / 2)\n            .extrude(p.width))"
  print_orientation: flat, axis of the bore vertical (z = 0 on the bed, width along
    z)
  use_orientation: rolling on its bore over the M8 bolt, bore horizontal
hardware:
- id: axle
  ref: ISO 4762 M8x30
  qty: 1
joints: []
criteria:
- id: bore-clears-bolt
  part: wheel
  feature: through bore 8.4 mm
  relation: clears
  hardware: axle
  clearance_mm: null
  params:
  - bore
  - bolt_d
  check:
    method: measure
    ref: null
    description: Bore must slide over the M8 bolt with clearance.
- id: wheel-fits-gap
  part: wheel
  feature: outer face and width 16 mm
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - od
  - width
  check:
    method: measure
    ref: null
    description: Wheel must fit the bracket gap. Bracket gap was not measured.
manual:
- n: '1'
  text: Print the wheel with its bore vertical (flat on the bed, 16 mm tall). It is
    a plain cylinder with a through-hole, so it needs no supports.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Remove the broken wheel from the bracket and keep the M8 bolt in place as
    the axle.
  parts: []
  hardware:
  - axle
  tool: null
- n: '3'
  text: Slide the printed wheel onto the bolt so it sits between the bracket faces,
    and refit the bolt into the bracket.
  parts:
  - wheel
  hardware:
  - axle
  tool: null
- n: '4'
  text: Spin the wheel by hand to check it turns freely. If it binds, ream the bore
    a little more; do not force it.
  parts: []
  hardware: []
  tool: null
