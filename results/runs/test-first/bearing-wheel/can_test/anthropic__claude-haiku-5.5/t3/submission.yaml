task: bearing-wheel
note: ''
questions:
- text: The 608 bearing bore measured 7.94 mm, which may be smaller than an M8 bolt.
    Does the bolt slide through both bearings? If not, the bores may need a drill
    or sanding pass.
  answer: null
- text: The bolt length and head size were not measured, so the hanger fit is unverified.
    Please check it against your old wheel's mounting.
  answer: null
- text: The fit coupon printed but its results were not reported. Please check whether
    the 21.9 mm pocket takes a 608 by hand and whether the 8.4 mm hole passes the
    bolt.
  answer: null
- text: Does the old wheel have a groove or a flat tread? This design assumes a flat
    tread.
  answer: null
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel outside diameter, from the user
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel width, from the user
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: 608 outside, about 22 mm measured flat
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 nominal width; not measured
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: earlier reading 7.94; nominal 8.0
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: M8 shank about 8 mm
  pocket_d:
    value: 21.9
    unit: mm
    kind: design
    source: design
    note: 0.1 mm under bearing OD for a press fit in PLA; unverified, see test
  pocket_depth:
    value: 14.4
    unit: mm
    kind: design
    source: design
    note: two 7 mm bearings stacked plus 0.4 mm spare
  bolt_clear_d:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: clearance hole through the floor for the bolt
parts:
- id: wheel
  role: final
  material: PLA high-speed black
  code: "def build(p):\n    w = cq.Workplane('XY').circle(p.wheel_od/2).extrude(p.wheel_w)\n\
    \    pocket = cq.Workplane('XY').workplane(offset=p.wheel_w - p.pocket_depth).circle(p.pocket_d/2).extrude(p.pocket_depth)\n\
    \    bore = cq.Workplane('XY').circle(p.bolt_clear_d/2).extrude(p.wheel_w)\n \
    \   return w.cut(pocket).cut(bore)\n"
  print_orientation: one flat 50 mm face on the bed, pocket open upward
  use_orientation: axis horizontal, tread running on the door track, bolt as axle
hardware:
- id: bearing-a
  ref: ISO 4762 M8x50
  qty: 1
- id: bearing-b
  ref: ISO 4762 M8x50
  qty: 1
- id: axle-bolt
  ref: ISO 4762 M8x50
  qty: 1
- id: washer
  ref: ISO 7089 M8
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: 'Print the wheel with a flat face on the bed. Check the bearing pocket fits:
    a 608 should press in by hand with light resistance. If it''s loose or tight,
    reprint with an adjusted pocket diameter.'
  parts:
  - wheel
  hardware: []
  tool: null
- n: '2'
  text: Press both 608 bearings into the pocket one on top of the other, so the stack
    sits on the wheel's floor.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '3'
  text: Slide the M8 axle bolt through the bearing bores and the floor hole. Put the
    washer on the top end, then fit it to the door hanger as the old wheel was fitted.
  parts:
  - wheel
  hardware:
  - axle-bolt
  - washer
  tool: null
