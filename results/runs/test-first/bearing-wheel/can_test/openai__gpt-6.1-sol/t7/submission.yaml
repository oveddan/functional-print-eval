manual:
- n: '1'
  text: Keep the door supported independently and retain all anti-lift hardware. This
    is a fit-check prototype, not a rated load-bearing repair. A flat tread is only
    suitable if it matches the original track interface. If the original roller is
    grooved, flanged, or carries door weight, obtain a verified replacement or engineering
    assessment before service.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print each part in its listed orientation in PLA, at 0.2 mm layers, with 6
    walls and 100% infill. No supports. Remove brim/elephant-foot without enlarging
    bearing seats. Keep mating faces and spacer ends flat.
  parts:
  - wheel_head
  - wheel_nut
  - inner_spacer
  - outer_spacer_head
  - outer_spacer_nut
  hardware: []
  tool: Slicer and deburring tool
- n: '3'
  text: Press one bearing fully into each wheel pocket by hand, applying force only
    to the outer race. Do not hammer. Confirm outer faces are flush, inner races rotate
    freely, and bearing shields do not scrape the web. Reject cracked, loose or distorted
    seats.
  parts:
  - wheel_head
  - wheel_nut
  hardware:
  - bearings
  tool: null
- n: '4'
  text: Place inner_spacer between the two inner races. Bring the wheel halves together
    with flat split faces touching and holes aligned. A loose temporary axle can keep
    the spacer centered. Insert three M3 nuts in the hex pockets and three M3x12 screws
    from the round recess side. Tighten evenly by hand just enough to close the seam;
    do not crush PLA. All heads, nuts and screw tips must stay recessed.
  parts:
  - wheel_head
  - wheel_nut
  - inner_spacer
  hardware:
  - join_screws
  - join_nuts
  - axle
  tool: 2.5 mm hex key
- n: '5'
  text: Measure the mounting before proceeding. Do not assume the existing M8 bolt
    is long enough. For the provided M8x40, single-arm thickness must be no more than
    8 mm; a fork must have an 18 mm internal gap without forcing and a combined arm
    thickness no more than 8 mm. If these conditions or track clearance cannot be
    confirmed, stop; this axle arrangement is not validated for that bracket.
  parts:
  - outer_spacer_head
  - outer_spacer_nut
  hardware:
  - axle
  - axle_nut
  - axle_washers
  tool: Caliper
- n: '6'
  text: 'For a single arm, stack: M8 bolt head, M8 washer, outer_spacer_head, first
    bearing inner race, inner_spacer, second inner race, outer_spacer_nut, mounting
    arm, second M8 washer, M8 nylon lock nut. For a compatible fork: bolt head, washer,
    first arm, outer spacer, bearing/spacer wheel assembly, outer spacer, second arm,
    washer, lock nut. The washers must not contact bearing shields or rotating wheel
    plastic. Do not put a steel washer between a bearing and its small printed outer
    spacer.'
  parts:
  - wheel_head
  - wheel_nut
  - inner_spacer
  - outer_spacer_head
  - outer_spacer_nut
  hardware:
  - bearings
  - axle
  - axle_washers
  - axle_nut
  tool: 6 mm hex key and 13 mm wrench
- n: '7'
  text: 'With no door load, gently snug the axle while spinning the wheel. Stop if
    resistance increases: the spacer stack is not correct or a fixed face is rubbing.
    Do not cure binding by leaving the axle loose. Verify full lock-nut engagement,
    two protruding threads, and at least 0.5 mm clearance from each fixed face. Do
    not use normal steel-bolt torque on this printed spacer stack.'
  parts:
  - wheel_head
  - wheel_nut
  - inner_spacer
  - outer_spacer_head
  - outer_spacer_nut
  hardware:
  - axle
  - axle_nut
  tool: null
- n: '8'
  text: Check profile, retention, alignment and full travel with the door separately
    supported. A bearing that shifts outward, a changing seam, cracks, rough rotation
    or spacer indentation means reject the prototype. PLA creep, printed-spacer compression
    and unverified bearing retention prevent assigning a door-load rating. Do not
    return a weight-bearing door to service on this prototype; use the fit results
    to obtain a validated replacement.
  parts:
  - wheel_head
  - wheel_nut
  - inner_spacer
  - outer_spacer_head
  - outer_spacer_nut
  hardware: []
  tool: null
