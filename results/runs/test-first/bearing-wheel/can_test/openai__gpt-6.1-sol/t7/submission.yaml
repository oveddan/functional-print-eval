parts:
- id: wheel_head
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    h=p.wheel_w/2\n    web=h-p.bearing_w\n\
    \    a=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n    a=a.cut(cq.Workplane('XY').circle(p.race_relief_d/2).extrude(h))\n\
    \    a=a.cut(cq.Workplane('XY').workplane(offset=web).circle((p.bearing_od+p.bearing_fit)/2).extrude(p.bearing_w))\n\
    \    for i in range(int(p.join_count)):\n        theta=2*math.pi*i/p.join_count\n\
    \        x,y=p.join_radius*math.cos(theta),p.join_radius*math.sin(theta)\n   \
    \     a=a.cut(cq.Workplane('XY').center(x,y).circle(p.join_hole/2).extrude(h))\n\
    \        a=a.cut(cq.Workplane('XY').workplane(offset=h-p.head_depth).center(x,y).circle((p.join_head_d+p.head_d_allowance)/2).extrude(p.head_depth))\n\
    \    return a"
  print_orientation: Flat split/interface face at z=0 on bed. Bearing pocket and round
    screw-head recesses open upward. No supports.
  use_orientation: 'One axial half; outside bearing face at z=8. Assembly reference
    frame: retain this orientation.'
- id: wheel_nut
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    h=p.wheel_w/2\n    web=h-p.bearing_w\n\
    \    a=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n    a=a.cut(cq.Workplane('XY').circle(p.race_relief_d/2).extrude(h))\n\
    \    a=a.cut(cq.Workplane('XY').workplane(offset=web).circle((p.bearing_od+p.bearing_fit)/2).extrude(p.bearing_w))\n\
    \    for i in range(int(p.join_count)):\n        theta=2*math.pi*i/p.join_count\n\
    \        x,y=p.join_radius*math.cos(theta),p.join_radius*math.sin(theta)\n   \
    \     a=a.cut(cq.Workplane('XY').center(x,y).circle(p.join_hole/2).extrude(h))\n\
    \        d=(p.join_nut_af+p.nut_af_allowance)/math.cos(math.pi/6)\n        a=a.cut(cq.Workplane('XY').workplane(offset=h-p.nut_depth).center(x,y).polygon(6,d).extrude(p.nut_depth))\n\
    \    return a"
  print_orientation: Flat split face at z=0 on bed; bearing pocket and hex nut pockets
    face up. No supports.
  use_orientation: Flip 180 degrees around X to mate split faces with wheel_head.
    In assembly spans z=-8 to 0.
- id: inner_spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.axle_hole/2).extrude(p.wheel_w-2*p.bearing_w)"
  print_orientation: Annular face on bed; axis vertical. Print solid.
  use_orientation: Between bearing inner races; assembled spans z=-1 to +1. It must
    not touch shields.
- id: outer_spacer_head
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.axle_hole/2).extrude(p.outer_spacer_t)"
  print_orientation: Annular face on bed; print solid.
  use_orientation: Between head-side bearing inner race and axle washer; assembled
    z=8 to 9.
- id: outer_spacer_nut
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.axle_hole/2).extrude(p.outer_spacer_t)"
  print_orientation: Annular face on bed; print solid.
  use_orientation: Between opposite inner race and bracket or washer; assembled z=-9
    to -8.
