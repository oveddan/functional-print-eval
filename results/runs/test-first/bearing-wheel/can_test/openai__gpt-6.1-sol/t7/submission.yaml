task: bearing-wheel
note: '50 mm diameter × 16 mm wide flat-tread split-wheel prototype for two 608 bearings.
  Use the tested 22.10 mm nominal bearing seat. NOT a load-rated replacement: tread
  profile, bracket geometry and door weight remain unknown. Do not put a door''s weight
  on this prototype or remove the door''s anti-lift restraints. Printed PLA spacers
  and friction-retained bearings require validation before any service use. Bearings
  and axle spacers are separate from the wheel so tightening the axle need not lock
  the wheel. Total width including the two outer spacers is 18 mm, excluding mounting
  bracket, washers and nut.'
questions:
- text: Old wheel dimensions?
  answer: Approximately 50 mm diameter and 16 mm wide, supplied by user.
- text: Bearing dimensions?
  answer: User measured approximately 22 mm OD and 7 mm width; 608 nominal bore is
    8 mm.
- text: Bearing fit coupon results?
  answer: 'A: measured seat 22.09 mm, snug and holds upside down. B: 22.19 mm, holds
    upside down. C: 22.29 mm, easier but not loose. Selected A.'
- text: Track profile, door load, mounting geometry and existing bolt length?
  answer: Not established. Flat tread is provisional; mounting and service suitability
    must be checked before use.
