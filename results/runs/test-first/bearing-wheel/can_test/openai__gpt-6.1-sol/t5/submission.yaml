task: bearing-wheel
note: 'Conditional fit prototype: plain 50 mm diameter × 16 mm wide wheel with two
  608 bearings. The 22.1 mm nominal bearing seat was selected from the successful
  print test. Track profile, bracket dimensions and door load remain unknown; do not
  treat this as a rated load-bearing replacement. Do not install if the original tread
  was grooved or crowned. Printed inner-race spacers require contact and free-spin
  checks and can creep under preload. A specified catalog M8×40 axle is provided rather
  than assuming the unknown-length existing bolt fits.'
questions:
- text: Is this a load-bearing bottom roller or a top guide, and what load does it
    carry?
  answer: null
- text: What are the actual old tread profile, diameter, width, bracket geometry and
    available clearances?
  answer: Cannot measure; original diameter and width were approximately 50 mm and
    16 mm.
- text: What is the existing bolt's under-head length?
  answer: null
- text: Does an 11 mm spacer contact only the bearing inner ring, clear the shields,
    and allow free rotation?
  answer: Spacer test was printed but not evaluated.
