parts:
- id: wheel
  role: final
  material: PLA, black
  code: "def build(p):\n    w=cq.Workplane('XY').circle(p.wheel_d/2).extrude(p.wheel_width)\n\
    \    w=w.edges('%Circle').chamfer(p.edge_chamfer)\n    bore=cq.Workplane('XY').circle(p.web_bore/2).extrude(p.wheel_width)\n\
    \    lower=cq.Workplane('XY').circle((p.bearing_od+p.seat_allowance)/2).extrude(p.bearing_width)\n\
    \    upper=cq.Workplane('XY').workplane(offset=p.wheel_width-p.bearing_width).circle((p.bearing_od+p.seat_allowance)/2).extrude(p.bearing_width)\n\
    \    return w.cut(bore).cut(lower).cut(upper)"
  print_orientation: Axle vertical, broad annular side at z=0. No supports. The lower
    seat's approximately 2 mm radial shoulder is a short unsupported ledge.
  use_orientation: Axle follows local Z. Bearings occupy z=0–7 and z=9–16; plain cylindrical
    tread rolls on a compatible flat track.
- id: center_spacer
  role: final
  material: PLA, black
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.axle_d+p.axle_clearance)/2).extrude(p.wheel_width-2*p.bearing_width)"
  print_orientation: Flat annular face on bed, z=0.
  use_orientation: Between the two bearing inner rings; assembled at wheel z=7–9.
- id: outer_spacer_head
  role: final
  material: PLA, black
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.axle_d+p.axle_clearance)/2).extrude(p.outer_spacer_length)"
  print_orientation: Flat annular face on bed, z=0.
  use_orientation: Between head-side bearing inner ring and washer; assembled at wheel
    z=-2–0.
- id: outer_spacer_bracket
  role: final
  material: PLA, black
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.axle_d+p.axle_clearance)/2).extrude(p.outer_spacer_length)"
  print_orientation: Flat annular face on bed, z=0.
  use_orientation: Between opposite bearing inner ring and bracket; assembled at wheel
    z=16–18.
