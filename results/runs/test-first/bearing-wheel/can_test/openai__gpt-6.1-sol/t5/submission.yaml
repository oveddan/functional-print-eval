  - washer_thickness
  - locknut_height
  - maximum_single_bracket_thickness
  check:
    method: measure
    ref: null
    description: Actual single bracket thickness must be at most 6.3 mm for two exposed
      threads with this stack. Bolt must pass freely through bracket and bearings,
      engage nylon fully and have end clearance. Fork brackets or different mounting
      stacks require redesign.
manual:
- n: '1'
  text: Secure and independently support the door before removing anything. This is
    a conditional prototype, not a certified load-bearing roller. If this is the door's
    weight-bearing wheel, use a correctly rated replacement for service; reserve this
    print for supported fit checks until its load capability is independently established.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print wheel and all three spacers at 0.2 mm layers, with 6 walls and 100%
    infill; no supports. Keep the axle vertical as modeled. Clear bore strings and
    any first-layer lip without enlarging bearing seats. Do not scale the model to
    adjust fit.
  parts:
  - wheel
  - center_spacer
  - outer_spacer_head
  - outer_spacer_bracket
  hardware: []
  tool: null
- n: '3'
  text: Check the spacer_trial against an inner ring, or use an outer spacer. It must
    contact only the inner ring and must not touch its shield. Rotate the outer ring
    while gently holding the inner ring with the spacer. Stop if rubbing occurs or
    contact cannot be confirmed. Check each bearing spins freely before assembly.
  parts:
  - outer_spacer_head
  - outer_spacer_bracket
  - center_spacer
  hardware:
  - bearings
  tool: null
- n: '4'
  text: Hand-press one bearing squarely into the wheel until its outer ring reaches
    the internal shoulder. Load only the outer ring when inserting it. Insert center_spacer
    through the opposite seat, then install the second bearing. Use the loose axle
    to align the spacer if helpful. Both bearing outer faces should be flush with
    the wheel faces. Do not hammer, force a tight seat, or drive a bearing through
    its inner ring.
  parts:
  - wheel
  - center_spacer
  hardware:
  - bearings
  - axle
  tool: null
- n: '5'
  text: 'Only for a compatible single mounting plate: assemble in order screw head,
    M8 washer, outer_spacer_head, bearing/wheel/center-spacer assembly, outer_spacer_bracket,
    existing bracket, M8 washer, M8 locknut. The 16 mm OD washers must remain outside
    the printed spacers, never directly against bearing shields. Use the specified
    40 mm bolt; do not assume the existing unknown-length bolt is suitable.'
  parts:
  - wheel
  - center_spacer
  - outer_spacer_head
  - outer_spacer_bracket
  hardware:
  - axle
  - axle_washers
  - axle_nut
  - bearings
  tool: null
- n: '6'
  text: Check bracket thickness is no more than 6.3 mm for this exact stack, at least
    two threads project beyond the fully engaged locknut, and the screw tip and head
    clear the door and track. Snug only until axial play disappears; do not apply
    normal M8 structural bolt torque to PLA spacers. Hold the bolt with a hex key
    while turning the locknut. Wheel must spin freely after tightening. Stop if tightening
    causes drag, distortion or cracking.
  parts:
  - wheel
  - center_spacer
  - outer_spacer_head
  - outer_spacer_bracket
  hardware:
  - axle
  - axle_nut
  tool: Hex key and wrench
- n: '7'
  text: Keep the door supported while checking track engagement and full travel. Reject
    if the original wheel had a groove or crown, retention is uncertain, anything
    rubs, or dimensions differ. For a confirmed non-load-bearing guide application,
    inspect after initial operation and periodically for spacer creep, looseness,
    tread wear and cracks; remove immediately if found. Do not use near heat or as
    a safety-critical restraint.
  parts:
  - wheel
  - center_spacer
  - outer_spacer_head
  - outer_spacer_bracket
  hardware: []
  tool: null
