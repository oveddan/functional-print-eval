manual:
- n: '1'
  text: Keep the door supported by its existing safe hardware. Do not remove a load-bearing
    roller or trial this prototype under the door. This is an unloaded bench-fit design,
    not a rated replacement.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: 'Print all five parts in their stated orientations: 0.2 mm layers, 0.4 mm
    nozzle, six walls, five top/bottom layers and 100% infill. No supports. Remove
    brim or elephant-foot material from mating faces. Do not sand the bearing seats
    larger unless you repeat the fit assessment.'
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  - outer_spacer_head
  - outer_spacer_nut
  hardware: []
  tool: null
- n: '3'
  text: Check that both 608 bearings enter their pockets by hand, squarely, and bottom
    on the annular shoulders. Their outer faces should sit about 0.2 mm below the
    wheel faces. Do not hammer, heat or force them. These two bearings are user-supplied;
    their nominal dimensions are listed in params.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware: []
  tool: null
- n: '4'
  text: With the first bearing seated, place inner_spacer against its inner race.
    It must clear the bearing shield and fit inside the central relief without touching
    the wheel. Bring the second half and its bearing into place with split faces touching
    and all three screw holes aligned. The spacer is loose until a temporary axle
    is inserted.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  hardware: []
  tool: null
- n: '5'
  text: Place three M3 nuts in the outward hex pockets. Insert three M3x12 screws
    from the counterbored side and tighten evenly, finger-snug only. Confirm there
    is no seam gap and no screw or nut projects beyond the wheel faces. Screw tips
    should reach through the nuts approximately flush or slightly proud; stop if actual
    hardware differs.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - half_screws
  - half_nuts
  tool: 2.5 mm hex key
- n: '6'
  text: For an unloaded hand test only, place the two outer spacers against the bearing
    inner races. Slide your approximately 8 mm bolt through by hand, supporting the
    wheel over a table. Do not force the bolt, tighten an axle nut onto the PLA spacers,
    or mount to the door. Turn the wheel while applying only light finger pressure
    to the spacer ends. It must turn freely without shield rubbing; stop if it binds.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  - outer_spacer_head
  - outer_spacer_nut
  hardware: []
  tool: null
- n: '7'
  text: Before progressing beyond this prototype, establish the track profile, whether
    the roller carries or suspends the door, door load, bracket spacing, exact bearing
    dimensions, inner-race contact diameter, bolt length/thread reach and secure axle
    retention. The loose assembly spans about 20 mm over the external spacers, not
    16 mm. A grooved track needs a different tread. For a load-bearing door, prefer
    a correctly rated commercial replacement; this submission does not validate PLA
    or printed spacers for service.
  parts: []
  hardware: []
  tool: null
