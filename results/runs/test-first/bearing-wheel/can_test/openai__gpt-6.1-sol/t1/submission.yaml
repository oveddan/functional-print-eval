parts:
- id: wheel_head_half
  role: final
  material: PLA, black
  code: "def build(p):\n    import math\n    h=p.wheel_w/2\n    s=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n\
    \    s=s.cut(cq.Workplane('XY').circle(p.central_relief_d/2).extrude(h))\n   \
    \ bottom=h-p.bearing_w-p.seat_recess\n    s=s.cut(cq.Workplane('XY').workplane(offset=bottom).circle(p.seat_d/2).extrude(p.bearing_w+p.seat_recess))\n\
    \    for i in range(p.screw_count):\n        a=2*math.pi*i/p.screw_count\n   \
    \     x,y=p.screw_pitch_r*math.cos(a),p.screw_pitch_r*math.sin(a)\n        s=s.cut(cq.Workplane('XY').center(x,y).circle((p.screw_d+p.screw_clearance)/2).extrude(h))\n\
    \        s=s.cut(cq.Workplane('XY').workplane(offset=h-p.head_recess_depth).center(x,y).circle((p.head_d+p.head_clearance)/2).extrude(p.head_recess_depth))\n\
    \    return s"
  print_orientation: Split face flat on bed at z=0. Bearing and head recesses open
    upward. No supports.
  use_orientation: Split face contacts wheel_nut_half split face; bearing pocket and
    screw heads face outward.
- id: wheel_nut_half
  role: final
  material: PLA, black
  code: "def build(p):\n    import math\n    h=p.wheel_w/2\n    s=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n\
    \    s=s.cut(cq.Workplane('XY').circle(p.central_relief_d/2).extrude(h))\n   \
    \ bottom=h-p.bearing_w-p.seat_recess\n    s=s.cut(cq.Workplane('XY').workplane(offset=bottom).circle(p.seat_d/2).extrude(p.bearing_w+p.seat_recess))\n\
    \    for i in range(p.screw_count):\n        a=2*math.pi*i/p.screw_count\n   \
    \     x,y=p.screw_pitch_r*math.cos(a),p.screw_pitch_r*math.sin(a)\n        s=s.cut(cq.Workplane('XY').center(x,y).circle((p.screw_d+p.screw_clearance)/2).extrude(h))\n\
    \        s=s.cut(cq.Workplane('XY').workplane(offset=h-p.nut_recess_depth).center(x,y).polygon(6,(p.nut_af+p.nut_clearance)/math.cos(math.pi/6)).extrude(p.nut_recess_depth))\n\
    \    return s"
  print_orientation: Split face flat on bed at z=0. Bearing and hex pockets open upward.
    No supports.
  use_orientation: Flip across the local X axis so split faces meet at z=0; three
    holes align by symmetry. Nuts face outward.
- id: inner_spacer
  role: final
  material: PLA, black; unloaded test only
  code: "def build(p):\n    h=p.wheel_w-2*(p.bearing_w+p.seat_recess)\n    return\
    \ cq.Workplane('XY').circle(p.spacer_od/2).circle(p.axle_clearance_d/2).extrude(h)"
  print_orientation: Annular flat face at z=0; height 1.6 mm. No supports.
  use_orientation: Between bearing inner races, concentric with axle; does not contact
    the wheel shoulders.
- id: outer_spacer_head
  role: final
  material: PLA, black; unloaded test only
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.axle_clearance_d/2).extrude(p.outer_spacer_h)"
  print_orientation: Annular flat face at z=0. No supports.
  use_orientation: Against first bearing inner race, between bearing and temporary
    axle restraint.
- id: outer_spacer_nut
  role: final
  material: PLA, black; unloaded test only
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.axle_clearance_d/2).extrude(p.outer_spacer_h)"
  print_orientation: Annular flat face at z=0. No supports.
  use_orientation: Against opposite bearing inner race, between bearing and temporary
    axle restraint.
