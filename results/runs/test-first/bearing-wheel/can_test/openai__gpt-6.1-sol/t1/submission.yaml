task: bearing-wheel
note: FIT-TEST PROTOTYPE ONLY—not approved to support, suspend or retain a door. Two
  608 bearings fit into a nominal 50 x 16 mm flat-tread wheel. The printed inner-race
  spacers are for unloaded bench testing only. Track shape, load, bracket clearance,
  bearing inner-race clearance and axle fastening remain unverified. Do not remove
  a supporting roller or put this prototype under the door. A service-ready replacement
  requires those checks and a suitable load-rated material/spacer arrangement. Coupon
  result supports the selected bearing-seat diameter, but does not validate strength
  or running fit.
questions:
- text: Original wheel diameter and width?
  answer: User reports approximately 50 mm diameter and 16 mm width.
- text: Bearing fit test?
  answer: User reports the nominal 22.2 mm coupon seat measured 22.19 mm; bearing
    goes in and holds upside down. Other seats unassessed.
- text: Axle dimensions?
  answer: User measured shank approximately 8 mm. Under-head length, head type, threaded
    length and retention remain unknown.
- text: Track profile, roller role/load and mounting bracket dimensions?
  answer: null
