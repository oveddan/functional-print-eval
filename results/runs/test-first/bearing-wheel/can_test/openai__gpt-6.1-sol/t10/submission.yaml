task: bearing-wheel
note: '50 mm diameter × 16 mm wide, flat-tread, two-piece roller prototype for two
  nominal 608 bearings. Bearing-seat coupon passed: reported 22.19 mm printed seat
  accepts bearing and retains it upside down. NOT validated as a load-bearing replacement:
  track profile, bracket, original wheel geometry and door weight could not be established.
  Use only for unloaded fit checks with the door removed or independently secured.
  PLA creep, printed spacer compression and unknown door loads preclude a safe working-load
  rating. A compatible commercial roller is recommended for actual service. Do not
  substitute the existing M8 bolt until its length, thread engagement and mounting
  arrangement are verified.'
questions:
- text: Original wheel diameter and width?
  answer: User reports approximately 50 mm diameter and 16 mm width; not confirmed
    by measurement.
- text: Track profile and whether the roller carries door weight?
  answer: User could not measure or identify these; flat tread is an unverified design
    assumption.
- text: Existing bolt length and bracket thickness?
  answer: Not obtained; only approximately 8 mm shank diameter reported. Prototype
    specifies a catalog M8x45 bolt and a conditional through-bracket assembly.
- text: Bearing socket fit?
  answer: 'Test printed successfully: reported 22.19 mm seat accepts bearing and holds
    upside down.'
