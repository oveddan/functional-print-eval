criteria:
- id: bearing_fit
  part: wheel_head_half
  feature: 22.2 mm bearing socket, repeated in other half
  relation: contains
  hardware: bearings
  clearance_mm: 0.2
  params:
  - bearing_od
  - bearing_w
  - seat_allowance
  check:
    method: coupon
    ref: bearing_fit_test
    description: Passed initial coupon. Each bearing must seat fully by thumb pressure
      in final halves, flush with outside face. Reject loose, distorted or forced
      fits.
- id: race_contact
  part: inner_spacer
  feature: Both annular contact faces
  relation: seats
  hardware: bearings
  clearance_mm: null
  params:
  - contact_od
  - axle_hole_d
  - bearing_bore
  - wheel_w
  - bearing_w
  check:
    method: measure
    ref: null
    description: Confirm 11 mm OD contacts only raised inner race, not shields. Spacer
      must bridge inner races without squeezing bearings inward when wheel halves
      touch.
- id: collar_clearance
  part: bracket_collar
  feature: Bearing-facing annulus; applies also to nut_collar
  relation: clears
  hardware: bearings
  clearance_mm: null
  params:
  - contact_od
  - collar_h
  check:
    method: measure
    ref: null
    description: Collars must touch only inner races and hold bracket/washer clear
      of rotating wheel and shields. Stop if either collar rubs or indents.
- id: joining_screws
  part: wheel_nut_half
  feature: Three recessed nuts and screws
  relation: engages
  hardware: join_screws
  clearance_mm: null
  params:
  - wheel_w
  - head_recess
  - nut_recess
  - join_screw_l
  - join_nut_h
  check:
    method: measure
    ref: null
    description: Nominal 9 mm grip plus 2.4 mm nut thickness gives full nut engagement
      with 12 mm screws. Confirm screw ends and heads do not protrude beyond wheel
      faces.
- id: track_compatibility
  part: wheel_head_half
  feature: Flat cylindrical tread across assembled halves
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - wheel_d
  - wheel_w
  - track_width
  check:
    method: template
    ref: null
    description: 'Unloaded only: compare assembled wheel with original and track.
      Confirm tread shape, axle center location, clearance, retention and derailment
      protection. A V/U-grooved, crowned or flanged original is NOT matched by this
      design.'
- id: axle_stack
  part: nut_collar
  feature: Complete axle stack
  relation: engages
  hardware: axle
  clearance_mm: null
  params:
  - axle_l
  - axle_thread_l
  - bracket_t
  - bracket_min
  - bracket_max
  - washer_t
  - wheel_w
  - collar_h
  - axle_nut_h
  check:
    method: measure
    ref: null
    description: 'Only for an accessible through bracket 1–8 mm thick. Stack under
      bolt head: washer, bracket, collar, 16 mm bearing/wheel assembly, collar, washer,
      locknut. At 8 mm bracket, stack is 41.2 mm including nut, leaving 3.8 mm of
      a 45 mm bolt. Confirm complete nylon engagement, at least two visible thread
      pitches beyond nut, and no interference. Unknown threaded brackets are not supported.'
manual:
- n: '1'
  text: 'Remove the door or secure its weight independently before working. Do not
    rely on this prototype to hold it. Compare the original tread and track to a flat
    50 × 16 mm cylinder. If geometry or retention differs, stop: this design is not
    compatible.'
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware: []
  tool: null
- n: '2'
  text: Print in listed orientations using 0.2 mm layers, 5 walls and 100% infill;
    no supports. Keep bearing-seat compensation identical to the successful coupon.
    Deburr by hand without enlarging the bearing seats. Inspect small collars and
    spacer for complete walls and layer bonding.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  - bracket_collar
  - nut_collar
  hardware: []
  tool: Slicer and deburring tool
- n: '3'
  text: Confirm each actual bearing is nominally 22 × 8 × 7 mm and runs smoothly.
    Press one bearing into each half by thumb pressure on the OUTER race only. Bearing
    outer face should be flush with wheel face. Do not hammer, heat, or press through
    the inner race.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - bearings
  tool: null
- n: '4'
  text: Check that the spacer and both collars contact only each bearing's raised
    inner race, never its shield. Their 11 mm OD is an assumption, not a measured
    race dimension. Stop if contact is uncertain. Place inner_spacer between bearings.
    Temporarily slide the axle through to center it; bring mating faces together,
    aligning all three rim holes.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  - bracket_collar
  - nut_collar
  hardware:
  - bearings
  - axle
  tool: null
- n: '5'
  text: Place three M3 nuts in the hex pockets. Install the three M3x12 screws from
    the opposite recessed face. Snug evenly with hand tools; do not crush PLA. The
    seam must close evenly and both tread halves must align. Confirm all hardware
    is at or below the outer faces, then remove the temporary axle.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - join_screws
  - join_nuts
  - axle
  tool: 2.5 mm hex key and small wrench
- n: '6'
  text: Measure the mounting bracket and confirm an accessible through hole for M8
    and thickness 1–8 mm. If the mount is threaded, unusually shaped, thicker, or
    has insufficient clearances, stop. The reported existing bolt diameter alone is
    insufficient to reuse it. Use the specified M8x45 only after verifying the complete
    stack.
  parts: []
  hardware:
  - axle
  - axle_locknut
  - axle_washers
  tool: Calipers
- n: '7'
  text: 'Assemble in order: M8 bolt head, washer, bracket, bracket_collar, bearing/wheel
    assembly with internal spacer, nut_collar, washer, M8 locknut. Hold the bolt and
    turn the locknut just until axial play disappears. Do NOT apply normal M8 tightening
    torque: that can crush printed spacers. If achieving free rotation requires leaving
    axial play, or collars deform, stop. Confirm nylon is fully engaged and at least
    two thread pitches emerge beyond the nut.'
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  - bracket_collar
  - nut_collar
  hardware:
  - bearings
  - axle
  - axle_locknut
  - axle_washers
  tool: 6 mm hex key and 13 mm wrench
- n: '8'
  text: With the door still independently supported, spin the wheel and check full
    rotation, side clearance, tread alignment and track retention by hand. Nothing
    except inner races may touch collars/spacer; washers and bracket must not rub
    the wheel. This is an unloaded fit check, not load qualification. Do not lower
    the door onto the prototype or leave it in service. Use these fit findings to
    select a properly rated replacement roller.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  - bracket_collar
  - nut_collar
  hardware: []
  tool: null
