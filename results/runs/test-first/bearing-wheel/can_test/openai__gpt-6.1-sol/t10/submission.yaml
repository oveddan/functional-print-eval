parts:
- id: wheel_head_half
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    h=p.wheel_w/2\n    web=h-p.bearing_w\n\
    \    a=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n    a=a.cut(cq.Workplane('XY').circle(p.race_relief_d/2).extrude(h))\n\
    \    a=a.cut(cq.Workplane('XY').workplane(offset=web).circle((p.bearing_od+p.seat_allowance)/2).extrude(p.bearing_w))\n\
    \    for i in range(int(p.join_count)):\n        t=2*math.pi*i/p.join_count\n\
    \        x,y=p.join_pitch_r*math.cos(t),p.join_pitch_r*math.sin(t)\n        a=a.cut(cq.Workplane('XY').center(x,y).circle(p.join_hole_d/2).extrude(h))\n\
    \        a=a.cut(cq.Workplane('XY').workplane(offset=h-p.head_recess).center(x,y).circle((p.join_head_d+p.head_allowance)/2).extrude(p.head_recess))\n\
    \    return a"
  print_orientation: Flat mating face on bed at z=0; bearing socket and screw-head
    recesses face upward. No supports.
  use_orientation: Mating face meets wheel_nut_half mating face. Bearing socket faces
    outward.
- id: wheel_nut_half
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    h=p.wheel_w/2\n    web=h-p.bearing_w\n\
    \    a=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n    a=a.cut(cq.Workplane('XY').circle(p.race_relief_d/2).extrude(h))\n\
    \    a=a.cut(cq.Workplane('XY').workplane(offset=web).circle((p.bearing_od+p.seat_allowance)/2).extrude(p.bearing_w))\n\
    \    for i in range(int(p.join_count)):\n        t=2*math.pi*i/p.join_count\n\
    \        x,y=p.join_pitch_r*math.cos(t),p.join_pitch_r*math.sin(t)\n        a=a.cut(cq.Workplane('XY').center(x,y).circle(p.join_hole_d/2).extrude(h))\n\
    \        dia=2*(p.join_nut_af+p.nut_allowance)/math.sqrt(3)\n        a=a.cut(cq.Workplane('XY').workplane(offset=h-p.nut_recess).center(x,y).polygon(6,dia).extrude(p.nut_recess))\n\
    \    return a"
  print_orientation: Flat mating face on bed at z=0; bearing socket and hex recesses
    upward. No supports.
  use_orientation: Flip against wheel_head_half, aligning all three holes. Hex pockets
    face outward.
- id: inner_spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.contact_od/2).circle(p.axle_hole_d/2).extrude(p.wheel_w-2*p.bearing_w)"
  print_orientation: Annular face on bed, bore vertical; no supports.
  use_orientation: Between the two bearing inner races, inside the relieved central
    webs.
- id: bracket_collar
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.contact_od/2).circle(p.axle_hole_d/2).extrude(p.collar_h)"
  print_orientation: Annular face on bed at z=0; no supports.
  use_orientation: Between bracket and near bearing inner race.
- id: nut_collar
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.contact_od/2).circle(p.axle_hole_d/2).extrude(p.collar_h)"
  print_orientation: Annular face on bed at z=0; no supports.
  use_orientation: Between far bearing inner race and axle washer.
- id: bearing_fit_test
  role: coupon
  material: PLA
  code: "def build(p):\n    h=p.bearing_w+p.coupon_floor\n    a=cq.Workplane('XY').circle(p.bearing_od/2+p.coupon_wall).extrude(h)\n\
    \    a=a.cut(cq.Workplane('XY').circle(p.race_relief_d/2).extrude(h))\n    return\
    \ a.cut(cq.Workplane('XY').workplane(offset=p.coupon_floor).circle((p.bearing_od+p.seat_allowance)/2).extrude(p.bearing_w))"
  print_orientation: Annular floor on bed; socket upward.
  use_orientation: Fit test only; already passed. Not installed.
