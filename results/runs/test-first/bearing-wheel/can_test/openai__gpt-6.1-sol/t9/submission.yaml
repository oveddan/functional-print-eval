manual:
- n: '1'
  text: Secure and independently support the door before removing the old roller.
    Determine whether it carries weight. Do not rely on this untested PLA part for
    a heavy, glass, or overhead-hung door; use an OEM replacement in those cases.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: 'Before printing, confirm the old roller has a flat tread and that a 50 mm
    diameter, 16 mm wide wheel fits the track. The proposed axle stack needs 20 mm
    clear space between stationary supports. Mounting remains unverified: if the original
    arrangement differs, stop rather than bend the bracket or improvise a cantilever
    axle.'
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware: []
  tool: null
- n: '3'
  text: Print all five parts at 0.2 mm layers, six walls and 100% infill, without
    supports. Keep mating faces flat. Remove brim/elephant-foot lips and strings without
    enlarging the bearing pockets. The previously tested nominal 22.2 mm pocket is
    used.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  - outer_spacer_left
  - outer_spacer_right
  hardware: []
  tool: null
- n: '4'
  text: Install the three M3 nuts fully against the bottoms of the deep hex pockets.
    Join the halves mating-face to mating-face; align holes. Fit the three M3x12 screws
    and tighten evenly by hand until the seam closes. Do not crush the PLA. Both heads
    and screw tips must remain below the outside faces.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - half_screws
  - half_nuts
  tool: 2.5 mm hex key
- n: '5'
  text: Press one bearing into its outer pocket using pressure on the outer race only.
    Insert inner_spacer through the opposite opening, then install the second bearing
    while aligning its bore and the spacer with a loose M8 bolt. Never hammer the
    bearing or force it in by loading the inner race.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  hardware:
  - bearings
  - axle
  tool: null
- n: '6'
  text: 'Bench-check the bearing stack with outer_spacer_left and outer_spacer_right
    against the exposed inner races. Their 11.5 mm outside diameters must touch only
    inner races, not shields. Gently clamp the stack and spin the wheel: it must remain
    free, without wobble, scraping, or increased drag. A missing, short, or inaccurate
    central spacer can damage/bind bearings. If clamping causes drag, stop and correct
    the spacer fit; leaving the axle loose is not a fix.'
  parts:
  - inner_spacer
  - outer_spacer_left
  - outer_spacer_right
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - bearings
  - axle
  tool: null
- n: '7'
  text: 'Use the M8x40 axle only if the actual bracket accepts it: stack head, M8
    washer, first bracket side, left printed spacer, bearing/wheel assembly, right
    printed spacer, second bracket side, M8 washer, M8 locknut. Washers go OUTSIDE
    the bracket, never directly against bearing faces. Wheel-plus-spacers is 20 mm;
    with two 1.6 mm washers, an 8 mm locknut and 2.5 mm thread projection, the combined
    bracket thickness must not exceed 6.3 mm for this bolt. Also verify tip/head clearance
    and full nylon engagement. Check the supplied bolt''s actual length before substituting
    it. If these conditions cannot be met, do not install; a different verified mounting
    design is required.'
  parts:
  - wheel_head_half
  - wheel_nut_half
  - outer_spacer_left
  - outer_spacer_right
  hardware:
  - axle
  - axle_washers
  - axle_locknut
  tool: null
- n: '8'
  text: Snug the locknut only enough to secure the axle; do not crush printed spacers.
    Confirm free rotation and no rubbing with the axle secured. Do not loosen the
    nut to hide binding. Keep the door independently supported while first checking
    alignment and motion.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  - outer_spacer_left
  - outer_spacer_right
  hardware:
  - axle
  - axle_locknut
  tool: null
- n: '9'
  text: If all compatibility checks pass, gradually transfer load while the door remains
    restrained against falling. Stop immediately for deflection, clicking, slipping
    bearings, track climbing, or increased rolling resistance. Inspect after the first
    few movements and regularly thereafter. PLA can creep under sustained door weight
    and soften with heat; discontinue use if the tread flattens, seam opens, or axle/spacers
    loosen. This trial does not establish a safe load rating.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  - outer_spacer_left
  - outer_spacer_right
  hardware: []
  tool: null
