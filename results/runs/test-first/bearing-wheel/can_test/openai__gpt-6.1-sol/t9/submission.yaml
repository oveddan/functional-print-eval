parts:
- id: wheel_head_half
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    h=p.wheel_width/2\n    a=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n\
    \    a=a.faces('>Z').edges().chamfer(p.edge_break)\n    a=a.cut(cq.Workplane('XY').circle(p.shoulder_id/2).extrude(h))\n\
    \    a=a.cut(cq.Workplane('XY').workplane(offset=h-p.bearing_width).circle(p.seat_d/2).extrude(p.bearing_width))\n\
    \    for angle in (90,210,330):\n        x=p.bolt_circle_r*math.cos(math.radians(angle));\
    \ y=p.bolt_circle_r*math.sin(math.radians(angle))\n        a=a.cut(cq.Workplane('XY').center(x,y).circle(p.join_hole_d/2).extrude(h))\n\
    \        a=a.cut(cq.Workplane('XY').workplane(offset=h-p.head_pocket_depth).center(x,y).circle(p.head_pocket_d/2).extrude(p.head_pocket_depth))\n\
    \    return a"
  print_orientation: Flat mating face at z=0 on bed; bearing and screw-head pockets
    open upward. No supports.
  use_orientation: Mating face against wheel_nut_half; bearing pocket faces outward.
- id: wheel_nut_half
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    h=p.wheel_width/2\n    a=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n\
    \    a=a.faces('>Z').edges().chamfer(p.edge_break)\n    a=a.cut(cq.Workplane('XY').circle(p.shoulder_id/2).extrude(h))\n\
    \    a=a.cut(cq.Workplane('XY').workplane(offset=h-p.bearing_width).circle(p.seat_d/2).extrude(p.bearing_width))\n\
    \    for angle in (90,210,330):\n        x=p.bolt_circle_r*math.cos(math.radians(angle));\
    \ y=p.bolt_circle_r*math.sin(math.radians(angle))\n        a=a.cut(cq.Workplane('XY').center(x,y).circle(p.join_hole_d/2).extrude(h))\n\
    \        a=a.cut(cq.Workplane('XY').workplane(offset=h-p.nut_pocket_depth).center(x,y).polygon(6,2*p.nut_pocket_af/math.sqrt(3)).extrude(p.nut_pocket_depth))\n\
    \    return a"
  print_orientation: Flat mating face at z=0 on bed; bearing and nut pockets open
    upward. No supports.
  use_orientation: Flip against wheel_head_half, align three holes; bearing pocket
    faces outward.
- id: inner_spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_bore/2).extrude(p.wheel_width-2*p.bearing_width)"
  print_orientation: Annular flat face on bed, axis vertical.
  use_orientation: Between the two bearing inner races, coaxial with axle.
- id: outer_spacer_left
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_bore/2).extrude(p.outer_spacer_h)"
  print_orientation: Annular flat face on bed, axis vertical.
  use_orientation: Between left bearing inner race and stationary bracket.
- id: outer_spacer_right
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_bore/2).extrude(p.outer_spacer_h)"
  print_orientation: Annular flat face on bed, axis vertical.
  use_orientation: Between right bearing inner race and stationary bracket.
