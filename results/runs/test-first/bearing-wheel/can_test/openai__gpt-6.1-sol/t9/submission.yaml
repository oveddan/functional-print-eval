task: bearing-wheel
note: 'Trial replacement: 50 mm diameter, 16 mm wide, flat tread, two 608 bearings.
  Bearing pocket selected as 22.2 mm from the successful fit test. Track profile,
  door load, bracket geometry and supplied bolt length remain unverified. This is
  not a load-rated replacement: use only after confirming flat tread compatibility,
  secure axle mounting, and free rotation under load. For a heavy, glass, or overhead-hung
  door, obtain the manufacturer''s replacement roller instead. The model deliberately
  does not invent a compatible mounting bracket. Axle hardware listed below is a conditional
  M8x40 arrangement, not an identification of the user''s existing bolt.'
questions:
- text: Bearing dimensions?
  answer: Approximately 22 mm OD, 7 mm width, 8 mm bore; bolt shank approximately
    8 mm.
- text: Bearing seat coupon result?
  answer: All three seats held the bearing upside down; approximately 22.19 mm was
    snug. Nominal 22.2 mm selected.
- text: Track profile, load, bracket dimensions, and original axle arrangement?
  answer: null
- text: Supplied bolt length and smooth-shank length?
  answer: null
