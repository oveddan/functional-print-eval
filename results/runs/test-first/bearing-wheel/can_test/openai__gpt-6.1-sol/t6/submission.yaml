parts:
- id: wheel_head_half
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    h=p.wheel_w/2\n    a=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n\
    \    a=a.edges('>Z').chamfer(p.rim_chamfer)\n    a=a.cut(cq.Workplane('XY').circle(p.shoulder_bore/2).extrude(h))\n\
    \    a=a.cut(cq.Workplane('XY').workplane(offset=h-p.bearing_w).circle((p.bearing_od+p.pocket_allowance)/2).extrude(p.bearing_w))\n\
    \    for i in range(int(p.screw_count)):\n        t=2*math.pi*i/p.screw_count\n\
    \        x,y=p.screw_pitch_radius*math.cos(t),p.screw_pitch_radius*math.sin(t)\n\
    \        a=a.cut(cq.Workplane('XY').center(x,y).circle((p.m3_d+p.screw_clearance)/2).extrude(h))\n\
    \        a=a.cut(cq.Workplane('XY').workplane(offset=h-p.recess_depth).center(x,y).circle((p.m3_head_d+p.head_clearance)/2).extrude(p.recess_depth))\n\
    \    return a"
  print_orientation: Flat mating face at z=0 on bed; bearing and screw-head pockets
    face up. No supports.
  use_orientation: Mating face meets wheel_nut_half mating face; bearing pocket faces
    outward.
- id: wheel_nut_half
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    h=p.wheel_w/2\n    a=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n\
    \    a=a.edges('>Z').chamfer(p.rim_chamfer)\n    a=a.cut(cq.Workplane('XY').circle(p.shoulder_bore/2).extrude(h))\n\
    \    a=a.cut(cq.Workplane('XY').workplane(offset=h-p.bearing_w).circle((p.bearing_od+p.pocket_allowance)/2).extrude(p.bearing_w))\n\
    \    for i in range(int(p.screw_count)):\n        t=2*math.pi*i/p.screw_count\n\
    \        x,y=p.screw_pitch_radius*math.cos(t),p.screw_pitch_radius*math.sin(t)\n\
    \        a=a.cut(cq.Workplane('XY').center(x,y).circle((p.m3_d+p.screw_clearance)/2).extrude(h))\n\
    \        a=a.cut(cq.Workplane('XY').workplane(offset=h-p.recess_depth).center(x,y).polygon(6,2*(p.m3_nut_af+p.nut_clearance)/math.sqrt(3)).extrude(p.recess_depth))\n\
    \    return a"
  print_orientation: Flat mating face at z=0 on bed, bearing and hex nut pockets upward.
    No supports.
  use_orientation: Flip over to mate with wheel_head_half; pockets face away from
    the mating plane.
- id: central_spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.axle_d+p.spacer_bore_clearance)/2).extrude(p.wheel_w-2*p.bearing_w)"
  print_orientation: Annular end on bed, axis vertical.
  use_orientation: Between the two bearing inner races, coaxial with axle.
- id: outer_spacer_head
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.axle_d+p.spacer_bore_clearance)/2).extrude(p.end_spacer_h)"
  print_orientation: Annular end on bed, axis vertical.
  use_orientation: Between head-side washer and bearing inner race.
- id: outer_spacer_nut
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.axle_d+p.spacer_bore_clearance)/2).extrude(p.end_spacer_h)"
  print_orientation: Annular end on bed, axis vertical.
  use_orientation: Between nut-side washer and bearing inner race.
