manual:
- n: '1'
  text: Treat this as a bench/fit prototype only. Secure the door independently before
    inspecting its hardware. Do not substitute the unknown-length existing bolt or
    install this to carry the door. A load-rated replacement matching the original
    profile is the safer service solution.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print both wheel halves and all three spacers in PLA at 0.2 mm layers, 5 walls,
    6 top/bottom layers, and 100% infill. No supports. Remove elephant-foot burrs
    without enlarging the bearing pockets.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - central_spacer
  - outer_spacer_head
  - outer_spacer_nut
  hardware: []
  tool: Slicer and deburring tool
- n: '3'
  text: Insert one 608 into each half from its pocket side. Apply pressure only to
    the outer race. They should seat flush with the outer face and remain snug. Do
    not hammer or force a poor fit. Confirm the pocket shoulder clears the shields.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - bearings
  tool: null
- n: '4'
  text: Place central_spacer between the bearing inner races while bringing the flat
    mating faces together. A temporarily inserted axle can keep the spacer centered.
    Flip the nut half so its hex pockets face outward; align all four holes.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - central_spacer
  hardware:
  - bench_axle
  - bearings
  tool: null
- n: '5'
  text: Seat four M3 nuts in the outer hex pockets and insert four M3x12 screws from
    the other side. Tighten evenly by hand until mating faces close; do not crush
    PLA. Heads, nuts and tips must remain below the outer faces. Confirm nuts are
    fully engaged.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - wheel_screws
  - wheel_nuts
  tool: 2.5 mm hex key
- n: '6'
  text: 'Assemble the bench axle in this order: M8x35 head, M8 washer, outer_spacer_head,
    first bearing inner race, central_spacer, second bearing inner race, outer_spacer_nut,
    M8 washer, M8 nut. Printed spacers must contact only bearing inner rings. The
    washers must not rub the wheel or shields. The nominal stack leaves about 5 mm
    of bolt beyond a fully engaged nut.'
  parts:
  - central_spacer
  - outer_spacer_head
  - outer_spacer_nut
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - bench_axle
  - axle_washers
  - axle_nut
  - bearings
  tool: 6 mm hex key and 13 mm wrench
- n: '7'
  text: 'Gently snug the axle nut while checking rotation. Stop if drag increases:
    bearing widths, spacer length or contact geometry need correction. Do not loosen
    a binding assembly and call it fixed. Check that bearings cannot slide out, screws
    stay recessed and the tread halves meet evenly. This test validates assembly only,
    not load capacity.'
  parts:
  - wheel_head_half
  - wheel_nut_half
  - central_spacer
  hardware:
  - bench_axle
  - axle_nut
  - bearings
  tool: null
- n: '8'
  text: You may compare the prototype to the track only while the door remains independently
    supported. Do not place it in service until track profile, actual load, mounting
    retention, axle length and clearances are established and a suitable material/design
    validated. PLA can creep under sustained load, especially in heat; the ordinary
    bench nut is not a vibration-locking installation solution.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware: []
  tool: null
