task: bearing-wheel
note: '50 x 16 mm flat-tread, two-bearing prototype. The 22.1 mm bearing pocket was
  tested successfully (reported approximately 22.09 mm actual). NOT a load-rated closet-door
  replacement: track profile, load and mounting geometry are unverified. Do not remove
  the door''s support or put this prototype into service carrying the door. Included
  M8x35 axle is for bench testing, not a verified fit to the existing bracket. PLA
  creep and bearing retention under service loads remain unvalidated.'
questions:
- text: What are the track profile, door load, bracket opening and bolt length?
  answer: Unavailable; user supplied only approximately 8 mm bolt shank diameter.
- text: Does the bearing pocket fit?
  answer: 'Printed seat reported 22.09 mm: bearing goes in snugly and holds upside
    down.'
