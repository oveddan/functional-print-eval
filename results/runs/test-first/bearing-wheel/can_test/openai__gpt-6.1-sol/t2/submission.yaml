- text: What is the track/tread profile and does this wheel support the door?
  answer: null
- text: What are the bracket dimensions and original bolt length?
  answer: null
- text: Do the 11.5 mm spacer faces touch only the bearing inner rings, without touching
    shields?
  answer: null
