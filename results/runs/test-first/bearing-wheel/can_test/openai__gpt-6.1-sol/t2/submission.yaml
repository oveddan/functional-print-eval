parts:
- id: wheel
  role: final
  material: Black high-speed PLA
  code: "def build(p):\n    h=2*p.bearing_width+p.spacer_length\n    if abs(h-p.wheel_width)>0.01:\n\
    \        raise ValueError('Wheel width must equal two bearing widths plus spacer\
    \ length')\n    a=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n    a=a.edges('%Circle').chamfer(p.rim_chamfer)\n\
    \    a=a.cut(cq.Workplane('XY').circle(p.shoulder_opening/2).extrude(h))\n   \
    \ seat_r=(p.bearing_od+p.seat_clearance)/2\n    a=a.cut(cq.Workplane('XY').circle(seat_r).extrude(p.bearing_width))\n\
    \    a=a.cut(cq.Workplane('XY').workplane(offset=p.bearing_width+p.spacer_length).circle(seat_r).extrude(p.bearing_width))\n\
    \    return a"
  print_orientation: Flat side on z=0, axle vertical; no supports. Central annular
    ledge is the same geometry as the successful fit coupon.
  use_orientation: Axle horizontal for bench rolling; flat cylindrical tread. Bearings
    occupy z=0–7 and z=9–16.
- id: inner_spacer
  role: final
  material: Black high-speed PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.axle_d+p.axle_clearance)/2).extrude(p.spacer_length)"
  print_orientation: Annular face on bed at z=0; no supports.
  use_orientation: Coaxial between the two bearing inner rings; installed at wheel
    z=7–9.
- id: head_spacer
  role: final
  material: Black high-speed PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.axle_d+p.axle_clearance)/2).extrude(p.external_spacer_length)"
  print_orientation: Annular face on bed at z=0; no supports.
  use_orientation: Coaxial outside upper bearing; installed at wheel z=16–18.
- id: nut_spacer
  role: final
  material: Black high-speed PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.axle_d+p.axle_clearance)/2).extrude(p.external_spacer_length)"
  print_orientation: Annular face on bed at z=0; no supports.
  use_orientation: Coaxial outside lower bearing; installed at wheel z=-2–0.
