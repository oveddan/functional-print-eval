manual:
- n: '1'
  text: Keep the door independently supported and leave it off this prototype. This
    design is for bench evaluation only. Do not substitute it for a hanging or weight-carrying
    roller.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '2'
  text: Print wheel with axle vertical, 0.2 mm layers, six walls, six top/bottom layers
    and 60% infill; print all three spacers solid. Use no supports. Inspect for cracks,
    layer separation and a drooping central ledge. Remove first-layer burrs without
    enlarging bearing seats.
  parts:
  - wheel
  - inner_spacer
  - head_spacer
  - nut_spacer
  hardware: []
  tool: Slicer; deburring tool
- n: '3'
  text: Before assembly, place each spacer against a bearing inner ring. Its entire
    annular face must rest on that ring alone, not the shield. The spacer test was
    not confirmed. If you cannot verify this contact, stop and keep the parts unassembled.
  parts:
  - inner_spacer
  - head_spacer
  - nut_spacer
  hardware:
  - bearings
  tool: null
- n: '4'
  text: Press one bearing into the wheel to a depth of 7 mm, flush with its side.
    Apply insertion force only to the outer ring, without hammering. Place inner_spacer
    in the central opening, align its bore, then insert the second bearing flush with
    the opposite side. Stop if either bearing is loose, needs heavy force or will
    not sit flush.
  parts:
  - wheel
  - inner_spacer
  hardware:
  - bearings
  tool: null
- n: '5'
  text: For bench testing, pass ISO 4762 M8x30 through head_spacer, first bearing,
    inner_spacer, second bearing and nut_spacer, then fit ISO 10511 M8. Do not add
    a bracket to this stack. Use tools to overcome nylon drag while holding the bolt,
    but stop at first axial contact; do not apply normal M8 structural tightening
    torque. Both printed spacers and the internal spacer are creep-prone and are not
    structural bearing-preload hardware.
  parts:
  - wheel
  - inner_spacer
  - head_spacer
  - nut_spacer
  hardware:
  - bench_axle
  - bench_locknut
  - bearings
  tool: 6 mm hex key and 13 mm spanner
- n: '6'
  text: Confirm the bolt projects through the nylon locking element, spacers do not
    rub the shields, and the wheel turns freely without axial rattle. Stop for binding,
    rubbing, loose bearing seats or cracking; do not compensate by tightening harder.
    Test by hand on a bench only, with no door load.
  parts:
  - wheel
  - inner_spacer
  - head_spacer
  - nut_spacer
  hardware:
  - bench_axle
  - bench_locknut
  - bearings
  tool: null
- n: '7'
  text: Before any real installation, obtain the track cross-section, door load, bracket
    gap/thickness and axle attachment details, verify the inner-ring contact diameter,
    and redesign/validate accordingly. A proper metal inner spacer and metal inner-ring
    thrust spacers are preferable for sustained load. A suitable commercial replacement
    roller is the safer choice if these checks cannot be made.
  parts:
  - wheel
  hardware: []
  tool: null
