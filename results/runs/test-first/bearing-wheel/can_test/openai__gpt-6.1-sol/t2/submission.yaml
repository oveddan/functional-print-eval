task: bearing-wheel
note: Yes—a printed wheel can spin on two 608 bearings around an M8 axle. This is
  a 50 × 16 mm flat-tread BENCH-TEST PROTOTYPE, not an installation-ready or load-rated
  replacement. Bearing fit was tested successfully; track compatibility, mounting
  geometry and spacer contact remain unverified. Do not install it to support or suspend
  the door. PLA and printed spacers can creep, particularly under sustained load or
  heat.
