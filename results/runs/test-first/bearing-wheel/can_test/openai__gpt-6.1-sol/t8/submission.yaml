task: bearing-wheel
note: 'Provisional flat-tread wheel: 50 mm diameter × 16 mm tread width, with two
  608 bearings. The bearing-seat coupon passed (reported seat 22.19 mm; bearing inserts
  and stays upside down). This does NOT establish safe door service. Track profile,
  load, mounting arrangement and bolt length remain unknown. Use initially as an unloaded
  fit prototype only. Do not use for an overhead hanging door, load-bearing roller,
  anti-lift device or safety-critical restraint. Conditional low-load guide use requires
  all manual checks. Printed spacers are not substitutes for metal spacers in a structural
  roller.'
questions:
- text: What are the track profile, roller load and bracket arrangement?
  answer: Not established; user could not measure. Flat tread is a provisional design
    choice, not a confirmed match.
- text: What is the existing M8 bolt length?
  answer: Unknown. User confirmed only approximately 8 mm shank diameter; design specifies
    a catalog bolt instead.
