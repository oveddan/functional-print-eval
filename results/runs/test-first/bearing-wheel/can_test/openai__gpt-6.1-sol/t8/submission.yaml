parts:
- id: wheel_head_half
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    h=p.wheel_width/2\n    floor=h-p.bearing_width\n\
    \    a=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n    a=a.cut(cq.Workplane('XY').circle(p.shoulder_bore/2).extrude(h))\n\
    \    a=a.cut(cq.Workplane('XY').workplane(offset=floor).circle((p.bearing_od+p.bearing_fit_allowance)/2).extrude(p.bearing_width))\n\
    \    for i in range(int(p.screw_count)):\n        t=2*math.pi*i/p.screw_count\n\
    \        x,y=p.screw_radius*math.cos(t),p.screw_radius*math.sin(t)\n        a=a.cut(cq.Workplane('XY').center(x,y).circle(p.screw_clearance/2).extrude(h))\n\
    \        a=a.cut(cq.Workplane('XY').workplane(offset=h-p.head_pocket_depth).center(x,y).circle(p.head_pocket_d/2).extrude(p.head_pocket_depth))\n\
    \    return a"
  print_orientation: Flat mating face on bed at z=0; bearing and screw-head pockets
    upward. No supports.
  use_orientation: Mating face is wheel midplane; bearing pocket faces outward toward
    bolt head.
- id: wheel_nut_half
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    h=p.wheel_width/2\n    floor=h-p.bearing_width\n\
    \    a=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n    a=a.cut(cq.Workplane('XY').circle(p.shoulder_bore/2).extrude(h))\n\
    \    a=a.cut(cq.Workplane('XY').workplane(offset=floor).circle((p.bearing_od+p.bearing_fit_allowance)/2).extrude(p.bearing_width))\n\
    \    for i in range(int(p.screw_count)):\n        t=2*math.pi*i/p.screw_count\n\
    \        x,y=p.screw_radius*math.cos(t),p.screw_radius*math.sin(t)\n        a=a.cut(cq.Workplane('XY').center(x,y).circle(p.screw_clearance/2).extrude(h))\n\
    \        a=a.cut(cq.Workplane('XY').workplane(offset=h-p.nut_pocket_depth).center(x,y).polygon(6,p.nut_pocket_af/math.cos(math.pi/6)).extrude(p.nut_pocket_depth))\n\
    \    return a"
  print_orientation: Flat mating face on bed at z=0; bearing and nut pockets upward.
    No supports.
  use_orientation: Flip about X through 180 degrees and mate z=0 faces; align all
    three screw holes. Bearing pocket faces away from bolt head.
- id: center_spacer
  role: final
  material: PLA
  code: "def build(p):\n    length=p.wheel_width-2*p.bearing_width\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.axle_clearance/2).extrude(length)"
  print_orientation: Annular end on bed, axis vertical. No supports.
  use_orientation: Between the two bearing inner races; nominal 2 mm long.
- id: head_collar
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.axle_clearance/2).extrude(p.collar_height)"
  print_orientation: Annular end on bed, axis vertical. No supports.
  use_orientation: Between head-side bearing inner race and head-side M8 washer.
- id: mount_collar
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.axle_clearance/2).extrude(p.collar_height)"
  print_orientation: Annular end on bed, axis vertical. No supports.
  use_orientation: Between mount-side bearing inner race and mount-side M8 washer.
