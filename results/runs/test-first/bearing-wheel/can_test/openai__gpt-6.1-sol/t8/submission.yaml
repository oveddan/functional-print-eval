manual:
- n: '1'
  text: 'Support and unload the door independently before removing anything. Keep
    the original roller and all original retention devices. If the roller carries
    door weight, hangs the door, prevents lift-off, or its role is uncertain, stop:
    use a rated replacement assembly instead. This prototype has no established load
    rating.'
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print both wheel halves, center_spacer, head_collar and mount_collar in PLA
    at 0.2 mm layers, 6 walls, 6 top/bottom layers and 100% infill. Use their supplied
    orientations without supports. Remove elephant-foot burrs carefully; keep bearing
    shoulders and spacer faces flat. Do not scale the parts.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - center_spacer
  - head_collar
  - mount_collar
  hardware: []
  tool: Deburring tool
- n: '3'
  text: Before assembling, verify the bolt slides through each bearing by hand. Do
    not hammer or pull it through with the nut. Press one bearing into each outward-facing
    pocket using pressure on the outer race only. Each must reach its shoulder and
    sit flush with its wheel-half outer face. Reject cracked, loose or distorted seats.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - bearings
  - axle
  tool: null
- n: '4'
  text: Put center_spacer between the bearing inner races while bringing the two flat
    mating faces together. Use the unfastened axle temporarily to align the spacer.
    Flip wheel_nut_half relative to its print orientation and align all three holes.
    The mating faces must close without force and bearings must stay fully seated.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - center_spacer
  hardware:
  - bearings
  - axle
  tool: null
- n: '5'
  text: Place three M3 nuts in the hex recesses. Fit three M3x12 screws from wheel_head_half.
    Tighten evenly only until the seam closes and halves cannot shift; do not crush
    the PLA. Nuts must seat against the bottoms of their pockets, with complete thread
    engagement. Heads and tips must remain below the outside faces.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - wheel_screws
  - wheel_nuts
  tool: 2.5 mm hex key
- n: '6'
  text: 'Bench-test axle stack, head to tip: M8 bolt head, M8 washer, head_collar,
    first bearing inner race, center_spacer, second bearing inner race, mount_collar,
    second M8 washer, then M8 locknut for the bench test. Collars must touch only
    inner-race metal. Turn the locknut only enough to remove axial looseness; do not
    apply normal structural M8 torque to printed spacers. Wheel must turn freely while
    collars, spacer and bolt remain stationary. Any binding, shield rubbing, cracking
    or axial play means stop and correct the fit, not loosen the axle for service.'
  parts:
  - head_collar
  - center_spacer
  - mount_collar
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - axle
  - axle_washers
  - axle_nut
  - bearings
  tool: 6 mm hex key and 13 mm wrench
- n: '7'
  text: Keep off the door until the original track profile, mounting arrangement and
    low-load guide role have been confirmed. This is a flat tread, not a guessed groove.
    Check the full travel by hand while the door remains independently supported,
    including track capture, radial clearance, side clearance and original anti-lift
    retention. No printed part may rub the bracket. Do not alter safety retention
    to make this fit.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware: []
  tool: null
- n: '8'
  text: 'Only for a verified compatible single-arm, low-load guide: reinstall the
    axle stack from step 6 with the existing bracket plate BETWEEN the second washer
    and locknut. M8x40 accommodates a plate up to 6 mm in this stack with at least
    two threads protruding past the fully engaged locknut; verify on the real assembly.
    Do not use the user''s unidentified bolt without checking its length and engagement.
    Two-arm brackets are not covered by this unmeasured mounting layout.'
  parts:
  - head_collar
  - center_spacer
  - mount_collar
  hardware:
  - axle
  - axle_washers
  - axle_nut
  tool: 6 mm hex key and 13 mm wrench
- n: '9'
  text: 'For any permitted low-load guide trial, move the supported door slowly through
    its complete travel and recheck for looseness, heat, binding, tread damage and
    spacer compression. Inspect again after initial use and regularly thereafter.
    Stop at any change. PLA can creep and soften in heat: never use this as a load-bearing
    substitute or leave it in hot/direct-sun conditions. A metal inner-race spacer
    and a rated roller are preferable for a permanent repair.'
  parts:
  - wheel_head_half
  - wheel_nut_half
  - center_spacer
  - head_collar
  - mount_collar
  hardware: []
  tool: null
