- id: bench_axle
  ref: ISO 4762 M8x35
  qty: 1
- id: axle_locknut
  ref: ISO 10511 M8
  qty: 1
- id: axle_washers
  ref: ISO 7089 M8
  qty: 2
joints:
- id: bench_axle_stack
  fastener: bench_axle
  axis_origin:
  - 0.0
  - 0.0
  - -1.6
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: outer_spacer_left
    feature: Lower annular face bears on washer under bolt head; spacer bore clears
      axle.
    role: clearance
  - part: wheel
    feature: Central opening clears axle; bearings, not printed bore, support rotation.
    role: clearance
  - part: centre_sleeve
    feature: Through bore, between bearing inner races.
    role: clearance
  - part: outer_spacer_right
    feature: Through bore; outer annular face contacts washer below locknut.
    role: clearance
  nut: axle_locknut
  external: null
criteria:
- id: bearing_seats
  part: wheel
  feature: Two 22.25 mm nominal pockets, each 7 mm deep, with central outer-race shoulder.
  relation: seats
  hardware: bearings
  clearance_mm: 0.25
  params:
  - bearing_od
  - bearing_width
  - seat_allowance
  - wheel_width
  check:
    method: measure
    ref: null
    description: Verify actual OD and width of both bearings. Each must enter squarely
      by hand and seat flush with wheel face without rocking or slipping out. Do not
      hammer. Adjust allowance and reprint if loose or excessively tight.
- id: inner_race_spacing
  part: centre_sleeve
  feature: Axial sleeve bridges bearing inner races without contacting shields.
  relation: supports
  hardware: bearings
  clearance_mm: null
  params:
  - wheel_width
  - bearing_width
  - spacer_od
  - spacer_bore
  check:
    method: measure
    ref: null
    description: Confirm 2 mm actual inner-race gap when both bearings are fully seated.
      Confirm 11 mm spacer OD contacts inner race only, not shield or outer race.
      If mismatch, stop and revise; do not use nut force to draw bearings together.
- id: external_clearance
  part: outer_spacer_left
  feature: Projects 1.5 mm beyond wheel face and isolates washer from rotating wheel.
  relation: clears
  hardware: axle_washers
  clearance_mm: null
  params:
  - outer_spacer_length
  - spacer_od
  - wheel_width
  - bearing_width
  check:
    method: measure
    ref: null
    description: Check both external spacers contact only bearing inner races. Washers
      must not rub wheel or shields at any angle.
- id: axle_stack
  part: outer_spacer_right
  feature: Bench axle stack leaves locknut fully engaged.
  relation: clears
  hardware: bench_axle
  clearance_mm: null
  params:
  - bolt_length
  - wheel_width
  - outer_spacer_length
  - washer_t
  - locknut_h
  check:
    method: measure
    ref: null
    description: Bench grip before nut is 22.2 mm including both washers. With nominal
      8 mm locknut, M8x35 leaves 4.8 mm beyond nut. Verify thread passes fully through
      nylon locking ring. This excludes any door bracket.
- id: tread_compatibility
  part: wheel
  feature: 50 x 16 flat tread, not a reproduced original profile.
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - wheel_width
  check:
    method: template
    ref: null
    description: With the door independently supported, compare against original wheel
      and track. Groove, flange, crowned tread, lateral retention or incompatible
      clearance means this design is unsuitable. No door-load test is authorized by
      this prototype.
manual:
- n: '1'
  text: Keep the door safely supported and do not rely on this prototype to hold it.
    This package is for bench-fit evaluation only. Unknown track profile and load
    prevent approval for service.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print wheel with 0.2 mm layers, at least 6 walls, 6 top/bottom layers and
    100% infill; no supports. Print all three spacers solid. Keep the wheel flat as
    modeled. Remove brim and loose strings; do not enlarge bearing seats arbitrarily.
  parts:
  - wheel
  - centre_sleeve
  - outer_spacer_left
  - outer_spacer_right
  hardware: []
  tool: Bambu Lab X1C, 0.4 mm nozzle
- n: '3'
  text: Check bearing pockets and both bearing widths. Press the first bearing into
    one face by hand, applying force only to its outer race. It must seat flush. If
    force is excessive, or bearing is loose, stop and revise seat_allowance; the earlier
    coupon did not validate the fit.
  parts:
  - wheel
  hardware:
  - bearings
  tool: null
- n: '4'
  text: Insert centre_sleeve through the other face, then fit the second bearing.
    Use the bolt temporarily to keep the sleeve aligned. Both bearings should be flush;
    sleeve must touch only the inner races without contacting shields. Do not tighten
    to force incorrect dimensions into place.
  parts:
  - wheel
  - centre_sleeve
  hardware:
  - bearings
  - bench_axle
  tool: null
- n: '5'
  text: 'Build bench stack: bolt head, M8 washer, outer_spacer_left, bearing/wheel
    assembly with centre_sleeve between inner races, outer_spacer_right, M8 washer,
    M8 nylon locknut. No door bracket is included. For joint coordinates, left spacer
    bottom is z=0, wheel bottom z=1.5, centre sleeve bottom z=8.5, right spacer bottom
    z=17.5.'
  parts:
  - wheel
  - centre_sleeve
  - outer_spacer_left
  - outer_spacer_right
  hardware:
  - bench_axle
  - axle_washers
  - axle_locknut
  - bearings
  tool: null
- n: '6'
  text: 'Use a hex key and wrench to advance the locknut through its nylon ring, then
    stop at light contact with the spacer stack. Do not torque as a structural M8
    joint: printed spacers can crush or creep. Confirm full locking-ring engagement,
    no axial looseness, and free wheel rotation while bolt and inner races stay stationary.
    Binding, shield contact or bearing movement means stop and revise, not loosen
    until unsafe.'
  parts:
  - wheel
  - centre_sleeve
  - outer_spacer_left
  - outer_spacer_right
  hardware:
  - bench_axle
  - axle_locknut
  - bearings
  tool: 6 mm hex key and 13 mm wrench
- n: '7'
  text: Do not install as a load-bearing door roller yet. Obtain the track profile,
    mounting dimensions, actual axle length/retention, and door load before a service
    design is finalized. The existing M8 bolt cannot be approved from shank diameter
    alone. A matched commercial replacement roller is preferable for a heavy door
    or any installation where failure could let the door fall.
  parts:
  - wheel
  hardware: []
  tool: null
