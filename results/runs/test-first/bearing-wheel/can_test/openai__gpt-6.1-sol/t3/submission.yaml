task: bearing-wheel
note: Provisional flat-tread bench-fit prototype, NOT a validated load-bearing closet-door
  replacement. Wheel is 50 mm diameter x 16 mm wide. Track profile, door load, original
  axle retention and mounting clearance remain unknown. Do not remove existing door
  support or install under door load based on this design alone. PLA can creep under
  sustained load and heat. Bearing fits and spacer contact must be verified; coupon
  feedback was inconclusive. The listed M8x35 bolt is a selected bench axle, not a
  claim that the user's unmeasured bolt fits the door.
questions:
- text: Original tread profile, track geometry, wheel load and mounting clearances?
  answer: Unavailable; flat tread is provisional.
- text: Existing bolt under-head length, mounting thickness and retention?
  answer: Unavailable; user measured only about 8 mm shank diameter.
- text: Bearing fit coupon result?
  answer: User could not evaluate any of the three fits.
