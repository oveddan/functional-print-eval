parts:
- id: wheel
  role: final
  material: Black PLA; prototype only
  code: "def build(p):\n    assert p.wheel_width > 2*p.bearing_width\n    body = cq.Workplane('XY').circle(p.wheel_od/2).extrude(p.wheel_width)\n\
    \    body = body.faces('>Z or <Z').edges().chamfer(p.edge_break)\n    bore = cq.Workplane('XY').circle(p.shoulder_opening/2).extrude(p.wheel_width)\n\
    \    lower = cq.Workplane('XY').circle((p.bearing_od+p.seat_allowance)/2).extrude(p.bearing_width)\n\
    \    upper = cq.Workplane('XY').workplane(offset=p.wheel_width-p.bearing_width).circle((p.bearing_od+p.seat_allowance)/2).extrude(p.bearing_width)\n\
    \    return body.cut(bore).cut(lower).cut(upper)"
  print_orientation: Flat circular side on bed, axle along Z; z=0 is the lower wheel
    face. No supports. The internal annular shoulder overhangs about 1.63 mm radially.
  use_orientation: Axle through Z. Flat cylindrical circumference is provisional rolling
    tread. Bearings enter from opposite faces.
- id: centre_sleeve
  role: final
  material: Black PLA; prototype only
  code: "def build(p):\n    h = p.wheel_width-2*p.bearing_width\n    assert h > 0\n\
    \    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_bore/2).extrude(h)"
  print_orientation: Annular end on bed, z=0; print solid.
  use_orientation: Between bearing inner races, coaxial with wheel. Nominal length
    2 mm.
- id: outer_spacer_left
  role: final
  material: Black PLA; prototype only
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_bore/2).extrude(p.outer_spacer_length)"
  print_orientation: Annular end on bed, z=0; print solid.
  use_orientation: Between left bearing inner race and external washer.
- id: outer_spacer_right
  role: final
  material: Black PLA; prototype only
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_bore/2).extrude(p.outer_spacer_length)"
  print_orientation: Annular end on bed, z=0; print solid.
  use_orientation: Between right bearing inner race and external washer.
