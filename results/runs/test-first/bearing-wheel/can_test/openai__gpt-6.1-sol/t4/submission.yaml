task: bearing-wheel
note: 'Two-piece 50 × 16 mm flat-tread bearing wheel PROTOTYPE. Coupon B gave a snug,
  hand-insertable fit, so bearing pockets use 22.2 mm nominal diameter. This is a
  bench-fit design, NOT a verified load-bearing closet-door replacement: track profile,
  door load, mount geometry and available axle length remain unknown. Do not install
  it on a hanging door or put the door''s weight on it without resolving those items.
  PLA can creep under sustained load and soften in heat. A correctly rated commercial
  replacement is preferable for permanent service. The 16 mm wheel body requires 20
  mm across the external axle spacers, before washers and mounting hardware.'
questions:
- text: What is the track/tread profile and is the roller load-bearing?
  answer: Not established; user could not measure. Flat tread is a prototype choice
    only.
- text: What is the existing axle length and mounting geometry?
  answer: Only approximately 8 mm shank diameter was confirmed. Existing bolt length
    and mount geometry are unknown.
- text: Which bearing fit worked?
  answer: All three coupons accepted the bearing and held it upside down. B, nominal
    22.2 mm, was reported approximately 22.19 mm and snug.
