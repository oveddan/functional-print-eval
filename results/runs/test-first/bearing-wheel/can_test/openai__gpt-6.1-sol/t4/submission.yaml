parts:
- id: wheel_head_half
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    h=p.wheel_w/2\n    s=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n\
    \    s=s.cut(cq.Workplane('XY').circle(p.shoulder_bore/2).extrude(h))\n    s=s.cut(cq.Workplane('XY').workplane(offset=h-p.bearing_w).circle((p.bearing_od+p.bearing_fit)/2).extrude(p.bearing_w))\n\
    \    for a in (0,120,240):\n        x=p.bolt_circle_r*math.cos(math.radians(a));\
    \ y=p.bolt_circle_r*math.sin(math.radians(a))\n        s=s.cut(cq.Workplane('XY').center(x,y).circle(p.assembly_hole_d/2).extrude(h))\n\
    \        s=s.cut(cq.Workplane('XY').workplane(offset=h-p.recess_depth).center(x,y).circle(p.head_recess_d/2).extrude(p.recess_depth))\n\
    \    return s"
  print_orientation: Flat mating face on bed at z=0; bearing pocket and screw-head
    recesses open upward. No supports.
  use_orientation: Mating face faces wheel centre; bearing pocket opens to one external
    wheel face.
- id: wheel_nut_half
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    h=p.wheel_w/2\n    s=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n\
    \    s=s.cut(cq.Workplane('XY').circle(p.shoulder_bore/2).extrude(h))\n    s=s.cut(cq.Workplane('XY').workplane(offset=h-p.bearing_w).circle((p.bearing_od+p.bearing_fit)/2).extrude(p.bearing_w))\n\
    \    for a in (0,120,240):\n        x=p.bolt_circle_r*math.cos(math.radians(a));\
    \ y=p.bolt_circle_r*math.sin(math.radians(a))\n        s=s.cut(cq.Workplane('XY').center(x,y).circle(p.assembly_hole_d/2).extrude(h))\n\
    \        s=s.cut(cq.Workplane('XY').workplane(offset=h-p.recess_depth).center(x,y).polygon(6,2*(p.m3_nut_af+p.nut_fit)/math.sqrt(3)).extrude(p.recess_depth))\n\
    \    return s"
  print_orientation: Flat mating face on bed at z=0; bearing pocket and hex pockets
    open upward. No supports.
  use_orientation: Flip against head half so flat mating faces meet and all three
    holes align. Bearing pockets face outward.
- id: inner_spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_id/2).extrude(p.wheel_w-2*p.bearing_w)"
  print_orientation: Flat annular end on bed, z=0. Print separately from the other
    spacers.
  use_orientation: Between the two bearing inner rings, coaxial with axle.
- id: outer_spacer_head
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_id/2).extrude(p.outer_spacer_t)"
  print_orientation: Flat annular end on bed, z=0.
  use_orientation: Between head-side bearing inner ring and M8 washer.
- id: outer_spacer_nut
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_id/2).extrude(p.outer_spacer_t)"
  print_orientation: Flat annular end on bed, z=0.
  use_orientation: Between nut-side bearing inner ring and M8 washer.
