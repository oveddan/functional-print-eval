manual:
- n: '1'
  text: This is a bench prototype. Do not remove an unsupported door or install this
    on a hanging/load-bearing door based on the present information. Confirm track
    profile, mount clearance and actual loads before considering any installation.
    A flat wheel is not suitable for an unverified raised rail.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print both wheel halves and all three spacers in PLA at 0.2 mm layers, 5 walls,
    6 top/bottom layers and 100% infill. Use the stated orientations with no supports.
    Keep mating faces flat. Remove elephant-foot burrs without enlarging bearing seats.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  - outer_spacer_head
  - outer_spacer_nut
  hardware: []
  tool: Deburring tool
- n: '3'
  text: Join the flat backs of the wheel halves, aligning the three holes. Insert
    the three M3 nuts into the outward hex pockets and the M3x12 screws through the
    opposite recesses. Tighten evenly, only enough to close the seam. Do not crush
    the PLA. Heads, nuts and tips must remain recessed; confirm full nut engagement.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - assembly_screws
  - assembly_nuts
  tool: 2.5 mm hex key
- n: '4'
  text: Seat one bearing from outside, pressing only its outer ring, until it reaches
    the shoulder and its exposed face is flush with the wheel face. Do not hammer.
    Insert the inner spacer through the other side, then seat the second bearing.
    Use the loose axle to align the spacer; do not use the axle nut to force bearings
    into their pockets.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  hardware:
  - bearing_pair
  - bench_axle
  tool: null
- n: '5'
  text: 'For the BENCH spin check, assemble in this order: M8x40 head, M8 washer,
    outer_spacer_head, first bearing inner ring, inner_spacer, second bearing inner
    ring, outer_spacer_nut, M8 washer, M8 lock nut. The supplied unknown-length bolt
    is not assumed suitable. Check that spacer ends touch only exposed inner-ring
    metal, never shields or seals.'
  parts:
  - outer_spacer_head
  - inner_spacer
  - outer_spacer_nut
  hardware:
  - bench_axle
  - axle_washers
  - bearing_pair
  - axle_nut
  tool: null
- n: '6'
  text: 'Hold the axle stationary and gently snug the nut while turning the wheel.
    Stop if rotation becomes stiff: do not loosen the nut and treat that as a fix.
    Check full bearing seating, spacer length/flatness, shield clearance and wheel
    runout. The bolt must pass freely through both bearings and engage the lock nut
    completely. No axle torque rating is established for these PLA spacers.'
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  - outer_spacer_head
  - outer_spacer_nut
  hardware:
  - bench_axle
  - axle_nut
  tool: 6 mm hex key and 13 mm wrench
- n: '7'
  text: Keep this assembly for dimensional and unloaded spin checks only until the
    track shape and mounting details are known. The wheel body is 16 mm wide, the
    spacer-to-spacer stack is 20 mm, and two washers increase that to 23.2 mm before
    any bracket. It has no established load rating. Retire it if there are cracks,
    loose bearings, rubbing, creep or wobble; do not use where failure could let a
    door fall.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware: []
  tool: null
