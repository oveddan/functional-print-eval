task: bearing-wheel
note: 'The wheel uses a one-piece support-free counterbore geometry: a 2 mm bottom
  flange (18 mm bore) printed flat on the bed supports the outer race of the bottom
  608ZZ bearing, while the 14 mm deep pocket holds both 7 mm wide 608ZZ bearings face-to-face
  so their steel inner races contact directly. Two printed inner-race spacers (11.6
  mm OD) contact only the bearing inner races and provide 1.5 mm axial clearance on
  each face so the wheel cannot rub against the door bracket, bolt head, or nut.'
questions:
- text: What are the exact outer diameter, width, and rim profile of the old roller
    wheel?
  answer: about 50 mm OD and 16 mm wide (exact measurement unavailable)
- text: What is the diameter and length of the M8 bolt and bracket spacing?
  answer: about 8 mm shank diameter
params:
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ outer diameter from catalog
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: outer diameter of original closet door roller wheel (~50 mm)
  bolt_clearance:
    value: 0.25
    unit: mm
    kind: design
    source: design
    note: diametral clearance for M8 bolt shank through printed inner-race spacers
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: width of original closet door roller wheel (~16 mm)
  bolt_d:
    value: 8
    unit: mm
    kind: world
    source: measured
    note: measured M8 bolt shank diameter (also matches catalog ISO 4762 M8)
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ nominal width from catalog
  bearing_pocket_clearance:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: diametral clearance for snug press-fit of 608ZZ outer race in PLA
  coupon_wall:
    value: 4
    unit: mm
    kind: design
    source: design
    note: radial wall thickness of bearing test coupon
  rim_chamfer:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: 45-degree chamfer on top and bottom outer rim edges to prevent elephant-foot
      and track catching without needing supports
  flange_id:
    value: 18
    unit: mm
    kind: design
    source: design
    note: inner diameter of bottom bearing retaining lip (supports 22 mm outer race
      while clearing 12 mm inner race and 11.6 mm spacer)
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ nominal inner bore diameter
  spacer_standoff:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: axial standoff distance each inner-race spacer protrudes beyond the wheel
      faces to prevent bracket rubbing
  spacer_od:
    value: 11.6
    unit: mm
    kind: design
    source: design
    note: outer diameter of inner-race spacers so they contact only the 608ZZ inner
      race (~12 mm OD) without rubbing shields or outer race
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    pocket_d = p.bearing_od + p.bearing_pocket_clearance\n\
    \    pocket_depth = 2 * p.bearing_w\n    wheel = (\n        cq.Workplane(\"XY\"\
    )\n        .circle(p.wheel_od / 2.0)\n        .extrude(p.wheel_w)\n        .edges(\"\
    %CIRCLE\")\n        .chamfer(p.rim_chamfer)\n        .faces(\"<Z\")\n        .workplane()\n\
    \        .hole(p.flange_id)\n        .faces(\">Z\")\n        .workplane()\n  \
    \      .hole(pocket_d, pocket_depth)\n    )\n    return wheel\n"
  print_orientation: flat on bed with the 18 mm flange face at z = 0 and the 22.15
    mm bearing counterbore opening upward (+Z)
  use_orientation: vertical on the closet door track, spinning around the horizontal
    M8 axle bolt
- id: bottom_spacer
  role: final
  material: PLA
  code: "def build(p):\n    bore_d = p.bolt_d + p.bolt_clearance\n    flange_t = p.wheel_w\
    \ - 2 * p.bearing_w\n    h = flange_t + p.spacer_standoff\n    return (\n    \
    \    cq.Workplane(\"XY\")\n        .circle(p.spacer_od / 2.0)\n        .circle(bore_d\
    \ / 2.0)\n        .extrude(h)\n    )\n"
  print_orientation: flat on bed (z = 0 is bottom annular face)
  use_orientation: coaxial on the M8 bolt on the flange side of the wheel, reaching
    through the 2 mm flange to contact the bottom 608ZZ inner race
- id: top_spacer
  role: final
  material: PLA
  code: "def build(p):\n    bore_d = p.bolt_d + p.bolt_clearance\n    return (\n \
    \       cq.Workplane(\"XY\")\n        .circle(p.spacer_od / 2.0)\n        .circle(bore_d\
    \ / 2.0)\n        .extrude(p.spacer_standoff)\n    )\n"
  print_orientation: flat on bed (z = 0 is bottom annular face)
  use_orientation: coaxial on the M8 bolt on the flush bearing side of the wheel,
    contacting the top 608ZZ inner race
- id: bearing_fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    pocket_d = p.bearing_od + p.bearing_pocket_clearance\n\
    \    od = pocket_d + 2 * p.coupon_wall\n    flange_t = p.wheel_w - 2 * p.bearing_w\n\
    \    h = p.bearing_w + flange_t\n    return (\n        cq.Workplane(\"XY\")\n\
    \        .circle(od / 2.0)\n        .extrude(h)\n        .faces(\"<Z\")\n    \
    \    .workplane()\n        .hole(p.flange_id)\n        .faces(\">Z\")\n      \
    \  .workplane()\n        .hole(pocket_d, p.bearing_w)\n    )\n"
  print_orientation: flat on bed with the 18 mm flange face at z = 0
  use_orientation: test ring to verify 608ZZ press fit before printing the full wheel
hardware:
- id: bearing_608
  ref: 608ZZ
  qty: 2
- id: axle_bolt
  ref: ISO 4762 M8x35
  qty: 1
- id: axle_locknut
  ref: ISO 10511 M8
  qty: 1
joints:
- id: axle_joint
  fastener: axle_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: bottom_spacer
    feature: 8.25 mm axial bore
    role: clearance
  - part: wheel
    feature: dual 608ZZ bearing pocket and 18 mm bottom flange bore
    role: clearance
  - part: top_spacer
    feature: 8.25 mm axial bore
    role: clearance
  nut: axle_locknut
  external: closet door roller bracket
criteria:
- id: bearing_press_fit
  part: wheel
  feature: 22.15 mm counterbored bearing pocket (14 mm deep for two 608ZZ bearings)
  relation: seats
  hardware: bearing_608
  clearance_mm: 0.15
  params:
  - bearing_od
  - bearing_pocket_clearance
  - bearing_w
  check:
    method: coupon
    ref: bearing_fit_coupon
    description: Press a 608ZZ bearing into bearing_fit_coupon to verify a snug press
      fit before printing the full wheel.
- id: bearing_axial_stop
  part: wheel
  feature: 2 mm thick bottom outer-race retaining flange (18 mm bore)
  relation: supports
  hardware: bearing_608
  clearance_mm: null
  params:
  - wheel_w
  - bearing_w
  - flange_id
  check:
    method: coupon
    ref: bearing_fit_coupon
    description: Verify the 608ZZ bearing seats squarely against the 18 mm ID bottom
      retaining flange while its inner race spins freely without rubbing.
- id: wheel_envelope
  part: wheel
  feature: 50 mm OD x 16 mm wide outer rim with 1.5 mm edge chamfers
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - wheel_w
  - rim_chamfer
  check:
    method: measure
    ref: null
    description: Measure printed wheel outer diameter (50 mm) and width (16 mm) against
      the closet door bracket and track.
- id: bottom_spacer_clearance
  part: bottom_spacer
  feature: 8.25 mm bore and 11.6 mm OD stepped inner-race spacer body (3.5 mm tall)
  relation: clears
  hardware: axle_bolt
  clearance_mm: 0.25
  params:
  - bolt_d
  - bolt_clearance
  - spacer_od
  - wheel_w
  - bearing_w
  - spacer_standoff
  check:
    method: measure
    ref: null
    description: Slide the M8 bolt through bottom_spacer and verify it passes smoothly
      with minimal play and steps cleanly through the wheel flange bore to contact
      only the bearing inner race.
- id: top_spacer_clearance
  part: top_spacer
  feature: 8.25 mm bore and 11.6 mm OD inner-race standoff ring (1.5 mm tall)
  relation: clears
  hardware: axle_bolt
  clearance_mm: 0.25
  params:
  - bolt_d
  - bolt_clearance
  - spacer_od
  - spacer_standoff
  check:
    method: measure
    ref: null
    description: Slide the M8 bolt through top_spacer and verify it contacts only
      the top 608ZZ bearing inner race while holding the wheel 1.5 mm clear of the
      bracket/nut.
manual:
- n: '1'
  text: Print bearing_fit_coupon first and press one 608ZZ bearing into the pocket
    to confirm a snug press-fit against the bottom lip before printing the full wheel.
  parts:
  - bearing_fit_coupon
  hardware:
  - bearing_608
  tool: null
- n: '2'
  text: Print wheel, bottom_spacer, and top_spacer flat on the build plate (no supports
    needed). Press the first 608ZZ bearing into the top counterbore of wheel until
    it seats firmly against the 2 mm bottom retaining flange. Press the second 608ZZ
    bearing in directly on top of the first until it sits flush with the top face
    of the wheel.
  parts:
  - wheel
  hardware:
  - bearing_608
  tool: null
- n: '3'
  text: Insert the 3.5 mm tall bottom_spacer into the bottom flange opening of wheel
    so it contacts the bottom bearing's inner race, and place the 1.5 mm tall top_spacer
    against the top bearing's inner race. Pass the M8 bolt (your existing M8 bolt
    or ISO 4762 M8x35) through the closet door bracket, bottom_spacer, the two 608ZZ
    bearings inside wheel, and top_spacer, then secure with the M8 lock nut (ISO 10511
    M8). Tighten firmly—the bolt clamps cleanly across the steel bearing inner races
    and spacers while the wheel spins freely.
  parts:
  - wheel
  - bottom_spacer
  - top_spacer
  hardware:
  - bearing_608
  - axle_bolt
  - axle_locknut
  tool: 6 mm hex key and 13 mm wrench
