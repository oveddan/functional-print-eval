task: bearing-wheel
note: The wheel prints flat on the bed with the 2 mm retaining lip at z = 0..2 mm
  and the 14 mm dual-bearing bore from z = 2..16 mm, requiring zero supports or mid-air
  bridges. Two inner-race spacers (11.2 mm OD, 8.2 mm ID) ensure clamping force goes
  exclusively through the steel inner races of the two back-to-back 608ZZ bearings.
questions:
- text: What are the dimensions of the old roller wheel and bearings?
  answer: 'bearing od: about 22 mm (outside); bearing width: about 7 mm'
- text: What are the closet door track dimensions?
  answer: I can't measure that. Use your best judgment.
- text: What are the door roller bracket and M8 bolt dimensions?
  answer: 'bolt across: about 8 mm (the shank)'
params:
  bearing_pocket_clearance:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: Diametral clearance for 608ZZ press fit pocket, verified by test coupon
      (printed 22.09 mm, snug fit)
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ width (7.0 mm nominal; user measured ~7 mm)
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: Width of the original closet door roller wheel (~16 mm)
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: Outer diameter of the original closet door roller wheel (~50 mm)
  rim_chamfer:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: 45-degree chamfer on top and bottom outer wheel edges for smooth track entry
      and no elephant foot
  spacer_od:
    value: 11.2
    unit: mm
    kind: design
    source: design
    note: Outer diameter of inner-race spacers so they contact only the 608ZZ inner
      race and clear the dust shield
  standoff_h:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Axial clearance beyond the wheel faces provided by the inner-race spacers
      so the bracket/nut never rubs the wheel
  lip_h:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Coupon retaining lip height
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ outer diameter (22.0 mm nominal; user measured ~22 mm)
  lip_id:
    value: 18
    unit: mm
    kind: design
    source: design
    note: Inner diameter of the outer-race retaining lip at z = 0..2 mm
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ nominal bore diameter
  bolt_clearance:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: Diametral clearance for M8 bolt shank through inner-race spacers
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: M8 bolt shank diameter measured by user
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    pocket_d = p.bearing_od + p.bearing_pocket_clearance\n\
    \    part = (\n        cq.Workplane(\"XY\")\n        .circle(p.wheel_od / 2.0)\n\
    \        .extrude(p.wheel_w)\n        .edges(\">Z or <Z\")\n        .chamfer(p.rim_chamfer)\n\
    \        .faces(\"<Z\")\n        .workplane()\n        .hole(p.lip_id)\n     \
    \   .faces(\">Z\")\n        .workplane()\n        .hole(pocket_d, depth=2.0 *\
    \ p.bearing_w)\n    )\n    return part\n"
  print_orientation: Flat on the bed with the retaining-lip face down at z = 0
  use_orientation: Vertical in the closet door track, spinning on the horizontal M8
    bolt axle
- id: spacer_recessed
  role: final
  material: PLA
  code: "def build(p):\n    lip_h = p.wheel_w - 2.0 * p.bearing_w\n    h = lip_h +\
    \ p.standoff_h\n    bore_d = p.bolt_d + p.bolt_clearance\n    part = (\n     \
    \   cq.Workplane(\"XY\")\n        .circle(p.spacer_od / 2.0)\n        .extrude(h)\n\
    \        .faces(\">Z\")\n        .workplane()\n        .hole(bore_d)\n    )\n\
    \    return part\n"
  print_orientation: Flat on the bed at z = 0
  use_orientation: On the M8 bolt on the lip side of the wheel, passing through the
    18 mm lip opening to seat against the bearing inner race
- id: spacer_flush
  role: final
  material: PLA
  code: "def build(p):\n    bore_d = p.bolt_d + p.bolt_clearance\n    part = (\n \
    \       cq.Workplane(\"XY\")\n        .circle(p.spacer_od / 2.0)\n        .extrude(p.standoff_h)\n\
    \        .faces(\">Z\")\n        .workplane()\n        .hole(bore_d)\n    )\n\
    \    return part\n"
  print_orientation: Flat on the bed at z = 0
  use_orientation: On the M8 bolt on the flush bearing side of the wheel, seating
    against the bearing inner race
- id: coupon_bearing_pocket
  role: coupon
  material: PLA
  code: "def build(p):\n    pocket_d = p.bearing_od + p.bearing_pocket_clearance\n\
    \    outer_d = pocket_d + 6.0\n    total_h = p.lip_h + p.bearing_w\n    part =\
    \ (\n        cq.Workplane(\"XY\")\n        .circle(outer_d / 2.0)\n        .extrude(total_h)\n\
    \        .faces(\"<Z\")\n        .workplane()\n        .hole(p.lip_id)\n     \
    \   .faces(\">Z\")\n        .workplane()\n        .hole(pocket_d, depth=p.bearing_w)\n\
    \    )\n    return part\n"
  print_orientation: Flat on the bed (z = 0 is the bottom face with the retaining
    lip)
  use_orientation: Test 608ZZ bearing press fit into pocket and seat against lip
