manual:
- n: '1'
  text: Press the first 608ZZ bearing into the open top side of the printed wheel
    until it seats firmly against the internal 2 mm retaining lip at the bottom of
    the bore.
  parts:
  - wheel
  hardware:
  - bearing_608
  tool: null
- n: '2'
  text: Press the second 608ZZ bearing into the wheel right on top of the first bearing
    until its outer face sits flush with the top face of the wheel.
  parts:
  - wheel
  hardware:
  - bearing_608
  tool: null
- n: '3'
  text: Slide the M8 bolt through your door bracket, then place spacer_recessed (3
    mm thick) into the recessed lip side of the wheel against the bearing inner race,
    slide the wheel onto the bolt, place spacer_flush (1 mm thick) against the flush
    bearing inner race on the other side, and secure the bolt to the bracket. The
    two spacers clamp only the steel inner races of the two touching 608ZZ bearings
    so the wheel cannot rub or bind when tightened.
  parts:
  - spacer_recessed
  - wheel
  - spacer_flush
  hardware:
  - bolt_m8
  - bearing_608
  - locknut_m8
  tool: 6 mm hex key and 13 mm wrench
