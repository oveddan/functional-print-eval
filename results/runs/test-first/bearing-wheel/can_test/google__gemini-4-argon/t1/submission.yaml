manual:
- n: '1'
  text: Print the bearing_fit_coupon first and press one 608ZZ bearing into it to
    verify a snug press fit on your printer before printing the full wheel.
  parts:
  - bearing_fit_coupon
  hardware:
  - bearing_608
  tool: null
- n: '2'
  text: Print the roller_wheel and both spacers (spacer_lip_side and spacer_open_side).
    Press both 608ZZ bearings into the top bore of roller_wheel one after another
    until the first bearing seats firmly against the 2 mm bottom retaining lip and
    the second bearing sits flush with the top face of the wheel.
  parts:
  - roller_wheel
  hardware:
  - bearing_608
  tool: null
- n: '3'
  text: Slide the M8 bolt through the flange side of spacer_open_side so its narrow
    11.2 mm boss seats against the top bearing's inner race, pass the bolt through
    both 608ZZ bearings in the wheel, and fit spacer_lip_side onto the protruding
    bolt from the bottom side so its longer 11.2 mm boss reaches through the wheel's
    bottom lip opening to contact the bottom bearing's inner race.
  parts:
  - roller_wheel
  - spacer_open_side
  - spacer_lip_side
  hardware:
  - bolt_m8
  tool: null
- n: '4'
  text: Pass the M8 bolt through your closet door hanger bracket, place the M8 washer
    and M8 nylon-insert lock nut on the back of the bracket, and tighten. Because
    the two bearings sit face-to-face inside the wheel and the stepped spacers contact
    only the inner races, you can tighten the M8 bolt firmly without binding the wheel.
  parts:
  - roller_wheel
  - spacer_open_side
  - spacer_lip_side
  hardware:
  - bolt_m8
  - washer_m8
  - nut_m8_lock
  tool: 6 mm hex key and 13 mm wrench
