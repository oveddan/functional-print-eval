task: bearing-wheel
note: The wheel holds two 608ZZ bearings back-to-back in a single straight bore with
  a 2 mm bottom outer-race retaining lip, eliminating internal overhangs and preventing
  axial preload binding when the M8 axle bolt is tightened. Stepped inner-race spacers
  on both sides isolate the bearing shields and provide 2 mm clearance between the
  spinning wheel and the door bracket/bolt head.
questions: []
params:
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ outer diameter
  rim_chamfer:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: 45-degree corner chamfer on outer rim edges for smooth tracking and clean
      printing
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ width
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: Width of original closet door roller wheel
  lip_id:
    value: 19
    unit: mm
    kind: design
    source: design
    note: Inner diameter of retaining lip, supporting only the 608ZZ outer race
  bearing_bore_clearance:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: Diametral clearance for 608ZZ press fit in PLA
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: Outer diameter of original closet door roller wheel
  m8_clearance:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: Diametral clearance for M8 bolt in printed spacers
  coupon_wall:
    value: 3
    unit: mm
    kind: design
    source: design
    note: Radial wall thickness of test coupon ring
  spacer_clearance_gap:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Axial clearance between wheel face and bracket or bolt head face provided
      by spacerboss
  spacer_flange_od:
    value: 16
    unit: mm
    kind: design
    source: design
    note: Outer flange diameter matching M8 washer OD
  lead_in_chamfer:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Top entry chamfer on bearing bore for easy insertion
  m8_d:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: M8 bolt nominal shaft diameter
  lip_h:
    value: 2
    unit: mm
    kind: design
    source: design
    note: Bottom outer-race retaining lip thickness (wheel_w - 2 * bearing_w)
  spacer_flange_h:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Outer flange thickness of each spacer
  spacer_boss_od:
    value: 11.2
    unit: mm
    kind: design
    source: design
    note: Outer diameter of spacer step that contacts only the 608ZZ inner race
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ nominal inner bore diameter
parts:
- id: roller_wheel
  role: final
  material: PLA
  code: "def build(p):\n    pocket_d = p.bearing_od + p.bearing_bore_clearance\n \
    \   pocket_depth = 2.0 * p.bearing_w\n    wheel = (\n        cq.Workplane(\"XY\"\
    )\n        .circle(p.wheel_od / 2.0)\n        .extrude(p.wheel_w)\n        .edges(\"\
    |Z\")\n        .efiei() if False else\n        cq.Workplane(\"XY\")\n        .circle(p.wheel_od\
    \ / 2.0)\n        .extrude(p.wheel_w)\n    )\n    # Chamfer outer top and bottom\
    \ edges of the wheel rim\n    wheel = wheel.edges(\"%CIRCLE\").chamfer(p.rim_chamfer)\n\
    \    # Cut through-hole for bottom outer-race retaining lip\n    wheel = (\n \
    \       wheel.faces(\">Z\")\n        .workplane()\n        .circle(p.lip_id /\
    \ 2.0)\n        .cutThruAll()\n    )\n    # Cut dual-bearing pocket from top face\
    \ down to the bottom retaining lip\n    wheel = (\n        wheel.faces(\">Z\"\
    )\n        .workplane()\n        .circle(pocket_d / 2.0)\n        .cutBlind(-pocket_depth)\n\
    \    )\n    # Small lead-in chamfer on the top bearing bore edge\n    wheel =\
    \ (\n        wheel.faces(\">Z\")\n        .edges(cq.selectors.RadiusNthSelector(0))\n\
    \        .chamfer(p.lead_in_chamfer)\n    )\n    return wheel\n"
  print_orientation: Flat on the build plate (z=0 is the retaining lip side, bearing
    bore opens toward +Z) so there are zero overhangs.
  use_orientation: Spins vertically on the horizontal M8 axle bolt inside the closet
    door track.
- id: spacer_lip_side
  role: final
  material: PLA
  code: "def build(p):\n    bore_d = p.m8_d + p.m8_clearance\n    boss_h = p.lip_h\
    \ + p.spacer_clearance_gap\n    total_h = p.spacer_flange_h + boss_h\n    spacer\
    \ = (\n        cq.Workplane(\"XY\")\n        .circle(p.spacer_flange_od / 2.0)\n\
    \        .extrude(p.spacer_flange_h)\n        .faces(\">Z\")\n        .workplane()\n\
    \        .circle(p.spacer_boss_od / 2.0)\n        .extrude(boss_h)\n        .faces(\"\
    >Z\")\n        .workplane()\n        .circle(bore_d / 2.0)\n        .cutThruAll()\n\
    \    )\n    return spacer\n"
  print_orientation: Flat with the 16 mm flange on the bed (z=0) and the 11.2 mm boss
    pointing up (+Z).
  use_orientation: Mounts on the M8 bolt on the lip side of the wheel; the 11.2 mm
    boss reaches through the retaining lip opening to clamp only the bottom bearing
    inner race.
- id: spacer_open_side
  role: final
  material: PLA
  code: "def build(p):\n    bore_d = p.m8_d + p.m8_clearance\n    boss_h = p.spacer_clearance_gap\n\
    \    spacer = (\n        cq.Workplane(\"XY\")\n        .circle(p.spacer_flange_od\
    \ / 2.0)\n        .extrude(p.spacer_flange_h)\n        .faces(\">Z\")\n      \
    \  .workplane()\n        .circle(p.spacer_boss_od / 2.0)\n        .extrude(boss_h)\n\
    \        .faces(\">Z\")\n        .workplane()\n        .circle(bore_d / 2.0)\n\
    \        .cutThruAll()\n    )\n    return spacer\n"
  print_orientation: Flat with the 16 mm flange on the bed (z=0) and the 11.2 mm boss
    pointing up (+Z).
  use_orientation: Mounts on the M8 bolt on the flush bearing side of the wheel; the
    11.2 mm boss contacts only the top bearing inner race.
- id: bearing_fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    pocket_d = p.bearing_od + p.bearing_bore_clearance\n \
    \   od = pocket_d + 2.0 * p.coupon_wall\n    h = p.bearing_w + p.lip_h\n    coupon\
    \ = (\n        cq.Workplane(\"XY\")\n        .circle(od / 2.0)\n        .circle(p.lip_id\
    \ / 2.0)\n        .extrude(h)\n        .faces(\">Z\")\n        .workplane()\n\
    \        .circle(pocket_d / 2.0)\n        .cutBlind(-p.bearing_w)\n    )\n   \
    \ return coupon\n"
  print_orientation: Flat on the bed (z=0) with the bearing pocket opening upward
    (+Z).
  use_orientation: Test ring to verify 608ZZ press fit before printing the full roller
    wheel.
