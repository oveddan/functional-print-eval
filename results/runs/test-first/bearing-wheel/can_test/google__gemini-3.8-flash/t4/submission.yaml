task: bearing-wheel
note: Replacement sliding closet door roller wheel (50 mm OD x 16 mm width) designed
  for two 608 skateboard bearings and an M8 bolt. Includes a matched inner bearing
  spacer to prevent axial binding when clamping, plus outer standoff bushings to prevent
  the wheel face from rubbing against the mounting bracket or bolt head. 100% support-free
  print using self-supporting 45-degree internal transitions and chamfered rims.
questions:
- text: Can the wheel spin freely when the M8 bolt is tightened firmly into the bracket?
  answer: Yes. The printed 'spacer_inner' bridges the 2 mm gap between the two bearing
    inner rings, and the two 'standoff' bushings keep the wheel face from touching
    the door bracket or bolt head. Clamping force passes solely through the stationary
    inner rings, leaving the wheel and outer rings completely free to rotate.
- text: Does the part print without supports?
  answer: Yes. The internal shoulder uses a 45-degree conical taper on the lower pocket
    that requires no support, and the upper pocket forms a horizontal floor directly
    supported by the solid layer beneath it. The outer rims use 45-degree chamfers.
    Every feature prints cleanly with zero supports.
params:
  bearing_pocket_d:
    value: 22.2
    unit: mm
    kind: design
    source: design
    note: Bore diameter for snug press fit of 608 bearing (verified via test coupon)
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: asked
    note: M8 bolt diameter
  shoulder_thickness:
    value: 2
    unit: mm
    kind: design
    source: design
    note: Thickness of internal shoulder between the two bearings (16 - 2*7 = 2 mm)
  wheel_width:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: Old roller total width
  spacer_od:
    value: 11.5
    unit: mm
    kind: design
    source: design
    note: Outer diameter of printed spacers, sized to contact only 608 bearing inner
      ring (<12mm)
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: catalog
    note: 608 bearing nominal outer diameter
  bearing_width:
    value: 7
    unit: mm
    kind: hardware
    source: catalog
    note: 608 bearing nominal width
  spacer_id:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: Inner diameter of printed spacers for smooth clearance over M8 bolt
  rim_chamfer:
    value: 2
    unit: mm
    kind: design
    source: design
    note: 45-degree chamfer on outer rim edges for smooth tracking in channel or track
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: Old roller outer diameter
  standoff_length:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: Length of outer standoff bushings to clear door bracket and bolt head
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: 608 bearing nominal bore
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    r_outer = p.wheel_od / 2.0\n    r_bearing = p.bearing_pocket_d\
    \ / 2.0\n    r_inner = r_bearing - p.shoulder_thickness\n    z_bottom = 0.0\n\
    \    z_shoulder_bottom = p.bearing_width\n    z_shoulder_top = p.bearing_width\
    \ + p.shoulder_thickness\n    z_top = p.wheel_width\n    chamfer = p.rim_chamfer\n\
    \n    pts = [\n        (r_inner, z_shoulder_top),\n        (r_bearing, z_shoulder_top),\n\
    \        (r_bearing, z_top),\n        (r_outer - chamfer, z_top),\n        (r_outer,\
    \ z_top - chamfer),\n        (r_outer, z_bottom + chamfer),\n        (r_outer\
    \ - chamfer, z_bottom),\n        (r_bearing, z_bottom),\n        (r_bearing, z_shoulder_bottom),\n\
    \    ]\n\n    wheel = (\n        cq.Workplane(\"XZ\")\n        .polyline(pts)\n\
    \        .close()\n        .revolve()\n    )\n    return wheel\n"
  print_orientation: bottom face on bed (z = 0)
  use_orientation: z vertical (rotation axis horizontal on door bracket)
- id: spacer_inner
  role: final
  material: PLA
  code: "def build(p):\n    return (\n        cq.Workplane(\"XY\")\n        .circle(p.spacer_od\
    \ / 2.0)\n        .circle(p.spacer_id / 2.0)\n        .extrude(p.shoulder_thickness)\n\
    \    )\n"
  print_orientation: flat face on bed (z = 0)
  use_orientation: between bearing inner rings on M8 bolt
- id: standoff
  role: final
  material: PLA
  code: "def build(p):\n    return (\n        cq.Workplane(\"XY\")\n        .circle(p.spacer_od\
    \ / 2.0)\n        .circle(p.spacer_id / 2.0)\n        .extrude(p.standoff_length)\n\
    \    )\n"
  print_orientation: flat face on bed (z = 0)
  use_orientation: between bearing inner ring and mounting bracket / bolt head
