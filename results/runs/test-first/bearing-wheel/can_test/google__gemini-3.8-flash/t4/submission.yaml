manual:
- n: '1'
  text: 3D print 1x 'wheel', 1x 'spacer_inner', and 2x 'standoff' in PLA at 0.2 mm
    layer height, 4 perimeters, and 30%+ infill for strength. No supports are needed.
  parts:
  - wheel
  - spacer_inner
  - standoff
  hardware: []
  tool: null
- n: '2'
  text: Press the first 608ZZ bearing firmly into the bottom pocket of the wheel until
    it seats against the internal shoulder.
  parts:
  - wheel
  hardware:
  - bearing_1
  tool: null
- n: '3'
  text: Drop the printed 'spacer_inner' (2.0 mm height) into the central bore from
    the top side so it rests flat against the inner ring of the first bearing.
  parts:
  - wheel
  - spacer_inner
  hardware: []
  tool: null
- n: '4'
  text: Press the second 608ZZ bearing into the top pocket of the wheel until it seats
    firmly against the internal shoulder and the inner spacer.
  parts:
  - wheel
  hardware:
  - bearing_2
  tool: null
- n: '5'
  text: Slide an M8 washer and one printed 'standoff' bushing onto the M8 bolt. Push
    the bolt through the wheel assembly (first bearing, inner spacer, second bearing).
    Slide the second 'standoff' bushing onto the bolt on the opposite side.
  parts:
  - wheel
  - standoff
  hardware:
  - bolt
  - washer_head
  tool: null
- n: '6'
  text: Pass the bolt through your closet door mounting bracket. Place an M8 washer
    and thread the M8 nut onto the bolt. Tighten securely. Verify that the wheel spins
    freely without rubbing against the bracket or bolt head.
  parts: []
  hardware:
  - nut
  - washer_nut
  tool: hex key / wrench
