parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    r_in = p.shoulder_id / 2.0\n    r_pocket = p.pocket_d\
    \ / 2.0\n    r_out = p.wheel_od / 2.0\n    r_groove = r_out - p.groove_depth\n\
    \    h = p.wheel_width\n    z_sh = p.shoulder_t\n    w_flat = p.rim_flat_w\n \
    \   z_mid = h / 2.0\n    chamfer = 0.5\n\n    wire = (\n        cq.Workplane(\"\
    XZ\")\n        .moveTo(r_in, 0)\n        .lineTo(r_out, 0)\n        .lineTo(r_out,\
    \ w_flat)\n        .threePointsArc((r_groove, z_mid), (r_out, h - w_flat))\n \
    \       .lineTo(r_out, h - chamfer)\n        .lineTo(r_out - chamfer, h)\n   \
    \     .lineTo(r_pocket, h)\n        .lineTo(r_pocket, z_sh)\n        .lineTo(r_in,\
    \ z_sh)\n        .close()\n    )\n    return wire.revolve()\n"
  print_orientation: Bottom face on build plate (Z=0)
  use_orientation: Vertical, rotating around M8 axle bolt
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    r_in = p.bolt_clearance_d / 2.0\n    r_out = p.spacer_od\
    \ / 2.0\n    h = p.spacer_thickness\n    wire = (\n        cq.Workplane(\"XZ\"\
    )\n        .moveTo(r_in, 0)\n        .lineTo(r_out, 0)\n        .lineTo(r_out,\
    \ h)\n        .lineTo(r_in, h)\n        .close()\n    )\n    return wire.revolve()\n"
  print_orientation: Flat face on build plate (Z=0)
  use_orientation: Slid onto M8 bolt between bearing inner race and bracket/bolt head
- id: bearing_fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    base = cq.Workplane(\"XY\").box(60, 32, p.coupon_thickness).translate((0,\
    \ 0, p.coupon_thickness / 2.0))\n    res = (\n        base.faces(\">Z\").workplane()\n\
    \        .pushPoints([(-16, 0)])\n        .hole(p.shoulder_id)\n        .faces(\"\
    >Z\").workplane()\n        .pushPoints([(-16, 0)])\n        .hole(p.test_pocket_tight,\
    \ p.bearing_w)\n        .faces(\">Z\").workplane()\n        .pushPoints([(16,\
    \ 0)])\n        .hole(p.shoulder_id)\n        .faces(\">Z\").workplane()\n   \
    \     .pushPoints([(16, 0)])\n        .hole(p.test_pocket_medium, p.bearing_w)\n\
    \        .faces(\">Z\").workplane()\n        .pushPoints([(0, 0)])\n        .hole(p.bolt_clearance_d)\n\
    \    )\n    return res\n"
  print_orientation: Bottom face on build plate (Z=0)
  use_orientation: Top face up (+Z), test inserting 608 bearing into pockets and M8
    bolt through center hole
