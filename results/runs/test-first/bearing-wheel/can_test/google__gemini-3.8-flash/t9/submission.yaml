task: bearing-wheel
note: Replacement closet door roller wheel engineered for two 608 bearings on an M8
  bolt. Features dual flat shoulders with a central 1.5 mm concave groove to support
  both flat tracks and beaded rails, plus custom standoff spacers to isolate the rotating
  wheel from the bolt head and bracket.
questions:
- text: Does the wheel work on both flat channels and grooved or beaded tracks?
  answer: Yes. The outer profile combines two 3 mm flat outer shoulders (50 mm OD)
    to roll smoothly in flat channels, with a central 1.5 mm deep concave radius to
    ride securely on raised round or bead rails without derailing.
- text: Why are the printed spacer bushings necessary?
  answer: Standard M8 bolt heads and hex nuts have diameters of 13 mm or more, which
    would rub against the rotating 608 bearing shields and wheel face. The 3D-printed
    spacers have an outer diameter of 11.5 mm, ensuring they contact only the stationary
    8 mm inner ring, giving 3 mm of axial clearance for 100% friction-free spinning.
