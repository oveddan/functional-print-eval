manual:
- n: '1'
  text: Press the first 608 bearing into the wheel's bearing pocket until it firmly
    seats against the bottom retaining shoulder.
  parts:
  - wheel
  hardware:
  - bearing_608
  tool: null
- n: '2'
  text: Press the second 608 bearing into the pocket directly on top of the first
    bearing until it sits flush with the top face of the wheel.
  parts:
  - wheel
  hardware:
  - bearing_608
  tool: null
- n: '3'
  text: Slide an M8 washer onto the M8 bolt, followed by one printed spacer, and insert
    the bolt through the bearings from either side of the wheel.
  parts:
  - wheel
  - spacer
  hardware:
  - m8_bolt
  - m8_washer
  tool: null
- n: '4'
  text: Slide the second printed spacer onto the protruding end of the M8 bolt on
    the opposite side of the wheel.
  parts:
  - spacer
  hardware:
  - m8_bolt
  tool: null
- n: '5'
  text: Pass the bolt through the door mounting bracket, place an M8 washer on the
    threaded end, and secure with the M8 lock nut. Tighten firmly and verify that
    the wheel spins smoothly with zero wobble or rubbing.
  parts: []
  hardware:
  - m8_bolt
  - m8_washer
  - m8_nut
  tool: 6mm hex key and 13mm wrench
