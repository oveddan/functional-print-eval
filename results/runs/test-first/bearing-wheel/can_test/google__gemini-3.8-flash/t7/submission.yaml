  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: Inner ring bore of standard 608 skateboard bearing
  flange_thickness:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Thickness of outer bearing retention flange on each half
  bearing_pocket_dia:
    value: 22.15
    unit: mm
    kind: design
    source: design
    note: Pocket bore for snug press fit on 22 mm bearing in PLA
  spacer_length:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: Total length of axle spacer bushing
  pin_height:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: Height of alignment dowel pins
  spacer_id:
    value: 8.4
    unit: mm
    kind: design
