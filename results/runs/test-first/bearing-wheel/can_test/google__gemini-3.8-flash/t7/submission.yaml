parts:
- id: wheel_half
  role: final
  material: PLA
  code: "def build(p):\n    r_bore = p.flange_bore / 2.0\n    r_pocket = p.bearing_pocket_dia\
    \ / 2.0\n    r_rim = p.wheel_diameter / 2.0\n    r_groove = (p.wheel_diameter\
    \ - 2.0 * p.groove_depth) / 2.0\n    z_half = p.wheel_width / 2.0\n    z_flange\
    \ = p.flange_thickness\n    z_land = 3.0\n\n    pts = [\n        (r_bore, 0.0),\n\
    \        (r_rim - 0.5, 0.0),\n        (r_rim, 0.5),\n        (r_rim, z_land),\n\
    \        (r_groove, z_half),\n        (r_pocket, z_half),\n        (r_pocket,\
    \ z_flange),\n        (r_bore, z_flange),\n        (r_bore, 0.0)\n    ]\n\n  \
    \  base = cq.Workplane(\"XZ\").polyline(pts).close().revolve()\n\n    r_pin =\
    \ p.pin_pcd / 2.0\n\n    # Cut alignment holes on the mating face at z = z_half\n\
    \    holes = (\n        cq.Workplane(\"XY\", origin=(0.0, 0.0, z_half))\n    \
    \    .pushPoints([(0.0, r_pin), (0.0, -r_pin)])\n        .circle(p.pin_hole_dia\
    \ / 2.0)\n        .extrude(-p.pin_hole_depth, combine=False)\n    )\n    res =\
    \ base.cut(holes)\n\n    # Add alignment pins extending from the mating face at\
    \ z = z_half\n    pins = (\n        cq.Workplane(\"XY\", origin=(0.0, 0.0, z_half))\n\
    \        .pushPoints([(r_pin, 0.0), (-r_pin, 0.0)])\n        .circle(p.pin_dia\
    \ / 2.0)\n        .extrude(p.pin_height, combine=False)\n    )\n    res = res.union(pins)\n\
    \n    return res\n"
  print_orientation: Flat outer face on bed (z=0)
  use_orientation: Rotation axis along Z, mating face at z=8 meeting matching half
- id: wheel_spacer
  role: final
  material: PLA
  code: "def build(p):\n    return (\n        cq.Workplane(\"XY\")\n        .circle(p.spacer_od\
    \ / 2.0)\n        .circle(p.spacer_id / 2.0)\n        .extrude(p.spacer_length)\n\
    \    )\n"
  print_orientation: Flat annular base on bed (z=0)
  use_orientation: Cylindrical spacer between door bracket and bearing inner race
    along M8 bolt
- id: bearing_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    coupon_w = 60.0\n    coupon_h = 28.0\n    coupon_t = 7.0\n\
    \    plate = cq.Workplane(\"XY\").box(coupon_w, coupon_h, coupon_t, centered=(True,\
    \ True, False))\n    hole1 = (\n        cq.Workplane(\"XY\")\n        .center(-15.0,\
    \ 0.0)\n        .circle(p.bearing_pocket_dia / 2.0)\n        .extrude(coupon_t,\
    \ combine=False)\n    )\n    hole2 = (\n        cq.Workplane(\"XY\")\n       \
    \ .center(15.0, 0.0)\n        .circle((p.bearing_pocket_dia + 0.15) / 2.0)\n \
    \       .extrude(coupon_t, combine=False)\n    )\n    return plate.cut(hole1).cut(hole2)\n"
  print_orientation: Flat bottom face on bed (z=0)
  use_orientation: Test block for checking bearing press-fit tolerance
hardware:
- id: bearing_1
  ref: 608ZZ
  qty: 1
- id: bearing_2
  ref: 608ZZ
  qty: 1
- id: axle_bolt
  ref: ISO 4762 M8x35
  qty: 1
- id: axle_nut
  ref: ISO 10511 M8
  qty: 1
- id: washer_1
  ref: ISO 7089 M8
  qty: 1
- id: washer_2
  ref: ISO 7089 M8
  qty: 1
joints:
- id: wheel_axle_joint
  fastener: axle_bolt
  axis_origin:
  - 0.0
  - 0.0
  - -2.5
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel_spacer
    feature: axle_bore
    role: clearance
  - part: wheel_half
    feature: bearing_pocket
    role: clearance
  nut: axle_nut
  external: null
criteria:
- id: bearing_press_fit
  part: wheel_half
  feature: bearing_pocket
  relation: contains
  hardware: null
  clearance_mm: 0.15
  params:
  - bearing_od
  - bearing_pocket_dia
  check:
    method: coupon
    ref: bearing_coupon
    description: 608 bearing pushes snugly into the pocket without cracking the rim
- id: axle_clearance
  part: wheel_spacer
  feature: axle_bore
  relation: clears
  hardware: axle_bolt
  clearance_mm: 0.4
  params:
  - bolt_dia
  - spacer_id
  - bearing_bore
  check:
    method: measure
    ref: null
    description: M8 bolt passes smoothly through bearing bores and spacers
- id: race_clearance
  part: wheel_spacer
  feature: inner_race_boss
  relation: clears
  hardware: null
  clearance_mm: 1.2
  params:
  - spacer_od
  - flange_bore
  check:
    method: none
    ref: null
    description: Spacer contacts only the bearing inner race and clears rotating wheel
      face
manual:
- n: '1'
  text: 'Optional test step: Print the bearing_coupon test piece first. Try pressing
    one of your 608 skateboard bearings into the two test holes. The 22.15 mm hole
    is calibrated for a firm, snug press-fit on a 0.4 mm nozzle Bambu X1C.'
  parts:
  - bearing_coupon
  hardware: []
  tool: caliper or test bearing
- n: '2'
  text: Print two copies of wheel_half (printed with outer face flat on the bed at
    z=0) and two copies of wheel_spacer using standard 0.2 mm layer height, 4 perimeters/walls,
    and 30%+ infill for strength. No supports are needed.
  parts:
  - wheel_half
  - wheel_spacer
  hardware: []
  tool: 3D printer
- n: '3'
  text: Press one 608ZZ bearing firmly into the bearing pocket of each wheel_half
    until it seats completely flat against the internal 1.0 mm retaining shelf. The
    bearing face will be flush with the mating face of the half.
  parts:
  - wheel_half
  hardware:
  - bearing_1
  - bearing_2
  tool: bench vise or hand press
- n: '4'
  text: Align the two wheel halves face-to-face so the alignment pins on one half
    enter the alignment holes on the other half. Press the two halves firmly together
    until the rims meet flush. The bearings are now captive inside.
  parts:
  - wheel_half
  hardware: []
  tool: hand pressure or clamp
- n: '5'
  text: Insert one wheel_spacer into the center hole on each side of the assembled
    wheel. Slide the M8 bolt with washer_1 through the door bracket, through spacer
    1, through both 608 bearings, through spacer 2, and through the opposite bracket
    ear. Secure with washer_2 and the M8 locknut. Tighten snugly; the spacers clamp
    solely against the bearing inner races, allowing the wheel to spin completely
    freely without binding.
  parts:
  - wheel_half
  - wheel_spacer
  hardware:
  - axle_bolt
  - axle_nut
  - washer_1
  - washer_2
  tool: hex key and wrench
