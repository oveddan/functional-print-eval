task: bearing-wheel
note: Robust two-piece interlocking replacement roller wheel for a sliding closet
  door. Uses two standard 608 skateboard bearings and an M8 bolt. Symmetrical hermaphroditic
  design prints 100% support-free with solid flat bearing seats, captive bearing retention,
  and a dual-purpose rim profile (smooth central groove for round beaded tracks plus
  flat outer shoulders for channel tracks).
questions: []
