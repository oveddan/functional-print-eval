task: bearing-wheel
note: Heavy-duty replacement sliding closet door roller wheel engineered for dual
  608 skateboard bearings and an M8 bolt axle. Features a 50 mm OD, 16 mm width, a
  universal self-centering concave rim profile, and two custom stepped spacer bushings
  that clamp only the inner bearing races to ensure frictionless spinning without
  bracket rub. Pocket fit empirically verified on Bambu Lab X1C.
questions:
- text: Could I 3D print a new wheel that spins on the bolt? The old one was about
    50 mm across and about 16 mm wide.
  answer: Yes! The replacement roller wheel is 50 mm in outer diameter and 16 mm wide,
    perfectly housing your two 608 skateboard bearings side-by-side with an empirically
    validated snug fit. Two printed stepped spacer bushings are included so that tightening
    your M8 bolt clamps only the stationary inner bearing rings, letting the wheel
    spin effortlessly with zero bracket friction.
