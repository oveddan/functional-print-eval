manual:
- n: '1'
  text: Take the printed roller wheel and press the first 608 bearing firmly into
    the open pocket until it seats flat against the bottom 2.0 mm retaining shoulder.
    Press the second 608 bearing directly on top of the first bearing until it sits
    flush with the open face of the wheel. Both bearings fit snugly side-by-side inside
    the 14.0 mm deep pocket.
  parts:
  - roller_wheel
  hardware:
  - 608_bearing
  tool: Bench vise or rubber mallet (optional)
- n: '2'
  text: Slide an M8 washer onto your M8 bolt, followed by the first 3D-printed spacer
    bushing with its wide flange against the washer and its narrow 11.2 mm nose pointing
    toward the bolt tip.
  parts:
  - spacer_bushing
  hardware:
  - m8_bolt
  - m8_washer
  tool: null
- n: '3'
  text: Insert the M8 bolt through your closet door bracket hole, then push the bolt
    through the roller wheel from the recessed shoulder side. The narrow nose of the
    first spacer bushing will enter the 18.5 mm shoulder opening and seat directly
    against the inner race of the first bearing, keeping the rotating wheel rim from
    rubbing against the bracket.
  parts:
  - roller_wheel
  - spacer_bushing
  hardware: []
  tool: null
- n: '4'
  text: On the flush side of the wheel, slide the second spacer bushing onto the bolt
    with its narrow 11.2 mm nose facing inward against the second bearing inner race.
    Add an M8 washer and thread on the M8 lock nut. Tighten the nut firmly; the spacers
    clamp solely against the stationary inner races, leaving the wheel body completely
    free to spin with minimal friction.
  parts:
  - spacer_bushing
  hardware:
  - m8_nut
  - m8_washer
  tool: Wrench / socket
- n: '5'
  text: Lift the closet door back onto the track. The concave wheel profile will self-center
    smoothly on curved track beads or roll stably along flat channel lips.
  parts:
  - roller_wheel
  hardware: []
  tool: null
