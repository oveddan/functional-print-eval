parts:
- id: roller_wheel
  role: final
  material: PLA
  code: "def build(p):\n    r_outer = p.wheel_od / 2.0\n    pocket_d = p.bearing_od\
    \ + p.bore_fit_clearance\n    r_pocket = pocket_d / 2.0\n    r_shoulder = p.shoulder_bore_d\
    \ / 2.0\n    w = p.wheel_width\n    h_shoulder = p.shoulder_thickness\n    ch\
    \ = p.edge_chamfer\n    g_depth = p.groove_depth\n    g_w = p.groove_width\n \
    \   r_groove = r_outer - g_depth\n\n    z_g_start = (w - g_w) / 2.0\n    z_g_mid\
    \ = w / 2.0\n    z_g_end = (w + g_w) / 2.0\n\n    s = (\n        cq.Workplane(\"\
    XZ\")\n        .moveTo(r_shoulder, 0.0)\n        .lineTo(r_outer - ch, 0.0)\n\
    \        .lineTo(r_outer, ch)\n        .lineTo(r_outer, z_g_start)\n        .threePointArc((r_groove,\
    \ z_g_mid), (r_outer, z_g_end))\n        .lineTo(r_outer, w - ch)\n        .lineTo(r_outer\
    \ - ch, w)\n        .lineTo(r_pocket, w)\n        .lineTo(r_pocket, h_shoulder)\n\
    \        .lineTo(r_shoulder, h_shoulder)\n        .close()\n    )\n    return\
    \ s.revolve()\n"
  print_orientation: Bottom face (Z=0) flat on the build plate
  use_orientation: Rides on sliding closet door track, rotating around M8 bolt axle
- id: spacer_bushing
  role: final
  material: PLA
  code: "def build(p):\n    r_bore = p.spacer_bore_d / 2.0\n    r_flange = p.spacer_flange_od\
    \ / 2.0\n    r_nose = p.spacer_nose_od / 2.0\n    h_flange = p.spacer_flange_h\n\
    \    h_nose = p.spacer_nose_h\n    total_h = h_flange + h_nose\n    ch = 0.5\n\
    \n    s = (\n        cq.Workplane(\"XZ\")\n        .moveTo(r_bore + ch, 0.0)\n\
    \        .lineTo(r_flange, 0.0)\n        .lineTo(r_flange, h_flange)\n       \
    \ .lineTo(r_nose, h_flange)\n        .lineTo(r_nose, total_h - ch)\n        .lineTo(r_nose\
    \ - ch, total_h)\n        .lineTo(r_bore, total_h)\n        .lineTo(r_bore, ch)\n\
    \        .close()\n    )\n    return s.revolve()\n"
  print_orientation: Wide flange (Z=0) flat on the build plate
  use_orientation: Sits on M8 bolt between 608 inner race and bracket/washer
- id: bearing_fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    pocket_d = p.bearing_od + p.bore_fit_clearance\n    block\
    \ = cq.Workplane(\"XY\").box(p.coupon_size, p.coupon_size, p.coupon_height)\n\
    \    block = block.faces(\">Z\").workplane().circle(p.inner_clearance_d / 2.0).cutThruAll()\n\
    \    block = block.faces(\">Z\").workplane().circle(pocket_d / 2.0).cutBlind(-p.coupon_depth)\n\
    \    return block\n"
  print_orientation: Bottom face flat on the build plate
  use_orientation: Bearing fit validation coupon
