task: bearing-wheel
note: Replacement 50 mm x 16 mm sliding closet door roller wheel engineered for two
  608 bearings on an M8 axle. Dual-profile tread works on both beaded rails and flat
  channels. Self-supporting geometry prints cleanly without supports. Dedicated printed
  axle spacers isolate the rotating wheel from the mounting bracket.
questions: []
params:
  bearing_width:
    value: 7
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal width of standard 608 bearing
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal outer diameter of standard 608 bearing
  wheel_width:
    value: 16
    unit: mm
    kind: design
    source: asked
    note: Total width of closet door roller wheel requested by user
  groove_width:
    value: 8
    unit: mm
    kind: design
    source: design
    note: Axial width of central concave groove for track rail engagement
  edge_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: 45-degree protective chamfer on outer rim edges
  spacer_length:
    value: 3
    unit: mm
    kind: design
    source: design
    note: Total length of primary axle spacer (1 mm recess engagement + 2 mm bracket
      clearance)
  bore_entry_chamfer:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Lead-in chamfer at open end of bore for smooth bearing insertion
  bearing_fit_clearance:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: Diametral clearance to achieve a firm push-fit on Bambu X1C in PLA without
      cracking
  wheel_od:
    value: 50
    unit: mm
    kind: design
    source: asked
    note: Outer diameter of closet door roller wheel requested by user
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal inside bore diameter of standard 608 bearing
  spacer_od:
    value: 11.8
    unit: mm
    kind: design
    source: design
    note: Outside diameter of axle spacer; contacts only the 8-12 mm bearing inner
      race land
  spacer_id:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: Inside diameter of axle spacer for M8 bolt clearance
  lip_thickness:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Axial thickness of internal bearing retaining lip at base
  lip_bore:
    value: 14
    unit: mm
    kind: design
    source: design
    note: Inside diameter of retaining lip; clears 12 mm inner race while supporting
      22 mm outer race
  shim_length:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Thickness of optional fit-adjustment shim
  groove_depth:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Radial depth of central concave groove
parts:
- id: roller_wheel
  role: final
  material: PLA
  code: "def build(p):\n    import cadquery as cq\n\n    r_lip = p.lip_bore / 2.0\n\
    \    r_bearing = (p.bearing_od + p.bearing_fit_clearance) / 2.0\n    r_outer =\
    \ p.wheel_od / 2.0\n    r_groove_bottom = r_outer - p.groove_depth\n\n    z_lip\
    \ = p.lip_thickness\n    z_chamfer_bottom = p.edge_chamfer\n    z_groove_start\
    \ = (p.wheel_width - p.groove_width) / 2.0\n    z_groove_center = p.wheel_width\
    \ / 2.0\n    z_groove_end = (p.wheel_width + p.groove_width) / 2.0\n    z_chamfer_top\
    \ = p.wheel_width - p.edge_chamfer\n    z_top = p.wheel_width\n    z_entry_chamfer\
    \ = z_top - p.bore_entry_chamfer\n    r_entry = r_bearing + p.bore_entry_chamfer\n\
    \n    profile = (\n        cq.Workplane(\"XZ\")\n        .moveTo(r_lip, 0.0)\n\
    \        .lineTo(r_outer - p.edge_chamfer, 0.0)\n        .lineTo(r_outer, z_chamfer_bottom)\n\
    \        .lineTo(r_outer, z_groove_start)\n        .threePointArc((r_groove_bottom,\
    \ z_groove_center), (r_outer, z_groove_end))\n        .lineTo(r_outer, z_chamfer_top)\n\
    \        .lineTo(r_outer - p.edge_chamfer, z_top)\n        .lineTo(r_entry, z_top)\n\
    \        .lineTo(r_bearing, z_entry_chamfer)\n        .lineTo(r_bearing, z_lip)\n\
    \        .lineTo(r_lip, z_lip)\n        .close()\n    )\n\n    return profile.revolve()\n"
  print_orientation: Bottom face with retaining lip flat on print bed (z = 0)
  use_orientation: Vertical plane, wheel rolls horizontally along door track
- id: axle_spacer
  role: final
  material: PLA
  code: "def build(p):\n    import cadquery as cq\n\n    r_out = p.spacer_od / 2.0\n\
    \    r_in = p.spacer_id / 2.0\n\n    return (\n        cq.Workplane(\"XY\")\n\
    \        .circle(r_out)\n        .circle(r_in)\n        .extrude(p.spacer_length)\n\
    \    )\n"
  print_orientation: Flat annular face on print bed (z = 0)
  use_orientation: Sits on M8 bolt between bearing inner race and bracket ear
- id: axle_shim
  role: final
  material: PLA
  code: "def build(p):\n    import cadquery as cq\n\n    r_out = p.spacer_od / 2.0\n\
    \    r_in = p.spacer_id / 2.0\n\n    return (\n        cq.Workplane(\"XY\")\n\
    \        .circle(r_out)\n        .circle(r_in)\n        .extrude(p.shim_length)\n\
    \    )\n"
  print_orientation: Flat annular face on print bed (z = 0)
  use_orientation: Optional adjustment shim on M8 bolt for bracket spacing
