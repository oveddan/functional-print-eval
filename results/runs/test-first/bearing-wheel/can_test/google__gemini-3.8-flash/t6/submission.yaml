manual:
- n: '1'
  text: '3D print one ''roller_wheel'' (printed flat on its bottom lip face, z = 0,
    no supports needed) and two ''axle_spacer'' parts. Optionally print two ''axle_shim''
    parts if your door bracket requires additional width adjustment. Recommended print
    settings: 0.2 mm layer height, 4 perimeters/wall loops, 25-30% gyroid infill for
    high strength and rigidity.'
  parts:
  - roller_wheel
  - axle_spacer
  - axle_shim
  hardware: []
  tool: Bambu Lab X1C 3D Printer
- n: '2'
  text: Press the first 608 bearing (bearing_1) into the open top of the roller wheel
    bore. Push it down firmly until it seats squarely against the bottom internal
    retaining lip. Then take the second 608 bearing (bearing_2) and press it in right
    behind the first bearing until it rests firmly against bearing_1. Both bearings
    now sit back-to-back inside the wheel with their inner and outer rings in direct
    contact.
  parts:
  - roller_wheel
  hardware:
  - bearing_1
  - bearing_2
  tool: null
- n: '3'
  text: Slide an M8 washer onto the M8 bolt, followed by the outer ear of the door
    mounting bracket, then slide on the first printed axle spacer. Insert the bolt
    through the two 608 bearings inside the roller wheel. Slide the second printed
    axle spacer onto the protruding bolt, followed by the second bracket ear. Note
    that the axle spacers contact ONLY the inner races of the bearings, allowing the
    wheel to spin completely freely without rubbing against the bracket.
  parts:
  - roller_wheel
  - axle_spacer
  hardware:
  - axle_bolt
  - axle_washer
  tool: null
- n: '4'
  text: Add the second M8 washer and thread on the M8 nut. Tighten the nut securely.
    Because the two bearing inner races and the printed spacers are clamped directly
    together against the bracket, you can firmly tighten the bolt without binding
    the bearings. Spin the wheel by hand to verify it rotates buttery-smooth with
    zero wobble or drag.
  parts: []
  hardware:
  - axle_nut
  - axle_washer
  tool: 13 mm wrench / socket and 6 mm hex key
- n: '5'
  text: Hang or mount the door back into its track. The wheel's dual-tread design
    allows it to ride stably on a convex track rail via its central concave groove,
    or roll on its wide flat outer shoulders if running in a flat box or J-channel.
  parts:
  - roller_wheel
  hardware: []
  tool: null
