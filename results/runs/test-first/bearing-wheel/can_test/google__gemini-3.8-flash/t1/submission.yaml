parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    pts = [\n        (p.lip_hole_diameter / 2.0, 0.0),\n \
    \       (p.wheel_diameter / 2.0 - p.rim_chamfer, 0.0),\n        (p.wheel_diameter\
    \ / 2.0, p.rim_chamfer),\n        (p.wheel_diameter / 2.0, p.wheel_width - p.rim_chamfer),\n\
    \        (p.wheel_diameter / 2.0 - p.rim_chamfer, p.wheel_width),\n        (p.bearing_bore\
    \ / 2.0, p.wheel_width),\n        (p.bearing_bore / 2.0, p.retaining_lip_thickness),\n\
    \        (p.lip_hole_diameter / 2.0, p.retaining_lip_thickness),\n    ]\n    return\
    \ cq.Workplane(\"XZ\").polyline(pts).close().revolve()\n"
  print_orientation: z = 0 flat bottom face on build plate (retaining lip side down)
  use_orientation: wheel axis along M8 axle bolt
- id: outer_spacer
  role: final
  material: PLA
  code: "def build(p):\n    total_len = p.outer_spacer_flange_thickness + p.outer_spacer_neck_length\n\
    \    pts = [\n        (p.bolt_clearance_diameter / 2.0, 0.0),\n        (p.spacer_flange_diameter\
    \ / 2.0, 0.0),\n        (p.spacer_flange_diameter / 2.0, p.outer_spacer_flange_thickness),\n\
    \        (p.spacer_neck_diameter / 2.0, p.outer_spacer_flange_thickness),\n  \
    \      (p.spacer_neck_diameter / 2.0, total_len),\n        (p.bolt_clearance_diameter\
    \ / 2.0, total_len),\n    ]\n    return cq.Workplane(\"XZ\").polyline(pts).close().revolve()\n"
  print_orientation: z = 0 on build plate (flange down, neck pointing up)
  use_orientation: neck enters wheel 14mm hole to seat on bearing 1 inner race
- id: bracket_spacer
  role: final
  material: PLA
  code: "def build(p):\n    total_len = p.bracket_spacer_flange_thickness + p.bracket_spacer_neck_length\n\
    \    pts = [\n        (p.bolt_clearance_diameter / 2.0, 0.0),\n        (p.spacer_flange_diameter\
    \ / 2.0, 0.0),\n        (p.spacer_flange_diameter / 2.0, p.bracket_spacer_flange_thickness),\n\
    \        (p.spacer_neck_diameter / 2.0, p.bracket_spacer_flange_thickness),\n\
    \        (p.spacer_neck_diameter / 2.0, total_len),\n        (p.bolt_clearance_diameter\
    \ / 2.0, total_len),\n    ]\n    return cq.Workplane(\"XZ\").polyline(pts).close().revolve()\n"
  print_orientation: z = 0 on build plate (flange down, neck pointing up)
  use_orientation: neck seats on bearing 2 inner race, flange rests against door bracket
- id: bearing_fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    block = cq.Workplane(\"XY\").box(32, 32, p.bearing_width)\n\
    \    hole = cq.Workplane(\"XY\").circle(p.bearing_bore / 2.0).extrude(p.bearing_width)\n\
    \    return block.cut(hole)\n"
  print_orientation: z = 0 on build plate
  use_orientation: test press-fit of 608 bearing
