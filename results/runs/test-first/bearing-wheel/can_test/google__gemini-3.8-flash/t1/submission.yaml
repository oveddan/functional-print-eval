manual:
- n: '1'
  text: 3D print the wheel, outer spacer, and bracket spacer in PLA with 0.2 mm layer
    height. Use at least 4 wall perimeters and 40% infill for the wheel (100% infill
    for the small spacers). Every part is designed to print completely supportless
    with its flat base on the build plate.
  parts:
  - wheel
  - outer_spacer
  - bracket_spacer
  hardware: []
  tool: 3D printer
- n: '2'
  text: Take the wheel and identify the open side (the side without the internal lip).
    Press the first 608ZZ bearing into the bore until it seats firmly and flat against
    the internal 2 mm retaining lip at the bottom.
  parts:
  - wheel
  hardware:
  - bearing_1
  tool: null
- n: '3'
  text: Press the second 608ZZ bearing into the same bore right behind the first one.
    It will sit flush with the top edge of the wheel rim. Both outer races and inner
    races are now touching back-to-back.
  parts:
  - wheel
  hardware:
  - bearing_2
  tool: null
- n: '4'
  text: Turn the wheel over to the side with the 14 mm central opening. Insert the
    narrow neck of the outer spacer into the opening until its end face seats directly
    on the inner race of the first bearing. Its wider flange will hover approximately
    0.5 mm above the rotating wheel face.
  parts:
  - outer_spacer
  - wheel
  hardware: []
  tool: null
- n: '5'
  text: Place the bracket spacer against the other side of the wheel, resting its
    narrow neck against the inner race of the second bearing. This provides a 1.5
    mm clearance gap so the rotating wheel never rubs against the door bracket.
  parts:
  - bracket_spacer
  - wheel
  hardware: []
  tool: null
- n: '6'
  text: Slide the M8 bolt (ISO 4762 M8x35) through the outer spacer, through the inner
    bores of both 608 bearings, and out through the bracket spacer.
  parts:
  - bracket_spacer
  - outer_spacer
  - wheel
  hardware:
  - axle_bolt
  tool: null
- n: '7'
  text: Pass the protruding bolt shank through the closet door mounting bracket hole.
    Slide the M8 washer (ISO 7089 M8) onto the bolt threads on the back of the bracket,
    then thread on the M8 nylon-insert lock nut (ISO 10511 M8).
  parts: []
  hardware:
  - axle_nut
  - bracket_washer
  tool: 6 mm hex key, 13 mm spanner
- n: '8'
  text: Tighten the lock nut firmly. Because the bolt clamps exclusively through the
    spacers and the bearing inner races, tightening will not bind the bearings. Give
    the wheel a spin to confirm it turns completely freely, then mount the door onto
    the closet track.
  parts:
  - wheel
  hardware: []
  tool: 6 mm hex key, 13 mm spanner
