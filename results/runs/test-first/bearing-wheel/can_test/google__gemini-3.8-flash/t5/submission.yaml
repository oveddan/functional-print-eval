manual:
- n: '1'
  text: Press the first 608 bearing into the open bore of roller_wheel (the side without
    the bottom lip) until it seats flat against the internal shoulder (2 mm above
    the bottom face). Then press the second 608 bearing directly into the bore behind
    the first until it sits flush with the top face. Both bearings should be firmly
    seated against each other.
  parts:
  - roller_wheel
  hardware:
  - bearing_608
  tool: Bench vise or soft mallet with a flat wooden block
- n: '2'
  text: Slide an M8 washer onto the M8 bolt, followed by spacer_flush (the 3 mm long
    bushing). Slide the bolt through the bearings inside roller_wheel from the flush
    side. On the recessed side of the wheel, slide spacer_recess (the 5 mm long bushing)
    over the bolt shank so that it enters the 15 mm central recess and rests flat
    against the inner race of the first bearing.
  parts:
  - roller_wheel
  - spacer_flush
  - spacer_recess
  hardware:
  - axle_bolt
  - washer_m8
  tool: null
- n: '3'
  text: Insert the protruding bolt through the mounting hole on the closet door roller
    bracket. Place an M8 washer over the bolt end and thread on the M8 nylon-insert
    lock nut. Tighten the nut firmly with a wrench and hex key. The inner bearing
    races and spacers are now rigidly clamped, while the wheel spins freely with 3
    mm clearance on both sides.
  parts: []
  hardware:
  - axle_nut
  - washer_m8
  tool: 13 mm wrench and 6 mm hex key
