task: bearing-wheel
note: Replacement sliding closet door roller wheel engineered for two 608 bearings
  and an M8 bolt. Features a universal dual-profile rim (central groove for round
  rails and flat outer shoulders for flat tracks) and zero-overhang 3D-printable geometry
  with precision inner-race standoff bushings.
questions:
- text: Does your closet track have a raised round rail or a flat track?
  answer: 'The wheel has a universal dual profile: flat 3.5 mm outer shoulders that
    roll smoothly in a flat channel, plus a 9 mm wide, 1.75 mm deep central groove
    that centers on a round rail or inverted-V bead track.'
- text: What bolt length is recommended?
  answer: An M8 bolt of 35 mm to 40 mm length comfortably clamps the 16 mm wheel assembly,
    two 3 mm standoff gaps, bracket plate, washers, and lock nut.
