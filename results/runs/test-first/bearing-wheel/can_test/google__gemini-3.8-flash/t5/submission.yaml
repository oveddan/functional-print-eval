parts:
- id: bearing_fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    length = 80.0\n    width = 30.0\n    height = p.coupon_h\n\
    \    res = (\n        cq.Workplane(\"XY\")\n        .box(length, width, height,\
    \ centered=(True, True, False))\n    )\n    res = res.faces(\">Z\").workplane().pushPoints([(-25,\
    \ 0)]).hole(p.bearing_hole_d_nom)\n    res = res.faces(\">Z\").workplane().pushPoints([(0,\
    \ 0)]).hole(p.bearing_hole_d_tight)\n    res = res.faces(\">Z\").workplane().pushPoints([(25,\
    \ 0)]).hole(p.bearing_hole_d_loose)\n    return res\n"
  print_orientation: Bottom face flat on bed, z=0 to z=7
  use_orientation: Flat on desk
- id: roller_wheel
  role: final
  material: PLA
  code: "def build(p):\n    # Roller wheel with dual-profile rim and zero-overhang\
    \ internal bearing seat\n    r_out = p.wheel_od / 2.0\n    r_grv = p.wheel_groove_d\
    \ / 2.0\n    r_bore = p.bearing_bore_d / 2.0\n    r_shld = p.shoulder_bore_d /\
    \ 2.0\n    w = p.wheel_width\n    sw = p.wheel_shoulder_w\n    st = p.shoulder_t\n\
    \    chamf = 0.5\n\n    # 2D cross-section profile (X = radius, Y = height Z)\n\
    \    pts = [\n        (r_shld, 0.0),\n        (r_out - chamf, 0.0),\n        (r_out,\
    \ chamf),\n        (r_out, sw),\n        (r_grv, w / 2.0),\n        (r_out, w\
    \ - sw),\n        (r_out, w - chamf),\n        (r_out - chamf, w),\n        (r_bore\
    \ + chamf, w),\n        (r_bore, w - chamf),\n        (r_bore, st),\n        (r_shld,\
    \ st),\n    ]\n\n    wheel = (\n        cq.Workplane(\"XZ\")\n        .polyline(pts)\n\
    \        .close()\n        .revolve(360, (0, 0), (0, 1))\n    )\n    return wheel\n"
  print_orientation: Bottom lip face on bed at z=0, open bearing pocket facing up
    at z=16. Prints without supports.
  use_orientation: Axle horizontal through center bore, rolling vertically on door
    track.
- id: spacer_recess
  role: final
  material: PLA
  code: "def build(p):\n    # Bushing spacer for the recessed side of the roller wheel\n\
    \    r_in = p.spacer_id / 2.0\n    r_out = p.spacer_od / 2.0\n    h = p.spacer_recess_len\n\
    \n    spacer = (\n        cq.Workplane(\"XY\")\n        .circle(r_out)\n     \
    \   .circle(r_in)\n        .extrude(h)\n    )\n    return spacer\n"
  print_orientation: Flat end on bed at z=0, extruding vertically to z=5.
  use_orientation: Slid onto M8 bolt shank between bearing inner race and mounting
    bracket.
- id: spacer_flush
  role: final
  material: PLA
  code: "def build(p):\n    # Bushing spacer for the flush side of the roller wheel\n\
    \    r_in = p.spacer_id / 2.0\n    r_out = p.spacer_od / 2.0\n    h = p.spacer_flush_len\n\
    \n    spacer = (\n        cq.Workplane(\"XY\")\n        .circle(r_out)\n     \
    \   .circle(r_in)\n        .extrude(h)\n    )\n    return spacer\n"
  print_orientation: Flat end on bed at z=0, extruding vertically to z=3.
  use_orientation: Slid onto M8 bolt shank between bearing inner race and bolt head/washer.
