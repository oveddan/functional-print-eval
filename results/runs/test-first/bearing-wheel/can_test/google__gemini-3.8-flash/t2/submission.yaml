task: bearing-wheel
note: Replacement 50 mm x 16 mm sliding closet door roller wheel using two 608 skateboard
  bearings and an M8 axle bolt. Prints without supports.
questions: []
params:
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: Standard 608 bearing inner bore
  chamfer_w:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Chamfer width on top rim corner
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: catalog
    note: Standard 608 bearing nominal OD
  spacer_id:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: Inner bore of axle standoff spacer
  coupon_h:
    value: 10
    unit: mm
    kind: design
    source: design
    note: Height of test coupon
  axle_clearance_d:
    value: 18
    unit: mm
    kind: design
    source: design
    note: Through-hole diameter through the bottom shoulder
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: User stated broken wheel width (~16 mm)
  groove_bottom_z1:
    value: 6
    unit: mm
    kind: design
    source: design
    note: Z height where flat groove root begins
  pocket_depth:
    value: 7
    unit: mm
    kind: design
    source: design
    note: Depth of single bearing pocket in test coupon
  bolt_clearance_d:
    value: 8.5
    unit: mm
    kind: design
    source: design
    note: Coupon center hole diameter
  groove_bottom_z2:
    value: 10
    unit: mm
    kind: design
    source: design
    note: Z height where flat groove root ends
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: User stated broken wheel diameter (~50 mm)
  groove_depth:
    value: 2
    unit: mm
    kind: design
    source: design
    note: Depth of concave track-guiding center groove
  groove_end_z:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Z height where upper groove slope ends
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: Measured M8 bolt shank diameter
  shoulder_t:
    value: 2
    unit: mm
    kind: design
    source: design
    note: Thickness of bottom retaining shoulder (16mm wheel - 2x7mm bearings = 2mm)
  spacer_od:
    value: 11.5
    unit: mm
    kind: design
    source: design
    note: Outer diameter of standoff spacer, presses inner ring only
  spacer_length:
    value: 3
    unit: mm
    kind: design
    source: design
    note: Length of standoff spacer
  shoulder_inner_d:
    value: 18
    unit: mm
    kind: design
    source: design
    note: Inner diameter of bottom retaining shoulder, clears bearing shield and inner
      ring
  coupon_od:
    value: 30
    unit: mm
    kind: design
    source: design
    note: Outer diameter of test coupon
  groove_start_z:
    value: 4
    unit: mm
    kind: design
    source: design
    note: Z height where lower groove slope begins
  bearing_pocket_d:
    value: 22.1
    unit: mm
    kind: design
    source: design
    note: Snug press fit pocket bore for 608 bearings, confirmed via coupon test
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: catalog
    note: Standard 608 bearing nominal width
parts:
- id: coupon_bearing_fit
  role: coupon
  material: PLA
  code: "def build(p):\n    # Test coupon to verify 608 bearing snug press fit\n \
    \   pts = [\n        (p.bolt_clearance_d / 2.0, 0),\n        (p.coupon_od / 2.0,\
    \ 0),\n        (p.coupon_od / 2.0, p.coupon_h),\n        (p.bearing_pocket_d /\
    \ 2.0, p.coupon_h),\n        (p.bearing_pocket_d / 2.0, p.coupon_h - p.pocket_depth),\n\
    \        (p.bolt_clearance_d / 2.0, p.coupon_h - p.pocket_depth),\n    ]\n   \
    \ return cq.Workplane(\"XZ\").polyline(pts).close().revolve()\n"
  print_orientation: bottom face (z=0) on bed
  use_orientation: vertical axis
- id: roller_wheel
  role: final
  material: PLA
  code: "def build(p):\n    # Roller wheel: 50 mm OD, 16 mm width, dual 608 bearing\
    \ housing with 2 mm bottom shoulder\n    # Revolved polyline cross-section in\
    \ XZ plane for 100% support-free printing\n    pts = [\n        (p.shoulder_inner_d\
    \ / 2.0, 0),\n        (p.wheel_od / 2.0, 0),\n        (p.wheel_od / 2.0, p.groove_start_z),\n\
    \        ((p.wheel_od / 2.0) - p.groove_depth, p.groove_bottom_z1),\n        ((p.wheel_od\
    \ / 2.0) - p.groove_depth, p.groove_bottom_z2),\n        (p.wheel_od / 2.0, p.groove_end_z),\n\
    \        (p.wheel_od / 2.0, p.wheel_w - p.chamfer_w),\n        ((p.wheel_od /\
    \ 2.0) - p.chamfer_w, p.wheel_w),\n        (p.bearing_pocket_d / 2.0, p.wheel_w),\n\
    \        (p.bearing_pocket_d / 2.0, p.shoulder_t),\n        (p.shoulder_inner_d\
    \ / 2.0, p.shoulder_t),\n    ]\n    return cq.Workplane(\"XZ\").polyline(pts).close().revolve()\n"
  print_orientation: bottom face (z=0) on bed
  use_orientation: wheel axis horizontal on M8 bolt
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    # Axle standoff spacer: clamps 608 inner ring while clearing\
    \ outer ring/shield and bracket\n    return (\n        cq.Workplane(\"XY\")\n\
    \        .circle(p.spacer_od / 2.0)\n        .circle(p.spacer_id / 2.0)\n    \
    \    .extrude(p.spacer_length)\n    )\n"
  print_orientation: flat on bed (z=0)
  use_orientation: between bearing inner ring and bracket on M8 bolt
hardware:
- id: bearing_1
  ref: 608ZZ
  qty: 1
- id: bearing_2
  ref: 608ZZ
  qty: 1
- id: axle_bolt
  ref: ISO 4762 M8x35
  qty: 1
- id: axle_nut
  ref: ISO 4032 M8
  qty: 1
joints:
- id: wheel_axle_joint
  fastener: axle_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: roller_wheel
    feature: bearing_pocket
    role: clearance
  - part: spacer
    feature: bore
    role: clearance
  nut: axle_nut
  external: null
criteria:
- id: bearing_fit
  part: roller_wheel
  feature: bearing_pocket
  relation: seats
  hardware: bearing_1
  clearance_mm: 0.1
  params:
  - bearing_pocket_d
  - bearing_od
  check:
    method: coupon
    ref: coupon_bearing_fit
    description: Push 608 bearing into test coupon to verify snug press fit
- id: axle_clearance
  part: spacer
  feature: bore
  relation: clears
  hardware: axle_bolt
  clearance_mm: 0.4
  params:
  - spacer_id
  - bolt_d
  check:
    method: none
    ref: null
    description: Ensure M8 bolt slides smoothly through spacer bore
- id: wheel_width_match
  part: roller_wheel
  feature: body
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - wheel_w
  check:
    method: none
    ref: null
    description: Wheel body matches original 16 mm thickness for closet track and
      bracket alignment
manual:
- n: '1'
  text: 'Optional: print coupon_bearing_fit to verify the snugness of your 608 bearing
    fit before printing the full wheel.'
  parts:
  - coupon_bearing_fit
  hardware: []
  tool: null
- n: '2'
  text: Print 1 copy of roller_wheel and 2 copies of spacer. Print both flat on the
    bed (z=0) without supports.
  parts:
  - roller_wheel
  - spacer
  hardware: []
  tool: null
- n: '3'
  text: Insert the first 608 bearing into the 22.1 mm bore of the roller_wheel from
    the open top face, pushing it all the way down until it seats squarely against
    the bottom internal retaining shoulder.
  parts:
  - roller_wheel
  hardware:
  - bearing_1
  tool: arbor press, vice, or firm hand pressure
- n: '4'
  text: Insert the second 608 bearing into the bore right behind the first bearing,
    pushing it in until it rests firmly against the first bearing and sits flush with
    the top wheel face.
  parts:
  - roller_wheel
  hardware:
  - bearing_2
  tool: arbor press, vice, or firm hand pressure
- n: '5'
  text: Slide one 3D-printed spacer onto the M8 bolt. Insert the bolt through the
    two bearings in the roller wheel. Place the second spacer on the bolt on the opposite
    side.
  parts:
  - roller_wheel
  - spacer
  hardware:
  - bearing_1
  - bearing_2
  - axle_bolt
  - axle_nut
  tool: null
- n: '6'
  text: Mount the assembled roller wheel onto your closet door bracket using the M8
    bolt and tighten the M8 nut. The spacers clamp against the bearing inner rings,
    ensuring the 50 mm wheel spins completely freely without rubbing the bracket.
    Place the wheel back on the closet track.
  parts:
  - roller_wheel
  - spacer
  hardware:
  - axle_bolt
  - axle_nut
  tool: hex key and wrench
