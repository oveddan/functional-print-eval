task: bearing-wheel
note: Flat rim with 1 mm chamfers. The rim profile wasn't measured, so if the track
  needs a groove, this design needs changing. The bracket gap wasn't measured either,
  so the side spacers are a guess.
questions: []
params:
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: 608 OD, re-measured square
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: ''
  seat_clear:
    value: 0.3
    unit: mm
    kind: design
    source: measured
    note: 'from coupon: +0.30 presses in and holds; +0.00 won''t go in'
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_clear:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: ''
  inner_race_od:
    value: 12
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 inner race land ~12 mm; spacers stay under it so they only touch the
      inner race
  lip_id:
    value: 19
    unit: mm
    kind: design
    source: design
    note: centre lip touches only the outer race (19 to 22 mm)
  wheel_d:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel 'about 50 mm'
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel 'about 16 mm'
  rim_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
  spacer_od:
    value: 11
    unit: mm
    kind: design
    source: design
    note: ''
  side_spacer_l:
    value: 1.5
    unit: mm
    kind: world
    source: guessed
    note: bracket inside gap not measured; trim or sand to fit
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    d = p.bearing_od + p.seat_clear\n    w = cq.Workplane('XY').circle(p.wheel_d/2).extrude(p.wheel_w)\n\
    \    w = w.edges('%CIRCLE').chamfer(p.rim_chamfer)\n    w = w.cut(cq.Workplane('XY').circle(p.lip_id/2).extrude(p.wheel_w))\n\
    \    w = w.cut(cq.Workplane('XY').circle(d/2).extrude(p.bearing_w))\n    w = w.cut(cq.Workplane('XY').workplane(offset=p.wheel_w\
    \ - p.bearing_w).circle(d/2).extrude(p.bearing_w))\n    return w\n"
  print_orientation: flat face on bed, axle vertical
  use_orientation: axle horizontal in the door bracket
- id: centre_spacer
  role: final
  material: PLA
  code: "def build(p):\n    l = p.wheel_w - 2*p.bearing_w\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.bolt_d\
    \ + p.bolt_clear)/2).extrude(l)\n"
  print_orientation: flat end on bed
  use_orientation: on the bolt between the two bearing inner races
- id: side_spacers
  role: final
  material: PLA
  code: "def build(p):\n    a = cq.Workplane('XY').circle(p.spacer_od/2).circle((p.bolt_d\
    \ + p.bolt_clear)/2).extrude(p.side_spacer_l)\n    b = cq.Workplane('XY').center(p.spacer_od\
    \ + 4, 0).circle(p.spacer_od/2).circle((p.bolt_d + p.bolt_clear)/2).extrude(p.side_spacer_l)\n\
    \    return a.union(b)\n"
  print_orientation: flat ends on bed (two spacers in one print)
  use_orientation: on the bolt between each bearing inner race and the bracket
hardware:
- id: bolt
  ref: ISO 4762 M8x30
  qty: 1
- id: locknut
  ref: ISO 10511 M8
  qty: 1
- id: washer
  ref: ISO 7089 M8
  qty: 2
joints:
- id: axle
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - -8.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: side_spacers
    feature: bore
    role: clearance
  - part: centre_spacer
    feature: bore
    role: clearance
  nut: locknut
  external: door roller bracket axle holes (8 mm)
criteria:
- id: seat_fit
  part: wheel
  feature: bearing seats
  relation: contains
  hardware: null
  clearance_mm: null
  params:
  - bearing_od
  - seat_clear
  - bearing_w
  check:
    method: coupon
    ref: fit_coupon_22_30
    description: bearing presses in and holds upside down
- id: lip_outer_race
  part: wheel
  feature: centre lip
  relation: supports
  hardware: null
  clearance_mm: 3.5
  params:
  - lip_id
  - inner_race_od
  check:
    method: none
    ref: null
    description: lip bore 19 clears the inner race so the race spins free
- id: wheel_size
  part: wheel
  feature: rim
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - wheel_d
  - wheel_w
  check:
    method: measure
    ref: null
    description: compare to the broken wheel and fit in the bracket
- id: gap_fit
  part: side_spacers
  feature: length
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - side_spacer_l
  - wheel_w
  check:
    method: measure
    ref: null
    description: wheel + spacers must slide into the bracket gap; sand spacers or
      leave one out
manual:
- n: '1'
  text: Print the wheel flat, with 4 walls and 40% infill. Print the centre spacer
    and the side spacers too. No supports are needed.
  parts:
  - wheel
  - centre_spacer
  - side_spacers
  hardware: []
  tool: null
- n: '2'
  text: Press one 608 bearing into one face of the wheel until it sits on the centre
    lip. Push on the outer race only, for example with a socket or a flat block in
    a vise.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '3'
  text: Drop the centre spacer into the bore so it rests on that bearing's inner race.
    Then press the second bearing into the other face.
  parts:
  - centre_spacer
  - wheel
  hardware: []
  tool: null
- n: '4'
  text: Put the wheel into the bracket with a side spacer on each side. If the stack
    is too wide, sand the spacers down or leave one out. If it's loose, add an M8
    washer.
  parts:
  - side_spacers
  - wheel
  hardware:
  - washer
  tool: null
- n: '5'
  text: 'Push the M8 bolt through the bracket, the spacers and both bearings, then
    fit a washer and the lock nut. Tighten just until it''s snug: the wheel must still
    spin freely. If you use your own M8 bolt, it just has to be long enough for the
    nut to fully engage.'
  parts: []
  hardware:
  - bolt
  - washer
  - locknut
  tool: 6 mm hex key + 13 mm spanner
