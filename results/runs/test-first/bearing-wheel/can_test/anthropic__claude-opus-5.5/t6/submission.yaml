task: bearing-wheel
note: Wheel is 50 mm across. The body is 15 mm wide, and with the bearings standing
  out it's 16 mm, the same as the old wheel. The running surface is flat with 1 mm
  chamfers, since you couldn't check the rim profile. If your track needs a groove,
  tell me.
questions:
- text: Does the old wheel have a groove or V in the rim for a track, or is it flat?
  answer: null
- text: How thick are the bracket plates? M8x35 assumes each plate is about 3 mm or
    less; you need at least 2 threads showing past the lock nut. If your own M8 bolt
    is a good length, use that instead.
  answer: null
params:
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: flat jaws
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bearing_seat_d:
    value: 22.3
    unit: mm
    kind: design
    source: design
    note: 'coupon: 22.3 seat goes in, holds upside down; 22.0 won''t go in'
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel ~50 mm
  wheel_w:
    value: 15
    unit: mm
    kind: design
    source: design
    note: body 1 mm narrower than old 16 mm wheel so each bearing stands 0.5 mm proud
      and only the inner races touch the bracket
  lip_t:
    value: 2
    unit: mm
    kind: design
    source: design
    note: ''
  lip_bore_d:
    value: 17
    unit: mm
    kind: design
    source: design
    note: clears inner race and shields, supports outer race only
  rim_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ''
parts:
- id: roller_wheel
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    pocket = (p.wheel_w - p.lip_t) / 2\n    w = (cq.Workplane('XY').circle(p.wheel_od/2).extrude(p.wheel_w)\n\
    \         .faces('>Z').edges().chamfer(p.rim_chamfer)\n         .faces('<Z').edges().chamfer(p.rim_chamfer))\n\
    \    w = w.cut(cq.Workplane('XY').circle(p.bearing_seat_d/2).extrude(pocket))\n\
    \    w = w.cut(cq.Workplane('XY').workplane(offset=p.wheel_w - pocket).circle(p.bearing_seat_d/2).extrude(pocket))\n\
    \    w = w.cut(cq.Workplane('XY').circle(p.lip_bore_d/2).extrude(p.wheel_w))\n\
    \    return w"
  print_orientation: flat face down, axle along z
  use_orientation: axle horizontal, rim rolling on the track
hardware:
- id: bearing
  ref: 608ZZ
  qty: 2
- id: bolt
  ref: ISO 4762 M8x35
  qty: 1
- id: nut
  ref: ISO 10511 M8
  qty: 1
- id: washer
  ref: ISO 7089 M8
  qty: 1
joints:
- id: axle
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - -4.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: roller_wheel
    feature: bore through both 608 bearings
    role: clearance
  nut: nut
  external: door roller bracket (both side plates, 8 mm holes)
criteria:
- id: bearing_press
  part: roller_wheel
  feature: bearing seats
  relation: seats
  hardware: bearing
  clearance_mm: null
  params:
  - bearing_seat_d
  - bearing_od
  check:
    method: coupon
    ref: bearing_fit_coupon
    description: 22.3 seat pressed in and held upside down
- id: races_proud
  part: roller_wheel
  feature: faces
  relation: clears
  hardware: null
  clearance_mm: 0.5
  params:
  - wheel_w
  - bearing_w
  - lip_t
  check:
    method: measure
    ref: null
    description: after pressing, each bearing face stands ~0.5 mm above the wheel
      face
manual:
- n: '1'
  text: Print roller_wheel lying flat, without supports. The ring step in the middle
    prints as a short 22 mm bridge, which is fine.
  parts:
  - roller_wheel
  hardware: []
  tool: null
- n: '2'
  text: Press a 608 bearing into each side until it stops against the middle step.
    Use a vise or a flat board, pushing only on the bearing's outer ring. Each bearing
    should stand about 0.5 mm above the wheel face.
  parts:
  - roller_wheel
  hardware:
  - bearing
  tool: vise or flat board
- n: '3'
  text: Put the wheel between the bracket plates. Push the M8 bolt through the bracket
    and both bearings, add the washer, then screw on the lock nut. Tighten until it's
    snug and the wheel still spins freely. The bolt only presses on the bearings'
    inner rings.
  parts:
  - roller_wheel
  hardware:
  - bolt
  - washer
  - nut
  tool: 6 mm hex key, 13 mm spanner
