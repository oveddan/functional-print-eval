task: bearing-wheel
note: The rolling face is flat with 1 mm chamfers because the old wheel's tread profile
  couldn't be measured. If the track is a raised rail that needs a groove, say so
  and I'll change it. M8x40 is a guess, since the bracket gap wasn't measured. The
  bolt you already have will work too if it's long enough to go through the whole
  stack and fully engage the lock nut.
questions: []
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel 'about 50 mm across'
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel 'about 16 mm wide'
  brg_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: ''
  brg_w:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: ''
  brg_fit:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: 'coupon: +0.3 pressed in snug and held upside down; +0 would not go in'
  shoulder_r:
    value: 9.15
    unit: mm
    kind: design
    source: design
    note: rests on outer race only, clears inner race (~12 mm OD)
  edge_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
  foot_chamfer:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: elephant-foot relief at bed
  bolt_clear_d:
    value: 8.4
    unit: mm
    kind: hardware
    source: catalog
    note: M8 clearance
  inner_race_od:
    value: 11
    unit: mm
    kind: hardware
    source: guessed
    note: spacer kept below 608 inner race land (~12 mm)
  spacer_len:
    value: 2
    unit: mm
    kind: design
    source: design
    note: = wheel_w - 2*brg_w, so inner races are spaced exactly
  standoff_t:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    rb = (p.brg_od + p.brg_fit) / 2\n    w = cq.Workplane('XY').circle(p.wheel_od/2).extrude(p.wheel_w)\n\
    \    w = w.faces('>Z or <Z').edges().chamfer(p.edge_chamfer)\n    lower = cq.Workplane('XY').circle(rb).extrude(p.brg_w)\n\
    \    foot = (cq.Workplane('XY').circle(rb + p.foot_chamfer)\n            .workplane(offset=p.foot_chamfer).circle(rb).loft())\n\
    \    cone = (cq.Workplane('XY').workplane(offset=p.brg_w).circle(rb)\n       \
    \     .workplane(offset=rb - p.shoulder_r).circle(p.shoulder_r).loft())\n    thru\
    \ = cq.Workplane('XY').circle(p.shoulder_r).extrude(p.wheel_w)\n    upper = (cq.Workplane('XY').workplane(offset=p.wheel_w\
    \ - p.brg_w)\n             .circle(rb).extrude(p.brg_w))\n    return w.cut(lower).cut(foot).cut(cone).cut(thru).cut(upper)\n"
  print_orientation: flat face down, axis vertical
  use_orientation: axis horizontal on the bolt
- id: inner_spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.inner_race_od/2).circle(p.bolt_clear_d/2).extrude(p.spacer_len)\n"
  print_orientation: flat
  use_orientation: on the bolt between the two bearings' inner races
- id: standoff
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.inner_race_od/2).circle(p.bolt_clear_d/2).extrude(p.standoff_t)\n"
  print_orientation: flat
  use_orientation: on the bolt between each bearing's inner race and the bracket;
    print 2 (more if the bracket gap is wide)
hardware:
- id: bolt
  ref: ISO 4762 M8x40
  qty: 1
- id: locknut
  ref: ISO 10511 M8
  qty: 1
- id: washer
  ref: ISO 7089 M8
  qty: 2
joints: []
criteria:
- id: brg_press
  part: wheel
  feature: bearing seats
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - brg_od
  - brg_fit
  check:
    method: coupon
    ref: bore_fit_coupon
    description: 22.3 seat held bearing upside down
- id: races_free
  part: inner_spacer
  feature: length
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - spacer_len
  - wheel_w
  - brg_w
  check:
    method: measure
    ref: null
    description: after tightening, wheel still spins freely
manual:
- n: '1'
  text: Print the wheel flat, plus 1 inner_spacer and 2 standoffs. No supports. Use
    4+ walls and 40% infill on the wheel.
  parts:
  - wheel
  - inner_spacer
  - standoff
  hardware: []
  tool: null
- n: '2'
  text: Press one 608 bearing straight into the wheel from one side until it stops
    on the inner ledge and sits flush with the face. Use a vise or press it against
    a flat surface. Push only on the outer ring.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '3'
  text: Flip the wheel over. Drop the inner_spacer into the middle so it rests on
    the first bearing's inner ring, then press in the second bearing until it's flush.
  parts:
  - wheel
  - inner_spacer
  hardware: []
  tool: null
- n: '4'
  text: Push the bolt through a washer and the first bracket wall, then a standoff,
    the wheel, the second standoff, the second bracket wall, a washer, and finally
    the lock nut. If the gap in the bracket is wider than about 18 mm, print and add
    more standoffs until it's filled. If it's a single plate, put both standoffs on
    the plate side.
  parts:
  - standoff
  - wheel
  hardware:
  - bolt
  - washer
  - locknut
  tool: null
- n: '5'
  text: Tighten the lock nut snug with a 6 mm hex key and a 13 mm wrench. The wheel
    should still spin freely. If it drags, back the nut off a little.
  parts: []
  hardware:
  - bolt
  - locknut
  tool: 6 mm hex key, 13 mm wrench
