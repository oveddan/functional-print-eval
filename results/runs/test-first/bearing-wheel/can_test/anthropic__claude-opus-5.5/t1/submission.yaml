task: bearing-wheel
note: Rim is flat with 1 mm chamfers because the track profile couldn't be checked.
  If the old wheel had a groove for a raised rail, tell me and I'll change the rim
  profile. The wheel is 50 mm across. The rim is 15 mm wide, a little under the old
  16. Bearings are press-fit at 22.3 mm, chosen from the coupon. The wheel is printed
  as two halves so nothing hangs over the bearing pockets. The coupon's pocket roof
  printed badly, and the split avoids that. You can use your own M8 bolt instead of
  the M8x35 if it's 30–40 mm long.
questions:
- text: Does the door track have a raised rail or ridge, or is it a flat channel?
    This decides whether the rim needs a groove.
  answer: null
- text: What's the inside gap between the bracket walls?
  answer: null
params:
  wheel_d:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel 'about 50 mm across'
  bearing_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: measured
    note: re-measured flat ~22; 608 nominal 22.000
  bearing_w:
    value: 7.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 nominal width
  bearing_inner_ring_od:
    value: 12.1
    unit: mm
    kind: hardware
    source: datasheet
    note: approx; spacers kept below this so they only touch the inner ring
  pocket_d:
    value: 22.3
    unit: mm
    kind: design
    source: design
    note: 'coupon: 22.29 seat goes in, holds upside down; 21.99 would not go in'
  web_floor:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: shoulder per half under each bearing's outer ring
  web_hole_d:
    value: 16.0
    unit: mm
    kind: design
    source: design
    note: clears inner ring + race spacer, shoulders the outer ring
  collar_wall:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: ''
  face_recess:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: wheel faces sit below bearing faces so they don't rub the bracket
  rim_chamfer:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: ''
  m3_bolt_r:
    value: 18.0
    unit: mm
    kind: design
    source: design
    note: ''
  m3_clear:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: ''
  cb_d:
    value: 6.2
    unit: mm
    kind: design
    source: design
    note: M3 head 5.5 + clearance
  cb_depth:
    value: 3.3
    unit: mm
    kind: design
    source: design
    note: M3 head_h 3 + 0.3
  insert_hole_d:
    value: 4.3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  insert_hole_depth:
    value: 6.5
    unit: mm
    kind: design
    source: design
    note: 4 mm insert + room for M3x10 tip
  axle_clear_d:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: M8 bolt, measured ~8 shank
  spacer_od:
    value: 11.0
    unit: mm
    kind: design
    source: design
    note: ''
  shim_t:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: optional side shims, inner ring only
parts:
- id: wheel_half_A
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    R = p.wheel_d/2; f = p.web_floor; top = f\
    \ + p.bearing_w\n    rp = p.pocket_d/2; rc = rp + p.collar_wall; rt = top - p.face_recess;\
    \ c = p.rim_chamfer\n    pts = [(p.web_hole_d/2,0),(R,0),(R,rt-c),(R-c,rt),(rc,rt),(rc,top),(rp,top),(rp,f),(p.web_hole_d/2,f)]\n\
    \    w = cq.Workplane('XZ').polyline(pts).close().revolve(360,(0,0,0),(0,1,0))\n\
    \    for i in range(3):\n        a = math.radians(120*i + 30)\n        x, y =\
    \ p.m3_bolt_r*math.cos(a), p.m3_bolt_r*math.sin(a)\n        w = w.cut(cq.Workplane('XY').center(x,y).circle(p.m3_clear/2).extrude(top+1))\n\
    \        w = w.cut(cq.Workplane('XY').workplane(offset=rt-p.cb_depth).center(x,y).circle(p.cb_d/2).extrude(10))\n\
    \    return w"
  print_orientation: mating (flat) face on the bed, bearing pocket opening upward;
    no overhangs
  use_orientation: one side of the wheel, axis horizontal, M3 screw heads on the outside
    face
- id: wheel_half_B
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    R = p.wheel_d/2; f = p.web_floor; top = f\
    \ + p.bearing_w\n    rp = p.pocket_d/2; rc = rp + p.collar_wall; rt = top - p.face_recess;\
    \ c = p.rim_chamfer\n    pts = [(p.web_hole_d/2,0),(R,0),(R,rt-c),(R-c,rt),(rc,rt),(rc,top),(rp,top),(rp,f),(p.web_hole_d/2,f)]\n\
    \    w = cq.Workplane('XZ').polyline(pts).close().revolve(360,(0,0,0),(0,1,0))\n\
    \    for i in range(3):\n        a = math.radians(-(120*i + 30))\n        x, y\
    \ = p.m3_bolt_r*math.cos(a), p.m3_bolt_r*math.sin(a)\n        w = w.cut(cq.Workplane('XY').center(x,y).circle(p.insert_hole_d/2).extrude(p.insert_hole_depth))\n\
    \    return w"
  print_orientation: mating (flat) face on the bed, bearing pocket opening upward;
    insert holes open on the bed face
  use_orientation: other side of the wheel, mating face against half A
- id: race_spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.axle_clear_d/2).extrude(2*p.web_floor)"
  print_orientation: flat ring on bed
  use_orientation: on the bolt between the two bearings' inner rings
- id: side_shims
  role: final
  material: PLA
  code: "def build(p):\n    r = cq.Workplane('XY').circle(p.spacer_od/2).circle(p.axle_clear_d/2).extrude(p.shim_t)\n\
    \    return r.union(r.translate((p.spacer_od+4,0,0)))"
  print_orientation: two flat rings on bed
  use_orientation: optional, one each side between bearing inner ring and bracket
hardware:
- id: axle
  ref: ISO 4762 M8x35
  qty: 1
- id: axle_nut
  ref: ISO 10511 M8
  qty: 1
- id: axle_washer
  ref: ISO 7089 M8
  qty: 1
- id: m3_screw
  ref: ISO 4762 M3x10
  qty: 3
- id: m3_insert
  ref: insert M3x4x5
  qty: 3
joints:
- id: half_clamp
  fastener: m3_screw
  axis_origin:
  - 15.59
  - 9.0
  - 4.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: wheel_half_A
    feature: counterbore
    role: head_seat
  - part: wheel_half_A
    feature: m3 clearance hole
    role: clearance
  - part: wheel_half_B
    feature: insert hole
    role: insert
  nut: null
  external: null
- id: axle_joint
  fastener: axle
  axis_origin:
  - 0.0
  - 0.0
  - 12.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: side_shims
    feature: bore
    role: washer
  - part: wheel_half_A
    feature: web hole
    role: clearance
  - part: race_spacer
    feature: bore
    role: clearance
  - part: wheel_half_B
    feature: web hole
    role: clearance
  nut: axle_nut
  external: door roller bracket axle holes
criteria:
- id: bearing_seat
  part: wheel_half_A
  feature: bearing pocket
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - pocket_d
  - bearing_od
  check:
    method: coupon
    ref: fit_coupon
    description: 22.29 seat from the coupon pressed in and held upside down
- id: bracket_fit
  part: wheel_half_A
  feature: overall width
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - bearing_w
  - web_floor
  - shim_t
  check:
    method: measure
    ref: null
    description: Bearing stack is 15.6 mm (16.8 with shims). Check that it fits between
      the bracket walls; leave the shims out if it's tight
manual:
- n: '1'
  text: Print wheel_half_A, wheel_half_B, race_spacer and side_shims in PLA, flat
    side down, no supports. Use 4+ walls and 40%+ infill on the halves.
  parts:
  - wheel_half_A
  - wheel_half_B
  - race_spacer
  - side_shims
  hardware: []
  tool: null
- n: '2'
  text: Heat-set the 3 M3 inserts into the holes on the flat face of wheel_half_B
    until they sit flush.
  parts:
  - wheel_half_B
  hardware:
  - m3_insert
  tool: soldering iron with insert tip
- n: '3'
  text: Press one 608 bearing into each half's pocket until it sits on the floor.
    Use a vise or press on the outer ring only. It should go in firmly, like the 22.29
    coupon ring did.
  parts:
  - wheel_half_A
  - wheel_half_B
  hardware: []
  tool: null
- n: '4'
  text: Put the flat faces together with the screw holes lined up. Fit the race_spacer
    through the centre hole so it sits between the two inner rings. Screw the halves
    together with the 3 M3x10 screws, tightening them evenly.
  parts:
  - wheel_half_A
  - wheel_half_B
  - race_spacer
  hardware:
  - m3_screw
  - m3_insert
  tool: 2.5 mm hex key
- n: '5'
  text: 'Set the wheel in the bracket. If there''s room, slip a side shim between
    each bearing and the bracket wall. Push the M8x35 bolt through the bracket, shims,
    bearings and spacer, then add the washer and lock nut on the outside. Tighten
    until it''s snug and stop: the wheel must still spin freely.'
  parts:
  - side_shims
  hardware:
  - axle
  - axle_washer
  - axle_nut
  tool: 6 mm hex key + 13 mm spanner
