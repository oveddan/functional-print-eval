manual:
- n: '1'
  text: Print the wheel flat on the bed and the sleeve standing on end. No supports
    needed.
  parts:
  - wheel
  - sleeve
  hardware: []
  tool: null
- n: '2'
  text: Drop the sleeve into the centre hole of the wheel.
  parts:
  - wheel
  - sleeve
  hardware: []
  tool: null
- n: '3'
  text: Press one 608 bearing into each side of the wheel until it bottoms on the
    centre web. Press it in squarely with your thumbs or a vise using the flat of
    a board. Don't hammer on the inner race.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '4'
  text: Slide the M8 bolt through a washer, then through the first bearing, the sleeve
    and the second bearing, then a second washer. Each washer should touch only the
    inner race of its bearing.
  parts: []
  hardware:
  - bolt
  - washer
  - bearing
  tool: null
- n: '5'
  text: Mount the assembly in the door bracket and tighten the nut. The wheel should
    spin freely. If it drags, check that the washers aren't touching the outer race
    or the wheel face. The wheel plus both washers is about 19 mm wide, so check it
    fits the bracket gap.
  parts: []
  hardware:
  - nut
  - bolt
  tool: null
