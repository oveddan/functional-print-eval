manual:
- n: '1'
  text: Print 1 wheel and 2 spacers in PLA, no supports. Check the bearing seats are
    clean (no elephant-foot lip on the bed-side seat; scrape it off if needed).
  parts:
  - wheel
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Press one 608 bearing squarely into each seat, from both faces of the wheel,
    until it hits the web. Use a vise or a flat board and a light tap. Each bearing
    ends up 0.2 mm below the wheel face. The seat is sized to hold the bearing by
    friction.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '3'
  text: Check the wheel spins freely on your finger. If it feels rough, one bearing
    is probably cocked, so press it flatter.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '4'
  text: Thread the bolt through the bracket arm, then a spacer, then the wheel (through
    both bearings), then the second spacer, then the other bracket arm. Each spacer
    should touch only the bearing's inner race.
  parts:
  - wheel
  - spacer
  hardware:
  - bolt
  tool: null
- n: '5'
  text: Fit the lock nut and tighten until the bracket arms grip the spacers. The
    wheel should still spin freely. Do not over-tighten, because PLA spacers will
    crush.
  parts: []
  hardware:
  - locknut
  tool: null
