- id: c2
  part: spacer
  feature: bore
  relation: clears
  hardware: bolt
  clearance_mm: 0.2
  params:
  - bolt_d
  - bolt_clear
  check:
    method: measure
    ref: null
    description: Bolt slides through freely.
- id: c3
  part: collar
  feature: bore
  relation: clears
  hardware: bolt
  clearance_mm: 0.2
  params:
  - bolt_d
  - bolt_clear
  check:
    method: measure
    ref: null
    description: Bolt slides through freely.
- id: c4
  part: spacer
  feature: end faces
  relation: supports
  hardware: bearing
  clearance_mm: null
  params:
  - wheel_w
  - bearing_w
  - recess
  - spacer_od
  check:
    method: measure
    ref: null
