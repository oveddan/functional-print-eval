manual:
- n: '1'
  text: Print the wheel, the spacer and two collars (PLA, 0.2 mm layers, 3+ walls,
    30-40% gyroid infill; no supports needed). Optionally print the pocket-coupon
    first and check a 608 bearing presses into the 22.15 mm pocket snugly. If it is
    too loose or too tight, tell me which.
  parts:
  - wheel
  - spacer
  - collar
  - pocket-coupon
  hardware: []
  tool: null
- n: '2'
  text: Press one 608ZZ bearing into each side of the wheel with steady thumb pressure
    (or squeeze in a vise with a flat board against the bearing). Push on the outer
    race only. Each bearing sits about 0.4 mm below the wheel face.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '3'
  text: 'Slide the bolt through the first bracket arm (with a washer under the bolt
    head if the head is outside), then a collar, the wheel with its bearing, and put
    the spacer in between the inner races as you go: collar, bearing A, spacer, bearing
    B, second collar.'
  parts:
  - collar
  - spacer
  - wheel
  hardware:
  - bolt
  - washer
  tool: null
- n: '4'
  text: Pass the bolt through the second bracket arm, add a washer and the lock nut.
    Tighten until the arms just clamp the collars; the wheel must spin freely with
    no side-to-side wobble. The spinning inner races are clamped by the collars and
    spacer, the wheel body itself is not squeezed.
  parts: []
  hardware:
  - bolt
  - washer
  - locknut
  tool: 13 mm wrench
- n: '5'
  text: Stack width between the bracket arms is 17.2 mm (wheel 16 + 0.6 each collar).
    If your bracket gap is wider, add M8 washers between the collar and arm. If it
    is narrower than 17.2 mm, tell me and I will shorten the collars. Spin the wheel
    by hand and rehang the door.
  parts: []
  hardware: []
  tool: null
