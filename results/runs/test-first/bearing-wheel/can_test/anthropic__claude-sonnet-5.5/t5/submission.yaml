  - 0.0
  - -1.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: spacer
    feature: bore
    role: clearance
  - part: collar
    feature: bore
    role: clearance
  nut: locknut
  external: Door bracket arms (bolt passes through both)
criteria:
- id: c1
  part: wheel
  feature: bearing pockets (both sides)
  relation: contains
  hardware: bearing
  clearance_mm: 0.15
  params:
  - bearing_od
  - pocket_clear
  - bearing_w
  - recess
  check:
    method: coupon
    ref: pocket-coupon
    description: Bearing should press in snugly by hand/thumb pressure and not fall
