task: bearing-wheel
note: 'Wheel is 50 mm OD x 16 mm wide. It has two 608 bearings pressed into opposite
  faces, with a 2.8 mm web between them. The bearings stand 0.4 mm proud of the faces,
  and M8 washers on the inner races keep the bracket arms off the wheel and the outer
  races. The pocket diameter is 22.3 mm, taken from the fit coupon. The bracket gap,
  bolt length and rail profile could not be measured, so the rim is flat and the manual
  says how to adjust the washer stack. The design prints without supports: the bottom
  pocket opens onto the bed, and the web is bridged over a 22 mm opening.'
questions:
- text: What is the clear gap between the bracket arms? The wheel stack needs about
    20.2 mm with two washers.
  answer: null
- text: Does the track need a groove in the rim (V or round)? The measurement could
    not be taken, so the rim is flat.
  answer: null
- text: How long is the M8 bolt? Only its 8 mm shank diameter was measured. The M8x50
    in the hardware list is a placeholder for your own bolt.
  answer: null
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel about 50 mm
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel about 16 mm wide
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: asked
    note: 608 OD nominal 22.0; user reads about 22
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: asked
    note: 608 width 7; user reads about 7
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: M8 shank about 8 mm
  seat_clr:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: 'Press-fit clearance chosen from the fit coupon: 22.29 mm seat went in easily
      and held; 21.99 would not go in'
  protrusion:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: how far each bearing sticks out of the wheel face so the washers load the
      inner race and not the wheel
  web_hole_d:
    value: 13
    unit: mm
    kind: design
    source: design
    note: clears the 8 mm bolt and the inner race (about 12 mm OD) so only the outer
      race touches the web
  rim_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
  entry_chamfer:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: lead-in on the bed-side pocket to offset elephant foot
  washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    R=p.bearing_od/2+p.seat_clr/2\n    depth=p.bearing_w-p.protrusion\n\
    \    w=cq.Workplane('XY').circle(p.wheel_od/2).extrude(p.wheel_w).edges().chamfer(p.rim_chamfer)\n\
    \    bot=cq.Workplane('XY').circle(R).extrude(depth)\n    lead=cq.Workplane('XY').circle(R+p.entry_chamfer).workplane(offset=p.entry_chamfer).circle(R).loft()\n\
    \    top=cq.Workplane('XY').workplane(offset=p.wheel_w-depth).circle(R).extrude(depth)\n\
    \    hole=cq.Workplane('XY').circle(p.web_hole_d/2).extrude(p.wheel_w)\n    return\
    \ w.cut(bot).cut(lead).cut(top).cut(hole)"
  print_orientation: flat on one circular face, axis vertical
  use_orientation: axis horizontal, rolling on the rail
- id: fit-coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    pitch=28\n    offs=[0,0.15,0.3,0.45]\n    w=cq.Workplane('XY').box(4*pitch+2,\
    \ pitch, 4, centered=(True,True,False))\n    for i,o in enumerate(offs):\n   \
    \     x=(i-1.5)*pitch\n        pocket=cq.Workplane('XY').workplane(offset=1).center(x,0).circle((p.bearing_od+o)/2).extrude(3)\n\
    \        hole=cq.Workplane('XY').center(x,0).circle(p.web_hole_d/2).extrude(4)\n\
    \        w=w.cut(pocket).cut(hole)\n    return w"
  print_orientation: flat, pocket side up
  use_orientation: flat
