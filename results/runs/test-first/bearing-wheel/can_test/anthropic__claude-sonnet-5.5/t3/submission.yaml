manual:
- n: '1'
  text: Print the wheel flat on the bed with the wide face down. Print it with at
    least 4 walls and 30% or more infill (gyroid or grid), because the rim carries
    the door's weight. No supports.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '2'
  text: Press one 608 bearing into each pocket until it bottoms against the centre
    web. Use a socket or the flat of a vise, and push on the outer race only. Each
    bearing should stick out about 0.4 mm. The fit was tested and should go in firmly
    by hand pressure.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '3'
  text: Slide the M8 bolt through the first bracket arm. Put a washer on it, then
    the wheel, then the second washer. The washers must touch only the bearing inner
    races. Pass the bolt through the second bracket arm and tighten the nut. The inner
    races get clamped and the wheel spins on the outer races. Check the wheel spins
    freely. The stack is about 20.2 mm wide (16 mm wheel + 2 × 0.4 mm bearing stick-out
    + 2 × 1.6 mm washers). If your bracket gap is wider, add washers. If it is narrower,
    drop one washer and check that the bearing outer race does not rub the bracket.
  parts:
  - wheel
  hardware:
  - bolt
  - washer
  - nut
  tool: 13 mm spanner and 6 mm hex key (or the tool for your bolt head)
- n: '4'
  text: Hang the door and check that the rim sits properly on the track. The rim is
    flat with 1 mm chamfered edges. If the old wheel had a groove, tell me its depth
    and width and I can add it.
  parts:
  - wheel
  hardware: []
  tool: null
