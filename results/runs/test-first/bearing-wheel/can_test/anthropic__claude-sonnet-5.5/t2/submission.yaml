manual:
- n: '1'
  text: Print the wheel flat on one rim face and the spacer flat. Use 4 or more walls
    and about 25% infill or more on the wheel so the rim is strong. No supports.
  parts:
  - wheel
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Press one 608 bearing into a pocket on either face of the wheel until it sits
    flush. Use even pressure, for example a flat board or a vise. The fit is snug
    on purpose.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '3'
  text: Turn the wheel over and press the second bearing in the same way. A 2 mm web
    in the middle separates the two bearings.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '4'
  text: Slide the M8 bolt through the bracket and the first bearing. Put the spacer
    on the bolt, then pass the bolt through the second bearing. The spacer sits between
    the two inner races, so tightening squeezes the inner races and not the printed
    wheel.
  parts:
  - spacer
  hardware:
  - bolt
  tool: null
- n: '5'
  text: Tighten the bolt into its nut or bracket. Spin the wheel by hand. It should
    turn freely with no rubbing. If it drags, loosen the bolt slightly. Then hang
    the door.
  parts: []
  hardware: []
  tool: M8 spanner or hex key
