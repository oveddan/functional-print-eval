task: bearing-wheel
note: 'A 50 x 16 mm PLA wheel with two 608 bearings pressed into opposite faces. The
  pocket size was tested with a coupon: 22.09 mm gave a snug fit. A printed 2 mm spacer
  on the M8 bolt separates the inner races. The wheel has a flat tread, because the
  track profile and bracket gap could not be measured. PLA may creep under a heavy
  door load, so check it after a few weeks.'
questions:
- text: Does the track need a grooved wheel? I made a flat tread with chamfered edges
    because the track profile couldn't be measured. A V-groove or lips can be added
    if the old wheel had one.
  answer: null
- text: Is the M8 bolt long enough to go through the bracket(s) plus 16 mm of wheel?
    I couldn't check its length, so the M8x50 in the hardware list is a stand-in for
    your own bolt.
  answer: null
