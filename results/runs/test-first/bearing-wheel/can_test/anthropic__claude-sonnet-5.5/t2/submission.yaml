parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    w = p.wheel_w\n    pr = (p.bearing_od + p.pocket_clear)\
    \ / 2\n    web = w - 2 * p.bearing_w\n    body = cq.Workplane('XY').circle(p.wheel_od\
    \ / 2).extrude(w).faces('>Z or <Z').chamfer(p.tread_chamfer)\n    bot = cq.Workplane('XY').circle(pr).extrude(p.bearing_w)\n\
    \    top = cq.Workplane('XY').workplane(offset=w - p.bearing_w).circle(pr).extrude(p.bearing_w)\n\
    \    hole = cq.Workplane('XY').circle(p.web_hole_d / 2).extrude(w)\n    body =\
    \ body.cut(bot).cut(top).cut(hole)\n    c = p.mouth_chamfer\n    cone_b = cq.Solid.makeCone(pr\
    \ + c, pr, c, cq.Vector(0, 0, 0), cq.Vector(0, 0, 1))\n    cone_t = cq.Solid.makeCone(pr\
    \ + c, pr, c, cq.Vector(0, 0, w), cq.Vector(0, 0, -1))\n    body = body.cut(cone_b).cut(cone_t)\n\
    \    return body\n"
  print_orientation: flat on one rim face, axis vertical (z)
  use_orientation: axis horizontal, rolling on the rim
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    web = p.wheel_w - 2 * p.bearing_w\n    return cq.Workplane('XY').circle(p.spacer_od\
    \ / 2).circle((p.bolt_d + p.spacer_clear) / 2).extrude(web)\n"
  print_orientation: flat, axis vertical
  use_orientation: on the bolt between the two bearing inner races
- id: press-fit-coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    res = None\n    web = p.wheel_w - 2 * p.bearing_w\n  \
    \  h = web + p.bearing_w\n    for i, c in enumerate([p.clr_a, p.clr_b, p.clr_c]):\n\
    \        x = i * 34\n        body = cq.Workplane('XY').center(x, 0).circle(15).extrude(h)\n\
    \        pocket = cq.Workplane('XY').workplane(offset=web).center(x, 0).circle((p.bearing_od\
    \ + c) / 2).extrude(p.bearing_w + 1)\n        hole = cq.Workplane('XY').center(x,\
    \ 0).circle(p.web_hole_d / 2).extrude(h)\n        body = body.cut(pocket).cut(hole)\n\
    \        res = body if res is None else res.union(body)\n    return res\n"
  print_orientation: flat, pocket opening facing up
  use_orientation: same
