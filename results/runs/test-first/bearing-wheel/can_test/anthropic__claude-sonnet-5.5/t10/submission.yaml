task: bearing-wheel
note: Wheel is 50 mm OD x 16 mm wide, with two 608 bearings pressed in from the two
  faces. A 3 mm web separates them. The pocket diameter (22.3 mm) was confirmed with
  a print test coupon. Rail profile, bolt length and bracket gap were not measured,
  so check them before printing. The bolt line is a placeholder for your existing
  M8 bolt.
questions:
- text: Does your rail have a groove or V profile? The tread is a flat 16 mm face,
    so tell me if it needs a groove.
  answer: null
- text: What is the length of your M8 bolt, and what is the gap between the bracket
    arms? I couldn't get either measurement. The wheel plus two washers is about 16
    + 2×0.5 + 3.2 mm, roughly 20 mm.
  answer: null
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel about 50 mm
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel about 16 mm wide
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 OD 22.000; user measured about 22
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 width 7; user measured about 7
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: 'user: M8 shank about 8 mm'
  pocket_clr:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: 'Coupon: 22.29 pocket held bearing, went in easily, not loose; 21.99 would
      not go in'
  bearing_protrude:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Bearing stands proud of each wheel face so the washers and bracket touch
      only the bearing inner race side, not the wheel
  web_hole_d:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Opening through the centre web, clear of the bolt and the inner races
  edge_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    depth = p.bearing_w - p.bearing_protrude\n    pocket_d\
    \ = p.bearing_od + p.pocket_clr\n    w = p.wheel_w\n    body = cq.Workplane('XY').circle(p.wheel_od\
    \ / 2).extrude(w)\n    body = body.edges().chamfer(p.edge_chamfer)\n    bottom\
    \ = cq.Workplane('XY').circle(pocket_d / 2).extrude(depth)\n    top = cq.Workplane('XY').workplane(offset=w\
    \ - depth).circle(pocket_d / 2).extrude(depth)\n    hole = cq.Workplane('XY').circle(p.web_hole_d\
    \ / 2).extrude(w)\n    return body.cut(bottom).cut(top).cut(hole)\n"
  print_orientation: one flat face on the bed, axis vertical
  use_orientation: axis horizontal on the M8 bolt, tread rolling on the rail
hardware:
- id: bearing
  ref: 608ZZ
  qty: 2
- id: bolt
  ref: ISO 4762 M8x40
  qty: 1
- id: washer
  ref: ISO 7089 M8
  qty: 2
joints: []
