- id: c1
  part: wheel
  feature: bearing pockets (both faces)
  relation: contains
  hardware: null
  clearance_mm: 0.3
  params:
  - bearing_od
  - pocket_clr
  - bearing_w
  - bearing_protrude
  check:
    method: coupon
    ref: fit-coupon
    description: 22.29 mm pocket held a 608 bearing, easy to insert, not loose
- id: c2
  part: wheel
  feature: centre web opening
  relation: clears
  hardware: null
  clearance_mm: 2.0
  params:
  - web_hole_d
  - bolt_d
  check:
    method: measure
    ref: null
    description: Bolt passes through both bearings without touching the wheel web
- id: c3
  part: wheel
  feature: overall width and diameter
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - wheel_w
  check:
    method: measure
    ref: null
    description: Wheel fits the bracket gap and rolls on the rail like the old one
manual:
- n: '1'
  text: Print the wheel with a flat face on the bed, no supports. Use 3+ walls and
    about 25% infill so the tread is strong.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '2'
  text: Press one 608 bearing into each pocket by hand, or with light pressure from
    a vice or clamp. Push it in square. It sits about 0.5 mm proud of the wheel face.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '3'
  text: Take the old wheel's remains off the bolt and bracket. Slide the M8 bolt through
    the bracket arm, a washer, the wheel's bearings, a second washer, and the other
    arm. The washers touch only the bearing inner races, so the wheel can spin freely.
    Reassemble it with the same nut or fasteners you took off.
  parts:
  - wheel
  hardware:
  - bolt
  - washer
  tool: null
- n: '4'
  text: Tighten the bolt so the bracket arms clamp the washers and inner races. Spin
    the wheel by hand. It should turn freely and not rub on the arms. Then rehang
    the door.
  parts: []
  hardware: []
  tool: null
