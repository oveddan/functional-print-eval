  params:
  - web_hole_d
  - spacer_od
  check:
    method: measure
    ref: null
    description: Spacer drops through the web hole freely
- id: c3
  part: spacer
  feature: bore
  relation: clears
  hardware: null
  clearance_mm: 0.2
  params:
  - bolt_d
  - spacer_clear
  check:
    method: measure
    ref: null
