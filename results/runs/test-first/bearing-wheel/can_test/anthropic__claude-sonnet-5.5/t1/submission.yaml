manual:
- n: '1'
  text: Print the wheel and the spacer flat on the bed in black PLA, no supports.
    Use 4+ walls and about 30-40% infill so the rim is strong.
  parts:
  - wheel
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Press one 608ZZ bearing into each pocket (top and bottom of the wheel) until
    it sits flat against the central web. Press it in square, using a flat piece of
    wood or the bolt head with a washer; do not hammer it.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '3'
  text: Drop the spacer into the web hole from one side, then slide the M8 bolt through
    bearing, spacer and second bearing. The spacer should touch both inner races.
  parts:
  - wheel
  - spacer
  hardware:
  - bolt
  - bearing
  tool: null
- n: '4'
  text: Mount the bolt through the door bracket in the same arrangement as the old
    wheel (reuse any washers or spacers that were there) and tighten the lock nut
    until the bracket just grips the inner races, then check that the wheel spins
    freely. Use a bolt long enough for bracket + 16 mm wheel + nut; the M8x50 listed
    is only a placeholder for your own bolt.
  parts:
  - wheel
  - spacer
  hardware:
  - bolt
  - locknut
  tool: null
