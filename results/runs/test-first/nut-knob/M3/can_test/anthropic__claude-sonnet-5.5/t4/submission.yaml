task: nut-knob/M3
note: 'Fit is untested: the coupon pockets (5.55/5.65/5.75 mm) came back with no result,
  so I used 5.6 mm across flats (0.1 mm clearance) as a guess. If the nut is too loose
  or too tight, change fit_clr.'
questions: []
params:
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: about 20 mm across
  knob_h:
    value: 8
    unit: mm
    kind: design
    source: design
    note: ''
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: M3 bolt
  fit_clr:
    value: 0.1
    unit: mm
    kind: design
    source: guessed
    note: extra across-flats clearance for press fit; coupon feedback was unreadable,
      so this is an untested guess
  depth_extra:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: pocket deeper than nut so nut sits fully inside
  hole_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: M3 clearance hole; smaller than nut across flats so nut cannot pass out
  flutes:
    value: 10
    unit: count
    kind: design
    source: design
    note: ''
  flute_r:
    value: 1.8
    unit: mm
    kind: design
    source: design
    note: ''
  lead_in:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: entry chamfer on nut pocket, offsets elephant foot
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    r = p.knob_d / 2\n    body = cq.Workplane('XY').circle(r).extrude(p.knob_h)\n\
    \    for i in range(int(p.flutes)):\n        a = 2 * math.pi * i / p.flutes\n\
    \        cx = (r + p.flute_r * 0.45) * math.cos(a)\n        cy = (r + p.flute_r\
    \ * 0.45) * math.sin(a)\n        body = body.cut(cq.Workplane('XY').center(cx,\
    \ cy).circle(p.flute_r).extrude(p.knob_h))\n    d = (p.nut_af + p.fit_clr) / math.cos(math.radians(30))\n\
    \    pocket = cq.Workplane('XY').polygon(6, d).extrude(p.nut_h + p.depth_extra)\n\
    \    cham = cq.Workplane('XY').polygon(6, d + 2 * p.lead_in).workplane(offset=p.lead_in).polygon(6,\
    \ d).loft()\n    hole = cq.Workplane('XY').circle(p.hole_d / 2).extrude(p.knob_h)\n\
    \    return body.cut(pocket).cut(cham).cut(hole)\n"
  print_orientation: nut-pocket face down on the bed (z=0), no supports
  use_orientation: pocket face towards the work, bolt end protrudes through the top
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: c1
  part: knob
  feature: hex nut pocket
  relation: contains
  hardware: nut
  clearance_mm: 0.1
  params:
  - nut_af
  - nut_h
  - fit_clr
  - depth_extra
  check:
    method: measure
    ref: null
    description: Nut presses in by hand from the bed face, sits fully recessed, and
      stays when the knob is turned upside down. Fit clearance is an untested guess.
- id: c2
  part: knob
  feature: bolt through hole
  relation: clears
  hardware: nut
  clearance_mm: 0.4
  params:
  - hole_d
  - bolt_d
  check:
    method: measure
    ref: null
    description: M3 bolt passes through the nut and the hole in the far wall; hole
      is smaller than the nut flats so the nut cannot be pushed out.
manual:
- n: '1'
  text: Print the knob with the hex pocket face down on the bed, no supports, 0.2
    mm layers.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Remove the knob. Align the M3 nut's flats with the hex pocket on the flat
    underside and press it in with your thumb (or press it against a table) until
    it is fully recessed against the pocket ceiling. If it is too tight to push in,
    lightly ease the pocket; if it falls out when upside down, tell me and I will
    adjust the clearance.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Thread your M3 bolt into the nut from the pocket side. The bolt tip comes
    out through the hole in the top. Turn the knob to tighten.
  parts:
  - knob
  hardware: []
  tool: null
