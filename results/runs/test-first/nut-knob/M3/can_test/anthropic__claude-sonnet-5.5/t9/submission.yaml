manual:
- n: '1'
  text: Print the knob with the flat far-side face on the bed and the hex pocket facing
    up. No supports. Black PLA, 0.2 mm layers, at least 3 walls.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Remove any elephant-foot or stringing from the hex pocket with a small blade.
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Line up the M3 nut with the hex pocket, flats against flats. Press it in with
    your thumb on a flat surface until it bottoms on the floor. It snaps past the
    lip at the mouth and sits about 0.8 mm below the face.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Turn the knob upside down and shake it to check the nut stays in. If it falls
    out, tell the designer (pocket needs to be tighter). If it won't go in by hand,
    ream the mouth lightly.
  parts:
  - knob
  hardware: []
  tool: null
- n: '5'
  text: Thread your M3 bolt through the pocket side, through the nut and out the hole
    in the far side. Tighten by turning the knob.
  parts:
  - knob
  hardware:
  - nut
  tool: null
