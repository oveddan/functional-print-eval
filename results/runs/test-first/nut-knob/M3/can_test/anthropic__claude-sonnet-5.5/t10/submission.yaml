task: nut-knob/M3
note: 'Pocket size is based on the coupon test: 5.70 mm AF (nut AF 5.5 + 0.2) was
  snug and held the nut when inverted. Smaller pockets would not take the nut.'
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  fit_offset:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: 'Pocket AF = nut AF + 0.2 (5.70 mm): snug press fit that held when inverted
      and shaken, in the coupon test. 5.6 was very hard to push in, and 5.5 or less
      would not go in.'
  pocket_d:
    value: 2.8
    unit: mm
    kind: design
    source: design
    note: nut height + 0.4 so the nut sits fully recessed
  bolt_hole_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: M3 clearance, smaller than the nut so it can't be pushed through
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: ''
  knob_h:
    value: 8
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_n:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
  scallop_r:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: grip scallop radius
parts:
- id: knob
  role: final
  material: PLA
  code: "import cadquery as cq\nimport math\n\ndef build(p):\n    knob = cq.Workplane('XY').circle(p.knob_d\
    \ / 2).extrude(p.knob_h)\n    knob = knob.faces('>Z').edges().chamfer(0.6)\n \
    \   knob = knob.faces('<Z').edges().chamfer(0.4)\n    for i in range(int(p.scallop_n)):\n\
    \        a = 2 * math.pi * i / p.scallop_n\n        r = p.knob_d / 2\n       \
    \ c = (cq.Workplane('XY').center(r * math.cos(a), r * math.sin(a))\n         \
    \    .circle(p.scallop_r).extrude(p.knob_h))\n        knob = knob.cut(c)\n   \
    \ d = (p.nut_af + p.fit_offset) / math.cos(math.radians(30))\n    pocket = (cq.Workplane('XY').workplane(offset=p.knob_h\
    \ - p.pocket_d)\n              .polygon(6, d).extrude(p.pocket_d + 1))\n    hole\
    \ = cq.Workplane('XY').circle(p.bolt_hole_d / 2).extrude(p.knob_h + 1)\n    return\
    \ knob.cut(pocket).cut(hole)"
  print_orientation: Flat side down (the face without the nut pocket on the bed),
    pocket opening facing up. No supports or bridges needed.
  use_orientation: Pocket face towards the bolt; the bolt threads through the nut
    and out of the hole in the far side.
- id: nut_fit_coupon
  role: coupon
  material: PLA
  code: "import cadquery as cq\nimport math\n\ndef build(p):\n    t = 2 + p.pocket_d\n\
    \    plate = cq.Workplane('XY').box(12, 12, t, centered=(False, True, False))\n\
    \    d = (p.nut_af + p.fit_offset) / math.cos(math.radians(30))\n    pocket =\
    \ cq.Workplane('XY').workplane(offset=2).center(6, 0).polygon(6, d).extrude(p.pocket_d\
    \ + 1)\n    hole = cq.Workplane('XY').center(6, 0).circle(p.bolt_hole_d / 2).extrude(t\
    \ + 1)\n    return plate.cut(pocket).cut(hole)"
  print_orientation: flat, pockets up
  use_orientation: test only
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: nut_pocket
  part: knob
  feature: hex nut pocket
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - fit_offset
  - pocket_d
  - nut_h
  check:
    method: coupon
    ref: nut_fit_coupon
    description: Press fit of the M3 nut, tested at 5.70 mm AF. The nut stayed in
      when the part was inverted and shaken.
- id: bolt_hole
  part: knob
  feature: through hole in the far wall
  relation: clears
  hardware: nut
  clearance_mm: 0.4
  params:
  - bolt_hole_d
  check:
    method: measure
    ref: null
    description: An M3 bolt passes through the hole. The hole is smaller than the
      nut's across-flats, so the nut can't be pushed out.
manual:
- n: '1'
  text: Print the knob flat, with the nut-pocket side up. No supports are needed.
    You don't need to print the coupon again.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Line up the M3 nut with the hex pocket and press it in with your thumb or
    a flat surface until it sits fully below the face. It's a snug fit, so push straight
    and evenly. The hole on the far side is smaller than the nut, so the nut can't
    go through.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Thread your M3 bolt through the pocket side, through the nut and out of the
    hole on the far side. Turn the knob to tighten.
  parts:
  - knob
  hardware: []
  tool: null
