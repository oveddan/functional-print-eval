parts:
- id: knob
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    b=cq.Workplane('XY').circle(p.knob_d/2).extrude(p.height)\n\
    \    pts=[(p.pocket_af/math.sqrt(3)*math.cos(math.radians(60*k)),p.pocket_af/math.sqrt(3)*math.sin(math.radians(60*k)))\
    \ for k in range(6)]\n    b=b.cut(cq.Workplane('XY').workplane(offset=p.seat_z).polyline(pts).close().extrude(p.height))\n\
    \    b=b.cut(cq.Workplane('XY').circle(p.hole_d/2).extrude(p.height))\n    y=p.pocket_af/2\n\
    \    for s in [-1,1]:\n        inner=y-p.slot\n        outer=y+p.finger_t+p.slot\n\
    \        cut=cq.Workplane('XY').box(p.finger_w+2*p.slot,outer-inner,p.height,centered=(True,True,False)).translate((0,s*(inner+outer)/2,p.root_z))\n\
    \        b=b.cut(cut)\n        beam=cq.Workplane('XY').box(p.finger_w,p.finger_t,p.lip_z-p.root_z,centered=(True,True,False)).translate((0,s*(y+p.finger_t/2),p.root_z))\n\
    \        profile=[(s*y,p.lip_z-p.lip_projection),(s*(y-p.lip_projection),p.lip_z),(s*y,p.height),(s*(y+p.finger_t),p.height),(s*(y+p.finger_t),p.lip_z-p.lip_projection)]\n\
    \        lip=cq.Workplane('YZ',origin=(-p.finger_w/2,0,0)).polyline(profile).close().extrude(p.finger_w)\n\
    \        b=b.union(beam).union(lip)\n    return b"
  print_orientation: Flat circular base at z=0 on bed; hex pocket and lips face upward.
    No supports.
  use_orientation: Nut pocket faces away from the clamped object; solid base faces
    the object. Bolt enters the base, threads through the nut and exits the open pocket.
