      using fingers, without rubbing or cross-threading.
manual:
- n: '1'
  text: 'Print knob in black PLA, flat base down and pocket up, at 0.2 mm layers with
    four walls and at least 30% infill. Disable supports. Inspect the preview: both
    thin fingers and their slots must remain distinct.'
  parts:
  - knob
  hardware: []
  tool: Slicer and printer
- n: '2'
  text: Let the print cool. Remove any loose strings from the pocket and slots. Do
    not force or pry the flexible fingers.
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: 'Align the M3 nut flats with the hex pocket and press it straight down with
    fingers only. The lips should flex outward and return over the nut. The nut must
    rest flat on the shoulder, fully below the rim. Do not use a hammer, pliers, heat
    or glue. If finger pressure cannot seat it, stop: fit has not been validated.'
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Before installing a bolt, invert the knob and gently tap it. The nut must
    stay seated. Check that it cannot be pushed through the base and that neither
    finger has cracked or stayed bent. If any check fails, do not use this print.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Insert the M3 bolt through the solid-base side and turn the knob to engage
    the nut. Confirm the bolt passes through the nut and exits the pocket. The listed
    M3x16 is an example; account for your clamped object's thickness when choosing
    an available bolt length. This is a nut-containing knob, not a bolt-head socket.
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: null
- n: '6'
  text: Use the solid base against the clamped object so tightening loads the nut
    onto its shoulder, not against the retaining lips. Tighten lightly by hand, without
    a wrench. Stop if the nut spins in the pocket or the plastic deforms.
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: null
