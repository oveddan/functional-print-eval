task: nut-knob/M3
note: 'One-piece 20 mm snap-retaining M3 nut knob. Two flexible lips retain the nut
  independently of a tight hex-pocket fit. Fit remains UNVERIFIED: the reported tests
  did not establish insertion or retention for this geometry. Print one and perform
  the manual''s acceptance checks before use; no guaranteed fit is claimed. For light
  hand tightening only; PLA is unsuitable for hot environments or safety-critical
  clamping.'
