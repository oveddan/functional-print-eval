task: nut-knob/M3
note: 'One-piece, 20 mm scalloped hand knob with captive M3 hex nut. Uses the tested
  5.80 mm pocket: hand insertion with slight pushing, retained when inverted and shaken.
  This is a nut-type knob for turning onto an M3 bolt or stud, not a cover for a bolt
  head. Nut retention is a friction fit; the integral floor prevents push-through
  on the opposite side.'
questions:
- text: Can the nut be measured?
  answer: No; nominal ISO 4032 M3 dimensions used.
- text: Which pocket fits by hand and retains the nut?
  answer: 5.70 mm was snug and retained under inversion/shaking. 5.80 mm needed only
    slight pushing and also retained under inversion/shaking; selected 5.80 mm.
