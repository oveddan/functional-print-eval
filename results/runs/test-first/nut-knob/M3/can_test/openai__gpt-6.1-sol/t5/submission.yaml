parts:
- id: knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    import math\n    body = cq.Workplane('XY').circle(p.knob_diameter/2).extrude(p.knob_height)\n\
    \    for i in range(int(p.scallop_count)):\n        a = 2*math.pi*i/p.scallop_count\n\
    \        x = p.scallop_centres_radius*math.cos(a)\n        y = p.scallop_centres_radius*math.sin(a)\n\
    \        tool = cq.Workplane('XY').center(x,y).circle(p.scallop_radius).extrude(p.knob_height)\n\
    \        body = body.cut(tool)\n    bore = cq.Workplane('XY').circle(p.bolt_clearance_diameter/2).extrude(p.knob_height)\n\
    \    pocket = (cq.Workplane('XY').workplane(offset=p.floor_thickness)\n      \
    \        .polygon(6,p.pocket_af/math.cos(math.pi/6))\n              .extrude(p.knob_height-p.floor_thickness))\n\
    \    entry = (cq.Workplane('XY').workplane(offset=p.knob_height-p.entry_height)\n\
    \             .polygon(6,p.pocket_af/math.cos(math.pi/6))\n             .workplane(offset=p.entry_height)\n\
    \             .polygon(6,(p.pocket_af+p.entry_extra_af)/math.cos(math.pi/6)).loft())\n\
    \    return body.cut(bore).cut(pocket).cut(entry)"
  print_orientation: Flat underside at z=0 on bed; hex pocket opens upward. No supports.
  use_orientation: Bolt enters the underside clearance hole, threads through the captive
    nut, and can emerge through the open pocket. Orient the solid underside toward
    the work being clamped.
