- id: bolt_passage
  part: knob
  feature: Coaxial 3.4 mm clearance bore beneath the nut
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - bolt_clearance_diameter
  - bolt_diameter
  check:
    method: measure
    ref: null
    description: Thread an M3 bolt through the nut by hand and verify that its tip
      passes freely through the underside hole.
manual:
- n: '1'
  text: Print knob in black PLA with its flat underside on the bed and pocket upward.
    Use the same profile and dimensional compensation as successful fit_F, with the
    0.4 mm nozzle and 0.2 mm layers. Use at least four walls and solid infill for
    this small part. No supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Let the print cool. Remove any loose strings without filing or enlarging the
    hex pocket; its tested fit provides retention.
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Align the M3 nut's six flats with the pocket and push it straight in by hand
    until it rests on the floor. It should be fully below the top surface. Do not
    hammer it or force it with a tool.
  parts:
  - knob
  hardware:
  - captive_nut
  tool: null
- n: '4'
  text: Turn the knob upside down and shake it gently over a tray. The nut must remain
    seated. If it falls out, spins freely, or cannot be fully inserted by hand, do
    not use that print; the final fit has not reproduced the coupon.
  parts:
  - knob
  hardware:
  - captive_nut
  tool: null
- n: '5'
  text: Turn the knob onto your M3 bolt or stud by hand, with the solid underside
    toward the clamped work. The bolt passes through the underside hole and nut and
    may protrude from the open top. Use gentle finger tightening only; this PLA knob
    is not for high torque, safety-critical loads, or hot environments.
  parts:
  - knob
  hardware:
  - captive_nut
  tool: null
