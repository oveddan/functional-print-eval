task: nut-knob/M3
note: 'One-piece, approximately 20 mm hand knob with a captive M3 nut. Uses the 5.70
  mm hex pocket that you tested successfully: hand insertion, retained when inverted
  and shaken. The open pocket faces upward during printing; a solid floor with a smaller
  bolt hole prevents the nut passing through the opposite side.'
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 nominal across flats.
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 nominal height.
  pocket_allowance:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: Produces the tested 5.70 mm across-flats pocket; user confirmed snug hand
      insertion and inversion/shake retention.
  pocket_depth:
    value: 2.8
    unit: mm
    kind: design
    source: design
    note: Same depth as successful coupon; nominal nut top is recessed 0.4 mm.
  floor_t:
    value: 3.2
    unit: mm
    kind: design
    source: design
    note: Solid retaining floor beneath nut, except for bolt clearance hole.
  bore_d:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: Clearance passage for M3 bolt, same diameter as test.
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_count:
    value: 12
    unit: count
    kind: design
    source: design
    note: ''
  scallop_radius:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_center_radius:
    value: 11
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: hand_knob
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    height = p.floor_t + p.pocket_depth\n\
    \    body = cq.Workplane('XY').circle(p.knob_d/2).extrude(height)\n    for i in\
    \ range(int(p.scallop_count)):\n        angle = 2*math.pi*i/p.scallop_count\n\
    \        x = p.scallop_center_radius*math.cos(angle)\n        y = p.scallop_center_radius*math.sin(angle)\n\
    \        cutter = cq.Workplane('XY').center(x,y).circle(p.scallop_radius).extrude(height)\n\
    \        body = body.cut(cutter)\n    bore = cq.Workplane('XY').circle(p.bore_d/2).extrude(height)\n\
    \    af = p.nut_af + p.pocket_allowance\n    pocket = (cq.Workplane('XY').workplane(offset=p.floor_t)\n\
    \              .polygon(6,af/(math.sqrt(3)/2)).extrude(p.pocket_depth))\n    return\
    \ body.cut(bore).cut(pocket)\n"
  print_orientation: Flat face with the small circular hole on the bed at z=0; hex
    pocket open upward. No supports.
  use_orientation: Bolt axis through the knob centre. Hex pocket may face either way
    after nut insertion.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: hand_press_retention
  part: hand_knob
  feature: 5.70 mm across-flats hex pocket
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - pocket_allowance
  - pocket_depth
  check:
    method: coupon
    ref: fit_coupon
    description: 'Completed: 5.70 mm pocket accepted the nut with hand pushing, snugly
      retained it during inversion and shaking. Smaller pockets were unsuitable.'
- id: nut_recess
  part: hand_knob
  feature: 2.8 mm deep pocket fully contains nominal 2.4 mm nut
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_h
  - pocket_depth
  check:
    method: measure
    ref: null
    description: After seating, confirm nut top is below the knob rim.
- id: retaining_floor
  part: hand_knob
  feature: 3.2 mm floor beneath hex pocket with only 3.5 mm central opening
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - floor_t
  - bore_d
  - nut_af
  check:
    method: none
    ref: null
    description: Opening is smaller than nut across flats, preventing push-through.
manual:
- n: '1'
  text: Print hand_knob in black PLA at 0.2 mm layers with the hex pocket facing up,
    no supports. Use 4 walls and 100% infill for this small part. Use the same fit-related
    slicer settings as the successful coupon.
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '2'
  text: Align the ISO 4032 M3 nut with the hex pocket and press it in squarely by
    hand until it rests on the pocket floor. Its top must be below the rim. Do not
    hammer it or use glue.
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Turn the knob upside down and gently shake it over a tray. Confirm the nut
    stays seated, as it did in the test coupon. If it falls out or cannot seat by
    hand, do not rely on the fit.
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Thread your M3 bolt through the captured nut and check that its tip passes
    freely through the small hole on the opposite face. Select bolt length for your
    assembly; the printed knob is 6 mm thick. Tighten by fingers only, and do not
    force the bolt if it binds.
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
