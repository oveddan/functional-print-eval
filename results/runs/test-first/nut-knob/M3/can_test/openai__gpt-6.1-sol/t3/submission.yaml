task: nut-knob/M3
note: 'One-piece, approximately 20 mm hand knob with a recessed, friction-retained
  M3 hex nut. Uses the tested 5.70 mm pocket: you reported snug push-in insertion
  and retention when inverted and shaken. The solid 3.2 mm shoulder prevents the nut
  passing through the underside; the central 3.5 mm hole allows the bolt through.
  This works as a hand-tightened nut on an M3 bolt, not as a permanently locked bolt-head
  handle.'
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 nominal across flats.
  nut_height:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_diameter:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: M3 nominal major diameter; bolt length depends on the user's application.
  bolt_clearance:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Diametral clearance; yields a 3.5 mm through-hole.
  knob_diameter:
