parts:
- id: hand_knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    import math\n    body = cq.Workplane('XY').circle(p.knob_diameter/2).extrude(p.knob_height)\n\
    \    for i in range(int(p.grip_count)):\n        angle = 2*math.pi*i/p.grip_count\n\
    \        x = p.grip_cut_centres*math.cos(angle)\n        y = p.grip_cut_centres*math.sin(angle)\n\
    \        cut = cq.Workplane('XY').center(x,y).circle(p.grip_cut_radius).extrude(p.knob_height)\n\
    \        body = body.cut(cut)\n    bore = cq.Workplane('XY').circle((p.bolt_diameter+p.bolt_clearance)/2).extrude(p.knob_height)\n\
    \    pocket = (cq.Workplane('XY').workplane(offset=p.knob_height-p.pocket_depth)\n\
    \              .polygon(6,p.pocket_af/math.cos(math.pi/6)).extrude(p.pocket_depth))\n\
    \    lead = (cq.Workplane('XY').workplane(offset=p.knob_height-p.lead_depth)\n\
    \            .polygon(6,p.pocket_af/math.cos(math.pi/6))\n            .workplane(offset=p.lead_depth)\n\
    \            .polygon(6,(p.pocket_af+p.lead_expansion)/math.cos(math.pi/6)).loft())\n\
    \    return body.cut(bore).cut(pocket).cut(lead)"
  print_orientation: Flat underside on bed at z=0; hex pocket faces upward. Print
    at 0.2 mm layers, 4 walls, 100% infill, no supports. Use the same filament and
    fit-affecting slicer settings as the successful coupons.
  use_orientation: Hex pocket faces away from the clamped surface; flat underside
    faces the work. Bolt passes axially through the recessed nut and the underside
    clearance hole.
hardware:
- id: m3_nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: hand_press_retention
  part: hand_knob
  feature: Straight hex pocket below the lead-in
  relation: engages
  hardware: m3_nut
  clearance_mm: null
  params:
  - pocket_af
  - pocket_depth
  - lead_depth
  - nut_af
  - nut_height
  check:
    method: coupon
    ref: test_E_570
    description: 5.70 mm coupon accepted the nut with pushing, snug; user confirmed
      retention upside down with shaking. Recheck on final print.
- id: fully_recessed
  part: hand_knob
  feature: Nut pocket floor and top rim
  relation: contains
  hardware: m3_nut
  clearance_mm: null
  params:
  - pocket_depth
  - nut_height
  check:
    method: measure
    ref: null
    description: After pressing fully home, verify the nut's top face is below the
      rim; nominal recess is 0.4 mm.
- id: positive_stop
  part: hand_knob
  feature: Solid shoulder beneath hex pocket
  relation: supports
  hardware: m3_nut
  clearance_mm: null
  params:
  - knob_height
  - pocket_depth
  - nut_af
  - bolt_diameter
  - bolt_clearance
  check:
    method: measure
    ref: null
    description: Shoulder is 3.2 mm thick; underside opening is only 3.5 mm across,
      smaller than the nut.
- id: bolt_passage
  part: hand_knob
  feature: Axial 3.5 mm through-hole
  relation: clears
  hardware: null
  clearance_mm: 0.25
  params:
  - bolt_diameter
  - bolt_clearance
  check:
    method: measure
    ref: null
    description: By hand, thread an M3 bolt through the seated nut and verify its
      tip exits the underside freely. Never force a cross-threaded bolt.
manual:
- n: '1'
  text: Print hand_knob with its flat underside on the bed and hex pocket upward.
    Use 0.2 mm layers, 4 walls, 100% infill, and no supports. Keep the successful
    coupon's filament and fit settings.
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '2'
  text: Let the print cool and remove it from the bed. Clear any loose strands from
    the hex pocket and central hole, without widening the pocket.
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '3'
  text: Align the M3 nut's six flats with the pocket. Press it straight down using
    fingers until it seats against the floor. It should be fully below the rim. Do
    not hammer it or use glue.
  parts:
  - hand_knob
  hardware:
  - m3_nut
  tool: null
- n: '4'
  text: Invert the knob and gently shake it over a tray. The nut must remain seated.
    If it falls out, do not use the knob until the fit is corrected. The chosen 5.70
    mm coupon passed this test.
  parts:
  - hand_knob
  hardware:
  - m3_nut
  tool: null
- n: '5'
  text: 'Check with your M3 bolt: start the thread by hand and turn until the bolt
    tip emerges through the underside hole. Stop if it binds. The nut cannot pass
    through that hole.'
  parts:
  - hand_knob
  hardware:
  - m3_nut
  tool: null
- n: '6'
  text: 'Use as a thumb nut: place the flat underside toward the work and turn the
    scalloped rim by hand to tighten on your M3 bolt. Do not use pliers or high torque.
    This single-nut design is not locked to the bolt; it will advance along its thread
    when turned.'
  parts:
  - hand_knob
  hardware:
  - m3_nut
  tool: null
