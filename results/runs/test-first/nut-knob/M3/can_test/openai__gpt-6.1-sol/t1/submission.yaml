parts:
- id: hand_knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "import math\n\ndef build(p):\n    h = p.knob_height\n    floor = h - p.pocket_depth\n\
    \    a = p.pocket_af / 2\n    def hexagon(z, af):\n        return (cq.Workplane('XY').workplane(offset=z)\n\
    \                .polygon(6, af/math.cos(math.pi/6))\n                .rotate((0,0,0),(0,0,1),30))\n\
    \    body = cq.Workplane('XY').circle(p.knob_diameter/2).extrude(h)\n    for i\
    \ in range(int(p.scallop_count)):\n        t = 2*math.pi*i/p.scallop_count\n \
    \       cutter = (cq.Workplane('XY')\n                  .center(p.scallop_center_radius*math.cos(t),p.scallop_center_radius*math.sin(t))\n\
    \                  .circle(p.scallop_radius).extrude(h))\n        body = body.cut(cutter)\n\
    \    pocket = hexagon(floor,p.pocket_af).extrude(p.pocket_depth)\n    mouth =\
    \ (cq.Workplane('XY').workplane(offset=h-p.lead_height)\n             .polygon(6,p.pocket_af/math.cos(math.pi/6))\n\
    \             .workplane(offset=p.lead_height)\n             .polygon(6,(p.pocket_af+2*p.lead_expansion)/math.cos(math.pi/6))\n\
    \             .loft().rotate((0,0,0),(0,0,1),30))\n    body = body.cut(pocket).cut(mouth)\n\
    \    # Three ribs anchored into alternate flats. The sloping upper tips\n    #\
    \ guide insertion; narrow contact lands deform rather than the full hex.\n   \
    \ profile = [(a-p.rib_intrusion,floor),\n               (a+p.rib_anchor,floor),\n\
    \               (a+p.rib_anchor,h),\n               (a,h),\n               (a-p.rib_intrusion,h-p.rib_ramp)]\n\
    \    rib = (cq.Workplane('XZ').polyline(profile).close()\n           .extrude(p.rib_width).translate((0,p.rib_width/2,0)))\n\
    \    for angle in (0,120,240):\n        body = body.union(rib.rotate((0,0,0),(0,0,1),angle))\n\
    \    bore = cq.Workplane('XY').circle((p.bolt_diameter+p.bore_allowance)/2).extrude(h)\n\
    \    return body.cut(bore).clean()"
  print_orientation: Broad flat bottom at z=0 on bed, nut pocket upward. No supports.
    Use 0.2 mm layers, 4 walls, 100% infill; do not enable automatic hole-size compensation.
  use_orientation: Nut pocket faces the free bolt end; the solid floor faces the object
    being tightened. Bolt threads enter through the bottom clearance bore and nut,
    then exit through the open pocket.
