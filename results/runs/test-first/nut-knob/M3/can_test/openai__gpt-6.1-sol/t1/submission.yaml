    ref: null
    description: Press nut in by hand only. It must remain seated when the knob is
      inverted and lightly tapped. Ribbed fit remains unverified; reject if loose
      or impossible to seat by hand.
- id: nut_recess
  part: hand_knob
  feature: Blind hex pocket and continuous floor
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_height
  - pocket_depth
  - knob_height
  - pocket_af
  check:
    method: measure
    ref: null
    description: Nut must sit fully below the upper face, flat against the pocket
      floor. Nominal recess 0.4 mm; floor thickness 3.2 mm. Nut must not pass through
      the bottom.
- id: bolt_path
  part: hand_knob
  feature: Central through bore
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - bolt_diameter
  - bore_allowance
  check:
    method: measure
    ref: null
    description: 'Check with your intended M3 bolt: it must pass freely through the
      printed bore, engage the nut smoothly and emerge through the pocket. Do not
      use thread resistance to force a misaligned nut.'
manual:
- n: '1'
  text: Print hand_knob pocket-up using the specified orientation and settings. Let
    it cool, remove it, and clear any loose strings from the pocket and bore.
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '2'
  text: Align the six flats of nut with the hex pocket. Press it squarely into the
    pocket using your fingers against a firm surface until seated on the floor. The
    tapered ribs guide entry and may deform slightly. Do not hammer it or use a screw
    to pull it in; if it cannot be seated by hand, the fit has failed.
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Check that the entire nut is below the top face. Invert the knob over a tray
    and lightly tap it. The nut must stay in. If it falls out, rocks, or the plastic
    cracks, do not use this print; its fit needs revision. No glue is required or
    specified.
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Thread your intended M3 bolt through the bottom bore and the nut. Confirm
    smooth engagement and that the threaded tip can emerge through the pocket. Bolt
    length depends on your application and is not supplied by this design. Finger-tighten
    gently and confirm the nut cannot spin.
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Use only for light hand tightening. Place the solid bottom toward the clamped
    object where practical, so tightening loads the nut against the pocket floor.
    Recheck retention periodically; PLA ribs can wear or relax, particularly in heat.
    Stop using the knob if the nut loosens.
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
