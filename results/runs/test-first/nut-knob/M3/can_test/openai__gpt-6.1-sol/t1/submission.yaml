task: nut-knob/M3
note: 'One-piece, approximately 20 mm hand knob for an ISO 4032 M3 nut. Three narrow
  crush ribs provide localized interference instead of making the entire hex pocket
  tight. This ribbed fit has not been print-tested: the earlier 5.35 and 5.45 mm plain
  pockets rejected the nut, and the larger pockets could not be evaluated. Hand insertion
  and upside-down retention must therefore be checked on the final print. Intended
  for light finger tightening, not high torque or safety-critical use.'
questions:
- text: Plain hex-pocket fit results?
  answer: 5.35 and 5.45 mm would not accept the nut. Results for 5.55 and 5.65 mm
    unavailable; user requested best judgment.
