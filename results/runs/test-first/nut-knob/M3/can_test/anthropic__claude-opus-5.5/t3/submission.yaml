  - rib_h
  - rib_w
  - nut_af
  check:
    method: coupon
    ref: coupon_A/B/C
    description: 5.45 plain hex was too tight; the ribs give 5.55 effective, and they
      squash instead of the whole wall. The nut must stay in when the knob is turned
      over and tapped
- id: nut_recessed
  part: knob
  feature: pocket depth
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - pocket_depth
  - nut_h
  check:
    method: measure
    ref: null
    description: nut top sits about 0.4 mm below the knob face
- id: floor_stop
  part: knob
  feature: 5.2 mm floor with 3.4 hole
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - knob_h
  - pocket_depth
  - bolt_clear_d
  check:
    method: none
    ref: null
    description: the hole is smaller than the nut, so the nut can't go through
manual:
- n: '1'
  text: Print the knob in PLA with the flat solid face on the bed and the hex pocket
    facing up. No supports needed.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Put the M3 nut on the pocket, flat side down, lined up with the hex, and press
    it in with your thumb (or push it down on the table) until it sits below the surface.
    The three small ribs inside are meant to squash. If it's very stiff, push it in
    by threading a bolt in from the bottom and tightening it.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Turn the knob over and tap it. The nut should stay in. Thread your M3 bolt
    in from the round-hole side so it goes through the nut and out the pocket side.
    When you tighten, the floor takes the load.
  parts:
  - knob
  hardware:
  - nut
  tool: null
