task: nut-knob/M3
note: 'Pocket size comes from the fit test: 5.70 mm across the flats. Nut depth 2.8
  mm. The solid 4 mm floor has a 3.4 mm hole in it.'
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height
  pocket_af:
    value: 5.7
    unit: mm
    kind: design
    source: measured
    note: 'From the coupon: 5.70 pressed in snug by hand and stayed in when turned
      over and shaken'
  pocket_depth:
    value: 2.8
    unit: mm
    kind: design
    source: design
    note: nut_h + 0.4 so the nut sits fully below the face
  floor_t:
    value: 4.0
    unit: mm
    kind: design
    source: design
    note: solid floor that the nut can't be pushed through
  bolt_clear:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: M3 clearance through the floor
  knob_d:
    value: 20.0
    unit: mm
    kind: design
    source: asked
    note: ''
  grip_n:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
  grip_d:
    value: 4.0
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    h=p.floor_t+p.pocket_depth\n    r=p.knob_d/2\n\
    \    k=cq.Workplane('XY').circle(r).extrude(h)\n    for i in range(int(p.grip_n)):\n\
    \        a=2*math.pi*i/p.grip_n\n        k=k.cut(cq.Workplane('XY').center((r+0.6)*math.cos(a),(r+0.6)*math.sin(a)).circle(p.grip_d/2).extrude(h+1))\n\
    \    k=k.cut(cq.Workplane('XY').circle(p.bolt_clear/2).extrude(h+1))\n    k=k.cut(cq.Workplane('XY').workplane(offset=p.floor_t).polygon(6,p.pocket_af/math.cos(math.radians(30))).extrude(p.pocket_depth+1))\n\
    \    return k\n"
  print_orientation: Solid floor (with the small bolt hole) on the bed, hex pocket
    open upward. No supports or bridges.
  use_orientation: Hex pocket faces the work. Tightening pulls the nut against the
    solid floor, and the bolt end comes out through the floor hole.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: c1
  part: knob
  feature: hex pocket
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - pocket_af
  - nut_af
  check:
    method: coupon
    ref: nut_fit_coupon
    description: '5.70 pocket: hand press, stays in when turned over'
- id: c2
  part: knob
  feature: hex pocket depth
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - pocket_depth
  - nut_h
  check:
    method: measure
    ref: null
    description: Nut sits about 0.4 mm below the knob face
- id: c3
  part: knob
  feature: floor bolt hole
  relation: clears
  hardware: null
  clearance_mm: 0.4
  params:
  - bolt_clear
  check:
    method: none
    ref: null
    description: ''
manual:
- n: '1'
  text: Print the knob with the flat floor on the bed and the hex pocket facing up.
    Use PLA, 0.2 mm layers, no supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Line up the M3 nut with the hex pocket and press it in with your thumb until
    it sits on the floor of the pocket, a little below the face. To finish seating
    it, you can press it on a table.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Thread the knob onto your M3 bolt with the pocket side towards the work, so
    the bolt goes through the nut and out through the small hole in the floor. Tighten
    by hand.
  parts:
  - knob
  hardware:
  - nut
  tool: null
