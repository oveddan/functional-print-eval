task: nut-knob/M3
note: Any M3 bolt works. M3x20 is just listed as an example. If a nut ever turns out
  too loose, reprint with pocket_af = 5.65. If it's too tight, use 5.8.
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_clear_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: M3 clearance
  pocket_af:
    value: 5.7
    unit: mm
    kind: design
    source: design
    note: 'Picked from printed test pieces: 5.6 too tight, 5.7 snug and held the nut
      upside down, 5.8 held but looser'
  nut_recess:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: the nut's top sits this far below the knob face
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: ''
  knob_h:
    value: 9
    unit: mm
    kind: design
    source: design
    note: ''
  grip_count:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
  grip_r:
    value: 2
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    R = p.knob_d / 2\n    h = p.knob_h\n    body\
    \ = cq.Workplane('XY').circle(R).extrude(h)\n    n = int(p.grip_count)\n    for\
    \ i in range(n):\n        a = 2 * math.pi * i / n\n        c = cq.Workplane('XY').center(R\
    \ * math.cos(a), R * math.sin(a)).circle(p.grip_r).extrude(h)\n        body =\
    \ body.cut(c)\n    d = p.pocket_af * 2 / 3 ** 0.5\n    depth = p.nut_h + p.nut_recess\n\
    \    pocket = cq.Workplane('XY').workplane(offset=h - depth).polygon(6, d).extrude(depth\
    \ + 1)\n    hole = cq.Workplane('XY').circle(p.bolt_clear_d / 2).extrude(h)\n\
    \    return body.cut(pocket).cut(hole)\n"
  print_orientation: Flat solid face on the bed, hex pocket opening facing up (z=knob_h)
  use_orientation: Bolt enters through the solid face, passes through the nut and
    comes out of the pocket face
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
- id: bolt
  ref: ISO 4762 M3x20
  qty: 1
joints:
- id: knob_bolt
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - -20.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: bolt clearance hole through the solid floor
    role: clearance
  - part: knob
    feature: hex pocket
    role: nut_pocket
  nut: nut
  external: null
criteria:
- id: nut_retained
  part: knob
  feature: hex pocket
  relation: seats
  hardware: nut
  clearance_mm: null
  params:
  - pocket_af
  - nut_af
  check:
    method: coupon
    ref: fit2_coupon_1
    description: The 5.70 mm pocket took the nut with a firm push and held it when
      turned upside down and shaken
- id: nut_recessed
  part: knob
  feature: pocket depth
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_h
  - nut_recess
  check:
    method: measure
    ref: null
    description: Once it's pressed in, the nut's top sits about 0.3 mm below the knob
      face
- id: bolt_clears
  part: knob
  feature: bolt clearance hole
  relation: clears
  hardware: bolt
  clearance_mm: 0.4
  params:
  - bolt_clear_d
  check:
    method: none
    ref: null
    description: ''
manual:
- n: '1'
  text: Print the knob with its flat solid face on the bed and the hex pocket facing
    up. It needs no supports. Use PLA at 0.2 mm layers.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Line the M3 nut up with the hex pocket and push it in with your thumb (or
    press it flat against the table) until it bottoms out, just below the face. The
    solid floor stops it from going out the other side.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Feed the M3 bolt in through the hole in the solid face and screw it through
    the nut so it comes out of the pocket side. Turn the knob by hand to tighten.
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: null
