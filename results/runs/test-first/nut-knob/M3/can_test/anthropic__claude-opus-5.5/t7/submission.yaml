task: nut-knob/M3
note: 'Pocket size picked from the coupon: 5.45 AF was too tight, so 5.55 AF is used.
  If it''s still too tight, change pocket_af to 5.65. If the nut falls out, change
  it to 5.50.'
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  pocket_af:
    value: 5.55
    unit: mm
    kind: design
    source: design
    note: 'Coupon: 5.45 too tight to press in; 5.55 is the next step up and should
      be a hand-press interference fit. Results for 5.55 not reported.'
  pocket_extra_depth:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: nut sits 0.3 below the top face
  bolt_clear_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: ''
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: ''
  knob_h:
    value: 8
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_n:
    value: 10
    unit: count
    kind: design
    source: design
    note: ''
  scallop_r:
    value: 1.6
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    R=p.knob_d/2\n    depth=p.nut_h+p.pocket_extra_depth\n\
    \    floor=p.knob_h-depth\n    body=cq.Workplane('XY').circle(R).extrude(p.knob_h).edges().chamfer(0.6)\n\
    \    for i in range(int(p.scallop_n)):\n        a=2*math.pi*i/p.scallop_n\n  \
    \      body=body.cut(cq.Workplane('XY').center((R+0.6)*math.cos(a),(R+0.6)*math.sin(a)).circle(p.scallop_r).extrude(p.knob_h))\n\
    \    d=p.pocket_af/math.cos(math.radians(30))\n    body=body.cut(cq.Workplane('XY').workplane(offset=floor).polygon(6,d).extrude(depth+1))\n\
    \    body=body.cut(cq.Workplane('XY').circle(p.bolt_clear_d/2).extrude(p.knob_h+1))\n\
    \    return body"
  print_orientation: flat bottom (closed face with the small bolt hole) on the bed,
    hex pocket opening facing up
  use_orientation: pocket side faces away from the work; bolt enters through the bottom
    hole
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: c1
  part: knob
  feature: hex pocket
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - pocket_af
  - nut_af
  - nut_h
  - pocket_extra_depth
  check:
    method: coupon
    ref: nut_fit_coupon
    description: nut presses in by hand, sits below the top face, stays in when inverted
- id: c2
  part: knob
  feature: pocket floor
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - bolt_clear_d
  - nut_af
  check:
    method: none
    ref: null
    description: 3.4 hole is smaller than the nut, so the nut can't be pushed out
      through the bottom
manual:
- n: '1'
  text: Print the knob flat on its bottom, pocket facing up, with no supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Line up the nut's flats with the hex pocket and press it in with your thumb
    (or press it down on a table) until it sits just below the top face. Turn the
    knob over to check it stays in.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Thread the M3 bolt in from the bottom through the small hole, into the nut
    and out the top. Turn the knob by hand to tighten.
  parts:
  - knob
  hardware:
  - nut
  tool: null
