task: nut-knob/M3
note: Ergonomic 20 mm M3 hand knob with 6 scalloped finger grips, solid retaining
  shoulder, through-bolt clearance hole, and friction-fit nut pocket verified via
  test coupon.
questions: []
params:
  flute_count:
    value: 6
    unit: count
    kind: design
    source: design
    note: Number of scalloped finger grips
  knob_height:
    value: 10
    unit: mm
    kind: design
    source: design
    note: Overall height of the hand knob
  bolt_clearance_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: Diameter of bolt clearance through-hole
  pocket_depth:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: Depth of nut pocket from top face
  nut_af_pocket:
    value: 5.7
    unit: mm
    kind: design
    source: measured
    note: Width across flats for hex nut pocket, tested and verified on test coupon
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal height of ISO 4032 M3 hex nut
  flute_r:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: Radius of scalloped finger grips
  bolt_d_nominal:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal diameter of M3 bolt
  nut_af_nominal:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal width across flats for ISO 4032 M3 hex nut
  knob_outer_d:
    value: 20
    unit: mm
    kind: design
    source: design
    note: Outer diameter across knob lobes
parts:
- id: m3_hand_knob
  role: final
  material: PLA
  code: "import math\nimport cadquery as cq\n\ndef hex_points(af):\n    R = af / math.sqrt(3.0)\n\
    \    return [\n        (R * math.cos(math.radians(30 + k * 60)), R * math.sin(math.radians(30\
    \ + k * 60)))\n        for k in range(6)\n    ]\n\ndef build(p):\n    H = p.knob_height\n\
    \    R_outer = p.knob_outer_d / 2.0\n\n    # Base cylinder\n    res = cq.Workplane(\"\
    XY\").circle(R_outer).extrude(H)\n\n    # 6 ergonomic scalloped finger flutes\
    \ around the perimeter\n    flute_pts = [\n        (\n            R_outer * math.cos(math.radians(k\
    \ * 360.0 / p.flute_count)),\n            R_outer * math.sin(math.radians(k *\
    \ 360.0 / p.flute_count)),\n        )\n        for k in range(int(p.flute_count))\n\
    \    ]\n\n    res = (\n        res.workplane(offset=0)\n        .pushPoints(flute_pts)\n\
    \        .circle(p.flute_r)\n        .cutThruAll()\n    )\n\n    # M3 through-hole\
    \ through the entire knob\n    res = (\n        res.faces(\">Z\")\n        .workplane()\n\
    \        .circle(p.bolt_clearance_d / 2.0)\n        .cutThruAll()\n    )\n\n \
    \   # Hex nut pocket from top face down to pocket_depth\n    res = (\n       \
    \ res.faces(\">Z\")\n        .workplane()\n        .polyline(hex_points(p.nut_af_pocket))\n\
    \        .close()\n        .cutBlind(-p.pocket_depth)\n    )\n\n    return res\n"
  print_orientation: Z=0 flat bottom face on print bed, pocket opening facing up (+Z)
  use_orientation: Flat bottom face seats against the clamped surface; bolt passes
    through nut and through-hole
hardware:
- id: m3_nut
  ref: ISO 4032 M3
  qty: 1
- id: m3_screw
  ref: ISO 4762 M3x20
  qty: 1
joints:
- id: knob_bolt_assembly
  fastener: m3_screw
  axis_origin:
  - 0.0
  - 0.0
  - 10.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: m3_hand_knob
    feature: nut_pocket
    role: nut_pocket
  - part: m3_hand_knob
    feature: clearance_hole
    role: clearance
  nut: m3_nut
  external: null
criteria:
- id: nut_retention_fit
  part: m3_hand_knob
  feature: nut_pocket
  relation: contains
  hardware: m3_nut
  clearance_mm: 0.2
  params:
  - nut_af_pocket
  - nut_af_nominal
  check:
    method: coupon
    ref: coupon_nut_pocket
    description: Nut pocket width across flats (5.70 mm) verified on printed test
      coupon to allow pressing in by hand and retaining the nut upside down without
      falling out.
- id: nut_fully_inside
  part: m3_hand_knob
  feature: nut_pocket
  relation: seats
  hardware: m3_nut
  clearance_mm: 1.1
  params:
  - pocket_depth
  - nut_h
  check:
    method: measure
    ref: null
    description: Nut pocket depth of 3.5 mm fully encloses the 2.4 mm thick nut with
      a 6.5 mm solid shoulder preventing it from being pushed out the far side.
- id: bolt_pass_through
  part: m3_hand_knob
  feature: clearance_hole
  relation: clears
  hardware: m3_screw
  clearance_mm: 0.4
  params:
  - bolt_clearance_d
  - bolt_d_nominal
  check:
    method: none
    ref: null
    description: 3.4 mm diameter clearance hole through the shoulder allows the M3
      bolt to pass freely through the nut and out the far side.
manual:
- n: '1'
  text: Print the m3_hand_knob with its flat bottom surface on the build plate (Z=0).
    No supports are required.
  parts:
  - m3_hand_knob
  hardware: []
  tool: null
- n: '2'
  text: Orient the ISO 4032 M3 hex nut over the hexagonal pocket on the top face of
    the knob. Press the nut firmly into the pocket by hand until it bottoms out against
    the internal shoulder. The nut sits fully inside the knob and is retained by friction.
  parts:
  - m3_hand_knob
  hardware:
  - m3_nut
  tool: null
- n: '3'
  text: Thread the knob onto an M3 bolt (or insert an M3 bolt through the clearance
    hole and nut) and tighten by hand using the 6 fluted grips.
  parts:
  - m3_hand_knob
  hardware:
  - m3_nut
  - m3_screw
  tool: null
