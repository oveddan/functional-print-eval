task: nut-knob/M3
note: Compact 20 mm diameter ergonomic 6-lobed thumb knob for M3 bolt with empirically
  verified press-fit retention for ISO 4032 M3 hex nut. Prints completely without
  supports.
questions: []
params:
  bolt_clearance_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: Clearance hole diameter for M3 bolt through-shaft
  scallop_r:
    value: 2.8
    unit: mm
    kind: design
    source: design
    note: Radius of cylindrical finger grip scallop cuts
  nut_h_nominal:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal thickness of ISO 4032 M3 hex nut
  knob_top_chamfer:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Chamfer on top rim for finger comfort
  knob_height:
    value: 8
    unit: mm
    kind: design
    source: design
    note: Total height of knob
  nut_pocket_af:
    value: 5.7
    unit: mm
    kind: design
    source: design
    note: Hex pocket across flats width, validated on Bambu X1C coupon for snug press-fit
      and inversion retention
  knob_outer_d:
    value: 20
    unit: mm
    kind: design
    source: design
    note: Outer diameter across knob crests
  nut_pocket_depth:
    value: 3
    unit: mm
    kind: design
    source: design
    note: Pocket depth so 2.4 mm nut sits fully inside the knob with 0.6 mm margin
  scallop_count:
    value: 6
    unit: count
    kind: design
    source: design
    note: Number of finger grip flutes around perimeter
  scallop_dist:
    value: 10.5
    unit: mm
    kind: design
    source: design
    note: Radial distance from knob center to scallop cylinder axes
  nut_af_nominal:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal width across flats for ISO 4032 M3 hex nut
parts:
- id: knob
  role: final
  material: PLA
  code: "import cadquery as cq\nimport math\n\ndef build(p):\n    # 1. Base cylinder\n\
    \    knob = (\n        cq.Workplane(\"XY\")\n        .circle(p.knob_outer_d /\
    \ 2.0)\n        .extrude(p.knob_height)\n        .edges(\">Z\")\n        .chamfer(p.knob_top_chamfer)\n\
    \    )\n    \n    # 2. Cut 6 ergonomic finger scallops around perimeter\n    scallop_pts\
    \ = [\n        (\n            p.scallop_dist * math.cos(2.0 * math.pi * i / p.scallop_count),\n\
    \            p.scallop_dist * math.sin(2.0 * math.pi * i / p.scallop_count)\n\
    \        )\n        for i in range(int(p.scallop_count))\n    ]\n    scallop_cutter\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=-1.0)\n       \
    \ .pushPoints(scallop_pts)\n        .circle(p.scallop_r)\n        .extrude(p.knob_height\
    \ + 2.0)\n    )\n    knob = knob.cut(scallop_cutter)\n    \n    # 3. Central through-hole\
    \ for M3 bolt clearance\n    knob = (\n        knob.faces(\">Z\")\n        .workplane()\n\
    \        .circle(p.bolt_clearance_d / 2.0)\n        .cutThruAll()\n    )\n   \
    \ \n    # 4. Hexagonal pocket for M3 nut\n    r_hex = (p.nut_pocket_af / 2.0)\
    \ / math.cos(math.radians(30))\n    pts = [\n        (r_hex * math.cos(math.radians(30\
    \ + 60 * i)), r_hex * math.sin(math.radians(30 + 60 * i)))\n        for i in range(6)\n\
    \    ]\n    knob = (\n        knob.faces(\">Z\")\n        .workplane()\n     \
    \   .polyline(pts)\n        .close()\n        .cutBlind(-p.nut_pocket_depth)\n\
    \    )\n    \n    return knob\n"
  print_orientation: z = 0 on bed, flat bottom clamping face on build plate
  use_orientation: z = 0 against clamped workpiece, nut pocket facing operator
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
- id: bolt
  ref: ISO 4762 M3x20
  qty: 1
joints:
- id: knob_joint
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 8.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: nut_pocket
    role: nut_pocket
  - part: knob
    feature: clearance_hole
    role: clearance
  nut: nut
  external: null
criteria:
- id: nut_pocket_fit
  part: knob
  feature: nut_pocket
  relation: seats
  hardware: nut
  clearance_mm: 0.2
  params:
  - nut_pocket_af
  - nut_af_nominal
  check:
    method: coupon
    ref: nut_fit_coupon
    description: 'Verified with nut_fit_coupon on Bambu X1C: 5.70 mm pocket presses
      in snugly by hand and stays retained when turned upside down and shaken.'
- id: nut_pocket_depth_retention
  part: knob
  feature: nut_pocket
  relation: contains
  hardware: nut
  clearance_mm: 0.6
  params:
  - nut_pocket_depth
  - nut_h_nominal
  check:
    method: measure
    ref: null
    description: Nut pocket depth of 3.0 mm fully encloses the 2.4 mm thick nut with
      0.6 mm margin below the top face.
- id: bolt_through_clearance
  part: knob
  feature: clearance_hole
  relation: clears
  hardware: bolt
  clearance_mm: 0.4
  params:
  - bolt_clearance_d
  check:
    method: coupon
    ref: nut_fit_coupon
    description: M3 bolt passes freely through 3.4 mm clearance hole through the bottom
      shoulder.
- id: shoulder_supports_nut
  part: knob
  feature: shoulder
  relation: supports
  hardware: nut
  clearance_mm: 0.0
  params:
  - knob_height
  - nut_pocket_depth
  - bolt_clearance_d
  check:
    method: measure
    ref: null
    description: 5.0 mm thick shoulder prevents the nut from being pushed out through
      the far side.
manual:
- n: '1'
  text: 3D print the knob part in PLA with its flat bottom face on the print bed (z
    = 0 on bed). No supports are required.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Orient the M3 hex nut (ISO 4032) with the hexagonal pocket on the top face
    of the knob. Press the nut firmly into the pocket using thumb pressure until it
    seats flat against the bottom internal shoulder. The nut sits fully recessed inside
    the pocket (0.6 mm below the surface) and remains securely retained by friction
    when inverted.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Thread the M3 bolt through the nut and clearance hole until it exits out the
    far side of the knob. Use the lobed grip around the perimeter to tighten and loosen
    by hand without tools.
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: null
