task: nut-knob/M3
note: M3 hand knob (20 mm diameter) with 6 ergonomic finger flutes and a calibrated
  press-fit hex nut pocket (5.8 mm across-flats) verified via test coupon.
questions: []
params:
  pocket_af:
    value: 5.8
    unit: mm
    kind: design
    source: design
    note: Hex pocket across-flats dimension calibrated via test coupon
  nut_af_nom:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut nominal across-flats
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: design
    note: Nominal outer diameter of knob
  flute_offset:
    value: 10
    unit: mm
    kind: design
    source: design
    note: Radial distance from center to finger flute cutouts
  pocket_depth:
    value: 3.2
    unit: mm
    kind: design
    source: design
    note: Depth of hex nut pocket
  flute_r:
    value: 2
    unit: mm
    kind: design
    source: design
    note: Radius of finger flute cutouts
  num_flutes:
    value: 6
    unit: count
    kind: design
    source: design
    note: Number of ergonomic grip flutes on perimeter
  knob_h:
    value: 8
    unit: mm
    kind: design
    source: design
    note: Total height/thickness of the knob
  nut_h_nom:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut nominal height
  hole_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: Clearance hole diameter for M3 bolt shank
parts:
- id: knob
  role: final
  material: PLA
  code: "def build(p):\n    import cadquery as cq\n    import math\n\n    # Main cylindrical\
    \ knob body\n    knob = cq.Workplane(\"XY\").circle(p.knob_d / 2.0).extrude(p.knob_h)\n\
    \n    # Cut 6 ergonomic finger flutes around the perimeter for tool-free grip\n\
    \    for i in range(int(p.num_flutes)):\n        angle = i * (2.0 * math.pi /\
    \ p.num_flutes)\n        cx = p.flute_offset * math.cos(angle)\n        cy = p.flute_offset\
    \ * math.sin(angle)\n        cutter = (\n            cq.Workplane(\"XY\")\n  \
    \          .workplane(offset=-1.0)\n            .transformed(offset=(cx, cy, 0))\n\
    \            .circle(p.flute_r)\n            .extrude(p.knob_h + 2.0)\n      \
    \  )\n        knob = knob.cut(cutter)\n\n    # M3 through-hole allowing bolts\
    \ of any length to pass completely through\n    knob = knob.faces(\">Z\").workplane().circle(p.hole_d\
    \ / 2.0).cutThruAll()\n\n    # Hex nut pocket from the top face\n    # In CadQuery,\
    \ polygon(6, dia) creates a hexagon inscribed in circle of diameter `dia`.\n \
    \   # Across-flats (af) relates to across-corners diameter as: dia = af / cos(30\
    \ deg).\n    hex_dia = p.pocket_af / math.cos(math.pi / 6.0)\n    knob = knob.faces(\"\
    >Z\").workplane().polygon(6, hex_dia).cutBlind(-p.pocket_depth)\n\n    return\
    \ knob\n"
  print_orientation: Bottom flat face on build plate (Z=0)
  use_orientation: Grip circumference accessible by fingers; hex pocket facing up/forward
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints:
- id: nut_pocket_joint
  fastener: nut
  axis_origin:
  - 0.0
  - 0.0
  - 8.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: hex_pocket
    role: nut_pocket
  nut: null
  external: null
criteria:
- id: nut_retention
  part: knob
  feature: hex_pocket
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - pocket_af
  - pocket_depth
  check:
    method: coupon
    ref: null
    description: Hex pocket holds M3 hex nut with a hand press fit and retains it
      when inverted
- id: bolt_clearance
  part: knob
  feature: through_hole
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - hole_d
  check:
    method: measure
    ref: null
    description: M3 bolt passes freely through the knob
- id: shoulder_stop
  part: knob
  feature: pocket_shoulder
  relation: seats
  hardware: nut
  clearance_mm: null
  params:
  - pocket_depth
  - knob_h
  check:
    method: measure
    ref: null
    description: Internal shoulder prevents nut from pushing out through the far side
manual:
- n: '1'
  text: Print the knob flat on the print bed (bottom face at Z=0). No supports are
    required.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '2'
  text: Align an ISO 4032 M3 hex nut with the hexagonal pocket on the top face of
    the knob.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Press the nut straight into the pocket by hand until it bottoms out against
    the internal shoulder. The nut will sit completely inside the pocket (recessed
    ~0.8 mm).
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Turn the knob upside down to confirm retention; the friction fit keeps the
    nut securely seated without glue.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Thread your M3 bolt through the clearance hole and nut as needed.
  parts:
  - knob
  hardware:
  - nut
  tool: null
