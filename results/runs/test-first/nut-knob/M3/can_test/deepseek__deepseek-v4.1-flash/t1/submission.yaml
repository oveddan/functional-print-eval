task: nut-knob/M3
note: 'One printed knob, 20 mm across × 8 mm tall, with six finger flutes, printed
  mouth-down with no supports. A standard ISO 4032 M3 nut presses into the hex pocket
  in the mouth: a 0.6 mm/45° funnel centres it, its six corners snap past the 6.2
  mm lip, and it ends up completely inside the knob where it is captive both ways
  — the lip catches the corners (6.2 mm bore is below the nut''s 6.35 mm across-corners)
  so it can''t drop out of the mouth, and the roof above the pocket is solid except
  for the 3.4 mm bolt hole so it can''t be pushed out the far side. The 3.4 mm hole
  in the top face takes the bolt, which threads through the nut and out through the
  mouth bore. Lip bore 6.2 mm = puck 3 of the coupon you already printed (that puck
  pressed in by hand and held the nut when inverted and shaken, same as all four variants);
  catalog nut dimensions were used because the nut could not be measured. Use an M3
  bolt of 8 mm or more under the head.'
questions:
- text: How long is your M3 bolt, measured under the head? The design wants about
    7 mm of bolt just to reach through the knob and thread the nut, and roughly 8
    mm or more so the tip actually comes out of the mouth.
  answer: null
- text: Is your nut a plain ISO 4032 M3 hex nut (about 5.5 mm across the flats, 2.4
    mm thick)? The knob's pocket and lip were sized from those catalog values because
    the nut itself could not be measured, and the coupon confirmed that nut presses
    in and stays in.
  answer: null
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut, width across flats. Real nut could not be measured.
  nut_ac:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: across corners = nut_af / cos30. The lip bore must stay below this to catch
      the nut's corners.
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 nut height
  bolt_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: M3 nominal shank diameter
  bolt_slip:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: diametral clearance on the bolt -> 3.4 mm hole in the top face
  hole_cham:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: 45 deg lead-in on the bolt hole, opens upward so it prints self-supporting
  pocket_clear:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: diametral clearance of the hex pocket over the nut's across flats -> 5.7
      mm pocket; felt snug in the coupon
  pocket_gap:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: gap from the nut to the pocket ceiling so the bolt can clamp the nut against
      the roof
  lip_id:
    value: 6.2
    unit: mm
    kind: design
    source: design
    note: 'retaining lip bore, chosen from the coupon (puck 3): pressed in by hand
      and held the nut when inverted; below the nut''s 6.35 mm across-corners'
  lip_h:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: height of the lip at the mouth
  lip_cham:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: 45 deg entry funnel that guides and cams the nut past the lip
  knob_d:
    value: 20.0
    unit: mm
    kind: design
    source: asked
    note: user asked for about 20 mm across; flutes keep this as the max outside diameter
  knob_h:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: 'overall printed height. Stack: 1.0 lip + 2.55 pocket + 4.45 roof.'
  top_round:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: round-over of the top rim, applied to the fluted profile as a revolved cut
      so it is a convex surface
  flute_n:
    value: 6
    unit: count
    kind: design
    source: design
    note: finger scallops around the rim
  flute_r:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: scallop cylinder radius
  flute_pitch:
    value: 9.5
    unit: mm
    kind: design
    source: design
    note: scallop cylinder centre distance from the axis; cuts 3.0 mm deep, leaving
      a 14 mm waist and a 3.7 mm wall to the pocket
  puck_d:
    value: 14.0
    unit: mm
    kind: design
    source: design
    note: coupon puck diameter
  puck_h:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: coupon puck height
  puck_pitch:
    value: 18.0
    unit: mm
    kind: design
    source: design
    note: coupon puck spacing
  lip_a:
    value: 5.8
    unit: mm
    kind: design
    source: design
    note: coupon puck 1 (1 pip)
  lip_b:
    value: 6.0
    unit: mm
    kind: design
    source: design
    note: coupon puck 2 (2 pips)
  lip_c:
    value: 6.2
    unit: mm
    kind: design
    source: design
    note: coupon puck 3 (3 pips) - the variant used in the finished knob
  lip_d:
    value: 6.4
    unit: mm
    kind: design
    source: design
    note: coupon puck 4 (4 pips), equal to the nut's across-corners - the loose limit
  pip_r:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: coupon pip circle radius
  pip_d:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: coupon pip hole diameter
  pip_depth:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: coupon pip hole depth
parts:
- id: knob
  role: final
  material: PLA (high-speed PLA, black), 0.4 mm nozzle, 0.2 mm layers
  code: "import cadquery as cq\nimport math\n\n\ndef build(p):\n    R = p.knob_d /\
    \ 2.0\n    H = p.knob_h\n    lip_h = p.lip_h\n    cham = p.lip_cham\n    lr =\
    \ p.lip_id / 2.0\n    z0 = cham - 0.05\n    depth = p.nut_h + p.pocket_gap\n \
    \   circum = (p.nut_af + p.pocket_clear) / math.sqrt(3.0)\n    bolt_r = (p.bolt_d\
    \ + p.bolt_slip) / 2.0\n    f = p.top_round\n    hexpts = [(circum * math.cos(math.radians(60\
    \ * i)),\n               circum * math.sin(math.radians(60 * i))) for i in range(6)]\n\
    \n    def cyl(r, h, x, y, z):\n        return cq.Workplane(obj=cq.Solid.makeCylinder(r,\
    \ h, cq.Vector(x, y, z)))\n\n    # knob blank\n    body = cq.Workplane(\"XY\"\
    ).circle(R).extrude(H)\n\n    # finger flutes, cut full height\n    n = int(p.flute_n)\n\
    \    for i in range(n):\n        a = 2.0 * math.pi * i / n\n        body = body.cut(cyl(p.flute_r,\
    \ H + 4.0,\n                            p.flute_pitch * math.cos(a), p.flute_pitch\
    \ * math.sin(a), -2.0))\n\n    # round over the top rim: ring cutter minus torus\
    \ (convex surface, prints unsupported)\n    ring = (cq.Workplane(\"XY\").circle(R\
    \ + 4.0).extrude(f + 4.0)\n            .cut(cq.Workplane(\"XY\").circle(R - f).extrude(f\
    \ + 4.0))\n            .translate((0, 0, H - f)))\n    torus = cq.Workplane(obj=cq.Solid.makeTorus(R\
    \ - f, f, cq.Vector(0, 0, H - f)))\n    body = body.cut(ring.cut(torus))\n\n \
    \   # hex nut pocket, opening at the mouth\n    body = body.cut(cq.Workplane(\"\
    XY\").polyline(hexpts).close()\n                    .extrude(depth).translate((0,\
    \ 0, lip_h)))\n\n    # mouth: entry funnel then the retaining lip bore\n    body\
    \ = body.cut(cq.Workplane(obj=cq.Solid.makeCone(lr + cham, lr, cham)))\n    body\
    \ = body.cut(cyl(lr, lip_h - z0, 0, 0, z0))\n\n    # bolt clearance hole through\
    \ the roof, plus its lead-in chamfer\n    body = body.cut(cyl(bolt_r, H + 2.0,\
    \ 0, 0, -1.0))\n    body = body.cut(cq.Workplane(obj=cq.Solid.makeCone(bolt_r,\
    \ bolt_r + p.hole_cham, p.hole_cham,\n                                       \
    \                cq.Vector(0, 0, H - p.hole_cham))))\n    return body\n"
  print_orientation: 'Mouth face (nut entry: the 6.2 mm funnel bore) flat on the bed
    at z = 0, top face with the 3.4 mm bolt hole up. Every wall is vertical, the entry
    funnel is a 45 deg inward step and the top round-over is convex, so nothing overhangs
    or bridges - no supports.'
  use_orientation: As printed, mouth down. Nut pressed in from the mouth; bolt enters
    the 3.4 mm hole in the top face, threads through the captured nut and leaves through
    the mouth bore.
- id: coupon
  role: coupon
  material: PLA
  code: "import cadquery as cq\nimport math\n\n\ndef build(p):\n    R = p.puck_d /\
    \ 2.0\n    H = p.puck_h\n    lip_h = p.lip_h\n    cham = p.lip_cham\n    z0 =\
    \ cham - 0.05\n    depth = p.nut_h + p.pocket_gap\n    circum = (p.nut_af + p.pocket_clear)\
    \ / math.sqrt(3.0)\n    bolt_r = (p.bolt_d + p.bolt_slip) / 2.0\n    hexpts =\
    \ [(circum * math.cos(math.radians(60 * i)),\n               circum * math.sin(math.radians(60\
    \ * i))) for i in range(6)]\n\n    def cyl(r, h, x, y, z):\n        return cq.Workplane(obj=cq.Solid.makeCylinder(r,\
    \ h, cq.Vector(x, y, z)))\n\n    parts = []\n    for i, lip in enumerate([p.lip_a,\
    \ p.lip_b, p.lip_c, p.lip_d]):\n        lr = lip / 2.0\n        w = cq.Workplane(\"\
    XY\").circle(R).extrude(H)\n        w = w.cut(cq.Workplane(\"XY\").polyline(hexpts).close()\n\
    \                  .extrude(depth).translate((0, 0, lip_h)))\n        w = w.cut(cq.Workplane(obj=cq.Solid.makeCone(lr\
    \ + cham, lr, cham)))\n        w = w.cut(cyl(lr, lip_h - z0, 0, 0, z0))\n    \
    \    w = w.cut(cyl(bolt_r, H + 2.0, 0, 0, -1.0))\n        for k in range(i + 1):\n\
    \            a = math.radians(90.0 + (k - i / 2.0) * 32.0)\n            w = w.cut(cyl(p.pip_d\
    \ / 2.0, p.pip_depth + 0.3,\n                          p.pip_r * math.cos(a),\
    \ p.pip_r * math.sin(a), H - p.pip_depth))\n        parts.append(w.val().translate(cq.Vector(i\
    \ * p.puck_pitch, 0, 0)))\n    return cq.Compound.makeCompound(parts)\n"
  print_orientation: Nut-entry face (funnel + retaining lip) down on the bed; identification
    pips up. Four pucks in a row, no supports.
  use_orientation: As printed; nut inserted from the bed-side face (the one without
    pips). Pips count 1-4 = lip bore 5.8 / 6.0 / 6.2 / 6.4 mm.
