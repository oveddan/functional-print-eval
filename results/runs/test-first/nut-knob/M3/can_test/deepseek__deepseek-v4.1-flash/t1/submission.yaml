manual:
- n: '0'
  text: 'Print check (already done): the four-puck coupon showed the M3 nut presses
    in by hand and stays in when inverted at every lip size. Puck 3 (three pips, 6.2
    mm lip bore) is the one this knob copies - re-print it only if you want to re-confirm.'
  parts:
  - coupon
  hardware:
  - nut
  tool: null
- n: '1'
  text: Print knob.stl (1 off) in PLA, 0.2 mm layers, 0.4 mm nozzle. Put the mouth
    face - the one with the wide funnel bore - flat on the bed, top face with the
    small hole up. No supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: 'Identify the faces: the bed face has a 6.2 mm bore with a funnel mouth (nut
    entry); the opposite face has a 3.4 mm hole (bolt entry). Everything else is the
    fluted grip and the rounded top.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: 'Press the M3 hex nut (ISO 4032 M3) into the mouth: line the nut''s flats
    up with the hex pocket and push with your thumb. The funnel centres it and the
    nut''s corners snap past the lip; it ends up fully inside, resting on the lip
    shoulder.'
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: 'Check it is captive: turn the knob mouth-down and shake - the nut stays in
    (the lip catches its corners). Try to push the nut out the other way with a bolt
    or fingertip - it cannot pass the 3.4 mm hole. No glue needed.'
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Thread the M3 bolt down through the 3.4 mm hole in the top face and into the
    nut. The hex pocket stops the nut turning. Turn the bolt (2.5 mm hex key for a
    socket head) until it bites, then turn the knob itself to drive it. The tip comes
    through the nut and out of the mouth bore.
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: 2.5 mm hex key (for the socket head bolt)
- n: '6'
  text: 'Use it: the knob is now locked to the bolt (head on the top face, nut clamped
    against the roof), so turning the fluted rim turns the bolt and you can tighten
    by hand. Any M3 bolt of 8 mm or more under the head works; the listed M3x16 leaves
    about 8 mm sticking out of the mouth, a shorter one still reaches the nut but
    may not show past it.'
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: null
