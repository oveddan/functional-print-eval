manual:
- n: '1'
  text: 'Print ''knob'' exactly as exported: the plain fluted face (the one with the
    3.4 mm hole in the middle) on the bed, the hexagonal socket opening upward. PLA,
    0.4 mm nozzle, 0.2 mm layers. No supports, no bridges, no brim needed - every
    wall is vertical.'
  parts:
  - knob
  hardware: []
  tool: 3D printer (Bambu Lab X1C, 0.2 mm layers)
- n: '2'
  text: 'Fettle the socket: pick any strings or blobs out of the hexagonal socket
    with a fingernail or the back of a blade. The mouth starts with a 1.0 mm deep,
    wider counterbore (6.65 mm across the flats) - that is the lead-in the nut drops
    into.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Press the M3 hex nut into the socket with a firm straight push of the thumb,
    either flat face leading. It should stop when it seats on the socket floor, leaving
    the nut's outer face 0.6 mm inside the knob's mouth. If it is stiff, squeeze it
    home with a small clamp or tap it with a mallet on a block of wood. No glue.
  parts:
  - knob
  hardware:
  - nut_m3
  tool: null
- n: '4'
  text: 'Retention check: turn the knob over so the socket faces the floor and give
    it a shake. The nut must stay in - the press fit is the only thing holding it.'
  parts:
  - knob
  hardware:
  - nut_m3
  tool: null
- n: '5'
  text: 'Check your bolt: you need an M3 bolt with at least about 5 mm of thread standing
    free of the surface you are clamping, because the bolt has to pass right through
    the nut (whose inner face is 3.0 mm inside the knob). A 20 mm socket head screw
    is the reference example - change the length to suit your part.'
  parts: []
  hardware:
  - bolt_m3
  tool: null
- n: '6'
  text: 'Thread the knob on: bring the socket down over the bolt''s protruding thread
    and turn the knob clockwise. The bolt threads through the captive nut and its
    tip comes out through the 3.4 mm hole in the knob''s plain top face - through
    the nut and out the far side.'
  parts:
  - knob
  hardware:
  - nut_m3
  - bolt_m3
  tool: null
- n: '7'
  text: 'Tighten by hand: seat the flat rim around the socket mouth against your part
    and turn the knob clockwise. The hexagonal socket locks the nut against rotation,
    so the knob screws down the bolt and its plastic rim presses on your part. The
    bolt tip standing proud of the top face is normal.'
  parts:
  - knob
  hardware:
  - nut_m3
  - bolt_m3
  tool: null
