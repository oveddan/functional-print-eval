task: nut-knob/M3
note: 'One printed part: a 20 mm fluted hand knob with a captive M3 hex nut.


  How it works: the knob has a hexagonal socket in its underside (as printed, it opens
  at the top). The nut is a hand press fit into that socket. The socket floor is 3.0
  mm deep, so the 2.4 mm nut seats 0.6 mm inside the knob''s mouth and is fully enclosed.
  The floor leaves only a 3.4 mm M3 clearance hole, far smaller than the nut''s 5.5
  mm across-flats, so the nut cannot be pushed out the far side. Your bolt enters
  the socket from below, threads right through the captive nut, and its tip exits
  through the 3.4 mm hole in the knob''s plain top face. Because the nut is recessed
  0.6 mm, only the knob''s plastic rim bears against the clamped part.


  Printing: the part is modelled exactly as printed — the plain fluted face (the one
  with the 3.4 mm hole, which is the TOP of the knob in use) sits on the bed and the
  hexagonal socket opens upward. Every wall is vertical, nothing overhangs or bridges,
  so no supports. Turn the knob over after printing and the socket faces down, which
  is the way it is used.


  Open item — the press fit: you printed the 5-pocket fit coupon (5.30 to 5.70 mm
  across flats) but could not report how it came out, so pocket_af is my best judgment:
  5.45 mm, i.e. 0.05 mm under the nut''s nominal across-flats. FDM prints internal
  pockets slightly under nominal, so this should land as a firm hand press that holds
  the nut when the knob is inverted. Note that real ISO 4032 M3 nuts vary in across-flats
  (about 5.35 to 5.50): if yours is at the small end the fit will be a little looser,
  and if it is at the top end it may want a gentle squeeze with a clamp to go home.
  The counterbore lead-in at the socket mouth (0.6 mm wider per side) is there to
  start the nut square.


  The knob suits any M3 bolt with about 5 mm of thread free beyond the surface it
  clamps; a 20 mm socket head screw is listed as the reference example, adjust the
  length to suit your part.'
questions:
- text: How did the nut press in - loose enough to fall out, a firm hand press, or
    did it need a clamp?
  answer: null
