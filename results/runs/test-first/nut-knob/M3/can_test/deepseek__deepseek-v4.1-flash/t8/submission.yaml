  flute_n:
    value: 10
    unit: count
    kind: design
    source: design
    note: number of grip flutes around the rim
  flute_depth:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: radial depth of the grip flutes; grip diameter runs 17.6 to 20 mm
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut, width across flats; person could not measure their
      own nut
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut height
  bolt_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: M3 bolt nominal major diameter
  pocket_af:
    value: 5.45
    unit: mm
    kind: design
    source: design
    note: hex socket across flats, 0.05 mm under the nut's nominal across-flats so
      the printed socket grips it; main uncertainty of the design
  pocket_depth:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: socket depth; with the 2.4 mm nut seated on the floor the nut is fully inside,
      0.6 mm in from the mouth
  pocket_lead_depth:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: depth of the wider counterbore lead-in at the socket mouth
  pocket_lead_step:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: extra half-width per side of the lead-in vs the gripping socket (6.65 mm
      across flats)
  nut_recess:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: 'pocket_depth - nut_h: how far the seated nut''s outer face sits inside
      the knob''s mouth'
  bolt_clear_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: M3 clearance hole through the socket floor and out the top face; also what
      blocks the nut from being pushed out the far side
parts:
- id: knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "import cadquery as cq\nimport math\n\ndef hex_pts(af):\n    ac = af / math.cos(math.pi\
    \ / 6.0)\n    return [(ac * math.cos(math.pi / 6.0 + k * math.pi / 3.0),\n   \
    \          ac * math.sin(math.pi / 6.0 + k * math.pi / 3.0)) for k in range(6)]\n\
    \ndef build(p):\n    # fluted grip body, built in the print orientation (z=0 on\
    \ the bed)\n    R = p.knob_d / 2.0\n    n = int(p.flute_n)\n    N = 200\n    Rm\
    \ = R - p.flute_depth / 2.0\n    A = p.flute_depth / 2.0\n    prof = []\n    for\
    \ i in range(N):\n        th = 2.0 * math.pi * i / N\n        r = Rm + A * math.cos(n\
    \ * th)\n        prof.append((r * math.cos(th), r * math.sin(th)))\n    body =\
    \ cq.Workplane(\"XY\").polyline(prof).close().extrude(p.knob_h)\n\n    zf = p.knob_h\
    \ - p.pocket_depth      # socket floor\n    zb = p.knob_h - p.pocket_lead_depth\
    \ # lead-in floor\n\n    # hex nut socket, opening at the top of the print\n \
    \   hp = hex_pts(p.pocket_af)\n    body = body.cut(cq.Workplane(\"XY\").workplane(offset=zf)\n\
    \                    .polyline(hp).close().extrude(p.pocket_depth + 1.0))\n\n\
    \    # wider counterbore lead-in at the socket mouth so the nut starts square\n\
    \    hp2 = hex_pts(p.pocket_af + 2.0 * p.pocket_lead_step)\n    body = body.cut(cq.Workplane(\"\
    XY\").workplane(offset=zb)\n                    .polyline(hp2).close().extrude(p.pocket_lead_depth\
    \ + 1.0))\n\n    # M3 bolt clearance hole: from the bed up through the socket\
    \ floor\n    body = body.cut(cq.Workplane(\"XY\").workplane(offset=-0.5)\n   \
    \                 .circle(p.bolt_clear_d / 2.0).extrude(zf + 0.6))\n    return\
    \ body\n"
  print_orientation: 'Fluted plain face down on the bed: z=0 is the knob''s TOP face
    in use (the flat fluted disc with the 3.4 mm hole in the middle). The grip flutes
    run vertically and the hexagonal nut socket opens upward at the top of the print,
    with its wider counterbore lead-in at the very top. No supports or bridges.'
  use_orientation: 'Turned over from the print: the hexagonal socket faces DOWN toward
    the part being clamped; the plain fluted disc with the 3.4 mm hole faces up. Your
    M3 bolt comes up into the socket from below, threads through the pressed-in nut,
    and its tip exits through the 3.4 mm hole in the top face. The flat rim around
    the socket mouth is the bearing face.'
