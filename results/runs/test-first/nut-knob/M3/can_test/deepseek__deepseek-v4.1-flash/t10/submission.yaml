task: nut-knob/M3
note: 'One printed piece: a 20 mm fluted hand knob with a 5.7 mm across-flats hex
  pocket in the top face for the M3 nut (press fit, no glue), a 2.5 mm floor with
  a 3.5 mm bolt clearance hole so the nut can never be pushed out the far side, and
  a 12 x 4.9 mm relief in the underside so a short bolt only has to cross the floor
  (about 6 mm of thread past your workpiece) before threading through the nut and
  out the top. The pocket size comes from the printed coupon: 5.70 pressed in by hand
  and held the nut upside-down, 5.60 and below would not go in, 5.80 was looser. Prints
  flat, no supports, no overhangs beyond a small internal bridge (the relief ceiling).'
questions:
- text: How long is your M3 bolt (and how thick is the stuff it clamps)? If it is
    shorter than about 9 mm under the head, the knob's 10 mm height will not be usable
    on a real workpiece and I would shorten the grip or deepen the relief.
  answer: null
- text: Was the nut hard enough to press in on the coupon that you would want it a
    touch looser (5.75) even at the risk of it not holding upside-down?
  answer: null
params:
  knob_od:
    value: 20
    unit: mm
    kind: world
    source: asked
    note: grip diameter, from the request 'about 20 mm across'
  knob_h:
    value: 10
    unit: mm
    kind: design
    source: design
    note: overall height of the knob; also the grip length
  rim_chamfer:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: chamfer on the top and bottom rims of the grip
  flute_n:
    value: 12
    unit: count
    kind: design
    source: design
    note: finger scallops, vertical walls so they print without support
  flute_r:
    value: 1.8
    unit: mm
    kind: design
    source: design
    note: radius of the cutter that scoops each scallop
  flute_depth:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: how deep each scallop bites into the 20 mm grip
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 nut across flats (nominal; not measured, the person couldn't)
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 nut height
  pocket_af:
    value: 5.7
    unit: mm
    kind: design
    source: design
    note: 'pocket width across flats, chosen from the printed coupon: 5.70 pressed
      in by hand and held the nut upside-down, 5.60 and below would not go in at all'
  pocket_depth:
    value: 2.6
    unit: mm
    kind: design
    source: design
    note: nut height 2.4 + 0.2, so the nut sits fully inside the knob
  lead_d:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: depth of the lead-in at the mouth of the pocket
  lead_clear:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: lead-in is this much bigger across flats than the pocket, so the nut starts
      square
  hole_d:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: M3 bolt clearance hole through the pocket floor
  floor_t:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: material between the pocket floor and the underside relief; the nut rests
      on it
  cavity_d:
    value: 12
    unit: mm
    kind: design
    source: design
    note: underside relief diameter, so the bolt only has to cross the floor
  cavity_h:
    value: 4.9
    unit: mm
    kind: design
    source: design
    note: relief depth = knob_h - pocket_depth - floor_t
  bolt_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: M3 nominal major diameter
  min_thread:
    value: 6.0
    unit: mm
    kind: design
    source: design
    note: 'bolt thread needed beyond the workpiece: floor 2.5 + nut 2.4 + about 1
      mm of tip out the top'
  c_l:
    value: 30
    unit: mm
    kind: design
    source: design
    note: coupon plate length
  c_w:
    value: 20
    unit: mm
    kind: design
    source: design
    note: coupon plate width
  c_t:
    value: 6
    unit: mm
    kind: design
    source: design
    note: coupon plate thickness
parts:
- id: knob
  role: final
  material: PLA (high-speed black)
  code: "import cadquery as cq\n\ndef build(p):\n    od = p.knob_od\n    h = p.knob_h\n\
    \    k = 1.0 / 0.8660254037844387   # across-corners = across-flats / cos(30 deg)\n\
    \n    # grip body, printed with the underside on the bed\n    body = cq.Workplane(\"\
    XY\").circle(od / 2.0).extrude(h)\n    body = body.faces(\">Z\").edges().chamfer(p.rim_chamfer)\n\
    \    body = body.faces(\"<Z\").edges().chamfer(p.rim_chamfer)\n\n    # finger\
    \ scallops: vertical walls, so they need no support\n    cut_d = od / 2.0 - p.flute_depth\
    \ + p.flute_r\n    flutes = (cq.Workplane(\"XY\")\n              .workplane(offset=-1.0)\n\
    \              .polarArray(cut_d, 0.0, 360.0, p.flute_n)\n              .circle(p.flute_r)\n\
    \              .extrude(h + 2.0))\n    body = body.cut(flutes)\n\n    # hex nut\
    \ pocket, cut down from the top face (same pocket as the tested coupon)\n    pocket\
    \ = (cq.Workplane(\"XY\")\n              .workplane(offset=h - p.pocket_depth)\n\
    \              .polygon(6, p.pocket_af * k)\n              .extrude(p.pocket_depth\
    \ + 1.0))\n    body = body.cut(pocket)\n\n    # lead-in at the mouth of the pocket\
    \ so the nut starts square\n    lead = (cq.Workplane(\"XY\")\n            .workplane(offset=h\
    \ - p.lead_d)\n            .polygon(6, (p.pocket_af + p.lead_clear) * k)\n   \
    \         .extrude(p.lead_d + 1.0))\n    body = body.cut(lead)\n\n    # underside\
    \ relief: leaves only the floor for the bolt to cross\n    cavity = (cq.Workplane(\"\
    XY\")\n              .workplane(offset=-1.0)\n              .circle(p.cavity_d\
    \ / 2.0)\n              .extrude(p.cavity_h + 1.0))\n    body = body.cut(cavity)\n\
    \n    # bolt clearance hole through the pocket floor\n    bore = (cq.Workplane(\"\
    XY\")\n            .workplane(offset=-1.0)\n            .circle(p.hole_d / 2.0)\n\
    \            .extrude(h + 2.0))\n    body = body.cut(bore)\n\n    return body\n"
  print_orientation: 'underside flat on the bed: the bottom face (with the 12 mm relief
    in it) sits on the bed, the hex nut pocket opens upward (+Z); no supports anywhere'
  use_orientation: 'as printed: M3 nut pressed down into the top pocket, M3 bolt fed
    up from underneath through the 12 mm relief and the 3.5 mm floor hole, threaded
    through the nut and out the top of the pocket; the flutes are the finger grip'
- id: coupon_pocket_check
  role: coupon
  material: PLA (high-speed black)
  code: "import cadquery as cq\n\ndef build(p):\n    t = p.c_t\n    k = 1.0 / 0.8660254037844387\n\
    \    plate = cq.Workplane(\"XY\").box(p.c_l, p.c_w, t, centered=(True, True, False))\n\
    \n    # same pocket, lead-in and floor hole as the knob\n    pocket = (cq.Workplane(\"\
    XY\")\n              .workplane(offset=t - p.pocket_depth)\n              .polygon(6,\
    \ p.pocket_af * k)\n              .extrude(p.pocket_depth + 1.0))\n    plate =\
    \ plate.cut(pocket)\n\n    lead = (cq.Workplane(\"XY\")\n            .workplane(offset=t\
    \ - p.lead_d)\n            .polygon(6, (p.pocket_af + p.lead_clear) * k)\n   \
    \         .extrude(p.lead_d + 1.0))\n    plate = plate.cut(lead)\n\n    bore =\
    \ (cq.Workplane(\"XY\")\n            .workplane(offset=-1.0)\n            .circle(p.hole_d\
    \ / 2.0)\n            .extrude(t + 2.0))\n    plate = plate.cut(bore)\n\n    return\
    \ plate\n"
  print_orientation: flat on the bed, pocket opening upward (+Z), no supports
  use_orientation: 'press the M3 nut into the pocket and turn the plate pocket-down:
    the nut must stay in, and it must not be pushable out through the 3.5 mm hole
    in the floor'
hardware:
- id: h_nut
  ref: ISO 4032 M3
  qty: 1
- id: h_bolt
  ref: ISO 4762 M3x20
  qty: 1
joints:
- id: j_bolt
  fastener: h_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: 3.5 mm bolt clearance hole through the pocket floor
    role: clearance
  nut: h_nut
  external: 'your workpiece: the bolt head and the clamped parts sit below the knob,
    so with a zero-thickness workpiece the head''s bearing face is at the knob''s
    bottom face (z = 0)'
criteria:
- id: c_nut_pressfit
  part: knob
  feature: hex nut pocket, 5.7 across flats, 2.6 deep, 0.8 mm lead-in
  relation: engages
  hardware: h_nut
  clearance_mm: 0.2
  params:
  - pocket_af
  - nut_af
  - pocket_depth
  - lead_d
  - lead_clear
  check:
    method: coupon
    ref: coupon_pocket_check
    description: on the printed coupon the 5.70 across-flats pocket pressed in by
      hand with a firm push and the nut stayed in when the coupon was turned pocket-down
      and shaken; 5.60 and below would not go in at all, 5.80 was noticeably looser
      - so 5.70 is the pocket to print (no glue, friction only)
- id: c_nut_capture
  part: knob
  feature: pocket floor (2.5 mm of material) with the 3.5 mm bore through it
  relation: supports
  hardware: h_nut
  clearance_mm: null
  params:
  - floor_t
  - hole_d
  - nut_af
  - cavity_d
  check:
    method: measure
    ref: null
    description: the nut's face bears on the ring of floor around the 3.5 mm hole
      (the nut is 5.5 across flats, its bore 2.5), so the nut cannot be pushed out
      through the far side; the 12 mm relief under it is bigger than the nut so the
      floor is the only thing in the way
- id: c_nut_inside
  part: knob
  feature: pocket depth 2.6 vs nut height 2.4
  relation: contains
  hardware: h_nut
  clearance_mm: null
  params:
  - pocket_depth
  - nut_h
  - knob_h
  check:
    method: measure
    ref: null
    description: the nut's top face ends 0.2 mm below the knob's top face, so the
      nut sits fully inside the knob
- id: c_bolt_clears_floor
  part: knob
  feature: 3.5 mm bore through the pocket floor
  relation: clears
  hardware: h_bolt
  clearance_mm: 0.5
  params:
  - hole_d
  - bolt_d
  - floor_t
  - cavity_h
  check:
    method: measure
    ref: null
    description: an M3 bolt (3.0 mm major) passes the 3.5 mm bore; the 12 mm x 4.9
      mm relief below it means the bolt only has to cross the 2.5 mm floor to reach
      the nut
- id: c_bolt_out_the_top
  part: knob
  feature: open pocket mouth (6.7 across flats lead-in) above the nut
  relation: clears
  hardware: h_bolt
  clearance_mm: null
  params:
  - pocket_af
  - lead_clear
  - pocket_depth
  - nut_h
  check:
    method: none
    ref: null
    description: there is no material above the nut, so the bolt goes through the
      nut and out the mouth of the pocket; the lead-in gives extra clearance for the
      bolt tip
manual:
- n: '1'
  text: 'Print ''knob'' in PLA, 0.2 mm layers, 3 walls, no supports. It is modelled
    ready to print: the flat underside (the ring around the 12 mm relief) sits on
    the bed and the hex nut pocket opens upward.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: 'Optional but quick: print ''coupon_pocket_check'' (a 30 x 20 x 6 mm plate
    with the identical 5.7 mm pocket, lead-in and floor hole) and press the nut into
    it first. It is the same pocket that held the nut in the test print, so it should
    feel the same.'
  parts:
  - coupon_pocket_check
  hardware: []
  tool: null
- n: '3'
  text: Press the ISO 4032 M3 hex nut into the hex pocket in the top face of the knob.
    Start it in the wide lead-in, keep it square to the pocket and press it in with
    your thumb until it bottoms out on the pocket floor. It goes in with a firm push
    - no glue, no tools.
  parts:
  - knob
  hardware:
  - h_nut
  tool: null
- n: '4'
  text: Check the nut's top face is flush or slightly below the knob's top face (about
    0.2 mm below) - that means the nut sits fully inside the knob.
  parts:
  - knob
  hardware:
  - h_nut
  tool: null
- n: '5'
  text: 'Test the retention: turn the knob upside down and tap or shake it - the nut
    must stay in. Then look into the 12 mm relief in the underside: you will see the
    3.5 mm hole in the floor, much smaller than the nut, so the nut rests on that
    floor and can never be pushed out through the far side.'
  parts:
  - knob
  hardware:
  - h_nut
  tool: null
- n: '6'
  text: 'Assemble: push your M3 bolt through the part you are clamping from the far
    side, then feed the bolt''s end into the knob from underneath - through the 12
    mm relief, through the 3.5 mm hole in the floor - and screw it into the nut. Any
    M3 bolt works (the listed ISO 4762 M3x20 is an example) as long as you have about
    6 mm of thread beyond the workpiece, which is all the knob needs.'
  parts:
  - knob
  hardware:
  - h_bolt
  - h_nut
  tool: null
- n: '7'
  text: 'Keep screwing/turning the knob by hand: the hex pocket stops the nut from
    turning, so the bolt is driven in or out as you turn the knob, and the bolt goes
    through the nut and out the top of the pocket. Hand-tight is plenty for M3.'
  parts:
  - knob
  hardware:
  - h_bolt
  - h_nut
  tool: null
- n: '8'
  text: If the nut ever feels loose in the pocket, tell me - I would go one step tighter
    on the pocket (5.60 across flats), but do not force a tighter one in; the tested
    one is 5.7.
  parts:
  - knob
  hardware:
  - h_nut
  tool: null
