    ref: test_d_5p70 (and test_e_5p80)
    description: 'The 5.70 mm pocket printed on your X1C: nut pressed in with hand
      pressure, and stayed in place when the knob was turned over and shaken. 5.80
      also held but looser; 5.60 and under could not be pressed in by hand.'
- id: c2_nut_cannot_be_pushed_out_far_side
  part: knob
  feature: nut_stop_wall_2p4mm_with_3p6_bore
  relation: supports
  hardware: hw_nut
  clearance_mm: null
