task: nut-knob/M3
note: 'One printed knob, 20 mm across x 5.6 mm tall, with 12 vertical grip flutes.
  The ISO 4032 M3 nut presses by hand into a hexagonal pocket in the fluted underside
  and stays put by friction (verified on your printer: the 5.70 mm pocket pressed
  in with a push and the nut stayed in when the knob was turned over and shaken).
  The nut ends up fully inside the knob, 0.8 mm below the rim, sitting on a 2.4 mm
  wall pierced by a 3.6 mm bore: it cannot be pushed out through that far side, and
  a bolt threaded through the nut continues straight out of the 3.6 mm hole in the
  top face, so it can never bottom out. Prints flat, vertically, no supports, no bridges
  longer than 0.65 mm. Use the knob with the fluted, hex-pocket face toward the work
  and the plain face with the small hole on top.'
questions:
- text: How long is your M3 bolt from under the head to the tip, and how thick is
    the part it clamps? The bolt needs 5.6 mm of free thread inside the knob to reach
    the top face. If yours is shorter than that, tell me the free length and I will
    thin the 2.4 mm wall above the nut to 1.6 mm so the tip still comes out.
  answer: null
- text: Is your nut a standard ISO 4032 M3 (5.5 mm across flats, 2.4 mm thick)? If
    it is a thin jam nut, a taller nylock, or a flanged nut, give me its width across
    flats and its height and I will re-cut the pocket - the press fit is sensitive
    to about 0.1 mm.
  answer: null
params:
  bolt_hole_d:
    value: 3.6
    unit: mm
    kind: design
    source: design
    note: M3 clearance bore through the wall above the nut and out of the top face;
      0.6 mm diametral clearance on an M3 shank so the knob starts easily on the bolt
  edge_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: 45 deg break on the top face edge
  edge_chamfer_bot:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: 45 deg break on the underside rim, keeps first layer clean
  flute_count:
    value: 12
    unit: count
    kind: design
    source: design
    note: grip flutes, all vertical so they print with no support
  flute_r:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
  flute_r0:
    value: 9.7
    unit: mm
    kind: design
    source: design
    note: flute axis radius; gives 1.3 mm deep, 1.9 mm wide grooves
  hex_af:
    value: 5.7
    unit: mm
    kind: design
    source: measured
    note: 'pocket across flats, tuned on this printer: the 5.70 coupon pressed in
      with a push and the nut stayed in when inverted and shaken (5.80 also held but
      was looser, 5.60 and below would not go in by hand)'
  hex_corner_r:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: rounds the pocket's six corners so the nut's sharp corners have clearance
      and the flats do the gripping
  hex_depth:
    value: 2.6
    unit: mm
    kind: design
    source: design
    note: nut_h + 0.2, so the nut is fully inside and its outer face ends 0.8 mm below
      the rim
  knob_h:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: 2.4 wall above the nut + 2.6 hex pocket + 0.6 lead-in; the bolt needs 5.6
      mm of free thread inside the knob to reach the top face
  knob_od:
    value: 20
    unit: mm
    kind: design
    source: design
    note: about 20 mm across, as asked
  mouth_cb_d:
    value: 7
    unit: mm
    kind: design
    source: design
    note: round lead-in at the pocket mouth; clears the nut's 6.35 mm across-corners
      so the nut starts square
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats (could not be measured; assumed catalog)
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height (could not be measured; assumed catalog)
  top_t:
    value: 2.4
    unit: mm
    kind: design
    source: design
    note: wall between the nut's far face and the top face; thin so the bolt tip reaches
      daylight quickly, thick enough to stop the nut dead
parts:
- id: knob
  role: final
  material: PLA (high-speed, black)
  code: "import math\n\ndef build(p):\n    h = p.knob_h\n    lead = h - p.top_t -\
    \ p.hex_depth        # round lead-in depth at the pocket mouth\n    tr = p.knob_od\
    \ / 2.0\n\n    # body\n    body = cq.Workplane(\"XY\").circle(tr).extrude(h)\n\
    \    body = body.faces(\">Z\").edges().chamfer(p.edge_chamfer)\n    body = body.faces(\"\
    <Z\").edges().chamfer(p.edge_chamfer_bot)\n\n    # grip flutes: vertical cylinders\
    \ cut round the rim\n    for i in range(int(p.flute_count)):\n        a = 2.0\
    \ * math.pi * i / p.flute_count\n        tool = (cq.Workplane(\"XY\").workplane(offset=-1.0)\n\
    \                .moveTo(p.flute_r0 * math.cos(a), p.flute_r0 * math.sin(a))\n\
    \                .circle(p.flute_r).extrude(h + 2.0))\n        body = body.cut(tool)\n\
    \n    # hex nut pocket, open at the mouth (z = h), flat bottom at z = top_t\n\
    \    hex_dia = p.hex_af / math.cos(math.radians(30.0))\n    tool = (cq.Workplane(\"\
    XY\").workplane(offset=p.top_t)\n            .polygon(6, hex_dia).extrude(p.hex_depth\
    \ + 1.0))\n    tool = tool.edges(\"|Z\").fillet(p.hex_corner_r)\n    body = body.cut(tool)\n\
    \n    # round lead-in / nut recess at the mouth\n    body = body.cut(cq.Workplane(\"\
    XY\").workplane(offset=h - lead)\n                    .circle(p.mouth_cb_d / 2.0).extrude(lead\
    \ + 1.0))\n\n    # M3 clearance through the wall above the nut and out of the\
    \ top face\n    body = body.cut(cq.Workplane(\"XY\").workplane(offset=-1.0)\n\
    \                    .circle(p.bolt_hole_d / 2.0).extrude(p.top_t + 2.0))\n\n\
    \    return body\n"
  print_orientation: z = 0 is the plain flat top face (the one with the 3.6 mm round
    hole and the 1 mm chamfer); the hex nut pocket opens upward. Print it exactly
    like that, no supports, no raft.
  use_orientation: 'Flip the part over from the way it printed: the fluted face with
    the round 7 mm hollow and the hex pocket is the underside (it goes toward the
    work), the plain flat face with the small hole is the top. The nut is pressed
    into the hex from that underside.'
