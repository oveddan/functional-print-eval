- id: c3_bolt_passes_through_and_out
  part: knob
  feature: bolt_bore_3p6_through_top_wall
  relation: clears
  hardware: hw_bolt
  clearance_mm: 0.6
  params:
  - bolt_hole_d
  - top_t
  check:
    method: template
    ref: null
    description: '3.6 mm bore over a 3.0 mm M3 shank: the bolt runs through the nut
      and out of the top face without ever hitting a blind end.'
- id: c4_nut_sits_fully_inside
  part: knob
  feature: mouth_rim_recess
  relation: faces
  hardware: hw_nut
  clearance_mm: 0.8
  params:
  - knob_h
  - top_t
  - hex_depth
  - nut_h
  check:
    method: template
    ref: null
    description: 'Mouth rim at z = 5.6, nut''s outer face at z = 4.8: the nut sits
      wholly inside the knob with a 0.8 mm recess.'
- id: c5_prints_without_supports
  part: knob
  feature: all_walls_vertical_and_chamfered
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - knob_od
  - knob_h
  - hex_depth
  - top_t
  - mouth_cb_d
  - bolt_hole_d
  - flute_count
  check:
    method: none
    ref: null
    description: All walls vertical; only horizontal surfaces are the pocket bottom
      (printed on solid material below), the 0.65 mm ring ledge at the lead-in and
      the pocket's 1.35 mm annular bore ceiling - far inside the 50 mm bridge limit.
      Both rim edges are 45 deg chamfers.
manual:
- n: '1'
  text: Look at the printed knob. One face is plain and flat with a 1 mm chamfer round
    the edge and one small hole right in the middle - that face is the TOP. The other
    face has twelve grip flutes running right out to its edge and a round 7 mm hollow
    in the middle with a hexagonal hole at the bottom of it - that is the underside,
    the side that goes against the work.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Hold the knob with the fluted underside facing up. Drop the ISO 4032 M3 hex
    nut into the round hollow and press it down into the hex with both thumbs until
    it stops hard against the bottom of the pocket. It goes in with a firm push (the
    last millimetre is the tight one) and ends up 0.8 mm below the rim, sitting on
    the flat wall. No glue, no tool. If it starts crooked, lift it out and start again
    - push straight down.
  parts:
  - knob
  hardware:
  - hw_nut
  tool: null
- n: '3'
  text: 'Check the grip before going further: turn the knob upside down over the table
    and shake it. The nut must stay in the pocket. This friction fit is the only thing
    holding it - that is why the pocket size was tuned on your printer.'
  parts:
  - knob
  hardware:
  - hw_nut
  tool: null
- n: '4'
  text: 'Dry-run the thread: still holding the knob fluted side up, wind your M3 bolt
    in by hand until it comes through the nut and out of the small hole in the top
    face. It must turn freely all the way - the bore is a through hole, so the bolt
    has nothing to bottom out against. Unwind it again.'
  parts:
  - knob
  hardware:
  - hw_bolt
  - hw_nut
  tool: none
- n: '5'
  text: 'Fit it to the work: keep the fluted underside toward the surface and offer
    the knob to the bolt thread sticking out of it. Turn the knob clockwise by hand.
    The nut turns with the knob and draws the bolt in; the fluted rim comes down and
    seats flat on the surface (put an ISO 7089 M3 washer under it if you have one).'
  parts:
  - knob
  hardware:
  - hw_bolt
  tool: null
- n: '6'
  text: 'Tighten by gripping the fluted 20 mm rim between thumb and fingers. No tool
    is needed or wanted: this is a PLA nut seat, so stop when it feels snug rather
    than leaning on it. If the bolt is long enough you will see its tip appear in
    the small hole on the top face - that is the bolt passing through the nut and
    out the other side.'
  parts:
  - knob
  hardware: []
  tool: fingers only
- n: '7'
  text: To take it off, turn the knob anticlockwise until it comes off the bolt. The
    nut stays captive in the knob and the whole thing can be reused; if the nut ever
    works loose, it can be pushed back in the same way.
  parts:
  - knob
  hardware:
  - hw_nut
  tool: null
