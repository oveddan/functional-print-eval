task: nut-knob/M3
note: 'A 20 mm hand knob with a captive M3 hex nut, printed as one piece. The nut
  is pressed by hand into a hex pocket (5.80 across flats) through a crown of six
  0.8 mm-thick fingers; it snaps past a 5.38 mm across-flats hook band at the fingers''
  free ends and drops ~0.2 mm onto a 2.6 mm solid shoulder. Retention needs no glue:
  the hook band is 0.12 mm smaller across flats than the nut, so the nut must flex
  the fingers out to leave, and the shoulder''s Ø3.4 hole is far smaller than the
  nut''s 5.5 mm, so it can never be pushed out the far side. The M3 bolt enters through
  the Ø3.4 hole in the back face, threads into the trapped nut (the hex pocket stops
  it turning) and exits through the finger crown, so hand-tightening presses the nut
  onto the solid shoulder rather than onto the fingers. The socket head (Ø5.5) cannot
  pass the 5.38 hook, so the bolt can only be fitted from the back - the correct way.
  Three coupons were printed bracketing the hook size (5.46 / 5.38 / 5.30); the final
  knob uses the middle one (5.38), and coupon_a/coupon_c are spares if the fit turns
  out loose or tight. No supports needed: the only bridge is the 6.7 mm pocket ceiling.'
questions: []
params:
  bolt_hole_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: M3 clearance hole through the shoulder (nominal 3.0 + 0.4)
  coupon_flute_n:
    value: 0
    unit: mm
    kind: design
    source: design
    note: the printed coupons had no grip flutes
  coupon_shoulder_t:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: shoulder thickness of the printed coupons (thin, just to test the press-in
      and retention)
  dots:
    value: 0
    unit: mm
    kind: design
    source: design
    note: final knob carries no identification dots
  dots_a:
    value: 1
    unit: mm
    kind: design
    source: design
    note: 1 dot on coupon A's back face
  dots_b:
    value: 2
    unit: mm
    kind: design
    source: design
    note: 2 dots on coupon B's back face
  dots_c:
    value: 3
    unit: mm
    kind: design
    source: design
    note: 3 dots on coupon C's back face
  finger_L:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: finger length; the 0.12 mm interference is taken up elastically by bending
      these cantilevers
  finger_t:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: finger wall thickness (radial)
  flare_af:
    value: 5.9
    unit: mm
    kind: design
    source: design
    note: hex opening through the top plate and the fingers' clearance above the hook
      band - the nut slides through without being gripped
  flute_d:
    value: 3.2
    unit: mm
    kind: design
    source: design
    note: grip flute cutter diameter
  flute_n:
    value: 12
    unit: mm
    kind: design
    source: design
    note: 12 flutes down the side for grip
  groove_gap:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: relief groove gap around the fingers so they can flex outwards
  hook_af:
    value: 5.38
    unit: mm
    kind: design
    source: design
    note: CHOSEN retention hook across flats = nut_af - 0.12 (0.06 mm per side interference).
      Matches printed coupon B.
  hook_af_a:
    value: 5.46
    unit: mm
    kind: design
    source: design
    note: coupon A hook across flats (0.04 mm interference, loosest)
  hook_af_b:
    value: 5.38
    unit: mm
    kind: design
    source: design
    note: coupon B hook across flats (0.12 mm interference, middle)
  hook_af_c:
    value: 5.3
    unit: mm
    kind: design
    source: design
    note: coupon C hook across flats (0.20 mm interference, tightest)
  hook_h:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: height of the hook band at the fingers' free ends
  knob_h:
    value: 9.0
    unit: mm
    kind: design
    source: design
    note: overall knob height = plate_t + finger_L + pocket_h + shoulder_t
  knob_od:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: knob diameter, as asked (about 20 mm)
  m3_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: M3 bolt major diameter (ISO 4762)
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut, width across flats (person could not measure it)
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut height
  plate_t:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: top plate thickness; the six fingers are attached to it
  pocket_af:
    value: 5.8
    unit: mm
    kind: design
    source: design
    note: nut pocket across flats = nut_af + 0.30 so the nut drops in freely; the
      hex still stops it turning
  pocket_h:
    value: 2.6
    unit: mm
    kind: design
    source: design
    note: pocket depth = nut_h + 0.2 seating clearance
  shoulder_t:
    value: 2.6
    unit: mm
    kind: design
    source: design
    note: solid shoulder behind the nut - takes the whole tightening load
  slit_w:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: slit width between the six fingers
parts:
- id: knob
  role: final
  material: PLA
  code: "import cadquery as cq, math\n\ndef build(p):\n    R = p.knob_od / 2.0\n \
    \   c30 = math.cos(math.radians(30.0))\n    def hexsol(af, z0, z1):\n        r\
    \ = af / (2.0 * c30)\n        pts = [cq.Vector(r*math.cos(math.radians(60*i)),\
    \ r*math.sin(math.radians(60*i)), z0) for i in range(6)]\n        return cq.Solid.extrudeLinear(cq.Wire.makePolygon(pts\
    \ + [pts[0]]), [], cq.Vector(0, 0, z1 - z0))\n    def cyl(rad, z0, z1, cx=0.0,\
    \ cy=0.0):\n        return cq.Solid.makeCylinder(rad, z1 - z0, cq.Vector(cx, cy,\
    \ z0), cq.Vector(0, 0, 1))\n    z_pl = p.plate_t\n    z_ft = z_pl + p.finger_L\n\
    \    z_hb = z_ft - p.hook_h\n    z_pt = z_ft + p.pocket_h\n    H = z_pt + p.shoulder_t\n\
    \    ofa = p.flare_af + 2.0 * p.finger_t\n    body = cyl(R, 0.0, H)\n    body\
    \ = body.cut(hexsol(p.flare_af, -0.5, z_hb))\n    body = body.cut(hexsol(p.hook_af,\
    \ z_hb, z_ft + 0.5))\n    body = body.cut(hexsol(p.pocket_af, z_ft, z_pt + 0.5))\n\
    \    gr = hexsol(ofa + 2.0 * p.groove_gap, z_pl - 0.1, z_ft + 0.6).cut(hexsol(ofa,\
    \ z_pl - 0.2, z_ft + 0.7))\n    body = body.cut(gr)\n    body = body.cut(cyl(p.bolt_hole_d\
    \ / 2.0, -0.5, H + 0.5))\n    r_in = p.hook_af / (2.0 * c30) - 0.6\n    r_out\
    \ = ofa / (2.0 * c30) + 0.4\n    for i in range(6):\n        a = math.radians(60.0\
    \ * i)\n        cs, sn = math.cos(a), math.sin(a)\n        loc = [(r_in, -0.5*p.slit_w),\
    \ (r_out, -0.5*p.slit_w), (r_out, 0.5*p.slit_w), (r_in, 0.5*p.slit_w)]\n     \
    \   pts = [cq.Vector(rr*cs - ss*sn, rr*sn + ss*cs, z_pl - 0.05) for (rr, ss) in\
    \ loc]\n        body = body.cut(cq.Solid.extrudeLinear(cq.Wire.makePolygon(pts\
    \ + [pts[0]]), [], cq.Vector(0, 0, p.finger_L + 1.0)))\n    for i in range(int(p.flute_n)):\n\
    \        a = math.radians(360.0 * i / p.flute_n)\n        body = body.cut(cyl(p.flute_d\
    \ / 2.0, z_pl + 0.1, H + 0.5, R*math.cos(a), R*math.sin(a)))\n    for k in range(int(p.dots)):\n\
    \        a = math.radians(-90.0 + 45.0 * (k - (p.dots - 1) / 2.0))\n        body\
    \ = body.cut(cyl(0.8, H - 0.6, H + 0.5, 0.62*R*math.cos(a), 0.62*R*math.sin(a)))\n\
    \    return body"
  print_orientation: 'Cylinder axis vertical, z = 0 on the bed = the flat circular
    top face (in use, the knob''s top). Sitting on the bed: that flat face with the
    5.9 mm across-flats hex opening in its middle. Growing up: the 0.8 mm plate (z
    0-0.8), the six fingers with 0.5 mm slits and a 0.6 mm relief groove (z 0.8-3.8),
    the 5.38 mm hook bands are the topmost part of the fingers, then the nut pocket
    (z 3.8-6.4), then the solid shoulder with the Ø3.4 bolt hole (z 6.4-9.0). The
    12 grip flutes start 0.1 mm above the bed''s rim. No supports: vertical walls
    only, the widest unsupported span is the pocket''s 6.7 mm ceiling.'
  use_orientation: 'Flipped end for end: the printed z = 0 face is the knob''s top
    (where the bolt leaves), the z = 9.0 face with the Ø3.4 hole is the knob''s underside
    (where the bolt enters). The M3 nut is pressed in through the six-finger opening
    and seats against the shoulder inside the pocket; the bolt screws in from the
    underside and comes out through the finger crown.'
