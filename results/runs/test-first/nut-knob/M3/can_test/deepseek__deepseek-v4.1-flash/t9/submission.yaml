hardware:
- id: bolt
  ref: ISO 4762 M3x16
  qty: 1
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints:
- id: nut_runs_on_bolt
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 9.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: Ø3.4 bolt clearance hole in the back face (z = 9.0)
    role: clearance
  - part: knob
    feature: hex nut pocket, 5.80 mm across flats, 2.6 mm deep
    role: nut_pocket
  nut: nut
  external: null
criteria:
- id: c1_nut_drops_in
  part: knob
  feature: hex nut pocket (5.80 mm across flats, 2.6 mm deep)
  relation: contains
  hardware: nut
  clearance_mm: 0.3
  params:
  - pocket_af
  - pocket_h
  - nut_af
  - nut_h
  check:
    method: coupon
    ref: coupon_b
    description: 'Press the M3 nut into the pocket: it should drop past the fingers
      and seat flat on the shoulder with no force beyond a thumb press.'
- id: c2_nut_retained
  part: knob
  feature: retention hook band (5.38 mm across flats, 1.0 mm tall) at the free ends
    of the six fingers
  relation: seats
  hardware: nut
  clearance_mm: -0.12
  params:
  - hook_af
  - hook_h
  - nut_af
  - finger_t
  - finger_L
  check:
    method: coupon
    ref: coupon_b
    description: 'Negative clearance: the hook is 0.12 mm smaller across flats than
      the nut, so the nut must flex the fingers outwards to escape. Turn the knob
      upside down and shake - the nut stays in. If it falls out use coupon_c (5.30);
      if the press was very hard use coupon_a (5.46).'
- id: c3_bolt_clears_shoulder
  part: knob
  feature: Ø3.4 bolt clearance hole through the shoulder and back face
  relation: clears
  hardware: bolt
  clearance_mm: 0.4
  params:
  - bolt_hole_d
  - m3_d
  check:
    method: measure
    ref: M3 bolt shank, nominal Ø3.0 (ISO 4762 M3x16)
    description: The bolt's shank passes the shoulder with 0.2 mm per side to spare;
      the head (Ø5.5) cannot pass, so the nut can never be pushed out the far side.
