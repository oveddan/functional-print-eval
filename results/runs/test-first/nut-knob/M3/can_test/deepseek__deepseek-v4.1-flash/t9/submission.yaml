manual:
- n: '1'
  text: 'Print the knob in the orientation it is modelled in: PLA, 0.2 mm layers,
    no supports. The flat circular top face sits on the bed; the six fingers, the
    slits, the hex pocket and the solid shoulder grow upwards, and the small Ø3.4
    bolt hole comes out of the last layer on top.'
  parts:
  - knob
  hardware: []
  tool: 3D printer
- n: '2'
  text: 'Press the M3 hex nut into the open end of the knob (the end showing six slots
    around a hex hole). Line the nut''s hex up with the pocket and push it in with
    your thumb: it slides past the six flexible fingers, clicks into the pocket and
    drops about 0.2 mm onto the shoulder inside. No glue and no tools.'
  parts:
  - knob
  hardware:
  - nut
  tool: thumb pressure
- n: '3'
  text: 'Check the retention: turn the knob upside down and give it a shake. The nut
    must stay inside - it is caught by the hook band at the tips of the fingers. If
    it falls back out, print coupon_c (3 dots, tighter 5.30 mm hook) and use that
    instead; if it was very hard to press in, print coupon_a (1 dot, looser 5.46 mm
    hook).'
  parts:
  - knob
  - coupon_a
  - coupon_c
  hardware:
  - nut
  tool: null
- n: '4'
  text: Fit the M3 bolt from the opposite end. Push the shank through the small Ø3.4
    hole in the flat back face and turn it clockwise into the nut's thread; keep turning
    until the shank appears out of the finger end. A bolt at least 10 mm long is needed
    (5.0 mm of it goes through the shoulder and the nut) - an ISO 4762 M3x16 works
    well.
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: hand
- n: '5'
  text: 'Use it: hold the bolt, turn the knob by hand. The hex pocket stops the nut
    turning with the knob, so the knob tightens the bolt without a wrench. Tightening
    presses the nut against the solid 2.6 mm shoulder behind it, which is the load
    path the knob was designed around.'
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: hand
- n: '6'
  text: 'Keep the assembly this way round: do not try to insert the bolt from the
    finger end. The bolt''s socket head (Ø5.5) is too big to pass the 5.38 mm hook,
    which is exactly what keeps the tightening load on the solid shoulder instead
    of on the fingers.'
  parts:
  - knob
  hardware:
  - bolt
  tool: null
