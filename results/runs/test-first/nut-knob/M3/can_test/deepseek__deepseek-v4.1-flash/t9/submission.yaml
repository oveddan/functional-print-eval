    \ = ofa / (2.0 * c30) + 0.4\n    for i in range(6):\n        a = math.radians(60.0\
    \ * i)\n        cs, sn = math.cos(a), math.sin(a)\n        loc = [(r_in, -0.5*p.slit_w),\
    \ (r_out, -0.5*p.slit_w), (r_out, 0.5*p.slit_w), (r_in, 0.5*p.slit_w)]\n     \
    \   pts = [cq.Vector(rr*cs - ss*sn, rr*sn + ss*cs, z_pl - 0.05) for (rr, ss) in\
    \ loc]\n        body = body.cut(cq.Solid.extrudeLinear(cq.Wire.makePolygon(pts\
    \ + [pts[0]]), [], cq.Vector(0, 0, p.finger_L + 1.0)))\n    for i in range(int(p.coupon_flute_n)):\n\
    \        a = math.radians(360.0 * i / p.coupon_flute_n)\n        body = body.cut(cyl(p.flute_d\
    \ / 2.0, z_pl + 0.1, H + 0.5, R*math.cos(a), R*math.sin(a)))\n    for k in range(int(p.dots_a)):\n\
    \        a = math.radians(-90.0 + 45.0 * (k - (p.dots_a - 1) / 2.0))\n       \
    \ body = body.cut(cyl(0.8, H - 0.6, H + 0.5, 0.62*R*math.cos(a), 0.62*R*math.sin(a)))\n\
    \    return body"
  print_orientation: 'Cylinder axis vertical, z = 0 on the bed = the flat circular
    face (in use, the knob''s top), with the 5.9 mm across-flats hex opening in its
    middle. Going up: the six fingers with 0.5 mm slits and a 0.6 mm relief groove
    (z 0.8-3.8), the nut pocket (z 3.8-6.4), a 1.0 mm shoulder; z = 7.4 is the back
    face with 1 identification dot. No supports.'
  use_orientation: 'Coupon: the loose variant (hook 5.46 mm across flats). Flip it
    back face up, press the M3 nut in through the finger end and check whether it
    stays in when inverted; use this one if the final knob''s nut is very hard to
    press in.'
