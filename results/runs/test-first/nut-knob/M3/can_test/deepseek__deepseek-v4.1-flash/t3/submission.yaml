parts:
- id: hand_knob
  role: final
  material: PLA, 0.2 mm layers, 0.4 mm nozzle, no supports
  code: "import math\nimport cadquery as cq\n\ndef _hex_pts(af, cx=0.0, cy=0.0):\n\
    \    # regular hexagon with flats facing +X/-X; r = circumradius\n    r = af /\
    \ (2.0 * math.cos(math.pi / 6.0))\n    return [(cx + r * math.cos(math.pi / 3.0\
    \ * i + math.pi / 6.0),\n             cy + r * math.sin(math.pi / 3.0 * i + math.pi\
    \ / 6.0)) for i in range(6)]\n\ndef build(p):\n    R = p.knob_d / 2.0\n    H =\
    \ p.knob_h\n    cb = p.knob_bottom_chamfer\n    ct = p.knob_top_chamfer\n\n  \
    \  # body of revolution: flat bottom (on the bed), chamfered rims, flat top\n\
    \    prof = [(0.0, 0.0), (R - cb, 0.0), (R, cb),\n            (R, H - ct), (R\
    \ - ct, H), (0.0, H)]\n    body = (cq.Workplane(\"XZ\").polyline(prof).close()\n\
    \            .revolve(360.0, (0, 0, 0), (0, 0, 1)))\n\n    # vertical grip flutes\n\
    \    for i in range(int(p.flute_count)):\n        a = 2.0 * math.pi * i / p.flute_count\n\
    \        d = R + p.flute_r - p.flute_depth\n        body = body.cut(cq.Workplane(\"\
    XY\", origin=(d * math.cos(a), d * math.sin(a), -1.0))\n                     \
    \   .circle(p.flute_r).extrude(H + 2.0))\n\n    # hex nut socket, opening in the\
    \ top face\n    z_floor = H - p.pocket_depth\n    body = body.cut(cq.Workplane(\"\
    XY\", origin=(0, 0, z_floor))\n                    .polyline(_hex_pts(p.pocket_af)).close()\n\
    \                    .extrude(p.pocket_depth + 1.0))\n    # chamfered lead-in\
    \ at the socket mouth\n    try:\n        w1 = cq.Wire.makePolygon([cq.Vector(x,\
    \ y, z_floor + p.pocket_depth - p.lead_in)\n                                 \
    \ for (x, y) in _hex_pts(p.pocket_af)])\n        w2 = cq.Wire.makePolygon([cq.Vector(x,\
    \ y, z_floor + p.pocket_depth)\n                                  for (x, y) in\
    \ _hex_pts(p.pocket_af + 2.0 * p.lead_in)])\n        body = body.cut(cq.Solid.makeLoft([w1,\
    \ w2]))\n    except Exception:\n        pass\n\n    # bolt clearance hole right\
    \ through, from the socket floor out of the bottom face\n    body = body.cut(cq.Workplane(\"\
    XY\", origin=(0, 0, -1.0))\n                    .circle(p.through_hole_d / 2.0).extrude(H\
    \ + 2.0))\n\n    # countersink at the bolt entry on the bottom face\n    tri =\
    \ [(p.through_hole_d / 2.0, 0.0),\n           (p.through_hole_d / 2.0 + p.bolt_lead_d,\
    \ 0.0),\n           (p.through_hole_d / 2.0, p.bolt_lead)]\n    body = body.cut(cq.Workplane(\"\
    XZ\").polyline(tri).close()\n                    .revolve(360.0, (0, 0, 0), (0,\
    \ 0, 1)))\n    return body\n"
  print_orientation: flat bottom face (z = 0, the small countersunk bolt hole) on
    the bed; hex nut socket opens upward
  use_orientation: 'axis vertical, chamfered flat top up: the hex socket stays on
    top and the small countersunk Ø3.4 hole faces down onto the workpiece, with the
    M3 bolt entering from underneath'
- id: nut_fit_coupon
  role: coupon
  material: PLA, 0.2 mm layers, 0.4 mm nozzle, no supports
  code: "import math\nimport cadquery as cq\n\ndef _hex_pts(af, cx=0.0, cy=0.0):\n\
    \    r = af / (2.0 * math.cos(math.pi / 6.0))\n    return [(cx + r * math.cos(math.pi\
    \ / 3.0 * i + math.pi / 6.0),\n             cy + r * math.sin(math.pi / 3.0 *\
    \ i + math.pi / 6.0)) for i in range(6)]\n\ndef _hex_pocket(body, af, cx, cy,\
    \ z_floor, depth, lead):\n    body = body.cut(cq.Workplane(\"XY\", origin=(cx,\
    \ cy, z_floor))\n                    .polyline(_hex_pts(af)).close()\n       \
    \             .extrude(depth + 1.0))\n    try:\n        w1 = cq.Wire.makePolygon([cq.Vector(cx\
    \ + x, cy + y, z_floor + depth - lead)\n                                  for\
    \ (x, y) in _hex_pts(af)])\n        w2 = cq.Wire.makePolygon([cq.Vector(cx + x,\
    \ cy + y, z_floor + depth)\n                                  for (x, y) in _hex_pts(af\
    \ + 2.0 * lead)])\n        body = body.cut(cq.Solid.makeLoft([w1, w2]))\n    except\
    \ Exception:\n        pass\n    return body\n\ndef build(p):\n    L, W, T = 96.0,\
    \ 22.0, 5.0\n    body = cq.Workplane(\"XY\").box(L, W, T, centered=(True, True,\
    \ False))\n    afs = [p.coupon_af_1, p.coupon_af_2, p.coupon_af_3, p.coupon_af_4,\
    \ p.coupon_af_5]\n    xs = [-32.0, -16.0, 0.0, 16.0, 32.0]\n    for i in range(len(afs)):\n\
    \        af = afs[i]\n        x = xs[i]\n        body = _hex_pocket(body, af,\
    \ x, 0.0, T - p.pocket_depth, p.pocket_depth, p.lead_in)\n        body = body.cut(cq.Workplane(\"\
    XY\", origin=(x, 0.0, -0.5))\n                        .circle(p.through_hole_d\
    \ / 2.0).extrude(T + 1.0))\n        n = i + 1\n        for k in range(n):\n  \
    \          mx = x + (k - (n - 1) / 2.0) * 2.6\n            body = body.cut(cq.Workplane(\"\
    XY\", origin=(mx, -8.0, T - 1.0))\n                            .circle(0.8).extrude(1.5))\n\
    \    return body\n"
  print_orientation: flat underside on the bed (z = 0); the hex pockets open upward
  use_orientation: 'fit test only: five hex pockets 5.30/5.35/5.40/5.45/5.50 across
    flats, marked 1-5 dimples; pocket 3 is the knob''s size'
