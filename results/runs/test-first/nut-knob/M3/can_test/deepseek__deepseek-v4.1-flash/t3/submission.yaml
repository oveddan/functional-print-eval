    role: clearance
  - part: hand_knob
    feature: hex_nut_socket_floor
    role: nut_pocket
  nut: nut
  external: null
criteria:
- id: nut_fully_inside
  part: hand_knob
  feature: hex_nut_socket
  relation: contains
  hardware: nut
  clearance_mm: 0.2
  params:
  - nut_h
  - pocket_depth
  check:
    method: template
    ref: hand_knob
    description: 'nut_h 2.4 in a 2.6 deep socket: the nut''s top face ends 0.2 below
      the knob''s top rim'
- id: nut_press_fit
  part: hand_knob
  feature: hex_nut_socket
  relation: engages
  hardware: nut
  clearance_mm: -0.1
  params:
  - nut_af
  - pocket_af
  - pocket_depth
  - lead_in
  check:
    method: coupon
    ref: nut_fit_coupon
    description: '5.40 across flats socket vs 5.50 nut: 0.10 interference total (negative
      clearance), hand press, holds when inverted. Coupon pocket 3 is identical geometry
      and must be confirmed'
- id: nut_cannot_exit_far_side
  part: hand_knob
  feature: hex_nut_socket_floor
  relation: supports
  hardware: nut
  clearance_mm: 0.0
  params:
  - nut_af
  - through_hole_d
  - pocket_depth
  - knob_h
  check:
    method: template
    ref: hand_knob
    description: socket floor is solid from z=0 up to z=9.4 and only pierced by a
      Ø3.4 hole, so the 5.5 across-flats nut is stopped there and cannot be pushed
      out of the bottom
- id: bolt_passes
  part: hand_knob
  feature: bottom_bolt_hole_3p4
  relation: clears
  hardware: bolt
  clearance_mm: 0.4
  params:
  - bolt_d
  - through_hole_d
  - knob_h
  - pocket_depth
  check:
    method: template
    ref: hand_knob
    description: 'Ø3.4 hole against the Ø3.0 bolt shank: 0.4 mm radial clearance,
      bolt passes from the bottom face through the nut and out above the top face'
- id: entry_lead_in
  part: hand_knob
  feature: hex_nut_socket_lead_in
  relation: faces
  hardware: nut
  clearance_mm: 0.6
  params:
  - lead_in
  - pocket_af
  check:
    method: coupon
    ref: nut_fit_coupon
    description: 0.6 mm 45 deg chamfer at the socket mouth prints as a widening step-free
      lead-in that starts the nut square during the hand press
manual:
- n: '1'
  text: 'Optional but recommended (2 minutes, ~4 g): print nut_fit_coupon flat on
    its face, no supports. Press your M3 nut into each of the five hex pockets - 5.30,
    5.35, 5.40, 5.45, 5.50 mm across flats, left to right, marked with 1 to 5 small
    dimples. Pocket 3 (three dimples, 5.40 mm) is exactly the size in the knob. The
    one that pushes in with firm thumb pressure and still holds when you turn the
    plate upside down and shake it is the right one; if that is not pocket 3, ask
    for a re-export with the matching pocket size before printing the knob.'
  parts:
  - nut_fit_coupon
  hardware:
  - nut
  tool: null
- n: '2'
  text: Print hand_knob in PLA at 0.2 mm layers with the flat bottom face on the bed
    - that is the face with the small countersunk Ø3.4 hole. The hex socket then opens
    upward and the ten grip flutes run vertically. No supports, no brim needed.
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '3'
  text: 'Check the socket: hexagonal, 5.40 mm across flats and 2.60 mm deep, with
    a chamfered mouth, a flat floor and a Ø3.4 hole through the middle. Pick out any
    strings or blobs at the socket mouth with a fingernail - the fit is only 0.05
    mm per side.'
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Press the M3 hex nut into the socket from the open top, flat face down, aligning
    the flats with the socket walls (it only goes in one way, rotated 60 deg either
    side). Push it in with both thumbs, or squeeze it in a bench vise with a flat
    scrap of wood over the nut if it is firm. It seats on the socket floor and its
    top face ends 0.2 mm below the knob's rim - fully inside the knob, no glue.
  parts:
  - hand_knob
  hardware:
  - nut
  tool: thumbs, or a bench vise with a flat scrap over the nut
- n: '5'
  text: 'Turn the knob upside down and shake it. The nut must stay put - the 0.05
    mm-per-side press fit holds it. If it drops out, the socket printed oversize for
    your printer: reprint the knob using the coupon pocket size that did hold (see
    step 1).'
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '6'
  text: Pass the M3 bolt through the part you are clamping, then bring the knob down
    onto the bolt's protruding end - bottom face first, using the countersink to guide
    the shank into the Ø3.4 hole - and turn the knob to catch the thread in the nut.
    Keep turning until the knob's bottom face clamps the workpiece; the bolt's tip
    comes out through the nut and above the knob's top face. The bolt must reach at
    least 12 mm past the knob's bottom face, so use at least (workpiece thickness
    + 14) mm - e.g. ISO 4762 M3x25 for a workpiece up to about 10 mm.
  parts:
  - hand_knob
  hardware:
  - bolt
  - nut
  tool: fingers
