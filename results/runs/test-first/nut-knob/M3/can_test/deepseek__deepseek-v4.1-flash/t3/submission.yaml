task: nut-knob/M3
note: 'One printed piece: a 20 mm fluted hand knob with a captive M3 hex nut.\n\nHow
  the nut is captured (no glue): the knob has a hexagonal socket in its top face,
  5.40 mm across flats and 2.60 mm deep, opening upward. Your ISO 4032 M3 nut is 5.50
  mm across flats and 2.40 mm high, so it is an interference fit of 0.10 mm across
  flats (0.05 mm per side) — light hand pressure with the 0.6 mm chamfered lead-in,
  and far more friction than a 1 g nut needs to stay put when the knob is turned upside
  down. The socket floor sits at z = 9.4 mm and has only a Ø3.4 mm hole in it, so
  the nut cannot be pushed out through the far side; the nut ends up 0.2 mm below
  the top rim, i.e. fully inside the knob.\n\nThe Ø3.4 mm hole (3.0 mm bolt + 0.4
  mm clearance) runs from the nut''s floor straight through the bottom face, which
  has a small countersink to guide the bolt in. So the bolt enters at the bottom face,
  threads through the nut and comes out above the top face. Load path when tightening
  is all in compression: nut -> socket floor -> knob body -> bottom face -> workpiece,
  so the press fit only has to survive handling, not tightening force.\n\nPrinting:
  bottom face on the bed, socket opening upward. Vertical walls only, no bridges,
  no supports.\n\nIMPORTANT — the fit is the one thing I could not verify (I got no
  coupon result and no nut measurement back). Please print the small nut_fit_coupon
  first: five hex pockets, 5.30 / 5.35 / 5.40 / 5.45 / 5.50 mm across flats, marked
  left to right by 1–5 dimples. The knob uses the same geometry as pocket 3 (5.40).
  Press your nut into each with finger pressure and shake the plate upside down. If
  pocket 3 holds, print the knob as-is. If pocket 3 is loose and only pocket 2 (5.35)
  holds, ask me for a re-export with pocket_af = 5.35 before printing the knob. If
  even 5.30 rocks in only with a vise, the same re-export in the other direction (5.45)
  is the fix.\n\nBolt length rule: the bolt''s threaded end must reach at least 12
  mm past the knob''s bottom face to come out through the nut, so use a bolt at least
  (workpiece thickness + 14) mm long — e.g. ISO 4762 M3x25 for a workpiece up to ~10
  mm thick.'
questions:
- text: When you press the M3 nut into the knob's socket, does it go in with thumb
    pressure and stay in when you turn the knob upside down and shake it?
  answer: null
- text: Which coupon pocket (1-5) held the nut best? If it is not pocket 3 (5.40 mm),
    tell me and I will re-export the knob at that size.
  answer: null
