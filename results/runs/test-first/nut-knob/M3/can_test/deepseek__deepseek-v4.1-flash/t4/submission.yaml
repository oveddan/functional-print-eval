task: nut-knob/M3
note: 'A 20 mm knurled knob, one printed piece, that presses an ISO 4032 M3 nut inside
  itself and holds it with no glue.\n\nHow the requirements are met:\n- Nut presses
  in by hand: the hex pocket is 5.80 mm across flats, i.e. 0.30 mm bigger than the
  nut, so printer shrink can never block the nut from entering. The press comes from
  six Ø0.45 ribs inside the pocket whose crests form a 5.35 mm hex, 0.075 mm per side
  under the nut. Only the rib crests crush, so the force stays a thumb press even
  if the hole prints a little small.\n- Stays in when inverted: the crushed rib crests
  grip the nut flats. The nut only weighs about 0.4 g, so a very light grip is enough.
  Nothing depends on glue or on the bolt being fitted.\n- Cannot be pushed out the
  far side: the nut bottoms on a 3.0 mm floor with only a Ø3.6 bolt hole through it,
  far smaller than the nut, so the nut cannot pass.\n- Bolt through the nut and out
  the other side: the bolt enters the Ø3.6 hole in the flat bottom face, passes through
  the nut and emerges into the 13.5 mm bore above it, where the end of the bolt is
  visible.\n- Load path: tightening pulls the nut down onto that floor (toward the
  workpiece), so the joint''s force goes nut -> floor -> knob bottom face -> workpiece.
  The ribs only have to beat gravity.\n\nWhy the geometry looks over-sized at the
  top: the first coupon''s pockets were entered through a Ø6.35 round mouth, which
  is exactly the nut''s across-corners, so the nut jammed on its corners before the
  flats ever mattered. The bore above the pocket is now 13.5 mm, so the nut''s corners
  have 3.5 mm of clearance and the nut is free to drop in and self-align with the
  hex.\n\nPrinting: flat bottom face on the bed, bore and pocket opening straight
  up. All walls are vertical; both cavities widen toward the top, so there are no
  overhangs and no supports. The knob prints in about 40 minutes, the fit check in
  about 15.'
questions:
- text: How far does your M3 bolt stand proud of the workpiece when it is fitted?
    The knob needs about 6.5 mm of thread past the workpiece for the bolt to reach
    through the nut and show in the bore.
  answer: null
- text: Did the nut press into the fit check with your thumb, and does it stay in
    when you turn the coupon upside down and tap it?
  answer: null
params:
  bolt_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: datasheet
    note: M3 nominal major diameter. The person's own bolt - could not be measured.
  bolt_hole_d:
    value: 3.6
    unit: mm
    kind: design
    source: design
    note: 'Ø3.6 through the pocket floor: 0.3 mm clearance per side on the bolt, small
      enough to stop the nut (5.5 AF) but free for the bolt.'
  bore_d:
    value: 13.5
    unit: mm
    kind: design
    source: design
    note: Straight bore above the pocket, big enough that the nut's across-corners
      (6.35) cannot jam at the entry, and roomy for a thumb.
  c_len:
    value: 34.0
    unit: mm
    kind: design
    source: design
    note: ''
  c_thk:
    value: 9.0
    unit: mm
    kind: design
    source: design
    note: 'Fit-check block: 3.0 floor + 3.0 pocket + 3.0 bore above the shelf.'
  c_wid:
    value: 22.0
    unit: mm
    kind: design
    source: design
    note: ''
  floor_t:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: 'Material under the nut: takes the whole tightening load and stops the nut
      going out the far side.'
  grip_count:
    value: 12
    unit: count
    kind: design
    source: design
    note: ''
  grip_d:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: Flute diameter; flutes are cut on the OD so they are 1.0 mm deep.
  grip_h:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: Flutes stop 2 mm below the top face, so the rim stays full thickness where
      a thumb bears on it.
  grip_r:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: Flute centres sit on the OD circle.
  knob_d:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: About 20 mm across, as asked.
  knob_h:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: ''
  nut_ac:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: ISO 4032 M3 across corners (nominal). Used to size the entry bore so the
      nut cannot jam on its corners.
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut across flats (catalog nominal; the person could not
      measure it).
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 nut height (catalog).
  pocket_af:
    value: 5.8
    unit: mm
    kind: design
    source: design
    note: 'Hex pocket across flats: 0.30 mm larger than the nut, so the printed hole
      can never block the nut. The fit is set by the ribs, not by this wall.'
  pocket_relief:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Pocket is 0.6 mm deeper than the nut, so the nut's face ends up 0.6 mm below
      the pocket's shelf - fully inside - and has room for its chamfer.
  rib_count:
    value: 6
    unit: count
    kind: design
    source: design
    note: One rib centred on each pocket flat.
  rib_d:
    value: 0.45
    unit: mm
    kind: design
    source: design
    note: Rib diameter = pocket_af - rib_tip_af; the rib axis sits on the pocket flat
      so half the rib is anchored in the wall and 0.225 mm stands proud.
  rib_h:
    value: 2.8
    unit: mm
    kind: design
    source: design
    note: Ribs stop 0.2 mm below the pocket's shelf, leaving a short free entry before
      the nut meets them.
  rib_tip_af:
    value: 5.35
    unit: mm
    kind: design
    source: design
    note: 'Across-flats formed by the six rib crests: 0.15 mm under the nut, i.e.
      0.075 mm interference per side. Deliberately light - only the rib crests crush,
      and retention only has to beat the nut''s weight.'
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    cos30 = math.cos(math.pi / 6.0)\n    R\
    \ = p.knob_d / 2.0\n\n    # ---- blank\n    body = cq.Workplane(\"XY\").circle(R).extrude(p.knob_h)\n\
    \n    # ---- vertical grip flutes around the rim\n    n = int(p.grip_count)\n\
    \    pts = [\n        (p.grip_r * math.cos(2 * math.pi * i / n), p.grip_r * math.sin(2\
    \ * math.pi * i / n))\n        for i in range(n)\n    ]\n    body = body.cut(\n\
    \        cq.Workplane(\"XY\").pushPoints(pts).circle(p.grip_d / 2.0).extrude(p.grip_h)\n\
    \    )\n\n    # ---- hex nut pocket, reached through a wide straight bore\n  \
    \  z_shelf = p.floor_t + p.nut_h + p.pocket_relief\n    body = body.cut(\n   \
    \     cq.Workplane(\"XY\").workplane(offset=p.floor_t)\n        .polygon(6, p.pocket_af\
    \ / cos30)\n        .extrude(z_shelf - p.floor_t)\n    )\n    body = body.cut(\n\
    \        cq.Workplane(\"XY\").workplane(offset=z_shelf)\n        .circle(p.bore_d\
    \ / 2.0)\n        .extrude(p.knob_h - z_shelf + 1.0)\n    )\n\n    # ---- six\
    \ grip ribs, one centred on each pocket flat\n    for i in range(int(p.rib_count)):\n\
    \        a = 2 * math.pi * i / int(p.rib_count)\n        rr = p.pocket_af / 2.0\n\
    \        body = body.union(\n            cq.Workplane(\"XY\").workplane(offset=p.floor_t)\n\
    \            .center(rr * math.cos(a), rr * math.sin(a))\n            .circle(p.rib_d\
    \ / 2.0)\n            .extrude(p.rib_h)\n        )\n\n    # ---- M3 clearance\
    \ hole through the floor under the nut\n    body = body.cut(\n        cq.Workplane(\"\
    XY\").circle(p.bolt_hole_d / 2.0).extrude(p.floor_t)\n    )\n\n    return body"
  print_orientation: Flat bottom face (the face with the Ø3.6 bolt hole, which bears
    on the workpiece) on the bed, bore and hex pocket opening straight up. Every wall
    is vertical and both cavities widen toward the top face, so there are no overhangs
    and no supports.
  use_orientation: Bore up, hex pocket at the bottom of the bore. Nut pressed in from
    the top onto the pocket floor. The flat bottom face rests on the workpiece; the
    bolt comes up through the Ø3.6 hole from below, through the nut, and out into
    the bore.
- id: fit_check
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    cos30 = math.cos(math.pi / 6.0)\n    body\
    \ = cq.Workplane(\"XY\").box(p.c_len, p.c_wid, p.c_thk, centered=(True, True,\
    \ False))\n\n    z_shelf = p.floor_t + p.nut_h + p.pocket_relief\n    body = body.cut(\n\
    \        cq.Workplane(\"XY\").workplane(offset=p.floor_t)\n        .polygon(6,\
    \ p.pocket_af / cos30)\n        .extrude(z_shelf - p.floor_t)\n    )\n    body\
    \ = body.cut(\n        cq.Workplane(\"XY\").workplane(offset=z_shelf)\n      \
    \  .circle(p.bore_d / 2.0)\n        .extrude(p.c_thk - z_shelf + 1.0)\n    )\n\
    \n    for i in range(int(p.rib_count)):\n        a = 2 * math.pi * i / int(p.rib_count)\n\
    \        rr = p.pocket_af / 2.0\n        body = body.union(\n            cq.Workplane(\"\
    XY\").workplane(offset=p.floor_t)\n            .center(rr * math.cos(a), rr *\
    \ math.sin(a))\n            .circle(p.rib_d / 2.0)\n            .extrude(p.rib_h)\n\
    \        )\n\n    body = body.cut(\n        cq.Workplane(\"XY\").circle(p.bolt_hole_d\
    \ / 2.0).extrude(p.floor_t)\n    )\n\n    return body"
  print_orientation: Flat face on the bed, bore opening up - identical to how the
    knob is printed (same floor thickness, same pocket, same ribs, same bore).
  use_orientation: 'Bore up: press the M3 nut down into the hex pocket at the bottom
    of the bore until it stops on the pocket floor.'
hardware:
- id: m3_nut
  ref: ISO 4032 M3
  qty: 1
joints:
- id: nut_pressed_in
  fastener: m3_nut
  axis_origin:
  - 0.0
  - 0.0
  - 3.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: hex nut pocket, floor at z = 3.0, ribs on the six flats
    role: nut_pocket
  nut: null
  external: null
criteria:
- id: nut_fully_inside
  part: knob
  feature: hex pocket, shelf at z = 6.0 (floor_t + nut_h + pocket_relief)
  relation: contains
  hardware: m3_nut
  clearance_mm: 0.6
  params:
  - floor_t
  - nut_h
  - pocket_relief
  check:
    method: coupon
    ref: fit_check
    description: Press the nut into the fit check and into the knob; the nut's face
      must end up below the pocket shelf (0.6 mm) and well below the top face.
- id: nut_cannot_exit_far_side
  part: knob
  feature: pocket floor, z = 0 to 3.0, Ø3.6 hole
  relation: supports
  hardware: m3_nut
  clearance_mm: 0.0
  params:
  - floor_t
  - bolt_hole_d
  check:
    method: none
    ref: null
    description: 'Nut cannot leave through the flat bottom face: it stops on the 3.0
      mm floor, whose only opening is the 3.6 mm bolt hole. Pushing it with the bolt
      from below must only press it harder onto the floor.'
- id: bolt_clearance
  part: knob
  feature: Ø3.6 bolt hole through the floor
  relation: clears
  hardware: null
  clearance_mm: 0.3
  params:
  - bolt_hole_d
  - bolt_d
  check:
    method: none
    ref: null
    description: 0.3 mm per side on an M3 shank, 3.0 mm long guide in the floor.
- id: nut_press_by_hand
  part: knob
  feature: six grip ribs, crests at 5.35 mm across flats
  relation: engages
  hardware: m3_nut
  clearance_mm: 0.075
  params:
  - pocket_af
  - rib_tip_af
  - rib_d
  - rib_count
  - nut_af
  check:
    method: coupon
    ref: fit_check
    description: 'Thumb-press test: the nut should go in with firm thumb pressure
      - the pocket walls are 0.3 mm clear, only the rib crests interfere.'
- id: nut_stays_when_inverted
  part: knob
  feature: six grip ribs gripping the nut flats
  relation: engages
  hardware: m3_nut
  clearance_mm: 0.075
  params:
  - rib_tip_af
  - rib_h
  - nut_af
  check:
    method: coupon
    ref: fit_check
    description: 'Turn the knob upside down over a table and tap it: the nut must
      stay in place on the ribbed pocket.'
- id: entry_clears_nut_corners
  part: knob
  feature: 13.5 mm bore above the pocket shelf
  relation: clears
  hardware: m3_nut
  clearance_mm: 3.575
  params:
  - bore_d
  - nut_ac
  check:
    method: none
    ref: null
    description: 'Nut''s across-corners 6.35 mm against a 13.5 mm bore: no corner
      jam at the entry (this is what blocked the first coupon''s pockets).'
manual:
- n: '1'
  text: 'Optional but quick: print the fit check coupon first. PLA, 0.2 mm layers,
    flat face on the bed, bore opening up, no supports. It takes about 15 minutes
    and it tests the exact pocket, ribs, floor and bore that the knob has.'
  parts:
  - fit_check
  hardware: []
  tool: null
- n: '2'
  text: 'Press your M3 hex nut down into the hex pocket at the bottom of the bore,
    flat face first, with your thumb. It should go in with firm thumb pressure and
    stop flat on the pocket floor. Then turn the coupon upside down over the table
    and tap it: the nut must stay in. If it drops out, or if you cannot press it in
    at all, stop here and tell me before printing the knob.'
  parts:
  - fit_check
  hardware:
  - m3_nut
  tool: thumb, no tools
- n: '3'
  text: 'Print the knob: PLA, 0.2 mm layers, 3 perimeters, flat bottom face on the
    bed with the bore opening up, as the file is oriented. No supports and no raft
    needed. About 40 minutes.'
  parts:
  - knob
  hardware: []
  tool: printer
- n: '4'
  text: 'Press the M3 hex nut into the knob: hold the knob with the wide bore facing
    up, drop the nut in and press it down into the hex pocket with your thumb until
    it stops flat on the pocket floor. It will feel firm as it passes the six small
    grip ribs, then it seats. The nut''s top face ends up about 0.6 mm below the pocket
    shelf and about 6.6 mm below the knob''s top face, so the nut is fully inside
    the knob.'
  parts:
  - knob
  hardware:
  - m3_nut
  tool: thumb
- n: '5'
  text: 'Check the nut is captive: turn the knob upside down over the table and tap
    it - the nut must stay in. Then push the nut upward from the flat bottom face
    through the small centre hole with your fingertip or the bolt: it must stop dead
    on the pocket floor and cannot come out the far side.'
  parts:
  - knob
  hardware:
  - m3_nut
  tool: null
- n: '6'
  text: Fit the knob to your M3 bolt. Feed the bolt through the workpiece from the
    underside, then thread the knob onto the bolt's protruding end, wide bore up and
    flat bottom face toward the workpiece. Turn the knob by hand; the bolt's end comes
    up through the pocket floor, through the nut, and appears in the bore above the
    nut. The bolt must stand at least about 6.5 mm proud of the workpiece for this.
  parts:
  - knob
  hardware: []
  tool: fingers
- n: '7'
  text: 'Tighten by hand: turn the knob until its flat bottom face meets the workpiece
    (or its washer) and the joint is snug. The twelve flutes give your fingers the
    grip; no tool is needed. Tightening pulls the nut down onto the pocket floor,
    so the load goes through the 3 mm floor into the knob''s bottom face - the ribs
    only ever have to hold the nut''s own weight.'
  parts:
  - knob
  hardware: []
  tool: fingers
- n: '8'
  text: 'To remove or swap the nut: push it out from the flat bottom face with a 3
    mm rod or the M3 bolt itself, or lift it out of the bore with your fingernails.
    Re-seating the same nut a few times is fine; the ribs re-grip each time.'
  parts:
  - knob
  hardware:
  - m3_nut
  tool: 3 mm rod or the M3 bolt
