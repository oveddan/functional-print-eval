criteria:
- id: c_socket_press
  part: knob
  feature: hex_socket_flats
  relation: engages
  hardware: nut1
  clearance_mm: null
  params:
  - nut_af
  - pocket_af
  - corner_r
  check:
    method: coupon
    ref: fit coupon, five sockets at 5.35 / 5.45 / 5.55 / 5.65 / 5.75 across flats,
      printed with the socket corners relieved the same way
    description: Socket 5.40 AF vs the nut's 5.50 AF = 0.10 mm total (0.05 mm per
      flat) interference on the six flats only; the corners are relieved so the nut's
      corners never jam and the press needed is a firm thumb press.
- id: c_nut_enclosed
  part: knob
  feature: hex_socket + recess
  relation: contains
  hardware: nut1
  clearance_mm: null
  params:
  - nut_h
  - pocket_d
  - recess_d
  - knob_h
  check:
    method: template
    ref: socket depth 2.6 > nut height 2.4
    description: 'Seated nut stops on the floor with its outer face 0.2 mm below the
      socket mouth, and the socket mouth is 1.5 mm up inside the Ø15 relief, so the
      nut ends 1.7 mm inside the knob''s underside: fully inside.'
- id: c_nut_captive
  part: knob
  feature: socket_floor
  relation: supports
  hardware: nut1
  clearance_mm: null
  params:
  - bolt_hole_d
  - nut_af
  check:
    method: coupon
    ref: coupon floors (2.5 mm, Ø3.5 hole) - push the nut from either side with a
      2.5 mm hex key through the small hole
    description: The floor's Ø3.5 hole is smaller than the nut's 5.5 AF (and than
      its 6.35 across corners), so the nut cannot be pushed out through the far side;
      only the bolt passes through.
- id: c_nut_face_bears
  part: knob
  feature: socket_floor
  relation: faces
  hardware: nut1
  clearance_mm: null
  params:
  - shoulder_t
  - pocket_af
  - bolt_hole_d
  check:
    method: none
    ref: null
    description: The nut's bearing face lands flat on the 2.5 mm floor, which presents
      a ring about 0.95 mm wide at the flats and 1.4 mm at the corners, so tightening
      pulls the nut against solid plastic rather than into the bolt hole.
- id: c_bolt_through
  part: knob
  feature: bolt_clearance_hole (floor and cap face)
  relation: clears
  hardware: bolt1
  clearance_mm: 0.5
  params:
  - bolt_hole_d
  - bolt_d
  check:
    method: measure
    ref: Ø3.5 hole vs the M3 bolt's 3.0 mm major diameter
    description: '0.25 mm radial clearance on a coaxial hole: the bolt winds through
      the nut in the socket and its tip comes out of the small hole in the cap face,
      i.e. through the nut and out the other side.'
- id: c_no_support_print
  part: knob
  feature: print_orientation
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - knob_od
  - flute_dist
  - flute_r
  - recess_id
  check:
    method: template
    ref: 'printer limits: 45 deg overhang, 50 mm bridge'
    description: 'Printed cap-face down: the 45 deg edge chamfers are the steepest
      surfaces, the flutes are vertical, the socket walls are vertical, and the widest
      unsupported span is the Ø15 relief mouth (15 mm < 50 mm). No supports, no bridges.'
- id: c_socket_wall
  part: knob
  feature: wall_behind_hex_socket
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - knob_od
  - recess_id
  - flute_dist
  - flute_r
  - pocket_af
  - corner_r
  check:
    method: none
    ref: null
    description: 'Wall from the socket''s corner relief out to the rim: 8.0 - (3.12
      + 0.7) = 4.2 mm, still 3.5 mm where the flutes cut 0.7 mm deep, so pressing
      the nut in cannot split the knob.'
- id: c_grip
  part: knob
  feature: knob_od
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - knob_od
  - flute_count
  - flute_r
  - flute_dist
  check:
    method: none
    ref: null
    description: '20 mm across the twelve flute lobes (18.6 mm across the grooves),
      6.6 mm tall: comfortably turned between finger and thumb, no tool.'
manual:
- n: '1'
  text: 'Print part ''knob'' exactly as modelled: PLA, 0.2 mm layers, no supports,
    no brim. The flat Ø20 face with the small hole lies on the bed; the hexagonal
    socket and the wide recess face up and stay open.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Press the M3 hex nut into the hexagonal socket. Rest the knob on the bench
    (socket up), drop the nut in and line its hexagon up with the socket - the socket's
    corners are relieved, so it only has to be roughly aligned. Press it straight
    down with your thumb until it stops on the floor at the bottom, its face sitting
    just below the socket's lip. It is a firm press by design. If it fights you, stand
    the nut on a hard flat table and push the knob down onto it, or squeeze gently
    in a vise/G-clamp with flat jaws over the middle of the knob.
  parts:
  - knob
  hardware:
  - nut1
  tool: none
- n: '3'
  text: 'Check the nut is home and captive. Turn the knob over - the nut must stay
    put with no glue. Then poke a 2.5 mm hex key or a nail through the small hole
    in the top and push: the nut must not come out the other side. The knob is now
    finished.'
  parts:
  - knob
  hardware:
  - nut1
  tool: 2.5 mm hex key (or a nail)
- n: '4'
  text: Fit it to the bolt. Turn the knob over so the recessed nut faces down toward
    the job, set it on the end of the M3 bolt and turn it clockwise. The bolt winds
    through the nut and its tip comes out of the small hole in the top of the knob
    - if the bolt is longer, the tip simply shows further.
  parts:
  - knob
  hardware:
  - nut1
  - bolt1
  tool: 2.5 mm hex key (for the bolt, if needed elsewhere)
- n: '5'
  text: Tighten by hand, turning the knob clockwise. The press fit holds the nut in
    the socket, so the knob drives the bolt; the bolt head stays on the far side of
    the job. To remove the nut again at any time, push it out with a 2.5 mm hex key
    through the small hole in the top.
  parts:
  - knob
  hardware:
  - nut1
  - bolt1
  tool: none
