task: nut-knob/M3
note: 'A 20 mm scalloped hand knob that carries a pressed-in ISO 4032 M3 nut. Everything
  prints as one piece, no supports, no glue: the flat cap face (with the small central
  hole) goes on the bed, the hexagonal nut socket plus a wide Ø15 relief face up.
  A 2.5 mm floor under the socket carries a Ø3.5 clearance hole, so the bolt winds
  through the nut and out of the cap face, while the nut itself is trapped - the 3.5
  hole is far smaller than its 5.5 AF - and sits fully inside the knob, 1.7 mm up
  from the underside. The socket''s six corners are relieved (Ø1.4 cylinders at the
  vertices) so only the nut''s flats carry the press fit, and a 0.5 mm lead-in counterbore
  makes the press easy to start by hand.


  Because neither the nut measurement nor the coupon feedback came back, the socket
  across-flats is calculated rather than trialled: 5.40 mm, i.e. 0.10 mm (0.05 mm
  per flat) under the catalog 5.5 AF, which is the usual hand-press figure for PLA
  against steel and stays in interference even if your nut sits at the low end of
  ISO 4032''s tolerance (5.32 mm). If it turns out loose, print again with pocket_af
  5.30; if it fights you, 5.50.'
questions:
- text: Which M3 bolt are you actually using? The knob needs about 6.6 mm of thread,
    measured from the face the knob sits on, for the bolt to reach - and come out
    of - the cap face, plus whatever thickness it clamps. I have listed an ISO 4762
    M3x16; a longer screw is fine (its tip just protrudes further out of the top),
    a shorter one may not reach.
  answer: null
- text: How did the nut's press fit feel when you tried it? The socket is 5.40 mm
    across flats (catalog nut AF 5.5 minus 0.10), so it should be a firm thumb press
    that will not fall out when inverted. If it was too loose or too tight, tell me
    which way and I will move pocket_af - 5.30 if loose, 5.50 if tight.
  answer: null
- text: If the nut ends up looser than you would like, one wrap of PTFE/plumber's
    tape around the nut's flats takes up the slack. That is a shim, not glue, so it
    stays within your no-glue rule.
  answer: null
params:
  bolt_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: M3 major diameter, ISO 4762
  bolt_head_d:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: socket head diameter
  bolt_head_h:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_hole_d:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: clearance hole through the 2.5 mm floor and the cap face; 3.5 < the nut's
      5.5 AF, which is what stops the nut being driven out
  bolt_len:
    value: 16.0
    unit: mm
    kind: hardware
    source: catalog
    note: recommended ISO 4762 M3x16; any M3 socket screw works provided the thread
      is at least ~7 mm longer than the total thickness it clamps, so the tip reaches
      out of the cap face
  corner_r:
    value: 0.7
    unit: mm
    kind: design
    source: design
    note: radius of the relief cylinder cut at each socket vertex, so the nut's corners
      do not jam and only its flats press
  edge_chamfer:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: 45 deg chamfer on both outer edges
  flute_count:
    value: 12
    unit: mm
    kind: design
    source: design
    note: finger flutes around the rim
  flute_dist:
    value: 11.3
    unit: mm
    kind: design
    source: design
    note: flute cutters' axis distance from the knob axis (= OD/2 - 0.7 + flute_r)
  flute_r:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: flute cutter radius; grooves come out 2.85 mm wide and 0.7 mm deep
  knob_h:
    value: 6.6
    unit: mm
    kind: design
    source: design
    note: = shoulder_t + pocket_d + recess_d = 2.5 + 2.6 + 1.5. Also the thread length
      the bolt needs from the mating face to reach the cap face.
  knob_od:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: across the flute lobes; the user asked for about 20 mm across
  lead_in_af_add:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: extra across-flats of the counterbore at the socket mouth (5.40 + 0.8 =
      6.20)
  lead_in_d:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: depth of that lead-in counterbore, so the nut drops in 0.5 mm before it
      starts to press
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 width across flats; the person could not measure their nut
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 nut height
  pocket_af:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: 'socket across flats = nut AF - 0.10, i.e. 0.05 mm interference per flat:
      a firm hand press that still grips if the nut is on the small side of tolerance'
  pocket_d:
    value: 2.6
    unit: mm
    kind: design
    source: design
    note: socket depth = nut_h + 0.2, so the seated nut's outer face stays 0.2 mm
      inside the socket mouth
  recess_d:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: depth of the Ø15 relief in the underside; puts the socket mouth 1.5 mm up
      inside the knob so the nut ends up fully enclosed and the rim, not the nut,
      bears on the job
  recess_id:
    value: 15.0
    unit: mm
    kind: design
    source: design
    note: relief diameter; keeps 1.8 mm of wall where the flutes cut deepest
  shoulder_t:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: floor between the socket and the cap face; carries the nut and the bolt
      hole
parts:
- id: knob
  role: final
  material: PLA (high-speed PLA, 0.4 mm nozzle, 0.2 mm layers)
  code: "import math\n\ndef build(p):\n    Rs = p.knob_od / 2.0\n    ri = p.recess_id\
    \ / 2.0\n    floor_z = p.shoulder_t + p.pocket_d\n    H = floor_z + p.recess_d\n\
    \    ch = p.edge_chamfer\n\n    # solid of revolution: cap face on the bed, socket\
    \ + relief opening upward\n    prof = [\n        (0.0, 0.0),\n        (Rs - ch,\
    \ 0.0),\n        (Rs, ch),\n        (Rs, H - ch),\n        (Rs - ch, H),\n   \
    \     (ri, H),\n        (ri, floor_z),\n        (0.0, floor_z),\n    ]\n    body\
    \ = cq.Workplane(\"XZ\").polyline(prof).close().revolve(360.0, (0, 0, 0), (0,\
    \ 0, 1))\n\n    # bolt clearance hole through the floor, out of the cap face\n\
    \    body = body.cut(\n        cq.Workplane(\"XY\").workplane(offset=-1.0)\n \
    \       .circle(p.bolt_hole_d / 2.0).extrude(p.shoulder_t + 1.5)\n    )\n\n  \
    \  def hexwire(af, z):\n        R = af / math.sqrt(3.0)\n        pts = [(R * math.cos(math.radians(60.0\
    \ * i)),\n                R * math.sin(math.radians(60.0 * i))) for i in range(6)]\n\
    \        return cq.Workplane(\"XY\").workplane(offset=z).polyline(pts).close()\n\
    \n    # hexagonal socket for the nut, its floor at z = shoulder_t\n    body =\
    \ body.cut(hexwire(p.pocket_af, p.shoulder_t).extrude(p.pocket_d + 1.6))\n\n \
    \   # relief at each socket vertex: only the nut's flats carry the press fit\n\
    \    R = p.pocket_af / math.sqrt(3.0)\n    for k in range(6):\n        a = math.radians(60.0\
    \ * k)\n        body = body.cut(\n            cq.Workplane(\"XY\").workplane(offset=p.shoulder_t)\n\
    \            .moveTo(R * math.cos(a), R * math.sin(a))\n            .circle(p.corner_r).extrude(p.pocket_d\
    \ + 1.6)\n        )\n\n    # lead-in counterbore at the socket mouth\n    body\
    \ = body.cut(\n        hexwire(p.pocket_af + p.lead_in_af_add, floor_z - p.lead_in_d)\n\
    \        .extrude(p.lead_in_d + 1.0)\n    )\n\n    # finger flutes\n    for k\
    \ in range(p.flute_count):\n        a = 2.0 * math.pi * k / p.flute_count\n  \
    \      body = body.cut(\n            cq.Workplane(\"XY\").workplane(offset=-0.5)\n\
    \            .moveTo(p.flute_dist * math.cos(a), p.flute_dist * math.sin(a))\n\
    \            .circle(p.flute_r).extrude(H + 2.0)\n        )\n\n    return body"
  print_orientation: The flat Ø20 cap face (the one with the small central hole) on
    the bed at z = 0; the hexagonal nut socket and the wide Ø15 relief face up and
    open. Every layer is fully supported - the only inclined surfaces are the two
    45 deg edge chamfers and the inward-facing socket lead-in - so no supports and
    no brim are needed.
  use_orientation: 'Flipped over from the print: the flat face with the small hole
    becomes the top (cap) of the knob, and the wide recess holding the nut faces down
    onto the job. The bolt comes up from below into the nut and its tip shows through
    the small hole in the top.'
