manual:
- n: '1'
  text: 'Print knob.stl in PLA at 0.2 mm layers, 3 perimeters, 15-20% infill, no supports.
    It is modelled as it prints: flat bottom face on the bed, grip flutes vertical,
    the big socket opening upward. Nothing overhangs more than 4.4 degrees off vertical,
    so leave supports off.'
  parts:
  - knob
  hardware: []
  tool: 3D printer
- n: '2'
  text: 'Get to know the part. Top face: a round 8.5 mm recess with a hex socket sunk
    in the bottom of it. Bottom face: a 3.4 mm hole through the floor. The grip is
    the row of scallops around the rim.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Drop the M3 hex nut into the round recess, flats lined up with the hex socket,
    then press it down with your thumb until it stops. It gets steadily tighter as
    it goes - that is the taper gripping - and it should finish about 2 mm below the
    top face, fully inside the knob. Do not hammer it; a firm thumb pressure is the
    whole point.
  parts:
  - knob
  hardware:
  - nut_m3
  tool: null
- n: '4'
  text: 'Turn the knob upside down and tap it on the table. The nut must stay put.
    Two things hold it: the taper pinches its flats, and the 3 mm floor stops it falling
    out the far side because the floor''s hole is only 3.4 mm across.'
  parts:
  - knob
  hardware:
  - nut_m3
  tool: null
- n: '5'
  text: Hold the knob socket-up and thread your M3 bolt in from the bottom face. It
    goes through the 3.4 mm floor hole, picks up the nut's thread, and comes out the
    other side into the round recess. You want at least 6 mm of bolt sticking out
    of whatever you are clamping, otherwise it cannot reach through the nut.
  parts:
  - knob
  hardware:
  - bolt_m3
  tool: null
- n: '6'
  text: Tighten by hand. Turning the knob drives the nut on the bolt's thread; the
    hex socket walls carry the torque, and the nut is pulled down flat onto the socket
    floor, so the tightening load lands on solid printed material and cannot push
    the nut out. No tool, no glue.
  parts:
  - knob
  hardware:
  - bolt_m3
  - nut_m3
  tool: null
- n: '7'
  text: To take it off, just unscrew the knob. The nut stays captive in the knob and
    can be reused. If you ever want to press it out, push it from the bottom hole
    side with the tip of another M3 bolt - it takes a deliberate push, which is why
    it does not fall out on its own.
  parts:
  - knob
  hardware:
  - nut_m3
  tool: null
