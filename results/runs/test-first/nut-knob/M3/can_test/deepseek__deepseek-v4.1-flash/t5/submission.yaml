parts:
- id: knob
  role: final
  material: PLA
  code: "def build(p):\n    import math\n\n    def hexw(af, z):\n        r = af /\
    \ math.sqrt(3.0)\n        pts = []\n        for i in range(6):\n            a\
    \ = math.radians(60.0 * i + 30.0)\n            pts.append(cq.Vector(r * math.cos(a),\
    \ r * math.sin(a), z))\n        return cq.Wire.makePolygon(pts, close=True)\n\n\
    \    R = p.knob_od / 2.0\n    h = p.knob_h\n    z0 = p.floor_t\n    z1 = z0 +\
    \ p.band_h\n\n    # body\n    body = cq.Workplane(\"XY\").circle(R).extrude(h)\n\
    \    body = body.faces(\">Z\").chamfer(p.top_chamfer)\n\n    # finger-grip scallops,\
    \ full height\n    for i in range(int(p.flute_n)):\n        a = 2.0 * math.pi\
    \ * i / p.flute_n\n        body = body.cut(cq.Workplane(\"XY\")\n            \
    \            .circle(p.flute_r)\n                        .extrude(h + 2.0)\n \
    \                       .translate((R * math.cos(a), R * math.sin(a), -1.0)))\n\
    \n    # tapered hex nut socket: wide at the mouth, narrower than the nut at the\
    \ seat\n    socket = cq.Solid.makeLoft([hexw(p.af_bot, z0), hexw(p.af_top, z1)],\
    \ ruled=True)\n    body = body.cut(cq.Workplane(\"XY\").newObject([socket]))\n\
    \n    # relieve the six socket corners so the nut rides on the flats only\n  \
    \  mid = 0.5 * (p.af_bot + p.af_top)\n    rv = mid / math.sqrt(3.0)\n    for i\
    \ in range(6):\n        a = math.radians(60.0 * i + 30.0)\n        body = body.cut(cq.Workplane(\"\
    XY\")\n                        .workplane(offset=z0)\n                       \
    \ .center(rv * math.cos(a), rv * math.sin(a))\n                        .circle(p.relief_r)\n\
    \                        .extrude(z1 - z0 + 0.5))\n\n    # round counterbore above\
    \ the socket, so a thumb can press the nut home\n    body = body.cut(cq.Workplane(\"\
    XY\")\n                    .workplane(offset=z1)\n                    .circle(p.recess_d\
    \ / 2.0)\n                    .extrude(h - z1 + 1.0))\n\n    # bolt clearance\
    \ hole through the floor; the nut cannot pass this\n    body = body.cut(cq.Workplane(\"\
    XY\").circle(p.bolt_clear_d / 2.0).extrude(z0))\n    return body\n"
  print_orientation: flat bottom face (the face that rests on the workpiece) on the
    bed at z=0; grip scallops vertical; nut socket opening upward
  use_orientation: bottom face against the workpiece, socket up; nut pressed in from
    the open top face, bolt threaded in from the bottom
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    import math\n\n    def hexw(af, z, cx=0.0, cy=0.0):\n\
    \        r = af / math.sqrt(3.0)\n        pts = []\n        for i in range(6):\n\
    \            a = math.radians(60.0 * i + 30.0)\n            pts.append(cq.Vector(cx\
    \ + r * math.cos(a), cy + r * math.sin(a), z))\n        return cq.Wire.makePolygon(pts,\
    \ close=True)\n\n    h = p.coupon_h\n    z0 = p.floor_t\n    z1 = z0 + p.band_h\n\
    \n    body = cq.Workplane(\"XY\").box(p.coupon_len, p.coupon_w, h, centered=(True,\
    \ True, False))\n\n    for k, afb in enumerate([p.af_bot_a, p.af_bot_b, p.af_bot_c]):\n\
    \        cx = (k - 1) * p.pocket_pitch\n        secs = [(z0, afb),\n         \
    \       (z1, p.af_top),\n                (h - p.entry_chamfer, p.af_top),\n  \
    \              (h + 1.0, p.af_top + 2.0 * (p.entry_chamfer + 1.0))]\n        loft\
    \ = cq.Solid.makeLoft([hexw(af, z, cx) for z, af in secs], ruled=True)\n     \
    \   body = body.cut(cq.Workplane(\"XY\").newObject([loft]))\n\n        mid = 0.5\
    \ * (afb + p.af_top)\n        rv = mid / math.sqrt(3.0)\n        for i in range(6):\n\
    \            a = math.radians(60.0 * i + 30.0)\n            body = body.cut(cq.Workplane(\"\
    XY\")\n                            .workplane(offset=z0)\n                   \
    \         .center(cx + rv * math.cos(a), rv * math.sin(a))\n                 \
    \           .circle(p.relief_r)\n                            .extrude(h - z0 +\
    \ 2.0))\n\n        body = body.cut(cq.Workplane(\"XY\").circle(p.bolt_clear_d\
    \ / 2.0)\n                        .extrude(p.floor_t).translate((cx, 0, 0)))\n\
    \n        for i in range(k + 1):\n            px = cx + (i - k / 2.0) * p.pip_pitch\n\
    \            body = body.cut(cq.Workplane(\"XY\")\n                          \
    \  .workplane(offset=h - p.pip_depth)\n                            .center(px,\
    \ -p.pip_y)\n                            .circle(p.pip_d / 2.0)\n            \
    \                .extrude(p.pip_depth + 1.0))\n    return body\n"
  print_orientation: flat base on the bed (z=0), sockets opening upward
  use_orientation: test piece only. Socket A (1 label hole) is tightest, B (2 holes)
    matches the knob, C (3 holes) is loosest. Print this instead of guessing if the
    nut will not press in or will not stay put
