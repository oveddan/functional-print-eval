task: nut-knob/M3
note: 'One printed knob, Ø20 x 8 mm, with a captive M3 hex nut.


  How the nut is held: the socket in the top face is not a straight hex hole. It is
  a shallow round counterbore (Ø8.5, 2 mm deep) so your thumb can follow the nut down,
  and at its bottom a hex socket that tapers from 5.80 mm across flats at the mouth
  to 5.34 mm at the seat -- i.e. the mouth is wider than the nut (it always starts)
  and the bottom is narrower than the nut (it always ends up wedged and gripped).
  That taper is deliberate self-tuning: whatever your nut actually measures and however
  your printer rounds a hex hole, the nut stops where it is a light press and is held
  there by friction. No glue, no snap, no set screw.


  The six socket corners are relieved with Ø1.4 bores. My first test coupon proved
  that a sharp printed hex corner grabs the nut''s corners and stops it going in at
  all, long before the flats touch; with the corners relieved the nut rides on the
  flats only, which is what gives a predictable press.


  Below the nut is a 3 mm floor with a 3.4 mm bolt hole. The nut is wider than that
  hole, so it cannot be pushed out through the far side -- and when you tighten, the
  nut is drawn down onto that floor, so the tightening load is taken by solid material
  rather than by the press fit. The press fit only has to beat gravity when the knob
  is inverted.


  The bolt enters through the 3.4 mm hole in the bottom face, threads through the
  nut, and comes out into the round recess. Because the socket and nut sit only ~5.4
  mm above the workpiece, that means the bolt needs to stick out about 6 mm or more
  to pass fully through the nut, and anything beyond ~8 mm will stand proud of the
  knob''s top face -- which is what "out the other side" implies. If your bolt is
  shorter than 6 mm, tell me and I will flatten the floor to suit.


  Print as modelled: flat bottom face on the bed, flutes vertical, socket up. No supports,
  no bridging anywhere -- the deepest hole is the 3.4 mm one, and the socket walls
  lean only 4.4 degrees off vertical.


  Caveat: I could not get a verdict from either fit test print (the first came back
  "won''t go in" for all three coupon sockets, which is what drove the corner relief
  and the taper; the second and third came back "can''t tell"). The design does not
  depend on that verdict because the taper self-selects, but if the nut drops out,
  or will not press in at all, that is a one-parameter fix and I have written down
  which way to move it.'
questions:
- text: How far does your M3 bolt stick out past the surface it clamps? If it is under
    about 6 mm, I need to thin the floor so the bolt can reach through the nut.
  answer: null
- text: 'When you press the nut in: did it go in by thumb and stay put when you turned
    the knob upside down? If it was too stiff or too loose, say which and I will move
    the socket''s narrow end by 0.1 mm.'
  answer: null
