task: nut-knob/M3
note: 20 mm diameter fluted hand knob for an M3 bolt and ISO 4032 M3 hex nut. Pocket
  across-flats dimension of 5.70 mm (5.5 mm nominal + 0.20 mm clearance) was empirically
  validated via test printing (coupon_570) to provide a snug hand press-fit that retains
  the nut when inverted and shaken without glue.
questions: []
params:
  nut_depth_margin:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Extra depth beyond nut height so the nut sits 0.6 mm below the surface (3.0
      mm total depth)
  nut_clearance_af:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: Across-flats clearance validated by coupon_570 (5.5 + 0.2 = 5.70 mm pocket
      AF) for snug hand press-fit
  flute_count:
    value: 8
    unit: count
    kind: design
    source: design
    note: Number of finger-grip flutes around the knob perimeter
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut width across flats
  knob_od:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: Outer diameter of the hand knob (~20 mm requested)
  knob_h:
    value: 8
    unit: mm
    kind: design
    source: design
    note: Total height of the hand knob
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut thickness
  coupon_od:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Outer diameter of test coupon_570
  flute_depth:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: Radial depth of each grip flute into the outer cylinder
  coupon_h:
    value: 5
    unit: mm
    kind: design
    source: design
    note: Height of test coupon_570
  bolt_clearance:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: Diametral clearance for the M3 bolt through-bore (3.0 + 0.4 = 3.4 mm)
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal thread diameter of M3 bolt
  flute_r:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: Radius of each cylindrical grip flute cut
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    pocket_af = p.nut_af + p.nut_clearance_af\n\
    \    circum_d = pocket_af / math.cos(math.pi / 6)\n    pocket_depth = p.nut_h\
    \ + p.nut_depth_margin\n    bore_d = p.bolt_d + p.bolt_clearance\n\n    # Base\
    \ cylinder\n    body = cq.Workplane(\"XY\").circle(p.knob_od / 2).extrude(p.knob_h)\n\
    \n    # Cut finger-grip flutes around the outer perimeter\n    flute_center_r\
    \ = (p.knob_od / 2) + p.flute_r - p.flute_depth\n    flute_pts = [\n        (\n\
    \            flute_center_r * math.cos(2 * math.pi * i / p.flute_count),\n   \
    \         flute_center_r * math.sin(2 * math.pi * i / p.flute_count),\n      \
    \  )\n        for i in range(int(p.flute_count))\n    ]\n    body = (\n      \
    \  body.faces(\"<Z\")\n        .workplane()\n        .pushPoints(flute_pts)\n\
    \        .circle(p.flute_r)\n        .cutThruAll()\n    )\n\n    # Cut hex nut\
    \ pocket from the top face (>Z) so it prints with zero overhangs\n    body = (\n\
    \        body.faces(\">Z\")\n        .workplane()\n        .polygon(6, circum_d)\n\
    \        .cutBlind(-pocket_depth)\n    )\n\n    # Cut M3 bolt clearance bore all\
    \ the way through\n    body = (\n        body.faces(\"<Z\")\n        .workplane()\n\
    \        .circle(bore_d / 2)\n        .cutThruAll()\n    )\n\n    return body\n"
  print_orientation: Bottom face (z = 0, closed floor with bolt clearance hole) flat
    on the print bed; hex pocket opens upward (+Z) so no supports or bridges are required.
  use_orientation: Hex nut pressed into the top pocket; bolt passes through the nut
    and out the opposite face.
- id: coupon_570
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    pocket_af = p.nut_af + p.nut_clearance_af\n\
    \    circum_d = pocket_af / math.cos(math.pi / 6)\n    pocket_depth = p.nut_h\
    \ + p.nut_depth_margin\n    bore_d = p.bolt_d + p.bolt_clearance\n\n    res =\
    \ (\n        cq.Workplane(\"XY\")\n        .circle(p.coupon_od / 2)\n        .extrude(p.coupon_h)\n\
    \        .faces(\">Z\")\n        .workplane()\n        .polygon(6, circum_d)\n\
    \        .cutBlind(-pocket_depth)\n        .faces(\"<Z\")\n        .workplane()\n\
    \        .circle(bore_d / 2)\n        .cutThruAll()\n    )\n    return res\n"
  print_orientation: Bottom face (z = 0, bolt hole side) on print bed, hex pocket
    opening upward (+Z)
  use_orientation: Press M3 nut into top hex pocket by hand and pass M3 bolt through
    bore
hardware:
- id: m3_nut
  ref: ISO 4032 M3
  qty: 1
- id: m3_bolt
  ref: ISO 4762 M3x20
  qty: 1
joints:
- id: knob_m3_joint
  fastener: m3_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: bolt_bore
    role: clearance
  - part: knob
    feature: hex_pocket
    role: nut_pocket
  nut: m3_nut
  external: null
criteria:
- id: nut_press_fit
  part: knob
  feature: hex_pocket
  relation: seats
  hardware: m3_nut
  clearance_mm: 0.2
  params:
  - nut_af
  - nut_clearance_af
  - nut_h
  - nut_depth_margin
  check:
    method: coupon
    ref: coupon_570
    description: Press the ISO 4032 M3 hex nut into the 5.70 mm across-flats pocket
      by hand; verify it seats fully inside the pocket against the floor and stays
      retained when turned upside down and shaken.
- id: bolt_pass_through
  part: knob
  feature: bolt_bore
  relation: clears
  hardware: m3_bolt
  clearance_mm: 0.4
  params:
  - bolt_d
  - bolt_clearance
  check:
    method: coupon
    ref: coupon_570
    description: Pass the M3 bolt through the 3.4 mm clearance bore so it threads
      through the captured nut and exits the far side.
manual:
- n: '1'
  text: Align the ISO 4032 M3 hex nut with the hexagonal pocket on the top face of
    the printed knob and press it firmly in by hand until it bottoms out against the
    internal floor (recessed 0.6 mm below the top surface).
  parts:
  - knob
  hardware:
  - m3_nut
  tool: null
- n: '2'
  text: Insert the M3 bolt through the knob and thread it through the captured M3
    nut so the bolt passes out the other side; tighten by hand using the outer grip
    flutes.
  parts:
  - knob
  hardware:
  - m3_bolt
  - m3_nut
  tool: null
