task: nut-knob/M3
note: ''
questions:
- text: 'The test print reported only ''5.20 mm pocket: I can''t tell you how that
    one came out''. Whether the nut presses past the 5.2 lip and stays captured is
    unverified.'
  answer: null
params:
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: design
    note: knob outer diameter
  knob_h:
    value: 8
    unit: mm
    kind: design
    source: design
    note: total height; nut enters from the top
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height
  pocket_af:
    value: 5.7
    unit: mm
    kind: design
    source: design
    note: hex pocket below the lip, clearance for nut
  pocket_depth:
    value: 2.6
    unit: mm
    kind: design
    source: design
    note: nut height plus 0.2 mm
  lip_af:
    value: 5.2
    unit: mm
    kind: design
    source: design
    note: top lip opening across flats, 0.3 mm under nut, press-in catch
  lip_h:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: lip thickness at top
  roof_t:
    value: 4.8
    unit: mm
    kind: design
    source: design
    note: solid under the nut pocket, bolt passes through
  hole_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: M3 clearance hole through roof
parts:
- id: knob
  role: final
  material: PLA high-speed black
  code: "import math\n\ndef build(p):\n    body = cq.Workplane('XY').circle(p.knob_d\
    \ / 2).extrude(p.knob_h)\n    body = body.faces('>Z').edges().chamfer(1.0)\n \
    \   z0 = p.roof_t\n    pocket_d = 2 * p.pocket_af / math.sqrt(3)\n    pocket =\
    \ cq.Workplane('XY').workplane(offset=z0).polygon(6, pocket_d).extrude(p.pocket_depth)\n\
    \    z1 = z0 + p.pocket_depth\n    lip_d = 2 * p.lip_af / math.sqrt(3)\n    lip\
    \ = cq.Workplane('XY').workplane(offset=z1).polygon(6, lip_d).extrude(p.knob_h\
    \ - z1 + 1)\n    hole = cq.Workplane('XY').circle(p.hole_d / 2).extrude(p.knob_h)\n\
    \    return body.cut(pocket).cut(lip).cut(hole)\n"
  print_orientation: bolt-side roof face (bottom of the knob) on the bed; nut pocket
    opens upward
  use_orientation: knob upright, nut inserted from the top; roof at the bottom
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: nut_pocket
  part: knob
  feature: hex nut pocket 5.7 af, 2.6 deep
  relation: contains
  hardware: nut
  clearance_mm: 0.1
  params:
  - pocket_af
  - pocket_depth
  - nut_af
  - nut_h
  check:
    method: coupon
    ref: knob test print, 5.20 lip reading inconclusive
    description: Press the M3 nut in from the top; it should seat fully in the pocket.
- id: nut_lip
  part: knob
  feature: top lip 5.2 af opening
  relation: engages
  hardware: nut
  clearance_mm: -0.3
  params:
  - lip_af
  - lip_h
  check:
    method: coupon
    ref: knob test print
    description: 'Nut must not fall out when knob is inverted; lip must snap the nut
      in and hold it. Unverified: test print outcome was unclear.'
- id: bolt_hole
  part: knob
  feature: M3 clearance hole through roof
  relation: clears
  hardware: null
  clearance_mm: 0.4
  params:
  - hole_d
  check:
    method: measure
    ref: null
    description: 3.4 mm hole passes an M3 bolt
manual:
- n: '1'
  text: Print the knob with the flat bottom (bolt-side roof) on the bed. No supports
    needed.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Remove any stringing from the hex opening at the top of the knob.
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Align the M3 hex nut with the top opening so its flats match the hex, then
    press it straight down through the lip until it seats at the bottom of the pocket.
    Firm hand pressure should be enough.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Turn the knob upside down and shake gently to confirm the nut stays captured.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Thread the M3 bolt up through the bolt hole in the roof and into the nut;
    tighten by hand using the knob.
  parts: []
  hardware: []
  tool: null
