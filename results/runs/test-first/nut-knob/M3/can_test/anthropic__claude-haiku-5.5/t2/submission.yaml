task: nut-knob/M3
note: ''
questions: []
params:
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: knob outside diameter, as requested
  knob_h:
    value: 12
    unit: mm
    kind: design
    source: design
    note: knob height; leaves about 9 mm of solid above the nut pocket
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 thickness
  pocket_af:
    value: 5.7
    unit: mm
    kind: design
    source: measured
    note: 'coupon test: 5.7 mm pocket takes the nut snugly by hand and holds it when
      inverted and shaken; 5.6 too tight, 5.8 looser'
  pocket_depth:
    value: 2.6
    unit: mm
    kind: design
    source: design
    note: nut thickness 2.4 plus 0.2 so the nut sits fully inside
  bolt_clear_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: M3 clearance hole for the bolt
parts:
- id: knob
  role: final
  material: PLA high-speed black
  code: "import math\n\ndef build(p):\n    H = p.knob_h\n    body = cq.Workplane('XY').circle(p.knob_d\
    \ / 2).extrude(H)\n    body = body.faces('<Z').edges().chamfer(0.8)\n    d = p.pocket_af\
    \ / math.cos(math.pi / 6)\n    pocket = cq.Workplane('XY').workplane(offset=H\
    \ - p.pocket_depth).polygon(6, d).extrude(p.pocket_depth + 1)\n    hole = cq.Workplane('XY').circle(p.bolt_clear_d\
    \ / 2).extrude(H + 2).translate((0, 0, -1))\n    return body.cut(pocket).cut(hole)\n"
  print_orientation: bolt-exit face (top of knob) on the bed, nut pocket opening facing
    up
  use_orientation: nut pocket opening facing down, bolt-exit face up
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: nut-in-pocket
  part: knob
  feature: hex nut pocket, 5.7 mm across flats, 2.6 mm deep
  relation: contains
  hardware: nut
  clearance_mm: 0.2
  params:
  - pocket_af
  - pocket_depth
  - nut_af
  - nut_h
  check:
    method: coupon
    ref: null
    description: 5.7 mm pocket took the nut snugly by hand and held it when inverted
      and shaken
- id: bolt-clear
  part: knob
  feature: 3.4 mm bolt clearance hole through the top
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - bolt_clear_d
  check:
    method: none
    ref: null
    description: 3.4 mm clearance for M3 bolt; not coupon tested
manual:
- n: '1'
  text: Print the knob with the flat top face on the print bed. The nut pocket opens
    upward. No supports needed.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Remove any stringing from the hex pocket and check the pocket with the nut
    before pressing.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Turn the knob so the nut pocket faces you. Press the M3 hex nut into the pocket
    by hand, so it seats flat against the pocket ceiling inside the knob.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Turn the knob over and shake it to confirm the nut stays in. Do not use glue.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Thread the M3 bolt up through the work and into the captured nut, turning
    the knob to tighten. The bolt passes through the clearance hole in the knob's
    top face.
  parts: []
  hardware: []
  tool: null
