task: nut-knob/M5
note: 'The pocket size comes from the coupon test: 8.10 mm across flats was a snug
  hand press, and the nut stayed in when turned upside down.'
questions: []
params:
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  pocket_af:
    value: 8.1
    unit: mm
    kind: design
    source: design
    note: 'coupon result: 8.10 pressed in by hand, snug, held when upside down and
      shaken; 8.00 was tight, 8.20 loose'
  pocket_depth:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: nut_h + 0.3, so the nut sits fully below the surface
  bolt_clear_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: M5 clearance, well under the nut's 8 mm flats, so the nut can't be pushed
      out the far side
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: ''
  knob_h:
    value: 12
    unit: mm
    kind: design
    source: design
    note: ''
  flute_count:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
  flute_r:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "def build(p):\n    R = p.knob_d / 2\n    knob = cq.Workplane('XY').circle(R).extrude(p.knob_h)\n\
    \    import math\n    for i in range(int(p.flute_count)):\n        a = 2 * math.pi\
    \ * i / p.flute_count\n        f = (cq.Workplane('XY').center((R + 1.0) * math.cos(a),\
    \ (R + 1.0) * math.sin(a))\n             .circle(p.flute_r).extrude(p.knob_h))\n\
    \        knob = knob.cut(f)\n    d = p.pocket_af * 2 / 3 ** 0.5\n    pocket =\
    \ (cq.Workplane('XY').workplane(offset=p.knob_h - p.pocket_depth)\n          \
    \    .polygon(6, d).extrude(p.pocket_depth + 1))\n    knob = knob.cut(pocket)\n\
    \    hole = cq.Workplane('XY').circle(p.bolt_clear_d / 2).extrude(p.knob_h)\n\
    \    return knob.cut(hole)\n"
  print_orientation: Closed face (with only the round bolt hole) on the bed, hex pocket
    opening upward. No overhangs, no supports.
  use_orientation: Pocket side faces the bolt head / work; bolt end comes out of the
    closed face
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
joints: []
criteria:
- id: nut_retained
  part: knob
  feature: hex pocket
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - pocket_af
  - nut_af
  - pocket_depth
  - nut_h
  check:
    method: coupon
    ref: nut_fit_coupon
    description: '8.10 mm pocket: pressed in by hand and held when turned upside down
      and shaken'
- id: nut_no_pushthrough
  part: knob
  feature: pocket floor with bolt hole
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - bolt_clear_d
  - nut_af
  check:
    method: none
    ref: null
    description: The 5.5 mm hole is smaller than the 8 mm nut flats, and the floor
      is 7 mm thick
manual:
- n: '1'
  text: Print the knob with the flat closed face on the bed (pocket facing up), no
    supports. Use the same settings as the test coupon so the fit comes out the same.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Line the M5 hex nut up with the hex pocket and press it in by hand until it
    sits on the pocket floor, just under the surface. It should feel snug, like the
    8.10 pocket on the coupon.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Put your M5 bolt into the pocket side, thread it through the nut and out through
    the round hole in the closed face. Turn the knob by hand to tighten.
  parts:
  - knob
  hardware:
  - nut
  tool: null
