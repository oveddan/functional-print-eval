task: nut-knob/M5
note: You print the knob with the pocket facing up, so nothing has to bridge. The
  8.00 mm pocket size comes from your test print.
questions: []
params:
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  pocket_af:
    value: 8
    unit: mm
    kind: design
    source: design
    note: 'From the coupon: the 8.00 pocket took the nut by hand, tight, and kept
      it in upside down while shaken. 8.10 also held but was looser.'
  bolt_clear_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Smaller than the nut's 8 mm across flats, so the nut can't pass through
      the floor
  nut_recess:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: The nut sits this far below the top face
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: ''
  knob_h:
    value: 12
    unit: mm
    kind: design
    source: design
    note: ''
  grip_n:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
  grip_r:
    value: 3
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    h=p.knob_h\n    body=cq.Workplane('XY').circle(p.knob_d/2).extrude(h)\n\
    \    body=body.edges('>Z').chamfer(0.8).edges('<Z').chamfer(0.4)\n    for i in\
    \ range(int(p.grip_n)):\n        a=2*math.pi*i/p.grip_n\n        c=cq.Workplane('XY').center(p.knob_d/2*math.cos(a),p.knob_d/2*math.sin(a)).circle(p.grip_r).extrude(h)\n\
    \        body=body.cut(c)\n    depth=p.nut_h+p.nut_recess\n    pk=cq.Workplane('XY').workplane(offset=h-depth).polygon(6,p.pocket_af/math.cos(math.radians(30))).extrude(depth+1)\n\
    \    body=body.cut(pk)\n    hole=cq.Workplane('XY').circle(p.bolt_clear_d/2).extrude(h)\n\
    \    body=body.cut(hole)\n    return body"
  print_orientation: flat bottom on the bed, hex pocket opening facing up
  use_orientation: The bolt enters through the small hole in the bottom face, threads
    through the nut and comes out of the pocket side
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
joints: []
criteria:
- id: nut_press_fit
  part: knob
  feature: hex pocket
  relation: seats
  hardware: nut
  clearance_mm: null
  params:
  - pocket_af
  - nut_af
  check:
    method: coupon
    ref: nut_fit_coupon
    description: The 8.00 pocket took the nut by hand, tight, and kept it in upside
      down while shaken
- id: nut_fully_inside
  part: knob
  feature: pocket depth
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_h
  - nut_recess
  check:
    method: measure
    ref: null
    description: Nut top sits about 0.4 mm below the knob face
- id: nut_no_pushthrough
  part: knob
  feature: pocket floor with 5.5 hole
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - bolt_clear_d
  - nut_af
  check:
    method: none
    ref: null
    description: A 5.5 hole is smaller than 8 across flats
- id: bolt_clear
  part: knob
  feature: bolt hole
  relation: clears
  hardware: null
  clearance_mm: 0.5
  params:
  - bolt_clear_d
  check:
    method: none
    ref: null
    description: ''
manual:
- n: '1'
  text: Print the knob flat on the bed with the hex pocket facing up. It needs no
    supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Line the M5 nut's flats up with the pocket and press it in with your thumb
    (or press on a table) until it sits just below the top face. It's meant to be
    tight.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Push your M5 bolt in through the small hole in the bottom of the knob and
    screw it through the nut so it comes out of the pocket side.
  parts:
  - knob
  hardware:
  - nut
  tool: null
