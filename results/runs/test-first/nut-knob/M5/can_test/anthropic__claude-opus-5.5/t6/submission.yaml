task: nut-knob/M5
note: 'The pocket size comes from the coupon: an 8.00 mm across-flats hex, 5.0 mm
  deep, with a 5.5 mm hole through a 7 mm solid floor. If the nut is too hard to press
  in, change pocket_af_offset to 0.1. That fit was snug and the nut still held.'
questions: []
params:
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  pocket_af_offset:
    value: 0.0
    unit: mm
    kind: design
    source: design
    note: 'coupon: 8.00 pocket = hand-press tight, stays in upside down; 8.10 also
      held but snug'
  pocket_extra:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: nut sits fully below the face
  bolt_clear:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: M5 clearance; shoulder around it stops nut being pushed through
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: ''
  knob_h:
    value: 12
    unit: mm
    kind: design
    source: design
    note: ''
  scallops:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
  scallop_d:
    value: 7
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    r=p.knob_d/2\n    k=cq.Workplane('XY').circle(r).extrude(p.knob_h)\n\
    \    n=int(p.scallops)\n    for i in range(n):\n        a=2*math.pi*i/n\n    \
    \    k=k.cut(cq.Workplane('XY').center(r*math.cos(a),r*math.sin(a)).circle(p.scallop_d/2).extrude(p.knob_h))\n\
    \    k=k.faces('>Z').edges().chamfer(0.8)\n    depth=p.nut_h+p.pocket_extra\n\
    \    af=p.nut_af+p.pocket_af_offset\n    k=k.cut(cq.Workplane('XY').workplane(offset=p.knob_h-depth).polygon(6,af/math.cos(math.pi/6)).extrude(depth+1))\n\
    \    k=k.cut(cq.Workplane('XY').circle(p.bolt_clear/2).extrude(p.knob_h))\n  \
    \  return k"
  print_orientation: solid face (bolt exit side) on bed, nut pocket opens upward;
    no bridges or overhangs
  use_orientation: pocket face toward bolt head; bolt shank passes through nut and
    out the solid face
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
- id: bolt
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: j1
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 12.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: hex pocket
    role: nut_pocket
  - part: knob
    feature: 5.5 mm through hole
    role: clearance
  nut: nut
  external: null
criteria:
- id: c1
  part: knob
  feature: hex pocket
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - pocket_af_offset
  - nut_h
  - pocket_extra
  check:
    method: coupon
    ref: coupon_af
    description: '8.00 pocket: hand-press tight, nut stayed in when inverted and shaken'
- id: c2
  part: knob
  feature: 5.5 mm through hole
  relation: clears
  hardware: bolt
  clearance_mm: null
  params:
  - bolt_clear
  check:
    method: coupon
    ref: coupon_af
    description: same hole size as on the coupon
manual:
- n: '1'
  text: Print the knob with the flat solid face on the bed and the hex pocket facing
    up. No supports needed.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Line up the nut's flats with the pocket and press it in with your thumb (or
    press it against the table) until it sits just below the face. It's a tight fit,
    so it stays in without glue.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Thread the M5 bolt into the nut from the pocket side so it comes out through
    the hole in the solid face. Or spin the knob onto a bolt that's already in place,
    pocket side first.
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: null
