  part: knob
  feature: hex pocket with crush ribs
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - pocket_clear
  - rib_h
  check:
    method: none
    ref: null
    description: Press the nut in, turn the knob upside down and shake it. The nut
