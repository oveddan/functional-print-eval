task: nut-knob/M5
note: The fit coupon was printed but you couldn't report how it came out, so the press-fit
  size is my best guess. The pocket is 8.15 mm across the flats. Three 0.2 mm crush
  ribs on alternate flats grip the nut. If the nut falls out, raise rib_h to 0.3.
  If it won't go in even with the screw-pull method, lower it to 0.1.
questions: []
params:
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 height
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_clear_d:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: M5 clearance hole through the floor
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: ''
  floor_t:
    value: 4.0
    unit: mm
    kind: design
    source: design
    note: solid layer under the nut; stops it being pushed out the far side
  pocket_depth:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: nut_h + 0.8 so the nut sits fully below the top face
  pocket_clear:
    value: 0.15
    unit: mm
    kind: design
    source: guessed
    note: the hex pocket is 8.15 AF, so the nut is only gripped by the ribs. The coupon
      results never came back
  rib_h:
    value: 0.2
    unit: mm
    kind: design
    source: guessed
    note: 'crush rib height on 3 flats: 7.95 mm across rib to opposite flat'
  rib_w:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: ''
  leadin:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: rib-free, chamfered entry at the top of the pocket
  n_scallops:
    value: 10
    unit: count
    kind: design
    source: design
    note: ''
  scallop_r:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    H = p.floor_t + p.pocket_depth\n    R\
    \ = p.knob_d / 2\n    body = cq.Workplane('XY').circle(R).extrude(H)\n    body\
    \ = body.edges('<Z').chamfer(0.4)\n    off = R + p.scallop_r * 0.4\n    for i\
    \ in range(int(p.n_scallops)):\n        a = 2 * math.pi * i / p.n_scallops\n \
    \       body = body.cut(cq.Workplane('XY').circle(p.scallop_r).extrude(H + 2).translate((off\
    \ * math.cos(a), off * math.sin(a), -1)))\n    af = p.nut_af + p.pocket_clear\n\
    \    rc = af / math.sqrt(3)\n    pocket = cq.Workplane('XY').polygon(6, 2 * rc).extrude(p.pocket_depth\
    \ + 1).translate((0, 0, p.floor_t))\n    for ang in (30, 150, 270):\n        rib\
    \ = (cq.Workplane('XY')\n               .box(p.rib_h + 1, p.rib_w, p.pocket_depth\
    \ - p.leadin, centered=(False, True, False))\n               .translate((af /\
    \ 2 - p.rib_h, 0, 0))\n               .rotate((0, 0, 0), (0, 0, 1), ang)\n   \
    \            .translate((0, 0, p.floor_t)))\n        pocket = pocket.cut(rib)\n\
    \    body = body.cut(pocket)\n    cone = cq.Solid.makeCone(rc, rc + p.leadin,\
    \ p.leadin, pnt=cq.Vector(0, 0, H - p.leadin), dir=cq.Vector(0, 0, 1))\n    body\
    \ = body.cut(cq.Workplane('XY').add(cone))\n    body = body.cut(cq.Workplane('XY').circle(p.bolt_clear_d\
    \ / 2).extrude(H + 2).translate((0, 0, -1)))\n    return body\n"
  print_orientation: Flat solid face on the bed, nut pocket opening facing up. No
    overhangs or bridges.
  use_orientation: Pocket side faces away from the work (towards your hand). The bolt
    comes in through the floor, goes through the nut and out the pocket side.
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
- id: washer
  ref: ISO 7089 M5
  qty: 1
- id: pull_screw
  ref: ISO 4762 M5x20
  qty: 1
joints: []
