  hardware: nut
  clearance_mm: null
  params:
  - floor_t
  - bolt_clear_d
  - nut_af
  check:
    method: none
    ref: null
    description: The 5.6 mm floor hole is smaller than the nut, so the nut can't pass
      through
- id: bolt_clear
  part: knob
  feature: floor hole
  relation: clears
  hardware: null
  clearance_mm: 0.6
  params:
  - bolt_d
  - bolt_clear_d
  check:
    method: none
    ref: null
    description: ''
manual:
- n: '1'
  text: Print the knob flat side down with the pocket facing up. Use the default settings
    and no supports. 3 walls and 20% infill are fine.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Line the nut's flats up with the pocket's flats. Start it in the chamfered
    entry, then press it down firmly with your thumb until it bottoms out on the floor.
    The three small ribs should squeeze it. The nut ends up just below the top face.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: 'If the nut is too stiff to push in by thumb, put the washer on the M5x20
    screw. Feed the screw in through the bottom hole and thread it into the nut where
    it sits at the pocket entry. Tighten it with a hex key: this pulls the nut down
    into the pocket. Then remove the screw and washer.'
  parts:
  - knob
  hardware:
  - nut
  - washer
  - pull_screw
  tool: 4 mm hex key
- n: '4'
  text: 'Check: turn the knob upside down and shake it. The nut should stay in. To
    use the knob, thread it onto your M5 bolt from the flat (floor) side. The bolt
    runs through the nut and out the pocket side.'
  parts:
  - knob
  hardware:
  - nut
  tool: null
