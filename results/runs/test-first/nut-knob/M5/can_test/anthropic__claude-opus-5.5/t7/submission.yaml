manual:
- n: '1'
  text: Print coupon_fit first (about 5 minutes). Press the M5 nut in with your thumb,
    flat side down, lined up with the hex. It should go in firmly and stay put when
    you hold it upside down and shake it. If it falls out, set rib_h to 0.4. If you
    can't get it in even with a light tap from a hammer, set rib_h to 0.2. Then print
    the coupon again.
  parts:
  - coupon_fit
  hardware:
  - nut
  tool: null
- n: '2'
  text: Print the knob with the flat floor face down on the bed. No supports needed.
    4 walls and 30% infill are plenty.
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Line the nut up with the hex pocket on the top face. The wider chamfered entry
    helps guide it in. Press it in until it stops on the floor, using your thumb or
    by pressing it down against the table. It ends up just below the top face.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: To use it, put the floor side toward your work and thread the knob onto your
    M5 bolt. The bolt goes through the floor hole, through the nut, and can stick
    out past the top. When you tighten it, the nut pushes against the printed floor.
  parts:
  - knob
  hardware:
  - nut
  tool: null
