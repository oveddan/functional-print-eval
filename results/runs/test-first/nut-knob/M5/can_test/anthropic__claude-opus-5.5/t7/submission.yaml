task: nut-knob/M5
note: The fit coupon results came back unknown, so I didn't pick a fixed press fit.
  The pocket is 0.2 mm wider than the nut, and three small crush ribs (0.3 mm) on
  alternate flats grip it. That works across the normal range of nut sizes (7.78–8.0
  AF). Use coupon_fit to tune rib_h if you need to.
questions: []
params:
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats (real nuts 7.78-8.00)
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_clear_d:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: M5 clearance through the floor
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: ''
  knob_h:
    value: 12
    unit: mm
    kind: design
    source: design
    note: ''
  pocket_extra_af:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: pocket af = nut af + this; crush ribs give the grip
  rib_h:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: crush rib protrusion into pocket; effective af across rib = 7.9
  rib_w:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: ''
  pocket_extra_depth:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: nut sits below the top face
  lead_in:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_d:
    value: 7
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_n:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    R=p.knob_d/2\n    H=p.knob_h\n    body=cq.Workplane('XY').circle(R).extrude(H)\n\
    \    for i in range(int(p.scallop_n)):\n        a=2*math.pi*i/p.scallop_n\n  \
    \      body=body.cut(cq.Workplane('XY').center((R+1.5)*math.cos(a),(R+1.5)*math.sin(a)).circle(p.scallop_d/2).extrude(H))\n\
    \    try:\n        body=body.faces('>Z').edges().chamfer(1.0)\n    except Exception:\n\
    \        pass\n    try:\n        body=body.faces('<Z').edges().chamfer(0.4)\n\
    \    except Exception:\n        pass\n    af=p.nut_af+p.pocket_extra_af\n    depth=p.nut_h+p.pocket_extra_depth\n\
    \    zf=H-depth\n    k=1/math.cos(math.radians(30))\n    body=body.cut(cq.Workplane('XY').workplane(offset=zf).polygon(6,af*k).extrude(depth+1))\n\
    \    body=body.cut(cq.Workplane('XY').workplane(offset=H-p.lead_in).polygon(6,(af+0.5)*k).extrude(p.lead_in+1))\n\
    \    body=body.cut(cq.Workplane('XY').circle(p.bolt_clear_d/2).extrude(H+1).translate((0,0,-0.5)))\n\
    \    rib_len=depth-p.lead_in\n    for ang in (30,150,270):\n        r0=af/2-p.rib_h\n\
    \        rib=cq.Workplane('XY').box(p.rib_h+0.5,p.rib_w,rib_len,centered=False).translate((r0,-p.rib_w/2,zf)).rotate((0,0,0),(0,0,1),ang)\n\
    \        body=body.union(rib)\n    return body"
  print_orientation: Solid floor face on bed (z=0); hex pocket opens upward, so no
    bridges or overhangs
  use_orientation: Floor face toward the work; the bolt comes in through the floor,
    through the nut, and out the pocket side
- id: coupon_fit
  role: coupon
  material: PLA
  code: "def build(p):\n    import math\n    H=p.nut_h+p.pocket_extra_depth+2\n  \
    \  body=cq.Workplane('XY').box(14,14,H,centered=(True,True,False))\n    af=p.nut_af+p.pocket_extra_af\n\
    \    depth=p.nut_h+p.pocket_extra_depth\n    zf=H-depth\n    k=1/math.cos(math.radians(30))\n\
    \    body=body.cut(cq.Workplane('XY').workplane(offset=zf).polygon(6,af*k).extrude(depth+1))\n\
    \    body=body.cut(cq.Workplane('XY').workplane(offset=H-p.lead_in).polygon(6,(af+0.5)*k).extrude(p.lead_in+1))\n\
    \    body=body.cut(cq.Workplane('XY').circle(p.bolt_clear_d/2).extrude(H+1).translate((0,0,-0.5)))\n\
    \    for ang in (30,150,270):\n        r0=af/2-p.rib_h\n        rib=cq.Workplane('XY').box(p.rib_h+0.5,p.rib_w,depth-p.lead_in,centered=False).translate((r0,-p.rib_w/2,zf)).rotate((0,0,0),(0,0,1),ang)\n\
    \        body=body.union(rib)\n    return body"
  print_orientation: Floor on bed, pocket up
  use_orientation: Test the nut press fit before printing the knob
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
joints: []
