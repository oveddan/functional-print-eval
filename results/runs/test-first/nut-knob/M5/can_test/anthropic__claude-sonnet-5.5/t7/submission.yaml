task: nut-knob/M5
note: Pocket af = nut af (8.00 mm) was the one coupon that held the nut inverted.
  The 8.15 result couldn't be reported and 8.30 was loose, so I kept 8.00. The bolt
  length depends on your application. M5x30 is only an example.
questions: []
params:
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 thickness
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_clear_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: M5 clearance hole through floor
  pocket_clr:
    value: 0
    unit: mm
    kind: design
    source: design
    note: 'pocket af minus nut af; 8.00 mm pocket tested in coupon cpn-a: push-in
      tight, held nut when inverted and shaken'
  pocket_extra_depth:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: pocket deeper than nut so the nut seats fully inside
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: about 30 mm across
  knob_h:
    value: 12
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_n:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
  scallop_r:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: grip scallop radius
  scallop_pc:
    value: 16.5
    unit: mm
    kind: design
    source: design
    note: scallop centre radius
  top_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
  bed_chamfer:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    body = cq.Workplane('XY').circle(p.knob_d/2).extrude(p.knob_h)\n\
    \    body = body.faces('>Z').edges().chamfer(p.top_chamfer)\n    body = body.faces('<Z').edges().chamfer(p.bed_chamfer)\n\
    \    for i in range(int(p.scallop_n)):\n        a = 2*math.pi*i/p.scallop_n\n\
    \        c = (cq.Workplane('XY').center(p.scallop_pc*math.cos(a), p.scallop_pc*math.sin(a))\n\
    \             .circle(p.scallop_r).extrude(p.knob_h))\n        body = body.cut(c)\n\
    \    af = p.nut_af + p.pocket_clr\n    dc = af / math.cos(math.radians(30))\n\
    \    depth = p.nut_h + p.pocket_extra_depth\n    pocket = cq.Workplane('XY').polygon(6,\
    \ dc).extrude(depth)\n    hole = cq.Workplane('XY').circle(p.bolt_clear_d/2).extrude(p.knob_h)\n\
    \    return body.cut(pocket).cut(hole)"
  print_orientation: nut-pocket face down on the bed (z=0), knob top up, no supports
  use_orientation: pocket opening facing down/toward the bolt's threaded part; bolt
    tip exits through the top hole
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
- id: bolt
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: knob-bolt
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: hex nut pocket
    role: nut_pocket
  - part: knob
    feature: bolt clearance hole through floor
    role: clearance
  nut: nut
  external: null
criteria:
- id: c-nut-pocket
  part: knob
  feature: hex nut pocket
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - nut_h
  - pocket_clr
  - pocket_extra_depth
  check:
    method: coupon
    ref: cpn-a
    description: '8.00 mm across-flats pocket tested: push-in tight by hand, nut stayed
      in when inverted and shaken. Pocket is 0.3 mm deeper than the nut so it sits
      fully inside.'
- id: c-bolt-hole
  part: knob
  feature: bolt clearance hole through floor
  relation: clears
  hardware: bolt
  clearance_mm: 0.25
  params:
  - bolt_d
  - bolt_clear_d
  check:
    method: measure
    ref: null
    description: 5.5 mm hole vs 5 mm M5 shank; bolt passes freely through the hole
      into the nut.
- id: c-floor
  part: knob
  feature: closed floor above pocket
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - nut_h
  - pocket_extra_depth
  - knob_h
  check:
    method: none
    ref: null
    description: Floor (~7 mm thick) closes the far side so the nut cannot be pushed
      through.
manual:
- n: '1'
  text: Print the knob with the hex pocket face down on the bed, top up, no supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align the M5 hex nut with the hex pocket on the flat underside of the knob
    and press it in by hand until it is fully seated against the floor of the pocket
    (it is a tight fit; press with a flat surface such as a table if needed).
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Pass the M5 bolt's threaded end through the nut from the pocket side and thread
    it into the nut by turning the knob. Use a bolt long enough to reach through the
    nut and out the top hole as needed (M5x30 listed as example).
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: null
