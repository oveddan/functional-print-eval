task: nut-knob/M5
note: The test print came back with no usable result, so the press fit (pocket af
  = 8.15 mm with three 0.1 mm crush ribs) is unverified. Run the coupon first. If
  it is loose, raise rib_interf. If it is too tight, lower it.
