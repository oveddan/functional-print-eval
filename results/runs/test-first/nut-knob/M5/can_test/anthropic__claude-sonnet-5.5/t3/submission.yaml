parts:
- id: knob
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    R = p.knob_d / 2\n    body = cq.Workplane('XY').circle(R).extrude(p.knob_h)\n\
    \    body = body.faces('<Z').edges().chamfer(p.foot_chamfer)\n    # grip scallops\n\
    \    for i in range(int(p.lobe_n)):\n        a = 2 * math.pi * i / p.lobe_n\n\
    \        cr = R + p.lobe_r * 0.55\n        c = cq.Workplane('XY').center(cr *\
    \ math.cos(a), cr * math.sin(a)).circle(p.lobe_r).extrude(p.knob_h)\n        body\
    \ = body.cut(c)\n    af = p.nut_af + p.pocket_clear\n    pocket = cq.Workplane('XY').polygon(6,\
    \ af * 1.1547005).extrude(p.pocket_depth)\n    hole = cq.Workplane('XY').circle(p.bolt_hole_d\
    \ / 2).extrude(p.knob_h)\n    body = body.cut(pocket).cut(hole)\n    inner = p.nut_af\
    \ / 2 - p.rib_interf\n    for ang in (30, 150, 270):\n        rib = (cq.Workplane('XY').box(1.0,\
    \ p.rib_w, p.pocket_depth, centered=(False, True, False))\n               .translate((inner,\
    \ 0, 0)).rotate((0, 0, 0), (0, 0, 1), ang))\n        body = body.union(rib)\n\
    \    return body"
  print_orientation: flat, nut-pocket mouth face on the bed, no supports
  use_orientation: pocket mouth facing the work, bolt end enters the pocket
- id: nut-fit-coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    import math\n    w = cq.Workplane('XY').box(16, 16, 7,\
    \ centered=(True, True, False))\n    af = p.nut_af + p.pocket_clear\n    w = w.cut(cq.Workplane('XY').polygon(6,\
    \ af * 1.1547005).extrude(p.pocket_depth))\n    w = w.cut(cq.Workplane('XY').circle(p.bolt_hole_d\
    \ / 2).extrude(7))\n    inner = p.nut_af / 2 - p.rib_interf\n    for ang in (30,\
    \ 150, 270):\n        rib = (cq.Workplane('XY').box(1.0, p.rib_w, p.pocket_depth,\
    \ centered=(False, True, False))\n               .translate((inner, 0, 0)).rotate((0,\
    \ 0, 0), (0, 0, 1), ang))\n        w = w.union(rib)\n    return w"
  print_orientation: flat, pocket mouth on the bed
  use_orientation: test only
