task: nut-knob/M5
note: Pocket fit chosen from a printed test (8.0/8.1 mm AF both retained the nut inverted).
  If your nut feels loose in the final print, use a slightly smaller fit_offset; if
  too tight, a slightly larger one. The bolt must be long enough to pass the nut and
  emerge through the 12 mm knob (pocket depth ~4.9 mm plus roof ~7.1 mm).
questions: []
params:
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_hole_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: M5 clearance through the top
  fit_offset:
    value: 0.05
    unit: mm
    kind: design
    source: design
    note: 'pocket af = nut af + this. Print test: +0.0 tight but retained when inverted
      and shaken, +0.1 snug and retained, +0.2 loose. Midpoint chosen.'
  depth_extra:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: pocket deeper than nut so it seats fully inside
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: about 30 mm across
  knob_h:
    value: 12
    unit: mm
    kind: design
    source: design
    note: ''
  n_scallops:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
  scallop_r:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_depth:
    value: 2
    unit: mm
    kind: design
    source: design
    note: how far scallops cut into the rim
  top_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    R=p.knob_d/2\n    k=cq.Workplane('XY').circle(R).extrude(p.knob_h)\n\
    \    k=k.faces('>Z').edges().chamfer(p.top_chamfer)\n    cr=R-p.scallop_depth+p.scallop_r\n\
    \    for i in range(int(p.n_scallops)):\n        a=2*math.pi*i/p.n_scallops\n\
    \        c=cq.Workplane('XY').center(cr*math.cos(a),cr*math.sin(a)).circle(p.scallop_r).extrude(p.knob_h)\n\
    \        k=k.cut(c)\n    af=p.nut_af+p.fit_offset\n    d=af/math.cos(math.radians(30))\n\
    \    depth=p.nut_h+p.depth_extra\n    pocket=cq.Workplane('XY').polygon(6,d).extrude(depth)\n\
    \    hole=cq.Workplane('XY').circle(p.bolt_hole_d/2).extrude(p.knob_h)\n    return\
    \ k.cut(pocket).cut(hole)"
  print_orientation: nut-pocket face flat on the bed (pocket opens downward, bridged
    roof)
  use_orientation: pocket face towards the work, bolt tip emerging from the top
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
joints: []
criteria:
- id: c1
  part: knob
  feature: hex nut pocket
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - fit_offset
  - nut_h
  - depth_extra
  check:
    method: coupon
    ref: nutfit
    description: 'Printed test pockets: +0.0 and +0.1 mm over nut AF both held the
      nut when inverted and shaken; +0.05 chosen.'
- id: c2
  part: knob
  feature: bolt hole through roof
  relation: clears
  hardware: nut
  clearance_mm: 0.5
  params:
  - bolt_hole_d
  check:
    method: measure
    ref: null
    description: M5 bolt passes through the 5.5 mm hole in the roof; the roof is smaller
      than the nut so the nut cannot be pushed out the top.
manual:
- n: '1'
  text: Print the knob with the hex pocket face flat on the bed. No supports needed.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Turn the knob so the pocket faces up. Line up the M5 nut's flats with the
    hex pocket and press it in by hand until it sits at the bottom of the pocket,
    fully below the face. A flat surface or a gentle push with the bolt end helps.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Thread your M5 bolt into the nut from the pocket side. The bolt passes through
    the nut and out the hole in the top of the knob. Turn the knob to tighten.
  parts:
  - knob
  hardware:
  - nut
  tool: null
