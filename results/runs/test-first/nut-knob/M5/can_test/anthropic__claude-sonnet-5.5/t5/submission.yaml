manual:
- n: '1'
  text: Print the knob with the flat bottom, the side with the hex pocket, on the
    bed. No supports. If you want to check the fit first, print the small coupon too.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Put the M5 nut over the hex pocket in the bottom of the knob, lined up with
    the flats. Press it in by hand until it is fully inside. It is a tight fit. You
    can press it against a table to seat it.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Thread the M5 bolt into the nut from the pocket side. Its tip comes out through
    the hole in the top of the knob. Turn the knob to tighten.
  parts:
  - knob
  hardware:
  - nut
  tool: null
