task: nut-knob/M5
note: 30 mm ergonomic 6-lobe hand knob for an M5 bolt and captured ISO 4032 M5 hex
  nut. Prints flat on the bed with no supports.
questions: []
params:
  nut_clearance:
    value: 0.06
    unit: mm
    kind: design
    source: design
    note: Across-flats interference/press-fit allowance for hand press retention in
      PLA
  lobe_count:
    value: 6
    unit: count
    kind: design
    source: design
    note: Number of finger grip flutes around the perimeter
  floor_t:
    value: 8.3
    unit: mm
    kind: design
    source: design
    note: Solid floor thickness under the hex nut pocket stopping the nut from pushing
      through
  lobe_cut_offset:
    value: 17.2
    unit: mm
    kind: design
    source: design
    note: Radial center distance of the finger flute cuts
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut across flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut thickness/height
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal M5 bolt shaft diameter
  grip_h:
    value: 9.5
    unit: mm
    kind: design
    source: design
    note: Height of the fluted grip section
  lobe_cut_r:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: Radius of each finger flute cutout
  hub_d:
    value: 18
    unit: mm
    kind: design
    source: design
    note: Diameter of the lower collar/hub base
  pocket_extra_depth:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Extra depth beyond nut_h so the nut sits fully recessed inside the knob
  knob_od:
    value: 30
    unit: mm
    kind: design
    source: design
    note: Overall outer diameter of the hand knob across lobes (~30 mm)
  coupon_od:
    value: 16
    unit: mm
    kind: design
    source: design
    note: Outer diameter of the quick test coupon
  bolt_clearance:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: Diametral clearance for M5 bolt through-hole
  knob_h:
    value: 14
    unit: mm
    kind: design
    source: design
    note: Total height of the hand knob
parts:
- id: m5_hand_knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    pocket_af = p.nut_af + p.nut_clearance\n\
    \    r_circum = pocket_af / math.sqrt(3)\n    pocket_depth = p.nut_h + p.pocket_extra_depth\n\
    \    hole_d = p.bolt_d + p.bolt_clearance\n    hub_h = p.knob_h - p.grip_h\n\n\
    \    # Lower hub + 45-degree printable transition cone + upper grip cylinder\n\
    \    hub = cq.Workplane(\"XY\").circle(p.hub_d / 2.0).extrude(hub_h)\n    \n \
    \   # Transition chamfer from hub_d to knob_od so the overhang prints cleanly\
    \ without supports\n    # Wait: if hub is at the bottom (z=0) and knob_od is above\
    \ it, an outward overhang would need a 45 deg cone!\n    # Even simpler and stronger:\
    \ put the full 30mm grip body or have the wide grip at the bottom, OR taper outward\
    \ at 45 deg, OR put the hub at the bottom with a 45-deg cone, OR make the full\
    \ height fluted with a chamfered bottom.\n    # Let's make the full knob fluted\
    \ from z=0 to z=p.knob_h, with a clean 1.2 mm bottom and top chamfer! That has\
    \ zero overhang and maximum grip height.\n    body = (\n        cq.Workplane(\"\
    XY\")\n        .circle(p.knob_od / 2.0)\n        .extrude(p.knob_h)\n        .edges(\"\
    <Z or >Z\")\n        .chamfer(1.2)\n    )\n\n    # Cut finger flutes around the\
    \ perimeter\n    for i in range(int(p.lobe_count)):\n        angle = 2.0 * math.pi\
    \ * i / p.lobe_count\n        cx = p.lobe_cut_offset * math.cos(angle)\n     \
    \   cy = p.lobe_cut_offset * math.sin(angle)\n        cutter = (\n           \
    \ cq.Workplane(\"XY\")\n            .center(cx, cy)\n            .circle(p.lobe_cut_r)\n\
    \            .extrude(p.knob_h)\n        )\n        body = body.cut(cutter)\n\n\
    \    # Cut the recessed hexagonal pocket from the top face (>Z)\n    body = (\n\
    \        body.faces(\">Z\")\n        .workplane()\n        .polygon(6, 2.0 * r_circum)\n\
    \        .cutBlind(-pocket_depth)\n    )\n\n    # Cut a small lead-in hex at the\
    \ top of the pocket (first 0.6 mm) to guide the nut in by hand\n    lead_in_r\
    \ = (pocket_af + 0.35) / math.sqrt(3)\n    body = (\n        body.faces(\">Z\"\
    )\n        .workplane()\n        .polygon(6, 2.0 * lead_in_r)\n        .cutBlind(-0.6)\n\
    \    )\n\n    # Cut the M5 bolt clearance through-hole all the way through\n \
    \   body = (\n        body.faces(\"<Z\")\n        .workplane()\n        .circle(hole_d\
    \ / 2.0)\n        .cutThruAll()\n    )\n\n    return body\n"
  print_orientation: Flat bottom face on the build plate (z = 0), hex nut pocket opening
    upward (+Z) so the internal floor prints with zero bridging or supports.
  use_orientation: Can be used in any orientation; bolt passes through the central
    hole and threads through the captured M5 nut.
- id: nut_fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    pocket_af = p.nut_af + p.nut_clearance\n\
    \    r_circum = pocket_af / math.sqrt(3)\n    pocket_depth = p.nut_h + p.pocket_extra_depth\n\
    \    hole_d = p.bolt_d + p.bolt_clearance\n    coupon_h = pocket_depth + 2.5\n\
    \n    body = (\n        cq.Workplane(\"XY\")\n        .circle(p.coupon_od / 2.0)\n\
    \        .extrude(coupon_h)\n        .faces(\">Z\")\n        .workplane()\n  \
    \      .polygon(6, 2.0 * r_circum)\n        .cutBlind(-pocket_depth)\n    )\n\n\
    \    lead_in_r = (pocket_af + 0.35) / math.sqrt(3)\n    body = (\n        body.faces(\"\
    >Z\")\n        .workplane()\n        .polygon(6, 2.0 * lead_in_r)\n        .cutBlind(-0.6)\n\
    \        .faces(\"<Z\")\n        .workplane()\n        .circle(hole_d / 2.0)\n\
    \        .cutThruAll()\n    )\n\n    return body\n"
  print_orientation: Flat bottom face on the build plate (z = 0), hex pocket opening
    upward (+Z).
  use_orientation: Test coupon to verify hand press-fit and inversion retention of
    the ISO 4032 M5 nut.
hardware:
- id: m5_nut
  ref: ISO 4032 M5
  qty: 1
- id: m5_bolt
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: knob_nut_bolt_joint
  fastener: m5_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 14.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: m5_hand_knob
    feature: hex_nut_pocket
    role: nut_pocket
  - part: m5_hand_knob
    feature: bolt_thru_hole
    role: clearance
  nut: m5_nut
  external: null
criteria:
- id: nut_press_fit_and_seat
  part: m5_hand_knob
  feature: hex_nut_pocket
  relation: seats
  hardware: m5_nut
  clearance_mm: 0.06
  params:
  - nut_af
  - nut_h
  - nut_clearance
  - pocket_extra_depth
  check:
    method: coupon
    ref: nut_fit_coupon
    description: M5 hex nut presses into the hex pocket by hand, stays retained when
      inverted, sits fully recessed below the top face, and is stopped by the bottom
      floor shoulder.
- id: bolt_clearance_pass_thru
  part: m5_hand_knob
  feature: bolt_thru_hole
  relation: clears
  hardware: m5_bolt
  clearance_mm: 0.4
  params:
  - bolt_d
  - bolt_clearance
  check:
    method: coupon
    ref: nut_fit_coupon
    description: M5 bolt passes freely through the knob and threads through the seated
      nut and out the other side.
manual:
- n: '1'
  text: 'Optional check: press the ISO 4032 M5 hex nut into the test coupon (nut_fit_coupon)
    by hand to verify the press-fit feel before printing the full knob.'
  parts:
  - nut_fit_coupon
  hardware:
  - m5_nut
  tool: null
- n: '2'
  text: Align the ISO 4032 M5 hex nut with the hexagonal pocket on the top face of
    the m5_hand_knob and press it firmly all the way down by hand until it seats against
    the internal floor shoulder. It will sit slightly recessed below the top surface
    and stay retained when turned upside down.
  parts:
  - m5_hand_knob
  hardware:
  - m5_nut
  tool: null
- n: '3'
  text: Thread the M5 bolt through the knob and captured M5 nut so it passes out the
    other side, and use the lobe grips to hand-tighten without tools.
  parts:
  - m5_hand_knob
  hardware:
  - m5_bolt
  - m5_nut
  tool: null
