task: nut-knob/M5
note: 'One printed piece: a 30 mm fluted hand knob with a captive M5 hex nut. Print
  flat, pocket up, no supports. Key design decision (forced, since the nut could not
  be measured and the coupon came back unreported): the nut pocket is a slightly tapered
  hex — 8.00 mm across flats at the entry down to 7.78 mm at the floor, with a 0.6
  mm 45 degree entry chamfer — so any nut in the ISO 4032 band (7.64-8.00 across flats)
  enters easily and then wedges to roughly 0.10-0.28 mm interference at the floor.
  The pocket is 5.0 mm deep against a 4.7 mm nut, so the nut sits fully inside, and
  the floor is pierced by only a 5.6 mm circle, so the nut can never pass out the
  far side. Two small things to watch when you press it in: a nut measuring under
  ~7.85 mm across flats will hold more lightly than one measuring 7.9-8.0, and if
  a nut proves stiff, a minute in ~60-70 C water softens the PLA enough to seat it
  by hand.'
questions:
- text: 'After printing: does the nut press in by hand (no vise) and stay put when
    you turn the knob upside down and shake it?'
  answer: null
- text: 'If you can get a caliper on the nut: what is its width across flats? That
    tells me whether to shift the pocket taper tighter or looser.'
  answer: null
params:
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut, nominal width across flats (max of tolerance band)
  nut_af_min:
    value: 7.64
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats, min of tolerance band - real nuts land anywhere
      in 7.64-8.00
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 nominal nut height (band 4.4-4.7)
  nut_corner_d:
    value: 9.24
    unit: mm
    kind: hardware
    source: catalog
    note: nut across corners = nut_af / cos(30 deg); this is what the 5.6 mm floor
      hole must stay well under
  m5_shank_d:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 screw shank diameter (d in the screw table)
  knob_od:
    value: 30.0
    unit: mm
    kind: design
    source: design
    note: user asked for about 30 mm across; this is the max across the grip ridges
  knob_h:
    value: 13.0
    unit: mm
    kind: design
    source: design
    note: grip height for fingers
  floor_t:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: 'knob_h - pocket_depth: material under the nut that carries the 5.6 mm bolt
      hole'
  flute_n:
    value: 12
    unit: count
    kind: design
    source: design
    note: finger grooves around the rim
  flute_r:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: groove cutter radius
  flute_depth:
    value: 1.4
    unit: mm
    kind: design
    source: design
    note: groove depth; leaves ~3 mm wide ridges and 9 mm of wall around the hex pocket
  pocket_af_top:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: hex pocket across flats at the entry - matches the largest nut so nothing
      is too tight to start
  pocket_af_bot:
    value: 7.78
    unit: mm
    kind: design
    source: design
    note: hex pocket across flats at the floor - gives the interference that retains
      the nut
  pocket_depth:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: nut_h + 0.3, so the 4.7 mm nut sits fully inside the knob
  chamfer_h:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: 45 degree stepped entry chamfer, printed as 4 stacked slices to avoid any
      unsupported overhang
  bolt_clear_d:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: m5_shank_d + 0.6, so the bolt leaves through the far side once printed holes
      come out small
  fit_interference_target:
    value: 0.15
    unit: mm
    kind: design
    source: guessed
    note: intended across-flats interference at the pocket floor against a 7.9 mm
      nut, allowing for printed holes running ~0.05-0.1 mm small; chosen as the lightest
      value that still holds a 1.5 g nut against gravity, because the binding constraint
      is 'presses in by hand'
  bolt_len_min:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: shortest ISO 4762 M5 screw that clears the nut (4.7) plus the floor (8.0)
      with room to reach the work
parts:
- id: knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "import math\n\ndef _hex_pts(af, rot=0.0):\n    R = af / (2.0 * math.cos(math.pi\
    \ / 6.0))\n    return [(R * math.cos(math.radians(rot + 60.0 * i)),\n        \
    \     R * math.sin(math.radians(rot + 60.0 * i))) for i in range(6)]\n\ndef _cyl(r,\
    \ h, x=0.0, y=0.0, z=0.0):\n    return cq.Workplane(\"XY\", origin=(x, y, z)).circle(r).extrude(h).val()\n\
    \ndef _hexprism(af, h, x=0.0, y=0.0, z=0.0, rot=0.0):\n    return (cq.Workplane(\"\
    XY\", origin=(x, y, z))\n            .polyline(_hex_pts(af, rot)).close().extrude(h).val())\n\
    \ndef build(p):\n    R = p.knob_od / 2.0\n    H = p.knob_h\n\n    # knob body:\
    \ plain disc, axis vertical, z = 0 on the bed\n    body = cq.Workplane(\"XY\"\
    ).circle(R).extrude(H).val()\n\n    # finger flutes: vertical half-round grooves\
    \ around the rim\n    n = int(p.flute_n)\n    d = R + p.flute_r - p.flute_depth\n\
    \    for i in range(n):\n        a = 2.0 * math.pi * i / n\n        body = body.cut(_cyl(p.flute_r,\
    \ H + 2.0,\n                             d * math.cos(a), d * math.sin(a), -1.0))\n\
    \n    # hex nut pocket: linear taper, widest at the entry, tightest at the floor.\n\
    \    # Built as 10 stacked hex prisms so the wall never overhangs.\n    zf = H\
    \ - p.pocket_depth\n    slices = 10\n    hz = p.pocket_depth / slices\n    for\
    \ k in range(slices):\n        tm = (k + 0.5) * hz\n        af = p.pocket_af_top\
    \ + (p.pocket_af_bot - p.pocket_af_top) * (tm / p.pocket_depth)\n        body\
    \ = body.cut(_hexprism(af, hz + 0.02, 0.0, 0.0, H - (k + 1) * hz))\n\n    # 45\
    \ degree entry chamfer, stepped in 4 slices (0.3 mm across flats per step)\n \
    \   steps = 4\n    hs = p.chamfer_h / steps\n    for k in range(steps):\n    \
    \    af = p.pocket_af_top + 2.0 * hs * (k + 1)\n        body = body.cut(_hexprism(af,\
    \ hs + 0.02, 0.0, 0.0, H - p.chamfer_h + k * hs))\n\n    # bolt clearance hole\
    \ through the floor: lets the shank out, stops the nut\n    body = body.cut(_cyl(p.bolt_clear_d\
    \ / 2.0, zf + 2.0, 0.0, 0.0, -1.0))\n\n    return body\n"
  print_orientation: 'Flat: the plain bottom face of the 30 mm disc on the bed (z
    = 0 is the bearing face that will press on the work). The hex nut pocket and the
    5.6 mm bolt hole open straight up. Walls are vertical or lean outward going up,
    so no supports and no bridging anywhere.'
  use_orientation: 'Same as printed, knob axis along the M5 bolt: hex pocket and its
    nut facing away from the work, fluted rim gripped by hand, flat bed face down
    as the bearing face that pushes on the work.'
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
- id: bolt
  ref: ISO 4762 M5x25
  qty: 1
joints:
- id: bolt_through_knob
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 13.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: hex nut pocket
    role: nut_pocket
  - part: knob
    feature: 5.6 mm floor hole
    role: clearance
  nut: nut
  external: null
criteria:
- id: c_fit
  part: knob
  feature: hex nut pocket
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - pocket_af_top
  - pocket_af_bot
  - nut_af
  - fit_interference_target
  check:
    method: measure
    ref: manual step 2
    description: Nut presses into the hex pocket by hand and bottoms out on the pocket
      floor. Entry is 8.00 across flats (no nut in the ISO band is too big to start)
      tapering to 7.78 at the floor, so a 7.85-8.00 nut ends up at roughly 0.10-0.28
      mm across-flats interference.
- id: c_capture_far_side
  part: knob
  feature: pocket floor
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - bolt_clear_d
  - nut_corner_d
  - nut_h
  - pocket_depth
  check:
    method: measure
    ref: manual step 3
    description: The floor is pierced only by a 5.6 mm hole, far smaller than the
      nut's 9.24 mm across corners, so the nut cannot be pushed out the far side;
      it lands on the floor, 0.3 mm below the knob's top face.
- id: c_nut_inside
  part: knob
  feature: hex nut pocket
  relation: contains
  hardware: nut
  clearance_mm: 0.3
  params:
  - pocket_depth
  - nut_h
  check:
    method: measure
    ref: null
    description: 'Pocket is 5.0 mm deep against a 4.7 mm nut, so the nut''s top face
      finishes at least 0.3 mm below the knob''s top face: the nut sits fully inside.'
- id: c_bolt_passes
  part: knob
  feature: 5.6 mm floor hole
  relation: clears
  hardware: bolt
  clearance_mm: 0.3
  params:
  - bolt_clear_d
  - m5_shank_d
  check:
    method: measure
    ref: manual step 5
    description: M5 shank (5.0) passes the 5.6 mm hole with 0.3 mm radial clearance,
      allowing for printed holes running ~0.1 mm small, and leaves through the far
      side of the knob.
- id: c_holds_inverted
  part: knob
  feature: hex nut pocket
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - pocket_af_bot
  - fit_interference_target
  check:
    method: measure
    ref: manual step 3
    description: 'With the nut pressed to the floor, turn the knob upside down (pocket
      facing down) and shake or tap it: the taper/collar interference must keep the
      nut in place with no glue. A nut measuring below ~7.85 mm across flats holds
      more lightly.'
manual:
- n: '1'
  text: Print knob.stl in your black high-speed PLA at 0.2 mm layers with no supports.
    Lay it flat exactly as it comes - the plain circular face on the bed and the hex
    pocket opening upward. Nothing bridges and nothing overhangs, so no brim or raft
    is needed.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Press the M5 ISO 4032 hex nut into the hex pocket at the top of the knob,
    flats aligned with the pocket flats, pushing straight down with your thumb. It
    should drop in for the first millimetre or two and then tighten up as the pocket
    tapers. Push it home until the nut's bottom face lands on the pocket floor; its
    top face should end up flush with, or just below, the knob's top face. If it will
    not go by hand, stand the knob in hot (not boiling) water for a minute to soften
    the PLA, then press it in, or squeeze it in a vise.
  parts:
  - knob
  hardware:
  - nut
  tool: vise (optional)
- n: '3'
  text: 'Check the capture: turn the knob upside down so the nut faces the table,
    and shake or tap it. The nut must stay in. It cannot fall through the other side
    because the floor is pierced by only the 5.6 mm bolt hole, much smaller than the
    nut. If a small nut (under ~7.85 mm across flats) sits loosely, squeeze the knob
    gently across two opposite flutes in a soft-jawed vise - the pocket closes a few
    hundredths and grips.'
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: 'Thread the M5 screw in from the pocket side: head above the knob, tip entering
    the nut''s thread. Turn it down through the nut and out through the 5.6 mm hole
    in the floor and on out the far side of the knob. Any ISO 4762 M5 screw 20 mm
    or longer will do; pick the length that reaches your workpiece. The screw is not
    captive, so keep a hand on it while you turn the knob over.'
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: null
- n: '5'
  text: 'Tighten by hand: turn the fluted rim. The hex pocket carries the nut round
    with it and the bolt follows the thread, so the knob tightens without any tools.'
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: null
- n: '6'
  text: To remove or swap the nut later, push it out from below with a thin drift
    or a 5 mm punch through the 5.6 mm hole in the floor - no need to dig it out of
    the pocket.
  parts:
  - knob
  hardware:
  - nut
  tool: 5 mm punch or drift
