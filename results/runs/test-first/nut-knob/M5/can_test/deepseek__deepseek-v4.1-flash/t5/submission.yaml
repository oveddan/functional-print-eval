task: nut-knob/M5
note: 'The press fit is verified, not assumed. Your nut could not be measured, so
  I did not guess an interference: the 4-socket coupon settled it, and the widest
  socket (8.00 mm across flats, line-to-line with the catalog nut, 1 pip) pushed in
  by hand and held the nut when the plate was inverted and shaken. The knob''s socket
  is exactly that size, at the same 5.3 mm depth and with the same ~10 mm of surrounding
  wall, so the same fit carries over. The tighter test sockets were not usable, so
  I deliberately did not push the fit tighter than what you confirmed.\n\nCaveat:
  since the nut''s real size is unknown, this fit is tuned to a nut at the top of
  the ISO 4032 range (8.00 mm). If you later swap in a nut that mangles nearer 7.7
  mm, the socket will be loose — reprint coupon_fit, find the socket that grips (probably
  2 pips, 7.80 mm), and the knob''s pocket_af can be changed to match.\n\nPrinting:
  no supports and no bridges anywhere — the socket opens upward, the 6 mm bore is
  a plain vertical hole from the bed face, and the flutes are vertical grooves. 30
  mm across the flute lands, 16 mm tall, roughly 10-12 g of material.\n\nOne position
  I chose for you: the knob''s crown is 10.7 mm of material under the nut, which is
  what makes the bolt emerge from the far face. If you would rather have a slimmer
  knob and a bolt that stops inside it, reduce knob_h and re-run the checks in c4.'
questions: []
params:
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut, width across flats (max material size). Could not be
      measured; the standard permits 7.64-8.00, which is why the fit was settled by
      a coupon print rather than arithmetic.
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut height (max).
  bolt_d:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 nominal thread diameter.
  clamped_stack:
    value: 12.0
    unit: mm
    kind: world
    source: guessed
    note: Assumed thickness of whatever you clamp (workpiece + washer). Used only
      to place the bolt in the joint record and to state the bolt length requirement.
  pocket_af:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: 'Hex socket width across flats. Line-to-line with the nut''s catalog max
      size and identical to the coupon socket that was verified: pushed in by hand,
      nut stayed when inverted and shaken. Do not go tighter.'
  pocket_depth:
    value: 5.3
    unit: mm
    kind: design
    source: design
    note: Socket depth = nut height 4.7 + 0.6 recess, so the seated nut is fully inside
      the knob and its outer face sits 0.6 mm below the socket mouth.
  knob_od:
    value: 30.0
    unit: mm
    kind: design
    source: design
    note: Diameter across the flute lands, matching the ~30 mm asked for (27 mm at
      the groove bottoms).
  knob_h:
    value: 16.0
    unit: mm
    kind: design
    source: design
    note: Overall knob height; leaves 10.7 mm of crown material under the nut.
  crown_bore_d:
    value: 6.0
    unit: mm
    kind: design
    source: design
    note: Bore through the far side of the knob = bolt_d + 1.0 clearance. Bigger than
      the bolt so it always passes, smaller than the nut's 8.0 across flats so the
      nut cannot come through.
  lead_in:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: 45 degree chamfer at the socket mouth so the nut starts square.
  entry_chamfer:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: Rim chamfer on the nut-entry face (top of the print).
  crown_chamfer:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Rim chamfer on the far face (the bed face), which also tidies the elephant's
      foot.
  flute_count:
    value: 8
    unit: mm
    kind: design
    source: design
    note: Number of finger grooves.
  flute_r:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: Radius of the groove cutter.
  flute_center_r:
    value: 16.0
    unit: mm
    kind: design
    source: design
    note: Groove cutter axis at 16 mm leaves grooves 1.5 mm deep and about 4.6 mm
      wide at the surface.
  fit_offset_a:
    value: 0.0
    unit: mm
    kind: design
    source: design
    note: 'Coupon socket 1 (1 pip): 8.00 mm across flats. This is the one that worked.'
  fit_offset_b:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: 'Coupon socket 2 (2 pips): 7.80 mm.'
  fit_offset_c:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: 'Coupon socket 3 (3 pips): 7.60 mm.'
  fit_offset_d:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: 'Coupon socket 4 (4 pips): 7.40 mm.'
  coupon_len:
    value: 120.0
    unit: mm
    kind: design
    source: design
    note: Fit coupon plate length.
  coupon_wid:
    value: 32.0
    unit: mm
    kind: design
    source: design
    note: Fit coupon plate width; gives the sockets the same ~10 mm of surrounding
      wall as the knob, so the press feel matches.
  coupon_thick:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: Fit coupon plate thickness.
  coupon_pitch:
    value: 30.0
    unit: mm
    kind: design
    source: design
    note: Socket spacing on the coupon.
parts:
- id: knob
  role: final
  material: PLA (high-speed, black)
  code: "import math\n\n# hexagon whose flat-to-flat distance is exactly `af`\ndef\
    \ hex2d(af):\n    r = (af / 2.0) / math.cos(math.radians(30.0))\n    return [(r\
    \ * math.cos(math.radians(60.0 * i + 30.0)),\n             r * math.sin(math.radians(60.0\
    \ * i + 30.0))) for i in range(6)]\n\ndef build(p):\n    od = p.knob_od\n    h\
    \ = p.knob_h\n    af = p.pocket_af\n    z_floor = h - p.pocket_depth         \
    \ # shoulder the nut bottoms out on\n    lead = p.lead_in\n\n    # --- grip body\
    \ ---\n    body = cq.Workplane(\"XY\").circle(od / 2.0).extrude(h)\n    body =\
    \ body.edges(\">Z\").chamfer(p.entry_chamfer)   # nut-entry face rim\n    body\
    \ = body.edges(\"<Z\").chamfer(p.crown_chamfer)   # far face rim\n\n    # ---\
    \ finger flutes (vertical, no overhang) ---\n    n = int(round(p.flute_count))\n\
    \    for i in range(n):\n        a = 2.0 * math.pi * i / n\n        cx = p.flute_center_r\
    \ * math.cos(a)\n        cy = p.flute_center_r * math.sin(a)\n        flute =\
    \ (cq.Workplane(\"XY\").workplane(offset=-1.0).center(cx, cy)\n              \
    \   .circle(p.flute_r).extrude(h + 2.0))\n        body = body.cut(flute)\n\n \
    \   # --- hex socket for the M5 nut, with a 45 deg lead-in at the mouth ---\n\
    \    prism = (cq.Workplane(\"XY\").workplane(offset=z_floor)\n             .polyline(hex2d(af)).close().extrude(p.pocket_depth\
    \ + 0.5))\n    mouth = (cq.Workplane(\"XY\").workplane(offset=h - lead)\n    \
    \         .polyline(hex2d(af)).close()\n             .workplane(offset=lead)\n\
    \             .polyline(hex2d(af + 2.0 * lead)).close()\n             .loft())\n\
    \    body = body.cut(prism.union(mouth))\n\n    # --- bore through the far side:\
    \ the bolt's way out ---\n    body = body.cut(cq.Workplane(\"XY\").workplane(offset=-1.0)\n\
    \                    .circle(p.crown_bore_d / 2.0).extrude(z_floor + 1.0))\n\n\
    \    return body\n"
  print_orientation: 'As modelled, z=0 on the bed: the flat far face (the one with
    the 6 mm bore) lies on the bed, the hex socket opens straight upward. No supports,
    no brim needed — the socket mouth is at the top, the bore is a plain vertical
    hole, and the flutes are vertical.'
  use_orientation: 'Turned over from the print: the hex socket faces down onto your
    workpiece, and the flat crown (the face that lay on the bed) faces up and away.
    The nut goes in from the socket side, the bolt comes through the socket mouth
    from the workpiece and leaves through the 6 mm bore in the top.'
- id: coupon_fit
  role: coupon
  material: PLA (same spool and settings as the knob)
  code: "import math\n\ndef hex2d(af):\n    r = (af / 2.0) / math.cos(math.radians(30.0))\n\
    \    return [(r * math.cos(math.radians(60.0 * i + 30.0)),\n             r * math.sin(math.radians(60.0\
    \ * i + 30.0))) for i in range(6)]\n\n# one hex socket: straight walls + a 45\
    \ deg lead-in chamfer at the mouth\ndef pocket_tool(af, z_floor, depth, lead,\
    \ x):\n    prism = (cq.Workplane(\"XY\").workplane(offset=z_floor).center(x, 0.0)\n\
    \             .polyline(hex2d(af)).close().extrude(depth + 0.5))\n    w0 = (cq.Workplane(\"\
    XY\").workplane(offset=z_floor + depth - lead).center(x, 0.0)\n          .polyline(hex2d(af)).close())\n\
    \    w1 = w0.workplane(offset=lead).polyline(hex2d(af + 2.0 * lead)).close()\n\
    \    return prism.union(w1.loft())\n\ndef build(p):\n    t = p.coupon_thick\n\
    \    depth = p.pocket_depth\n    z_floor = t - depth\n    body = cq.Workplane(\"\
    XY\").box(p.coupon_len, p.coupon_wid, t, centered=(True, True, False))\n\n   \
    \ afs = [p.nut_af - p.fit_offset_a, p.nut_af - p.fit_offset_b,\n           p.nut_af\
    \ - p.fit_offset_c, p.nut_af - p.fit_offset_d]\n    xs = [p.coupon_pitch * (i\
    \ - 1.5) for i in range(4)]\n\n    for i in range(4):\n        x = xs[i]\n   \
    \     body = body.cut(pocket_tool(afs[i], z_floor, depth, p.lead_in, x))\n   \
    \     # escape bore under the nut: the bolt's way out through the far side\n \
    \       body = body.cut(cq.Workplane(\"XY\").workplane(offset=-1.0).center(x,\
    \ 0.0)\n                        .circle(p.crown_bore_d / 2.0).extrude(z_floor\
    \ + 1.0))\n        # 1..4 pips mark the socket: 1 pip = widest (8.00 mm), 4 pips\
    \ = tightest (7.40 mm)\n        for k in range(i + 1):\n            body = body.union(cq.Workplane(\"\
    XY\").workplane(offset=t)\n                              .center(x - 4.5 + 4.5\
    \ * k, p.coupon_wid / 2.0 - 4.0)\n                              .circle(0.9).extrude(0.8))\n\
    \    return body\n"
  print_orientation: 'Flat as modelled: the plain underside (with the four 6 mm escape
    bores) on the bed, hex sockets opening upward. No supports, no brim.'
  use_orientation: Test piece only. Socket up to press the nut in, socket down (plus
    a shake) to check the fit holds. The socket with 1 pip is the size used in the
    knob.
hardware:
- id: nut_m5
  ref: ISO 4032 M5
  qty: 1
- id: bolt_m5
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: nut_pressed_into_knob
  fastener: nut_m5
  axis_origin:
  - 0.0
  - 0.0
  - 15.4
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: hex_socket_flats
    role: nut_pocket
  - part: knob
    feature: socket_shoulder
    role: head_seat
  nut: null
  external: null
- id: bolt_through_knob
  fastener: bolt_m5
  axis_origin:
  - 0.0
  - 0.0
  - 28.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: crown_bore
    role: clearance
  nut: nut_m5
  external: the bolt's head and washer bear on the far side of whatever you are clamping;
    origin is the head, 12 mm beyond the knob's socket mouth in the print frame
criteria:
- id: c1_socket_press_fit
  part: knob
  feature: hex_socket_flats
  relation: engages
  hardware: nut_m5
  clearance_mm: 0.0
  params:
  - pocket_af
  - nut_af
  - fit_offset_a
  check:
    method: coupon
    ref: coupon_fit
    description: '4-socket fit coupon: the 8.00 mm across-flats socket (1 pip, line-to-line
      with the nut) pushed in by hand and held the nut when the plate was inverted
      and shaken. The knob''s socket is that same size, depth and wall thickness.'
- id: c2_shoulder_blocks_the_nut
  part: knob
  feature: socket_shoulder
  relation: supports
  hardware: nut_m5
  clearance_mm: null
  params:
  - pocket_depth
  - crown_bore_d
  - nut_af
  - nut_h
  check:
    method: measure
    ref: null
    description: The socket floor is a 6.0 mm-bored shoulder and the nut is 8.0 mm
      across flats, so the nut cannot be pushed out of the far side. After pressing,
      confirm the nut bottoms out on the shoulder and cannot be rattled out downwards.
- id: c3_nut_fully_inside
  part: knob
  feature: hex_socket
  relation: contains
  hardware: nut_m5
  clearance_mm: -0.6
  params:
  - pocket_depth
  - nut_h
  check:
    method: measure
    ref: null
    description: Socket is 5.3 mm deep for a 4.7 mm nut, so the nut's outer face ends
      up 0.6 mm below the socket mouth; check with a straight edge laid across the
      mouth.
- id: c4_bolt_clears_and_exits
  part: knob
  feature: crown_bore
  relation: clears
  hardware: bolt_m5
  clearance_mm: 1.0
  params:
  - crown_bore_d
  - bolt_d
  - knob_h
  - pocket_depth
  check:
    method: measure
    ref: null
    description: '6.0 mm bore for a 5.0 mm bolt: before pressing the nut, slide the
      bolt through the bore and out of the socket; it must pass freely. The bolt needs
      about 16 mm of reach past your workpiece to emerge from the far face.'
manual:
- n: '1'
  text: 'Optional fit check before committing filament (you already ran this once):
    print coupon_fit flat as it comes, sockets up. Press your M5 nut into the socket
    with 1 pip (8.00 mm across flats — the socket size the knob uses) and turn the
    plate socket-down and shake it. It should push in by hand and stay put. Only bother
    if you are using a nut other than the one already tested.'
  parts:
  - coupon_fit
  hardware:
  - nut_m5
  tool: null
- n: '2'
  text: 'Print knob as it comes in the file: the flat face with the 6 mm hole on the
    bed, hex socket opening upward. PLA, 0.2 mm layers, 0.4 mm nozzle, no supports,
    no brim.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: 'Check the bolt''s passage first, while the socket is still empty: slide your
    M5 bolt through the 6 mm hole from the flat far face until it pokes out into the
    socket, then withdraw it. It must slide freely with no drag.'
  parts:
  - knob
  hardware:
  - bolt_m5
  tool: null
- n: '4'
  text: Press the M5 nut into the hex socket. Socket mouth upward; drop the nut in
    flat-side first with its flats aligned to the socket's flats (a hex nut fits in
    any of the six rotations) and push it down past the 0.6 mm lead-in chamfer until
    it bottoms out on the shoulder. It should go in with firm hand pressure and end
    up about 0.6 mm below the rim — a fingernail's depth.
  parts:
  - knob
  hardware:
  - nut_m5
  tool: null
- n: '5'
  text: 'If hand pressure is not enough, draw it in with the bolt: thread the bolt
    through the 6 mm hole from the flat far face and into the nut, then pull the bolt
    away from the socket (hold the knob still) so the nut is dragged down onto the
    shoulder. Unscrew the bolt afterwards.'
  parts:
  - knob
  hardware:
  - bolt_m5
  - nut_m5
  tool: your fingers (or pliers on the bolt head)
- n: '6'
  text: 'Check the captive nut: turn the knob socket-down and shake and tap it. The
    nut must not fall out. It is fully inside the knob (0.6 mm below the rim) and
    cannot pass through the 6 mm bore at the far side.'
  parts:
  - knob
  hardware:
  - nut_m5
  tool: null
- n: '7'
  text: 'Use it: put the bolt through your workpiece with the head on the far side
    (a washer under the head helps), then thread the knob onto the bolt with the socket
    face against the workpiece — the captive nut picks up the thread — and tighten
    by hand. The bolt needs at least 16 mm of reach past your workpiece for its end
    to come out of the far face; an M5x30 emerges with a stack up to about 12 mm thick,
    so go longer for thicker work.'
  parts:
  - knob
  hardware:
  - bolt_m5
  tool: null
- n: '8'
  text: To get the nut out later (to swap in a different one), press it back out with
    a 5 mm drift or the smooth end of a 5 mm drill through the 6 mm bore from the
    top of the knob.
  parts:
  - knob
  hardware:
  - nut_m5
  tool: null
