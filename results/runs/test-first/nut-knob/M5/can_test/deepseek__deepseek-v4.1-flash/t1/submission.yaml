manual:
- n: '1'
  text: 'Print knob.stl in PLA, 0.4 mm nozzle, 0.2 mm layers, no supports. It is already
    oriented: the flat closed face with the Ø5.5 hole goes on the bed and the hex
    nut pocket opens upward. One piece, ~30 mm across, ~9 mm tall. Let it cool, then
    lift it off — no brim needed.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: 'Look into the hex pocket on the open face. You should see, from the mouth
    inward: a flared lead-in, then a narrow hex band (the grip band, 7.8 mm across
    flats), then a wider hex, ending in a flat floor with a Ø5.5 hole in the middle.
    Clear any stringing out of the mouth so the nut starts square.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Set the knob flat on a hard bench, open face up. Drop the M5 hex nut into
    the pocket, hex-aligned and flat. Press it in squarely with both thumbs — pressing
    the knob down onto the nut on the bench works well. It squeezes through the grip
    band with a firm push, then drops about 2 mm onto the pocket floor. It must go
    in square; if it jams crooked, pull it out and start again. If your thumbs aren't
    enough, squeeze it in with a C-clamp or tap it with a wood block — never hammer
    it crooked.
  parts:
  - knob
  hardware:
  - nut_m5
  tool: C-clamp or wood block, only if needed
- n: '4'
  text: 'Check it is captive: turn the knob upside down and shake it. The nut must
    stay in — the grip band holds it, no glue. It also cannot be driven out the other
    way: the closed face has only a Ø5.5 hole, smaller than the nut, so it seats on
    a solid plastic ring. The nut''s outer face now sits about 1 mm below the knob''s
    open face.'
  parts:
  - knob
  hardware:
  - nut_m5
  tool: null
- n: '5'
  text: From the same open face, start your M5 bolt into the nut and turn it in by
    hand. It threads through the nut and comes out of the Ø5.5 hole in the closed
    face — that is the side that will show.
  parts:
  - knob
  hardware:
  - nut_m5
  - bolt_m5
  tool: null
- n: '6'
  text: 'To use: pass the bolt through the workpiece so its head is on the far side,
    then turn the knob by the fluted rim with your fingers. The nut slides the last
    1 mm and then bears straight on the workpiece, so the clamping force goes into
    the workpiece and not through the plastic. Hand-tight is plenty — the flutes are
    for fingers, not pliers.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '7'
  text: To move the knob to another bolt, just unscrew it. The nut stays with the
    knob. If you ever want the nut out, press it back through the grip band from the
    closed-face side with a drift and a firm squeeze.
  parts:
  - knob
  hardware: []
  tool: null
- n: '8'
  text: 'Optional, if the press felt wrong: print fit_coupon.stl (same settings, flat,
    no supports). It has five pockets marked with 1-5 dots. Pocket 3 is the knob''s
    grip band; 1 is a no-interference control, 2 and 4 are looser and tighter, 5 grips
    over the full nut height. Press a nut into each and flip the bar over to see which
    hold — that tells you which way to move the grip band.'
  parts:
  - fit_coupon
  hardware: []
  tool: none
