task: nut-knob/M5
note: 'A 30 mm fluted hand knob, 8.9 mm tall, printed as one piece flat on the bed
  with no supports. Pocket sequence from the open face inward: a flared lead-in (10.2
  mm across flats) so the nut starts square, a 7.8 mm ''grip band'' (0.10 mm per side
  smaller than the nut) that the nut is pressed through, then a 8.4 mm free pocket,
  then a flat floor with a Ø5.5 hole. The nut ends up gripped by the band (holds when
  the knob is turned upside down, no glue), sits 1 mm inside the open face, and cannot
  be pushed out the closed face because the only opening there is Ø5.5 — smaller than
  the nut''s 8.0 across flats, leaving a 1.25 mm bearing ring. Your M5 bolt enters
  from the open face, threads through the nut and emerges from the Ø5.5 hole. Under
  load the nut slides that last 1 mm and bears directly on the workpiece, so the clamping
  force goes into the workpiece rather than through the plastic band. I could neither
  measure your nut nor get results back from the fit-test coupon, so grip_int (0.10
  mm per side) is the middle of the candidates; the submitted coupon re-tests exactly
  this value (variant 3, three dots) so a single print tells you whether to keep it.'
questions:
- text: 'How does the nut''s press feel: does it need a hard push and hold firm when
    upside down, is it about right, or does it drop in loose? (If it''s loose I''ll
    shrink the grip band by 0.05 mm per side; if it won''t press in by hand I''ll
    open it by the same amount.)'
  answer: null
- text: What M5 bolt will it go on — length and how much thread? The knob uses 8 mm
    of bolt from the open face (4.7 mm through the nut plus 3.2 mm of shoulder), so
    I want to be sure enough thread is left to reach through your workpiece.
  answer: null
