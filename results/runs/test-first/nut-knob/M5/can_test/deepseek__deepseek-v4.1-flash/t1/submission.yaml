    note: radial clearance per side in the free part of the hex pocket
  scallop_depth:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: finger flute depth at the rim
  scallop_n:
    value: 12
    unit: count
    kind: design
    source: design
    note: number of finger flutes round the rim
  scallop_r:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: radius of the cutter forming each flute
  shoulder_t:
    value: 3.2
    unit: mm
    kind: design
    source: design
    note: solid thickness behind the nut, i.e. the ring the nut bears on from the
      far side
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef _hd(af):\n    return af / math.cos(math.pi / 6.0)\n\n\
    def _hexp(af, z0, z1):\n    return (cq.Workplane(\"XY\").workplane(offset=z0)\n\
    \            .polygon(6, _hd(af)).extrude(z1 - z0))\n\ndef _hexl(af0, z0, af1,\
    \ z1):\n    return (cq.Workplane(\"XY\").workplane(offset=z0).polygon(6, _hd(af0))\n\
    \            .workplane(offset=z1 - z0).polygon(6, _hd(af1)).loft())\n\ndef build(p):\n\
    \    R = p.knob_od / 2.0\n    H = p.shoulder_t + p.nut_h + p.mouth_lead\n    af_p\
    \ = p.nut_af + 2.0 * p.pocket_clr\n    af_g = p.nut_af - 2.0 * p.grip_int\n  \
    \  af_m = p.nut_af + 2.0 * p.mouth_extra\n    z_floor = p.shoulder_t\n    z_gt\
    \ = H - p.mouth_lead\n    z_gb = max(z_gt - p.grip_h, z_floor)\n    z_fb = max(z_gb\
    \ - p.flare_h, z_floor)\n\n    body = cq.Workplane(\"XY\").cylinder(H, R).translate((0.0,\
    \ 0.0, H / 2.0))\n    body = body.faces(\"<Z\").edges().chamfer(p.edge_ch)\n \
    \   body = body.faces(\">Z\").edges().chamfer(p.edge_ch)\n\n    n = int(p.scallop_n)\n\
    \    for i in range(n):\n        a = 2.0 * math.pi * i / n\n        rc = R + p.scallop_r\
    \ - p.scallop_depth\n        body = body.cut(cq.Workplane(\"XY\").workplane(offset=-1.0)\n\
    \                        .center(rc * math.cos(a), rc * math.sin(a))\n       \
    \                 .circle(p.scallop_r).extrude(H + 2.0))\n\n    sol = []\n   \
    \ if z_fb - z_floor > 0.1:\n        sol.append(_hexp(af_p, z_floor, z_fb))\n \
    \   if z_gb - z_fb > 0.1:\n        sol.append(_hexl(af_p, z_fb, af_g, z_gb))\n\
    \    if z_gt - z_gb > 0.1:\n        sol.append(_hexp(af_g, z_gb, z_gt))\n    sol.append(_hexl(af_g,\
    \ z_gt, af_m, H))\n    cav = sol[0]\n    for s in sol[1:]:\n        cav = cav.union(s)\n\
    \    body = body.cut(cav)\n\n    body = body.cut(cq.Workplane(\"XY\").workplane(offset=-1.0)\n\
    \                    .circle(p.bolt_hole_d / 2.0).extrude(H + 2.0))\n    return\
    \ body\n"
  print_orientation: 'Closed face down on the bed: the flat face with the Ø5.5 hole
    at z = 0, hex nut pocket opening upward. No supports, no bridges.'
  use_orientation: 'Flipped from the print: the open hex-pocket face is the bottom
    and presses on the workpiece; the closed Ø5.5 face is the top and the bolt''s
    end emerges there. Turn it by the fluted rim.'
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef _hd(af):\n    return af / math.cos(math.pi / 6.0)\n\n\
    def _hexp(af, z0, z1):\n    return (cq.Workplane(\"XY\").workplane(offset=z0)\n\
    \            .polygon(6, _hd(af)).extrude(z1 - z0))\n\ndef _hexl(af0, z0, af1,\
    \ z1):\n    return (cq.Workplane(\"XY\").workplane(offset=z0).polygon(6, _hd(af0))\n\
    \            .workplane(offset=z1 - z0).polygon(6, _hd(af1)).loft())\n\ndef _cell(p,\
    \ interf, band_h, H):\n    af_p = p.nut_af + 2.0 * p.pocket_clr\n    af_g = p.nut_af\
    \ - 2.0 * interf\n    af_m = p.nut_af + 2.0 * p.mouth_extra\n    z_floor = p.shoulder_t\n\
    \    z_gt = H - p.mouth_lead\n    z_gb = max(z_gt - band_h, z_floor)\n    z_fb\
    \ = max(z_gb - p.flare_h, z_floor)\n    sol = []\n    if z_fb - z_floor > 0.1:\n\
    \        sol.append(_hexp(af_p, z_floor, z_fb))\n    if z_gb - z_fb > 0.1:\n \
    \       sol.append(_hexl(af_p, z_fb, af_g, z_gb))\n    if z_gt - z_gb > 0.1:\n\
    \        sol.append(_hexp(af_g, z_gb, z_gt))\n    sol.append(_hexl(af_g, z_gt,\
    \ af_m, H))\n    c = sol[0]\n    for s in sol[1:]:\n        c = c.union(s)\n \
    \   return c\n\ndef build(p):\n    # test matrix: (interference per side, band\
    \ height). Variant 3 is the knob.\n    H = p.shoulder_t + p.nut_h + p.mouth_lead\n\
    \    variants = [(0.0, p.grip_h), (0.5 * p.grip_int, p.grip_h),\n            \
    \    (p.grip_int, p.grip_h), (1.5 * p.grip_int, p.grip_h),\n                (p.grip_int,\
    \ p.nut_h)]\n    pitch = 24.0\n    n = len(variants)\n    L = pitch * (n - 1)\
    \ + 22.0\n    bar = cq.Workplane(\"XY\").box(L, 26.0, H).translate((0.0, 0.0,\
    \ H / 2.0))\n    for i in range(n):\n        x = (i - (n - 1) / 2.0) * pitch\n\
    \        interf, band_h = variants[i]\n        bar = bar.cut(_cell(p, interf,\
    \ band_h, H).translate((x, 0.0, 0.0)))\n        bar = bar.cut(cq.Workplane(\"\
    XY\").workplane(offset=-1.0).center(x, 0.0)\n                      .circle(p.bolt_hole_d\
    \ / 2.0).extrude(H + 2.0))\n        for k in range(i + 1):\n            dx = (k\
    \ - i / 2.0) * 3.0\n            bar = bar.cut(cq.Workplane(\"XY\").workplane(offset=H\
    \ - 1.2)\n                          .center(x + dx, -9.5).circle(1.0).extrude(1.7))\n\
    \    return bar\n"
  print_orientation: Flat bottom face (the face with the Ø5.5 holes) on the bed, pockets
    opening upward, dots on top. No supports.
  use_orientation: On the bench, pockets up, to press nuts in; then flip it to see
    which stay in.
