task: nut-knob/M5
note: 'A one-piece lobed hand knob, 30 mm across, with a captured M5 nut.


  How the nut is held (no glue):

  - Hex pocket across flats 7.95 mm against a nominal 8.00 mm nut: a light press on
  a nominal nut, and because printed hex holes come out a little small, it stays a
  press for a nut anywhere in the 7.78-8.00 mm tolerance band.

  - A 0.5 mm tall lip across flats 7.70 mm sits just above the pocket (with a 45 deg
  lead-in funnel above it and a 45 deg relief chamfer below it). The nut has to pass
  that lip to go in, and the lip is what keeps the nut in the knob when you turn it
  upside down. The lip''s underside is chamfered at 27 deg from vertical and the funnel
  widens upward, so the whole part prints with no supports.

  - The pocket floor (6.15 mm of material) is the "far side": the nut lands flat on
  it and cannot be pushed out that way, and the 5.5 mm bolt hole through it lets the
  bolt pass right through and out the open top.


  Print it as modelled: shoulder face on the bed, hex pocket opening upward. Everything
  is vertical or widens upward, so no supports.


  Known soft spot: I could not measure your nut and could not get feedback from the
  fit coupon, so the insertion force is a judgement call. Press it in with firm thumb
  pressure on a table; if it is stubborn, a light tap with a mallet handle will seat
  it. If it goes in too easily, tell me and I will take the lip down another 0.1 mm
  across flats.'
