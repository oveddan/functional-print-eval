parts:
- id: knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "import math\n\ndef hexd(af):\n    return af / math.cos(math.radians(30.0))\n\
    \ndef hprism(z0, z1, af):\n    return (cq.Workplane(\"XY\").workplane(offset=z0)\n\
    \            .polygon(6, hexd(af)).extrude(z1 - z0))\n\ndef cone(z0, r0, z1, r1):\n\
    \    return cq.Workplane(\"XY\").add(\n        cq.Solid.makeCone(r0, r1, z1 -\
    \ z0,\n                          cq.Vector(0.0, 0.0, z0), cq.Vector(0.0, 0.0,\
    \ 1.0)))\n\ndef build(p):\n    R = p.knob_d / 2.0\n    H = p.knob_h\n\n    # lobed\
    \ grip body: a cylinder with 6 shallow scallops\n    body = cq.Workplane(\"XY\"\
    ).circle(R).extrude(H)\n    for i in range(int(p.n_lobes)):\n        a = 2.0 *\
    \ math.pi * i / p.n_lobes\n        body = body.cut(cq.Workplane(\"XY\")\n    \
    \                    .center(p.lobe_c_r * math.cos(a), p.lobe_c_r * math.sin(a))\n\
    \                        .circle(p.lobe_r).extrude(H))\n\n    # chamfer both rims:\
    \ keep only what fits inside a barrel with 45 deg ends\n    zc = p.rim_cham +\
    \ 0.5\n    keep = cone(0.0, R - p.rim_cham, zc, R + 0.5)\n    keep = keep.union(cq.Workplane(\"\
    XY\").workplane(offset=zc)\n                      .circle(R + 0.5).extrude(H -\
    \ 2.0 * zc))\n    keep = keep.union(cone(H - zc, R + 0.5, H, R - p.rim_cham))\n\
    \    body = body.intersect(keep)\n\n    # axial void, bottom to top: bolt clearance\
    \ hole, hex pocket, lip, lead-in\n    z_lead = H - p.lead_h\n    z_lip = z_lead\
    \ - p.lip_h\n    z_ch = z_lip - p.lip_cham\n    z_floor = z_ch - (p.nut_h + p.pocket_extra)\n\
    \n    void = hprism(z_floor, z_ch, p.pocket_af)\n    void = void.union(cone(z_ch,\
    \ p.pocket_af / 2.0, z_lip, p.lip_af / 2.0))\n    void = void.union(hprism(z_lip,\
    \ z_lead, p.lip_af))\n    void = void.union(cone(z_lead, p.lip_af / 2.0, H, p.lip_af\
    \ / 2.0 + p.lead_h))\n    void = void.union(cq.Workplane(\"XY\").workplane(offset=-1.0)\n\
    \                      .circle(p.clear_d / 2.0).extrude(z_floor + 1.0))\n\n  \
    \  return body.cut(void)\n"
  print_orientation: 'Flat on the bed: the shoulder face (z = 0, the plain face with
    the 5.5 mm hole) on the build plate, hex pocket opening upward. No supports -
    pocket walls and scallops are vertical, the lip''s underside is chamfered at 27
    deg from vertical, and the lead-in funnel widens upward. A 1 mm 45 deg chamfer
    at each rim is within normal overhang limits.'
  use_orientation: Shoulder face (z = 0) flat against the workpiece/bracket; hex pocket
    opening faces away from the workpiece, upward. The M5 bolt comes up through the
    5.5 mm hole in the shoulder, threads into the nut resting on the pocket floor,
    and its threaded end leaves through the open top face.
