manual:
- n: '1'
  text: 'Print the knob (part ''knob'') in PLA at 0.2 mm layers. Place it as modelled:
    the plain face with the small hole (the shoulder) down on the bed, hex pocket
    opening up. No supports and no brim.'
  parts:
  - knob
  hardware: []
  tool: 3D printer
- n: '2'
  text: Press an ISO 4032 M5 hex nut into the hex pocket in the open top face, flats
    lined up with the pocket's flats. Firm thumb pressure on a table - the nut cams
    past the small lip and lands flat on the pocket floor with its top face about
    0.4 mm below the lip. If it is stubborn, a light tap with a mallet handle seats
    it.
  parts:
  - knob
  hardware:
  - m5_nut
  tool: null
- n: '3'
  text: 'Retention check: turn the knob upside down and tap the rim. The nut must
    stay in - the lip grips it, and the pocket floor behind it means it cannot come
    out the far side.'
  parts:
  - knob
  hardware:
  - m5_nut
  tool: null
- n: '4'
  text: 'Bolt check: push an M5 bolt up through the 5.5 mm hole in the knob''s flat
    shoulder face. It slides in freely, threads into the nut and its threaded end
    comes out of the open top face.'
  parts:
  - knob
  hardware:
  - m5_bolt
  - m5_nut
  tool: null
- n: '5'
  text: 'Assembly: pass the bolt through your bracket or workpiece, start it into
    the nut by hand, then turn the knob to tighten. Tightening pulls the nut down
    onto the shoulder, so the nut can never be pushed out through the far side, and
    the lip keeps it in the knob whenever you take the knob off.'
  parts:
  - knob
  hardware:
  - m5_bolt
  - m5_nut
  tool: null
