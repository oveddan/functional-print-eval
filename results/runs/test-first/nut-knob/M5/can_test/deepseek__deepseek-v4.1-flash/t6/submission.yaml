task: nut-knob/M5
note: 'One printed part: a Ø30 x 14 mm hand knob with 12 grip flutes, holding an M5
  hex nut in a hexagonal pocket in its top face. The nut presses in from the top and
  lands on a 1.2 mm wide ledge whose only opening is a Ø5.5 mm bolt hole, so it is
  trapped: it cannot rotate, cannot fall out of the top, and cannot be pushed out
  the far side. The M5 bolt comes up through the bottom hole, threads into the nut
  and, if it is long, emerges into the open pocket and out of the top face. Prints
  flat, no supports; the largest overhang anywhere is a 0.75 mm inward step (pocket-mouth
  lead-in and the bolt lead-in), which is nothing for an X1C.


  FIT: your nut could not be measured and the test coupon was not reported on, so
  the pocket is set from the catalog nut (8.0 across flats) plus a 0.05 mm printer-shrink
  allowance -> 8.05 across flats. That should be a light hand press fit that grips
  by friction. Because that one number is unverified, `knob_tight` is supplied: identical,
  pocket 7.95. Print `knob` first; if the nut drops out when you invert it, print
  `knob_tight`. The optional `fit_coupon` puts five pocket sizes (7.90 to 8.10, dot-marked
  1-5) in one 80 x 16 x 8 mm bar if you would rather find your size before committing
  a whole knob.


  Bolt length is not a constraint: anything that protrudes past the nut simply comes
  out of the open top. Only two hardware dimensions actually matter, the nut''s 8.0
  across flats and the bolt''s 5.0 shank, and both come from the catalog.'
questions:
- text: If you printed the fit coupon, which pocket (how many dots) gives a nut that
    presses in by hand and still holds when you turn the bar upside down and tap it?
  answer: null
- text: On the printed knob, did the nut press in with finger pressure and stay put
    when you inverted and shook the knob?
  answer: null
params:
  knob_od:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: person asked for about 30 mm across; this is the max diameter, at the flute
      ridges
  knob_h:
    value: 14
    unit: mm
    kind: design
    source: design
    note: tall enough to grip and to leave 8.8 mm of floor under the nut pocket
  rim_ch:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: chamfer on the top and bottom outer edges
  flute_count:
    value: 12
    unit: count
    kind: design
    source: design
    note: grip grooves around the rim
  flute_r:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: radius of the vertical groove cutter
  flute_depth:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: groove depth into the rim
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats; person could not measure their nut
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 nut thickness
  bolt_d:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: M5 nominal major diameter; person could not measure their bolt
  af_pocket:
    value: 8.05
    unit: mm
    kind: design
    source: design
    note: 'nut_af + 0.05 printer-shrink allowance: light hand press fit that grips
      by friction'
  af_pocket_tight:
    value: 7.95
    unit: mm
    kind: design
    source: design
    note: fallback pocket size for knob_tight if the nut drops out of knob
  pocket_depth:
    value: 5.2
    unit: mm
    kind: design
    source: design
    note: nut_h + 0.5, so the nut's top face sits 0.5 mm below the knob rim
  entry_af_extra:
    value: 0.85
    unit: mm
    kind: design
    source: design
    note: extra across-flats on the 0.9 mm deep mouth rebate that leads the nut in
  entry_depth:
    value: 0.9
