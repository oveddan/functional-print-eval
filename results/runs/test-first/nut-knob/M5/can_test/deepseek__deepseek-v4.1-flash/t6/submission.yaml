  hole_lead_d:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: counterbore at the bolt entry face, to find the bolt by feel
  hole_lead_depth:
    value: 0.9
    unit: mm
    kind: design
    source: design
    note: depth of the bolt-entry counterbore
  cell_w:
    value: 16
    unit: mm
    kind: design
    source: design
    note: coupon cell pitch
  coupon_w:
    value: 16
    unit: mm
    kind: design
    source: design
    note: coupon width
  coupon_t:
    value: 8
    unit: mm
    kind: design
    source: design
    note: 'coupon thickness: same 5.2 pocket plus a 2.8 lip as the knob'
  o1:
    value: -0.1
    unit: mm
    kind: design
    source: design
    note: coupon cell 1 (1 dot) offset from nut_af = 7.90 across flats
  o2:
    value: -0.05
    unit: mm
    kind: design
    source: design
    note: cell 2 (2 dots) = 7.95, same as knob_tight
  o3:
    value: 0.0
    unit: mm
    kind: design
    source: design
    note: cell 3 (3 dots) = 8.00
  o4:
    value: 0.05
    unit: mm
    kind: design
    source: design
    note: cell 4 (4 dots) = 8.05, same as knob
  o5:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: cell 5 (5 dots) = 8.10
parts:
- id: knob
  role: final
  material: PLA (high-speed, black)
  code: "import cadquery as cq\nimport math\n\ndef build(p):\n    af = p.af_pocket\n\
    \    R = p.knob_od / 2.0\n    t = p.knob_h\n\n    # body, with the top and bottom\
    \ outer edges broken\n    body = cq.Workplane(\"XY\").circle(R).extrude(t)\n \
    \   body = body.edges(\">Z\").chamfer(p.rim_ch)\n    body = body.edges(\"<Z\"\
    ).chamfer(p.rim_ch)\n\n    # grip flutes: vertical grooves round the rim\n   \
    \ n = int(p.flute_count)\n    for i in range(n):\n        a = 2.0 * math.pi *\
    \ i / n\n        cx = (R + p.flute_r - p.flute_depth) * math.cos(a)\n        cy\
    \ = (R + p.flute_r - p.flute_depth) * math.sin(a)\n        body = body.cut(\n\
    \            cq.Workplane(\"XY\").workplane(offset=-1.0).center(cx, cy)\n    \
    \        .circle(p.flute_r).extrude(t + 2.0)\n        )\n\n    floor = t - p.pocket_depth\n\
    \    d_pocket = af * 2.0 / math.sqrt(3.0)\n    d_entry = (af + p.entry_af_extra)\
    \ * 2.0 / math.sqrt(3.0)\n\n    # hex nut pocket, down to the ledge\n    body\
    \ = body.cut(\n        cq.Workplane(\"XY\").workplane(offset=t + 1.0)\n      \
    \  .polygon(6, d_pocket).extrude(-(p.pocket_depth + 1.0))\n    )\n    # mouth\
    \ rebate that leads the nut in\n    body = body.cut(\n        cq.Workplane(\"\
    XY\").workplane(offset=t + 1.0)\n        .polygon(6, d_entry).extrude(-(p.entry_depth\
    \ + 1.0))\n    )\n    # clearance hole through the floor: the lip that traps the\
    \ nut\n    body = body.cut(\n        cq.Workplane(\"XY\").workplane(offset=floor\
    \ + 1.0)\n        .circle(p.through_d / 2.0).extrude(-(floor + 2.0))\n    )\n\
    \    # lead-in for the bolt on the outside face\n    body = body.cut(\n      \
    \  cq.Workplane(\"XY\").workplane(offset=-0.5)\n        .circle(p.hole_lead_d\
    \ / 2.0).extrude(p.hole_lead_depth + 0.5)\n    )\n    return body\n"
  print_orientation: flat closed face on the bed (z = 0 is the face with the Ø7 counterbore
    and Ø5.5 hole); hex nut pocket opens straight up
  use_orientation: 'as printed: closed face down toward the bolt, hex pocket up, nut
    pressed in from the top'
- id: knob_tight
  role: final
  material: PLA (high-speed, black)
  code: "import cadquery as cq\nimport math\n\ndef build(p):\n    af = p.af_pocket_tight\n\
    \    R = p.knob_od / 2.0\n    t = p.knob_h\n\n    body = cq.Workplane(\"XY\").circle(R).extrude(t)\n\
    \    body = body.edges(\">Z\").chamfer(p.rim_ch)\n    body = body.edges(\"<Z\"\
    ).chamfer(p.rim_ch)\n\n    n = int(p.flute_count)\n    for i in range(n):\n  \
    \      a = 2.0 * math.pi * i / n\n        cx = (R + p.flute_r - p.flute_depth)\
    \ * math.cos(a)\n        cy = (R + p.flute_r - p.flute_depth) * math.sin(a)\n\
    \        body = body.cut(\n            cq.Workplane(\"XY\").workplane(offset=-1.0).center(cx,\
    \ cy)\n            .circle(p.flute_r).extrude(t + 2.0)\n        )\n\n    floor\
    \ = t - p.pocket_depth\n    d_pocket = af * 2.0 / math.sqrt(3.0)\n    d_entry\
    \ = (af + p.entry_af_extra) * 2.0 / math.sqrt(3.0)\n\n    body = body.cut(\n \
    \       cq.Workplane(\"XY\").workplane(offset=t + 1.0)\n        .polygon(6, d_pocket).extrude(-(p.pocket_depth\
    \ + 1.0))\n    )\n    body = body.cut(\n        cq.Workplane(\"XY\").workplane(offset=t\
    \ + 1.0)\n        .polygon(6, d_entry).extrude(-(p.entry_depth + 1.0))\n    )\n\
    \    body = body.cut(\n        cq.Workplane(\"XY\").workplane(offset=floor + 1.0)\n\
    \        .circle(p.through_d / 2.0).extrude(-(floor + 2.0))\n    )\n    body =\
    \ body.cut(\n        cq.Workplane(\"XY\").workplane(offset=-0.5)\n        .circle(p.hole_lead_d\
    \ / 2.0).extrude(p.hole_lead_depth + 0.5)\n    )\n    return body\n"
  print_orientation: flat closed face on the bed (z = 0 is the face with the Ø7 counterbore
    and Ø5.5 hole); hex nut pocket opens straight up
  use_orientation: 'as printed: closed face down toward the bolt, hex pocket up, nut
    pressed in from the top'
- id: fit_coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "import cadquery as cq\nimport math\n\ndef build(p):\n    offs = [p.o1, p.o2,\
    \ p.o3, p.o4, p.o5]\n    cell = p.cell_w\n    L = cell * len(offs)\n    t = p.coupon_t\n\
    \    bar = cq.Workplane(\"XY\").box(L, p.coupon_w, t, centered=(True, True, False))\n\
    \n    for i, off in enumerate(offs):\n        af = p.nut_af + off\n        d_pocket\
    \ = af * 2.0 / math.sqrt(3.0)\n        d_entry = (af + p.entry_af_extra) * 2.0\
    \ / math.sqrt(3.0)\n        x = -L / 2.0 + cell * (i + 0.5)\n        floor = t\
    \ - p.pocket_depth\n\n        bar = bar.cut(\n            cq.Workplane(\"XY\"\
    ).workplane(offset=t + 1.0).center(x, 0)\n            .polygon(6, d_pocket).extrude(-(p.pocket_depth\
    \ + 1.0))\n        )\n        bar = bar.cut(\n            cq.Workplane(\"XY\"\
    ).workplane(offset=t + 1.0).center(x, 0)\n            .polygon(6, d_entry).extrude(-(p.entry_depth\
    \ + 1.0))\n        )\n        bar = bar.cut(\n            cq.Workplane(\"XY\"\
    ).workplane(offset=floor + 1.0).center(x, 0)\n            .circle(p.through_d\
    \ / 2.0).extrude(-(floor + 2.0))\n        )\n        # index dots beside the pocket:\
    \ i + 1 dots = 7.90, 7.95, 8.00, 8.05, 8.10\n        for k in range(i + 1):\n\
    \            dx = x + (k - i / 2.0) * 2.0\n            bar = bar.cut(\n      \
    \          cq.Workplane(\"XY\").workplane(offset=t - 2.5)\n                .center(dx,\
    \ p.coupon_w / 2.0 - 1.6)\n                .circle(0.9).extrude(3.0)\n       \
    \     )\n    return bar\n"
  print_orientation: flat on its bottom face (z = 0 on the bed), the five hex pockets
    opening straight up
  use_orientation: 'same: pockets up, nut pressed into a pocket from above, then invert
    to test retention'
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
- id: bolt
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: j_bolt
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: Ø7 bolt lead-in and Ø5.5 hole through the floor
    role: clearance
  - part: knob
    feature: hex nut pocket, 8.05 across flats, 5.2 deep
    role: nut_pocket
  nut: nut
  external: null
criteria:
- id: c_nut_fit
  part: knob
  feature: hex nut pocket, 8.05 mm across flats
  relation: contains
  hardware: nut
  clearance_mm: 0.05
  params:
  - af_pocket
  - nut_af
  check:
    method: coupon
    ref: fit_coupon
    description: The nut presses into a pocket of identical geometry with finger pressure
      and still holds when the coupon is turned upside down and tapped
- id: c_nut_captive
  part: knob
  feature: ledge under the pocket (only opening is the Ø5.5 hole)
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - through_d
  - pocket_depth
  check:
    method: measure
    ref: null
    description: Nut across flats (~8 mm) is far larger than the 5.5 mm opening, so
      the nut bears on a 1.2 mm wide ring and cannot pass through; only a bolt shank
      fits
- id: c_nut_recessed
  part: knob
  feature: pocket depth 5.2 mm versus 4.7 mm nut
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - pocket_depth
  - nut_h
  check:
    method: none
    ref: null
    description: Nut seats 0.5 mm below the knob rim, so it sits fully inside the
      knob
- id: c_bolt_clear
  part: knob
  feature: Ø7 lead-in plus Ø5.5 hole through the floor
  relation: clears
  hardware: bolt
  clearance_mm: 0.5
  params:
  - through_d
  - bolt_d
  - hole_lead_d
  check:
    method: coupon
    ref: fit_coupon
    description: The coupon carries the same Ø5.5 holes; an M5 bolt slides through
      one freely
- id: c_prints_unsupported
  part: knob
  feature: 'overhangs: 0.75 mm inward step at the pocket mouth, 0.75 mm step at the
    bolt lead-in'
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - entry_depth
  - entry_af_extra
  - hole_lead_d
  - through_d
  check:
    method: none
    ref: null
    description: Everything else is a vertical wall or a surface facing up; both steps
      are under 1 mm, far below the 50 mm bridge limit
manual:
- n: '1'
  text: 'Optional, but it saves printing a knob that may not fit: print `fit_coupon`
    flat as it comes (no supports). It has five hex pockets, 7.90, 7.95, 8.00, 8.05
    and 8.10 mm across the flats, and the top face has 1, 2, 3, 4 or 5 small dots
    beside them so you can tell which is which (1 dot = 7.90 mm, left to right). Drop
    the nut over each pocket and press it straight down with your thumb. Find the
    tightest pocket the nut goes into with finger pressure that also keeps the nut
    in when you turn the bar upside down and tap it. Winner at 8.05 or looser: print
    `knob`. Winner at 7.95 or tighter: print `knob_tight`. If you skip this, print
    `knob` and use step 4 to decide.'
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: fingers
- n: '2'
  text: 'Print `knob` in PLA at 0.2 mm layers exactly as it sits in the file: the
    flat face with the small Ø7 counterbore goes on the bed and the hexagonal pocket
    opens upward. No supports, no brim. It is about 10 g and roughly an hour.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Press the nut in. Set the nut flat on a hard table top, then lower the knob
    over it with the hex pocket facing down, lining the nut up with the pocket mouth.
    Press straight down with both palms, evenly, until the knob's rim touches the
    table - by then the nut has travelled its 5 mm and is seated on the ledge. No
    hammer, no glue.
  parts:
  - knob
  hardware:
  - nut
  tool: fingers
- n: '4'
  text: 'Test that it is captive. Turn the knob over (pocket down, as when it is on
    the bolt) and shake it gently over the table: the nut must stay in. If it drops
    out, print `knob_tight` - identical except the pocket is 0.10 mm smaller across
    the flats - and press the nut into that one instead, repeating steps 3 and 4.
    If instead the nut was too stiff to press in by hand, wrap a strip of 240-grit
    paper round a finger, give each of the six pocket flats 3 or 4 light strokes and
    try again.'
  parts:
  - knob
  - knob_tight
  hardware:
  - nut
  tool: fingers
- n: '5'
  text: 'Mount it on the bolt. The nut is now trapped: the ledge behind it leaves
    only a 5.5 mm hole, so it cannot turn, cannot fall out of the top and cannot be
    pushed out the far side. Bring the knob''s flat face onto the end of your M5 bolt
    so the bolt finds the Ø7 lead-in and passes the Ø5.5 hole, then turn the knob
    clockwise with your fingers. The bolt picks up the nut''s thread and runs up through
    it; if the bolt is longer than the pocket it simply comes out of the open top,
    so no bolt length is blocked.'
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: null
- n: '6'
  text: 'Tighten by hand: fingers in the twelve flutes round the edge. That is all
    the torque the knob is for - keep pliers off it.'
  parts:
  - knob
  hardware: []
  tool: fingers
- n: '7'
  text: 'Only if you want the nut back out: grip it with pliers and pull with a slight
    twist. The ledge stops it going the other way, so prying upwards is the only route.'
  parts:
  - knob
  hardware:
  - nut
  tool: pliers
