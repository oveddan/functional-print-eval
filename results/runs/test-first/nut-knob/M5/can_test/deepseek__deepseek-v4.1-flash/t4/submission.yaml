parts:
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    body = cq.Workplane(\"XY\").circle(p.coupon_od\
    \ / 2.0).extrude(p.knob_h)\n    body = body.cut(cq.Workplane(\"XY\", origin=(0.0,\
    \ 0.0, -1.0))\n                    .circle(p.bolt_hole_d / 2.0).extrude(p.knob_h\
    \ + 2.0))\n\n    hr = p.pocket_af / math.sqrt(3.0)\n    hexpts = [(hr * math.cos(math.radians(30.0\
    \ + 60.0 * i)),\n               hr * math.sin(math.radians(30.0 + 60.0 * i)))\
    \ for i in range(6)]\n    body = body.cut(cq.Workplane(\"XY\", origin=(0.0, 0.0,\
    \ p.shoulder_t))\n                    .polyline(hexpts).close()\n            \
    \        .extrude(p.pocket_depth + 1.0))\n\n    xf = p.pocket_af / 2.0\n    xo\
    \ = xf + p.tab_t\n    xh = xf - p.hook_depth\n    zr = p.tab_root_z\n    zc =\
    \ p.shoulder_t + p.nut_h\n    zt = p.knob_h\n    prof = [(xf, zr), (xo, zr), (xo,\
    \ zt),\n            (xh + p.hook_depth, zt), (xh, zt - p.hook_depth),\n      \
    \      (xh, zc), (xf, zc)]\n    hw = p.tab_w / 2.0\n\n    def prism(pts, w, ang):\n\
    \        return (cq.Workplane(\"XY\").polyline(pts).close().extrude(w)\n     \
    \           .rotate((0, 0, 0), (1, 0, 0), 90.0)\n                .translate((0.0,\
    \ w / 2.0, 0.0))\n                .rotate((0, 0, 0), (0, 0, 1), ang))\n\n    def\
    \ block(x0, x1, y0, y1, z0, z1, ang):\n        return (cq.Workplane(\"XY\").box(x1\
    \ - x0, y1 - y0, z1 - z0, centered=True)\n                .translate(((x0 + x1)\
    \ / 2.0, (y0 + y1) / 2.0, (z0 + z1) / 2.0))\n                .rotate((0, 0, 0),\
    \ (0, 0, 1), ang))\n\n    for i in range(6):\n        ang = 60.0 * i\n       \
    \ body = body.union(prism(prof, p.tab_w, ang))\n        body = body.cut(block(xo,\
    \ xo + p.tab_gap, -(hw + p.tab_slit),\n                              hw + p.tab_slit,\
    \ zr, p.knob_h + 1.0, ang))\n        body = body.cut(block(xf - 0.1, xo, hw, hw\
    \ + p.tab_slit,\n                              zr, p.knob_h + 1.0, ang))\n   \
    \     body = body.cut(block(xf - 0.1, xo, -(hw + p.tab_slit), -hw,\n         \
    \                     zr, p.knob_h + 1.0, ang))\n    return body\n"
  print_orientation: Flat face (the one with the Ø5.5 mm hole) on the bed; the hex
    socket opening faces up. z = 0 is the bed, z = 11 is the open face. No supports.
  use_orientation: 'Held in the hand as printed but flipped: hex opening facing down/outwards
    towards the bolt''s head, the flat face (with the 5.5 mm hole) up, so the bolt''s
    tip points up out of it.'
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    R = p.knob_od / 2.0\n    body = cq.Workplane(\"\
    XY\").circle(R).extrude(p.knob_h)\n    body = body.faces(\">Z\").edges().chamfer(p.rim_chamfer)\n\
    \    for i in range(int(p.n_flutes)):\n        a = 2.0 * math.pi * i / p.n_flutes\n\
    \        body = body.cut(cq.Workplane(\"XY\", origin=(R * math.cos(a), R * math.sin(a),\
    \ -1.0))\n                        .circle(p.flute_d / 2.0).extrude(p.knob_h +\
    \ 2.0))\n    body = body.cut(cq.Workplane(\"XY\", origin=(0.0, 0.0, -1.0))\n \
    \                   .circle(p.bolt_hole_d / 2.0).extrude(p.knob_h + 2.0))\n\n\
    \    hr = p.pocket_af / math.sqrt(3.0)\n    hexpts = [(hr * math.cos(math.radians(30.0\
    \ + 60.0 * i)),\n               hr * math.sin(math.radians(30.0 + 60.0 * i)))\
    \ for i in range(6)]\n    body = body.cut(cq.Workplane(\"XY\", origin=(0.0, 0.0,\
    \ p.shoulder_t))\n                    .polyline(hexpts).close()\n            \
    \        .extrude(p.pocket_depth + 1.0))\n\n    xf = p.pocket_af / 2.0\n    xo\
    \ = xf + p.tab_t\n    xh = xf - p.hook_depth\n    zr = p.tab_root_z\n    zc =\
    \ p.shoulder_t + p.nut_h\n    zt = p.knob_h\n    prof = [(xf, zr), (xo, zr), (xo,\
    \ zt),\n            (xh + p.hook_depth, zt), (xh, zt - p.hook_depth),\n      \
    \      (xh, zc), (xf, zc)]\n    hw = p.tab_w / 2.0\n\n    def prism(pts, w, ang):\n\
    \        return (cq.Workplane(\"XY\").polyline(pts).close().extrude(w)\n     \
    \           .rotate((0, 0, 0), (1, 0, 0), 90.0)\n                .translate((0.0,\
    \ w / 2.0, 0.0))\n                .rotate((0, 0, 0), (0, 0, 1), ang))\n\n    def\
    \ block(x0, x1, y0, y1, z0, z1, ang):\n        return (cq.Workplane(\"XY\").box(x1\
    \ - x0, y1 - y0, z1 - z0, centered=True)\n                .translate(((x0 + x1)\
    \ / 2.0, (y0 + y1) / 2.0, (z0 + z1) / 2.0))\n                .rotate((0, 0, 0),\
    \ (0, 0, 1), ang))\n\n    for i in range(6):\n        ang = 60.0 * i\n       \
    \ body = body.union(prism(prof, p.tab_w, ang))\n        body = body.cut(block(xo,\
    \ xo + p.tab_gap, -(hw + p.tab_slit),\n                              hw + p.tab_slit,\
    \ zr, p.knob_h + 1.0, ang))\n        body = body.cut(block(xf - 0.1, xo, hw, hw\
    \ + p.tab_slit,\n                              zr, p.knob_h + 1.0, ang))\n   \
    \     body = body.cut(block(xf - 0.1, xo, -(hw + p.tab_slit), -hw,\n         \
    \                     zr, p.knob_h + 1.0, ang))\n    return body\n"
  print_orientation: Far (flat) face with the Ø5.5 mm bolt hole on the bed; the open
    hex socket and the six spring tabs face up. z = 0 is the bed, z = 11 is the open
    face, so the socket's straight walls and the slits print as vertical features
    and nothing overhangs except the 45 deg tab ramps. No supports.
  use_orientation: Open (socket) face downwards/outwards towards the bolt's head,
    flat face with the 5.5 mm hole upwards so the bolt's tip leaves through it. Axis
    vertical, gripped by the scalloped rim.
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
- id: bolt
  ref: ISO 4762 M5x16
  qty: 1
- id: washer
  ref: ISO 7089 M5
  qty: 1
joints:
- id: j_bolt
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 11.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: open face around the socket opening (washer seat)
    role: washer
  - part: knob
    feature: bolt clearance hole in the shoulder (Ø5.5)
    role: clearance
  nut: nut
  external: the bolt's head and washer sit outside the knob at the socket opening;
    the threaded tip leaves through the shoulder's Ø5.5 hole and continues into whatever
    the bolt is being tightened into
criteria:
- id: c_fit
  part: knob
  feature: hex nut socket (across flats 8.25)
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - pocket_af
  - nut_af
  check:
    method: coupon
    ref: fit_coupon
    description: 'Print the coupon first and press the M5 nut in by hand: it should
      need a light firm push as the six tabs spread, then the tabs snap over it. Adjust
      pocket_af (0.25 mm over the nut''s across-flats) if it is too tight/loose.'
- id: c_capture
  part: knob
  feature: tab catch faces (6x, flat, sitting on the nut's top face)
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - hook_depth
  - tab_root_z
  - nut_h
  - shoulder_t
  check:
    method: coupon
    ref: fit_coupon
    description: 'Invert the coupon with the nut pressed in and shake: the nut must
      not move out. The hooks end up 0.2 mm over the nut''s top face and are caught
      axially, so this is not a friction fit.'
- id: c_floor
  part: knob
  feature: socket floor (shoulder top face at z = 4.5)
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - shoulder_t
  - pocket_depth
  check:
    method: coupon
    ref: fit_coupon
    description: Nut bottoms out squarely on the pocket floor and ends up 1.8 mm inside
      the knob (fully inside, nothing protruding).
- id: c_nut_out
  part: knob
  feature: shoulder with 5.5 mm hole (far side)
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - bolt_hole_d
  - nut_af
  - knob_h
  check:
    method: measure
    ref: null
    description: The nut (8.0 across flats) cannot pass the 5.5 mm hole, so it can
      never be pushed out through the far side.
- id: c_clear
  part: knob
  feature: bolt clearance hole through the shoulder
  relation: clears
  hardware: bolt
  clearance_mm: 0.5
  params:
  - bolt_hole_d
  check:
    method: coupon
    ref: fit_coupon
    description: 'Thread the M5 bolt through the nut from the open side: the tip slides
      through the 5.5 mm hole and shows outside the flat face.'
- id: c_drive
  part: knob
  feature: solid hex wall at the socket corners
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - pocket_af
  - nut_af
  check:
    method: none
    ref: null
    description: Torque goes through the nut's corners onto the plain solid wall (the
      six tabs sit in the middle of the flats and are clear of the nut, so they never
      see the driving load).
- id: c_head
  part: knob
  feature: open face around the socket opening (washer seat)
  relation: faces
  hardware: washer
  clearance_mm: null
  params:
  - washer_od
  - screw_head_d
  - knob_h
  check:
    method: measure
    ref: null
    description: ISO 7089 M5 washer (Ø10) under the bolt head spreads the clamping
      load on the open face instead of the bolt head bearing on the socket's edges.
manual:
- n: '1'
  text: Print the FIT COUPON first (flat face with the 5.5 mm hole on the bed, hex
    socket up). PLA, 0.2 mm layers, no supports.
  parts:
  - fit_coupon
  hardware: []
  tool: printer
- n: '2'
  text: 'Press the M5 nut into the coupon''s hex socket by hand, keeping it square.
    You should feel the six spring tabs spread, then snap flat over the nut''s face.
    Turn the coupon upside down and shake it: the nut must stay put. Check the nut
    sits fully inside. Then thread the M5 bolt in from the open side and check its
    tip comes out of the 5.5 mm hole. If it is much too tight or too loose, tell me
    - the hex across flats (8.25 mm) is the number to change.'
  parts:
  - fit_coupon
  hardware:
  - nut
  - bolt
  tool: null
- n: '3'
  text: Print the KNOB (flat face with the 5.5 mm hole on the bed, hex socket and
    tabs up). PLA, 0.2 mm layers, no supports needed.
  parts:
  - knob
  hardware: []
  tool: printer
- n: '4'
  text: Press the M5 hex nut into the knob's hex socket, open side up, keeping it
    square. Push until it stops on the socket floor - the tabs snap over its face
    and it ends up fully inside, 1.8 mm down, with nothing sticking out.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: 'Turn the knob upside down and shake it. The nut must stay in: the tabs catch
    its face and the only way out of the far side is the 5.5 mm hole, which is smaller
    than the nut.'
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '6'
  text: Drop the M5 washer on the bolt, put the bolt into the knob's open face and
    thread it through the nut until its tip appears out of the flat face. Use a bolt
    with at least 12 mm under the head (an M5x16 shows about 5 mm of tip).
  parts:
  - knob
  hardware:
  - bolt
  - washer
  tool: null
- n: '7'
  text: Grip the scalloped rim and turn the knob by hand. The nut inside drives the
    bolt; the washer keeps the bolt head on the knob's open face. If you ever need
    the nut out, ease the six tabs outwards with a thin blade while pulling the nut.
  parts:
  - knob
  hardware:
  - nut
  - bolt
  - washer
  tool: null
