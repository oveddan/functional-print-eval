task: nut-knob/M5
note: 'One printed piece (no glue, no supports): a 30 mm scalloped hand knob with
  a hex socket that swallows an ISO 4032 M5 nut and holds it in. The press-in / stay-in
  behaviour is done with six 0.7 mm spring tabs: each tab is a long thin blade freed
  by a 0.6 mm gap and two 0.5 mm slits, and its top 1.8 mm bends inwards as a hook.
  A 45 deg ramp on the hook lets the nut press in by hand (~7 N total); the nut''s
  flats hold the hooks open while it descends, and when its top face drops below the
  tabs they snap back and their flat catch faces sit right on the nut''s top face,
  so it cannot fall out upside down (it is caught axially, not by friction). The nut''s
  corners, not the tabs, take the torque: they bear on the plain, solid hex wall.
  The nut''s far face bottoms on a 4.5 mm shoulder whose only opening is the Ø5.5
  mm bolt hole, so the nut can never be pushed out the far side, and the bolt''s tip
  passes through that hole and out of the flat face. The nut ends up 1.8 mm inside
  the knob (nothing protrudes). Because FDM holes print slightly small, the hex is
  cut 0.25 mm over the nut''s across-flats (8.25 mm) so it stays a hand fit; that
  single number is the one to adjust if the coupon test says otherwise. Use a bolt
  with >= 12 mm under the head (e.g. ISO 4762 M5x16, tip comes out ~5 mm) and put
  the ISO 7089 M5 washer under its head: the washer (Ø10) gives the bolt head a proper
  flat seat on the knob''s open face instead of resting on the socket''s edges.'
questions:
- text: 'On the coupon: how does the nut press in by hand - too tight, about right,
    or loose?'
  answer: null
- text: Does the nut stay in when you hold the coupon upside down and shake it?
  answer: null
- text: Does your M5 bolt's tip come out through the 5.5 mm hole with the lengths
    you have?
  answer: null
