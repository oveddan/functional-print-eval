task: nut-knob/M5
note: 'A 30 mm fluted hand knob that carries an ISO 4032 M5 hex nut. The nut goes
  in through the open bottom of the knob, travels up a wide lead-in hex, and presses
  into a 7.85 mm-across-flats grip band at the top of the pocket (0.15 mm interference
  on a nominal 8.0 mm nut). Above the nut is a 4 mm ceiling with a 5.5 mm bore, so
  the nut is fully enclosed and cannot be pushed out the far side; the M5 bolt threads
  through the nut and its tip exits the top of the knob. Nothing but the knob is printed,
  no supports, no glue.


  Unverified, because the person could not measure or report: (1) the actual nut across-flats
  - I used the catalog 8.0 mm; (2) the press-fit interference - I used 0.15 mm, which
  is the middle of the range that normally presses by hand and holds; the fit_coupon
  brackets 8.05/7.95/7.85/7.75/7.65 mm so the fit can be checked on the printer; (3)
  the bolt length - I assumed the catalog M5x30 (22 mm of thread), which is why the
  nut sits 8.3 mm above the base: a standard M5x30''s unthreaded shank is 8 mm long,
  so the thread only reaches the nut if the nut is high up. The bolt must stand at
  least 20 mm proud of the clamped surface for the tip to exit the top, and must have
  thread in its last ~13 mm.'
questions: []
params:
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut, width across flats. Could not be measured.
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 nut height. Sets the grip band length.
  nut_ac:
    value: 9.24
    unit: mm
    kind: hardware
    source: datasheet
    note: Across corners = nut_af / cos(30). The nut must pass this through the lead-in.
  bolt_shank_d:
    value: 5.0
    unit: mm
    kind: hardware
    source: datasheet
    note: M5 major diameter.
  bolt_len:
    value: 30.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5x30, standing in for the user's own M5 bolt.
  bolt_thread_len:
    value: 22.0
    unit: mm
    kind: hardware
    source: catalog
    note: M5x30 thread length measured from the tip; leaves an 8 mm plain shank, which
      is why the nut is placed 8.3 mm above the base.
  clamp_t:
    value: 6.0
    unit: mm
    kind: world
    source: guessed
    note: Assumed thickness of the material being clamped; only used to place the
      bolt head in the joint. Unknown.
  knob_dia:
    value: 30.0
    unit: mm
    kind: design
    source: design
    note: Overall diameter as requested.
  knob_h:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: = pocket_depth + ceiling_t + shroud_h.
  pocket_depth:
    value: 13.0
    unit: mm
    kind: design
    source: design
    note: From the base face to the pocket ceiling.
  pocket_af:
    value: 7.85
    unit: mm
    kind: design
    source: design
