parts:
- id: knob
  role: final
  material: PLA (high-speed, black), 0.4 mm nozzle, 0.2 mm layers
  code: "def build(p):\n    import math\n\n    def hexpts(af):\n        R = af / math.sqrt(3.0)\n\
    \        return [(R * math.cos(math.radians(60 * i + 30)),\n                 R\
    \ * math.sin(math.radians(60 * i + 30))) for i in range(6)]\n\n    H = p.knob_h\n\
    \    r_out = p.knob_dia / 2.0\n    n = int(p.flute_count)\n\n    # ---- outer\
    \ wall with vertical grip flutes ----\n    pts = [(p.flute_center_r * math.cos(2\
    \ * math.pi * i / n),\n            p.flute_center_r * math.sin(2 * math.pi * i\
    \ / n)) for i in range(n)]\n    flutes = cq.Workplane(\"XY\").pushPoints(pts).circle(p.flute_r).extrude(H)\n\
    \    body = cq.Workplane(\"XY\").circle(r_out).extrude(H).cut(flutes)\n\n    #\
    \ ---- top rim chamfer: cut everything outside a 45 deg cone ----\n    ct = p.top_chamfer\n\
    \    o = cq.Workplane(\"XY\", origin=(0, 0, H - ct)).circle(r_out + 10).extrude(ct\
    \ + 2)\n    i = (cq.Workplane(\"XY\", origin=(0, 0, H - ct)).circle(r_out)\n \
    \        .workplane(offset=ct + 2).circle(r_out - ct - 2).loft())\n    body =\
    \ body.cut(o.cut(i))\n\n    # ---- base rim chamfer ----\n    cb = p.bot_chamfer\n\
    \    o2 = cq.Workplane(\"XY\", origin=(0, 0, -1)).circle(r_out + 10).extrude(cb\
    \ + 1)\n    i2 = (cq.Workplane(\"XY\", origin=(0, 0, -1)).circle(r_out - cb -\
    \ 1)\n          .workplane(offset=cb + 1).circle(r_out).loft())\n    body = body.cut(o2.cut(i2))\n\
    \n    # ---- hex nut pocket: wide lead-in, 45 deg taper, interference grip band\
    \ ----\n    af = p.pocket_af\n    lead_af = af + p.lead_clear\n    z2 = p.pocket_depth\
    \ - p.nut_h - p.nut_gap   # bottom of the grip band\n    z1 = z2 - p.taper_h \
    \                       # bottom of the lead-in taper\n\n    pocket = cq.Workplane(\"\
    XY\", origin=(0, 0, -1)).polyline(hexpts(lead_af)).close().extrude(z1 + 1)\n \
    \   pocket = pocket.union(\n        cq.Workplane(\"XY\", origin=(0, 0, z1)).polyline(hexpts(lead_af)).close()\n\
    \        .workplane(offset=p.taper_h).polyline(hexpts(af)).close().loft())\n \
    \   pocket = pocket.union(\n        cq.Workplane(\"XY\", origin=(0, 0, z2)).polyline(hexpts(af)).close()\n\
    \        .extrude(p.pocket_depth - z2 + 0.01))\n    body = body.cut(pocket)\n\n\
    \    # ---- bolt clearance bore through the ceiling and out the top ----\n   \
    \ body = body.cut(cq.Workplane(\"XY\", origin=(0, 0, p.pocket_depth))\n      \
    \              .circle(p.bore_d / 2.0).extrude(H - p.pocket_depth + 1))\n    return\
    \ body\n"
  print_orientation: Base face on the bed (z = 0). The open hex pocket faces down
    onto the bed and rises to z = 13; the ceiling is at z = 13-17 and the 5.5 mm bore
    exits the flat top at z = 20. Flutes are vertical.
  use_orientation: 'Same as printed: flutes vertical, pocket opening facing down onto
    the clamped part, nut pressed in from below, M5 bolt entering from below with
    its tip leaving through the top.'
- id: fit_coupon
  role: coupon
  material: PLA (high-speed, black), 0.4 mm nozzle, 0.2 mm layers
  code: "def build(p):\n    import math\n\n    def hexpts(af):\n        R = af / math.sqrt(3.0)\n\
    \        return [(R * math.cos(math.radians(60 * i + 30)),\n                 R\
    \ * math.sin(math.radians(60 * i + 30))) for i in range(6)]\n\n    afs = [p.cp_af_a,\
    \ p.cp_af_b, p.cp_af_c, p.cp_af_d, p.cp_af_e]\n    pitch = p.cp_pitch\n    L =\
    \ pitch * len(afs)\n\n    plate = cq.Workplane(\"XY\", origin=(L / 2.0, 0, 0)).rect(L,\
    \ p.cp_w).extrude(p.cp_h)\n\n    z2 = p.cp_depth - p.cp_nut_h - p.cp_nut_gap\n\
    \    z1 = z2 - p.cp_taper_h\n\n    for i, af in enumerate(afs):\n        cx =\
    \ pitch * i + pitch / 2.0\n        lead_af = af + p.cp_lead_clear\n        cut\
    \ = cq.Workplane(\"XY\", origin=(cx, 0, -1)).polyline(hexpts(lead_af)).close().extrude(z1\
    \ + 1)\n        cut = cut.union(\n            cq.Workplane(\"XY\", origin=(cx,\
    \ 0, z1)).polyline(hexpts(lead_af)).close()\n            .workplane(offset=p.cp_taper_h).polyline(hexpts(af)).close().loft())\n\
    \        cut = cut.union(\n            cq.Workplane(\"XY\", origin=(cx, 0, z2)).polyline(hexpts(af)).close()\n\
    \            .extrude(p.cp_depth - z2 + 0.01))\n        plate = plate.cut(cut)\n\
    \        plate = plate.cut(\n            cq.Workplane(\"XY\", origin=(cx, 0, p.cp_depth)).circle(p.cp_bore\
    \ / 2.0)\n            .extrude(p.cp_h - p.cp_depth + 1))\n    return plate\n"
  print_orientation: Flat base on the bed (z = 0), pocket openings facing down, exactly
    as the knob prints. Ceiling with the 5.5 mm bores at the top.
  use_orientation: Lying flat, pocket openings up, to press the nut into each pocket.
hardware:
- id: h_nut
  ref: ISO 4032 M5
  qty: 1
- id: h_bolt
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: j_bolt
  fastener: h_bolt
  axis_origin:
  - 0.0
  - 0.0
  - -6.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: hex_grip_band (7.85 mm across flats, z = 8.0 to 13.0)
    role: nut_pocket
  - part: knob
    feature: shank_bore (5.5 mm, from the pocket ceiling out the top)
    role: clearance
  nut: h_nut
  external: null
criteria:
- id: c_nut_grip
  part: knob
  feature: hex_grip_band (z = 8.0 to 13.0, 7.85 mm across flats)
  relation: engages
  hardware: h_nut
  clearance_mm: null
  params:
  - pocket_af
  - nut_af
  - nut_h
  - nut_gap
  check:
    method: coupon
    ref: fit_coupon
    description: Press the nut in by hand; it must seat against the ceiling and stay
      in when the knob is turned upside down and shaken. Coupon pocket C is the same
      7.85 mm fit as the knob.
- id: c_nut_blocked
  part: knob
  feature: pocket_ceiling with 5.5 mm bore (z = 13.0 to 17.0)
  relation: faces
  hardware: h_nut
  clearance_mm: null
  params:
  - bore_d
  - nut_af
  - ceiling_t
  check:
    method: none
    ref: null
    description: The 5.5 mm bore is smaller than the nut's 8.0 mm across-flats, so
      the nut cannot pass the ceiling and is fully enclosed by the knob.
- id: c_shank_clear
  part: knob
  feature: shank_bore (5.5 mm, ceiling to the top face)
  relation: clears
  hardware: h_bolt
  clearance_mm: 0.5
  params:
  - bore_d
  - bolt_shank_d
  check:
    method: none
    ref: null
    description: The M5 shank threads through the nut and leaves through the top of
      the knob.
- id: c_lead_in
  part: knob
  feature: pocket lead-in (9.85 mm across flats, z = 0 to 7.0, then 45 deg taper)
  relation: clears
  hardware: h_nut
  clearance_mm: null
  params:
  - lead_clear
  - pocket_af
  - nut_ac
  check:
    method: none
    ref: null
    description: The nut's 9.24 mm across-corners drops freely into the lead-in before
      it starts to press into the grip band.
- id: c_ceiling_bridge
  part: knob
  feature: pocket ceiling over the hex opening
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - pocket_af
  - bore_d
  check:
    method: none
    ref: null
    description: The unsupported span over the pocket is under 2 mm, so the ceiling
      bridges cleanly with no supports.
manual:
- n: '1'
  text: 'Optional but recommended: print the coupon part fit_coupon first (same material,
    same orientation as the knob). Press your M5 nut into each pocket. Left to right
    the pockets are 8.05, 7.95, 7.85, 7.75 and 7.65 mm across flats. For each, note
    whether it pushes in with hand pressure and whether it stays put when you turn
    the block upside down and shake it. The knob is drawn at 7.85 mm (pocket C).'
  parts:
  - fit_coupon
  hardware:
  - h_nut
  tool: none
- n: '2'
  text: 'Print the knob part. PLA, 0.4 mm nozzle, 0.2 mm layers, no supports. It prints
    as modelled: the open hex pocket is on the bed, the flat face with the small hole
    is the top.'
  parts:
  - knob
  hardware: []
  tool: none
- n: '3'
  text: Press the M5 hex nut into the open end of the knob. Line the nut's flats up
    with the hex pocket (it will only drop in one way round) and push it squarely
    up the lead-in until it presses into the narrow band at the top. Keep pushing
    until it stops hard against the ceiling. It should need a firm hand push, not
    a hammer; if it is stubborn, support the knob on the bench and use a bench vise
    or light taps with a mallet on the nut.
  parts:
  - knob
  hardware:
  - h_nut
  tool: bench vise (only if the nut is stiff)
- n: '4'
  text: 'Check the nut: turn the knob upside down and shake it - the nut must stay
    in. Then push on the nut from below with a small screwdriver - it must not come
    out through the top. If it is loose, reprint the knob (or the coupon) and pick
    the next smaller pocket size; if it is impossibly tight, go the other way.'
  parts:
  - knob
  hardware:
  - h_nut
  tool: small screwdriver
- n: '5'
  text: 'Fit the bolt: pass your M5 bolt through the parts you are clamping, then
    turn the knob onto the bolt and tighten by hand. The bolt''s tip comes out of
    the top of the knob.'
  parts:
  - knob
  hardware:
  - h_bolt
  tool: none
- n: '6'
  text: 'Bolt requirements, since they could not be measured: the bolt must stand
    at least 20 mm proud of the surface the knob sits on, and it must have thread
    in its last 13 mm - that means a fully threaded bolt, or one whose plain shank
    is shorter than about 8 mm (a standard M5x30 has an 8 mm plain shank, which is
    why the nut sits high in the pocket).'
  parts:
  - knob
  hardware:
  - h_bolt
  tool: none
