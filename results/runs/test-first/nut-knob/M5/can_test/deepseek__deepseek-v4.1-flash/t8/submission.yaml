    role: clearance
  nut: null
  external: null
criteria:
- id: nut_fully_inside
  part: knob
  feature: hex nut pocket
  relation: contains
  hardware: nut_m5
  clearance_mm: 0.2
  params:
  - pocket_depth
  - nut_h
  - pocket_af
  - nut_af
  check:
    method: coupon
    ref: fit_coupon
    description: 'pocket is 4.9 deep vs 4.7 nut height: nut ends up 0.2 mm inside
      the underside face'
- id: nut_gripped
  part: knob
  feature: six crush ribs on the pocket flats
  relation: engages
  hardware: nut_m5
  clearance_mm: -0.12
  params:
  - rib_proud
  - rib_w
  - pocket_af
  - nut_af
  check:
    method: coupon
    ref: fit_coupon
    description: 'across rib tips the pocket is 7.4 AF vs nut 7.64-8.0: 0.12-0.30
      mm crush per side, so the nut presses in by hand and stays in upside down'
- id: nut_cannot_pass_shoulder
  part: knob
  feature: shoulder above the nut, 5.5 mm hole
  relation: faces
  hardware: nut_m5
  clearance_mm: -2.14
  params:
  - clear_hole_d
  - nut_af
  - pocket_depth
  - knob_h
  check:
    method: none
    ref: null
    description: 5.5 mm hole is smaller than the nut's smallest across-flats (7.64),
      so the nut cannot be pushed out through the far side; shoulder is 5.1 mm thick
      PLA
- id: bolt_passes_through
  part: knob
  feature: 5.5 mm bolt clearance hole
  relation: clears
  hardware: bolt_m5
  clearance_mm: 0.25
  params:
  - clear_hole_d
  - bolt_shank_d
  check:
    method: none
    ref: null
    description: 0.25 mm radial clearance on an M5 shank, so the bolt goes through
      the nut and out the top face
manual:
- n: '1'
  text: 'Print both parts in PLA at 0.2 mm layers with no supports. They are modelled
    as printed: the flat top face of the knob (and the back of the coupon block) goes
    on the bed, the hex nut pocket opens straight up, and the flutes are vertical
    walls. Nothing overhangs.'
  parts:
  - knob
  - fit_coupon
  hardware: []
  tool: 3D printer
- n: '2'
  text: Let them cool and lift them off the bed. On the knob, the hex pocket is in
    the flat underside face, and you can see six narrow ribs standing proud of the
    six pocket flats.
  parts:
  - knob
  - fit_coupon
  hardware: []
  tool: null
- n: '3'
  text: 'Test the fit on the coupon first: set your M5 hex nut flat-face-down on the
    pocket mouth, hex aligned with the pocket, and press it in squarely with your
    thumbs. It should go in with firm hand pressure (a gentle squeeze in a vise is
    the fallback if it is stiff) and end up slightly below the surface, with the ribs
    shaved where the nut''s flats passed them.'
  parts:
  - fit_coupon
  hardware:
  - nut_m5
  tool: null
- n: '4'
  text: 'Turn the coupon upside down and shake it: the nut must stay in. If it drops
    out, or if it will not press in at all, stop here and tell me — pocket_af and
    rib_proud are single numbers I can change before you print the knob.'
  parts:
  - fit_coupon
  hardware:
  - nut_m5
  tool: null
- n: '5'
  text: 'Press the ISO 4032 M5 nut into the knob''s hex pocket the same way, hex aligned
    and square to the pocket, until it bottoms on the pocket floor. Its outer face
    should sit about 0.2 mm proud of nothing — i.e. just inside the underside face,
    so the nut is fully inside the knob. It will not push through the other side:
    the only opening above it is the 5.5 mm bolt hole, which is smaller than the nut.'
  parts:
  - knob
  hardware:
  - nut_m5
  tool: null
- n: '6'
  text: 'Check the retention: turn the knob upside down and shake. The nut stays in
    — the six crushed ribs grip it, no glue needed. It also cannot be pushed out through
    the top face by hand.'
  parts:
  - knob
  hardware:
  - nut_m5
  tool: null
- n: '7'
  text: Thread your M5 bolt into the nut from the pocket side (or hold the bolt and
    screw the knob onto it). Choose a bolt long enough that its tip passes through
    the nut and out through the 5.5 mm hole in the top face, so a long bolt cannot
    bottom out inside the knob.
  parts:
  - knob
  hardware:
  - nut_m5
  - bolt_m5
  tool: null
- n: '8'
  text: 'Tighten by hand: grip the fluted rim and turn the knob. The nut''s flats
    drive the knob and the shoulder behind the nut takes the load — no wrench needed.
    To loosen, just turn it back.'
  parts:
  - knob
  hardware:
  - nut_m5
  - bolt_m5
  tool: null
