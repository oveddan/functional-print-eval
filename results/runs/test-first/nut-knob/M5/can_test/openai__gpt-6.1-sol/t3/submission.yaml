    ref: null
    description: The through-hole is smaller than the nut across flats, preventing
      the nut from passing through the floor.
- id: bolt_passage
  part: knob
  feature: Coaxial circular through-hole
  relation: clears
  hardware: null
  clearance_mm: 0.3
  params:
  - bolt_d
  - hole_clearance
  check:
    method: measure
    ref: null
    description: Check that your M5 bolt passes through the circular hole and threads
      into the seated nut by hand without binding.
manual:
- n: '1'
  text: Print knob with the broad flat bottom on the bed and hex opening upward. Use
    the same 0.4 mm nozzle, 0.2 mm layers, filament, and XY/hole compensation as fit_C.
    Use 4 walls, 5 top/bottom layers, and 30% infill. Supports off.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Remove any brim or loose strands without sanding or enlarging the hex pocket.
    Align the M5 nut with the hex opening and press it straight in by hand until it
    contacts the floor. Its top should sit about 0.5 mm below the opening. Do not
    hammer it in.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Turn the knob upside down over a tray and shake gently. Confirm the nut stays
    in. If this final print is loose or cannot be seated by hand, do not glue or force
    it; check that print settings match the successful fit_C coupon.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Feed your M5 bolt through the small circular hole and thread it through the
    nut; the bolt can emerge through the open hex side. For clamping, place the flat
    floor face against the work and turn the knob by hand. Use an appropriate bolt
    length for your assembly. Do not apply tool-assisted torque or use this PLA knob
    for safety-critical loads or hot environments.
  parts:
  - knob
  hardware:
  - nut
  tool: null
