parts:
- id: hand_knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    import math\n    h = p.floor + p.nut_h + p.top_space\n\
    \    a = (p.nut_af + p.pocket_af_clearance)/2\n    body = cq.Workplane('XY').circle(p.knob_d/2).extrude(h)\n\
    \    for i in range(int(p.grip_count)):\n        t = 2*math.pi*i/p.grip_count\n\
    \        r = p.knob_d/2 + p.grip_cut_offset\n        cut = cq.Workplane('XY').center(r*math.cos(t),r*math.sin(t)).circle(p.grip_cut_radius).extrude(h)\n\
    \        body = body.cut(cut)\n    # Hex has flats normal to X, allowing tabs\
    \ on alternate flats.\n    hexcut = cq.Workplane('XY').workplane(offset=p.floor).polygon(6,2*a/math.cos(math.pi/6)).extrude(h).rotate((0,0,0),(0,0,1),30)\n\
    \    body = body.cut(hexcut)\n    bore = cq.Workplane('XY').circle((p.bolt_d+p.bore_clearance)/2).extrude(h)\n\
    \    body = body.cut(bore)\n    z0 = p.floor+p.finger_root\n    w = p.finger_width\n\
    \    t = p.finger_t\n    g = p.finger_gap\n    for angle in (0,120,240):\n   \
    \     # Open-topped U slot frees a vertical cantilever, rooted at the floor.\n\
    \        back = cq.Workplane('XY').box(g,w+2*g,h-z0,centered=(False,True,False)).translate((a+t,0,z0))\n\
    \        side1 = cq.Workplane('XY').box(t+g,g,h-z0,centered=(False,False,False)).translate((a,w/2,z0))\n\
    \        side2 = cq.Workplane('XY').box(t+g,g,h-z0,centered=(False,False,False)).translate((a,-w/2-g,z0))\n\
    \        slots = back.union(side1).union(side2).rotate((0,0,0),(0,0,1),angle)\n\
    \        body = body.cut(slots)\n        # Sloped underside prints without support;\
    \ sloped entry spreads tabs.\n        zlip = p.floor+p.nut_h+p.lip_above_nut\n\
    \        q = p.lip_projection\n        profile = [(a,zlip-q),(a-q,zlip),(a-q,zlip+p.lip_land),(a,h),(a+t,h),(a+t,zlip-q)]\n\
    \        lip = cq.Workplane('XZ').polyline(profile).close().extrude(w/2,both=True).rotate((0,0,0),(0,0,1),angle)\n\
    \        body = body.union(lip)\n    return body\n"
  print_orientation: Broad closed shoulder face flat on the bed at z=0, nut pocket
    and spring slots facing up. No supports.
  use_orientation: Press nut into the upper hex pocket. Bolt can enter through the
    bottom bore or through the nut face; leave clearance for any protruding bolt.
