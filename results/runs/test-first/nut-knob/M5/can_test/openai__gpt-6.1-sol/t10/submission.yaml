manual:
- n: '1'
  text: Print hand_knob in black PLA, broad closed face on the bed and pocket upward.
    Use a 0.4 mm nozzle, 0.2 mm layers, four wall loops, at least four top/bottom
    layers and 30% infill. Disable supports. Keep the spring slots clear; use the
    same PLA throughout.
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '2'
  text: Remove any strings from the pocket and spring slots. Check that all three
    tabs are separate from the surrounding body above their roots. Do not pry them
    outward.
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '3'
  text: Align the nut's flats with the hex pocket and press it straight in using thumb
    pressure until it sits flat on the shoulder and the retaining tabs recover above
    it. The nut must be fully below the top surface. Do not hammer it or pull it into
    place with a bolt; stop if hand pressure is insufficient or any tab cracks.
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Invert over a tray and gently shake. The nut must stay in place. If it falls
    out, remains proud, or any tab breaks, do not use this print as a captive-nut
    knob; the fit needs revision.
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: 'Thread your intended M5 bolt through the nut and verify that its end passes
    freely through the opposite bore. This is a female-threaded hand knob: it travels
    along the bolt, rather than gripping the bolt head. Use only gentle hand torque.
    Avoid hot environments and stop if the nut starts rotating in the plastic.'
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
