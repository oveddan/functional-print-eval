task: nut-knob/M5
note: 'One-piece, approximately 30 mm hand knob with a captive ISO 4032 M5 nut. Three
  integral spring tabs retain the nut; the hex pocket transfers torque and the solid
  bottom shoulder prevents push-through. Fit is unverified: the four interference-fit
  coupons produced no usable fit observations, and the user could not measure the
  nut. The compliant retention design below avoids relying on a full-perimeter interference
  fit. Intended for light hand tightening, not high torque or safety-critical use.'
questions:
- text: Could the user confirm a hand-press, inverted-retention fit in any initial
    coupon?
  answer: No usable fit result was available.
- text: Could the actual nut be measured?
  answer: User could not measure it and requested best judgment.
