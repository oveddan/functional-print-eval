manual:
- n: '1'
  text: Print knob with the flat underside on the bed and the hex pocket upward, using
    the same PLA and fit-affecting slicer settings as fit_B. Use a 0.4 mm nozzle,
    0.2 mm layers, at least 5 walls, 5 top/bottom layers, and about 40% infill. Supports
    off.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: 'Remove any brim or loose strands. Do not sand or enlarge the hex walls: their
    tested fit provides retention.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Align the ISO 4032 M5 nut with the hex pocket. With the knob's flat underside
    on a firm surface, press the nut squarely into the pocket by hand until it rests
    on the shoulder. Its top should be slightly below the knob top. Do not hammer
    it; if it will not seat by hand, stop and check for print debris or changed print
    settings.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Invert the knob over a tray and gently shake it. Confirm the nut remains seated
    and cannot pass through the small underside hole. Do not use if the nut is loose
    or the shoulder is cracked.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Start your application's M5 bolt in the nut by hand, without cross-threading.
    Confirm the bolt passes freely through the underside hole. In use, keep the flat
    underside toward the clamped surface and the open nut pocket outward. Turn the
    knob to tighten.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '6'
  text: Use hand force only, not pliers or a wrench. This PLA knob is intended for
    light-duty indoor adjustment, not safety-critical fastening, hot locations, or
    sustained high clamping loads. Recheck nut retention periodically.
  parts:
  - knob
  hardware:
  - nut
  tool: null
