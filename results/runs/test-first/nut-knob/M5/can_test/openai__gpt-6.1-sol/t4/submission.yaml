task: nut-knob/M5
note: One-piece, approximately 30 mm hand knob with a captive ISO 4032 M5 nut. Uses
  the tested 8.00 mm hex pocket. The nut is recessed 0.4 mm below the top; a 2.4 mm
  printed shoulder prevents it passing through the bottom. The 5.6 mm axial hole lets
  an M5 bolt pass through. No glue, supports, or additional retaining parts.
questions:
- text: Which test pockets allowed hand insertion and retained the nut upside down?
  answer: '8.00 mm: push to insert, tight; retained when inverted and shaken. 8.10
    mm: easier, snug; also retained when inverted and shaken. 7.90 mm: result unavailable.
    Selected 8.00 mm.'
params:
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 nut height
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal M5 thread diameter; compatible bolt length depends on user's application
      and is not specified.
  pocket_af:
    value: 8
    unit: mm
    kind: design
    source: design
    note: Selected from successful fit_B hand-insertion and inverted-shake test.
  floor:
    value: 2.4
    unit: mm
    kind: design
    source: design
    note: Solid shoulder below nut except for bolt clearance hole.
  recess:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: Nut top below knob top when fully seated.
  hole_clearance:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Diametral allowance; yields 5.6 mm through-hole.
  lead_in:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: 45-degree hex-pocket entry chamfer, identical to tested coupon.
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_count:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
  scallop_r:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_center_r:
    value: 16.5
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "import math\n\ndef build(p):\n    h=p.floor+p.nut_h+p.recess\n    s=cq.Workplane('XY').circle(p.knob_d/2).extrude(h)\n\
    \    for i in range(int(p.scallop_count)):\n        a=2*math.pi*i/p.scallop_count\n\
    \        x=p.scallop_center_r*math.cos(a)\n        y=p.scallop_center_r*math.sin(a)\n\
    \        cutter=cq.Workplane('XY').center(x,y).circle(p.scallop_r).extrude(h)\n\
    \        s=s.cut(cutter)\n    bore=cq.Workplane('XY').circle((p.bolt_d+p.hole_clearance)/2).extrude(h)\n\
    \    pocket=cq.Workplane('XY').workplane(offset=p.floor).polygon(6,p.pocket_af/math.cos(math.pi/6)).extrude(h-p.floor+1)\n\
    \    mouth=(cq.Workplane('XY').workplane(offset=h-p.lead_in)\n           .polygon(6,p.pocket_af/math.cos(math.pi/6))\n\
    \           .workplane(offset=p.lead_in)\n           .polygon(6,(p.pocket_af+2*p.lead_in)/math.cos(math.pi/6)).loft())\n\
    \    return s.cut(bore).cut(pocket).cut(mouth)"
  print_orientation: Flat underside at z=0 on bed, open hex pocket facing up. No supports.
  use_orientation: Hex-pocket opening faces away from the surface being tightened
    against; flat underside faces that surface. M5 bolt passes along the central Z
    axis.
