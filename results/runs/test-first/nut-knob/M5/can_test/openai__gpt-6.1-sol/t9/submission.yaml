manual:
- n: '1'
  text: Print hand_knob with its broad flat bottom on the bed and socket upward, using
    the settings in its print orientation. Let it cool fully before removing it.
  parts:
  - hand_knob
  hardware: []
  tool: 3D printer
- n: '2'
  text: Remove any brim or strings. Inspect the six fingers and make sure all slots
    and the annular clearance are free. Do not trim off the inward-facing retaining
    lips.
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '3'
  text: Align the M5 nut's flats with the socket. Press it straight down with your
    fingers until it passes the retaining lips and sits flat on the bottom shoulder.
    Do not hammer or use pliers; if it will not seat by hand, stop. The nut should
    now be completely below the top surface.
  parts:
  - hand_knob
  hardware:
  - m5_nut
  tool: null
- n: '4'
  text: Invert and gently shake the knob over a table. The nut must stay captured.
    Inspect for cracked or whitened fingers; reject the print if retention fails.
    Fit remains unverified until this check passes.
  parts:
  - hand_knob
  hardware:
  - m5_nut
  tool: null
- n: '5'
  text: Feed your M5 bolt through the small hole in the flat bottom, then turn the
    knob gently to engage the nut. Confirm the bolt emerges through the open top and
    the nut cannot rotate independently. This is a captive-nut knob, used like a large
    hand-operated nut on a bolt or stud, not a cap fitted over a bolt head.
  parts:
  - hand_knob
  hardware:
  - m5_nut
  tool: null
- n: '6'
  text: In use, place the flat bottom toward the object being clamped so tightening
    pulls the nut against the solid bottom shoulder. Tighten lightly by hand only.
    Keep fingers clear of a protruding bolt tip. Avoid heat, repeated nut removal
    and high torque; replace the knob if the tabs crack or the nut becomes loose.
  parts:
  - hand_knob
  hardware:
  - m5_nut
  tool: null
