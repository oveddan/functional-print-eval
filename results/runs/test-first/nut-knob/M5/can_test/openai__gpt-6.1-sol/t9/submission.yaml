parts:
- id: hand_knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    import math\n    z=p.floor_t+p.nut_h+p.capture_gap\n \
    \   h=z+p.ramp_h+p.lead_h\n    c=math.cos(math.pi/6)\n    base=cq.Workplane('XY').circle(p.knob_d/2).extrude(p.floor_t)\n\
    \    grip=cq.Workplane('XY').workplane(offset=p.floor_t).circle(p.knob_d/2).circle(p.moat_r).extrude(h-p.floor_t)\n\
    \    fingers=cq.Workplane('XY').workplane(offset=p.floor_t).polygon(6,p.finger_outer_af/c).extrude(h-p.floor_t)\n\
    \    cavity=cq.Workplane('XY').workplane(offset=p.floor_t).polygon(6,p.pocket_af/c).extrude(z-p.floor_t)\n\
    \    ramp=cq.Workplane('XY').workplane(offset=z).polygon(6,p.pocket_af/c).workplane(offset=p.ramp_h).polygon(6,p.throat_af/c).loft()\n\
    \    lead=cq.Workplane('XY').workplane(offset=z+p.ramp_h).polygon(6,p.throat_af/c).workplane(offset=p.lead_h).polygon(6,p.mouth_af/c).loft()\n\
    \    fingers=fingers.cut(cavity).cut(ramp).cut(lead)\n    for a in range(0,360,60):\n\
    \        slot=cq.Workplane('XY').box(p.knob_d/2,p.slot_w,h-p.floor_t+1,centered=(False,True,False)).translate((0,0,p.floor_t)).rotate((0,0,0),(0,0,1),a)\n\
    \        fingers=fingers.cut(slot)\n    result=base.union(grip).union(fingers)\n\
    \    for i in range(int(p.scallop_count)):\n        a=2*math.pi*i/p.scallop_count\n\
    \        x=p.scallop_center_r*math.cos(a)\n        y=p.scallop_center_r*math.sin(a)\n\
    \        cutter=cq.Workplane('XY').center(x,y).circle(p.scallop_r).extrude(h+1)\n\
    \        result=result.cut(cutter)\n    return result.cut(cq.Workplane('XY').circle(p.bore_d/2).extrude(h+1))"
  print_orientation: Broad flat bottom at z=0 on the bed; hex socket and flexible
    fingers open upward. No supports. Use 0.2 mm layers, three wall loops, five bottom
    layers and 30% infill. Do not fill the annular clearance or slots with supports.
  use_orientation: Nut enters from the open top; bolt enters through the small hole
    in the opposite flat face. Nut rests on the internal floor beneath the retaining
    lips. Outer scalloped ring is the hand grip.
