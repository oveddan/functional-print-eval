task: nut-knob/M5
note: 'One-piece, approximately 30 mm hand knob with six flexible nut-retaining tabs
  and a solid bottom shoulder. The M5 nut is recessed entirely inside the knob; the
  central hole lets the bolt pass through. Fit is NOT verified: both test prints were
  made, but no usable fit feedback was available. Check hand insertion and retention
  before using; do not force the nut or use a hammer. Intended for light hand tightening,
  not structural or safety-critical loads.'
