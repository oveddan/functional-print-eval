manual:
- n: '1'
  text: 'Print hand_knob with its flat underside on the bed and pocket upward: 0.2
    mm layers, 4 walls, 5 top/bottom layers and 30% infill. Use no supports. Let it
    cool before removing.'
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '2'
  text: Remove loose strings from the hex pocket and bore. Align the nut flats with
    the pocket and press it straight down with your thumb on a firm surface, until
    it rests on the floor. The tapered ribs are intended to yield slightly. Do not
    hammer it or use the bolt to force it in; stop if it will not seat by hand.
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: 'Confirm that the nut is entirely below the rim. Turn the knob upside down
    over a tray and gently shake it. If the nut falls out, or if the knob cracks,
    the fit has failed: do not use glue or assume it is secure. A revised rib fit
    and reprint are needed.'
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Thread your intended M5 bolt into the nut from the pocket side. Check that
    it emerges freely through the opposite face. Turn the scalloped knob by hand;
    the hex walls transmit torque and the floor stops the nut passing through. This
    is a captive-nut knob, not a cap that captures the bolt head.
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Use light hand torque only. Recheck retention after initial use; repeated
    nut removal can wear the ribs. Keep the PLA knob away from heat.
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
