task: nut-knob/M5
note: One-piece, approximately 30 mm hand knob with a recessed M5 hex nut, a solid
  retaining floor and a through-bore. Six small crush ribs provide nut retention rather
  than making the entire hex pocket undersized. The test results were unavailable
  and the actual nut could not be measured, so hand-insertion force and upside-down
  retention remain unverified; check these before use. Intended for light hand tightening,
  not high torque or hot environments.
questions:
- text: Which test pocket gave a hand-press fit that retained the nut upside down?
  answer: Results unavailable for all three test pockets.
- text: Can the actual nut's across-flats dimension and thickness be measured?
  answer: Cannot measure; use best judgment.
