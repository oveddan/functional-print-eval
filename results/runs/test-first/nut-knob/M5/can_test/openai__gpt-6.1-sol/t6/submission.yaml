parts:
- id: hand_knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    import math\n    def hexpts(af):\n        r = af / math.sqrt(3)\n\
    \        return [(r*math.cos(math.radians(30+60*i)), r*math.sin(math.radians(30+60*i)))\
    \ for i in range(6)]\n    floor = p.knob_h-p.pocket_depth\n    body = cq.Workplane('XY').circle(p.knob_d/2).extrude(p.knob_h)\n\
    \    for i in range(int(p.scallop_count)):\n        a = 2*math.pi*i/p.scallop_count\n\
    \        x = p.scallop_center_radius*math.cos(a)\n        y = p.scallop_center_radius*math.sin(a)\n\
    \        cut = cq.Workplane('XY').center(x,y).circle(p.scallop_radius).extrude(p.knob_h)\n\
    \        body = body.cut(cut)\n    pocket = cq.Workplane('XY').workplane(offset=floor).polyline(hexpts(p.pocket_af)).close().extrude(p.pocket_depth)\n\
    \    body = body.cut(pocket)\n    # Small triangular ribs merge into each flat\
    \ wall; their tips can compress.\n    tri = [(p.pocket_af/2+p.rib_root_overlap,-p.rib_width/2),\
    \ (p.pocket_af/2+p.rib_root_overlap,p.rib_width/2), (p.rib_tip_af/2,0)]\n    for\
    \ i in range(6):\n        rib = cq.Workplane('XY').workplane(offset=floor).polyline(tri).close().extrude(p.pocket_depth)\n\
    \        body = body.union(rib.rotate((0,0,0),(0,0,1),60*i))\n    # Flared mouth\
    \ also tapers the retaining ribs for hand insertion.\n    entry = cq.Workplane('XY').workplane(offset=p.knob_h-p.entry_h).polyline(hexpts(p.rib_tip_af)).close().workplane(offset=p.entry_h).polyline(hexpts(p.pocket_af+p.entry_extra_af)).close().loft()\n\
    \    body = body.cut(entry)\n    bore = cq.Workplane('XY').circle(p.bore_d/2).extrude(p.knob_h)\n\
    \    return body.cut(bore)\n"
  print_orientation: Flat circular underside on bed, z=0; hex pocket faces upward.
    No supports or bridging required.
  use_orientation: Nut enters the upper hex opening. The bolt enters the nut from
    that side and exits through the smaller hole in the opposite face. The solid floor
    prevents the nut being pushed through the knob.
