parts:
- id: hand_knob
  role: final
  material: Black high-speed PLA
  code: "import math\n\ndef build(p):\n    h = p.floor_t + p.pocket_depth\n    body\
    \ = cq.Workplane('XY').circle(p.body_radius).extrude(h)\n    for j in range(int(p.lobe_count)):\n\
    \        a = 2*math.pi*j/p.lobe_count\n        lobe = cq.Workplane('XY').center(p.lobe_offset*math.cos(a),\
    \ p.lobe_offset*math.sin(a)).circle(p.lobe_radius).extrude(h)\n        body =\
    \ body.union(lobe)\n    def hexpts(af):\n        r = af/math.sqrt(3)\n       \
    \ return [(r*math.cos(math.radians(30+60*j)), r*math.sin(math.radians(30+60*j)))\
    \ for j in range(6)]\n    pocket = cq.Workplane('XY').workplane(offset=p.floor_t).polyline(hexpts(p.pocket_af)).close().extrude(p.pocket_depth)\n\
    \    body = body.cut(pocket)\n    for j in range(6):\n        a = math.radians(60*j)\n\
    \        r = p.pocket_af/2 + p.rib_radius - p.rib_intrusion\n        rib = cq.Workplane('XY').workplane(offset=p.floor_t).center(r*math.cos(a),r*math.sin(a)).circle(p.rib_radius).extrude(p.pocket_depth)\n\
    \        body = body.union(rib)\n    tip_af = p.pocket_af - 2*p.rib_intrusion\n\
    \    entrance = (cq.Workplane('XY').workplane(offset=h-p.entry_depth)\n      \
    \          .polyline(hexpts(tip_af)).close()\n                .workplane(offset=p.entry_depth).polyline(hexpts(p.entry_af)).close().loft())\n\
    \    body = body.cut(entrance)\n    bore = cq.Workplane('XY').circle(p.bore_d/2).extrude(h)\n\
    \    return body.cut(bore).clean()"
  print_orientation: Broad flat bottom at z=0 on the bed; hex pocket opens upward.
    No supports.
  use_orientation: Nut enters the top hex pocket and rests on the bottom shoulder.
    Bolt passes through the nut and the central bottom hole; either face may face
    the workpiece as needed.
