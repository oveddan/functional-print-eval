manual:
- n: '1'
  text: Slice hand_knob with the pocket upward, 0.2 mm layers, four walls and five
    top/bottom layers, 30% infill. Use no supports. Keep the part in its modeled orientation.
  parts:
  - hand_knob
  hardware: []
  tool: Bambu Lab X1C, 0.4 mm nozzle
- n: '2'
  text: Let the print cool. Remove any loose strings from the pocket and through-hole.
    Do not enlarge the ribs before checking fit.
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '3'
  text: Align the nut flats with the hex pocket. Press the nut straight down with
    your thumb until it seats on the shoulder. It should sit completely below the
    upper face. Do not hammer, heat, or force it with pliers; stop if it needs more
    than comfortable hand pressure or the PLA whitens or cracks.
  parts:
  - hand_knob
  hardware:
  - captive_nut
  tool: null
- n: '4'
  text: 'Over a tray, invert the knob and gently shake it. The nut must stay in. If
    loose, do not use this print: the unverified rib fit needs adjustment and a new
    test. If too tight, likewise revise the fit rather than forcing insertion. No
    glue is required for a successful fit.'
  parts:
  - hand_knob
  hardware:
  - captive_nut
  tool: null
- n: '5'
  text: 'Thread your intended M5 bolt through the nut and out the opposite hole. Confirm
    free thread travel and no nut rotation inside the knob. This makes a captive-nut
    knob: it screws along the bolt like a hand nut; it does not capture the bolt head.'
  parts:
  - hand_knob
  hardware:
  - captive_nut
  tool: null
- n: '6'
  text: Tighten by hand only. Do not use a wrench on the printed lobes. Keep away
    from heat and inspect occasionally for cracks, looseness or creep; this PLA knob
    is not for safety-critical clamping.
  parts:
  - hand_knob
  hardware: []
  tool: null
