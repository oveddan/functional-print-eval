task: nut-knob/M5
note: 'One-piece, approximately 30 mm six-lobed hand knob. An enclosed bottom shoulder
  retains the nut axially; six small interference ribs grip its flats, and a flared
  entrance aids hand insertion. Fit remains unverified: no usable coupon-fit result
  or actual nut measurement was available. The selected rib fit is a best-judgment
  starting point, not a guaranteed hand press fit. Do not use a loose-fitting nut
  or force a tight one with tools.'
questions:
- text: Actual nut width across flats?
  answer: Unable to measure; use best judgment.
- text: Which coupon retained the nut while allowing hand insertion?
  answer: No usable fit result was available for any of the three coupons.
