    ref: null
    description: Confirm nut is seated on the pocket floor and its top is entirely
      below the knob opening; nominal recess is 1.3 mm.
- id: positive_stop
  part: knob
  feature: Solid shoulder surrounding the 5.6 mm through-hole
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - floor_thickness
  - bolt_diameter
  - bolt_clearance
  - nut_af
  check:
    method: none
    ref: null
    description: The through-hole is smaller than the nut across flats, so the nut
      cannot pass through the underside.
- id: bolt_passage
  part: knob
  feature: Coaxial through-hole and nut pocket
  relation: clears
  hardware: null
  clearance_mm: 0.3
