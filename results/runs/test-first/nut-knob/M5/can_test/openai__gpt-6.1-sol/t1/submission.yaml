task: nut-knob/M5
note: 'One-piece, approximately 30 mm scalloped hand knob with a captive ISO 4032
  M5 nut. Uses the tested 8.10 mm hex pocket: hand insertion was snug and the nut
  stayed in during inversion and shaking. The 2.4 mm solid shoulder prevents the nut
  passing through the bolt-exit side. Fit is calibrated to your tested nut, filament
  and printer settings; long-term retention is not guaranteed against PLA creep.'
questions:
- text: Which pocket fits by hand and retains the nut upside down?
  answer: 8.00 mm required a tight push and retained the nut during shaking. 8.10
    mm inserted more easily, snug, and also retained the nut during shaking. Selected
    8.10 mm.
params:
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 nominal across flats.
  nut_height:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_diameter:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: M5 nominal major diameter.
  bolt_clearance:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Diametral allowance; through-hole diameter is 5.6 mm.
  pocket_af:
    value: 8.1
    unit: mm
    kind: design
    source: design
    note: 'Selected from fit_D: user confirmed snug hand insertion and retention during
