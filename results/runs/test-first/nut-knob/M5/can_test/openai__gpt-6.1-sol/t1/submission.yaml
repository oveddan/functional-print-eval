parts:
- id: knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "import math\ndef build(p):\n    h = p.floor_thickness + p.pocket_depth\n\
    \    body = cq.Workplane('XY').circle(p.knob_diameter/2).extrude(h)\n    for i\
    \ in range(int(p.scallop_count)):\n        a = 2*math.pi*i/p.scallop_count\n \
    \       x = p.scallop_center_radius*math.cos(a)\n        y = p.scallop_center_radius*math.sin(a)\n\
    \        cutter = cq.Workplane('XY').center(x,y).circle(p.scallop_radius).extrude(h)\n\
    \        body = body.cut(cutter)\n    hole = cq.Workplane('XY').circle((p.bolt_diameter+p.bolt_clearance)/2).extrude(h)\n\
    \    pocket = cq.Workplane('XY').workplane(offset=p.floor_thickness).polygon(6,p.pocket_af/math.cos(math.pi/6)).extrude(p.pocket_depth)\n\
    \    lead = cq.Workplane('XY').workplane(offset=h-p.lead_depth).polygon(6,p.pocket_af/math.cos(math.pi/6)).workplane(offset=p.lead_depth).polygon(6,(p.pocket_af+p.lead_af_extra)/math.cos(math.pi/6)).loft()\n\
    \    return body.cut(hole).cut(pocket).cut(lead)"
  print_orientation: Flat shoulder side at z=0 on bed; hex pocket opens upward. No
    supports.
  use_orientation: Shoulder/flat underside faces the workpiece; hex-pocket opening
    faces away from the workpiece. Bolt enters through the underside hole, threads
    through the nut, and can protrude above the pocket.
