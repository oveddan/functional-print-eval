    ref: null
    description: Check your M5 bolt passes through the printed hole freely and threads
      into the nut by hand.
manual:
- n: '1'
  text: 'Print knob with the flat underside on the bed and the hex pocket facing up.
    Use the same PLA and fit-related slicer settings used for fit_D: 0.4 mm nozzle,
    0.2 mm layers, no supports. Use 4 walls and 5 top/bottom layers, with 35% infill.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Let the print cool. Clear any loose strings from the pocket and through-hole
    without sanding the hex walls larger.
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Use the same nut tested in fit_D. Align its six flats with the pocket and
    press straight down by hand until it reaches the shoulder. The nut must sit fully
    below the opening. Do not hammer it; stop if it will not seat by hand.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Turn the knob pocket-down over a tray and shake it. The nut must remain in
    place. If it falls out or the knob cracks, do not use it as a captive-nut knob;
    the fit needs adjustment. Do not use glue.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Place the flat shoulder side toward the workpiece and thread the knob onto
    your M5 bolt. The bolt enters through the small hole, engages the nut and can
    emerge from the open pocket. Tighten by hand only. In this orientation the tightening
    load seats the nut against the solid shoulder rather than pulling it out of the
    pocket.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '6'
  text: Use for light-duty hand clamping, not safety-critical loads or hot environments.
    Check retention occasionally; PLA can relax over time. Avoid repeatedly removing
    and reinserting the nut.
  parts:
  - knob
  hardware:
  - nut
  tool: null
