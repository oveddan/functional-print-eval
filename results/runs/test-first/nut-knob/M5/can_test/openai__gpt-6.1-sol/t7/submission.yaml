      threads through the seated nut.
manual:
- n: '1'
  text: Print hand_knob in the stated orientation, at 0.2 mm layer height with a 0.4
    mm nozzle. Use 4 walls, 5 top and bottom layers, and 40% infill. Do not enable
    supports. Keep the nut-pocket dimensions and scale unchanged.
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '2'
  text: Remove any brim or loose strands. Align the M5 nut with the hex pocket, then
    press it in squarely by hand until it rests on the bottom shoulder. Its top should
    be about 0.3 mm below the knob face. Do not hammer it in; if it will not seat
    by hand, stop rather than cracking the knob.
  parts:
  - hand_knob
  hardware:
  - m5_nut
  tool: null
- n: '3'
  text: Turn the knob upside down and shake it over a tray. The nut must stay seated,
    as it did in your 8.00 mm coupon. If it falls out, do not rely on this print for
    captive retention.
  parts:
  - hand_knob
  hardware:
  - m5_nut
  tool: null
- n: '4'
  text: Thread the knob onto your M5 bolt by hand. The bolt passes through the nut
    and can protrude through the opposite round hole. Confirm free thread travel without
    cross-threading. Use for light hand tightening only; do not use pliers or a wrench
    on the knob. When clamping against a surface, place the closed, round-hole face
    toward that surface.
  parts:
  - hand_knob
  hardware:
  - m5_nut
  tool: null
