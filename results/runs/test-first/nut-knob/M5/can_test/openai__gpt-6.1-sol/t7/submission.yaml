task: nut-knob/M5
note: One-piece, 30 mm hand knob using the tested 8.00 mm across-flats pocket. Your
  coupon required a firm hand push and retained the nut when inverted and shaken.
  The pocket opens upward during printing; a solid bottom shoulder traps the nut while
  a central hole lets an M5 bolt pass through. Friction retention is based on your
  tested printer/material combination.
questions: []
