parts:
- id: hand_knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    import math\n    h = p.floor + p.pocket_depth\n    body\
    \ = cq.Workplane('XY').circle(p.knob_d/2).extrude(h)\n    for i in range(int(p.grip_count)):\n\
    \        a = 2*math.pi*i/p.grip_count\n        x = p.grip_cut_center_radius*math.cos(a)\n\
    \        y = p.grip_cut_center_radius*math.sin(a)\n        cutter = cq.Workplane('XY').center(x,y).circle(p.grip_cut_radius).extrude(h)\n\
    \        body = body.cut(cutter)\n    bore = cq.Workplane('XY').circle(p.bore_d/2).extrude(h)\n\
    \    body = body.cut(bore)\n    hex_d = p.nut_af/(math.sqrt(3)/2)\n    pocket\
    \ = cq.Workplane('XY').workplane(offset=p.floor).polygon(6,hex_d).extrude(p.pocket_depth)\n\
    \    body = body.cut(pocket)\n    lead = (cq.Workplane('XY').workplane(offset=h-p.lead_h)\n\
    \            .polygon(6,hex_d).workplane(offset=p.lead_h)\n            .polygon(6,(p.nut_af+p.lead_af_extra)/(math.sqrt(3)/2)).loft())\n\
    \    return body.cut(lead)"
  print_orientation: Flat face with the small round bolt hole on the bed at z=0; hexagonal
    nut pocket faces upward. No supports.
  use_orientation: Nut enters the upward-facing hex pocket and seats on its bottom
    shoulder. Bolt follows the central axis and can exit through the opposite round
    hole.
