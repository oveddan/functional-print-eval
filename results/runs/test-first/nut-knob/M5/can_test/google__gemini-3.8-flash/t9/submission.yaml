task: nut-knob/M5
note: One-piece 30 mm fluted hand knob for an M5 bolt. Features an empirically verified
  8.10 mm hex pocket that allows an ISO 4032 M5 nut to press in snugly by hand and
  stay retained upside down without glue, backed by a solid stop shoulder and a full
  through-hole.
