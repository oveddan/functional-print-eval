task: nut-knob/M5
note: Single-piece 30 mm hand knob for an M5 bolt. Features a captive ISO 4032 M5
  hex nut pocket with 6 integral rounded crush ribs and spherical lead-in domes for
  an effortless thumb press-fit that retains the nut against gravity without glue.
  An internal solid 6.2 mm shoulder prevents push-through, and a 5.4 mm central through-hole
  allows through-bolt clamping. Prints without supports.
questions: []
