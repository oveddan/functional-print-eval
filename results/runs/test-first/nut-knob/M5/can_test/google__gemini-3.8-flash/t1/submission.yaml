parts:
- id: hand_knob
  role: final
  material: PLA
  code: "import cadquery as cq\nimport math\n\ndef build(p):\n    # Base central hub\
    \ cylinder\n    res = cq.Workplane(\"XY\").circle(p.hub_d / 2.0).extrude(p.knob_h)\n\
    \    \n    # 6 rounded lobes around the perimeter for finger grip (30 mm across\
    \ tips)\n    for i in range(int(p.lobe_count)):\n        angle = (360.0 / p.lobe_count)\
    \ * i\n        rad = math.radians(angle)\n        lx = p.lobe_center_r * math.cos(rad)\n\
    \        ly = p.lobe_center_r * math.sin(rad)\n        lobe = (\n            cq.Workplane(\"\
    XY\")\n            .center(lx, ly)\n            .circle(p.lobe_r)\n          \
    \  .extrude(p.knob_h)\n        )\n        res = res.union(lobe)\n    \n    # Central\
    \ through-hole for M5 bolt\n    res = res.faces(\">Z\").workplane().hole(p.bolt_clearance_d)\n\
    \    \n    # Hex pocket cut from the top face\n    # In CadQuery, polygon diameter\
    \ is circumscribed circle diameter (corner-to-corner)\n    poly_d = p.pocket_af\
    \ / math.cos(math.radians(30))\n    res = (\n        res.faces(\">Z\")\n     \
    \   .workplane()\n        .polygon(6, poly_d)\n        .cutBlind(-p.pocket_depth)\n\
    \    )\n    \n    # Add retention crush ribs with spherical lead-ins on the 6\
    \ flat faces\n    # In CadQuery polygon(6), flat midpoints lie at angles 30, 90,\
    \ 150, 210, 270, 330 deg\n    r_center = (p.pocket_af / 2.0) + p.rib_r - p.rib_t\n\
    \    z_floor = p.knob_h - p.pocket_depth\n    z_embed = z_floor - 0.5  # embed\
    \ slightly into floor for robust boolean union\n    h_extrude = p.rib_h + 0.5\n\
    \    z_dome = z_floor + p.rib_h\n    \n    for i in range(6):\n        angle =\
    \ 30.0 + 60.0 * i\n        rad = math.radians(angle)\n        rx = r_center *\
    \ math.cos(rad)\n        ry = r_center * math.sin(rad)\n        \n        # Straight\
    \ vertical cylinder\n        rib_cyl = (\n            cq.Workplane(\"XY\", origin=(rx,\
    \ ry, z_embed))\n            .circle(p.rib_r)\n            .extrude(h_extrude)\n\
    \        )\n        # Spherical lead-in dome at top of rib\n        rib_dome =\
    \ (\n            cq.Workplane(\"XY\", origin=(rx, ry, z_dome))\n            .sphere(p.rib_r)\n\
    \        )\n        res = res.union(rib_cyl).union(rib_dome)\n        \n    return\
    \ res\n"
  print_orientation: Flat clamping face on build plate at z = 0, nut pocket opening
    facing up
  use_orientation: Thumb nut screwed onto M5 bolt with base face clamping against
    workpiece
hardware:
- id: m5_nut
  ref: ISO 4032 M5
  qty: 1
- id: m5_bolt
  ref: ISO 4762 M5x20
  qty: 1
joints:
- id: knob_fastener_joint
  fastener: m5_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 12.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: hand_knob
    feature: nut_pocket
    role: nut_pocket
  - part: hand_knob
    feature: bolt_through_hole
    role: clearance
  nut: m5_nut
  external: null
criteria:
- id: crit_nut_retention
  part: hand_knob
  feature: nut_pocket
  relation: contains
  hardware: m5_nut
  clearance_mm: -0.11
  params:
  - nut_af
  - pocket_af
  - rib_t
  - rib_r
  check:
    method: measure
    ref: null
    description: Press M5 hex nut into the pocket by hand; verify it seats fully and
      stays retained when turned upside down without glue.
- id: crit_nut_shoulder
  part: hand_knob
  feature: internal_shoulder
  relation: seats
  hardware: m5_nut
  clearance_mm: 0.0
  params:
  - nut_h
  - pocket_depth
  - shoulder_t
  check:
    method: measure
    ref: null
    description: Verify the nut rests against the solid bottom shoulder and is recessed
      ~1.1 mm below the top rim.
- id: crit_bolt_clearance
  part: hand_knob
  feature: bolt_through_hole
  relation: clears
  hardware: m5_bolt
  clearance_mm: 0.4
  params:
  - bolt_clearance_d
  check:
    method: measure
    ref: null
    description: M5 bolt passes smoothly through the central hole and threads into
      the nut.
- id: crit_outer_diameter
  part: hand_knob
  feature: grip_lobes
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - knob_outer_d
  - lobe_center_r
  - lobe_r
  check:
    method: measure
    ref: null
    description: Verify diameter across outer lobe tips is approximately 30 mm.
manual:
- n: '1'
  text: 3D print the hand knob in PLA with its flat clamping face on the bed (z =
    0) at 0.2 mm layer height. No supports are needed.
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '2'
  text: Align an ISO 4032 M5 hex nut with the hex pocket opening on the top face of
    the knob. Press it down firmly with your thumb. The nut will slide past the smooth
    lead-in and crush ribs until it bottoms out against the internal shoulder. Once
    seated, it sits ~1.1 mm recessed inside the knob and will not fall out when inverted.
  parts:
  - hand_knob
  hardware:
  - m5_nut
  tool: null
- n: '3'
  text: Thread the M5 bolt through the knob and nut until it extends out the far side.
    Tighten by hand using the 6 scalloped grip lobes without requiring any tools.
  parts:
  - hand_knob
  hardware:
  - m5_bolt
  tool: null
