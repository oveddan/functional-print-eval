task: nut-knob/M5
note: ''
questions: []
params:
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 height
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: design
    note: knob outside diameter
  knob_h:
    value: 14
    unit: mm
    kind: design
    source: design
    note: knob height
  flute_r:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: grip flute radius, 6 flutes
  pocket_af:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: 'press-fit hex pocket, tested: 8.00 push-fits and holds'
  pocket_depth:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: nut 4.7 plus 0.3
  bolt_clear_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: clearance for M5 bolt through top
parts:
- id: knob
  role: final
  material: PLA high-speed black
  code: "import math\ndef build(p):\n    d = p.knob_d\n    body = cq.Workplane('XY').circle(d\
    \ / 2).extrude(p.knob_h)\n    for i in range(6):\n        a = math.radians(60\
    \ * i)\n        x = (d / 2) * math.cos(a)\n        y = (d / 2) * math.sin(a)\n\
    \        flute = cq.Workplane('XY').center(x, y).circle(p.flute_r).extrude(p.knob_h)\n\
    \        body = body.cut(flute)\n    d_hex = p.pocket_af / math.cos(math.radians(30))\n\
    \    pocket = cq.Workplane('XY').polygon(6, d_hex).extrude(p.pocket_depth)\n \
    \   body = body.cut(pocket)\n    bolt = cq.Workplane('XY').circle(p.bolt_clear_d\
    \ / 2).extrude(p.knob_h)\n    body = body.cut(bolt)\n    return body\n"
  print_orientation: flat on bed, nut pocket opening on the bed side (z=0)
  use_orientation: knob upright, nut pocket facing down toward the workpiece, bolt
    passing up through the top hole
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
joints: []
criteria:
- id: nut-pocket
  part: knob
  feature: hex nut pocket, 8.0 mm across flats, 5.0 mm deep, open at bottom
  relation: contains
  hardware: nut
  clearance_mm: 0.0
  params:
  - pocket_af
  - pocket_depth
  - nut_af
  - nut_h
  check:
    method: coupon
    ref: coupon-pockets
    description: 8.00 mm pocket push-fit and retained nut when inverted and shaken
- id: bolt-hole
  part: knob
  feature: 5.5 mm through-hole in top of knob for M5 bolt
  relation: clears
  hardware: null
  clearance_mm: 0.5
  params:
  - bolt_clear_d
  check:
    method: none
    ref: null
    description: design clearance for M5 bolt
manual:
- n: '1'
  text: Print the knob flat on the bed, nut pocket side down.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Remove supports (none) and clean any stringing from the hex pocket.
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Press the M5 hex nut into the hex pocket from the bottom of the knob by hand.
    It should push in snugly and seat flat, with the nut face flush with the knob
    bottom.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Turn the knob upside down and shake it to confirm the nut stays captive. Do
    not glue it.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Thread the M5 bolt up through the workpiece and into the nut, then tighten
    by turning the knob.
  parts: []
  hardware: []
  tool: null
