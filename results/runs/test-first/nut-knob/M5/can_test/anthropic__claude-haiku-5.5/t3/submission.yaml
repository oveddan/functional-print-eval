parts:
- id: knob
  role: final
  material: PLA high-speed black
  code: "def build(p):\n    H = p.knob_h\n    body = cq.Workplane('XY').circle(p.knob_d/2).extrude(H).edges().fillet(1.5)\n\
    \    lip_cut = cq.Workplane('XY').workplane(offset=-1).polygon(6, p.lip_af/0.8660254).extrude(p.lip_t+1)\n\
    \    pocket = cq.Workplane('XY').workplane(offset=p.lip_t).polygon(6, p.pocket_af/0.8660254).extrude(p.nut_h+p.clear_z)\n\
    \    bolt = cq.Workplane('XY').workplane(offset=-1).circle(p.bolt_hole_d/2).extrude(H+2)\n\
    \    body = body.cut(lip_cut).cut(pocket).cut(bolt)\n    return body.mirror('XY').translate((0,\
    \ 0, H))\n"
  print_orientation: grip (top) face down on bed, nut pocket opening up
  use_orientation: nut pocket face down, grip up
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
joints: []
criteria:
- id: nut-pocket
  part: knob
  feature: hex nut pocket open at the entry face, 7.4 mm across flats lip
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - pocket_af
  - lip_af
  - nut_h
  - clear_z
  - lip_t
  check:
    method: measure
    ref: null
    description: Calipers on the printed entry lip; M5 nut seats by hand, stays in
      when inverted.
- id: bolt-clear
  part: knob
  feature: bolt through-hole 5.5 mm
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - bolt_hole_d
  check:
    method: measure
    ref: null
    description: An M5 bolt passes freely through the grip hole.
manual:
- n: '1'
  text: Print the knob with the grip face on the print bed (the nut opening faces
    up). No supports are needed.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: 'Check the entry opening: it should be a hex about 7.4 mm across flats. Clean
    any stringing out of the hex with a knife tip.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Align an M5 hex nut with the flats of the entry opening and press it in by
    hand. It should snap past the lip and seat fully inside the pocket.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Turn the knob upside down and confirm the nut stays in. If it falls out or
    will not seat, reprint with the lip at 7.6 mm across flats (adjust lip_af) and
    check again. Do not force it with a tool.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Thread the M5 bolt through the grip hole and into the nut, then turn the knob
    by hand to tighten.
  parts:
  - knob
  hardware:
  - nut
  tool: null
