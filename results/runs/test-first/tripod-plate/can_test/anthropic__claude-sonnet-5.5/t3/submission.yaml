task: tripod-plate
note: It's an easy print, but I couldn't get the clamp's lip height, lip angle or
  length, or the camera socket depth, so those are guesses. The three clamp coupons
  (A, B, C) test the guessed edge shapes, and the boltslot coupon tests the bolt channel.
  Print the coupons first, because plate_t and bevel_angle may need changing. I didn't
  print a screw, because 1/4-20 threads in PLA are weak and are likely to strip. The
  plate uses your webcam bolt instead. Its head sits in a slotted channel under a
  raised pad, so you can slide the bolt to line up with the camera's socket. The PLA
  plate is a stop-gap and may creep or flex under a heavy camera.
questions:
- text: What is the height of the jaw lip, and what angle does it have?
  answer: null
- text: How deep is the camera's tripod socket?
  answer: null
- text: How long is the tripod clamp along the direction the plate drops in?
  answer: null
- text: Is the bolt's thread the full 10 mm under the head, or is part of it smooth?
  answer: null
