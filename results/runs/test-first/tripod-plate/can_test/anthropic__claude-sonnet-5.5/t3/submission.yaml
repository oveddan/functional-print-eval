parts:
- id: plate
  role: final
  material: PLA
  code: "import math\nimport cadquery as cq\ndef build(p):\n    W=p.clamp_width-p.fit_clear;\
    \ T=p.plate_t; L=p.plate_len\n    inset=(T-p.land)/math.tan(math.radians(p.bevel_angle))\n\
    \    pts=[(-W/2,0),(W/2,0),(W/2,p.land),(W/2-inset,T),(-W/2+inset,T),(-W/2,p.land)]\n\
    \    base=cq.Workplane('XZ').polyline(pts).close().extrude(-L)\n    ch_w=p.bolt_head_d+p.head_clear\n\
    \    ch_h=p.bolt_head_h+p.head_clear\n    roof=p.bolt_len-p.engage\n    H=ch_h+roof\n\
    \    rail=cq.Workplane('XY').box(p.rail_w,L,H,centered=(True,False,False))\n \
    \   body=base.union(rail)\n    # head channel, open at the y=0 end and at the\
    \ bottom\n    ch_len=p.chan_end\n    ch=cq.Workplane('XY').box(ch_w,ch_len,ch_h,centered=(True,False,False))\n\
    \    ch=ch.edges('|Z and >Y').fillet(ch_w/2-0.01)\n    # shank slot through the\
    \ roof\n    sw=p.bolt_d+p.shank_clear\n    sl=cq.Workplane('XY').box(sw,p.slot_end,H,centered=(True,False,False))\n\
    \    sl=sl.edges('|Z and >Y').fillet(sw/2-0.01)\n    return body.cut(ch).cut(sl)\n"
  print_orientation: wide face down on the bed; the channel in the pad opens onto
    the bed
  use_orientation: wide face down in the tripod clamp, pad up, camera on the pad
- id: clampA
  role: coupon
  material: PLA
  code: "import math\nimport cadquery as cq\ndef build(p):\n    W=p.clamp_width-p.fit_clear;\
    \ T=p.cA_t\n    inset=(T-p.land)/math.tan(math.radians(p.cA_angle))\n    pts=[(-W/2,0),(W/2,0),(W/2,p.land),(W/2-inset,T),(-W/2+inset,T),(-W/2,p.land)]\n\
    \    return cq.Workplane('XZ').polyline(pts).close().extrude(-p.coupon_len)\n"
  print_orientation: wide face down on bed
  use_orientation: dropped into tripod clamp, wide face down
- id: clampB
  role: coupon
  material: PLA
  code: "import math\nimport cadquery as cq\ndef build(p):\n    W=p.clamp_width-p.fit_clear;\
    \ T=p.cB_t\n    inset=(T-p.land)/math.tan(math.radians(p.cB_angle))\n    pts=[(-W/2,0),(W/2,0),(W/2,p.land),(W/2-inset,T),(-W/2+inset,T),(-W/2,p.land)]\n\
    \    return cq.Workplane('XZ').polyline(pts).close().extrude(-p.coupon_len)\n"
  print_orientation: wide face down on bed
  use_orientation: dropped into tripod clamp, wide face down
- id: clampC
  role: coupon
  material: PLA
  code: "import math\nimport cadquery as cq\ndef build(p):\n    W=p.clamp_width-p.fit_clear;\
    \ T=p.cC_t\n    inset=(T-p.land)/math.tan(math.radians(p.cC_angle))\n    pts=[(-W/2,0),(W/2,0),(W/2,p.land),(W/2-inset,T),(-W/2+inset,T),(-W/2,p.land)]\n\
    \    return cq.Workplane('XZ').polyline(pts).close().extrude(-p.coupon_len)\n"
  print_orientation: wide face down on bed
  use_orientation: dropped into tripod clamp, wide face down
- id: boltslot
  role: coupon
  material: PLA
  code: "import cadquery as cq\ndef build(p):\n    ch_w=p.bolt_head_d+p.head_clear\n\
    \    ch_h=p.bolt_head_h+p.head_clear\n    roof=p.bolt_len-p.engage\n    H=ch_h+roof\n\
    \    W=ch_w+10\n    L=p.slot_len\n    blk=cq.Workplane('XY').box(W,L,H,centered=(True,False,False))\n\
    \    ch=cq.Workplane('XY').box(ch_w,L,ch_h,centered=(True,False,False))\n    sl=cq.Workplane('XY').box(p.bolt_d+p.shank_clear,L,H,centered=(True,False,False))\n\
    \    return blk.cut(ch).cut(sl)\n"
  print_orientation: flat, channel side down on bed
  use_orientation: bolt head slid into the channel from the open end
