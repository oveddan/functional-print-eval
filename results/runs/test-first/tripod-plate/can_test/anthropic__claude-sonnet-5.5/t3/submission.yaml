  params:
  - bolt_d
  - shank_clear
  check:
    method: coupon
    ref: boltslot
    description: The threaded shank slides freely along the slot.
- id: c4
  part: plate
  feature: pad top face
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - bolt_len
  - engage
  - rail_w
  check:
    method: measure
    ref: null
    description: With the bolt in the plate, measure how far the thread sticks out
      above the pad. It should be about 4.5 mm and no more than the camera socket
