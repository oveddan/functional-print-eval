    feature: head channel (roof underside)
    role: head_seat
  - part: plate
    feature: shank slot
    role: clearance
  nut: null
  external: camera 1/4-20 tripod socket
criteria:
- id: c1
  part: plate
  feature: bevelled edges, 38 mm wide
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - clamp_width
  - fit_clear
  - plate_t
  - bevel_angle
  - land
  check:
    method: coupon
    ref: clampA
    description: Drop clampA, clampB and clampC into the tripod clamp. The one that
      drops in and is gripped firmly with no wobble is the right edge profile. Copy
      its thickness and angle into plate_t and bevel_angle.
- id: c2
  part: plate
  feature: head channel
  relation: contains
  hardware: bolt
  clearance_mm: null
  params:
  - bolt_head_d
  - bolt_head_h
  - head_clear
  check:
    method: coupon
    ref: boltslot
    description: The bolt head slides in from the open end, with its sides reachable
