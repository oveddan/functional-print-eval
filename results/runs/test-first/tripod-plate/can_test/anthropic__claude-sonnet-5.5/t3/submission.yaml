manual:
- n: '1'
  text: Print the three clamp coupons (clampA, clampB, clampC) and the boltslot coupon.
    They're small, flat on the bed, no supports.
  parts:
  - clampA
  - clampB
  - clampC
  - boltslot
  hardware: []
  tool: null
- n: '2'
  text: 'Drop each clamp coupon into the tripod clamp. Pick the one that goes in easily
    and is gripped firmly when you tighten the knob. If none fits, tell me what''s
    wrong: too loose, too tight, or the lips don''t catch. The final plate''s plate_t
    and bevel_angle then need changing to match.'
  parts:
  - clampA
  - clampB
  - clampC
  hardware: []
  tool: null
- n: '3'
  text: Slide the bolt head into the boltslot coupon from the open end, with the thread
    poking up through the slot. Check it slides. Measure how far the thread sticks
    out above the top. It should be about 4.5 mm. Compare that with how deep your
    camera's socket is, which you can check by screwing the bolt in a few turns by
    hand.
  parts:
  - boltslot
  hardware:
  - bolt
  tool: null
- n: '4'
  text: Print the plate with its wide face down on the bed, no supports. Use 4 walls
    and 40% or more infill. The head channel opens onto the bed.
  parts:
  - plate
  hardware: []
  tool: null
- n: '5'
  text: Slide the webcam bolt head into the open end of the channel with the thread
    pointing up through the slot. Slide it to where your camera's socket will sit,
    roughly the middle of the plate.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '6'
  text: Hold the camera on the pad and turn the bolt head with your fingers, reaching
    into the open end of the channel, until the thread is in the socket and the plate
    is snug against the camera. Don't overtighten, because PLA is weak.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '7'
  text: Drop the plate, wide face down, into the tripod clamp and tighten the knob.
    Test with the camera held in your hand before you let go. Treat it as a temporary
    plate and don't leave a heavy camera on it for long.
  parts:
  - plate
  hardware: []
  tool: null
