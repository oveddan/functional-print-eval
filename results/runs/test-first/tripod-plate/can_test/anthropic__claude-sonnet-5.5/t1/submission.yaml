task: tripod-plate
note: 'I designed this as a temporary Arca-style quick-release plate. It is 38 mm
  wide, with a 45° dovetail on the clamp side. It has a slot for the camera position
  and a recessed pocket for the head of your salvaged 1/4-20 webcam bolt. I used that
  bolt as the part that screws in, because a printed 1/4-20 thread in PLA would be
  weak and strip easily. The plate prints with the camera face down, so it needs no
  supports. The first test showed the head pocket bridged badly when printed the other
  way up, so I flipped the part. The clamp''s lip angle, jaw gap and depth, and the
  camera socket depth, are unmeasured and assumed. Print the dovetail-coupon before
  the full plate to check the fit. It''s a temporary fix: don''t trust it with an
  expensive camera until you''ve checked that it holds firmly, and keep a hand on
  the camera while you test it.'
questions:
- text: What are the clamp's lip angle, jaw gap and depth? I couldn't get these measured,
    so I assumed an Arca-Swiss-style 45° dovetail on a 38 mm plate.
  answer: null
- text: How deep is the camera's 1/4-20 socket? The bolt sticks out about 5.3 mm above
    the plate.
  answer: null
- text: How did the dovetail-coupon fit? The first test's report came back empty.
  answer: null
