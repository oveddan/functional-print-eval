  head_d:
    value: 15
    unit: mm
    kind: world
    source: measured
    note: salvaged bolt head across, about
  head_h:
    value: 5
    unit: mm
    kind: world
    source: measured
    note: salvaged bolt head height, about
  head_clear:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: extra on head pocket diameter
  head_h_clear:
