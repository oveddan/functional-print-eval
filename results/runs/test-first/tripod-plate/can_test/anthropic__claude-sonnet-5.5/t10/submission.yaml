task: tripod-plate
note: I couldn't measure the clamp jaw gap, the lip angle or the bolt's exact head
  shape. Only the 38 mm plate width, the 1/4-20 socket and the rough bolt dimensions
  are known. The plate thickness (5 mm) and the 60 degree lip are guesses, and the
  edge-test coupon is there to catch a wrong guess. I used your webcam bolt instead
  of printing a thread, because a printed 1/4-20 thread in PLA is weak and strips
  easily. The bolt head sits in a recess on the underside so the plate lies flat in
  the clamp. The bolt is only about 10 mm long, so the raised pad is kept thin to
  leave enough thread for the camera.
questions:
- text: What are the clamp's lip angle and jaw gap? I couldn't get these from the
    measurements, so the edge profile is a guess. The edge-test coupon checks it.
  answer: null
params:
  plate_w:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: width of plate the tripod clamp takes
  fit_clr:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: total width taken off the plate so it drops into the clamp
  plate_t:
    value: 5
    unit: mm
    kind: world
    source: guessed
    note: edge thickness; clamp jaw gap could not be measured
  bevel_h:
    value: 3
    unit: mm
    kind: design
    source: design
    note: height of the sloped lower part of each long edge
  bevel_ang:
    value: 60
    unit: deg
    kind: world
    source: guessed
    note: lip angle from horizontal; not measured
  plate_len:
    value: 60
    unit: mm
    kind: design
    source: design
    note: ''
  pad_w:
    value: 26
    unit: mm
    kind: design
    source: design
    note: raised camera pad on top
  pad_h:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: ''
  bolt_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 major diameter
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: about 15 mm across the salvaged bolt head
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: about 5 mm
  bolt_len:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: under head, about 10 mm
  head_clr:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: extra diameter on the head recess
  head_depth_clr:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: extra recess depth so the head sits flush
  slot_w:
    value: 6.9
    unit: mm
    kind: design
    source: design
    note: bolt slot width
  slot_travel:
    value: 16
    unit: mm
    kind: design
    source: design
    note: how far the bolt can slide along the plate
  coupon_len:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: plate
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    w = p.plate_w - p.fit_clr\n    t = p.plate_t\n\
    \    bh = p.bevel_h\n    inset = bh / math.tan(math.radians(p.bevel_ang))\n  \
    \  pts = [(-(w/2-inset),0),((w/2-inset),0),(w/2,bh),(w/2,t),(-w/2,t),(-w/2,bh)]\n\
    \    body = cq.Workplane('XZ').polyline(pts).close().extrude(p.plate_len/2, both=True)\n\
    \    pad = (cq.Workplane('XY').workplane(offset=t).rect(p.pad_w, p.plate_len-10).extrude(p.pad_h)\n\
    \           .edges('|Z').fillet(3).faces('>Z').edges().chamfer(0.8))\n    body\
    \ = body.union(pad)\n    total = t + p.pad_h\n    rd = p.bolt_head_d + p.head_clr\n\
    \    rdepth = p.bolt_head_h + p.head_depth_clr\n    recess = cq.Workplane('XY').slot2D(rd\
    \ + p.slot_travel, rd, 90).extrude(rdepth)\n    thru = cq.Workplane('XY').slot2D(p.slot_w\
    \ + p.slot_travel, p.slot_w, 90).extrude(total)\n    return body.cut(recess).cut(thru)"
  print_orientation: clamp side (underside, with the bolt-head recess) flat on the
    bed
  use_orientation: 'flipped over: the raised pad faces up and the camera sits on it;
    bolt head in the underside recess, shank up through the slot'
- id: edge-test
  role: coupon
  material: PLA
  code: "import math\ndef build(p):\n    w = p.plate_w - p.fit_clr\n    t = p.plate_t\n\
    \    bh = p.bevel_h\n    inset = bh / math.tan(math.radians(p.bevel_ang))\n  \
    \  pts = [(-(w/2-inset),0),((w/2-inset),0),(w/2,bh),(w/2,t),(-w/2,t),(-w/2,bh)]\n\
    \    return cq.Workplane('XZ').polyline(pts).close().extrude(p.coupon_len/2, both=True)"
  print_orientation: narrow (clamp-side) face flat on the bed
  use_orientation: dropped into the tripod clamp from above, wide face up
hardware:
- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera-bolt
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 5.3
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: head recess on the underside
    role: head_seat
  - part: plate
    feature: bolt slot
    role: clearance
  nut: null
  external: camera 1/4-20 tripod socket
criteria:
- id: c-edge
  part: plate
  feature: angled long edges
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - plate_w
  - fit_clr
  - plate_t
  - bevel_h
  - bevel_ang
  check:
    method: coupon
    ref: edge-test
    description: Drop the edge-test piece into the tripod clamp. It should seat fully
      and tighten without rocking. Thickness and lip angle were guessed.
- id: c-head
  part: plate
  feature: head recess
  relation: contains
  hardware: bolt
  clearance_mm: null
  params:
  - bolt_head_d
  - bolt_head_h
  - head_clr
  - head_depth_clr
  check:
    method: measure
    ref: null
    description: Bolt head drops fully into the recess and sits flush with or below
      the underside.
- id: c-slot
  part: plate
  feature: bolt slot
  relation: clears
  hardware: bolt
  clearance_mm: 0.275
  params:
  - bolt_d
  - slot_w
  check:
    method: measure
    ref: null
    description: 1/4 inch shank slides freely along the slot.
- id: c-engage
  part: plate
  feature: roof above head recess
  relation: supports
  hardware: bolt
  clearance_mm: null
  params:
  - bolt_len
  - plate_t
  - pad_h
  - bolt_head_h
  - head_depth_clr
  check:
    method: measure
    ref: null
    description: About 7.8 mm of shank stands above the pad, enough for the camera's
      1/4-20 socket. Check that it threads in and the camera sits flat on the pad.
manual:
- n: '1'
  text: Print the edge-test piece first. Drop it into the tripod clamp from above
    and tighten the knob. If it is loose, or won't go in, tell me the lip angle or
    jaw gap and I'll change plate_t or bevel_ang before you print the plate.
  parts:
  - edge-test
  hardware: []
  tool: null
- n: '2'
  text: Print the plate with the underside (the side with the long recess) flat on
    the bed. No supports are needed.
  parts:
  - plate
  hardware: []
  tool: null
- n: '3'
  text: 'Push the salvaged 1/4-20 bolt in from the underside: the head goes into the
    wide recess and the threaded end comes up through the narrow slot.'
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '4'
  text: With the raised pad facing up, screw the camera onto the protruding bolt by
    turning the camera, not the bolt, until it is snug against the pad. Slide the
    bolt along the slot first if you need to balance the camera.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '5'
  text: Drop the plate into the tripod clamp from above and tighten the knob. Check
    it is held firmly before you let go of the camera. This is a temporary PLA part,
    so don't leave a heavy camera on it for long.
  parts:
  - plate
  hardware: []
  tool: null
