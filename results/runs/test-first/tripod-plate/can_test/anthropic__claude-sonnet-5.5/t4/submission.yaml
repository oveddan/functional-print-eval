  - pocket_clr
  - head_h
  check:
    method: measure
    ref: null
    description: Bolt head drops into the pocket and spins freely
- id: c3
  part: camera-plate
  feature: shank hole
  relation: clears
  hardware: bolt
  clearance_mm: 0.2
  params:
  - shank_d
  - shank_clr
  check:
    method: measure
    ref: null
    description: Bolt shank passes through the hole with a little play
- id: c4
  part: camera-plate
  feature: bolt protrusion above camera face
  relation: engages
  hardware: bolt
  clearance_mm: null
  params:
  - bolt_len
  - protrusion
  - plate_t
  check:
    method: measure
    ref: null
    description: 5 mm of thread sticks out and the camera seats on the plate without
      bottoming out
manual:
- n: '1'
  text: Print the thickness-steps coupon. Slide its steps into the tripod clamp. Find
    the thickest step that slides in and gets gripped when the clamp is tightened.
    If that isn't 6 mm, change plate_t to that value, with the thickness minus about
    0.1 mm, before printing the plate.
  parts:
  - thickness-steps
  hardware: []
  tool: null
- n: '2'
  text: Print the camera plate with the flat camera face on the bed. It needs no supports.
  parts:
  - camera-plate
  hardware: []
  tool: null
- n: '3'
  text: Push the salvaged 1/4-20 bolt up from the underside, with the threads going
    first. The head sits in the round pocket, and about 5 mm of thread comes out of
    the camera face.
  parts:
  - camera-plate
  hardware:
  - bolt
  tool: null
- n: '4'
  text: Slide the plate into the tripod clamp and tighten it. Turn the bolt head by
    hand to screw it into the camera's tripod socket until the camera sits flat on
    the plate. Don't over-tighten. Check the grip before you let go of the camera.
  parts:
  - camera-plate
  hardware:
  - bolt
  tool: null
