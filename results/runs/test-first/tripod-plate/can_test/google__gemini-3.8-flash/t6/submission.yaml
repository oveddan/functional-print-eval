task: tripod-plate
note: Arca-Swiss compatible 38 mm quick-release plate for camera tripod mounting.
  Uses salvaged 1/4-20 webcam mount bolt, printing completely support-free on Bambu
  Lab X1C.
questions:
- text: How hard would it be to 3D print the quick release plate?
  answer: 'It is very straightforward: the plate prints in under an hour without supports
    on your Bambu X1C with high-speed PLA.'
- text: How hard would it be to 3D print the part that screws in?
  answer: 3D printing a plastic 1/4"-20 threaded screw is not recommended because
    PLA layer lines can shear under load, risking your camera. Instead, you can use
    your salvaged metal 1/4"-20 webcam mount bolt, which already has a 15 mm knurled
    thumb head that fits flush into the bottom channel of this plate.
params:
  slot_length:
    value: 18
    unit: mm
    kind: design
    source: design
    note: Length of bolt clearance slot
  web_thickness:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: Web thickness between bolt seat and camera face; leaves 5.5 mm thread engagement
  plate_thickness:
    value: 9.5
    unit: mm
    kind: design
    source: design
    note: Total plate thickness (standard 3/8 in / 9.5 mm)
  counterbore_clearance:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Width clearance for 15 mm bolt head in channel
  bolt_thread_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: Standard 1/4-20 major thread diameter (0.25 in = 6.35 mm)
  plate_length:
    value: 50
    unit: mm
    kind: design
    source: design
    note: Standard quick-release plate length
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Measured webcam mount bolt head diameter
  bottom_lip_h:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Height of vertical lip at bottom dovetail edge
  bolt_length:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: Measured webcam mount bolt thread length under head
  slot_clearance:
    value: 0.65
    unit: mm
    kind: design
    source: design
    note: Clearance for 1/4-20 bolt shank in slot (7.0 mm slot width)
  dovetail_angle:
    value: 45
    unit: deg
    kind: design
    source: design
    note: Standard Arca-Swiss dovetail angle
  camera_thread_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 thread pitch (25.4 / 20 = 1.27 mm)
  camera_socket_depth:
    value: 5.5
    unit: mm
    kind: world
    source: datasheet
    note: Standard camera tripod socket minimum thread depth
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Measured webcam mount bolt head height
  clamp_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: Measured tripod clamp plate width (standard Arca-Swiss 38 mm)
parts:
- id: plate
  role: final
  material: PLA
  code: "def build(p):\n    z_top = p.plate_thickness\n    z_bevel_top = z_top - p.bottom_lip_h\n\
    \    x_max = p.clamp_width / 2.0\n    bevel_h = 4.5\n    z_neck = z_bevel_top\
    \ - bevel_h\n    x_neck = x_max - bevel_h\n\n    pts = [\n        (-x_neck, 0.0),\n\
    \        (x_neck, 0.0),\n        (x_neck, z_neck),\n        (x_max, z_bevel_top),\n\
    \        (x_max, z_top),\n        (-x_max, z_top),\n        (-x_max, z_bevel_top),\n\
    \        (-x_neck, z_neck),\n    ]\n\n    base = (\n        cq.Workplane(\"XZ\"\
    )\n        .polyline(pts)\n        .close()\n        .extrude(p.plate_length /\
    \ 2.0, both=True)\n    )\n\n    slot_w = p.bolt_thread_d + p.slot_clearance\n\
    \    slot_travel = p.slot_length - slot_w\n\n    slot_cut = (\n        cq.Workplane(\"\
    XY\", origin=(0, 0, -1.0))\n        .rect(slot_w, slot_travel)\n        .extrude(z_top\
    \ + 2.0)\n    )\n    c1 = (\n        cq.Workplane(\"XY\", origin=(0, slot_travel\
    \ / 2.0, -1.0))\n        .circle(slot_w / 2.0)\n        .extrude(z_top + 2.0)\n\
    \    )\n    c2 = (\n        cq.Workplane(\"XY\", origin=(0, -slot_travel / 2.0,\
    \ -1.0))\n        .circle(slot_w / 2.0)\n        .extrude(z_top + 2.0)\n    )\n\
    \    slot_cut = slot_cut.union(c1).union(c2)\n\n    base = base.cut(slot_cut)\n\
    \n    cb_w = p.bolt_head_d + p.counterbore_clearance\n    cb_depth = z_top - p.web_thickness\
    \ + 2.0\n\n    cb_cut = (\n        cq.Workplane(\"XY\", origin=(0, 0, p.web_thickness))\n\
    \        .rect(cb_w, p.plate_length + 2.0)\n        .extrude(cb_depth)\n    )\n\
    \n    base = base.cut(cb_cut)\n    return base\n"
  print_orientation: Camera-facing top surface flat on the bed (z = 0), dovetail expanding
    upward with bolt head channel open to the top
  use_orientation: 'Inverted relative to print orientation: flat face at z = 0 faces
    up against camera base, dovetail profile faces down into tripod clamp'
- id: plate-coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    coupon_len = 15.0\n    z_top = p.plate_thickness\n   \
    \ z_bevel_top = z_top - p.bottom_lip_h\n    x_max = p.clamp_width / 2.0\n    bevel_h\
    \ = 4.5\n    z_neck = z_bevel_top - bevel_h\n    x_neck = x_max - bevel_h\n\n\
    \    pts = [\n        (-x_neck, 0.0),\n        (x_neck, 0.0),\n        (x_neck,\
    \ z_neck),\n        (x_max, z_bevel_top),\n        (x_max, z_top),\n        (-x_max,\
    \ z_top),\n        (-x_max, z_bevel_top),\n        (-x_neck, z_neck),\n    ]\n\
    \n    base = (\n        cq.Workplane(\"XZ\")\n        .polyline(pts)\n       \
    \ .close()\n        .extrude(coupon_len / 2.0, both=True)\n    )\n    return base\n"
  print_orientation: Flat face down on print bed (z = 0)
  use_orientation: Inserted into tripod clamp to check dovetail profile fit
hardware:
- id: webcam-bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera-mount
  fastener: webcam-bolt
  axis_origin:
  - 0.0
  - 0.0
  - 4.5
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: plate
    feature: head_counterbore
    role: head_seat
  - part: plate
    feature: bolt_slot
    role: clearance
  nut: null
  external: camera 1/4-20 tripod socket
criteria:
- id: bolt-shank-clearance
  part: plate
  feature: bolt_slot
  relation: clears
  hardware: webcam-bolt
  clearance_mm: 0.65
  params:
  - bolt_thread_d
  - slot_clearance
  check:
    method: measure
    ref: null
    description: Verify 1/4-20 bolt shank slides freely through 7.0 mm slot without
      binding
- id: bolt-head-seat
  part: plate
  feature: head_counterbore
  relation: seats
  hardware: webcam-bolt
  clearance_mm: 1.5
  params:
  - bolt_head_d
  - counterbore_clearance
  - bolt_head_h
  - web_thickness
  check:
    method: measure
    ref: null
    description: Verify bolt head seats flush against counterbore floor leaving head
      flush with bottom surface
- id: thread-engagement-camera
  part: plate
  feature: camera_platform
  relation: clears
  hardware: webcam-bolt
  clearance_mm: 0.0
  params:
  - bolt_length
  - web_thickness
  - camera_socket_depth
  check:
    method: measure
    ref: null
    description: Check that bolt thread extends 5.5 mm above plate to engage camera
      socket without bottoming
- id: clamp-dovetail-engagement
  part: plate
  feature: dovetail_profile
  relation: engages
  hardware: null
  clearance_mm: 0.0
  params:
  - clamp_width
  - dovetail_angle
  check:
    method: coupon
    ref: plate-coupon
    description: Verify 38 mm plate width and 45-degree bevel fit tripod clamp jaws
      securely
manual:
- n: '1'
  text: 'Optional test: print ''plate-coupon'' first to test fit in the tripod clamp.
    Slide or drop the coupon into the clamp and tighten the knob. Verify that the
    clamp jaws firmly grip the 45-degree dovetails without play. Loosen and remove.'
  parts:
  - plate-coupon
  hardware: []
  tool: null
- n: '2'
  text: Print 'plate' with its flat camera-facing surface down on the print bed (z
    = 0). No supports are needed. After the print finishes and the bed cools, remove
    the part and ensure the edges and slot are clean.
  parts:
  - plate
  hardware: []
  tool: null
- n: '3'
  text: Insert the salvaged 1/4"-20 webcam mount bolt into the central slot from the
    recessed underside of the plate, so the threaded shaft extends out through the
    flat camera-facing top surface.
  parts:
  - plate
  hardware:
  - webcam-bolt
  tool: null
- n: '4'
  text: Align the plate's flat top surface against the camera's base, matching the
    protruding 1/4"-20 bolt to the camera's tripod socket. Thread the bolt in hand-tight
    using its 15 mm knurled thumb head (or snug with a coin/flat screwdriver). Ensure
    the plate is square to the camera body.
  parts:
  - plate
  hardware:
  - webcam-bolt
  tool: Coin or flat screwdriver (optional)
- n: '5'
  text: Open your friend's tripod clamp by turning the clamp knob counterclockwise.
    Place the camera with the attached quick release plate into the clamp jaws and
    tighten the clamp knob securely. Test by hand that the camera is firmly held before
    releasing.
  parts:
  - plate
  hardware:
  - webcam-bolt
  tool: null
