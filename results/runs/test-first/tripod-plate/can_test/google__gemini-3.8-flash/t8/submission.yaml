  clearance_mm: 0.65
  params:
  - bolt_d
  - bolt_slot_w
  check:
    method: measure
    ref: null
    description: Check 1/4"-20 bolt shank slides freely along the slot
- id: camera_thread_protrusion
  part: quick_release_plate
  feature: camera_face
  relation: supports
  hardware: camera_bolt
  clearance_mm: 5.5
  params:
  - bolt_length
  - seat_thickness
  check:
    method: measure
    ref: null
    description: Check bolt thread extends 5.5 mm above top face for solid engagement
      without bottoming out
manual:
- n: '1'
  text: 3D print the quick_release_plate in PLA with 100% infill (or at least 5-6
    perimeters and 50%+ infill) with the bottom (z = 0) face flat on the build plate.
    No supports are needed because all overhangs are 45 degrees or bridges.
  parts:
  - quick_release_plate
  hardware: []
  tool: null
- n: '2'
  text: Insert the salvaged webcam mount bolt (camera_bolt) into the underside recess
    slot of the quick_release_plate from the bottom. The bolt's 15 mm head sits inside
    the counterbore pocket, with approximately 5.5 mm of thread extending above the
    plate's top face.
  parts:
  - quick_release_plate
  hardware:
  - camera_bolt
  tool: null
- n: '3'
  text: Place the top face of the quick_release_plate flat against the bottom base
    of your camera, aligning the bolt with the camera's 1/4"-20 threaded tripod socket.
    Slide the bolt along the slot if needed to clear the camera battery door. Hand-tighten
    the bolt firmly into the camera socket using its knurled head.
  parts:
  - quick_release_plate
  hardware:
  - camera_bolt
  tool: null
- n: '4'
  text: Loosen the knob on your tripod head clamp until the clamp jaws open. Drop
    the mounted camera and plate into the clamp from above, ensuring the clamp's angled
    lips seat into the plate's 45-degree dovetail grooves. Tighten the clamp knob
    firmly to lock the plate in place.
  parts:
  - quick_release_plate
  hardware: []
  tool: null
