parts:
- id: quick_release_plate
  role: final
  material: PLA
  code: "def build(p):\n    import cadquery as cq\n\n    w = p.clamp_plate_width\n\
    \    h = p.plate_thickness\n    l = p.plate_length\n    d_undercut = p.dovetail_depth\n\
    \    lip_h = p.lip_height\n\n    # Symmetrical double-dovetail Arca-Swiss profile\
    \ in XZ plane\n    x_outer = w / 2.0\n    x_inner = x_outer - d_undercut\n   \
    \ z_mid = h / 2.0\n    z_lip_top = h - lip_h\n\n    pts = [\n        (-x_outer,\
    \ 0.0),\n        (-x_outer, lip_h),\n        (-x_inner, z_mid),\n        (-x_outer,\
    \ z_lip_top),\n        (-x_outer, h),\n        (x_outer, h),\n        (x_outer,\
    \ z_lip_top),\n        (x_inner, z_mid),\n        (x_outer, lip_h),\n        (x_outer,\
    \ 0.0),\n    ]\n\n    # Extrude along Y and center at origin\n    part = cq.Workplane(\"\
    XZ\").polyline(pts).close().extrude(l)\n    part = part.translate((0, -l / 2.0,\
    \ 0))\n\n    # Through slot for 1/4\"-20 bolt shank\n    part = (\n        part.faces(\"\
    >Z\")\n        .workplane()\n        .slot2D(p.bolt_slot_l, p.bolt_slot_w, 90)\n\
    \        .cutThruAll()\n    )\n\n    # Counterbore recess slot from the bottom\
    \ for the bolt head\n    cb_depth = h - p.seat_thickness\n    pocket = (\n   \
    \     cq.Workplane(\"XY\")\n        .workplane(offset=-0.1)\n        .slot2D(p.bolt_head_pocket_l,\
    \ p.bolt_head_pocket_w, 90)\n        .extrude(cb_depth + 0.1)\n    )\n    part\
    \ = part.cut(pocket)\n\n    return part\n"
  print_orientation: z = 0 face on the bed
  use_orientation: bottom face into tripod clamp, top face against camera
hardware:
- id: camera_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: bolt_to_plate_joint
  fastener: camera_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 5.5
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: quick_release_plate
    feature: bolt_head_recess
    role: head_seat
  - part: quick_release_plate
    feature: bolt_shank_slot
    role: clearance
  nut: null
  external: camera 1/4"-20 tripod socket
criteria:
- id: dovetail_width_match
