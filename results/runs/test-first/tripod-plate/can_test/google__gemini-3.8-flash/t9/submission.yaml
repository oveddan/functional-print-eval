task: tripod-plate
note: 'This quick-release plate matches the 38 mm Arca-Swiss dovetail standard with
  45-degree facets used by your friend''s tripod clamp. Do not 3D print the screw
  itself: 3D-printed plastic 1/4"-20 threads easily snap along layer lines under tension,
  which would drop the camera. Instead, the design uses the steel 1/4"-20 bolt salvaged
  from your webcam mount, which is the exact same standard camera thread. The bottom
  of the plate features an open recessed pocket so the bolt head sits 0.2 mm below
  the bottom surface, preventing any interference with the tripod clamp floor while
  leaving ample clearance to tighten it by hand.'
questions:
- text: How hard would it be to 3D print it, both the flat part and the part that
    screws in?
  answer: 'The plate is quick and easy to 3D print in PLA (taking ~15-20 minutes with
    zero supports). However, you should not 3D print the screw: 3D-printed plastic
    1/4"-20 threads are weak along layer lines and could easily snap under tension,
    risking your camera. Instead, the 1/4"-20 steel bolt from your webcam mount is
    standard camera thread and fits into this plate perfectly.'
params:
  dovetail_h:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: height of the 45-degree dovetail clamping facet
  bed_chamfer:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: bottom outer edge chamfer to eliminate elephant foot
  pocket_depth:
    value: 5.2
    unit: mm
    kind: design
    source: design
    note: depth of bolt head recess on underside
  plate_thickness:
    value: 10.7
    unit: mm
