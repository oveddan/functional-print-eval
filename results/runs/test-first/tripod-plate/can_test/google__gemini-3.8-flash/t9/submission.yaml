  dovetail_angle:
    value: 45
    unit: deg
    kind: design
    source: design
    note: Arca-Swiss dovetail facet angle
parts:
- id: qr_plate
  role: final
  material: PLA
  code: "def build(p):\n    import cadquery as cq\n\n    w_base = p.plate_width\n\
    \    h_dove = p.dovetail_h\n    t_plate = p.plate_thickness\n    l_plate = p.plate_length\n\
    \    c = p.bed_chamfer\n\n    dx_dove = h_dove  # 45 degree angle: dx == dz\n\
    \    w_top = w_base - 2.0 * dx_dove\n\n    pts = [\n        (-w_base / 2.0 + c,\
    \ 0.0),\n        (w_base / 2.0 - c, 0.0),\n        (w_base / 2.0, c),\n      \
    \  (w_top / 2.0, h_dove),\n        (w_top / 2.0, t_plate),\n        (-w_top /\
    \ 2.0, t_plate),\n        (-w_top / 2.0, h_dove),\n        (-w_base / 2.0, c),\n\
    \    ]\n\n    base = (\n        cq.Workplane(\"XZ\")\n        .polyline(pts)\n\
    \        .close()\n        .extrude(l_plate)\n        .translate((0, -l_plate\
    \ / 2.0, 0))\n    )\n\n    # Cut open central channel on bottom for the bolt head\n\
    \    pocket = (\n        cq.Workplane(\"XY\")\n        .rect(p.pocket_width, l_plate\
    \ + 2.0)\n        .extrude(p.pocket_depth)\n    )\n\n    # Cut slotted clearance\
    \ hole through the web\n    r = p.screw_clearance_d / 2.0\n    dy = p.slot_travel\
    \ / 2.0\n\n    slot_rect = (\n        cq.Workplane(\"XY\", origin=(0, 0, p.pocket_depth\
    \ - 1.0))\n        .rect(p.screw_clearance_d, p.slot_travel)\n        .extrude(t_plate\
    \ - p.pocket_depth + 2.0)\n    )\n    c1 = (\n        cq.Workplane(\"XY\", origin=(0,\
    \ -dy, p.pocket_depth - 1.0))\n        .circle(r)\n        .extrude(t_plate -\
    \ p.pocket_depth + 2.0)\n    )\n    c2 = (\n        cq.Workplane(\"XY\", origin=(0,\
    \ dy, p.pocket_depth - 1.0))\n        .circle(r)\n        .extrude(t_plate - p.pocket_depth\
    \ + 2.0)\n    )\n    slot = slot_rect.union(c1).union(c2)\n\n    res = base.cut(pocket).cut(slot)\n\
    \    return res\n"
  print_orientation: Bottom face (z = 0) on the bed
  use_orientation: Bottom face (z = 0) clamped into tripod head, top face (z = 10.7)
    against camera base
hardware:
- id: webcam-mount-bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_mounting_joint
  fastener: webcam-mount-bolt
  axis_origin:
  - 0.0
  - 0.0
  - 5.2
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: qr_plate
    feature: bolt_pocket
    role: head_seat
  - part: qr_plate
    feature: clearance_slot
    role: clearance
  nut: null
  external: camera 1/4-20 tripod socket
criteria:
- id: tripod_clamp_dovetail
  part: qr_plate
  feature: dovetail_facet
  relation: engages
  hardware: null
  clearance_mm: 0.0
  params:
  - plate_width
  - dovetail_h
  - dovetail_angle
  check:
    method: measure
    ref: null
    description: 38 mm wide base with 45 degree angled facets engages the tripod clamp
      jaws without binding
- id: bolt_head_recess
  part: qr_plate
  feature: bolt_pocket
  relation: contains
  hardware: webcam-mount-bolt
  clearance_mm: 0.2
  params:
  - bolt_head_d
  - bolt_head_h
  - pocket_width
  - pocket_depth
  check:
    method: measure
    ref: null
    description: Recessed pocket holds the 15 mm diameter, 5 mm thick bolt head recessed
      by 0.2 mm below the clamp seating surface
- id: bolt_clearance_slot
  part: qr_plate
  feature: clearance_slot
  relation: clears
  hardware: webcam-mount-bolt
  clearance_mm: 0.45
  params:
  - camera_thread_d
  - screw_clearance_d
  - slot_travel
  check:
    method: measure
    ref: null
    description: 6.8 mm wide slot provides clearance for the 1/4-20 screw thread and
      12 mm of fore-aft adjustment
- id: camera_platform
  part: qr_plate
  feature: camera_seat
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - plate_thickness
  - plate_length
  check:
    method: measure
    ref: null
    description: Flat 29 mm x 45 mm top platform supports the camera base solidly
manual:
- n: '1'
  text: Print qr_plate in PLA with its bottom face flat on the build bed (z = 0).
    No supports are needed because the dovetail angles inward at 45 degrees and the
    ceiling bridges cleanly.
  parts:
  - qr_plate
  hardware: []
  tool: null
- n: '2'
  text: Take the salvaged 1/4"-20 webcam mount bolt and insert it from the underside
    of qr_plate up through the slot. The 15 mm head seats fully inside the bottom
    channel.
  parts:
  - qr_plate
  hardware:
  - webcam-mount-bolt
  tool: null
- n: '3'
  text: Hold the plate against the bottom of your camera with the protruding 1/4"-20
    thread aligned with the camera's tripod socket. Slide the plate along the slot
    to your preferred balance position (and to ensure the battery door is unblocked),
    then tighten the bolt firmly into the camera.
  parts:
  - qr_plate
  hardware:
  - webcam-mount-bolt
  tool: null
- n: '4'
  text: Turn the knob on your friend's tripod head clamp to open the jaws wide enough
    for the plate to drop in from above. Place the plate into the clamp, then tighten
    the knob firmly so the angled clamp jaws seat securely against the plate's 45°
    dovetail facets.
  parts:
  - qr_plate
  hardware: []
  tool: null
