  bolt_l:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: measured thread length under head of salvaged webcam bolt
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: measured diameter of salvaged webcam bolt head
  camera_thread_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: standard 1/4-20 major thread diameter
  plate_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: measured tripod clamp plate base width
  pocket_width:
    value: 17
    unit: mm
    kind: design
    source: design
    note: width of bolt head recess channel on underside
  camera_thread_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 thread pitch (20 TPI = 1.27 mm)
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: measured height of salvaged webcam bolt head
  screw_clearance_d:
    value: 6.8
    unit: mm
    kind: design
    source: design
