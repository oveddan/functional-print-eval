task: tripod-plate
note: ''
questions:
- text: What are the camera's base length and width, and where is its 1/4-20 socket?
    The plate is currently 60 mm long with the bolt centred.
  answer: null
- text: What is the camera's weight? PLA is only suitable for light cameras.
  answer: null
- text: What is the clamp's opening and how thick is the plate it grips? The plate
    may need a notch or a different thickness to match.
  answer: null
params:
  plate_w:
    value: 38
    unit: mm
    kind: world
    source: asked
    note: Width of the plate the tripod clamp takes. Clamp opening and plate thickness
      grip not measured.
  plate_l:
    value: 60
    unit: mm
    kind: design
    source: guessed
    note: Camera base length not measured. Adjust to the camera's base.
  plate_t:
    value: 8
    unit: mm
    kind: design
    source: design
    note: Gives a 3 mm roof over the head pocket and about 7 mm of stud above the
      plate top.
  head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Webcam bolt head, approximate.
  head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Webcam bolt head height, approximate.
  shank_l:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: Webcam bolt length under the head, approximate.
  pocket_d:
    value: 15.5
    unit: mm
    kind: design
    source: design
    note: Head clearance.
  hole_d:
    value: 6.6
    unit: mm
    kind: design
    source: design
    note: Clearance for 1/4-20 shank (6.35 mm).
parts:
- id: plate
  role: final
  material: PLA high-speed black
  code: "def build(p):\n    plate = cq.Workplane('XY').box(p.plate_l, p.plate_w, p.plate_t,\
    \ centered=(True, True, False))\n    pocket = cq.Workplane('XY').circle(p.pocket_d\
    \ / 2).extrude(p.head_h)\n    hole = cq.Workplane('XY').circle(p.hole_d / 2).extrude(p.plate_t)\n\
    \    return plate.cut(pocket).cut(hole)\n"
  print_orientation: bottom face (pocket opening) on the bed, z=0 at bed
  use_orientation: bottom face down on the tripod clamp, stud pointing up into camera
hardware:
- id: webcam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_stud
  fastener: webcam_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: pocket
    role: head_seat
  - part: plate
    feature: hole
    role: clearance
  nut: null
  external: null
criteria:
- id: head_pocket
  part: plate
  feature: head pocket, 15.5 mm dia x 5 mm deep, open at bottom
  relation: seats
  hardware: webcam_bolt
  clearance_mm: null
  params:
  - head_d
  - head_h
  - pocket_d
  check:
    method: measure
    ref: null
    description: Bolt head sits flush in the pocket without rocking.
- id: stud_clearance
  part: plate
  feature: 6.6 mm through-hole
  relation: clears
  hardware: webcam_bolt
  clearance_mm: null
  params:
  - hole_d
  check:
    method: measure
    ref: null
    description: Shank turns freely through the hole.
manual:
- n: '1'
  text: Print the plate flat, bottom face on the bed, no supports.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: 'Check the fit: the webcam bolt head should sit in the bottom pocket and the
    shank should pass through the hole.'
  parts:
  - plate
  hardware:
  - webcam_bolt
  tool: null
- n: '3'
  text: Insert the webcam bolt head-first from the bottom of the plate so the head
    sits in the pocket and the shank points up.
  parts:
  - plate
  hardware:
  - webcam_bolt
  tool: null
- n: '4'
  text: Clamp the plate in the tripod's quick-release clamp and check it holds before
    mounting the camera.
  parts:
  - plate
  hardware: []
  tool: null
- n: '5'
  text: Screw the camera onto the stud by its 1/4-20 socket, tightening only by hand.
    Do not overtighten; PLA can crack.
  parts: []
  hardware: []
  tool: null
