manual:
- n: '1'
  text: Print the plate flat, bottom face on the bed, with no supports.
  parts:
  - plate
  hardware: []
  tool: null
- n: '2'
  text: Push the salvaged 1/4-20 bolt up through the plate's hole from underneath
    so the head sits in the pocket.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '3'
  text: Screw the camera onto the threaded end that sticks up through the top of the
    plate. Hand-tighten only.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '4'
  text: Slide the plate into the tripod clamp from above and tighten the knob gently.
    Do not overtighten; PLA can crack.
  parts: []
  hardware: []
  tool: null
