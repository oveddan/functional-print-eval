task: tripod-plate
note: Temporary replacement. The plate length is guessed at 50 mm and the tripod-side
  fit is unverified. The webcam bolt is short (10 mm under the head), so camera engagement
  may be limited. PLA is not suited to long-term loads; use this only until the original
  plate turns up.
questions:
- text: Is the plate's full length 50 mm, or is it different?
  answer: null
- text: Does the tripod head clamp onto this plate's width (38 mm) and thickness?
  answer: null
- text: Does the camera have a 1/4-20 socket, and how deep is it?
  answer: null
params:
  plate_len:
    value: 50
    unit: mm
    kind: design
    source: guessed
    note: Plate length not measured. 50 mm keeps every bridge within the 50 mm limit.
      Confirm against the original plate.
  plate_w:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: Width of plate the tripod clamp takes, per measurement. Confirm this is
      the full plate width.
  plate_t:
    value: 10
    unit: mm
    kind: design
    source: design
    note: Thick enough to hold the webcam bolt head in a counterbore with shaft clearance
      above it.
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Webcam bolt head across, approximate.
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Webcam bolt head height, approximate.
  bolt_len:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: Webcam bolt length under the head, approximate.
  clear_d:
    value: 6.5
    unit: mm
    kind: design
    source: design
    note: Clearance for the bolt shank (1/4 inch is about 6.35 mm).
  cb_d:
    value: 15.5
    unit: mm
    kind: design
    source: design
    note: Counterbore diameter, a small clearance over the head.
  cb_depth:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: 'Counterbore depth: head height plus a small clearance.'
parts:
- id: plate
  role: final
  material: PLA
  code: "def build(p):\n    plate = cq.Workplane('XY').box(p.plate_len, p.plate_w,\
    \ p.plate_t, centered=(True, True, False))\n    plate = plate.faces('>Z').workplane().hole(p.clear_d)\n\
    \    cb = cq.Workplane('XY').circle(p.cb_d / 2).extrude(p.cb_depth)\n    return\
    \ plate.cut(cb)"
  print_orientation: bottom face down (counterbore opening on the bed)
  use_orientation: flat on the tripod head, bolt head down in the counterbore, threaded
    shank up into the camera
hardware:
- id: webcam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_screw
  fastener: webcam_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: counterbore
    role: head_seat
  nut: null
  external: null
criteria: []
manual:
- n: '1'
  text: Print the plate with the bottom face on the bed. Remove any stringing from
    the counterbore.
  parts:
  - plate
  hardware: []
  tool: null
- n: '2'
  text: Drop the webcam bolt head-first into the counterbore from the bottom of the
    plate, so the head sits inside and the threaded shank points up through the hole.
  parts:
  - plate
  hardware:
  - webcam_bolt
  tool: null
- n: '3'
  text: Screw the camera onto the shank's exposed threads, or thread it into the camera's
    1/4-20 socket. Confirm the camera is secure before mounting.
  parts: []
  hardware:
  - webcam_bolt
  tool: null
- n: '4'
  text: Clamp the plate in the tripod head as you would the original plate, and check
    that it grips without rocking.
  parts: []
  hardware: []
  tool: null
