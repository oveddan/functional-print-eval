parts:
- id: qr_plate
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    w = p.clamp_width\n    l = p.plate_length\n\
    \    h = p.plate_h\n    base_h = p.dovetail_base_h\n    bevel_h = p.dovetail_bevel_h\n\
    \    cbore_h = h - p.web_t\n\n    # Printed with camera-contact face on the bed\
    \ (z = 0) and counterbore facing UP (+Z).\n    narrow_w = w - 2.0 * bevel_h /\
    \ math.tan(math.radians(p.dovetail_angle))\n    z_bevel_start = h - base_h - bevel_h\n\
    \    z_bevel_end = h - base_h\n\n    pts = [\n        (-narrow_w / 2.0, 0.0),\n\
    \        (narrow_w / 2.0, 0.0),\n        (narrow_w / 2.0, z_bevel_start),\n  \
    \      (w / 2.0, z_bevel_end),\n        (w / 2.0, h),\n        (-w / 2.0, h),\n\
    \        (-w / 2.0, z_bevel_end),\n        (-narrow_w / 2.0, z_bevel_start),\n\
    \    ]\n\n    body = (\n        cq.Workplane(\"XZ\")\n        .polyline(pts)\n\
    \        .close()\n        .extrude(l / 2.0, both=True)\n    )\n\n    # Center\
    \ clearance through-hole for the 1/4-20 bolt shaft\n    body = (\n        body.faces(\"\
    >Z\")\n        .workplane()\n        .hole(p.bolt_clear_d)\n    )\n\n    # Upward-facing\
    \ counterbore for the bolt head (prints cleanly without bridges)\n    body = (\n\
    \        body.faces(\">Z\")\n        .workplane()\n        .circle(p.bolt_head_clear_d\
    \ / 2.0)\n        .cutBlind(-cbore_h)\n    )\n\n    return body\n"
  print_orientation: Camera-contact face on the print bed (z = 0), with the bolt counterbore
    facing up (+Z) and 45-degree dovetail bevels flaring outward without supports
  use_orientation: Flipped over so z = plate_h sits at the bottom of the tripod clamp
    jaws and z = 0 faces up against the bottom of the camera
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    w = p.clamp_width\n    l = p.coupon_length\n\
    \    h = p.plate_h\n    base_h = p.dovetail_base_h\n    bevel_h = p.dovetail_bevel_h\n\
    \    cbore_h = h - p.web_t\n\n    narrow_w = w - 2.0 * bevel_h / math.tan(math.radians(p.dovetail_angle))\n\
    \    z_bevel_start = h - base_h - bevel_h\n    z_bevel_end = h - base_h\n\n  \
    \  pts = [\n        (-narrow_w / 2.0, 0.0),\n        (narrow_w / 2.0, 0.0),\n\
    \        (narrow_w / 2.0, z_bevel_start),\n        (w / 2.0, z_bevel_end),\n \
    \       (w / 2.0, h),\n        (-w / 2.0, h),\n        (-w / 2.0, z_bevel_end),\n\
    \        (-narrow_w / 2.0, z_bevel_start),\n    ]\n\n    body = (\n        cq.Workplane(\"\
    XZ\")\n        .polyline(pts)\n        .close()\n        .extrude(l / 2.0, both=True)\n\
    \    )\n\n    body = (\n        body.faces(\">Z\")\n        .workplane()\n   \
    \     .hole(p.bolt_clear_d)\n    )\n\n    body = (\n        body.faces(\">Z\"\
    )\n        .workplane()\n        .circle(p.bolt_head_clear_d / 2.0)\n        .cutBlind(-cbore_h)\n\
    \    )\n\n    return body\n"
  print_orientation: Camera-contact face on the print bed (z = 0), with the bolt counterbore
    facing up (+Z)
  use_orientation: Flipped over so z = plate_h sits at the bottom of the tripod clamp
    jaws and z = 0 faces up against the bottom of the camera
hardware:
- id: webcam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_mount_joint
  fastener: webcam_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 5.3
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: qr_plate
    feature: counterbore seat at z = web_t
    role: head_seat
  - part: qr_plate
    feature: center 1/4-20 shaft clearance hole
    role: clearance
  nut: null
  external: camera 1/4-20 tripod socket
criteria:
- id: clamp_dovetail_engagement
  part: qr_plate
  feature: 38 mm 45-degree Arca-Swiss dovetail rails
  relation: engages
  hardware: null
  clearance_mm: 0.0
  params:
  - clamp_width
  - dovetail_angle
  - dovetail_base_h
  - dovetail_bevel_h
  check:
    method: coupon
    ref: fit_coupon
    description: Slide or drop the test coupon into the open tripod clamp jaws and
      tighten the knob to verify the 38 mm 45-degree dovetail seats and locks securely.
- id: bolt_head_seating
  part: qr_plate
  feature: Bolt head counterbore pocket and flat seat at z = web_t
  relation: seats
  hardware: webcam_bolt
  clearance_mm: 0.6
  params:
  - bolt_head_d
  - bolt_head_clear_d
  - web_t
  - plate_h
  check:
    method: coupon
    ref: fit_coupon
    description: Insert the salvaged 1/4-20 webcam bolt into the counterbore of the
      coupon to verify the head drops in freely and sits flat on the internal seat.
- id: bolt_head_recess_clears_clamp
  part: qr_plate
  feature: Counterbore depth (plate_h - web_t = 5.2 mm)
  relation: contains
  hardware: webcam_bolt
  clearance_mm: 0.2
  params:
  - bolt_head_h
  - plate_h
  - web_t
  check:
    method: coupon
    ref: fit_coupon
    description: Verify that the 5 mm tall bolt head sits slightly recessed below
      the clamp-facing bottom surface of the plate so it does not rub on the clamp
      floor.
- id: bolt_shaft_clearance
  part: qr_plate
  feature: Center through-hole (6.8 mm diameter)
  relation: clears
  hardware: webcam_bolt
  clearance_mm: 0.225
  params:
  - bolt_d
  - bolt_clear_d
  check:
    method: coupon
    ref: fit_coupon
    description: Pass the 1/4-20 threaded shaft through the center bore to confirm
      smooth clearance without binding on the threads.
- id: camera_socket_engagement
  part: qr_plate
  feature: Camera-contact face (z = 0) and web thickness (web_t = 5.3 mm)
  relation: faces
  hardware: webcam_bolt
  clearance_mm: 0.3
  params:
  - bolt_length
  - web_t
  - camera_socket_depth
  check:
    method: coupon
    ref: fit_coupon
    description: Thread the protruding ~4.7 mm of the 1/4-20 bolt into the camera
      socket using the coupon first to confirm it pulls the plate snug against the
      camera base without bottoming out early.
manual:
- n: '1'
  text: Print the short test coupon (fit_coupon) first with its flat camera-contact
    face on the build plate (no supports needed). Drop the coupon into the tripod
    clamp jaws and tighten the knob to verify the 38 mm dovetail locks tightly, then
    insert the salvaged 1/4"-20 webcam mount bolt into the pocket and test-thread
    it into the bottom of your camera to confirm the head fits and the plate snugs
    securely against the camera base.
  parts:
  - fit_coupon
  hardware:
  - webcam_bolt
  tool: null
- n: '2'
  text: Once the fit is confirmed, print the full-size quick-release plate (qr_plate)
    in black PLA with z = 0 (the narrower camera-contact face) on the print bed and
    the counterbore facing up. Use at least 4 perimeter walls and 40% infill for strength.
  parts:
  - qr_plate
  hardware: []
  tool: null
- n: '3'
  text: Flip the printed qr_plate over into its use orientation (counterbore on the
    underside, flat camera face pointing up). Push the salvaged 1/4"-20 webcam mount
    bolt up through the bottom counterbore and center hole, thread it into the camera's
    1/4"-20 tripod socket, and tighten it firmly by hand.
  parts:
  - qr_plate
  hardware:
  - webcam_bolt
  tool: null
- n: '4'
  text: Open the tripod clamp jaws with the side knob, drop the plate (with the camera
    attached) straight down into the 38 mm angled jaws, and tighten the clamp knob
    until the jaws lock firmly onto the 45-degree dovetail bevels.
  parts:
  - qr_plate
  hardware:
  - webcam_bolt
  tool: null
