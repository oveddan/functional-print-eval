task: tripod-plate
note: The flat quick-release plate is 3D-printed as a 38 mm Arca-Swiss dovetail plate,
  printed upside-down (camera face on the bed, bolt counterbore facing up) so the
  counterbore prints cleanly without any mid-air bridges or supports. Rather than
  3D-printing a plastic 1/4"-20 screw—which has a small ~4.9 mm minor diameter that
  can easily shear off across layer lines and leave a broken plastic stub stuck inside
  the camera's tripod socket—this design uses your salvaged metal 1/4"-20 webcam mount
  bolt recessed into the underside of the plate.
questions:
- text: How hard would it be to 3D print it, both the flat part and the part that
    screws in? Just as a temporary thing until I find the real one.
  answer: '3D printing the flat quick-release plate works very well as a temporary
    replacement because your tripod uses a 38 mm Arca-Swiss style jaw clamp, which
    loads the plate primarily in compression. However, you should NOT 3D print the
    1/4"-20 camera screw itself in PLA: a printed 1/4"-20 bolt has a minor diameter
    of under 5 mm and can easily snap across its layer lines when tightened or bumped,
    leaving a broken plastic stub trapped inside your camera''s threaded socket. Instead,
    this design uses your salvaged metal 1/4"-20 webcam mount bolt recessed into a
    counterbore on the underside of the printed plate.'
params:
  plate_length:
    value: 50
    unit: mm
    kind: design
    source: design
    note: Full quick-release plate length along the clamp jaws
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Measured diameter across the salvaged webcam bolt head
  clamp_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: Measured width of the tripod clamp plate (38 mm Arca-Swiss standard)
  plate_h:
    value: 10.5
    unit: mm
    kind: design
    source: design
    note: Total plate height (5.3 mm web + 5.2 mm counterbore depth)
  camera_socket_depth:
    value: 5
    unit: mm
    kind: world
    source: guessed
    note: Standard usable thread depth of a 1/4-20 camera tripod socket (~5 mm)
  bolt_clear_d:
    value: 6.8
    unit: mm
    kind: design
    source: design
    note: Clearance hole diameter for the 1/4-20 bolt shaft
  bolt_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal outer diameter of 1/4-20 thread (6.35 mm)
  dovetail_base_h:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Vertical lip height at the widest 38 mm base of the dovetail
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Measured height of the salvaged webcam bolt head
  bolt_length:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: Measured shaft length under the head of the salvaged webcam bolt
  dovetail_angle:
    value: 45
    unit: deg
    kind: design
    source: design
    note: Standard 45-degree bevel angle for 38 mm quick-release clamp jaws
  bolt_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: catalog
    note: Thread pitch of 1/4-20 fastener from hardware catalog
  bolt_head_clear_d:
    value: 16.2
    unit: mm
    kind: design
    source: design
    note: Counterbore diameter with clearance for the ~15 mm webcam bolt head
  web_t:
    value: 5.3
    unit: mm
    kind: design
    source: design
    note: Web thickness under the bolt head, leaving 4.7 mm of bolt shaft protrusion
