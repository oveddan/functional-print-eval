task: tripod-plate
note: Instead of a 3D-printed plastic 1/4"-20 screw (which can easily shear off along
  layer lines inside your camera's tripod socket), this design uses your salvaged
  metal 1/4"-20 webcam mount bolt (`salvaged:webcam-mount-bolt`) recessed inside a
  38 mm Arca-Swiss style dovetail quick-release plate. The plate is oriented upside-down
  on the print bed (camera-facing surface on z=0, counterbore opening upward) so the
  bolt pocket prints cleanly with zero mid-air bridging over the hole and the 45-degree
  dovetail bevels are self-supporting.
questions:
- text: What width plate does the tripod clamp take, and what are the dimensions of
    the 1/4"-20 bolt?
  answer: 38 mm clamp width (Arca-Swiss standard) and 1/4"-20 camera socket thread;
    salvaged 1/4"-20 bolt is ~10 mm long under the head with a ~15 mm x 5 mm head.
params:
  corner_fillet:
    value: 2
    unit: mm
    kind: design
    source: design
    note: End corner chamfer/fillet in XY to ease insertion into clamp jaws
  dovetail_h:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: Height of the 45-degree dovetail bevels
  head_clearance:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Radial clearance for bolt head counterbore (plus finger/tool room)
  lip_h:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Vertical lip height at the 38 mm widest edge of the dovetail
  shaft_clearance:
    value: 0.65
    unit: mm
    kind: design
    source: design
    note: Diametral clearance for 1/4-20 bolt shaft
  web_t:
    value: 5
    unit: mm
    kind: design
    source: design
    note: Thickness of clamped web under bolt head (leaves 10 - 5 = 5 mm of thread
      protrusion into camera)
  clamp_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: Tripod clamp plate width (Arca-Swiss 38 mm standard)
  bolt_thread_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 thread pitch
  plate_h:
    value: 10.5
    unit: mm
    kind: design
    source: design
    note: Total thickness of the quick-release plate (exceeds bolt head 5 mm + web
      5 mm)
  plate_length:
    value: 50
    unit: mm
    kind: design
    source: design
    note: Overall length of the quick-release plate along the clamp jaws
  coupon_length:
    value: 26
    unit: mm
    kind: design
    source: design
    note: Length of test coupon slice
  bolt_length:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: Salvaged 1/4-20 webcam mount bolt length under head
  bolt_thread_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 major diameter (6.35 mm)
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Salvaged 1/4-20 webcam mount bolt head height
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Salvaged 1/4-20 webcam mount bolt head diameter
parts:
- id: tripod_qr_plate
  role: final
  material: PLA
  code: "def build(p):\n    # Printed upside-down: camera contact face on the print\
    \ bed (z = 0) and bottom of the plate at z = plate_h.\n    # This places the bolt\
    \ counterbore on the top face (z = web_t to z = plate_h), eliminating any bridged\
    \ hole!\n    # The dovetail slopes outward at 45 degrees from z = plate_h - lip_h\
    \ - dovetail_h to z = plate_h - lip_h.\n    w_base = p.clamp_width\n    h_total\
    \ = p.plate_h\n    h_dt = p.dovetail_h\n    h_lip = p.lip_h\n    w_top = w_base\
    \ - 2.0 * h_dt\n    \n    pts = [\n        (-w_top / 2.0, 0.0),\n        (w_top\
    \ / 2.0, 0.0),\n        (w_top / 2.0, h_total - h_lip - h_dt),\n        (w_base\
    \ / 2.0, h_total - h_lip),\n        (w_base / 2.0, h_total),\n        (-w_base\
    \ / 2.0, h_total),\n        (-w_base / 2.0, h_total - h_lip),\n        (-w_top\
    \ / 2.0, h_total - h_lip - h_dt),\n    ]\n    \n    body = (\n        cq.Workplane(\"\
    YZ\")\n        .polyline(pts)\n        .close()\n        .extrude(p.plate_length)\n\
    \        .translate((-p.plate_length / 2.0, 0, 0))\n    )\n    \n    # Chamfer\
    \ the vertical corner edges slightly so the plate slides smoothly into the clamp\n\
    \    body = body.edges(\"|Z\").chamfer(p.corner_fillet)\n    \n    shaft_d = p.bolt_thread_d\
    \ + p.shaft_clearance\n    head_d = p.bolt_head_d + 2.0 * p.head_clearance\n \
    \   cbore_depth = h_total - p.web_t\n    \n    # Counterbore and through-hole\
    \ from the top face (z = h_total) going down\n    body = (\n        body.faces(\"\
    >Z\")\n        .workplane()\n        .cboreHole(shaft_d, head_d, cbore_depth)\n\
    \    )\n    \n    return body\n"
  print_orientation: Camera contact face flat on the build plate (z=0), bolt counterbore
    opening upward (toward z=plate_h) so no bridging over the hole is needed and the
    45-degree dovetail flanks print cleanly without supports.
  use_orientation: 'Flipped upside down from print orientation: the flat z=0 face
    meets the underside of the camera, and the 38 mm dovetail base (z=plate_h) seats
    into the tripod clamp jaws with the bolt head recessed inside the underside counterbore.'
- id: coupon_plate_upside_down
  role: coupon
  material: PLA
  code: "def build(p):\n    w_base = p.clamp_width\n    h_total = p.plate_h\n    h_dt\
    \ = p.dovetail_h\n    h_lip = p.lip_h\n    w_top = w_base - 2.0 * h_dt\n    \n\
    \    pts = [\n        (-w_top / 2.0, 0.0),\n        (w_top / 2.0, 0.0),\n    \
    \    (w_top / 2.0, h_total - h_lip - h_dt),\n        (w_base / 2.0, h_total -\
    \ h_lip),\n        (w_base / 2.0, h_total),\n        (-w_base / 2.0, h_total),\n\
    \        (-w_base / 2.0, h_total - h_lip),\n        (-w_top / 2.0, h_total - h_lip\
    \ - h_dt),\n    ]\n    \n    body = (\n        cq.Workplane(\"YZ\")\n        .polyline(pts)\n\
    \        .close()\n        .extrude(p.coupon_length)\n        .translate((-p.coupon_length\
    \ / 2.0, 0, 0))\n    )\n    \n    shaft_d = p.bolt_thread_d + p.shaft_clearance\n\
    \    head_d = p.bolt_head_d + 2.0 * p.head_clearance\n    cbore_depth = h_total\
    \ - p.web_t\n    \n    body = (\n        body.faces(\">Z\")\n        .workplane()\n\
    \        .cboreHole(shaft_d, head_d, cbore_depth)\n    )\n    \n    return body\n"
  print_orientation: Camera contact face flat on bed (z=0), bolt counterbore facing
    up (z=plate_h) so there is zero bridging
  use_orientation: 'Flipped upside down from print orientation: z=0 face against camera
    bottom, 38mm dovetail base (z=plate_h) seated in tripod clamp jaws'
hardware:
- id: camera_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_mount_joint
  fastener: camera_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 5.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: tripod_qr_plate
    feature: bolt_counterbore_and_hole
    role: head_seat
  - part: tripod_qr_plate
    feature: bolt_counterbore_and_hole
    role: clearance
  nut: null
  external: camera 1/4-20 tripod socket
criteria:
- id: clamp_engagement
  part: tripod_qr_plate
  feature: dovetail_flanks
  relation: engages
  hardware: null
  clearance_mm: 0.0
  params:
  - clamp_width
  - dovetail_h
  - lip_h
  - plate_h
  check:
    method: coupon
    ref: coupon_plate_upside_down
    description: The 38 mm Arca-Swiss dovetail base seats cleanly and locks securely
      in the 38 mm tripod clamp jaws.
- id: camera_seat
  part: tripod_qr_plate
  feature: camera_contact_face
  relation: supports
  hardware: null
  clearance_mm: 0.0
  params:
  - clamp_width
  - dovetail_h
  - plate_length
  check:
    method: coupon
    ref: coupon_plate_upside_down
    description: The flat camera mounting face (printed on z=0) sits flush against
      the bottom of the camera around the 1/4-20 socket.
- id: bolt_seat_and_protrusion
  part: tripod_qr_plate
  feature: bolt_counterbore_and_hole
  relation: seats
  hardware: camera_bolt
  clearance_mm: 0.65
  params:
  - bolt_head_d
  - bolt_head_h
  - bolt_length
  - bolt_thread_d
  - head_clearance
  - shaft_clearance
  - web_t
  - plate_h
  check:
    method: coupon
    ref: coupon_plate_upside_down
    description: The salvaged 1/4-20 webcam mount bolt head seats fully inside the
      upward-printed counterbore recess without protruding beyond the base of the
      plate, while its threaded shaft passes through the 7.0 mm center bore and protrudes
      5.0 mm to engage the camera's 1/4-20 socket.
manual:
- n: '1'
  text: Test-fit the printed coupon (coupon_plate_upside_down) into your tripod's
    38 mm clamp jaws and insert the salvaged 1/4"-20 webcam mount bolt (camera_bolt)
    into its counterbore to verify clamp grip and thread protrusion into the camera
    socket before printing the full plate.
  parts:
  - coupon_plate_upside_down
  hardware:
  - camera_bolt
  tool: null
- n: '2'
  text: Flip the printed quick-release plate (tripod_qr_plate) so the flat bed-side
    face points up toward your camera and the counterbore pocket faces down. Drop
    the salvaged 1/4"-20 bolt (camera_bolt) into the underside counterbore pocket
    so the threaded shaft sticks up through the center hole.
  parts:
  - tripod_qr_plate
  hardware:
  - camera_bolt
  tool: null
- n: '3'
  text: Hold the plate against the bottom of your camera and thread the 1/4"-20 bolt
    (camera_bolt) into the camera's tripod socket until snug.
  parts:
  - tripod_qr_plate
  hardware:
  - camera_bolt
  tool: fingers / coin or screwdriver (depending on bolt head style)
- n: '4'
  text: Slide or drop the 38 mm dovetail base of the plate (tripod_qr_plate) into
    the tripod head clamp and tighten the clamp lock securely. Always support the
    camera with your hand while checking that the clamp is locked.
  parts:
  - tripod_qr_plate
  hardware: []
  tool: null
