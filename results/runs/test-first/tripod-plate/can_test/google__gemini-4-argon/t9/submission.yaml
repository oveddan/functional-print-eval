task: tripod-plate
note: Printing the flat quick-release plate (38 mm Arca-Swiss style dovetail) in PLA
  works well as a temporary replacement because the clamp jaws load the plate primarily
  in compression. However, 3D printing the 1/4-20 camera screw itself in PLA is not
  recommended—a printed 1/4-20 thread is loaded in tension across layer lines and
  can easily shear off flush inside your camera's tripod socket. Instead, this design
  uses your salvaged metal 1/4-20 webcam-mount bolt (15 mm head diameter, 5 mm head
  height, 10 mm shaft length), recessed 5.5 mm into the bottom of the plate with a
  5 mm thick web so 5 mm of metal thread protrudes into the camera socket.
questions:
- text: How hard would it be to 3D print it, both the flat part and the part that
    screws in? Just as a temporary thing until I find the real one. I know it's metal
    normally.
  answer: Printing the flat quick-release plate in PLA is easy and holds up well for
    temporary use because the tripod clamp jaws squeeze it in compression. However,
    3D printing the 1/4"-20 screw in PLA is risky—a narrow printed screw is loaded
    in tension across its layer lines and can snap off flush inside your camera's
    threaded socket. Instead, this design uses your salvaged metal 1/4"-20 bolt from
    the webcam monitor mount (15 mm head, 10 mm shaft), recessed into the underside
    of the printed 38 mm dovetail plate so 5 mm of metal thread protrudes into the
    camera.
