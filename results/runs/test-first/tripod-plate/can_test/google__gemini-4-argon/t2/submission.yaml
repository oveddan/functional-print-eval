    description: 6.8 mm through-hole clears the 6.35 mm (1/4-20) bolt shaft
- id: camera_thread_engagement
  part: qr_plate
  feature: camera_mounting_face
  relation: faces
  hardware: webcam_bolt
  clearance_mm: null
  params:
  - bolt_length
  - floor_t
  check:
    method: measure
    ref: null
    description: 5.0 mm web thickness under the bolt head leaves 5.0 mm of the 10
      mm bolt shaft protruding above the camera-mounting face to thread into the camera's
      1/4-20 socket
manual:
- n: '1'
  text: 'Print the quick-release plate (qr_plate) in PLA with its narrower flat camera-mounting
    face on the print bed (Z = 0) and the bolt counterbore facing upward. No supports
    are needed: the counterbore shelf faces upward so there is no bridging over a
    hole, and the 45-degree dovetail bevels print cleanly as a 45-degree overhang.
    Use at least 4 wall loops and 40% infill for clamping strength.'
  parts:
  - qr_plate
  hardware: []
  tool: null
- n: '2'
  text: Drop the salvaged 1/4"-20 webcam mount bolt (webcam_bolt) into the counterbore
    pocket on the wide underside of the plate so that ~5 mm of thread protrudes from
    the flat camera-mounting face and the 5 mm bolt head sits slightly recessed inside
    the pocket.
  parts:
  - qr_plate
  hardware:
  - webcam_bolt
  tool: null
- n: '3'
  text: Thread the protruding 1/4"-20 bolt into the tripod socket on the bottom of
    your camera and snug it down by hand.
  parts:
  - qr_plate
  hardware:
  - webcam_bolt
  tool: null
- n: '4'
  text: Loosen the tripod clamp knob, drop the 38 mm dovetail plate into the clamp
    jaws from above, and tighten the clamp knob until the angled jaw lips firmly grip
    the 45-degree bevels of the plate.
  parts:
  - qr_plate
  hardware:
  - webcam_bolt
  tool: null
