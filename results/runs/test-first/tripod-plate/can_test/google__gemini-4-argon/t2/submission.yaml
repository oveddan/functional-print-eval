  bolt_clearance_d:
    value: 6.8
    unit: mm
    kind: design
    source: design
    note: Through-hole diameter for the 1/4-20 bolt shaft
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Measured head diameter across of the salvaged webcam-mount-bolt
parts:
- id: qr_plate
  role: final
  material: PLA
  code: "def build(p):\n    # Modeled in print orientation:\n    # Z = 0 is the flat\
    \ camera-mounting face on the print bed.\n    # Z = plate_h is the bottom face\
    \ that sits in the tripod clamp.\n    # Dovetail flares outward at 45 deg from\
    \ w_min to plate_w (45 deg overhang, no supports),\n    # and the bolt head counterbore\
    \ opens upward (+Z) so the seat prints cleanly with zero bridging.\n    w_max\
    \ = p.plate_w\n    h_dt = p.dovetail_h\n    h_rim = p.rim_h\n    h_tot = p.plate_h\n\
    \    h_neck = h_tot - h_rim - h_dt\n    w_min = w_max - 2.0 * h_dt\n\n    pts\
    \ = [\n        (-w_min / 2.0, 0.0),\n        (w_min / 2.0, 0.0),\n        (w_min\
    \ / 2.0, h_neck),\n        (w_max / 2.0, h_neck + h_dt),\n        (w_max / 2.0,\
    \ h_tot),\n        (-w_max / 2.0, h_tot),\n        (-w_max / 2.0, h_neck + h_dt),\n\
    \        (-w_min / 2.0, h_neck),\n    ]\n    body = (\n        cq.Workplane(\"\
    XZ\")\n        .polyline(pts)\n        .close()\n        .extrude(p.plate_l /\
    \ 2.0, both=True)\n    )\n    # Through-hole for the 1/4-20 bolt shaft\n    body\
    \ = (\n        body.faces(\">Z\")\n        .workplane()\n        .hole(p.bolt_clearance_d)\n\
    \    )\n    # Upward-opening counterbore for the bolt head (seat at Z = floor_t)\n\
    \    cb_depth = h_tot - p.floor_t\n    body = (\n        body.faces(\">Z\")\n\
    \        .workplane()\n        .circle(p.bolt_head_pocket_d / 2.0)\n        .cutBlind(-cb_depth)\n\
    \    )\n    return body\n"
  print_orientation: Camera-mounting face on the bed (Z = 0); bolt head counterbore
    opens upward (+Z) so no roof is bridged over the hole; 45-degree dovetail bevels
    flare outward within the supportless overhang limit.
  use_orientation: 'Flipped upside down in use: Z = 0 presses against the base of
    the camera with 5 mm of the 1/4-20 bolt protruding upward, and Z = plate_h (38
    mm wide dovetail) drops into the tripod clamp jaws from above.'
