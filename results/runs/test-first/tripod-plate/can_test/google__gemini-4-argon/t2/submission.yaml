task: tripod-plate
note: Printing the flat 38 mm dovetail quick-release plate in PLA works well, and
  printing it upside down (camera-facing surface on Z = 0, counterbore opening upward)
  avoids printing a floating hole roof over the bolt pocket. Rather than 3D-printing
  a plastic 1/4"-20 screw—which is only ~5 mm at the root and can easily shear off
  inside your camera's threaded socket—this design uses your salvaged 1/4"-20 webcam
  mount bolt (15 mm head diameter, 5 mm head height, 10 mm shaft under head). The
  5 mm web thickness leaves 5 mm of metal thread protruding into the camera socket
  while recessing the 5 mm bolt head by 0.5 mm inside the 10.5 mm thick plate.
questions: []
