task: tripod-plate
note: FIT-CHECK GAUGE ONLY — no camera-mounting plate or printed screw is approved
  by this design. A 38 mm plate width does not establish the dovetail geometry, and
  the printed test's fit was not reported. The gauge intentionally has no camera screw
  hole. Do not mount a camera or other valuable equipment on it. A future temporary
  PLA plate would require verified jaw contact, load information, camera underside
  geometry and screw engagement; the salvaged metal 1/4-20 bolt may be usable after
  checking those dimensions. Do not substitute a printed camera screw.
questions:
- text: What are the receiver lip angle, engagement height and widths at lip tips
    and floor?
  answer: null
- text: Does the gauge sit on the receiver floor, contact both angled jaw faces securely
    and resist rocking and lifting without excessive knob force?
  answer: Gauge printed, but no fit assessment available.
- text: What camera and lens, or total mounted weight, will be supported?
  answer: null
- text: What are the camera socket's usable threaded depth and permitted screw engagement,
    and is the underside flat around it?
  answer: null
- text: Does the salvaged bolt have an accessible tool drive, and what are its accurately
    measured under-head length and head dimensions?
  answer: Approximately 10 mm under-head length, 15 mm head across and 5 mm head height
    reported; drive not confirmed.
params:
  plate_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: User-reported accepted plate width; actual jaw geometry remains unverified.
  test_length:
    value: 32
    unit: mm
    kind: design
    source: design
    note: ''
  profile_height:
    value: 4
    unit: mm
    kind: design
    source: guessed
    note: Unverified trial dovetail profile, not a measured tripod dimension.
  flank_angle:
    value: 45
    unit: deg
    kind: design
    source: guessed
    note: Unverified trial angle above horizontal.
  grip_width:
    value: 26
    unit: mm
    kind: design
    source: design
    note: ''
  grip_height:
    value: 4
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: dovetail_fit_gauge
  role: coupon
  material: PLA
  code: "def build(p):\n    import math\n    w = p.plate_width\n    h = p.profile_height\n\
    \    top = w - 2*h/math.tan(math.radians(p.flank_angle))\n    body = cq.Workplane('XZ').polyline([(-w/2,0),(w/2,0),(top/2,h),(-top/2,h)]).close().extrude(p.test_length/2,both=True)\n\
    \    grip = cq.Workplane('XY').box(p.grip_width,p.test_length,p.grip_height,centered=(True,True,False)).translate((0,0,h))\n\
    \    return body.union(grip)"
  print_orientation: Wide flat face on bed at z=0. Narrowing flanks and smaller upper
    grip print without supports.
  use_orientation: 'Fit checking only: wide face toward tripod clamp floor, angled
    sides toward jaws, raised grip upward. Never attach a camera.'
hardware: []
joints: []
criteria:
- id: profile_verification
  part: dovetail_fit_gauge
  feature: Wide bottom face and both angled side faces
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - plate_width
  - profile_height
  - flank_angle
  check:
    method: coupon
    ref: dovetail_fit_gauge
    description: UNVERIFIED. With no camera, check bottom seating, contact on both
      angled flanks, adequate lip overlap, and absence of rocking or lifting under
      gentle hand force. Fit alone does not qualify a future plate for supporting
      a camera.
manual:
- n: '1'
  text: Use the already printed dovetail_fit_gauge, or print it in PLA at 0.2 mm layers
    with its wide face on the bed, 4 walls and 30% infill. No supports. This is only
    a geometry gauge.
  parts:
  - dovetail_fit_gauge
  hardware: []
  tool: null
- n: '2'
  text: Remove the camera from the tripod area. Open the receiver jaws, place the
    gauge's wide face toward the floor, and close the knob gently. Stop if it interferes,
    sits tilted or requires force. Do not modify the borrowed tripod.
  parts:
  - dovetail_fit_gauge
  hardware: []
  tool: null
- n: '3'
  text: Check whether the bottom seats and both angled faces engage beneath the lips.
    Look for rocking, lifting and edge-only contact. Remove the gauge after testing.
    Record results and measure the receiver profile; the assumed 45-degree, 4 mm-high
    profile is not established as correct.
  parts:
  - dovetail_fit_gauge
  hardware: []
  tool: null
- n: '4'
  text: Do not drill the gauge, attach a camera, or treat it as a finished quick-release
    plate. Before designing a load-bearing replacement, obtain the missing receiver
    geometry, camera/lens weight, camera underside details and safe screw engagement.
    Retain the metal webcam bolt for possible later use; do not print a replacement
    screw.
  parts:
  - dovetail_fit_gauge
  hardware: []
  tool: null
