task: tripod-plate
note: Prototype only—not approved to support a camera. Printing the flat quick-release
  plate is feasible; printing the camera screw is not recommended. Use the existing
  metal 1/4-20 webcam bolt. A 38 mm width does not prove an Arca-compatible jaw profile.
  The candidate dovetail was printed as a coupon, but no usable fit result was reported.
  Clamp fit, head/tool access, camera base contact, and allowed screw insertion remain
  unverified. Prefer the tripod manufacturer's replacement plate. No printed safety
  stop or anti-rotation pin is provided.
questions:
- text: Does the tripod positively retain the candidate dovetail on both angled faces
    without bottoming the clamp adjustment?
  answer: Unknown; coupon printed but no fit assessment available.
- text: What is the camera manufacturer's allowed screw insertion range?
  answer: Unknown. Do not attach the camera until established.
- text: What are the camera/lens weight, base geometry, and tripod model?
  answer: Not provided.
