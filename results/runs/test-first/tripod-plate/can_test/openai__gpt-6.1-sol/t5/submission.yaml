task: tripod-plate
note: 'Fit-test-only handoff, not a load-bearing camera plate. A printable replacement
  may be feasible, but the reported 38 mm width does not establish the dovetail profile
  or secure capture. The user printed trial bars but could not report their fit. Do
  not attach a camera to these pieces. Do not print a camera screw. The available
  metal webcam bolt is a potential future option only: measured approximately 15 mm
  head diameter, 5 mm head height and 10 mm under-head length, but camera socket depth
  and actual thread engagement remain unverified. A matching commercial plate with
  metal screw is the safer immediate solution.'
questions:
- text: Which trial width seats flat, is captured beneath both jaw lips, and locks
    without rocking or lifting?
  answer: null
- text: What are the actual jaw engagement height, rail angle, rail length, and tripod
    brand/model?
  answer: null
- text: What is the camera socket's usable depth, and does the salvaged metal bolt
    thread in freely by hand?
  answer: null
- text: What is the camera's flat supporting footprint around the socket, and are
    there locating-pin or anti-rotation requirements?
  answer: null
