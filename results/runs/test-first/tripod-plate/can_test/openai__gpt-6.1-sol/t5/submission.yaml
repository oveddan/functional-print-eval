- id: rail_capture
  part: rail_fit_trials
  feature: Trial angled side faces
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - nominal_width
  - rail_height_trial
  - rail_angle_trial
  - width_step
  check:
    method: coupon
    ref: rail_fit_trials
    description: Unverified. Without a camera, check seating, bilateral capture beneath
      jaw lips, and absence of rocking or lift under gentle hand force with the clamp
      hand-tight. Passing this check alone does not certify a loaded camera plate.
manual:
- n: '1'
  text: Use the existing test prints; no need to reprint unless damaged or lost. If
    printing again, use 0.2 mm layers, four walls, and solid infill. Print broad faces
    down without supports.
  parts:
  - rail_fit_trials
  hardware: []
  tool: null
- n: '2'
  text: 'Identify the bars by their broad-face width: 37.6, 38.0 and 38.4 mm, in increasing
    X order on the build plate. These are trial profiles, not established tripod specifications.'
  parts:
  - rail_fit_trials
  hardware: []
  tool: null
- n: '3'
  text: With no camera attached, place one bar lengthwise along the clamp rails, broad
    face down. Tighten the knob gently by hand. Stop if it will not seat naturally;
    do not force the mechanism.
  parts:
  - rail_fit_trials
  hardware: []
  tool: null
- n: '4'
  text: Check whether both angled faces are captured beneath the jaw lips and the
    bar sits flat without rocking or lifting. Record the width and result. An ambiguous
    result is not a pass.
  parts:
  - rail_fit_trials
  hardware: []
  tool: null
- n: '5'
  text: Do not attach a camera or drill these coupons. A complete plate requires confirmed
    rail geometry, camera base support dimensions, and a metal screw with verified
    socket engagement. Keep the borrowed tripod unloaded until a compatible plate
    is available.
  parts:
  - rail_fit_trials
  hardware: []
  tool: null
