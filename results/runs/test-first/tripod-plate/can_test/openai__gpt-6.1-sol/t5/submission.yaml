parts:
- id: rail_fit_trials
  role: coupon
  material: PLA
  code: "def build(p):\n    import math\n    out = cq.Workplane('XY')\n    h = p.rail_height_trial\n\
    \    inset = h / math.tan(math.radians(p.rail_angle_trial))\n    for i in range(int(p.trial_count)):\n\
    \        w = p.nominal_width + (i-1)*p.width_step\n        x = i*(p.nominal_width+p.layout_gap)\n\
    \        s = (cq.Workplane('XY').center(x,0)\n             .rect(w,p.coupon_length)\n\
    \             .workplane(offset=h)\n             .rect(w-2*inset,p.coupon_length)\n\
    \             .loft(combine=True))\n        out = out.union(s)\n    return out"
  print_orientation: Broad flat faces at z=0 on bed. Three disconnected bars; no supports
    required.
  use_orientation: Coupon length follows clamp rails. Wide face down, narrow face
    up. No camera attachment.
hardware: []
joints: []
