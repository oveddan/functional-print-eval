task: tripod-plate
note: 'UNVERIFIED PROTOTYPE ONLY—not approved for supporting a camera. Nominal 38
  mm width was supplied, but jaw geometry, camera base dimensions, socket depth, and
  load were not obtainable. First coupon''s interrupted pocket bridge failed. Revised
  continuous sacrificial bridge was printed but result could not be reported. Final
  model uses that unverified revised method. No printed threaded fastener is supplied:
  use only the salvaged metal bolt after dimensional checks. If the checks cannot
  be completed, obtain the correct commercial replacement plate. This plate has no
  anti-slide safety stops and is not a universal 38 mm plate.'
