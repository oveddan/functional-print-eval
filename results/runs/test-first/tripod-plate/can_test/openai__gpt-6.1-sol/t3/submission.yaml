- id: jaw_fit
  part: trial_plate
  feature: Trial 45 degree dovetail sides and raised deck
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - plate_width
  - slope_height
  - slope_inset
  - neck_height
  - deck_width
  - plate_length
  - jaw_lower_width
  - jaw_upper_width
  - jaw_height
  - clamp_length
