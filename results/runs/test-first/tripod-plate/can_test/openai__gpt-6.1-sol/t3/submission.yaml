parts:
- id: trial_plate
  role: final
  material: Black high-speed PLA
  code: "def build(p):\n    w=p.plate_width; h=p.slope_height; i=p.slope_inset\n \
    \   body=cq.Workplane('XZ').polyline([(-w/2,0),(w/2,0),(w/2-i,h),(-w/2+i,h)]).close().extrude(p.plate_length/2,both=True)\n\
    \    neck=cq.Workplane('XY').box(w-2*i,p.plate_length,p.neck_height,centered=(True,True,False)).translate((0,0,h))\n\
    \    deck=cq.Workplane('XY').box(p.deck_width,p.plate_length,p.total_height-h-p.neck_height,centered=(True,True,False)).translate((0,0,h+p.neck_height))\n\
    \    depth=p.bolt_head_h+p.head_depth_allowance\n    start=depth+p.sacrificial_layer\n\
    \    recess=cq.Workplane('XY').circle((p.bolt_head_d+p.head_allowance)/2).extrude(depth)\n\
    \    bore=cq.Workplane('XY').workplane(offset=start).circle((p.bolt_d+p.hole_allowance)/2).extrude(p.total_height-start)\n\
    \    return body.union(neck).union(deck).cut(recess).cut(bore)"
  print_orientation: 38 mm-wide dovetail bottom at z=0; length along Y. No supports.
    Recess bridges 15.6 mm with a continuous sacrificial layer; deck cantilevers 6
    mm on either side above neck.
  use_orientation: Top deck faces camera. Metal bolt inserted upward from underside
    pocket, head bearing on pocket roof. Dovetail sides face clamp jaws; Y runs along
    jaws. Conditional fit prototype only.
