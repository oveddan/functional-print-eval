    method: template
    ref: null
    description: Test empty clamp only. Verify both angled jaws contact matching sloped
      faces, deck clears jaw tops and controls, knob has remaining travel, and locked
      plate cannot lift, rock or slide under firm hand force. Reject contact only
      at corners or with clamp floor/deck stopping jaw engagement. This is a fit check,
      not load certification.
- id: thread_depth
  part: trial_plate
  feature: Bolt projection beyond camera-facing deck
  relation: engages
  hardware: camera_bolt
  clearance_mm: null
  params:
  - bolt_length
  - total_height
  - bolt_head_h
  - head_depth_allowance
  - socket_depth
  - minimum_tip_gap
  - minimum_engagement
  check:
    method: measure
    ref: null
    description: Expected projection 3.4 mm is only an estimate. Measure actual projection
      with head fully seated. Independently establish usable threaded socket depth
      without forcing a probe. Projection must meet camera maker's engagement requirement,
      be at least 3 mm, and be at least 1 mm less than usable socket depth. Do not
      assemble if unknown or failing.
- id: camera_seating
  part: trial_plate
  feature: Flat upper deck
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - deck_width
  - plate_length
  - camera_base_width
  - camera_base_length
  check:
    method: template
    ref: null
    description: Confirm broad flat contact clear of battery doors, curved base features
      and protrusions. A small socket boss alone is not adequate support. No load
      suitability established.
manual:
- n: '1'
  text: Treat this as an unverified fit prototype. Do not put a camera on it while
    any check remains unknown. Obtain a correct commercial plate if you cannot verify
    the fit or socket depth.
  parts:
  - trial_plate
  hardware: []
  tool: null
- n: '2'
  text: 'Slice at 0.2 mm layers, 6 walls and 100% infill, no supports. Keep the thin
    membrane in the model. Inspect toolpaths: the layer above the head pocket must
    bridge continuously, without a central hole. Print with broad dovetail bottom
    on bed.'
  parts:
  - trial_plate
  hardware: []
  tool: Slicer and printer
- n: '3'
  text: Off the tripod and away from the camera, clear only the 0.2 mm membrane within
    the central 6.8 mm bore. Use a hand-turned drill or reamer, not the camera bolt
    as a punch. Remove debris. Reject any torn, cracked or poorly bridged roof. Do
    not remove the surrounding head-bearing annulus.
  parts:
  - trial_plate
  hardware: []
  tool: Hand drill or reamer; if unavailable, stop
- n: '4'
  text: Fit plate to empty clamp. Check both angled faces engage, upper deck clears
    jaws, knob tightens before travel ends, and plate resists lifting, rocking and
    sliding. Nominal 38 mm width is not proof of compatibility. If any check fails,
    stop; do not compensate by overtightening.
  parts:
  - trial_plate
  hardware: []
  tool: null
- n: '5'
  text: Seat metal bolt in underside pocket. Confirm head is fully recessed and roof
    is sound. Measure actual upward thread projection; expected value is approximately
    3.4 mm. Measure camera usable socket depth safely and check the thread-depth criterion
    and camera manufacturer's requirements. Do not trial-tighten an unchecked bolt
    into the camera.
  parts:
  - trial_plate
  hardware:
  - camera_bolt
  tool: Calipers and nonmetallic depth probe
- n: '6'
  text: Only after every check passes, remove plate from clamp and place camera over
    flat deck. Engage metal bolt by hand without forcing threads. Tighten gently with
    a tool appropriate to the salvaged head; stop if camera is not snug before bolt
    stops turning, or if plate distorts or cracks. Confirm camera cannot rotate on
    deck. Do not use a printed screw.
  parts:
  - trial_plate
  hardware:
  - camera_bolt
  tool: Driver matching salvaged bolt head
- n: '7'
  text: 'For any initial evaluation, keep camera continuously supported by hand at
    low height over a padded surface, lock clamp and recheck. Hand checks do not certify
    load capacity. Do not leave unattended, carry tripod with camera attached, use
    overhead, or use with a heavy/long lens. Avoid heat and sun; PLA can creep. If
    slipping, loosening, cracking or uncertainty occurs, stop and replace with the
    correct plate. Keep hand support while unlocking: this design has no anti-slide
    safety stops.'
  parts:
  - trial_plate
  hardware:
  - camera_bolt
  tool: null
