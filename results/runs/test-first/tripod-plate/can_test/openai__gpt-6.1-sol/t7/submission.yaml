task: tripod-plate
note: UNVERIFIED FIT PROTOTYPE ONLY—not approved to support a camera. The user supplied
  38 mm plate width, knob-operated angled jaws and approximate salvaged bolt dimensions,
  but no jaw profile, socket depth, camera mass or base geometry. The printed jaw
  coupon was not evaluated. Do not mount a camera until all manual checks pass; even
  then this is a temporary, continuously attended, low-consequence prototype, not
  a load-rated replacement. A compatible manufacturer's metal plate is the recommended
  solution. The camera screw must be the existing metal bolt, not printed PLA. No
  safety stop is provided; a loosened clamp can release this plate.
questions:
- text: What is the clamp make/model and exact jaw profile?
  answer: Unknown; 38 mm plate width and angled, knob-tightened top-loading jaws reported.
- text: Did the jaw-fit coupon seat and resist lifting/rocking?
  answer: Printed, but outcome could not be reported.
- text: What is the camera socket usable depth, required thread engagement, mass and
    flat base footprint?
  answer: null
- text: How is the salvaged bolt turned?
  answer: null
