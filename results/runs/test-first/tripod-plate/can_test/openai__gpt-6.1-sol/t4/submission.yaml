task: tripod-plate
note: 'UNVERIFIED FIT-CHECK PROTOTYPE, not approved for supporting a camera. The 38
  mm width does not establish clamp compatibility; printed samples were not evaluated.
  Do not print the camera screw: reuse the metal 1/4-20 webcam bolt only after checking
  its dimensions and seating. For immediate camera use, obtain the correct replacement
  plate and metal screw. PLA can crack and creep; this prototype has no verified load
  rating or safety-stop compatibility.'
questions:
- text: Tripod/head make, model, jaw profile, lip height and support length?
  answer: null
- text: Which unloaded fit sample sits fully down and cannot rock, slide or lift out
    when normally clamped?
  answer: Samples printed, but no fit assessment available.
- text: Camera/lens model, weight, base clearance and usable threaded socket depth?
  answer: null
- text: Does the salvaged bolt have a flat bearing underside and can its head be tightened
    securely in the recess?
  answer: null
