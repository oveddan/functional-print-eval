task: tripod-plate
note: UNVERIFIED FIT PROTOTYPE — NOT CAMERA-READY. A temporary printed plate is feasible,
  but use the existing metal 1/4-20 webcam bolt, not a printed screw. Clamp geometry,
  camera socket depth, camera-base support and actual bolt fit remain unverified.
  The first pocket-down print failed; this revised camera-face-down version eliminates
  that bridge, but its print and fit were not confirmed. Do not mount a camera until
  all manual acceptance checks pass. No load rating or equivalence to the original
  metal plate is claimed. Obtain the correct replacement plate for normal use.
questions:
- text: Does the revised plate sit flat, clamp without bottoming out the knob, and
    resist lifting, sliding and twisting?
  answer: null
- text: Does the salvaged bolt head fit the pocket, remain recessed, and have a usable
    drive accessible inside the pocket?
  answer: null
- text: What is the usable camera socket depth, and is the base flat and adequately
    supported by the 30 x 45 mm contact face?
  answer: null
