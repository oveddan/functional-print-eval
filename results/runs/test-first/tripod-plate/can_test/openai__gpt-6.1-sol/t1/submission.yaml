parts:
- id: temporary_plate
  role: final
  material: PLA (black high-speed PLA)
  code: "import math\n\ndef build(p):\n    h=p.dovetail_height\n    w=p.plate_width\n\
    \    narrow=w-2*h/math.tan(math.radians(p.dovetail_angle))\n    total=p.bolt_head_h+p.head_depth_clearance+p.bolt_grip\n\
    \    shoulder=total-h\n    body=cq.Workplane('XY').rect(narrow,p.plate_length).extrude(shoulder)\n\
    \    dovetail=(cq.Workplane('XY',origin=(0,0,shoulder))\n              .rect(narrow,p.plate_length)\n\
    \              .workplane(offset=h).rect(w,p.plate_length).loft(combine=True))\n\
    \    body=body.union(dovetail)\n    bore=cq.Workplane('XY').circle((p.bolt_major_d+p.shaft_d_clearance)/2).extrude(total)\n\
    \    pocket=(cq.Workplane('XY',origin=(0,0,p.bolt_grip))\n            .circle((p.bolt_head_d+p.head_d_clearance)/2)\n\
    \            .extrude(total-p.bolt_grip))\n    return body.cut(bore).cut(pocket)\n"
  print_orientation: Flat 30 x 45 mm camera-contact face on bed at z=0. Head pocket
    faces up; dovetail expands outward at 45 degrees. No supports. 0.2 mm layers,
    6 walls, 6 top/bottom layers, 60% infill.
  use_orientation: Invert from print orientation. Wide dovetail face points down into
    tripod clamp; bed-contact face points up against camera. Long direction runs along
    the clamp's open ends. Prototype until every acceptance check passes.
hardware:
- id: camera_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_attachment
  fastener: camera_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 6.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: temporary_plate
    feature: Annular floor of open head pocket at z=bolt_grip
    role: head_seat
  - part: temporary_plate
    feature: Central 6.85 mm through clearance bore
    role: clearance
  nut: null
  external: Camera 1/4-20 socket; usable threaded depth and required engagement unverified
criteria:
- id: print_integrity
  part: temporary_plate
  feature: Open upward head pocket, bore and flared dovetail
  relation: clears
  hardware: camera_bolt
  clearance_mm: null
  params:
  - bolt_head_d
  - bolt_head_h
  - head_d_clearance
  - head_depth_clearance
  - bolt_major_d
  - shaft_d_clearance
  check:
    method: measure
    ref: null
    description: 'Inspect revised print: reject cracks, layer separation, distorted
      jaw faces, obstructed hole or a head that will not seat flat. Earlier pocket-down
      roof failed; revised print quality remains unconfirmed.'
- id: clamp_fit
  part: temporary_plate
  feature: 38 mm wide, 4 mm tall guessed 45-degree dovetail
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - plate_width
  - dovetail_height
  - dovetail_angle
  - plate_length
  - clamp_jaw_height
  - clamp_jaw_angle
  - clamp_support_length
  check:
    method: template
    ref: temporary_plate
    description: 'Unloaded only: plate must seat flat with broad jaw contact, not
      lip-edge contact, and tighten before clamp travel ends. Reject any rocking,
      lift, slide or twist under firm hand force. Fit check is not a load certification.'
- id: head_recess
  part: temporary_plate
  feature: 16 mm head pocket
  relation: contains
  hardware: camera_bolt
  clearance_mm: 0.4
  params:
  - bolt_head_d
  - bolt_head_h
  - head_d_clearance
  - head_depth_clearance
  check:
    method: measure
    ref: null
    description: Confirm head fits, seats flat, can be driven, and remains below the
      wide dovetail bottom so it cannot interfere with clamp seating.
- id: socket_engagement
  part: temporary_plate
  feature: Bolt grip thickness and actual thread projection
  relation: seats
  hardware: camera_bolt
  clearance_mm: null
  params:
  - bolt_length
  - bolt_grip
  - socket_depth
  - socket_bottom_margin
  - bolt_pitch
  check:
    method: measure
    ref: null
    description: Measure actual projection, nominally 4 mm (about 3.1 thread turns).
      Confirm fully formed usable thread and adequate engagement per camera manufacturer,
      with at least 1 mm bottoming margin. Unknown socket depth is a stop condition;
      do not use bolt tightening to probe depth.
- id: camera_support
  part: temporary_plate
  feature: 30 x 45 mm flat camera-contact face
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - plate_width
  - dovetail_height
  - dovetail_angle
  - plate_length
  - camera_flat_width
  - camera_flat_length
  check:
    method: template
    ref: temporary_plate
    description: With camera held securely off the tripod, verify broad flat base
      contact without rocking or interference. A single screw and bare PLA provide
      no guaranteed anti-rotation lock; reject if camera rotates with gentle hand
      pressure.
manual:
- n: '1'
  text: Treat this as an unverified prototype. Prefer finding or purchasing the correct
    original plate. Do not print or substitute a plastic camera screw.
  parts:
  - temporary_plate
  hardware:
  - camera_bolt
  tool: null
- n: '2'
  text: Print in the stated orientation with no supports. Do not reuse the failed
    pocket-down version. Inspect the entire print and remove only loose burrs; reject
    cracks, delamination or distorted dovetail surfaces. The revised test piece may
    be reused only if its quality and all checks are confirmed.
  parts:
  - temporary_plate
  hardware: []
  tool: null
- n: '3'
  text: Without a camera, place the plate in the clamp and tighten by hand. Check
    flat seating and broad contact on both angled jaws, available clamping travel,
    and resistance to lifting, sliding and twisting. Do not force a mismatched profile
    or compensate by overtightening. If any check fails, stop and obtain clamp measurements
    or the correct plate.
  parts:
  - temporary_plate
  hardware: []
  tool: null
- n: '4'
  text: Remove the plate. Fit the metal bolt from its wide dovetail face into the
    pocket. Confirm head seating, access for its existing drive, clearance through
    the shaft hole, and full recess below the clamp-contact face. If its drive cannot
    be reached, stop rather than gripping or modifying the thread.
  parts:
  - temporary_plate
  hardware:
  - camera_bolt
  tool: Driver matching the salvaged bolt's actual head
- n: '5'
  text: 'Measure actual protruding thread and usable camera socket depth gently with
    a nonmetal depth probe, consulting camera documentation for required engagement.
    Nominal projection is 4 mm; require at least 1 mm bottom clearance and sufficient
    fully formed thread engagement. If depth or engagement cannot be established,
    stop: do not attach the camera.'
  parts:
  - temporary_plate
  hardware:
  - camera_bolt
  tool: Calipers or ruler and nonmetal depth probe
- n: '6'
  text: Only after the previous checks pass, support the camera on a stable padded
    surface, offer the plate to its base and start the bolt by hand. Confirm broad
    base support; gently snug using the appropriate driver. Stop at unexpected resistance,
    rocking or camera rotation. No extra washers or a printed threaded fastener are
    included.
  parts:
  - temporary_plate
  hardware:
  - camera_bolt
  tool: null
- n: '7'
  text: For any temporary trial, keep tripod low over a soft surface, keep supporting
    the camera, and secure its existing strap independently to the tripod as a backup
    tether without pulling the tripod over. If no suitable tether is available, do
    not proceed. Clamp gently and check again for motion; hand checks do not establish
    a load rating. No overhead, unattended, moving or heavy/long-lens use. Keep away
    from heat and direct sun; PLA creeps under sustained clamping. Stop at any loosening
    or damage and replace with the proper metal plate as soon as possible.
  parts:
  - temporary_plate
  hardware:
  - camera_bolt
  tool: null
