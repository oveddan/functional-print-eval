task: tripod-plate
note: 'Unloaded fit prototype only; not a verified or load-rated camera mount. First
  test failed at a bridged pocket roof. Revised design prints inverted and eliminates
  that bridge, but user could not report its print quality or fit. Jaw profile, socket
  depth, camera mass and contact footprint remain unknown. Do not mount a camera until
  these are resolved; a correct replacement metal quick-release plate is preferred.
  Never use overhead, unattended, with a long/heavy lens, or where a falling camera
  could injure someone. No printed camera screw is supplied: use only the existing
  metal bolt.'
questions:
- text: What is the receiver jaw profile and lip height?
  answer: Unknown. Only accepted plate width of 38 mm supplied; 45-degree, 4 mm-high
    dovetail is provisional.
- text: What are camera socket depth, minimum required thread engagement, camera contact
    footprint and camera/lens mass?
  answer: null
- text: Did the inverted prototype print cleanly and lock securely?
  answer: Printed, but no print-quality or fit assessment available.
