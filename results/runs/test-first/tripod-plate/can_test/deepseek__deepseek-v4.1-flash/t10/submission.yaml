task: tripod-plate
note: 'Design: a two-part answer to "the flat part and the part that screws in" —
  one printed plate (the flat part) plus your salvaged webcam bolt (the part that
  screws in; it is already 1/4-20, which is the camera thread, so nothing else is
  needed).\n\nKey reasoning: your bolt is 15 mm long overall (5 mm head + 10 mm thread).
  For the thread to stand ~5 mm proud of the plate (about what a camera socket takes)
  and for the head to be swallowed inside the plate, the plate has to be 10 mm thick,
  with the head recessed in a pocket from underneath whose depth (5.2 mm) is exactly
  what sets the 5.2 mm of thread left for the camera. The side edges are bevelled
  45° over the top 7 mm of the plate, so the angled lips of your clamp find a matching
  slope wherever they sit between 3 and 10 mm above the pocket floor — that survives
  the pocket depth you weren''t able to measure for me.\n\nThings I could not pin
  down, and how the design copes:\n- I never got the clamp''s pocket depth, so the
  plate may sit a few mm proud of the jaws. That is cosmetic; the bevels still land
  under the lips.\n- I never got the camera socket depth (assumed ~5.5 mm typical).
  If your camera''s socket is shallower than 5.2 mm the screw will bottom out before
  the plate touches the camera''s base — slide a thin washer under the bolt head,
  or tell me and I will thin the plate.\n- The clamp''s angled-lip direction was ambiguous
  (lips overhanging vs a dovetail). I committed to the overhanging-lip form because
  you described angled lips that the plate drops in under. The coupon is the same
  cross-section, so if the jaws do not grip it, that is the thing to tell me.\n\nPlease
  treat this as temporary, as you said: PLA creeps under a steady load, so unscrew
  the plate and take the camera off the tripod between sessions.'
questions:
- text: How deep is the clamp's pocket, from the top face of the jaws straight down
    to the floor the plate rests on? (This tells me whether the plate sits flush or
    proud; it does not change the grip.)
  answer: null
- text: How deep is the 1/4-20 socket in the camera's base? If it is shallower than
    ~5 mm, the bolt will bottom out before the plate touches the camera, and I should
    make the plate 1-2 mm thinner.
  answer: null
- text: When you drop the fit coupon into the clamp, do the angled lips bear on its
    sloped edges and press it down, or do the jaws close without touching it? If they
    close without touching, your clamp is the dovetail kind and I need to flip the
    bevels to the plate's base.
  answer: null
params:
  bevel_h:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: 45 deg bevels on the two jaw-side edges, spanning the use-height 3-10 mm,
      so the angled lips find a slope over a range of pocket depths
  bolt_thread_len:
    value: 10.0
    unit: mm
    kind: hardware
    source: measured
    note: 1/4-20 thread under the head of the salvaged webcam bolt
  camera_socket_depth:
    value: 5.5
    unit: mm
    kind: world
    source: guessed
    note: typical 1/4-20 camera socket depth; never measured - the design leaves 5.2
      mm of thread for it
  clamp_plate_w:
    value: 38.0
    unit: mm
    kind: world
    source: measured
    note: width of plate the borrowed tripod's clamp takes, per the person
  coupon_len:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: length of the fit coupon
  head_d:
    value: 15.0
    unit: mm
    kind: hardware
    source: asked
    note: salvaged webcam bolt head, 'about 15 mm' across
  head_h:
    value: 5.0
    unit: mm
    kind: hardware
    source: asked
    note: salvaged webcam bolt head, 'about 5 mm' tall
  mouth_ch:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: 45 deg lead-in chamfer at the pocket mouth so the head can be pressed in
  plate_len:
    value: 37.6
    unit: mm
    kind: design
    source: design
    note: kept equal to the width so the plate drops into any pocket that accepts
      a 38 mm plate
  plate_t:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: head_h + bolt_thread_len - 5.2 mm of thread left above the camera face
  plate_w:
    value: 37.6
    unit: mm
    kind: design
    source: design
    note: clamp_plate_w minus 0.4 clearance, measured across the bevels at the camera
      face
  pocket_d:
    value: 15.8
    unit: mm
    kind: design
    source: design
    note: head_d + 0.8; a head of 14.6-15.6 still goes in
  pocket_depth:
    value: 5.2
    unit: mm
    kind: design
    source: design
    note: head_h + 0.2; this is what leaves 5.2 mm of thread above the camera face
  rib_tip_d:
    value: 14.7
    unit: mm
    kind: design
    source: design
    note: four crush ribs grip the head so turning the plate turns the bolt
  rib_w:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: ''
  thread_hole_d:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: 1/4-20 = 6.35 mm + 0.65 clearance
parts:
- id: plate
  role: final
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    w, l, t, bev = p.plate_w, p.plate_len, p.plate_t, p.bevel_h\n\
    \    pd, pdep, td = p.pocket_d, p.pocket_depth, p.thread_hole_d\n    tipd, rw,\
    \ mc = p.rib_tip_d, p.rib_w, p.mouth_ch\n    wn = w - 2.0 * bev          # width\
    \ across the back of the bevels\n    zw = t - pdep               # print height\
    \ of the pocket roof\n\n    # modelled in its print frame: z = 0 is the smooth\
    \ camera face, on the bed.\n    # The 45 deg bevels rise inward, so they print\
    \ as plain 45 deg overhangs.\n    pts = [(-w/2, 0), (w/2, 0), (wn/2, bev), (wn/2,\
    \ t), (-wn/2, t), (-wn/2, bev)]\n    part = (cq.Workplane(\"XY\").polyline(pts).close().extrude(l)\n\
    \            .rotate((0, 0, 0), (1, 0, 0), 90).translate((0, l/2, 0)))\n\n   \
    \ # 1/4-20 clearance hole, straight up from the bed face\n    part = part.cut(cq.Workplane(\"\
    XY\").circle(td/2).extrude(zw + 1))\n    # pocket for the bolt head, opening at\
    \ the top of the print (plate's underside in use)\n    part = part.cut(cq.Workplane(\"\
    XY\").circle(pd/2).extrude(t + 1).translate((0, 0, zw)))\n    # lead-in chamfer\
    \ at the pocket mouth\n    part = part.cut(cq.Solid.makeCone(pd/2, pd/2 + mc,\
    \ mc, cq.Vector(0, 0, t - mc)))\n    # four crush ribs gripping the head\n   \
    \ for a in (0, 90, 180, 270):\n        rib = (cq.Workplane(\"XY\")\n         \
    \      .box(pd/2 - tipd/2, rw, t - zw + 1, centered=(False, True, False))\n  \
    \             .translate((tipd/2, 0, zw))\n               .rotate((0, 0, 0), (0,\
    \ 0, 1), a))\n        part = part.union(rib)\n    return part\n"
  print_orientation: Smooth camera face on the bed (z = 0, 37.6 mm square); the bevelled
    sides rise inward to 23.6 mm across by z = 7, then vertical to z = 10. The bolt
    pocket opens upward at the top face. No supports, no bridging.
  use_orientation: 'Flipped from how it prints: smooth 37.6 mm face up against the
    camera''s base, 23.6 mm face down on the clamp''s floor, bevelled edges up and
    out under the angled lips. Bolt pressed in from below.'
- id: fit_coupon
  role: coupon
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    w, l, t, bev = p.plate_w, p.coupon_len, p.plate_t, p.bevel_h\n\
    \    pd, pdep, td = p.pocket_d, p.pocket_depth, p.thread_hole_d\n    tipd, rw,\
    \ mc = p.rib_tip_d, p.rib_w, p.mouth_ch\n    wn = w - 2.0 * bev\n    zw = t -\
    \ pdep\n\n    pts = [(-w/2, 0), (w/2, 0), (wn/2, bev), (wn/2, t), (-wn/2, t),\
    \ (-wn/2, bev)]\n    part = (cq.Workplane(\"XY\").polyline(pts).close().extrude(l)\n\
    \            .rotate((0, 0, 0), (1, 0, 0), 90).translate((0, l/2, 0)))\n\n   \
    \ part = part.cut(cq.Workplane(\"XY\").circle(td/2).extrude(zw + 1))\n    part\
    \ = part.cut(cq.Workplane(\"XY\").circle(pd/2).extrude(t + 1).translate((0, 0,\
    \ zw)))\n    part = part.cut(cq.Solid.makeCone(pd/2, pd/2 + mc, mc, cq.Vector(0,\
    \ 0, t - mc)))\n    for a in (0, 90, 180, 270):\n        rib = (cq.Workplane(\"\
    XY\")\n               .box(pd/2 - tipd/2, rw, t - zw + 1, centered=(False, True,\
    \ False))\n               .translate((tipd/2, 0, zw))\n               .rotate((0,\
    \ 0, 0), (0, 0, 1), a))\n        part = part.union(rib)\n    return part\n"
  print_orientation: 'Same as the plate: smooth face on the bed (z = 0), bevelled
    sides rising inward, pocket opening upward at the top face.'
  use_orientation: 'Flipped over and dropped into the borrowed tripod''s clamp: narrow
    face down on the pocket floor, bevelled edges up under the angled lips.'
hardware:
- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: j1
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 4.8
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: plate
    feature: pocket roof, the bolt head's seating face (15.8 mm dia pocket)
    role: head_seat
  - part: plate
    feature: 7.0 mm hole through the 4.8 mm web to the camera face
    role: clearance
  nut: null
  external: camera's 1/4-20 tripod socket
criteria:
- id: c1
  part: plate
  feature: head pocket (opening at the plate's underside)
  relation: contains
  hardware: bolt
  clearance_mm: 0.8
  params:
  - pocket_d
  - head_d
  - pocket_depth
  - head_h
  check:
    method: coupon
    ref: fit_coupon
    description: 'Press the bolt head into the coupon''s pocket: it should go in fully
      to the roof, with the head standing 0.2 mm inside the mouth, and the threaded
      end standing about 5.2 mm proud of the smooth face.'
- id: c2
  part: plate
  feature: 7.0 mm hole through the web below the pocket roof
  relation: clears
  hardware: bolt
  clearance_mm: 0.65
  params:
  - thread_hole_d
  check:
    method: coupon
    ref: fit_coupon
    description: The 1/4-20 thread must pass through without binding and turn freely.
- id: c3
  part: plate
  feature: four crush ribs in the pocket wall (14.7 mm across their tips)
  relation: engages
  hardware: bolt
  clearance_mm: -0.3
  params:
  - rib_tip_d
  - head_d
  - rib_w
  check:
    method: coupon
    ref: fit_coupon
    description: Once the head is pressed home, turning the coupon should turn the
      bolt - i.e. the ribs grip it. If the head is loose, press it in again harder
      so the ribs bite.
- id: c4
  part: plate
  feature: smooth camera face (37.6 mm square)
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - plate_w
  - plate_len
  check:
    method: none
    ref: null
    description: Flat and printed on the bed, so it seats against the camera's base.
- id: c5
  part: plate
  feature: 45 deg bevelled jaw-side edges (37.6 mm across the camera face, 23.6 mm
    across the base)
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - plate_w
  - bevel_h
  - plate_t
  - clamp_plate_w
  check:
    method: measure
    ref: null
    description: 'Slacken the clamp knob, drop the fit coupon in narrow-face-down,
      tighten: it must be held firmly with no rocking, sliding or lifting out. If
      the jaws close without gripping, the bevels need a different angle - report
      back.'
- id: c6
  part: plate
  feature: thread emerging from the camera face
  relation: engages
  hardware: bolt
  clearance_mm: null
  params:
  - pocket_depth
  - plate_t
  - bolt_thread_len
  - head_h
  - camera_socket_depth
  check:
    method: measure
    ref: null
    description: With the head pressed home, the thread stands 5.2 mm above the camera
      face - enough to clamp the plate against the camera's base without the screw
      bottoming out in the socket.
manual:
- n: '1'
  text: Print 'plate' and 'fit_coupon' in PLA, 0.2 mm layers, no supports. Both print
    with the smooth camera face on the bed and the bolt pocket opening upward.
  parts:
  - plate
  - fit_coupon
  hardware: []
  tool: printer
- n: '2'
  text: 'Slacken the clamp knob on the borrowed tripod and drop ''fit_coupon'' in,
    narrow face down, with its two sloped edges facing the jaws. Tighten the knob.
    It should sit down on the floor of the pocket and be held firmly: you should not
    be able to rock it, slide it, or lift it out. Slacken and remove it.'
  parts:
  - fit_coupon
  hardware: []
  tool: tripod clamp knob
- n: '3'
  text: If the coupon was NOT gripped (the jaws closed without bearing on the sloped
    edges, or the coupon drops in too loosely), stop here and tell me - the bevel
    angle is the one thing I could not verify against your clamp.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '4'
  text: 'Press the salvaged bolt''s head into the pocket on the plate''s narrow face,
    thread first, until the head seats against the roof of the pocket. The threaded
    end should come out through the smooth face and stand about 5 mm proud of it.
    Give it a twist to seat it: the four small ribs in the pocket wall bite into the
    head.'
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '5'
  text: 'Check the grip: turning the plate should turn the bolt with it. If the bolt
    spins freely inside the pocket, press the head in again more firmly so the ribs
    bite, or squeeze the plate''s edges a moment.'
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '6'
  text: Hold the camera upside down. Set the plate's smooth face against the camera's
    base with the thread started in the 1/4-20 socket, and turn the plate clockwise
    until it is snug against the camera's base. The ribs make the plate turn the bolt
    for you. Hand-tight only - this is PLA, so do not lean on it.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '7'
  text: Slacken the clamp knob, drop the camera and plate into the jaws - plate's
    narrow face down, sloped edges up under the angled lips - then tighten the knob.
  parts:
  - plate
  hardware:
  - bolt
  tool: tripod clamp knob
- n: '8'
  text: 'Test for play: try to rock the camera fore and aft and side to side. If it
    moves, tighten the knob further; if the plate sits high because it is thicker
    than the clamp''s pocket, that is expected and harmless.'
  parts:
  - plate
  hardware:
  - bolt
  tool: tripod clamp knob
- n: '9'
  text: 'To take it off: slacken the knob, lift the camera and plate out together,
    then turn the plate anticlockwise to unscrew it from the camera. Store the plate
    off the camera between sessions - PLA creeps under a standing load.'
  parts:
  - plate
  hardware:
  - bolt
  tool: null
