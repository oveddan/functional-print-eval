- id: c_roof_prints
  part: plate
  feature: 'pocket roof: 2 mm flat ring bridging over the d11 exit hole'
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - pocket_d
  - exit_hole_d
  - pocket_depth
  check:
    method: coupon
    ref: coupon_screw
    description: roof bridges cleanly and no loops sag into the pocket (the first
      coupon's 4 mm ring failed; this is now a 2 mm ring)
manual:
- n: '1'
  text: 'Print the plate in PLA: 0.2 mm layers, 0.4 mm nozzle, 3 walls, 25% infill,
    no supports. Lay it flat on its plain bottom face - the round pocket for the bolt
    head will open at the bed and the 26 mm camera pad will stick up.'
  parts:
  - plate
  hardware: []
  tool: 3D printer
- n: '2'
  text: Fit-check the plate in the tripod clamp BEFORE anything else. It should drop
    down between the angled jaw lips and the knob should lock it with no rocking.
    If it will not drop in, lay a sheet of sandpaper on a flat surface and sand the
    plate's bottom face and its two long bevelled sides until it just slides in. If
    it is loose in the jaws, stick one or two strips of tape on the bottom face to
    take up the gap.
  parts:
  - plate
  hardware: []
  tool: sandpaper
- n: '3'
  text: 'Push the salvaged bolt up through the plate from underneath: the 15 mm head
    goes into the round pocket and the 1/4-20 thread comes out of the raised pad on
    top. The head should be flush or just inside the plate''s bottom face - nothing
    may stick out below it.'
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '4'
  text: Screw your camera onto the exposed thread. Hold the bolt head with a thumb
    pressed on it through the pocket (or wrap one turn of tape on the head for grip)
    while you turn the camera. Stop when it is snug - about 5 mm of thread ends up
    inside the camera.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '5'
  text: 'Check the camera sits on the pad without rocking. A gap of a millimetre or
    so is fine; if it is hard against the pad and still loose, back it off a quarter
    turn. Optional: a piece of thin rubber or tape on the pad protects the camera
    base and adds grip.'
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '6'
  text: Hold the camera, drop the plate into the clamp, press it down flat, then tighten
    the knob firmly. Support the camera's weight while you tighten so the plate does
    not tilt in the jaws.
  parts:
  - plate
  hardware: []
  tool: null
- n: '7'
  text: Re-check both the clamp knob and the camera screw after about 10 minutes of
    hanging - PLA relaxes under a steady load. Keep a hand under the camera when you
    move the tripod, and take the camera off before you store or carry it.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '8'
  text: When the real quick-release plate turns up, unscrew the camera, slide the
    bolt out of the pocket and keep the bolt - the printed plate is the disposable
    bit.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
