parts:
- id: plate
  role: final
  material: PLA (high-speed black, 0.2 mm layers, 0.4 mm nozzle, 3 walls, 25% infill,
    no supports)
  code: "def build(p):\n    w = p.plate_w\n    l = p.plate_l\n    t = p.plate_t\n\
    \    r = p.corner_r\n    b = p.edge_bevel\n    bc = p.bottom_chamfer\n    pd =\
    \ p.pocket_d\n    pdep = p.pocket_depth\n    hd = p.exit_hole_d\n    pad_d = p.pad_d\n\
    \    pad_h = p.pad_h\n\n    # --- footprint: w x l rounded rectangle (rect + corner\
    \ circles, no edge selection)\n    body = cq.Workplane(\"XY\").rect(w - 2 * r,\
    \ l).extrude(t)\n    body = body.union(cq.Workplane(\"XY\").rect(w, l - 2 * r).extrude(t))\n\
    \    for sx in (-1.0, 1.0):\n        for sy in (-1.0, 1.0):\n            body\
    \ = body.union(\n                cq.Workplane(\"XY\")\n                .center(sx\
    \ * (w / 2.0 - r), sy * (l / 2.0 - r))\n                .circle(r)\n         \
    \       .extrude(t)\n            )\n\n    # --- bevel cutters: triangular prisms\
    \ running along Y\n    def wedge(pts, length):\n        s = cq.Workplane(\"XY\"\
    ).polyline(pts).close().extrude(length)\n        s = s.rotate((0, 0, 0), (1, 0,\
    \ 0), 90)\n        return s.translate((0, length / 2.0, 0))\n\n    for sx in (-1.0,\
    \ 1.0):\n        body = body.cut(wedge([(sx * (w / 2.0 - b), t),\n           \
    \                    (sx * (w / 2.0), t),\n                               (sx\
    \ * (w / 2.0), t - b)], l + 4))\n    for sx in (-1.0, 1.0):\n        body = body.cut(wedge([(sx\
    \ * (w / 2.0 - bc), 0.0),\n                               (sx * (w / 2.0), bc),\n\
    \                               (sx * (w / 2.0), 0.0)], l + 4))\n\n    # --- raised\
    \ camera pad\n    body = body.union(cq.Workplane(\"XY\").circle(pad_d / 2.0).extrude(pad_h))\n\
    \n    # --- bolt head pocket (opens at the bed) and the shank clearance hole\n\
    \    body = body.cut(cq.Workplane(\"XY\").circle(pd / 2.0).extrude(pdep))\n  \
    \  body = body.cut(cq.Workplane(\"XY\").circle(hd / 2.0).extrude(pad_h + 10.0))\n\
    \    return body\n"
  print_orientation: flat on its bottom face (z=0 is the plain bottom face with the
    round bolt-head pocket opening at the bed); the 26 mm camera pad and the chamfered
    edges point up
  use_orientation: bevels up, dropped down between the clamp's angled jaw lips; bolt
    inserted from below into the pocket, camera screwed onto the thread coming out
    of the pad
