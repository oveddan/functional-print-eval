task: tripod-plate
note: 'SAFETY: this is a temporary part. PLA creeps under a steady load, so re-check
  both the clamp knob and the camera screw after ~10 minutes, don''t carry the tripod
  by the camera, and keep a hand under the camera. Print the plate in PLA at 0.2 mm
  layers, 0.4 mm nozzle, 3 walls, 25% infill, no supports.


  WHAT IT IS: one printed part (the plate) plus your salvaged 1/4-20 webcam mount
  bolt. The bolt''s 15 mm head drops into a ⌀15.4 pocket in the plate''s bottom face
  and is trapped by the pocket roof, so the 1/4-20 thread comes out of a 26 mm raised
  pad on top; the camera screws onto it. The plate''s bevelled long edges match the
  clamp''s angled jaw lips and slide down between them. The ASME B18.2.2 1/4-20 nut
  isn''t needed - the bolt head is retained by the pocket roof, so there is no room
  (or need) for it.


  SIZING ASSUMPTIONS (the two things I could not get measured):

  - Plate thickness 6.5 mm, the usual figure for a 38 mm quick-release plate. The
  knob-tightened jaws usually swallow +/-1 mm, and step 2 of the manual tells you
  how to sand it in or shim it with tape.

  - Thread protrusion 5.2 mm above the pad: pad top sits at 10.2 mm = pocket roof
  5.4 + shank 10.0 - 5.2. Typical camera sockets are 5.5-6.5 mm deep, so the camera
  lands on the pad with good thread engagement; if your camera is shallower it just
  floats 1 mm or so and still tightens.


  PRINTING NOTE: the pocket roof used to sag (your first coupon) because a 4 mm ring
  had to bridge unsupported over the ⌀15 hole. The exit hole is now ⌀11, so the roof
  only bridges a 2 mm ring - well inside your 50 mm clean bridge limit - and the bolt
  head has a proper flat seat to bear on.


  This is a single-print job after the coupon rounds. If the plate turns out too thick
  or too wide for your clamp, sand it; if it is loose, tape the bottom face. It is
  meant to get you shooting until the real plate turns up.'
