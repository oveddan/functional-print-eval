task: tripod-plate
note: 'A 3D-printed stand-in for the missing camera plate + its 1/4"-20 screw: a 38
  mm-class dovetail plate that drops into the borrowed tripod''s jaws, plus a printed
  thumb screw that threads into the camera. Both print flat, no supports. The plate
  is deliberately kept at 10 mm thick so its sloped sides are still tall enough to
  be gripped if the clamp''s jaws are deeper than assumed. A dovetail coupon (10 mm
  and 8 mm slabs) is included: print it first and drop the slabs into the clamp —
  if only the 8 mm slab fits under the lips, sand the plate''s bottom face down to
  match. The salvaged 1/4"-20 webcam-mount bolt also fits the plate''s head counterbore
  (5.2 mm deep, Ø17.5) as a metal alternative to the printed screw, with the same
  5.2 mm of thread engagement. Everything here is a temporary measure: PLA creeps
  and softens with heat, and the printed thread is the weak link — check the joint
  before every use and never carry the tripod by the camera.'
questions:
- text: What is the angle of the clamp jaws' overhanging lips from vertical (I assumed
    45 deg, Arca-Swiss style)?
  answer: null
- text: How tall is the clamp's slot - the distance from the slot floor up to the
    underside of the lips - and how tall are the lips themselves? (I assumed the lips
    are 4-6 mm and the slot 8-12 mm tall.)
  answer: null
- text: How deep is the camera's 1/4-20 tripod socket? (I assumed 6.5 mm and kept
    the screw's engagement to 5.2 mm so it cannot bottom out.)
  answer: null
- text: Did the 1/4-20 screw you printed thread into your camera's socket, and did
    the dovetail slabs lock in the clamp?
  answer: null
params:
  clamp_plate_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: width of plate the borrowed tripod's clamp takes
  plate_width:
    value: 37.5
    unit: mm
    kind: design
    source: design
    note: 'plate''s widest (top) width: 0.25 mm clearance per side against the clamp''s
      38 mm'
  dovetail_angle:
    value: 45
    unit: deg
    kind: world
    source: guessed
    note: assumed angle of the clamp jaws' overhanging lips from vertical (Arca-Swiss
      style); the person could not measure it - verify with the coupon
  dovetail_h:
    value: 6
    unit: mm
    kind: design
    source: design
    note: height of the sloped section; gives a 25.5 mm wide base
  plate_t:
    value: 10
    unit: mm
    kind: design
    source: design
    note: plate thickness; the sloped sides span z=4..10 so they overlap the clamp
      lips for slot depths of roughly 6-13 mm
  plate_len:
    value: 45
    unit: mm
    kind: design
    source: design
    note: plate length along the clamp axis
  plate_hole_d:
    value: 6.7
    unit: mm
    kind: design
    source: design
    note: central clearance hole for 1/4-20 (thread OD 6.35)
  plate_cbore_d:
    value: 17.5
    unit: mm
    kind: design
    source: design
    note: counterbore in the plate's bottom for the screw head; leaves 4 mm of wall
      each side
  plate_cbore_depth:
    value: 5.2
    unit: mm
    kind: design
    source: design
    note: counterbore depth; head is 5.0 so it sits 0.2 mm inside the plate's bottom
      face
  groove_w:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: width of the grip grooves in the plate's camera-side face
  groove_depth:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: depth of the grip grooves
  groove_pitch:
    value: 5
    unit: mm
    kind: design
    source: design
    note: spacing of grip grooves
  groove_len:
    value: 30
    unit: mm
    kind: design
    source: design
    note: length of grip grooves
  thread_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 pitch
  thread_major_d:
    value: 6
    unit: mm
    kind: design
    source: design
    note: printed thread OD, 0.35 under the 6.35 nominal so it starts easily in the
      camera's socket
  thread_depth:
    value: 0.38
    unit: mm
    kind: design
    source: design
    note: printed thread depth; shallow so the crest clears the socket thread's root
  thread_crest_half_w:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: axial half-width of the thread crest (0.30 wide, just under the 0.3175 the
      socket's groove allows)
  screw_head_d:
    value: 17.1
    unit: mm
    kind: design
    source: design
    note: printed screw head diameter, fits the 17.5 counterbore
  screw_head_h:
    value: 5
    unit: mm
    kind: design
    source: design
    note: printed screw head thickness
  screw_shank_l:
    value: 10
    unit: mm
    kind: design
    source: design
    note: 'threaded length under the head: 4.8 passes through the plate, 5.2 engages
      the camera socket'
  screw_tip_taper:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: conical lead-in at the thread's tip so it starts easily
  slot_w:
    value: 2
    unit: mm
    kind: design
    source: design
    note: coin/screwdriver slot width in the head's outer face
  slot_depth:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: slot depth
  screw_engagement:
    value: 5.2
    unit: mm
    kind: design
    source: design
    note: length of thread inside the camera socket = shank 10 minus the 4.8 that
      passes through the plate
  camera_socket_depth:
    value: 6.5
    unit: mm
    kind: world
    source: guessed
    note: typical 1/4-20 camera tripod socket depth; could not be measured, so engagement
      was kept to 5.2 mm so the screw cannot bottom out
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam-mount bolt head across flats/knob
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: salvaged bolt head height; matches the 5.2 counterbore depth
  bolt_len_under_head:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: salvaged bolt thread length; gives the same 5.2 mm socket engagement as
      the printed screw
  coupon_len:
    value: 16
    unit: mm
    kind: design
    source: design
    note: length of each dovetail coupon slab
parts:
- id: plate
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    w = p.plate_width\n    t = p.plate_t\n\
    \    L = p.plate_len\n    dh = p.dovetail_h\n    run = dh * math.tan(math.radians(p.dovetail_angle))\n\
    \    wb = w - 2.0 * run\n\n    pts = [(-wb / 2.0, 0.0), (wb / 2.0, 0.0), (wb /\
    \ 2.0, t - dh),\n           (w / 2.0, t), (-w / 2.0, t), (-w / 2.0, t - dh)]\n\
    \    s = cq.Workplane(\"XZ\").polyline(pts).close().extrude(L)\n    bb = s.val().BoundingBox()\n\
    \    s = s.translate((0.0, -(bb.ymin + bb.ymax) / 2.0, -bb.zmin))\n\n    # central\
    \ clearance hole for the 1/4-20 screw\n    s = s.cut(cq.Workplane(\"XY\").circle(p.plate_hole_d\
    \ / 2.0)\n              .extrude(t * 3.0).translate((0, 0, -t)))\n\n    # counterbore\
    \ in the bottom face for the screw head\n    s = s.cut(cq.Workplane(\"XY\").circle(p.plate_cbore_d\
    \ / 2.0)\n              .extrude(p.plate_cbore_depth + 0.5).translate((0, 0, -0.5)))\n\
    \n    # shallow grip grooves in the camera-side face, to resist the camera twisting\n\
    \    for off in (-p.groove_pitch, 0.0, p.groove_pitch):\n        s = s.cut(cq.Workplane(\"\
    XY\")\n                  .box(p.groove_len, p.groove_w, 2.0 * p.groove_depth)\n\
    \                  .translate((0, off, t)))\n        s = s.cut(cq.Workplane(\"\
    XY\")\n                  .box(p.groove_w, p.groove_len, 2.0 * p.groove_depth)\n\
    \                  .translate((off, 0, t)))\n    return s\n"
  print_orientation: flat on its bottom face (z=0 = the face that rests on the clamp's
    floor); the 45 deg sloped sides open upward and print unsupported
  use_orientation: bottom face down on the tripod clamp's floor, sloped sides against
    the jaw lips, grooved face up under the camera
- id: screw
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    r_maj = p.thread_major_d / 2.0\n    r_min\
    \ = r_maj - p.thread_depth\n    pitch = p.thread_pitch\n    L = p.screw_shank_l\n\
    \    hh = p.screw_head_h\n    hd = p.screw_head_d\n\n    head = cq.Workplane(\"\
    XY\").circle(hd / 2.0).extrude(hh)\n    core = cq.Workplane(\"XY\").circle(r_min).extrude(L).translate((0,\
    \ 0, hh))\n\n    helix = cq.Wire.makeHelix(pitch, L, r_min)\n    prof = (cq.Workplane(\"\
    XZ\")\n            .moveTo(r_min, 0.0)\n            .lineTo(r_maj, p.thread_crest_half_w)\n\
    \            .lineTo(r_maj, -p.thread_crest_half_w)\n            .close())\n \
    \   thread = prof.sweep(helix, isFrenet=True).translate((0, 0, hh))\n\n    s =\
    \ head.union(core).union(thread)\n\n    # conical lead-in at the tip so the printed\
    \ thread starts easily\n    tip = (cq.Workplane(\"XY\").circle(r_maj + 0.5)\n\
    \           .workplane(offset=p.screw_tip_taper)\n           .circle(0.2)\n  \
    \         .loft()\n           .translate((0, 0, hh + L - p.screw_tip_taper)))\n\
    \    s = s.cut(tip)\n\n    # coin / screwdriver slot in the head's outer face\n\
    \    s = s.cut(cq.Workplane(\"XY\").box(p.slot_w, hd * 1.4, 2.0 * p.slot_depth))\n\
    \    return s\n"
  print_orientation: head down on the bed (z=0 = the head's outer face, slot up),
    thread pointing straight up - self-supporting, no supports
  use_orientation: shank up through the plate's bottom counterbore, thread into the
    camera's 1/4-20 socket
- id: coupon_dovetail
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    w = p.plate_width\n    dh = p.dovetail_h\n\
    \    run = dh * math.tan(math.radians(p.dovetail_angle))\n    wb = w - 2.0 * run\n\
    \    L = p.coupon_len\n\n    def slab(t, y0):\n        pts = [(-wb / 2.0, 0.0),\
    \ (wb / 2.0, 0.0), (wb / 2.0, t - dh),\n               (w / 2.0, t), (-w / 2.0,\
    \ t), (-w / 2.0, t - dh)]\n        s = cq.Workplane(\"XZ\").polyline(pts).close().extrude(L)\n\
    \        bb = s.val().BoundingBox()\n        return s.translate((0.0, y0 - bb.ymin,\
    \ -bb.zmin))\n\n    a = slab(p.plate_t, 0.0)\n    b = slab(p.plate_t - 2.0, L\
    \ + 1.5)\n    return a.union(b)\n"
  print_orientation: both slabs' bottom faces on the bed (z=0), sloped sides facing
    up
  use_orientation: as printed - drop either slab into the tripod clamp's jaws
hardware:
- id: bolt1
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: j1
  fastener: bolt1
  axis_origin:
  - 0.0
  - 0.0
  - 5.2
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: bottom counterbore Ø17.5 x 5.2 (head seat)
    role: head_seat
  - part: plate
    feature: central Ø6.7 clearance hole
    role: clearance
  nut: null
  external: camera's 1/4-20 tripod socket
criteria:
- id: c1
  part: plate
  feature: 45 deg sloped sides
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - clamp_plate_width
  - plate_width
  - dovetail_angle
  - dovetail_h
  - plate_t
  check:
    method: coupon
    ref: coupon_dovetail
    description: 'Print the coupon first. Drop each slab into the clamp and tighten
      the knob: the lips must land on the sloped sides and lock the slab without rocking.
      If the 10 mm slab will not go under the lips but the 8 mm one does, sand the
      plate''s bottom face down to 8 mm.'
- id: c2
  part: plate
  feature: bottom counterbore
  relation: contains
  hardware: null
  clearance_mm: null
  params:
  - plate_cbore_d
  - plate_cbore_depth
  - screw_head_d
  - screw_head_h
  check:
    method: measure
    ref: null
    description: Screw head must drop into the counterbore and sit flush or slightly
      inside the plate's bottom face.
- id: c3
  part: plate
  feature: central clearance hole
  relation: clears
  hardware: null
  clearance_mm: 0.175
  params:
  - plate_hole_d
  - thread_major_d
  check:
    method: none
    ref: null
    description: 0.35 mm diametral clearance over the 1/4-20 major diameter.
- id: c4
  part: screw
  feature: 1/4-20 external thread
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - thread_pitch
  - thread_major_d
  - thread_depth
  - thread_crest_half_w
  - screw_tip_taper
  check:
    method: coupon
    ref: screw
    description: 'The printed screw itself is the test piece: it must start easily
      in the camera''s socket, run in smoothly and hold the plate snug. If it will
      not start, the crest is oversized - use the salvaged bolt instead.'
- id: c5
  part: screw
  feature: shank end
  relation: clears
  hardware: null
  clearance_mm: 1.3
  params:
  - screw_shank_l
  - screw_engagement
  - camera_socket_depth
  - plate_t
  - plate_cbore_depth
  check:
    method: measure
    ref: null
    description: '5.2 mm of engagement against an assumed 6.5 mm socket: the screw
      must not bottom out before the plate is snug against the camera.'
- id: c6
  part: plate
  feature: top face grip grooves
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - groove_w
  - groove_depth
  - groove_pitch
  - groove_len
  check:
    method: none
    ref: null
    description: Grooved camera-side face gives friction against the camera's base
      so the camera cannot twist on the plate.
- id: c7
  part: plate
  feature: bottom counterbore
  relation: contains
  hardware: bolt1
  clearance_mm: 1.25
  params:
  - plate_cbore_d
  - plate_cbore_depth
  - bolt_head_d
  - bolt_head_h
  - bolt_len_under_head
  check:
    method: measure
    ref: null
    description: The salvaged bolt's 15 mm head must also fit the counterbore as the
      metal alternative to the printed screw.
manual:
- n: '1'
  text: Print coupon_dovetail first (both slabs, flat, no supports, ~5 g). It takes
    a few minutes and it tells you whether the plate will fit the borrowed clamp before
    you spend filament on it.
  parts:
  - coupon_dovetail
  hardware: []
  tool: 3D printer
- n: '2'
  text: 'Loosen the tripod clamp''s knob, drop the 10 mm slab into the jaws with its
    sloped sides against the jaw lips, and tighten the knob. It should sit down and
    lock with no rocking. If it will not go under the lips but the 8 mm slab does,
    note that: after printing the plate in step 3, sand the plate''s bottom face down
    until it sits at 8 mm thick and locks.'
  parts:
  - coupon_dovetail
  hardware: []
  tool: null
- n: '3'
  text: Print plate (bottom face on the bed, no supports) and screw (head on the bed,
    thread pointing up, no supports). Clean any strings out of the plate's bottom
    counterbore and off the thread.
  parts:
  - plate
  - screw
  hardware: []
  tool: 3D printer
- n: '4'
  text: Test the printed screw by hand into your camera's tripod socket, without the
    plate. It should start by itself and run in smoothly; do not force it. If it will
    not start, or it feels like it is cross-threading, put it aside and use the salvaged
    1/4-20 webcam-mount bolt instead - its head fits the same counterbore.
  parts:
  - screw
  hardware:
  - bolt1
  tool: null
- n: '5'
  text: Back the screw out. Push the screw's thread up through the plate from below,
    so its head drops into the counterbore in the plate's bottom face and the thread
    sticks out of the grooved top face. The head must sit flush or slightly inside
    - the plate's bottom face has to stay flat.
  parts:
  - plate
  - screw
  hardware: []
  tool: null
- n: '6'
  text: Set the camera's base on the plate's grooved face and line the thread up with
    the camera's socket. Start it by hand, then put a coin in the slot in the screw
    head (or a wide flat screwdriver) and turn it until the camera and plate are snug.
    Stop as soon as it is snug - PLA strips and creeps, so no extra force.
  parts:
  - plate
  - screw
  hardware: []
  tool: coin or wide flat screwdriver
- n: '7'
  text: Loosen the clamp knob, drop the plate into the jaws - camera up, sloped sides
    toward the lips - and tighten the knob so the lips press on the sloped sides.
    Check that the plate cannot rock or slide out.
  parts:
  - plate
  hardware: []
  tool: null
- n: '8'
  text: 'Before trusting it: keep the tripod low, keep a hand under the camera for
    the first few minutes, and re-check the screw and the clamp knob before every
    use. This is a temporary printed stand-in - PLA softens in a hot car and creeps
    under steady load. Never carry the tripod by the camera.'
  parts:
  - plate
  - screw
  hardware: []
  tool: null
