manual:
- n: '1'
  text: 'Print the plate on its flat camera-contact face: the smooth face down on
    the bed, the 18 mm round pocket opening upward. 0.2 mm layers, 4 perimeters, 35%
    infill, no supports needed.'
  parts:
  - plate
  hardware: []
  tool: printer
- n: '2'
  text: Print the shim only if step 6 tells you to (it is a 1 mm ring).
  parts:
  - shim
  hardware: []
  tool: printer
- n: '3'
  text: 'Check the bolt in the plate: drop the salvaged bolt head-first into the 18
    mm pocket from the pocket side and let the thread come out of the smooth camera
    face. The head should sit fully inside, and about 4-5 mm of thread should stand
    proud. Nothing should stick out of the pocket-side face.'
  parts: []
  hardware:
  - bolt
  tool: ruler
- n: '4'
  text: If the bolt head pokes out of the pocket-side face, stop and tell me - the
    pocket is 6 mm deep for a 5 mm head.
  parts: []
  hardware:
  - bolt
  tool: null
- n: '5'
  text: 'Fit the camera: set the camera on the smooth face with the thread against
    its socket, start the thread by hand, then hold the camera and turn the plate
    (press the camera onto the plate as you do). The head is pinched against the pocket
    ceiling so the screw turns with the plate and the camera winds down onto it. Snug
    only - it is PLA, and the camera''s socket is metal.'
  parts: []
  hardware:
  - bolt
  tool: null
- n: '6'
  text: 'If the camera will not come down onto the plate (it stays loose and spins
    easily), the thread is bottoming out in the socket: slide the shim over the thread
    so it rests on the bolt head, refit, and retry. That trims the thread from 5 mm
    to 4 mm proud.'
  parts: []
  hardware:
  - bolt
  tool: null
- n: '7'
  text: Drop the whole assembly into the tripod clamp from above - it is 37.5 mm wide
    for the 38 mm gap - and tighten the clamp's knob.
  parts:
  - plate
  hardware: []
  tool: null
- n: '8'
  text: 'If the plate will not sit down into the clamp (it stands proud of the jaws),
    sand the pocket-side face flat. Up to 1 mm is safe: the head simply becomes flush
    with that face and the thread still stands 5 mm proud.'
  parts:
  - plate
  hardware: []
  tool: sandpaper
- n: '9'
  text: 'Before each use: screw snug, clamp tight, and no heavy lens or swinging the
    rig by the camera. One 1/4-20 screw on a flat PLA face relies on friction, so
    re-check tightness.'
  parts:
  - plate
  - shim
  hardware:
  - bolt
  tool: null
