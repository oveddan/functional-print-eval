task: tripod-plate
note: 'PLATE (flat part) + SHIM, with your salvaged 1/4-20 bolt as the screw. Geometry
  is driven by the bolt: 10 mm of thread under a 5 mm-tall, 15 mm head. To get ~5
  mm of thread standing proud of the plate (about 4 threads in the camera''s socket)
  while hiding the head inside the plate so nothing pokes into the clamp, the plate
  comes out 11 mm thick: 5 mm of web the thread passes through + a 6 mm pocket for
  the head. It prints flat, no supports. The one unverified number is the clamp''s
  grip height - slide the printed gauge steps into the jaws; if your clamp tops out
  under 11 mm, sand the pocket-side face flat (up to 1 mm is safe: the head just becomes
  flush and the screw still stands 5 mm proud). The bolt''s head is deliberately a
  loose fit in the pocket so it can''t jam; its head is pinched against the pocket''s
  ceiling when you tighten, so turn the plate and the camera winds down onto it. A
  printed 1/4-20 screw was not used: a 0.2 mm-layer PLA thread in a metal socket is
  rough, weak, and can seize or strip the camera''s socket - the metal bolt is the
  right part for that job.'
questions:
- text: How thick a plate do the clamp's jaws take (floor-to-lip depth), and does
    the plate rest on a floor or hang between the jaws? The gauge steps 8-12 mm answer
    this.
  answer: null
- text: Is the salvaged bolt's head a hex, a knurled knob, or round - and was the
    15 mm across the flats or across the corners?
  answer: null
- text: How deep is the camera's tripod socket (screw the bolt in gently until it
    stops, then measure what is left of the 10 mm)?
  answer: null
