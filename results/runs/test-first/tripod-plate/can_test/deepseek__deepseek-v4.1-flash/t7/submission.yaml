parts:
- id: plate
  role: final
  material: PLA
  code: "def build(p):\n    body = cq.Workplane(\"XY\").box(p.plate_l, p.plate_w,\
    \ p.plate_t, centered=(True, True, False))\n    body = body.edges(\"|Z\").fillet(p.corner_r)\n\
    \    body = body.faces(\">Z\").edges().chamfer(p.chamfer_clamp)\n    body = body.faces(\"\
    <Z\").edges().chamfer(p.chamfer_cam)\n    # head pocket, opening at the clamp-side\
    \ face (z = plate_t)\n    body = body.faces(\">Z\").workplane().circle(p.head_pocket_d\
    \ / 2).cutBlind(-p.head_pocket_c)\n    # clearance hole through the web, breaking\
    \ out of the camera face (z = 0)\n    body = body.faces(\"<Z\").workplane().circle(p.shank_hole_d\
    \ / 2).cutBlind(-p.web_w)\n    return body\n"
  print_orientation: camera-contact face on the bed (z = 0); the 18 mm head pocket
    opens upward, so the seat and the through hole print as a flat annulus and a vertical
    hole - no supports, no bridging
  use_orientation: 'flipped over: the face that was on the bed presses against the
    camera''s base, and the face with the 18 mm pocket opening points down into the
    tripod clamp; the bolt is inserted head-first through that opening'
- id: shim
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane(\"XY\").circle(p.shim_od / 2).circle(p.shim_id\
    \ / 2).extrude(p.shim_t)\n"
  print_orientation: flat annulus on the bed (z = 0)
  use_orientation: slips down the bolt thread and rests on top of the bolt head, inside
    the plate's pocket; only needed if the screw bottoms out in the camera's socket
