task: tripod-plate
note: 'Bottom line: the flat part is an easy print; the part that screws in is the
  one to avoid printing and just reuse - your salvaged 1/4-20 bolt does that job,
  and this plate is built around it. A printed 1/4-20 thread is 1.27 mm of pitch in
  PLA, which neither prints reliably at 0.4 mm nor survives being tightened; the metal
  bolt costs you nothing and holds the camera.\n\nThe plate is a 37 x 37.6 x 11.4
  mm block: widest at the bottom with 45 deg flanks 7 mm tall (so the jaw lips wedge
  it down onto the floor of the slot), a 23.6 x 37 mm flat top for the camera, and
  a pocket in the underside that captures the bolt head with a 22 mm slot running
  along its length so you can balance the camera.\n\nWhat I could not get: the clamp''s
  jaw angle, its slot depth, the slot''s length, and the depth of the camera''s socket.
  I assumed 45 deg flanks (the common case) and made them tall enough that the jaws
  land on the slope for any slot depth from about 4 to 12 mm; the plate sticks up
  11.4 mm minus that slot depth, so the camera clears the jaws. The 4.0 mm of thread
  that stands proud of the top face is the one number you should sanity-check in step
  2, and the shim covers you if it turns out to be too long for the socket.\n\nIf
  the plate refuses to settle in the jaws, or the camera fouls the jaws, tell me which
  and I can re-cut it - both are single-parameter changes.'
questions:
- text: How deep is the 1/4-20 socket in the camera's base (I set the bolt to protrude
    4.0 mm and the shim covers a shallower socket)?
  answer: null
- text: Does the plate settle down flat on the floor of the slot when the knob is
    tightened, or does it ride up?
  answer: null
- text: What is the jaw lip angle and how deep is the slot, if you can get at them
    later?
  answer: null
params:
  clamp_plate_w:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: width of plate the tripod clamp takes (the person's only firm reading of
      the head)
  fit_clear_w:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: slack on the width so the plate drops between the jaw lips before the knob
      takes up; the knob supplies the remaining take-up
  fit_clear_l:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: slack on the length so the plate fits a compact slot
  flank_deg:
    value: 45
    unit: deg
    kind: design
    source: design
    note: chosen flank angle, measured from the plate's bottom face. The most common
      dovetail angle; a shallower-than-the-jaw angle still lets the plate seat on
      the slot floor, a steeper one would make it ride up
  flank_h:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: tall flanks, so the jaw lips land on the slope for slot depths from about
      4 to 12 mm
  plate_t:
    value: 11.4
    unit: mm
    kind: design
    source: design
    note: = head pocket 5.4 + 6.0 mm of web above it; sets the thread protrusion to
      4.0 mm
  plate_len:
    value: 37.0
    unit: mm
    kind: design
    source: design
    note: square-ish footprint, the usual compact quick-release size; the clamp's
      slot length could not be measured
  pocket_len:
    value: 22.0
    unit: mm
    kind: design
    source: design
    note: length of the head pocket / bolt slot, giving about +-3.5 mm of balance
      adjustment
  pocket_d:
    value: 17.8
    unit: mm
    kind: design
    source: design
    note: clears the 15 mm head, and also clears a 15 mm hex head across its corners
      (17.3)
  pocket_c:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: head pocket depth from the plate's underside; 0.4 mm more than the 5 mm
      head so it sits fully recessed and the plate still rests flat on the slot floor
  slot_len:
    value: 22.0
    unit: mm
    kind: design
    source: design
    note: ''
  slot_w:
    value: 6.8
    unit: mm
    kind: design
    source: design
    note: 1/4"-20 shank is 6.35 mm
  bolt_len:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam-mount bolt, under head to tip
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bolt_reach:
    value: 4.0
    unit: mm
    kind: design
    source: design
    note: thread standing above the plate's top face = pocket_c + bolt_len - plate_t
      = 5.4 + 10 - 11.4; about 3 threads of 1/4-20, enough to hold a camera and unlikely
      to bottom out in a 5-7 mm socket
  shim_od:
    value: 22.0
    unit: mm
    kind: design
    source: design
    note: must stay inside the 23.6 mm wide top face
  shim_id:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: ''
  shim_t:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: 'contingency spacer: fit between plate and camera if the bolt bottoms out
      in the socket'
  camera_socket_depth:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: asked twice; answered '1/4-20, the usual camera thread'. Typically 5-7 mm;
      the 4.0 mm protrusion is set to sit inside that range
  clamp_slot_depth:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: could not be measured; matters only in that the plate's 11.4 mm thickness
      must exceed it so the camera's base clears the jaws
  clamp_flank_angle:
    value: null
    unit: deg
    kind: world
    source: unknown
    note: the jaws' lip angle was never measured; 45 deg assumed, and the tall flanks
      tolerate a range
parts:
- id: plate
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    # widest at the bottom, flanks leaning\
    \ inward going up, so the jaw lips\n    # wedge the plate DOWN onto the floor\
    \ of the slot\n    w  = p.clamp_plate_w - p.fit_clear_w\n    tw = w - 2.0 * p.flank_h\
    \ / math.tan(math.radians(p.flank_deg))\n    fh = p.flank_h\n    t  = p.plate_t\n\
    \    L  = p.plate_len\n\n    pts = [(-w / 2.0, 0.0), (w / 2.0, 0.0), (tw / 2.0,\
    \ fh),\n           (tw / 2.0, t), (-tw / 2.0, t), (-tw / 2.0, fh)]\n    plate\
    \ = cq.Workplane(\"XY\").polyline(pts).close().extrude(L)\n    # now: x = width,\
    \ y = length, z = height, underside on z = 0\n    plate = plate.rotate((0, 0,\
    \ 0), (1, 0, 0), 90)\n    bb = plate.val().BoundingBox()\n    plate = plate.translate((0.0,\
    \ -(bb.ymin + bb.ymax) / 2.0, -bb.zmin))\n\n    def obround_y(length, width, height):\n\
    \        # rounded-end slot running along y, extruded up from z = 0\n        r\
    \ = width / 2.0\n        straight = max(length - width, 0.001)\n        s = cq.Workplane(\"\
    XY\").rect(width, straight).extrude(height)\n        for cy in (-straight / 2.0,\
    \ straight / 2.0):\n            s = s.union(cq.Workplane(\"XY\").circle(r).extrude(height)\n\
    \                        .translate((0.0, cy, 0.0)))\n        return s\n\n   \
    \ # head pocket, open to the underside, and the slot that the shank passes up\n\
    \    plate = plate.cut(obround_y(p.pocket_len, p.pocket_d, p.pocket_c))\n    plate\
    \ = plate.cut(obround_y(p.slot_len, p.slot_w, t + 2.0))\n    return plate"
  print_orientation: widest (bottom) face flat on the bed, z = 0. The 45 deg flanks
    lean inward going up (a 45 deg overhang, no supports). The bolt pocket is a 17.8
    x 22 mm opening in the bed face whose 5.4 mm ceiling bridges in 5.5 mm steps -
    well inside the 50 mm limit.
  use_orientation: bottom face down, resting flat on the floor of the clamp's slot,
    flanks against the jaw lips; the camera sits on the 23.6 x 37 mm top face
- id: shim
  role: final
  material: PLA
  code: "def build(p):\n    return (cq.Workplane(\"XY\")\n            .circle(p.shim_od\
    \ / 2.0)\n            .circle(p.shim_id / 2.0)\n            .extrude(p.shim_t))"
  print_orientation: flat on the bed, z = 0 - it is a flat ring, nothing to support
  use_orientation: 'optional: laid on the plate''s top face around the bolt thread,
    under the camera, if the bolt bottoms out in the camera''s socket and the camera
    won''t pull down flat'
hardware:
- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_joint
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 5.4
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: bolt head pocket, 17.8 x 22 mm obround in the underside, ceiling at z
      = 5.4
    role: head_seat
  - part: plate
    feature: bolt slot through the 6 mm web above the pocket, 6.8 x 22 mm
    role: clearance
  nut: null
  external: the 1/4-20 tripod socket in the camera's base
criteria:
- id: c_head_pocket
  part: plate
  feature: bolt head pocket (17.8 x 22 mm obround in the underside)
  relation: contains
  hardware: bolt
  clearance_mm: 1.4
  params:
  - pocket_d
  - pocket_len
  - pocket_c
  - bolt_head_d
  - bolt_head_h
  check:
    method: measure
    ref: null
    description: 'Drop the bolt into the plate from underneath: the 15 mm head must
      sit fully inside the pocket, recessed below the plate''s bottom face, and the
      plate must still sit flat on a table.'
- id: c_shank_slot
  part: plate
  feature: bolt slot through the web (6.8 x 22 mm)
  relation: clears
  hardware: bolt
  clearance_mm: 0.2
  params:
  - slot_w
  - slot_len
  - pocket_c
  check:
    method: measure
    ref: null
    description: The 1/4-20 shank must drop through the slot and slide along it by
      about +-3.5 mm without binding.
- id: c_flank_seat
  part: plate
  feature: 45 deg flanks, 7 mm tall, 37.6 mm at the widest
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - flank_deg
  - flank_h
  - clamp_plate_w
  - fit_clear_w
  check:
    method: measure
    ref: null
    description: Loosen the knob, drop the plate between the jaw lips, let it settle
      on the floor of the slot and tighten. It must sit down flat without rocking
      and without riding up. If it rides up, the jaw lip is steeper than the 45 deg
      assumed - report it.
- id: c_width_clears
  part: plate
  feature: widest bottom edge, 37.6 mm
  relation: clears
  hardware: null
  clearance_mm: 0.4
  params:
  - clamp_plate_w
  - fit_clear_w
  check:
    method: measure
    ref: null
    description: With the knob backed off, the plate must drop in with a little play
      on the width; the knob then takes up the rest.
- id: c_thread_engage
  part: plate
  feature: bolt thread standing 4.0 mm proud of the top face
  relation: engages
  hardware: bolt
  clearance_mm: null
  params:
  - pocket_c
  - plate_t
  - bolt_len
  check:
    method: measure
    ref: null
    description: With the bolt seated in the pocket, check that about 4 mm of thread
      stands above the plate's top face. The camera should turn on by about 3 turns
      and land with its base flat on the plate; if it stops against the bolt instead,
      refit with shim.
- id: c_camera_clears_jaws
  part: plate
  feature: top face
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - plate_t
  - clamp_slot_depth
  check:
    method: measure
    ref: null
    description: With the plate clamped in the head, the camera's base must stand
      clear of the top of the jaws. If it fouls, the clamp's slot is deeper than the
      plate's 11.4 mm thickness.
manual:
- n: '1'
  text: 'Print plate.stl and shim.stl in PLA at 0.2 mm layers with no supports, exactly
    as oriented: the plate''s widest face on the bed. The sloped sides overhang 45
    deg and the bolt pocket has a short 5.5 mm bridge, so nothing needs support.'
  parts:
  - plate
  - shim
  hardware: []
  tool: null
- n: '2'
  text: 'Bolt into the plate, on its own: lower the salvaged bolt into the plate from
    underneath so its head goes into the wide pocket in the underside and the thread
    comes up through the narrow slot. The head should sit completely inside (recessed)
    and about 4 mm of thread should stand above the plate''s top face.'
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '3'
  text: 'Drop the plate into the clamp: back the knob off, put the plate between the
    jaw lips with its sloped sides facing the jaws, let it settle down onto the floor
    of the slot, then tighten the knob. It should sit flat and not rock. If instead
    it rides up and refuses to settle, stop and tell me - the jaws are steeper than
    the 45 deg I assumed.'
  parts:
  - plate
  hardware: []
  tool: null
- n: '4'
  text: 'Fit the camera: hold the plate upside down in your left hand with your thumb
    pressed against the exposed bolt head - that stops the bolt spinning - set the
    camera onto the plate, start the thread by hand, then turn the camera to screw
    it down until its base lies flat on the plate''s top face. Once it is snug the
    bolt''s head jams against the pocket and it stops turning.'
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '5'
  text: 'Check the camera-to-plate joint before you trust it: the camera''s base must
    sit flat on the plate with no rocking. If the bolt bottoms out in the camera''s
    socket and the camera sits on the bolt instead of the plate, take it apart and
    refit the printed shim on the plate''s top face, around the thread and under the
    camera.'
  parts:
  - plate
  - shim
  hardware:
  - bolt
  tool: null
- n: '6'
  text: 'Balance and clamp: slide the camera along the slot (about +-3.5 mm) to bring
    its weight over the head, then set the plate into the clamp and nip the knob.
    Check that the camera''s base clears the top of the jaws.'
  parts:
  - plate
  hardware: []
  tool: null
- n: '7'
  text: 'Treat it as the temporary part it is: PLA creeps under a steady load and
    this joint is the camera''s only attachment. Do not overtighten the camera bolt
    or the clamp knob, do not carry the tripod by the camera, and re-check the camera''s
    tightness before each use.'
  parts:
  - plate
  - shim
  hardware:
  - bolt
  tool: null
