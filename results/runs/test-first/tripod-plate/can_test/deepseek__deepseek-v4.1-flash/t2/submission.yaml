task: tripod-plate
note: 'Temporary camera-to-tripod adapter for an Arca-Swiss style clamp: two printed
  PLA parts (plate + optional spacer pad) plus the salvaged 1/4-20 bolt as the real
  thread. The plate is a 37.8 mm wide trapezoid cross-section (45 degree shoulders,
  7 mm band) so the clamp''s angled jaws wedge it down onto the slot floor and stop
  it lifting out; the camera face is 23.8 x 40 mm. The bolt head sits in an 18 mm
  straight bore that ends in a 45 degree conical seat, chosen after the first coupon
  print showed that a flat roof over the recess sags and partly closes the hole -
  a 45 degree cone needs no bridging at all and self-centres the head. Print orientation:
  widest face on the bed, so the dovetail is formed with no overhangs. PLA creeps,
  so treat it as temporary and do not overtighten.'
questions:
- text: How hard is it? Easy - the plate is a single flat print with no supports,
    and the thread is your existing steel 1/4-20 bolt rather than printed plastic,
    which is the part that would have failed. Only the plate and the little pad are
    printed.
  answer: null
- text: 'Expected answer to ''how deep is your clamp''s slot'': not measured. If the
    slot is deeper than about 7 mm the plate will still clamp and sit flat, but the
    jaws will be gripping the plate''s straight sides instead of its 45 degree shoulders.
    Tell me the depth (or how far the plate sinks) and I will lengthen the shoulder
    band.'
  answer: null
- text: 'Expected answer to ''how long a plate does your clamp take'': not measured.
    The plate is 40 mm long. If your clamp''s slot is shorter than that, say so and
    I will trim the plate - the bolt and recess are centred, so it shortens from both
    ends.'
  answer: null
- text: 'Expected answer to ''what shape is the bolt head'': guessed round (about
    15 mm across). The 18 mm recess also swallows a 15 mm hex head across its corners.
    If it is some other shape, the coupon print will show it.'
  answer: null
params:
  clamp_plate_w:
    value: 38.0
    unit: mm
    kind: world
    source: measured
    note: the width of plate the tripod clamp takes, as measured
  bolt_head_d:
    value: 15.0
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam bolt head, across
  bolt_head_h:
    value: 5.0
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam bolt head height
  bolt_shank_l:
    value: 10.0
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam bolt, underside of head to thread tip
  socket_thread_major:
    value: 6.35
    unit: mm
    kind: world
    source: catalog
    note: camera tripod socket is 1/4-20 UNC (1/4 in = 6.35 mm), person confirmed
  camera_socket_depth:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: not measured. Typical sockets are about 6.35 mm deep; this is what limits
      how much thread the bolt can use
  clamp_slot_depth:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: distance from the jaw tops down to the slot floor, not measured. The 7 mm
      shoulder band is sized to cover the usual 3-8 mm
  plate_w:
    value: 37.8
    unit: mm
    kind: design
    source: design
    note: widest width, at the clamp-side face = 38 measured minus 0.2 so it drops
      in freely
  taper:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: height of the 45 degree shoulder band the jaws' lips grip, measured up from
      the clamp face
  narrow_w:
    value: 23.8
    unit: mm
    kind: design
    source: design
    note: camera-side face width = plate_w - 2 x taper
  plate_len:
    value: 40.0
    unit: mm
    kind: design
    source: design
    note: plate length; must be shorter than your clamp slot
  plate_t:
    value: 10.5
    unit: mm
    kind: design
    source: design
    note: plate thickness; sets the thread left in the camera
  pocket_dia:
    value: 18.0
    unit: mm
    kind: design
    source: design
    note: bore that swallows the bolt head = head_d 15 + 1.5 clearance; also clears
      a 15 mm hex head across its corners
  pocket_cyl_d:
    value: 5.3
    unit: mm
    kind: design
    source: design
    note: depth of the straight bore from the clamp face; deeper than the 5 mm head
  hole_dia:
    value: 9.0
    unit: mm
    kind: design
    source: design
    note: clearance hole for the 1/4-20 shank, and the small end of the seat cone
  seat_h:
    value: 6.8
    unit: mm
    kind: design
    source: design
    note: how far the head sits above the clamp face when seated = pocket_cyl_d +
      (pocket_dia - bolt_head_d)/2
  protrusion:
    value: 6.3
    unit: mm
    kind: design
    source: design
    note: thread standing proud of the camera face = seat_h + bolt_shank_l - plate_t.
      Add the pad if the camera's socket is shallower than this
  pad_t:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: spacer pad thickness; print a second one and stack if the bolt bottoms out
      too early
  pad_w:
    value: 23.6
    unit: mm
    kind: design
    source: design
    note: pad width, just inside the 23.8 mm camera face
  pad_len:
    value: 39.6
    unit: mm
    kind: design
    source: design
    note: pad length, just inside the 40 mm plate
  pad_id:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: pad bore, clears the shank
  coupon_block:
    value: 30.0
    unit: mm
    kind: design
    source: design
    note: test block size for the seat coupon
  clamp_clearance:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: plate width allowance for dropping into the clamp
  hole_clearance:
    value: 1.325
    unit: mm
    kind: design
    source: design
    note: (hole_dia - socket_thread_major)/2
  pocket_clearance:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: (pocket_dia - bolt_head_d)/2
parts:
- id: plate
  role: final
  material: PLA
  code: "def build(p):\n    hw = p.plate_w / 2.0\n    hn = p.narrow_w / 2.0\n    tt\
    \ = p.plate_t\n    hl = p.plate_len / 2.0\n\n    def rect(hx, z):\n        pts\
    \ = [(-hx, -hl), (hx, -hl), (hx, hl), (-hx, hl)]\n        return cq.Wire.makePolygon([cq.Vector(x,\
    \ y, z) for x, y in pts], close=True)\n\n    # trapezoid cross-section: widest\
    \ at z=0 (clamp face), 45 deg shoulders, flat camera face on top\n    body = cq.Workplane(obj=cq.Solid.makeLoft([rect(hw,\
    \ 0.0), rect(hn, p.taper), rect(hn, tt)], ruled=True))\n\n    # bolt-head void:\
    \ straight bore, then a 45 deg cone down to the clearance hole\n    cone_h = (p.pocket_dia\
    \ - p.hole_dia) / 2.0\n    bore = cq.Solid.makeCylinder(p.pocket_dia / 2.0, p.pocket_cyl_d\
    \ + 0.5, cq.Vector(0, 0, -0.5))\n    seat = cq.Solid.makeCone(p.pocket_dia / 2.0,\
    \ p.hole_dia / 2.0, cone_h, cq.Vector(0, 0, p.pocket_cyl_d))\n    hole = cq.Solid.makeCylinder(p.hole_dia\
    \ / 2.0, tt + 1.0, cq.Vector(0, 0, -0.5))\n    void = cq.Workplane(obj=bore.fuse(seat).fuse(hole))\n\
    \    return body.cut(void)\n"
  print_orientation: clamp-side face (the 37.8 mm wide one, with the bolt recess in
    it) on the bed at z = 0; nothing overhangs more than 45 deg and nothing bridges
  use_orientation: wide face down in the tripod clamp, camera face up; the 1/4-20
    bolt goes up through the recess from below and screws into the camera
- id: pad
  role: final
  material: PLA
  code: "def build(p):\n    body = cq.Workplane('XY').box(p.pad_w, p.pad_len, p.pad_t,\
    \ centered=(True, True, False))\n    body = body.faces('>Z').workplane().hole(p.pad_id)\n\
    \    return body\n"
  print_orientation: flat on the bed (z = 0)
  use_orientation: optional 1 mm spacer laid on the plate's camera face, under the
    camera, if the bolt bottoms out in the camera's socket before the camera's base
    touches the plate
- id: coupon_seat
  role: coupon
  material: PLA
  code: "def build(p):\n    b = p.coupon_block\n    tt = p.plate_t\n    body = cq.Workplane('XY').box(b,\
    \ b, tt, centered=(True, True, False))\n    cone_h = (p.pocket_dia - p.hole_dia)\
    \ / 2.0\n    bore = cq.Solid.makeCylinder(p.pocket_dia / 2.0, p.pocket_cyl_d +\
    \ 0.5, cq.Vector(0, 0, -0.5))\n    seat = cq.Solid.makeCone(p.pocket_dia / 2.0,\
    \ p.hole_dia / 2.0, cone_h, cq.Vector(0, 0, p.pocket_cyl_d))\n    hole = cq.Solid.makeCylinder(p.hole_dia\
    \ / 2.0, tt + 1.0, cq.Vector(0, 0, -0.5))\n    void = cq.Workplane(obj=bore.fuse(seat).fuse(hole))\n\
    \    return body.cut(void)\n"
  print_orientation: 'same as the plate: recess mouth on the bed at z = 0'
  use_orientation: 'test piece only: push the salvaged bolt up through it and check
    the head drops into the recess and rests on the cone, with the shank coming out
    of the far side'
