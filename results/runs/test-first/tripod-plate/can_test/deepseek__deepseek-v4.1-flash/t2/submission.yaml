- id: c7_clamp_face_seats
  part: plate
  feature: clamp-side face, 37.8 x 40 mm
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - plate_w
  - plate_len
  check:
    method: measure
    ref: null
    description: this flat face rests on the floor of the clamp slot; the bolt head
      is fully inside the plate so nothing lifts the plate off it
manual:
- n: '1'
  text: 'Print coupon_seat first (PLA, 0.2 mm layers, no supports, recess mouth down
    on the bed). Push the salvaged bolt''s head into the 18 mm recess: the head should
    drop in and stop with its face resting on the cone, about 1.8 mm below the block''s
    face, and the thread should poke out of the far side through the 9 mm hole. If
    the head won''t go in, or the hole is clogged, stop and tell me before printing
    the plate.'
  parts:
  - coupon_seat
  hardware:
  - bolt
  tool: null
- n: '2'
  text: Print plate (PLA, 0.2 mm layers, no supports). The 37.8 mm wide face goes
    on the bed, with the bolt recess opening downwards onto the plate. There are no
    overhangs past 45 degrees and nothing to bridge, so no supports are needed.
  parts:
  - plate
  hardware: []
  tool: null
- n: '3'
  text: Print pad (flat, 0.2 mm layers). Keep it aside - it is only used if step 6
    needs it.
  parts:
  - pad
  hardware: []
  tool: null
- n: '4'
  text: 'Seat the 1/4-20 bolt into the plate: drop it head-first into the recess from
    the clamp side, so the head sits on the cone and about 6.3 mm of thread stands
    proud of the plate''s flat camera face.'
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '5'
  text: Holding the plate in your hand, set the camera on the plate's camera face
    and turn the camera to thread the bolt up into its 1/4-20 socket (the bolt cannot
    be reached with fingers once seated, so turn the camera, not the bolt). Snug it
    by hand - the head wedges into the cone and self-centres. The camera's base should
    come to rest on the plate.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '6'
  text: If the bolt bottoms out in the socket and the camera's base sits proud of
    the plate (it will rock), unscrew it, lay one pad on the camera face, and screw
    up again. Two pads can be stacked if one is not enough.
  parts:
  - plate
  - pad
  hardware:
  - bolt
  tool: null
- n: '7'
  text: Drop the plate into the tripod clamp with the wide 37.8 mm face down and the
    camera facing up, so the angled shoulders sit under the jaws' angled lips. Tighten
    the clamp knob until it bites. The wedge action pulls the plate down onto the
    slot floor and the lips keep it from lifting out.
  parts:
  - plate
  hardware: []
  tool: null
- n: '8'
  text: 'Check before trusting it: the camera must not rock or twist on the plate,
    and the plate must not lift or shift in the clamp. Tighten the clamp knob firmly
    but do not lean on it - PLA creeps under sustained load, and this is a temporary
    part. Take the camera off when it is not in use.'
  parts:
  - plate
  hardware: []
  tool: null
