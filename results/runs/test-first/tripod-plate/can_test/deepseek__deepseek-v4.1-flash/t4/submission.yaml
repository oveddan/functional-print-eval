manual:
- n: '1'
  text: Print fit_slice first - PLA, as modelled, flat on its wide face. It is the
    same cross-section as the plate, so it tests the fit before you spend the filament.
  parts:
  - fit_slice
  hardware: []
  tool: null
- n: '2'
  text: Open the tripod clamp and slide the slice in from the open end, wide face
    toward the clamp floor. It should enter and be gripped by the two slanted flanks,
    and sit flat without rocking. If it will not go in, stop - the clamp is not the
    38 mm dovetail I assumed, and the plate needs changing.
  parts:
  - fit_slice
  hardware: []
  tool: null
- n: '3'
  text: Drop the salvaged 1/4-20 bolt into the slice's taper from underneath. The
    head should sink about 1.4 mm, stop on the taper and self-centre, leaving roughly
    5.4 mm of thread standing proud of the top face.
  parts:
  - fit_slice
  hardware:
  - webcam_bolt
  tool: null
- n: '4'
  text: Print plate and thumbscrew, each in the orientation given. No supports are
    needed for either.
  parts:
  - plate
  - thumbscrew
  hardware: []
  tool: null
- n: '5'
  text: 'Fit the bolt to the camera: drop it through the plate''s taper from below
    (head resting in the taper), set the camera on the plate''s flat face with the
    bolt lined up with its socket, then turn the bolt''s head by hand until the camera
    beds down flat on the plate. If you are using the printed thumbscrew instead,
    turn it with a coin in its slot.'
  parts:
  - plate
  - thumbscrew
  hardware:
  - webcam_bolt
  tool: null
- n: '6'
  text: Check there is no gap between the camera's base and the plate. If the bolt
    bottoms out in the socket before the camera beds down, take it out and file about
    1 mm off the end of the thread, then refit.
  parts: []
  hardware:
  - webcam_bolt
  tool: null
- n: '7'
  text: Slide the plate into the clamp from the open end - flanks down, camera face
    up - and close the clamp. Nothing should rock.
  parts:
  - plate
  hardware: []
  tool: null
- n: '8'
  text: 'To balance the camera, loosen the clamp, slide the plate fore and aft, and
    close it again. Finger-tight only: the clamp screw will crush a printed flank
    if you lean on it.'
  parts:
  - plate
  hardware: []
  tool: null
- n: '9'
  text: To take the camera off, open the clamp, lift the plate out, and unscrew the
    bolt from the camera's socket.
  parts:
  - plate
  hardware:
  - webcam_bolt
  tool: null
