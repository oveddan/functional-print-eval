parts:
- id: plate
  role: final
  material: PLA (high-speed, black)
  code: "import math\n\ndef build(p):\n    T = p.plate_t\n    W = p.clamp_plate_width\
    \ - p.flange_clearance\n    Wb = W - 2.0 * p.flank_h * math.tan(math.radians(p.flank_angle))\n\
    \    L = p.plate_len\n\n    body = cq.Workplane(\"XY\").rect(Wb, L).extrude(T\
    \ - p.flank_h)\n    fl = (cq.Workplane(\"XY\").rect(Wb, L)\n          .workplane(offset=p.flank_h).rect(W,\
    \ L).loft()\n          .translate((0, 0, T - p.flank_h)))\n    plate = body.union(fl)\n\
    \n    for sel in (\">Z\", \"<Z\"):\n        try:\n            plate = plate.faces(sel).edges().chamfer(p.edge_chamfer)\n\
    \        except Exception:\n            pass\n\n    pocket = (cq.Workplane(\"\
    XY\").circle(p.head_pocket_d / 2.0)\n              .extrude(p.head_pocket_depth)\n\
    \              .translate((0, 0, -p.head_pocket_depth)))\n    plate = plate.cut(pocket)\n\
    \n    hole = (cq.Workplane(\"XY\").circle(p.bolt_clearance_d / 2.0)\n        \
    \    .extrude(T + 2.0).translate((0, 0, -1.0)))\n    plate = plate.cut(hole)\n\
    \n    ch = p.grip_depth + 2.0\n    zc = T - p.grip_depth + ch / 2.0\n    cutters\
    \ = None\n    n = int(p.grip_count)\n    for i in range(-n, n + 1):\n        a\
    \ = (cq.Workplane(\"XY\").box(p.grip_w, L - 6.0, ch)\n             .translate((i\
    \ * p.grip_pitch, 0, zc)))\n        b = (cq.Workplane(\"XY\").box(W - 8.0, p.grip_w,\
    \ ch)\n             .translate((0, i * p.grip_pitch, zc)))\n        cutters =\
    \ a if cutters is None else cutters.union(a)\n        cutters = cutters.union(b)\n\
    \    plate = plate.cut(cutters)\n    return plate\n"
  print_orientation: Flat on the bed on the pocketed face (the underside that meets
    the clamp floor), so the dovetail flange and the grip cross-hatch are at the top.
    The 39.5 degree flange overhangs and the 4.4 mm wide annulus over the bolt-head
    pocket is the only bridge - both well inside what this printer does. No supports
    anywhere.
  use_orientation: 'As printed: the pocketed face down onto the clamp''s floor, the
    wide cross-hatched face up under the camera. The flange slides into the clamp
    from the end.'
- id: spacer_ring
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    r = cq.Workplane(\"XY\").circle(p.ring_od / 2.0).extrude(p.ring_t)\n\
    \    hole = (cq.Workplane(\"XY\").circle(p.ring_id / 2.0)\n            .extrude(p.ring_t\
    \ + 2.0).translate((0, 0, -1.0)))\n    return r.cut(hole)\n"
  print_orientation: Flat on the bed, either face down.
  use_orientation: Dropped into the plate's bolt-head pocket before the bolt, so the
    head stands 2.1 mm proud of the plate's underside and can be pinched to tighten.
- id: shim
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    s = cq.Workplane(\"XY\").box(p.shim_w, p.shim_l, p.shim_t,\
    \ centered=(True, True, False))\n    hole = (cq.Workplane(\"XY\").circle(p.shim_hole_d\
    \ / 2.0)\n            .extrude(p.shim_t + 2.0).translate((0, 0, -1.0)))\n    return\
    \ s.cut(hole)\n"
  print_orientation: Flat on the bed - the 3 mm plate lies flat, the clearance hole
    prints as a circle.
  use_orientation: 'Only if needed: slipped under the plate so the plate sits higher
    in a slot that is deeper than 9 mm, letting the jaws meet its flanks.'
- id: coupon_fit
  role: coupon
  material: PLA (high-speed, black)
  code: "import math\n\ndef build(p):\n    W = p.clamp_plate_width - p.flange_clearance\n\
    \    Wb = W - 2.0 * p.flank_h * math.tan(math.radians(p.flank_angle))\n    Ls\
    \ = p.coupon_step_len\n    ts = [p.coupon_t_min + i * p.coupon_t_inc for i in\
    \ range(int(p.coupon_steps))]\n\n    strip = None\n    x = 0.0\n    for t in ts:\n\
    \        body = cq.Workplane(\"XY\").rect(Wb, Ls).extrude(t - p.flank_h)\n   \
    \     fl = (cq.Workplane(\"XY\").rect(Wb, Ls)\n              .workplane(offset=p.flank_h).rect(W,\
    \ Ls).loft()\n              .translate((0, 0, t - p.flank_h)))\n        st = body.union(fl).translate((x,\
    \ 0, 0))\n        strip = st if strip is None else strip.union(st)\n        x\
    \ += Ls\n\n    h = (cq.Workplane(\"XY\").box(p.coupon_handle_l, 20, ts[-1], centered=(True,\
    \ True, False))\n         .translate((-p.coupon_handle_l / 2.0, 0, 0)))\n    strip\
    \ = strip.union(h)\n    try:\n        strip = strip.faces(\"<Z\").edges().chamfer(1.0)\n\
    \    except Exception:\n        pass\n    return strip\n"
  print_orientation: Flat on the bed, bottom face down, flange up - identical to how
    the plate prints.
  use_orientation: 'A gauge: five steps of the plate''s exact cross-section, in order
    from the grip tab 7, 8, 9, 10 and 11 mm thick. Slide each step into the borrowed
    clamp; the 9 mm step is the plate.'
hardware:
- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: j_camera_screw
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: bolt-head pocket, D15.8 x 5.4 counterbore in the underside (the head
      bears on its ceiling at z=5.4)
    role: head_seat
  - part: plate
    feature: D7.0 through hole
    role: clearance
  nut: null
  external: the camera's 1/4-20 tripod socket (0.25 in, thread standing 6 mm above
    the plate's top face)
criteria:
- id: c_flange_fit
  part: plate
  feature: dovetail flange, 37.5 mm at the top face over a 4 mm tall taper
  relation: clears
  hardware: null
  clearance_mm: 0.5
  params:
  - clamp_plate_width
  - flange_clearance
  - flank_angle
  - flank_h
  check:
    method: coupon
    ref: coupon_fit
    description: 'the 9 mm step is the plate''s cross-section: it should slide into
      the 38 mm slot with light drag and the jaws should close onto the tapered flanks.
      Never measured, only reported as a 38 mm plate width - if the step will not
      enter, the plate is too wide and needs telling.'
- id: c_plate_thickness
  part: plate
  feature: 9 mm body sitting in the clamp slot
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - plate_t
  check:
    method: measure
    ref: null
    description: 'the slot''s depth was never measured, so 9 mm is a compromise: thick
      enough for a straight-walled clamp that grips the plate''s sides, thin enough
      for a dovetail clamp that hangs the plate from its jaws. If the plate lands
      on the floor and the jaws close on nothing, add the shim.'
- id: c_head_pocket
  part: plate
  feature: bolt-head pocket D15.8 x 5.4
  relation: contains
  hardware: bolt
  clearance_mm: 0.8
  params:
  - head_pocket_d
  - head_pocket_depth
  - bolt_head_d
  - bolt_head_h
  check:
    method: coupon
    ref: coupon_fit
    description: round pocket 0.8 mm bigger than the head's widest dimension, so it
      accepts the head whatever its shape; the head should drop in and finish flush
      with the plate's underside.
- id: c_hole_clearance
  part: plate
  feature: D7.0 through hole
  relation: clears
  hardware: bolt
  clearance_mm: 0.65
  params:
  - bolt_clearance_d
  - thread_d
  check:
    method: template
    ref: null
    description: 0.65 mm total over the 6.35 mm thread; the screw must spin freely
      in the plate and take the plate up with it only at the head.
- id: c_thread_engagement
  part: plate
  feature: thread standing 6 mm above the plate's top face (z = 9)
  relation: engages
  hardware: bolt
  clearance_mm: null
  params:
  - bolt_thread_len
  - bolt_head_h
  - plate_t
  - bolt_thread_above_plate
  check:
    method: template
    ref: null
    description: '6 mm of 1/4-20 = about 4.7 threads in the camera''s socket, and
      a standard tripod screw is only 5.5 to 6.5 mm long, so this matches a real plate.
      It is also the whole reason the plate is 9 mm and not 12: the bolt has just
      10 mm of thread, so a thicker plate would leave the screw short of the socket.'
- id: c_camera_face
  part: plate
  feature: 60 x 37.5 mm cross-hatched top face under the camera
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - plate_len
  - clamp_plate_width
  - grip_pitch
  - grip_w
  - grip_depth
  - camera_socket_depth
  check:
    method: measure
    ref: null
    description: the camera's base must sit flat and firm on this face with no rocking;
      rocking means the screw has bottomed out in the socket, which was never measured
      (7 mm is a guess). The 0.5 mm cross-hatch is what stops the camera twisting
      once the screw is hand-tight.
- id: c_ring_fit
  part: spacer_ring
  feature: D15.5 OD inside the plate's D15.8 pocket
  relation: clears
  hardware: null
  clearance_mm: 0.3
  params:
  - ring_od
  - head_pocket_d
  - ring_t
  - head_protrusion_ring
  check:
    method: none
    ref: null
    description: drops into the pocket between the head and the pocket ceiling; with
      it fitted the head stands 2.1 mm proud and can be pinched to tighten. Optional
      - only if the flush head is too hard to grip.
- id: c_shim_fit
  part: shim
  feature: D18 clearance for the bolt head
  relation: clears
  hardware: null
  clearance_mm: 1.5
  params:
  - shim_hole_d
  - bolt_head_d
  check:
    method: none
    ref: null
    description: optional under-plate spacer for a slot deeper than 9 mm; its hole
      clears the head and the head's bearing stays on the plate.
manual:
- n: '1'
  text: 'Print the gauge strip first if you have not already: its steps are the plate''s
    exact cross-section, and the third step from the grip tab is 9 mm, the thickness
    of the plate.'
  parts:
  - coupon_fit
  hardware: []
  tool: Bambu Lab X1C, PLA, 0.2 mm layers, no supports
- n: '2'
  text: 'Slide the gauge into the borrowed clamp from the end and try the 9 mm step.
    It should enter with light drag and the jaws should close onto its tapered flanks;
    the steps either side (8 and 10 mm) tell you the direction the fit is off. Too
    tight: rub the flanks with sandpaper. Too loose: keep turning the clamp''s screw.
    If the 9 mm step will not enter at all, stop - the plate is too thick for this
    clamp and it needs telling.'
  parts:
  - coupon_fit
  hardware: []
  tool: the borrowed head's clamp screw, sandpaper
- n: '3'
  text: Print the plate, the spacer ring and (only if step 8 calls for it) the shim
    in black PLA at 0.2 mm, no supports. The plate prints flat on the face with the
    round pocket, with the wide flanged face up, and takes about half an hour.
  parts:
  - plate
  - spacer_ring
  - shim
  hardware: []
  tool: Bambu Lab X1C
- n: '4'
  text: Drop the webcam bolt head-first into the round pocket in the plate's flat
    underside. The head must finish flush with that face and the screw must spin freely;
    if it is a tight push, that is fine.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '5'
  text: Stand the camera on the cross-hatched face of the plate and wind the screw
    up into the camera's tripod socket by pinching the head between finger and thumb.
    Keep winding until the camera's base sits down flat and firm on the plate. Hand-tight
    only - the screw only reaches about 6 mm into the socket, so do not force it and
    do not overtighten.
  parts:
  - plate
  hardware:
  - bolt
  tool: fingers
- n: '6'
  text: If the recessed head is too awkward to grip, take the camera off, drop the
    spacer ring into the pocket, and put the bolt back in under it. The head now stands
    2.1 mm proud of the plate's underside and can be pinched properly; note the whole
    assembly then sits 2 mm lower in the clamp.
  parts:
  - plate
  - spacer_ring
  hardware:
  - bolt
  tool: fingers
- n: '7'
  text: 'Slide the plate into the clamp from the end - the flanged, cross-hatched
    face up - and turn the clamp''s screw in until the plate cannot rock, twist or
    slide. Then grip the camera and try to twist it about the screw: it must not move.'
  parts:
  - plate
  hardware:
  - bolt
  tool: the borrowed head's clamp screw
- n: '8'
  text: Check the camera's base sits flat on the plate with no rocking. Rocking means
    the screw is bottoming out in the camera's socket (it is 6 mm proud, and a standard
    screw is only 5.5 to 6.5 mm, so it should be fine - but tell me if it rocks).
    If instead the plate sits on the clamp's floor and the jaws close on nothing,
    slide the shim under the plate so the jaws meet its flanks.
  parts:
  - plate
  - shim
  hardware: []
  tool: calipers
- n: '9'
  text: Treat it as temporary. PLA creeps under a steady load, so check the screw
    is still tight before every session, keep the camera's weight off the plate when
    you are not using it, and do not hang a camera on it that you would mind dropping.
    The plate is the flat part you asked about; the screw is your salvaged bolt -
    deliberately not printed, because a plastic thread in the camera's metal socket
    is the one failure that could damage the camera.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
