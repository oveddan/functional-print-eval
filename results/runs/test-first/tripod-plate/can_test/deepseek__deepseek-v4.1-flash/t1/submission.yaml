task: tripod-plate
note: 'A two-part answer to a one-part problem: the flat plate is printed, the screw
  is not - the salvaged webcam-mount bolt IS the 1/4-20 tripod screw, and a printed
  thread in a camera''s brass socket is the one failure that could damage the camera.
  The bolt''s 15 mm head drops into a pocket in the plate''s underside, and the plate''s
  thickness is deliberately 9 mm so the screw stands 6 mm proud of the plate''s top
  face - the thread length of a real tripod screw, so the camera''s socket takes it
  without bottoming out. Two uncertainties were never resolvable: the clamp''s slot
  depth (the person kept answering 38 mm, the width, so the plate''s thickness is
  my best compromise: 9 mm fits both a dovetail clamp that hangs the plate from the
  jaws and a straight-walled clamp that grips the plate''s sides, and the printed
  gauge strip lets them find out before printing the plate), and the shape of the
  bolt''s head (only 15 x 5 mm, so a round pocket that accepts anything). The spacer
  ring is the fix for the bolt''s other weakness: with it the head stands 2.1 mm proud
  of the plate''s underside, so it can actually be pinched to tighten. PLA creeps,
  so this is a temporary plate - check the screw before each session.'
questions: []
params:
