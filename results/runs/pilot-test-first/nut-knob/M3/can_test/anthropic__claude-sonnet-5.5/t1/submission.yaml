task: nut-knob/M3
note: Pocket AF = 5.5 + 0.2 = 5.7 mm, validated by print test (coupon-c). Bolt tip
  exits through the 3.4 mm hole in the top of the knob; the knob is 10 mm tall, so
  use a bolt long enough to pass through the nut.
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height
  nut_fit_clr:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: 'Added to nut AF. Chosen from the print test: 0.0 won''t go in, 0.1 struggles,
      0.2 pushes in snug and stays in when inverted.'
  pocket_depth:
    value: 2.7
    unit: mm
    kind: design
    source: design
    note: nut height + 0.3 so the nut sits fully inside
  bolt_hole_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: M3 clearance hole through the knob
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: about 20 mm across
  knob_h:
    value: 10
    unit: mm
    kind: design
    source: design
    note: ''
  top_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_n:
    value: 10
    unit: count
    kind: design
    source: design
    note: grip scallops
  scallop_r:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_h:
    value: 5
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    af = p.nut_af + p.nut_fit_clr\n    d = af\
    \ / math.cos(math.radians(30))\n    body = cq.Workplane('XY').circle(p.knob_d\
    \ / 2).extrude(p.knob_h)\n    body = body.faces('>Z').edges().chamfer(p.top_chamfer)\n\
    \    R = p.knob_d / 2 + p.scallop_r * 0.4\n    n = int(p.scallop_n)\n    for i\
    \ in range(n):\n        a = 2 * math.pi * i / n\n        cut = (cq.Workplane('XY').center(R\
    \ * math.cos(a), R * math.sin(a))\n               .circle(p.scallop_r).extrude(p.knob_h))\n\
    \        body = body.cut(cut)\n    pocket = cq.Workplane('XY').polygon(6, d).extrude(p.pocket_depth)\n\
    \    hole = cq.Workplane('XY').circle(p.bolt_hole_d / 2).extrude(p.knob_h)\n \
    \   return body.cut(pocket).cut(hole)\n"
  print_orientation: nut pocket opening face down on the bed (flat face of knob on
    bed)
  use_orientation: pocket facing the work, knob top facing the user
- id: coupon-c
  role: coupon
  material: PLA
  code: "import math\ndef build(p):\n    af = p.nut_af + p.nut_fit_clr\n    d = af\
    \ / math.cos(math.radians(30))\n    body = cq.Workplane('XY').circle(7).extrude(p.coupon_h)\n\
    \    pocket = cq.Workplane('XY').polygon(6, d).extrude(p.pocket_depth)\n    hole\
    \ = cq.Workplane('XY').circle(p.bolt_hole_d / 2).extrude(p.coupon_h)\n    return\
    \ body.cut(pocket).cut(hole)\n"
  print_orientation: pocket opening face down on the bed
  use_orientation: pocket opening facing down
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: c1
  part: knob
  feature: hex nut pocket
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - nut_fit_clr
  - nut_h
  - pocket_depth
  check:
    method: coupon
    ref: coupon-c
    description: '5.7 mm AF pocket: nut pushes in by hand, snug, stays in when inverted
      and shaken.'
- id: c2
  part: knob
  feature: closed ceiling above nut pocket (hole smaller than nut)
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - bolt_hole_d
  - nut_af
  check:
    method: measure
    ref: null
    description: Through hole 3.4 mm is smaller than the 5.5 mm nut AF, so the nut
      cannot pass out the far side.
- id: c3
  part: knob
  feature: M3 through hole
  relation: clears
  hardware: nut
  clearance_mm: 0.4
  params:
  - bolt_hole_d
  check:
    method: measure
    ref: null
    description: 3.4 mm hole lets M3 bolt pass through nut and out the top.
manual:
- n: '1'
  text: Print the knob with the large flat face (the hex pocket opening) on the bed.
    No supports needed; the 6 mm ceiling over the pocket bridges fine.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Press the M3 hex nut flat into the hex pocket on the underside by hand (a
    firm push with a thumb or on a table), until it bottoms out against the ceiling.
    Fit is snug on purpose.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Thread your M3 bolt in through the nut from the pocket side and turn the knob
    until the bolt tip comes through the hole in the top. Use the knob to tighten.
  parts:
  - knob
  hardware:
  - nut
  tool: null
