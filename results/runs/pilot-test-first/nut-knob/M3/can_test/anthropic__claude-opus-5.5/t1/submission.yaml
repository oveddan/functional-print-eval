task: nut-knob/M3
note: Nut pocket 5.70 mm across flats, picked from the coupon tests. Knob 20 mm across
  and 7 mm thick, 8 finger scallops, chamfered top edge. A 4.3 mm floor with a 3.4
  mm hole stops the nut pushing through.
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  pocket_af_extra:
    value: 0.2
    unit: mm
    kind: design
    source: measured
    note: coupon fit_570 (5.70 AF) went in by hand with pushing, nut stayed in when
      the part was turned over and shaken; 5.60 really struggled and 5.45 wouldn't
      go in
  pocket_depth_extra:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: nut sits 0.2 below the face, fully inside; same as the coupon
  bolt_clear:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: ''
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: ''
  knob_h:
    value: 7
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_r:
    value: 1.6
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_n:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    r=p.knob_d/2\n    k=cq.Workplane('XY').circle(r).extrude(p.knob_h)\n\
    \    for i in range(int(p.scallop_n)):\n        a=2*math.pi*i/p.scallop_n\n  \
    \      k=k.cut(cq.Workplane('XY').center(r*math.cos(a),r*math.sin(a)).circle(p.scallop_r).extrude(p.knob_h))\n\
    \    try:\n        k=k.faces('>Z').edges().chamfer(0.6)\n    except Exception:\n\
    \        pass\n    depth=p.nut_h+p.pocket_depth_extra\n    af=p.nut_af+p.pocket_af_extra\n\
    \    k=k.cut(cq.Workplane('XY').workplane(offset=p.knob_h-depth).polygon(6,af/math.cos(math.pi/6)).extrude(depth+1))\n\
    \    k=k.cut(cq.Workplane('XY').circle((p.bolt_d+p.bolt_clear)/2).extrude(p.knob_h+1))\n\
    \    return k"
  print_orientation: flat bearing face (pocket floor side) on the bed, hex pocket
    opening facing up; no supports, no bridges
  use_orientation: bearing face against the workpiece, nut pocket opening facing away
    from it so tightening loads the nut against the floor
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: nut_retained
  part: knob
  feature: hex pocket
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - pocket_af_extra
  - nut_h
  - pocket_depth_extra
  check:
    method: coupon
    ref: fit_570
    description: Nut pressed in by hand, stayed in when turned over and shaken
- id: bolt_through
  part: knob
  feature: through hole
  relation: clears
  hardware: null
  clearance_mm: 0.4
  params:
  - bolt_d
  - bolt_clear
  check:
    method: none
    ref: null
    description: 3.4 mm hole lets the M3 bolt pass out the far side; the floor stops
      the nut being pushed through
manual:
- n: '1'
  text: Print the knob in PLA, flat face on the bed and hex pocket facing up. You
    don't need supports. Use 3 or more walls, or 30%+ infill.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Line the M3 nut up with the hex pocket and press it in by hand until it bottoms
    out. It should sit just under the surface, the same as on the 5.70 test piece.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Thread the M3 bolt in from the pocket side through the nut and out the flat
    face, or use it on a bolt that's already fitted. The flat face goes against the
    work. Turn the knob by hand to tighten.
  parts:
  - knob
  hardware:
  - nut
  tool: null
