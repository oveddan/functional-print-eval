parts:
- id: knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "import math\n\ndef build(p):\n    od = p.knob_od\n    h = p.knob_h\n    depth\
    \ = p.nut_h + p.pocket_clr\n    # plain body\n    res = cq.Workplane(\"XY\").circle(od\
    \ / 2.0).extrude(h)\n    # nut socket: hexagon across flats, with the corners\
    \ scalloped back by a\n    # circle so the nut's sharp corners don't jam on the\
    \ printer's rounded ones\n    d = p.pocket_af / math.cos(math.radians(30))\n \
    \   R = p.pocket_af / math.sqrt(3) - p.corner_relief\n    zb = h - depth\n   \
    \ hexwp = cq.Workplane(\"XY\").transformed(offset=(0, 0, zb)).polygon(6, d).extrude(depth\
    \ + 1.0)\n    cylwp = cq.Workplane(\"XY\").transformed(offset=(0, 0, zb)).circle(R).extrude(depth\
    \ + 1.0)\n    res = res.cut(hexwp.intersect(cylwp))\n    # lead-in chamfer on\
    \ the socket mouth and a chamfer on the top rim\n    res = res.faces(\">Z\").edges().chamfer(p.mouth_chamfer)\n\
    \    # bolt guide hole through the whole part, with a chamfered entry on the bottom\n\
    \    res = res.cut(cq.Workplane(\"XY\").circle(p.bolt_clear_d / 2.0).extrude(h\
    \ + 2.0))\n    res = res.faces(\"<Z\").edges().chamfer(p.bottom_chamfer)\n   \
    \ # grip flutes around the rim\n    for i in range(int(p.flute_count)):\n    \
    \    a = 2.0 * math.pi * i / p.flute_count\n        res = res.cut(cq.Workplane(\"\
    XY\")\n                      .transformed(offset=(p.flute_center_r * math.cos(a),\n\
    \                                           p.flute_center_r * math.sin(a), -1.0))\n\
    \                      .circle(p.flute_r).extrude(h + 2.0))\n    return res\n"
  print_orientation: Flat bottom face (the plain face with the 3.6 mm hole) on the
    bed, z = 0. Hex socket opening upward, flutes vertical. No supports needed; the
    socket floor is fully supported and the socket walls are vertical.
  use_orientation: Bottom face down (against the part being clamped), hex socket in
    the top face, nut pressed into the socket from above.
- id: fit_gauge
  role: coupon
  material: PLA (high-speed PLA, black)
  code: "import math\n\ndef build(p):\n    t = p.gauge_t\n    L = p.gauge_l\n    W\
    \ = p.gauge_w\n    depth = p.nut_h + p.pocket_clr\n    res = cq.Workplane(\"XY\"\
    ).box(L, W, t, centered=(True, True, False))\n    xs = [-25.5, -8.5, 8.5, 25.5]\n\
    \    afs = [p.af_1, p.af_2, p.af_3, p.af_4]\n    for x, af in zip(xs, afs):\n\
    \        d = af / math.cos(math.radians(30))\n        R = af / math.sqrt(3) -\
    \ p.corner_relief\n        zb = t - depth\n        hexwp = cq.Workplane(\"XY\"\
    ).transformed(offset=(x, 0, zb)).polygon(6, d).extrude(depth + 1.0)\n        cylwp\
    \ = cq.Workplane(\"XY\").transformed(offset=(x, 0, zb)).circle(R).extrude(depth\
    \ + 1.0)\n        res = res.cut(hexwp.intersect(cylwp))\n        res = res.cut(cq.Workplane(\"\
    XY\").transformed(offset=(x, 0, 0)).circle(p.bolt_clear_d / 2.0).extrude(t + 2.0))\n\
    \    res = res.faces(\">Z\").edges().chamfer(p.mouth_chamfer)\n    for i, x in\
    \ enumerate(xs):\n        n = i + 1\n        pts = [(x + (j - (n - 1) / 2.0) *\
    \ 1.7, -6.2) for j in range(n)]\n        res = res.faces(\">Z\").workplane().pushPoints(pts).circle(0.6).extrude(0.6)\n\
    \    return res\n"
  print_orientation: Flat bottom face on the bed (z = 0), all four pockets opening
    upward
  use_orientation: Flat, as printed. Four nut sockets in a row; the raised dots on
    the top face number them 1 to 4 (1 dot = pocket 1).
