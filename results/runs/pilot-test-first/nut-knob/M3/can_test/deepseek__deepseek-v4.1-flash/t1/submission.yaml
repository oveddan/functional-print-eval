manual:
- n: '1'
  text: Print the knob (knob). PLA, 0.2 mm layers, 0.4 mm nozzle, 4 perimeters and
    about 20% infill, no supports. Put the plain flat face - the one with the small
    round hole - on the bed and leave the hex socket opening upward. Every feature
    is then vertical or supported, and no bridges are needed.
  parts:
  - knob
  hardware: []
  tool: Bambu Lab X1C
- n: '2'
  text: Press the M3 hex nut (nut) into the hex socket in the top face. Line the six
    flats up with the socket by eye, then press with your thumb until the nut bottoms
    out on the floor of the socket. It is a press fit and takes a firm push. When
    it is home, the nut's top face sits about 0.25 mm below the knob's top face.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: 'Turn the knob upside down and shake it: the nut must stay in the socket by
    itself. If it needs more than a firm thumb press, seat it once with a clamp or
    in a vice - after that first seating it becomes a firm hand fit. If it turns out
    loose or too tight for your printer, reprint the knob with pocket_af set to 5.65
    (tighter) or 5.75 (looser); 5.7 is what pressed in by hand and stayed put in the
    fit test.'
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: 'Thread the M3 bolt (screw) in from the flat bottom face: push the threaded
    end into the 3.6 mm hole in the bottom face and turn it into the nut. Keep turning
    - the bolt passes right through the nut and comes out of the socket at the top
    of the knob.'
  parts:
  - knob
  hardware:
  - screw
  - nut
  tool: null
- n: '5'
  text: 'Use it: grip the fluted rim between thumb and fingers and turn. No tool and
    no glue needed. Your bolt needs at least 12 mm of thread; with 16-25 mm the end
    will show above the top of the knob as you tighten and you can see how far it
    has gone in.'
  parts:
  - knob
  hardware:
  - screw
  tool: null
- n: '6'
  text: 'For reference only - the fit gauge (fit_gauge) is the test bar you printed
    earlier. Its four sockets are, left to right with the raised dots nearest you:
    1 dot = 5.3, 2 = 5.5, 3 = 5.7, 4 = 5.9 mm across flats. Socket 3 is the size built
    into the knob.'
  parts:
  - fit_gauge
  hardware: []
  tool: null
