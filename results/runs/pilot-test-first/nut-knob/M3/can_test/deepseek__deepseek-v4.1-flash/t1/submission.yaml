task: nut-knob/M3
note: 'One-piece printed hand knob, 20 mm across with eight grip flutes, 10 mm tall.
  A standard M3 hex nut (ISO 4032) presses into a hex socket in the top face and is
  held by the press fit alone — no glue, no extra hardware. The socket is 5.7 mm across
  flats with the hex corners scalloped back 0.15 mm: the sharp-cornered nut then bears
  on the socket''s flats instead of jamming on the printer''s rounded corners, which
  is what made the first two test rounds fail. That 5.7 mm size, with the same socket
  depth (2.65 mm), mouth chamfer (0.6 mm) and body size as the knob, is the size that
  pressed in by hand and stayed put when the gauge was turned over and shaken. Below
  the socket the part is solid except for a 3.6 mm through hole, so the nut bottoms
  out on a shoulder and cannot be pushed out through the far side, while an M3 bolt
  enters through the bottom hole, threads through the nut and comes out of the socket
  at the top. It prints in one piece with no supports.'
questions:
- text: How long is the M3 bolt you want to use? The knob needs at least 12 mm of
    thread to reach through its 7.35 mm guide bore and through the 2.4 mm nut; 16-25
    mm is ideal (the end then sticks out of the top of the knob as you tighten).
  answer: null
- text: Is your nut a standard ISO 4032 M3 hex nut (2.4 mm thick)? A nylon-insert
    lock nut is 4 mm thick and would stand proud of the 2.65 mm socket rather than
    sitting fully inside.
  answer: null
