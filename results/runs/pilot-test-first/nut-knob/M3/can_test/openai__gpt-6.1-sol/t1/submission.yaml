  - pocket_extra_depth
  check:
    method: measure
    ref: null
    description: Nut must seat fully with its exposed face below the top surface;
      nominal recess is 0.25 mm.
- id: retaining_shoulder
  part: knob
  feature: Solid floor around the 3.5 mm axial bore
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - height
  - nut_h
  - pocket_extra_depth
  - bolt_d
  - hole_clearance
  check:
    method: measure
    ref: null
    description: Check that the pocket floor is intact and the seated nut cannot pass
      through the smaller opposite opening.
- id: bolt_passage
  part: knob
  feature: 3.5 mm through bore concentric with hex pocket
  relation: clears
  hardware: null
  clearance_mm: 0.25
  params:
  - bolt_d
  - hole_clearance
  check:
    method: measure
    ref: null
    description: Before inserting the nut, check that the intended M3 bolt slides
      freely through the bore. After seating the nut, verify it threads through and
      emerges from the underside without binding.
manual:
- n: '1'
  text: 'Print knob with its flat underside on the bed and hex pocket facing up. Use
    the same filament and fit-related slicer settings as successful coupon F_570:
    0.4 mm nozzle, 0.2 mm layers, 4 walls, 100% infill, no supports. Do not add hole
    compensation or scale the model.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: 'Let the print cool and remove any loose strands. Check the axial bore is
    clear using your intended M3 bolt before installing the nut. Do not enlarge or
    sand the hex pocket: its tested fit provides retention.'
  parts:
  - knob
  hardware: []
  tool: Your intended M3 bolt
- n: '3'
  text: Align the nut flats with the hex pocket and press it straight in by hand until
    it rests on the pocket floor. Its top face must sit below the knob surface. Do
    not hammer it or use glue; stop if it cannot seat with reasonable hand pressure.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Turn the knob upside down and gently shake it. The nut must remain seated.
    If it falls out, or if the print cracks during insertion, do not use that print;
    the required retention has not been achieved.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Thread your M3 bolt through the nut and check that it emerges through the
    opposite bore. For clamping, put the flat underside toward the work and turn the
    scalloped rim by hand. Select bolt length for your assembly, allowing for the
    6 mm knob thickness and needed protrusion. Use light hand tightening only; avoid
    heat and excessive torque that could deform PLA.
  parts:
  - knob
  hardware:
  - nut
  tool: Your intended M3 bolt
