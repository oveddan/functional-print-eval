task: nut-knob/M3
note: 'One-piece, nominally 20 mm diameter × 6 mm high hand knob for an M3 bolt. Uses
  the 5.70 mm hex pocket validated by coupon F_570: hand-pressed snugly and retained
  the nut when inverted and shaken. The nut is recessed 0.25 mm nominally; a 3.35
  mm-thick shoulder prevents passage through the opposite side. This is a captive-nut
  knob, not a captive bolt-head knob. Bolt length depends on the user''s application.'
questions: []
params:
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
  height:
    value: 6
    unit: mm
    kind: design
    source: design
    note: ''
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 nominal across flats.
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: M3 nominal thread major diameter.
  fit:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: 5.70 mm modeled pocket AF; selected by successful F_570 print test.
  pocket_extra_depth:
    value: 0.25
    unit: mm
    kind: design
    source: design
    note: ''
  hole_clearance:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Diametral allowance; resulting through bore is 3.5 mm.
  scallop_count:
    value: 12
    unit: count
    kind: design
    source: design
    note: ''
  scallop_radius:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_offset:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Scallop centers are this far outside the nominal outer radius.
parts:
- id: knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    import math\n    body = cq.Workplane('XY').circle(p.knob_d/2).extrude(p.height)\n\
    \    for i in range(int(p.scallop_count)):\n        a = 2*math.pi*i/p.scallop_count\n\
    \        r = p.knob_d/2 + p.scallop_offset\n        cutter = cq.Workplane('XY').center(r*math.cos(a),\
    \ r*math.sin(a)).circle(p.scallop_radius).extrude(p.height)\n        body = body.cut(cutter)\n\
    \    depth = p.nut_h + p.pocket_extra_depth\n    pocket = cq.Workplane('XY').workplane(offset=p.height-depth).polygon(6,(p.nut_af+p.fit)/math.cos(math.pi/6)).extrude(depth)\n\
    \    bore = cq.Workplane('XY').circle((p.bolt_d+p.hole_clearance)/2).extrude(p.height)\n\
    \    return body.cut(pocket).cut(bore)"
  print_orientation: Flat underside on bed at z=0; open hex pocket up. No supports.
  use_orientation: Nut enters the upper hex pocket. M3 bolt can pass axially through
    the nut and the opposite clearance hole. Prefer applying clamping load against
    the flat underside so the nut bears on the solid shoulder.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: hand_press_retention
  part: knob
  feature: 5.70 mm across-flats hex pocket
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
