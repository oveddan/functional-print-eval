task: bearing-wheel
note: Two-piece closet door roller wheel engineered for dual 608 bearings and M8 axle.
  Both halves clamp the bearings back-to-back with zero axial binding, while external
  standoff spacers ensure the rotating wheel body never rubs against the mounting
  bracket.
questions: []
params:
  spacer_bore:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: Inner bore of spacer bushing for M8 bolt clearance
  spacer_length:
    value: 2
    unit: mm
    kind: design
    source: design
    note: Standard standoff spacer length (1.0 mm inside wheel recess, 1.0 mm standoff
      clearance)
  bearing_bore_fit:
    value: 22.2
    unit: mm
    kind: design
    source: design
    note: Clearance fit diameter for 608 bearing outer ring (confirmed snug press
      fit by coupon test)
  shoulder_bore:
    value: 18
    unit: mm
    kind: design
    source: design
    note: Outer hole diameter in wheel shoulder (clears inner ring and dust shield)
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: catalog
    note: 608 bearing nominal outer diameter
  bearing_inner_bore:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: 608 bearing inner ring bore
  shoulder_thick:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Thickness of bearing retaining shoulder on outer face
  wheel_outer_dia:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: Old wheel outer diameter
  bolt_dia:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: M8 bolt shank diameter
  bearing_width:
    value: 7
    unit: mm
    kind: hardware
    source: catalog
    note: 608 bearing width
  wheel_width:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: Old wheel width
  spacer_od:
    value: 11.5
    unit: mm
    kind: design
    source: design
    note: Outer diameter of spacer bushing (contacts bearing inner ring only)
  groove_width:
    value: 8
    unit: mm
    kind: design
    source: design
    note: Width of central track guiding groove
  spacer_thin_length:
    value: 1.4
    unit: mm
    kind: design
    source: design
    note: Alternate thin standoff spacer length for narrow bracket clearances
  groove_depth:
    value: 2
    unit: mm
    kind: design
    source: design
    note: Depth of central track guiding groove
parts:
- id: wheel_half_pins
  role: final
  material: PLA
  code: "import cadquery as cq\nimport math\n\ndef build(p):\n    r_outer = p.wheel_outer_dia\
    \ / 2.0\n    r_groove = (p.wheel_outer_dia - 2.0 * p.groove_depth) / 2.0\n   \
    \ h_total = p.wheel_width / 2.0\n    h_shoulder = p.shoulder_thick\n    h_groove\
    \ = p.groove_width / 2.0\n    h_flat = h_total - h_groove\n    r_bearing = p.bearing_bore_fit\
    \ / 2.0\n    r_shoulder = p.shoulder_bore / 2.0\n    \n    part = cq.Workplane(\"\
    XY\").circle(r_outer).extrude(h_flat)\n    groove_sec = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=h_flat)\n        .circle(r_outer)\n        .workplane(offset=h_groove)\n\
    \        .circle(r_groove)\n        .loft()\n    )\n    part = part.union(groove_sec)\n\
    \    part = part.faces(\"<Z\").edges().chamfer(0.8)\n    part = part.faces(\"\
    <Z\").workplane().circle(r_shoulder).cutThruAll()\n    part = part.faces(\">Z\"\
    ).workplane().circle(r_bearing).cutBlind(-(h_total - h_shoulder))\n    \n    pin_r_pos\
    \ = (r_bearing + r_groove) / 2.0\n    pin_dia = 3.2\n    pin_h = 2.5\n    pts\
    \ = [\n        (pin_r_pos * math.cos(math.radians(a)), pin_r_pos * math.sin(math.radians(a)))\n\
    \        for a in [0, 120, 240]\n    ]\n    pins = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=h_total)\n        .pushPoints(pts)\n        .circle(pin_dia\
    \ / 2.0)\n        .extrude(pin_h)\n    )\n    pins = pins.faces(\">Z\").edges().chamfer(0.5)\n\
    \    part = part.union(pins)\n    return part\n"
  print_orientation: Outer face flat on bed (Z=0, retaining shoulder down)
  use_orientation: Axle along Z axis; mating pins face opposite wheel half
- id: wheel_half_sockets
  role: final
  material: PLA
  code: "import cadquery as cq\nimport math\n\ndef build(p):\n    r_outer = p.wheel_outer_dia\
    \ / 2.0\n    r_groove = (p.wheel_outer_dia - 2.0 * p.groove_depth) / 2.0\n   \
    \ h_total = p.wheel_width / 2.0\n    h_shoulder = p.shoulder_thick\n    h_groove\
    \ = p.groove_width / 2.0\n    h_flat = h_total - h_groove\n    r_bearing = p.bearing_bore_fit\
    \ / 2.0\n    r_shoulder = p.shoulder_bore / 2.0\n    \n    part = cq.Workplane(\"\
    XY\").circle(r_outer).extrude(h_flat)\n    groove_sec = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=h_flat)\n        .circle(r_outer)\n        .workplane(offset=h_groove)\n\
    \        .circle(r_groove)\n        .loft()\n    )\n    part = part.union(groove_sec)\n\
    \    part = part.faces(\"<Z\").edges().chamfer(0.8)\n    part = part.faces(\"\
    <Z\").workplane().circle(r_shoulder).cutThruAll()\n    part = part.faces(\">Z\"\
    ).workplane().circle(r_bearing).cutBlind(-(h_total - h_shoulder))\n    \n    pin_r_pos\
    \ = (r_bearing + r_groove) / 2.0\n    socket_dia = 3.6\n    socket_depth = 3.0\n\
    \    pts = [\n        (pin_r_pos * math.cos(math.radians(a)), pin_r_pos * math.sin(math.radians(a)))\n\
    \        for a in [0, 120, 240]\n    ]\n    sockets = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=h_total - socket_depth)\n        .pushPoints(pts)\n\
    \        .circle(socket_dia / 2.0)\n        .extrude(socket_depth)\n    )\n  \
    \  part = part.cut(sockets)\n    return part\n"
  print_orientation: Outer face flat on bed (Z=0, retaining shoulder down)
  use_orientation: Axle along Z axis; sockets receive pins from opposite wheel half
- id: spacer_bushing
  role: final
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    r_outer = p.spacer_od / 2.0\n\
    \    r_inner = p.spacer_bore / 2.0\n    h = p.spacer_length\n    \n    part =\
    \ (\n        cq.Workplane(\"XY\")\n        .circle(r_outer)\n        .circle(r_inner)\n\
    \        .extrude(h)\n    )\n    return part\n"
  print_orientation: Flat annular face on bed (Z=0)
  use_orientation: Slides over M8 bolt against bearing inner ring
- id: spacer_bushing_thin
  role: final
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    r_outer = p.spacer_od / 2.0\n\
    \    r_inner = p.spacer_bore / 2.0\n    h = p.spacer_thin_length\n    \n    part\
    \ = (\n        cq.Workplane(\"XY\")\n        .circle(r_outer)\n        .circle(r_inner)\n\
    \        .extrude(h)\n    )\n    return part\n"
  print_orientation: Flat annular face on bed (Z=0)
  use_orientation: Slides over M8 bolt against bearing inner ring for tight clearance
    brackets
hardware:
- id: bearing_1
  ref: 608ZZ
  qty: 1
- id: bearing_2
  ref: 608ZZ
  qty: 1
- id: axle_bolt
  ref: ISO 4762 M8x35
  qty: 1
- id: axle_nut
  ref: ISO 10511 M8
  qty: 1
- id: washer_1
  ref: ISO 7089 M8
  qty: 2
joints:
- id: joint_axle
  fastener: axle_bolt
  axis_origin:
  - 0.0
  - 0.0
  - -2.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel_half_pins
    feature: bearing_pocket
    role: clearance
  - part: wheel_half_sockets
    feature: bearing_pocket
    role: clearance
  - part: spacer_bushing
    feature: bore
    role: clearance
  nut: axle_nut
  external: null
criteria:
- id: crit_bearing_seat_pins
  part: wheel_half_pins
  feature: bearing_pocket
  relation: seats
  hardware: bearing_1
  clearance_mm: 0.2
  params:
  - bearing_bore_fit
  - bearing_od
  check:
    method: coupon
    ref: bearing_fit_test
    description: 608 bearing pushes snugly into the 22.2 mm bore and seats flat against
      shoulder
- id: crit_bearing_seat_sockets
  part: wheel_half_sockets
  feature: bearing_pocket
  relation: seats
  hardware: bearing_2
  clearance_mm: 0.2
  params:
  - bearing_bore_fit
  - bearing_od
  check:
    method: coupon
    ref: bearing_fit_test
    description: 608 bearing pushes snugly into the 22.2 mm bore and seats flat against
      shoulder
- id: crit_spacer_clearance
  part: spacer_bushing
  feature: bore
  relation: clears
  hardware: axle_bolt
  clearance_mm: 0.4
  params:
  - spacer_bore
  - bolt_dia
  check:
    method: measure
    ref: null
    description: Spacer slides smoothly over M8 bolt shank
- id: crit_pin_engagement
  part: wheel_half_pins
  feature: alignment_pins
  relation: engages
  hardware: null
  clearance_mm: 0.4
  params:
  - wheel_width
  - groove_width
  check:
    method: measure
    ref: null
    description: Alignment pins engage sockets to keep wheel halves concentric and
      aligned
manual:
- n: '1'
  text: Press the first 608 bearing into the bearing pocket of wheel_half_pins until
    it firmly seats against the bottom retaining shoulder.
  parts:
  - wheel_half_pins
  hardware:
  - bearing_1
  tool: null
- n: '2'
  text: Press the second 608 bearing into the bearing pocket of wheel_half_sockets
    until it firmly seats against the bottom retaining shoulder.
  parts:
  - wheel_half_sockets
  hardware:
  - bearing_2
  tool: null
- n: '3'
  text: Align the 3 pins on wheel_half_pins with the 3 matching sockets on wheel_half_sockets.
    Press the two halves together firmly until their mating faces meet flush. The
    two bearings now sit securely back-to-back inside the wheel.
  parts:
  - wheel_half_pins
  - wheel_half_sockets
  hardware: []
  tool: null
- n: '4'
  text: Slide one spacer_bushing onto the M8 axle bolt with its end facing the wheel.
    Push the bolt through the center bore of the assembled wheel.
  parts:
  - spacer_bushing
  hardware:
  - axle_bolt
  tool: null
- n: '5'
  text: Slide the second spacer_bushing onto the bolt on the opposite side of the
    wheel. Mount the assembly into your door bracket, place a washer and the M8 lock
    nut onto the bolt, and tighten until snug. Check that the wheel spins freely without
    dragging on the bracket.
  parts:
  - spacer_bushing
  hardware:
  - axle_nut
  - washer_1
  tool: hex key / wrench
