  params:
  - bolt_clear
  - bolt_d
  check:
    method: template
    ref: null
    description: The M8 bolt slides through freely.
manual:
- n: '1'
  text: Print the wheel flat, with the face down, and print two spacers standing on
    their ends. Use PLA with at least 4 walls and 30% infill or more. The wheel carries
    the door's weight.
  parts:
  - wheel
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Press one 608ZZ bearing into each pocket until it sits flat on the centre
    web. Press on the outer ring only. A flat block and a light tap, or a vise, works.
    The bearing faces end up level with the wheel faces.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '3'
  text: Put the bolt through the bracket, then a washer, then a spacer, then the wheel
    assembly, then the second spacer and the second washer. Add the bracket's other
    side if there is one. The spacers must touch the bearing inner rings and not the
    wheel body.
  parts:
  - wheel
  - spacer
  hardware:
  - bolt
  - washer
  - bearing
  tool: null
- n: '4'
  text: Fit the lock nut and tighten until the bracket pinches the spacers. The wheel
    should spin freely and have no side play. If it rubs the bracket, add washers.
    If it wobbles, reprint the spacers longer and change spacer_l.
  parts: []
  hardware:
  - nut
  tool: 13 mm spanner and 6 mm hex key
- n: '5'
  text: Hang the door and check that the wheel rolls on the track. If the track has
    a groove or lip, tell me its shape and width and I'll add a matching profile.
  parts:
  - wheel
  hardware: []
  tool: null
