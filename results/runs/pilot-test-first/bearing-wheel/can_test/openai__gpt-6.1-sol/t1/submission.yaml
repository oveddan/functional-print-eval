  - seat_allowance
  - bearing_w
  check:
    method: coupon
    ref: fit_C
    description: 'User reports printed seat 22.29 mm: bearing enters readily, not
      loose, holds upside down. Full-depth seats still require hand-fit confirmation.'
- id: race_support
  part: wheel
  feature: Narrow central-web shoulders contact outer rings only
  relation: supports
  hardware: bearings
  clearance_mm: null
  params:
  - web_relief_d
  - bearing_od
  - wheel_w
  - bearing_w
  check:
    method: measure
    ref: null
    description: Inspect actual bearing faces and seat contact. Shoulders must not
      press shields or rotating inner rings. Stop if contact is unclear.
- id: inner_ring_stack
  part: centre_sleeve
  feature: Sleeve length 2.2 mm and 10.5 mm OD
  relation: seats
  hardware: bearings
  clearance_mm: null
  params:
  - wheel_w
  - bearing_w
  - spacer_extra
  - spacer_od
  check:
    method: measure
    ref: null
    description: Sleeve and both collars must bear only on inner rings. Hand-tightened
      axle must not increase wheel drag; both bearings should sit about 0.1 mm proud.
- id: axle_fit
  part: collar_head
  feature: Axle clearance bore
  relation: clears
  hardware: axle
  clearance_mm: 0.5
  params:
  - axle_clearance_d
  - bolt_d
  check:
    method: measure
    ref: null
    description: Axle must slide freely through all printed spacers and bearings without
      hammering.
- id: thread_engagement
  part: collar_nut
  feature: External washer and lock nut stack
  relation: supports
  hardware: locknut
  clearance_mm: null
  params:
  - bolt_length
  - bolt_threaded_length
  - washer_t
  - nut_h
  - collar_length
  - wheel_w
  - spacer_extra
  check:
    method: measure
    ref: null
    description: Nominal under-head stack through nut is 33.4 mm, leaving 6.6 mm projection
      with M8x40. Confirm thread extends through nylon and at least two full threads
      emerge.
manual:
- n: '1'
  text: Leave the door safely supported with its existing safe hardware; do not install
    this prototype. Identify whether the original roller carries weight and obtain
    the original tread/track dimensions before considering any replacement.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print wheel, centre_sleeve, collar_head and collar_nut at 0.2 mm layers, 5
    walls, 6 top/bottom layers and 100% infill. Print spacers separately or spaced
    well apart, using a brim if needed. Do not scale the parts. Remove brim and elephant-foot
    burrs without enlarging the bearing seats.
  parts:
  - wheel
  - centre_sleeve
  - collar_head
  - collar_nut
  hardware: []
  tool: Slicer and deburring tool
- n: '3'
  text: Check that both bearings turn freely before assembly. Check the sleeve and
    collars touch only the bearing inner rings, and the wheel's narrow shoulders touch
    only the outer rings—not shields. If this cannot be confirmed, stop. Test the
    axle through each bore without forcing it.
  parts:
  - wheel
  - centre_sleeve
  - collar_head
  - collar_nut
  hardware:
  - bearings
  - axle
  tool: null
- n: '4'
  text: Hand-seat one bearing from each side of wheel, placing centre_sleeve between
    their inner rings before inserting the second bearing. Use the loose axle temporarily
    to align the sleeve. Do not hammer, heat the wheel, or press through the inner
    ring. The two bearings will each sit approximately 0.1 mm proud once clamped.
    Stop if seats crack, bearings rock, or fit is loose.
  parts:
  - wheel
  - centre_sleeve
  hardware:
  - bearings
  - axle
  tool: null
- n: '5'
  text: 'Assemble on the M8x40 bolt in this order: steel washer, collar_head, first
    bearing, centre_sleeve, second bearing, collar_nut, second steel washer, locknut.
    Do not substitute a broad washer directly against a bearing shield. This stack
    contains no door bracket.'
  parts:
  - wheel
  - centre_sleeve
  - collar_head
  - collar_nut
  hardware:
  - axle
  - bearings
  - washers
  - locknut
  tool: null
- n: '6'
  text: 'Hold the bolt and turn the locknut only until axial play disappears; do not
    apply normal structural M8 torque to these PLA spacers. Confirm nylon engagement
    and at least two exposed full threads. Spin wheel by hand while holding the bolt:
    it must rotate smoothly without rubbing washers or tightening the nut. Stop if
    tightening adds drag or compresses a spacer.'
  parts:
  - wheel
  - centre_sleeve
  - collar_head
  - collar_nut
  hardware:
  - axle
  - washers
  - locknut
  tool: Hex key and spanner
- n: '7'
  text: Use only for off-door hand-spin and dimensional checks. Friction-fit bearings,
    PLA creep and unknown track/load geometry make this unqualified for door service.
    Do not perform loaded door trials. For a working replacement, use a correctly
    profiled, load-rated commercial roller or obtain a separately verified design
    after measuring the original mounting and track.
  parts:
  - wheel
  hardware: []
  tool: null
