  - 0.0
  - -1.6
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: collar_head
    feature: Lower annular face bears on head-side steel washer; collar occupies assembly
      z=0 to 3 mm.
    role: washer
  - part: wheel
    feature: Two bearing bores carry axle through bearings, not through plastic; wheel
      lower face at assembly z=3.1 mm.
    role: clearance
  - part: centre_sleeve
    feature: 8.5 mm through bore; sleeve occupies assembly z=10 to 12.2 mm.
    role: clearance
  - part: collar_nut
    feature: 8.5 mm through bore; collar occupies assembly z=19.2 to 22.2 mm; steel
      washer then external lock nut.
    role: clearance
  nut: locknut
  external: null
