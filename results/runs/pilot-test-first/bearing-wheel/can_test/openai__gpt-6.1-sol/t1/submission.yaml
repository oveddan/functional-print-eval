parts:
- id: wheel
  role: final
  material: Black high-speed PLA
  code: "def build(p):\n    body=cq.Workplane('XY').circle(p.wheel_d/2).extrude(p.wheel_w)\n\
    \    body=body.edges('%Circle').chamfer(p.rim_chamfer)\n    body=body.cut(cq.Workplane('XY').circle(p.web_relief_d/2).extrude(p.wheel_w))\n\
    \    seat_d=p.bearing_od+p.seat_allowance\n    lower=cq.Workplane('XY').circle(seat_d/2).extrude(p.bearing_w)\n\
    \    upper=cq.Workplane('XY').workplane(offset=p.wheel_w-p.bearing_w).circle(seat_d/2).extrude(p.bearing_w)\n\
    \    return body.cut(lower).cut(upper)\n"
  print_orientation: Axis vertical, lower annular face at z=0. No supports in bearing
    seats. The narrow internal shoulder overhang is less than 1 mm.
  use_orientation: 'Bench only: axis horizontal or vertical; bearings enter opposite
    faces. Wheel spins around fixed axle.'
- id: centre_sleeve
  role: final
  material: Black high-speed PLA
  code: "def build(p):\n    length=p.wheel_w-2*p.bearing_w+p.spacer_extra\n    return\
    \ cq.Workplane('XY').circle(p.spacer_od/2).circle(p.axle_clearance_d/2).extrude(length)\n"
  print_orientation: Annular face at z=0, axis vertical. Print separately from wheel.
  use_orientation: Between the two bearing inner rings, coaxial with the axle.
- id: collar_head
  role: final
  material: Black high-speed PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.axle_clearance_d/2).extrude(p.collar_length)\n"
  print_orientation: Annular face at z=0, axis vertical.
  use_orientation: Between head-side steel washer and first bearing inner ring.
- id: collar_nut
  role: final
  material: Black high-speed PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.axle_clearance_d/2).extrude(p.collar_length)\n"
  print_orientation: Annular face at z=0, axis vertical.
  use_orientation: Between second bearing inner ring and nut-side steel washer.
