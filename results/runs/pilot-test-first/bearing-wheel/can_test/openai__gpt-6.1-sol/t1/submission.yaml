task: bearing-wheel
note: 'OFF-DOOR FIT/ROTATION PROTOTYPE ONLY, not an approved load-bearing door roller.
  Two 608 bearings run on a stationary M8 axle. The 50 × 16 mm flat tread is an approximation:
  the original tread profile, rail geometry, load, bracket dimensions and existing
  bolt length are unverified. Do not install this prototype on the door. A matching
  track profile and a suitable load-rated replacement are especially important if
  this is a suspended door. Coupon C held the bearing upside down without looseness;
  its nominal 22.30 mm bore is used. Use the specified catalog bolt for bench testing
  rather than assuming the user''s unmeasured bolt will fit.'
questions:
- text: What are the original tread profile, rail geometry and load-bearing role?
  answer: User could not measure; unresolved. Flat tread is a prototype choice only.
- text: What are the existing bolt length, smooth-shank length and mounting bracket
    thickness?
  answer: Not supplied; only approximately 8 mm shank diameter confirmed. Existing
    bolt is not qualified for this assembly.
