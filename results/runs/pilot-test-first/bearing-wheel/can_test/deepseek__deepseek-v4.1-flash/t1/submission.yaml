task: bearing-wheel
note: 'A replacement closet-door roller wheel, 50 mm x 16 mm like the old one, that
  spins on your M8 bolt on two 608 bearings. It prints flat in one piece, no supports.
  Bearing pockets are 22.3 mm, the size your fit test showed seats the bearing snugly
  and holds it upside down (22.0 mm would not accept it). Both bearings press in from
  opposite faces and bottom on a 4 mm central web, whose 9 mm clearance bore lets
  the printed plastic never touch the turning axle. Two open points are logged as
  questions: I could not get your track''s profile, so the rim is flat (chamfered);
  if the track is a raised rib, tell me the rib width and I will put a matching groove
  in the rim. I also could not get your bolt''s length or your bracket''s gap, so
  the axle joint is described but not dimensioned for your bracket.'
questions:
- text: Is the running surface of your door track a flat strip or a raised rib, and
    how wide (and, if a rib, how tall) is it?
  answer: null
- text: How long is your M8 bolt under the head, and how wide is the gap in the bracket
    the wheel sits in?
  answer: null
params:
  bearing_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: datasheet
    note: '608ZZ outside diameter (nominal). Your bearings measured ~22 mm OD but
      behave slightly larger: they would not enter a 21.99 mm printed hole and seated
      snugly in a 22.14 mm one'
  bearing_bore:
    value: 8.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ bore; the M8 shank runs through it
  bearing_w:
    value: 7.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ width; two stacked are 14 mm of the wheel's 16 mm
  bolt_shank_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: measured
    note: shank of your own M8 bolt, as you reported it
  old_wheel_od:
    value: 50.0
    unit: mm
    kind: world
    source: asked
    note: original wheel diameter as you described it; the new wheel matches
  old_wheel_w:
    value: 16.0
    unit: mm
    kind: world
    source: asked
    note: original wheel width as you described it; the new wheel matches
  wheel_od:
    value: 50.0
    unit: mm
    kind: design
    source: design
    note: same as the original wheel, so it sits at the same height in the track
  wheel_w:
    value: 16.0
    unit: mm
    kind: design
    source: design
    note: same as the original wheel; 16 mm still swallows two 7 mm bearings plus
      a 4 mm web
  pocket_d:
    value: 22.3
    unit: mm
    kind: design
    source: design
    note: 'bearing pocket bore. Chosen from your fit tests: 22.0 mm would not accept
      the bearing, 22.3 mm pushed in firmly, was not loose and held the bearing upside
      down'
  pocket_depth:
    value: 6.0
    unit: mm
    kind: design
    source: design
    note: (wheel_w - web_t)/2; the bearing is 7 mm so it stands ~1 mm proud of each
      face and bottoms against the web
  web_t:
    value: 4.0
    unit: mm
    kind: design
    source: design
    note: 'central web between the two pocket floors: 16 - 2 x 6'
  axle_clear_d:
    value: 9.0
    unit: mm
    kind: design
    source: design
    note: bore through the web; 0.5 mm radial clearance so the printed plastic never
      rubs the fixed axle
  rim_chamfer:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: 45 deg chamfer on both rim edges so it does not dig into the track
  pocket_leadin:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: 45 deg lead-in at both pocket mouths; also cures the blob/partly-closed
      rim the coupon showed at the hole mouth
  tile:
    value: 24.0
    unit: mm
    kind: design
    source: design
    note: coupon tile size
  coupon_t:
    value: 6.0
    unit: mm
    kind: design
    source: design
    note: coupon thickness, matches the 6 mm pocket depth
parts:
- id: fit_tile
  role: coupon
  material: PLA
  code: "def build(p):\n    d = p.pocket_d\n    plate = cq.Workplane(\"XY\").box(p.tile,\
    \ p.tile, p.coupon_t)\n    plate = plate.cut(\n        cq.Workplane(\"XY\").circle(d\
    \ / 2).extrude(p.coupon_t + 4).translate((0, 0, -2))\n    )\n    cone = cq.Solid.makeCone(\n\
    \        d / 2, d / 2 + p.pocket_leadin, p.pocket_leadin,\n        cq.Vector(0,\
    \ 0, p.coupon_t - p.pocket_leadin), cq.Vector(0, 0, 1)\n    )\n    return plate.cut(cq.Workplane(\"\
    XY\").newObject([cone]))\n"
  print_orientation: flat - one 24 x 24 mm face on the bed, the hole is a vertical
    bore
  use_orientation: test piece only; press a 608 bearing into the hole
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    ro = p.wheel_od / 2.0      # rim radius            (25.0)\n\
    \    rp = p.pocket_d / 2.0      # bearing pocket radius (11.15)\n    rb = p.axle_clear_d\
    \ / 2.0  # centre bore radius    (4.5)\n    W = p.wheel_w              # axial\
    \ width           (16.0)\n    zw = p.pocket_depth        # pocket floor height\
    \   (6.0)\n    c = p.rim_chamfer          # rim edge chamfer      (1.5)\n    l\
    \ = p.pocket_leadin        # pocket mouth lead-in  (0.8)\n\n    # half cross-section\
    \ in the XZ plane, revolved about the wheel axis (Z).\n    # two pockets (one\
    \ from each face) bottom on a 4 mm central web that carries\n    # the 9 mm axle\
    \ clearance bore.\n    pts = [\n        (rb, zw),\n        (rp, zw),\n       \
    \ (rp, l),\n        (rp + l, 0.0),\n        (ro - c, 0.0),\n        (ro, c),\n\
    \        (ro, W - c),\n        (ro - c, W),\n        (rp + l, W),\n        (rp,\
    \ W - l),\n        (rp, W - zw),\n        (rb, W - zw),\n    ]\n    prof = cq.Workplane(\"\
    XZ\").polyline(pts).close()\n    return prof.revolve(360.0, (0, 0, 0), (0, 0,\
    \ 1))\n"
  print_orientation: flat - one 50 mm circular face on the bed, wheel axis vertical
    (Z); both bearing pockets are open vertical bores, so no supports and no bridging
  use_orientation: axis horizontal; a 608 bearing is pressed into each pocket from
    opposite faces, and the M8 bolt runs through both bearings as the axle
hardware:
- id: axle_bolt
  ref: ISO 4762 M8x50
  qty: 1
- id: axle_washer
  ref: ISO 7089 M8
  qty: 2
- id: axle_nut
  ref: ISO 4032 M8
  qty: 1
joints:
- id: axle
  fastener: axle_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 17.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: wheel
    feature: axle clearance bore
    role: clearance
  nut: axle_nut
  external: the door's existing roller bracket (its gap and axle-hole diameter were
    not obtainable)
criteria:
- id: c1
  part: wheel
  feature: upper bearing pocket
  relation: seats
  hardware: null
  clearance_mm: 0.0
  params:
  - pocket_d
  - bearing_od
  check:
    method: coupon
    ref: fit_tile
    description: Print fit_tile first and press a 608 bearing into it. At 22.3 mm
      it should push in firmly, not rattle, and stay in when you turn the tile over.
      A printed 22.0 mm hole did not accept the bearing at all.
- id: c2
  part: wheel
  feature: lower bearing pocket
  relation: seats
  hardware: null
  clearance_mm: 0.0
  params:
  - pocket_d
  - bearing_od
  check:
    method: coupon
    ref: fit_tile
    description: Same pocket and same lead-in as the upper one, cut from the opposite
      face; the same passing fit_tile covers it.
- id: c3
  part: wheel
  feature: axle clearance bore
  relation: clears
  hardware: axle_bolt
  clearance_mm: 0.5
  params:
  - axle_clear_d
  - bolt_shank_d
  check:
    method: none
    ref: null
    description: 9 mm bore over an 8 mm shank gives 0.5 mm radial clearance, so the
      axle never rubs the printed web. Verify with a caliper on the finished print.
- id: c4
  part: wheel
  feature: central web
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - web_t
  - pocket_depth
  - bearing_w
  check:
    method: none
    ref: null
    description: Each 7 mm bearing bottomed 6 mm deep in its pocket leaves 4 mm of
      solid web between them for axial stiffness.
- id: c5
  part: wheel
  feature: rim running surface
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - wheel_w
  - old_wheel_od
  - old_wheel_w
  check:
    method: measure
    ref: null
    description: 'Finished wheel should measure about 50 mm across and 16 mm wide,
      matching the original. Also measure the track: if it is a raised rib rather
      than a flat strip, the flat rim needs a groove added.'
manual:
- n: '1'
  text: 'Print the fit test tile (part ''fit_tile''): PLA, 0.2 mm layers, big face
    down, no supports. It takes a couple of minutes.'
  parts:
  - fit_tile
  hardware: []
  tool: null
- n: '2'
  text: Press one 608 bearing into the tile's hole. It should go in firmly and stay
    in when you turn the tile upside down. If it is stubborn, warm the tile in roughly
    60 C water for 30 seconds first. If it is now loose, tell me and I will drop the
    pocket to 22.2 mm.
  parts:
  - fit_tile
  hardware: []
  tool: null
- n: '3'
  text: 'Print the wheel (part ''wheel''): PLA, 0.2 mm layers, 3-4 perimeters, 30%
    infill, no supports, no brim. Print it flat with one 50 mm face on the bed, which
    is how it is modelled. It is about 40 g and a bit over an hour.'
  parts:
  - wheel
  hardware: []
  tool: null
- n: '4'
  text: 'Clean up the two pocket mouths: run a knife or a light sanding pass around
    each lead-in so no blobs or loose loops remain to fight the bearing.'
  parts:
  - wheel
  hardware: []
  tool: knife or 240 grit paper
- n: '5'
  text: Press a 608 bearing into each pocket, one from each face. To press squarely,
    pass the M8 bolt through the bearing, slip a washer on, thread the M8 nut on the
    far side and tighten the nut to draw the bearing down onto the pocket floor. Do
    the two pockets one at a time.
  parts:
  - wheel
  hardware:
  - axle_bolt
  - axle_washer
  - axle_nut
  tool: spanner
- n: '6'
  text: 'Both bearings should end up flat against their pocket floors, standing about
    1 mm proud of the wheel faces. Spin the wheel on the bolt: it should turn freely
    with no wobble and the printed plastic must not rub the bolt.'
  parts:
  - wheel
  - fit_tile
  hardware:
  - axle_bolt
  - axle_washer
  - axle_nut
  tool: null
- n: '7'
  text: 'Take the bolt out, then refit the wheel to the door the same way the old
    wheel was mounted: bolt through the bearings, washers either side, nut up the
    bracket, so the bolt is clamped to the bracket and the door rides on the bearings
    rather than on the bolt. Reuse your old bracket and hardware where they already
    fit.'
  parts:
  - wheel
  hardware:
  - axle_bolt
  - axle_washer
  - axle_nut
  tool: spanner
- n: '8'
  text: 'Hang the door and roll it. If it wanders or climbs, the track is probably
    a raised rib, not a flat strip: measure the rib width and tell me, and I will
    re-cut the rim with a matching groove.'
  parts:
  - wheel
  hardware: []
  tool: null
