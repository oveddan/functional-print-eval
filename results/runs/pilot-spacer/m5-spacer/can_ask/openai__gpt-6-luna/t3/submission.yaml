task: m5-spacer
note: One-piece round spacer, printed upright with its axis vertical. The 5.5 mm bore
  is a nominal M5 clearance hole; check fit on your printer if its hole sizing tends
  to run tight.
questions: []
params:
  outside_diameter:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: User requested 12 mm across.
  length:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: User requested 20 mm long.
  bore_diameter:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Chosen nominal clearance diameter for an M5 bolt.
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    outer = cq.Workplane(\"XY\").circle(p.outside_diameter\
    \ / 2).extrude(p.length)\n    bore = cq.Workplane(\"XY\").circle(p.bore_diameter\
    \ / 2).extrude(p.length)\n    return outer.cut(bore)"
  print_orientation: Stand upright on one annular end face; z=0 is the bed. The bore
    axis is vertical.
  use_orientation: Place between the plates with the M5 bolt passing through its axial
    hole.
hardware: []
joints: []
criteria:
- id: m5_bolt_clearance
  part: spacer
  feature: axial through-hole
  relation: clears
  hardware: null
  clearance_mm: 0.25
  params:
  - bore_diameter
  check:
    method: measure
    ref: null
    description: Check the printed bore against the M5 bolt; the nominal bore is 5.5
      mm.
manual:
- n: '1'
  text: Print the spacer upright on one end face, with the hole axis vertical.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Place the spacer between the plates and pass your M5 bolt through its hole.
    Tighten the bolt as appropriate for your plate assembly.
  parts:
  - spacer
  hardware: []
  tool: null
