task: m5-spacer
note: Single-piece round spacer for an M5 bolt. The 5.6 mm bore gives 0.6 mm diametral
  clearance over the M5 nominal 5 mm thread; fit can vary with printer calibration.
  Print upright with the annular end on the bed.
questions: []
params:
  length:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: Requested spacer length.
  outer_diameter:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: Requested outside diameter.
  bolt_nominal_diameter:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: M5 nominal thread diameter.
  bore_diameter:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: Designed diametral clearance for an M5 bolt.
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    outer = cq.Workplane(\"XY\").circle(p.outer_diameter /\
    \ 2).extrude(p.length)\n    bore = cq.Workplane(\"XY\").circle(p.bore_diameter\
    \ / 2).extrude(p.length)\n    return outer.cut(bore)"
  print_orientation: Stand upright on either annular end; z=0 is the bed, spacer axis
    along z.
  use_orientation: Place between the plates with its axis aligned to the M5 bolt.
hardware: []
joints: []
criteria:
- id: m5_bolt_clearance
  part: spacer
  feature: 5.6 mm through-bore
  relation: clears
  hardware: null
  clearance_mm: 0.3
  params:
  - bolt_nominal_diameter
  - bore_diameter
  check:
    method: none
    ref: null
    description: Designed for an M5 nominal 5 mm bolt with 0.3 mm radial clearance.
manual:
- n: '1'
  text: Place the spacer between the two plates and align the through-bore with the
    bolt hole.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Pass the M5 bolt through the plates and spacer, then tighten using the bolt's
    matching nut or threaded feature.
  parts:
  - spacer
  hardware: []
  tool: null
