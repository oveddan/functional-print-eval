task: m5-spacer
note: A single-piece round spacer, printed upright with its circular end on the build
  plate. The 5.5 mm bore provides practical clearance for an M5 bolt; no separate
  hardware is included.
questions: []
params:
  outer_diameter:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: Requested across-diameter of spacer
  spacer_length:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: Requested distance between the two end faces
  m5_clearance_hole_diameter:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Diametral clearance for nominal 5 mm M5 bolt; print tolerance may vary
parts:
- id: round_spacer
  role: final
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.outer_diameter / 2).circle(p.m5_clearance_hole_diameter\
    \ / 2).extrude(p.spacer_length)"
  print_orientation: Stand on one circular end; axis vertical, with z=0 on the build
    plate.
  use_orientation: Place between the plates with the M5 bolt passing through the central
    hole.
hardware: []
joints: []
criteria:
- id: m5_bolt_clearance
  part: round_spacer
  feature: 5.5 mm through-hole
  relation: clears
  hardware: null
  clearance_mm: 0.25
  params:
  - m5_clearance_hole_diameter
  check:
    method: measure
    ref: null
    description: Check that the intended M5 bolt slides freely through the printed
      bore; adjust hole diameter if needed for the printer's fit.
- id: spacer_dimensions
  part: round_spacer
  feature: outer cylinder and end faces
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - outer_diameter
  - spacer_length
  check:
    method: measure
    ref: null
    description: Verify the printed spacer is about 12 mm across and 20 mm long.
manual:
- n: '1'
  text: Print the round_spacer upright on one circular end. Use a brim if the part
    does not adhere securely; remove it before assembly.
  parts:
  - round_spacer
  hardware: []
  tool: null
- n: '2'
  text: Pass the M5 bolt through the central hole and position the spacer between
    the plates. Confirm the bolt slides freely before tightening the plate assembly.
  parts:
  - round_spacer
  hardware: []
  tool: null
