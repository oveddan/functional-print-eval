task: m5-spacer
note: One-piece PLA spacer, 12 mm outside diameter × 20 mm long, with a 5.5 mm through-hole
  for M5 bolt clearance. Print upright with one circular end on the bed. Bolt and
  plates are not included.
questions: []
params:
  outside_diameter:
    value: 12.0
    unit: mm
    kind: world
    source: asked
    note: User requested 12 mm across.
  length:
    value: 20.0
    unit: mm
    kind: world
    source: asked
    note: User requested 20 mm long.
  hole_diameter:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Designed clearance for an M5 bolt.
  m5_nominal_diameter:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: M5 nominal thread diameter.
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.outside_diameter /\
    \ 2).circle(p.hole_diameter / 2).extrude(p.length)"
  print_orientation: Stand upright on either annular circular end; z=0 is the bed-facing
    end.
  use_orientation: Place between the two plates with the M5 bolt passing through the
    axial hole.
hardware: []
joints: []
