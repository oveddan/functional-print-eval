task: m5-spacer
note: One-piece round spacer, printed upright with its axis along Z. The 5.5 mm through-hole
  gives 0.5 mm diametral clearance for an M5 bolt; the bolt and plates are not included.
questions: []
params:
  outer_diameter:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: Requested across-diameter.
  length:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: Requested spacer length, along Z.
  m5_clearance_hole_diameter:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Chosen clearance hole for the stated M5 bolt.
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane(\"XY\").circle(p.outer_diameter /\
    \ 2).extrude(p.length).faces(\">Z\").workplane().hole(p.m5_clearance_hole_diameter)"
  print_orientation: Stand on a flat circular end; Z axis vertical, with the bottom
    face at z=0. No supports should be needed.
  use_orientation: Place between the plates with the M5 bolt passing through the central
    hole; either circular end can face either plate.
hardware: []
joints: []
criteria: []
manual:
- n: '1'
  text: Print the spacer upright on one flat circular end. No assembly hardware is
    included.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Pass the M5 bolt through the spacer and place the spacer between the plates.
    Tighten the bolt as appropriate for your assembly.
  parts:
  - spacer
  hardware: []
  tool: null
