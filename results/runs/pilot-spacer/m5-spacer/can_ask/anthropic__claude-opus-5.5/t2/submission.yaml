task: m5-spacer
note: 'Plain 20 x Ø12 mm spacer with a Ø5.5 mm hole for M5 and 0.5 mm chamfers. The
  bolt length depends on how thick your plates are. You need at least: plate + plate
  + 20 mm + washer (1 mm) + nut (4.7 mm, or 5 mm for a lock nut). No bolt is listed
  because the plate thickness wasn''t given.'
questions: []
params:
  spacer_length:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: Requested length
  spacer_od:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: Requested outside diameter
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: M5 nominal diameter
  hole_clearance:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Diametral clearance over the bolt. Gives a 5.5 mm hole (ISO 273 medium fit).
      PLA holes usually print about 0.1-0.2 mm small, so this still slides on easily.
  edge_chamfer:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Chamfer on both ends of the hole and outer edge. Counters elephant's foot
      on the bed face.
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    hole_d = p.bolt_d + p.hole_clearance\n    c = p.edge_chamfer\n\
    \    body = (cq.Workplane('XY')\n            .circle(p.spacer_od / 2).extrude(p.spacer_length)\n\
    \            .faces('>Z or <Z').edges().chamfer(c))\n    hole = (cq.Workplane('XY').circle(hole_d\
    \ / 2).extrude(p.spacer_length))\n    body = body.cut(hole)\n    # chamfer hole\
    \ entries\n    cone_bot = cq.Solid.makeCone(hole_d / 2 + c, hole_d / 2, c)\n \
    \   cone_top = cq.Solid.makeCone(hole_d / 2, hole_d / 2 + c, c, pnt=cq.Vector(0,\
    \ 0, p.spacer_length - c))\n    body = body.cut(cq.Workplane('XY').add(cone_bot)).cut(cq.Workplane('XY').add(cone_top))\n\
    \    return body\n"
  print_orientation: Standing on one end face, hole axis vertical (z). No supports
    needed.
  use_orientation: On the M5 bolt between the two plates, with the end faces pressed
    against the plates.
hardware: []
joints: []
criteria:
- id: bolt_clears
  part: spacer
  feature: centre hole
  relation: clears
  hardware: null
  clearance_mm: 0.5
  params:
  - bolt_d
  - hole_clearance
  check:
    method: measure
    ref: null
    description: Slide the spacer onto the M5 bolt by hand. It should go on with no
      force. If it binds, run a 5.5 mm drill through the hole.
- id: length_ok
  part: spacer
  feature: overall length
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - spacer_length
  check:
    method: measure
    ref: null
    description: Use calipers to check the length is 20 mm (±0.2) and the end faces
      are flat.
manual:
- n: '1'
  text: Print the spacer standing on one end face. Use PLA at 0.2 mm layers with no
    supports. Use 3 or more walls (or 100% infill) so it doesn't squash when the bolt
    is tightened.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Clean up the ends. Then slide the spacer onto your M5 bolt to check that it
    moves freely.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '3'
  text: Put the bolt through the first plate, then the spacer, then the second plate.
    Fit a washer and nut on the end and tighten until snug. Don't over-tighten, or
    the PLA will creep under heavy clamping force.
  parts:
  - spacer
  hardware: []
  tool: 4 mm hex key
