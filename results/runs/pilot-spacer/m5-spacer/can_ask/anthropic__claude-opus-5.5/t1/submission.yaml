task: m5-spacer
note: The spacer is a plain tube, 12 mm across and 20 mm long, with a 5.6 mm hole.
  It's printed upright so the hole comes out round and the end faces come out flat
  and parallel.
questions: []
params:
  spacer_length:
    value: 20.0
    unit: mm
    kind: design
    source: asked
    note: Length the user asked for
  spacer_od:
    value: 12.0
    unit: mm
    kind: design
    source: asked
    note: Outside diameter the user asked for
  bolt_d:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: M5 nominal diameter
  hole_clearance:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Added to bolt_d. 5.6 mm is ISO 273 medium fit (5.5) plus a little extra,
      because printed holes come out slightly undersize
  edge_chamfer:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: Chamfer on the outer and hole edges at both ends. The bottom one stops elephant's
      foot.
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    hole_d = p.bolt_d + p.hole_clearance\n    s = (cq.Workplane('XY')\n\
    \         .circle(p.spacer_od / 2).circle(hole_d / 2)\n         .extrude(p.spacer_length))\n\
    \    s = s.faces('<Z or >Z').edges().chamfer(p.edge_chamfer)\n    return s\n"
  print_orientation: Stands on one end face, with the bore vertical (axis along Z).
    No supports needed.
  use_orientation: Slides onto the M5 bolt between the two plates, with one end face
    against each plate.
hardware: []
joints: []
criteria:
- id: bore_clears_bolt
  part: spacer
  feature: bore
  relation: clears
  hardware: null
  clearance_mm: 0.6
  params:
  - bolt_d
  - hole_clearance
  check:
    method: measure
    ref: null
    description: Push the M5 bolt through the spacer by hand. It should slide through
      with no forcing. If it's tight, add 0.2 to hole_clearance and reprint.
- id: length_correct
  part: spacer
  feature: end faces
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - spacer_length
  check:
    method: measure
    ref: null
    description: Measure the length with calipers. It should be 20 mm, within about
      0.2.
manual:
- n: '1'
  text: Print the spacer standing on one end, with the hole vertical. Use 0.2 mm layers
    in PLA, at least 3 walls, and no supports.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Check that your M5 bolt slides through the hole. If it's tight, run a 5.5
    mm drill through the hole by hand.
  parts:
  - spacer
  hardware: []
  tool: 5.5 mm drill bit (optional)
- n: '3'
  text: Push the bolt through the first plate, then put the spacer on, then the second
    plate. Then put on your washer and nut and tighten. The bolt needs to be at least
    20 mm plus the two plate thicknesses plus the nut height (and washer) long.
  parts:
  - spacer
  hardware: []
  tool: null
