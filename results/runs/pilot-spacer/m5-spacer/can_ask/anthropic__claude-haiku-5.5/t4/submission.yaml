task: m5-spacer
note: Simple round spacer, 20 mm long, 12 mm OD, with a 5.5 mm bore for an M5 bolt.
  The bore is a design choice for clearance; it was not measured. Printing upright
  keeps the bore round.
questions: []
params:
  length:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: Spacer length, as requested
  outer_d:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: Spacer outside diameter, as requested
  bore_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Clearance hole for an M5 bolt (5.0 mm nominal), leaves room to slide on
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    return (cq.Workplane('XY')\n            .circle(p.outer_d\
    \ / 2)\n            .circle(p.bore_d / 2)\n            .extrude(p.length))\n"
  print_orientation: Lay flat on the bed as printed; the bore is vertical, so the
    length runs along z (standing upright)
  use_orientation: Standing upright on the bolt between the two plates, the bore on
    the bolt axis
hardware: []
joints: []
criteria: []
manual:
- n: '1'
  text: Print the spacer standing upright (bore vertical) on the printer, PLA, 0.2
    mm layers. Remove any stringing from the bore with a drill bit or the bolt itself.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Slide the spacer onto the M5 bolt so the bolt passes through the bore, and
    place it between the two plates.
  parts: []
  hardware: []
  tool: null
