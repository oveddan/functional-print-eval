task: m5-spacer
note: 'Round spacer: 12 mm OD, 20 mm long, 5.5 mm clearance bore for an M5 bolt. Printed
  upright so the bore is vertical. If the bore is tight after printing, clear it with
  a 5.5 mm drill.'
questions: []
params:
  length:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: Spacer length, as requested
  od:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: Outer diameter, as requested
  bore:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Clearance bore for an M5 bolt (ISO 4762 M5 shank d=5 mm), 0.5 mm margin
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    body = cq.Workplane('XY').circle(p.od / 2).extrude(p.length)\n\
    \    hole = cq.Workplane('XY').circle(p.bore / 2).extrude(p.length)\n    return\
    \ body.cut(hole)\n"
  print_orientation: 'Standing upright on the bed: the spacer''s axis is along z,
    so the bore is vertical and the bed face is one end of the tube.'
  use_orientation: Standing upright between the two plates, bolt passing through the
    bore along the spacer axis.
hardware:
- id: bolt
  ref: ISO 4762 M5x30
  qty: 1
joints: []
criteria:
- id: C1
  part: spacer
  feature: bore
  relation: clears
  hardware: bolt
  clearance_mm: 0.5
  params:
  - bore
  check:
    method: measure
    ref: null
    description: Measure the printed bore diameter with calipers; it should be about
      5.5 mm so an M5 bolt (5 mm shank) slides through freely.
manual:
- n: '1'
  text: Print one spacer standing upright on the bed (12 mm diameter, 20 mm tall).
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Slide the spacer onto an M5 bolt so the bolt passes through the bore. Use
    an M5 bolt long enough for your plate stack plus the spacer.
  parts:
  - spacer
  hardware:
  - bolt
  tool: null
- n: '3'
  text: Place the bolt and spacer between the two plates and tighten as your assembly
    requires.
  parts: []
  hardware: []
  tool: null
