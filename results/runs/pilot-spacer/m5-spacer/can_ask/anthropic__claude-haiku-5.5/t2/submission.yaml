task: m5-spacer
note: ''
questions: []
params:
  spacer_od:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Outer diameter, as requested
  spacer_length:
    value: 20
    unit: mm
    kind: design
    source: design
    note: Length along the bolt axis, as requested
  bore_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Clearance hole for M5 bolt (5.3 mm washer ID, 5.5 mm gives slip fit for
      a 5 mm shank)
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    return (cq.Workplane('XY')\n            .circle(p.spacer_od\
    \ / 2)\n            .circle(p.bore_d / 2)\n            .extrude(p.spacer_length))\n"
  print_orientation: Standing upright, length along z, bore vertical (no supports
    needed)
  use_orientation: Between the two plates, bolt passing through the bore, axis perpendicular
    to the plates
hardware:
- id: bolt
  ref: ISO 4762 M5x30
  qty: 1
joints: []
criteria:
- id: bore_clears_bolt
  part: spacer
  feature: 5.5 mm through bore
  relation: clears
  hardware: bolt
  clearance_mm: 0.5
  params:
  - bore_d
  check:
    method: measure
    ref: null
    description: Confirm the printed bore passes an M5 bolt freely
manual:
- n: '1'
  text: Print the spacer upright (bore vertical) in black PLA at 0.2 mm layers. Remove
    any stringing from the bore with a 5.5 mm drill bit or a small file if it feels
    tight.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Slide the M5 bolt through the first plate, then slide the spacer over the
    bolt shank so it sits against the first plate.
  parts:
  - spacer
  hardware:
  - bolt
  tool: null
- n: '3'
  text: Pass the bolt through the second plate and fasten with an M5 nut or threaded
    hole in the second plate. Tighten until the spacer is held snugly between the
    plates without being crushed.
  parts: []
  hardware:
  - bolt
  tool: null
