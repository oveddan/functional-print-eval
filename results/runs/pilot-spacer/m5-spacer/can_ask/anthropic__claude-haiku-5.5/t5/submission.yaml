task: m5-spacer
note: A plain round spacer, 20 mm long, 12 mm OD, with a 5.5 mm bore for an M5 bolt.
  The bolt itself is not part of this design; it's whatever M5 bolt they already have.
questions: []
params:
  length:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: Spacer length, as requested
  outer_d:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: Outside diameter, as requested
  bore_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Clearance hole for an M5 bolt (standard medium clearance is 5.5 mm)
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    outer = cq.Workplane(\"XY\").circle(p.outer_d / 2).extrude(p.length)\n\
    \    hole = cq.Workplane(\"XY\").circle(p.bore_d / 2).extrude(p.length)\n    return\
    \ outer.cut(hole)\n"
  print_orientation: Flat end on the bed, bore vertical (axis along z)
  use_orientation: Bore on the bolt axis, sitting between the two plates
hardware: []
joints: []
criteria:
- id: bore-clears-bolt
  part: spacer
  feature: bore_d clearance hole
  relation: clears
  hardware: null
  clearance_mm: 0.5
  params:
  - bore_d
  check:
    method: measure
    ref: null
    description: Confirm the printed bore slides freely over the M5 bolt
manual:
- n: '1'
  text: Print the spacer with its flat end on the bed so the bore prints vertically.
    Remove any stringing from the bore.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Pass the M5 bolt through the first plate, slide the spacer onto the bolt so
    it sits between the two plates, then pass the bolt through the second plate and
    fasten with the nut or screw as usual.
  parts:
  - spacer
  hardware: []
  tool: null
