task: m5-spacer
note: ''
questions: []
params:
  m5_d:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: M5 nominal diameter from ISO hardware list
  length:
    value: 20
    unit: mm
    kind: design
    source: design
    note: requested spacer length
  od:
    value: 12
    unit: mm
    kind: design
    source: design
    note: requested spacer outer diameter
  clearance_hole_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: standard clearance hole for M5 bolt; M5 d=5.0, clearance 5.5
parts:
- id: spacer
  role: final
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    return (cq.Workplane('XY')\n\
    \            .cylinder(p.length, p.od / 2)\n            .faces('>Z')\n       \
    \     .hole(p.clearance_hole_d))\n"
  print_orientation: flat on one end face (z=0 is the bed), standing vertically
  use_orientation: bolt passes through the bore along the cylinder axis
hardware:
- id: bolt
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: bolt_through_spacer
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: spacer
    feature: bore
    role: clearance
  nut: null
  external: null
criteria:
- id: bolt_passes
  part: spacer
  feature: bore
  relation: clears
  hardware: bolt
  clearance_mm: 0.25
  params: []
  check:
    method: none
    ref: null
    description: 5.5 mm hole vs 5.0 mm bolt gives ~0.5 mm total clearance
- id: length
  part: spacer
  feature: height
  relation: faces
  hardware: null
  clearance_mm: null
  params: []
  check:
    method: measure
    ref: null
    description: spacer is 20 mm between the two plate faces
manual:
- n: '1'
  text: Print the spacer standing on one end.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Slide the spacer onto the M5 bolt (ISO 4762 M5x30), sitting between the two
    plates.
  parts:
  - spacer
  hardware:
  - bolt
  tool: null
