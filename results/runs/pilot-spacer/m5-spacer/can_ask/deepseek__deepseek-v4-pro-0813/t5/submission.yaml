task: m5-spacer
note: 'Round M5 clearance spacer: 12 mm OD, 20 mm long, 5.5 mm through-bore.'
questions: []
params:
  spacer_od:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: Requested spacing sleeve outside diameter ('12 mm across')
  spacer_len:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: Requested length between the two plates
  m5_major_d:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 nominal major diameter
  hole_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: 'Clearance bore for an M5 bolt: major diameter + 0.5 mm so the bolt slides
      through'
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    return (\n        cq.Workplane(\"XY\")\n        .circle(p.spacer_od\
    \ / 2)\n        .extrude(p.spacer_len)\n        .faces(\">Z\")\n        .workplane()\n\
    \        .hole(p.hole_d)\n    )\n"
  print_orientation: Bottom flat end on the bed (z=0); cylinder axis vertical
  use_orientation: Cylinder axis along the M5 bolt axis; bolt passes through the central
    bore
hardware: []
joints: []
criteria:
- id: spacer_clears_m5
  part: spacer
  feature: central bore
  relation: clears
  hardware: null
  clearance_mm: null
  params: []
  check:
    method: template
    ref: null
    description: Push an M5 bolt through the printed bore; it should slide through
      with only light hand pressure.
manual:
- n: '1'
  text: Print the spacer standing on one flat end. No supports are needed.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Slide the spacer onto the M5 bolt so it sits between the two plates, then
    tighten the assembly as usual.
  parts: []
  hardware: []
  tool: null
