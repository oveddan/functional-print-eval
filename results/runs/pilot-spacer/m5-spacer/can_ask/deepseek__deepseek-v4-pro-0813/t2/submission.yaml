task: m5-spacer
note: ''
questions: []
params:
  spacer_length:
    value: 20
    unit: mm
    kind: design
    source: design
    note: Requested total length
  spacer_od:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Requested outer diameter
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: M5 nominal diameter, ISO 4762
  hole_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
