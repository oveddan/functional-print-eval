parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    return (\n        cq.Workplane(\"XY\")\n        .circle(p.spacer_od\
    \ / 2)\n        .extrude(p.spacer_length)\n        .faces(\">Z\")\n        .workplane()\n\
    \        .hole(p.hole_d)\n    )"
  print_orientation: Flat end on the bed, z=0 at the bottom face, cylinder axis vertical
  use_orientation: Cylinder axis along the M5 bolt
hardware:
- id: m5_bolt
  ref: ISO 4762 M5x30
  qty: 1
joints: []
criteria:
