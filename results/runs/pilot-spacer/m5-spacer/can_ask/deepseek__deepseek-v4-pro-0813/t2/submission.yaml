  part: spacer
  feature: through hole
  relation: clears
  hardware: m5_bolt
  clearance_mm: 0.25
  params:
  - bolt_d
  - hole_d
  check:
    method: template
    ref: null
    description: Slide an M5 bolt through the hole; it should pass freely without
      excessive wobble
