task: m5-spacer
note: Simple 20 mm long x 12 mm OD round spacer with a 5.5 mm clearance bore for an
  M5 bolt. Printed standing on its end face so the bore is vertical and needs no supports.
questions: []
params:
  spacer_od:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: Requested width/diameter (12 mm across)
  spacer_len:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: Requested length along the bolt, between the two plates
  clearance_hole_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: 'Clearance bore for ISO 4762 M5 bolt: 5.0 mm nominal major diameter + 0.5
      mm diametral clearance'
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    return (cq.Workplane(\"XY\")\n            .circle(p.spacer_od\
    \ / 2.0)\n            .circle(p.clearance_hole_d / 2.0)\n            .extrude(p.spacer_len))"
  print_orientation: Axis vertical; the flat circular end face sits on the bed at
    z = 0, and the 5.5 mm bore runs straight up through the part (no supports or long
    bridges).
  use_orientation: Axis along the M5 bolt; either flat end face bears against a plate.
hardware: []
joints: []
criteria:
- id: m5_clearance_fit
  part: spacer
  feature: through-bore
  relation: clears
  hardware: null
  clearance_mm: 0.25
  params: []
  check:
    method: none
    ref: null
    description: 'Slide the spacer onto the user''s M5 bolt: it should go on freely
      with a little radial play, then sit between the two plates.'
manual:
- n: '1'
  text: 'Print one ''spacer'' in the orientation given: standing on its circular end
    face, bore vertical.'
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Slide the spacer onto your M5 bolt between the two plates. The bolt should
    pass through the 5.5 mm bore freely.
  parts:
  - spacer
  hardware: []
  tool: null
