task: m5-spacer
note: Single printed spacer only. The M5 bolt and the two plates are existing hardware;
  no fastener is consumed by this part. Bore is 5.5 mm (medium clearance on a 5 mm
  M5 shank). Wall thickness is 3.25 mm.
questions: []
params:
  spacer_od:
    value: 12.0
    unit: mm
    kind: design
    source: asked
    note: User specified 12 mm across (diameter of a round spacer).
  spacer_len:
    value: 20.0
    unit: mm
    kind: design
    source: asked
    note: User specified 20 mm long, along the bolt axis.
  m5_d:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 nominal shank diameter.
  hole_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: 'Medium clearance for M5 (ISO 273): m5_d + 0.5 mm. Wall is (spacer_od -
      hole_d) / 2 = 3.25 mm.'
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    body = cq.Workplane(\"XY\").circle(p.spacer_od / 2.0).extrude(p.spacer_len)\n\
    \    bore = cq.Workplane(\"XY\").circle(p.hole_d / 2.0).extrude(p.spacer_len)\n\
    \    return body.cut(bore)\n"
  print_orientation: One flat end face on the bed (z = 0). Cylinder axis and bore
    along +Z so the hole is printed vertically.
  use_orientation: Axis along the M5 bolt, sandwiched between the two plates.
hardware: []
joints: []
criteria:
- id: bore_clears_m5
  part: spacer
  feature: bore
  relation: clears
  hardware: null
  clearance_mm: 0.25
  params:
  - hole_d
  - m5_d
  check:
    method: measure
    ref: null
    description: After printing, an M5 screw (5 mm shank) must pass freely through
      the bore. If it binds, drill the hole out to 5.5 mm.
manual:
- n: '1'
  text: Slice spacer in PLA at 0.2 mm layer height with the flat end on the bed (the
    orientation it was modeled in). No supports. The 20 mm height and 12 mm diameter
    fit the X1C bed with margin.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Print spacer. Let it cool, then check that an M5 bolt slides through the hole
    by hand. If the first layers closed the hole slightly, drill it to 5.5 mm.
  parts:
  - spacer
  hardware: []
  tool: 5.5 mm drill, only if the bolt does not pass freely
- n: '3'
  text: Slide spacer onto the M5 bolt between the two plates so the 20 mm length sets
    the gap. Tighten the bolt as usual; the spacer is not threaded and should not
    be crushed past a snug fit.
  parts:
  - spacer
  hardware: []
  tool: null
