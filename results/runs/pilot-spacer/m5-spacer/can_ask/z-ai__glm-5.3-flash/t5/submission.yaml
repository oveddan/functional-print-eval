task: m5-spacer
note: Requested 20 mm long, 12 mm across, clearance bore for M5. Printed on end so
  the bore is round (no bridging). They couldn't measure their bolt; bore sized from
  catalog M5 major dia 5.0 mm.
questions:
- text: 'You couldn''t measure the bolt, so note: if your bolt is only M5x20, a 20
    mm spacer leaves no room for the two plates plus a nut (need roughly 20 + plates
    + ~6 mm). If that''s the case, tell me and I''ll shorten the spacer.'
  answer: null
- text: After printing, check the bore takes your bolt freely; if your bolt is a sloppy
    oversized or zinc-plated M5 that runs over 5.2 mm at the crests, a 5.5 mm bore
    still clears it.
  answer: null
params:
  bore_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: clearance bore for M5; ISO 273 medium fit 5.5 mm, clears the 5.0 mm thread
      crests with 0.25 mm radial gap so it also slides freely over the threaded part
      of the bolt
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: M5 thread major diameter (ISO 4762 M5); the person could not measure their
      bolt, so catalog value used
  chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: 1 mm x 45 deg chamfer on all circular edges, both ends, so the spacer slips
      onto the bolt and does not dig into the plates
  spacer_len:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: requested 20 mm long; sets the gap between the two plates
  spacer_od:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: requested 12 mm across
parts:
- id: spacer_m5
  role: final
  material: PLA (black, high-speed)
  code: "def build(p):\n    return (\n        cq.Workplane(\"XY\")\n        .circle(p.spacer_od\
    \ / 2.0)\n        .circle(p.bore_d / 2.0)\n        .extrude(p.spacer_len)\n  \
    \      .edges()\n        .chamfer(p.chamfer)\n    )\n"
  print_orientation: one end face on the bed, bore axis vertical (as modeled, z=0
    is the bottom end)
  use_orientation: bore axis along the bolt; either end can face up
hardware: []
joints: []
criteria:
- id: bore_clears_bolt
  part: spacer_m5
  feature: bore
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - bolt_d
  - bore_d
  check:
    method: none
    ref: null
    description: Bore is 5.5 mm against the M5 thread major diameter of 5.0 mm from
      the catalog, so it clears the threads by 0.25 mm radially even over the threaded
      section. Quick test-fit of the actual bolt after printing confirms it.
- id: len_sets_gap
  part: spacer_m5
  feature: length
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - spacer_len
  check:
    method: measure
    ref: calipers, overall height
    description: Printed height should measure 20 mm; this sets the gap between the
      two plates.
manual:
- n: '1'
  text: Print spacer_m5 standing on end, hole axis vertical, no supports and no bridging.
    The 12 mm footprint is small, so enable a brim if it wants to lift; snap the brim
    off before use.
  parts:
  - spacer_m5
  hardware: []
  tool: null
- n: '2'
  text: Slide the spacer onto your M5 bolt between the two plates. The 5.5 mm bore
    clears the 5 mm threads, so it also spins freely over the threaded section. Add
    your nut (and washers if you use them) to clamp the stack.
  parts:
  - spacer_m5
  hardware: []
  tool: null
