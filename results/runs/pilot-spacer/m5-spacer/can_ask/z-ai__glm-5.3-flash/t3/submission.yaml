task: m5-spacer
note: ''
questions: []
params:
  spacer_length:
    value: 20
    unit: mm
    kind: world
    source: asked
    note: length you asked for
  spacer_od:
    value: 12
    unit: mm
    kind: world
    source: asked
    note: diameter you asked for
  m5_bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: M5 nominal thread diameter (ISO 4762 M5)
  bore_d:
    value: 5.8
    unit: mm
    kind: design
    source: design
    note: clearance hole, ISO 273 medium fit for M5 (+0.8 mm on the 5 mm thread);
      0.4 mm radial clearance absorbs FDM hole shrinkage
  chamfer:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: 45-degree chamfer on both end faces, outer rim and bore entry, so the spacer
      slips on the bolt and seats flush
parts:
- id: spacer-m5-20x12
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    body = (\n        cq.Workplane(\"XY\")\n        .circle(p.spacer_od\
    \ / 2.0)\n        .extrude(p.spacer_length)\n    )\n    body = body.faces(\">Z\"\
    ).workplane().hole(p.bore_d)\n    # 0.5 mm chamfer on both end faces: softens\
    \ the outer rim and\n    # countersinks the bore entry so the bolt starts easily\n\
    \    body = body.faces(\">Z\").chamfer(p.chamfer)\n    body = body.faces(\"<Z\"\
    ).chamfer(p.chamfer)\n    return body\n"
  print_orientation: 'standing on end: bottom end face (z=0) on the bed, bore axis
    vertical along Z'
  use_orientation: any orientation works (part is symmetric end-to-end); bore axis
    along the M5 bolt
hardware: []
joints: []
criteria:
- id: bore-clears-m5
  part: spacer-m5-20x12
  feature: through bore, 5.8 mm dia
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - bore_d
  - m5_bolt_d
  check:
    method: measure
    ref: null
    description: 'test-fit your M5 bolt through the printed bore: it should slide
      through by hand with slight play, no forcing. If too tight, reprint with bore_d
      +0.2 mm.'
- id: length-20
  part: spacer-m5-20x12
  feature: overall length 20 mm (sets the gap between the plates)
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - spacer_length
  check:
    method: measure
    ref: null
    description: measure the printed part end to end; should be 20 mm (PLA shrinkage
      on a 20 mm column is negligible)
- id: od-12
  part: spacer-m5-20x12
  feature: outer diameter 12 mm
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - spacer_od
  check:
    method: measure
    ref: null
    description: caliper across the printed cylinder; should read ~12 mm. Vertical-wall
      circles print true on an X1C.
manual:
- n: '1'
  text: 'Print spacer-m5-20x12 in black PLA, standing on end exactly as modelled (bore
    along Z): 0.2 mm layers, no supports, no brim needed (add a small brim only if
    the 11 mm foot ever lifts). It is ~100 layers, a few minutes.'
  parts:
  - spacer-m5-20x12
  hardware: []
  tool: null
- n: '2'
  text: 'Check the fit: push your M5 bolt through the bore by hand. It should slide
    freely with slight play and the 0.5 mm chamfers should let it start easily. If
    it binds, ream the bore slightly or reprint with bore_d = 6.0.'
  parts:
  - spacer-m5-20x12
  hardware: []
  tool: null
- n: '3'
  text: Slide the spacer onto the M5 bolt between the two plates; the flat chamfered
    ends sit against the plate faces and hold them 20 mm apart.
  parts:
  - spacer-m5-20x12
  hardware: []
  tool: null
