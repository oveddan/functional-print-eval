task: m5-spacer
note: 'Spacer as requested: Ø12 × 20 mm, Ø5.5 M5 clearance hole, printed hole-up so
  the bore is perfectly round. Includes a fit-test coupon and a bolt-length guess
  for the unmeasured plates — everything sized so any M5 bolt they already own works
  too.'
questions: []
params:
  bolt_len:
    value: 40
    unit: mm
    kind: design
    source: design
    note: 'Chosen to cover an unmeasured plate stack: 20 spacer + up to ~14 mm of
      plates + washer + full nut engagement; bolts longer than needed just protrude
      past the nut'
  chamfer:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Lead-in on both hole entries and edge break on the ends
  hole_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Standard close-fit clearance for M5; 0.5 mm play so the bolt slides through
      freely
  plate_total:
    value: 8
    unit: mm
    kind: world
    source: guessed
    note: Plates could not be measured; assumed ~4 mm each. Bolt was sized so anything
      up to 14 mm total still gets full nut engagement
  spacer_len:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: User asked for 20 mm long
  spacer_od:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: User asked for 12 mm across
parts:
- id: spacer
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    return (\n        cq.Workplane(\"XY\")\n        .circle(p.spacer_od\
    \ / 2.0)\n        .extrude(p.spacer_len)\n        .faces(\">Z\")\n        .workplane()\n\
    \        .hole(p.hole_d)\n        .edges(\"%CIRCLE\")\n        .chamfer(p.chamfer)\n\
    \    )"
  print_orientation: flat end face down (z=0 end on the bed), hole axis vertical
  use_orientation: hole axis vertical, same as printed
- id: fit_coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    return (\n        cq.Workplane(\"XY\")\n        .circle(p.spacer_od\
    \ / 2.0)\n        .extrude(5.0)\n        .faces(\">Z\")\n        .workplane()\n\
    \        .hole(p.hole_d)\n        .edges(\"%CIRCLE\")\n        .chamfer(p.chamfer)\n\
    \    )"
  print_orientation: flat face down, hole axis vertical
  use_orientation: hole axis vertical
hardware:
- id: m5x40
  ref: ISO 4762 M5x40
  qty: 1
- id: m5_locknut
  ref: ISO 10511 M5
  qty: 1
- id: m5_washer
  ref: ISO 7089 M5
  qty: 2
joints:
- id: bolt_through_spacer
  fastener: m5x40
  axis_origin:
  - 0.0
  - 0.0
  - -2.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: spacer
    feature: bore
    role: clearance
  nut: m5_locknut
  external: the two plates being clamped (thickness not measurable, assumed ~4 mm
    each); the bolt passes through plate 1, the spacer, plate 2, then takes the M5
    lock nut
criteria: []
manual:
- n: '1'
  text: 'Print the fit_coupon test disc first (same Ø5.5 hole as the real spacer).
    Push the M5 bolt through it: it should slide through with a little play, not need
    force. If it''s tight, re-print with the hole opened up 0.2-0.3 mm.'
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Print the spacer standing on one end (hole axis vertical). Use a brim — the
    12 mm footprint is small — and no supports. The hole prints clean with no bridging.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '3'
  text: 'Stack the joint on the bolt: washer, bolt head, plate 1, spacer, plate 2,
    washer, then the lock nut. If your own M5 bolt is long enough (see note), use
    it instead of the supplied one.'
  parts:
  - spacer
  hardware:
  - m5x40
  - m5_washer
  tool: null
- n: '4'
  text: 'Tighten the lock nut. The spacer just sits between the plates — don''t crank
    it hard, the nylon insert holds the nut fine at hand-tight-plus. NOTE on bolt
    length: the plates couldn''t be measured, so the supplied M5x40 assumes up to
    ~14 mm of plate total. If your two plates are much thinner (under ~7 mm total)
    the bolt will stick out past the nut — still perfectly usable, just protruding.
    If they''re thicker than ~14 mm total, tell me and I''ll respace the bolt length.'
  parts: []
  hardware:
  - m5_locknut
  tool: null
