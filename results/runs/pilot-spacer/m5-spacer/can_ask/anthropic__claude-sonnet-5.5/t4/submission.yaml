task: m5-spacer
note: I couldn't get the plate thickness, so the M5x40 bolt is an assumption. 40 mm
  gives 20 mm of spacer, about 8 mm of plate thickness in total, two washers (2 mm)
  and a nut (4.7 mm), and leaves a little thread showing. The bolt is the only part
  that depends on plate thickness. The spacer doesn't. The 5.5 mm bore is M5 plus
  0.5 mm, because vertical printed holes tend to come out slightly small.
questions: []
params:
  spacer_od:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: requested 12 mm across
  spacer_len:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: requested 20 mm long
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: M5 nominal
  hole_clearance:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: diametral clearance for a printed vertical hole, which tends to print slightly
      small
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    hole_d = p.bolt_d + p.hole_clearance\n    return (cq.Workplane('XY').circle(p.spacer_od/2).circle(hole_d/2).extrude(p.spacer_len))"
  print_orientation: standing on one flat end, axis vertical (z = 0 is the bed)
  use_orientation: axis along the bolt, between the two plates
hardware:
- id: bolt
  ref: ISO 4762 M5x40
  qty: 1
- id: nut
  ref: ISO 4032 M5
  qty: 1
- id: washer
  ref: ISO 7089 M5
  qty: 2
joints: []
criteria:
- id: c1
  part: spacer
  feature: through bore
  relation: clears
  hardware: bolt
  clearance_mm: 0.25
  params:
  - bolt_d
  - hole_clearance
  check:
    method: measure
    ref: null
    description: After printing, the M5 bolt should slide through the full 20 mm bore
      without force. Bore is 5.5 mm, so 0.25 mm per side.
manual:
- n: '1'
  text: Print the spacer standing on its end in PLA, 0.2 mm layers. Check that the
    M5 bolt slides freely through the bore. If it sticks, ream it lightly with a 5.5
    mm drill bit.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Put a washer on the M5 bolt. Pass the bolt through the first plate, then through
    the spacer, then through the second plate. Add the second washer and the nut,
    and tighten until the plates sit firmly against the spacer ends. The M5x40 length
    assumes the plates are about 8 mm thick or less combined. Use a longer or shorter
    bolt if yours differ. You want the bolt to stick out past the nut by at least
    one thread.
  parts:
  - spacer
  hardware:
  - bolt
  - washer
  - nut
  tool: 8 mm wrench and 4 mm hex key
