task: m5-spacer
note: Plain 20 mm long, 12 mm OD tube with a 5.5 mm through bore for an M5 bolt. I
  didn't specify the bolt, nut or washer lengths, because I don't know the plate thicknesses.
  Pick a bolt of at least 20 mm plus both plate thicknesses plus the nut height.
questions: []
params:
  spacer_length:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: Requested spacer length
  spacer_od:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: Requested outer diameter
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: M5 bolt nominal diameter
  hole_clearance:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Diametral clearance, so the printed hole (about 5.5 mm) passes an M5 bolt
      even if it prints slightly small
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    return (cq.Workplane('XY').circle(p.spacer_od/2).circle((p.bolt_d+p.hole_clearance)/2).extrude(p.spacer_length))"
  print_orientation: Standing on one flat end face (axis vertical), z=0 on the bed
  use_orientation: Axis along the bolt, between the two plates
hardware: []
joints: []
criteria:
- id: c1
  part: spacer
  feature: through bore
  relation: clears
  hardware: null
  clearance_mm: 0.5
  params:
  - bolt_d
  - hole_clearance
  check:
    method: measure
    ref: null
    description: Push an M5 bolt through the printed bore. It should slide freely.
      If it binds, ream the bore with a 5.5 mm drill.
manual:
- n: '1'
  text: Print the spacer standing on its flat end, in PLA at 0.2 mm layers. It needs
    no supports.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Check that your M5 bolt slides through the bore.
  parts: []
  hardware: []
  tool: null
- n: '3'
  text: Slide the spacer onto the M5 bolt. Put it between the two plates and tighten
    the bolt with your own nut. The bolt must be long enough to pass through both
    plates and the 20 mm spacer. The plate thicknesses weren't given, so check this
    yourself.
  parts:
  - spacer
  hardware: []
  tool: null
