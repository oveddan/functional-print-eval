task: m5-spacer
note: I didn't know the plate thickness, so I left the bolt length for you to choose.
  Bolt length = both plate thicknesses + 20 mm + nut height, rounded up to the next
  standard length. The 5.5 mm hole gives a little play on the 5 mm bolt.
questions: []
params:
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: M5 bolt shank
  hole_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: 'M5 clearance hole: 0.5 mm over the shank to allow for vertical-hole shrink
      in PLA'
  spacer_len:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: requested length
  spacer_od:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: requested outside diameter
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    return (cq.Workplane('XY').circle(p.spacer_od/2).circle(p.hole_d/2).extrude(p.spacer_len))"
  print_orientation: Flat end face on the bed, axis vertical (z), so the length is
    20 mm tall
  use_orientation: Axis along the bolt, between the two plates
hardware: []
joints: []
criteria:
- id: c1
  part: spacer
  feature: through bore
  relation: clears
  hardware: null
  clearance_mm: 0.25
  params:
  - hole_d
  - bolt_d
  check:
    method: measure
    ref: null
    description: Bolt slides freely through the printed bore; bore about 5.5 mm vs
      5 mm shank
manual:
- n: '1'
  text: Print the spacer standing on its end (flat face down), 0.2 mm layers, 3 or
    more walls. No supports are needed.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Check that the M5 bolt slides through the bore. If it is tight, clean the
    hole with a 5.5 mm drill bit by hand.
  parts: []
  hardware: []
  tool: null
- n: '3'
  text: Pass the M5 bolt through the first plate, then the spacer, then the second
    plate. Fasten with a nut on the far side. Choose a bolt long enough to cover both
    plates plus the 20 mm spacer plus the nut.
  parts:
  - spacer
  hardware: []
  tool: null
