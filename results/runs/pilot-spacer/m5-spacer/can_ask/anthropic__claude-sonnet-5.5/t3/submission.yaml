task: m5-spacer
note: No hardware is listed because the plate thickness and bolt length weren't given.
  Use your own M5 bolt and nut, with a length equal to both plate thicknesses + 20
  mm + nut height.
questions: []
params:
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: M5 shank diameter
  hole_clearance:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: diametral clearance for FDM-printed hole, gives 5.5 mm bore
  spacer_od:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: outer diameter requested
  spacer_len:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: length requested
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    return (cq.Workplane('XY').circle(p.spacer_od/2).circle((p.bolt_d+p.hole_clearance)/2).extrude(p.spacer_len))"
  print_orientation: standing on one flat end face (axis vertical), z=0 is the bed
  use_orientation: axis along the bolt, between the two plates
hardware: []
joints: []
criteria:
- id: c1
  part: spacer
  feature: through bore
  relation: clears
  hardware: null
  clearance_mm: 0.25
  params:
  - bolt_d
  - hole_clearance
  check:
    method: measure
    ref: null
    description: Push an M5 bolt shank through the printed bore; it should slide freely.
      Bore is 5.5 mm (0.25 mm radial clearance).
manual:
- n: '1'
  text: Print the spacer standing on its end (20 mm tall) in PLA, 0.2 mm layers, no
    supports needed. 3 or more walls recommended.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Check that an M5 bolt slides through the bore. If tight, ream lightly with
    a 5.5 mm drill bit by hand.
  parts: []
  hardware: []
  tool: null
- n: '3'
  text: Slide the spacer onto the M5 bolt and fit it between the two plates, then
    tighten the bolt with your own nut. Choose a bolt long enough to cover both plates
    plus 20 mm plus the nut.
  parts:
  - spacer
  hardware: []
  tool: null
