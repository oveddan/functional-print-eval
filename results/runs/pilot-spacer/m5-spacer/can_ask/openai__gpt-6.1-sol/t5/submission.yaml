task: m5-spacer
note: 'Round spacer: 20 mm long × 12 mm outside diameter, with a 5.6 mm through clearance
  bore for M5. Bolt length depends on the plates and fastening arrangement; no additional
  hardware is specified.'
questions: []
params:
  spacer_length:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: ''
  spacer_outer_diameter:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: ''
  bolt_nominal_diameter:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: M5 nominal thread diameter.
  hole_diametral_clearance:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: 5.6 mm modeled bore allows for typical printed-hole undersizing; verify
      fit.
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    return (cq.Workplane('XY')\n            .circle(p.spacer_outer_diameter\
    \ / 2)\n            .circle((p.bolt_nominal_diameter + p.hole_diametral_clearance)\
    \ / 2)\n            .extrude(p.spacer_length))"
  print_orientation: Flat annular end on the bed, bore vertical; z = 0 is the bottom
    end.
  use_orientation: Bore coaxial with the M5 bolt; flat ends contact the two plates.
hardware: []
joints: []
criteria:
- id: bolt_clearance
  part: spacer
  feature: Through bore
  relation: clears
  hardware: null
  clearance_mm: 0.3
  params:
  - bolt_nominal_diameter
  - hole_diametral_clearance
  check:
    method: measure
    ref: null
    description: Before assembly, check that your M5 bolt slides freely through the
      full bore without threading into the plastic.
manual:
- n: '1'
  text: Print spacer upright as modeled in PLA at 0.2 mm layer height, with 4 walls
    and 100% infill. No supports needed.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Remove any brim or first-layer burrs. Check the spacer is 20 mm long and that
    your M5 bolt slides freely through it. If tight, carefully clear the bore with
    a 5.5 mm drill bit if available, or enlarge the modeled bore and reprint.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '3'
  text: Place spacer between the plates and pass your M5 bolt through both plates
    and the spacer. Use your existing fastening arrangement; tighten only enough to
    hold securely, without crushing the PLA. PLA can creep under sustained clamp load
    and soften with heat.
  parts:
  - spacer
  hardware: []
  tool: null
