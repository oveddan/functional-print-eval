task: m5-spacer
note: 'Round spacer: 20 mm long × 12 mm outside diameter, with a 5.5 mm through-hole
  for M5 clearance. Use for light-duty spacing; PLA can creep under sustained clamp
  load or heat.'
questions: []
params:
  spacer_length:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: ''
  spacer_diameter:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: ''
  bolt_diameter:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal M5 bolt diameter.
  hole_diameter:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: 0.5 mm diametral clearance over nominal M5; verify with the actual bolt.
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    return (cq.Workplane('XY')\n            .circle(p.spacer_diameter\
    \ / 2)\n            .circle(p.hole_diameter / 2)\n            .extrude(p.spacer_length))"
  print_orientation: Flat annular end on the bed at z = 0; hole axis vertical.
  use_orientation: Between the plates with the bolt passing axially through the hole;
    flat ends contact the plates.
hardware: []
joints: []
criteria:
- id: bolt_clearance
  part: spacer
  feature: Axial through-hole
  relation: clears
  hardware: null
  clearance_mm: 0.25
  params:
  - hole_diameter
  - bolt_diameter
  check:
    method: measure
    ref: null
    description: Check that the actual M5 bolt slides freely through the printed hole
      without forcing it.
- id: overall_dimensions
  part: spacer
  feature: Overall length and outside diameter
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - spacer_length
  - spacer_diameter
  check:
    method: measure
    ref: null
    description: Check printed length is 20 mm and outside diameter is 12 mm.
manual:
- n: '1'
  text: Print spacer upright as modeled in PLA at 0.2 mm layers, with 4 walls and
    100% infill. No supports required.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Remove any brim or first-layer lip from the ends and hole. Check the length
    and diameter, and test that your M5 bolt slides freely through the hole.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '3'
  text: Place spacer between the two plates and pass your M5 bolt through both plates
    and the spacer. Tighten only enough to secure the assembly; excessive compression
    can deform PLA. Bolt length depends on the plate thicknesses and fastening arrangement.
  parts:
  - spacer
  hardware: []
  tool: null
