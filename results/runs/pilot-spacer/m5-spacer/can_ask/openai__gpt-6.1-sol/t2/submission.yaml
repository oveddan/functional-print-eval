task: m5-spacer
note: 20 mm long × 12 mm outside diameter round spacer, with a 5.5 mm clearance hole
  for an M5 bolt. All dimensions in millimetres.
questions: []
params:
  length:
    value: 20
    unit: mm
    kind: world
    source: asked
    note: ''
  outside_diameter:
    value: 12
    unit: mm
    kind: world
    source: asked
    note: ''
  bolt_diameter:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  hole_diametral_clearance:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    return (cq.Workplane('XY')\n            .circle(p.outside_diameter\
    \ / 2)\n            .circle((p.bolt_diameter + p.hole_diametral_clearance) / 2)\n\
    \            .extrude(p.length))\n"
  print_orientation: Flat annular end on the bed at z = 0, with hole axis vertical.
  use_orientation: Between the plates, with the bolt through the axial hole and each
    flat end contacting a plate.
hardware: []
joints: []
criteria:
- id: bolt_clearance
  part: spacer
  feature: Axial through-hole
  relation: clears
  hardware: null
  clearance_mm: 0.25
  params:
  - bolt_diameter
  - hole_diametral_clearance
  check:
    method: measure
    ref: null
    description: Confirm your M5 bolt slides freely through the printed hole; nominal
      radial clearance is 0.25 mm.
- id: length_check
  part: spacer
  feature: Flat end-to-end spacing
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - length
  check:
    method: measure
    ref: null
    description: Check printed end-to-end length is 20 mm and the ends are flat.
manual:
- n: '1'
  text: Print upright as modeled using 0.2 mm layers, 4 walls, 5 top and bottom layers,
    and 100% infill. No supports are needed.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Remove any brim and first-layer burrs. Check the length and test that your
    M5 bolt slides freely through the hole. Gently deburr the hole if necessary.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '3'
  text: 'Place the spacer between the plates and pass your M5 bolt through the assembly.
    Tighten only enough to secure it: excessive clamping can crush PLA, and heat or
    sustained load can cause creep.'
  parts:
  - spacer
  hardware: []
  tool: null
