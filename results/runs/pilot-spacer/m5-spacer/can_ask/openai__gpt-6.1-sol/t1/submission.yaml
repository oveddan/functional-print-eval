task: m5-spacer
note: 'Round spacer: 20 mm long, 12 mm outside diameter, 5.5 mm through-hole for M5
  clearance. All dimensions in mm.'
questions: []
params:
  outside_diameter:
    value: 12.0
    unit: mm
    kind: design
    source: asked
    note: ''
  length:
    value: 20.0
    unit: mm
    kind: design
    source: asked
    note: ''
  bolt_diameter:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  hole_diameter:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.outside_diameter /\
    \ 2).circle(p.hole_diameter / 2).extrude(p.length)\n"
  print_orientation: Flat annular end on bed at z = 0; hole axis vertical.
  use_orientation: Flat ends against the plates, with the hole aligned to the M5 bolt.
hardware: []
joints: []
criteria:
- id: bolt_fit
  part: spacer
  feature: Axial through-hole
  relation: clears
  hardware: null
  clearance_mm: 0.25
  params:
  - hole_diameter
  - bolt_diameter
  check:
    method: measure
    ref: null
    description: Verify your M5 bolt slides freely through the printed hole.
- id: dimensions
  part: spacer
  feature: Outside diameter and end-to-end length
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - outside_diameter
  - length
  check:
    method: measure
    ref: null
    description: Check outside diameter is 12 mm and length is 20 mm within your assembly's
      required tolerance.
manual:
- n: '1'
  text: Print spacer upright in PLA at 0.2 mm layer height, with 4 walls and 100%
    infill. No supports needed.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Remove first-layer burrs and check the ends are flat. Check dimensions and
    confirm your existing M5 bolt slides freely through the hole. If it binds, slightly
    increase hole_diameter and reprint.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '3'
  text: Place spacer between the two plates and pass your existing M5 bolt through
    the assembly. Bolt length must suit the plate thicknesses and fastening arrangement.
    Tighten gently to avoid crushing the PLA; heat and sustained high clamping loads
    can cause creep.
  parts:
  - spacer
  hardware: []
  tool: null
