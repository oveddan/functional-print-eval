task: m5-spacer
note: 'Round spacer: 12 mm outside diameter × 20 mm long, with a 5.5 mm clearance
  through-hole for an M5 bolt. Dimensions in millimetres.'
questions: []
params:
  outer_diameter:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: ''
  length:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: ''
  bolt_nominal_diameter:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  hole_diameter:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    return (cq.Workplane('XY')\n            .circle(p.outer_diameter\
    \ / 2)\n            .circle(p.hole_diameter / 2)\n            .extrude(p.length))\n"
  print_orientation: Flat annular end on the bed at z = 0; hole axis vertical.
  use_orientation: Bolt passes along the hole axis; flat ends contact the two plates.
hardware: []
joints: []
criteria:
- id: bolt_clearance
  part: spacer
  feature: Axial through-hole
  relation: clears
  hardware: null
  clearance_mm: 0.25
  params:
  - hole_diameter
  - bolt_nominal_diameter
  check:
    method: measure
    ref: null
    description: Confirm your actual M5 bolt slides freely through the printed hole
      without threading into the plastic.
- id: length_check
  part: spacer
  feature: Flat end faces spaced 20 mm apart
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - length
  check:
    method: measure
    ref: null
    description: Measure the finished length and confirm 20 mm before assembly.
manual:
- n: '1'
  text: Print spacer upright in PLA at 0.2 mm layer height with 4 walls and 100% infill.
    No supports are needed.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Remove any first-layer lip or brim. Check flat end faces, 20 mm length, and
    free passage of your M5 bolt. If tight, carefully clear the hole with a 5.5 mm
    drill.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '3'
  text: 'Place spacer between the plates and pass your existing M5 bolt through the
    assembly. Use a bolt length suitable for the plates and fastening arrangement.
    Tighten gently: excessive clamping can crush PLA, and sustained loads can cause
    creep.'
  parts:
  - spacer
  hardware: []
  tool: null
