task: m5-spacer
note: Round spacer (12 mm OD, 20 mm length) with an ISO standard clearance hole (5.5
  mm diameter) for an M5 bolt between two plates.
questions: []
params:
  hole_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Clearance hole diameter for M5 bolt (ISO 273 normal clearance of 5.5 mm,
      providing 0.5 mm diametral clearance)
  spacer_length:
    value: 20.0
    unit: mm
    kind: design
    source: asked
    note: Length of the spacer along the bolt axis
  bolt_d:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal diameter of M5 bolt
  spacer_od:
    value: 12.0
    unit: mm
    kind: design
    source: asked
    note: Outer diameter of the round spacer
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    import cadquery as cq\n    part = (\n        cq.Workplane(\"\
    XY\")\n        .circle(p.spacer_od / 2.0)\n        .circle(p.hole_d / 2.0)\n \
    \       .extrude(p.spacer_length)\n    )\n    return part\n"
  print_orientation: Flat annular face on the build plate at z=0, extruding vertically
    along the Z-axis to z=20 mm.
  use_orientation: Oriented axially along the M5 bolt between the two plates.
hardware: []
joints: []
criteria:
- id: bolt_clearance
  part: spacer
  feature: central_bore
  relation: clears
  hardware: null
  clearance_mm: 0.5
  params:
  - hole_d
  - bolt_d
  check:
    method: measure
    ref: null
    description: Ensure the M5 bolt passes smoothly through the central bore without
      binding.
manual:
- n: '1'
  text: Insert the M5 bolt through the first plate, slide the 3D-printed spacer onto
    the bolt shaft, pass the bolt through the second plate, and secure with a matching
    M5 nut.
  parts:
  - spacer
  hardware: []
  tool: null
