task: m5-spacer
note: 'Round spacer for M5 bolt: 20 mm length, 12 mm OD, 5.5 mm clearance bore (0.5
  mm diametral clearance).'
questions: []
params:
  hole_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Clearance hole diameter (bolt_d + hole_clearance)
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal diameter of an M5 bolt
  spacer_length:
    value: 20
    unit: mm
    kind: world
    source: asked
    note: Required spacer length between the two plates
  spacer_od:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: Spacer outer diameter
  hole_clearance:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Diametral clearance for free-fit M5 pass-through
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    return (\n        cq.Workplane(\"XY\")\n        .circle(p.spacer_od\
    \ / 2.0)\n        .circle(p.hole_d / 2.0)\n        .extrude(p.spacer_length)\n\
    \    )\n"
  print_orientation: Base annular face on the bed at Z = 0; cylinder axis along +Z
  use_orientation: Cylinder axis aligned along the M5 bolt between the two plates
hardware: []
joints: []
criteria:
- id: bolt_clearance
  part: spacer
  feature: central_hole
  relation: clears
  hardware: null
  clearance_mm: 0.5
  params:
  - hole_d
  - bolt_d
  check:
    method: measure
    ref: null
    description: Verify that an M5 bolt slides freely through the central hole without
      binding.
manual:
- n: '1'
  text: 3D print the spacer upright on the build plate (flat face at Z=0). After printing,
    check that the central hole is clean and free of stringing or elephant's foot.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Slide the spacer over the M5 bolt shank between your two plates, then tighten
    your bolt assembly.
  parts:
  - spacer
  hardware: []
  tool: null
