task: m5-spacer
note: 'Round spacer for M5 bolt: 20 mm length, 12 mm OD, 5.5 mm clearance bore.'
questions: []
params:
  spacer_od:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: Outer diameter of the spacer
  hole_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Clearance hole diameter for M5 bolt (standard clearance + FDM allowance)
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal major diameter of M5 bolt
  spacer_length:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: Length / height of the spacer along bolt axis
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    return (\n        cq.Workplane(\"XY\")\n        .circle(p.spacer_od\
    \ / 2.0)\n        .extrude(p.spacer_length)\n        .faces(\">Z\")\n        .hole(p.hole_d)\n\
    \    )\n"
  print_orientation: Flat annular base on the build plate (z = 0), cylinder axis aligned
    with +Z.
  use_orientation: Standing between the two plates with the M5 bolt passing through
    along the Z axis.
hardware: []
joints: []
criteria:
- id: crit_length
  part: spacer
  feature: overall_height
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - spacer_length
  check:
    method: measure
    ref: null
    description: Verify spacer length is 20.0 mm using calipers.
- id: crit_od
  part: spacer
  feature: outer_diameter
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - spacer_od
  check:
    method: measure
    ref: null
    description: Verify outer diameter is 12.0 mm using calipers.
- id: crit_clearance
  part: spacer
  feature: through_bore
  relation: clears
  hardware: null
  clearance_mm: 0.25
  params:
  - hole_d
  - bolt_d
  check:
    method: measure
    ref: null
    description: Ensure M5 bolt slides freely through the bore.
manual:
- n: '1'
  text: Print the spacer standing upright on the build plate (z = 0 at the base) using
    PLA, 0.2 mm layer height, and 100% infill (or at least 4 perimeters) for compressive
    strength.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Check that your M5 bolt slides smoothly through the central bore. If printer
    hole shrinkage makes it tight, run a 5.5 mm drill bit through by hand.
  parts:
  - spacer
  hardware: []
  tool: 5.5 mm drill bit (optional)
- n: '3'
  text: Slide the spacer over the M5 bolt between the two plates during assembly.
  parts:
  - spacer
  hardware: []
  tool: null
