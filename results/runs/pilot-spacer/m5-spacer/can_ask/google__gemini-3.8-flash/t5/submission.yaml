task: m5-spacer
note: Round spacer (OD 12 mm, length 20 mm) with a 5.5 mm clearance hole for an M5
  bolt.
questions: []
params:
  hole_clearance:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Diametral clearance added to nominal bolt diameter for smooth slide fit
      (hole dia = 5.5 mm)
  spacer_od:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: Outer diameter of the spacer
  spacer_length:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: Overall length of the spacer between plates
  coupon_length:
    value: 5
    unit: mm
    kind: design
    source: design
    note: Height of the test coupon
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal outer diameter of standard M5 bolt
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    import cadquery as cq\n    hole_d = p.bolt_d + p.hole_clearance\n\
    \    return (\n        cq.Workplane(\"XY\")\n        .circle(p.spacer_od / 2.0)\n\
    \        .extrude(p.spacer_length)\n        .faces(\">Z\")\n        .hole(hole_d)\n\
    \    )\n"
  print_orientation: Bottom circular face flat on the build plate (z = 0)
  use_orientation: Positioned between the two plates with the M5 bolt passing through
    along the Z axis
- id: spacer_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    import cadquery as cq\n    hole_d = p.bolt_d + p.hole_clearance\n\
    \    return (\n        cq.Workplane(\"XY\")\n        .circle(p.spacer_od / 2.0)\n\
    \        .extrude(p.coupon_length)\n        .faces(\">Z\")\n        .hole(hole_d)\n\
    \    )\n"
  print_orientation: Bottom circular face flat on the build plate (z = 0)
  use_orientation: Quick test fit onto M5 bolt to verify clearance fit
hardware:
- id: m5_bolt
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: bolt_through_spacer
  fastener: m5_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 20.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: spacer
    feature: bore
    role: clearance
  nut: null
  external: plate
criteria:
- id: bore_clearance
  part: spacer
  feature: bore
  relation: clears
  hardware: m5_bolt
  clearance_mm: 0.5
  params:
  - bolt_d
  - hole_clearance
  check:
    method: coupon
    ref: spacer_coupon
    description: Test fit the M5 bolt through the coupon bore to verify smooth clearance
      fit before printing the full part.
- id: spacer_length_check
  part: spacer
  feature: length
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - spacer_length
  check:
    method: measure
    ref: null
    description: Measure overall length with calipers to confirm 20.0 mm.
- id: spacer_od_check
  part: spacer
  feature: outer_diameter
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - spacer_od
  check:
    method: measure
    ref: null
    description: Measure outer diameter with calipers to confirm 12.0 mm.
manual:
- n: '1'
  text: (Optional) Print the spacer_coupon to quickly test the M5 bolt fit. Verify
    that the M5 bolt slides smoothly through the bore without binding.
  parts:
  - spacer_coupon
  hardware:
  - m5_bolt
  tool: null
- n: '2'
  text: Print the spacer standing upright on its circular base (z=0 on the bed). No
    supports are required.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '3'
  text: Slide the spacer onto the M5 bolt between the two plates, then secure and
    tighten the bolt.
  parts:
  - spacer
  hardware:
  - m5_bolt
  tool: 4 mm hex key
