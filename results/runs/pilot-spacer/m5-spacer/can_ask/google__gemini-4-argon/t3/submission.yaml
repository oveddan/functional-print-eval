task: m5-spacer
note: A 12 mm OD, 20 mm long cylindrical spacer with a 5.5 mm clearance bore for an
  M5 bolt.
questions: []
params:
  hole_clearance:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Diametral clearance for 3D printed M5 through-hole (results in 5.5 mm bore)
  spacer_h:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: Requested spacer length
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal diameter of M5 screw
  spacer_od:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: Requested spacer outer diameter
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    bore_d = p.bolt_d + p.hole_clearance\n    return (\n \
    \       cq.Workplane(\"XY\")\n        .circle(p.spacer_od / 2.0)\n        .circle(bore_d\
    \ / 2.0)\n        .extrude(p.spacer_h)\n    )\n"
  print_orientation: Flat circular end on the bed (z = 0 to z = 20 mm), axis vertical
    along Z
  use_orientation: Coaxial with the M5 bolt between the two plates
hardware:
- id: bolt_m5
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: bolt_joint
  fastener: bolt_m5
  axis_origin:
  - 0.0
  - 0.0
  - 20.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: spacer
    feature: bore
    role: clearance
  nut: null
  external: null
criteria:
- id: m5_bolt_clearance
  part: spacer
  feature: bore
  relation: clears
  hardware: bolt_m5
  clearance_mm: 0.25
  params:
  - bolt_d
  - hole_clearance
  check:
    method: measure
    ref: null
    description: Check that the M5 bolt passes smoothly through the center hole of
      the spacer.
manual:
- n: '1'
  text: Slide the printed round spacer onto the M5 bolt between the two plates.
  parts:
  - spacer
  hardware:
  - bolt_m5
  tool: null
