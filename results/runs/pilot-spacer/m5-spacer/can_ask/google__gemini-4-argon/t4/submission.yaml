task: m5-spacer
note: Simple cylindrical spacer for an M5 bolt, printed upright on its flat end face
  (z = 0 to z = 20 mm).
questions: []
params:
  bore_clearance:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: Diametral clearance for M5 bolt in 3D printed vertical hole
  spacer_length:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: Requested spacer length between the two plates
  spacer_od:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: Requested outer diameter of the spacer
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal diameter of M5 screw from catalog
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    bore_d = p.bolt_d + p.bore_clearance\n    return (\n \
    \       cq.Workplane(\"XY\")\n        .circle(p.spacer_od / 2.0)\n        .circle(bore_d\
    \ / 2.0)\n        .extrude(p.spacer_length)\n    )\n"
  print_orientation: Flat circular bottom face on the build plate (z = 0), cylinder
    axis along +Z.
  use_orientation: Coaxial with the M5 bolt between the two plates.
hardware:
- id: m5_bolt
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: spacer_bolt_joint
  fastener: m5_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 20.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: spacer
    feature: center_bore
    role: clearance
  nut: null
  external: null
criteria:
- id: m5_bolt_clearance
  part: spacer
  feature: center_bore
  relation: clears
  hardware: m5_bolt
  clearance_mm: 0.2
  params:
  - bolt_d
  - bore_clearance
  check:
    method: measure
    ref: null
    description: Check that an M5 bolt passes smoothly through the center bore.
- id: spacer_length_check
  part: spacer
  feature: top_and_bottom_faces
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - spacer_length
  check:
    method: measure
    ref: null
    description: Verify the spacer length is 20 mm between the two plates.
manual:
- n: '1'
  text: Slide the printed spacer onto the M5 bolt between the two plates and tighten
    the assembly.
  parts:
  - spacer
  hardware:
  - m5_bolt
  tool: null
