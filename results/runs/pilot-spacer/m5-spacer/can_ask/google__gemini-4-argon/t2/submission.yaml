task: m5-spacer
note: Cylindrical M5 spacer, 12 mm OD x 20 mm length, with a 5.5 mm clearance bore
  (0.25 mm radial clearance on an M5 bolt).
questions: []
params:
  spacer_od:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: Requested outer diameter of the spacer
  spacer_length:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: Requested spacer length between the two plates
  m5_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal outer diameter of an ISO 4762 M5 bolt
  bolt_radial_clearance:
    value: 0.25
    unit: mm
    kind: design
    source: design
    note: Radial clearance for M5 bolt (gives 5.5 mm bore diameter, ISO 273 medium
      fit)
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    bore_d = p.m5_d + 2.0 * p.bolt_radial_clearance\n    return\
    \ (\n        cq.Workplane(\"XY\")\n        .circle(p.spacer_od / 2.0)\n      \
    \  .circle(bore_d / 2.0)\n        .extrude(p.spacer_length)\n    )\n"
  print_orientation: Flat circular end on the build plate (z = 0 to z = spacer_length),
    bore axis vertical along Z.
  use_orientation: Coaxial with the M5 bolt between the two plates.
hardware:
- id: m5_bolt
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: bolt_through_spacer
  fastener: m5_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 20.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: spacer
    feature: center_bore
    role: clearance
  nut: null
  external: null
criteria:
- id: m5_bolt_clearance
  part: spacer
  feature: center_bore
  relation: clears
  hardware: m5_bolt
  clearance_mm: 0.25
  params:
  - m5_d
  - bolt_radial_clearance
  check:
    method: measure
    ref: null
    description: Pass the M5 bolt through the center bore to confirm a smooth clearance
      fit.
- id: spacer_dimensions
  part: spacer
  feature: spacer_body
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - spacer_length
  - spacer_od
  check:
    method: measure
    ref: null
    description: Measure the spacer length (20 mm) and outer diameter (12 mm) with
      calipers.
manual:
- n: '1'
  text: Print the spacer standing upright with one flat circular face on the build
    plate (z = 0).
  parts:
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Slide the spacer onto the M5 bolt between the two plates and fasten the assembly.
  parts:
  - spacer
  hardware:
  - m5_bolt
  tool: 4 mm hex key
