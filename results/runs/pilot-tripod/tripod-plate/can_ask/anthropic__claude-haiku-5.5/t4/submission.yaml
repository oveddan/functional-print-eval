task: tripod-plate
note: ''
questions: []
params:
  plate_w:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: Width of the plate the friend's tripod clamp takes
  plate_l:
    value: 70
    unit: mm
    kind: design
    source: design
    note: Long enough to give a stable footprint on the clamp
  plate_t:
    value: 8
    unit: mm
    kind: design
    source: design
    note: Leaves about 2.8 mm of material above the head pocket for the shank hole
  corner_r:
    value: 3
    unit: mm
    kind: design
    source: design
    note: ''
  head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Salvaged webcam bolt head, approximate
  head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Salvaged webcam bolt head, approximate
  shank_under_head:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: 'Length under head, approximate. Short: gives roughly 7 mm of thread into
      the camera'
  pocket_clear:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Radial clearance around the head
  shank_clear_d:
    value: 6.5
    unit: mm
    kind: design
    source: design
    note: Clearance hole for the 1/4-20 shank
  camera_thread:
    value: 0.25
    unit: mm
    kind: world
    source: asked
    note: 1/4-20 camera socket, from the person
parts:
- id: plate
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    plate = (cq.Workplane('XY')\n             .box(p.plate_l,\
    \ p.plate_w, p.plate_t, centered=(True, True, False))\n             .edges('|Z').fillet(p.corner_r))\n\
    \    pocket = (cq.Workplane('XY')\n              .circle((p.head_d + p.pocket_clear)\
    \ / 2)\n              .extrude(p.head_h + 0.2))\n    shank = (cq.Workplane('XY')\n\
    \             .circle(p.shank_clear_d / 2)\n             .extrude(p.plate_t))\n\
    \    return plate.cut(pocket).cut(shank)"
  print_orientation: bottom face on the bed
  use_orientation: bottom face down on the tripod clamp, camera on top
hardware:
- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_bolt
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: pocket
    role: head_seat
  - part: plate
    feature: shank hole
    role: clearance
  nut: null
  external: null
criteria:
- id: head_pocket
  part: plate
  feature: head pocket, 16 mm diameter x 5.2 mm deep, open to the bottom
  relation: seats
  hardware: bolt
  clearance_mm: 1.0
  params:
  - head_d
  - head_h
  - pocket_clear
  check:
    method: measure
    ref: null
    description: Test-fit the salvaged bolt head in the printed pocket; it should
      sit flush and not wobble
- id: shank_hole
  part: plate
  feature: 6.5 mm through hole for the 1/4-20 shank
  relation: clears
  hardware: bolt
  clearance_mm: 0.15
  params:
  - shank_clear_d
  check:
    method: measure
    ref: null
    description: Shank passes freely through the hole
- id: clamp_width
  part: plate
  feature: 38 mm wide body for the tripod clamp
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - plate_w
  check:
    method: measure
    ref: null
    description: Measure printed plate width and compare to 38 mm
manual:
- n: '1'
  text: Print the plate flat, bottom face on the bed, PLA, 0.2 mm layers. No supports
    needed.
  parts:
  - plate
  hardware: []
  tool: null
- n: '2'
  text: 'Check the head pocket: the salvaged bolt head should sit in it with its flat
    face flush with the plate bottom. If it is tight, file the pocket a little. The
    head should not wobble.'
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '3'
  text: Drop the bolt head-first into the pocket from the bottom so the shank runs
    up through the plate. Dab a small amount of epoxy or glue around the head so it
    can't turn in the pocket.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '4'
  text: Let the epoxy cure fully before use.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '5'
  text: Screw the camera onto the protruding shank by hand. The shank should bite
    about 7 mm into the camera socket. Do not overtighten.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '6'
  text: Clamp the plate in the friend's tripod clamp. Use only with a light camera;
    keep the load low.
  parts: []
  hardware: []
  tool: null
