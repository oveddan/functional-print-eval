task: tripod-plate
note: Rough temporary stand-in only. Key values (plate length, thickness, stud, socket
  depth) were not measured and are guessed. The salvaged bolt is only about 10 mm
  long under the head, which may not give enough thread engagement in the camera.
  Do not use with a heavy camera.
questions:
- text: Please confirm the plate length and thickness, the stud diameter and thread
    length, and the camera socket depth. Plate length, thickness and the bolt's usable
    length above the plate are all guessed, and the plate may not fit the tripod head
    as designed.
  answer: unresolved
- text: Is the camera light (compact or mirrorless)? PLA is brittle and creeps under
    load, so this is only safe for light cameras.
  answer: null
params:
  plate_w:
    value: 38
    unit: mm
    kind: world
    source: asked
    note: width of the tripod's clamp plate, as reported
  plate_l:
    value: 60
    unit: mm
    kind: design
    source: guessed
    note: NOT measured; placeholder, check against the real plate
  plate_t:
    value: 6
    unit: mm
    kind: design
    source: guessed
    note: NOT measured; placeholder
  head_d:
    value: 15
    unit: mm
    kind: hardware
    source: asked
    note: salvaged webcam bolt head diameter, approximate
  head_h:
    value: 5
    unit: mm
    kind: hardware
    source: asked
    note: salvaged webcam bolt head height, approximate
  shank_d:
    value: 6.6
    unit: mm
    kind: design
    source: design
    note: clearance hole for 1/4-20 shank
parts:
- id: plate
  role: final
  material: PLA high-speed black
  code: "def build(p):\n    plate = cq.Workplane('XY').box(p.plate_l, p.plate_w, p.plate_t).translate((0,\
    \ 0, p.plate_t / 2))\n    hole = cq.Workplane('XY').circle(p.shank_d / 2).extrude(p.plate_t\
    \ + 2).translate((0, 0, -1))\n    pocket = cq.Workplane('XY').circle(p.head_d\
    \ / 2 + 0.3).extrude(p.head_h + 0.3).translate((0, 0, -1))\n    return plate.cut(hole).cut(pocket)\n"
  print_orientation: flat, bottom on bed
  use_orientation: flat, plate on tripod head with the bolt head in the underside
    pocket
hardware:
- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints: []
criteria:
- id: bolt_head
  part: plate
  feature: underside pocket
  relation: seats
  hardware: bolt
  clearance_mm: null
  params:
  - head_d
  - head_h
  - shank_d
  check:
    method: measure
    ref: null
    description: Confirm the bolt head sits flush in the pocket and the shank passes
      through the hole
manual:
- n: '1'
  text: Print the plate flat, bottom on the bed. Check the bolt head fits the underside
    pocket before printing the full plate by test-fitting a scrap piece if you have
    one.
  parts:
  - plate
  hardware: []
  tool: null
- n: '2'
  text: Push the salvaged 1/4-20 bolt up through the plate from underneath so the
    head sits in the pocket.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '3'
  text: Screw the camera onto the bolt tip above the plate. Only do this with a camera
    that is light; PLA can crack under weight.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
