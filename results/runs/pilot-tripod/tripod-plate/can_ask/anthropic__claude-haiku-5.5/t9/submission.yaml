task: tripod-plate
note: ''
questions:
- text: Plate length of 60 mm is a guess. Does the clamp grip it?
  answer: null
- text: Jaw lip gap and overlap depth were not measured; the plate edge profile may
    need changing.
  answer: null
params:
  plate_w:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: width the tripod clamp takes
  plate_l:
    value: 60
    unit: mm
    kind: design
    source: guessed
    note: unverified; jaw lip profile not measured, so clamp grip is not confirmed
  plate_t:
    value: 8
    unit: mm
    kind: design
    source: design
    note: PLA, print flat
  head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam bolt head, approximate
  head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam bolt head, approximate
  shank_len:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: under head; short, so only about 7 mm of thread protrudes from the plate
      into the camera
  hole_d:
    value: 6.8
    unit: mm
    kind: design
    source: design
    note: clearance for the 1/4-20 shank
  pocket_clr:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: clearance around the head
parts:
- id: plate
  role: final
  material: PLA (black)
  code: "def build(p):\n    plate = cq.Workplane('XY').center(0, 0).rect(p.plate_w,\
    \ p.plate_l).extrude(p.plate_t)\n    pocket = cq.Workplane('XY').circle(p.head_d\
    \ / 2 + p.pocket_clr).extrude(p.head_h + p.pocket_clr)\n    hole = cq.Workplane('XY').circle(p.hole_d\
    \ / 2).extrude(p.plate_t)\n    return plate.cut(pocket).cut(hole)\n"
  print_orientation: flat, bottom face on bed (pocket opens downward)
  use_orientation: plate lies flat on the tripod clamp; bolt head sits in the underside
    pocket and the shank rises up into the camera
hardware:
- id: webcam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_stud
  fastener: webcam_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: head pocket
    role: head_seat
  nut: null
  external: null
criteria:
- id: head_pocket
  part: plate
  feature: underside pocket for webcam bolt head
  relation: seats
  hardware: webcam_bolt
  clearance_mm: null
  params:
  - head_d
  - head_h
  - pocket_clr
  check:
    method: measure
    ref: null
    description: Confirm the pocket fits the bolt head with clearance
- id: clamp_grip
  part: plate
  feature: plate edges in tripod clamp
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - plate_w
  - plate_l
  check:
    method: measure
    ref: null
    description: Confirm the 38 mm plate sits securely in the clamp jaws without slipping.
      Jaw lip profile still unmeasured.
manual:
- n: '1'
  text: Print the plate flat, bottom face on the bed. Remove supports if any.
  parts:
  - plate
  hardware: []
  tool: null
- n: '2'
  text: Push the webcam bolt up through the centre hole from below so its head sits
    in the underside pocket.
  parts:
  - plate
  hardware:
  - webcam_bolt
  tool: null
- n: '3'
  text: Thread the bolt's exposed shank into the camera's 1/4-20 socket by hand until
    snug. Do not overtighten.
  parts: []
  hardware:
  - webcam_bolt
  tool: null
- n: '4'
  text: Slide the plate into the tripod clamp and check it does not slip before mounting
    the camera.
  parts: []
  hardware: []
  tool: null
