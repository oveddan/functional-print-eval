task: tripod-plate
note: 'UNLOADED FIT TEST ONLY—not a usable camera quick-release plate. A temporary
  printed plate may be possible, but 38 mm width and angled knob-tightened jaws do
  not establish a compatible dovetail profile. This coupon deliberately has no camera
  screw hole. No printed camera screw is supplied: use a suitable metal 1/4-20 screw
  only after establishing safe engagement and plate geometry. Approximate webcam-bolt
  measurements are insufficient to establish camera compatibility. PLA also creeps
  under sustained clamp load and softens in heat; no load rating is established.'
questions:
- text: What are the actual clamp jaw profile, contact height, and opening widths
    at top and bottom at one knob setting?
  answer: null
- text: What are the camera's permitted screw insertion depth and minimum engagement,
    and is the salvaged bolt fully threaded and accessible for tightening?
  answer: null
- text: What are the camera/lens mass, camera base footprint, and tripod/head model?
  answer: null
params:
  plate_nominal_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: User reports width of plate the clamp accepts; not a measured dovetail cross-section.
  coupon_length:
    value: 24
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_base_band:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Provisional vertical band at widest bottom edge.
  coupon_slope_height:
    value: 4
    unit: mm
    kind: design
    source: design
    note: Unverified trial profile, not measured from the tripod.
  coupon_side_inset:
    value: 4
    unit: mm
    kind: design
    source: design
    note: 'Each side narrows by 4 mm over 4 mm height: provisional 45-degree flank.'
  coupon_top_height:
