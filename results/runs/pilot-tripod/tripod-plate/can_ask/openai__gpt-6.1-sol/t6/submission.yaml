parts:
- id: unloaded_profile_coupon
  role: coupon
  material: Black high-speed PLA
  code: "def build(p):\n    w = p.plate_nominal_width\n    b = p.coupon_base_band\n\
    \    h = p.coupon_slope_height\n    s = p.coupon_side_inset\n    t = p.coupon_top_height\n\
    \    outline = [(-w/2, 0), (w/2, 0), (w/2, b), (w/2-s, b+h), (w/2-s, b+h+t), (-w/2+s,\
    \ b+h+t), (-w/2+s, b+h), (-w/2, b)]\n    return cq.Workplane('XZ').polyline(outline).close().extrude(p.coupon_length).translate((0,\
    \ p.coupon_length/2, 0))"
  print_orientation: Broad 38 mm-wide flat bottom on the bed at z=0; length along
    Y. No supports needed.
  use_orientation: 'Unloaded trial only: broad bottom down in the clamp, sloped sides
    facing the opposing jaws, Y along the clamp rails. Never attach a camera.'
hardware: []
joints: []
criteria:
- id: jaw_profile_trial
  part: unloaded_profile_coupon
  feature: Two provisional sloped X-side faces
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - plate_nominal_width
  - coupon_base_band
  - coupon_slope_height
  - coupon_side_inset
  - actual_jaw_contact_height
  - actual_jaw_top_opening
  - actual_jaw_bottom_opening
  check:
    method: coupon
    ref: unloaded_profile_coupon
    description: With no camera and tripod near the floor, check that the coupon drops
      into the fully opened jaws and is positively captured by both lips when lightly
      tightened. Check for rocking, edge-only contact, bottoming out, and upward escape.
      A successful fit does not establish load capacity or validate the full camera
      plate.
manual:
- n: '1'
  text: Print unloaded_profile_coupon at 0.2 mm layers with 5 walls and solid infill.
    Keep the broad bottom on the bed. Remove any brim and bottom-edge flare without
    altering the sloped contact faces.
  parts:
  - unloaded_profile_coupon
  hardware: []
  tool: null
- n: '2'
  text: Remove the camera from the tripod area. Open the jaws, place the coupon broad
    face down with its length along the rails, and lightly close the knob. Do not
    force the jaws or use the knob to deform the print.
  parts:
  - unloaded_profile_coupon
  hardware: []
  tool: null
- n: '3'
  text: Holding the coupon by hand, inspect engagement of both lips. Check for rocking
    and gentle upward escape. Stop if the jaws contact only corners, the coupon bottoms
    out before capture, or the knob reaches its stop. Do not use this part to support
    equipment even if it seems secure.
  parts:
  - unloaded_profile_coupon
  hardware: []
  tool: null
- n: '4'
  text: Before making a camera-ready plate, obtain the actual jaw cross-section and
    usable rail length, camera-base footprint, camera/lens mass, and the camera manufacturer's
    permitted screw insertion and engagement. Verify the salvaged bolt's exact length,
    threaded portion, and head/tool access separately. Do not determine socket depth
    by tightening a bolt until it bottoms.
  parts: []
  hardware: []
  tool: null
- n: '5'
  text: No camera attachment or printed screw is included in this handoff. A finished
    plate needs a correctly sized metal 1/4-20 screw and a verified thickness/recess
    stack that prevents both bottoming and insufficient engagement. Do not improvise
    by forcing the salvaged bolt into the camera.
  parts: []
  hardware: []
  tool: null
