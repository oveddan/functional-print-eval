task: tripod-plate
note: 'UNLOADED FIT TEST ONLY—not a finished camera-supporting replacement. A 38 mm
  width and angled jaws do not uniquely identify the clamp profile. Jaw dimensions
  and camera socket usable depth were requested but not supplied. No printed camera
  screw is provided: reuse a verified metal 1/4-20 screw only after its fit, drive
  access, and safe engagement are established. This coupon explores a guessed 45-degree
  jaw profile; a successful fit alone does not validate load capacity, resistance
  to pull-out, camera screw engagement, or PLA creep. Do not attach a camera to this
  coupon. The raised central deck clears a hypothetical jaw profile, not a measured
  one.'
questions:
- text: What are the jaw gripping height, upper-lip gap, usable jaw length, and retaining-stop
    arrangement?
  answer: null
- text: What is the camera socket's usable threaded depth, and does the salvaged bolt
    thread into it freely by hand?
  answer: null
- text: What drive or grip does the salvaged bolt head have, and is it accessible
    in a recessed pocket?
  answer: null
params:
  plate_nominal_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: Reported width of plate accepted by clamp, not a full jaw profile measurement.
  camera_thread_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal major diameter of 1/4-20 thread; camera thread identified by user.
  camera_thread_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Approximate head across; shape and bearing face not confirmed.
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Approximate.
  bolt_underhead_length:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: Approximate; verify before any later camera use.
  jaw_height:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: ''
  jaw_top_gap:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: ''
  jaw_length:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: ''
  camera_socket_depth:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: ''
  coupon_length:
    value: 60
    unit: mm
    kind: design
    source: design
    note: ''
  base_width_allowance:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: Total undersize relative to reported width, not per side.
  trial_dovetail_height:
    value: 4
    unit: mm
    kind: design
    source: design
    note: Unvalidated trial geometry, not measured jaw height.
  trial_side_inset:
    value: 4
    unit: mm
    kind: design
    source: design
    note: Per side; produces 45-degree slopes. Not a confirmed clamp profile.
  coupon_total_height:
    value: 12
    unit: mm
    kind: design
    source: design
    note: ''
  bolt_hole_diametral_clearance:
    value: 0.45
    unit: mm
    kind: design
    source: design
    note: ''
  head_pocket_diametral_clearance:
    value: 5
    unit: mm
    kind: design
    source: design
    note: Larger access pocket; drive accessibility still needs verification.
  head_pocket_depth:
    value: 5
    unit: mm
    kind: design
    source: design
    note: Leaves a 7 mm bearing stack; nominal bolt projection is 10 - 7 = 3 mm, not
      approved camera engagement.
parts:
- id: unloaded_plate_coupon
  role: coupon
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    w = p.plate_nominal_width - p.base_width_allowance\n \
    \   t = w - 2*p.trial_side_inset\n    h = p.trial_dovetail_height\n    H = p.coupon_total_height\n\
    \    L = p.coupon_length\n    # XZ profile extruded equally in +/-Y; bottom face\
    \ stays at z=0.\n    profile = [(-w/2,0),(w/2,0),(t/2,h),(t/2,H),(-t/2,H),(-t/2,h)]\n\
    \    body = cq.Workplane('XZ').polyline(profile).close().extrude(L/2, both=True)\n\
    \    bore = cq.Workplane('XY').circle((p.camera_thread_d+p.bolt_hole_diametral_clearance)/2).extrude(H)\n\
    \    pocket = cq.Workplane('XY').circle((p.bolt_head_d+p.head_pocket_diametral_clearance)/2).extrude(p.head_pocket_depth)\n\
    \    return body.cut(bore).cut(pocket)\n"
  print_orientation: Broad 37.8 x 60 mm dovetail bottom on bed at z=0. Pocket opens
    toward bed. Its 20 mm roof bridge is below the reported 50 mm clean bridge limit.
  use_orientation: 'Unloaded testing only: broad bottom down in clamp, long Y direction
    along the jaws, narrow raised deck upward.'
hardware:
- id: camera_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints: []
criteria:
- id: trial_jaw_fit
  part: unloaded_plate_coupon
  feature: Two inclined outer faces, nominal 37.8 mm bottom width and 29.8 mm upper
    width
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - plate_nominal_width
  - base_width_allowance
  - trial_dovetail_height
  - trial_side_inset
  - jaw_height
  - jaw_top_gap
  - jaw_length
  check:
    method: coupon
    ref: unloaded_plate_coupon
    description: With no camera or bolt installed, check drop-in access, full jaw-face
      contact, no bottoming or top-deck interference, and remaining clamp adjustment.
      Unknown geometry means this test may fail. A fit is not proof of safe retention.
- id: bolt_clearance
  part: unloaded_plate_coupon
  feature: Central 6.8 mm through bore
  relation: clears
  hardware: camera_bolt
  clearance_mm: 0.45
  params:
  - camera_thread_d
  - bolt_hole_diametral_clearance
  check:
    method: coupon
    ref: unloaded_plate_coupon
    description: Off the tripod and away from the camera, verify bolt passes freely
      without threading into PLA.
- id: bolt_head_fit
  part: unloaded_plate_coupon
  feature: 20 mm diameter bottom pocket, 5 mm deep
  relation: contains
  hardware: camera_bolt
  clearance_mm: null
  params:
  - bolt_head_d
  - bolt_head_h
  - head_pocket_diametral_clearance
  - head_pocket_depth
  check:
    method: coupon
    ref: unloaded_plate_coupon
    description: On bench only, verify head fits, has a flat bearing contact, is accessible
      with its intended driver, and does not protrude below bottom. Unknown head shape
      may invalidate this design.
- id: projection_check
  part: unloaded_plate_coupon
  feature: Bolt tip above upper deck
  relation: supports
  hardware: camera_bolt
  clearance_mm: null
  params:
  - bolt_underhead_length
  - coupon_total_height
  - head_pocket_depth
  - camera_socket_depth
  check:
    method: measure
    ref: null
    description: 'Bench-measure actual tip projection, nominally 3 mm. Camera socket
      depth and required thread engagement remain unknown: do not install in camera.
      This criterion is unresolved, not a passed support check.'
manual:
- n: '1'
  text: This is a dimensional test coupon only. Keep the camera off the tripod throughout.
    Do not print a plastic 1/4-20 screw or use this coupon to hold the camera.
  parts:
  - unloaded_plate_coupon
  hardware: []
  tool: null
- n: '2'
  text: Print at 0.2 mm layers, with 5 walls and 50% infill. Use the stated bed orientation;
    no supports inside the bottom pocket. The pocket roof bridges about 20 mm. Remove
    bridging strands and any elephant-foot lip before checking dimensions.
  parts:
  - unloaded_plate_coupon
  hardware: []
  tool: Slicer and deburring tool
- n: '3'
  text: With the tripod unloaded, open the jaws and gently drop in the coupon. Tighten
    by hand only. Stop if it rocks, binds, contacts only edges, bottoms before clamping,
    or requires force. Do not modify the borrowed tripod or overtighten its knob.
  parts:
  - unloaded_plate_coupon
  hardware: []
  tool: null
- n: '4'
  text: Still unloaded, check whether both sloping faces engage over the full jaw
    length and whether the raised deck clears the jaws. With hands ready to catch
    the coupon, gently check for lifting and sliding. No camera, ballast, or load
    test. Remove the coupon afterward. Passing this check does not establish safe
    use.
  parts:
  - unloaded_plate_coupon
  hardware: []
  tool: null
- n: '5'
  text: On the bench, pass the webcam bolt up through the bottom pocket. Check free
    shank clearance, flat head seating and original-drive access. Measure actual projection
    above the deck and record it; nominal is 3 mm. Do not thread it into the camera
    for this test. If its head is not flat or accessible, this geometry needs revision.
  parts:
  - unloaded_plate_coupon
  hardware:
  - camera_bolt
  tool: Calipers; original bolt driver if applicable
- n: '6'
  text: Before a final design, obtain the missing jaw measurements, stop geometry,
    bolt-drive details, confirmed thread fit, and usable camera socket depth. A replacement
    metal quick-release plate matched to the tripod is the safer temporary solution.
    This coupon is not approved for photography, unattended use, heavy equipment,
    warm locations, or elevated loads.
  parts:
  - unloaded_plate_coupon
  hardware: []
  tool: null
