task: tripod-plate
note: Incomplete fit investigation—not a camera-supporting replacement. Only an unloaded
  width/screw-clearance coupon is supplied. A 38 mm width does not establish a dovetail
  standard, retaining angle, depth, end stops, or latch compatibility. Do not attach
  the camera to this coupon or treat a successful width check as proof of retention.
  A metal 1/4-20 screw is required for any future functional plate; no printed screw
  is supplied. Final load-bearing design is withheld until the clamp profile and usable
  camera thread depth are established.
questions:
- text: What plate width does the tripod take?
  answer: 38 mm, reported by user; width datum/profile unspecified.
- text: What is the clamp brand/model, retaining profile, narrow opening and lip height?
  answer: null
- text: What is the camera socket thread?
  answer: 1/4-20.
- text: What is the usable camera socket depth, camera model and mass?
  answer: null
- text: What are the salvaged bolt dimensions?
  answer: Approximately 15 mm across the head, 5 mm head height, 10 mm under-head
    length; drive type not established.
params:
  plate_reported_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: User reports plate width accepted by tripod. Not a measured complete retaining
      profile.
  clamp_lip_height:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: ''
  clamp_narrow_opening:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: ''
  camera_socket_usable_depth:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: ''
  camera_thread_major_d:
    value: 6.35
    unit: mm
    kind: world
    source: datasheet
    note: Nominal major diameter of the user-confirmed 1/4-20 socket.
  camera_thread_pitch:
    value: 1.27
    unit: mm
    kind: world
    source: catalog
    note: ''
  bolt_head_across:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Approximate; head shape not established.
  bolt_head_height:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Approximate.
  bolt_underhead_length:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: Approximate; do not infer a safe camera engagement from this.
  coupon_length:
    value: 30
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_thickness:
    value: 3
    unit: mm
    kind: design
    source: design
    note: ''
  screw_diametral_clearance:
    value: 0.45
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: width_and_hole_coupon
  role: coupon
  material: Black PLA
  code: "def build(p):\n    body = cq.Workplane('XY').box(p.plate_reported_width,\
    \ p.coupon_length, p.coupon_thickness, centered=(True, True, False))\n    return\
    \ body.faces('>Z').workplane().hole(p.camera_thread_major_d + p.screw_diametral_clearance)\n"
  print_orientation: Broad rectangular face on the bed at z=0; hole vertical. No supports.
  use_orientation: Unloaded gauge only. The 38 mm dimension is across X; rectangular
    edges intentionally do not imitate a dovetail.
hardware:
- id: metal_camera_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints: []
criteria:
- id: width_check
  part: width_and_hole_coupon
  feature: 38 mm X width, rectangular profile
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - plate_reported_width
  - coupon_thickness
  check:
    method: coupon
    ref: width_and_hole_coupon
    description: With no camera present, compare width to the clamp only where accessible
      without force. Jaw lips may prevent insertion because this is not a dovetail.
      Record where it touches; do not force, latch or infer secure capture.
- id: bolt_clearance_check
  part: width_and_hole_coupon
  feature: Central through hole
  relation: clears
  hardware: metal_camera_bolt
  clearance_mm: 0.45
  params:
  - camera_thread_major_d
  - screw_diametral_clearance
  check:
    method: coupon
    ref: width_and_hole_coupon
    description: Away from the camera, check that the metal bolt passes freely through
      the printed hole. Diametral clearance is nominal; successful passage does not
      validate camera engagement or head seating.
manual:
- n: '1'
  text: Print width_and_hole_coupon broad face down at 0.2 mm layers, with three walls
    and five top/bottom layers. No supports are needed.
  parts:
  - width_and_hole_coupon
  hardware: []
  tool: 3D printer
- n: '2'
  text: 'With the coupon away from the camera, pass metal_camera_bolt through its
    hole by hand. Do not screw the bolt into the camera through this coupon: the remaining
    protrusion has not been checked against socket depth.'
  parts:
  - width_and_hole_coupon
  hardware:
  - metal_camera_bolt
  tool: null
- n: '3'
  text: Remove the bolt. With no camera on the tripod, compare the coupon's 38 mm
    width to the clamp. Do not force it under the lips or use it as a locking plate.
    This coupon has no retaining features.
  parts:
  - width_and_hole_coupon
  hardware: []
  tool: null
- n: '4'
  text: Before making a functional plate, obtain the head's model or complete retaining
    profile, including lip gap, lip height, dovetail angle and stop/latch geometry.
    Establish camera socket usable depth and camera load. If these cannot be established,
    obtain the manufacturer's compatible replacement plate rather than mounting a
    camera on an unverified print.
  parts: []
  hardware: []
  tool: null
- n: '5'
  text: Do not print a camera mounting screw. For a future validated plate, use a
    metal screw with verified engagement and bottoming clearance. The available approximately
    10 mm bolt may require a different plate thickness or may be unsuitable. This
    submission contains no part approved to support the camera.
  parts: []
  hardware:
  - metal_camera_bolt
  tool: null
