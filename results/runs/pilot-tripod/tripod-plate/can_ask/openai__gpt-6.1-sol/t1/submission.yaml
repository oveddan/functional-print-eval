task: tripod-plate
note: Measurement-stage design ONLY, not a usable camera mount. Critical clamp dimensions
  and camera socket depth were not supplied, so no load-bearing plate or printed screw
  is provided. A temporary PLA plate may be feasible after measuring the specific
  clamp and testing retention. Use the available METAL webcam bolt, never a printed
  PLA screw. The included coupon checks bolt clearance only.
questions:
- text: Clamp gap at lip tips and at floor, with knob at same position; floor-to-lip
    height; usable jaw length; any pins, steps or end stops?
  answer: null
- text: Camera socket usable depth, camera model and camera-plus-lens weight?
  answer: null
- text: Accurately remeasured bolt under-head length, head height, maximum head width
    and any unthreaded shoulder?
  answer: 'Only approximate measurements supplied: 10 mm under-head length, 5 mm head
    height, 15 mm head width.'
params:
  bolt_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bolt_length:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bore_diametral_clearance:
    value: 0.45
    unit: mm
    kind: design
    source: design
    note: ''
  head_diametral_clearance:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: ''
  head_depth_clearance:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_width:
    value: 26
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_height:
    value: 8
    unit: mm
    kind: design
    source: design
    note: ''
  minimum_roof:
    value: 2
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: bolt_head_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    pocket=p.bolt_head_h+p.head_depth_clearance\n    if p.coupon_height-pocket<p.minimum_roof:\n\
    \        raise ValueError('Increase coupon height for adequate roof thickness')\n\
    \    body=cq.Workplane('XY').box(p.coupon_width,p.coupon_width,p.coupon_height,centered=(True,True,False))\n\
    \    head=cq.Workplane('XY').circle((p.bolt_head_d+p.head_diametral_clearance)/2).extrude(pocket)\n\
    \    bore=cq.Workplane('XY').circle((p.bolt_d+p.bore_diametral_clearance)/2).extrude(p.coupon_height)\n\
    \    return body.cut(head).cut(bore)"
  print_orientation: Broad underside at z=0, head recess opening toward bed. Approximately
    16 mm recess roof bridge; no internal supports.
  use_orientation: Bench-only bolt clearance gauge. Never attach to camera or tripod.
hardware:
- id: camera_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints: []
criteria:
- id: head_clearance
  part: bolt_head_coupon
  feature: Circular underside recess
  relation: clears
  hardware: camera_bolt
  clearance_mm: 0.4
  params:
  - bolt_head_d
  - bolt_head_h
  - head_diametral_clearance
  - head_depth_clearance
  check:
    method: coupon
    ref: bolt_head_coupon
    description: Head enters freely, seats flat against roof without rocking, and
      remains accessible for tightening. Report a noncircular head or inaccessible
      grip.
- id: shank_clearance
  part: bolt_head_coupon
  feature: Central bore
  relation: clears
  hardware: camera_bolt
  clearance_mm: 0.225
  params:
  - bolt_d
  - bore_diametral_clearance
  check:
    method: coupon
    ref: bolt_head_coupon
    description: Threaded shank and any shoulder slide freely. Do not force or screw
      the metal thread into the plastic.
manual:
- n: '1'
  text: This is not a completed camera mount. Do not use the coupon as a plate, and
    do not print a camera screw. A guessed dovetail can release unexpectedly.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print bolt_head_coupon in PLA, 0.2 mm layers, 5 walls, 100% infill. Put broad
    underside on bed and leave recess unsupported. Inspect bridge roof.
  parts:
  - bolt_head_coupon
  hardware: []
  tool: null
- n: '3'
  text: Off-camera, insert camera_bolt through the underside recess. Check head/shank
    fit and tightening access. Remeasure under-head length, maximum head width, head
    height and any unthreaded shoulder. The supplied dimensions are approximate. This
    coupon tests clearance, not load capacity or safe screw projection.
  parts:
  - bolt_head_coupon
  hardware:
  - camera_bolt
  tool: null
- n: '4'
  text: Measure clamp gaps at lip tips and at floor with knob at the same position,
    floor-to-lip height and usable length along jaws. Record pins, steps, stops and
    jaw symmetry. An exact tripod/head model or photo would also help.
  parts: []
  hardware: []
  tool: null
- n: '5'
  text: 'Measure usable camera socket depth gently with a nonmetal probe; never force
    it. Record camera model and total camera/lens weight. Do not insert the approximately
    10 mm metal bolt directly into the camera: it may bottom out and cause damage.'
  parts: []
  hardware:
  - camera_bolt
  tool: null
- n: '6'
  text: A future plate must match those measurements, pass unloaded clamp-retention
    checks and recess the metal bolt to achieve adequate thread engagement without
    bottoming out. Keep any temporary PLA mount low, supervised, independently tethered
    and away from heat; never use overhead. Until a fitted plate is available, obtain
    the correct replacement rather than using a guessed plate.
  parts: []
  hardware: []
  tool: null
