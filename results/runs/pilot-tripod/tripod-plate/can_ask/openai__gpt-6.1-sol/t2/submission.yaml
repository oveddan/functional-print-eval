task: tripod-plate
note: The flat quick-release plate is usually straightforward to print once its precise
  locking profile is known. Use a metal camera screw, not a printed one. The webcam
  bolt may work after checking its fit and insertion depth. Actual clamp dimensions
  and camera socket depth were not obtained, so this is ONLY an unloaded fit coupon,
  not a usable camera plate. Default dimensions are arbitrary examples, not an identified
  tripod standard. It has no camera mounting hole. For immediate use, obtain the correct
  plate for the tripod head.
questions:
- text: What are the actual clamp bottom width, top width, lip height, usable length,
    adjustment range and safety-stop geometry?
  answer: null
- text: What is the camera socket usable depth and does the webcam bolt fit smoothly?
  answer: Socket identified as 1/4-20; depth and bolt fit not established.
- text: What is the camera/lens weight and balance?
  answer: null
params:
  gauge_bottom_width:
    value: 40
    unit: mm
    kind: world
    source: guessed
    note: ''
  gauge_top_width:
    value: 34
    unit: mm
    kind: world
    source: guessed
    note: ''
  gauge_height:
    value: 6
    unit: mm
    kind: world
    source: guessed
    note: ''
  gauge_length:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
  grip_width:
    value: 12
    unit: mm
    kind: design
    source: design
    note: ''
  grip_length:
    value: 12
    unit: mm
    kind: design
    source: design
    note: ''
  grip_height:
    value: 12
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: unloaded_profile_coupon
  role: coupon
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    if not (p.gauge_bottom_width > p.gauge_top_width > p.grip_width\
    \ > 0):\n        raise ValueError('Require bottom width > top width > grip width\
    \ > 0')\n    if not (p.gauge_length > p.grip_length > 0 and p.gauge_height > 0\
    \ and p.grip_height > 0):\n        raise ValueError('Invalid dimensions')\n  \
    \  wedge = (cq.Workplane('XY').rect(p.gauge_bottom_width, p.gauge_length)\n  \
    \      .workplane(offset=p.gauge_height).rect(p.gauge_top_width, p.gauge_length)\n\
    \        .loft(combine=True, ruled=True))\n    grip = (cq.Workplane('XY').workplane(offset=p.gauge_height)\n\
    \        .rect(p.grip_width, p.grip_length).extrude(p.grip_height))\n    return\
    \ wedge.union(grip)\n"
  print_orientation: Wide base at z=0 on bed; grip upward. No supports.
  use_orientation: Unloaded clamp fit checking only; wide face toward pocket floor
    and grip upward. Never attach a camera.
hardware: []
joints: []
criteria:
- id: profile_trial
  part: unloaded_profile_coupon
  feature: Tapered sides and flat bottom
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - gauge_bottom_width
  - gauge_top_width
  - gauge_height
  - gauge_length
  check:
    method: coupon
    ref: unloaded_profile_coupon
    description: Only attempt if visually compatible. Must enter without force and
      seat without rocking while leaving normal jaw adjustment. Check contact, gaps
      and lift-out. A snug short coupon does not qualify a full plate or establish
      load capacity.
manual:
- n: '1'
  text: Do not attach the camera. Measure the actual clamp first if possible. The
    default 40 mm bottom width, 34 mm top width and 6 mm height are arbitrary example
    dimensions, not a recommended replacement profile.
  parts:
  - unloaded_profile_coupon
  hardware: []
  tool: null
- n: '2'
  text: Print wide face down in PLA with 0.2 mm layers, four walls, 30% infill and
    no supports. Remove any brim or bottom-edge flare without altering the intended
    taper.
  parts:
  - unloaded_profile_coupon
  hardware: []
  tool: Bambu Lab X1C
- n: '3'
  text: With the tripod empty and stable, open the clamp and compare before insertion.
    Do not force the coupon, defeat a safety stop or overtighten against PLA. Stop
    if visibly mismatched.
  parts:
  - unloaded_profile_coupon
  hardware: []
  tool: null
- n: '4'
  text: If it enters freely, lightly close the jaws. Check floor and taper contact,
    rocking and lift-out. Record actual dimensions and adjustment range. Loosen and
    remove by the grip. This checks only a short profile, not full plate retention
    or load capacity.
  parts:
  - unloaded_profile_coupon
  hardware: []
  tool: null
- n: '5'
  text: Before designing a real replacement, obtain full clamp and safety-stop dimensions,
    camera/lens load and socket depth. Measure the metal bolt accurately. In a future
    plate, bolt protrusion equals under-head length minus thickness between the head
    seating surface and camera underside. Provide adequate thread engagement without
    bottoming out. Do not tighten an uncertain-length bolt into the camera.
  parts: []
  hardware: []
  tool: null
- n: '6'
  text: Use the correct original or compatible commercial plate until a replacement
    is properly designed and verified. Any future PLA replacement should be temporary
    and supervised, protected from heat and impacts, and never used over people or
    left unattended. This coupon must never support a camera.
  parts: []
  hardware: []
  tool: null
