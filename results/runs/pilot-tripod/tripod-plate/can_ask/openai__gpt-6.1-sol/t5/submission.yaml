task: tripod-plate
note: 'Printing the flat plate is feasible in principle; do not print the camera screw.
  Use the salvaged metal 1/4-20 bolt only after its fit is verified. This submission
  is an UNLOADED fit-test plate, not a camera-ready replacement: 38 mm and angled
  jaws do not establish a compatible dovetail. The assumed 45-degree profile must
  be checked, and camera socket depth and load remain unknown. Do not attach a camera
  to this print. Borrow or buy the head manufacturer''s correct plate if those checks
  cannot be completed. PLA is vulnerable to creep, heat, and layer fracture; even
  a successful unloaded fit does not qualify it for valuable equipment.'
questions:
- text: What is the required plate width?
  answer: 38 mm.
- text: What clamp type is present?
  answer: Opposed angled lips, knob-tightened, plate drops in from above.
- text: What are the exact head model, jaw angle, gripping height, and usable clamping
    range?
  answer: null
- text: What is the camera socket usable depth, camera/lens mass, and camera underside
    clearance?
  answer: null
