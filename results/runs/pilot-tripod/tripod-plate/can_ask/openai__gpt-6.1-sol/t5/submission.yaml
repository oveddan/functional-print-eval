parts:
- id: unloaded_plate_test
  role: coupon
  material: PLA (high-speed PLA, black)
  code: "import math\n\ndef build(p):\n    # Printed camera-contact face is on bed;\
    \ no printed threads.\n    grip = p.bolt_length - p.trial_thread_projection\n\
    \    recess = p.bolt_head_h + p.head_depth_allowance\n    total = grip + recess\n\
    \    shoulder = total - p.test_flank_height\n    neck = p.plate_width - 2*p.test_flank_height*math.tan(math.radians(p.test_flank_angle))\n\
    \    if grip <= 0 or shoulder <= 0 or neck <= p.bolt_head_d + p.head_diametral_allowance:\n\
    \        raise ValueError('Invalid test dimensions')\n    deck = cq.Workplane('XY').rect(p.deck_width,p.plate_length).extrude(shoulder)\n\
    \    foot = (cq.Workplane('XY').workplane(offset=shoulder)\n            .rect(neck,p.plate_length)\n\
    \            .workplane(offset=p.test_flank_height)\n            .rect(p.plate_width,p.plate_length).loft(combine=True))\n\
    \    body = deck.union(foot)\n    shaft = cq.Workplane('XY').circle((p.camera_thread_major+p.hole_diametral_allowance)/2).extrude(total)\n\
    \    pocket = (cq.Workplane('XY').workplane(offset=grip)\n              .circle((p.bolt_head_d+p.head_diametral_allowance)/2).extrude(recess))\n\
    \    return body.cut(shaft).cut(pocket)\n"
  print_orientation: Broad flat camera-contact face on bed at z=0. Recess opens upward;
    dovetail widens upward. No supports required for the trial 45-degree flanks.
  use_orientation: 'For unloaded clamp testing, flip over: broad flat face faces upward,
    recessed screw head faces down toward the tripod.'
hardware:
- id: camera_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: trial_camera_bolt_location
  fastener: camera_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 7.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: unloaded_plate_test
    feature: Flat annular floor of upward-opening head recess, z = bolt_length - trial_thread_projection;
      origin denotes under-head bearing plane.
    role: head_seat
  - part: unloaded_plate_test
    feature: Central unthreaded through bore.
    role: clearance
  nut: null
  external: Camera 1/4-20 socket, NOT to be engaged in this unloaded test; socket
    depth and engagement unverified.
criteria:
- id: profile_match
  part: unloaded_plate_test
  feature: Both sloping flanks and deck-to-jaw clearance
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - plate_width
  - test_flank_angle
  - test_flank_height
  - deck_width
  - plate_length
  check:
    method: coupon
    ref: unloaded_plate_test
    description: With no camera and initially no bolt, confirm plate drops in, both
      angled jaws contact the flanks rather than bottoming on the deck, knob has useful
      tightening travel, and plate cannot lift, twist or slide free under firm hand
      manipulation. Failure means reject, not tighten harder. Success alone does not
      establish load capacity.
- id: bolt_recess
  part: unloaded_plate_test
  feature: Central bore and recessed head seat
  relation: clears
  hardware: camera_bolt
  clearance_mm: null
  params:
  - bolt_head_d
  - bolt_head_h
  - camera_thread_major
  - head_diametral_allowance
  - hole_diametral_allowance
  - head_depth_allowance
  check:
    method: coupon
    ref: unloaded_plate_test
    description: Off the tripod and away from the camera, insert bolt; confirm it
      turns freely, head sits flat and below the dovetail bottom, and the head remains
      accessible with its appropriate driver.
- id: projection
  part: unloaded_plate_test
  feature: Bolt projection above camera-contact face
  relation: supports
  hardware: camera_bolt
  clearance_mm: null
  params:
  - bolt_length
  - trial_thread_projection
  - socket_depth
  check:
    method: measure
    ref: null
    description: Measure actual exposed thread with head seated; nominal 3 mm, about
      2.36 turns. This is not validated engagement. Before redesigning for use, obtain
      camera maker engagement requirements and usable socket depth with bottoming
      clearance; do not test depth by tightening the bolt.
manual:
- n: '1'
  text: Treat this as an unloaded gauge only. Ask the tripod owner for the head model
    and correct replacement plate specification. Do not attach a camera or lens to
    this print.
  parts:
  - unloaded_plate_test
  hardware: []
  tool: null
- n: '2'
  text: Print in the supplied orientation using 0.2 mm layers, six walls and 100%
    infill. No supports. Reject cracks, layer gaps or warped contact faces. These
    settings do not create a load rating.
  parts:
  - unloaded_plate_test
  hardware: []
  tool: Bambu Lab X1C slicer
- n: '3'
  text: Remove burrs without rounding the dovetail flanks. With no bolt or camera,
    drop the plate into the clamp and hand-tighten the knob normally. Check both jaw
    contacts, deck clearance, tightening travel and resistance to lifting, twisting
    and sliding. Reject if it rocks, slips, contacts only an edge, or the knob reaches
    its stop. Do not force the clamp.
  parts:
  - unloaded_plate_test
  hardware: []
  tool: null
- n: '4'
  text: Remove the gauge from the tripod. Insert the salvaged bolt from the recessed
    side; check head clearance and measure exposed thread above the flat face. Nominal
    projection is 3 mm, but all bolt measurements were approximate. Do not screw it
    into the camera.
  parts:
  - unloaded_plate_test
  hardware:
  - camera_bolt
  tool: Calipers or ruler
- n: '5'
  text: Record actual jaw profile, head model, usable camera socket depth and camera/lens
    load before requesting a usable redesign. If these cannot be established, use
    the correct manufacturer's replacement plate. Never substitute a printed camera
    screw, leave a PLA mount loaded unattended, or rely on this gauge to secure equipment.
  parts:
  - unloaded_plate_test
  hardware: []
  tool: null
