parts:
- id: profile_coupon
  role: coupon
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    import math\n    neck = p.plate_width - 2*p.profile_height*math.tan(math.radians(p.profile_angle))\n\
    \    slab = p.plate_thickness - p.profile_height\n    base = cq.Workplane('XY').rect(p.coupon_length,\
    \ p.plate_width).extrude(slab)\n    rail = (cq.Workplane('XY').workplane(offset=slab)\n\
    \            .rect(p.coupon_length, neck)\n            .workplane(offset=p.profile_height).rect(p.coupon_length,\
    \ p.plate_width)\n            .loft(combine=True))\n    return base.union(rail)\n"
  print_orientation: Broad rectangular face on the bed at z=0; dovetail points upward.
    No supports.
  use_orientation: 'Invert after printing: broad bed face faces the camera; dovetail
    faces down into the clamp. X runs along the jaws.'
- id: camera_plate
  role: final
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    import math\n    neck = p.plate_width - 2*p.profile_height*math.tan(math.radians(p.profile_angle))\n\
    \    slab = p.plate_thickness - p.profile_height\n    base = cq.Workplane('XY').rect(p.plate_length,\
    \ p.plate_width).extrude(slab)\n    rail = (cq.Workplane('XY').workplane(offset=slab)\n\
    \            .rect(p.plate_length, neck)\n            .workplane(offset=p.profile_height).rect(p.plate_length,\
    \ p.plate_width)\n            .loft(combine=True))\n    body = base.union(rail)\n\
    \    bore = cq.Workplane('XY').circle((p.bolt_d+p.bore_allowance)/2).extrude(p.plate_thickness)\n\
    \    recess = (cq.Workplane('XY').workplane(offset=p.screw_grip)\n           \
    \   .circle((p.bolt_head_d+p.head_allowance)/2)\n              .extrude(p.plate_thickness-p.screw_grip))\n\
    \    return body.cut(bore).cut(recess)\n"
  print_orientation: Camera contact face flat on bed at z=0. Screw-head recess opens
    upward. No supports; dovetail side slopes are 45 degrees.
  use_orientation: 'Invert: printed z=0 face against camera; printed z=12 faces the
    tripod. X runs along clamp jaws. Bolt inserts from printed +Z toward -Z.'
