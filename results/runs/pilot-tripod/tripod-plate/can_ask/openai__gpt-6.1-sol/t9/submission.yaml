task: tripod-plate
note: Temporary, unverified Arca-like quick-release plate prototype. Only nominal
  plate width and approximate bolt dimensions are known. The 45-degree, 4 mm-high
  dovetail is an assumption, not a confirmed tripod interface. No camera load rating
  is claimed. Print and check the coupon first; do not mount a camera until all manual
  checks pass. Use the metal salvaged bolt; no printed camera screw is supplied. PLA
  can creep and soften in heat; this is not a permanent replacement.
questions:
- text: Exact clamp profile, lip height, jaw contact length and available adjustment?
  answer: null
- text: Camera mounting socket usable thread depth, surrounding surface geometry,
    and camera/lens weight?
  answer: null
- text: Webcam bolt drive type and accurately measured dimensions?
  answer: Head approximately 15 mm across and 5 mm high; length under head approximately
    10 mm. Drive type unknown.
