task: tripod-plate
note: Measurement-stage design only, NOT a usable quick-release plate. Neither coupon
  may support a camera. The confirmed 38 mm nominal width does not establish dovetail
  angle, jaw engagement, thickness, latch geometry, or retention stops. A safe load-bearing
  replacement and camera attachment cannot be specified from the available measurements.
  Keep the metal webcam bolt; do not print a camera screw. PLA also creeps under sustained
  clamping and softens in heat. No camera attachment or load test is authorized by
  this submission.
questions:
- text: What is the tripod head model or original quick-release plate model?
  answer: null
- text: What are the clamp cross-section, jaw height, contact length, locking mechanism,
    and retention-stop geometry?
  answer: null
- text: What camera and lens will be supported, and what is their combined mass?
  answer: null
- text: What screw insertion depth does the camera manufacturer permit?
  answer: null
- text: Is the webcam bolt threaded continuously over the length needed for the eventual
    plate?
  answer: null
params:
  plate_nominal_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: User reports width of plate accepted by clamp; not a measurement of its
      cross-section.
  gauge_length:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
  gauge_thickness:
    value: 2
    unit: mm
    kind: design
    source: design
    note: ''
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Approximate head width; actual shape unconfirmed.
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Approximate.
  bolt_underhead_length:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: Approximate; not sufficient to determine safe camera engagement.
  camera_thread_major_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal 1/4-20 major diameter; camera thread designation confirmed by user.
  camera_thread_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_clearance_diametral:
    value: 0.45
    unit: mm
    kind: design
    source: design
    note: ''
  head_clearance_diametral:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: ''
  head_depth_allowance:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_floor:
    value: 2.6
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_side:
    value: 26
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: width_gauge
  role: coupon
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').box(p.gauge_length, p.plate_nominal_width,\
    \ p.gauge_thickness, centered=(True, True, False))"
  print_orientation: Large rectangular face flat on bed, z=0; 38 mm dimension along
    Y.
  use_orientation: Loose comparison gauge only. Hold above the empty clamp to compare
    nominal width. No dovetail or latch is represented.
- id: bolt_gauge
  role: coupon
  material: PLA
  code: "def build(p):\n    h = p.coupon_floor + p.bolt_head_h + p.head_depth_allowance\n\
    \    body = cq.Workplane('XY').box(p.coupon_side, p.coupon_side, h, centered=(True,\
    \ True, False))\n    bore = cq.Workplane('XY').circle((p.camera_thread_major_d\
    \ + p.bolt_clearance_diametral)/2).extrude(h)\n    recess = cq.Workplane('XY').workplane(offset=p.coupon_floor).circle((p.bolt_head_d\
    \ + p.head_clearance_diametral)/2).extrude(p.bolt_head_h + p.head_depth_allowance)\n\
    \    return body.cut(bore).cut(recess)"
  print_orientation: Flat bottom on bed at z=0, large head recess open upward. No
    supports needed.
  use_orientation: Bench-only screw-fit gauge. Insert bolt into the large recess so
    its shank passes through the small hole. Do not attach to a camera or tripod.
hardware:
- id: webcam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints: []
criteria:
- id: nominal_width_check
  part: width_gauge
  feature: Distance across Y faces
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - plate_nominal_width
  check:
    method: measure
    ref: null
    description: Measure the printed Y width and compare loosely with the empty clamp.
      This checks only nominal width; it cannot demonstrate clamping or retention.
      Do not force the gauge into the jaws.
- id: bolt_shank_fit
  part: bolt_gauge
  feature: Central through bore
  relation: clears
  hardware: webcam_bolt
  clearance_mm: 0.225
  params:
  - camera_thread_major_d
  - bolt_clearance_diametral
  check:
    method: coupon
    ref: bolt_gauge
    description: Bolt must pass freely by hand, without screwing into the plastic.
      Record actual printed bore diameter and any binding.
- id: bolt_head_fit
  part: bolt_gauge
  feature: Open circular head recess and floor
  relation: seats
  hardware: webcam_bolt
  clearance_mm: null
  params:
  - bolt_head_d
  - bolt_head_h
  - head_clearance_diametral
  - head_depth_allowance
  - coupon_floor
  check:
    method: coupon
    ref: bolt_gauge
    description: Check that the actual head fits freely and rests on the floor without
      interference. This does not validate bolt length, strength, camera compatibility,
      or tripod fit.
manual:
- n: '1'
  text: Print both coupons in PLA at 0.2 mm layers, with at least four perimeters
    and five top/bottom layers. Use the indicated orientations; no supports are required.
    These coupons are measurement aids only.
  parts:
  - width_gauge
  - bolt_gauge
  hardware: []
  tool: Slicer and 3D printer
- n: '2'
  text: Measure the width_gauge across its 38 mm direction. Compare it loosely above
    the empty clamp. Do not tighten the clamp onto it or treat it as a quick-release
    plate. Record the clamp model and obtain the missing jaw-profile measurements
    or an original plate drawing.
  parts:
  - width_gauge
  hardware: []
  tool: Calipers
- n: '3'
  text: On the bench, pass the webcam bolt through bolt_gauge from the recessed side.
    Check free shank passage and head seating without force. Remove it afterward.
    Do not screw this assembly into the camera; its protrusion is not a safe insertion-depth
    specification.
  parts:
  - bolt_gauge
  hardware:
  - webcam_bolt
  tool: null
- n: '4'
  text: Before designing a usable plate, obtain the camera manufacturer's permitted
    screw insertion depth and confirm the camera/lens mass, clamp profile, and positive
    retention features. A future plate must accommodate the measured bolt length with
    adequate thread engagement without bottoming out, and must be verified unloaded
    before any camera is fitted.
  parts: []
  hardware: []
  tool: null
- n: '5'
  text: Until those checks are complete, use the correct replacement metal plate or
    another intact camera support. Do not use either coupon as a temporary mount.
  parts: []
  hardware: []
  tool: null
