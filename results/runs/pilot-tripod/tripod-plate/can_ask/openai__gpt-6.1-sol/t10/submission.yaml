task: tripod-plate
note: 'A replacement plate is feasible to print once the exact tripod clamp profile
  is known. Do not print the camera screw: use a verified metal 1/4-20 bolt. Only
  the nominal 38 mm plate width and approximate webcam-bolt dimensions were obtained;
  repeated requests did not establish the retaining profile or camera socket depth.
  This submission therefore contains ONLY a non-load-bearing sizing coupon, not a
  usable quick-release plate or camera attachment. Never mount a camera on this coupon.
  PLA can creep and crack; even a future verified temporary plate should be used only
  attended, at low height, with independent camera retention, not over people or valuable
  objects.'
questions:
- text: What is the tripod head make/model and its retaining-jaw profile, including
    lip height, top opening, seating width, and required plate length?
  answer: null
- text: What is the camera socket's usable thread depth and required safe thread engagement?
  answer: null
- text: What camera/lens model and total load will be supported?
  answer: null
- text: What plate width does the clamp take?
  answer: 38 mm, reported by the owner; profile and measurement location remain unverified.
params:
  reported_plate_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: Reported plate width only; not verified as the jaw opening or dovetail base
      width.
  coupon_length:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_thickness:
    value: 2
    unit: mm
    kind: design
    source: design
    note: ''
  camera_thread_major_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal major diameter of 1/4-20 thread, not a threaded-hole specification.
  bolt_hole_diametral_allowance:
    value: 0.45
    unit: mm
    kind: design
    source: design
    note: Produces a 6.8 mm unthreaded clearance hole.
  webcam_bolt_length:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: Approximate under-head length; remeasure before any functional design.
  webcam_bolt_head_across:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Approximate; head shape is not established.
  webcam_bolt_head_height:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Approximate.
  jaw_lip_height:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: ''
  jaw_top_opening:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: ''
  jaw_seating_width:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: ''
  camera_socket_usable_depth:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: ''
parts:
- id: width_and_hole_coupon
  role: coupon
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    body = cq.Workplane('XY').box(p.reported_plate_width,\
    \ p.coupon_length, p.coupon_thickness, centered=(True, True, False))\n    return\
    \ body.faces('>Z').workplane().hole(p.camera_thread_major_d + p.bolt_hole_diametral_allowance)\n"
  print_orientation: Broad rectangular face on the bed at z=0; print flat, without
    supports.
  use_orientation: Loose sizing template only. The 38 mm dimension runs across the
    tripod jaws; it has no retaining dovetail, latch features, or load-bearing function.
hardware:
- id: webcam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints: []
criteria:
- id: width_reference
  part: width_and_hole_coupon
  feature: 38 mm outside width
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - reported_plate_width
  check:
    method: measure
    ref: null
    description: Measure the printed width and compare it loosely with the empty clamp.
      Do not tighten the clamp on it or treat a width match as proof of retention.
- id: bolt_clearance
  part: width_and_hole_coupon
  feature: Central unthreaded clearance hole
  relation: clears
  hardware: webcam_bolt
  clearance_mm: 0.225
  params:
  - camera_thread_major_d
  - bolt_hole_diametral_allowance
  check:
    method: coupon
    ref: width_and_hole_coupon
    description: Away from the camera, check whether the metal bolt passes freely
      through the hole. This checks printed clearance only, not thread compatibility,
      engagement, or mounting safety.
manual:
- n: '1'
  text: Keep the camera off the tripod. Print width_and_hole_coupon flat at 0.2 mm
    layers with at least three walls and solid infill. No supports are required.
  parts:
  - width_and_hole_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Measure the coupon width, then compare it loosely against the empty tripod
    clamp. Do not clamp it as a working plate: its straight sides cannot provide verified
    retention. Record where the clamp contacts it and obtain the head model or retaining-profile
    measurements.'
  parts:
  - width_and_hole_coupon
  hardware: []
  tool: Calipers or ruler
- n: '3'
  text: 'Away from the camera, pass webcam_bolt through the coupon to check hole clearance.
    Do not screw this combination into the camera: the roughly 10 mm bolt would protrude
    about 8 mm past this thin coupon, and the socket depth is unknown.'
  parts:
  - width_and_hole_coupon
  hardware:
  - webcam_bolt
  tool: null
- n: '4'
  text: Before making a functional plate, establish the clamp profile, latch/safety-stop
    requirements, camera load, exact bolt length, and camera manufacturer's thread-depth/engagement
    limits. Plate thickness and any captive-bolt recess must then be designed together
    so the bolt clamps without bottoming out. Do not substitute a printed screw.
  parts: []
  hardware: []
  tool: null
- n: '5'
  text: Until these dimensions are verified and a functional design is checked, use
    the tripod manufacturer's compatible replacement plate or locate the original.
    This coupon is not a temporary camera mount.
  parts:
  - width_and_hole_coupon
  hardware: []
  tool: null
