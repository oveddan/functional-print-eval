task: tripod-plate
note: 'Temporary camera-to-tripod plate. The flat part is printed; the screw is NOT
  printed — it''s the salvaged steel 1/4-20 bolt from the webcam monitor mount (printed
  PLA threads into a camera''s metal socket would strip and carry the whole camera
  load, so that part stays metal). Key constraint: the bolt is only ~10 mm long under
  the head, so the plate has a pocket in its underside where the bolt head rides flush
  with the plate bottom. That leaves ~7.5 mm of the 10 mm shaft available for the
  camera''s threads while keeping the plate 8 mm thick for stiffness. Because the
  clamp''s jaw opening couldn''t be measured, the plate width is a best guess sized
  to a typical drop-in jaw clamp, and the manual has a fit-check step: PLA files/sands
  easily, so oversize can be corrected. Hand-tight only; treat as temporary.'
questions: []
params:
  bolt_shaft_len:
    value: 10
    unit: mm
    kind: hardware
    source: asked
    note: 'ruler measurement, repeated twice: about 10 mm under the head'
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: asked
    note: across the head; round pocket sized to fit either a round or hex head
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: asked
    note: ''
  camera_socket_depth:
    value: 6
    unit: mm
    kind: world
    source: guessed
    note: typical camera 1/4-20 sockets are 5-8 mm deep; not measurable remotely
  cbore_d:
    value: 16.5
    unit: mm
    kind: design
    source: design
    note: bolt head 15 + 1.5 total clearance, sized generously because the head was
      measured with a ruler (+/-0.5)
  cbore_depth:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: head height 5 + 0.5 clearance, tolerant of bridging droop on the pocket
      ceiling
  engagement_at_contact:
    value: 7.5
    unit: mm
    kind: design
    source: design
    note: = bolt_shaft_len - (plate_t - cbore_depth); when the camera bottom touches
      the plate, ~7.5 mm of shaft is in the camera (or the bolt bottoms in the socket
      first, in which case the head seats on the tripod platform and carries the camera
      directly - the design works either way)
  jaw_opening:
    value: 46
    unit: mm
    kind: world
    source: guessed
    note: clamp measurements never returned numbers; plate is sized for a typical
      drop-in jaw clamp and can be sanded to fit
  plate_d:
    value: 50
    unit: mm
    kind: design
    source: design
    note: front-to-back; jaws grip the sides so this mostly just has to fit the slot
  plate_t:
    value: 8
    unit: mm
    kind: design
    source: design
    note: as thick as the 10 mm bolt allows while leaving >=7 mm of thread for the
      camera; should fit most drop-in clamp lips
  plate_w:
    value: 45
    unit: mm
    kind: design
    source: design
    note: jaw_opening minus ~1 mm; sand the sides to fit if the clamp opening differs
  shaft_hole_d:
    value: 7.2
    unit: mm
    kind: design
    source: design
    note: 1/4-20 shaft is 6.35; ~0.85 clearance so the plate slides on the bolt easily
      even after hole shrink
  top_chamfer:
    value: 2
    unit: mm
    kind: design
    source: design
    note: helps the plate drop past the clamp's angled lips
parts:
- id: plate
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    t = p.plate_t\n    plate = (\n        cq.Workplane(\"\
    XY\")\n        .box(p.plate_w, p.plate_d, t, centered=(True, True, False))\n \
    \       .edges(\">Z\")\n        .chamfer(p.top_chamfer)\n    )\n    # pocket in\
    \ the underside: the bolt head rides in here, its top face\n    # bearing on the\
    \ pocket ceiling, flush-ish with the plate bottom\n    plate = plate.cut(\n  \
    \      cq.Workplane(\"XY\").circle(p.cbore_d / 2).extrude(p.cbore_depth)\n   \
    \ )\n    # clearance hole for the 1/4-20 shaft, through the remaining thickness\n\
    \    plate = plate.cut(\n        cq.Workplane(\"XY\").circle(p.shaft_hole_d /\
    \ 2).extrude(t)\n    )\n    # small lead-in chamfers on the underside edges (outer\
    \ rim + pocket rim)\n    plate = plate.edges(\"<Z\").chamfer(0.6)\n    return\
    \ plate\n"
  print_orientation: underside (the face with the round pocket) down on the bed
  use_orientation: pocket face down against the tripod platform; camera sits on the
    flat top face
- id: fit_coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    t = p.plate_t\n    block = cq.Workplane(\"XY\").box(25,\
    \ 25, t, centered=(True, True, False))\n    block = block.cut(\n        cq.Workplane(\"\
    XY\").circle(p.cbore_d / 2).extrude(p.cbore_depth)\n    )\n    block = block.cut(\n\
    \        cq.Workplane(\"XY\").circle(p.shaft_hole_d / 2).extrude(t)\n    )\n \
    \   return block\n"
  print_orientation: underside (the face with the round pocket) down on the bed
  use_orientation: 'same as the plate: pocket down'
hardware:
- id: webcam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_to_plate
  fastener: webcam_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.5
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: underside counterbore (head pocket)
    role: head_seat
  - part: plate
    feature: center shaft hole
    role: clearance
  nut: null
  external: camera underside 1/4-20 socket (metal, on the camera body)
criteria:
- id: head_fits_pocket
  part: plate
  feature: underside counterbore (head pocket)
  relation: contains
  hardware: webcam_bolt
  clearance_mm: 0.5
  params:
  - cbore_d
  - cbore_depth
  - bolt_head_d
  - bolt_head_h
  check:
    method: coupon
    ref: fit_coupon
    description: The coupon has the same pocket; the bolt's head must seat against
      the pocket ceiling with ~0.5 mm play, head top flush or just under the plate
      bottom face
- id: shaft_fits_hole
  part: plate
  feature: center shaft hole
  relation: clears
  hardware: webcam_bolt
  clearance_mm: 0.8
  params:
  - shaft_hole_d
  check:
    method: coupon
    ref: fit_coupon
    description: Shaft must slide through the plate's center hole freely so the plate
      can be slid onto the bolt
- id: plate_fits_clamp
  part: plate
  feature: outer width and depth vs jaw opening
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - plate_w
  - plate_d
  - jaw_opening
  check:
    method: measure
    ref: tripod head
    description: Plate must drop into the clamp from above with the knob loose and
      be gripped by the jaws; if too wide, sand the long sides to fit
- id: bolt_reach
  part: plate
  feature: bolt reach through plate into camera
  relation: supports
  hardware: webcam_bolt
  clearance_mm: null
  params:
  - plate_t
  - cbore_depth
  - bolt_shaft_len
  - engagement_at_contact
  check:
    method: none
    ref: null
    description: 'Stack check: engagement at contact = bolt_shaft_len - (plate_t -
      cbore_depth) = 10 - 2.5 = 7.5 mm of the 10 mm shaft remains for the camera socket;
      even if the socket is shallower and the bolt bottoms out, the head seats on
      the tripod platform and carries the camera directly'
manual:
- n: '1'
  text: 'Print both parts exactly as modelled: the face with the round pocket DOWN
    on the bed, no supports. 0.2 mm layers, 3-4 perimeters, 25% infill. (Print the
    small coupon first if you want to check the fit before committing to the full
    plate.)'
  parts:
  - fit_coupon
  - plate
  hardware: []
  tool: null
- n: '2'
  text: 'Coupon test: push the webcam bolt up into the coupon''s pocket from below
    so the shaft goes through the center hole. The head should seat against the pocket
    ceiling with slight play, and the shaft should slide freely through the hole.
    If anything is tight, open it up a touch with a small file or a 7 mm drill.'
  parts:
  - fit_coupon
  hardware:
  - webcam_bolt
  tool: null
- n: '3'
  text: 'Tripod fit check: with the clamp knob loose, drop the plate into the tripod
    head from above. It should drop in and the jaws should close onto its sides when
    you turn the knob. If it''s too wide to drop in, file or sand the two long sides
    evenly, a little at a time, until it drops in with slight wiggle. (If it''s too
    narrow and the knob closes without gripping, tell me and we''ll reprint wider.)'
  parts:
  - plate
  hardware: []
  tool: fine file or sandpaper
- n: '4'
  text: 'Assemble camera + plate: screw the webcam bolt about 3 turns into the camera''s
    underside 1/4-20 socket by hand. Slide the plate down over the bolt so the bolt''s
    head seats into the plate''s underside pocket and the shaft passes through the
    center hole. Keep turning the bolt until the camera''s bottom rests on the plate''s
    top face, or until the bolt stops turning - either is fine (if it stops just short,
    the camera hangs on the bolt and the head seats on the tripod platform; it still
    holds). Hand-tight only - about jar-lid firm. Do NOT use pliers.'
  parts:
  - plate
  hardware:
  - webcam_bolt
  tool: null
- n: '5'
  text: 'Mount it: drop the camera+plate assembly into the tripod clamp and tighten
    the knob until the jaws grip the plate firmly.'
  parts:
  - plate
  hardware: []
  tool: null
- n: '6'
  text: 'Care: this is PLA and a temporary fix. Don''t leave it in a hot car or direct
    sun (PLA softens around 60 C), don''t overtighten the bolt, and swap in the real
    plate as soon as it turns up.'
  parts: []
  hardware: []
  tool: null
