task: tripod-plate
note: Temporary quick-release plate for a 38 mm (Arca-style) tripod clamp, with printed
  1/4-20 studs instead of the salvaged bolt (too short at ~10 mm under head). Three
  stud lengths cover the unknown camera socket recess; a coupon verifies clamp fit
  and threads before the final prints. All PLA, hand-tightened, compression-loaded.
questions: []
params:
  clamp_plate_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: clamp takes 38 mm wide plates
  coupon_len:
    value: 22
    unit: mm
    kind: design
    source: design
    note: ''
  dov_angle:
    value: 45
    unit: mm
    kind: design
    source: design
    note: Arca-Swiss standard angle
  dov_top_w:
    value: 37.4
    unit: mm
    kind: design
    source: design
    note: 38 mm minus 0.6 total clearance so it slides in
  hole_crest_d:
    value: 5.44
    unit: mm
    kind: design
    source: design
    note: internal thread smallest bore diameter
  hole_depth:
    value: 6.5
    unit: mm
    kind: design
    source: design
    note: ''
  hole_root_d:
    value: 6.56
    unit: mm
    kind: design
    source: design
    note: major + 0.21 for printed internal thread
  lead_in:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: ''
  plate_corner_r:
    value: 4
    unit: mm
    kind: design
    source: design
    note: ''
  plate_len:
    value: 50
    unit: mm
    kind: design
    source: design
    note: clamp length went unmeasured; 50 fits clamps about 35-60 long
  plate_t:
    value: 8
    unit: mm
    kind: design
    source: design
    note: common Arca plate thickness
  slot_depth:
    value: 3.2
    unit: mm
    kind: design
    source: design
    note: turn window height at stud waist
  slot_w:
    value: 3
    unit: mm
    kind: design
    source: design
    note: turn window width, coin edge or small flat blade
  stud_bottom_len:
    value: 6.2
    unit: mm
    kind: design
    source: design
    note: thread length seating inside the plate
  stud_core_d:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: stud thread core diameter
  stud_crest_d:
    value: 6.24
    unit: mm
    kind: design
    source: design
    note: nominal 6.35 minus 0.11 print allowance
  stud_top_len:
    value: 8
    unit: mm
    kind: design
    source: design
    note: stud_8 default; stud_6 and stud_10 hard-code 6 and 10
  thread_pitch:
    value: 1.27
    unit: mm
    kind: design
    source: datasheet
    note: 1/4-20 UNC pitch
  tether_hole_d:
    value: 5
    unit: mm
    kind: design
    source: design
    note: ''
  bottom_chamfer:
    value: 2
    unit: mm
    kind: design
    source: design
    note: ''
  top_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
  wedge_step:
    value: 60
    unit: mm
    kind: design
    source: design
    note: build step for helical thread ridges, deg
parts:
- id: plate
  role: final
  material: PLA (high-speed, black)
  code: "import math\n\ndef _ridge(r_lo, r_hi):\n    return (cq.Workplane(\"XZ\").polyline([(r_lo,\
    \ -0.44), (r_hi, -0.14), (r_hi, 0.14), (r_lo, 0.44)]).close().extrude(1.7, both=True))\n\
    \ndef _ridges(r_lo, r_hi, z0, z1, pitch, step):\n    lead = math.degrees(math.atan2(pitch,\
    \ math.pi * (r_lo + r_hi)))\n    n = int(math.ceil((z1 - z0) / (pitch * step /\
    \ 360.0))) + 2\n    out = []\n    for i in range(n):\n        z = i * step / 360.0\
    \ * pitch\n        if z - 0.6 > (z1 - z0):\n            break\n        out.append(_ridge(r_lo,\
    \ r_hi).rotate((0,0,0),(1,0,0),lead).rotate((0,0,0),(0,0,1),i*step).translate((0,0,z0+z)))\n\
    \    return out\n\ndef _fuse(base, shapes):\n    return base.union(cq.Workplane(obj=cq.Compound.makeCompound([s.val()\
    \ for s in shapes])))\n\ndef build(p):\n    W, T, L = p.dov_top_w, p.plate_t,\
    \ p.plate_len\n    wb = W - 2.0 * T\n    body = cq.Workplane(\"XZ\").polyline([(-wb/2.0,0.0),(wb/2.0,0.0),(W/2.0,T),(-W/2.0,T)]).close().extrude(L/2.0,\
    \ both=True)\n    body = body.edges(\"|Z\").fillet(p.plate_corner_r)\n    body\
    \ = body.edges(\"<Z\").chamfer(p.bottom_chamfer)\n    body = body.edges(\">Z\"\
    ).chamfer(p.top_chamfer)\n    zf = T - p.hole_depth\n    hole = cq.Workplane(\"\
    XY\", origin=(0,0,zf)).circle(p.hole_root_d/2.0).extrude(p.hole_depth+2.0)\n \
    \   body = body.cut(hole)\n    body = _fuse(body, _ridges(p.hole_crest_d/2.0,\
    \ p.hole_root_d/2.0+0.01, zf+0.2, T-0.2, p.thread_pitch, p.wedge_step))\n    cone\
    \ = cq.Solid.makeCone(p.hole_root_d/2.0, p.hole_root_d/2.0+0.9, p.lead_in, cq.Vector(0,0,T-p.lead_in),\
    \ cq.Vector(0,0,1))\n    body = body.cut(cq.Workplane(obj=cone))\n    tether =\
    \ cq.Workplane(\"XY\", origin=(0, -(L/2.0-5.0), -1.0)).circle(p.tether_hole_d/2.0).extrude(T+2.0)\n\
    \    body = body.cut(tether)\n    return body\n"
  print_orientation: underside - the narrow dovetail root face - on the bed; camera
    face up
  use_orientation: 'as printed: dovetail down into the clamp, camera face up'
- id: coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "import math\n\ndef _ridge(r_lo, r_hi):\n    return (cq.Workplane(\"XZ\").polyline([(r_lo,\
    \ -0.44), (r_hi, -0.14), (r_hi, 0.14), (r_lo, 0.44)]).close().extrude(1.7, both=True))\n\
    \ndef _ridges(r_lo, r_hi, z0, z1, pitch, step):\n    lead = math.degrees(math.atan2(pitch,\
    \ math.pi * (r_lo + r_hi)))\n    n = int(math.ceil((z1 - z0) / (pitch * step /\
    \ 360.0))) + 2\n    out = []\n    for i in range(n):\n        z = i * step / 360.0\
    \ * pitch\n        if z - 0.6 > (z1 - z0):\n            break\n        out.append(_ridge(r_lo,\
    \ r_hi).rotate((0,0,0),(1,0,0),lead).rotate((0,0,0),(0,0,1),i*step).translate((0,0,z0+z)))\n\
    \    return out\n\ndef _fuse(base, shapes):\n    return base.union(cq.Workplane(obj=cq.Compound.makeCompound([s.val()\
    \ for s in shapes])))\n\ndef build(p):\n    W, T, L = p.dov_top_w, p.plate_t,\
    \ p.coupon_len\n    wb = W - 2.0 * T\n    body = cq.Workplane(\"XZ\").polyline([(-wb/2.0,0.0),(wb/2.0,0.0),(W/2.0,T),(-W/2.0,T)]).close().extrude(L/2.0,\
    \ both=True)\n    body = body.edges(\"|Z\").fillet(3.0)\n    body = body.edges(\"\
    <Z\").chamfer(p.bottom_chamfer)\n    body = body.edges(\">Z\").chamfer(p.top_chamfer)\n\
    \    zf = T - p.hole_depth\n    hole = cq.Workplane(\"XY\", origin=(0,0,zf)).circle(p.hole_root_d/2.0).extrude(p.hole_depth+2.0)\n\
    \    body = body.cut(hole)\n    body = _fuse(body, _ridges(p.hole_crest_d/2.0,\
    \ p.hole_root_d/2.0+0.01, zf+0.2, T-0.2, p.thread_pitch, p.wedge_step))\n    cone\
    \ = cq.Solid.makeCone(p.hole_root_d/2.0, p.hole_root_d/2.0+0.9, p.lead_in, cq.Vector(0,0,T-p.lead_in),\
    \ cq.Vector(0,0,1))\n    body = body.cut(cq.Workplane(obj=cone))\n    return body\n"
  print_orientation: underside on the bed, same as plate
  use_orientation: as printed
- id: stud_6
  role: final
  material: PLA (high-speed, black)
  code: "import math\nTOP = 6.0\n\ndef _ridge(r_lo, r_hi):\n    return (cq.Workplane(\"\
    XZ\").polyline([(r_lo, -0.44), (r_hi, -0.14), (r_hi, 0.14), (r_lo, 0.44)]).close().extrude(1.7,\
    \ both=True))\n\ndef _ridges(r_lo, r_hi, z0, z1, pitch, step):\n    lead = math.degrees(math.atan2(pitch,\
    \ math.pi * (r_lo + r_hi)))\n    n = int(math.ceil((z1 - z0) / (pitch * step /\
    \ 360.0))) + 2\n    out = []\n    for i in range(n):\n        z = i * step / 360.0\
    \ * pitch\n        if z - 0.6 > (z1 - z0):\n            break\n        out.append(_ridge(r_lo,\
    \ r_hi).rotate((0,0,0),(1,0,0),lead).rotate((0,0,0),(0,0,1),i*step).translate((0,0,z0+z)))\n\
    \    return out\n\ndef _fuse(base, shapes):\n    return base.union(cq.Workplane(obj=cq.Compound.makeCompound([s.val()\
    \ for s in shapes])))\n\ndef build(p):\n    core_r = p.stud_core_d/2.0; crest_r\
    \ = p.stud_crest_d/2.0\n    L = p.stud_bottom_len + TOP\n    s = cq.Workplane(\"\
    XY\").circle(core_r).extrude(L)\n    s = _fuse(s, _ridges(core_r-0.02, crest_r,\
    \ 0.0, L, p.thread_pitch, p.wedge_step))\n    tt = cq.Workplane(\"XY\", origin=(0,0,L)).circle(crest_r+1.0).extrude(2.0)\n\
    \    tb = cq.Workplane(\"XY\", origin=(0,0,-2.0)).circle(crest_r+1.0).extrude(2.0)\n\
    \    s = s.cut(tt).cut(tb)\n    win = cq.Workplane(\"XY\", origin=(0,0,p.stud_bottom_len-p.slot_depth/2.0)).rect(p.slot_w,\
    \ crest_r*2.0+2.0).extrude(p.slot_depth)\n    s = s.cut(win)\n    return s\n"
  print_orientation: standing on the bottom thread tip, axis vertical
  use_orientation: axis vertical; lower thread into the plate, upper thread into the
    camera
