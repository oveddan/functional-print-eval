    \  tb = cq.Workplane(\"XY\", origin=(0,0,-2.0)).circle(crest_r+1.0).extrude(2.0)\n\
    \    s = s.cut(tt).cut(tb)\n    win = cq.Workplane(\"XY\", origin=(0,0,p.stud_bottom_len-p.slot_depth/2.0)).rect(p.slot_w,\
    \ crest_r*2.0+2.0).extrude(p.slot_depth)\n    s = s.cut(win)\n    return s\n"
  print_orientation: standing on the bottom thread tip, axis vertical
  use_orientation: axis vertical; lower thread into the plate, upper thread into the
