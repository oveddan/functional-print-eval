hardware: []
joints: []
criteria:
- id: c_clamp_fit
  part: plate
  feature: Arca-style dovetail cross-section (37.4 top width, 45 deg sides, 8 deep)
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - clamp_plate_width
  - dov_top_w
  - dov_angle
  - plate_t
  check:
    method: coupon
    ref: null
    description: 'Slide the coupon into the tripod clamp: it should drop to full depth
      and clamp snug without forcing. If tight, sand the 45-degree faces lightly.
      If the rail is not a 45-degree dovetail, stop - this design assumes the 38 mm
      Arca-style rail.'
- id: c_camera_thread
  part: stud_8
  feature: external 1/4-20 thread (crest 6.24, pitch 1.27)
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - stud_crest_d
  - thread_pitch
  - stud_top_len
  check:
    method: coupon
    ref: null
    description: Hand-thread each stud into the camera socket over a soft surface.
      Winner = longest stud that lets the camera sit flat with about 4 turns still
      engaged. Never force; deburr crest ridges lightly if tight.
- id: c_stud_plate_thread
  part: plate
  feature: blind internal 1/4-20 thread (crest 5.44, root 6.56, 6.5 deep)
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - hole_crest_d
  - hole_root_d
  - hole_depth
  - stud_bottom_len
  check:
    method: coupon
    ref: null
    description: 'Thread stud_8 into the coupon center hole: about 4 smooth turns
      to a light stop, no wobble. If it jams, deburr both threads lightly and retry.'
- id: c_supports_camera
  part: plate
  feature: top face under the camera bottom
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - plate_t
  - plate_len
  check:
    method: none
    ref: null
    description: Camera must sit flush with no rock. Temporary rating about 1.5 kg
      camera plus kit; keep the strap tethered to the tripod.
- id: c_turn_window
  part: stud_8
  feature: 3.0 x 3.2 turn window at the stud waist
  relation: contains
  hardware: null
  clearance_mm: null
  params:
  - slot_w
  - slot_depth
  check:
    method: none
    ref: null
    description: A coin edge or small flat blade fits the waist window for swapping
      studs with the camera removed.
manual:
- n: '1'
  text: 'Print the coupon first. X1C settings: 0.4 nozzle, 0.20 mm layers, 5 wall
    loops, 25% infill, standard or fast mode.'
  parts:
  - coupon
  hardware: []
  tool: Bambu X1C
- n: '2'
  text: Test the coupon in the tripod clamp. It should drop to full depth and clamp
    snug. Sand the 45-degree faces lightly if tight. If the rail shape is not a 45-degree
    dovetail, stop and tell me - this design assumes the 38 mm Arca-style rail.
  parts:
  - coupon
  hardware: []
  tool: null
- n: '3'
  text: 'Print the three studs (same settings). Each is a complete printed 1/4-20
    screw, one per length: stud_6, stud_8, stud_10.'
  parts:
  - stud_6
  - stud_8
  - stud_10
  hardware: []
  tool: Bambu X1C
- n: '4'
  text: Over a soft surface, hand-thread each stud into the camera's socket and note
    which is the longest that still lets the camera bottom sit flat with about 4 turns
    left. That is your stud; the others are spares. Never force.
  parts:
  - stud_6
  - stud_8
  - stud_10
  hardware: []
  tool: null
- n: '5'
  text: Print the plate (same settings). Check stud_8 threads about 4 turns into the
    coupon's center hole as a thread sanity check; if it jams, deburr both threads
    lightly.
  parts:
  - plate
  - coupon
  - stud_8
  hardware: []
  tool: null
- n: '6'
  text: 'Assemble: thread the winning stud 2 turns into the camera (use the camera
    itself as the screwdriver), then thread the stud into the plate until the camera
    bottom is flush against the plate top - snug, no tools. The stud''s waist window
    stays just above the plate top, ready for a coin blade when swapping studs later.'
  parts:
  - plate
  - stud_8
  - stud_6
  - stud_10
  hardware: []
  tool: null
- n: '7'
  text: Clip the assembly into the tripod head. Check with a light shake - the load
    path is pure compression, so nothing shakes loose. If your clamp has a spring-loaded
    center pin, note where it hits and trim a notch in the plate end with a hobby
    knife.
  parts:
  - plate
  hardware: []
  tool: null
- n: '8'
  text: 'Care: this is a temporary PLA part. Tether the camera strap to the tripod,
    do not overtighten (print walls can strip), do not leave it in a hot car, and
    keep looking for the metal plate.'
  parts:
  - plate
  - stud_8
  hardware: []
  tool: null
