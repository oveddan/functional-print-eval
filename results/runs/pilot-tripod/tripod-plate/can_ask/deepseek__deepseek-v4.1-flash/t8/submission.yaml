task: tripod-plate
note: 'Short answer: the flat part is easy — it''s a plain Arca-Swiss style plate
  (38 mm clamp = the Arca standard) and it prints with no supports. The screw is the
  weak link: a printed 1/4-20 thread will hold a camera for a temporary fix, but you
  already own a real metal 1/4-20 screw (the salvaged webcam-mount bolt: 15 mm head,
  5 mm thick, 10 mm of thread). I''ve designed the plate so BOTH the printed screw
  and that bolt drop into the same pocket and reach the camera equally — use the metal
  one if you have it, print the thumbscrew only as a spare. Both are 1/4-20 x 10 mm
  of thread, so they''re interchangeable.


  Why the plate is 9 mm thick and the pocket 4.5 mm deep: the bolt only has 10 mm
  of thread under its head. 4.5 mm pocket + 10 mm thread = 14.5 mm of thread above
  the bed of the pocket, and the plate is 9 mm thick, so 5.5 mm of thread is left
  sticking up into the camera socket — about the 5.5 mm a real camera screw engages.
  Making the plate any thicker starves the camera socket; making it thinner lets the
  screw bottom out in the socket.


  Assumptions I had to make (you couldn''t get at the borrowed tripod to measure them):
  the jaw faces are at 45 degrees (the Arca standard), the camera socket is 6.5 mm
  deep, and the clamp will take a 45 mm long plate. If the plate won''t slide in,
  tell me and I''ll narrow the 37.8 mm top face; if the jaws are a different angle,
  the dovetail needs re-cutting.


  Print the plate flat, bottom face down, 0.2 mm layers — the 45 degree dovetail sides
  and the head pocket are all self-supporting, no supports. Do not overtighten: the
  camera screw only needs to be finger-tight, and the clamp''s own knob does the real
  clamping.'
questions:
- text: Did the printed thread coupon start into the camera socket and hold, and did
    the plate slide into the tripod clamp?
  answer: null
- text: What is the jaw angle and the maximum plate length of the borrowed tripod's
    clamp? (I assumed 45 degrees and 45 mm.)
  answer: null
