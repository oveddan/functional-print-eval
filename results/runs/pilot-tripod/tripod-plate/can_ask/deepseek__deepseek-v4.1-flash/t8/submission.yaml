manual:
- n: '1'
  text: 'Print plate. Lay it flat with its bottom face on the bed, 0.2 mm layers,
    PLA. No supports: the 45 degree dovetail sides and the screw-head pocket all print
    cleanly as-is.'
  parts:
  - plate
  hardware: []
  tool: Bambu Lab X1C
- n: '2'
  text: Print thread_coupon and screw its 6 mm of thread into the camera's 1/4-20
    socket by hand. It should start easily and hold with light finger force. If it
    binds or strips, stop and chase the socket with the metal bolt instead of forcing
    the plastic.
  parts:
  - thread_coupon
  hardware: []
  tool: null
- n: '3'
  text: Print knob_screw (grip disc / head down on the bed, thread up). If you would
    rather use the metal bolt, skip this step - the salvaged webcam-mount bolt has
    the same 15 x 5 mm head and the same 10 mm of 1/4-20 thread, so it drops straight
    into the plate.
  parts:
  - knob_screw
  hardware:
  - bolt
  tool: null
- n: '4'
  text: 'Screw the camera onto the plate. Sit the camera on the plate''s wide top
    face and drop the screw in from underneath: the head goes into the dia 15.6 x
    4.5 pocket and the thread rises through the dia 6.8 hole into the camera''s socket.
    Turn it with a coin in the printed screw''s slot (or by hand on the metal bolt''s
    head, which stays 0.5 mm proud) until it is just finger-tight. Do not overtighten.'
  parts:
  - plate
  - knob_screw
  hardware:
  - bolt
  tool: coin
- n: '5'
  text: Slide the plate into the tripod's clamp along its 45 mm length, so the clamp's
    jaws sit on the two 45 degree dovetail faces, then tighten the clamp's own knob.
    The clamp does the holding; the camera screw only has to stop the camera rotating.
  parts:
  - plate
  hardware: []
  tool: null
- n: '6'
  text: 'Test before you trust it: fit the empty plate in the clamp first, then with
    the camera mounted, check there is no rock and that the camera cannot twist. PLA
    is stiff but brittle and will creep, so check the screw is still snug before each
    use, and take the camera off before carrying the tripod. This is a stopgap, not
    a permanent plate.'
  parts:
  - plate
  - knob_screw
  hardware: []
  tool: null
