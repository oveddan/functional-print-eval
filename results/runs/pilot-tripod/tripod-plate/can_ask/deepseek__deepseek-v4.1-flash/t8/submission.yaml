parts:
- id: plate
  role: final
  material: PLA
  code: "import cadquery as cq\nfrom math import tan, radians\n\n\ndef build(p):\n\
    \    ht = p.plate_w_top / 2.0\n    hb = ht - p.bevel_h * tan(radians(p.dovetail_angle))\n\
    \    bh = p.plate_t - p.bevel_h\n\n    # cross-section in the XZ plane: flat base,\
    \ then 45 deg dovetail flaring out\n    prof = (cq.Workplane(\"XZ\")\n       \
    \     .moveTo(-hb, 0)\n            .lineTo(hb, 0)\n            .lineTo(hb, bh)\n\
    \            .lineTo(ht, p.plate_t)\n            .lineTo(-ht, p.plate_t)\n   \
    \         .close())\n    plate = prof.extrude(p.plate_len / 2.0, both=True)\n\n\
    \    # screw-head pocket, open downward (head sits 0.5 mm proud)\n    pocket =\
    \ (cq.Workplane(\"XY\", origin=(0, 0, -1.0))\n              .circle(p.pocket_d\
    \ / 2.0)\n              .extrude(p.pocket_depth + 1.0))\n    # 1/4-20 clearance\
    \ hole up through the rest of the plate\n    shank = (cq.Workplane(\"XY\")\n \
    \            .circle(p.shank_hole_d / 2.0)\n             .extrude(p.plate_t +\
    \ 2.0))\n\n    return plate.cut(pocket).cut(shank)\n"
  print_orientation: bottom face on the bed (z = 0). The 45 degree dovetail sides
    and the screw-head pocket are self-supporting overhangs; no supports needed.
  use_orientation: wide 37.8 x 45 mm top face up with the camera resting on it; narrow
    bottom face (carrying the screw-head pocket) down against the clamp base; slides
    into the clamp along its 45 mm length.
- id: knob_screw
  role: final
  material: PLA
  code: "import cadquery as cq\n\n\ndef build(p):\n    rmaj = p.screw_major_d / 2.0\n\
    \    rmin = p.screw_minor_d / 2.0\n    rmid = (rmaj + rmin) / 2.0\n    h = p.screw_thread_len\n\
    \    z0 = p.screw_head_h\n\n    # knurled-free head plus plain core\n    body\
    \ = cq.Workplane(\"XY\").circle(p.screw_head_d / 2.0).extrude(z0)\n    body =\
    \ body.union(cq.Workplane(\"XY\").circle(rmin).extrude(z0 + h))\n\n    # real\
    \ 1/4-20 thread: triangular profile swept along a helix\n    helix = cq.Wire.makeHelix(pitch=p.q20_pitch,\
    \ height=h, radius=rmid)\n    helix = helix.translate(cq.Vector(0, 0, z0))\n \
    \   prof = (cq.Workplane(\"XZ\")\n            .moveTo(rmin, z0)\n            .lineTo(rmaj,\
    \ z0 + p.q20_pitch / 2.0)\n            .lineTo(rmin, z0 + p.q20_pitch)\n     \
    \       .close())\n    thread = prof.sweep(cq.Workplane(\"XY\").add(helix), isFrenet=True)\n\
    \    body = body.union(thread)\n\n    # coin slot in the underside of the head,\
    \ so it can be tightened from below\n    slot = (cq.Workplane(\"XY\", origin=(0,\
    \ 0, -1.0))\n            .rect(p.screw_head_d + 2.0, p.coin_slot_w)\n        \
    \    .extrude(p.coin_slot_d + 1.0))\n    return body.cut(slot)\n"
  print_orientation: head on the bed (z = 0), thread pointing straight up. No supports.
  use_orientation: head down in the plate's pocket, thread pointing up through the
    plate into the camera's 1/4-20 socket.
- id: thread_coupon
  role: coupon
  material: PLA
  code: "import cadquery as cq\n\n\ndef build(p):\n    rmaj = p.screw_major_d / 2.0\n\
    \    rmin = p.screw_minor_d / 2.0\n    rmid = (rmaj + rmin) / 2.0\n    h = p.coupon_thread_len\n\
    \    z0 = p.coupon_grip_h\n\n    body = cq.Workplane(\"XY\").circle(p.coupon_grip_d\
    \ / 2.0).extrude(z0)\n    body = body.union(cq.Workplane(\"XY\").circle(rmin).extrude(z0\
    \ + h))\n\n    helix = cq.Wire.makeHelix(pitch=p.q20_pitch, height=h, radius=rmid)\n\
    \    helix = helix.translate(cq.Vector(0, 0, z0))\n    prof = (cq.Workplane(\"\
    XZ\")\n            .moveTo(rmin, z0)\n            .lineTo(rmaj, z0 + p.q20_pitch\
    \ / 2.0)\n            .lineTo(rmin, z0 + p.q20_pitch)\n            .close())\n\
    \    thread = prof.sweep(cq.Workplane(\"XY\").add(helix), isFrenet=True)\n   \
    \ return body.union(thread)\n"
  print_orientation: grip disc on the bed (z = 0), thread pointing straight up.
  use_orientation: hand grip at the bottom, screw the 6 mm of thread into the camera's
    1/4-20 socket to check the printed thread's fit before printing the full thumbscrew.
hardware:
- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_screw
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - -0.5
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: screw-head pocket, dia 15.6 x 4.5 deep (bottom face)
    role: head_seat
  - part: plate
    feature: shank clearance hole, dia 6.8 through the remaining 4.5 mm
    role: clearance
  nut: null
  external: camera's 1/4-20 tripod socket
