task: tripod-plate
note: 'A drop-in dovetail tripod plate plus a printed 1/4"-20 thumbscrew, as a temporary
  stand-in for the missing quick-release plate. Print the two coupons first (a few
  grams), then the plate and screw.


  Why it is designed this way: the plate is a pure compression part (the clamp squeezes
  it, the screw pulls the camera down onto it) so PLA is fine. The screw is not —
  it is in tension at every joint and threads into a metal socket, so the plate''s
  pocket is sized for your salvaged 1/4"-20 bolt as the first choice (head 15.0 x
  5.0, thread 10.0 under the head). With a 9.0 mm plate and a 5.4 mm pocket the head
  sits fully inside and the thread stands exactly 6.0 mm proud of the plate''s top
  face — the same as a real quick-release screw. The printed thumbscrew uses the identical
  pocket (5.2 mm knob) and the identical 6.0 mm protrusion, so the two are interchangeable;
  if the printed thread binds even slightly, use the bolt and keep the plastic as
  a spare.


  Numbers to be honest about: your friend''s clamp gave up only "38 mm plate, angled
  lips, knob-tightened, drops in from above", so the 45 degree dovetail and the 9
  mm thickness are assumptions (typical Arca-style plate). The fit_gauge coupon steps
  37.0 / 37.6 / 38.2 mm wide so you can see which width drops in and is gripped; if
  none of the three sits down to the channel floor, the plate is too thick and I need
  that depth. Also, the camera socket is assumed ~6.4 mm deep — if the screw bottoms
  out before the plate feels tight, stop, don''t force it, and trim the printed stud''s
  tip (or shim with tape) rather than drive the metal bolt deeper.


  Use it as a temporary part: carry the tripod by the head, not by the camera, and
  don''t leave it loaded in a hot car (PLA creeps).'
questions:
- text: Is the clamp's channel depth (how thick a plate it will take, from the channel
    floor to the top of the jaw tips) something you can measure now? It is the one
    dimension that decides the plate's thickness, and I had to assume 9 mm.
  answer: null
- text: Which fit_gauge step drops into the jaws and gets gripped - 37.0, 37.6 or
    38.2 mm? If none of them, the dovetail angle assumption (45 deg) is wrong and
    I will change it.
  answer: null
- text: Does the printed thread_gauge stud run into the camera socket by hand without
    binding?
  answer: null
- text: Is the salvaged bolt's head a knurled knob you can turn with your fingers,
    or a hex head needing a spanner? It only changes how you tighten step 6, not the
    fit.
  answer: null
params:
  clamp_plate_width:
    value: 38.0
    unit: mm
    kind: world
    source: measured
    note: the width of plate the tripod head's jaws take, as measured on the borrowed
      tripod's clamp
  clamp_flank_deg:
    value: 45.0
    unit: deg
    kind: world
    source: guessed
    note: the jaws have angled lips but the angle was never measured; 45 deg is the
      common Arca-style dovetail angle. Verified by the fit_gauge coupon
  camera_socket_depth:
    value: 6.4
    unit: mm
    kind: world
    source: guessed
    note: typical depth of a 1/4-20 camera socket; the person could not measure it.
      Used only to check that the 6.0 mm screw protrusion is not excessive
  bolt_head_d:
    value: 15.0
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam-mount bolt, head across
  bolt_head_h:
    value: 5.0
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam-mount bolt, head height
  bolt_thread_len:
    value: 10.0
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam-mount bolt, thread length under the head
  thread_major_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 UNC major diameter (0.25 in)
  thread_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 UNC pitch (20 tpi)
  thread_depth:
    value: 0.65
    unit: mm
    kind: design
    source: design
    note: radial depth of the printed thread (root dia 5.05); truncated crest, not
      a sharp V
  cam_nut_af:
    value: 11.11
    unit: mm
    kind: hardware
    source: catalog
    note: ASME B18.2.2 1/4-20 hex nut across flats; used only as the thread gauge
      in the coupon test
  plate_w_bottom:
    value: 37.6
    unit: mm
    kind: design
    source: design
    note: 0.4 mm under the clamp's measured 38 mm so the tightening knob still has
      something to close up
  plate_len:
    value: 50.0
    unit: mm
    kind: design
    source: design
    note: plate length along the slide direction; typical quick-release plate length
  plate_t:
    value: 9.0
    unit: mm
    kind: design
    source: design
    note: chosen so the salvaged bolt's 5 mm head + 10 mm thread leave 6.0 mm of thread
      above the plate's top face; also a typical dovetail plate thickness
  straight_band_h:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: vertical band at the bottom of the plate before the dovetail taper starts
  pocket_d:
    value: 17.5
    unit: mm
    kind: design
    source: design
    note: 2.5 mm larger than the 15 mm bolt head so it drops in freely and a finger
      tip or coin can reach it
  pocket_depth:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: 0.4 mm more than the 5.0 mm bolt head so the head is pulled up against the
      pocket roof without standing below the plate's clamp-contact face
  screw_hole_d:
    value: 6.9
    unit: mm
    kind: design
    source: design
    note: clearance hole for the 1/4-20 thread (6.35 major), 0.55 mm diametral
  screw_protrusion:
    value: 6.0
    unit: mm
    kind: design
    source: design
    note: thread standing proud of the plate's top face = bolt_head_h + bolt_thread_len
      - plate_t = 5 + 10 - 9
  knob_d:
    value: 16.6
    unit: mm
    kind: design
    source: design
    note: printed thumbscrew knob, fits the 17.5 mm pocket with 0.45 mm all round
  knob_t:
    value: 5.2
    unit: mm
    kind: design
    source: design
    note: 0.2 mm less than the pocket depth so the knob can never stand below the
      plate's clamp-contact face
  stud_len:
    value: 9.8
    unit: mm
    kind: design
    source: design
    note: 'printed 1/4-20 stud from the knob''s top face: 3.8 mm through the plate
      + 6.0 mm protrusion'
  coin_slot_w:
    value: 1.8
    unit: mm
    kind: design
    source: design
    note: coin/screwdriver slot across the knob's underside (crossed slots, so a coin
      always finds one)
  coin_slot_depth:
    value: 2.6
    unit: mm
    kind: design
    source: design
    note: half the knob thickness; leaves 2.6 mm of knob above the slot
  fit_w_lo:
    value: 37.0
    unit: mm
    kind: design
    source: design
    note: coupon step width - narrowest
  fit_w_mid:
    value: 37.6
    unit: mm
    kind: design
    source: design
    note: coupon step width - same as the plate
  fit_w_hi:
    value: 38.2
    unit: mm
    kind: design
    source: design
    note: coupon step width - widest
  fit_sec_len:
    value: 15.0
    unit: mm
    kind: design
    source: design
    note: length of each step on the fit gauge
  gauge_d:
    value: 24.0
    unit: mm
    kind: design
    source: design
    note: thread-gauge coupon handle diameter
  gauge_t:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: thread-gauge coupon handle thickness
  gauge_stud_len:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: length of the printed 1/4-20 stud on the coupon; printed in the same orientation
      as the thumbscrew's stud so the fit test carries over
parts:
- id: plate
  role: final
  material: PLA
  code: "import math\n\n\ndef build(p):\n    W = p.plate_w_bottom\n    L = p.plate_len\n\
    \    T = p.plate_t\n    hb = p.straight_band_h\n    ins = (T - hb) * math.tan(math.radians(p.clamp_flank_deg))\n\
    \    Wt = W - 2.0 * ins\n\n    lower = cq.Workplane(\"XY\").rect(W, L).extrude(hb\
    \ + 0.4)\n    upper = (cq.Workplane(\"XY\", origin=(0.0, 0.0, hb))\n         \
    \    .rect(W, L)\n             .workplane(offset=T - hb)\n             .rect(Wt,\
    \ L)\n             .loft(ruled=True))\n    body = lower.union(upper)\n\n    body\
    \ = body.cut(\n        cq.Workplane(\"XY\").circle(p.pocket_d / 2.0).extrude(p.pocket_depth))\n\
    \    body = body.cut(\n        cq.Workplane(\"XY\").circle(p.screw_hole_d / 2.0).extrude(T\
    \ + 2.0))\n    return body"
  print_orientation: Clamp-contact (bottom) face on the bed, z = 0; camera face up.
    The dovetail flanks taper at 45 deg, so they print unsupported; the screw pocket
    forms a 17.5 mm circular opening that the first solid layers bridge over with
    a 6.9 mm hole in the middle.
  use_orientation: 'As printed: pocket facing down into the clamp channel, top face
    up against the camera''s base. The plate''s dovetail drops between the clamp''s
    angled jaws.'
- id: thumbscrew
  role: final
  material: PLA
  code: "import math\n\n\ndef _stud(p, length, z0):\n    r_maj = p.thread_major_d\
    \ / 2.0\n    r_min = r_maj - p.thread_depth\n    r_in = r_min - 0.4\n    r_mid\
    \ = (r_maj + r_min) / 2.0\n    pitch = p.thread_pitch\n    core = cq.Workplane(\"\
    XY\").circle(r_min).extrude(length)\n    try:\n        path = cq.Workplane(\"\
    XY\").helix(pitch, length, r_mid)\n        prof = (cq.Workplane(\"XZ\")\n    \
    \            .center(r_mid, 0.0)\n                .polyline([(r_in, -0.42 * pitch),\
    \ (r_maj, -0.30 * pitch),\n                           (r_maj, 0.30 * pitch), (r_in,\
    \ 0.42 * pitch)])\n                .close())\n        core = core.union(prof.sweep(path,\
    \ isFrenet=True))\n    except Exception:\n        pass\n    return core.translate((0.0,\
    \ 0.0, z0))\n\n\ndef build(p):\n    knob = cq.Workplane(\"XY\").circle(p.knob_d\
    \ / 2.0).extrude(p.knob_t)\n    slot_z = -0.05\n    s1 = (cq.Workplane(\"XY\"\
    , origin=(0.0, 0.0, slot_z))\n          .box(p.knob_d + 2.0, p.coin_slot_w, p.coin_slot_depth,\n\
    \               centered=(True, True, False)))\n    s2 = (cq.Workplane(\"XY\"\
    , origin=(0.0, 0.0, slot_z))\n          .box(p.coin_slot_w, p.knob_d + 2.0, p.coin_slot_depth,\n\
    \               centered=(True, True, False)))\n    knob = knob.cut(s1).cut(s2)\n\
    \    return knob.union(_stud(p, p.stud_len + 0.5, p.knob_t - 0.5))"
  print_orientation: Knob's underside flat on the bed, z = 0, stud pointing straight
    up (no supports, no bridging; the coin slot prints as a groove in the bed face).
  use_orientation: 'Flipped over relative to the print: knob sits up inside the plate''s
    pocket, stud points up through the plate''s 6.9 mm hole and into the camera''s
    1/4-20 socket.'
- id: fit_gauge
  role: coupon
  material: PLA
  code: "import math\n\n\ndef _section(p, w, length):\n    T = p.plate_t\n    hb =\
    \ p.straight_band_h\n    ins = (T - hb) * math.tan(math.radians(p.clamp_flank_deg))\n\
    \    wt = w - 2.0 * ins\n    lower = cq.Workplane(\"XY\").rect(w, length).extrude(hb\
    \ + 0.4)\n    upper = (cq.Workplane(\"XY\", origin=(0.0, 0.0, hb))\n         \
    \    .rect(w, length)\n             .workplane(offset=T - hb)\n             .rect(wt,\
    \ length)\n             .loft(ruled=True))\n    return lower.union(upper)\n\n\n\
    def build(p):\n    seg = p.fit_sec_len\n    ws = [p.fit_w_lo, p.fit_w_mid, p.fit_w_hi]\n\
    \    out = None\n    for i, w in enumerate(ws):\n        s = _section(p, w, seg\
    \ + 0.6).translate((0.0, (i - 1) * seg, 0.0))\n        out = s if out is None\
    \ else out.union(s)\n    return out"
  print_orientation: 'Exactly like the plate: clamp-contact face on the bed, z = 0,
    taper up.'
  use_orientation: 'Drop each of the three steps into the clamp in turn: 37.0 mm,
    37.6 mm (same as the plate), 38.2 mm. Note which one settles down into the channel
    and is gripped when the knob is tightened.'
- id: thread_gauge
  role: coupon
  material: PLA
  code: "import math\n\n\ndef _stud(p, length, z0):\n    r_maj = p.thread_major_d\
    \ / 2.0\n    r_min = r_maj - p.thread_depth\n    r_in = r_min - 0.4\n    r_mid\
    \ = (r_maj + r_min) / 2.0\n    pitch = p.thread_pitch\n    core = cq.Workplane(\"\
    XY\").circle(r_min).extrude(length)\n    try:\n        path = cq.Workplane(\"\
    XY\").helix(pitch, length, r_mid)\n        prof = (cq.Workplane(\"XZ\")\n    \
    \            .center(r_mid, 0.0)\n                .polyline([(r_in, -0.42 * pitch),\
    \ (r_maj, -0.30 * pitch),\n                           (r_maj, 0.30 * pitch), (r_in,\
    \ 0.42 * pitch)])\n                .close())\n        core = core.union(prof.sweep(path,\
    \ isFrenet=True))\n    except Exception:\n        pass\n    return core.translate((0.0,\
    \ 0.0, z0))\n\n\ndef build(p):\n    disc = cq.Workplane(\"XY\").circle(p.gauge_d\
    \ / 2.0).extrude(p.gauge_t)\n    return disc.union(_stud(p, p.gauge_stud_len +\
    \ 0.5, p.gauge_t - 0.5))"
  print_orientation: Disc flat on the bed, z = 0, stud pointing straight up - the
    same orientation as the thumbscrew's stud, so the fit result carries over.
  use_orientation: Hand piece. Spin the ASME 1/4-20 nut onto the stud, then start
    the stud into the camera's 1/4-20 socket by hand.
hardware:
- id: hw_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
- id: hw_gauge_nut
  ref: ASME B18.2.2 1/4-20
  qty: 1
joints:
- id: j_camera_screw
  fastener: hw_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: screw_pocket
    role: head_seat
  - part: plate
    feature: screw_hole
    role: clearance
  nut: null
  external: the camera's 1/4-20 tripod socket
criteria:
- id: c_pocket_contains_head
  part: plate
  feature: screw_pocket
  relation: contains
  hardware: hw_bolt
  clearance_mm: 1.25
  params:
  - pocket_d
  - bolt_head_d
  check:
    method: template
    ref: pocket_d 17.5 - bolt_head_d 15.0 = 2.5 mm diametral
    description: the salvaged bolt's head drops into the pocket with 1.25 mm all round
- id: c_pocket_seats_head
  part: plate
  feature: screw_pocket
  relation: seats
  hardware: hw_bolt
  clearance_mm: null
  params:
  - pocket_depth
  - bolt_head_h
  check:
    method: measure
    ref: pocket_depth 5.4 vs bolt_head_h 5.0
    description: 0.4 mm of pocket depth spare, so the head is pulled up onto the pocket
      roof and never stands below the clamp-contact face
- id: c_hole_clears_thread
  part: plate
  feature: screw_hole
  relation: clears
  hardware: hw_bolt
  clearance_mm: 0.275
  params:
  - screw_hole_d
  - thread_major_d
  check:
    method: measure
    ref: screw_hole_d 6.9 vs thread_major_d 6.35
    description: the 1/4-20 thread passes through the plate with 0.275 mm all round,
      so the screw can find the camera's socket
- id: c_protrusion
  part: plate
  feature: top_face
  relation: faces
  hardware: hw_bolt
  clearance_mm: null
  params:
  - plate_t
  - bolt_head_h
  - bolt_thread_len
  - screw_protrusion
  - camera_socket_depth
  check:
    method: template
    ref: 5 + 10 - 9 = 6.0 mm
    description: with the bolt's head seated in the pocket, its thread stands 6.0
      mm above the plate's top face; less than the assumed 6.4 mm socket depth so
      it does not bottom out
- id: c_dovetail_fits_clamp
  part: plate
  feature: dovetail_flanks
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - plate_w_bottom
  - clamp_flank_deg
  - plate_t
  - straight_band_h
  check:
    method: coupon
    ref: fit_gauge
    description: the trapezoid cross-section drops between the clamp's angled jaws
      and the knob grips it; the coupon's three steps bracket the plate's width. If
      no step sits down to the channel floor the plate is too thick and the clamp's
      depth is needed
- id: c_print_thread_engages
  part: thumbscrew
  feature: stud_1_4_20
  relation: engages
  hardware: hw_gauge_nut
  clearance_mm: null
  params:
  - thread_major_d
  - thread_pitch
  - thread_depth
  check:
    method: coupon
    ref: thread_gauge
    description: the printed 1/4-20 stud spins into the ASME 1/4-20 nut and starts
      by hand in the camera's socket; if it binds at all, use the salvaged bolt instead
- id: c_knob_never_protrudes
  part: thumbscrew
  feature: knob
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - knob_t
  - pocket_depth
  check:
    method: measure
    ref: knob_t 5.2 vs pocket_depth 5.4
    description: the knob is 0.2 mm thinner than the pocket, so when it is pulled
      up onto the pocket roof nothing stands below the plate's clamp-contact face
- id: c_stud_clears_plate
  part: thumbscrew
  feature: stud_1_4_20
  relation: clears
  hardware: null
  clearance_mm: 0.275
  params:
  - thread_major_d
  - screw_hole_d
  check:
    method: measure
    ref: screw_hole_d 6.9 vs thread_major_d 6.35
    description: the printed stud turns freely through the plate's hole
- id: c_plate_supports_camera
  part: plate
  feature: top_face
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - plate_len
  - plate_t
  check:
    method: none
    ref: null
    description: the 50 x 28.6 mm top face is the camera's bearing surface; a light
      camera balances well inside it
manual:
- n: '1'
  text: Print the two coupons first - a few grams, 15 minutes. Print fit_gauge with
    its clamp-contact face on the bed (exactly like the plate) and thread_gauge with
    the disc down, stud up.
  parts:
  - fit_gauge
  - thread_gauge
  hardware: []
  tool: Bambu Lab X1C, 0.2 mm layers, PLA
- n: '2'
  text: 'Loosen the tripod head''s clamp knob. Drop each of the fit_gauge''s three
    steps into the jaws in turn: 37.0 mm, 37.6 mm (the width the plate uses), 38.2
    mm. Note which one settles down to the channel floor and is held when you tighten
    the knob, and whether the top face ends up flush with or slightly above the jaw
    tips. If none of the three sits down properly, stop and tell me - the plate is
    too thick for your clamp and I need its channel depth.'
  parts:
  - fit_gauge
  hardware: []
  tool: the borrowed tripod head
- n: '3'
  text: Screw the 1/4-20 hex nut onto the thread_gauge's printed stud. It should run
    on with light finger pressure. Then start the stud into your camera's tripod socket
    by hand, 3-4 turns, and feel for smoothness. If it binds, cross-threads or needs
    force, do not push it - use the salvaged bolt for the screw and skip the printed
    thumbscrew.
  parts:
  - thread_gauge
  hardware:
  - hw_gauge_nut
  tool: camera
- n: '4'
  text: 'Print plate and thumbscrew. Plate: printed as oriented, no supports, no brim
    needed. Thumbscrew: printed as oriented, knob down, stud up - check in the slicer
    that a thin coin slot groove appears in the bottom face.'
  parts:
  - plate
  - thumbscrew
  hardware: []
  tool: Bambu Lab X1C, 0.2 mm layers, PLA
- n: '5'
  text: 'Insert the camera screw into the plate from below: drop the salvaged bolt''s
    head into the round pocket so its thread pokes up through the small hole, OR drop
    the printed thumbscrew''s knob into the same pocket, stud up. Either one is now
    captive in the pocket.'
  parts:
  - plate
  - thumbscrew
  hardware:
  - hw_bolt
  tool: null
- n: '6'
  text: 'Hold the plate against the camera''s base, centred, and start the screw into
    the tripod socket by hand. Tighten until the plate stops moving on the camera
    - finger pressure on the bolt''s head, or a coin in the cross slot of the printed
    thumbscrew''s knob. Do not overtighten: you are pulling metal threads into plastic
    and you only need the plate not to spin.'
  parts:
  - plate
  - thumbscrew
  hardware:
  - hw_bolt
  tool: a coin, for the printed thumbscrew
- n: '7'
  text: Drop the assembled plate into the clamp jaws as the fit_gauge showed, slide
    it to roughly balance the camera, and tighten the head's knob. Check for rock
    before you let go.
  parts:
  - plate
  hardware: []
  tool: the borrowed tripod head
- n: '8'
  text: Test with the lightest camera you own first, on a table, not over anything
    breakable. Carry the tripod by its head, never by the camera, and take the camera
    off before packing. If the fit_gauge showed the plate standing proud of the jaws,
    or the camera still rocks, the plate's thickness is the thing to change - that
    is the number I could not get from your friend's tripod.
  parts:
  - plate
  - thumbscrew
  hardware: []
  tool: null
