criteria:
- id: clamp_fit
  part: plate
  feature: side walls, 37.6 mm across with 45 deg top chamfers
  relation: clears
  hardware: null
  clearance_mm: 0.4
  params:
  - clamp_plate_width
  - plate_width
  - dovetail_chamfer
  check:
    method: coupon
    ref: plate_coupon
    description: Coupon slides into the 38 mm clamp without force and is gripped without
      rocking when the lever/knob is closed.
- id: head_press_fit
  part: plate
  feature: bolt head pocket Dia 14.85 x 5.5 deep
  relation: contains
  hardware: bolt
  clearance_mm: -0.15
  params:
  - bolt_head_across
  - bolt_pocket_d
  - bolt_head_h
  - bolt_pocket_depth
  check:
    method: measure
    ref: null
    description: Measured head (15.0 across, 5.0 tall) presses into the pocket, ends
      up about 0.5 mm above the bottom face, and does not spin freely.
- id: thread_protrusion
  part: plate
  feature: 1/4-20 thread standing 4.5 mm above the top face
  relation: engages
  hardware: bolt
  clearance_mm: 1.0
  params:
  - bolt_thread_len
  - bolt_pocket_depth
  - plate_thickness
  - thread_protrusion
  - camera_socket_depth
  check:
    method: measure
    ref: null
    description: Thread stick-out of 4.5 mm is less than the camera's socket depth,
      so the bolt cannot bottom out and leave the camera loose.
- id: clamp_floor_seat
  part: plate
  feature: flat bottom face, bolt head recessed 0.5 mm above it
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - bolt_pocket_depth
  - bolt_head_h
  check:
    method: none
    ref: null
    description: Nothing protrudes below the bottom face, so the plate sits flat on
      the clamp floor instead of rocking on the bolt head.
- id: coupon_matches_plate
  part: plate_coupon
  feature: cross-section (width, thickness, chamfer, pocket)
  relation: contains
  hardware: null
  clearance_mm: null
  params:
  - plate_width
  - plate_thickness
  - dovetail_chamfer
  - coupon_len
  check:
    method: coupon
    ref: null
    description: Coupon is a 12 mm slice of the plate, so a fit that works on the
      coupon works on the plate.
manual:
- n: '1'
  text: Print the test coupon (plate_coupon). PLA, 0.2 mm layers, 4 walls, 40% infill,
    no supports, flat on its bottom face.
  parts:
  - plate_coupon
  hardware: []
  tool: Bambu Lab X1C
- n: '2'
  text: Open the tripod clamp and slide the coupon in until it butts the stop, then
    close the lever/knob. It should slide in without force and be held firmly with
    no rocking and no lift. If it won't go in, sand the two side faces a little. If
    it's loose, say so and roughly how much it moves before you print the plate.
  parts:
  - plate_coupon
  hardware: []
  tool: null
- n: '3'
  text: 'Press the salvaged bolt into the coupon from the bottom: push the head into
    the round pocket until it stops. This is a 0.15 mm press fit, so press it in a
    bench vice or against a table edge. It should end up slightly recessed and must
    not turn easily. If the PLA splits, stop and report back.'
  parts:
  - plate_coupon
  hardware:
  - bolt
  tool: vice or table edge
- n: '4'
  text: 'Print the plate (plate). Same settings as the coupon: 0.2 mm layers, 4 walls,
    40% infill, no supports, flat on its bottom face.'
  parts:
  - plate
  hardware: []
  tool: Bambu Lab X1C
- n: '5'
  text: Press the bolt head into the plate's underside pocket the same way you did
    on the coupon. The head finishes about 0.5 mm up inside the pocket, so nothing
    sticks out past the flat bottom face.
  parts:
  - plate
  hardware:
  - bolt
  tool: vice or table edge
- n: '6'
  text: Hold the plate in one hand and spin the camera onto the 4.5 mm of thread sticking
    out of the top face. Tighten by hand until the camera's base is flat and firm
    on the plate. If the camera still turns when you've tightened it, the thread is
    bottoming out in its socket - tell me and I'll thin the plate.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '7'
  text: If the plate is longer than your clamp's slot, cut or sand the rear end shorter,
    but keep at least 35 mm so the jaws still have something to grip. Deburr the cut
    end.
  parts:
  - plate
  hardware: []
  tool: hacksaw and sandpaper
- n: '8'
  text: Slide the plate into the clamp from the open end, camera up, until it seats
    against the stop, then close the clamp and check the camera cannot be rocked by
    hand.
  parts:
  - plate
  hardware: []
  tool: null
- n: '9'
  text: 'Use it as a temporary mount only. PLA creeps under load and softens in a
    warm car: keep the camera''s own strap around your neck or the tripod, take the
    camera off between shots, and don''t carry the tripod by the camera or the plate.'
  parts:
  - plate
  hardware: []
  tool: null
