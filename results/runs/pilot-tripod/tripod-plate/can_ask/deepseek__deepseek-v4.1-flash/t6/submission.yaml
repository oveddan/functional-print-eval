parts:
- id: plate
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    plate = (cq.Workplane(\"XY\")\n             .box(p.plate_width,\
    \ p.plate_length, p.plate_thickness,\n                  centered=(True, True,\
    \ False)))\n    # 45 degree dovetail chamfers on the two top edges running along\
    \ the slide axis\n    plate = plate.edges(\"|Y\").edges(\">Z\").chamfer(p.dovetail_chamfer)\n\
    \    # through hole for the 1/4-20 bolt shank\n    plate = plate.faces(\">Z\"\
    ).workplane().hole(p.shank_hole_d)\n    # pocket for the bolt head, open downwards\
    \ towards the clamp floor\n    pocket = (cq.Workplane(\"XY\")\n              .circle(p.bolt_pocket_d\
    \ / 2.0)\n              .extrude(p.bolt_pocket_depth))\n    plate = plate.cut(pocket)\n\
    \    # lead-in chamfer at the pocket mouth for pressing the head in\n    lead\
    \ = cq.Solid.makeCone(p.bolt_pocket_d / 2.0 + p.pocket_lead_in,\n            \
    \                 p.bolt_pocket_d / 2.0,\n                             p.pocket_lead_in)\n\
    \    plate = plate.cut(lead)\n    return plate"
  print_orientation: 'Bottom face (the face that rests on the clamp floor) on the
    bed, dovetail chamfers facing up. No supports: the 45 degree chamfers and the
    vertical bolt hole and pocket all print cleanly.'
  use_orientation: Slides into the tripod's 38 mm clamp, flat bottom face down on
    the clamp floor, camera on the top face with the salvaged 1/4-20 bolt through
    the centre.
- id: plate_coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    c = (cq.Workplane(\"XY\")\n         .box(p.plate_width,\
    \ p.coupon_len, p.plate_thickness,\n              centered=(True, True, False)))\n\
    \    c = c.edges(\"|Y\").edges(\">Z\").chamfer(p.dovetail_chamfer)\n    c = c.faces(\"\
    >Z\").workplane().hole(p.shank_hole_d)\n    pocket = (cq.Workplane(\"XY\")\n \
    \             .circle(p.bolt_pocket_d / 2.0)\n              .extrude(p.bolt_pocket_depth))\n\
    \    c = c.cut(pocket)\n    lead = cq.Solid.makeCone(p.bolt_pocket_d / 2.0 + p.pocket_lead_in,\n\
    \                             p.bolt_pocket_d / 2.0,\n                       \
    \      p.pocket_lead_in)\n    c = c.cut(lead)\n    return c"
  print_orientation: 'Same as the plate: flat bottom face on the bed, chamfers up,
    no supports.'
  use_orientation: 'Throwaway test piece: slid into the clamp to check the 37.6 x
    11 mm cross-section, and used to test that the bolt head presses into the pocket.'
