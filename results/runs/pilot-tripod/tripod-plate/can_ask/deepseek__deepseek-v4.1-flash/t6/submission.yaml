task: tripod-plate
note: 'Quick answer to "how hard is it": the flat part is easy — it''s one flat slab
  with a chamfered top edge and a stepped hole, no supports, prints in ~40 minutes.
  The part that screws in is the one to be careful with: a printed 1/4-20 thread in
  PLA holding a camera cantilevered off a tripod is the weak link, so I deliberately
  did NOT model a printed screw. Instead the plate takes your salvaged webcam 1/4-20
  bolt as a captive screw, pressed into a pocket on the underside. That also means
  the thread that carries the load is steel in the camera''s own metal socket.


  How it works: the plate''s bottom face sits on the clamp floor, the two top edges
  are chamfered 45 degrees to form the 38 mm dovetail, and the camera sits on the
  11 mm-high top face with 4.5 mm of bolt thread going into it.


  Two risks I could not measure away, both handled with a coupon:

  1) The clamp''s jaw angle/height are unknown, so the dovetail is the standard 38
  mm / 45 degrees / 3 mm chamfer shape. Print the 12 mm coupon first and slide it
  in; if it doesn''t fit you''ve lost 5 minutes of plastic, not the whole plate.

  2) Your camera''s socket depth is unknown. The bolt sticks out 4.5 mm, under the
  ~5.5 mm typical minimum, so it should not bottom out. If your camera still spins
  when the plate is tight, the socket is shallower than that and you should report
  back.


  PLA creeps under sustained load and softens in a warm car — this is a temporary
  part, so the manual ends with keeping the camera''s strap on.'
questions:
- text: How deep is the 1/4-20 socket in the bottom of your camera, in mm? (Needed
    to confirm the 4.5 mm of bolt thread sticking out of the plate doesn't bottom
    out.)
  answer: null
- text: Does your camera still turn freely once the plate is hand-tight on it?
  answer: null
