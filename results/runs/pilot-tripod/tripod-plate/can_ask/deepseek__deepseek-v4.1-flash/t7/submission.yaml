manual:
- n: '1'
  text: Print the COUPON first (20 mm slice of the plate's cross-section, same profile
    and same pocket). Same PLA, 0.2 mm layers, flat face on the bed, no supports.
    About 10 minutes.
  parts:
  - coupon
  hardware: []
  tool: printer
- n: '2'
  text: Back the borrowed clamp's tightening screw all the way off and slide the coupon
    into the slot from the end. It must enter with light finger pressure (37 mm against
    a 38 mm opening) and then clamp. If it jams, or if the screw will not close on
    it, stop and tell me the number - do not print the plate.
  parts:
  - coupon
  hardware: []
  tool: null
- n: '3'
  text: 'Look at the salvaged bolt: confirm the thread runs all the way to the underside
    of the head, with no long plain shank. If it is a shoulder bolt, stop and tell
    me.'
  parts: []
  hardware:
  - bolt
  tool: null
- n: '4'
  text: Press the bolt, thread first, into the coupon's round pocket on the flat side.
    Firm thumb pressure; the four ribs should bite so that twisting the coupon twists
    the bolt, and the head should end flush or just below the face. If it spins freely
    or the head stands proud, tell me before printing the plate.
  parts:
  - coupon
  hardware:
  - bolt
  tool: null
- n: '5'
  text: Print the PLATE. Same settings, flat camera-contact face on the bed, no supports.
    50 x 37 x 10 mm.
  parts:
  - plate
  hardware: []
  tool: printer
- n: '6'
  text: Press the bolt into the plate's pocket exactly as you did on the coupon, until
    the head sits below the clamp-side face. The plate now hangs on the bolt and the
    two turn as one.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '7'
  text: Hold the camera upside down, present the bolt to the 1/4-20 socket and twist
    the plate clockwise until the flat face comes up snug against the camera base.
    Hand-tight only. It should come up solid with no rocking; if the bolt stops before
    the plate touches the camera, stop - the socket is shallower than standard.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '8'
  text: Slide the plate into the clamp from the end of the slot, camera up, and tighten
    the clamp screw. Before letting go, tug the camera gently and rock it - the plate
    should not lift or shift in the jaws.
  parts:
  - plate
  hardware: []
  tool: null
- n: '9'
  text: 'Temporary-mount rules: PLA creeps under steady load and softens in heat,
    so do not leave the camera hanging unattended, keep it out of a hot car, and re-check
    the clamp screw each session. To take the camera off, twist the plate off the
    camera - the bolt stays with the camera and the plate slips off its head.'
  parts:
  - plate
  - coupon
  hardware:
  - bolt
  tool: null
