task: tripod-plate
note: 'Verdict: easy part and hard part. The flat plate is a 20-minute print. The
  screw should not be printed — a PLA 1/4"-20 thread screwed in and out of a metal
  camera socket wears and strips within a few cycles, and it is the one joint holding
  your camera. So the salvaged 1/4"-20 webcam bolt is the screw, and the printed plate
  is the flange.


  How it goes together: the bolt is captive in the plate. Its 15 mm head drops into
  a Ø15.6 pocket in the plate''s clamp-side face and is gripped by four press-fit
  rib pins, so plate and bolt turn as one. You screw the whole plate onto the camera
  by twisting it, until the 31 x 50 mm flat face comes up snug against the camera
  base. The bolt head then sits 0.3 mm below the clamp-side face, i.e. recessed and
  out of the way, and the plate hangs on it. Then the plate slides into the borrowed
  clamp like the original.


  Two things I had to hedge, because all I could get off the clamp was "38 mm plate
  width":

  1. Jaw shape. A real Arca-type clamp grips 45-degree dovetail shoulders; a cheap
  clamp is often just a straight 38 mm slot. The profile here is 45-degree chamfered
  on BOTH the top and bottom shoulders, so it seats in either kind of jaw, and it
  is 37.0 mm at its widest so it always enters. The 20 mm coupon is exactly this cross-section
  — slide it in and prove it before you print or trust the full plate.

  2. Bolt protrusion. The bolt has only 10 mm of shank under the head, so the plate
  eats most of it. I set the web at 4.7 mm, leaving 5.3 mm proud of the camera face
  — that matches a standard tripod screw (~5.6 mm), so it should not bottom out before
  the plate seats. If your camera''s socket is unusually shallow you will feel the
  bolt stop early; tell me and I will thicken the web.


  Also: check the salvaged bolt for a long unthreaded shank under the head. If it
  is a shoulder bolt rather than threaded-to-head, the web needs to be thinner and
  I would re-cut it. And PLA creeps and softens, so this is a temporary mount: no
  hot cars, and don''t leave the camera hanging unattended.


  If the clamp turns out to be a head with its own 1/4"-20 stud rather than a slot,
  you need none of this — screw the camera straight onto the stud.'
questions: []
params:
  clamp_plate_width:
    value: 38.0
    unit: mm
    kind: world
    source: measured
    note: width of plate the borrowed tripod's clamp takes, as reported
  plate_w_max:
    value: 37.0
    unit: mm
    kind: design
    source: design
    note: clamp_plate_width minus 1.0 total (0.5 per side) so it enters freely; the
      clamp's tightening screw takes up the slack
  plate_w_face:
    value: 31.0
    unit: mm
    kind: design
    source: design
    note: flat camera-contact face; 45 deg shoulders flare from it out to plate_w_max
      and back in at the clamp face
  plate_t:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: total thickness; common for plates of this family, and thin enough that
      the 5.3 mm bolt protrusion is right
  plate_len:
    value: 50.0
    unit: mm
    kind: design
    source: design
    note: along the clamp's slide axis
  coupon_len:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: test slice of the same cross-section
  head_d:
    value: 15.0
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam bolt head across
  head_h:
    value: 5.0
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam bolt head height
  shank_len:
    value: 10.0
    unit: mm
    kind: hardware
    source: measured
    note: threaded length under the head; this is the tight constraint
  pocket_d:
    value: 15.6
    unit: mm
    kind: design
    source: design
    note: head_d + 0.6 so the head drops in
  pocket_depth:
    value: 5.3
    unit: mm
    kind: design
    source: design
    note: head_h + 0.3, so the head ends 0.3 mm below the clamp-side face
  web_t:
    value: 4.7
    unit: mm
    kind: design
    source: design
    note: plate_t - pocket_depth; the material the shank passes through
  bolt_protrusion:
    value: 5.3
    unit: mm
    kind: design
    source: design
    note: shank_len - web_t; matches the ~5.6 mm thread of a standard tripod screw
      so it should not bottom out
  shank_hole_d:
    value: 6.6
    unit: mm
    kind: design
    source: design
    note: 1/4 in = 6.35 mm plus 0.25 clearance
  rib_d:
    value: 1.6
    unit: mm
    kind: design
    source: design
    note: diameter of each press-fit rib pin
  rib_tip_d:
    value: 14.6
    unit: mm
    kind: design
    source: design
    note: circle through the four rib tips = head_d - 0.4, i.e. 0.2 mm press per side
      so twisting the plate drives the bolt
  mouth_chamfer:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: lead-in at the pocket mouth
  camera_screw_engagement:
    value: 5.6
    unit: mm
    kind: world
    source: datasheet
    note: approximate thread length of a standard 1/4-20 tripod screw (ISO 1222);
      used as the target for bolt_protrusion
parts:
- id: plate
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    W = p.plate_w_max\n    Wf = p.plate_w_face\n\
    \    T = p.plate_t\n    L = p.plate_len\n    c = (W - Wf) / 2.0\n    pts = [(-Wf/2.0,\
    \ 0.0), (Wf/2.0, 0.0), (W/2.0, c), (W/2.0, T-c),\n           (Wf/2.0, T), (-Wf/2.0,\
    \ T), (-W/2.0, T-c), (-W/2.0, c)]\n    body = cq.Workplane(\"YZ\").polyline(pts).close().extrude(L)\n\
    \    body = body.translate((-L/2.0, 0, 0))\n\n    zf = T - p.pocket_depth\n  \
    \  pr = p.pocket_d / 2.0\n\n    # bolt-head pocket, open at the clamp-side face\
    \ (z = T)\n    body = body.cut(cq.Workplane(\"XY\").workplane(offset=zf).circle(pr).extrude(p.pocket_depth\
    \ + 1.0))\n\n    # lead-in chamfer at the pocket mouth\n    cone = cq.Solid.makeCone(pr,\
    \ pr + p.mouth_chamfer, p.mouth_chamfer,\n                             cq.Vector(0,\
    \ 0, T - p.mouth_chamfer), cq.Vector(0, 0, 1))\n    body = body.cut(cq.Workplane(obj=cone))\n\
    \n    # four press-fit ribs that grip the bolt head\n    rc = p.rib_tip_d / 2.0\
    \ + p.rib_d / 2.0\n    rh = p.pocket_depth - 1.4\n    for a in (0.0, 90.0, 180.0,\
    \ 270.0):\n        ang = math.radians(a)\n        pin = cq.Solid.makeCylinder(p.rib_d\
    \ / 2.0, rh,\n                                    cq.Vector(rc*math.cos(ang),\
    \ rc*math.sin(ang), T - 1.0 - rh),\n                                    cq.Vector(0,\
    \ 0, 1))\n        body = body.union(cq.Workplane(obj=pin))\n\n    # shank clearance\
    \ hole through the web\n    body = body.cut(cq.Workplane(\"XY\").workplane(offset=-1.0)\n\
    \                    .circle(p.shank_hole_d/2.0).extrude(zf + 2.0))\n    return\
    \ body\n"
  print_orientation: flat camera-contact face down on the bed at z = 0; the part grows
    upward to the clamp-side face at z = 10, with the bolt-head pocket open at the
    top
  use_orientation: 'flipped over: clamp-side face (with the pocket and the bolt head)
    down toward the tripod head, flat 31 x 50 mm camera-contact face up against the
    camera base'
- id: coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    W = p.plate_w_max\n    Wf = p.plate_w_face\n\
    \    T = p.plate_t\n    L = p.coupon_len\n    c = (W - Wf) / 2.0\n    pts = [(-Wf/2.0,\
    \ 0.0), (Wf/2.0, 0.0), (W/2.0, c), (W/2.0, T-c),\n           (Wf/2.0, T), (-Wf/2.0,\
    \ T), (-W/2.0, T-c), (-W/2.0, c)]\n    body = cq.Workplane(\"YZ\").polyline(pts).close().extrude(L)\n\
    \    body = body.translate((-L/2.0, 0, 0))\n\n    zf = T - p.pocket_depth\n  \
    \  pr = p.pocket_d / 2.0\n\n    body = body.cut(cq.Workplane(\"XY\").workplane(offset=zf).circle(pr).extrude(p.pocket_depth\
    \ + 1.0))\n\n    cone = cq.Solid.makeCone(pr, pr + p.mouth_chamfer, p.mouth_chamfer,\n\
    \                             cq.Vector(0, 0, T - p.mouth_chamfer), cq.Vector(0,\
    \ 0, 1))\n    body = body.cut(cq.Workplane(obj=cone))\n\n    rc = p.rib_tip_d\
    \ / 2.0 + p.rib_d / 2.0\n    rh = p.pocket_depth - 1.4\n    for a in (0.0, 90.0,\
    \ 180.0, 270.0):\n        ang = math.radians(a)\n        pin = cq.Solid.makeCylinder(p.rib_d\
    \ / 2.0, rh,\n                                    cq.Vector(rc*math.cos(ang),\
    \ rc*math.sin(ang), T - 1.0 - rh),\n                                    cq.Vector(0,\
    \ 0, 1))\n        body = body.union(cq.Workplane(obj=pin))\n\n    body = body.cut(cq.Workplane(\"\
    XY\").workplane(offset=-1.0)\n                    .circle(p.shank_hole_d/2.0).extrude(zf\
    \ + 2.0))\n    return body\n"
  print_orientation: 'same as the plate: flat camera-contact face down on the bed
    at z = 0, pocket open upward'
  use_orientation: slide into the borrowed clamp like the plate, then use it to test
    the bolt's press-fit
