task: tripod-plate
note: 'Short version of your question: the flat part is easy to print — the screw
  is the part you should NOT print.


  Your clamp takes a 38 mm plate and grips it with angled (45°) jaws, which is the
  Arca-Swiss pattern. So the plate is a 40 x 38 x 10 mm dovetail: 38 mm across the
  top so it wedges into the jaws, tapering at 45° down to a 26 mm foot that sits on
  the clamp floor. It drops in from above and the knob bites the flanks.


  For "the part that screws in" you already own the right part — the salvaged 1/4-20
  webcam bolt. Its 10 mm of thread under a 15 x 5 mm head is exactly what a tripod
  screw is, in steel. A printed 1/4-20 screw would be a PLA thread going into a steel
  socket: it strips on the first good tightening, and a stripped thread means a dropped
  camera. So the plate is sized around that bolt instead: the plate is 10 mm thick,
  with a 16 mm counterbore 5 mm deep on the underside. The bolt''s head drops in and
  sits flush with the underside (so the plate still sits flat on the clamp floor),
  leaving 5 mm of thread standing proud of the contact face — enough to hold the camera
  and short enough not to bottom out in a shallow socket.


  Two things I could not pin down, both worth a sanity check: the height of the jaws''
  angled faces, and how deep your camera''s socket is. If the coupon step says the
  dovetail is loose, tell me and I will re-cut the flanks. Everything is designed
  to be checked by the coupon before you spend time on the plate.


  Reality check: this is a temporary part. PLA creeps under steady load and softens
  in a hot car, and the clamp load goes through the printed flank. Don''t carry the
  tripod with the camera attached, and keep a hand on the camera whenever the clamp
  knob is loose.'
questions:
- text: How deep is your camera's 1/4-20 socket? I assumed 6.5 mm and left 5 mm of
    thread proud — if the socket is shallower than 5 mm the bolt will bottom out before
    the plate seats.
  answer: null
- text: What is on the flat face of the salvaged bolt's head, looking up from underneath
    — a slot, a hex socket, or plain? A slot means you can tighten it through the
    16 mm opening with a coin instead of turning the camera.
  answer: null
- text: The clamp's jaw face height and floor-level width never came back. If the
    coupon is loose in the jaws (or will not drop in), tell me and I will re-cut the
    45 degree flanks — that is the one dimension I had to infer from the Arca-Swiss
    standard.
  answer: null
params:
  plate_w_top:
    value: 38.0
    unit: mm
    kind: world
    source: measured
    note: the width of plate the clamp takes — its dovetail opening; Arca-Swiss standard
  plate_len:
    value: 40.0
    unit: mm
    kind: design
    source: design
    note: plate length along the slide direction; kept modest so it drops in and out
      of any channel
  plate_t:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: total thickness; set so the bolt head sits flush and 5 mm of thread is left
      proud
  dv_h:
    value: 6.0
    unit: mm
    kind: design
    source: design
    note: height of the 45 degree dovetail flanks. The jaws had to close to about
      this height to touch a standard plate; validated by the coupon
  dv_w_bot:
    value: 26.0
    unit: mm
    kind: design
    source: design
    note: width of the foot that sits on the clamp floor = 38 - 2 x 6 (45 degrees)
  bolt_head_d:
    value: 15.0
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam bolt head, across
  bolt_head_h:
    value: 5.0
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam bolt head height
  bolt_thread_l:
    value: 10.0
    unit: mm
    kind: hardware
    source: measured
    note: thread length under the head of the salvaged webcam bolt
  bolt_shank_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 major diameter, 1/4 in = 6.35 mm
  cb_d:
    value: 16.0
    unit: mm
    kind: design
    source: design
    note: counterbore for the bolt head = head 15.0 + 1.0 clearance, so a slightly-oversize
      head still drops in
  cb_depth:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: equals the head height, so the head lands flush with the tripod-side face
  shank_hole_d:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: clearance hole for the 6.35 mm thread, 0.65 mm total clearance
  thread_proud:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: thread standing proud of the contact face = 5 (counterbore) + 10 (thread)
      - 10 (thickness). Enough grip, short enough not to bottom out
  socket_depth:
    value: 6.5
    unit: mm
    kind: world
    source: guessed
    note: assumed usable depth of the camera's 1/4-20 socket; the bolt only needs
      5.0
  grip_recess_d:
    value: 24.0
    unit: mm
    kind: design
    source: design
    note: shallow recess in the contact face for a rubber pad or tape, to stop the
      camera spinning
  grip_recess_z:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: recess depth; 3 layers
  coupon_len:
    value: 30.0
    unit: mm
    kind: design
    source: design
    note: length of the fit-test coupon
parts:
- id: plate
  role: final
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    W = p.plate_w_top\n    L = p.plate_len\n\
    \    T = p.plate_t\n    dvh = p.dv_h\n    dvw = p.dv_w_bot\n    cb_z = T - p.cb_depth\n\
    \n    # cross-section (x = width, y = height), extruded to length\n    prof =\
    \ (cq.Workplane(\"XY\")\n            .polyline([(-W / 2.0, 0.0), (W / 2.0, 0.0),\n\
    \                       (W / 2.0, T - dvh), (dvw / 2.0, T),\n                \
    \       (-dvw / 2.0, T), (-W / 2.0, T - dvh)])\n            .close())\n    s =\
    \ prof.extrude(L).rotate((0, 0, 0), (1, 0, 0), 90).translate((0, -L / 2.0, 0))\n\
    \n    # bolt head counterbore, opening at the tripod-side face (top of the print)\n\
    \    s = s.cut(cq.Workplane(\"XY\").workplane(offset=cb_z)\n              .circle(p.cb_d\
    \ / 2.0).extrude(T - cb_z + 1.0))\n    # shank clearance hole, opening at the\
    \ contact face (the bed)\n    s = s.cut(cq.Workplane(\"XY\").workplane(offset=-1.0)\n\
    \              .circle(p.shank_hole_d / 2.0).extrude(cb_z + 1.0))\n    # shallow\
    \ grip recess in the contact face\n    s = s.cut(cq.Workplane(\"XY\").workplane(offset=-1.0)\n\
    \              .circle(p.grip_recess_d / 2.0).extrude(p.grip_recess_z + 1.0))\n\
    \    return s"
  print_orientation: 'Camera-contact face on the bed (z = 0). The part only gets narrower
    as it rises: the 38 mm flanks taper in at 45 degrees, and the bolt counterbore
    opens at the top of the print, so there are no overhangs and no supports. Only
    the shallow 24 mm grip recess forms a short bridge, well inside the 50 mm limit.'
  use_orientation: Contact face up against the camera's base. The 26 mm foot goes
    down onto the clamp floor with the 45 degree flanks wedging into the jaws. The
    bolt head sits flush in the 16 mm counterbore on the underside, its thread passing
    up through the 7 mm hole and out of the contact face into the camera.
- id: coupon
  role: coupon
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    W = p.plate_w_top\n    T = p.plate_t\n\
    \    dvh = p.dv_h\n    dvw = p.dv_w_bot\n    L = p.coupon_len\n    cb_z = T -\
    \ p.cb_depth\n\n    prof = (cq.Workplane(\"XY\")\n            .polyline([(-W /\
    \ 2.0, 0.0), (W / 2.0, 0.0),\n                       (W / 2.0, T - dvh), (dvw\
    \ / 2.0, T),\n                       (-dvw / 2.0, T), (-W / 2.0, T - dvh)])\n\
    \            .close())\n    s = prof.extrude(L).rotate((0, 0, 0), (1, 0, 0), 90).translate((0,\
    \ -L / 2.0, 0))\n\n    s = s.cut(cq.Workplane(\"XY\").workplane(offset=cb_z)\n\
    \              .circle(p.cb_d / 2.0).extrude(T - cb_z + 1.0))\n    s = s.cut(cq.Workplane(\"\
    XY\").workplane(offset=-1.0)\n              .circle(p.shank_hole_d / 2.0).extrude(cb_z\
    \ + 1.0))\n    return s"
  print_orientation: 'Same as the plate: contact face on the bed, no supports. It
    is a 30 mm slice of the plate''s exact cross-section, so if it fits the clamp
    the plate will.'
  use_orientation: A gauge, not a functional part. Drop it into the clamp jaws to
    test the dovetail, and push the salvaged bolt through it to test the head pocket
    and the 5 mm of proud thread.
hardware:
- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_screw
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 10.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: plate
    feature: bolt counterbore, 16 mm dia x 5 mm deep, opening at the tripod-side face
    role: head_seat
  - part: plate
    feature: shank clearance hole, 7 mm dia, through the contact face
    role: clearance
  nut: null
  external: camera 1/4-20 tripod socket
criteria:
- id: c1_head_pocket
  part: plate
  feature: 16 mm dia x 5 mm deep counterbore in the tripod-side face
  relation: contains
  hardware: bolt
  clearance_mm: 1.0
  params:
  - cb_d
  - cb_depth
  - bolt_head_d
  - bolt_head_h
  check:
    method: coupon
    ref: coupon
    description: push the bolt through the coupon from the narrow side; the 15 mm
      head must drop into the pocket and land flush with the tripod-side face. If
      it binds, open the pocket with a round file.
- id: c2_shank_clear
  part: plate
  feature: 7 mm dia shank hole through the contact face
  relation: clears
  hardware: bolt
  clearance_mm: 0.65
  params:
  - shank_hole_d
  - bolt_shank_d
  check:
    method: coupon
    ref: coupon
    description: the thread should pass through without biting
- id: c3_dovetail_fit
  part: plate
  feature: '45 degree dovetail flanks: 38 mm across the top, 26 mm foot, 6 mm flank
    height'
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - plate_w_top
  - dv_h
  - dv_w_bot
  check:
    method: coupon
    ref: coupon
    description: loosen the clamp knob, drop the coupon between the jaws, tighten.
      It must wedge down onto the clamp floor and not rock. If it is loose, the jaws
      are shorter than assumed and the flanks need re-cutting.
- id: c4_thread_engagement
  part: plate
  feature: 5 mm of bolt thread standing proud of the contact face
  relation: engages
  hardware: bolt
  clearance_mm: null
  params:
  - thread_proud
  - socket_depth
  - cb_depth
  - bolt_thread_l
  - plate_t
  check:
    method: coupon
    ref: coupon
    description: with the head flush in the coupon, about 5 mm of thread should stand
      proud; the camera socket must be at least this deep
- id: c5_camera_seat
  part: plate
  feature: flat 38 x 40 mm contact face with the 24 mm grip recess
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - plate_w_top
  - plate_len
  - grip_recess_d
  - grip_recess_z
  check:
    method: none
    ref: null
    description: ''
- id: c6_plate_thickness
  part: plate
  feature: 10 mm overall thickness against the clamp channel
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - plate_t
  check:
    method: coupon
    ref: coupon
    description: the coupon is the same thickness, so if it bottoms out in the channel
      the plate will too
manual:
- n: '1'
  text: 'Print the coupon exactly as modelled: contact face on the bed, 0.2 mm layers,
    no supports. It is a 20-minute print and it answers every open question about
    fit.'
  parts:
  - coupon
  hardware: []
  tool: null
- n: '2'
  text: Loosen the tripod clamp's knob and drop the coupon between the jaws, then
    tighten the knob. It should wedge down and sit solid, with the angled jaw faces
    biting the 45 degree flanks and no rocking. Note how much knob travel is left.
  parts:
  - coupon
  hardware: []
  tool: the clamp's knob
- n: '3'
  text: Push the salvaged bolt, thread first, up through the coupon from its narrow
    (tripod) side. The 15 mm head should drop into the 16 mm pocket and sit flush
    with that face, and about 5 mm of thread should stand proud of the flat contact
    face. If the head binds, open the pocket with a round file — do not force it in
    and do not hammer it.
  parts:
  - coupon
  hardware:
  - bolt
  tool: null
- n: '4'
  text: If both checks passed, print the plate. Nothing needs changing.
  parts:
  - plate
  hardware: []
  tool: null
- n: '5'
  text: 'Optional but worth it: cut a 24 mm disc from a bicycle inner tube or a scrap
    of shelf liner, or a square of double-sided tape, and drop it into the shallow
    24 mm recess in the contact face. This is the only thing stopping the camera spinning
    itself loose off the plate.'
  parts:
  - plate
  hardware: []
  tool: null
- n: '6'
  text: Slide the bolt up through the plate from the tripod side. The head sits flush
    in the counterbore with the thread sticking out of the contact face.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '7'
  text: Hold the plate contact face up in one hand with your thumb pressed on the
    bolt head, and screw the camera down onto the protruding thread. Turn the camera,
    not the plate. Finger-tight only — the plate is 10 mm of PLA and the thread is
    going into metal.
  parts:
  - plate
  hardware:
  - bolt
  tool: your hands
- n: '8'
  text: Loosen the clamp knob, drop the plate (camera and all) down between the jaws
    so the dovetail lands on the clamp floor, and tighten the knob firmly. Check that
    the camera does not rock and the plate does not slide.
  parts:
  - plate
  hardware: []
  tool: the clamp's knob
- n: '9'
  text: 'Every time you use it: keep one hand on the camera while the knob is loose,
    and never carry the tripod with the camera attached. PLA relaxes under steady
    load and softens in a hot car or direct sun, and the whole clamp load passes through
    a printed flank. This is a stopgap until you find the real plate.'
  parts:
  - plate
  - coupon
  hardware: []
  tool: null
