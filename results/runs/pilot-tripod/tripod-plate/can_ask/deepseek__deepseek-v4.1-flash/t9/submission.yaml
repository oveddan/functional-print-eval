task: tripod-plate
note: 'Short answer: printing the flat plate is easy and works fine; printing the
  screw is the part I would not trust long-term. So the design does both — the plate
  takes your salvaged 1/4"-20 webcam bolt (which is a real metal screw, exactly what
  the plate wants), and a printed PLA thumbscrew is included as a spare so you can
  still use the plate if you ever lose the bolt. A small coupon is included to test
  the two fits that actually matter (the bolt''s thread through the plate, the bolt''s
  head in its pocket, and the printed thread) before you commit to printing the real
  parts.


  Geometry in one line: the plate is 37.6 x 38 x 9.7 mm. The bolt''s head (15 dia
  x 5) sits in a 16.6 dia x 5.5 deep pocket in the plate''s underside, so it hides
  0.5 mm inside the plate and the plate still sits flat on the tripod head. A 16.6
  mm wide window is cut from that pocket out to one end face, which is how you reach
  the head to turn it — finger or thumbnail on the head''s rim through the window.
  The thread passes through a 6.9 mm hole and stands 5.8 mm proud of the plate''s
  camera face (a standard tripod screw sticks out about 5.5 mm).'
questions:
- text: How deep is the plate recess in the tripod head, and how long a plate does
    it take front to back? The plate is 9.7 mm thick and 38 mm long because I could
    not measure these.
  answer: null
- text: How deep is the threaded socket in the camera's base? The screw is set to
    stick out 5.8 mm, which suits the usual ~6.5 mm socket, but a shallow one would
    need a thinner plate.
  answer: null
- text: Is the webcam bolt's head a round knurled knob with a flat underside (what
    I assumed, since it must sit flat on the pocket floor), or is it a hex or dome
    head? A dome head would need a different pocket.
  answer: null
- text: Does the tripod head hold the plate with a side clamp screw or lever, or is
    the plate held by lips/dovetail over the top of it? Only a side clamp was assumed.
  answer: null
