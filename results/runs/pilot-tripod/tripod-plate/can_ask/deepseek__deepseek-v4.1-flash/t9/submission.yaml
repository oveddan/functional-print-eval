parts:
- id: plate
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    T, w, l = p.plate_t, p.plate_w, p.plate_l\n    body =\
    \ cq.Workplane(\"XY\").box(w, l, T, centered=(True, True, False))\n    # 1/4-20\
    \ clearance hole, straight through\n    body = body.cut(\n        cq.Workplane(\"\
    XY\").workplane(offset=-1.0)\n        .circle(p.clear_hole_d / 2.0).extrude(T\
    \ + 2.0)\n    )\n    # pocket for the bolt head, opening at the tripod face (z\
    \ = T)\n    body = body.cut(\n        cq.Workplane(\"XY\").workplane(offset=T\
    \ - p.pocket_depth)\n        .circle(p.pocket_d / 2.0).extrude(p.pocket_depth\
    \ + 1.0)\n    )\n    # window from the pocket out to one end face, so the head\
    \ can be turned\n    win = (cq.Workplane(\"XY\")\n           .box(p.window_w,\
    \ l / 2.0 + 2.0, p.pocket_depth + 1.0,\n                centered=(True, True,\
    \ False))\n           .translate((0.0, -(l + 2.0) / 4.0, T - p.pocket_depth)))\n\
    \    body = body.cut(win)\n    return body\n"
  print_orientation: Flat camera-contact face on the bed (z = 0). The bolt-head pocket
    and its access window open upward, so the part prints with no bridges and no supports.
    0.2 mm layers, 0.4 mm nozzle.
  use_orientation: 'Flip it over: the face with the pocket and the window goes down
    against the tripod head, and the plain flat face goes up under the camera. The
    window then opens toward one end of the tripod head, where you can reach the bolt
    head.'
- id: thumbscrew
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    import math\n    hd, ht, tl = p.screw_head_d, p.screw_head_t,\
    \ p.screw_thread_len\n    r_root = p.screw_root_d / 2.0\n    r_crest = p.screw_crest_d\
    \ / 2.0\n    pitch = p.pitch_1_4_20\n\n    # head, printed flat on the bed\n \
    \   head = cq.Workplane(\"XY\").circle(hd / 2.0).extrude(ht)\n    # finger flutes\
    \ around the rim (kept clear of the thread start)\n    for i in range(6):\n  \
    \      a = math.radians(60.0 * i)\n        head = head.cut(\n            cq.Workplane(\"\
    XY\").workplane(offset=-1.0)\n            .center((hd / 2.0) * math.cos(a), (hd\
    \ / 2.0) * math.sin(a))\n            .circle(p.flute_d / 2.0).extrude(ht - 0.4\
    \ + 1.0)\n        )\n    # coin slot in the underside (the bed face)\n    head\
    \ = head.cut(\n        cq.Workplane(\"XY\").workplane(offset=-1.0)\n        .rect(p.coin_slot_w,\
    \ p.coin_slot_l).extrude(3.2)\n    )\n\n    # threaded shank: core plus a swept\
    \ helical rib\n    body = head.union(\n        cq.Workplane(\"XY\").workplane(offset=ht).circle(r_root).extrude(tl)\n\
    \    )\n    try:\n        helix = cq.Wire.makeHelix(pitch, tl, (r_root + r_crest)\
    \ / 2.0)\n        prof = (cq.Workplane(\"XZ\")\n                .polyline([(r_root,\
    \ -pitch * 0.22),\n                           (r_crest, 0.0),\n              \
    \             (r_root, pitch * 0.22)])\n                .close())\n        rib\
    \ = prof.sweep(helix, isFrenet=True).translate((0.0, 0.0, ht))\n        body =\
    \ body.union(rib)\n    except Exception:\n        pass\n    return body\n"
  print_orientation: Head flat on the bed (z = 0), threaded shank pointing straight
    up. 0.2 mm layers, no supports. Print it on its own so the 15 mm tall thread does
    not get knocked.
  use_orientation: 'Drops into the plate exactly like the metal bolt: head down in
    the pocket, thread up through the hole into the camera. Use the finger flutes
    or the coin slot to tighten.'
- id: coupon_thread
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    l, w, t = p.coupon_l, p.coupon_w, p.coupon_t\n    r_root\
    \ = p.screw_root_d / 2.0\n    r_crest = p.screw_crest_d / 2.0\n    sl = p.coupon_stud_len\n\
    \n    body = cq.Workplane(\"XY\").box(l, w, t, centered=(True, True, False))\n\
    \    # clearance hole for the salvaged bolt's thread\n    body = body.cut(\n \
    \       cq.Workplane(\"XY\").workplane(offset=-1.0)\n        .center(-l / 2.0\
    \ + 7.0, 0.0)\n        .circle(p.clear_hole_d / 2.0).extrude(t + 2.0)\n    )\n\
    \    # pocket the bolt head must drop into, and sit 0.5 mm below the rim\n   \
    \ body = body.cut(\n        cq.Workplane(\"XY\").workplane(offset=t - p.pocket_depth)\n\
    \        .circle(p.pocket_d / 2.0).extrude(p.pocket_depth + 1.0)\n    )\n\n  \
    \  # printed 1/4-20 stud, same thread settings as the thumbscrew\n    stud = cq.Workplane(\"\
    XY\").circle(r_root).extrude(sl)\n    try:\n        helix = cq.Wire.makeHelix(p.pitch_1_4_20,\
    \ sl, (r_root + r_crest) / 2.0)\n        prof = (cq.Workplane(\"XZ\")\n      \
    \          .polyline([(r_root, -p.pitch_1_4_20 * 0.22),\n                    \
    \       (r_crest, 0.0),\n                           (r_root, p.pitch_1_4_20 *\
    \ 0.22)])\n                .close())\n        stud = stud.union(prof.sweep(helix,\
    \ isFrenet=True))\n    except Exception:\n        pass\n    body = body.union(stud.translate((l\
    \ / 2.0 - 8.0, 0.0, t)))\n    return body\n"
  print_orientation: Flat face on the bed, stud pointing straight up. 0.2 mm layers,
    no supports.
  use_orientation: Test piece only. Nothing is assembled from it.
hardware:
- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
- id: nut_1_4_20
  ref: ASME B18.2.2 1/4-20
  qty: 1
