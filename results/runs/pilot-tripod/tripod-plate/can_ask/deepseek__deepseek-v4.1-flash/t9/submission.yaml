- id: j_bolt_to_camera
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 4.2
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: plate
    feature: bolt-head pocket floor
    role: head_seat
  - part: plate
    feature: 1/4-20 clearance hole
    role: clearance
  nut: null
  external: the camera's 1/4-20 tripod socket (threads into the camera, not into anything
    printed)
criteria:
- id: c1
  part: plate
  feature: 1/4-20 clearance hole
  relation: clears
  hardware: bolt
  clearance_mm: 0.55
  params:
  - clear_hole_d
  - th_major_1_4_20
  check:
    method: coupon
    ref: coupon_thread
    description: Slide the salvaged bolt's thread through the coupon's matching hole
      - it must pass freely with no binding.
- id: c2
  part: plate
  feature: bolt-head pocket
  relation: contains
  hardware: bolt
  clearance_mm: 0.8
  params:
  - pocket_d
  - bolt_head_d
  check:
    method: coupon
    ref: coupon_thread
    description: Drop the bolt's head into the coupon's matching pocket - it must
      drop in without forcing.
- id: c3
  part: plate
  feature: bolt-head pocket floor
  relation: seats
  hardware: bolt
  clearance_mm: null
  params:
  - pocket_depth
  - bolt_head_h
  check:
    method: coupon
    ref: coupon_thread
    description: With the head seated on the pocket floor it must sit about 0.5 mm
      below the plate's bottom face - check by eye or with the calipers against the
      coupon's face.
- id: c4
  part: plate
  feature: long clamp sides
  relation: clears
  hardware: null
  clearance_mm: 0.4
  params:
  - plate_w
  - tripod_clamp_width
  check:
    method: measure
    ref: null
    description: Caliper the printed plate across the two long sides; it must be 37.6
      mm so it slides into the 38 mm head without jamming.
- id: c5
  part: thumbscrew
  feature: printed 1/4-20 thread
  relation: engages
  hardware: nut_1_4_20
  clearance_mm: null
  params:
  - screw_crest_d
  - screw_root_d
  - pitch_1_4_20
  check:
    method: coupon
    ref: coupon_thread
    description: Screw the coupon's stud into the ASME 1/4-20 nut with light finger
      pressure. It must run in without cross-threading and hold. This is the same
      thread as the thumbscrew.
- id: c6
  part: plate
  feature: thread protrusion above the camera face
  relation: engages
  hardware: bolt
  clearance_mm: null
  params:
  - protrusion
  - plate_t
  - pocket_depth
  - bolt_thread_len
  check:
    method: measure
    ref: null
    description: With the bolt seated in the printed plate, the thread should stick
      out 5.8 mm from the flat camera face - roughly a standard tripod screw, and
      not so long that it bottoms out in the camera's socket.
- id: c7
  part: plate
  feature: flat camera face
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - plate_w
  - plate_l
  check:
    method: none
    ref: null
    description: The bed-side face is flat and carries the camera; no rubber pad is
      available, so it relies on screw friction plus any tape the user adds.
- id: c8
  part: thumbscrew
  feature: head
  relation: contains
  hardware: null
  clearance_mm: null
  params:
  - screw_head_d
  - screw_head_t
  - pocket_d
  - pocket_depth
  check:
    method: coupon
    ref: coupon_thread
    description: The printed head (14.8 x 5) must drop into the same pocket the metal
      bolt's head does.
manual:
- n: '1'
  text: Print the coupon first - PLA, 0.2 mm layers, 0.4 mm nozzle, no supports, stud
    pointing up. It takes about 15 minutes and saves you wasting the real parts.
  parts:
  - coupon_thread
  hardware: []
  tool: 3D printer
- n: '2'
  text: Test the coupon against your hardware. (a) Slide the salvaged webcam bolt's
    thread through the 6.9 mm hole - it should pass freely. (b) Drop the bolt's head
    into the 16.6 mm pocket - it should drop in and sit flat, about 0.5 mm below the
    surrounding face, no forcing. (c) Screw the coupon's printed stud into the 1/4-20
    nut with light finger pressure; it must run in without cross-threading.
  parts:
  - coupon_thread
  hardware:
  - bolt
  - nut_1_4_20
  tool: calipers
- n: '3'
  text: If the printed stud is too tight or cross-threads, lower screw_crest_d by
    0.1 mm (and/or screw_root_d by 0.05 mm) and reprint just the coupon. If it is
    sloppy and slips, raise screw_root_d by 0.05 mm. Only then print the real parts.
  parts:
  - coupon_thread
  hardware: []
  tool: 3D printer
- n: '4'
  text: Print the plate with its flat face on the bed (pocket and window opening upward)
    and the thumbscrew with its head on the bed. No supports are needed for either.
  parts:
  - plate
  - thumbscrew
  hardware: []
  tool: 3D printer
- n: '5'
  text: 'Fit the salvaged bolt into the plate: push the thread up through the middle
    hole from the side with the pocket, so the head sits down in the pocket and the
    thread comes out of the flat camera face. It should not fall out when you turn
    the plate over.'
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '6'
  text: 'Sit the camera on the flat face of the plate and turn the bolt''s head to
    start it into the camera''s socket. You reach the head through the window cut
    in the end of the plate - press a thumb or thumbnail on the head''s rim and turn.
    Tighten it firmly (this is the only thing holding the camera), but do not gorilla
    it: the plate is plastic.'
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '7'
  text: Slide the plate into the tripod head with the plate's two long sides against
    the clamp jaws, then tighten the head's clamp screw or lever. Push down lightly
    on the camera to check the plate is not rocking in the recess, and that the plate
    is not so thick that the clamp cannot close.
  parts:
  - plate
  hardware: []
  tool: null
- n: '8'
  text: 'If you lose the bolt, the printed thumbscrew is a drop-in substitute: head
    down in the pocket, thread up into the camera. Tighten it with the finger flutes
    through the window, or with a coin in the slot on its underside. Treat it as a
    spare - a printed PLA thread strips long before a metal one.'
  parts:
  - plate
  - thumbscrew
  hardware: []
  tool: null
- n: '9'
  text: If the camera twists about the screw during use, stick a small square of double-sided
    tape or a disc cut from a rubber band on the plate's flat camera face. There is
    no rubber pad in the parts list, so this is the fix.
  parts:
  - plate
  hardware: []
  tool: null
- n: '10'
  text: 'Limits of this part. It is a temporary stand-in, not a replacement: PLA creeps
    under load, so re-check the screw tightness before every use, and take the camera
    off the tripod between shots rather than leaving it mounted. Do not use it with
    a heavy camera or a long lens. If it ever feels loose, stop using it. If the plate
    does not sit down into the tripod''s recess, the head''s recess is shallower than
    9.7 mm - reduce plate_t (keep it at least 5.6 mm so the bolt head still clears)
    and re-check that the thread still does not bottom out in the camera.'
  parts:
  - plate
  - thumbscrew
  hardware: []
  tool: null
