task: tripod-plate
note: 'Temporary tripod quick-release plate + camera screw, sized from your measurements
  of the borrowed clamp and the salvaged 1/4-20 bolt. Print the two coupons first:
  the wedge coupon proves the 45 deg flanks wedge in your clamp AND that the bolt''s
  head fits the pocket; the thread coupon proves the printed 1/4-20 runs into your
  camera socket before you commit to the plate. Two things I could not measure: the
  clamp''s jaw angle (taken as the standard 45 deg dovetail on a 38 mm plate) and
  the camera''s socket depth (taken as about 6.5 mm; the screw is held to 5.5 mm of
  protrusion, the standard tripod-screw figure, safe for any socket 6 mm or deeper).
  The printed screw and the metal bolt are dimensionally interchangeable: both give
  5.5 mm of thread standing above the camera face, so the camera seats flat on the
  plate. Light duty only - a printed thread is not metal: snug it with a coin, do
  not crank it, do not hang a heavy lens off it, and keep it out of a hot car (PLA
  softens).'
questions: []
params:
  plate_width:
    value: 38.0
    unit: mm
    kind: world
    source: measured
    note: width of plate the borrowed clamp takes, measured at the clamp
  plate_len:
    value: 38.0
    unit: mm
    kind: design
    source: design
    note: short enough to drop into any clamp that takes a 38 mm plate; lengthen if
      the clamp's opening is longer
  plate_t:
    value: 9.5
    unit: mm
    kind: design
    source: design
    note: 5 mm pocket for the bolt head + 4.5 mm of material over it
  pocket_d:
    value: 16.5
    unit: mm
    kind: design
    source: design
    note: 15 mm bolt head + 1.5 mm total clearance
  pocket_depth:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: equals the bolt's head height so the head sits flush with the clamp face
  clear_hole_d:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: 1/4-20 thread is 6.35; the extra lets the screw self-align with the camera's
      socket
  stud_len:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: matched to the salvaged bolt's shank so both screws give the same protrusion
  engagement:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: protrusion above the camera face = pocket_depth + stud_len - plate_t; standard
      tripod screw figure
  thread_od:
    value: 6.2
    unit: mm
    kind: design
    source: design
    note: printed 0.15 under the 6.35 nominal so it starts easily
  thread_depth:
    value: 0.65
    unit: mm
    kind: design
    source: design
    note: slightly shallower than the 0.69 standard so a printed thread does not bind
  thread_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 UNC, from the pitch table
  thread_od_nominal:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4 inch major diameter of the camera thread
  knob_d:
    value: 16.0
    unit: mm
    kind: design
    source: design
    note: fits the 16.5 pocket with room to turn
  knob_h:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: equals the pocket depth so the knob is flush
  slot_w:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: coin/screwdriver slot across the knob's outer face
  slot_d:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: slot depth
  bolt_head_d:
    value: 15.0
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam-mount bolt, head across
  bolt_head_h:
    value: 5.0
    unit: mm
    kind: hardware
    source: measured
    note: salvaged bolt, head height
  bolt_shank_len:
    value: 10.0
    unit: mm
    kind: hardware
    source: measured
    note: salvaged bolt, under the head
  camera_socket_depth:
    value: 6.5
    unit: mm
    kind: world
    source: guessed
    note: not measured; typical camera socket. Design only needs 5.5 mm, so it is
      safe for anything 6 mm or deeper
  coupon_len:
    value: 22.0
    unit: mm
    kind: design
    source: design
    note: coupon long enough to carry the full pocket with 2.75 mm end walls
  coupon_knob_d:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: bigger knob on the thread coupon for hand testing
  coupon_knob_h:
    value: 6.0
    unit: mm
    kind: design
    source: design
    note: thread coupon knob height
parts:
- id: plate
  role: final
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    W = p.plate_width          #\
    \ 38 at the clamp face\n    L = p.plate_len            # 38\n    T = p.plate_t\
    \              # 9.5\n    hw_b = W / 2.0             # 19\n    hw_t = hw_b - T\
    \            # 9.5  -> 45 deg flanks\n    prof = (\n        cq.Workplane(\"XZ\"\
    )\n        .polyline([(-hw_b, 0.0), (hw_b, 0.0), (hw_t, T), (-hw_t, T)])\n   \
    \     .close()\n    )\n    body = prof.extrude(L, both=True)\n    # pocket for\
    \ the screw head / printed knob, opening at the clamp face\n    body = body.cut(\n\
    \        cq.Workplane(\"XY\")\n        .workplane(offset=-1.0)\n        .circle(p.pocket_d\
    \ / 2.0)\n        .extrude(p.pocket_depth + 1.0)\n    )\n    # through hole for\
    \ the 1/4-20 thread\n    body = body.cut(\n        cq.Workplane(\"XY\")\n    \
    \    .workplane(offset=p.pocket_depth - 1.0)\n        .circle(p.clear_hole_d /\
    \ 2.0)\n        .extrude(T - p.pocket_depth + 2.0)\n    )\n    return body"
  print_orientation: clamp face (the 38 x 38 mm face) on the bed, z = 0 is that face;
    flanks lean inward going up so there are no overhangs, and the pocket opens onto
    the bed so its 4.25 mm annular ceiling is the only bridge
  use_orientation: wide 38 mm face down into the clamp, the 19 x 38 mm camera face
    up against the camera's base
- id: screw
  role: final
  material: PLA
  code: "import cadquery as cq\nimport math\n\ndef build(p):\n    pitch = p.thread_pitch\n\
    \    dep = p.thread_depth\n    r_min = p.thread_od / 2.0 - dep          # 2.45\n\
    \    core_r = r_min + 0.1\n    kh = p.knob_h\n    L = p.stud_len\n    base = dep\
    \ * math.tan(math.radians(30.0))  # 60 deg thread form\n\n    s = cq.Workplane(\"\
    XY\").circle(p.knob_d / 2.0).extrude(kh)\n    s = s.cut(cq.Workplane(\"XY\").rect(p.knob_d\
    \ + 4.0, p.slot_w).extrude(p.slot_d))\n    s = s.union(cq.Workplane(\"XY\").workplane(offset=kh).circle(core_r).extrude(L))\n\
    \n    helix = cq.Wire.makeHelix(\n        pitch=pitch, height=L, radius=r_min,\
    \ center=(0.0, 0.0, kh)\n    )\n    prof = (\n        cq.Workplane(\"XZ\")\n \
    \       .polyline(\n            [\n                (r_min, kh),\n            \
    \    (r_min, kh + 2.0 * base),\n                (r_min + dep, kh + base),\n  \
    \          ]\n        )\n        .close()\n    )\n    s = s.union(prof.sweep(helix,\
    \ isFrenet=True))\n\n    # tapered lead-in at the tip so it starts into the socket\n\
    \    tip = cq.Solid.makeCone(\n        3.3, 0.05, 1.3, cq.Vector(0.0, 0.0, kh\
    \ + L - 1.3), cq.Vector(0.0, 0.0, 1.0)\n    )\n    s = s.cut(cq.Workplane(obj=tip))\n\
    \    return s"
  print_orientation: knob's outer face (the face with the coin slot) on the bed, 1/4-20
    stud pointing up; prints without supports
  use_orientation: knob down inside the plate's pocket with its coin slot facing the
    clamp, 1/4-20 stud up into the camera's socket
- id: coupon_wedge
  role: coupon
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    W = p.plate_width\n    T = p.plate_t\n\
    \    hw_b = W / 2.0\n    hw_t = hw_b - T\n    prof = (\n        cq.Workplane(\"\
    XZ\")\n        .polyline([(-hw_b, 0.0), (hw_b, 0.0), (hw_t, T), (-hw_t, T)])\n\
    \        .close()\n    )\n    body = prof.extrude(p.coupon_len, both=True)\n \
    \   body = body.cut(\n        cq.Workplane(\"XY\")\n        .workplane(offset=-1.0)\n\
    \        .circle(p.pocket_d / 2.0)\n        .extrude(p.pocket_depth + 1.0)\n \
    \   )\n    body = body.cut(\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.pocket_depth\
    \ - 1.0)\n        .circle(p.clear_hole_d / 2.0)\n        .extrude(T - p.pocket_depth\
    \ + 2.0)\n    )\n    return body"
  print_orientation: clamp face (wide 38 mm face) on the bed, same as the plate
  use_orientation: same as the plate, but only 22 mm long - a slice of the plate to
    test the clamp fit
- id: coupon_thread
  role: coupon
  material: PLA
  code: "import cadquery as cq\nimport math\n\ndef build(p):\n    pitch = p.thread_pitch\n\
    \    dep = p.thread_depth\n    r_min = p.thread_od / 2.0 - dep\n    core_r = r_min\
    \ + 0.1\n    kh = p.coupon_knob_h\n    L = p.stud_len\n    base = dep * math.tan(math.radians(30.0))\n\
    \n    s = cq.Workplane(\"XY\").circle(p.coupon_knob_d / 2.0).extrude(kh)\n   \
    \ s = s.cut(cq.Workplane(\"XY\").rect(p.coupon_knob_d + 4.0, p.slot_w).extrude(p.slot_d))\n\
    \    s = s.union(cq.Workplane(\"XY\").workplane(offset=kh).circle(core_r).extrude(L))\n\
    \n    helix = cq.Wire.makeHelix(\n        pitch=pitch, height=L, radius=r_min,\
    \ center=(0.0, 0.0, kh)\n    )\n    prof = (\n        cq.Workplane(\"XZ\")\n \
    \       .polyline(\n            [\n                (r_min, kh),\n            \
    \    (r_min, kh + 2.0 * base),\n                (r_min + dep, kh + base),\n  \
    \          ]\n        )\n        .close()\n    )\n    s = s.union(prof.sweep(helix,\
    \ isFrenet=True))\n\n    tip = cq.Solid.makeCone(\n        3.3, 0.05, 1.3, cq.Vector(0.0,\
    \ 0.0, kh + L - 1.3), cq.Vector(0.0, 0.0, 1.0)\n    )\n    s = s.cut(cq.Workplane(obj=tip))\n\
    \    return s"
  print_orientation: knob's outer face on the bed, 1/4-20 stud pointing up; prints
    without supports
  use_orientation: hand test piece - screw the stud into the camera's 1/4-20 socket
hardware:
- id: bolt1
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: j_camera_screw
  fastener: bolt1
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: pocket floor, 16.5 mm dia x 5 mm deep, opening at the clamp face
    role: head_seat
  - part: plate
    feature: 8 mm through hole in the pocket floor
    role: clearance
  nut: null
  external: camera 1/4-20 socket
criteria:
- id: c_flank_wedge
  part: plate
  feature: 45 deg flanks, 38 mm wide clamp face tapering to 19 mm
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - plate_width
  - plate_t
  - plate_len
  check:
    method: coupon
    ref: coupon_wedge
    description: 'drop the coupon into the clamp, tighten the knob: it must wedge
      on its flanks and pull flat onto the clamp''s floor with no rock'
- id: c_pocket_holds_head
  part: plate
  feature: 16.5 mm dia x 5 mm deep pocket
  relation: contains
  hardware: bolt1
  clearance_mm: 1.5
  params:
  - pocket_d
  - pocket_depth
  - bolt_head_d
  - bolt_head_h
  check:
    method: measure
    ref: null
    description: the salvaged bolt's 15 mm head must drop fully into the pocket; the
      coupon_wedge has the same pocket so check it there first
- id: c_thread_clears_plate
  part: plate
  feature: 8 mm through hole
  relation: clears
  hardware: null
  clearance_mm: 1.65
  params:
  - clear_hole_d
  - thread_od_nominal
  check:
    method: measure
    ref: null
    description: 1/4-20 thread (6.35 mm) passes through the hole with room to self-align
- id: c_stud_engages_socket
  part: screw
  feature: 1/4-20 x 10 mm stud
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - stud_len
  - thread_pitch
  - thread_od
  - thread_depth
  - camera_socket_depth
  check:
    method: coupon
    ref: coupon_thread
    description: 'screw the coupon into the camera by hand: about 4-5 turns of engagement,
      stopping with the shoulder 3-4 mm clear of the camera''s base, i.e. the socket
      is deeper than the 5.5 mm the screw needs'
- id: c_protrusion
  part: screw
  feature: stud tip stands 5.5 mm above the plate's camera face
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - stud_len
  - pocket_depth
  - plate_t
  - engagement
  check:
    method: measure
    ref: null
    description: with the knob flush in the pocket, the stud tip must be 5.5 mm above
      the 19 x 38 mm camera face so the camera seats flat and the thread does not
      bottom out
- id: c_knob_sits_flush
  part: screw
  feature: 16 mm knob in the 16.5 mm pocket
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - knob_d
  - knob_h
  - pocket_d
  - pocket_depth
  check:
    method: none
    ref: null
    description: knob is flush with the clamp face so the plate sits flat on the clamp's
      floor, and its coin slot stays reachable from the clamp side
- id: c_camera_face_supports
  part: plate
  feature: 19 x 38 mm camera face
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - plate_width
  - plate_t
  - plate_len
  check:
    method: none
    ref: null
    description: flat top face carries the camera's base; screw sits at its centre
manual:
- n: '1'
  text: Slice and print the two coupons first - coupon_wedge and coupon_thread - in
    PLA at 0.2 mm layers, no supports. Together they take only a few minutes and settle
    the two things I could not measure.
  parts:
  - coupon_wedge
  - coupon_thread
  hardware: []
  tool: 3D printer
- n: '2'
  text: 'Test coupon_wedge in the borrowed clamp: open the knob, drop the coupon in
    with its wide 38 mm face down, and tighten. It must wedge on its angled flanks
    and be pulled down flat onto the clamp''s floor with no rocking. While it is out,
    also check the clamp''s opening is at least 38 mm long (the full plate is 38 mm)
    and that the salvaged bolt''s head drops fully into the coupon''s pocket.'
  parts:
  - coupon_wedge
  hardware:
  - bolt1
  tool: null
- n: '3'
  text: 'Test coupon_thread in the camera: screw the 1/4-20 stud into the socket by
    hand. It should take about 4-5 turns and stop with the knob 3-4 mm clear of the
    camera''s base - that gap is the proof the socket is deeper than the 5.5 mm the
    screw needs. If the thread is rough or will not start, chase the first turn with
    a knife or lightly sand the crests.'
  parts:
  - coupon_thread
  hardware: []
  tool: knife (optional)
- n: '4'
  text: 'Print the plate and the screw, same settings: PLA, 0.2 mm layers, no supports.
    The plate prints clamp-face down with the pocket opening onto the bed.'
  parts:
  - plate
  - screw
  hardware: []
  tool: 3D printer
- n: '5'
  text: 'Fit the camera to the plate: lay the camera on its side with the base facing
    you, set the plate on it with the wide 38 mm face pointing away from the camera,
    then drop the screw into the pocket, knob up. Turn it with a coin (or a flat screwdriver)
    until the camera''s base is snug against the plate''s 19 x 38 mm face. Snug only
    - it is a plastic thread.'
  parts:
  - plate
  - screw
  hardware: []
  tool: coin
- n: '6'
  text: 'Mount the assembly: flip it over, open the clamp''s knob, drop the plate''s
    wide face into the jaws and tighten. The plate should pull down flat and stay
    put.'
  parts:
  - plate
  hardware: []
  tool: null
- n: '7'
  text: 'Optional - if you want the metal thread instead: the salvaged bolt is interchangeable
    with the printed screw. Its 15 mm head drops into the same pocket and its 10 mm
    shank gives the same 5.5 mm of protrusion, so the camera still seats flat. Because
    its head sits flush in the pocket there is nothing to grip, so either nip it round
    with needle-nose pliers, or rest the plate face-down on a rubber mat so the head
    bites while you turn the camera onto the stud.'
  parts:
  - plate
  hardware:
  - bolt1
  tool: needle-nose pliers
