task: tripod-plate
note: Temporary Arca-Swiss style quick-release plate. Uses the salvaged webcam-mount
  bolt (1/4-20) as the camera screw; the plate's T-slot captures its head. Camera
  base depth was not successfully measured, so the plate is 60 mm long with the slot
  running full length for fore/aft balancing. Print the dovetail coupon first to confirm
  the clamp bites before printing the full plate.
questions:
- text: What camera or phone is going on it? (I sized the plate at 60 mm since I couldn't
    get the base depth measured.)
  answer: null
params:
  arca_width:
    value: 38.0
    unit: mm
    kind: world
    source: measured
    note: Friend's tripod clamp accepts a 38 mm plate; Arca-Swiss style (measured)
  bevel:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: 45 degree dovetail bevel depth on each top edge (standard Arca bevel)
  plate_h:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: Plate thickness; buries the ~5 mm bolt head and leaves ~5 mm of thread above
  plate_len:
    value: 60.0
    unit: mm
    kind: design
    source: design
    note: Front-to-back length; camera depth not measured, sized generously
  shank_slot_w:
    value: 6.8
    unit: mm
    kind: design
    source: design
    note: 1/4-20 major diameter 6.35 + ~0.45 clearance
  head_slot_w:
    value: 15.6
    unit: mm
    kind: design
    source: design
    note: Bolt head ~15 + 0.6 clearance
  head_pocket_h:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: Bolt head ~5 high + 0.4 clearance; fully recessed from the bottom
  bolt_head_d:
    value: 15.0
    unit: mm
    kind: hardware
    source: measured
    note: Webcam bolt head, measured about 15 mm
  bolt_head_h:
    value: 5.0
    unit: mm
    kind: hardware
    source: measured
    note: Webcam bolt head height, measured about 5 mm
  bolt_thread_l:
    value: 10.0
    unit: mm
    kind: hardware
    source: measured
    note: Webcam bolt threaded length under head, measured about 10 mm
  coupon_len:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: Short test slice of the dovetail profile
parts:
- id: arca_plate
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    wp = (cq.Workplane(\"XY\")\n          .box(p.plate_len,\
    \ p.arca_width, p.plate_h, centered=(True, True, False)))\n    wp = wp.faces(\"\
    >Z\").edges(\"|X\").chamfer(p.bevel)\n    head = (cq.Workplane(\"XY\")\n     \
    \       .box(p.plate_len + 2.0, p.head_slot_w, p.head_pocket_h, centered=(True,\
    \ True, False)))\n    shank = (cq.Workplane(\"XY\")\n             .box(p.plate_len\
    \ + 2.0, p.shank_slot_w, p.plate_h - p.head_pocket_h, centered=(True, True, False))\n\
    \             .translate((0.0, 0.0, p.head_pocket_h)))\n    return wp.cut(head).cut(shank)\n"
  print_orientation: Bottom face (the face with the wide T-slot opening) on the bed;
    z=0 is the bed, length along X, dovetail width along Y
  use_orientation: Bottom face down toward the tripod clamp, bevels engage the clamp
    jaws, camera sits on the flat top face; long axis runs front-to-back
- id: dovetail_coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    wp = (cq.Workplane(\"XY\")\n          .box(p.coupon_len,\
    \ p.arca_width, p.plate_h, centered=(True, True, False)))\n    return wp.faces(\"\
    >Z\").edges(\"|X\").chamfer(p.bevel)\n"
  print_orientation: Flat, bottom face on the bed; z=0 is the bed
  use_orientation: Drop into the tripod clamp bevel-down to verify the dovetail grips
hardware:
- id: cam_screw
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_screw_joint
  fastener: cam_screw
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: arca_plate
    feature: bottom head channel (wide T-slot)
    role: head_seat
  - part: arca_plate
    feature: top shank slot (narrow slot)
    role: clearance
  nut: null
  external: camera 1/4-20 tripod socket
criteria:
- id: clamp_fit
  part: dovetail_coupon
  feature: dovetail cross-section
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - arca_width
  - bevel
  - plate_h
  check:
    method: coupon
    ref: dovetail_coupon
    description: Print the coupon and drop it into the clamp with the knob loose;
      the jaws should bite the angled sides and hold when the knob is tightened.
- id: head_channel
  part: arca_plate
  feature: bottom head channel
  relation: contains
  hardware: cam_screw
  clearance_mm: 0.3
  params:
  - head_slot_w
  - head_pocket_h
  check:
    method: measure
    ref: null
    description: The ~15 mm bolt head should slide along the wide bottom channel without
      binding.
- id: shank_clearance
  part: arca_plate
  feature: top shank slot
  relation: clears
  hardware: cam_screw
  clearance_mm: 0.45
  params:
  - shank_slot_w
  check:
    method: measure
    ref: null
    description: The threaded shank passes through the narrow slot with slight clearance.
- id: camera_thread
  part: arca_plate
  feature: shank protrusion above top face
  relation: engages
  hardware: cam_screw
  clearance_mm: 5.0
  params:
  - bolt_thread_l
  - plate_h
  - head_pocket_h
  check:
    method: measure
    ref: null
    description: About 5 mm of 1/4-20 thread must stand above the plate top to engage
      the camera socket (typical socket depth ~6 mm).
manual:
- n: '1'
  text: Print the dovetail coupon first. Drop it into the tripod clamp with the knob
    loose, then tighten the knob; it should lock in place. If it does not grip, stop
    here so the bevel can be adjusted before wasting filament on the full plate.
  parts:
  - dovetail_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Print the plate flat on its base. No supports are needed: the 45-degree bevels
    and the ~15 mm bridge over the bottom slot print cleanly at 0.2 mm layers.'
  parts:
  - arca_plate
  hardware: []
  tool: null
- n: '3'
  text: 'Slide the webcam-mount bolt into the plate from either end: its 15 mm head
    rides in the wide bottom channel, and the threaded shank pokes up through the
    narrow slot.'
  parts:
  - arca_plate
  hardware:
  - cam_screw
  tool: null
- n: '4'
  text: Set the camera on the plate, line the 1/4-20 socket up over the bolt, and
    turn the bolt head from underneath to thread it into the camera. Tighten snug
    only - the plate is plastic - and slide the camera fore/aft along the slot to
    balance it.
  parts:
  - arca_plate
  hardware:
  - cam_screw
  tool: null
- n: '5'
  text: Drop the plate+camera into the tripod clamp, bevels down, and tighten the
    clamp knob.
  parts:
  - arca_plate
  hardware: []
  tool: null
- n: '6'
  text: 'Remember this is a temporary plastic part: keep the rig light and don''t
    leave a heavy camera or long lens on it unattended.'
  parts: []
  hardware: []
  tool: null
