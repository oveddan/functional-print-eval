task: tripod-plate
note: ''
questions: []
params:
  plate_top_width:
    value: 38.0
    unit: mm
    kind: design
    source: design
    note: Standard Arca-Swiss plate top width; adjust to fit clamp
  plate_top_length:
    value: 55.0
    unit: mm
    kind: design
    source: design
    note: Long enough for most cameras; adjust if needed
  plate_thickness:
    value: 6.0
    unit: mm
    kind: design
    source: design
    note: Plate depth (top surface to base of dovetail)
  dovetail_angle:
    value: 45.0
    unit: deg
    kind: design
    source: design
    note: Arca-Swiss standard dovetail angle
  dovetail_bottom_width:
    value: 39.0
    unit: mm
    kind: design
    source: design
    note: Width across the widest (bottom) part of the dovetail flare
  corner_slot_width:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Slot for the safety-stop, optional
  bolt_major_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 major diameter (0.25 in = 6.35 mm)
  bolt_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 pitch, 20 TPI
  screw_clearance_d:
    value: 6.6
    unit: mm
    kind: design
    source: design
    note: Through-hole for the 1/4-20 stud
  knob_d:
    value: 25.0
    unit: mm
    kind: design
    source: design
    note: Printed knob diameter around the bolt head
  knob_h:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: Printed knob height
  head_pocket_d:
    value: 11.0
    unit: mm
    kind: design
    source: design
    note: Pocket in knob to capture the bolt head
  plate_bottom_relief_w:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: Width of the slot on the plate underside for the stud to slide
parts:
- id: quick_release_plate
  role: final
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    Wtop = p.plate_top_width\n  \
    \  L = p.plate_top_length\n    T = p.plate_thickness\n    Wbot = p.dovetail_bottom_width\n\
    \    ang = p.dovetail_angle\n    slot = p.corner_slot_width\n    screw_d = p.screw_clearance_d\n\
    \    relief_w = p.plate_bottom_relief_w\n\n    # Dovetail cross-section: trapezoid,\
    \ narrower top, wider bottom\n    # Build a 2D profile in the YZ? Simpler: extrude\
    \ a trapezoid along L.\n    # Top width Wtop, bottom width Wbot, height T, centered\
    \ at origin.\n    top = Wtop / 2.0\n    bot = Wbot / 2.0\n\n    pts = [\n    \
    \    (-bot, 0.0),\n        (bot, 0.0),\n        (top, T),\n        (-top, T),\n\
    \    ]\n    profile = (\n        cq.Workplane('XZ')\n        .polyline(pts)\n\
    \        .close()\n        .extrude(L)\n    )\n\n    # Center the extrude in Y:\
    \ it extruded along Y from 0 to L; recenter\n    profile = profile.translate((0,\
    \ -L / 2.0, 0))\n\n    # Through slot for the stud (front-to-back) on underside\n\
    \    slot_cut = (\n        cq.Workplane('XY')\n        .workplane(offset=0)\n\
    \        .box(relief_w, L, T)\n        .translate((0, 0, 0))\n    )\n\n    # Round\
    \ through-hole where the screw goes up to the camera\n    hole = (\n        cq.Workplane('XZ')\n\
    \        .circle(screw_d / 2.0)\n        .extrude(30)\n        .translate((0,\
    \ 0, T/2.0))\n    )\n\n    result = profile.cut(slot_cut)\n    result = result.cut(hole)\n\
    \    return result"
  print_orientation: dovetail bottom (widest face) down on bed, with the top face
    (narrower) up
  use_orientation: top face up against camera body, dovetail sides gripped by clamp
    jaws
- id: thumb_knob
  role: final
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    D = p.knob_d\n    H = p.knob_h\n\
    \    pd = p.head_pocket_d\n\n    body = (\n        cq.Workplane('XY')\n      \
    \  .cylinder(H, D / 2.0)\n    )\n\n    # Knurl-like grip: vertical ridges (optional\
    \ simple version)\n    ridges = (\n        cq.Workplane('XY')\n        .polygon(8,\
    \ D / 2.0)\n        .extrude(H)\n    )\n\n    # Pocket to capture the bolt head\
    \ from below\n    pocket = (\n        cq.Workplane('XY')\n        .workplane(offset=H)\n\
    \        .circle(pd / 2.0)\n        .extrude(5)\n    )\n\n    result = body.union(ridges).cut(pocket)\n\
    \    return result"
  print_orientation: flat bottom of the knob on bed, pocket opening facing up
  use_orientation: pocket side receives the salvaged 1/4-20 bolt head; knob is turned
    by hand to drive the stud into the camera
- id: dovetail_coupon
  role: coupon
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    # A short slice of the dovetail\
    \ to test clamp fit without printing the whole plate\n    Wtop = p.plate_top_width\n\
    \    Wbot = p.dovetail_bottom_width\n    T = p.plate_thickness\n    L = 10.0\n\
    \n    pts = [\n        (-Wbot/2.0, 0.0),\n        (Wbot/2.0, 0.0),\n        (Wtop/2.0,\
    \ T),\n        (-Wtop/2.0, T),\n    ]\n    profile = (\n        cq.Workplane('XZ')\n\
    \        .polyline(pts)\n        .close()\n        .extrude(L)\n    )\n    return\
    \ profile.translate((0, -L/2.0, 0))"
  print_orientation: dovetail bottom down on bed
  use_orientation: dropped into the clamp jaws to test the dovetail fit and width
hardware:
- id: stud_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_attach
  fastener: stud_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: quick_release_plate
    feature: through slot / hole
    role: clearance
  - part: thumb_knob
    feature: head pocket
    role: head_seat
  nut: null
  external: null
criteria:
- id: dovetail_fits_clamp
  part: dovetail_coupon
  feature: dovetail sides
  relation: engages
  hardware: null
  clearance_mm: null
  params: []
  check:
    method: coupon
    ref: null
    description: Print and test coupon in clamp; if too loose/too tight adjust plate_top_width
      and dovetail_bottom_width
- id: stud_threads_camera
  part: quick_release_plate
  feature: through hole
  relation: clears
  hardware: stud_bolt
  clearance_mm: null
  params: []
  check:
    method: measure
    ref: null
    description: Confirm the salvaged bolt threads into the camera socket cleanly
manual:
- n: '1'
  text: Print the dovetail_coupon first and drop it into the tripod clamp. If it's
    loose, reprint the plate/coupon with a larger dovetail_bottom_width; if it won't
    fit, reduce it.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print quick_release_plate (dovetail face down) and thumb_knob (pocket up).
  parts: []
  hardware: []
  tool: null
- n: '3'
  text: Press the salvaged webcam-mount-bolt head into the thumb_knob pocket (a dab
    of glue helps it stay).
  parts: []
  hardware: []
  tool: null
- n: '4'
  text: Thread the bolt up through the plate's slot/hole until it pokes out the top
    of the plate.
  parts: []
  hardware: []
  tool: null
- n: '5'
  text: Screw the plate onto the camera's 1/4-20 tripod socket using the knob; tighten
    gently by hand (it's plastic — don't overtighten).
  parts: []
  hardware: []
  tool: null
- n: '6'
  text: Set the camera+plate into the tripod clamp jaws and tighten the clamp knob.
  parts: []
  hardware: []
  tool: null
