task: tripod-plate
note: Temporary PLA quick-release plate only. It uses the salvaged metal 1/4-20 webcam-mount
  bolt as the camera screw; do not overtighten and support the camera with a hand
  until you trust it.
questions: []
params:
  plate_width:
    value: 38.0
    unit: mm
    kind: world
    source: measured
    note: Tripod clamp plate width measured by the user
  plate_len:
    value: 50.0
    unit: mm
    kind: design
    source: design
    note: Plate length; adjust if camera base/battery door requires shorter
  top_width:
    value: 30.0
    unit: mm
    kind: design
    source: guessed
    note: Arca-style dovetail top width; verify fit with the coupon
  dovetail_h:
    value: 4.0
    unit: mm
    kind: design
    source: guessed
    note: Height of the 45-degree dovetail flank
  plate_t:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: Overall plate thickness
  bolt_head_dia:
    value: 15.0
    unit: mm
    kind: hardware
    source: measured
    note: Head across-flats/diameter of the salvaged webcam-mount bolt
  bolt_head_h:
    value: 5.0
    unit: mm
    kind: hardware
    source: measured
    note: Head height of the salvaged webcam-mount bolt
  bolt_thread_len:
    value: 10.0
    unit: mm
    kind: hardware
    source: measured
    note: Threaded length under the head of the salvaged webcam-mount bolt
  shaft_dia:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 UNC major diameter
  slot_start:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: Distance from front end to start of bolt slot; slot is open at the rear
      end for bolt insertion
  coupon_len:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: Length of the dovetail fit test coupon
parts:
- id: plate
  role: final
  material: PLA
  code: "def build(p):\n    y_bot = p.plate_width / 2.0\n    y_top = p.top_width /\
    \ 2.0\n    pts = [\n        (-y_bot, 0.0),\n        (-y_top, p.dovetail_h),\n\
    \        (-y_top, p.plate_t),\n        (y_top, p.plate_t),\n        (y_top, p.dovetail_h),\n\
    \        (y_bot, 0.0),\n    ]\n    body = (cq.Workplane(\"YZ\")\n            .polyline(pts)\n\
    \            .close()\n            .extrude(p.plate_len))\n\n    head_pocket_depth\
    \ = p.bolt_head_h + 0.5\n    head_pocket_w = p.bolt_head_dia + 3.0\n    shaft_slot_w\
    \ = p.shaft_dia + 0.65\n    slot_len = p.plate_len - p.slot_start\n\n    head_pocket\
    \ = (cq.Workplane(\"XY\")\n                   .box(slot_len, head_pocket_w, head_pocket_depth)\n\
    \                   .translate((p.slot_start + slot_len / 2.0, 0.0, head_pocket_depth\
    \ / 2.0)))\n\n    shaft_slot = (cq.Workplane(\"XY\")\n                  .box(slot_len,\
    \ shaft_slot_w, p.plate_t - head_pocket_depth)\n                  .translate((p.slot_start\
    \ + slot_len / 2.0, 0.0,\n                              head_pocket_depth + (p.plate_t\
    \ - head_pocket_depth) / 2.0)))\n\n    return body.cut(head_pocket).cut(shaft_slot)\n"
  print_orientation: Bottom face (the 38 mm wide face with the open head-pocket groove)
    on the bed, z=0
  use_orientation: Bottom face sits in the tripod clamp; top face supports the camera
    body
- id: dovetail_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    y_bot = p.plate_width / 2.0\n    y_top = p.top_width /\
    \ 2.0\n    pts = [\n        (-y_bot, 0.0),\n        (-y_top, p.dovetail_h),\n\
    \        (-y_top, p.plate_t),\n        (y_top, p.plate_t),\n        (y_top, p.dovetail_h),\n\
    \        (y_bot, 0.0),\n    ]\n    return (cq.Workplane(\"YZ\")\n            .polyline(pts)\n\
    \            .close()\n            .extrude(p.coupon_len))\n"
  print_orientation: Bottom face (38 mm wide) on the bed
  use_orientation: Dropped into the tripod clamp from above to test the dovetail fit
hardware:
- id: webcam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_screw
  fastener: webcam_bolt
  axis_origin:
  - 25.0
  - 0.0
  - 5.5
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: bottom_head_pocket
    role: head_seat
  - part: plate
    feature: top_shaft_slot
    role: clearance
  nut: null
  external: camera 1/4-20 tripod socket
criteria:
- id: clamp_fit
  part: dovetail_coupon
  feature: dovetail_flanks
  relation: engages
  hardware: null
  clearance_mm: null
  params: []
  check:
    method: coupon
    ref: dovetail_coupon
    description: Coupon drops into the tripod clamp from above and the clamp jaws'
      angled lips hold its 45-degree flanks. Sand the flanks slightly only if too
      tight.
- id: head_capture
  part: plate
  feature: bottom_head_pocket
  relation: contains
  hardware: webcam_bolt
  clearance_mm: 1.5
  params: []
  check:
    method: measure
    ref: null
    description: 15 mm bolt head must slide into the 18 mm-wide bottom groove and
      bear against its roof when the bolt is tightened.
- id: shaft_clearance
  part: plate
  feature: top_shaft_slot
  relation: clears
  hardware: webcam_bolt
  clearance_mm: 0.65
  params: []
  check:
    method: measure
    ref: null
    description: 1/4-20 shaft must pass through the 7 mm-wide top slot and slide fore-aft.
manual:
- n: '1'
  text: Print dovetail_coupon first. Drop it into the tripod clamp from above; the
    clamp knob should close onto the angled flanks. If it does not enter, lightly
    sand the two angled faces and re-test.
  parts:
  - dovetail_coupon
  hardware: []
  tool: null
- n: '2'
  text: Print plate with its 38 mm bottom face on the print bed.
  parts:
  - plate
  hardware: []
  tool: null
- n: '3'
  text: 'Slide the salvaged webcam-mount bolt into the open end of the plate''s bottom
    groove: wide head in the lower groove, threaded shaft coming up through the top
    slot.'
  parts:
  - plate
  hardware:
  - webcam_bolt
  tool: null
- n: '4'
  text: Hold the plate's top face against the camera bottom, align the shaft with
    the camera's 1/4-20 tripod socket, and slide the bolt fore/aft as needed.
  parts:
  - plate
  hardware:
  - webcam_bolt
  tool: null
- n: '5'
  text: Hand-tighten the bolt into the camera socket until the plate is snug. Do not
    overtighten; this is a PLA plate and is temporary.
  parts:
  - plate
  hardware:
  - webcam_bolt
  tool: null
- n: '6'
  text: Lower the camera and plate into the tripod clamp and tighten the tripod's
    own clamp knob.
  parts:
  - plate
  hardware: []
  tool: null
