task: tripod-plate
note: Temporary quick-release plate. The flat plate is printed; the part that screws
  in uses the salvaged webcam-mount bolt rather than printed threads, because a metal
  1/4-20 screw is far stronger and safer for the camera socket than fine PLA threads.
  PLA is only a temporary stand-in - do not trust it with heavy or expensive gear.
  Print and test the coupon first.
questions:
- text: Roughly how deep is your camera's tripod socket (how far the bolt tip can
    go before it hits the floor)? The design leaves ~5 mm of thread sticking up, which
    fits most cameras.
  answer: null
- text: If you can estimate it, what angle are the clamp's angled jaws (e.g. 45 degrees),
    and how tall/deep is the channel the plate drops into?
  answer: null
params:
  tripod_clamp_w:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: Width of plate the tripod clamp takes, as measured.
  clamp_clear:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Clearance so the 37.5 mm plate slides into the 38 mm clamp.
  plate_len:
    value: 50
    unit: mm
    kind: design
    source: design
    note: Fore-aft length of the plate.
  plate_t:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: Thickness. With the 5 mm head buried and 10 mm of thread, this leaves ~5
      mm of bolt above the top face for the camera socket.
  dov_h:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: Height of the dovetail chamfer at each bottom edge (guessed standard).
  dov_angle:
    value: 45
    unit: deg
    kind: design
    source: design
    note: Angle of the dovetail chamfer from horizontal (standard Arca-style, guessed
      - verify with the coupon).
  cb_clear_d:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Diametral clearance around the bolt head in its pocket.
  cb_extra_h:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Extra pocket depth so the head sits flush or slightly recessed even if the
      'about 5 mm' head measure is a bit over.
  thread_major:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: '1/4-20 major diameter: 1/4 in = 6.35 mm.'
  thread_clear:
    value: 0.125
    unit: mm
    kind: design
    source: design
    note: 'Half-diametral clearance for the bolt to pass: clearance hole becomes 6.6
      mm.'
  slot_travel:
    value: 13
    unit: mm
    kind: design
    source: design
    note: Fore-aft slide range of the bolt in the plate.
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: About 15 mm across the salvaged bolt head.
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: About 5 mm head height.
  bolt_thread_l:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: About 10 mm of thread under the head.
  coupon_len:
    value: 15
    unit: mm
    kind: design
    source: design
    note: Short slice length for the fit-test coupon.
parts:
- id: plate
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    w = p.tripod_clamp_w - p.clamp_clear\n\
    \    T = p.plate_t\n    L = p.plate_len\n    off = p.dov_h / math.tan(math.radians(p.dov_angle))\n\
    \    clr_d = p.thread_major + 2 * p.thread_clear\n    cb_d = p.bolt_head_d + p.cb_clear_d\n\
    \    cb_depth = p.bolt_head_h + p.cb_extra_h\n\n    pts = [\n        (-w/2, T),\
    \ (w/2, T),\n        (w/2, p.dov_h), (w/2 - off, 0),\n        (-w/2 + off, 0),\
    \ (-w/2, p.dov_h),\n    ]\n    plate = cq.Workplane(\"XZ\").polyline(pts).close().extrude(L).translate((0,\
    \ -L/2, 0))\n\n    thr = cq.Workplane(\"XY\").slot2D(p.slot_travel + clr_d, clr_d,\
    \ angle=90).extrude(T + 1)\n    plate = plate.cut(thr)\n\n    pock = cq.Workplane(\"\
    XY\").slot2D(p.slot_travel + cb_d, cb_d, angle=90).extrude(cb_depth)\n    plate\
    \ = plate.cut(pock)\n\n    return plate"
  print_orientation: Bottom (narrow dovetail face, z=0) on the bed; wide top face
    upward. The 45-degree chamfer prints as a supported-free overhang.
  use_orientation: Bottom (narrow) face seats in the tripod clamp; wide top face supports
    the camera; the slotted opening faces up.
- id: coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    w = p.tripod_clamp_w - p.clamp_clear\n\
    \    T = p.plate_t\n    L = p.coupon_len\n    off = p.dov_h / math.tan(math.radians(p.dov_angle))\n\
    \    clr_d = p.thread_major + 2 * p.thread_clear\n    cb_d = p.bolt_head_d + p.cb_clear_d\n\
    \    cb_depth = p.bolt_head_h + p.cb_extra_h\n\n    pts = [\n        (-w/2, T),\
    \ (w/2, T),\n        (w/2, p.dov_h), (w/2 - off, 0),\n        (-w/2 + off, 0),\
    \ (-w/2, p.dov_h),\n    ]\n    plate = cq.Workplane(\"XZ\").polyline(pts).close().extrude(L).translate((0,\
    \ -L/2, 0))\n\n    thru = cq.Workplane(\"XY\").circle(clr_d/2).extrude(T + 1)\n\
    \    plate = plate.cut(thru)\n\n    pock = cq.Workplane(\"XY\").circle(cb_d/2).extrude(cb_depth)\n\
    \    plate = plate.cut(pock)\n\n    return plate"
  print_orientation: Bottom (narrow dovetail face, z=0) on the bed; wide top face
    upward.
  use_orientation: Test slice - drop the bottom (narrow) face into the tripod clamp;
    the single hole tests the bolt fit and stick-out.
hardware:
- id: webcam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_screw
  fastener: webcam_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: cb_slot
    role: head_seat
  - part: plate
    feature: through_slot
    role: clearance
  nut: null
  external: camera's 1/4-20 tripod socket
criteria:
- id: clamp_seat
  part: plate
  feature: dovetail_edges
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - tripod_clamp_w
  - clamp_clear
  - dov_h
  - dov_angle
  check:
    method: coupon
    ref: coupon
    description: 'Drop the coupon into the tripod clamp and tighten the knob: it should
      seat into the channel and be gripped without rocking. If it will not drop in,
      the dovetail is too large (sand the two angled edges slightly); if it drops
      in loose, it is too small (add a strip of tape along the bottom).'
- id: bolt_head_seat
  part: plate
  feature: cb_slot
  relation: seats
  hardware: webcam_bolt
  clearance_mm: null
  params:
  - bolt_head_d
  - bolt_head_h
  - cb_clear_d
  - cb_extra_h
  check:
    method: coupon
    ref: coupon
    description: 'Push the bolt into the coupon from below: the head should drop into
      the round pocket and sit flush with (or slightly above) the bottom face, with
      nothing snagging.'
- id: thread_protrusion
  part: plate
  feature: through_slot
  relation: engages
  hardware: webcam_bolt
  clearance_mm: 5.0
  params:
  - bolt_thread_l
  - bolt_head_h
  - plate_t
  - thread_major
  - thread_clear
  check:
    method: coupon
    ref: coupon
    description: With the head seated, about 5 mm of thread must stand above the top
      face and thread into the camera socket without bottoming out.
manual:
- n: '1'
  text: Print the small dovetail test slice first (narrow bottom face on the bed).
  parts:
  - coupon
  hardware: []
  tool: null
- n: '2'
  text: Drop the test slice into the tripod clamp and tighten the knob. It should
    sit down into the channel and grip without rocking. If it won't drop in, sand
    the two angled edges slightly; if it's loose, add a strip of tape along the bottom.
  parts:
  - coupon
  hardware: []
  tool: null
- n: '3'
  text: 'Push the salvaged webcam bolt up through the hole from the bottom of the
    test slice: the head goes into the round pocket on the underside, and ~5 mm of
    thread sticks out the top. Screw it into the camera socket by hand and stop at
    the first hint of resistance - do not force it.'
  parts:
  - coupon
  hardware:
  - webcam_bolt
  tool: null
- n: '4'
  text: 'Print the full plate (same orientation: narrow face on the bed).'
  parts:
  - plate
  hardware: []
  tool: null
- n: '5'
  text: Lay the plate's top face against the camera base, poke the bolt up through
    the slot, and thread it into the camera. Slide the bolt fore/aft in the slot to
    centre the camera, then tighten it snugly from below.
  parts:
  - plate
  hardware:
  - webcam_bolt
  tool: null
- n: '6'
  text: Slide the plate into the tripod clamp and tighten the clamp knob.
  parts:
  - plate
  hardware: []
  tool: null
- n: '7'
  text: 'To remove: loosen the clamp knob, lift the camera off, then unscrew the bolt
    from the camera.'
  parts:
  - plate
  hardware:
  - webcam_bolt
  tool: null
