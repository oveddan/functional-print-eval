task: tripod-plate
note: 'A replacement is feasible, but the clamp dimensions weren''t available, so
  this is a cautious Arca-Swiss-style guess—not a verified fit for this tripod. Print
  and test the short coupon first; only print/use the plate if it seats fully under
  both angled jaws and clamps firmly without rocking. PLA is not metal: use only temporarily
  for a light camera, with a hand under it while testing; never use over people or
  valuables. First check the supplied metal 1/4-20 bolt threads smoothly into the
  camera by hand. Stop if it binds.'
questions: []
params:
  plate_width_bottom:
    value: 38.0
    unit: mm
    kind: world
    source: guessed
    note: Common Arca-Swiss-style nominal rail width; clamp was not measured.
  plate_width_top:
    value: 28.0
    unit: mm
    kind: world
    source: guessed
    note: ''
  plate_thickness:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: ''
  bevel_height:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: ''
  plate_length:
