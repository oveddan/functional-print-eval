task: tripod-plate
note: A temporary, generic flat plate with a recess for the measured metal webcam-mount
  bolt. The bolt itself is reused; do not print a plastic 1/4-20 screw. The 38 mm
  width alone does not establish quick-release compatibility, so this plate is NOT
  a confirmed fit for the tripod clamp. Test the empty plate in the clamp first; use
  only if the clamp fully locks and the plate cannot slide or rock. PLA and this unverified
  interface are not suitable for supporting a valuable camera over people, or for
  overhead use. The screw projects about 3.9 mm above the plate; stop if it bottoms
  out in the camera socket before the plate is snug.
questions:
- text: What is the tripod brand/model, or can you later measure the clamp channel
    length and side profile? That would be needed to make a plate that is reliably
    compatible.
  answer: null
params:
  plate_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: User-reported width of plate accepted by tripod clamp; other interface dimensions
      are unknown.
  plate_length:
    value: 50
    unit: mm
    kind: design
    source: design
    note: Chosen generic plate length; not matched to the clamp.
  plate_thickness:
    value: 11.5
    unit: mm
    kind: design
    source: design
    note: Chosen to leave about 3.9 mm screw projection with the measured 10 mm bolt
      and 5.4 mm recess.
  bolt_head_diameter:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Approximate head diameter reported by user.
  bolt_head_height:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Approximate head height reported by user.
  bolt_underhead_length:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: Reported length under the head.
  head_recess_diameter:
    value: 16.2
    unit: mm
    kind: design
    source: design
    note: Provides 1.2 mm diametral clearance around the reported 15 mm head.
  head_recess_depth:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: Provides 0.4 mm depth clearance over reported head height.
  bolt_clearance_diameter:
    value: 6.8
    unit: mm
    kind: design
    source: design
    note: Clearance for the salvaged 1/4-20 bolt shank.
parts:
- id: temp_plate
  role: final
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    # Plate is modeled with its underside on z=0. The counterbore\
    \ opens on\n    # that underside so the salvaged bolt head can be inserted from\
    \ below.\n    plate = cq.Workplane('XY').box(p.plate_width, p.plate_length, p.plate_thickness,\n\
    \                                    centered=(True, True, False))\n    through\
    \ = cq.Workplane('XY').circle(p.bolt_clearance_diameter / 2).extrude(p.plate_thickness)\n\
    \    head_recess = cq.Workplane('XY').circle(p.head_recess_diameter / 2).extrude(p.head_recess_depth)\n\
    \    return plate.cut(through).cut(head_recess)"
  print_orientation: Print broad underside face on the bed (z=0); the circular counterbore
    opens toward the bed. No supports required.
  use_orientation: Counterbore faces downward toward the camera; flat opposite face
    rests against the camera. Plate edges sit in the tripod clamp.
hardware:
- id: camera_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: bolt_to_plate
  fastener: camera_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 5.4
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: temp_plate
    feature: underside counterbore floor
    role: head_seat
  - part: temp_plate
    feature: central through-bore
    role: clearance
  nut: null
  external: Camera's 1/4-20 tripod socket; confirm by hand that the bolt threads in
    and does not bottom out.
criteria:
- id: bolt_fits
  part: temp_plate
  feature: central through-bore and underside counterbore
  relation: clears
  hardware: camera_bolt
  clearance_mm: 0.2
  params:
  - bolt_clearance_diameter
  - head_recess_diameter
  - head_recess_depth
  check:
    method: measure
    ref: null
    description: Check that the bolt shank passes freely and the head sits below the
      plate underside without rocking. Do not force the bolt.
- id: receiver_fit
  part: temp_plate
  feature: outer plate edges
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - plate_width
  - plate_length
  check:
    method: measure
    ref: null
    description: Test the empty plate in the tripod clamp. Confirm the clamp fully
      locks and the plate cannot slide, lift, or rock before attaching a camera.
manual:
- n: '1'
  text: Print the plate flat on its underside, with the counterbore opening toward
    the build plate. Inspect it for cracks, poor layer bonding, or elephant-foot that
    would affect the fit.
  parts:
  - temp_plate
  hardware: []
  tool: null
- n: '2'
  text: Insert the metal bolt upward through the counterbore and through-bore. Confirm
    its head sits within the recess; do not modify or print a plastic replacement
    screw.
  parts:
  - temp_plate
  hardware:
  - camera_bolt
  tool: Fingers
- n: '3'
  text: Before attaching a camera, try the plate alone in the tripod clamp. The clamp
    must close fully and hold the plate firmly without sliding or rocking. If it does
    not, stop; this generic plate is not compatible.
  parts:
  - temp_plate
  hardware: []
  tool: Tripod clamp
- n: '4'
  text: If the clamp fit is secure, thread the bolt into the camera socket by hand.
    Stop if it binds or bottoms before the plate is snug. Keep the camera supported
    by hand while fitting.
  parts:
  - temp_plate
  hardware:
  - camera_bolt
  tool: Fingers
- n: '5'
  text: Use only as a supervised, short-term temporary mount on a stable tripod, away
    from people and valuable equipment. Do not use overhead, outdoors in wind, or
    for heavy/vibrating loads; replace it with the correct metal plate as soon as
    possible.
  parts:
  - temp_plate
  hardware: []
  tool: null
