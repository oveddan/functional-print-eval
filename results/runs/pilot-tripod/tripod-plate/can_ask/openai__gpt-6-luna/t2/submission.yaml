task: tripod-plate
note: 'I’m not handing in a camera-carrying plate yet: the receiver dimensions did
  not come through—only the jaw description—and a generic plate can look as if it
  fits while being able to pop out and drop the camera. The 1/4-20 camera thread is
  the easy, standard part; use a metal 1/4-20 screw, not a printed threaded screw.
  The quick-release plate profile is tripod-specific. A printed PLA plate is also
  a temporary, load-bearing weak link; don’t use it over people, near an edge, with
  valuable/heavy gear, or unattended. Once the receiver and bolt are measured, a fit
  coupon and conservative plate design may be possible.'
