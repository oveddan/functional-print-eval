task: tripod-plate
note: A temporary, one-piece PLA camera plate is plausible, but the 1/4-20 part should
  be the actual metal salvaged webcam bolt—not a printed screw. I used the reported
  38 mm plate width and approximated a common angled-lip/dovetail profile; the receiver's
  lip gap, angle, depth, and length were not measured, so print the short fit coupon
  first. Do not put a valuable camera over people or rely on this PLA plate for a
  heavy camera, long lens, or unattended use. Check the bolt does not bottom out in
  the camera socket before tightening.
questions: []
params:
  receiver_plate_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: User-reported plate width accepted by the tripod clamp.
  camera_bolt_major_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal major diameter for the salvaged 1/4-20 bolt.
  bolt_under_head_length:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: User-reported approximate usable length under head.
  bolt_head_diameter:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: User-reported approximate head diameter.
  bolt_head_height:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: User-reported approximate head height.
  plate_length:
    value: 50
    unit: mm
    kind: design
    source: design
    note: Chosen plate length; receiver length was not measured.
  plate_body_thickness:
    value: 8
    unit: mm
    kind: design
    source: design
    note: Thickness of the dovetail portion.
  dovetail_top_width:
    value: 30
    unit: mm
    kind: design
    source: guessed
    note: Estimated top width for a common angled-lip clamp; verify using coupon.
  camera_pad_width:
    value: 24
    unit: mm
    kind: design
    source: design
    note: Square raised pad gives the camera a bearing surface and reduces bolt protrusion.
  camera_pad_height:
    value: 2
    unit: mm
    kind: design
    source: design
    note: Raises camera contact surface; with this and the pocket, nominal bolt projection
      above pad is about 5 mm.
  bolt_head_pocket_depth:
    value: 5.2
    unit: mm
    kind: design
    source: design
    note: Shallow clearance over reported 5 mm bolt head height.
  bolt_head_clearance:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Diametral allowance around the bolt head.
  bolt_channel_clearance:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Allowance for sliding the bolt head into its underside channel.
  bolt_shank_hole_diameter:
    value: 6.8
    unit: mm
    kind: design
    source: design
    note: Unthreaded clearance hole for the metal 1/4-20 bolt.
  coupon_length:
    value: 20
    unit: mm
    kind: design
    source: design
    note: Short cross-section test piece.
parts:
- id: camera_plate
  role: final
  material: PLA (high-speed PLA)
  code: "def build(p):\n    body = (cq.Workplane('XY').rect(p.receiver_plate_width,\
    \ p.plate_length)\n            .workplane(offset=p.plate_body_thickness)\n   \
    \         .rect(p.dovetail_top_width, p.plate_length).loft(combine=True))\n  \
    \  pad = (cq.Workplane('XY').box(p.camera_pad_width, p.camera_pad_width,\n   \
    \                               p.camera_pad_height, centered=(True, True, False))\n\
    \           .translate((0, 0, p.plate_body_thickness)))\n    part = body.union(pad)\n\
    \    total_h = p.plate_body_thickness + p.camera_pad_height\n    shank = cq.Workplane('XY').circle(p.bolt_shank_hole_diameter\
    \ / 2).extrude(total_h)\n    part = part.cut(shank)\n    pocket_d = p.bolt_head_diameter\
    \ + p.bolt_head_clearance\n    pocket = cq.Workplane('XY').circle(pocket_d / 2).extrude(p.bolt_head_pocket_depth)\n\
    \    channel_len = p.plate_length / 2\n    channel = (cq.Workplane('XY').box(pocket_d\
    \ + p.bolt_channel_clearance, channel_len + 0.5,\n                           \
    \           p.bolt_head_pocket_depth,\n                                      centered=(True,\
    \ True, False))\n               .translate((0, -channel_len / 2, 0)))\n    part\
    \ = part.cut(pocket.union(channel))\n    return part"
  print_orientation: Lay the broad, maximum-width underside (z=0) on the bed; dovetail
    slopes rise inward. No supports should be needed; the short roof over the bolt
    channel is a bridge under 16 mm.
  use_orientation: Angled rails down into the tripod's clamp; raised square pad faces
    up toward camera. Slide the bolt head in from the open end of the underside channel,
    with its shaft pointing upward through the center hole.
- id: fit_coupon
  role: coupon
  material: PLA (high-speed PLA)
  code: "def build(p):\n    return (cq.Workplane('XY').rect(p.receiver_plate_width,\
    \ p.coupon_length)\n            .workplane(offset=p.plate_body_thickness)\n  \
    \          .rect(p.dovetail_top_width, p.coupon_length).loft(combine=True))"
  print_orientation: Broad, maximum-width underside (z=0) flat on the bed.
  use_orientation: Test-fit the angled rails in the clamp jaws before printing or
    using the full plate; it is only a profile sample.
hardware:
- id: camera_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_thread_joint
  fastener: camera_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: camera_plate
    feature: underside bolt-head pocket/channel
    role: head_seat
  - part: camera_plate
    feature: central shank clearance hole
    role: clearance
  nut: null
  external: camera's 1/4-20 socket
criteria:
- id: clamp_profile_fit
  part: fit_coupon
  feature: 38 mm wide angled dovetail rails
  relation: seats
  hardware: null
  clearance_mm: 0.3
  params:
  - receiver_plate_width
  - dovetail_top_width
  - plate_body_thickness
  check:
    method: template
    ref: null
    description: Print the coupon and check that it drops between the jaws and is
      gripped securely when the knob is tightened. If it rocks, will not seat, or
      does not engage the lips, do not use the full plate; the clamp profile is not
      confirmed.
- id: camera_bolt_clearance
  part: camera_plate
  feature: central shank clearance hole
  relation: clears
  hardware: camera_bolt
  clearance_mm: 0.45
  params:
  - camera_bolt_major_d
  - bolt_shank_hole_diameter
  check:
    method: measure
    ref: null
    description: Confirm the metal bolt passes freely and is not forced into plastic.
- id: bolt_engagement
  part: camera_plate
  feature: bolt projection above raised camera pad
  relation: engages
  hardware: camera_bolt
  clearance_mm: null
  params:
  - bolt_under_head_length
  - plate_body_thickness
  - camera_pad_height
  - bolt_head_pocket_depth
  check:
    method: measure
    ref: null
    description: With the plate and bolt held together, check that the bolt enters
      the camera socket without bottoming out. Stop if it bottoms before the camera
      is clamped.
manual:
- n: '1'
  text: Print the fit_coupon first in the stated orientation. Try it in the tripod
    jaws. The 38 mm width is reported, but the exact lip profile is unknown; do not
    continue if the coupon does not seat firmly.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: If the coupon seats well, print camera_plate flat on its broad underside.
    Inspect the dovetail edges and raised camera pad for defects; do not use a cracked
    or warped print.
  parts:
  - camera_plate
  hardware: []
  tool: null
- n: '3'
  text: Slide the salvaged metal webcam-mount bolt head into the open underside channel
    from the plate end until the shank is centered in the hole. The bolt points upward.
    Verify it slides freely and the head is retained when centered.
  parts:
  - camera_plate
  hardware:
  - camera_bolt
  tool: null
- n: '4'
  text: Thread the metal bolt into the camera by hand. Stop if it binds or bottoms
    before the camera sits against the raised pad. Tighten only gently; the plastic
    plate is temporary and the screw must not be forced.
  parts:
  - camera_plate
  hardware:
  - camera_bolt
  tool: null
- n: '5'
  text: Drop the plate into the tripod clamp from above and tighten the knob gently.
    Check for rocking and recheck the clamp before each use. Keep the setup close
    to a padded surface and use only with a light camera while supervised.
  parts:
  - camera_plate
  hardware:
  - camera_bolt
  tool: null
