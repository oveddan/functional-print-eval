task: tripod-plate
note: 'This is a temporary quick-release plate. I could not get the clamp''s lip angle,
  slot depth or jaw length, so those values are guessed: a 45° lip over 3 mm, and
  a 2 mm vertical edge. Print the coupon first. I did not print the 1/4-20 screw.
  Printed 1/4-20 threads are weak and often don''t fit the camera. The plate uses
  your salvaged webcam bolt, which is about 10 mm long and has a head about 15 mm
  across. The bolt head is captured in a channel on the underside of the plate. The
  camera sits about 7 mm of thread deep into the socket. If your camera socket is
  shallower than that, turn the bolt in less. The bolt head sits 0.4 mm below the
  plate''s bottom face so it doesn''t lift the plate off the clamp floor.'
questions:
- text: What are the clamp's lip angle, slot depth and jaw length? I couldn't get
    these from the measurements, so I guessed them.
  answer: null
- text: 'What shape is the webcam bolt''s head: round knob, hex, or something else?
    It may be hard to turn flush in the channel.'
  answer: null
params:
  clamp_w:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: width of plate the tripod clamp takes
  fit_clr:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: total width reduction so the plate drops into the jaws
  plate_len:
    value: 55
    unit: mm
    kind: design
    source: design
    note: ''
  plate_t:
    value: 8
    unit: mm
    kind: design
    source: design
    note: 2.6 mm web above the head recess
  skirt_h:
    value: 2
    unit: mm
    kind: world
    source: guessed
    note: vertical edge height before the lip chamfer; lip geometry NOT measured,
      check with coupon
  chamfer:
    value: 3
    unit: mm
    kind: world
    source: guessed
    note: 45 degree lip bevel, inward 3 mm each side; NOT measured, check with coupon
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: about 15 mm
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: about 5 mm
  bolt_len:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: under head, about 10 mm
  bolt_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 major diameter
  slot_clr:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: ''
  head_clr:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: ''
  head_recess_extra:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: head sits this far below the plate's bottom face
  bolt_end_y:
    value: 12
    unit: mm
    kind: design
    source: design
    note: furthest bolt position toward the closed end
  coupon_len:
    value: 24
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: plate
  role: final
  material: PLA
  code: "def make(p, L, yend):\n    w = p.clamp_w - p.fit_clr\n    t = p.plate_t\n\
    \    sk = p.skirt_h\n    c = p.chamfer\n    pts = [(-w/2,0),(w/2,0),(w/2,sk),(w/2-c,sk+c),(w/2-c,t),(-w/2+c,t),(-w/2+c,sk+c),(-w/2,sk)]\n\
    \    body = cq.Workplane('XZ').polyline(pts).close().extrude(L/2, both=True)\n\
    \    rec_d = p.bolt_head_h + p.head_recess_extra\n    hr = (p.bolt_head_d + p.head_clr)/2\n\
    \    sr = (p.bolt_d + p.slot_clr)/2\n    y0 = -L/2 - 1\n    chan = (cq.Workplane('XY').center(0,(y0+yend)/2).rect(2*hr,\
    \ yend-y0).extrude(rec_d)\n            .union(cq.Workplane('XY').center(0,yend).circle(hr).extrude(rec_d)))\n\
    \    slot = (cq.Workplane('XY').center(0,(y0+yend)/2).rect(2*sr, yend-y0).extrude(t)\n\
    \            .union(cq.Workplane('XY').center(0,yend).circle(sr).extrude(t)))\n\
    \    return body.cut(chan).cut(slot)\n\ndef build(p):\n    return make(p, p.plate_len,\
    \ p.bolt_end_y)\n"
  print_orientation: wide bottom face (the one with the head channel) flat on the
    bed
  use_orientation: bottom in the tripod clamp, camera on the top face
- id: fit-coupon
  role: coupon
  material: PLA
  code: "def make(p, L, yend):\n    w = p.clamp_w - p.fit_clr\n    t = p.plate_t\n\
    \    sk = p.skirt_h\n    c = p.chamfer\n    pts = [(-w/2,0),(w/2,0),(w/2,sk),(w/2-c,sk+c),(w/2-c,t),(-w/2+c,t),(-w/2+c,sk+c),(-w/2,sk)]\n\
    \    body = cq.Workplane('XZ').polyline(pts).close().extrude(L/2, both=True)\n\
    \    rec_d = p.bolt_head_h + p.head_recess_extra\n    hr = (p.bolt_head_d + p.head_clr)/2\n\
    \    sr = (p.bolt_d + p.slot_clr)/2\n    y0 = -L/2 - 1\n    chan = (cq.Workplane('XY').center(0,(y0+yend)/2).rect(2*hr,\
    \ yend-y0).extrude(rec_d)\n            .union(cq.Workplane('XY').center(0,yend).circle(hr).extrude(rec_d)))\n\
    \    slot = (cq.Workplane('XY').center(0,(y0+yend)/2).rect(2*sr, yend-y0).extrude(t)\n\
    \            .union(cq.Workplane('XY').center(0,yend).circle(sr).extrude(t)))\n\
    \    return body.cut(chan).cut(slot)\n\ndef build(p):\n    return make(p, p.coupon_len,\
    \ 0)\n"
  print_orientation: wide bottom face flat on the bed
  use_orientation: test in the tripod clamp, bolt head slid in from the end
hardware:
- id: cam-bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: cam-bolt-joint
  fastener: cam-bolt
  axis_origin:
  - 0.0
  - 0.0
  - 5.4
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: head channel
    role: head_seat
  - part: plate
    feature: bolt slot
    role: clearance
  nut: null
  external: camera's 1/4-20 tripod socket
criteria:
- id: c1
  part: plate
  feature: dovetail edge profile (38 mm width, chamfered lips)
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - clamp_w
  - fit_clr
  - skirt_h
  - chamfer
  check:
    method: coupon
    ref: fit-coupon
    description: Print the coupon and clamp it in the tripod head. It should drop
      in and grip firmly without the knob over-travelling.
- id: c2
  part: plate
  feature: bolt slot
  relation: clears
  hardware: cam-bolt
  clearance_mm: 0.6
  params:
  - bolt_d
  - slot_clr
  check:
    method: coupon
    ref: fit-coupon
    description: Bolt shank slides in the slot from the open end.
- id: c3
  part: plate
  feature: head channel
  relation: contains
  hardware: cam-bolt
  clearance_mm: 0.8
  params:
  - bolt_head_d
  - bolt_head_h
  - head_clr
  - head_recess_extra
  check:
    method: coupon
    ref: fit-coupon
    description: Bolt head slides into the channel and sits below the bottom face.
- id: c4
  part: plate
  feature: 2.6 mm web above head channel
  relation: supports
  hardware: cam-bolt
  clearance_mm: null
  params:
  - plate_t
  - bolt_head_h
  - head_recess_extra
  check:
    method: measure
    ref: null
    description: Web thickness is 8 - 5.4 = 2.6 mm; bolt thread must still stand proud
      of the top face by about 7 mm.
manual:
- n: '1'
  text: Print the fit-coupon first, with the wide face flat on the bed. Drop it into
    the tripod clamp and tighten the knob. If it is loose, make the lip chamfer or
    plate width bigger. If it won't go in, make fit_clr bigger. Then slide the salvaged
    bolt head into the coupon's channel to check it fits.
  parts:
  - fit-coupon
  hardware:
  - cam-bolt
  tool: null
- n: '2'
  text: Print the plate with the wide channel face down on the bed. Use 4 walls and
    40% infill or more, because it carries your camera.
  parts:
  - plate
  hardware: []
  tool: null
- n: '3'
  text: Screw the salvaged 1/4-20 bolt into the camera socket by hand. Stop when the
    head is about 3 mm off the camera base.
  parts: []
  hardware:
  - cam-bolt
  tool: null
- n: '4'
  text: Slide the plate's open slot end sideways over the bolt. The shank goes in
    the narrow slot and the head goes in the wide channel underneath.
  parts:
  - plate
  hardware:
  - cam-bolt
  tool: null
- n: '5'
  text: Turn the bolt head clockwise with your fingertips through the open end of
    the channel until the plate is tight against the camera. Slide the plate along
    the slot to balance the camera first.
  parts: []
  hardware:
  - cam-bolt
  tool: null
- n: '6'
  text: Drop the plate into the tripod clamp and tighten the knob. Keep a hand on
    the camera for the first few minutes.
  parts: []
  hardware: []
  tool: null
