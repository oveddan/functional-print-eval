task: tripod-plate
note: Designed a standard 38 mm Arca-Swiss quick-release camera plate (`arca_plate`),
  a fast test coupon (`dovetail_coupon`), and an optional fully 3D-printed 1/4"-20
  thumbscrew (`printed_thumb_screw`). Strongly recommend using your metal `salvaged:webcam-mount-bolt`
  in the plate's recessed counterbore slot rather than the PLA screw so that plastic
  threads cannot shear off inside the camera socket. Print orientation places the
  top (camera-facing) side on the bed (z=0) so the camera rests on a smooth, flat
  surface and the underside counterbore prints upward without any overhangs or supports.
questions:
- text: What are the dimensions and clamping style of the tripod head socket?
  answer: 38 mm wide plate that drops in from above into jaws with angled lips tightened
    by a knob (standard 38 mm Arca-Swiss dovetail), and a standard 1/4"-20 camera
    socket.
- text: What are the dimensions of your salvaged 1/4"-20 webcam-mount bolt?
  answer: It is a 1/4"-20 bolt with a ~15 mm diameter, ~5 mm tall head and a ~10 mm
    shaft under the head.
params:
  bolt_shaft_l:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: Measured length of the salvaged webcam mount bolt under the head (~10 mm)
  dovetail_lip_h:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: Vertical height of the lower lip below the 45-degree dovetail bevel (total
      lip + bevel = 8.0 mm)
  bottom_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Small 45-deg bevel on the bottom-outer edge of the dovetail lip for drop-in
      ease and standard Arca double-bevel profile
  corner_r:
    value: 3
    unit: mm
    kind: design
    source: design
    note: Corner fillet radius on the plate ends in the XY plane
  knurl_count:
    value: 12
    unit: count
    kind: design
    source: design
    note: Number of grip flutes around the printed thumbscrew head
  plate_thickness:
    value: 10.5
    unit: mm
    kind: design
    source: design
    note: Total thickness of the plate; 10.5 mm gives a 5.0 mm solid clamping web
      and full 5.5 mm recess for the 5 mm bolt head
  printed_screw_head_d:
    value: 16.5
    unit: mm
    kind: design
    source: design
    note: Outer diameter of the optional printed 1/4-20 thumbscrew head (fits inside
      the 18 mm counterbore)
  counterbore_depth:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Depth of bolt head recess from the underside; leaves 5.0 mm web so a 10
      mm bolt protrudes 5.0 mm into the camera and the 5 mm head is recessed 0.5 mm
  coupon_length:
    value: 24
    unit: mm
    kind: design
    source: design
    note: Length of the quick test print coupon
  printed_thread_clearance:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: Radial clearance on the 3D-printed 1/4-20 male thread so 0.2 mm layers fit
      female metal threads without binding
  slot_w:
    value: 7
    unit: mm
    kind: design
    source: design
    note: Through-slot width for 1/4-20 (6.35 mm) bolt shaft with clearance
  dovetail_bevel_h:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: Height of the 45-degree Arca-Swiss angled dovetail face
  bolt_thread_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 nominal major diameter (6.35 mm)
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Measured diameter of the salvaged webcam mount bolt head (~15 mm)
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Measured height of the salvaged webcam mount bolt head (~5 mm)
  counterbore_d:
    value: 18
    unit: mm
    kind: design
    source: design
    note: Underside slot counterbore width to clear the 15 mm bolt head or printed
      thumbscrew head with 1.5 mm radial clearance
  undercut_h:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: Height of the straight unthreaded relief neck under the printed screw head
      so it can rotate freely in the plate
  slot_travel:
    value: 14
    unit: mm
    kind: design
    source: design
    note: Center-to-center travel length of the mounting slot for camera positioning
  clamp_plate_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: Measured width of the tripod clamp plate (38 mm standard Arca-Swiss base
      width)
  plate_length:
    value: 50
    unit: mm
    kind: design
    source: design
    note: Front-to-back length of the quick-release plate
  thread_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 thread pitch in mm (25.4 / 20 = 1.27 mm)
parts:
- id: arca_plate
  role: final
  material: PLA
  code: "def build(p):\n    # Modelled upside-down for support-free printing:\n  \
    \  # z = 0 is the flat top surface that contacts the camera base.\n    # z = p.plate_thickness\
    \ is the bottom face of the plate that sits in the tripod clamp.\n    w = p.clamp_plate_width\n\
    \    l = p.plate_length\n    h = p.plate_thickness\n    bevel = p.dovetail_bevel_h\n\
    \    lip = p.dovetail_lip_h\n    chamf = p.bottom_chamfer\n\n    # Side-view cross-section\
    \ in XZ plane, extruded along Y:\n    # From z=0 (camera side) up to z = h - lip\
    \ - bevel: narrower neck of the dovetail\n    # From z = h - lip - bevel to z\
    \ = h - lip: 45-degree outward bevel to full width w\n    # From z = h - lip to\
    \ z = h - chamf: full width w (38 mm)\n    # From z = h - chamf to z = h: small\
    \ bottom-edge chamfer\n    z1 = h - lip - bevel\n    z2 = h - lip\n    z3 = h\
    \ - chamf\n    w_neck = w - 2.0 * bevel\n    w_top = w - 2.0 * chamf\n\n    pts\
    \ = [\n        (-w_neck / 2.0, 0.0),\n        (w_neck / 2.0, 0.0),\n        (w_neck\
    \ / 2.0, z1),\n        (w / 2.0, z2),\n        (w / 2.0, z3),\n        (w_top\
    \ / 2.0, h),\n        (-w_top / 2.0, h),\n        (-w / 2.0, z3),\n        (-w\
    \ / 2.0, z2),\n        (-w_neck / 2.0, z1),\n    ]\n\n    body = (\n        cq.Workplane(\"\
    XZ\")\n        .polyline(pts)\n        .close()\n        .extrude(l / 2.0, both=True)\n\
    \    )\n\n    # Round the 4 vertical corners in XY for smooth drop-in into the\
    \ clamp\n    body = body.edges(\"|Z\").fillet(p.corner_r)\n\n    # Cut the through-slot\
    \ for the 1/4\"-20 shaft\n    slot_len = p.slot_travel + p.slot_w\n    body =\
    \ (\n        body.faces(\"<Z\")\n        .workplane()\n        .slot2D(slot_len,\
    \ p.slot_w, 90.0)\n        .cutThruAll()\n    )\n\n    # Cut the bolt-head counterbore\
    \ pocket from the top face in print frame (+Z, underside in use)\n    cb_len =\
    \ p.slot_travel + p.counterbore_d\n    body = (\n        body.faces(\">Z\")\n\
    \        .workplane()\n        .slot2D(cb_len, p.counterbore_d, 90.0)\n      \
    \  .cutBlind(-p.counterbore_depth)\n    )\n\n    return body\n"
  print_orientation: Camera-contact face down on the build plate (z = 0), with the
    bolt-head counterbore opening upward (+Z) so the 45-degree dovetail bevels and
    counterbore print cleanly with zero supports.
  use_orientation: Flipped over from print orientation so the flat camera-contact
    face (z = 0) faces up against the camera base and the recessed counterbore faces
    down into the tripod clamp.
- id: dovetail_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    # Short slice of the dovetail and counterbore to test\
    \ tripod clamp fit and bolt head seating\n    w = p.clamp_plate_width\n    l =\
    \ p.coupon_length\n    h = p.plate_thickness\n    bevel = p.dovetail_bevel_h\n\
    \    lip = p.dovetail_lip_h\n    chamf = p.bottom_chamfer\n\n    z1 = h - lip\
    \ - bevel\n    z2 = h - lip\n    z3 = h - chamf\n    w_neck = w - 2.0 * bevel\n\
    \    w_top = w - 2.0 * chamf\n\n    pts = [\n        (-w_neck / 2.0, 0.0),\n \
    \       (w_neck / 2.0, 0.0),\n        (w_neck / 2.0, z1),\n        (w / 2.0, z2),\n\
    \        (w / 2.0, z3),\n        (w_top / 2.0, h),\n        (-w_top / 2.0, h),\n\
    \        (-w / 2.0, z3),\n        (-w / 2.0, z2),\n        (-w_neck / 2.0, z1),\n\
    \    ]\n\n    coupon = (\n        cq.Workplane(\"XZ\")\n        .polyline(pts)\n\
    \        .close()\n        .extrude(l / 2.0, both=True)\n        .edges(\"|Z\"\
    )\n        .fillet(p.corner_r)\n    )\n\n    coupon = (\n        coupon.faces(\"\
    <Z\")\n        .workplane()\n        .circle(p.slot_w / 2.0)\n        .cutThruAll()\n\
    \    )\n\n    coupon = (\n        coupon.faces(\">Z\")\n        .workplane()\n\
    \        .circle(p.counterbore_d / 2.0)\n        .cutBlind(-p.counterbore_depth)\n\
    \    )\n\n    return coupon\n"
  print_orientation: Flat face down on the build plate (z = 0), counterbore facing
    up (+Z).
  use_orientation: Flipped over and dropped into the tripod clamp jaws from above.
- id: printed_thumb_screw
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    # Optional fully 3D-printed 1/4\"-20 thumbscrew\
    \ (use metal webcam bolt instead whenever possible!)\n    # z = 0 is the bottom\
    \ of the thumbscrew head on the bed; shaft points up (+Z).\n    head_r = p.printed_screw_head_d\
    \ / 2.0\n    head_h = p.bolt_head_h\n    shaft_l = p.bolt_shaft_l\n    pitch =\
    \ p.thread_pitch\n    major_r = (p.bolt_thread_d / 2.0) - p.printed_thread_clearance\n\
    \    thread_depth = 0.54 * pitch\n    minor_r = major_r - thread_depth\n\n   \
    \ # Knurled head\n    head = cq.Workplane(\"XY\").circle(head_r).extrude(head_h)\n\
    \    flute_r = 1.0\n    for i in range(int(p.knurl_count)):\n        ang = 2.0\
    \ * math.pi * i / p.knurl_count\n        fx = head_r * math.cos(ang)\n       \
    \ fy = head_r * math.sin(ang)\n        cutter = cq.Workplane(\"XY\").center(fx,\
    \ fy).circle(flute_r).extrude(head_h)\n        head = head.cut(cutter)\n\n   \
    \ # Core shaft (smooth minor diameter cylinder from head up to top of screw)\n\
    \    core = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=head_h)\n\
    \        .circle(minor_r)\n        .extrude(shaft_l)\n    )\n    screw = head.union(core)\n\
    \n    # Add 45-degree printable annular V-ridges spaced by 1/4\"-20 pitch (1.27\
    \ mm)\n    # on the upper threaded portion of the shaft (above the smooth captive\
    \ relief neck)\n    start_z = head_h + p.undercut_h\n    end_z = head_h + shaft_l\
    \ - 0.8\n    num_ridges = int((end_z - start_z) / pitch)\n    for k in range(num_ridges):\n\
    \        zc = start_z + (k + 0.5) * pitch\n        half_w = pitch * 0.45\n   \
    \     ridge_pts = [\n            (minor_r - 0.1, zc - half_w),\n            (major_r,\
    \ zc),\n            (minor_r - 0.1, zc + half_w),\n        ]\n        ridge =\
    \ (\n            cq.Workplane(\"XZ\")\n            .polyline(ridge_pts)\n    \
    \        .close()\n            .revolve(360.0, (0, 0, 0), (0, 1, 0))\n       \
    \ )\n        screw = screw.union(ridge)\n\n    return screw\n"
  print_orientation: Thumbscrew head flat on the build plate (z = 0), threaded shaft
    pointing straight up (+Z).
  use_orientation: Inserted upward through the underside counterbore of the plate
    into the camera's 1/4-20 socket.
hardware:
- id: cam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: j_camera_mount
  fastener: cam_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 4.5
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: arca_plate
    feature: bolt_head_counterbore
    role: head_seat
  - part: arca_plate
    feature: bolt_shaft_slot
    role: clearance
  nut: null
  external: camera 1/4-20 socket
criteria:
- id: c_clamp_fit
  part: arca_plate
  feature: dovetail_profile
  relation: engages
  hardware: null
  clearance_mm: 0.0
  params:
  - clamp_plate_width
  - plate_thickness
  - dovetail_lip_h
  - dovetail_bevel_h
  - bottom_chamfer
  check:
    method: coupon
    ref: dovetail_coupon
    description: Check that the 38 mm dovetail profile drops cleanly into the tripod
      clamp jaws and clamps tightly when the knob is turned.
- id: c_bolt_head_seat
  part: arca_plate
  feature: bolt_head_counterbore
  relation: seats
  hardware: cam_bolt
  clearance_mm: 1.0
  params:
  - bolt_head_d
  - bolt_head_h
  - counterbore_d
  - counterbore_depth
  check:
    method: coupon
    ref: dovetail_coupon
    description: Check that the 15 mm x 5 mm bolt head seats inside the underside
      counterbore pocket without protruding below the bottom of the plate, and the
      shaft clears the central slot.
- id: c_camera_thread_engagement
  part: arca_plate
  feature: bolt_shaft_slot
  relation: clears
  hardware: cam_bolt
  clearance_mm: 0.65
  params:
  - bolt_thread_d
  - bolt_shaft_l
  - slot_w
  - plate_thickness
  - counterbore_depth
  check:
    method: measure
    ref: null
    description: Check that the bolt shaft clears the central slot and protrudes ~5
      mm above the top face to engage the camera's 1/4"-20 socket.
- id: c_printed_screw_fit
  part: printed_thumb_screw
  feature: printed_1_4_20_thread
  relation: engages
  hardware: null
  clearance_mm: 0.25
  params:
  - bolt_thread_d
  - thread_pitch
  - printed_thread_clearance
  - bolt_shaft_l
  check:
    method: measure
    ref: null
    description: Check that the optional printed 1/4"-20 screw threads smoothly into
      an ASME 1/4"-20 nut or camera socket and clears the plate slot.
manual:
- n: '1'
  text: Print the `dovetail_coupon` test slice first (about 10 minutes). Drop it into
    your tripod's clamp from above and tighten the knob to verify the 38 mm Arca-Swiss
    dovetail fit, and test-fit your salvaged 1/4"-20 webcam-mount bolt into its underside
    counterbore.
  parts:
  - dovetail_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Print the `arca_plate` flat on the build plate (3–4 wall loops and 40%+ infill
    recommended for stiffness). Note: printing a 1/4"-20 screw in PLA is weak across
    layer lines and risks snapping off inside your camera''s tripod socket! Because
    you have the metal `salvaged:webcam-mount-bolt` (1/4"-20, 10 mm shaft, 15x5 mm
    head), use the metal bolt for strength. If you still want a fully 3D-printed backup
    screw for a very light load, also print `printed_thumb_screw` with 100% infill.'
  parts:
  - arca_plate
  - printed_thumb_screw
  hardware: []
  tool: null
- n: '3'
  text: Insert the 1/4"-20 `salvaged:webcam-mount-bolt` (or `printed_thumb_screw`)
    up through the underside counterbore slot of the `arca_plate`. The 5.5 mm deep
    counterbore leaves a 5.0 mm web under the camera, so 5.0 mm of thread protrudes
    above the plate (about 4 full threads in the camera socket) while the 5 mm tall
    bolt head sits recessed inside the plate.
  parts:
  - arca_plate
  hardware:
  - cam_bolt
  tool: null
- n: '4'
  text: Thread the protruding bolt into the 1/4"-20 socket on the bottom of your camera
    until snug. Drop the plate into your tripod's clamp jaws from above and tighten
    the clamp knob firmly.
  parts:
  - arca_plate
  hardware:
  - cam_bolt
  tool: null
