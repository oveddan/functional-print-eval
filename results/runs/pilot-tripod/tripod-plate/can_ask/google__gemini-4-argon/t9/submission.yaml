task: tripod-plate
note: Rather than 3D-printing a plastic 1/4"-20 screw—which can easily shear off flush
  inside your camera's tripod socket—this design pairs a 3D-printed 38 mm Arca-Swiss
  style dovetail plate with your salvaged metal 1/4"-20 webcam mount bolt (salvaged:webcam-mount-bolt).
  The 10 mm plate height and 5.2 mm deep underside channel recess the 5 mm bolt head
  completely below the bottom face while leaving ~4.8 mm of solid top web and ~5.2
  mm of exposed metal thread to engage the camera socket.
questions: []
params:
  bolt_hole_clearance:
    value: 0.45
    unit: mm
    kind: design
    source: design
    note: Diametral clearance for the 1/4-20 bolt shaft through the plate web
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Measured height of the salvaged webcam bolt head
  plate_h:
    value: 10
    unit: mm
    kind: design
    source: design
    note: Overall height of the quick-release plate
  bolt_head_recess_extra_h:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: Extra recess depth so the 5 mm bolt head stays recessed above z=0
  base_lip_h:
    value: 2
    unit: mm
    kind: design
    source: design
    note: Vertical lower wall height below the 45-degree dovetail bevel
  bolt_shaft_l:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: Measured shaft length under the head of the salvaged webcam bolt
  clamp_clearance:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: Width clearance so the plate drops smoothly into the 38 mm clamp jaws
  coupon_l:
    value: 18
    unit: mm
    kind: design
    source: design
    note: Length of the quick test coupon along the clamp jaws
  plate_l:
    value: 50
    unit: mm
    kind: design
    source: design
    note: Length of the full quick-release plate along the dovetail rails
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Measured diameter across the salvaged webcam bolt head
  bolt_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 thread pitch
  camera_socket_engagement:
    value: 4.8
    unit: mm
    kind: world
    source: datasheet
    note: Standard 1/4-20 camera tripod socket thread engagement depth (ISO 1222)
  dovetail_angle:
    value: 45
    unit: deg
    kind: world
    source: datasheet
    note: Standard 45-degree dovetail angle for 38 mm Arca-Swiss style tripod clamps
  bolt_head_radial_clearance:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Radial clearance around the 15 mm bolt head inside the underside channel
      for finger access
  bolt_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 nominal major diameter
  dovetail_h:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: Vertical height of the 45-degree angled dovetail bevel
  clamp_plate_w:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: Measured width of the plate accepted by the tripod clamp jaws
parts:
- id: qr_plate
  role: final
  material: PLA
  code: "def build(p):\n    w = p.clamp_plate_w - p.clamp_clearance\n    half_w =\
    \ w / 2.0\n    lip_h = p.base_lip_h\n    dt_h = p.dovetail_h\n    h = p.plate_h\n\
    \    top_half_w = half_w - dt_h\n\n    pts = [\n        (-half_w, 0.0),\n    \
    \    (half_w, 0.0),\n        (half_w, lip_h),\n        (top_half_w, lip_h + dt_h),\n\
    \        (top_half_w, h),\n        (-top_half_w, h),\n        (-top_half_w, lip_h\
    \ + dt_h),\n        (-half_w, lip_h),\n    ]\n\n    body = (\n        cq.Workplane(\"\
    XZ\")\n        .polyline(pts)\n        .close()\n        .extrude(p.plate_l /\
    \ 2.0, both=True)\n    )\n\n    cbore_h = p.bolt_head_h + p.bolt_head_recess_extra_h\n\
    \    trough_w = p.bolt_head_d + 2.0 * p.bolt_head_radial_clearance\n    hole_d\
    \ = p.bolt_d + p.bolt_hole_clearance\n\n    trough = (\n        cq.Workplane(\"\
    XY\")\n        .box(trough_w, p.plate_l, cbore_h, centered=(True, True, False))\n\
    \    )\n\n    shaft_hole = (\n        cq.Workplane(\"XY\")\n        .circle(hole_d\
    \ / 2.0)\n        .extrude(h)\n    )\n\n    return body.cut(trough).cut(shaft_hole)\n"
  print_orientation: Bottom of the plate flat on the bed (z = 0); the 18 mm underside
    channel bridges cleanly across the center without supports.
  use_orientation: Same as print orientation (+Z up toward the camera base; 38 mm
    dovetail rails along X engage the tripod clamp jaws).
- id: qr_fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    w = p.clamp_plate_w - p.clamp_clearance\n    half_w =\
    \ w / 2.0\n    lip_h = p.base_lip_h\n    dt_h = p.dovetail_h\n    h = p.plate_h\n\
    \    top_half_w = half_w - dt_h\n\n    pts = [\n        (-half_w, 0.0),\n    \
    \    (half_w, 0.0),\n        (half_w, lip_h),\n        (top_half_w, lip_h + dt_h),\n\
    \        (top_half_w, h),\n        (-top_half_w, h),\n        (-top_half_w, lip_h\
    \ + dt_h),\n        (-half_w, lip_h),\n    ]\n\n    body = (\n        cq.Workplane(\"\
    XZ\")\n        .polyline(pts)\n        .close()\n        .extrude(p.coupon_l /\
    \ 2.0, both=True)\n    )\n\n    cbore_h = p.bolt_head_h + p.bolt_head_recess_extra_h\n\
    \    trough_w = p.bolt_head_d + 2.0 * p.bolt_head_radial_clearance\n    hole_d\
    \ = p.bolt_d + p.bolt_hole_clearance\n\n    trough = (\n        cq.Workplane(\"\
    XY\")\n        .box(trough_w, p.coupon_l, cbore_h, centered=(True, True, False))\n\
    \    )\n\n    shaft_hole = (\n        cq.Workplane(\"XY\")\n        .circle(hole_d\
    \ / 2.0)\n        .extrude(h)\n    )\n\n    return body.cut(trough).cut(shaft_hole)\n"
  print_orientation: Bottom face flat on the bed (z = 0).
  use_orientation: Drop into the tripod clamp jaws with +Z up to test dovetail clamping
    and bolt protrusion.
hardware:
- id: webcam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_mount_joint
  fastener: webcam_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 5.2
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: qr_plate
    feature: bolt_head_recess
    role: head_seat
  - part: qr_plate
    feature: bolt_shaft_hole
    role: clearance
  nut: null
  external: camera 1/4-20 tripod socket
criteria:
- id: clamp_dovetail_fit
  part: qr_plate
  feature: dovetail_rails
  relation: engages
  hardware: null
  clearance_mm: 0.2
  params:
  - clamp_plate_w
  - clamp_clearance
  - dovetail_angle
  - base_lip_h
  - dovetail_h
  check:
    method: coupon
    ref: qr_fit_coupon
    description: Print the short fit coupon first and drop it into the tripod clamp
      jaws; tighten the clamp knob to verify the 38 mm 45-degree dovetail seats and
      locks securely.
- id: bolt_clearance_and_seat
  part: qr_plate
  feature: bolt_shaft_hole
  relation: seats
  hardware: webcam_bolt
  clearance_mm: 0.45
  params:
  - bolt_d
  - bolt_hole_clearance
  - bolt_head_d
  - bolt_head_h
  - bolt_head_radial_clearance
  - bolt_head_recess_extra_h
  - plate_h
  check:
    method: coupon
    ref: qr_fit_coupon
    description: Insert the salvaged 1/4-20 webcam mount bolt into the coupon's underside
      recess and through the center hole to verify the head clears the bottom face
      (z=0) and ~5 mm of thread protrudes from the top face.
- id: camera_thread_engagement
  part: qr_plate
  feature: camera_top_deck
  relation: faces
  hardware: webcam_bolt
  clearance_mm: null
  params:
  - bolt_shaft_l
  - plate_h
  - bolt_head_h
  - bolt_head_recess_extra_h
  - camera_socket_engagement
  check:
    method: measure
    ref: null
    description: Check that the protruding 1/4-20 bolt threads smoothly into the camera
      tripod socket and pulls the camera base snug against the top face of the plate
      without bottoming out early.
manual:
- n: '1'
  text: Print the short test coupon (qr_fit_coupon) first. Drop it into the tripod
    clamp jaws and tighten the knob to confirm the 38 mm dovetail locks securely,
    and slip the salvaged 1/4-20 webcam mount bolt through the center hole to confirm
    ~5 mm of thread extends above the top face.
  parts:
  - qr_fit_coupon
  hardware:
  - webcam_bolt
  tool: null
- n: '2'
  text: Print the full quick-release plate (qr_plate) in PLA with its bottom face
    on the build plate (z = 0). Use at least 4 perimeter walls and 40% infill for
    stiffness under the camera.
  parts:
  - qr_plate
  hardware: []
  tool: null
- n: '3'
  text: Insert the salvaged 1/4-20 webcam mount bolt from the bottom recess of qr_plate
    through the center hole, hold the plate against the bottom of the camera, and
    turn the bolt head via the underside finger-access channel until the plate is
    snug against the camera base.
  parts:
  - qr_plate
  hardware:
  - webcam_bolt
  tool: null
- n: '4'
  text: Drop the plate (with camera attached) into the tripod head's 38 mm clamp jaws
    from above and tighten the clamp knob firmly. Check that the clamp jaws grip the
    angled dovetail rails securely before letting go of the camera.
  parts:
  - qr_plate
  hardware:
  - webcam_bolt
  tool: null
