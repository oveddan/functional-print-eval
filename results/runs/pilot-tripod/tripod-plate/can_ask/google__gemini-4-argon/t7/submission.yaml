task: tripod-plate
note: A 3D-printed plastic 1/4"-20 screw is very prone to snapping off inside the
  camera's tripod socket along layer lines. Since you have a salvaged metal 1/4"-20
  bolt from a webcam monitor mount (15 mm head, 5 mm head height, 10 mm shaft), this
  design uses a 3D-printed 38 mm Arca-Swiss style dovetail plate paired with that
  metal bolt. The plate prints upside-down (camera face on the bed at z=0) so the
  45-degree dovetail bevels and the bolt counterbore print cleanly with zero support
  material and maximum flange strength.
questions:
- text: What are the dimensions of the tripod clamp and the salvaged 1/4"-20 bolt?
  answer: 38 mm Arca-Swiss style clamp jaws with angled lips tightened by a knob;
    camera has a standard 1/4"-20 socket; salvaged 1/4"-20 webcam-mount bolt has a
    ~15 mm diameter x 5 mm tall head and ~10 mm shaft under the head.
params:
  plate_thickness:
    value: 11
    unit: mm
    kind: design
    source: design
    note: Total thickness of the quick-release plate (5.5 mm web + 5.5 mm counterbore
      depth = 11.0 mm) so the 5 mm bolt head sits fully recessed below the bottom
      surface
  web_thickness:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Clamping web thickness under the bolt head (5.5 mm leaves 4.5 mm of the
      10 mm bolt shaft protruding into the camera)
  bolt_shaft_clearance:
    value: 0.45
    unit: mm
    kind: design
    source: design
    note: Clearance added to 1/4-20 major diameter for free sliding in the slot
  bolt_shaft_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: Nominal major diameter of 1/4-20 thread (6.35 mm)
  dovetail_slope_h:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: Vertical height of the 45-degree angled dovetail bevel engaged by the clamp
      lips
  camera_socket_depth:
    value: 5.5
    unit: mm
    kind: world
    source: datasheet
    note: Standard ISO 1222 camera 1/4-20 tripod socket minimum depth (~5.5 mm; 4.5
      mm protrusion gives ~3.5 full threads without bottoming out)
  plate_length:
    value: 50
    unit: mm
    kind: design
    source: design
    note: Overall length of the quick-release plate along the clamp jaws
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Measured head height of salvaged:webcam-mount-bolt (~5 mm)
  dovetail_lip_h:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Vertical height of the lower 38 mm edge before the 45-degree bevel starts
  slot_travel:
    value: 14
    unit: mm
    kind: design
    source: design
    note: Center-to-center travel length of the bolt slot to allow balancing the camera
      position
  bolt_head_clearance:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Radial/diametral clearance around the ~15 mm bolt head so it slides smoothly
      in the counterbore slot
  bolt_shaft_l:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: Measured length under the head of salvaged:webcam-mount-bolt (~10 mm)
  dovetail_angle:
    value: 45
    unit: deg
    kind: world
    source: datasheet
    note: Standard 45-degree dovetail bevel angle for 38 mm Arca-Swiss style tripod
      clamp jaws
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Measured head diameter of salvaged:webcam-mount-bolt (~15 mm)
  clamp_plate_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: Measured width of the tripod clamp plate (38 mm Arca-Swiss standard)
  coupon_length:
    value: 22
    unit: mm
    kind: design
    source: design
    note: Length of the test coupon along the dovetail axis
  corner_fillet:
    value: 3
    unit: mm
    kind: design
    source: design
    note: Fillet radius on the vertical corners of the plate so it drops easily into
      the clamp jaws
parts:
- id: arca_plate
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    w_base = p.clamp_plate_width\n    h_total\
    \ = p.plate_thickness\n    h_lip = p.dovetail_lip_h\n    h_slope = p.dovetail_slope_h\n\
    \    inset = h_slope / math.tan(math.radians(p.dovetail_angle))\n    w_narrow\
    \ = w_base - 2.0 * inset\n\n    # Printed upside-down: z = 0 is the flat top face\
    \ that meets the camera base.\n    # z = h_total is the bottom face of the plate\
    \ that sits in the tripod clamp.\n    # From z = 0 up to z = h_total - h_lip -\
    \ h_slope, the plate has width w_base\n    # (or narrows at the dovetail neck\
    \ and flares out to w_base at the bottom rail).\n    # Wait: in an Arca-Swiss\
    \ plate, the WIDER 38 mm rail is at the BOTTOM of the plate\n    # (engaged under\
    \ the overhanging angled lips of the clamp jaws), and the narrower neck\n    #\
    \ is above the bevel, with a top camera platform above that—OR the bevel slopes\
    \ inward\n    # from the 38 mm bottom base up toward the camera face so the clamp's\
    \ overhanging lips\n    # trap the 38 mm base!\n    # Therefore, at the bottom\
    \ of the plate (in use), width is w_base (38 mm) for height h_lip,\n    # and\
    \ moving UP toward the camera, it bevels INWARD at 45 deg to w_narrow!\n    #\
    \ When printed upside-down (camera face on the bed at z = 0):\n    # - From z\
    \ = 0 to z = h_total - h_lip - h_slope: width is w_base (38 mm) so the camera\
    \ has a wide platform,\n    #   OR to fit jaws of any height, the entire upper\
    \ portion above the bevel is w_narrow!\n    # Making the camera-side width w_narrow\
    \ (31 mm) from z = 0 to z = h_total - h_lip - h_slope,\n    # then flaring OUTWARD\
    \ at 45 deg from w_narrow to w_base (38 mm), then straight for h_lip to z = h_total:\n\
    \    # That means a 45-degree outward overhang during printing (which prints cleanly\
    \ with zero supports!)\n    # AND guarantees that regardless of how tall the tripod's\
    \ clamp jaws are, the jaws never collide with an upper flange!\n\n    z_neck =\
    \ h_total - h_lip - h_slope\n    z_bevel_top = h_total - h_lip\n\n    pts = [\n\
    \        (-w_narrow / 2.0, 0.0),\n        (w_narrow / 2.0, 0.0),\n        (w_narrow\
    \ / 2.0, z_neck),\n        (w_base / 2.0, z_bevel_top),\n        (w_base / 2.0,\
    \ h_total),\n        (-w_base / 2.0, h_total),\n        (-w_base / 2.0, z_bevel_top),\n\
    \        (-w_narrow / 2.0, z_neck),\n    ]\n\n    body = (\n        cq.Workplane(\"\
    XZ\")\n        .polyline(pts)\n        .close()\n        .extrude(p.plate_length\
    \ / 2.0, both=True)\n    )\n\n    # Fillet the 4 vertical outer corners at +/-\
    \ w_base/2\n    body = body.edges(\"|Z\").fillet(p.corner_fillet)\n\n    # Cut\
    \ through-slot for the 1/4\"-20 bolt shaft (from z = 0 to z = h_total)\n    shaft_slot_w\
    \ = p.bolt_shaft_d + p.bolt_shaft_clearance\n    shaft_slot_l = p.slot_travel\
    \ + shaft_slot_w\n    body = (\n        body.faces(\"<Z\")\n        .workplane()\n\
    \        .slot2D(shaft_slot_l, shaft_slot_w, 90.0)\n        .cutThruAll()\n  \
    \  )\n\n    # Cut counterbore slot for the bolt head on the top-as-printed face\
    \ (z = h_total, which is the underside in use)\n    # Depth of counterbore leaves\
    \ p.web_thickness (5.5 mm) between z = 0 and the bolt head seat.\n    cbore_w\
    \ = p.bolt_head_d + p.bolt_head_clearance\n    cbore_l = p.slot_travel + cbore_w\n\
    \    cbore_depth = h_total - p.web_thickness\n    body = (\n        body.faces(\"\
    >Z\")\n        .workplane()\n        .slot2D(cbore_l, cbore_w, 90.0)\n       \
    \ .cutBlind(-cbore_depth)\n    )\n\n    return body\n"
  print_orientation: 'Upside-down compared to use: the flat camera-contacting face
    rests on the build plate (z = 0), and the bolt head counterbore opens upward at
    z = 11 mm. The 45-degree dovetail bevels slope outward at 45 degrees and print
    cleanly without supports.'
  use_orientation: Flipped so z = 0 faces up against the bottom of the camera, and
    the 38 mm dovetail base (z = 11 mm) sits down inside the tripod's clamp jaws.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    import math\n    w_base = p.clamp_plate_width\n    h_total\
    \ = p.plate_thickness\n    h_lip = p.dovetail_lip_h\n    h_slope = p.dovetail_slope_h\n\
    \    inset = h_slope / math.tan(math.radians(p.dovetail_angle))\n    w_narrow\
    \ = w_base - 2.0 * inset\n\n    z_neck = h_total - h_lip - h_slope\n    z_bevel_top\
    \ = h_total - h_lip\n\n    pts = [\n        (-w_narrow / 2.0, 0.0),\n        (w_narrow\
    \ / 2.0, 0.0),\n        (w_narrow / 2.0, z_neck),\n        (w_base / 2.0, z_bevel_top),\n\
    \        (w_base / 2.0, h_total),\n        (-w_base / 2.0, h_total),\n       \
    \ (-w_base / 2.0, z_bevel_top),\n        (-w_narrow / 2.0, z_neck),\n    ]\n\n\
    \    body = (\n        cq.Workplane(\"XZ\")\n        .polyline(pts)\n        .close()\n\
    \        .extrude(p.coupon_length / 2.0, both=True)\n    )\n\n    body = body.edges(\"\
    |Z\").fillet(p.corner_fillet)\n\n    shaft_d = p.bolt_shaft_d + p.bolt_shaft_clearance\n\
    \    cbore_d = p.bolt_head_d + p.bolt_head_clearance\n    cbore_depth = h_total\
    \ - p.web_thickness\n\n    body = (\n        body.faces(\"<Z\")\n        .workplane()\n\
    \        .circle(shaft_d / 2.0)\n        .cutThruAll()\n    )\n\n    body = (\n\
    \        body.faces(\">Z\")\n        .workplane()\n        .circle(cbore_d / 2.0)\n\
    \        .cutBlind(-cbore_depth)\n    )\n\n    return body\n"
  print_orientation: Camera-facing flat surface on the print bed (z = 0), counterbore
    open on top.
  use_orientation: Flipped so the 38 mm dovetail base drops into the tripod clamp
    jaws and the bolt inserts from underneath.
hardware:
- id: webcam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_mount_joint
  fastener: webcam_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 5.5
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: arca_plate
    feature: bolt_counterbore_slot
    role: head_seat
  - part: arca_plate
    feature: bolt_through_slot
    role: clearance
  nut: null
  external: camera 1/4-20 tripod socket
criteria:
- id: clamp_jaw_engagement
  part: arca_plate
  feature: dovetail_rails
  relation: engages
  hardware: null
  clearance_mm: 0.0
  params:
  - clamp_plate_width
  - dovetail_angle
  - dovetail_lip_h
  - dovetail_slope_h
  - plate_thickness
  check:
    method: coupon
    ref: fit_coupon
    description: Check that the 38 mm dovetail profile fits cleanly into the tripod
      clamp jaws and clamps tightly when the knob is turned.
- id: bolt_head_seat
  part: arca_plate
  feature: bolt_counterbore_slot
  relation: seats
  hardware: webcam_bolt
  clearance_mm: 0.5
  params:
  - bolt_head_d
  - bolt_head_h
  - bolt_head_clearance
  - bolt_shaft_d
  - bolt_shaft_clearance
  - web_thickness
  check:
    method: coupon
    ref: fit_coupon
    description: Check that the salvaged 1/4-20 webcam bolt head drops freely into
      the counterbore recess and its shaft passes cleanly through the center slot.
- id: camera_socket_engagement
  part: arca_plate
  feature: top_mounting_face
  relation: faces
  hardware: webcam_bolt
  clearance_mm: 0.5
  params:
  - bolt_shaft_l
  - web_thickness
  - camera_socket_depth
  check:
    method: measure
    ref: null
    description: Verify that the protruding 1/4-20 bolt threads engage the camera
      tripod socket securely (about 4.5 mm protrusion, ~3.5 full turns) without bottoming
      out before clamping the camera base flush against the plate top.
manual:
- n: '1'
  text: 'Print the short fit_coupon first (about a 10-minute print). Test-fit it into
    the tripod''s 38 mm clamp jaws and tighten the knob to confirm the dovetail profile
    locks securely. Also drop your salvaged 1/4"-20 webcam-mount bolt into the underside
    recess of the coupon to verify the head fits cleanly and leaves about 4.5 mm of
    thread protruding out the top. (Important: do NOT use a 3D-printed plastic screw—a
    1/4"-20 printed PLA stud is far too weak in layer tension and shear to hold a
    camera safely; the salvaged metal 1/4"-20 bolt from your webcam mount is much
    stronger and safer.)'
  parts:
  - fit_coupon
  hardware:
  - webcam_bolt
  tool: null
- n: '2'
  text: Print the full arca_plate flat on the build plate (underside down, z = 0 on
    the bed). For extra strength on a load-bearing camera part, use 4–5 wall loops
    and 40%+ infill. No supports are required because the underside counterbore is
    faces-up as printed (or if printed top-down, bridged cleanly—here the part is
    modeled with the flat camera-facing side on the bed z = 0 so the dovetail overhangs
    slope up at 45° and the counterbore is open on top, requiring zero supports and
    giving a smooth bottom surface against the camera).
  parts:
  - arca_plate
  hardware: []
  tool: null
- n: '3'
  text: Insert the salvaged 1/4"-20 webcam-mount bolt through the slot from the bottom
    of the arca_plate so its 15 mm head seats inside the recessed channel and the
    threaded shaft sticks out the flat camera side.
  parts:
  - arca_plate
  hardware:
  - webcam_bolt
  tool: null
- n: '4'
  text: Hold the bolt head with your fingers (or a coin/driver if slotted) and thread
    the protruding 1/4"-20 screw into the tripod socket on the bottom of your camera
    until snug. Slide the plate along the slot to center the camera's balance over
    the plate before tightening fully.
  parts:
  - arca_plate
  hardware:
  - webcam_bolt
  tool: null
- n: '5'
  text: Loosen the tripod clamp knob, drop the arca_plate with the attached camera
    into the 38 mm jaws from above, and tighten the clamp knob firmly. Check that
    the jaws grip the angled dovetail rails securely before letting go of the camera.
  parts:
  - arca_plate
  hardware: []
  tool: null
