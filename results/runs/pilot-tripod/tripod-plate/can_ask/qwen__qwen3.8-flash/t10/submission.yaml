task: tripod-plate
note: 'Two-piece temporary tripod adapter, sized to the one thing I could measure:
  the clamp takes a 38 mm wide plate. (1) plate: a 38 x 66 mm bar, 4 mm thick at the
  clamped ends, with a raised 26 mm centre pad. A pocket opens on the pad''s underside
  and swallows the fastener''s 15 x 5 mm head, so NOTHING protrudes below the plate
  - the design does not care about the under-plate clearance I could not measure.
  Four 0.2 mm-interference bumps make the bolt captive. A 0.4 mm register ring on
  the pad top stops the camera spinning. (2) camera_screw: a printed 1/4-20 screw
  (crest 6.3, core 5.2, 9 mm of thread with conical lead-in) with a flat-blade slot
  on its underside, seating in the same pocket - the all-printed fallback. I recommend
  the salvaged webcam-mount 1/4-20 bolt as the real fastener: it is already 15 x 5
  x 10 mm, exactly this geometry, and metal in your friend''s camera threads is much
  safer than printed ones; the printed thread is only trusted after the coupon''s
  6.15/6.30/6.45 mm samples are tried in the socket. fit_coupon checks the two unknowns
  (jaw grip thickness via 3/4/5/6 mm steps, pad drop-in via a full-size mock-up) plus
  bolt-head seat and thread fit before you print the final parts. Caveat noted in
  the manual: this is a temporary part - PLA creeps under a camera''s weight, so re-tighten
  every session and test over something soft.'
questions: []
params:
  plate_w:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: width of plate this clamp takes (Dan measured it)
  plate_l:
    value: 66
    unit: mm
    kind: design
    source: design
    note: overall length; round-ended bar gives ~14 mm of grip each side of the pad
  grip_t:
    value: 4
    unit: mm
    kind: world
    source: guessed
    note: thickness of plate the jaws clamp. NOT MEASURED - coupon steps of 3/4/5/6
      mm find the right one; sand or shim the plate to match
  pad_d:
    value: 26
    unit: mm
    kind: design
    source: design
    note: raised centre pad the camera sits on
  pad_clear:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: radial clearance between pad base and jaw lips
  head_pocket_d:
    value: 16.6
    unit: mm
    kind: design
    source: design
    note: 'bolt-head seat, machined into the pad from the underside: bolt_head_d 15.0
      + 1.6'
  head_pocket_depth:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: bolt_head_h 5.0 + 0.6
  web_t:
    value: 4.1
    unit: mm
    kind: design
    source: design
    note: solid web above the head pocket; pad top face = head_pocket_depth + web_t
      = 9.7 mm. Sanding the pad down is OK while >= 3 mm of web stays above the head
  neck_hole_d:
    value: 6.9
    unit: mm
    kind: design
    source: design
    note: 'guide hole through the web: thread_major 6.35 + 0.55 clearance'
  ring_od:
    value: 14
    unit: mm
    kind: design
    source: design
    note: 'low register ring on the pad top: stops the camera spinning on the plate'
  ring_id:
    value: 7.2
    unit: mm
    kind: design
    source: design
    note: ''
  ring_h:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: deliberately short - a 0.4 mm ridge bites into PLA but does not stop a flat
      camera base seating
  lead_chamfer:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: chamfer all round the plate's underside so it drops between the angled lips
  bolt_head_d:
    value: 15
    unit: mm
    kind: world
    source: measured
    note: salvaged webcam 1/4-20 bolt, head across
  bolt_head_h:
    value: 5
    unit: mm
    kind: world
    source: measured
    note: salvaged bolt head height
  bolt_thread_len:
    value: 10
    unit: mm
    kind: world
    source: measured
    note: 'thread under the salvaged bolt head: stands 5.9 mm proud of the pad top,
      enough for the socket'
  bump_n:
    value: 4
    unit: mm
    kind: design
    source: design
    note: detent bumps in the pocket that keep the bolt captive
  bump_d:
    value: 2.4
    unit: mm
    kind: design
    source: design
    note: ''
  bump_interf:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: each bump reaches 0.2 mm inside the bolt head's radius; press the head past
      them once, then it stays put. Set 0.0 in the slicer if it feels too stiff
  thread_major:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 UNC major diameter
  pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 pitch
  camera_socket_depth:
    value: 5.5
    unit: mm
    kind: world
    source: guessed
    note: typical depth of a 1/4-20 socket in a camera base
  screw_head_d:
    value: 14.5
    unit: mm
    kind: design
    source: design
    note: smaller than the bolt head on purpose, so it slides past the 4 detent bumps
      into the same pocket
  screw_head_h:
    value: 5.2
    unit: mm
    kind: design
    source: design
    note: ''
  screw_core_d:
    value: 5.2
    unit: mm
    kind: design
    source: design
    note: solid core the thread sits on
  screw_thread_od:
    value: 6.3
    unit: mm
    kind: design
    source: design
    note: crest of the printed thread; coupon tests 6.15 / 6.30 / 6.45 to find what
      your camera likes
  screw_thread_len:
    value: 9
    unit: mm
    kind: design
    source: design
    note: reaches 5 mm above the pad top face with the head seated on the pocket floor
  slot_w:
    value: 2.6
    unit: mm
    kind: design
    source: design
    note: flat-blade drive moulded in the underside of the screw head, reachable through
      the pocket mouth
  slot_len:
    value: 13
    unit: mm
    kind: design
    source: design
    note: ''
  slot_depth:
    value: 3.2
    unit: mm
    kind: design
    source: design
    note: leaves 2 mm of ceiling above the slot
parts:
- id: plate
  role: final
  material: PLA
  code: "def build(p):\n    hl = p.plate_l / 2.0\n    hw = p.plate_w / 2.0\n    straight\
    \ = 2.0 * hl - 2.0 * hw          # flat span between the two round ends\n    top_z\
    \ = p.head_pocket_depth + p.web_t   # pad top face = camera register face\n\n\
    \    # grip bar: 38 mm wide, 4 mm thick, round ends so it drops between the lips\n\
    \    w = cq.Workplane(\"XY\").box(straight, 2.0 * hw, p.grip_t, centered=(True,\
    \ True, False))\n    for sx in (-straight / 2.0, straight / 2.0):\n        w =\
    \ w.union(cq.Workplane(\"XY\").center(sx, 0).circle(hw).extrude(p.grip_t))\n\n\
    \    # centre pad, plus a short clearance collar at its foot so the jaw lips can\n\
    \    # ride over the pad without touching it\n    w = w.union(cq.Workplane(\"\
    XY\").workplane(offset=p.grip_t)\n                .circle(p.pad_d / 2.0 + p.pad_clear)\n\
    \                .extrude(p.head_pocket_depth - p.grip_t))\n    w = w.union(cq.Workplane(\"\
    XY\").circle(p.pad_d / 2.0).extrude(top_z))\n\n    # lead-in chamfer on everything\
    \ at the underside, cut before the pocket exists\n    w = w.faces(\"<Z\").chamfer(p.lead_chamfer)\n\
    \n    # head pocket, opening on the underside: the fastener head is buried here,\
    \ so\n    # nothing protrudes below the plate and no clearance is needed under\
    \ it\n    w = w.cut(cq.Workplane(\"XY\").workplane(offset=-0.3)\n            \
    \  .circle(p.head_pocket_d / 2.0).extrude(p.head_pocket_depth + 0.3))\n\n    #\
    \ neck hole through the web and the register ring bore\n    w = w.cut(cq.Workplane(\"\
    XY\").workplane(offset=p.head_pocket_depth - 0.3)\n              .circle(p.neck_hole_d\
    \ / 2.0)\n              .extrude(top_z + p.ring_h + 1.0 - p.head_pocket_depth))\n\
    \    w = w.union(cq.Workplane(\"XY\").workplane(offset=top_z)\n              \
    \  .circle(p.ring_od / 2.0).extrude(p.ring_h))\n\n    # four detent bumps gripping\
    \ the fastener head's cylindrical band\n    rc = p.bolt_head_d / 2.0 - p.bump_interf\
    \ + p.bump_d / 2.0\n    z0 = 1.0\n    h = p.head_pocket_depth - 2.0 - z0\n   \
    \ for (dx, dy) in [(rc, 0.0), (-rc, 0.0), (0.0, rc), (0.0, -rc)]:\n        w =\
    \ w.union(cq.Workplane(\"XY\").workplane(offset=z0)\n                    .center(dx,\
    \ dy).circle(p.bump_d / 2.0).extrude(h))\n    return w"
  print_orientation: 'underside down on the bed: the head pocket opens at z=0, the
    pad and register ring face up. No supports'
  use_orientation: 'as printed: z=0 is the plate''s underside (against the clamp),
    +z is the camera side, origin at the centre of the head pocket / neck hole'
- id: camera_screw
  role: final
  material: PLA
  code: "def build(p):\n    head_r = p.screw_head_d / 2.0\n    hh = p.screw_head_h\n\
    \    core_r = p.screw_core_d / 2.0\n    crest_r = p.screw_thread_od / 2.0\n  \
    \  pitch = p.pitch\n    tip_z = hh + p.screw_thread_len\n\n    w = cq.Workplane(\"\
    XY\").circle(head_r).extrude(hh)\n    w = w.union(cq.Workplane(\"XY\").workplane(offset=hh\
    \ - 0.4)\n                .circle(core_r).extrude(p.screw_thread_len + 0.4))\n\
    \    # conical lead-in so the thread starts squarely in the camera's socket\n\
    \    w = w.union(cq.Workplane(\"XY\").workplane(offset=tip_z - 1.6)\n        \
    \        .cone(core_r, 1.0, 1.6))\n\n    def thread(r_root, r_top, length, z0):\n\
    \        rm = (r_root + r_top) / 2.0\n        path = cq.Workplane(\"XY\").workplane(offset=z0).helix(pitch,\
    \ length, rm)\n        prof = [(r_root - 0.35, -0.34 * pitch), (r_top, -0.15 *\
    \ pitch),\n                (r_top, 0.15 * pitch), (r_root - 0.35, 0.34 * pitch)]\n\
    \        sec = cq.Workplane(\"XZ\").center(rm, z0).polyline(prof).close()\n  \
    \      return sec.sweep(path, isFrenet=True)\n\n    try:\n        w = w.union(thread(core_r,\
    \ crest_r, p.screw_thread_len - 1.6, hh - 0.3))\n    except Exception:\n     \
    \   # fallback if the helix sweep fails on your CadQuery: stacked rings at\n \
    \       # the same pitch - screws in and holds, just not as smoothly\n       \
    \ n = int((p.screw_thread_len - 1.6) / pitch) + 1\n        for i in range(n):\n\
    \            zi = hh + i * pitch\n            w = w.union(cq.Workplane(\"XY\"\
    ).workplane(offset=zi - 0.34 * pitch)\n                        .cone(core_r, crest_r,\
    \ 0.34 * pitch))\n            w = w.union(cq.Workplane(\"XY\").workplane(offset=zi)\n\
    \                        .cone(crest_r, core_r, 0.34 * pitch))\n\n    # flat-blade\
    \ drive on the underside of the head, reached with a screwdriver\n    # through\
    \ the pocket mouth in the plate\n    w = w.cut(cq.Workplane(\"XY\").workplane(offset=-0.3)\n\
    \              .box(p.slot_w, p.slot_len, p.slot_depth + 0.3, centered=(True,\
    \ True, False)))\n    return w"
  print_orientation: standing on its head, screw axis vertical, tip up at z=14.2 mm.
    No supports
  use_orientation: 'as printed, axis along +z: head seated in the plate''s pocket,
    thread pointing up into the camera'
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    hw = p.plate_w / 2.0\n    top_z = p.head_pocket_depth\
    \ + p.web_t\n    tabs = [p.grip_t - 1.0, p.grip_t, p.grip_t + 1.0, p.grip_t +\
    \ 2.0]\n    seg = 42.0\n    x0 = -seg * 2.0\n\n    # four tabs, full plate width,\
    \ in step thicknesses, joined by a thin spine:\n    # find which thickness your\
    \ jaws actually clamp\n    w = cq.Workplane(\"XY\").workplane(offset=0.0).polygon(4,\
    \ 14.0).extrude(3.0)\n    for i, t in enumerate(tabs):\n        x = x0 + i * seg\
    \ + hw\n        w = w.union(cq.Workplane(\"XY\").box(2.0 * hw, 24.0, t, centered=(True,\
    \ True, False))\n                    .translate(cq.Vector(x, 0, 0)))\n    w =\
    \ w.union(cq.Workplane(\"XY\").box(4.0 * seg, 10.0, 2.5, centered=(True, True,\
    \ False))\n                .translate(cq.Vector(x0 + 2.0 * seg, 0, 0)))\n\n  \
    \  # full-size mock-up of the pad: drop it into the clamp to check the raised\
    \ pad\n    # clears the lips, and press the bolt head into its seat to check the\
    \ fit and\n    # that a driver can reach the head inside it\n    px = x0 + 4.0\
    \ * seg + p.pad_d + 10.0\n    pad = cq.Workplane(\"XY\").workplane(offset=0.0).box(p.plate_w,\
    \ 34.0, p.grip_t,\n                                                       centered=(True,\
    \ True, False))\n    pad = pad.union(cq.Workplane(\"XY\").circle(p.pad_d / 2.0).extrude(top_z))\n\
    \    pad = pad.cut(cq.Workplane(\"XY\").workplane(offset=-0.3)\n             \
    \     .circle(p.head_pocket_d / 2.0).extrude(p.head_pocket_depth + 0.3))\n   \
    \ pad = pad.cut(cq.Workplane(\"XY\").workplane(offset=p.head_pocket_depth - 0.3)\n\
    \                  .circle(p.neck_hole_d / 2.0).extrude(p.web_t + 1.0))\n    w\
    \ = w.union(pad.translate(cq.Vector(px, 0, 0)))\n\n    # three printed 1/4-20\
    \ samples, undersize / nominal / oversize: try each in the\n    # camera's socket\
    \ and keep the printed screw only if the middle one suits\n    core_r = p.screw_core_d\
    \ / 2.0\n    pitch = p.pitch\n    for j, od in enumerate([p.screw_thread_od -\
    \ 0.15, p.screw_thread_od,\n                            p.screw_thread_od + 0.15]):\n\
    \        crest_r = od / 2.0\n        st = cq.Workplane(\"XY\").circle(6.0).extrude(4.0)\n\
    \        st = st.union(cq.Workplane(\"XY\").workplane(offset=3.6).circle(core_r).extrude(10.4))\n\
    \        try:\n            rm = (core_r + crest_r) / 2.0\n            path = cq.Workplane(\"\
    XY\").workplane(offset=4.0).helix(pitch, 9.0, rm)\n            prof = [(core_r\
    \ - 0.35, -0.34 * pitch), (crest_r, -0.15 * pitch),\n                    (crest_r,\
    \ 0.15 * pitch), (core_r - 0.35, 0.34 * pitch)]\n            st = st.union(cq.Workplane(\"\
    XZ\").center(rm, 4.0).polyline(prof).close()\n                          .sweep(path,\
    \ isFrenet=True))\n        except Exception:\n            for k in range(7):\n\
    \                zi = 4.0 + k * pitch\n                st = st.union(cq.Workplane(\"\
    XY\").workplane(offset=zi - 0.34 * pitch)\n                            .cone(core_r,\
    \ crest_r, 0.34 * pitch))\n        sx = px + 24.0 + j * 16.0\n        if sx >\
    \ 120.0:\n            sx = px\n        w = w.union(st.translate(cq.Vector(sx,\
    \ 34.0 + (j * 6.0) - 6.0, 0)))\n    return w"
  print_orientation: flat on the bed, steps and stubs pointing up at z=0. No supports.
    Prints in ~20 min
  use_orientation: test only - discarded after checking grip thickness, pad drop-in,
    bolt-head seat and thread fit
hardware:
- id: webcam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_fastener
  fastener: webcam_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: head_pocket (bolt head buried in the pad, held by the four detent bumps)
    role: head_seat
  - part: plate
    feature: neck_hole (guide hole through the web, 0.55 mm over the thread)
    role: clearance
  nut: null
  external: 'camera''s 1/4-20 threaded socket: the bolt''s 10 mm of thread stands
    ~5.9 mm proud of the plate''s pad top face and screws straight into it'
criteria:
- id: grip_thickness
  part: plate
  feature: grip bar (top and bottom faces of the 38 mm wide ends)
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - grip_t
  - plate_w
  check:
    method: coupon
    ref: fit_coupon
    description: 'Tabs of grip_t-1 / grip_t / grip_t+1 / grip_t+2 mm (3/4/5/6): the
      one the jaws clamp snugly with the knob near-tight is the thickness the plate
      must have. Sand the plate down, or glue a shim under it, to match'
- id: pad_drop_in
  part: plate
  feature: pad + collar
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - pad_d
  - pad_clear
  - head_pocket_depth
  - web_t
  - grip_t
  check:
    method: coupon
    ref: fit_coupon
    description: The coupon's full-size pad mock-up must drop in between the lips
      the same way the plate does. If it fouls, sand the pad down - keep at least
      3 mm of web above the head pocket
- id: head_seat
  part: plate
  feature: head_pocket
  relation: seats
  hardware: webcam_bolt
  clearance_mm: 0.8
  params:
  - bolt_head_d
  - bolt_head_h
  - head_pocket_d
  - head_pocket_depth
  check:
    method: coupon
    ref: fit_coupon
    description: Bolt head presses into the coupon's seat and stands about 0.6 mm
      below the pad top face there, with its thread proud; same geometry as the plate
- id: neck_clear
  part: plate
  feature: neck_hole
  relation: clears
  hardware: webcam_bolt
  clearance_mm: 0.28
  params:
  - neck_hole_d
  - thread_major
  check:
    method: measure
    ref: null
    description: The bolt's thread should pass through the web hole with no forcing,
      and the head should not pull through it (15 mm head vs 6.9 mm hole is what keeps
      the bolt captive)
- id: detention
  part: plate
  feature: detent bumps
  relation: engages
  hardware: webcam_bolt
  clearance_mm: null
  params:
  - bump_interf
  - bump_d
  - bump_n
  - bolt_head_d
  check:
    method: measure
    ref: null
    description: Bumps reach 0.2 mm inside the head's radius, so the bolt snaps in
      and stays captive in the plate instead of dropping out. Set bump_interf to 0
      in the slicer if it is too stiff to push past
- id: thread_engage
  part: camera_screw
  feature: printed 1/4-20 thread
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - screw_thread_od
  - pitch
  - screw_core_d
  check:
    method: coupon
    ref: fit_coupon
    description: Try the coupon's 6.15 / 6.30 / 6.45 mm thread stubs in the camera
      socket. Only use the printed screw if one of them turns in by hand with light,
      even resistance - otherwise use the metal bolt
- id: thread_proud
  part: plate
  feature: pad top face
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - head_pocket_depth
  - web_t
  - bolt_thread_len
  - camera_socket_depth
  - screw_thread_len
  check:
    method: measure
    ref: null
    description: With the fastener seated on the pocket floor, its thread must stand
      at least 5 mm above the pad top face for the camera's socket depth; check with
      a ruler before fitting the camera
- id: register
  part: plate
  feature: register ring
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - ring_od
  - ring_id
  - ring_h
  check:
    method: none
    ref: null
    description: The 0.4 mm ring is a anti-rotation register only; if your camera
      base is dead flat and will not sit square, shave the ring down
manual:
- n: '1'
  text: 'Print fit_coupon first, flat on the bed, no supports. It answers the two
    things nobody could measure for me: how thick a plate your jaws clamp, and whether
    the raised centre pad fits between the lips.'
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Try the four step tabs (3, 4, 5 and 6 mm thick, all 38 mm wide) in the clamp
    and tighten the knob. Note which one the lips bite snugly - that is the thickness
    plate must be. If it is not 4 mm, either sand the plate's grip faces down to suit,
    or glue a strip of card/plastic of the missing thickness under the plate as a
    shim.
  parts:
  - fit_coupon
  - plate
  hardware: []
  tool: the tripod's own knob
- n: '3'
  text: Drop the coupon's pad mock-up into the clamp. It has the same 26 mm pad, same
    9.7 mm height and same 1.5 mm clearance collar as the plate, so if it goes in,
    the plate will. If it binds on the lips, sand the pad's collar down; keep at least
    3 mm of solid web above the head pocket.
  parts:
  - fit_coupon
  - plate
  hardware: []
  tool: null
- n: '4'
  text: 'Press the salvaged webcam bolt, head first, into the coupon''s head seat
    and check two things: the head sits below the seat''s ceiling with the thread
    standing proud (about 6 mm above the top face), and a screwdriver can reach the
    head inside the seat. Use the same bolt head size when you press it into the real
    plate - the four detent bumps should snap over the head with a firm click.'
  parts:
  - fit_coupon
  - plate
  hardware:
  - webcam_bolt
  tool: thumb pressure
- n: '5'
  text: 'Screw the coupon''s three thread stubs into your camera''s 1/4-20 socket,
    one after another, and feel which is right: it should start by hand, turn with
    light even resistance, and have no wobble. 6.15 mm = too loose, 6.45 mm = too
    tight. This tells you whether the printed camera_screw is usable on your camera
    at all; if in doubt, use the metal bolt (steps 7-9) and keep the printed screw
    as the spare.'
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '6'
  text: 'Print plate and camera_screw in PLA: plate flat on its underside, screw standing
    on its head. Use 4 perimeters and 100% infill for both (the plate''s neck web
    and the screw''s thread are the parts under load); no supports needed. After removal,
    check the plate''s grip faces are flat and the neck hole is clear - push a bolt
    through it and it should slide without forcing.'
  parts:
  - plate
  - camera_screw
  hardware: []
  tool: null
- n: '7'
  text: 'Snap the webcam bolt into the plate: push its head up into the pocket on
    the plate''s underside until the four bumps click past it, thread pointing up.
    The bolt is now captive - nothing sticks out below the plate, so it still lies
    flat in the clamp.'
  parts:
  - plate
  hardware:
  - webcam_bolt
  tool: null
- n: '8'
  text: 'Drop the plate into the clamp''s jaws, centred on the bolt, and tighten the
    knob until the plate cannot be shifted by hand. Do not overtighten: PLA creeps,
    and the lips will slowly print their own marks into the plate.'
  parts:
  - plate
  hardware: []
  tool: tripod knob
- n: '9'
  text: Put the camera on the pad so its 1/4-20 socket sits over the protruding thread,
    and turn the camera clockwise a few turns until it is snug - the register ring
    centres it and stops it spinning. If you would rather use the printed camera_screw
