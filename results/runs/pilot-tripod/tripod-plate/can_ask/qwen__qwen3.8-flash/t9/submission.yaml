task: tripod-plate
note: 'How hard is it? Easy - and the reason it works is that you have a 1/4"-20 bolt
  with a 15 x 5 mm head, which is almost exactly a tripod stud already. So nothing
  here carries the camera on printed plastic threads.\n\nHow it''s put together:\n-
  Your tripod clamps a flat plate, so the shoe is a 37.4 mm wide, 3.9 mm thick plate
  (the 38 mm you measured, with 0.3 mm per side) with a 28 mm pad rising 11 mm above
  it. The pad matters: it lifts the camera''s seat face clear of the clamp jaws.\n-
  In the top of the pad, a Ø15.7 x 9 mm pocket. The salvaged bolt drops in head-first,
  thread up, standing ~6 mm proud - the same length a proper tripod stud shows. The
  camera screws down until its base lands on the printed seat annulus, so the load
  path is camera -> seat -> plate -> jaws, all compression, and the bolt is only there
  to stop the camera sliding and tipping. That''s why PLA is fine here.\n- The pocket
  depth comes out of your bolt: 5 (head) + 10 (thread) - 6 (protrusion) = 9 mm, and
  the pad is 9 + 2 mm floor. If you find a longer bolt, changing target_thread_protrusion
  moves the camera''s seat height instead of breaking anything.\n- A Ø6.9 hole through
  the pocket floor lets the shank pass if you ever use a longer screw, and lets you
  push the bolt out from underneath.\n\nOn printing the screw: it''s the fiddly half,
  so I''ve given it two answers. The primary part is your metal bolt. The printed
  1/4"-20 stud is a fallback, and at 1.27 mm pitch on a 0.4 mm nozzle a printed thread
  is really a stack of rings at ~10 turns, so I''ve modelled it as a slightly oversize
  (6.65 mm) forming thread that the camera''s own metal thread cuts into itself -
  it works, but it abrades, loosens with each refit, and can gall plastic into the
  socket. The fit coupon includes a 6 mm stub of exactly that thread so you can try
  it on the camera before you trust the real part with it.\n\nThe unknown your tripod
  didn''t tell us is the jaw gap, so step 2 of the manual is the coupon deciding plate_t,
  and step 5 only prints the real shoe after it passes. If it does pass, this is about
  25 g of PLA and an hour of your life.'
questions: []
params:
  clamp_plate_w:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: 'your measurement: the width of plate the tripod clamp takes'
  side_clearance:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: per side, so the plate slides into the jaws without play
  plate_t:
    value: 3.9
    unit: mm
    kind: design
    source: guessed
    note: thickness the jaws grip. The jaw gap is unknown - the grip coupon tells
      you if this is right
  plate_l:
    value: 52
    unit: mm
    kind: design
    source: design
    note: gripped length
  corner_r:
    value: 3
    unit: mm
    kind: design
    source: design
    note: ''
  edge_chamfer:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: bottom perimeter lead-in, also stops first-layer curl
  pad_d:
    value: 28
    unit: mm
    kind: design
    source: design
    note: seat the camera base rests on
  cup_floor_min:
    value: 2
    unit: mm
    kind: design
    source: design
    note: material under the bolt head; sets pad height = pocket depth + this
  cup_clear:
    value: 0.35
    unit: mm
    kind: design
    source: design
    note: radial clearance for the 15 mm bolt head in its pocket
  shank_hole_clear:
    value: 0.28
    unit: mm
    kind: design
    source: design
    note: radial clearance for the bolt shank in the floor hole
  target_thread_protrusion:
    value: 6
    unit: mm
    kind: design
    source: design
    note: thread standing proud of the seat face; pocket depth = head_h + shank_len
      - this. Tripod studs are usually ~5-6 mm
  bolt_head_d:
    value: 15
    unit: mm
    kind: world
    source: measured
    note: salvaged webcam bolt head, across
  bolt_head_h:
    value: 5
    unit: mm
    kind: world
    source: measured
    note: salvaged bolt head height
  bolt_shank_len:
    value: 10
    unit: mm
    kind: world
    source: measured
    note: salvaged bolt thread length under the head
  shank_thread_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 ISO major diameter
  thread_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 pitch, from the thread table
  printed_thread_major_d:
    value: 6.65
    unit: mm
    kind: design
    source: design
    note: '0.3 mm over the 6.35 nominal: the printed thread forms itself into the
      camera''s metal thread'
  printed_thread_minor_d:
    value: 5.25
    unit: mm
    kind: design
    source: design
    note: ''
  stud_head_d:
    value: 15
    unit: mm
    kind: design
    source: design
    note: matches the salvaged bolt head so it drops into the same pocket
  stud_head_h:
    value: 4.8
    unit: mm
    kind: design
    source: design
    note: ''
  slot_w:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: screwdriver slot in the printed stud's head
  slot_d:
    value: 2.2
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_len:
    value: 46
    unit: mm
    kind: design
    source: design
    note: ''
  cup_edge_gap:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: 'coupon: wall from the head-fit hole to the strip edge'
  sample_gap:
    value: 2
    unit: mm
    kind: design
    source: design
    note: 'coupon: spacing between the three test features'
  stub_thread_len:
    value: 8
    unit: mm
    kind: design
    source: design
    note: 'coupon: printed thread test stub length'
parts:
- id: shoe
  role: final
  material: PLA
  code: "def build(p):\n    # plate sized from the measured 38 mm clamp width\n  \
    \  W = p.clamp_plate_w - 2 * p.side_clearance\n    t = p.plate_t\n    # pocket\
    \ depth chosen so the bolt thread stands 'target_thread_protrusion' proud\n  \
    \  cup_depth = p.bolt_head_h + p.bolt_shank_len - p.target_thread_protrusion\n\
    \    pad_h = cup_depth + p.cup_floor_min\n    cup_d = p.bolt_head_d + 2 * p.cup_clear\n\
    \    hole_d = p.shank_thread_d + 2 * p.shank_hole_clear\n\n    base = (cq.Workplane(\"\
    XY\")\n            .box(p.plate_l, W, t, centered=(True, True, False))\n     \
    \       .edges(\"|Z\").fillet(p.corner_r)\n            .faces(\"<Z\").chamfer(p.edge_chamfer)\n\
    \            .faces(\">Z\").workplane().circle(p.pad_d / 2).extrude(pad_h))\n\n\
    \    shoe = (base.faces(\">Z\").workplane()\n            .circle(cup_d / 2).cutBlind(-cup_depth)\
    \          # head pocket\n            .faces(\">Z\").workplane()\n           \
    \ .circle(hole_d / 2).cutBlind(-(pad_h + t + 1)))  # shank hole to the bed side\n\
    \    return shoe"
  print_orientation: 'Flat as modelled: plate bottom face (z=0) on the bed, pad pointing
    up. Plate 3.9 mm thick, pad 11 mm tall on top of it. No supports - the pocket
    is a vertical blind bore and the shank hole a vertical through hole.'
  use_orientation: 'Upright, exactly as modelled: plate horizontal and gripped in
    the tripod jaws, pad top face (the 28 mm seat) horizontal, bolt axis vertical
    with the thread pointing up into the camera.'
- id: stud-printed
  role: final
  material: PLA
  code: "def build(p):\n    hd = p.stud_head_d\n    hh = p.stud_head_h\n    p1 = p.printed_thread_major_d\
    \ / 2\n    p2 = p.printed_thread_minor_d / 2\n    pitch = p.thread_pitch\n   \
    \ # same pocket depth as the shoe, so the tip lands at the same height as the\
    \ metal bolt's\n    cup_depth = p.bolt_head_h + p.bolt_shank_len - p.target_thread_protrusion\n\
    \    tl = cup_depth - hh + p.target_thread_protrusion\n\n    head = cq.Workplane(\"\
    XY\").circle(hd / 2).extrude(hh)\n    turns = int(round(tl / pitch))\n    parts\
    \ = [cq.Solid.makeCylinder(p2, tl + 0.4, cq.Vector(0, 0, hh - 0.2))]\n    for\
    \ i in range(turns):\n        zc = hh + (i + 0.5) * pitch\n        lead = 0.8\
    \ if i >= turns - 1 else 1.0   # last turn runs in as a lead-in\n        for rad,\
    \ h in ((p2 + 0.03, 0.50 * pitch),\n                       ((p1 + p2) / 2, 0.36\
    \ * pitch),\n                       (p1 * lead, 0.22 * pitch)):\n            parts.append(cq.Solid.makeCylinder(rad,\
    \ h, cq.Vector(0, 0, zc - h / 2)))\n    stud = head.union(cq.Workplane(\"XY\"\
    ).newObject(parts))\n\n    slot = (cq.Workplane(\"XY\").workplane(offset=hh -\
    \ p.slot_d)\n            .box(hd - 2.4, p.slot_w, p.slot_d + 0.5, centered=(True,\
    \ True, False)))\n    return stud.cut(slot)"
  print_orientation: Head down on the bed, thread pointing up (as modelled). Axis-vertical
    is what makes the thread flanks strong in the direction the load goes.
  use_orientation: 'Same as modelled: head down, resting on the floor of the shoe''s
    pocket, thread pointing up into the camera socket. Turn it with a small flat-blade
    screwdriver in the slot.'
- id: fit-coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    W = p.clamp_plate_w - 2 * p.side_clearance\n    t = p.plate_t\n\
    \    cup_d = p.bolt_head_d + 2 * p.cup_clear\n    hole_d = p.shank_thread_d +\
    \ 2 * p.shank_hole_clear\n    p1 = p.printed_thread_major_d / 2\n    p2 = p.printed_thread_minor_d\
    \ / 2\n    pitch = p.thread_pitch\n\n    cup_cx = -W / 2 + p.cup_edge_gap + cup_d\
    \ / 2\n    shank_cx = cup_cx + cup_d / 2 + p.sample_gap + hole_d / 2\n    stub_cx\
    \ = shank_cx + hole_d / 2 + p.sample_gap + p1\n\n    plate = (cq.Workplane(\"\
    XY\")\n             .box(p.coupon_len, W, t, centered=(True, True, False))\n \
    \            .edges(\"|Z\").fillet(p.corner_r))\n\n    cutters = [cq.Solid.makeCylinder(cup_d\
    \ / 2, t + 2, cq.Vector(cup_cx, 0, -1)),\n               cq.Solid.makeCylinder(hole_d\
    \ / 2, t + 2, cq.Vector(shank_cx, 0, -1))]\n    body = plate.cut(cq.Workplane(\"\
    XY\").newObject(cutters))\n\n    turns = int(round(p.stub_thread_len / pitch))\n\
    \    parts = [cq.Solid.makeCylinder(p2, p.stub_thread_len + 0.6, cq.Vector(stub_cx,\
    \ 0, t - 0.3))]\n    for i in range(turns):\n        zc = t + (i + 0.5) * pitch\n\
    \        lead = 0.85 if i == turns - 1 else 1.0\n        for rad, h in ((p2 +\
    \ 0.03, 0.50 * pitch),\n                       ((p1 + p2) / 2, 0.36 * pitch),\n\
    \                       (p1 * lead, 0.22 * pitch)):\n            parts.append(cq.Solid.makeCylinder(rad,\
    \ h, cq.Vector(stub_cx, 0, zc - h / 2)))\n    return body.union(cq.Workplane(\"\
    XY\").newObject(parts))"
  print_orientation: 'Flat as modelled: strip bottom face on the bed, the two test
    holes and the thread stub pointing up.'
  use_orientation: Not used in the assembly - print it first and check the three fits
    (jaws on the strip, bolt head in the Ø15.7 hole, thread stub in the camera socket),
    then throw it away.
hardware:
- id: webcam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera-stud
  fastener: webcam_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 5.9
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: shoe
    feature: bolt_pocket
    role: head_seat
  - part: shoe
    feature: shank_hole
    role: clearance
  nut: null
  external: camera's 1/4-20 tripod socket
criteria:
- id: grip-zone
  part: shoe
  feature: grip_zone
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - clamp_plate_w
  - side_clearance
  - plate_t
  - edge_chamfer
  - corner_r
  check:
    method: coupon
    ref: fit-coupon
    description: The jaws must close on and hold the 3.9 mm x 37.4 mm strip with the
      same edge chamfer. If the strip slides out under hand pressure, or the knob
      won't close, change plate_t and reprint the coupon before printing the shoe.
- id: head-pocket
  part: shoe
  feature: bolt_pocket
  relation: seats
  hardware: webcam_bolt
  clearance_mm: null
  params:
  - bolt_head_d
  - bolt_head_h
  - cup_clear
  - bolt_shank_len
  - target_thread_protrusion
  - cup_floor_min
  check:
    method: coupon
    ref: fit-coupon
    description: The Ø15.7 x 9 mm pocket takes the 15 x 5 mm head with 0.35 mm per
      side spare; the Ø15.7 hole in the coupon checks the diameter, and the head must
      drop to the floor of the pocket on the real shoe.
- id: shank-hole
  part: shoe
  feature: shank_hole
  relation: clears
  hardware: webcam_bolt
  clearance_mm: 0.55
  params:
  - shank_thread_d
  - shank_hole_clear
  check:
    method: coupon
    ref: fit-coupon
    description: 'Ø6.9 hole through the pocket floor and the plate: the 6.35 mm shank
      must pass freely (the coupon''s Ø6.9 hole is the same size).'
- id: seat-face
  part: shoe
  feature: pad_top_face
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - target_thread_protrusion
  - bolt_shank_len
  - bolt_head_h
  check:
    method: measure
    ref: null
    description: 'Hand-tighten the camera: its base must reach the 28 mm seat annulus
      (or within ~1 mm of it). If it stops well short, the camera socket is shallower
      than 6 mm - see the manual.'
- id: pad-clears-jaws
  part: shoe
  feature: pad
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - pad_d
  - plate_t
  - cup_floor_min
  - bolt_head_h
  - bolt_shank_len
  - target_thread_protrusion
  check:
    method: measure
    ref: null
    description: With the plate fully home in the jaws, look at the gap between the
      jaws' top edge and the 11 mm pad. The seat face must stand clear of anything
      on the clamp; if the jaws are taller than the pad, widen the plate/pad clearance
      rather than the pad height.
- id: printed-thread-fit
  part: stud-printed
  feature: thread
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - printed_thread_major_d
  - printed_thread_minor_d
  - thread_pitch
  - stub_thread_len
  - stud_head_d
  - stud_head_h
  check:
    method: coupon
    ref: fit-coupon
    description: The 8 mm stub has the identical printed thread. It should start in
      the camera socket with light hand pressure and a screwdriver, turn in about
      6 mm, and back out. If it jams, add 0.1 mm to printed_thread_major_d and printed_thread_minor_d
      and reprint the coupon.
manual:
- n: '1'
  text: 'Print the fit-coupon first (no filament worth spending on the real thing
    yet). It is one small part with three checks built into it: a bare strip of the
    gripped section, a Ø15.7 hole, a Ø6.9 hole, and an 8 mm stub of the printed thread.
    Print shoe and stud in the same batch only once the coupon has passed.'
  parts:
  - fit-coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Grip check: put the coupon strip in the tripod clamp and tighten the knob.
    It must not slide out when you pull on it hard, and the knob must not need forcing.
    If it slips, reduce plate_t by 0.3 and reprint the coupon (a thinner plate grips
    worse; you want the jaws to bite the PLA, not touch metal on metal). If the knob
    won''t close, reduce plate_t. If you want a firmer bite without changing the plate
    thickness, print a second strip and superglue it on top of the first to double
    the gripped thickness.'
  parts:
  - fit-coupon
  hardware: []
  tool: tripod clamp knob
- n: '3'
  text: 'Bolt check: press the salvaged bolt head into the Ø15.7 hole in the coupon
    - it should drop in with room to spare, not need pushing. Then check the Ø6.9
    hole passes over the bolt''s shank. If the head is a tight fit, raise cup_clear
    to 0.5.'
  parts:
  - fit-coupon
  hardware:
  - webcam_bolt
  tool: null
- n: '4'
  text: 'Printed-thread check (only if you intend to use the printed stud): screw
    the coupon''s stub into the camera socket with a screwdriver in the flat of the
    stub. It should start straight, go in ~6 mm with firm-but-not-desperate pressure,
    and come back out. Do this with the coupon flat in your hand, not with the camera
    cocked up. If it seizes, add 0.1 mm to printed_thread_major_d and printed_thread_minor_d
    and reprint the coupon.'
  parts:
  - fit-coupon
  hardware: []
  tool: small flat-blade screwdriver
- n: '5'
  text: Print the shoe. It goes on the bed flat, plate down, pad up - no supports.
    Print the printed stud only if you need it, head down, thread up.
  parts:
  - shoe
  - stud-printed
  hardware: []
  tool: null
- n: '6'
  text: Drop the salvaged webcam bolt into the pocket in the middle of the shoe's
    pad, head first, so the head sits on the floor of the pocket and about 6 mm of
    thread stands proud of the 28 mm seat face. The head is buried 9 mm down, so you
    may need tweezers or a bent paperclip to lift it out again later. The Ø6.9 hole
    under the pocket lets you push the bolt up from underneath.
  parts:
  - shoe
  hardware:
  - webcam_bolt
  tool: null
- n: '7'
  text: Slide the plate into the tripod clamp, pushing it home so the seat face is
    clear of the jaws, centre the pad over the clamp and tighten the knob. Give the
    plate a little sideways wiggle to be sure it is biting on the PLA and not on the
    bolt head.
  parts:
  - shoe
  hardware: []
  tool: tripod clamp knob
- n: '8'
  text: 'Screw the camera onto the thread by hand, turning clockwise as seen from
    above, and stop at finger tight plus a nudge. Check the camera''s base is actually
    touching the 28 mm seat annulus. That is the whole idea: the camera''s weight
    should be carried by the printed seat sitting under it, and the thread only stops
    it sliding sideways.'
  parts:
  - shoe
  hardware:
  - webcam_bolt
  tool: null
- n: '9'
  text: 'If the camera stops before touching the seat (some sockets are shallower
    than 6 mm and the thread bottoms out in them), back the camera off a quarter turn
    and shim under it: a washer or two of cardboard or PLA taped to the seat face
    so the camera lands on the seat and not on the end of the screw. Do not keep forcing
    it - a 1/4-20 thread that has run out of depth will strip the printed pocket,
    or worse.'
  parts:
  - shoe
  hardware:
  - webcam_bolt
  tool: null
- n: '10'
  text: 'Using the printed stud instead of the metal bolt: put its head in the same
    pocket and turn it with a flat-blade screwdriver in the slot. Expect it to cut
    itself into the camera''s thread on the first pass and get looser on later ones.
    Fine for a weekend of light use; use the metal bolt for anything you care about,
    and don''t let the camera hang off it sideways.'
  parts:
  - stud-printed
  hardware: []
  tool: small flat-blade screwdriver
- n: '11'
  text: 'House rules for a temporary PLA part: keep the tripod upright (no side-loading
    the camera off-axis), no long lens hanging out, nothing heavier than about a kilo
    on it, keep it out of a hot car or direct sun (PLA softens around 60 °C and creep
    will let the plate loosen in the clamp), and take the camera off it when you walk
    away. When you find the real part, put this in the drawer with the tripod - it
    is a good spare.'
  parts:
  - shoe
  hardware: []
  tool: null
