parts:
- id: shoe
  role: final
  material: PLA
  code: "def build(p):\n    t = p.plate_t\n    r = p.chamber_d / 2.0\n    body = (cq.Workplane(\"\
    XY\")\n            .box(p.plate_w, p.plate_l, t, centered=(True, True, False))\n\
    \            .edges(\"|Z\").fillet(p.corner_r)\n            .faces(\">Z\").edges().chamfer(p.top_cham))\n\
    \    # bolt-head chamber: blind bore, mouth on the camera-side face, floor left\
    \ at p.floor_t\n    chamber = (cq.Workplane(\"XY\").workplane(offset=p.floor_t)\n\
    \               .circle(r).extrude(p.chamber_depth + 1.0))\n    body = body.cut(chamber)\n\
    \    # 1.2 mm lead-in at the mouth so the head drops straight in\n    entry =\
    \ cq.Workplane(\"XY\").workplane(offset=t - 1.2).cone(r, r + 1.2, 1.2)\n    body\
    \ = body.cut(entry)\n    return body"
  print_orientation: clamp-side face (the flat underside) on the bed, chamber mouth
    pointing up - no supports, no bridges
  use_orientation: 'as printed: underside faces the tripod clamp, chamfered top face
    is the camera''s landing surface, stud points up'
- id: stud
  role: final
  material: PLA
  code: "def build(p):\n    pitch = p.t14_pitch\n    r_maj = p.t14_major / 2.0\n \
    \   r_min = r_maj - p.t14_depth\n    head = cq.Workplane(\"XY\").circle(p.stud_head_d\
    \ / 2).extrude(p.stud_head_h)\n    core = cq.Workplane(\"XY\").circle(r_min).extrude(p.stud_head_h\
    \ + p.stud_len + 0.5)\n    s = head.union(core)\n    w = 0.24 * pitch\n    turns\
    \ = p.stud_len / pitch\n    ridge = (cq.Workplane(\"XY\").workplane(offset=p.stud_head_h)\n\
    \             .moveTo(r_min - 0.3, 0.0).lineTo(r_maj, w).lineTo(r_maj, -w).close()\n\
    \             .twistExtrude(360.0 * turns, p.stud_len))\n    s = s.union(ridge)\n\
    \    # cross-hole in the head: put a pin or coin in it to hand-tighten\n    s\
    \ = s.cut(cq.Workplane(\"XZ\").center(0, p.stud_head_h / 2)\n              .circle(p.grip_hole_d\
    \ / 2).extrude(p.stud_head_d + 2, both=True))\n    return s"
  print_orientation: head flat on the bed, thread standing up
  use_orientation: 'as printed: head sits down in the shoe''s chamber, thread points
    up into the camera'
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    r = p.chamber_d / 2.0\n    pitch = p.t14_pitch\n    r_maj\
    \ = p.t14_major / 2.0\n    r_min = r_maj - p.t14_depth\n    th = [p.tab_a, p.tab_b,\
    \ p.plate_t, p.tab_c]\n    total = len(th) * p.pad_l + (len(th) - 1) * p.pad_gap\
    \ + 4.0\n    c = cq.Workplane(\"XY\").box(p.plate_w, total, p.tab_base_t, centered=(True,\
    \ True, False))\n    yc = -total / 2.0 + 2.0 + p.pad_l / 2.0\n    pads = []\n\
    \    for T in th:\n        c = c.union(cq.Workplane(\"XY\").center(0, yc)\n  \
    \                  .box(p.plate_w, p.pad_l, T, centered=(True, True, False)))\n\
    \        pads.append((T, yc))\n        yc += p.pad_l + p.pad_gap\n    # probe\
    \ bore: identical diameter/depth/floor to the shoe's head chamber\n    T, y =\
    \ pads[0]\n    c = c.cut(cq.Workplane(\"XY\").workplane(offset=T - p.floor_t)\n\
    \              .circle(r).extrude(p.chamber_depth + 1.0))\n    # two turns of\
    \ the same thread the stud uses, to try in the camera socket\n    T, y = pads[2]\n\
    \    c = c.union(cq.Workplane(\"XY\").center(0, y).circle(r_min).extrude(p.sample_len\
    \ + 0.3))\n    w = 0.24 * pitch\n    ridge = (cq.Workplane(\"XY\").workplane(offset=T).center(0,\
    \ y)\n             .moveTo(r_min - 0.3, 0.0).lineTo(r_maj, w).lineTo(r_maj, -w).close()\n\
    \             .twistExtrude(720.0, p.sample_len))\n    c = c.union(ridge)\n  \
    \  return c"
  print_orientation: spine on the bed, tabs and thread sample standing up
  use_orientation: throw-away test jig, not part of the finished adapter
