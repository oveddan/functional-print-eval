manual:
- n: '1'
  text: 'Print all three, flat, in PLA: `shoe` (underside on the bed, chamber opening
    upward - no supports needed), `fit_coupon` and `stud` (head on the bed, thread
    standing up). Use 4 perimeters and 25-30% infill on the shoe: it is the part the
    camera hangs from. 0.2 mm layers are fine; if you can drop to 0.16 for the `stud`
    and the coupon, its thread will be smoother.'
  parts:
  - shoe
  - fit_coupon
  - stud
  hardware: []
  tool: null
- n: '2'
  text: Find out how thick a plate your tripod clamp actually takes. Push each tab
    of `fit_coupon` (8, 9.5, 12 and 13.5 mm, all at the shoe's own 37.4 mm width)
    into the clamp. Note which one slides in and is gripped firmly. The shoe is printed
    at 12 mm - if a different tab is the one that fits, set `plate_t` to that thickness
    and also set `floor_t` so that `floor_t + 5 + 10 - plate_t` still comes out at
    about 5.5 mm, and keep `floor_t` at 2 mm or more. Reprint `shoe` only.
  parts:
  - fit_coupon
  - shoe
  hardware: []
  tool: null
- n: '3'
  text: 'Probe the bolt chamber with the coupon before trusting the shoe: the bore
    in the first pad has the same diameter, depth and floor as the shoe''s chamber.
    Drop the webcam bolt head-first into it; the head should fall to the floor and
    leave the shank standing proud. If the head binds, open the bore out with a 16
    mm drill bit or a round file - do not print the chamber smaller.'
  parts:
  - fit_coupon
  hardware:
  - webcam_bolt
  tool: null
- n: '4'
  text: 'Drop the webcam bolt into the `shoe` head-first, through the mouth on the
    camera side, so the head lies down on the chamber floor and the shank points up.
    The bolt is captive: the floor stops it falling out, the camera''s own thread
    holds it from rising. Nothing is glued.'
  parts:
  - shoe
  hardware:
  - webcam_bolt
  tool: null
- n: '5'
  text: 'Decide which screw to trust. The metal webcam bolt is the one to use - it
    is steel, and it threads steel into steel. The printed `stud` is only a spare
    for a day you cannot find the bolt: put the cross-hole in its head over a coin
    or a small pin to turn it. If the coupon''s two-turn thread sample would not wind
    into your camera''s socket freely, do not use the printed stud at all, and melt
    its thread off the spare so it is never mistaken for one.'
  parts:
  - stud
  - fit_coupon
  hardware:
  - webcam_bolt
  tool: null
- n: '6'
  text: 'Dry fit: with the shoe sitting flat on your bench, screw the camera onto
    the standing stud by hand, starting it square. You want at least 4 full turns
    and the camera''s base touching the shoe''s landing face. Two faults and their
    fixes: (a) a gap remains because the bolt has bottomed out in a shallow socket
    - back it out, file or hacksaw 1-2 mm off the bolt''s tip, or reprint `stud` with
    a shorter `stud_len`; (b) the camera sits down but the stud is nearly all in and
    feels soft - lay one or two M8 washers on the chamber floor under the bolt head
    before refitting, each adds 1.6 mm. Never force the camera on: cross-threading
    the camera''s own socket is the one way to turn this into an expensive repair.'
  parts:
  - shoe
  - stud
  hardware:
  - webcam_bolt
  - shim_washer
  tool: null
- n: '7'
  text: 'Slide the shoe into the tripod clamp and tighten it, then pull hard on the
    shoe by hand - it should not slide out or twist. Mount the camera, then grab the
    camera and wiggle it: any slop in the joint means go back to step 6.'
  parts:
  - shoe
  hardware: []
  tool: null
- n: '8'
  text: 'Treat this as a temporary part, which is what you asked for. PLA is soft
    and creeps: keep a light body with a small lens on it, no telephoto, no heavy
    pan-and-tilt, no leaving the camera standing on a tripod unattended, and take
    the camera off when you carry the tripod. Re-tighten the shoe in the clamp every
    few shoots, and bin the printed parts if the chamber wall around the bolt head
    looks whitened or squashed. Get your friend''s real part back and use it.'
  parts:
  - shoe
  - stud
  hardware:
  - webcam_bolt
  tool: null
