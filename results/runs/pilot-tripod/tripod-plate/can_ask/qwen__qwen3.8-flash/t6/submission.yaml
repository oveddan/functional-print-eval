task: tripod-plate
note: 'Made as two printed pieces plus hardware you already have: a flat 37.4 x 62
  x 12 mm shoe that slides into the tripod''s 38 mm clamp, with a blind chamber on
  the camera side, and the salvaged 1/4-20 webcam bolt lying head-down in that chamber
  as the piece that screws into the camera. Keeping the load path steel-into-steel:
  nothing plastic is threaded into your camera. The chamber floor (2.5 mm) is what
  keeps the bolt captive - no glue, no printed threads - and M8 washers on the floor
  let you raise the protrusion 1.6 mm at a time. A fit coupon comes first: four tabs
  at the shoe''s own width to discover your clamp gap (I could only get "38 mm" out
  of it, not the gap height), a copy of the chamber to test the bolt head, and two
  turns of the printed thread to check before ever trusting the printed spare `stud`.
  Assumptions to check at the dry fit: the clamp holds a plain flat plate rather than
  a 38 mm dovetail, and the camera socket takes about 5.5 mm of thread.'
questions:
- text: Is the 38 mm mount a plain flat slot the plate slides into and a jaw squeezes,
    or an angled (Arca/dovetail) rail?
  answer: Could not establish - you could only read the 38 mm width, so the shoe is
    a flat plate with chamfered top edges.
- text: How thick a plate does the clamp swallow - the depth of the slot?
  answer: Unknown; the coupon has 8 / 9.5 / 12 / 13.5 mm tabs so you can find it and
    set plate_t before the shoe matters.
- text: How deep is the camera's 1/4-20 socket?
  answer: Guessed at 6 mm; checked at the dry fit in step 6, with shim washers and
    a shorter printed stud as the two fixes.
