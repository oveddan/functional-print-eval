  text: 'OPTIONAL, only if you have no usable 1/4-20 bolt: screw thread_coupon by
    hand into the 1/4-20 hex nut. If it starts cleanly and turns in under steady pressure
    without splitting a pad, the printed stud is good - use stud_screw in the pocket
    instead of the bolt. If it jams or crumbles, do not put printed plastic in the
    camera; get a proper 1/4-20 screw.'
