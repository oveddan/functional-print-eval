- n: '3'
  text: 'Print qs_plate flat, the wide 37.4 mm face down on the bed, long axis front-to-back.
    No supports (the whole dovetail is self-supporting in this orientation), 0.2 mm
    layers, 4 perimeters, 100% infill. If you also want the printed-screw fallback,
    put thread_coupon and stud_screw on the same plate: both stand with their axis
    vertical, no supports, 100% infill, and run those two slowly (20-30 mm/s) so the
    thread pads bond.'
