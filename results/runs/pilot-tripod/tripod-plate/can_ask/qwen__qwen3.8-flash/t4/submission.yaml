task: tripod-plate
note: 'Two printed parts plus your salvaged 1/4"-20 bolt: a 37.4 x 10 mm Arca-style
  dovetail plate, and (as a fallback only) a printed 1/4-20 stud, each backed by a
  coupon so you verify the clamp grip and the thread fit before a camera depends on
  them.\n\nThe one design idea worth flagging: the bolt head hides inside a blind
  pocket in the camera-facing face, so nothing protrudes below the plate''s base.
  That is deliberate - I never got a reading for the clamp''s channel depth (the measuring
  tool returned the same 38 mm width every time), so the plate cannot rely on the
  channel floor clearing a bolt head. It also keeps every gram of camera load in direct
  compression on 4.5 mm of solid plastic instead of in printed threads, and it lets
  a real steel 1/4-20 thread do the gripping in the camera.\n\nUnknowns left open,
  all covered by the coupon: clamp channel depth, jaw pad angle, and whether that
  15 mm bolt head is round or hex (I sized the pocket at 17.6 mm so a 15 mm across-flats
  hex''s 17.3 mm across-corners still drops in).'
questions: []
params:
  clamp_plate_width:
    value: 38.0
    unit: mm
    kind: world
    source: measured
    note: Tripod clamp takes a 38 mm plate (Arca-Swiss style). Only dimension the
      person could measure; channel depth was not obtainable.
  plate_base_w:
    value: 37.4
    unit: mm
    kind: design
    source: design
    note: Widest part of the dovetail, at the plate's bottom face. clamp_plate_width
      - 0.6 so it drops in.
  plate_top_w:
    value: 30.0
    unit: mm
    kind: design
    source: design
    note: Flat top face width; camera base rests on the annulus around the head pocket.
  plate_cham_h:
    value: 3.7
    unit: mm
    kind: design
    source: design
    note: Height of the 45-degree gripping chamfer above the base face (inset = (37.4-30)/2
      = 3.7).
  plate_t:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: Arca-style plate thickness. Verified against the clamp with the grip coupon.
  plate_len:
    value: 62.0
    unit: mm
    kind: design
    source: design
    note: ''
  end_radius:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: Rounded corners in plan; protects the plate and the camera base.
  pocket_dia:
    value: 17.6
    unit: mm
    kind: design
    source: design
    note: Blind pocket for the bolt head, drilled from the camera-facing face. 17.6
      covers a 15 mm round head AND a 15 mm across-flats hex (17.3 across corners)
      since the head shape could not be confirmed.
  pocket_depth:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: bolt_head_h + 0.5. Pocket floor at plate_t - pocket_depth = 4.5 mm, which
      is the bearing surface for the head and gives 10 - 5.5 = 4.5 mm of bolt thread
      above the plate top face.
  mouth_cham_dia:
    value: 19.4
    unit: mm
    kind: design
    source: design
    note: Lead-in collar at the pocket mouth.
  mouth_cham_depth:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: ''
  bolt_head_d:
    value: 15.0
    unit: mm
    kind: world
    source: measured
    note: Salvaged webcam-mount bolt head, measured by the person. Shape (round vs
      hex) not confirmed.
  bolt_head_h:
    value: 5.0
    unit: mm
    kind: world
    source: measured
    note: ''
  bolt_thread_len:
    value: 10.0
    unit: mm
    kind: world
    source: measured
    note: Threaded length under the head of the salvaged 1/4-20 bolt.
  thread_pitch_1_4_20:
    value: 1.27
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 pitch, from the hardware list.
  thread_major_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 UNC external major diameter.
  thread_minor_d:
    value: 5.14
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 UNC external minor diameter.
  thread_crest_d:
    value: 6.2
    unit: mm
    kind: design
    source: design
    note: Printed stud thread crest, ~0.15 mm under nominal so a steel nut can run
      onto it.
  thread_root_d:
    value: 4.6
    unit: mm
    kind: design
    source: design
    note: Printed stud thread root cylinder, slightly under the 5.14 minor so the
      pads bury into it.
  thread_pad_radial:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: ''
  thread_pad_tangential:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: 'Chosen so consecutive pads overlap: arc per step at the mean radius is
      ~1.3 mm.'
  thread_axial_t:
    value: 0.75
    unit: mm
    kind: design
    source: design
    note: Axial thickness of each thread pad; 1.27 - 0.75 = 0.52 mm gap.
  thread_steps_per_turn:
    value: 12
    unit: count
    kind: design
    source: design
    note: 'Faceted helix: 30 deg per step.'
  thread_turns:
    value: 9
    unit: count
    kind: design
    source: design
    note: 9 x 1.27 = 11.4 mm of printed thread, so 11.4 - pocket_depth 5.5 = 5.9 mm
      proud of the plate top face, enough to reach the bottom of a typical camera
      socket.
  coupon_thread_turns:
    value: 3
    unit: count
    kind: design
    source: design
    note: Short thread stub, tested by hand in the ASME B18.2.2 1/4-20 nut before
      the printed stud is put anywhere near the camera.
  stud_head_d:
    value: 16.4
    unit: mm
    kind: design
    source: design
    note: Printed stud head, 0.6 mm under the pocket diameter so it seats in the same
      pocket as the metal bolt.
  stud_head_h:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: ''
  stud_grip_af:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: Two flats across the printed head so it can be held with pliers while tightening.
  coupon_len:
    value: 26.0
    unit: mm
    kind: design
    source: design
    note: 'Each coupon rib is a short section of a real plate: slide it in and clamp
      it.'
  coupon_tenon_w:
    value: 37.2
    unit: mm
    kind: design
    source: design
    note: 'Rib 2: near-rectangular tenon (only 0.4 mm of taper over the whole 10 mm),
      in case the clamp''s jaw pads are steeper than 45 deg.'
  coupon_thin_t:
    value: 8.5
    unit: mm
    kind: design
    source: design
    note: 'Rib 3: same profile as the plate but 1.5 mm thinner, in case the channel
      will not accept 10 mm.'
  coupon_base_d:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: Foot disc under the thread coupon so it stands on the bed.
parts:
- id: qs_plate
  role: final
  material: PLA
  code: "def build(p):\n    H = p.plate_t\n    Wb = p.plate_base_w\n    Wt = p.plate_top_w\n\
    \    Ch = p.plate_cham_h\n    L = p.plate_len\n    R = p.end_radius\n    # Arca-Swiss\
    \ style trapezoid: widest at z=0 (the clamp floor side),\n    # 45 deg chamfer\
    \ up to plate_cham_h, then vertical walls to the camera face.\n    prof = [(Wb\
    \ / 2.0, 0.0), (Wt / 2.0, Ch), (Wt / 2.0, H),\n            (-Wt / 2.0, H), (-Wt\
    \ / 2.0, Ch), (-Wb / 2.0, 0.0)]\n    prism = cq.Workplane(\"XZ\").polyline(prof).close().extrude(8.0\
    \ * L, both=True)\n    # footprint: length along Y, rounded corners in plan, base\
    \ on the bed\n    fp = (cq.Workplane(\"XY\")\n          .box(Wb, L, H + 2.0, centered=(True,\
    \ True, False))\n          .edges(\"|Z\").fillet(R))\n    b = fp.intersect(prism)\n\
    \    # blind pocket for the bolt head, opening on the camera-facing (top) face.\n\
    \    # Floor is at H - pocket_depth and carries the head in compression.\n   \
    \ z0 = H - p.pocket_depth\n    pocket = (cq.Workplane(\"XY\").circle(p.pocket_dia\
    \ / 2.0)\n              .extrude(p.pocket_depth + 2.0).translate((0.0, 0.0, z0)))\n\
    \    b = b.cut(pocket)\n    # lead-in collar at the pocket mouth\n    col = (cq.Workplane(\"\
    XY\").circle(p.mouth_cham_dia / 2.0)\n           .extrude(p.mouth_cham_depth +\
    \ 0.01)\n           .translate((0.0, 0.0, H - p.mouth_cham_depth)))\n    b = b.cut(col)\n\
    \    # index notch on the top rim: the end that faces the clamp's knob\n    notch\
    \ = (cq.Workplane(\"XY\").box(4.0, 3.0, 2.0, centered=(True, True, True))\n  \
    \           .translate((0.0, L / 2.0 - 1.5, H)))\n    b = b.cut(notch)\n    #\
    \ two shallow centre-line scribes to line the plate up on the camera base\n  \
    \  for ys in (22.0, -22.0):\n        g = (cq.Workplane(\"XY\").box(1.6, 4.0, 1.2,\
    \ centered=(True, True, True))\n             .translate((0.0, ys, H - 0.6)))\n\
    \        b = b.cut(g)\n    return b"
  print_orientation: 'Dovetail base face (the 37.4 mm wide one) flat on the bed, long
    axis front-to-back, z=0 is that base face. Wide-at-the-bottom profile means every
    layer is supported: no supports, no bridging. The head pocket opens upward, so
    it prints as a plain vertical bore.'
  use_orientation: 'Exactly as printed, no rotation: base face down into the tripod
    clamp, flat top face (z=plate_t) up against the camera base, index notch at the
    end where the clamp''s knob is. Camera screw axis is +Z at x=y=0.'
- id: grip_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    L = p.coupon_len\n\n    def rib(base_w, top_w, cham_h,\
    \ t):\n        prof = [(base_w / 2.0, 0.0), (top_w / 2.0, cham_h), (top_w / 2.0,\
    \ t),\n                (-top_w / 2.0, t), (-top_w / 2.0, cham_h), (-base_w / 2.0,\
    \ 0.0)]\n        return cq.Workplane(\"XZ\").polyline(prof).close().extrude(2.0\
    \ * L, both=True)\n\n    # (y centre, base w, top w, chamfer h, thickness, notch\
    \ count)\n    specs = [(-2.0 * (L + 8.0), p.plate_base_w, p.plate_top_w, p.plate_cham_h,\
    \ p.plate_t, 1),\n             (0.0, p.coupon_tenon_w, p.coupon_tenon_w - 0.8,\
    \ 0.0, p.plate_t, 2),\n             (2.0 * (L + 8.0), p.plate_base_w, p.plate_top_w,\
    \ p.plate_cham_h, p.coupon_thin_t, 3)]\n    out = None\n    for y0, bw, tw, ch,\
    \ t, n in specs:\n        r = rib(bw, tw, ch, t).translate((0.0, y0, 0.0))\n \
    \       for k in range(n):\n            nb = (cq.Workplane(\"XY\").box(3.0, 3.0,\
    \ 2.0, centered=(True, True, True))\n                  .translate((-8.0 + 8.0\
    \ * k, y0 - L / 2.0 + 3.5, t)))\n            r = r.cut(nb)\n        out = r if\
    \ out is None else out.union(r)\n    return out"
  print_orientation: All three ribs lie flat with their widest face on the bed, long
    axes front-to-back, printed as three separate solids in one bed. z=0 is each rib's
    base face. No supports.
  use_orientation: 'Not a used part - it is the fit test. Each rib is used exactly
    like the plate: base face down in the clamp channel, tightened against the jaws.
    Count the notches on the top face to tell them apart: 1 = the plate''s own profile
    10 mm thick, 2 = near-rectangular tenon 10 mm thick, 3 = the plate''s profile
    but 8.5 mm thick.'
- id: stud_screw
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    P = p.thread_pitch_1_4_20\n    n = int(p.thread_steps_per_turn)\n\
    \    turns = int(p.thread_turns)\n    crest_r = p.thread_crest_d / 2.0\n    pad_r\
    \ = p.thread_pad_radial\n    rc = crest_r - pad_r / 2.0          # inner radius\
    \ of the thread pad\n    mean_r = rc + pad_r / 2.0\n    lead = math.degrees(math.atan(P\
    \ / (2.0 * math.pi * mean_r)))\n    tl = turns * P                      # threaded\
    \ length\n\n    # head, sitting on the pocket floor\n    w = (cq.Workplane(\"\
    XY\").circle(p.stud_head_d / 2.0)\n         .extrude(p.stud_head_h))\n    # two\
    \ flats across the head so it can be held with pliers\n    for s in (1.0, -1.0):\n\
    \        fl = (cq.Workplane(\"XY\").box(12.0, 30.0, p.stud_head_h + 4.0,\n   \
    \            centered=(True, True, True))\n              .translate((s * (p.stud_grip_af\
    \ / 2.0 + 6.0), 0.0,\n                          p.stud_head_h / 2.0)))\n     \
    \   w = w.cut(fl)\n    # root cylinder of the thread, starting at the underside\
    \ of the head\n    root = (cq.Workplane(\"XY\").circle(p.thread_root_d / 2.0)\n\
    \            .extrude(tl + 1.0).translate((0.0, 0.0, p.stud_head_h - 0.5)))\n\
    \    w = w.union(root)\n    # faceted helix: one tilted pad per 30 deg of rotation\n\
    \    for k in range(turns * n + 1):\n        z = p.stud_head_h + k * P / float(n)\n\
    \        th = 360.0 * k / float(n)\n        pad = (cq.Workplane(\"XY\")\n    \
    \           .box(pad_r, p.thread_pad_tangential, p.thread_axial_t,\n         \
    \           centered=(True, True, True))\n               .rotate(cq.Vector(1.0,\
    \ 0.0, 0.0), -lead)\n               .translate((mean_r, 0.0, 0.0))\n         \
    \      .rotate(cq.Vector(0.0, 0.0, 1.0), th)\n               .translate((0.0,\
    \ 0.0, z)))\n        w = w.union(pad)\n    return w"
  print_orientation: Head flat on the bed, axis vertical (z=0 is the head's underside
    face), thread growing upward. No supports. 100% infill, 4 perimeters, slow (20-30
    mm/s) on the thread so the pads bond to each other.
  use_orientation: 'As printed, axis vertical and pointing up: head down in the plate''s
    head pocket resting on its floor, thread up into the camera''s 1/4-20 socket.
    Same screw axis as the metal bolt, so it is a straight swap for it.'
- id: thread_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    import math\n    P = p.thread_pitch_1_4_20\n    n = int(p.thread_steps_per_turn)\n\
    \    turns = int(p.coupon_thread_turns)\n    crest_r = p.thread_crest_d / 2.0\n\
    \    pad_r = p.thread_pad_radial\n    rc = crest_r - pad_r / 2.0\n    mean_r =\
    \ rc + pad_r / 2.0\n    lead = math.degrees(math.atan(P / (2.0 * math.pi * mean_r)))\n\
    \    tl = turns * P\n\n    # foot disc so the stub stands up on the bed\n    w\
    \ = cq.Workplane(\"XY\").circle(p.coupon_base_d / 2.0).extrude(1.5)\n    root\
    \ = (cq.Workplane(\"XY\").circle(p.thread_root_d / 2.0)\n            .extrude(tl\
    \ + 1.5).translate((0.0, 0.0, 1.0)))\n    w = w.union(root)\n    for k in range(turns\
    \ * n + 1):\n        z = 1.5 + k * P / float(n)\n        th = 360.0 * k / float(n)\n\
    \        pad = (cq.Workplane(\"XY\")\n               .box(pad_r, p.thread_pad_tangential,\
    \ p.thread_axial_t,\n                    centered=(True, True, True))\n      \
    \         .rotate(cq.Vector(1.0, 0.0, 0.0), -lead)\n               .translate((mean_r,\
    \ 0.0, 0.0))\n               .rotate(cq.Vector(0.0, 0.0, 1.0), th)\n         \
    \      .translate((0.0, 0.0, z)))\n        w = w.union(pad)\n    return w"
  print_orientation: Foot disc on the bed, thread stub pointing up, z=0 is the foot's
    underside. No supports. Print it in the same batch as the plate at the same settings
    as stud_screw (100% infill, slow).
  use_orientation: 'Not used on the camera. It is a throwaway thread test: it is screwed
    by hand into a spare ASME B18.2.2 1/4-20 hex nut to check the printed thread profile
    before the real stud is put into the camera.'
hardware:
- id: webcam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
- id: nut_1_4_20
  ref: ASME B18.2.2 1/4-20
  qty: 1
joints:
- id: camera_screw
  fastener: webcam_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 4.5
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: qs_plate
    feature: head_pocket
    role: head_seat
  - part: qs_plate
    feature: head_pocket_mouth
    role: clearance
  nut: null
  external: camera 1/4-20 tripod socket (female thread)
criteria:
- id: clamp_grip_profile
  part: qs_plate
  feature: dovetail
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - clamp_plate_width
  - plate_base_w
  - plate_top_w
  - plate_cham_h
  - plate_t
  - coupon_len
  - coupon_tenon_w
  - coupon_thin_t
  check:
    method: coupon
    ref: grip_coupon
    description: 'Before trusting the plate to a camera: clamp rib 1 of grip_coupon
      (one notch) in the tripod''s channel and tighten. It must bind hard with a little
      jaw travel still left, and must not slide when you pull on it with the weight
      of camera+plate hanging off it. Rib 2 (two notches, near-rectangular tenon)
      and rib 3 (three notches, 8.5 mm thick) tell you what the clamp prefers if rib
      1 does not work.'
- id: base_clears_jaws
  part: qs_plate
  feature: dovetail_base
  relation: clears
  hardware: null
  clearance_mm: 0.6
  params:
  - clamp_plate_width
  - plate_base_w
  check:
    method: coupon
    ref: grip_coupon
    description: The 37.4 mm base width is 0.6 mm under the 38 mm the clamp is said
      to take, so it should drop in without force. The coupon is the real check.
- id: head_sinks_in_pocket
  part: qs_plate
  feature: head_pocket
  relation: engages
  hardware: webcam_bolt
  clearance_mm: 0.3
  params:
  - bolt_head_d
  - bolt_head_h
  - pocket_dia
  - pocket_depth
  - mouth_cham_dia
  - mouth_cham_depth
  - plate_t
  check:
    method: measure
    ref: null
    description: 'Drop the bolt head-first into the pocket: the head must sit wholly
      below the plate''s top face (15 mm head in a 17.6 mm pocket, 5 mm tall in a
      5.5 mm deep pocket). If your head is bigger than 15 mm or taller than 5 mm,
      enlarge the pocket by 0.3 mm on the diameter and match the depth, but keep at
      least 4.2 mm of floor under it.'
- id: nothing_protrudes_below
  part: qs_plate
  feature: dovetail_base
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - pocket_dia
  - pocket_depth
  - bolt_head_h
  - plate_t
  check:
    method: measure
    ref: null
    description: 'With the bolt seated in the pocket, lay the plate base-down on a
      flat surface: it must sit flat with no wobble. Because the head lives inside
      the plate, the clamp''s channel floor never has to clear a bolt head - this
      is what makes the design work on an unmeasured clamp.'
- id: thread_bite_into_camera
  part: qs_plate
  feature: camera_screw_axis
  relation: engages
  hardware: webcam_bolt
  clearance_mm: null
  params:
  - bolt_thread_len
  - pocket_depth
  - thread_pitch_1_4_20
  - thread_major_d
  check:
    method: measure
    ref: null
    description: 'Standoff above the plate''s top face = bolt_thread_len - pocket_depth
      = 10.0 - 5.5 = 4.5 mm (about 3.5 turns of 1/4-20). That is normal for a quick-release
      plate screw, but check it: put the bolt in the pocket and measure the thread
      standing proud. If it is under 4 mm, do not risk the camera on it - get a longer
      1/4-20 screw or use the printed stud with more turns.'
- id: camera_faces_plate_top
  part: qs_plate
  feature: top_face
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - plate_top_w
  - mouth_cham_dia
  - plate_len
  check:
    method: measure
    ref: null
    description: 'The camera base must sit on the flat annulus around the pocket mouth
      (about 5.3 mm wide each side). Sight across the plate: the camera should not
      rock on the pocket''s collar. The two scribed centre-line marks help you line
      the plate up square on the camera before tightening.'
- id: stud_thread_runs_in_steel_nut
  part: thread_coupon
  feature: faceted_thread
  relation: engages
  hardware: nut_1_4_20
  clearance_mm: 0.15
  params:
  - thread_pitch_1_4_20
  - thread_major_d
  - thread_minor_d
  - thread_crest_d
  - thread_root_d
  - thread_pad_radial
  - thread_pad_tangential
  - thread_axial_t
  - thread_steps_per_turn
  - coupon_thread_turns
  check:
    method: coupon
    ref: stud_screw
    description: Screw the printed thread coupon into the ASME B18.2.2 1/4-20 nut
      by hand. It should need steady pressure and turn in smoothly without cracking
      a pad. If it will not start, or if it feels loose in the nut, do not use stud_screw
      on the camera - the metal bolt is the only acceptable option then.
- id: stud_seats_in_pocket
  part: stud_screw
  feature: head
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - stud_head_d
  - stud_head_h
  - pocket_dia
  - pocket_depth
  - thread_turns
  - thread_pitch_1_4_20
  - stud_grip_af
  check:
    method: measure
    ref: null
    description: 'The printed stud''s head (16.4 mm x 5 mm) must drop into the same
      pocket as the metal bolt, with 0.6 mm clearance and at least 4.5 mm of printed
      thread standing above the plate''s top face (9 turns x 1.27 = 11.4 mm less the
      5.5 mm pocket depth = 5.9 mm). Treat it as sacrificial: light camera only, and
      re-check it after every session.'
- id: printed_thread_strength
  part: stud_screw
  feature: faceted_thread
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - pocket_depth
  - plate_t
  - thread_axial_t
  - thread_crest_d
  check:
    method: none
    ref: null
    description: 'Load path for either screw: camera weight pulls the bolt/stud down,
      its head presses on the plate''s 4.5 mm pocket floor in direct compression (no
      printed thread carries the weight in the metal-bolt case). For the printed stud
      the thread flanks carry it in shear across printed layers, which is why it is
      capped at a light mirrorless body with a small lens, and why it is the fallback
      rather than the default.'
manual:
- n: '1'
  text: Print grip_coupon first (about 20 min). Flat, no supports, 0.2 mm layers,
    4 perimeters, 100% infill, high speed is fine. Three separate ribs come off in
    one go - count the notches on each rib's top face to tell them apart.
  parts:
  - grip_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Find your clamp''s preference before printing anything load-bearing. Slide
    rib 1 (one notch - the exact profile of the plate) base-down into the channel
    and tighten the knob. You want it to bind firmly with some knob travel still left
    over. Then hang something about 1 kg off it: it must not creep out. Try rib 2
    (near-rectangular tenon) and rib 3 (8.5 mm thick) the same way. Rib 1 holding
    = go straight to step 4. Rib 1 too thick for the channel but rib 3 holds = your
    clamp wants a thinner plate; stop and use a 8.5 mm shim-free plate only if you
    are willing to re-size the pocket. Rib 2 is the only one that grips hard = your
    clamp''s jaw pads are steeper than 45 degrees; the plate will still wedge but
    tighten the knob fully and re-check the pull test every time you mount.'
  parts:
  - grip_coupon
