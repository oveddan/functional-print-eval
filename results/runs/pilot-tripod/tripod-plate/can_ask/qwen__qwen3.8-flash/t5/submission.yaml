task: tripod-plate
note: 'Answers came back twice as only "clamp plate width: 38 mm" and "camera socket
  thread: 1/4-20", so jaw channel depth, pocket-to-jaw clearance and socket depth
  are assumed and flagged: flank_height, socket_engage and pocket_af are params, and
  all three are checked by the fit_coupon before the plate gets printed. Load path:
  camera base -> printed seat ring (compression) -> metal 1/4-20 bolt -> camera socket
  (metal on metal); the plate''s only job is to trap the bolt head against a 2.4 mm
  printed ceiling and be gripped by the jaws. Two things I could not do with what
  is available here: (1) no 1/4"-20 heat-set insert exists in the hardware list (only
  M3x4x5), so a metal threaded insert moulded into the plate was not on the table
  - bearing against a printed ceiling is the substitute; (2) the measure tool would
  not give me jaw depth, so the dovetail is a standard 30 deg / 4 mm assumed profile
  with a wedge coupon as the fallback check.'
questions: []
params:
  backup_engage_note:
    value: 0
    unit: mm
    kind: design
    source: design
    note: not used
  bolt_head_af:
    value: 15
    unit: mm
    kind: world
    source: measured
    note: Salvaged webcam-mount bolt head, across flats.
  bolt_head_h:
    value: 5
    unit: mm
    kind: world
    source: measured
    note: Salvaged bolt head height.
  bolt_thread_len:
    value: 10
    unit: mm
    kind: world
    source: measured
    note: Salvaged bolt thread length under the head. Gives ~6.6 mm of stud above
      the seat ring face - enough for the socket, so watch for bottoming out (step
      9).
  ceiling_thk:
    value: 2.4
    unit: mm
    kind: design
    source: design
    note: 12 layers at 0.2 mm. This is the shoulder the whole camera hangs from -
      it closes over the pit in one layer but is backed by solid material above it.
  clamp_plate_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: You said the clamp takes a 38 mm wide plate. Assumed to be the plate's base
      (dovetail) width. If 38 mm is really the jaw opening rather than the plate width,
      the wedge on fit_coupon will tell you - trim it or lower this param and reprint
      the coupon.
  coupon_base_t:
    value: 3
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_stub_len:
    value: 8
    unit: mm
    kind: design
    source: design
    note: Length of the test thread on fit_coupon.
  flank_angle:
    value: 30
    unit: deg
    kind: design
    source: design
    note: Measured from vertical - the standard Swiss/Arca dovetail flank, self-centring
      and self-jamming in the jaws.
  flank_height:
    value: 4
    unit: mm
    kind: design
    source: design
    note: 'How much of the plate the jaws grip. Never measured (the tool would not
      give it), so verify with the coupon wedge: it must go fully in and be gripped.
      Lower it if the jaw faces are shallower.'
  pocket_af:
    value: 15.4
    unit: mm
    kind: design
    source: design
    note: bolt_head_af 15.0 + 0.4. The single most likely param to need editing -
      test on the coupon first.
  pocket_depth:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: bolt_head_h 5.0 + 0.5 axial clearance; sets how far the head can be pushed
      up against its ceiling.
  plate_end_r:
    value: 4
    unit: mm
    kind: design
    source: design
    note: Rounds the neck's four vertical corners only; the dovetail base stays square
      so the jaws bite the full flank.
  plate_len:
    value: 44
    unit: mm
    kind: design
    source: design
    note: Along the clamp slot. Longer is stiffer and gives more finger grip; keep
      it clear of the knob/lever sweep.
  ring_h:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Raises the camera seat just above the deck so the recessed bolt head cannot
      mark the camera base.
  ring_id:
    value: 8.6
    unit: mm
    kind: design
    source: design
    note: Clears the thread crest; also lets thread swarf fall through.
  ring_od:
    value: 22
    unit: mm
    kind: design
    source: design
    note: Annular seat, 12 mm of camera-base contact per side.
  shaft_hole_d:
    value: 6.9
    unit: mm
    kind: design
    source: design
    note: thread_major 6.35 + 0.55 clearance so the stud passes freely but the head
      cannot.
  socket_engage:
    value: 5.5
    unit: mm
    kind: world
    source: datasheet
    note: Typical minimum 1/4"-20 tripod socket thread depth per ISO 1222; not measured
      on your camera.
  stud_crest_d:
    value: 6.04
    unit: mm
    kind: design
    source: design
    note: 0.31 mm under nominal major - print compensation so a printed male thread
      enters a metal 1/4"-20 socket. Verify on the coupon stub.
  stud_pla_head_af:
    value: 15
    unit: mm
    kind: design
    source: design
    note: Printed backup stud head, sized to be captured by the same 15.4 pocket.
  stud_pla_head_h:
    value: 5
    unit: mm
    kind: design
    source: design
    note: ''
  stud_pla_thread_len:
    value: 8.5
    unit: mm
    kind: design
    source: design
    note: Chosen so the tip stands ~5.6 mm above the seat ring face with the head
      against its ceiling - just enough engagement, short enough that it cannot reach
      far into the camera.
  stud_root_d:
    value: 5.3
    unit: mm
    kind: design
    source: design
    note: Slightly above the ISO 1/4-20 minor (5.21) to keep the printed V out of
      the metal thread root.
  thread_major:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4"-20 nominal major diameter.
  thread_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: catalog
    note: From the pitch table for 1/4-20.
  thread_profile_frac:
    value: 0.28
    unit: count
    kind: design
    source: design
    note: Thread thickness at the root, as a fraction of pitch. Under the 0.5*pitch
      space at the pitch line, so the flanks have clearance.
parts:
- id: plate
  role: final
  material: PLA
  code: "from math import cos, pi, tan\n\ndef build(p):\n    # --- dovetail body:\
    \ base face on the bed, flanks, then straight neck to the deck\n    hb = p.clamp_plate_width\
    \ / 2.0\n    hn = hb - p.flank_height * tan(p.flank_angle * pi / 180.0)\n    deck\
    \ = p.pocket_depth + p.ceiling_thk      # deck / camera-seat plane height\n  \
    \  top = deck + p.ring_h                      # seat ring face = camera base plane\n\
    \n    pts = [(-hb, 0.0), (hb, 0.0), (hn, p.flank_height),\n           (hn, deck),\
    \ (-hn, deck), (-hn, p.flank_height)]\n    body = cq.Workplane(\"XZ\").polyline(pts).close().extrude(p.plate_len)\n\
    \n    # centre in X/Y and sit the clamp face on z=0 whatever direction extrude\
    \ went\n    bb = body.val().BoundingBox()\n    body = body.translate(cq.Vector(-(bb.xMin\
    \ + bb.xMax) / 2.0,\n                                    -(bb.yMin + bb.yMax)\
    \ / 2.0, -bb.zMin))\n    bb = body.val().BoundingBox()\n    ys = (bb.yMin, bb.yMax)\n\
    \    corners = [e for e in body.edges(\"|Z\").vals()\n               if min(abs(e.Center().y\
    \ - y) for y in ys) < 1e-6]\n    body = body.newObject(corners).fillet(p.plate_end_r)\n\
    \n    # --- seat ring: the face the camera base actually rests on\n    ring =\
    \ cq.Workplane(\"XY\", center=cq.Vector(0, 0, deck)).circle(p.ring_od / 2.0).extrude(p.ring_h)\n\
    \    body = body.union(ring)\n\n    # --- hex pocket: bolt head pushed up into\
    \ it, trapped by the ceiling above\n    rc = p.pocket_af / (2.0 * cos(pi / 6.0))\n\
    \    hexpts = [(rc * cos(2 * pi * i / 6.0), rc * sin(2 * pi * i / 6.0)) for i\
    \ in range(6)]\n    pocket = (cq.Workplane(\"XY\", center=cq.Vector(0, 0, -0.5))\n\
    \              .polyline(hexpts).close().extrude(p.pocket_depth + 0.5))\n    body\
    \ = body.cut(pocket)\n\n    # --- ceiling hole (stud clearance), then a wider\
    \ bore through the seat ring\n    ceil_hole = (cq.Workplane(\"XY\", center=cq.Vector(0,\
    \ 0, p.pocket_depth - 0.5))\n                 .circle(p.shaft_hole_d / 2.0).extrude(p.ceiling_thk\
    \ + 1.0))\n    body = body.cut(ceil_hole)\n    bore = (cq.Workplane(\"XY\", center=cq.Vector(0,\
    \ 0, deck - 0.5))\n            .circle(p.ring_id / 2.0).extrude(p.ring_h + 1.0))\n\
    \    body = body.cut(bore)\n    return body"
  print_orientation: 'Clamp/base face flat on the bed (the widest 38 mm dovetail face,
    z=0), seat ring and stud hole pointing up. No supports: the dovetail flanks lean
    inward as they rise, the hex pocket is a pit open at the bed, and the 2.4 mm ceiling
    that traps the bolt head closes over it in one layer with solid material above
    it.'
  use_orientation: 'Same as printed - part frame is the use frame: dovetail base face
    down into the tripod clamp, seat ring up carrying the camera, stud pointing up
    into the camera.'
- id: stud_pla
  role: final
  material: PLA
  code: "from math import cos, pi\n\ndef build(p):\n    root_r = p.stud_root_d / 2.0\n\
    \    crest_r = p.stud_crest_d / 2.0\n    w = p.thread_profile_frac * p.thread_pitch\
    \     # thread thickness at the root\n\n    # hex head: captured by plate.head_pocket,\
    \ stops against its ceiling\n    rc = p.stud_pla_head_af / (2.0 * cos(pi / 6.0))\n\
    \    hexpts = [(rc * cos(2 * pi * i / 6.0), rc * sin(2 * pi * i / 6.0)) for i\
    \ in range(6)]\n    body = cq.Workplane(\"XY\").polyline(hexpts).close().extrude(p.stud_pla_head_h)\n\
    \n    # core + helical V thread, with a small relief gap above the head\n    z0\
    \ = p.stud_pla_head_h + 0.4 * p.thread_pitch\n    tip = z0 + p.stud_pla_thread_len\n\
    \    core = (cq.Workplane(\"XY\", center=cq.Vector(0, 0, p.stud_pla_head_h))\n\
    \            .circle(root_r).extrude(tip - p.stud_pla_head_h))\n    helix = cq.Workplane(\"\
    XY\", center=cq.Vector(0, 0, z0)).helix(p.thread_pitch, tip - z0, root_r)\n  \
    \  prof = (cq.Workplane(\"XZ\").center(root_r, z0)\n            .polyline([(0.0,\
    \ -w), (crest_r - root_r, 0.0), (0.0, w)]).close())\n    body = body.union(core).union(prof.sweep(helix,\
    \ isFrenet=True))\n\n    # conical lead-in on the tip so it starts in the socket\
    \ squarely\n    c = 1.0\n    puck = cq.Workplane(\"XY\", center=cq.Vector(0, 0,\
    \ tip - c)).circle(crest_r + 1.5).extrude(c + 0.5)\n    keep = cq.Workplane(\"\
    XY\", center=cq.Vector(0, 0, tip - c)).cone(crest_r + 1.5, crest_r - 1.2, c +\
    \ 0.5)\n    body = body.cut(puck.cut(keep))\n    return body"
  print_orientation: Hex head flat on the bed (z=0), thread standing straight up -
    printing the thread on the vertical axis is what makes it usable. No supports.
  use_orientation: Head up in the plate's hex pocket, thread pointing up into the
    camera - same orientation as printed.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "from math import cos, pi, tan\n\ndef build(p):\n    base = cq.Workplane(\"\
    XY\").rect(90.0, 26.0).extrude(p.coupon_base_t)\n\n    # A) dovetail wedge at\
    \ the real width / flank angle / flank height -> test in the clamp\n    hb = p.clamp_plate_width\
    \ / 2.0\n    hn = hb - p.flank_height * tan(p.flank_angle * pi / 180.0)\n    pts\
    \ = [(-hb, 0.0), (hb, 0.0), (hn, p.flank_height), (-hn, p.flank_height)]\n   \
    \ wedge = cq.Workplane(\"XZ\").polyline(pts).close().extrude(20.0)\n    bb = wedge.val().BoundingBox()\n\
    \    wedge = wedge.translate(cq.Vector(-25.0 - (bb.xMin + bb.xMax) / 2.0,\n  \
    \                                    -(bb.yMin + bb.yMax) / 2.0,\n           \
    \                           p.coupon_base_t - bb.zMin))\n\n    # B) head-pocket\
    \ gauge: same centre thickness as the plate, hex recess + ceiling hole\n    h\
    \ = p.pocket_depth + p.ceiling_thk\n    blk = cq.Workplane(\"XY\", center=cq.Vector(10.0,\
    \ 0.0, p.coupon_base_t)).rect(22.0, 22.0).extrude(h)\n    rc = p.pocket_af / (2.0\
    \ * cos(pi / 6.0))\n    hexpts = [(rc * cos(2 * pi * i / 6.0), rc * sin(2 * pi\
    \ * i / 6.0)) for i in range(6)]\n    rec = (cq.Workplane(\"XY\", center=cq.Vector(10.0,\
    \ 0.0, p.coupon_base_t + h - p.pocket_depth))\n           .polyline(hexpts).close().extrude(p.pocket_depth\
    \ + 0.5))\n    blk = blk.cut(rec)\n    hole = (cq.Workplane(\"XY\", center=cq.Vector(10.0,\
    \ 0.0, 0.0))\n            .circle(p.shaft_hole_d / 2.0).extrude(p.coupon_base_t\
    \ + h - p.pocket_depth + 0.5))\n    blk = blk.cut(hole)\n\n    # C) printed 1/4\"\
    -20 stub -> test in the camera socket before trusting stud_pla\n    root_r = p.stud_root_d\
    \ / 2.0\n    crest_r = p.stud_crest_d / 2.0\n    w = p.thread_profile_frac * p.thread_pitch\n\
    \    z0 = p.coupon_base_t + 2.0\n    tip = z0 + p.coupon_stub_len\n    puck =\
    \ cq.Workplane(\"XY\", center=cq.Vector(36.0, 0.0, p.coupon_base_t)).circle(6.0).extrude(2.0)\n\
    \    core = cq.Workplane(\"XY\", center=cq.Vector(36.0, 0.0, z0)).circle(root_r).extrude(tip\
    \ - z0)\n    helix = cq.Workplane(\"XY\", center=cq.Vector(36.0, 0.0, z0)).helix(p.thread_pitch,\
    \ tip - z0, root_r)\n    prof = (cq.Workplane(\"XZ\").center(36.0 + root_r, z0)\n\
    \            .polyline([(0.0, -w), (crest_r - root_r, 0.0), (0.0, w)]).close())\n\
    \    stub = puck.union(core).union(prof.sweep(helix, isFrenet=True))\n\n    return\
    \ base.union(wedge).union(blk).union(stub)"
  print_orientation: Flat, 3 mm base on the bed, all three test features standing
    up. One print, about 15 minutes.
  use_orientation: Throwaway gauge - orientation does not matter.
hardware:
- id: bolt14
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_stud
  fastener: bolt14
  axis_origin:
  - 0.0
  - 0.0
  - 0.5
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: head_pocket
    role: head_seat
  - part: plate
    feature: ceiling_hole
    role: clearance
  nut: null
  external: camera 1/4"-20 tripod socket (ISO 1222), ~5.5 mm deep
criteria:
- id: head_capture
  part: plate
  feature: head_pocket
  relation: contains
  hardware: null
  clearance_mm: 0.4
  params:
  - pocket_af
  - pocket_depth
  - bolt_head_af
  - bolt_head_h
  check:
    method: coupon
    ref: fit_coupon
    description: Thread the bolt DOWN head-first through the coupon's 6.9 hole into
      its hex recess. The head must enter the recess and sit flush under it. If it
      binds, raise pocket_af to 15.6/15.8; if it rattles, lower it. Reprint the coupon
      (15 min) before the plate.
- id: stud_engage
  part: plate
  feature: seat_ring
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - bolt_thread_len
  - pocket_depth
  - ceiling_thk
  - ring_h
  check:
    method: measure
    ref: null
    description: With the head pushed fully up against the ceiling, the stud tip must
      stand at least socket_engage (5.5 mm) proud of the seat ring face. Expect ~6.6
      mm.
- id: shaft_clear
  part: plate
  feature: ceiling_hole
  relation: clears
  hardware: null
  clearance_mm: 0.55
  params:
  - shaft_hole_d
  - thread_major
  check:
    method: measure
    ref: null
    description: Bolt passes through with no pushing or turning needed.
- id: head_recessed
  part: plate
  feature: head_pocket
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - pocket_depth
  - bolt_head_h
  check:
    method: measure
    ref: null
    description: Seated head must sit BELOW the clamp face (0.5 mm recessed), not
      proud of it, or the plate will not sit flat in the jaws.
- id: dovetail_seats
  part: plate
  feature: dovetail
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - clamp_plate_width
  - flank_angle
  - flank_height
  check:
    method: coupon
    ref: fit_coupon
    description: Put the coupon's 38 mm wedge in the clamp and close the jaws. It
      must go in to its full flank height and need real force to pull out. If the
      jaws only bite ~2 mm, set flank_height to 2.5 and reprint the coupon.
- id: socket_thread_fit
  part: stud_pla
  feature: thread
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - stud_crest_d
  - stud_root_d
  - thread_pitch
  - thread_profile_frac
  - socket_engage
  check:
    method: coupon
    ref: fit_coupon
    description: Screw the coupon's printed thread stub into the camera socket by
      hand. It must turn in under light, even pressure for 5 turns. If it binds or
      stalls, do NOT print stud_pla for use - use the metal bolt. If you want the
      printed stud anyway, drop stud_crest_d to 5.95 and reprint the coupon.
- id: backup_head_capture
  part: stud_pla
  feature: head
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - stud_pla_head_af
  - stud_pla_head_h
  - pocket_af
  - pocket_depth
  check:
    method: measure
    ref: null
    description: The printed head must drop into the same pocket and be trapped by
      the ceiling, with no more than ~0.4 mm of free play.
- id: backup_engage
  part: stud_pla
  feature: thread
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - stud_pla_thread_len
  - pocket_depth
  - ceiling_thk
  - ring_h
  - socket_engage
  check:
    method: measure
    ref: null
    description: Tip must stand 5.5-6.0 mm above the seat ring face - enough to hold,
      short enough that it cannot bottom out hard in the socket.
manual:
- n: '1'
  text: Print fit_coupon first, flat on the bed, 3 perimeters, 0.2 mm layers, no supports.
    It is 90 x 26 mm and takes about 15 minutes. Everything below depends on it.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'TEST the bolt head: thread the salvaged 1/4"-20 bolt DOWN, head first, through
    the 6.9 mm hole in the coupon''s block. The head should enter the hex recess and
    come to rest under it. Binds -> raise pocket_af (15.6, then 15.8) and reprint
    the coupon. Rattles -> lower it toward 15.2.'
  parts:
  - fit_coupon
  - plate
  hardware:
  - bolt14
  tool: calipers or fingers
- n: '3'
  text: 'TEST the clamp: put the coupon''s 38 mm wedge into the tripod''s clamp and
    close the jaws. It must go in to the full 4 mm flank height and take real force
    to pull straight out. If the jaws only bite part of it, lower flank_height to
    match and reprint the coupon.'
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '4'
  text: 'TEST the printed thread (only if you want the printed backup screw): screw
    the coupon''s little printed stud into the camera''s socket by hand. Light, even
    resistance is fine. If it stalls or needs force, stop and use the metal bolt -
    which is the recommended route anyway.'
  parts:
  - fit_coupon
  - stud_pla
  hardware: []
  tool: null
- n: '5'
  text: 'Print plate: 38 mm dovetail face flat on the bed, seat ring pointing up,
    no supports. 4 perimeters (walls), 15-20% gyroid infill, 0.2 mm layers, ~40 mm/s.
    This part carries your camera - do not skimp on wall count.'
  parts:
  - plate
  hardware: []
  tool: null
- n: '6'
  text: 'Print stud_pla only if you decided not to use the metal bolt: hex head flat
    on the bed, thread standing up, 3 perimeters, 100% infill, no supports.'
  parts:
  - stud_pla
  hardware: []
  tool: null
- n: '7'
  text: 'Clear the plate''s holes with a drill bit by hand if you see any blobbing:
    the 6.9 mm ceiling hole and the hex pocket mouth on the clamp face. Do not enlarge
    the pocket.'
  parts:
  - plate
  hardware: []
  tool: 7 mm drill bit
- n: '8'
  text: 'Assemble off the tripod. Push the bolt HEAD FIRST up into the hex pocket
    from the clamp face, and pass its threaded shaft up through the 6.9 mm ceiling
    hole. Push until the head is against the ceiling - the stud should then stand
    about 6.6 mm above the seat ring face. With stud_pla instead: same thing, head
    up into the pocket, where the hex flats stop it spinning.'
  parts:
  - plate
  - stud_pla
  hardware:
  - bolt14
  tool: null
- n: '9'
  text: 'Screw the camera onto the stud BY HAND until its base sits on the seat ring.
    Hand tight only - no tools, no pliers, no wrench. If you feel a hard stop before
    the camera sits flat, the stud is bottoming out in the socket: back off half a
    turn, that is enough. If you are using the printed backup stud, re-check it after
    the first few uses; plastic creeps.'
  parts:
  - plate
  hardware:
  - bolt14
  tool: null
- n: '10'
  text: Slide the plate's dovetail into the clamp so the flanks draw it down, then
    close the jaws. Pull firmly on the plate - it should not lift out. The plate can
    only escape by pushing back up through the jaw squeeze, so this is your go/no-go
    check.
  parts:
  - plate
  hardware: []
  tool: null
- n: '11'
  text: Re-check the fit after 10 minutes of sitting, and any time the camera has
    been left on it. PLA under a clamp and a camera slowly creeps, and the failure
    mode here is dropping a camera, not breaking a 50 cent plate.
  parts:
  - plate
  hardware: []
  tool: null
- n: '12'
  text: Do not lift the tripod by the camera, do not hang a long or heavy lens off
    it, and do not leave it in a hot car. This is a temporary part - retire it as
    soon as the real plate turns up.
  parts:
  - plate
  hardware: []
  tool: null
- n: '13'
  text: If the clamp turns out to want a wider plate than 38 mm, or the head pocket
    needs changing, edit only those params and reprint the coupon before reprinting
    the plate - nothing else in the design moves.
  parts:
  - fit_coupon
  - plate
  hardware: []
  tool: null
