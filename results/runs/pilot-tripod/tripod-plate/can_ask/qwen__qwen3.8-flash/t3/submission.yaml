  hardware: webcam_bolt
  clearance_mm: 0.25
  params:
  - bolt_clear_d
  - bolt_head_d
  - head_seat_depth
  - deck_t
  - bolt_thread_len
  check:
    method: coupon
    ref: gauge_coupon
    description: the salvaged bolt must pass the 6.6 mm hole and sink its head into
      the 5.2 mm seat with its tip standing about 6 mm proud
- id: plate_bolt_clearance
  part: camera_plate
  feature: bolt_clearance
  relation: clears
  hardware: webcam_bolt
  clearance_mm: 0.25
  params:
  - bolt_clear_d
  - cam_thread_od
  - deck_t
  check:
    method: none
    ref: null
    description: ''
- id: bolt_head_seats
  part: camera_plate
  feature: head_seat_pocket
  relation: seats
  hardware: webcam_bolt
  clearance_mm: null
  params:
  - bolt_head_d
  - bolt_head_h
  - head_seat_depth
  check:
    method: measure
    ref: null
    description: head must sit below the foot's outer face so the plate seats flat
- id: thread_engage
  part: camera_plate
  feature: bolt_clearance
  relation: engages
  hardware: webcam_bolt
  clearance_mm: null
  params:
  - bolt_thread_len
  - deck_t
  - cam_socket_depth
  check:
    method: measure
    ref: null
    description: bolt_thread_len - deck_t = 6 mm must be fully inside the camera's
