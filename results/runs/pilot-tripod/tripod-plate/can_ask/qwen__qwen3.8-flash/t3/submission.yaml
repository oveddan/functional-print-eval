task: tripod-plate
note: 'It''s a two-piece quick-release: a flat plate that drops into the knob clamp,
  and a screw into the camera. Printing the plate is easy and completely reasonable
  for a temporary fix. Printing the *screw* is the part I''d push back on: a PLA 1/4-20
  thread inside a steel camera socket will strip, can jam, and a jammed plastic stud
  inside a camera is a much worse problem than a missing plate. So the design carries
  both fastener routes in the same pocket: the plate''s head recess is sized around
  your borrowed 1/4"-20 bolt (15 mm head, 5 mm tall, 10 mm under head) so that bolt
  is the primary, safe fix; the printed thumb screw is handed in as the fallback you
  asked for, with the same Ø15 x 5 head envelope, so either one works in the same
  plate.


  Big caveat, flagged honestly: the measure tool would only repeat two cached readings,
  so I never got your clamp''s jaw gap (open or closed), the lip depth/angle, or the
  slot depth. Everything about the grip is therefore a guess, and rather than hide
  that I''ve made the grip width a single selectable number (`grip_step`: 29 / 32
  / 35 mm across the foot) and handed in a cheap `gauge_coupon` carrying all three
  profiles at once, plus a copy of the bolt hole and head recess. Print the coupon
  first (about 15 min), find which step the jaws pinch, and print the plate on that
  step. If none of the three is right, the numbers to edit are `foot_w_1/2/3`.


  Assumed: camera socket at least 6 mm deep (bolt gives 10 - 4 mm deck = 6 mm engagement)
  and a camera of roughly 1 kg or less. This is a temporary part — check it warm and
  uncreeped, and don''t put an expensive lens over it unattended.'
questions:
- text: With the knob wound fully open, how wide is the clear gap between the two
    jaw lips (the widest plate that will drop in)?
  answer: null
- text: With the knob fully closed, how wide is the gap between the lips (how far
    the foot has to be squeezed)?
  answer: null
- text: How deep is the slot from the top of the clamp down, and how tall are the
    gripping lips? (Drives grip_depth = 6.5 mm and the 10.5 mm total plate thickness.)
  answer: null
- text: Are the jaw faces parallel, or angled in to a dovetail — and at roughly what
    angle? (Drives grip_flank_deg = 22 degrees from vertical.)
  answer: null
- text: How deep is the camera's 1/4-20 socket? The bolt only has 10 mm of thread,
    so with a 4 mm deck you want at least 6 mm of steel to bite into.
  answer: null
- text: How wide is the flat patch on the camera's underside around the socket? The
    plate deck is 40 x 54 mm; tell me if it must be smaller.
  answer: null
- text: About how heavy is the camera plus lens you'll hang on it? A rough weight
    decides whether I keep the deck at 4 mm.
  answer: null
params:
  cam_thread_od:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 major diameter, confirmed on the camera socket
  cam_thread_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 = 20 tpi
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam bolt, across the head
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bolt_thread_len:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: thread under the head; sets how far it reaches through the deck
  cam_socket_depth:
    value: 6
    unit: mm
    kind: world
    source: guessed
    note: not measured; must be >= bolt_thread_len - deck_t = 6 mm. Check before trusting
      it.
  jaw_open_gap:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: would not measure; the gauge coupon stands in for this
  jaw_closed_gap:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: would not measure; drives which grip_step you pick
  slot_depth:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: must be >= grip_t = 10.5 mm or the deck will not sit flat on the clamp
  cam_load_kg:
    value: 1
    unit: count
    kind: world
    source: guessed
    note: assumed light camera + small lens; PLA creeps, so keep it under ~1 kg
  grip_step:
    value: 2
    unit: count
    kind: design
    source: design
    note: 1, 2 or 3 -> picks foot_w_1/2/3. Choose after testing the gauge_coupon.
  foot_w_1:
    value: 29
    unit: mm
    kind: design
    source: design
    note: narrow step - for a clamp that barely closes
  foot_w_2:
    value: 32
    unit: mm
    kind: design
    source: design
    note: nominal, middle step
  foot_w_3:
    value: 35
    unit: mm
    kind: design
    source: design
    note: wide step - for a loose clamp; needs the slot to accept 35 mm
  grip_depth:
    value: 6.5
    unit: mm
    kind: design
    source: design
    note: how far below the deck the foot reaches; neck band above it is the same
      height
  grip_flank_deg:
    value: 22
    unit: deg
    kind: design
    source: design
    note: dovetail flank, from vertical. Wider than the lips' own angle means line
      contact that jams tighter.
  deck_w:
    value: 40
    unit: mm
    kind: design
    source: design
    note: camera-side face, across the jaws
  deck_len:
    value: 54
    unit: mm
    kind: design
    source: design
    note: camera-side face, along the plate's travel
  deck_t:
    value: 4
    unit: mm
    kind: design
    source: design
    note: 'thickness the bolt passes through: 10 - 4 = 6 mm into the camera'
  rim_t:
    value: 3.6
    unit: mm
    kind: design
    source: design
    note: 'side wall of the foot; 9 perimeter lines, prints solid with no infill there.
      Also sets the cavity the bolt head lives in: foot_w - 2*(grip reach) - 2*rim_t
      must clear the 15 mm head.'
  lead_in:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: chamfer of the foot's outer corner so it starts in the jaws
  bolt_clear_d:
    value: 6.6
    unit: mm
    kind: design
    source: design
    note: through-hole for the 1/4-20 bolt, +0.25 on major dia
  head_seat_depth:
    value: 5.2
    unit: mm
    kind: design
    source: design
    note: depth the head drops into the foot's underside; 0.2 clearance over the 5
      mm head
  screw_root_d:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: core of the printed spare screw
  screw_crest_d:
    value: 6.3
    unit: mm
    kind: design
    source: design
    note: 0.05 mm under 1/4-20 major so it can start by hand
  screw_ridge_t:
    value: 0.7
    unit: mm
    kind: design
    source: design
    note: axial thickness of each thread ridge; pitch is cam_thread_pitch
  screw_thread_len:
    value: 10
    unit: mm
    kind: design
    source: design
    note: matches the salvaged bolt so it fits the same pocket
  screw_head_clear:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: printed head is this much under the metal 15 mm head so it drops into the
      same seat
  screw_slot_w:
    value: 6
    unit: mm
    kind: design
    source: design
    note: coin / small blader slot in the head
  screw_slot_depth:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_len:
    value: 70
    unit: mm
    kind: design
    source: design
    note: one foot of each step, 14 mm long, in a row
  coupon_deck_w:
    value: 40
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: gauge_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    # three dovetail foot profiles in a row, plus a copy of\
    \ the bolt hole and head seat\n    steps = (p.foot_w_1, p.foot_w_2, p.foot_w_3)\n\
    \    fl = 14.0\n    gap = 3.0\n    land_t = p.deck_t\n    fd = p.grip_depth +\
    \ p.head_seat_depth\n    total = len(steps) * fl + (len(steps) - 1) * gap\n  \
    \  z1 = p.deck_t\n    z3 = z1 + p.grip_depth\n\n    body = (cq.Workplane(\"XY\"\
    ).box(p.coupon_deck_w, total, land_t, centered=(True, True, False)))\n\n    y0\
    \ = -total / 2.0\n    for i, foot_w in enumerate(steps):\n        yc = y0 + fl\
    \ / 2.0 + i * (fl + gap)\n        flank = 2.0 * p.grip_depth * tan(radians(p.grip_flank_deg))\n\
    \        neck_w = foot_w - flank\n        foot = (cq.Workplane(\"XY\")\n     \
    \           .center(0, yc, 0).workplane(offset=z1)\n                .rect(neck_w\
    \ + 2 * p.rim_t, fl)\n                .workplane(offset=p.grip_depth)\n      \
    \          .rect(foot_w + 2 * p.rim_t, fl)\n                .loft())\n       \
    \ body = body.union(foot)\n        # mark each step so you can tell 1 / 2 / 3\
    \ apart on the bench\n        mark = (cq.Workplane(\"XY\")\n                .center(0,\
    \ yc, 0).workplane(offset=z3 - 0.5)\n                .polyline([(-1.0, -(0.5 +\
    \ i)), (1.0, -(0.5 + i)), (1.0, (0.5 + i)), (-1.0, (0.5 + i))])\n            \
    \    .close().extrude(1.5))\n        body = body.cut(mark)\n\n    # fastener check:\
    \ bolt clearance hole through 4 mm of deck, head seat 5.2 mm deep beside it\n\
    \    fc = (cq.Workplane(\"XY\")\n          .center(0, total / 2.0 + 8.0, 0).workplane(offset=-1.0)\n\
    \          .rect(22.0, 20.0).extrude(p.deck_t + p.grip_depth + p.head_seat_depth\
    \ + 1.0))\n    body = body.union(fc)\n    cz = body.findCq(cq.Workplane(\"XY\"\
    ).center(0, total / 2.0 + 8.0, 0))\n    body = cz.cut(cq.Workplane(\"XY\").center(0,\
    \ total / 2.0 + 8.0, 0).workplane(offset=-1.0)\n                  .circle(p.bolt_clear_d\
    \ / 2.0).extrude(p.deck_t + 2.0))\n    body = body.cut(cq.Workplane(\"XY\").center(0,\
    \ total / 2.0 + 8.0, 0)\n                    .workplane(offset=z3)\n         \
    \           .circle(p.bolt_head_d / 2.0 + 0.4).extrude(p.head_seat_depth + 1.0))\n\
    \    return body"
  print_orientation: 'as modelled: 4 mm land flat on the bed, the three test feet
    standing up in +Z'
  use_orientation: not used - test only, then keep as a spare gauge
- id: camera_plate
  role: final
  material: PLA
  code: "def build(p):\n    # the plate is printed deck-down: z = 0 is the camera-side\
    \ face, the dovetail foot stands up\n    step = int(p.grip_step)\n    foot_w =\
    \ (p.foot_w_1, p.foot_w_2, p.foot_w_3)[step - 1]\n    deck_w, deck_len = p.deck_w,\
    \ p.deck_len\n    z1 = p.deck_t                          # top of the 4 mm web\
    \ the bolt passes through\n    z2 = z1 + p.grip_depth                 # where\
    \ the foot starts\n    z3 = z2 + p.head_seat_depth            # outer face of\
    \ the foot = 10.5 mm total\n    neck_w = foot_w - 2.0 * p.grip_depth * tan(radians(p.grip_flank_deg))\n\
    \    lead = p.lead_in\n    hw = deck_w / 2.0\n    nf, ff = neck_w / 2.0, foot_w\
    \ / 2.0\n\n    # closed outline in the XZ plane: deck ledge, neck band, dovetail\
    \ foot\n    pts = [(-hw, 0.0), (hw, 0.0), (hw, z1), (nf, z1), (nf, z2), (ff -\
    \ lead, z3), (ff - 2 * lead, z3),\n           (ff - 2 * lead - p.rim_t * 0.0,\
    \ z3 - 0.0)]\n    # rebuild the same loop properly, inner cavity as a separate\
    \ cut\n    pts = [(-hw, 0.0), (hw, 0.0), (hw, z1), (nf, z1), (nf, z2),\n     \
    \      (ff - lead, z3), (-(ff - lead), z3),\n           (-nf, z2), (-nf, z1),\
    \ (-hw, z1)]\n    body = (cq.Workplane(\"XZ\")\n            .moveTo(*pts[0]).polyline(pts[1:]).close()\n\
    \            .extrude(deck_len, both=True))\n\n    # hollow the middle so the\
    \ 15 mm bolt head lives inside the foot and nothing sticks out\n    cavity = (cq.Workplane(\"\
    XZ\")\n              .moveTo(-ff + lead + p.rim_t, z3 + 1.0)\n              .lineTo(ff\
    \ - lead - p.rim_t, z3 + 1.0)\n              .lineTo(nf - p.rim_t, z2)\n     \
    \         .lineTo(nf - p.rim_t, z1 + 0.4)\n              .lineTo(-(nf - p.rim_t),\
    \ z1 + 0.4)\n              .lineTo(-(nf - p.rim_t), z2)\n              .close().extrude(deck_len\
    \ - 2.0 * p.rim_t, both=True))\n    body = body.cut(cavity)\n\n    # bolt clearance\
    \ through the web, and the head seat pocket above it\n    body = body.cut(cq.Workplane(\"\
    XY\").workplane(offset=-1.0)\n                    .circle(p.bolt_clear_d / 2.0).extrude(z1\
    \ + 2.0))\n    body = body.cut(cq.Workplane(\"XY\").workplane(offset=z3)\n   \
    \                 .circle(p.bolt_head_d / 2.0 + 0.4).extrude(p.head_seat_depth\
    \ + 1.0))\n\n    try:\n        body = body.edges(\"|Z\").fillet(1.5)\n    except\
    \ Exception:\n        pass\n    return body"
  print_orientation: 'as modelled: the camera-side face of the deck is the first layer
    on the bed (z=0), the dovetail foot stands up in +Z. The foot gets wider with
    height, so there is nothing to support.'
  use_orientation: 'flipped for use: the deck face (print z=0) sits on the camera''s
    base, the foot (print +Z) drops into the clamp slot between the jaws'
- id: camera_screw
  role: final
  material: PLA
  code: "def build(p):\n    # printed 1/4-20 thumb screw - FALLBACK only, the metal\
    \ bolt is the safe fastener\n    pitch = p.cam_thread_pitch\n    head_d = p.bolt_head_d\
    \ - p.screw_head_clear\n    head_h = p.bolt_head_h\n    root_r = p.screw_root_d\
    \ / 2.0\n    crest_r = p.screw_crest_d / 2.0\n    thread_len = p.screw_thread_len\n\
    \    ridge_t = p.screw_ridge_t\n\n    # head: same 15 x 5 mm envelope as the salvaged\
    \ bolt so it drops into the same seat\n    body = (cq.Workplane(\"XY\").circle(head_d\
    \ / 2.0).extrude(head_h))\n\n    # plain tip first, so the thread starts in the\
    \ camera's existing turns\n    tip = 2.0\n    body = body.union(cq.Workplane(\"\
    XY\").workplane(offset=head_h).circle(root_r).extrude(thread_len))\n\n    # thread\
    \ as one ring per turn at the true 1.27 mm pitch; the model cannot do a real helix\
    \ here\n    n = int((thread_len - tip - ridge_t) / pitch) + 1\n    for i in range(n):\n\
    \        z = head_h + tip + i * pitch\n        r = crest_r if 0 < i < n - 1 else\
    \ crest_r - 0.2\n        ring = (cq.Workplane(\"XY\").workplane(offset=z).circle(r).extrude(ridge_t))\n\
    \        body = body.union(ring)\n\n    # coin slot in the head, open at the rim\
    \ so nothing needs bridging\n    body = body.cut(cq.Workplane(\"XY\").workplane(offset=head_h\
    \ - p.screw_slot_depth - 0.5)\n                    .box(head_d + 4.0, p.screw_slot_w,\
    \ p.screw_slot_depth + 0.5,\n                         centered=(True, True, False)))\n\
    \    return body"
  print_orientation: 'head down on the bed: the flat face that bears on the plate
    is print z=0, the threaded stud points up in +Z'
  use_orientation: 'same axis as the salvaged bolt: head bears on the plate''s head
    seat, thread goes up into the camera''s 1/4-20 socket'
hardware:
- id: webcam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_bolt_joint
  fastener: webcam_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: camera_plate
    feature: head_seat_pocket
    role: head_seat
  - part: camera_plate
    feature: bolt_clearance
    role: clearance
  - part: camera_screw
    feature: head_seat_pocket
    role: head_seat
  - part: camera_screw
    feature: thread
    role: thread
  nut: null
  external: camera's 1/4-20 tripod socket
criteria:
- id: grip_step_test
  part: gauge_coupon
  feature: test_foot_2
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - grip_step
  - foot_w_2
  - jaw_open_gap
  - jaw_closed_gap
  check:
    method: coupon
    ref: gauge_coupon
    description: 'drop each foot into the jaws in turn, tighten the knob: the right
      step is the one the lips pinch so you cannot pull it out by hand'
- id: fastener_fit
  part: gauge_coupon
  feature: bolt_clearance
