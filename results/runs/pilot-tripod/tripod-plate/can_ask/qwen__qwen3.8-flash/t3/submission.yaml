- id: deck_faces_camera
  part: camera_plate
  feature: deck_face
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - deck_w
  - deck_len
  check:
    method: measure
    ref: null
    description: the 40 x 54 mm deck must land inside the flat patch on the camera's
      base, clear of the lens and any battery grip
- id: foot_in_slot
  part: camera_plate
  feature: grip_foot
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - slot_depth
  - grip_depth
  - head_seat_depth
  - deck_t
  check:
    method: measure
    ref: null
    description: deck must close down onto the clamp's top face, so slot_depth >=
      10.5 mm
- id: spare_screw_thread
  part: camera_screw
  feature: thread
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - screw_crest_d
  - screw_ridge_t
  - screw_thread_len
  - cam_thread_od
  - cam_thread_pitch
  - cam_socket_depth
  check:
    method: coupon
    ref: gauge_coupon
    description: start by hand only, into the plate first, then test in the camera
      - it must turn in without forcing
manual:
- n: '1'
  text: Print `gauge_coupon` first. It's the small piece with three standing feet
    and a pad at one end. Lay it flat on the bed as modelled, no supports, 3 perimeters,
    20% infill, 0.2 mm layers. About 15 minutes. The feet are marked 1, 2 and 3, narrowest
    to widest.
  parts:
  - gauge_coupon
  hardware: []
  tool: null
- n: '2'
  text: Find the grip size. Drop the coupon in so each foot in turn sits between the
    jaws, and tighten the knob by hand. The right foot is the one the lips pinch hard
    enough that you can't pull the coupon straight out. If foot 1 is the only one
    that goes in at all, or foot 3 is still loose with the knob closed, stop and tell
    me - those are the numbers I couldn't measure.
  parts:
  - gauge_coupon
  hardware: []
  tool: tripod knob
- n: '3'
  text: 'Same coupon, fastener check: push the salvaged 1/4-20 bolt through the 6.6
    mm hole in the pad and let its head drop into the round seat. The head must sit
    below the pad''s outer face, and the tip must stand about 6 mm proud. That 6 mm
    is the thread that goes into your camera - if it''s less, say so before printing
    the plate.'
  parts:
  - gauge_coupon
  hardware:
  - webcam_bolt
  tool: null
- n: '4'
  text: 'Set `grip_step` in the params to the number of the foot that worked (1 =
    29 mm, 2 = 32 mm, 3 = 35 mm across the foot), then print `camera_plate`. Print
    it exactly as modelled: the flat camera-side face down on the bed, the dovetail
    foot standing up. No supports, 4 perimeters, 20-25% infill, 0.2 mm layers.'
  parts:
  - camera_plate
  hardware: []
  tool: null
- n: '5'
  text: Print `camera_screw` only if you can't use the metal bolt - head down on the
    bed, thread pointing up, no supports, 4 perimeters, 25% infill. Read step 8 first.
  parts:
  - camera_screw
  hardware: []
  tool: null
- n: '6'
  text: 'Dry-fit the plate to the tripod with no camera on it: drop the foot into
    the slot and tighten the knob. The deck must close right down flat onto the clamp''s
    top face with the foot fully in. If the foot won''t go in, file the two sloped
    flanks down a little - PLA files easily - and refit.'
  parts:
  - camera_plate
  hardware: []
  tool: knife or coarse file
- n: '7'
  text: 'Screw the plate to the camera. Put the plate on a table foot-up, drop the
    salvaged 1/4-20 bolt into the pocket so the head sits down on the seat, then drive
    it up into the camera''s socket by hand for the first few turns and tighten with
    the driver that suits the head. Aim for all 10 mm of thread in: 4 mm through the
    plate''s web leaves 6 mm gripping the camera. Do not overtighten - you''re pulling
    on plastic.'
  parts:
  - camera_plate
  hardware:
  - webcam_bolt
  tool: null
- n: '8'
  text: 'The printed spare screw, if you must use it: run the metal bolt through its
    thread first to form the crests, start it in the camera by hand with no force,
    and back it out if it binds at any point. A stripped PLA screw jammed inside a
    camera socket is a far bigger job than a missing plate, so treat this as a last
    resort and not for heavy lenses.'
  parts:
  - camera_screw
  hardware:
  - webcam_bolt
  tool: null
- n: '9'
  text: 'Mount it: seat the plate in the jaws, tighten the knob, then tug the camera
    firmly along all three axes and watch the deck. It should not slide or tilt. Keep
    the camera''s strap around your neck until you''re sure.'
  parts:
  - camera_plate
  hardware: []
  tool: null
- n: '10'
  text: It's temporary for a reason. Re-check the knob and the plate after the first
    hour, and any time the rig gets hot - PLA softens around 55 C and creeps under
    a static load. Take it off when you find the real part.
  parts:
  - camera_plate
  hardware: []
  tool: null
