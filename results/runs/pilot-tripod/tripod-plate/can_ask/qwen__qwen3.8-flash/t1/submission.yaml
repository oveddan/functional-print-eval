manual:
- n: '1'
  text: 'Print fit_gauge first, lying flat as oriented: PLA, 0.2 mm layers, 3 perimeters.
    It is a throwaway, so use any leftover filament.'
  parts:
  - fit_gauge
  hardware: []
  tool: null
- n: '2'
  text: 'Find your jaw gap. Wind the knob fully open and drop each of the three wide
    prongs in from above, the way the real plate went in. The smaller ones drop freely,
    the biggest will not enter. Set plate_w to the widest prong that still drops in
    with no force: 1 dot = plate_w - 2 mm, 2 dots = plate_w, 3 dots = plate_w + 2
    mm.'
  parts:
  - fit_gauge
  hardware: []
  tool: null
- n: '3'
  text: 'Find your channel depth. Drop the tallest tab (4 dots) in from above; if
    it does not go right down, try 3 dots, then 2, then 1. The right tab is the tallest
    one that seats fully and, with the knob wound snug, is pinched hard with its top
    face level with or above the jaw lips. Set plate_thk to that tab''s height: 1
    dot = plate_thk - 2 mm, 2 = plate_thk, 3 = +2 mm, 4 = +4 mm. Do not skip this
    step - the plate has to fill the channel so the clamp carries the camera rather
    than the plastic thread.'
  parts:
  - fit_gauge
  hardware: []
  tool: null
- n: '4'
  text: Check the thread before trusting it with your camera. Wind the gauge's little
    threaded post into the 1/4-20 nut by hand. It should start without forcing and
    turn stiffly as the plastic forms itself to the nut. If it will not start, re-slice
    the gauge with stem_root 0.2 mm smaller; if it spins with no feel at all, 0.2
    mm larger.
  parts:
  - fit_gauge
  hardware:
  - nut_qq20
  tool: 1/4-20 hex nut as a thread gauge
- n: '5'
  text: 'With plate_thk and plate_w set from steps 2 and 3, print jaw_plate (round
    counterbore face down on the bed) and camera_screw (head down on the bed). Neither
    needs supports. Use 4 perimeters and 25-30% infill on jaw_plate: it is the part
    taking the load.'
  parts:
  - jaw_plate
  - camera_screw
  hardware: []
  tool: null
- n: '6'
  text: Turn jaw_plate upside down over a table. Push camera_screw's head up into
    the round chamber and line its stem up with the small hole in the chamber roof,
    then push the stem through. The head is now captive - it cannot escape upwards
    because the stem passes through that hole, and the head is flush with the plate's
    underside.
  parts:
  - jaw_plate
  - camera_screw
  hardware: []
  tool: null
- n: '7'
  text: Put the plate on the camera's underside with the thread entering the 1/4-20
    socket and wind it in by the flat-sided head, thumb and forefinger, until the
    plate is snugged against the camera body. Hand tight only. If it binds, back it
    out and re-check against step 4 - never force plastic into the camera's metal
    socket.
  parts:
  - jaw_plate
  - camera_screw
  hardware: []
  tool: null
- n: '8'
  text: 'Drop the plate into the clamp from above and wind the knob down hard. Push
    the camera gently: if the assembly rocks or the plate slides, the plate is too
    thin for the channel, so go back to step 3 and re-print jaw_plate one tab thicker.'
  parts:
  - jaw_plate
  hardware: []
  tool: null
- n: '9'
  text: 'Metal version, and the better one: the salvaged webcam bolt (1/4-20, 15 mm
    head, 10 mm thread) drops into the same chamber and is wound up into the camera
    with a driver from below before the plate goes into the clamp. Its head finishes
    flush with the plate underside, so it does not stop the plate seating. Use it
    if your camera''s socket is deeper than the printed 8 mm thread, or for anything
    heavier than a compact camera.'
  parts:
  - jaw_plate
  hardware:
  - webcam_bolt
  tool: driver that fits the bolt head
- n: '10'
  text: This is a temporary part. Keep looking for the real plate; do not put a long
    lens or a pan head under load on it, and check the printed thread for stretching
    before each use since PLA creeps under side load. If you want to keep it, print
    a second camera_screw as a spare - the plate is the good part, the screw is the
    wear part.
  parts:
  - jaw_plate
  - camera_screw
  hardware: []
  tool: null
