task: tripod-plate
note: 'How hard is it? Easy - three small prints, all flat on the bed, no supports
  (the dovetail narrows as it rises, so every layer is supported), and the biggest
  span is ~30 mm across the head pocket, under your 50 mm bridge limit. Under an hour
  of printing for all three.


  The key decision: the "part that screws in" is NOT printed. Your salvaged webcam
  bolt is 1/4"-20, which is exactly the camera''s tripod socket thread, so the joint
  is steel-into-steel and the printed plate is only in compression. Printing a female
  1/4-20 thread in PLA and screwing a camera onto it risks welding nylon into the
  camera socket by friction heat/creep - much worse than a lost plate.


  What I had to assume, and how the design checks it: you could tell me the clamp
  takes a 38 mm wide plate, but not the channel''s depth or flank angle, and those
  are what actually decide whether a dovetail holds. So the plate is modelled on the
  standard Arca-Swiss RSP envelope (38 mm across the widest flats, 6 mm thick, flanks
  tapering to a 30 mm top land), and two throwaway coupons verify it before the camera
  goes anywhere near it: gauge_width has three bands at 37.3 / 38.0 / 38.7 mm with
  the same flank angle (the middle one is literally the plate''s cross-section), and
  gauge_height has flat tabs at 5 / 6 / 7 mm to find the usable channel height. Read
  the coupons, and if the profile that gripped was not the 6 mm x 38 mm one, tell
  me which band/tab bit and I''ll re-cut the plate''s cross-section - nothing else
  changes.


  Details worth knowing: the 15 mm x 5 mm bolt head is sunk into an 18 mm x 3.5 mm
  pocket, which does three jobs at once - keeps the head out of the clamp''s way,
  moves the thread start 3.5 mm lower so the 10 mm-long bolt gives the camera ~7.5
  mm instead of ~4 mm of engagement, and puts 2.5 mm of solid PLA under the head.
  The pocket is 18 mm rather than 15.6 mm because I couldn''t confirm whether that
  head is round or hex (a 15 mm across-flats hex head has ~17.3 mm corners).


  Honest caveat: this is a temporary part and PLA creeps, so it is only trustworthy
  for a light mirrorless/compact camera, tightened snug, checked every couple of hours,
  and never for a heavy lens or a long exposure on a windy ridge. If the real plate
  shows up, retire this one.'
questions:
- text: What exactly is left on the tripod - a slide-in clamp channel with two jaws
    (a dovetail slot), or a screw/threaded post?
  answer: A clamp channel; the plate it takes is 38 mm wide.
- text: Can you see a thread size stamped on the camera, or does a known 1/4-20 screw
    fit it?
  answer: 'Camera socket thread: 1/4-20 (the usual camera thread)'
- text: Is the webcam bolt's head round or hex, and what driver fits it?
  answer: Head across ~15 mm, height ~5 mm, 10 mm of thread under the head. Round
    vs hex not confirmed - recess sized for either.
- text: How deep is the clamp channel, and how wide is the opening at the top of the
    jaws?
  answer: Could not measure; verified with the gauge_height / gauge_width coupons
    instead.
params:
  clamp_w:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: Across the widest part of the dovetail - Dan measured the tripod clamp as
      taking a 38 mm wide plate (Arca-Swiss size). The plate is built at exactly this
      width.
  dovetail_h:
    value: 6
    unit: mm
    kind: design
    source: design
    note: Assumed Arca-Swiss RSP envelope (38 x 6 mm). Not measurable on the clamp
      here - checked by the gauge_height coupon before use.
  dovetail_top_w:
    value: 30
    unit: mm
    kind: design
    source: design
    note: Top land of the dovetail, i.e. the flank angle the clamp jaws bear on. Assumed
      standard; the gauge bands reuse the same angle.
  plate_len:
    value: 56
    unit: mm
    kind: design
    source: design
    note: Long enough for both jaws to grip with room at either end, short enough
      to stay out of the locking knob. Also gives portrait/landscape indexing.
  bolt_thread_major_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4"-20 external major diameter (salvaged bolt / camera socket thread, both
      1/4-20).
  bolt_hole_d:
    value: 6.9
    unit: mm
    kind: design
    source: design
    note: 'Clearance hole: 6.35 + 0.55 for a printed hole, so the bolt slides rather
      than cuts threads.'
  bolt_head_af:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Salvaged webcam bolt head, 15 mm across. Round or hex not confirmed, hence
      the generous recess.
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Head height 5 mm; the 3.5 mm pocket leaves it 1.5 mm proud of the plate's
      top face.
  bolt_thread_len:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: Thread under the head. 2.5 mm of it crosses the plate below the pocket,
      so ~7.5 mm is left for the camera socket.
  head_recess_d:
    value: 18
    unit: mm
    kind: design
    source: design
    note: 'Pocket diameter: clears a 15 mm round head, and a 15 mm across-flats hex
      head (corners ~17.3 mm) with ~0.7 mm spare.'
  head_recess_depth:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: Depth from the top face. Sinks the head so it is only 1.5 mm proud, keeps
      2.5 mm of PLA under it, and moves the thread start down so the camera gets more
      engagement.
  gauge_band_w_step:
    value: 0.7
    unit: mm
    kind: design
    source: design
    note: Gauge bands at 37.3 / 38.0 / 38.7 mm, to bracket the clamp's real channel
      width.
  gauge_band_len:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Length of each dovetail test band - enough for the jaws to bite.
  gauge_gap:
    value: 2
    unit: mm
    kind: design
    source: design
    note: Spacing between gauge bands/tabs.
  gauge_web_w:
    value: 28
    unit: mm
    kind: design
    source: design
    note: 'Joining spine width: narrower than the smallest band''s top land (29.4
      mm) so it never stops a band entering the clamp.'
  gauge_web_t:
    value: 2
    unit: mm
    kind: design
    source: design
    note: Spine thickness, sunk 0.3 mm into the tabs/bands for a clean union.
  gauge_tab_w:
    value: 28
    unit: mm
    kind: design
    source: design
    note: Flat test-tab width, inside the channel's 38 mm floor.
  gauge_tab_len:
    value: 14
    unit: mm
    kind: design
    source: design
    note: Flat test-tab length.
  gauge_tab_t_step:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Tabs at 5 / 6 / 7 mm thick to find the usable channel height.
parts:
- id: qr_plate
  role: final
  material: PLA (black, high-speed)
  code: "def _trap(w, t, h, length):\n    # trapezoid prism: widest (w) at z=0, top\
    \ land (t) at z=h, running y=0..length\n    return (cq.Workplane(\"XY\")\n   \
    \         .moveTo(-w / 2.0, 0.0).lineTo(w / 2.0, 0.0)\n            .lineTo(t /\
    \ 2.0, h).lineTo(-t / 2.0, h).close()\n            .extrude(length)\n        \
    \    .rotate(cq.Vector(0, 0, 0), cq.Vector(1, 0, 0), 90)\n            .translate(cq.Vector(0,\
    \ length, 0)))\n\ndef build(p):\n    W = p.clamp_w            # across the widest\
    \ part of the dovetail\n    T = p.dovetail_top_w     # top land (narrowest, at\
    \ the camera side)\n    H = p.dovetail_h         # plate thickness = channel height\n\
    \    L = p.plate_len\n    plate = _trap(W, T, H, L).translate(cq.Vector(0.0, -L\
    \ / 2.0, 0.0))\n    # 1/4-20 clearance hole, printed as a vertical wall (no supports)\n\
    \    hole = (cq.Workplane(\"XY\").circle(p.bolt_hole_d / 2.0).extrude(H + 2.0)\n\
    \            .translate(cq.Vector(0.0, 0.0, -1.0)))\n    # pocket for the salvaged\
    \ bolt head, opens at the top face\n    floor = H - p.head_recess_depth\n    recess\
    \ = (cq.Workplane(\"XY\").circle(p.head_recess_d / 2.0).extrude(p.head_recess_depth\
    \ + 0.5)\n              .translate(cq.Vector(0.0, 0.0, floor)))\n    return plate.cut(hole).cut(recess)"
  print_orientation: 'Flat on the bed: the widest part of the dovetail (the 38 mm
    face that sits on the channel floor) is z=0, plate length along Y, bolt hole axis
    vertical. All flanks lean inward as they rise, so there are no supports and no
    long bridges (widest span ~30 mm at the head recess).'
  use_orientation: The printed z=0 face stays down on the clamp's channel floor; the
    camera sits on the plate's top face, bolt head up.
- id: gauge_width
  role: coupon
  material: PLA (black, high-speed)
  code: "def _trap(w, t, h, length):\n    return (cq.Workplane(\"XY\")\n         \
    \   .moveTo(-w / 2.0, 0.0).lineTo(w / 2.0, 0.0)\n            .lineTo(t / 2.0,\
    \ h).lineTo(-t / 2.0, h).close()\n            .extrude(length)\n            .rotate(cq.Vector(0,\
    \ 0, 0), cq.Vector(1, 0, 0), 90)\n            .translate(cq.Vector(0, length,\
    \ 0)))\n\ndef build(p):\n    H = p.dovetail_h\n    r = p.dovetail_top_w / p.clamp_w\
    \      # keep the same flank angle as the plate\n    out = None\n    y = 0.0\n\
    \    for w in [p.clamp_w - p.gauge_band_w_step, p.clamp_w, p.clamp_w + p.gauge_band_w_step]:\n\
    \        s = _trap(w, w * r, H, p.gauge_band_len).translate(cq.Vector(0.0, y,\
    \ 0.0))\n        out = s if out is None else out.union(s)\n        y += p.gauge_band_len\
    \ + p.gauge_gap\n    gL = y - p.gauge_gap\n    web = _trap(p.gauge_web_w, p.gauge_web_w,\
    \ p.gauge_web_t, gL).translate(cq.Vector(0.0, 0.0, H - 0.3))\n    return out.union(web)"
  print_orientation: 'Flat on the bed, same orientation as the plate: the three bands
    stand on their 38 mm-wide (widest) edge, joining web uppermost.'
  use_orientation: Not fitted to anything - slide each band into the tripod's clamp
    channel to see which width the jaws actually grip.
- id: gauge_height
  role: coupon
  material: PLA (black, high-speed)
  code: "def _trap(w, t, h, length):\n    return (cq.Workplane(\"XY\")\n         \
    \   .moveTo(-w / 2.0, 0.0).lineTo(w / 2.0, 0.0)\n            .lineTo(t / 2.0,\
    \ h).lineTo(-t / 2.0, h).close()\n            .extrude(length)\n            .rotate(cq.Vector(0,\
    \ 0, 0), cq.Vector(1, 0, 0), 90)\n            .translate(cq.Vector(0, length,\
    \ 0)))\n\ndef build(p):\n    out = None\n    y = 0.0\n    ts = [p.dovetail_h -\
    \ p.gauge_tab_t_step, p.dovetail_h, p.dovetail_h + p.gauge_tab_t_step]\n    for\
    \ t in ts:\n        s = _trap(p.gauge_tab_w, p.gauge_tab_w, t, p.gauge_tab_len).translate(cq.Vector(0.0,\
    \ y, 0.0))\n        out = s if out is None else out.union(s)\n        y += p.gauge_tab_len\
    \ + p.gauge_gap\n    gL = y - p.gauge_gap\n    web = _trap(p.gauge_web_w, p.gauge_web_w,\
    \ p.gauge_web_t, gL).translate(cq.Vector(0.0, 0.0, min(ts) - 0.3))\n    return\
    \ out.union(web)"
  print_orientation: 'Flat on the bed: tabs stand on their underside, thickest tab
    7 mm tall, joining web uppermost.'
  use_orientation: Not fitted to anything - drop each flat tab into the clamp channel
    to find the maximum plate thickness the jaws will close over.
hardware:
- id: webcam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_mount
  fastener: webcam_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 2.5
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: qr_plate
    feature: bolt_hole
    role: clearance
  - part: qr_plate
    feature: head_recess
    role: head_seat
  nut: null
  external: camera base 1/4"-20 tripod socket (female)
criteria:
- id: dovetail_width_fit
  part: qr_plate
  feature: dovetail_flanks
  relation: clears
  hardware: null
  clearance_mm: 0.0
  params:
  - clamp_w
  - dovetail_top_w
  - dovetail_h
  check:
    method: coupon
    ref: gauge_width
    description: 'Slide each band into the clamp: 38.0 should go in firmly with no
      side-to-side wobble and resist being pulled straight out. The plate is the same
      shape as that middle band, so this is the go/no-go test.'
- id: dovetail_height_fit
  part: qr_plate
  feature: dovetail_flanks
  relation: clears
  hardware: null
  clearance_mm: 0.0
  params:
  - dovetail_h
  - clamp_w
  check:
    method: coupon
    ref: gauge_height
    description: 'Drop the flat tabs in: the 6 mm tab must reach the channel floor
      and sit below the jaw tops. If only 5 mm fits, file the plate''s flanks down
      - PLA files easily - until the 5 mm-equivalent profile slides in.'
- id: thread_engagement
  part: qr_plate
  feature: bolt_hole
  relation: engages
  hardware: webcam_bolt
  clearance_mm: null
  params:
  - bolt_thread_len
  - head_recess_depth
  - dovetail_h
  - bolt_thread_major_d
  check:
    method: measure
    ref: null
    description: 'Count turns into the camera socket: at least 4 full turns (~5 mm,
      pitch 1.27 mm) must be engaged before you put a camera on it. The bolt has 10
      mm of thread, 2.5 mm of which is spent crossing the plate.'
- id: head_seats_in_recess
  part: qr_plate
  feature: head_recess
  relation: contains
  hardware: webcam_bolt
  clearance_mm: null
  params:
  - bolt_head_af
  - bolt_head_h
  - head_recess_d
  - head_recess_depth
  check:
    method: measure
    ref: null
    description: Bolt head must sit in the 18 x 3.5 mm pocket and stand no more than
      ~1.5 mm above the plate's top face; check that the proud head does not foul
      the clamp's locking knob or lid before the camera goes on.
- id: bolt_slides_in_plate
  part: qr_plate
  feature: bolt_hole
  relation: clears
  hardware: webcam_bolt
  clearance_mm: 0.27
  params:
  - bolt_hole_d
  - bolt_thread_major_d
  check:
    method: none
    ref: null
    description: The bolt should pass through the hole by hand (0.27 mm radial clearance).
      Never let the bolt cut its own thread in the PLA - the joint would then twist
      when tightening.
- id: plate_supports_camera
  part: qr_plate
  feature: top_land
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - dovetail_top_w
  - head_recess_d
  check:
    method: none
    ref: null
    description: The 30 mm top land carries the camera base all the way around the
      18 mm head pocket, and the plate's underside is flat on the clamp's channel
      floor - no point loading.
- id: plate_not_a_camera_sacrifice
  part: qr_plate
  feature: dovetail_flanks
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - clamp_w
  - dovetail_h
  check:
    method: none
    ref: null
    description: Before the camera goes on, pull-test the assembled plate in the clamp
      by hand, hard. Anything less than a solid bite means shim the jaws with a strip
      of tape, or stop.
manual:
- n: '1'
  text: Print all three parts flat on the bed, as they come off the slicer by default
    (widest face of each profile down). Use 4 perimeters, 100% infill, 0.2 mm layers,
    and slow the外 walls to ~40 mm/s - the dovetail flanks are the whole joint, and
    they are only 6 mm thick. Total print time is well under an hour for all three.
  parts:
  - qr_plate
  - gauge_width
  - gauge_height
  hardware: []
  tool: null
- n: '2'
  text: 'Do NOT put the camera on anything yet. Take gauge_height and drop its three
    flat tabs (5, 6, 7 mm thick) into the clamp channel one at a time. The thickest
    tab that reaches the floor and still lets the jaws close tells you the maximum
    plate thickness. Your plate is 6 mm: if 6 mm fits, continue; if only 5 mm fits,
    rub the plate''s flanks on a flat file or sandpaper on a block until the profile
    slides in like the 5 mm tab did.'
  parts:
  - gauge_height
  hardware: []
  tool: flat file or sandpaper
- n: '3'
  text: 'Take gauge_width and slide its three dovetail bands in, one at a time. Expected:
    the 37.3 mm band is loose, the 38.0 mm band (identical to the plate) is snug and
    resists being pulled straight up out of the jaws, the 38.7 mm band needs real
    push. If 38.0 is loose and lifts out, the plate is not safe: shim the clamp jaws
    with a single strip of masking tape or thin plastic down each side, or send me
    the width/height that gripped and I''ll re-cut the profile.'
  parts:
  - gauge_width
  hardware: []
  tool: null
- n: '4'
  text: Slide the qr_plate into the tripod clamp, the same way the original plate
    went in (usually in from the end of the channel, along the jaws). Rock it - there
    should be no play. Check the plate is sitting flat on the channel floor and both
    jaws grip its full length.
  parts:
  - qr_plate
  hardware: []
  tool: null
- n: '5'
  text: 'Put the salvaged webcam bolt (1/4"-20) through the plate''s hole from the
    top, so the head drops into the round pocket and the threads point up at the camera.
    Look at the head: it will stand about 1.5 mm above the plate. Confirm it does
    not foul the clamp''s locking knob or anything above the plate before going further.'
  parts:
  - qr_plate
  hardware:
  - webcam_bolt
  tool: null
- n: '6'
  text: Lower the camera onto the plate with the bolt lining up with its 1/4-20 socket,
    and screw the bolt in by hand. Count the turns. You need at least 4 full turns
    (~5 mm) of the bolt's 10 mm thread inside the camera - if it runs out sooner,
    stop and don't use it. The bolt should turn freely for the first few turns; if
    you feel the plate start to twist with the bolt, back off - the PLA is being cut
    rather than clamped.
  parts:
  - qr_plate
  hardware:
  - webcam_bolt
  tool: null
- n: '7'
  text: 'Tighten only to snug - finger tight, plus a small extra with a tool on the
    bolt head. Over-tightening is the main way this fails: PLA creeps under steady
    load, so the clamping force slowly relaxes and the head can pull a plug out of
    the top face.'
  parts:
  - qr_plate
  hardware:
  - webcam_bolt
  tool: spanner / hex key for the bolt head
- n: '8'
  text: 'Pull test with the camera''s strap around your wrist or neck and the camera
    held low, over a bed or sofa: lift the tripod by its legs, shake it gently, and
    try to lift the camera off the plate. Only then take it out. Keep the session
    short and out of the sun - a hot car interior is close to PLA''s softening point,
    and this is a temporary part until you find the real one.'
  parts:
  - qr_plate
  hardware:
  - webcam_bolt
  tool: null
- n: '9'
  text: 'Re-check after every couple of hours of use: tighten the bolt a quarter of
    a turn if the plate has loosened, and replace the plate as soon as the flanks
    look shiny, dented or bowed. The steel bolt is reusable and undamaged, so keep
    it - if you find the real plate, the bolt is a good spare.'
  parts:
  - qr_plate
  hardware:
  - webcam_bolt
  tool: null
