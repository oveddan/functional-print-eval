task: tripod-plate
note: 'What it is: a two-part substitute for the missing camera-to-tripod connector
  on a jaw-clamp tripod - a flat drop-in plate (qr_plate) plus a fastener that screws
  into the camera 1/4-20 socket (thumb_screw) - with the salvaged 1/4-20 webcam bolt
  (head 15.0 x 5.0 mm, 10 mm thread, as you measured) as the preferred fastener, because
  a steel thread in the camera metal insert is far safer than PLA. A coupon (jaw_gauge)
  is included because the one dimension that decides everything, the gap between the
  jaw lips, could not be measured.


  Handoff: I have no way to run CadQuery here, so I cannot confirm these builds execute
  or that the chamfers and the helical sweep come out as intended. Two things to eyeball
  in the first slice preview: (1) qr_plate depends on selecting the four long X-parallel
  edges of the box for the 45 deg jaw chamfers - if no edges match, the plate comes
  out as a plain 52 x 34 x 8 slab with square edges and will skate out of angled lips;
  (2) thumb_screw builds its male thread by sweeping a 0.84 mm circle along a 1.27
  mm pitch helix at radius 2.73 mm, unioned onto a 5.6 mm core, so the ridge stands
  0.35 mm off the core and is just over one full perimeter wide - if the sweep is
  rejected the code prints a flag and falls back to straight annular ridges, which
  will still bite but need forcing. Do not force those into the camera; use the steel
  bolt.


  The numbers that are guesses and what to do about them: plate_grip_t = 8.0 mm, guessed
  because the jaw gap could not be measured - the gauge coupon exists to replace it,
  and if the answer is 6 mm or less the code drops the head recess and the bolt head
  hangs about 5 mm below the plate, so check the jaws have that room; thr_wire_dia
  and thr_root_dia, tuned for hand-startable engagement with a 1/4-20 steel insert
  (crest held at 6.30, i.e. 0.05 under nominal) which the gauge 4-turn stub verifies
  before a full print; and the assumption that the camera is light. Everything derived
  from bought or measured hardware - 6.35 dia, 1.27 pitch, head 15.0, head 5.0, thread
  10 - is a named param, not baked into the geometry, so if the bolt turns out to
  be a different size, change bolt_head_dia and bolt_head_h and the pocket, the printed
  screw head and the driver slot all follow.'
questions: []
params:
  cam_thread_major_dia:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 UNC external major dia; camera socket confirmed 1/4-20 by you
  cam_thread_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 = 20 tpi
  cam_thread_min_engage:
    value: 5
    unit: mm
    kind: design
    source: design
    note: axial engagement I require in the camera socket, about 4 full turns
  bolt_head_dia:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam bolt head across - your measurement, about 15 mm
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: salvaged bolt head thickness - your measurement, about 5 mm
  bolt_thread_len:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: thread length under the head - your measurement, about 10 mm
  plate_len:
    value: 52
    unit: mm
    kind: design
    source: design
    note: along the jaws
  plate_width:
    value: 34
    unit: mm
    kind: design
    source: design
    note: across the pinch axis; wider than any small tripod jaw opening
  plate_grip_t:
    value: 8
    unit: mm
    kind: design
    source: guessed
    note: thickness the jaws pinch. Default 8.0 GUESSED - you could not measure the
      jaw gap. Set it to the thickest gauge step the jaws grip firmly, then re-slice
  grip_chamfer:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: 45 deg chamfer on both faces of the two pinched edges, to meet the angled
      jaw lips
  web_min:
    value: 1.6
    unit: mm
    kind: design
    source: design
    note: least PLA left over the buried fastener head before the head recess is dropped
  shank_clear_dia:
    value: 6.9
    unit: mm
    kind: design
    source: design
    note: 'through hole for the shank or printed thread: 6.35 + 0.55'
  pocket_radial_clear:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: ''
  pocket_axial_clear:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: ''
  screw_head_dia:
    value: 15
    unit: mm
    kind: design
    source: design
    note: printed screw head, matched to the bolt head so one recess fits both
  screw_head_t:
    value: 4.6
    unit: mm
    kind: design
    source: design
    note: kept under bolt_head_h + pocket_axial_clear so it seats in the same recess
  thr_crest_dia:
    value: 6.3
    unit: mm
    kind: design
    source: design
    note: printed external thread crest, 0.05 under the 6.35 nominal for clearance
      in the steel insert
  thr_root_dia:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: core dia of the printed shank
  thr_wire_dia:
    value: 0.84
    unit: mm
    kind: design
    source: design
    note: dia of the circle swept along the helix. Puts the ridge on the insert minor
      dia of about 5.35 at just over one full 0.4 mm perimeter; raise 0.1 at a time
      if the ridge prints as a single hairline
  thr_len:
    value: 11
    unit: mm
    kind: design
    source: design
    note: gives about 8 mm proud of the camera-side face when the head rests on the
      recess floor
  thr_lead_in:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: conical start; also the first-layer footprint when printing on the tip
  thread_side_clear:
    value: 0.35
    unit: mm
    kind: design
    source: design
    note: ''
  thread_top_clear:
    value: 0.25
    unit: mm
    kind: design
    source: design
    note: ''
  thread_root_margin:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: ''
  slot_len:
    value: 15
    unit: mm
    kind: design
    source: design
    note: driver slot across the printed head; must stay inside the recess mouth
  slot_w:
    value: 2
    unit: mm
    kind: design
    source: design
    note: ''
  slot_depth:
    value: 3
    unit: mm
    kind: design
    source: design
    note: ''
  gauge_len:
    value: 44
    unit: mm
    kind: design
    source: design
    note: ''
  gauge_width:
    value: 26
    unit: mm
    kind: design
    source: design
    note: narrower than the plate so it slides inboard of the head recess
  gauge_step_len:
    value: 6
    unit: mm
    kind: design
    source: design
    note: ''
  gauge_n_steps:
    value: 5
    unit: count
    kind: design
    source: design
    note: ''
  gauge_t_min:
    value: 4
    unit: mm
    kind: design
    source: design
    note: ''
  gauge_t_max:
    value: 8
    unit: mm
    kind: design
    source: design
    note: keep equal to plate_grip_t once known
  gauge_stub_turns:
    value: 4
    unit: count
    kind: design
    source: design
    note: 'test thread on the coupon: same diameters and pitch as the printed screw,
      to see if a PLA thread starts in your camera'
parts:
- id: qr_plate
  role: final
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    L = p.plate_len\n    W = p.plate_width\n    T = p.plate_grip_t\n\
    \    ch = p.grip_chamfer\n    hole_r = p.shank_clear_dia / 2.0\n    pocket_r =\
    \ (p.bolt_head_dia + 2.0 * p.pocket_radial_clear) / 2.0\n    pocket_t = p.bolt_head_h\
    \ + p.pocket_axial_clear\n    flags = []\n    if ch > min(p.web_min, W / 2.0):\n\
    \        flags.append('grip_chamfer_too_big_for_grip_thickness')\n    if p.shank_clear_dia\
    \ < p.cam_thread_major_dia + 0.2:\n        flags.append('shank_clear_hole_would_cut_thread_crests')\n\
    \    if p.bolt_head_dia > W:\n        flags.append('bolt_head_wider_than_the_plate')\n\
    \    pocket_ok = (T - pocket_t) >= p.web_min\n    if not pocket_ok:\n        flags.append('head_recess_dropped_fastener_head_will_hang_below_the_plate')\n\
    \    elif hole_r > pocket_r:\n        flags.append('shank_hole_larger_than_head_recess')\n\
    \    body = cq.Workplane('XY').box(L, W, T, centered=(True, True, False))\n  \
    \  body = body.edges(cq.selectors.DirectionSelector((1, 0, 0))).chamfer(ch)\n\
    \    solid = body.cut(cq.Workplane('XY', origin=(0, 0, -1.0)).circle(hole_r).extrude(T\
    \ + 2.0))\n    if pocket_ok:\n        solid = solid.cut(cq.Workplane('XY', origin=(0,\
    \ 0, T - pocket_t)).circle(pocket_r).extrude(pocket_t + 1.0))\n    for f in flags:\n\
    \        print('NEEDS-EYEBALL: ' + f + ' - confirm against the jaw_gauge coupon\
    \ before printing')\n    return solid"
  print_orientation: 'Flat, camera-side face down on the bed: z=0 is the face the
    camera base rests on. The 6.9 mm shank hole and the fastener head recess both
    open upward, so no bridging and no supports; the only non-vertical faces are the
    45 deg jaw chamfers. Length 52 along X, width 34 along Y (the pinch axis), thickness
    8 up Z.'
  use_orientation: The bed face (z=0 side) points UP to the camera base; the head-recess
    side (z=plate_grip_t) points DOWN into the jaws, i.e. the plate is used rotated
    180 deg about X from how it prints. The fastener head sits in that recess and
    its shank stands up out of the camera-side face into the camera socket.
- id: thumb_screw
  role: final
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    pitch = p.cam_thread_pitch\n    c = p.thr_crest_dia /\
    \ 2.0\n    r = p.thr_root_dia / 2.0\n    r_w = p.thr_wire_dia / 2.0\n    tl =\
    \ p.thr_len\n    lead = p.thr_lead_in\n    head_t = p.screw_head_t\n    head_r\
    \ = p.screw_head_dia / 2.0\n    pocket_t = p.bolt_head_h + p.pocket_axial_clear\n\
    \    pocket_ok = (p.plate_grip_t - pocket_t) >= p.web_min\n    map_z = (p.plate_grip_t\
    \ - pocket_t) if pocket_ok else p.plate_grip_t\n    flags = []\n    if tl - map_z\
    \ < p.cam_thread_min_engage:\n        flags.append('thread_too_short_for_this_plate_thickness_use_the_salvaged_bolt')\n\
    \    if not pocket_ok:\n        flags.append('plate_has_no_head_recess_this_screw_will_not_sit_flush')\n\
    \    if p.screw_head_t > pocket_t + 0.05:\n        flags.append('screw_head_thicker_than_the_recess')\n\
    \    if p.screw_head_dia > p.bolt_head_dia + 2.0 * p.pocket_radial_clear - 0.4:\n\
    \        flags.append('screw_head_needs_the_recess_widened')\n    if p.slot_len\
    \ > p.bolt_head_dia + 2.0 * p.pocket_radial_clear - 1.0:\n        flags.append('driver_slot_needs_the_recess_widened_or_shortened')\n\
    \    core = cq.Workplane('XY', origin=(0, 0, lead)).circle(r).extrude(tl - lead)\n\
    \    solid = core.union(cq.Workplane('XY').cone(1.0, r, lead))\n    helix_h =\
    \ tl - lead - p.thread_top_clear\n    try:\n        import math\n        r_h =\
    \ c - r_w\n        w = math.sqrt(r_h * r_h + (pitch / (2.0 * math.pi)) ** 2)\n\
    \        n = max(int((helix_h / pitch) * 28.0), 2)\n        wires = []\n     \
    \   for i in range(n + 1):\n            t = 2.0 * math.pi * i / float(n)\n   \
    \         px = r_h * math.cos(t)\n            py = r_h * math.sin(t)\n       \
    \     pz = lead + (pitch / (2.0 * math.pi)) * t\n            tx = -r_h * math.sin(t)\
    \ / w\n            ty = r_h * math.cos(t) / w\n            tz = (pitch / (2.0\
    \ * math.pi)) / w\n            wires.append(cq.Wire.makeCircle(r_w, cq.Vector(px,\
    \ py, pz), cq.Vector(tx, ty, tz)))\n        helix = cq.Wire.makeHelix(pitch, helix_h,\
    \ r_h)\n        band = helix.makePipeShell(wires[1:], makeSolid=True, isFrenet=True)\n\
    \        solid = solid.union(wires[0]).union(band)\n    except Exception:\n  \
    \      n_r = max(int(round(helix_h / pitch)), 2)\n        step = helix_h / float(n_r)\n\
    \        for i in range(n_r):\n            z0 = lead + i * step\n            ring\
    \ = cq.Workplane('XY', origin=(0, 0, z0 - 0.001)).circle(c + p.thread_root_margin).extrude(step\
    \ * 0.52 + 0.002)\n            up = cq.Workplane('XY', origin=(0, 0, z0 + step\
    \ * 0.52)).circle(r - p.thread_root_margin).extrude(step * 0.48)\n           \
    \ solid = solid.union(ring).union(up)\n        flags.append('helical_thread_fell_back_to_straight_ridges_it_will_need_forcing')\n\
    \    solid = solid.union(cq.Workplane('XY', origin=(0, 0, tl)).circle(head_r).extrude(head_t))\n\
    \    solid = solid.cut(cq.Workplane('XY', origin=(-p.slot_len / 2.0, -p.slot_w\
    \ / 2.0, tl + head_t - p.slot_depth)).box(p.slot_len, p.slot_w, p.slot_depth +\
    \ 0.6))\n    solid = solid.translate(cq.Vector(0, 0, map_z - tl))\n    for f in\
    \ flags:\n        print('NEEDS-EYEBALL: ' + f + ' - confirm against the jaw_gauge\
    \ coupon before printing')\n    return solid"
  print_orientation: 'Stands on its thread tip, axis vertical: tip at z=0, head at
    the top, so the thread prints with its crest ridges pointing up and the driver
    slot opens upward and needs no bridge. The tip chamfer gives a about 2 mm first-layer
    circle. No supports.'
  use_orientation: 'Installed the other way round from how it prints: in the plate
    frame the head drops into the recess on the clamp side of the plate and the thread
    points up through the 6.9 mm hole into the camera, so the head driver face ends
    up about 1 mm below the plate underside, reachable through the 15.8 mm recess
    mouth with a small driver at a slight angle.'
- id: jaw_gauge
  role: coupon
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    c = p.thr_crest_dia / 2.0\n    r = p.thr_root_dia / 2.0\n\
    \    r_w = p.thr_wire_dia / 2.0\n    pitch = p.cam_thread_pitch\n    ch = p.grip_chamfer\n\
    \    n_st = int(p.gauge_n_steps)\n    step_len = p.gauge_step_len\n    W = p.gauge_width\n\
    \    L = n_st * step_len\n    t_min = p.gauge_t_min\n    t_max = p.gauge_t_max\n\
    \    flags = []\n    if L > p.gauge_len:\n        flags.append('gauge_steps_overrun_gauge_length')\n\
    \    if ch > min(t_min, W / 2.0):\n        flags.append('gauge_chamfer_too_big_for_thinnest_step')\n\
    \    if p.bolt_head_dia > W:\n        flags.append('gauge_narrower_than_the_fastener_head')\n\
    \    solid = None\n    for i in range(n_st):\n        t_i = t_min + (t_max - t_min)\
    \ * i / float(max(n_st - 1, 1))\n        blk = cq.Workplane('XY', origin=((i -\
    \ (n_st - 1) / 2.0) * step_len, 0, 0)).box(step_len, W, t_i, centered=(True, True,\
    \ False))\n        blk = blk.edges(cq.selectors.DirectionSelector((1, 0, 0))).chamfer(ch)\n\
    \        solid = blk if solid is None else solid.union(blk)\n    t_hi = t_max\n\
    \    x0 = -(n_st - 1) / 2.0 * step_len\n    stub_h = p.gauge_stub_turns * pitch\n\
    \    try:\n        import math\n        r_h = c - r_w\n        w = math.sqrt(r_h\
    \ * r_h + (pitch / (2.0 * math.pi)) ** 2)\n        n = max(int(p.gauge_stub_turns\
    \ * 28), 2)\n        wires = []\n        for i in range(n + 1):\n            t\
    \ = 2.0 * math.pi * i / float(n)\n            px = x0 + r_h * math.cos(t)\n  \
    \          py = r_h * math.sin(t)\n            pz = t_hi + (pitch / (2.0 * math.pi))\
    \ * t\n            tx = -r_h * math.sin(t) / w\n            ty = r_h * math.cos(t)\
    \ / w\n            tz = (pitch / (2.0 * math.pi)) / w\n            wires.append(cq.Wire.makeCircle(r_w,\
    \ cq.Vector(px, py, pz), cq.Vector(tx, ty, tz)))\n        helix = cq.Wire.makeHelix(pitch,\
    \ stub_h, r_h)\n        band = helix.translate(cq.Vector(x0, 0, t_hi)).makePipeShell(wires[1:],\
    \ makeSolid=True, isFrenet=True)\n        solid = solid.union(cq.Workplane('XY',\
    \ origin=(x0, 0, t_hi)).circle(c - p.thread_side_clear).extrude(stub_h))\n   \
    \     solid = solid.union(wires[0]).union(band)\n    except Exception:\n     \
    \   solid = solid.union(cq.Workplane('XY', origin=(x0, 0, t_hi)).circle(c - p.thread_side_clear\
    \ - p.thread_root_margin).extrude(stub_h))\n        flags.append('stub_thread_fell_back_to_a_plain_plug_diameter_check_only')\n\
    \    for f in flags:\n        print('NEEDS-EYEBALL: ' + f + ' - adjust the gauge\
    \ or plate params and re-slice')\n    return solid"
  print_orientation: Flat, all steps sharing one bottom plane on the bed (z=0). Five
    blocks from 4 mm to 8 mm thick, each 6 mm long along X, with 45 deg jaw chamfers
    top and bottom on the long edges; a 4-turn test thread stands upright on the tallest
    step. No supports, no bridging.
  use_orientation: Not a load-bearing part. It goes into the tripod jaws exactly the
    way the plate does - chamfered long edges against the angled lips, steps along
    the jaw axis - and its upright thread stub is pressed into the camera socket to
    test a printed PLA thread.
hardware:
- id: webcam-mount-bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
- id: iso4762-m5x12
  ref: ISO 4762 M5x12
  qty: 2
joints:
- id: camera_fastener
  fastener: webcam-mount-bolt
  axis_origin:
  - 0.0
  - 0.0
  - 2.7
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: qr_plate
    feature: head_pocket
    role: head_seat
  - part: qr_plate
    feature: shank_hole
    role: clearance
  - part: thumb_screw
    feature: head_seat
    role: head_seat
  nut: null
  external: camera base 1/4-20 female tripod socket
- id: plate_in_jaws
  fastener: iso4762-m5x12
  axis_origin:
  - 0.0
  - 0.0
  - 8.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: qr_plate
    feature: grip_chamfer
    role: clearance
  - part: jaw_gauge
    feature: gauge_steps
    role: clearance
  nut: null
  external: null
criteria:
- id: grip_thickness_fits_jaws
  part: jaw_gauge
  feature: gauge_steps
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - plate_grip_t
  - grip_chamfer
  - gauge_t_min
  - gauge_t_max
  - gauge_n_steps
  check:
    method: coupon
    ref: jaw_gauge
    description: 'The unknown that governs everything: the gap between the jaw lips.
      Push each of the five steps (4, 5, 6, 7, 8 mm) into the jaws and tighten the
      knob. The thickest step that goes in without forcing, and that you cannot pull
      out with a firm tug, is plate_grip_t. Set plate_grip_t in that range, re-slice
      qr_plate, then print it.'
- id: grip_faces_wedged_not_skated
  part: qr_plate
  feature: grip_chamfer
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - grip_chamfer
  - plate_grip_t
  - plate_width
  - web_min
  check:
    method: none
    ref: null
    description: Both long edges are chamfered 45 deg on both faces (2.5 mm), so the
      angled jaw lips bear on a matching taper and pull the plate down instead of
      skating off a square edge. If your lips turn out flat and parallel, keep the
      chamfer anyway - contact moves to the mid-thickness band, still fine.
- id: camera_face_bears_on_camera
  part: qr_plate
  feature: camera_face
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - plate_len
  - plate_width
  - plate_grip_t
  - shank_clear_dia
  check:
    method: none
    ref: null
    description: The 52 x 34 face at z=0, the bed face so the flattest one, is what
      the camera base sits on. Nothing stands proud of it - only the thread passes
      through.
- id: shank_hole_clears_fastener
  part: qr_plate
  feature: shank_hole
  relation: clears
  hardware: webcam-mount-bolt
  clearance_mm: 0.275
  params:
  - shank_clear_dia
  - cam_thread_major_dia
  check:
    method: measure
    ref: null
    description: 'Drop the bolt through from the recess side: it must pass freely
      (6.9 mm hole against a 6.35 mm thread crest = 0.275 mm radius clearance). Do
      not close this clearance down to the thread crest or less, or the printed screw
      crests shear off during assembly.'
- id: head_pocket_seats_fastener
  part: qr_plate
  feature: head_pocket
  relation: seats
  hardware: webcam-mount-bolt
  clearance_mm: 0.4
  params:
  - bolt_head_dia
  - bolt_head_h
  - pocket_radial_clear
  - pocket_axial_clear
  - screw_head_dia
  - screw_head_t
  check:
    method: measure
    ref: null
    description: The 15.8 x 5.3 mm recess on the clamp side is sized to the head you
      measured (15.0 x 5.0). The head must sink fully below the plate underside so
      the plate sits normally in the jaws - if it is proud, the jaws will not close.
      Same for the printed screw head at 15.0 x 4.6.
- id: pocket_floor_has_a_web
  part: qr_plate
  feature: pocket_floor
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - plate_grip_t
  - pocket_axial_clear
  - bolt_head_h
  - web_min
  check:
    method: measure
    ref: null
    description: At least 1.6 mm of PLA left over the buried head (8.0 - 5.3 = 2.7
      mm with defaults). If the gauge says the jaws only grip 6 mm or less, the code
      prints a plain plate with no recess and the bolt head hangs about 5 mm below
      the plate - only acceptable if the jaws have that much room.
- id: thread_engages_camera_socket
  part: thumb_screw
  feature: printed_thread
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - thr_crest_dia
  - thr_root_dia
  - thr_wire_dia
  - cam_thread_pitch
  - cam_thread_major_dia
  - thread_side_clear
  check:
    method: coupon
    ref: jaw_gauge
    description: Before printing the full screw, press the gauge 4-turn stub into
      the camera socket and turn by hand. Same crest, root and pitch as the screw.
      It must start on its own and go in at least 4 mm with no creaking and no force.
      If it binds, skip thumb_screw and use the salvaged steel bolt.
- id: thread_engagement_length
  part: thumb_screw
  feature: printed_thread
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - thr_len
  - cam_thread_min_engage
  - bolt_thread_len
  - plate_grip_t
  - pocket_axial_clear
  check:
    method: measure
    ref: null
    description: 'With the head seated on the pocket floor, at least 5 mm (about 4
      turns) of thread must stand proud of the plate camera-side face. Defaults: printed
      screw 11 - 2.7 = 8.3 mm, bolt 10 - 2.7 = 7.3 mm. A thinner plate eats into both.'
- id: driver_access_to_screw_head
  part: thumb_screw
  feature: driver_slot
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - slot_len
  - slot_w
  - slot_depth
  - bolt_head_dia
  - pocket_radial_clear
  check:
    method: none
    ref: null
    description: The 15 x 2 x 3 mm slot stays inside the 15.8 mm recess mouth, so
      a small screwdriver or hex key reaches it at a slight angle. Tighten while holding
