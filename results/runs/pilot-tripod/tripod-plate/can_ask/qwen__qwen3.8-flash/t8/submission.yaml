task: tripod-plate
note: 'Three printed parts, one of them a throwaway coupon, plus the salvaged webcam
  bolt and two M3 caps.


  What I inferred: the clamp grips a 38 mm wide plate, so I modelled the flat part
  as a plain 45 degree dovetail bar (38 mm at the bottom, tapering over the full 12
  mm height). That is the shape a "38 mm plate" clamp expects, but it is the one thing
  I could not verify, which is why the coupon comes first and the plate is modelled
  in its orientation with parametric width, height and chamfer.


  On "the part that screws in": I would not print that thread. Your bolt is 1/4-20,
  exactly the camera thread, with a 15 mm head that is perfect for trapping, and a
  printed 1.27 mm pitch thread in a steel socket would be both the weak point and
  the thing that damages the camera''s insert. So the metal bolt is the screw, and
  the two printed parts do the job the missing piece actually did: the plate carries
  the camera''s weight and the small cover plate closes the chamber over the head,
  making the bolt captive so it can be screwed into the camera and unscrewed again
  without the plate falling off. The cover is what "screws in" - with two M3x10 caps
  into self-tapped pilots, both from your hardware list.


  The load path is all compression into 3 mm of PLA above the bolt head plus the bolt''s
  own steel thread into the camera, which is fine for a body and normal lens. Nothing
  here is a printed thread in load.'
questions: []
params:
  clamp_plate_w:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: Width of plate the tripod clamp takes, as measured on the tripod.
  plate_len:
    value: 44
    unit: mm
    kind: design
    source: design
    note: Typical length for a 38 mm wide sliding plate; long enough to grip, short
      enough to drop into the clamp.
  plate_t:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Set by the stack needed to capture a 5 mm high bolt head with 3 mm of plate
      above it.
  dovetail_chamfer:
    value: 12
    unit: mm
    kind: design
    source: design
    note: 45 deg cut on both bottom edges over the full 12 mm height, so the top face
      ends up 12 mm wide. Clamped by the tapered sides, the way a 38 mm plate normally
      is.
  bolt_head_d:
    value: 15
    unit: mm
    kind: world
    source: measured
    note: Head across of the salvaged webcam 1/4-20 bolt.
  bolt_head_h:
    value: 5
    unit: mm
    kind: world
    source: measured
    note: Head height of the salvaged bolt.
  bolt_thread_len:
    value: 10
    unit: mm
    kind: world
    source: measured
    note: Length of 1/4-20 thread under the head of the salvaged bolt.
  thread_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 pitch.
  thread_major_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 external major diameter.
  camera_socket_min_depth:
    value: 6.35
    unit: mm
    kind: world
    source: datasheet
    note: ISO 1222 minimum depth of a camera's 1/4-20 socket; the coupon checks it
      on this camera.
  bolt_hole_d:
    value: 7.2
    unit: mm
    kind: design
    source: design
    note: Clearance for the 6.35 mm thread through the plate (0.85 mm total diametral
      clearance).
  cover_hole_d:
    value: 7.4
    unit: mm
    kind: design
    source: design
    note: Same clearance for the cover, so the cover can be slipped down onto the
      thread.
  head_chamber_d:
    value: 15.7
    unit: mm
    kind: design
    source: design
    note: Bolt head dia + 0.7 mm, so the head drops into the chamber and still turns.
  head_chamber_depth:
    value: 5
    unit: mm
    kind: design
    source: design
    note: Head height. With the head pulled up against the chamber roof the thread
      stands 5.9 mm proud of the plate top face.
  recess_depth:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: Cover thickness + 0.1 mm, so the cover and screw heads sit at the dovetail
      bottom face.
  recess_w:
    value: 24
    unit: mm
    kind: design
    source: design
    note: Across the 38 mm width; 0.6 mm gap per side to the cover.
  recess_l:
    value: 34
    unit: mm
    kind: design
    source: design
    note: Along the 44 mm length.
  cover_w:
    value: 22.8
    unit: mm
    kind: design
    source: design
    note: ''
  cover_l:
    value: 32.8
    unit: mm
    kind: design
    source: design
    note: ''
  cover_t:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: ''
  tap_hole_y:
    value: 12
    unit: mm
    kind: design
    source: design
    note: 'Screw positions, symmetric about the bolt axis: 2.7 mm of wall from the
      head chamber.'
  tap_hole_d:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: M3 self-tap pilot in printed PLA.
  tap_hole_depth:
    value: 8
    unit: mm
    kind: design
    source: design
    note: About 5 mm of thread for an M3x10 once the shank is through the cover.
  m3_clear_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: Clearance for M3 (3.0 mm) in the cover.
  m3_cbore_d:
    value: 6.2
    unit: mm
    kind: design
    source: design
    note: ISO 4762 M3 head dia 5.5 + 0.7.
  m3_cbore_depth:
    value: 3.1
    unit: mm
    kind: design
    source: design
    note: ISO 4762 M3 head height 3.0 + 0.1, leaving 0.35 mm for the clearance hole
