criteria:
- id: dovetail_in_clamp
  part: plate
  feature: dovetail_sides
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - clamp_plate_w
  - plate_t
  - dovetail_chamfer
  check:
    method: coupon
    ref: fit_coupon
    description: Slide the printed coupon into the clamp first. It should tighten
      on the 45 deg sides with no rock and no need to force it. If it binds or slips,
      adjust clamp_plate_w / plate_t before printing the plate.
- id: head_captured
  part: plate
  feature: head_chamber
  relation: contains
  hardware: cam_bolt
  clearance_mm: 0.7
  params:
  - bolt_head_d
  - bolt_head_h
  - head_chamber_d
  - head_chamber_depth
  - recess_depth
  - cover_t
  check:
    method: coupon
    ref: fit_coupon
    description: The 15 mm head must drop into the 15.7 mm chamber and the cover must
      press on it so the bolt cannot be pulled out. Check the head clears the chamber
      floor by at least 0.3 mm.
- id: thread_proud_of_plate
  part: plate
  feature: top_face
  relation: faces
  hardware: cam_bolt
  clearance_mm: null
  params:
  - bolt_thread_len
  - camera_socket_min_depth
  - plate_t
  - head_chamber_depth
  check:
    method: coupon
    ref: fit_coupon
    description: Stand the coupon on the camera base with the bolt through it and
      read how far the thread stands proud. It should reach about 6 mm into the socket
      without the camera base lifting off the plate before the bolt is tight.
- id: shank_clears_plate
  part: plate
  feature: bolt_hole
  relation: clears
  hardware: cam_bolt
  clearance_mm: 0.85
  params:
  - thread_major_d
  - bolt_hole_d
  - cover_hole_d
  - coupon_bolt_hole_d
  check:
    method: coupon
    ref: fit_coupon
    description: The bolt must pass through the plate hole and the cover hole by hand,
      without threading. The coupon hole is 0.3 mm larger on purpose - if it is a
      better fit, open the plate and cover holes to match.
- id: screw_heads_flush
  part: plate
  feature: cover_recess
  relation: supports
  hardware: cover_screw
  clearance_mm: null
  params:
  - m3_head_h
  - m3_cbore_depth
  - cover_t
  - recess_depth
  check:
    method: measure
    ref: null
    description: With the cover screwed on, the M3 heads must sit no lower than the
      dovetail bottom face - anything proud will stop the plate seating in the clamp.
      Run a fingertip over the joined faces.
- id: cover_sits_flat
  part: cover
  feature: outer_face
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - recess_w
  - recess_l
  - cover_w
  - cover_l
  check:
    method: measure
    ref: null
    description: The cover should sit down flat in the recess with no gap you can
      feel with a fingernail. If it rocks, the recess is smaller than the cover and
      needs a few passes with a file.
- id: engages_camera_socket
  part: plate
  feature: bolt_hole
  relation: engages
  hardware: cam_bolt
  clearance_mm: null
  params:
  - bolt_thread_len
  - camera_socket_min_depth
  - thread_pitch
  check:
    method: measure
    ref: null
    description: At least five full turns of the steel bolt must be threaded into
      the camera's metal socket. Count turns as you tighten by hand.
manual:
- n: '1'
  text: Print fit_coupon first (38 x 20 mm, 12 mm tall, dovetail face down on the
    bed). It is the cheap rehearsal for everything that follows, since I could not
    measure your clamp from here.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Slide the coupon into the tripod clamp and tighten it. It should be gripped
    on the two angled sides, square, with no rock and no forcing. If it will not go
    in, or it rattles, stop and tell me - that is the dovetail, not the rest of the
    design.
  parts:
  - fit_coupon
  hardware: []
  tool: your fingers
- n: '3'
  text: Put the salvaged webcam bolt through the coupon's 7.5 mm hole, head on the
    shallow recess side, and stand the coupon on the camera base with the bolt going
    into the camera's socket. Tighten it by hand and see whether the coupon sits flat
    on the camera. If it sits flat with 5-6 mm of the bolt buried, the geometry is
    right. If the bolt bottoms out before the coupon touches, the bolt's thread is
    longer than your socket - tell me, and I will make the plate thicker to shorten
    the protrusion.
  parts:
  - fit_coupon
  hardware:
  - cam_bolt
  tool: null
- n: '4'
  text: 'Print plate and cover, both flat as described. Plate: 38 x 44 x 12 mm, dovetail
    face down. Cover: 22.8 x 32.8 x 3.4 mm, the side that will press on the bolt head
    down on the bed. No supports needed for either. About 25 g of PLA between them.'
  parts:
  - plate
  - cover
  hardware: []
  tool: null
- n: '5'
  text: Hold the plate with its recessed face up. Drop the salvaged 1/4-20 bolt in
    from that side, head into the round chamber, so the thread stands up through the
    7.2 mm hole and about 6 mm proud of the flat top face. The head should still spin
    freely in its chamber.
  parts:
  - plate
  hardware:
  - cam_bolt
  tool: null
- n: '6'
  text: Slip the cover down over the bolt's thread, bed face (the flat side, not the
    counterbored side) onto the recess floor, so it lies over the bolt head and traps
    it. The screw holes are 12 mm either side of the bolt.
  parts:
  - cover
  hardware:
  - cam_bolt
  tool: null
- n: '7'
  text: Fit the two M3x10 socket head caps through the cover and screw them into the
    2.5 mm pilots - start them by hand for the first couple of turns so they cut straight,
    then tighten with a 2.5 mm hex key. Snug is enough; these only hold the cover
    on, the bolt head loads the 3 mm of plate above its chamber. The heads must finish
    no lower than the surrounding dovetail face.
  parts:
  - plate
  - cover
  hardware:
  - cover_screw
  tool: 2.5 mm hex key
- n: '8'
  text: 'Screw the plate onto the camera: hold the plate against the camera base and
    turn the bolt, or turn the plate if the bolt head is unthreaded. The camera''s
    base should sit squarely on the plate''s 12 mm flat top face with the bolt wound
    in five turns or more. Do not force it - if it stops before the faces meet, the
    bolt is longer than the socket, so take it off and tell me.'
  parts:
  - plate
  hardware:
  - cam_bolt
  tool: null
- n: '9'
  text: 'Slide the assembly into the tripod clamp and tighten. Check the camera holds
    square and does not twist when you nudge the lens. PLA creeps and softens, so
    this is a temporary bridge: keep it to a modest body and lens, keep it out of
    a hot car, and re-check the two M3 screws and the bolt before each session until
    the real part turns up.'
  parts:
  - plate
  - cover
  hardware:
  - cam_bolt
  - cover_screw
  tool: null
