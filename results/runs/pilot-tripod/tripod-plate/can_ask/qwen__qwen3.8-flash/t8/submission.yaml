    value: 16
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_recess_depth:
    value: 2
    unit: mm
    kind: design
    source: design
    note: Keeps the coupon's top face flat so it can be stood on the camera to read
      how high the thread stands.
parts:
- id: plate
  role: final
  material: PLA
  code: "def build(p):\n    L = p.plate_len\n    W = p.clamp_plate_w\n    H = p.plate_t\n\
    \    ch = min(H, p.dovetail_chamfer)\n    top_half = W / 2.0 - ch\n\n    # Dovetail\
    \ seen from the end: 38 mm across the bottom, 45 deg sides.\n    solid = (cq.Workplane(\"\
    XZ\")\n             .polyline([(-W / 2.0, 0.0), (W / 2.0, 0.0), (top_half, H),\
    \ (-top_half, H)])\n             .close()\n             .extrude(L))\n    solid\
    \ = solid.translate(cq.Vector(0.0, -L / 2.0, 0.0))\n\n    # Bolt axis at the centre:\
    \ clearance bore up top, head chamber and cover recess below.\n    solid = solid.cut(cq.Workplane(\"\
    XY\")\n                      .circle(p.bolt_hole_d / 2.0)\n                  \
    \    .extrude(H + 2.0)\n                      .translate(cq.Vector(0, 0, p.head_chamber_depth\
    \ + p.recess_depth - 1.0)))\n\n    solid = solid.cut(cq.Workplane(\"XY\")\n  \
    \                    .circle(p.head_chamber_d / 2.0)\n                      .extrude(p.head_chamber_depth\
    \ + 1.0)\n                      .translate(cq.Vector(0, 0, p.recess_depth - 1.0)))\n\
    \n    solid = solid.cut(cq.Workplane(\"XY\")\n                      .box(p.recess_w,\
    \ p.recess_l, p.recess_depth + 1.0, centered=(True, True, False))\n          \
    \            .translate(cq.Vector(0, 0, -1.0)))\n\n    # Two M3 pilots in the\
    \ recess floor, clear of the head chamber, for the cover.\n    for s in (1, -1):\n\
    \        solid = solid.cut(cq.Workplane(\"XY\")\n                          .circle(p.tap_hole_d\
    \ / 2.0)\n                          .extrude(p.tap_hole_depth)\n             \
    \             .translate(cq.Vector(0, s * p.tap_hole_y, p.recess_depth)))\n  \
    \  return solid"
  print_orientation: Dovetail bottom face (z=0) flat on the bed, 44 mm long side along
    Y, screw axis vertical. The 38x44 mm footprint fits easily; the 45 degree sides
    print self-supporting and the head chamber and recess open onto the bed, so no
    supports.
  use_orientation: In use the 38 mm wide bottom face sits in the tripod clamp and
    the 12 mm flat top face bears on the camera base; the screw axis points up into
    the camera.
- id: cover
  role: final
  material: PLA
  code: "def build(p):\n    t = p.cover_t\n    solid = cq.Workplane(\"XY\").box(p.cover_w,\
    \ p.cover_l, t, centered=(True, True, False))\n\n    # Centred hole the 1/4-20\
    \ bolt shank passes through.\n    solid = solid.cut(cq.Workplane(\"XY\").circle(p.cover_hole_d\
    \ / 2.0).extrude(t + 2.0))\n\n    for s in (1, -1):\n        # M3 clearance through\
    \ the whole cover.\n        solid = solid.cut(cq.Workplane(\"XY\")\n         \
    \                 .circle(p.m3_clear_d / 2.0)\n                          .extrude(t\
    \ + 2.0)\n                          .translate(cq.Vector(0, s * p.tap_hole_y,\
    \ -1.0)))\n        # Counterbore for the M3 socket-head cap, opening on the outer\
    \ face.\n        solid = solid.cut(cq.Workplane(\"XY\")\n                    \
    \      .circle(p.m3_cbore_d / 2.0)\n                          .extrude(p.m3_cbore_depth\
    \ + 0.6)\n                          .translate(cq.Vector(0, s * p.tap_hole_y,\
    \ t - p.m3_cbore_depth)))\n    return solid"
  print_orientation: Flat, bed face = the side that presses on the bolt head (z=0).
    The counterbores open upwards, so they print as shallow clean recesses with no
    supports.
  use_orientation: Bed face up, pressed into the recess in the plate's underside;
    its outer face ends up almost flush with the dovetail bottom face.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    W = p.clamp_plate_w\n    H = p.plate_t\n    Lc = p.coupon_len\n\
    \    ch = min(H, p.dovetail_chamfer)\n    top_half = W / 2.0 - ch\n\n    solid\
    \ = (cq.Workplane(\"XZ\")\n             .polyline([(-W / 2.0, 0.0), (W / 2.0,\
    \ 0.0), (top_half, H), (-top_half, H)])\n             .close()\n             .extrude(Lc))\n\
    \    solid = solid.translate(cq.Vector(0.0, -Lc / 2.0, 0.0))\n\n    # Same 45\
    \ deg sides, plus a slightly roomier bolt hole to trial the salvaged 1/4-20 bolt\
    \ in.\n    solid = solid.cut(cq.Workplane(\"XY\")\n                      .circle(p.coupon_bolt_hole_d\
    \ / 2.0)\n                      .extrude(H + 2.0))\n\n    # Shallow recess so\
    \ the coupon can also be sat on the camera base to read the thread height.\n \
    \   solid = solid.cut(cq.Workplane(\"XY\")\n                      .box(p.coupon_recess_side,\
    \ p.coupon_recess_side, p.coupon_recess_depth + 1.0,\n                       \
    \    centered=(True, True, False))\n                      .translate(cq.Vector(0,\
    \ 0, -1.0)))\n    return solid"
  print_orientation: Dovetail bottom face (z=0) flat on the bed, like the plate. 38
    x 20 mm footprint, 12 mm tall.
  use_orientation: 'Two uses: slid into the tripod clamp to test the dovetail, and
    bolt threaded through it stood on the camera base to test how high the 1/4-20
    thread stands proud.'
