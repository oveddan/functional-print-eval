  m3_head_d:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  m3_head_h:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  coupon_len:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_bolt_hole_d:
    value: 7.5
    unit: mm
    kind: design
    source: design
    note: 'Deliberately 0.3 mm roomier than the plate hole: if the bolt slides freely
