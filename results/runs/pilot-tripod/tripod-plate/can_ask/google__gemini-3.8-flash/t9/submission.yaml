    note: Arca-Swiss standard dovetail angle
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: diameter of the salvaged webcam mount bolt head
  tripod_plate_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: width of the tripod clamp receiver plate opening
  plate_length:
    value: 45
    unit: mm
    kind: design
    source: design
    note: overall length of the quick release plate along the rail
  slot_travel:
    value: 18
    unit: mm
    kind: design
    source: design
    note: center-to-center travel distance for camera position adjustment
  dovetail_base_height:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: vertical lip height at the base of the dovetail
  dovetail_bevel_height:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: height of the 45-degree beveled clamping surface
parts:
- id: quick_release_plate
  role: final
  material: PLA
  code: "def build(p):\n    import cadquery as cq\n\n    w = p.tripod_plate_width\n\
    \    l = p.plate_length\n    h_tot = p.plate_height\n    h_base = p.dovetail_base_height\n\
    \    h_bev = p.dovetail_bevel_height\n    w_top = w - 2.0 * h_bev\n\n    # Cross-section\
    \ polygon in XZ plane (X = width, Z = height)\n    pts = [\n        (-w / 2.0,\
    \ 0.0),\n        (w / 2.0, 0.0),\n        (w / 2.0, h_base),\n        (w_top /\
    \ 2.0, h_base + h_bev),\n        (w_top / 2.0, h_tot),\n        (-w_top / 2.0,\
    \ h_tot),\n        (-w_top / 2.0, h_base + h_bev),\n        (-w / 2.0, h_base),\n\
    \    ]\n\n    # Extrude solid plate along Y centered at Y=0\n    plate = (\n \
    \       cq.Workplane(\"XZ\")\n        .polyline(pts)\n        .close()\n     \
    \   .extrude(l / 2.0, both=True)\n    )\n\n    # Cut bottom channel for bolt head\
    \ recess (open at both ends)\n    cb_w = p.counterbore_width\n    cb_d = p.counterbore_depth\n\
    \    channel = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=-1.0)\n\
    \        .rect(cb_w, l + 4.0)\n        .extrude(cb_d + 1.0)\n    )\n    plate\
    \ = plate.cut(channel)\n\n    # Cut 1/4\"-20 camera screw clearance slot through\
    \ the central web\n    slot_w = p.slot_width\n    slot_trav = p.slot_travel\n\
    \    slot_box = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=-1.0)\n\
    \        .rect(slot_w, slot_trav)\n        .extrude(h_tot + 2.0)\n    )\n    slot_cyl1\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=-1.0)\n       \
    \ .center(0, -slot_trav / 2.0)\n        .circle(slot_w / 2.0)\n        .extrude(h_tot\
    \ + 2.0)\n    )\n    slot_cyl2 = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=-1.0)\n\
    \        .center(0, slot_trav / 2.0)\n        .circle(slot_w / 2.0)\n        .extrude(h_tot\
    \ + 2.0)\n    )\n    slot = slot_box.union(slot_cyl1).union(slot_cyl2)\n    plate\
    \ = plate.cut(slot)\n\n    return plate\n"
  print_orientation: Bottom runners on the build plate (Z=0), 45-degree dovetail faces
    sloping inward and upward, camera platform facing upward.
  use_orientation: Flat top platform (Z=10) facing upward against the camera base;
    38 mm dovetail clamped between the tripod head jaws.
hardware:
- id: webcam-bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_mounting_joint
  fastener: webcam-bolt
  axis_origin:
  - 0.0
  - 0.0
  - 5.2
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: quick_release_plate
    feature: channel_seat
    role: head_seat
  - part: quick_release_plate
    feature: camera_screw_slot
    role: clearance
  nut: null
  external: camera 1/4-20 tripod socket
criteria:
- id: crit_clamp_width
  part: quick_release_plate
  feature: dovetail_base
  relation: engages
  hardware: null
  clearance_mm: 0.0
  params:
  - tripod_plate_width
  check:
    method: measure
    ref: null
    description: Measure across the bottom base width with calipers to verify 38.0
      mm Arca-Swiss clamp fit
- id: crit_slot_clearance
  part: quick_release_plate
  feature: camera_screw_slot
  relation: clears
  hardware: webcam-bolt
  clearance_mm: 0.65
  params:
  - slot_width
  - camera_thread
  check:
    method: measure
    ref: null
    description: Check that the 1/4-20 webcam bolt threads pass through freely and
      slide along the slot
- id: crit_head_seat
  part: quick_release_plate
  feature: channel_seat
  relation: seats
  hardware: webcam-bolt
  clearance_mm: 1.5
  params:
  - counterbore_width
  - bolt_head_d
  - counterbore_depth
  - bolt_head_h
  check:
    method: measure
    ref: null
    description: Verify the 15 mm bolt head sits recessed within the bottom channel
      without protruding below the base runners
- id: crit_camera_support
  part: quick_release_plate
  feature: top_camera_face
  relation: supports
  hardware: null
  clearance_mm: 0.0
  params:
  - plate_height
  - plate_length
  check:
    method: measure
    ref: null
    description: Check that the top surface provides a flat, stable platform for the
      camera body
- id: crit_thread_engagement
  part: quick_release_plate
  feature: top_camera_face
  relation: clears
  hardware: webcam-bolt
  clearance_mm: 5.2
  params:
  - bolt_thread_len
  - web_thickness
  - thread_protrusion
  check:
    method: measure
    ref: null
    description: Measure bolt thread stickout above the top surface to confirm approximately
      5.2 mm engagement into the camera socket
manual:
- n: '1'
  text: Print the quick release plate with the flat bottom runners on the build plate
    (Z=0). Ensure 4 to 5 perimeters and 40%+ infill for maximum stiffness and strength.
    Once printed, clean off any brim or stray strings around the dovetail edges and
    central slot.
  parts:
  - quick_release_plate
  hardware: []
  tool: null
- n: '2'
  text: Take the salvaged 1/4"-20 webcam mount bolt and slide it into the bottom recessed
    channel of the plate from one of the ends. Ensure the threaded stud points upward
    through the central slot and the 15 mm head sits flush within the channel.
  parts:
  - quick_release_plate
  hardware:
  - webcam-bolt
  tool: null
- n: '3'
  text: Place the plate against the bottom of your camera, aligning the protruding
    bolt with the camera's 1/4"-20 tripod socket. Slide the plate forward or backward
    along the slot to balance the camera and ensure access to the battery/SD card
    door.
  parts:
  - quick_release_plate
  hardware:
  - webcam-bolt
  tool: null
- n: '4'
  text: Tighten the bolt into the camera socket using the thumb knob on the bolt head
    (or a coin/screwdriver if slotted) until the plate is firmly clamped against the
    camera base with no wobble.
  parts:
  - quick_release_plate
  hardware:
  - webcam-bolt
  tool: coin or fingers
- n: '5'
  text: Turn the tripod head knob to open the clamp jaws wider than 38 mm. Drop the
    plate into the clamp from above, position it centrally, and tighten the clamp
    knob firmly to lock the 45-degree dovetail into the tripod head.
  parts:
  - quick_release_plate
  hardware: []
  tool: null
