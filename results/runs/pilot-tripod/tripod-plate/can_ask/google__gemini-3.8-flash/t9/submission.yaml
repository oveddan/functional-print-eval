task: tripod-plate
note: Arca-Swiss compatible quick release plate designed for 38 mm clamp receivers,
  utilizing the salvaged 1/4"-20 webcam mount bolt for secure metal-on-metal camera
  attachment.
questions:
- text: How hard would it be to 3D print it, both the flat part and the part that
    screws in? Just as a temporary thing until I find the real one. I know it's metal
    normally.
  answer: Printing the flat plate is quick, straightforward, and strong when printed
    in PLA with solid perimeters. However, 3D printing a plastic 1/4"-20 threaded
    screw is not recommended because small 3D-printed plastic threads in shear and
    tension along layer lines are prone to snapping under the weight and tilt of a
    camera. Instead, this design uses your salvaged 1/4"-20 metal bolt from the webcam
    mount. The printed plate features a recessed bottom channel that captures the
    bolt's 15 mm head and leaves exactly 5.2 mm of metal thread protruding into your
    camera's socket for full strength and safety.
params:
  camera_thread:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: nominal diameter of standard 1/4-20 camera mounting thread
  counterbore_depth:
    value: 5.2
    unit: mm
    kind: design
    source: design
    note: depth of recessed channel so the 5 mm bolt head is completely flush/recessed
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: height/thickness of the salvaged webcam mount bolt head
  thread_protrusion:
    value: 5.2
    unit: mm
    kind: design
    source: design
    note: thread length protruding above the top face into the camera socket
  counterbore_width:
