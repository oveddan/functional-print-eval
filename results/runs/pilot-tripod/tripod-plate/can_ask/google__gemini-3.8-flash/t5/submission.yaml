task: tripod-plate
note: Arca-Swiss compatible 38 mm quick release plate utilizing the salvaged metal
  1/4-20 webcam mount bolt for safety and strength.
questions:
- text: How hard would it be to 3D print both the flat plate and the camera screw?
  answer: 'The quick release plate itself is straightforward to 3D print and performs
    very well in PLA. However, 3D printing a plastic 1/4"-20 screw is unsafe because
    3D printed threads easily snap along layer lines under the weight and leverage
    of a camera. You can safely reuse the metal 1/4"-20 bolt from your webcam monitor
    mount: it has standard 1/4"-20 camera threads, a 10 mm shank that gives an ideal
    5.5 mm thread engagement into the camera, and a 15 mm knurled thumb head that
    allows easy, secure tightening without risking your camera.'
params:
  plate_seat_t:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: Plate wall thickness under the bolt head to yield 5.5 mm thread stickout
      (10 mm - 5.5 mm)
  slot_clearance:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Clearance on slot width for the 1/4-20 shank
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Measured height of the webcam mount bolt head
  camera_socket_thread_engagement:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Standard thread engagement depth for ISO 1222 camera tripod sockets (5.5
      mm)
  slot_length:
    value: 16
    unit: mm
    kind: design
    source: design
    note: Length of the adjustment slot for the 1/4-20 bolt
  dovetail_angle:
    value: 45
    unit: deg
    kind: design
    source: design
    note: Standard Arca-Swiss dovetail angle (45 degrees)
  bolt_length:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: Measured length under the head of the webcam mount bolt
  dovetail_bevel_h:
    value: 3
    unit: mm
    kind: design
    source: design
    note: Vertical height of each 45-degree bevel feature
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Measured diameter of the webcam mount bolt head
  coupon_length:
    value: 15
    unit: mm
    kind: design
    source: design
    note: Length of the quick-test coupon
  plate_height:
    value: 9.5
    unit: mm
    kind: design
    source: design
    note: Total overall thickness of the quick release plate
  clamp_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: Tripod clamp plate width measured from the tripod head
  head_clearance:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Clearance around the bolt head in the counterbore
  bolt_thread_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal 1/4-20 UNC thread major diameter (6.35 mm)
  land_h:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Vertical land height at top and bottom edges of the plate profile
  plate_length:
    value: 50
    unit: mm
    kind: design
    source: design
    note: Overall length of the full quick release plate
parts:
- id: qr_plate_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    w = p.clamp_width\n    h = p.plate_height\n    bh = p.dovetail_bevel_h\n\
    \    lh = p.land_h\n    wh = h - 2 * lh - 2 * bh\n\n    pts = [\n        (-w /\
    \ 2, 0),\n        (w / 2, 0),\n        (w / 2, lh),\n        (w / 2 - bh, lh +\
    \ bh),\n        (w / 2 - bh, lh + bh + wh),\n        (w / 2, lh + 2 * bh + wh),\n\
    \        (w / 2, h),\n        (-w / 2, h),\n        (-w / 2, lh + 2 * bh + wh),\n\
    \        (-(w / 2 - bh), lh + bh + wh),\n        (-(w / 2 - bh), lh + bh),\n \
    \       (-w / 2, lh),\n    ]\n\n    part = (\n        cq.Workplane(\"XZ\")\n \
    \       .polyline(pts)\n        .close()\n        .extrude(p.coupon_length)\n\
    \        .translate((0, -p.coupon_length / 2, 0))\n    )\n    return part\n"
  print_orientation: Flat camera-contact face on build plate at z = 0
  use_orientation: Insert into tripod clamp to verify dovetail fit and clamping force
- id: qr_plate
  role: final
  material: PLA
  code: "def build(p):\n    w = p.clamp_width\n    h = p.plate_height\n    bh = p.dovetail_bevel_h\n\
    \    lh = p.land_h\n    wh = h - 2 * lh - 2 * bh\n\n    pts = [\n        (-w /\
    \ 2, 0),\n        (w / 2, 0),\n        (w / 2, lh),\n        (w / 2 - bh, lh +\
    \ bh),\n        (w / 2 - bh, lh + bh + wh),\n        (w / 2, lh + 2 * bh + wh),\n\
    \        (w / 2, h),\n        (-w / 2, h),\n        (-w / 2, lh + 2 * bh + wh),\n\
    \        (-(w / 2 - bh), lh + bh + wh),\n        (-(w / 2 - bh), lh + bh),\n \
    \       (-w / 2, lh),\n    ]\n\n    part = (\n        cq.Workplane(\"XZ\")\n \
    \       .polyline(pts)\n        .close()\n        .extrude(p.plate_length)\n \
    \       .translate((0, -p.plate_length / 2, 0))\n    )\n\n    # Cut clearance\
    \ slot for 1/4\"-20 bolt through the plate\n    slot_w = p.bolt_thread_d + p.slot_clearance\n\
    \    slot_l = p.slot_length\n    part = part.faces(\">Z\").workplane().rect(slot_w,\
    \ slot_l).cutThruAll()\n\n    # Cut counterbore recess on the clamp side (>Z)\
    \ for the 15 mm bolt head\n    cb_w = p.bolt_head_d + p.head_clearance\n    cb_l\
    \ = p.slot_length + p.bolt_head_d + p.head_clearance\n    cb_depth = p.plate_height\
    \ - p.plate_seat_t\n    part = part.faces(\">Z\").workplane().rect(cb_w, cb_l).cutBlind(-cb_depth)\n\
    \n    return part\n"
  print_orientation: Flat camera-contact face on build plate at z = 0; counterbore
    opens upward at top of print
  use_orientation: Flat face at z = 0 mates against camera base; clamp-facing side
    with bolt counterbore seats into tripod clamp
hardware:
- id: webcam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_bolt_joint
  fastener: webcam_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 4.5
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: qr_plate
    feature: counterbore
    role: head_seat
  - part: qr_plate
    feature: bolt_slot
    role: clearance
  nut: null
  external: camera 1/4-20 socket
criteria:
- id: coupon_clamp_engagement
  part: qr_plate_coupon
  feature: dovetail
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - clamp_width
  - dovetail_angle
  - dovetail_bevel_h
  - land_h
  check:
    method: coupon
    ref: qr_plate_coupon
    description: Slide or drop the coupon into the tripod clamp and tighten the knob
      to confirm 38 mm width and 45-degree bevels lock securely with zero wobble.
- id: plate_clamp_engagement
  part: qr_plate
  feature: dovetail
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - clamp_width
  - dovetail_angle
  - dovetail_bevel_h
  - land_h
  check:
    method: coupon
    ref: qr_plate_coupon
    description: Check that the quick release plate drops smoothly into the tripod
      clamp and locks tight when the clamp knob is tightened.
- id: bolt_head_clearance
  part: qr_plate
  feature: counterbore
  relation: clears
  hardware: webcam_bolt
  clearance_mm: 1.5
  params:
  - bolt_head_d
  - head_clearance
  - slot_length
  check:
    method: measure
    ref: null
    description: Verify that the salvaged webcam 1/4-20 bolt head drops into the counterbore
      and slides smoothly along the adjustment slot.
- id: bolt_thread_stickout
  part: qr_plate
  feature: bolt_slot
  relation: seats
  hardware: webcam_bolt
  clearance_mm: null
  params:
  - bolt_length
  - plate_seat_t
  - camera_socket_thread_engagement
  check:
    method: measure
    ref: null
    description: Verify that the bolt threads protrude approximately 5.5 mm beyond
      the camera face for safe, complete engagement with the camera tripod socket.
manual:
- n: '1'
  text: Print the quick release plate coupon (qr_plate_coupon). It takes under 10
    minutes to print with zero supports. Test fit it in your friend's tripod clamp
    by dropping it in and tightening the clamp knob. Verify that the clamp jaws seat
    firmly into the dovetail grooves without rocking.
  parts:
  - qr_plate_coupon
  hardware: []
  tool: null
- n: '2'
  text: Print the full quick release plate (qr_plate) with the flat camera-contact
    face on the build bed (z = 0). Use high infill (at least 40% or 4-5 perimeters)
    for maximum rigidity. No supports are needed.
  parts:
  - qr_plate
  hardware: []
  tool: null
- n: '3'
  text: Take the salvaged 1/4"-20 bolt from the webcam monitor mount. Insert the bolt
    into the recessed counterbore on the clamp-side of the plate so its threaded shank
    extends through the slot past the flat camera-contact face.
  parts:
  - qr_plate
  hardware:
  - webcam_bolt
  tool: null
- n: '4'
  text: Align the plate with your camera base and thread the 1/4"-20 bolt into the
    camera's tripod socket by turning the 15 mm knurled bolt head. Tighten it securely
    using your fingers, a coin, or a flat screwdriver.
  parts:
  - qr_plate
  hardware:
  - webcam_bolt
  tool: coin or flat screwdriver
- n: '5'
  text: Loosen the tripod clamp knob, drop the camera with the attached plate into
    the tripod clamp, and tighten the knob firmly. Verify the camera is locked securely
    before releasing your hand.
  parts:
  - qr_plate
  hardware: []
  tool: null
