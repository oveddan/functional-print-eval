task: tripod-plate
note: Temporary camera plate for a drop-in clamp with angled lips. The flat part is
  plate. The part that screws into the camera is the metal webcam 1/4-20 bolt, not
  a printed thread — printed PLA threads would strip and drop the camera. The thumbwheel
  only turns that bolt, then comes off. Jaw width and angle could not be measured,
  so the dovetail is the usual Arca-Swiss size (38 mm widest, 45 degrees). Print the
  coupon and try it in the clamp before printing the plate. If the coupon does not
  lock in, do not use this on that head.
questions: []
params:
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: webcam-mount-bolt head across, about 15 mm
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: webcam-mount-bolt head height, about 5 mm
  bolt_underhead_len:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: webcam-mount-bolt length under the head, about 10 mm
  bolt_major_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 UNC major diameter; the salvaged bolt is 1/4-20
  bolt_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: catalog
    note: pitch table for 1/4-20
  dovetail_bottom_w:
    value: 38
    unit: mm
    kind: world
    source: guessed
    note: Arca-Swiss usual widest width. Jaw opening could not be measured; knob-tightened
      clamps close onto the plate. Coupon must confirm fit before the plate is printed.
  dovetail_angle_deg:
    value: 45
    unit: deg
    kind: world
    source: guessed
    note: Arca-Swiss usual lip angle, from vertical. Not measured on this head.
  dovetail_slope_h:
    value: 5
    unit: mm
    kind: design
    source: design
    note: Height of the sloped faces the lips bite
  head_subflush:
    value: 2
    unit: mm
    kind: design
    source: design
    note: Pocket deeper than the measured head so the head stays below the tripod
      face
  thread_protrusion:
    value: 5
    unit: mm
    kind: design
    source: design
    note: Thread past the camera face before screwing in. About 4 turns. Socket depth
      was not measured; 5 mm is short of a typical camera socket so the bolt is less
      likely to bottom out.
  head_pocket_clearance:
    value: 6
    unit: mm
    kind: design
    source: design
    note: Added to head diameter so the thumbwheel cup can enter the pocket
  shank_clearance:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Added to the 1/4-20 major diameter for the slot the threads pass through
  plate_length:
    value: 70
    unit: mm
    kind: design
    source: design
    note: ''
  slot_margin:
    value: 15
    unit: mm
    kind: design
    source: design
    note: Solid cap at each end of the slot so a loose bolt cannot slide out
  cup_clearance:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Thumbwheel bore minus head diameter, before the ribs
  cup_wall:
    value: 1.6
    unit: mm
    kind: design
    source: design
    note: ''
  cup_h:
    value: 6
    unit: mm
    kind: design
    source: design
    note: Reaches into the pocket far enough to grip the head
  wheel_od:
    value: 34
    unit: mm
    kind: design
    source: design
    note: Narrower than the 38 mm dovetail face so it can be turned against that face,
      then removed
  wheel_flange_t:
    value: 3.2
    unit: mm
    kind: design
    source: design
    note: ''
  rib_protrusion:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: How far each rib sticks into the bore to bite a knurled head
  rib_t:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_length:
    value: 24
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    import math\n    inset = p.dovetail_slope_h * math.tan(math.radians(p.dovetail_angle_deg))\n\
    \    hb = p.dovetail_bottom_w / 2.0\n    ht = hb - inset\n    head_recess = p.bolt_head_h\
    \ + p.head_subflush\n    shoulder = p.bolt_underhead_len - p.thread_protrusion\n\
    \    thick = head_recess + shoulder\n    sh = p.dovetail_slope_h\n    pts = [\n\
    \        (-hb, 0.0),\n        (hb, 0.0),\n        (ht, sh),\n        (ht, thick),\n\
    \        (-ht, thick),\n        (-ht, sh),\n    ]\n    return cq.Workplane(\"\
    XZ\").polyline(pts).close().extrude(p.coupon_length)\n"
  print_orientation: Wide face on the bed (z=0). The narrow face is up. Same cross-section
    as the plate.
  use_orientation: Test only. Wide face down in the tripod clamp, narrow face up.
    Do not mount a camera on it.
- id: plate
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    inset = p.dovetail_slope_h * math.tan(math.radians(p.dovetail_angle_deg))\n\
    \    hb = p.dovetail_bottom_w / 2.0\n    ht = hb - inset\n    head_recess = p.bolt_head_h\
    \ + p.head_subflush\n    shoulder = p.bolt_underhead_len - p.thread_protrusion\n\
    \    thick = head_recess + shoulder\n    sh = p.dovetail_slope_h\n    pts = [\n\
    \        (-hb, 0.0),\n        (hb, 0.0),\n        (ht, sh),\n        (ht, thick),\n\
    \        (-ht, thick),\n        (-ht, sh),\n    ]\n    plate = cq.Workplane(\"\
    XY\").polyline(pts).close().extrude(p.plate_length)\n    z0 = p.slot_margin\n\
    \    z1 = p.plate_length - p.slot_margin\n    span = z1 - z0\n    zc = (z0 + z1)\
    \ / 2.0\n    pocket_w = p.bolt_head_d + p.head_pocket_clearance\n    pocket_h\
    \ = head_recess + 0.5\n    pocket = (\n        cq.Workplane(\"XY\")\n        .box(pocket_w,\
    \ pocket_h, span)\n        .translate((0.0, head_recess - pocket_h / 2.0, zc))\n\
    \    )\n    slot_w = p.bolt_major_d + p.shank_clearance\n    slot_h = shoulder\
    \ + 0.5\n    slot = (\n        cq.Workplane(\"XY\")\n        .box(slot_w, slot_h,\
    \ span)\n        .translate((0.0, head_recess + slot_h / 2.0, zc))\n    )\n  \
    \  return plate.cut(pocket).cut(slot)\n"
  print_orientation: Stand on one end, the z=0 end face, on the bed. Add a brim; the
    footprint is only about 38 x 12 mm. Wide tripod face is Y=0 (a vertical face).
    The slot cap at the top of the print is a bridge of about 21 mm.
  use_orientation: Wide face (Y=0) down on the tripod clamp floor. Narrow face against
    the camera. The 1/4-20 bolt head sits in the wide pocket and the threads leave
    through the narrow face.
- id: thumbwheel
  role: final
  material: PLA
  code: "def build(p):\n    flange_t = p.wheel_flange_t\n    cup_h = p.cup_h\n   \
    \ bore_r = (p.bolt_head_d + p.cup_clearance) / 2.0\n    cup_or = bore_r + p.cup_wall\n\
    \    wheel = cq.Workplane(\"XY\").circle(p.wheel_od / 2.0).extrude(flange_t)\n\
    \    cup = (\n        cq.Workplane(\"XY\")\n        .circle(cup_or)\n        .extrude(cup_h)\n\
    \        .translate((0.0, 0.0, flange_t))\n    )\n    bore = (\n        cq.Workplane(\"\
    XY\")\n        .circle(bore_r)\n        .extrude(cup_h + 0.2)\n        .translate((0.0,\
    \ 0.0, flange_t - 0.1))\n    )\n    body = wheel.union(cup).cut(bore)\n    rib_h\
    \ = cup_h - 0.8\n    rib_rad = p.rib_protrusion + 0.9\n    rib_mid_r = bore_r\
    \ - p.rib_protrusion + rib_rad / 2.0\n    for i in range(4):\n        rib = (\n\
    \            cq.Workplane(\"XY\")\n            .box(rib_rad, p.rib_t, rib_h)\n\
    \            .translate((rib_mid_r, 0.0, flange_t + 0.4 + rib_h / 2.0))\n    \
    \        .rotate((0, 0, 0), (0, 0, 1), i * 90.0)\n        )\n        body = body.union(rib)\n\
    \    for i in range(12):\n        notch = (\n            cq.Workplane(\"XY\")\n\
    \            .box(2.6, 1.5, flange_t + 0.4)\n            .translate((p.wheel_od\
    \ / 2.0, 0.0, flange_t / 2.0))\n            .rotate((0, 0, 0), (0, 0, 1), i *\
    \ 30.0)\n        )\n        body = body.cut(notch)\n    return body\n"
  print_orientation: Flange flat on the bed (z=0), cup pointing up.
  use_orientation: Press the cup onto the bolt head from the wide side of the plate,
    turn the bolt into the camera, then take the wheel off before the plate goes in
    the clamp.
hardware:
- id: cam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_screw
  fastener: cam_bolt
  axis_origin:
  - 0.0
  - 7.0
  - 35.0
  axis_dir:
  - 0.0
  - 1.0
  - 0.0
  seats:
  - part: plate
    feature: head_pocket
    role: head_seat
  - part: plate
    feature: shank_slot
    role: clearance
  nut: null
  external: camera 1/4-20 tripod socket
criteria:
- id: coupon_fits_jaws
  part: fit_coupon
  feature: dovetail
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - dovetail_bottom_w
  - dovetail_angle_deg
  - dovetail_slope_h
  check:
    method: coupon
    ref: fit_coupon
    description: Print the coupon first. Drop it in from above, wide face down, and
      tighten the knob. The angled lips must bite the slopes, the wide face must sit
      flat, and the coupon must not lift out. If it will not drop in, or the knob
      runs out of travel before the lips bite, do not print the plate and do not hang
      a camera on this head.
- id: plate_same_dovetail
  part: plate
  feature: dovetail
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - dovetail_bottom_w
  - dovetail_angle_deg
  - dovetail_slope_h
  check:
    method: coupon
    ref: fit_coupon
    description: The plate uses the same widest width, angle, and slope height as
      the coupon. Mount it only if the coupon locked in.
- id: head_seats_subflush
  part: plate
  feature: head_pocket
  relation: seats
  hardware: cam_bolt
  clearance_mm: null
  params:
  - bolt_head_d
  - bolt_head_h
  - head_subflush
  - head_pocket_clearance
  check:
    method: measure
    ref: null
    description: With the bolt dropped in and not yet in the camera, the head should
      sit about 2 mm below the wide face, not proud of it. A proud head will hold
      the plate off the clamp floor.
- id: shank_clears_slot
  part: plate
  feature: shank_slot
  relation: clears
  hardware: cam_bolt
  clearance_mm: 0.8
  params:
  - bolt_major_d
  - shank_clearance
  check:
    method: measure
    ref: null
    description: The threads must pass through the narrow slot. Designed diametral
      clearance is 0.8 mm on the 6.35 mm major diameter.
- id: thread_reaches_camera
  part: plate
  feature: shank_slot
  relation: engages
  hardware: cam_bolt
  clearance_mm: null
  params:
  - bolt_underhead_len
  - thread_protrusion
  - bolt_pitch
  check:
    method: measure
    ref: null
    description: Before screwing in, about 5 mm of thread should stand past the narrow
      face. If it is under 3 mm or over 7 mm, the bolt length does not match this
      plate; do not force it into the camera.
- id: wheel_grips_head
  part: thumbwheel
  feature: cup
  relation: engages
  hardware: cam_bolt
  clearance_mm: null
  params:
  - bolt_head_d
  - cup_clearance
  - rib_protrusion
  check:
    method: none
    ref: null
    description: The cup fits over the bolt head and the four ribs bite the knurl
      so the bolt can be turned, then the wheel is removed.
manual:
- n: '1'
  text: Print only fit_coupon first, in PLA, 0.2 mm layers. Wide face on the bed.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Open the tripod knob, drop fit_coupon in from above with the wide face down,
    and tighten the knob. The angled lips should pull it down onto the floor, and
    it should not lift out. If it will not drop in, rocks on a pin, or the knob cannot
    close far enough to bite the slopes, stop. This plate will not fit that head.
    Do not hang a camera on it.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '3'
  text: Print plate standing on its end (the small end face on the bed) with a brim,
    and print thumbwheel with the flange on the bed. PLA, 0.2 mm layers, 5 walls,
    50% infill. The slot cap is a short bridge; leave normal bridge settings. Peel
    the brim. The top of the slot may be a little rough inside; that face only stops
    the bolt sliding out.
  parts:
  - plate
  - thumbwheel
  hardware: []
  tool: null
- n: '4'
  text: From the wide face, drop cam_bolt into the pocket so the threads stick out
    the narrow face by about 5 mm. The head must sit below the wide face, not proud
    of it. If the stick-out is under 3 mm or over 7 mm, stop.
  parts:
  - plate
  hardware:
  - cam_bolt
  tool: null
- n: '5'
  text: Hold the narrow face against the camera bottom, threads in the 1/4-20 socket.
    Press thumbwheel onto the bolt head from the wide side and turn clockwise until
    the plate is snug. Fingers only, no pliers. Take the thumbwheel off. The wheel
    must not stay on; it would hold the plate off the clamp floor.
  parts:
  - plate
  - thumbwheel
  hardware:
  - cam_bolt
  tool: thumbwheel
- n: '6'
  text: 'Drop the plate into the tripod from above, camera up, wide face down. Tighten
    the knob until the lips bite, firm but not so hard that the PLA slopes crush.
    Keep a hand on the camera and check that it does not rock and that the bolt has
    not loosened. This is a temporary stand-in until the real plate turns up: no heavy
    lenses, do not leave the camera on it, and check the knob again after a few minutes.'
  parts:
  - plate
  hardware:
  - cam_bolt
  tool: tripod clamp knob
