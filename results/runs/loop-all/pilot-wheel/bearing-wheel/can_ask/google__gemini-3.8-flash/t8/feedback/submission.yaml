manual:
- n: '1'
  text: 'Print the bearing_coupon first to test the press-fit of your 608 bearings.
    The bearing should push firmly into the pocket with hand or light table pressure
    and sit flat without cracking the plastic. (Confirmed: goes in and holds upside
    down).'
  parts:
  - bearing_coupon
  hardware:
  - bearing_608
  tool: null
- n: '2'
  text: Print the roller_wheel, one center_spacer, and two standoff_spacers in high-speed
    PLA using at least 4-5 perimeters or 100% infill for maximum durability under
    door weight.
  parts:
  - roller_wheel
  - center_spacer
  - standoff_spacer
  hardware: []
  tool: null
- n: '3'
  text: Press the first 608 bearing into one side of the roller_wheel until it seats
    flush against the internal shoulder.
  parts:
  - roller_wheel
  hardware:
  - bearing_608
  tool: null
- n: '4'
  text: Drop the printed center_spacer into the wheel cavity from the opposite side
    so it rests squarely against the inner ring of the first bearing.
  parts:
  - roller_wheel
  - center_spacer
  hardware: []
  tool: null
- n: '5'
  text: Press the second 608 bearing into the open pocket until it seats against the
    internal shoulder, capturing the center_spacer between the two inner rings.
  parts:
  - roller_wheel
  hardware:
  - bearing_608
  tool: null
- n: '6'
  text: Slide one standoff_spacer onto the M8 bolt shank against the bolt head (or
    washer), then slide the bolt through the assembled wheel, and place the second
    standoff_spacer on the protruding bolt shank.
  parts:
  - roller_wheel
  - center_spacer
  - standoff_spacer
  hardware:
  - bolt_m8
  - washer_m8
  tool: null
- n: '7'
  text: Fit the wheel assembly into the closet door bracket, install the washer and
    M8 nut, and tighten. Spin the wheel by hand to verify it rolls freely without
    rubbing against the bracket.
  parts:
  - roller_wheel
  hardware:
  - nut_m8
  - washer_m8
  tool: Hex key / wrench
