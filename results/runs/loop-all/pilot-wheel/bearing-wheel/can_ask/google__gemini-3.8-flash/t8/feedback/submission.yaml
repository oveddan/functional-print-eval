task: bearing-wheel
note: Heavy-duty dual-bearing replacement roller wheel for sliding closet door. Features
  a versatile central U-groove with flat outer shoulders, accommodating both raised-rail
  and flat-channel tracks. Includes matched inner and outer bearing spacers so tightening
  the M8 axle bolt clamps strictly on the inner bearing rings, preventing bearing
  lockup and bracket friction. Tested and confirmed bearing press-fit retention.
questions:
- text: Does your sliding closet door track have a raised convex rail or a flat channel?
  answer: null
- text: What is the exact width of the bracket or clevis where the wheel mounts?
  answer: null
