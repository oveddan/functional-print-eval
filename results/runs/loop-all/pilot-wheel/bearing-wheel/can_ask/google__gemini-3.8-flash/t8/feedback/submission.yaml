    source: design
    note: Chamfer on outer wheel edges for clean printing and track transition
parts:
- id: roller_wheel
  role: final
  material: PLA
  code: "def build(p):\n    wheel = (\n        cq.Workplane(\"XY\")\n        .circle(p.wheel_od\
    \ / 2.0)\n        .extrude(p.wheel_width)\n    )\n    wheel = wheel.edges(\">Z\"\
    ).chamfer(p.edge_chamfer)\n    wheel = wheel.edges(\"<Z\").chamfer(p.edge_chamfer)\n\
    \    \n    # Bottom bearing pocket\n    wheel = wheel.faces(\"<Z\").circle(p.bearing_pocket_od\
    \ / 2.0).cutBlind(p.bearing_pocket_depth)\n    \n    # Top bearing pocket\n  \
    \  wheel = wheel.faces(\">Z\").circle(p.bearing_pocket_od / 2.0).cutBlind(p.bearing_pocket_depth)\n\
    \    \n    # Through-hole through central rib\n    wheel = wheel.faces(\">Z\"\
    ).circle(p.internal_rib_id / 2.0).cutThruAll()\n    \n    # Central U-groove\n\
    \    groove_center_x = p.wheel_od / 2.0 + p.groove_radius - p.groove_depth\n \
    \   groove_cutter = (\n        cq.Workplane(\"XZ\")\n        .moveTo(groove_center_x,\
    \ p.wheel_width / 2.0)\n        .circle(p.groove_radius)\n        .revolve(360,\
    \ (0, 0, 0), (0, 1, 0))\n    )\n    wheel = wheel.cut(groove_cutter)\n    \n \
    \   return wheel\n"
  print_orientation: Bottom face flat on build plate (Z=0), wheel axis vertical along
    Z
  use_orientation: Wheel axis horizontal, aligned with M8 axle bolt
- id: center_spacer
  role: final
  material: PLA
  code: "def build(p):\n    spacer = (\n        cq.Workplane(\"XY\")\n        .circle(p.spacer_od\
    \ / 2.0)\n        .circle(p.spacer_id / 2.0)\n        .extrude(p.center_spacer_length)\n\
    \    )\n    return spacer\n"
  print_orientation: Flat annular face on build plate (Z=0), cylinder axis vertical
    along Z
  use_orientation: Mounted on M8 bolt between the inner rings of the two 608 bearings
- id: standoff_spacer
  role: final
  material: PLA
  code: "def build(p):\n    bushing = (\n        cq.Workplane(\"XY\")\n        .circle(p.spacer_od\
    \ / 2.0)\n        .circle(p.spacer_id / 2.0)\n        .extrude(p.standoff_spacer_length)\n\
    \    )\n    return bushing\n"
  print_orientation: Flat annular face on build plate (Z=0), cylinder axis vertical
    along Z
  use_orientation: Mounted on M8 bolt between bearing inner ring and mounting bracket/fastener
- id: bearing_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    coupon = (\n        cq.Workplane(\"XY\")\n        .circle(p.coupon_od\
    \ / 2.0)\n        .circle(p.bearing_pocket_od / 2.0)\n        .extrude(p.bearing_pocket_depth)\n\
    \    )\n    return coupon\n"
  print_orientation: Flat face on build plate (Z=0), bore axis vertical along Z
  use_orientation: Test coupon used only for fit verification before printing the
    wheel
