task: bearing-wheel
note: The 22.1 mm bearing pocket (bearing_fit_clearance = 0.1 mm) is confirmed by
  the test print to give a snug press fit that holds the 608ZZ bearings upside down.
  Two 608ZZ bearings (14 mm total width) sit back-to-back inside the 16 mm wide wheel
  against the 2 mm bottom outer-race lip, while spacer_bottom (2.8 mm) and spacer_top
  (0.8 mm) bear only on the 608ZZ inner rings (11.2 mm OD) and stand 0.8 mm proud
  of each wheel face so tightening the M8 bolt never binds the bearings or rubs the
  wheel.
questions:
- text: Does the closet door track have a flat bottom or a raised rail/V-groove that
    would require a deeper groove in the outer rim of the wheel?
  answer: null
- text: What is the exact inside spacing between the walls of the closet door roller
    bracket?
  answer: null
