parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    r_outer = p.wheel_od / 2.0\n    c = p.tire_edge_chamfer\n\
    \    bore_d = p.bearing_od + 2.0 * p.bearing_fit_clearance\n    pocket_z0 = p.bottom_lip_t\n\
    \    pocket_h = p.bearing_count * p.bearing_w\n    lead_in_h = p.wheel_w - (pocket_z0\
    \ + pocket_h)\n\n    bot_cone = cq.Solid.makeCone(\n        r_outer - c, r_outer,\
    \ c,\n        cq.Vector(0, 0, 0), cq.Vector(0, 0, 1)\n    )\n    mid_cyl = cq.Solid.makeCylinder(\n\
    \        r_outer, p.wheel_w - 2.0 * c,\n        cq.Vector(0, 0, c), cq.Vector(0,\
    \ 0, 1)\n    )\n    top_cone = cq.Solid.makeCone(\n        r_outer, r_outer -\
    \ c, c,\n        cq.Vector(0, 0, p.wheel_w - c), cq.Vector(0, 0, 1)\n    )\n \
    \   solid = bot_cone.fuse(mid_cyl).fuse(top_cone)\n    body = cq.Workplane(\"\
    XY\").newObject([solid])\n\n    # Through-hole for bottom outer-race retaining\
    \ lip\n    thru_hole = (\n        cq.Workplane(\"XY\")\n        .circle(p.bottom_lip_id\
    \ / 2.0)\n        .extrude(p.wheel_w)\n    )\n    body = body.cut(thru_hole)\n\
    \n    # Bearing pocket for two stacked 608ZZ bearings\n    pocket = (\n      \
    \  cq.Workplane(\"XY\")\n        .workplane(offset=pocket_z0)\n        .circle(bore_d\
    \ / 2.0)\n        .extrude(p.wheel_w - pocket_z0)\n    )\n    body = body.cut(pocket)\n\
    \n    # Top lead-in chamfer to guide bearings during installation\n    if lead_in_h\
    \ > 0:\n        lead_cone = cq.Solid.makeCone(\n            bore_d / 2.0,\n  \
    \          bore_d / 2.0 + lead_in_h,\n            lead_in_h,\n            cq.Vector(0,\
    \ 0, pocket_z0 + pocket_h),\n            cq.Vector(0, 0, 1),\n        )\n    \
    \    body = body.cut(cq.Workplane(\"XY\").newObject([lead_cone]))\n\n    # Top\
    \ annular relief groove between hub and outer tire rim\n    groove = (\n     \
    \   cq.Workplane(\"XY\")\n        .workplane(offset=p.wheel_w - p.recess_depth)\n\
    \        .circle(p.rim_id / 2.0)\n        .circle(p.hub_od / 2.0)\n        .extrude(p.recess_depth)\n\
    \    )\n    body = body.cut(groove)\n\n    return body\n"
  print_orientation: Flat on the bed with the bottom retaining lip at z = 0 and the
    bearing pocket opening upward (+Z); requires zero supports.
  use_orientation: Mounted vertically in the closet door roller bracket spinning on
    the horizontal M8 axle bolt.
- id: spacer_bottom
  role: final
  material: PLA
  code: "def build(p):\n    h = p.bottom_lip_t + p.spacer_protrusion\n    return (\n\
    \        cq.Workplane(\"XY\")\n        .circle(p.spacer_od / 2.0)\n        .circle(p.bolt_clearance_d\
    \ / 2.0)\n        .extrude(h)\n    )\n"
  print_orientation: Flat on the bed (z = 0).
  use_orientation: Inserted into the bottom (z = 0) opening of the wheel against the
    lower 608ZZ bearing inner race.
- id: spacer_top
  role: final
  material: PLA
  code: "def build(p):\n    top_recess = p.wheel_w - (p.bottom_lip_t + p.bearing_count\
    \ * p.bearing_w)\n    h = top_recess + p.spacer_protrusion\n    return (\n   \
    \     cq.Workplane(\"XY\")\n        .circle(p.spacer_od / 2.0)\n        .circle(p.bolt_clearance_d\
    \ / 2.0)\n        .extrude(h)\n    )\n"
  print_orientation: Flat on the bed (z = 0).
  use_orientation: Placed against the upper 608ZZ bearing inner race on the top (+Z)
    side of the wheel.
- id: bearing_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    bore_d = p.bearing_od + 2.0 * p.bearing_fit_clearance\n\
    \    return (\n        cq.Workplane(\"XY\")\n        .circle(p.coupon_od / 2.0)\n\
    \        .circle(bore_d / 2.0)\n        .extrude(p.bearing_w)\n    )\n"
  print_orientation: Flat on the bed (z = 0).
  use_orientation: Test ring to verify the 608ZZ press fit before printing the full
    wheel.
