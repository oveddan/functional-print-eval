- id: bearing_pocket_fit
  part: wheel
  feature: bearing_pocket
  relation: seats
  hardware: bearing_608
  clearance_mm: 0.05
  params:
  - bearing_od
  - bearing_w
  - bearing_count
  - bearing_fit_clearance
  - bottom_lip_t
  check:
    method: coupon
    ref: bearing_coupon
    description: Press one 608ZZ bearing into bearing_coupon to verify a snug press
      fit before printing the full wheel.
- id: bearing_outer_race_stop
  part: wheel
  feature: bottom_retaining_lip
  relation: supports
  hardware: bearing_608
  clearance_mm: null
  params:
  - bottom_lip_id
  - bottom_lip_t
  - bearing_od
  check:
    method: measure
    ref: null
    description: Verify the 18.6 mm lip supports the 608ZZ outer race while leaving
      clearance for the dust shield and inner race.
- id: spacer_bottom_clearance
  part: spacer_bottom
  feature: bolt_bore
  relation: clears
  hardware: bolt_m8
  clearance_mm: 0.15
  params:
  - bolt_d
  - bolt_clearance_d
  - spacer_od
  - bottom_lip_t
  - spacer_protrusion
  check:
    method: measure
    ref: null
    description: Verify the M8 bolt slides freely through spacer_bottom and the 11.0
      mm OD contacts only the 608ZZ inner race.
- id: spacer_top_clearance
  part: spacer_top
  feature: bolt_bore
  relation: clears
  hardware: bolt_m8
  clearance_mm: 0.15
  params:
  - bolt_d
  - bolt_clearance_d
  - spacer_od
  - spacer_protrusion
  check:
    method: measure
    ref: null
    description: Verify the M8 bolt slides freely through spacer_top and the 11.0
      mm OD contacts only the 608ZZ inner race.
- id: wheel_envelope
  part: wheel
  feature: outer_tire_rim
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - wheel_w
  - tire_edge_chamfer
  check:
    method: measure
    ref: null
    description: Measure outer diameter (50 mm) and rim width (16 mm) to confirm match
      with the old closet door wheel.
manual:
- n: '1'
  text: Print bearing_coupon first and press one 608ZZ bearing into it by hand on
    a flat surface to verify the 22.10 mm press-fit bore on your printer. Once confirmed,
    print wheel, spacer_bottom, and spacer_top (recommend 4-5 wall loops and 40%+
    infill for the wheel).
  parts:
  - bearing_coupon
  hardware:
  - bearing_608
  tool: null
- n: '2'
  text: Place the wheel flat on a sturdy table with the open bearing pocket facing
    up (+Z). Press the first 608ZZ bearing all the way down until its outer race seats
    against the internal 1.6 mm retaining shoulder, then press the second 608ZZ bearing
    in directly on top of the first until it sits 0.4 mm below the top rim face.
  parts:
  - wheel
  hardware:
  - bearing_608
  tool: null
- n: '3'
  text: Insert the taller spacer_bottom (2.4 mm thick) into the bottom opening of
    the wheel against the lower bearing's inner race, and place spacer_top (1.2 mm
    thick) against the upper bearing's inner race. Both spacers stand 0.8 mm proud
    of the 16 mm wheel faces so the outer rim cannot rub on the bracket or washers.
  parts:
  - wheel
  - spacer_bottom
  - spacer_top
  hardware: []
  tool: null
- n: '4'
  text: Slide the ISO 4762 M8x30 bolt (with M8 washers outside the spacers as space
    in your bracket allows) through the closet door bracket, spacers, and bearings,
    and secure it with the ISO 10511 M8 locknut. Tighten until snug; clamping force
    passes entirely through the inner races and spacers so the wheel spins freely.
  parts:
  - wheel
  - spacer_bottom
  - spacer_top
  hardware:
  - bolt_m8
  - washer_m8
  - nut_m8
  tool: 6 mm hex key and 13 mm wrench
