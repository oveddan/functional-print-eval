manual:
- n: '1'
  text: Print the wheel and the spacer in black PLA with 5 walls and 40% infill, with
    the wheel flat on the bed. Don't add supports. The pocket facing the bed is bridged
    by a thin disc across the centre.
  parts:
  - wheel
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: On the wheel, cut out the thin 0.4 mm disc across the centre hole. Push a
    craft knife through it from the pocket that faced up and cut round the edge of
    the 14 mm hole. Clean off any strings with the knife. Don't leave anything in
    the hole.
  parts:
  - wheel
  hardware: []
  tool: craft knife
- n: '3'
  text: Press one bearing into each side of the wheel until it is flush with the face.
    Press on the outer ring only. Use a vise with a flat board, or tap it with a mallet
    and a flat block.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '4'
  text: Slide the bolt through the bracket (a washer under the bolt head if the bracket
    needs one). Drop the 2 mm spacer into the web so it sits between the two inner
    races, and slide the wheel over the bolt.
  parts:
  - wheel
  - spacer
  hardware:
  - bolt
  - washer
  tool: null
- n: '5'
  text: Add the washer and the lock nut. Tighten until the inner races are clamped
    between the bracket and the washer, with no side play. The wheel must still spin
    freely. If the stack is too loose, add M8 washers on the bolt as shims.
  parts:
  - wheel
  hardware:
  - washer
  - locknut
  tool: 13 mm spanner
- n: '6'
  text: Spin the wheel by hand. It should turn smoothly and not wobble. Then refit
    the door on its track.
  parts:
  - wheel
  hardware: []
  tool: null
