  - spacer_clearance
  check:
    method: template
    ref: null
    description: The M8 bolt slides through the spacer by hand.
- id: c4
  part: spacer
  feature: length
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - wheel_w
  - bearing_w
  check:
    method: measure
    ref: null
