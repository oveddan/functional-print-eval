task: bearing-wheel
note: 'Changes from the first print: the 22.09 mm bearing seat printed snug and held
  a bearing upside down, so it is unchanged. The roof over the down-facing bearing
  pocket came out as loose loops with the hole partly closed. The 14 mm hole left
  that bridge as a ring with nothing under its inside edge. I added a 0.4 mm sacrificial
  disc across the hole at the pocket roof. The slicer now bridges a full 22 mm disc,
  which prints cleanly, and you cut the disc out with a knife (new manual step 2).
  The spacer is unchanged, since I haven''t heard how it came out. The track profile
  and bolt length are still unconfirmed. PLA creeps under steady load, so PETG would
  be better if the door is heavy.'
questions:
- text: 'What profile does your track have: a flat bar, a round rod or a V-groove?
    The tread is still flat with 1 mm chamfers. A V or U groove needs a matching groove
    on the tread.'
  answer: null
- text: How long is your M8 bolt, and how big is the gap in the bracket? I assumed
    about 50 mm. Bracket thickness plus 16 mm plus a washer and nut must fit on it.
  answer: null
- text: 'Spacer: how did it come out? Does the M8 bolt slide through it, and is it
    about 2 mm long?'
  answer: null
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel about 50 mm across
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel about 16 mm wide
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: user read about 22 mm; matches 608 nominal 22.0
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: 608 nominal width, not measured on these bearings
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: shank about 8 mm
  fit_clearance:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: 'kept: the 22.09 mm seat printed snug and held a bearing upside down'
  lip_bore:
    value: 14
    unit: mm
    kind: design
    source: design
    note: centre hole in the web; clears the inner race (about 12 mm OD) so only the
      outer races touch the wheel
  spacer_od:
    value: 11
    unit: mm
    kind: design
    source: design
    note: must stay below the 12 mm inner race OD and below lip_bore
  spacer_clearance:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: added to bolt_d for the spacer bore
  edge_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: chamfer on tread edges
  membrane_t:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: thin sacrificial disc across the centre hole at the roof of the down-facing
      pocket, so the 22 mm bridge prints as a full disc; you cut it out after printing
  coupon_od:
    value: 32
    unit: mm
    kind: design
    source: design
    note: test ring outer diameter
  coupon_depth:
    value: 3
    unit: mm
    kind: design
    source: design
    note: pocket depth in the test ring
parts:
- id: wheel
  role: final
  material: PLA (black), 5 walls, 40% gyroid infill
  code: "def build(p):\n    w = cq.Workplane('XY').circle(p.wheel_od/2).extrude(p.wheel_w)\n\
    \    w = w.edges().chamfer(p.edge_chamfer)\n    pd = p.bearing_od + p.fit_clearance\n\
    \    low = cq.Workplane('XY').circle(pd/2).extrude(p.bearing_w)\n    up = cq.Workplane('XY').workplane(offset=p.wheel_w\
    \ - p.bearing_w).circle(pd/2).extrude(p.bearing_w)\n    bore = cq.Workplane('XY').circle(p.lip_bore/2).extrude(p.wheel_w)\n\
    \    w = w.cut(low).cut(up).cut(bore)\n    membrane = cq.Workplane('XY').workplane(offset=p.bearing_w).circle(p.lip_bore/2\
    \ + 0.5).extrude(p.membrane_t)\n    return w.union(membrane)\n"
  print_orientation: Flat on the bed with the axle vertical. One bearing pocket faces
    down onto the bed and the other faces up. A thin 0.4 mm sacrificial disc closes
    the centre hole at the roof of the down-facing pocket. The full 22 mm disc bridges
    cleanly, and you cut the disc out afterwards.
  use_orientation: Axle horizontal, rolling on the rail
- id: spacer
  role: final
  material: PLA (black)
  code: "def build(p):\n    L = p.wheel_w - 2*p.bearing_w\n    return (cq.Workplane('XY').circle(p.spacer_od/2).circle((p.bolt_d\
    \ + p.spacer_clearance)/2).extrude(L))\n"
  print_orientation: Flat on the bed (ring)
  use_orientation: On the bolt, between the two bearing inner races, inside the wheel
    web
- id: fit-coupon
  role: coupon
  material: PLA (black)
  code: "def build(p):\n    pd = p.bearing_od + p.fit_clearance\n    h = p.coupon_depth\
    \ + 1\n    r = cq.Workplane('XY').circle(p.coupon_od/2).extrude(h)\n    pocket\
    \ = cq.Workplane('XY').workplane(offset=h - p.coupon_depth).circle(pd/2).extrude(p.coupon_depth)\n\
    \    hole = cq.Workplane('XY').circle(p.lip_bore/2).extrude(h)\n    return r.cut(pocket).cut(hole)\n"
  print_orientation: Flat on the bed, pocket facing up
  use_orientation: 'Test only: press a 608 bearing into it'
