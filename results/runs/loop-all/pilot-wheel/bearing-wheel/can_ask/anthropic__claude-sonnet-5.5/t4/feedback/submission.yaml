criteria:
- id: c1
  part: wheel
  feature: bearing pockets
  relation: contains
  hardware: null
  clearance_mm: null
  params:
  - bearing_od
  - pocket_clear
  check:
    method: coupon
    ref: fit_coupon
    description: Press a 608 bearing into the coupon pocket. It should need firm thumb
