  params:
  - web_bore
  - bolt_d
  - membrane_t
  check:
    method: measure
    ref: null
    description: After the membrane is removed, the bolt and bearing inner races pass
      through the 14 mm web bore without touching it.
- id: c3
  part: wheel
  feature: pocket depth
  relation: seats
  hardware: bearing
  clearance_mm: null
  params:
  - pocket_depth
  - bearing_w
  - wheel_w
  check:
    method: measure
    ref: null
    description: With both bearings pressed in, each sticks out about 0.5 mm. The
      wheel face doesn't touch the washers or the bracket.
manual:
- n: '1'
  text: 'Print the wheel in black PLA with 5 walls and 25% or more infill, flat on
    the bed. You don''t need supports. The 0.4 mm disc inside the center hole is deliberate:
    it lets the 22 mm pocket roof print as a clean bridge.'
  parts:
  - wheel
  hardware: []
  tool: null
- n: '2'
  text: Remove the thin membrane disc from the center bore. Push a knife tip or a
    6 mm drill through it from the open pocket side, then clean the edge. The 14 mm
    bore should then be fully open. Trim any strings from the bridge underside in
    the lower pocket.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '3'
  text: Press one bearing into each face of the wheel, pushing on the outer ring only.
    Use a flat block and a gentle squeeze in a vise, or tap it with a mallet. Each
    bearing should stick out about 0.5 mm.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '4'
  text: Put a washer on the M8 bolt. Pass the bolt through the bearings and the wheel.
    Put the second washer on the other side. Mount the bolt in the door bracket. The
    washers must touch only the bearing inner races, not the plastic.
  parts:
  - wheel
  hardware:
  - bolt
  - washer
  - bearing
  tool: null
- n: '5'
  text: Tighten the lock nut until the bearings are clamped between the washers and
    the bracket. The wheel should spin freely. Hang the door and check that the wheel
    rides on the track.
  parts: []
  hardware:
  - locknut
  tool: null
