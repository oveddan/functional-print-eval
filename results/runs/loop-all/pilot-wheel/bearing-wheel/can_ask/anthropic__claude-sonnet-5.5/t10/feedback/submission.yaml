task: bearing-wheel
note: 'Change from round 1: the wheel is now two 8 mm halves printed joining-face
  down. This removes the 22 mm bridge over the bottom bearing pocket that printed
  badly (loose loops, hole partly closed). The halves are joined with 4 M3x12 screws
  and nuts. The bearing pocket stays at 22.09 mm, which your coupon showed is a snug
  press fit. The spacers are unchanged. PLA can creep under a heavy door, so check
  the wheel after a few weeks. PETG would be better if you can print it.'
questions:
- text: 'What profile is the track: flat, V, or a round groove? I still assumed a
    plain flat tread.'
  answer: null
- text: How wide is the free gap in the bracket, and how thick is the metal? I still
    assumed an M8x50 bolt.
  answer: null
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel about 50 mm across
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel about 16 mm wide; now two 8 mm halves
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: measured about 22; 608 nominal 22.000
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: measured about 7; 608 nominal 7
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: M8 shank measured about 8
  pocket_clearance:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: 'Printed 22.09 mm seat on your coupon: bearing goes in snug and holds upside
      down. 21.99 would not go in, 22.19 was looser. Kept at 0.1.'
  web_bore:
    value: 13
    unit: mm
    kind: design
    source: design
    note: hole through each 1 mm web; clears the 608 inner race shoulder (~12 mm)
  center_spacer_len:
    value: 2.2
    unit: mm
    kind: design
    source: design
    note: total web (2 mm, 1 mm per half) + 0.2 so inner races sit just off the web
  center_spacer_od:
    value: 10
    unit: mm
    kind: design
    source: design
    note: ''
  end_spacer_od:
    value: 11
    unit: mm
    kind: design
    source: design
    note: inside the inner race face so washer/bracket never touches the spinning
      outer race
  end_spacer_len:
    value: 2
    unit: mm
    kind: design
    source: design
    note: ''
  spacer_bolt_clearance:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: ''
  tread_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: chamfer only on the outer face edge of each half
  bolt_len:
    value: 50
    unit: mm
    kind: hardware
    source: guessed
    note: bracket gap/thickness unknown; stack 20.2 mm + 2 washers 3.2 + lock nut
      8 = 31.4 mm
  washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 nut height, for the join screws
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  m3_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  m3_head_d:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  m3_head_h:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  screw_circle_r:
    value: 17.5
    unit: mm
    kind: design
    source: design
    note: radius of the 4 M3 join screws, in the rim between the bearing pocket (r
      11) and the tread (r 25)
  screw_hole_clear:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: added to M3 diameter for through holes
  head_cb_clear:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: added to M3 head diameter for counterbore
  nut_pocket_clear:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: added to nut across-flats and height for the hex pocket
  coupon_h:
    value: 4
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_pocket_depth:
    value: 3
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: wheel_a
  role: final
  material: PLA (black), 4 perimeters, 30% gyroid infill
  code: "def build(p):\n    h = p.wheel_w/2\n    r = p.wheel_od/2\n    web = h - p.bearing_w\n\
    \    pd = p.bearing_od + p.pocket_clearance\n    R = p.screw_circle_r\n    pts\
    \ = [(R, 0), (0, R), (-R, 0), (0, -R)]\n    body = cq.Workplane('XY').circle(r).extrude(h).faces('>Z').chamfer(p.tread_chamfer)\n\
    \    pocket = cq.Workplane('XY').workplane(offset=web).circle(pd/2).extrude(p.bearing_w\
    \ + 1)\n    bore = cq.Workplane('XY').circle(p.web_bore/2).extrude(h)\n    holes\
    \ = cq.Workplane('XY').pushPoints(pts).circle((p.m3_d + p.screw_hole_clear)/2).extrude(h)\n\
    \    cb = (cq.Workplane('XY').workplane(offset=h - p.m3_head_h - 0.2)\n      \
    \    .pushPoints(pts).circle((p.m3_head_d + p.head_cb_clear)/2).extrude(p.m3_head_h\
    \ + 1.2))\n    return body.cut(pocket).cut(bore).cut(holes).cut(cb)\n"
  print_orientation: flat joining face (the web side) on the bed, bearing pocket opening
    upward. Nothing needs bridging.
  use_orientation: one half of the wheel; joined face to face with wheel_b, axis along
    the bolt
- id: wheel_b
  role: final
  material: PLA (black), 4 perimeters, 30% gyroid infill
  code: "def build(p):\n    h = p.wheel_w/2\n    r = p.wheel_od/2\n    web = h - p.bearing_w\n\
    \    pd = p.bearing_od + p.pocket_clearance\n    R = p.screw_circle_r\n    pts\
    \ = [(R, 0), (0, R), (-R, 0), (0, -R)]\n    body = cq.Workplane('XY').circle(r).extrude(h).faces('>Z').chamfer(p.tread_chamfer)\n\
    \    pocket = cq.Workplane('XY').workplane(offset=web).circle(pd/2).extrude(p.bearing_w\
    \ + 1)\n    bore = cq.Workplane('XY').circle(p.web_bore/2).extrude(h)\n    holes\
    \ = cq.Workplane('XY').pushPoints(pts).circle((p.m3_d + p.screw_hole_clear)/2).extrude(h)\n\
    \    nd = (p.nut_af + p.nut_pocket_clear) / 0.8660254\n    nd_depth = p.nut_h\
    \ + p.nut_pocket_clear\n    nuts = (cq.Workplane('XY').workplane(offset=h - nd_depth)\n\
    \            .pushPoints(pts).polygon(6, nd).extrude(nd_depth + 1))\n    return\
    \ body.cut(pocket).cut(bore).cut(holes).cut(nuts)\n"
  print_orientation: flat joining face (the web side) on the bed, bearing pocket opening
    upward. Nothing needs bridging.
  use_orientation: other half of the wheel; joined face to face with wheel_a
- id: spacer_center
  role: final
  material: PLA (black)
  code: "def build(p):\n    return (cq.Workplane('XY').circle(p.center_spacer_od/2)\n\
    \            .circle((p.bolt_d+p.spacer_bolt_clearance)/2).extrude(p.center_spacer_len))\n"
  print_orientation: flat on bed, tube axis vertical
  use_orientation: on the bolt between the two bearings' inner races, inside the wheel
    web
- id: spacer_end
  role: final
  material: PLA (black) - print 2 copies
  code: "def build(p):\n    return (cq.Workplane('XY').circle(p.end_spacer_od/2)\n\
    \            .circle((p.bolt_d+p.spacer_bolt_clearance)/2).extrude(p.end_spacer_len))\n"
  print_orientation: flat on bed, tube axis vertical
  use_orientation: on the bolt, one each side outside the bearings, against the inner
    races
- id: fit_coupon
  role: coupon
  material: PLA (black)
  code: "def build(p):\n    pitch = p.bearing_od + 8\n    plate = cq.Workplane('XY').rect(pitch*3,\
    \ p.bearing_od+6).extrude(p.coupon_h)\n    for i, d in enumerate((-0.1, 0.0, 0.1)):\n\
    \        x = (i-1)*pitch\n        pk = (cq.Workplane('XY').workplane(offset=p.coupon_h-p.coupon_pocket_depth)\n\
    \              .center(x, 0).circle((p.bearing_od+p.pocket_clearance+d)/2)\n \
    \             .extrude(p.coupon_pocket_depth))\n        plate = plate.cut(pk)\n\
    \    return plate\n"
  print_orientation: flat on bed, pockets open upward
  use_orientation: test piece only (already printed; the 22.09 mm pocket was the right
    fit)
