manual:
- n: '1'
  text: Print wheel_a and wheel_b with the flat joining face down (pocket opening
    up, no supports), 4 perimeters, about 30% infill. Print 1 spacer_center and 2
    spacer_end flat on the bed.
  parts:
  - wheel_a
  - wheel_b
  - spacer_center
  - spacer_end
  hardware: []
  tool: null
- n: '2'
  text: Press one 608 bearing into the pocket of each wheel half until it bottoms
    out. This is the fit you tested on the coupon. Push with flat, even pressure on
    the outer race (a vise with flat blocks works). Don't hammer.
  parts:
  - wheel_a
  - wheel_b
  hardware:
  - bearing
  tool: null
- n: '3'
  text: Drop an M3 nut into each of the four hex pockets in wheel_b.
  parts:
  - wheel_b
  hardware:
  - join_nut
  tool: null
- n: '4'
  text: Put the center spacer in the web bore of wheel_b. Lay wheel_a on wheel_b,
    joining faces together, bolt-hole circles lined up. Push an M3x12 screw into each
    counterbore, through both halves and into the nut. Tighten the 4 screws evenly
    until the halves are firmly together. Don't overtighten, because PLA can crack.
  parts:
  - wheel_a
  - wheel_b
  - spacer_center
  hardware:
  - join_screw
  - join_nut
  tool: 2.5 mm hex key
- n: '5'
  text: Check that the M8 bolt slides through the bearings and spacer and the wheel
    spins freely.
  parts: []
  hardware:
  - bolt
  tool: null
- n: '6'
  text: 'Mount: put an end spacer on each side of the wheel against the bearing inner
    races. Pass the bolt through the bracket with a washer on each side of the bracket,
    with the wheel stack in the mounting position. Tighten the lock nut until there
    is no side play. The wheel must still spin freely by hand. Back off a little if
    it drags.'
  parts:
  - spacer_end
  hardware:
  - bolt
  - washer
  - locknut
  tool: 13 mm spanner and 6 mm hex key
- n: '7'
  text: Hang the door and test it. If the wheel rubs the bracket, add a washer on
    the bolt or reprint the end spacers a little longer.
  parts: []
  hardware: []
  tool: null
