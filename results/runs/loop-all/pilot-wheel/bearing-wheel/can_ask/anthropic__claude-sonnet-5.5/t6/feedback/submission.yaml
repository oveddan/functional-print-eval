parts:
- id: wheel-half-a
  role: final
  material: PLA
  code: "def build(p):\n    r = p.wheel_od / 2.0\n    h = p.wheel_w / 2.0\n    R =\
    \ p.screw_circle_r\n    pts = [(R, 0), (0, R), (-R, 0), (0, -R)]\n    body = cq.Workplane('XY').circle(r).extrude(h)\n\
    \    body = body.faces('>Z').edges().chamfer(p.edge_chamfer)\n    pd = p.bearing_od\
    \ + p.fit_clearance\n    pocket = cq.Workplane('XY').workplane(offset=h - p.bearing_w).circle(pd\
    \ / 2.0).extrude(p.bearing_w)\n    thru = cq.Workplane('XY').circle(p.web_hole_d\
    \ / 2.0).extrude(h)\n    sh = cq.Workplane('XY').pushPoints(pts).circle((p.screw_d\
    \ + p.screw_clearance) / 2.0).extrude(h)\n    cb = cq.Workplane('XY').workplane(offset=h\
    \ - p.head_recess_depth).pushPoints(pts).circle((p.screw_head_d + p.screw_clearance)\
    \ / 2.0).extrude(p.head_recess_depth)\n    return body.cut(pocket).cut(thru).cut(sh).cut(cb)\n"
  print_orientation: Mating face (the 1 mm floor) down on the bed, bearing pocket
    facing up. The pocket has no roof, so nothing bridges over it.
  use_orientation: Axis horizontal. The floor faces half B. The screw heads sit in
    the recesses on the outer face.
- id: wheel-half-b
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    r = p.wheel_od / 2.0\n    h = p.wheel_w\
    \ / 2.0\n    R = p.screw_circle_r\n    pts = [(R, 0), (0, R), (-R, 0), (0, -R)]\n\
    \    body = cq.Workplane('XY').circle(r).extrude(h)\n    body = body.faces('>Z').edges().chamfer(p.edge_chamfer)\n\
    \    pd = p.bearing_od + p.fit_clearance\n    pocket = cq.Workplane('XY').workplane(offset=h\
    \ - p.bearing_w).circle(pd / 2.0).extrude(p.bearing_w)\n    thru = cq.Workplane('XY').circle(p.web_hole_d\
    \ / 2.0).extrude(h)\n    sh = cq.Workplane('XY').pushPoints(pts).circle((p.screw_d\
    \ + p.screw_clearance) / 2.0).extrude(h)\n    hexd = (p.nut_af + p.screw_clearance)\
    \ / math.cos(math.radians(30))\n    nut = cq.Workplane('XY').workplane(offset=h\
    \ - p.nut_pocket_depth).pushPoints(pts).polygon(6, hexd).extrude(p.nut_pocket_depth)\n\
    \    return body.cut(pocket).cut(thru).cut(sh).cut(nut)\n"
  print_orientation: Mating face (the 1 mm floor) down on the bed, bearing pocket
    facing up. The pocket has no roof, so nothing bridges over it.
  use_orientation: Axis horizontal. The floor faces half A. The nuts sit in the hex
    pockets on the outer face.
- id: bearing-fit-coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    pd = p.bearing_od + p.fit_clearance\n    return cq.Workplane('XY').circle(p.coupon_od\
    \ / 2.0).circle(pd / 2.0).extrude(p.coupon_h)\n"
  print_orientation: Flat on the bed.
  use_orientation: Test piece only. It already passed (22.09 mm seat, snug), so you
    can skip printing it again.
