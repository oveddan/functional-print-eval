task: bearing-wheel
note: 'Change: the wheel is now two 8 mm halves, each printed with its bearing pocket
  facing up. The roof over the pocket printed badly before because the first design
  bridged 22 mm over a pocket. Halves are joined by 4 M3x12 screws and M3 nuts. The
  22.09 mm bearing seat was snug and held upside down, so I left it unchanged. The
  bracket gap, bolt length and rail shape are still unknown.'
questions:
- text: What is the gap between the bracket arms, and how long is your bolt? The design
    assumes at least 17.2 mm and about 50 mm.
  answer: null
- text: What shape is the rail? The tread is flat. A V or round rail needs a groove.
  answer: null
