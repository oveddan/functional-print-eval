manual:
- n: '1'
  text: 'Print wheel-half-a and wheel-half-b. Each one sits on the bed with its flat
    mating face down and its bearing pocket facing up. The pockets have no roof, so
    the bridging problem is gone. Use 4 or more walls and 30% or more infill. Skip
    the coupon: that fit already passed.'
  parts:
  - wheel-half-a
  - wheel-half-b
  hardware: []
  tool: null
- n: '2'
  text: Clean the pocket edges with a knife if the first layer flared. Press one 608
    bearing into the pocket of each half until it sits on the floor. Push on the outer
    ring only.
  parts:
  - wheel-half-a
  - wheel-half-b
  hardware: []
  tool: null
- n: '3'
  text: Drop an M3 nut into each of the 4 hex pockets of half B.
  parts:
  - wheel-half-b
  hardware:
  - m3nut
  tool: null
- n: '4'
  text: Put the two halves together with the floors touching and the bearings on the
    outside. Line up the 4 screw holes. Put an M3x12 screw in each head recess of
    half A and tighten it into the nut. Tighten the screws evenly and don't overtighten.
    The screw tips stay inside the nut pockets.
  parts:
  - wheel-half-a
  - wheel-half-b
  hardware:
  - m3screw
  - m3nut
  tool: 2.5 mm hex key
- n: '5'
  text: Check that the wheel spins freely on both bearings. The inner rings must not
    touch the plastic.
  parts:
  - wheel-half-a
  - wheel-half-b
  hardware: []
  tool: null
- n: '6'
  text: 'Stack on the M8 bolt: one washer, the wheel, then the second washer. Put
    the bolt through the bracket and tighten the lock nut. The washers touch only
    the bearing inner rings, so the wheel keeps spinning. The wheel with washers needs
    about 17.2 mm between the bracket arms. If your gap is smaller, tell me. The wheel
    without washers is 16 mm wide.'
  parts:
  - wheel-half-a
  - wheel-half-b
  hardware:
  - bolt
  - washers
  - locknut
  tool: 13 mm spanner
