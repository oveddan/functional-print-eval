manual:
- n: '1'
  text: Print the wheel and the spacer in black PLA, with the wheel's flat face down.
    Use 4 walls and 30% or more infill, and no supports. The wheel's bottom pocket
    will have a thin closed skin across its ceiling. That's intended.
  parts:
  - wheel
  - spacer
  hardware: []
  tool: null
- n: '2'
  text: Punch out the thin skin (0.4 mm) in the centre of the wheel. Push a screwdriver
    or the bolt through from the top pocket side, and clean up the edge with a knife.
    You should end up with a clean 10 mm hole through the web.
  parts:
  - wheel
  hardware:
  - bolt
  tool: null
- n: '3'
  text: Press one bearing into each face of the wheel until it stops against the centre
    web. Press on the outer ring only, using a flat board or a vise. Each bearing
    should stick out about 0.5 mm.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '4'
  text: Drop the spacer into the wheel's centre bore. It sits between the two bearings'
    inner rings.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '5'
  text: Put an M8 washer on the bolt, then slide the bolt through the bearings and
    spacer. Put the second washer on the other side. The washers must touch only the
    bearings' inner rings, not the wheel body.
  parts:
  - wheel
  - spacer
  hardware:
  - bolt
  - washer
  - bearing
  tool: null
- n: '6'
  text: Fit the assembly into the door hanger bracket, pass the bolt through the bracket
    holes and tighten the lock nut. The wheel should spin freely with no rubbing on
    the bracket. Don't over-tighten the nut.
  parts: []
  hardware:
  - bolt
  - locknut
  tool: null
