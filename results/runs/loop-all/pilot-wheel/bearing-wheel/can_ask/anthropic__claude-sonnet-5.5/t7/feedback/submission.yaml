task: bearing-wheel
note: Revision 2. The bearing seat is unchanged (22.09 mm passed on both the wheel
  and the coupon). The fix is a 0.4 mm skin across the web bore above the bottom pocket.
  The earlier open 10 mm hole in the 22 mm bridge printed as loose loops and partly
  closed. Bolt length, rail profile and bracket gap are still unmeasured.
questions:
- text: What is the length of your M8 bolt under the head? I assumed M8x50 as a placeholder.
    You need about 20 mm for the wheel stack, plus the bracket thickness, plus the
    nut.
  answer: null
- text: What is the rail profile (flat, rounded or V)? I couldn't get this measured,
    so the tread is flat with 1 mm chamfers.
  answer: null
- text: What is the gap between the bracket arms? I couldn't get this measured. The
    stack is about 17 mm of wheel and bearings plus 2 washers (about 20.2 mm total).
    If the gap is tighter, drop the washers or add spacers.
  answer: null
- text: How did the spacer come out? If it's hard to say, check that the M8 bolt slides
    through it and that it measures 3 mm long.
  answer: null
