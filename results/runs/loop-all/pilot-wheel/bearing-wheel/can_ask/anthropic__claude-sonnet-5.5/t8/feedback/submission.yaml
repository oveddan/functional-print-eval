task: bearing-wheel
note: 'Change from the first version: the lower bearing pocket''s roof printed badly
  because it had to bridge the whole 22 mm pocket. The web opening is now a 45 degree
  cone: a 1.5 mm ledge at 19 mm dia carries the lower bearing, and the cone narrows
  to a 16 mm dia lip under the upper bearing. The roof needs no bridge. The bearing
  seat size (22.09 mm, snug) is unchanged. The spacers are unchanged. The bracket
  gap and track profile were still not measured, so the 1.0 mm end spacers are still
  a guess and the rim is flat. PLA can creep or crack under a heavy door, so PETG
  or nylon would be tougher if you have it.'
questions:
- text: What is the gap between the bracket arms? It could not be measured. I assumed
    18 mm and set spacer_t to match.
  answer: null
- text: What is the shape of the track the wheel runs on (flat, V or round)? It could
    not be measured, so the rim is flat with a 1 mm chamfer.
  answer: null
- text: How long is the bolt, and does it have a nut? Neither was given. M8x40 is
    a placeholder.
  answer: null
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel about 50 mm across
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel about 16 mm wide
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: user measured about 22; matches 608 nominal
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: user measured about 7
  bolt_d:
    value: 8
    unit: mm
    kind: world
    source: measured
    note: user measured M8 shank about 8
  fit_clearance:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: diametral clearance. The coupon and wheel seats printed 22.09 and were snug,
      which is right, so this is unchanged.
  bolt_clear:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: extra diameter on spacer bores over the bolt
  web_hole_d:
    value: 16
    unit: mm
    kind: design
    source: design
    note: diameter of the small lip at the top of the web opening. It is larger than
      the inner race (about 12 mm), so only the outer race touches the web.
  ledge_d:
    value: 19
    unit: mm
    kind: design
    source: design
    note: diameter where the cone starts at the bottom pocket's roof. The ring from
      here out to the pocket wall is the seat for the lower bearing's outer race (shoulder
      about 19 mm). The cone then slopes at 45 degrees, so the roof prints without
      a bridge.
  mid_spacer_od:
    value: 10.5
    unit: mm
    kind: design
    source: design
    note: touches inner races only, must be under web_hole_d and over the bearing
      bore
  end_spacer_od:
    value: 12
    unit: mm
    kind: design
    source: design
    note: touches inner race only
  spacer_t:
    value: 1
    unit: mm
    kind: world
    source: guessed
    note: 'UNKNOWN: bracket gap could not be measured. Gap needed = wheel_w + 2*spacer_t
      = 18 mm. Change this to (gap - 16)/2.'
  edge_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_od:
    value: 32
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_h:
    value: 4
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_pocket_depth:
    value: 3
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: wheel
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    pocket_d = p.bearing_od + p.fit_clearance\n    w = cq.Workplane('XY').circle(p.wheel_od/2).extrude(p.wheel_w)\n\
    \    w = w.edges().chamfer(p.edge_chamfer)\n    bottom = cq.Workplane('XY').circle(pocket_d/2).extrude(p.bearing_w)\n\
    \    top = cq.Workplane('XY').workplane(offset=p.wheel_w - p.bearing_w).circle(pocket_d/2).extrude(p.bearing_w)\n\
    \    # web opening: 45 degree cone from the ledge up to a small lip, so the roof\
    \ of the bottom pocket needs no bridge\n    z0 = p.bearing_w\n    z1 = p.wheel_w\
    \ - p.bearing_w\n    rl = p.ledge_d/2\n    rh = p.web_hole_d/2\n    zc = z0 +\
    \ (rl - rh)\n    pts = [(0, z0), (rl, z0), (rh, zc), (rh, z1 + 0.01), (0, z1 +\
    \ 0.01)]\n    cone = cq.Workplane('XZ').polyline(pts).close().revolve(360, (0,\
    \ 0, 0), (0, 1, 0))\n    return w.cut(bottom).cut(top).cut(cone)\n"
  print_orientation: flat on one face, axis vertical
  use_orientation: axis horizontal, along the bolt, rolling on its rim
- id: fit-coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    pocket_d = p.bearing_od + p.fit_clearance\n    c = cq.Workplane('XY').circle(p.coupon_od/2).extrude(p.coupon_h)\n\
    \    pocket = cq.Workplane('XY').workplane(offset=p.coupon_h - p.coupon_pocket_depth).circle(pocket_d/2).extrude(p.coupon_pocket_depth)\n\
    \    hole = cq.Workplane('XY').circle(p.web_hole_d/2).extrude(p.coupon_h)\n  \
    \  return c.cut(pocket).cut(hole)\n"
  print_orientation: flat, pocket opening up
  use_orientation: test only
- id: end_spacer
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    return (cq.Workplane('XY').circle(p.end_spacer_od/2).circle((p.bolt_d\
    \ + p.bolt_clear)/2).extrude(p.spacer_t))\n"
  print_orientation: flat (print 2)
  use_orientation: on the bolt between each bracket arm and a bearing's inner race
- id: mid_spacer
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    return (cq.Workplane('XY').circle(p.mid_spacer_od/2).circle((p.bolt_d\
    \ + p.bolt_clear)/2).extrude(p.wheel_w - 2*p.bearing_w))\n"
  print_orientation: flat
  use_orientation: on the bolt between the two bearings' inner races
