manual:
- n: '1'
  text: Your first fit coupon and wheel both gave a 22.09 mm seat that was snug and
    held a bearing, so the seat size is unchanged. You only need to reprint the wheel,
    because its web opening has changed. The end spacers and mid spacer are unchanged,
    so you can reuse the ones you printed if they came out fine.
  parts:
  - fit-coupon
  hardware:
  - bearing
  tool: null
- n: '2'
  text: Measure the empty gap between your bracket arms. The spacer thickness is (gap
    - 16 - 0.5) / 2, and I assumed 1.0 mm (an 18 mm gap). If your gap is different,
    change spacer_t and reprint the end spacers. If the gap is 17 mm or less, the
    wheel will not fit with spacers and you'd need a narrower wheel.
  parts:
  - end_spacer
  hardware: []
  tool: null
- n: '3'
  text: Reprint the wheel flat, with the same bed-side face down as before and no
    supports. The opening in the middle now narrows with a 45 degree cone, so the
    roof over the lower bearing pocket no longer needs a bridge. Use 4 or more walls
    and at least 40% infill. Check that the central opening printed clean and open
    before you go on.
  parts:
  - wheel
  - end_spacer
  - mid_spacer
  hardware: []
  tool: null
- n: '4'
  text: Press one bearing into each side of the wheel until it bottoms on its ledge.
    Use a vise or clamp with a flat block, and press on the outer race only.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '5'
  text: 'Put the bolt through the bracket arm, then in this order: an end spacer,
    the wheel and bearing stack with the mid spacer in the centre between the inner
    races, and the other end spacer. Pass the bolt through the other arm and tighten
    it. The wheel must spin freely by hand, with the bearings'' inner races clamped
    and the outer races not touching the bracket.'
  parts:
  - end_spacer
  - mid_spacer
  - wheel
  hardware:
  - bolt
  - bearing
  tool: null
