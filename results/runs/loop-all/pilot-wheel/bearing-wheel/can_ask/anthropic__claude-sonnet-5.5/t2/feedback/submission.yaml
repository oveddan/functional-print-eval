manual:
- n: '1'
  text: Print the wheel flat on the bed, 4 walls, about 25% infill, no supports. The
    pocket on the bed side now has a thin skin across its roof, so it prints as one
    solid bridge. Slow the bridges down if your slicer lets you (for example, bridge
    speed 20-30 mm/s).
  parts:
  - wheel
  hardware: []
  tool: null
- n: '2'
  text: Print the spacer. It's a small 11 mm tube, 2 mm long. If it came out badly,
    reprint it. It should slide freely on the bolt.
  parts:
  - spacer
  hardware: []
  tool: null
- n: '3'
  text: From the open side of the bed-side pocket, punch out the thin skin across
    the middle with a screwdriver or the bolt tip. Clean up the edge of the 12.5 mm
    hole with a knife. The bore must be clear before you fit any bearing.
  parts:
  - wheel
  hardware: []
  tool: screwdriver and craft knife
- n: '4'
  text: Press one bearing into each side of the wheel until it is flush with the face.
    The fit was already snug, so use firm thumb pressure on the outer ring with a
    flat block. Don't push on the inner race.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '5'
  text: Slide the bolt through the washer, then through the first bearing, the spacer
    and the second bearing. Check that the spacer sits between the two inner races.
  parts:
  - wheel
  - spacer
  hardware:
  - bolt
  - washer_head
  - bearing
  tool: null
- n: '6'
  text: Mount the bolt through the door bracket and fit the lock nut. Tighten until
    there is no side play but the wheel still spins freely. Spin it by hand to check,
    then rehang the door.
  parts:
  - wheel
  hardware:
  - bolt
  - locknut
  tool: 13 mm spanner and 6 mm hex key
