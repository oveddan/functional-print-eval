task: bearing-wheel
note: Revision 2. In the first print the roof over the pocket came out as loose loops,
  and the 12 mm centre hole was partly closed. The cause is a 12 mm hole in a 2 mm
  web that bridges a 22 mm pocket. In this revision the centre hole is 18.5 mm, which
  leaves a 1.8 mm ledge under each outer race. That is a short overhang, not a bridge.
  The bearings still seat on the ledge, and the inner races are still clamped by the
  bolt through the 2 mm spacer. The fit_clear value and everything else are unchanged.
  The bearing fit hasn't been reported, so the coupon is still needed.
questions:
- text: What is the clear gap in the bracket, and how long is your M8 bolt?
  answer: Couldn't measure it. The design needs about 18 mm (16 mm wheel plus two
    1 mm washers). If the gap is wider, add washers to take up the slack. If it's
    narrower, drop the washers and check that the bracket doesn't rub the wheel rim.
    The M8x50 bolt in the hardware list is a placeholder, so use your own bolt as
    long as it passes through both bracket arms and the nut.
- text: Does the track have a groove or edge guide that the wheel must match?
  answer: Couldn't measure it. The wheel has a plain flat rim. If the rail needs a
    groove, this won't track correctly.
- text: How did the bearing seat fit in the first print?
  answer: Not reported. fit_clear is unchanged at 0.15 mm, so the coupon is still
    the check.
