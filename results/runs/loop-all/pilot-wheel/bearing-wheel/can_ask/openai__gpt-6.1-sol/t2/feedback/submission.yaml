task: bearing-wheel
note: 'Geometry unchanged. User reports printed coupon and wheel seats measure 22.19
  mm; bearings insert and remain seated upside down. Spacer dimensions/contact remain
  unverified. Unloaded-fit prototype only: no load rating. Track profile, bracket
  gap, existing bolt length and door load remain unknown. Flat tread is provisional.
  Complete spacer stack is 20 mm before washers/bracket walls.'
questions:
- text: Bearing fit after printing?
  answer: 'Coupon and wheel: reported 22.19 mm seats accept bearings and hold them
    upside down.'
- text: Spacer verification?
  answer: Printed, but dimensions and inner-ring-only contact are unverified.
