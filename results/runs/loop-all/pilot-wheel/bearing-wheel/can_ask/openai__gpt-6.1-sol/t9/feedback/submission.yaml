manual:
- n: '1'
  text: Discard the failed one-piece wheel. Do not use an unsupported or partially
    closed bearing pocket. Secure the door independently before inspecting its mechanism;
    do not mount this prototype on it.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print seat_coupon pocket-up at 0.2 mm layers, 5 walls, solid infill, no supports.
    Inspect for a complete floor and clear central hole. Test each bearing by hand.
    If the result still cannot be assessed, stop before assembly; fit remains unknown.
  parts:
  - seat_coupon
  hardware:
  - bearings
  tool: null
- n: '3'
  text: 'Print wheel_half_a and wheel_half_b exactly pocket-up, with their flat mating
    faces on the bed: 6 walls, 6 top/bottom layers, 100% infill, no supports. Check
    the slicer preview: there must be no roof across either bearing pocket. Print
    all spacers solid, annular faces down.'
  parts:
  - wheel_half_a
  - wheel_half_b
  - inner_spacer
  - outer_spacer_a
  - outer_spacer_b
  hardware: []
  tool: null
- n: '4'
  text: Remove bed-edge burrs carefully so the two backing faces meet flat. Hold halves
    back-to-back, pockets facing outward; align rims and four holes. Install four
    M3x20 screws from half A's pocket side and four M3 nuts on half B's pocket side.
    Snug gently in a cross pattern while keeping rims aligned. Do not crush PLA. All
    nuts must fully engage.
  parts:
  - wheel_half_a
  - wheel_half_b
  hardware:
  - join_screws
  - join_nuts
  tool: Matching hex key and wrench
- n: '5'
  text: Seat one 608 by hand, insert inner_spacer through the other pocket, then seat
    the second 608. Bearing outside faces should be flush with the outside wheel faces.
    Check that the spacer contacts only inner races and fits the actual gap without
    lifting either bearing. If any fit cannot be verified, stop.
  parts:
  - wheel_half_a
  - wheel_half_b
  - inner_spacer
  hardware:
  - bearings
  tool: null
- n: '6'
  text: 'For unloaded bench testing only, stack on the selected M8x40: washer, outer_spacer_a,
    assembled wheel/bearings with inner_spacer, outer_spacer_b, washer, M8 lock nut.
    Do not substitute the existing bolt without measuring its length and confirming
    full nut engagement. Ensure washers and spacers do not touch shields or rotating
    wheel surfaces.'
  parts:
  - wheel_half_a
  - wheel_half_b
  - inner_spacer
  - outer_spacer_a
  - outer_spacer_b
  hardware:
  - bench_axle
  - bench_washers
  - bench_nut
  - bearings
  tool: null
- n: '7'
  text: Advance the axle lock nut only enough to remove loose play while holding the
    bolt. Do not apply normal M8 tightening torque to printed spacers. Nylon locking
    section must engage fully. Hand-turn the wheel without load; reject binding, rubbing,
    rocking, compressed spacers or shifting halves. Do not power-spin.
  parts:
  - wheel_half_a
  - wheel_half_b
  - inner_spacer
  - outer_spacer_a
  - outer_spacer_b
  hardware:
  - bench_axle
  - bench_nut
  tool: Matching hex key and wrench
- n: '8'
  text: This split construction addresses printing failure, not door strength or compatibility.
    PLA wheel/spacers can creep, and joining hardware adds width. Before a usable
    repair, establish the track/tread profile, load, bracket clearance, axle length
    and retention. Prefer a properly rated commercial roller for a weight-bearing
    door; any bearing-clamped load-bearing redesign needs a suitable precision metal
    spacer and validation.
  parts: []
  hardware: []
  tool: null
