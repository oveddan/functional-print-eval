parts:
- id: seat_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    h = p.bearing_w + p.coupon_floor\n    a = cq.Workplane('XY').circle(p.coupon_od/2).extrude(h)\n\
    \    a = a.cut(cq.Workplane('XY').circle(p.relief_d/2).extrude(h))\n    pocket\
    \ = cq.Workplane('XY').workplane(offset=p.coupon_floor).circle((p.bearing_od+p.seat_allowance)/2).extrude(p.bearing_w)\n\
    \    return a.cut(pocket)\n"
  print_orientation: Flat backing face at z=0, bearing pocket open upward. No supports
    or bridging.
  use_orientation: Fit gauge only; same seat geometry as each wheel half.
- id: wheel_half_a
  role: final
  material: PLA
  code: "def build(p):\n    h = p.wheel_w/2\n    floor = h-p.bearing_w\n    if floor\
    \ <= 0:\n        raise ValueError('Wheel half must exceed bearing width')\n  \
    \  a = cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n    a = a.edges('>Z').chamfer(p.tread_chamfer)\n\
    \    a = a.cut(cq.Workplane('XY').circle(p.relief_d/2).extrude(h))\n    pocket\
    \ = cq.Workplane('XY').workplane(offset=floor).circle((p.bearing_od+p.seat_allowance)/2).extrude(p.bearing_w)\n\
    \    a = a.cut(pocket)\n    r = p.join_radius\n    holes = cq.Workplane('XY').pushPoints([(r,0),(0,r),(-r,0),(0,-r)]).circle(p.join_hole_d/2).extrude(h)\n\
    \    return a.cut(holes)\n"
  print_orientation: Flat mating/backing face at z=0; bearing pocket faces upward.
    No supports, no roof, no bridge.
  use_orientation: 'Invert this half for assembly: printed z=0 mating face becomes
    assembly z=8, printed z=8 pocket opening becomes assembly z=0.'
- id: wheel_half_b
  role: final
  material: PLA
  code: "def build(p):\n    h = p.wheel_w/2\n    floor = h-p.bearing_w\n    if floor\
    \ <= 0:\n        raise ValueError('Wheel half must exceed bearing width')\n  \
    \  a = cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n    a = a.edges('>Z').chamfer(p.tread_chamfer)\n\
    \    a = a.cut(cq.Workplane('XY').circle(p.relief_d/2).extrude(h))\n    pocket\
    \ = cq.Workplane('XY').workplane(offset=floor).circle((p.bearing_od+p.seat_allowance)/2).extrude(p.bearing_w)\n\
    \    a = a.cut(pocket)\n    r = p.join_radius\n    holes = cq.Workplane('XY').pushPoints([(r,0),(0,r),(-r,0),(0,-r)]).circle(p.join_hole_d/2).extrude(h)\n\
    \    return a.cut(holes)\n"
  print_orientation: Flat mating/backing face at z=0; bearing pocket faces upward.
    No supports or bridges.
  use_orientation: Translate upward by 8 mm for assembly; printed z=0 mating face
    meets half A at assembly z=8.
- id: inner_spacer
  role: final
  material: PLA
  code: "def build(p):\n    h = p.wheel_w-2*p.bearing_w\n    if h <= 0:\n        raise\
    \ ValueError('Positive spacer length required')\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.axle_d+p.axle_clearance)/2).extrude(h)\n"
  print_orientation: Annular face at z=0; print solid.
  use_orientation: Between bearing inner races, assembly z=7 to 9. Bench prototype
    only.
- id: outer_spacer_a
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.axle_d+p.axle_clearance)/2).extrude(p.outer_spacer_w)\n"
  print_orientation: Annular face on bed; print solid.
  use_orientation: Assembly z=-3 to 0.
- id: outer_spacer_b
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.axle_d+p.axle_clearance)/2).extrude(p.outer_spacer_w)\n"
  print_orientation: Annular face on bed; print solid.
  use_orientation: Assembly z=16 to 19.
