  - bearing_w
  - relief_d
  check:
    method: measure
    ref: null
    description: 'Inspect sliced preview before printing: no spanning roof over the
      pocket, no supports in pocket. Reject any loops, gaps or incomplete seat floors.'
- id: center_spacer_fit
  part: inner_spacer
