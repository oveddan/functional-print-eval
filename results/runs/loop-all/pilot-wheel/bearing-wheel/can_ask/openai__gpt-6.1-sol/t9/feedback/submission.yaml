task: bearing-wheel
note: 'Revision 2: replace the one-piece wheel with two bolted halves, printed pocket-up
  without internal roofs or bridges. Discard the failed wheel. Nominal tread remains
  50 mm diameter × 16 mm wide, but external joining screw heads/nuts increase the
  local axial envelope to approximately 21.4 mm. Bench-fit prototype ONLY: no door
  installation or load-bearing approval. Bearing fits and spacers remain unverified;
  do not infer a successful fit from the reported 22.24 mm seat dimension.'
questions:
- text: Do the bearings seat by hand without rocking in the new coupon?
  answer: null
- text: What are the track profile, supported load, bracket clearance and existing
    bolt length?
  answer: null
