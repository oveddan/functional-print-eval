parts:
- id: wheel_head_half
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    h=p.wheel_w/2\n    floor=h-p.bearing_w\n\
    \    if floor <= 0: raise ValueError('Insufficient bearing shoulder')\n    s=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n\
    \    s=s.cut(cq.Workplane('XY').circle(p.web_bore/2).extrude(h))\n    s=s.cut(cq.Workplane('XY').workplane(offset=floor).circle(p.seat_d/2).extrude(p.bearing_w))\n\
    \    for i in range(int(p.join_count)):\n        a=2*math.pi*i/p.join_count\n\
    \        x,y=p.join_radius*math.cos(a),p.join_radius*math.sin(a)\n        s=s.cut(cq.Workplane('XY').center(x,y).circle(p.join_clearance/2).extrude(h))\n\
    \        s=s.cut(cq.Workplane('XY').workplane(offset=p.head_seat_z).center(x,y).circle(p.head_pocket_d/2).extrude(h-p.head_seat_z))\n\
    \    return s"
  print_orientation: Flat mating face at z=0 on bed; bearing pocket and screw-head
    pockets open upward. No supports.
  use_orientation: Mate z=0 face to nut half's z=0 face. Axis shared; head half occupies
    assembled z=0..8.
- id: wheel_nut_half
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    h=p.wheel_w/2\n    floor=h-p.bearing_w\n\
    \    if floor <= 0: raise ValueError('Insufficient bearing shoulder')\n    s=cq.Workplane('XY').circle(p.wheel_d/2).extrude(h)\n\
    \    s=s.cut(cq.Workplane('XY').circle(p.web_bore/2).extrude(h))\n    s=s.cut(cq.Workplane('XY').workplane(offset=floor).circle(p.seat_d/2).extrude(p.bearing_w))\n\
    \    for i in range(int(p.join_count)):\n        a=2*math.pi*i/p.join_count\n\
    \        x,y=p.join_radius*math.cos(a),p.join_radius*math.sin(a)\n        s=s.cut(cq.Workplane('XY').center(x,y).circle(p.join_clearance/2).extrude(h))\n\
    \        s=s.cut(cq.Workplane('XY').workplane(offset=p.nut_seat_z).center(x,y).polygon(6,2*p.nut_pocket_af/math.sqrt(3)).extrude(h-p.nut_seat_z))\n\
    \    return s"
  print_orientation: Flat mating face at z=0 on bed; bearing and hex pockets open
    upward. No supports.
  use_orientation: Flip 180 degrees about X, align bolt holes and mate flat faces.
    Occupies assembled z=-8..0.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    h=p.wheel_w/2\n    floor=h-p.bearing_w\n    out=None\n\
    \    for i in range(3):\n        d=p.seat_d+(i-1)*p.coupon_step\n        x=i*(p.bearing_od+2*p.coupon_wall+3)\n\
    \        s=cq.Workplane('XY').center(x,0).circle((p.bearing_od+2*p.coupon_wall)/2).extrude(h)\n\
    \        s=s.cut(cq.Workplane('XY').center(x,0).circle(p.web_bore/2).extrude(h))\n\
    \        s=s.cut(cq.Workplane('XY').workplane(offset=floor).center(x,0).circle(d/2).extrude(p.bearing_w))\n\
    \        out=s if out is None else out.union(s)\n    return out"
  print_orientation: Three separate rings with flat shoulder undersides on bed; all
    bearing pockets open upward. No supports.
  use_orientation: Test only; increasing X gives 22.3, 22.5, 22.7 mm CAD seats at
    default settings.
- id: inner_spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.axle_clearance/2).extrude(p.wheel_w-2*p.bearing_w)"
  print_orientation: Annular face on bed.
  use_orientation: Between bearing inner rings; nominal 2 mm long.
- id: collar_left
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.axle_clearance/2).extrude(p.collar_l)"
  print_orientation: Annular face on bed.
  use_orientation: Between bracket-side washer and bearing inner ring.
- id: collar_right
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.axle_clearance/2).extrude(p.collar_l)"
  print_orientation: Annular face on bed.
  use_orientation: Between nut-side washer and bearing inner ring.
