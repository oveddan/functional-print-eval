task: bearing-wheel
note: 'Revised after failed prints: two bolted wheel halves, bearing pockets open
  upward, no pocket roofs or supports. Larger fit coupon required before full printing.
  Existing inner spacer/collars may be reused ONLY after dimensional and contact checks.
  Still an unverified flat-tread prototype: rail shape, door load and mounting geometry
  remain unknown. Not approved for supporting the door.'
