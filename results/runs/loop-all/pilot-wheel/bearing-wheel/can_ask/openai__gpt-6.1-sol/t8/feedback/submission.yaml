criteria:
- id: seat_fit
  part: wheel_head_half
  feature: Bearing pocket, both halves
  relation: contains
  hardware: bearings
  clearance_mm: null
  params:
  - seat_d
  - bearing_od
  - bearing_w
  check:
    method: coupon
    ref: fit_coupon
    description: Firm hand insertion, full seating and free bearing rotation; no hammering.
      Pocket must retain bearing against axial sliding. If all tight, increase seat_d
      by 0.4 mm and repeat coupon; if loose, reduce it. Use selected diameter in BOTH
      halves.
- id: shoulder_quality
  part: wheel_nut_half
  feature: Bearing shoulder and mating surface
  relation: seats
  hardware: bearings
  clearance_mm: null
  params:
  - wheel_w
  - bearing_w
  - web_bore
  check:
    method: measure
    ref: null
    description: No loose loops, debris or rocking. Bearing sits flat and fully recessed.
      Shoulder contacts outer ring only. Remove first-layer bore flare without altering
      bearing seat.
- id: spacer_fit
  part: inner_spacer
  feature: Both annular ends; also check both collars
  relation: supports
  hardware: bearings
  clearance_mm: null
  params:
  - spacer_od
  - axle_clearance
  - wheel_w
  - bearing_w
  - collar_l
  check:
    method: measure
    ref: null
    description: Measure spacer length and verify contact on inner-ring metal only,
      never shields. With both bearings seated, inner spacer must fill the gap without
      preloading bearings. Reject warped, crushed or undersized spacers.
- id: join_fit
  part: wheel_nut_half
  feature: Three hex pockets
  relation: contains
  hardware: join_nuts
  clearance_mm: null
  params:
  - nut_pocket_af
  - nut_seat_z
  - join_nut_af
  - join_nut_h
  check:
    method: measure
    ref: null
    description: Nuts seat flat, cannot rotate, and screws fully engage them. At default
      geometry each M3x12 tip is 1 mm inside outer face. Heads flush; no protruding
      screw tips.
- id: track_fit
  part: wheel_head_half
  feature: Assembled flat tread and axle envelope
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - wheel_d
  - wheel_w
  - collar_l
  check:
    method: template
    ref: null
    description: Supported-door trial only. Reject for grooved-track requirements,
      seam misalignment, derailment risk, rubbing or insufficient clearance. Unknown
      door load must be resolved before service.
- id: axle_stack
  part: collar_left
  feature: Single-sided bracket axle stack
  relation: engages
  hardware: axle
  clearance_mm: null
  params:
  - axle_l
  - bracket_t
  - washer_t
  - wheel_w
  - collar_l
  - axle_nut_h
  - thread_projection
  check:
    method: measure
    ref: null
    description: Require bracket_t + wheel_w + 2*collar_l + 3*washer_t + axle_nut_h
      + thread_projection <= axle_l. Default maximum bracket thickness 4.7 mm. Confirm
      nylon engagement and two threads beyond nut; mounting must match the specified
      single-sided stack.
manual:
- n: '1'
  text: 'Keep the door independently supported. Discard the failed original wheel
    print. Print only fit_coupon first, 0.2 mm layers, 5 or more walls, no supports:
    pockets must face UP. Do not reuse the roof-down orientation.'
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Test bearing fit in ascending-X order (default CAD diameters 22.3, 22.5, 22.7
    mm). Choose the smallest firm hand-fit pocket that fully seats the bearing without
    binding it. No hammering. If fit cannot be established, stop after the coupon
    rather than printing the wheel. Set seat_d to the chosen CAD diameter in both
    halves before printing.
  parts:
  - fit_coupon
  hardware:
  - bearings
  tool: null
- n: '3'
  text: Print both wheel halves with mating faces down and all pockets up, no supports,
    6 walls and 100% infill. Print spacer and collars solid. Existing spacer/collars
    may be reused only after the checks below. Clean mating faces and first-layer
    flare. Do not enlarge bearing pockets by uncontrolled sanding.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  - collar_left
  - collar_right
  hardware: []
  tool: null
- n: '4'
  text: 'Fit the two empty halves together, align their through holes and outside
    edges, and place nuts fully into the upward-facing hex pockets. Insert the three
    M3x12 screws from the opposite side. Tighten evenly and gently; heads must sit
    flush, halves must close without a gap and tread edges must align. Do not strip
    or crush PLA. Nut pockets are deep: use the screw to draw each nut to its floor
    while preventing it from cocking.'
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - join_screws
  - join_nuts
  tool: M3 hex key; small pliers if needed
- n: '5'
  text: Press one bearing into the assembled wheel using pressure on its outer ring
    only. Put inner_spacer through the other opening; align it with a loose M8 bolt,
    then seat the second bearing. Confirm both outer rings are fully seated and retained
    snugly. Verify spacer length matches actual inner-ring gap and all spacer/collar
    contact is on inner-ring metal, not shields. If you cannot verify this, stop at
    bench testing.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  - collar_left
  - collar_right
  hardware:
  - bearings
  - axle
  tool: null
- n: '6'
  text: 'Only for a compatible single-sided bracket: assemble bolt head, washer, bracket,
    washer, collar_left, bearing, inner_spacer, bearing, collar_right, washer, locknut.
    Verify bracket thickness is at most 4.7 mm for the specified M8x40, full nylon
    engagement and two exposed threads without tip interference. A different bracket
    arrangement requires redesign. Do not assume the unidentified original bolt is
    suitable.'
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  - collar_left
  - collar_right
  hardware:
  - axle
  - washers
  - locknut
  - bearings
  tool: null
- n: '7'
  text: Gently snug the axle nut while checking rotation. It must capture the inner-ring
    stack without play while the wheel spins freely. Stop for binding, shield contact,
    deformation, axial sliding or loose screws; do not fix these by overtightening.
    PLA spacers creep and are not rated for high clamping loads.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - inner_spacer
  - collar_left
  - collar_right
  hardware:
  - axle
  - locknut
  - join_screws
  tool: null
- n: '8'
  text: Bench-test first. Check the rail fit over full travel while the door remains
    independently supported. Unknown load capacity and rail profile prevent approving
    this for door service. If it supports door weight, use a correctly rated replacement
    or obtain verification of load capacity and retention before use. Keep PLA away
    from heat; inspect frequently for loosening, cracks, tread wear and creep.
  parts: []
  hardware: []
  tool: null
