manual:
- n: '1'
  text: Discard the failed tangled wheel as a working part. Keep the door independently
    supported. This revision is a trial flat-tread wheel, not a load-rated replacement,
    and must not be used for a hanging door or safety restraint.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware: []
  tool: null
- n: '2'
  text: Print both wheel halves with their flat mating faces on the bed and all pockets
    facing up. Use 0.2 mm layers, 6 walls, 100% infill and no supports. Each bearing
    pocket has a floor printed directly from the bed; no pocket roof is printed. Keep
    modeled seats at 22.10 mm, matching your good fit. Print all three spacers solid
    again because their previous condition is unknown.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - center_spacer
  - end_spacer_head
  - end_spacer_nut
  hardware: []
  tool: null
- n: '3'
  text: 'Remove brim, burrs and elephant foot from mating faces, center openings and
    tread edges. Do not enlarge the known-good bearing seats. Dry-fit halves face-to-face:
    seam must close completely, holes align and tread rims align without a step. Check
    M3 nut and head fits before assembly; do not force a nut into an undersized pocket.'
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - join_bolts
  - join_nuts
  tool: null
- n: '4'
  text: Place one M3 nut in each outside hex pocket of wheel_nut_half, seated at pocket
    floor. Flip that half so mating faces meet. Insert three M3x12 screws through
    round recesses in wheel_head_half. Start all three, then gently snug alternately
    while holding rims concentric. Do not crush PLA. Confirm seam closed, full nut
    engagement, all heads recessed, and screw tips no higher than outside face. Recheck
    after initial tests.
  parts:
  - wheel_head_half
  - wheel_nut_half
  hardware:
  - join_bolts
  - join_nuts
  tool: 2.5 mm hex key
- n: '5'
  text: Hand-press first bearing flush into one outer face, applying pressure only
    on outer ring. Insert center_spacer inside and loosely align with axle. Press
    second bearing flush into opposite face. Bearings must seat without cracking,
    rocking or roughness. No hammering or glue.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - center_spacer
  hardware:
  - bearings
  - axle
  tool: null
- n: '6'
  text: 'Bench stack: bolt head, M8 washer, end_spacer_head, first bearing, center_spacer,
    second bearing, end_spacer_nut, M8 washer, nylon locknut. Check spacer bores pass
    your bolt freely. Verify all three spacers contact inner race metal only, never
    bearing shields. Their 11 mm outside diameter is still an assumption, not verified
    by your print report.'
  parts:
  - wheel_head_half
  - wheel_nut_half
  - center_spacer
  - end_spacer_head
  - end_spacer_nut
  hardware:
  - axle
  - axle_washers
  - axle_nut
  - bearings
  tool: null
- n: '7'
  text: 'Hold axle with 6 mm hex key and snug M8 locknut using 13 mm wrench; do not
    torque hard against PLA. Wheel and outer bearing rings must rotate freely while
    axle and inner races stay fixed. If snugging causes drag, stop: check bearing
    seating, spacer contact and center-spacer height. Reprint center spacer to actual
    inner-race gap if needed. Do not cure binding by leaving nut loose.'
  parts:
  - wheel_head_half
  - wheel_nut_half
  - center_spacer
  - end_spacer_head
  - end_spacer_nut
  hardware:
  - axle
  - axle_nut
  tool: 6 mm hex key and 13 mm wrench
- n: '8'
  text: Installation remains conditional. Verify compatible bottom-supported door,
    original tread shape, stationary bracket seat and full-travel clearance. Bracket
    is not modeled. Measure entire axle stack with bracket and select appropriate
    listed M8 length; fully engage nylon locking section and leave at least two threads
    beyond nut without fouling. Bench M8x40 and your original bolt are not verified
    installation lengths.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - end_spacer_head
  - end_spacer_nut
  hardware:
  - axle
  - axle_nut
  - axle_washers
  tool: null
- n: '9'
  text: Keep independent door support during initial slow travel checks and gradual
    load transfer. No load capacity is established. Stop for seam opening, loose screws,
    rubbing, cracking, deformation or bearing roughness. Inspect axle, all three joining
    screws and PLA after first cycles and regularly thereafter. Avoid direct sun and
    heat. If track fit, load or retention remains uncertain, use a rated commercial
    replacement.
  parts:
  - wheel_head_half
  - wheel_nut_half
  - center_spacer
  - end_spacer_head
  - end_spacer_nut
  hardware:
  - join_bolts
  - join_nuts
  - axle_nut
  - bearings
  tool: null
