parts:
- id: wheel_head_half
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    h=p.wheel_w/2\n    assert h>p.bearing_w\n\
    \    w=cq.Workplane('XY').circle(p.wheel_d/2).circle(p.web_bore/2).extrude(h)\n\
    \    w=w.cut(cq.Workplane('XY').workplane(offset=h-p.bearing_w).circle((p.bearing_od+p.fit_add)/2).extrude(p.bearing_w))\n\
    \    for i in range(int(p.join_count)):\n        a=2*math.pi*i/p.join_count\n\
    \        x,y=p.join_radius*math.cos(a),p.join_radius*math.sin(a)\n        w=w.cut(cq.Workplane('XY').center(x,y).circle(p.join_hole_d/2).extrude(h))\n\
    \        w=w.cut(cq.Workplane('XY').workplane(offset=h-p.head_pocket_depth).center(x,y).circle(p.head_pocket_d/2).extrude(p.head_pocket_depth))\n\
    \    return w\n"
  print_orientation: Flat mating face at z=0 on bed; bearing pocket and three round
    head pockets face upward. No supports.
  use_orientation: Mating face toward wheel center. In assembly frame occupies z=0..8,
    bearing pocket toward +Z.
- id: wheel_nut_half
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    h=p.wheel_w/2\n    assert h>p.bearing_w\n\
    \    w=cq.Workplane('XY').circle(p.wheel_d/2).circle(p.web_bore/2).extrude(h)\n\
    \    w=w.cut(cq.Workplane('XY').workplane(offset=h-p.bearing_w).circle((p.bearing_od+p.fit_add)/2).extrude(p.bearing_w))\n\
    \    for i in range(int(p.join_count)):\n        a=2*math.pi*i/p.join_count\n\
    \        x,y=p.join_radius*math.cos(a),p.join_radius*math.sin(a)\n        w=w.cut(cq.Workplane('XY').center(x,y).circle(p.join_hole_d/2).extrude(h))\n\
    \        w=w.cut(cq.Workplane('XY').workplane(offset=h-p.nut_pocket_depth).center(x,y).polygon(6,2*p.nut_pocket_af/math.sqrt(3)).extrude(p.nut_pocket_depth))\n\
    \    return w\n"
  print_orientation: Flat mating face on bed at z=0; bearing pocket and hex nut pockets
    face upward. No supports.
  use_orientation: Flip 180 degrees about X to mate z=0 faces. Occupies assembly z=-8..0,
    bearing pocket toward -Z. Symmetric hole pattern aligns after flipping.
- id: center_spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.axle_d+p.axle_clearance)/2).extrude(p.center_spacer_h)\n"
  print_orientation: Flat annular face on bed.
  use_orientation: Between bearing inner races, nominal assembly z=-1..1.
- id: end_spacer_head
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.axle_d+p.axle_clearance)/2).extrude(p.end_spacer_h)\n"
  print_orientation: Flat annular face on bed.
  use_orientation: Outside +Z bearing, between inner race and axle washer.
- id: end_spacer_nut
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle((p.axle_d+p.axle_clearance)/2).extrude(p.end_spacer_h)\n"
  print_orientation: Flat annular face on bed.
  use_orientation: Outside -Z bearing, between inner race and axle washer.
