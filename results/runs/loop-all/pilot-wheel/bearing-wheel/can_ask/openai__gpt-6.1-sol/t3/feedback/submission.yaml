task: bearing-wheel
note: 'Revision: replace failed one-piece wheel with two bolted halves, printed pocket-up
  without roofs or internal supports. Retain modeled 22.10 mm bearing seats: user''s
  printed 22.09 mm seat accepts bearing snugly and holds upside down. Assembled flat-tread
  wheel remains 50 × 16 mm. Still a provisional, untested-load design: track shape,
  bracket and door load unknown. Not for hanging doors or safety/anti-derailment restraints.
  PLA creeps and softens in heat.'
questions:
- text: Bearing fit result?
  answer: Printed 22.09 mm seat snug, retains bearing upside down. Modeled 22.10 mm
    selected.
- text: Failure observed?
  answer: One-piece lower pocket roof produced loose loops and partly closed center
    hole; eliminated in revision.
- text: Spacers verified?
  answer: Printed, but their fit and condition remain unverified.
- text: Track, bracket geometry, door weight and axle length?
  answer: null
