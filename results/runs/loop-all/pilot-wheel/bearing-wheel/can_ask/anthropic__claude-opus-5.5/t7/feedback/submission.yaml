    value: 1
    unit: mm
    kind: design
    source: design
    note: Bracket gap not measured; leave spacers out if it's tight
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    R = p.wheel_od/2\n    w = p.wheel_w\n    bw = p.bearing_w\n\
    \    rb = (p.bearing_od + p.bearing_fit)/2\n    rl = p.lip_bore/2\n    c = p.lead_chamfer\n\
    \    t = p.tread_chamfer\n    pts = [(rb+c,0),(R-t,0),(R,t),(R,w-t),(R-t,w),(rb+c,w),(rb,w-c),(rb,w-bw),(rl,w-bw),(rl,bw),(rb,bw),(rb,c)]\n\
    \    return cq.Workplane('XZ').polyline(pts).close().revolve(360,(0,0,0),(0,1,0))\n"
  print_orientation: flat on one face, bore axis vertical (z)
  use_orientation: axis horizontal on the M8 bolt, tread on the track
- id: inner_spacer
  role: final
  material: PLA
  code: "def build(p):\n    t = p.wheel_w - 2*p.bearing_w\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.bolt_clear_d/2).extrude(t)\n"
  print_orientation: flat
  use_orientation: on the bolt between the two bearing inner races, inside the lip
- id: side_spacer
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.bolt_clear_d/2).extrude(p.side_spacer_t)\n"
  print_orientation: flat
  use_orientation: on the bolt between a bearing inner race and the bracket cheek
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    res = None\n    for i, off in enumerate([p.fit_a, p.fit_b,\
    \ p.fit_c]):\n        ring = cq.Workplane('XY').center(i*34, 0).circle(15).circle((p.bearing_od+off)/2).extrude(p.coupon_h)\n\
    \        for k in range(i+1):\n            n = cq.Workplane('XY').center(i*34\
    \ - 3 + k*3, 15).rect(1.2, 2).extrude(p.coupon_h)\n            ring = ring.cut(n)\n\
    \        res = ring if res is None else res.union(ring)\n    return res\n"
  print_orientation: flat
  use_orientation: 'handheld test: press a bearing into each ring'
hardware:
- id: bolt
  ref: ISO 4762 M8x30
  qty: 1
- id: locknut
  ref: ISO 10511 M8
  qty: 1
- id: washer
  ref: ISO 7089 M8
  qty: 2
joints:
- id: axle
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 30.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: wheel
    feature: lip_bore (clears the bolt; the bearings carry it)
    role: clearance
  - part: inner_spacer
    feature: bore
    role: clearance
  - part: side_spacer
    feature: bore
    role: clearance
  nut: locknut
  external: null
criteria:
- id: c1
  part: wheel
  feature: bearing bores
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - bearing_od
  - bearing_fit
  check:
    method: coupon
    ref: fit_coupon
    description: 'Confirmed: the 22.09 seat is snug and holds the bearing upside down,
      in both the coupon and the wheel'
- id: c2
  part: wheel
  feature: lip
  relation: clears
  hardware: null
  clearance_mm: 2.9
  params:
  - lip_bore
  - bearing_inner_race_od
  check:
    method: measure
    ref: null
    description: Inner races spin freely; nothing rubs the lip
- id: c3
  part: wheel
  feature: overall width
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - wheel_w
  - side_spacer_t
  check:
    method: measure
    ref: null
    description: Wheel plus side spacers fits in the bracket gap
- id: c4
  part: inner_spacer
  feature: faces
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - spacer_od
  - bearing_inner_race_od
  check:
    method: none
    ref: null
    description: Spacer only touches the inner races
manual:
- n: '1'
  text: 'The coupon is done: the 22.09 fit is confirmed, so you don''t need to print
    it again. If the wheel you already printed holds its bearings snugly, you can
    use it as it is.'
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Print the wheel lying flat with 3 walls and 30-40% infill. Print one inner_spacer
    and two side_spacers. Check that the spacers' holes slide over the M8 bolt.
  parts:
  - wheel
  - inner_spacer
  - side_spacer
  hardware: []
  tool: null
- n: '3'
  text: Press the first 608 bearing into one side of the wheel until it stops on the
    inner lip. Push only on the outer ring.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '4'
  text: Drop the inner_spacer into the bore so it rests on the first bearing's inner
    race. Then press the second bearing in from the other side until it stops on the
    lip.
  parts:
  - wheel
  - inner_spacer
  hardware: []
  tool: null
- n: '5'
  text: Slide the wheel into the door bracket with a side_spacer on each side. Put
    a washer under the bolt head and push the M8 bolt through the bracket, spacers
    and wheel. If the gap is too narrow, leave out one or both side spacers.
  parts:
  - wheel
  - side_spacer
  hardware:
  - bolt
  - washer
  tool: null
- n: '6'
  text: Fit the second washer and the lock nut on the outside of the bracket and tighten
    until snug. Spin the wheel to check it turns freely.
  parts: []
  hardware:
  - washer
  - locknut
  tool: 6 mm hex key + 13 mm spanner
