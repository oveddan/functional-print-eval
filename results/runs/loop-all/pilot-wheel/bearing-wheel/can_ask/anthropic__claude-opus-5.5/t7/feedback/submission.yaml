  fit_a:
    value: 0
    unit: mm
    kind: design
    source: design
    note: ''
  fit_b:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: ''
  fit_c:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_h:
    value: 5
    unit: mm
    kind: design
    source: design
    note: ''
  lead_chamfer:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: ''
  tread_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
