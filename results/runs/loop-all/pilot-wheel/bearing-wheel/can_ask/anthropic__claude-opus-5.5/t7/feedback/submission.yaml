task: bearing-wheel
note: No changes. The coupon and the printed wheel both show the 22.09 bore (bearing_fit
  0.1) is the right press fit. The tread is still flat because the track shape wasn't
  measured.
questions:
- text: Is the rail flat, or a ridge or V that needs a grooved tread?
  answer: null
- text: How wide is the gap inside the bracket, and how long is your M8 bolt?
  answer: null
params:
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: 'Re-measured flat across the outer ring: about 22'
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: About 7
  bearing_inner_race_od:
    value: 12.1
    unit: mm
    kind: hardware
    source: datasheet
    note: Typical 608 inner-race shoulder diameter
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bolt_clear_d:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: ''
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: ''
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
