task: bearing-wheel
note: 'Rev 2: the flat 3 mm roof over the bottom pocket, which had nothing under it,
  is now a self-supporting cone. Nothing else changed. The bearing fit stays at 22.09
  because your test passed.'
questions:
- text: Does the track have a ridge or V that needs a groove in the tread?
  answer: null
- text: How wide is the bracket gap? If it's over about 19 mm, add spacer washers.
  answer: null
params:
  wheel_d:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel about 50 mm across
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel about 16 mm wide
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: ''
  press_fit:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: the 22.09 seat tested snug and holds upside down, so it stays as is
  lip_bore_d:
    value: 19
    unit: mm
    kind: design
    source: design
    note: hole through the top of the centre lip; the top bearing rests only on its
      outer race
  spacer_od:
    value: 11
    unit: mm
    kind: design
    source: design
    note: smaller than the 608 inner race, so it touches only the inner races
  spacer_id:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: ''
  tread_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
  ef_chamfer:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    R = p.wheel_d/2\n    W = p.wheel_w\n    bw = p.bearing_w\n\
    \    rb = (p.bearing_od + p.press_fit)/2\n    rl = p.lip_bore_d/2\n    c = p.tread_chamfer\n\
    \    e = p.ef_chamfer\n    # underside of centre lip is a cone (about 52 deg from\
    \ horizontal), so it prints without support or a flat roof\n    pts = [(rb+e,0),(R-c,0),(R,c),(R,W-c),(R-c,W),(rb+e,W),(rb,W-e),(rb,W-bw),(rl,W-bw),(rb,bw),(rb,e)]\n\
    \    return cq.Workplane('XZ').polyline(pts).close().revolve(360,(0,0,0),(0,1,0))\n"
  print_orientation: flat on one face, axle vertical (as modelled)
  use_orientation: axle horizontal, tread on the track
- id: inner_spacer
  role: final
  material: PLA
  code: "def build(p):\n    h = p.wheel_w - 2*p.bearing_w\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_id/2).extrude(h)\n"
  print_orientation: flat ring on the bed
  use_orientation: on the bolt between the two bearing inner races
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    rb = (p.bearing_od + p.press_fit)/2\n    e = p.ef_chamfer\n\
    \    H = p.bearing_w\n    Ro = rb + 4\n    pts = [(rb+e,0),(Ro,0),(Ro,H),(rb+e,H),(rb,H-e),(rb,e)]\n\
    \    return cq.Workplane('XZ').polyline(pts).close().revolve(360,(0,0,0),(0,1,0))\n"
  print_orientation: flat ring on the bed
  use_orientation: 'handheld test: press a bearing in'
hardware:
- id: bearing
  ref: 608ZZ
  qty: 2
- id: axle
  ref: ISO 4762 M8x35
  qty: 1
- id: locknut
  ref: ISO 10511 M8
  qty: 1
- id: washer
  ref: ISO 7089 M8
  qty: 2
joints:
- id: axle_joint
  fastener: axle
  axis_origin:
  - 0.0
  - 0.0
  - -6.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: wheel
    feature: bearing bores (bolt runs through the bearing inner races)
    role: clearance
  - part: inner_spacer
    feature: bore
    role: clearance
  nut: locknut
  external: closet door roller bracket (axle hole about 8 mm)
criteria:
- id: bearing_press
  part: wheel
  feature: bearing pockets
  relation: seats
  hardware: bearing
  clearance_mm: null
  params:
  - bearing_od
  - press_fit
  - bearing_w
  check:
    method: coupon
    ref: fit_coupon
    description: 'Already passed: the 22.09 seat is snug and holds upside down.'
- id: lip_prints
  part: wheel
  feature: cone under the centre lip
  relation: supports
  hardware: bearing
  clearance_mm: null
  params:
  - lip_bore_d
  - bearing_w
  - wheel_w
  check:
    method: measure
    ref: null
    description: The lip's underside should print as a smooth cone with no loose loops.
      The hole through it should be clear at about 19 mm, and both bearings should
      press in until they stop at the lip.
- id: spacer_len
  part: inner_spacer
  feature: length
  relation: supports
  hardware: bearing
  clearance_mm: null
  params:
  - wheel_w
  - bearing_w
  check:
    method: measure
    ref: null
    description: The spacer should measure 2.0 mm thick and about 11 mm across. With
      the nut done up, the wheel should still spin freely.
- id: tread
  part: wheel
  feature: tread
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - wheel_d
  - wheel_w
  check:
    method: none
    ref: null
    description: The tread is flat with chamfered edges because the track profile
      wasn't measured.
manual:
- n: '1'
  text: Reprint the wheel only, flat on the bed with no supports (100% infill or 6
    walls). You don't need to print the coupon or the spacer again. Check that the
    cone inside the wheel is clean and the centre hole is open.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '2'
  text: Measure the inner_spacer. It should be about 2.0 mm thick and 11 mm across.
    If it's thicker, sand it down to 2.0 mm.
  parts:
  - inner_spacer
  hardware: []
  tool: calipers
- n: '3'
  text: Press the first bearing into the flat-topped side of the wheel (the side that
    was on top while printing) until it stops on the lip. Push only on the bearing's
    outer ring. Turn the wheel over, drop the inner_spacer in, and press the second
    bearing in from the cone side until it stops.
  parts:
  - wheel
  - inner_spacer
  hardware:
  - bearing
  tool: vice or flat block
- n: '4'
  text: Put the bolt through the bracket, then a washer, the wheel, a second washer,
    and the other bracket arm. Finish with the lock nut. Tighten until it's snug and
    the wheel still spins freely. If the M8x35 doesn't suit your bracket, use your
    own M8 bolt.
  parts:
  - wheel
  hardware:
  - axle
  - washer
  - locknut
  tool: 6 mm hex key + 13 mm spanner
