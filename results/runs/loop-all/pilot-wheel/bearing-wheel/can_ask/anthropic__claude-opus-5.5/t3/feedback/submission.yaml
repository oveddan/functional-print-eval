task: bearing-wheel
note: 'Rev 2: the centre lip underside was a 3 mm flat overhang that drooped, so it''s
  now a 1 mm flat ledge (the bearing seat) plus a 45 deg cone, with the lip ID raised
  to 18 mm. The bearing fit (22.09 mm) is unchanged. The rim profile and bracket gap
  are still unmeasured.'
questions: []
params:
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel, 'about 50 mm across'
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel, 'about 16 mm wide'
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: 608 re-measured ~22; nominal 22.000
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: 608 nominal 7
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: ''
  fit_allow:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: 'confirmed by coupon and wheel: the 22.09 mm seat is snug and holds'
  lead_chamfer:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: ''
  rim_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
  lip_id:
    value: 18
    unit: mm
    kind: design
    source: design
    note: enlarged from 16 so the lip overhang is short; still clears the inner ring
  lip_ledge:
    value: 1
    unit: mm
    kind: design
    source: design
    note: flat seat width under the lip for the lower bearing's outer ring; inside
      that the underside rises at 45 deg
  inner_race_od:
    value: 12
    unit: mm
    kind: hardware
    source: guessed
    note: typical 608 inner ring land; spacer kept below it
  spacer_clear:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: ''
  side_spacer_t:
    value: 1
    unit: mm
    kind: design
    source: design
    note: bracket gap unknown; skip these if the wheel+spacers don't fit
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    R = p.wheel_od/2\n    W = p.wheel_w\n    ch = p.rim_chamfer\n\
    \    rb = (p.bearing_od + p.fit_allow)/2\n    c = p.lead_chamfer\n    d = p.bearing_w\n\
    \    rl = p.lip_id/2\n    rs = rb - p.lip_ledge\n    rise = rs - rl\n    pts =\
    \ [(rb+c,0),(R-ch,0),(R,ch),(R,W-ch),(R-ch,W),(rb+c,W),(rb,W-c),(rb,W-d),(rl,W-d),(rl,d+rise),(rs,d),(rb,d),(rb,c)]\n\
    \    return cq.Workplane('XZ').polyline(pts).close().revolve(360,(0,0,0),(0,1,0))\n"
  print_orientation: flat face on the bed, axis vertical; no supports (lip underside
    is a 1 mm ledge then a 45 deg cone)
  use_orientation: axis horizontal in the door bracket, rim on the track
- id: spacer_center
  role: final
  material: PLA
  code: "def build(p):\n    L = p.wheel_w - 2*p.bearing_w\n    return cq.Workplane('XY').circle(p.inner_race_od/2\
    \ - 0.25).circle((p.bolt_d+p.spacer_clear)/2).extrude(L)\n"
  print_orientation: flat end on bed
  use_orientation: on the bolt between the two bearings' inner rings
- id: spacer_side
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.inner_race_od/2 - 0.25).circle((p.bolt_d+p.spacer_clear)/2).extrude(p.side_spacer_t)\n"
  print_orientation: flat end on bed (print 2)
  use_orientation: on the bolt between each bearing's inner ring and the bracket plate
hardware:
- id: bolt
  ref: ISO 4762 M8x30
  qty: 1
- id: nut
  ref: ISO 10511 M8
  qty: 1
- id: washer
  ref: ISO 7089 M8
  qty: 2
joints:
- id: axle
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - -12.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: spacer_side
    feature: bore
    role: clearance
  - part: spacer_center
    feature: bore
    role: clearance
  - part: spacer_side
    feature: bore
    role: clearance
  nut: nut
  external: door bracket side plates (bolt passes through both)
criteria:
- id: bearing_press
  part: wheel
  feature: bearing pockets
  relation: contains
  hardware: null
  clearance_mm: null
  params:
  - bearing_od
  - fit_allow
  check:
    method: measure
    ref: null
    description: 'Already confirmed: the 22.09 mm seat is snug and holds the bearing'
- id: lip_prints
  part: wheel
  feature: centre lip underside
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - lip_id
  - lip_ledge
  check:
    method: none
    ref: null
    description: 'Look at the lip: it should be clean, with the 18 mm hole open and
      no loose loops'
- id: wheel_in_bracket
  part: wheel
  feature: overall width + side spacers
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - wheel_w
  - side_spacer_t
  check:
    method: measure
    ref: null
    description: Wheel plus side spacers must fit between the bracket plates; leave
      side spacers out if tight
manual:
- n: '1'
  text: Reprint only the wheel. The spacers you already printed are unchanged. Use
    4+ walls and 40%+ infill. No supports.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '2'
  text: Check the centre lip. The hole should be about 18 mm and clean, and the underside
    should show a narrow flat ring and then a sloped cone.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '3'
  text: Press the first bearing in from the bottom (bed) side until it stops on the
    flat ring under the lip. Push only on the outer ring.
  parts:
  - wheel
  hardware: []
  tool: vise or a socket and a flat board
- n: '4'
  text: Turn the wheel over and drop the centre spacer in so it lies on the first
    bearing's inner ring. Press in the second bearing until it sits on the lip's top
    face.
  parts:
  - wheel
  - spacer_center
  hardware: []
  tool: null
- n: '5'
  text: Hold the wheel between the bracket plates with a side spacer on each face.
    Push the bolt through a washer, the bracket, a spacer, the wheel, the other spacer,
    the other bracket plate and a washer. Thread on the lock nut. If the gap is too
    tight for the side spacers, leave them out. You can use your own M8 bolt if it's
    long enough.
  parts:
  - wheel
  - spacer_side
  hardware:
  - bolt
  - washer
  - nut
  tool: 6 mm hex key, 13 mm spanner
- n: '6'
  text: Tighten until it's snug. The wheel should still spin freely. Rehang the door
    and check that it rolls smoothly.
  parts: []
  hardware:
  - bolt
  - nut
  tool: null
