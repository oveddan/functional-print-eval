criteria:
- id: c1
  part: wheel
  feature: bearing_pocket
  relation: contains
  hardware: null
  clearance_mm: 0.2
  params:
  - bearing_od
  - bearing_pocket_d
  check:
    method: coupon
    ref: coupon
    description: 'Your coupon: a 21.99 mm pocket would not take a bearing, a 22.19
      mm one did and held it upside down. This wheel''s pocket is 22.2 mm, so both
      bearings seat. The new coupon retests 22.0 and 22.1 with a vise, so you can
      come down to a tighter fit if your printer will take it.'
- id: c2
  part: wheel
  feature: bearing_pocket_floor
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - bearing_pocket_depth
  - bearing_width
  - wheel_width
  check:
    method: template
    ref: null
    description: Pocket depth 14.0 mm = two 7 mm bearings stacked; the inner one bottoms
      on the 2 mm floor and the outer one lands on it, so both finish flush inside
      the 16 mm wheel.
- id: c3
  part: wheel
  feature: axle_clearance_bore
  relation: clears
  hardware: bolt
  clearance_mm: 0.6
  params:
  - axle_hole_d
  - bolt_shank_d
  check:
    method: measure
    ref: null
    description: The person reported the bolt shank at about 8 mm; the bore is 8.6
      mm, so a threaded bolt drops straight through the floor.
- id: c4
  part: wheel
  feature: bearing_pocket
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - bearing_pocket_depth
  - bearing_pocket_d
  check:
    method: coupon
    ref: coupon
    description: No bridging and no overhangs anywhere in this part now - the pocket
      opens straight up and its floor is printed on the bed. The coupon exercises
      the identical pocket.
- id: c5
  part: wheel
  feature: tread
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - wheel_width
  check:
    method: none
    ref: null
    description: Flat tread band, 50 mm across by 16 mm, as the old wheel was described.
      If the door rides too high or too low, change wheel_od and reprint - do not
      scale the slicer model, which would shrink the bearing pocket with it.
manual:
- n: '0'
  text: Check the axle first. Your own M8 bolt or an ISO 4762 M8x40 must reach through
    the bracket plate, the 16 mm wheel, a washer and the nut (the ISO 10511 M8 lock
    nut is 8 mm tall). The wheel is 16 mm wide, same as the old one, so it fits the
    same gap.
  parts:
  - wheel
  hardware: []
  tool: ruler
- n: '1'
  text: 'Print the coupon: flat on the bed, pockets up, 0.2 mm layers, 4 walls, 6
    top/bottom layers, no supports. It is a 96 x 32 x 16 mm bar with three 14 mm deep
    pockets, 22.0 / 22.1 / 22.2 mm across. The pockets are deep because the wheel''s
    pocket takes BOTH bearings stacked, and you want to test that here first.'
  parts:
  - coupon
  hardware: []
  tool: printer
- n: '2'
  text: 'Press one of your 608 bearings into each pocket - in a VISE or with a soft
    mallet over a socket, pushing on the OUTER race only, straight down onto the floor
    of the pocket. Do not write off the 22.0 pocket on the strength of pushing it
    in by hand: your first coupon''s 21.99 mm pocket failed by hand, but a vise may
    well seat it, and that is the best fit of the three. Never press on the seals
    or the inner race.'
  parts:
  - coupon
  hardware: []
  tool: vise or soft mallet + socket
- n: '3'
  text: Keep the SMALLEST pocket whose bearing went in and stays in. Set the param
    bearing_pocket_d to that size (22.0, 22.1 or 22.2). Your printer holds size to
    about 0.01 mm - your 21.8/22.0/22.2 coupon measured 21.79/21.99/22.19 - so the
    param is essentially the real bore.
  parts:
  - coupon
  hardware: []
  tool: null
- n: '4'
  text: Now push a SECOND bearing into the winning pocket, on top of the first, until
    its outer face is flush with the plate's top face. If the second one will not
    go in, step up to the next pocket size - the wheel needs two bearings in one pocket.
  parts:
  - coupon
  hardware: []
  tool: vise or soft mallet + socket
- n: '5'
  text: 'Print the wheel with that param: flat on the bed (the 2 mm floor down, pocket
    opening up), 0.2 mm layers, 4 walls, at least 6 top/bottom layers, no supports.
    Nothing in this part bridges or overhangs - the pocket opens straight up. Print
    two if both rollers on the door are alike.'
  parts:
  - wheel
  hardware: []
  tool: printer
- n: '6'
  text: Clean out the pocket and the 8.6 mm bore. If your chosen fit pushes in with
    light finger pressure (the 22.2 one will), smear a very thin film of cyanoacrylate
    or retaining compound on the OUTER race before seating it, so the outer race cannot
    creep in the pocket - keep glue right away from the balls and seals.
  parts:
  - wheel
  hardware: []
  tool: knife or needle file
- n: '7'
  text: 'Press the first bearing all the way down the pocket until it sits on the
    floor: outer race only, straight. Then press the second bearing in on top of it
    until its outer face is flush with the wheel''s face. Both must be square, and
    the axle must drop freely through both 8 mm bores.'
  parts:
  - wheel
  hardware: []
  tool: vise or soft mallet + socket
- n: '8'
  text: 'Fit the axle: bolt through one bracket plate, then the wheel, then the other
    bracket plate. Washer under the bolt head, washer under the nut, then the M8 lock
    nut.'
  parts:
  - wheel
  hardware:
  - bolt
  - washer
  - nut
  tool: null
- n: '9'
  text: Tighten until the wheel has no side-to-side slop but still spins freely with
    a flick. If the wheel's cheeks drag on the bracket, file 0.2-0.3 mm off each cheek.
    If there is end float, add another washer.
  parts:
  - wheel
  hardware:
  - nut
  - washer
  tool: spanner
- n: '10'
  text: Hang the door and roll it through its whole travel - the wheel must roll,
    not skid, and the door must sit level. If the door sits too high or too low, change
    wheel_od in 0.5 mm steps and reprint.
  parts:
  - wheel
  hardware: []
  tool: null
