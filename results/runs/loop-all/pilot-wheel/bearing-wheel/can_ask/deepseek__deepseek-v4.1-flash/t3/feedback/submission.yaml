task: bearing-wheel
note: 'Reworked for two things your print showed. (1) The roof over the lower pocket
  is gone: that 2 mm web had to bridge the pocket and carry a free-floating ring of
  perimeter around the 8.6 mm axle hole with nothing under it, which is exactly the
  loose loops and the half-closed hole you got. Both bearings now stack into ONE 14
  mm pocket that opens straight up, with a 2 mm floor that prints flat on the bed.
  The wheel now has no bridges and no overhangs at all. (2) bearing_pocket_d is now
  22.2, because your coupon showed 22.19 takes a bearing and holds it while 21.99
  will not. The coupon is back at 22.0 / 22.1 / 22.2 with 14 mm deep pockets, so you
  can re-test 22.0 and 22.1 in a vise and come down to a tighter, glued-in fit if
  your printer allows it. Everything else is unchanged: 50 x 16 mm, flat tread, 8.6
  mm axle bore.'
questions:
- text: When the 21.99 mm pocket 'wouldn't go in', had you tried it in a vise, or
    only by hand? If a vise seats it, that is the best fit of the three and I can
    set bearing_pocket_d to 22.0. The new coupon retests it with the full 14 mm depth.
  answer: null
- text: The old wheel's exact outside diameter - I used 50.0 mm from your 'about 50
    mm', and it sets the door's height.
  answer: null
- text: Is the old wheel's running surface flat like a bicycle tyre, or is there a
    groove that a track rail sits in? I made it a plain flat band.
  answer: null
- text: How much clear space is there between the bracket plates the axle passes through,
    and how long is your M8 bolt under the head? The wheel is 16 mm wide to match
    the old one, but I need those two numbers to be sure the bolt reaches through
    the bracket and the nut can take up any slack.
  answer: null
params:
  axle_bolt_len:
    value: 40.0
    unit: mm
    kind: hardware
    source: catalog
    note: 'Reach check: 3 mm bracket plate + 16 mm wheel + 3 mm bracket plate + 2
      x 1.6 mm washer + 8 mm lock nut = 33.2 mm, so 40 mm is comfortable. Use your
      own M8 bolt if it is long enough.'
  axle_hole_d:
    value: 8.6
    unit: mm
    kind: design
    source: design
    note: Clearance bore through the 2 mm floor, which now prints flat on the bed
      instead of being a bridged web.
  bearing_bore:
    value: 8.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ bore, 8.000 -0.008 - a nominal fit on the axle thread.
  bearing_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ outside diameter, 22.000 -0.008.
  bearing_pocket_d:
    value: 22.2
    unit: mm
    kind: design
    source: design
    note: 'Raised from 22.0 to 22.2 after your coupon: a 22.19 mmmm pocket took a
      bearing and held it upside down, a 21.99 mm one would not. Default is the size
      you know works; the coupon lets you drop it to 22.1 or 22.0 in a vise.'
  bearing_pocket_depth:
    value: 14.0
    unit: mm
    kind: design
    source: design
    note: Both bearings stack in the one pocket, so the depth is two bearing widths.
      The 2 mm left over is the floor, which is what removed the bridging.
  bearing_width:
    value: 7.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ width, nominal 7.0; two of them make the 14 mm pocket.
  bolt_shank_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: asked
    note: The person's own M8 bolt; they reported the shank at about 8 mm. On a standard
      M8 screw that length is thread, which is why the axle bore is generously clearanced.
  coupon_step:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: The coupon prints pockets at this value and twice this value below bearing_pocket_d,
      i.e. 22.2 / 22.1 / 22.0.
  floor_t:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: wheel_width minus bearing_pocket_depth = 2 mm. This is the floor under the
      pocket; it lies on the bed, so it needs no support, and the inner bearing seats
      on it.
  mouth_chamfer:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: 45 degree lead-in at the pocket mouth; guides both bearings in square.
  tread_edge_break:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Chamfer on both tread edges.
  wheel_od:
    value: 50.0
    unit: mm
    kind: world
    source: asked
    note: The old wheel was 'about 50 mm across' and could not be measured. This is
      the rolling diameter and it sets the door's height, so change it in 0.5 mm steps
      if the door rides wrong.
  wheel_width:
    value: 16.0
    unit: mm
    kind: world
    source: asked
    note: The old wheel was 'about 16 mm wide'. Matching it keeps the same envelope
      inside the door bracket.
parts:
- id: wheel
  role: final
  material: PLA (the high-speed black PLA on the X1C)
  code: "import cadquery as cq\n\n\ndef build(p):\n    r_out = p.wheel_od / 2.0\n\
    \    h = p.wheel_width\n    pr = p.bearing_pocket_d / 2.0\n    pd = p.bearing_pocket_depth\n\
    \    ch = p.mouth_chamfer\n    eb = p.tread_edge_break\n    floor_t = h - pd\n\
    \n    # solid disc, axis vertical (this is the print orientation)\n    w = cq.Workplane(\"\
    XY\").circle(r_out).extrude(h)\n\n    # ONE bearing pocket, opening upward, deep\
    \ enough for both bearings\n    # stacked. The leftover material below it is the\
    \ floor, which is\n    # printed flat on the bed - no ceiling, so nothing bridges.\n\
    \    w = w.cut(\n        cq.Workplane(\"XY\").circle(pr).extrude(pd).translate((0,\
    \ 0, floor_t))\n    )\n\n    # 45 degree lead-in chamfer at the pocket mouth\n\
    \    cone = cq.Solid.makeCone(\n        pr, pr + ch, ch, cq.Vector(0, 0, h - ch),\
    \ cq.Vector(0, 0, 1)\n    )\n    w = w.cut(\n        cone.cut(cq.Solid.makeCylinder(pr,\
    \ ch, cq.Vector(0, 0, h - ch)))\n    )\n\n    # clearance bore for the axle through\
    \ the floor\n    w = w.cut(cq.Workplane(\"XY\").circle(p.axle_hole_d / 2.0).extrude(h))\n\
    \n    # break the two tread edges\n    big_lo = cq.Solid.makeCylinder(r_out +\
    \ 2.0, eb)\n    w = w.cut(big_lo.cut(cq.Solid.makeCone(r_out - eb, r_out, eb)))\n\
    \n    big_hi = cq.Solid.makeCylinder(\n        r_out + 2.0, eb, cq.Vector(0, 0,\
    \ h - eb)\n    )\n    w = w.cut(\n        big_hi.cut(\n            cq.Solid.makeCone(\n\
    \                r_out, r_out - eb, eb, cq.Vector(0, 0, h - eb)\n            )\n\
    \        )\n    )\n\n    return w\n"
  print_orientation: 'As modelled: the 2 mm floor (z = 0) flat on the bed, pocket
    mouth up, wheel axis vertical. No supports, no bridging, no overhangs - the pocket
    is a plain vertical bore and the floor is printed on the bed. 0.2 mm layers, 4
    walls, 6 top/bottom layers so the pocket floor comes out solid.'
  use_orientation: Axis horizontal, on the door's axle. The pocket faces either way;
    the wheel turns on the bearings' outer races while the inner races stay put on
    the axle.
- id: coupon
  role: coupon
  material: same spool as the wheel
  code: "import cadquery as cq\n\n\ndef build(p):\n    d = p.bearing_pocket_d\n  \
    \  step = p.coupon_step\n    sizes = [d - 2.0 * step, d - step, d]\n    pd = p.bearing_pocket_depth\n\
    \    ch = p.mouth_chamfer\n    floor = 2.0\n    t = pd + floor\n    pitch = d\
    \ + 10.0\n    margin = 5.0\n\n    n = len(sizes)\n    length = pitch * (n - 1)\
    \ + d + 2.0 * margin\n    width = d + 2.0 * margin\n\n    plate = cq.Workplane(\"\
    XY\").box(\n        length, width, t, centered=(True, True, False)\n    )\n\n\
    \    for i, dia in enumerate(sizes):\n        x = (i - (n - 1) / 2.0) * pitch\n\
    \        # pocket, opening upward, same depth as the wheel's\n        plate =\
    \ plate.cut(\n            cq.Workplane(\"XY\")\n            .circle(dia / 2.0)\n\
    \            .extrude(pd)\n            .translate((x, 0, t - pd))\n        )\n\
    \        # same lead-in chamfer as the wheel\n        cone = cq.Solid.makeCone(\n\
    \            dia / 2.0,\n            dia / 2.0 + ch,\n            ch,\n      \
    \      cq.Vector(x, 0, t - ch),\n            cq.Vector(0, 0, 1),\n        )\n\
    \        plate = plate.cut(\n            cone.cut(\n                cq.Solid.makeCylinder(\n\
    \                    dia / 2.0, ch, cq.Vector(x, 0, t - ch)\n                )\n\
    \            )\n        )\n\n    return plate\n"
  print_orientation: 'As modelled: plate flat on the bed (z = 0), three 14 mm pockets
    opening upward. 0.2 mm layers, 4 walls, 6 top/bottom layers, no supports.'
  use_orientation: Test only. Pockets at bearing_pocket_d - 0.2 / - 0.1 / + 0.0 (22.0
    / 22.1 / 22.2 mm). Press a bearing into each with a vise, then press a second
    bearing on top of the first in the winner.
