task: bearing-wheel
note: 'Two fixes from your print, everything else unchanged.


  1) SEAT SIZE. Your coupon told us the truth: printed bores come out about 0.1 mm
  under nominal, so the wheel''s modelled 21.90 printed tight enough that a 608 would
  not go in, and the 22.09 coupon bore was the one that took a bearing snugly and
  held it upside down. The wheel''s seats are now 22.10 - nominally a whisker of clearance,
  actually a snug hand-press. The new coupon brackets it at 22.00 / 22.10 / 22.20
  / 22.30.


  2) THE TORN ROOF OVER THE LOWER BEARING POCKET. That was my fault, not your printer''s.
  The bearing shoulder over the lower pocket used to run from the bore all the way
  in to a Ø14 centre hole - a 3.9 mm annular ledge printed over thin air, with no
  support under its inner edge and nothing to anchor it, so the strands near the hole
  looped and tangled. The shoulder is now: flat only 1.3 mm wide - exactly the width
  of a 608 outer race''s face - then it steps inward to a Ø18 centre hole in 0.2 mm
  increments (a 45 degree stair). Every layer sits on the one below, the ledge is
  a third of its old width, and the hole has 3 mm of clearance to the spacer, so even
  a slightly ragged edge cannot block anything. The upper pocket''s floor was never
  a problem - it is printed on top of the web - so it keeps the full flat shoulder.


  Supports: off, both pockets, including the wheel''s. If your slicer proposes supports
  inside the bearing bores, turn them off.


  Still assumed, and still worth telling me if you can: the hanger plate''s thickness
  and whether it is one plate or two (sets which screw you need), and whether the
  old wheel''s tread was flat or grooved.'
questions:
- text: How thick is the hanger plate, and is the wheel between two plates or beside
    a single plate? I assumed a single 3 mm plate, which sets the screw length.
  answer: null
- text: Was the old wheel's tread flat straight across, or grooved/flanged? I modelled
    a plain flat tread, since the broken wheel could not be measured.
  answer: null
- text: How long is your own M8 bolt from under the head to the tip? I assumed you
    will use an ISO 4762 M8x40, or your bolt if it is 35 mm or more under the head.
  answer: null
- text: In the last print, did the lower bearing pocket's roof tangle and did the
    spacer come out usable? Knowing which parts failed there would tell me whether
    anything else in the hub needs re-shaping.
  answer: null
params:
  axle_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: measured
    note: 'person: ''bolt across: about 8 mm (the shank)'' - confirms M8'
  axle_len:
    value: 40
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8x40 socket head screw; M8x35 also works if the hanger is a single
      thin plate. Their own M8 bolt is fine if >= 35 mm under the head
  bearing_bore:
    value: 8.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ nominal 8; measured 7.94
  bearing_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ nominal 22.000/-0.008; a 608 outer race's face is about 1.25 mm wide,
      which is what the shoulder has to back
  bearing_seat_d:
    value: 22.1
    unit: mm
    kind: design
    source: design
    note: CHANGED from 21.90. Printed bores come out about 0.1 mm under; the first
      coupon's 22.09 bore took a 608 with a snug hand push and held the wheel upside
      down, so the wheel now matches that
  bearing_seat_depth:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: one bearing width; each bearing bottoms on the centre web, so the outer
      faces finish flush with the wheel faces
  bearing_width:
    value: 7.0
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ nominal width; sets the seat depth
  bracket_t:
    value: 3.0
    unit: mm
    kind: world
    source: guessed
    note: assumed flat hanger plate thickness; person could not measure. Sets the
      required screw length
  coupon_bore_1:
    value: 22.0
    unit: mm
    kind: design
    source: design
    note: nominal line-to-line with the bearing - leftmost bore
  coupon_bore_2:
    value: 22.1
    unit: mm
    kind: design
    source: design
    note: same as the wheel's seat - second bore
  coupon_bore_3:
    value: 22.2
    unit: mm
    kind: design
    source: design
    note: third bore
  coupon_bore_4:
    value: 22.3
    unit: mm
    kind: design
    source: design
    note: loosest option - rightmost bore
  coupon_len:
    value: 110.0
    unit: mm
    kind: design
    source: design
    note: four test bores on a 26 mm pitch
  coupon_pitch:
    value: 26.0
    unit: mm
    kind: design
    source: design
    note: bore spacing; any tighter and the 22.3 bore would merge with its neighbour
  coupon_t:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: thicker than the 7 mm bearing so the press is representative
  coupon_w:
    value: 30.0
    unit: mm
    kind: design
    source: design
    note: leaves about 4 mm of material around each bore
  nut_h:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 nylon-insert lock nut height (af 13)
  seat_chamfer:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: 45 deg lead-in at both bearing seat mouths so the bearings start square
  spacer_bore:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: 0.4 mm clearance on the M8 shank; the bolt centres the spacer
  spacer_len:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: = web_thickness, the gap between the two inner races; sanded to a slip fit
      after pressing
  spacer_od:
    value: 11.0
    unit: mm
    kind: design
    source: design
    note: CHANGED from 12.0. Its end faces must land on the inner race's face only
      (about 1.25 mm wide) and stay clear of the metal shield, which starts around
      Ø12
  tread_chamfer:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: 45 deg break on both tread edges
  washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 plain washer thickness; it is what keeps the hanger 1.6 mm clear
      of the wheel's side face
  web_hole_d:
    value: 18.0
    unit: mm
    kind: design
    source: design
    note: 'CHANGED from 14.0. It was the cause of the tangled roof: the shoulder had
      to bridge 3.9 mm of thin air to reach a Ø14 hole. At Ø18 the unsupported shoulder
      is 1.3 mm wide, and the hole still has 3 mm of clearance to the Ø11 spacer'
  web_shoulder_d:
    value: 19.5
    unit: mm
    kind: design
    source: design
    note: diameter at which the flat bearing shoulder ends and the 45 degree step
      down into the centre hole begins; sits just inside a 608 outer race's land so
      the race's whole face is backed
  web_thickness:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: = wheel_width - 2 x bearing_width; also the gap between the two inner races
  wheel_od:
    value: 50.0
    unit: mm
    kind: world
    source: asked
    note: the broken wheel was described as 'about 50 mm across'; it can no longer
      be measured
  wheel_width:
    value: 16.0
    unit: mm
    kind: world
    source: asked
    note: old wheel described as about 16 mm wide across the tread
parts:
- id: wheel
  role: final
  material: PLA (black, high-speed; 0.2 mm layers, 4-5 walls, 25-30% infill, no supports)
  code: "import cadquery as cq\n\n\ndef build(p):\n    R = p.wheel_od / 2.0      \
    \      # 25\n    W = p.wheel_width              # 16\n    Rs = p.bearing_seat_d\
    \ / 2.0     # 11.05 - bearing seat bore\n    d = p.bearing_seat_depth        #\
    \ 7 - one 608 each side\n    Rh = p.web_shoulder_d / 2.0     # 9.75 - flat shoulder\
    \ behind the outer race\n    Rw = p.web_hole_d / 2.0         # 9.0 - centre hole\n\
    \    c = p.tread_chamfer             # 1.5\n    g = p.seat_chamfer           \
    \   # 1.0\n    dz = Rh - Rw                    # 0.75 - 45 deg step down into\
    \ the hole\n\n    # Half cross-section as (radius, height above the bed), revolved\
    \ about Z.\n    # z = 0 is the bed face; the part is symmetric about z = W/2 except\
    \ for the\n    # step under the lower pocket roof.\n    prof = [\n        (Rs\
    \ + g, 0.0),      # lower seat mouth, lead-in chamfer\n        (Rs, g),\n    \
    \    (Rs, d),            # lower pocket roof - bearing A bottoms here\n      \
    \  (Rh, d),            # ... flat for only 1.3 mm (outer race face width)\n  \
    \      (Rw, d + dz),       # ... then a 45 deg stair in 0.2 mm layers\n      \
    \  (Rw, W - d),        # centre hole wall\n        (Rs, W - d),        # upper\
    \ pocket floor - printed on top of the web\n        (Rs, W - g),\n        (Rs\
    \ + g, W),        # upper seat mouth\n        (R - c, W),\n        (R, W - c),\
    \         # tread\n        (R, c),\n        (R - c, 0.0),\n    ]\n    return (cq.Workplane(\"\
    XZ\")\n            .polyline(prof)\n            .close()\n            .revolve(360.0,\
    \ (0.0, 0.0), (0.0, 1.0)))"
  print_orientation: 'Flat: bottom face (z = 0) on the bed, wheel/axle axis vertical.
    Supports OFF - both bearing pockets are designed to print without them.'
  use_orientation: Axle horizontal in use. The wheel rolls on the tread; the bolt
    passes through the two pressed-in bearings, with the spacer between their inner
    races.
- id: spacer
  role: final
  material: PLA (print 3 - they are easy to lose)
  code: "import cadquery as cq\n\n\ndef build(p):\n    return (cq.Workplane(\"XY\"\
    )\n            .circle(p.spacer_od / 2.0)\n            .circle(p.spacer_bore /\
    \ 2.0)\n            .extrude(p.spacer_len))"
  print_orientation: Flat on the bed, ring axis vertical (printed height is the 2.0
    mm length, 10 layers). Sand the two flat faces after printing.
  use_orientation: Inside the wheel's 18 mm centre hole, between the two bearings'
    inner races. It carries the axle nut's clamp load so the bearings are not preloaded
    through their balls - without it a snug 13 mm spanner would crush a 608.
- id: coupon
  role: coupon
  material: PLA (same filament and profile as the wheel)
  code: "import cadquery as cq\n\n\ndef build(p):\n    t = p.coupon_t\n    bores =\
    \ [p.coupon_bore_1, p.coupon_bore_2, p.coupon_bore_3, p.coupon_bore_4]\n    plate\
    \ = (cq.Workplane(\"XY\")\n             .box(p.coupon_len, p.coupon_w, t)\n  \
    \           .translate((0.0, 0.0, t / 2.0)))\n    for i, dia in enumerate(bores):\n\
    \        x = (i - 1.5) * p.coupon_pitch\n        cutter = (cq.Workplane(\"XY\"\
    )\n                  .center(x, 0.0)\n                  .circle(dia / 2.0)\n \
    \                 .extrude(t + 2.0)\n                  .translate((0.0, 0.0, -1.0)))\n\
    \        plate = plate.cut(cutter)\n    return plate"
  print_orientation: 'Flat: bottom face (z = 0) on the bed, bores vertical - exactly
    like the wheel''s bearing seats. Supports OFF.'
  use_orientation: Test piece only. Press a 608 into each bore; left to right they
    are 22.00, 22.10 (the wheel's value), 22.20 and 22.30 mm.
