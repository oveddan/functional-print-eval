  - coupon_bore_2
  - coupon_bore_3
  - coupon_bore_4
  - bearing_od
  - coupon_t
  check:
    method: coupon
    ref: coupon
    description: 'Find the bore that grips a 608 firmly and still takes it by hand:
      this time 22.00, 22.10 (the wheel''s value), 22.20 or 22.30. If it is not 22.10,
      tell me and I will re-cut the wheel.'
- id: c_hole_clears_axle
  part: wheel
  feature: Ø18 centre hole
  relation: clears
  hardware: axle
  clearance_mm: 5.0
  params:
  - web_hole_d
  - axle_d
  check:
    method: none
    ref: null
    description: ''
manual:
- n: '1'
  text: 'Check the axle length before printing. The stack is: hanger plate + 1.6 mm
    washer + the 16 mm wheel + 1.6 mm washer + the 8 mm lock nut = about 33 mm of
    screw under the head for a 3 mm single-plate hanger (add the second plate''s thickness
    if the wheel sits between two plates). ISO 4762 M8x40 covers it; M8x35 only for
    a single thin plate. Your own M8 bolt is fine if it measures 35 mm or more under
    the head.'
  parts: []
  hardware:
  - axle
  tool: calipers or a ruler
- n: '2'
  text: 'Print the fit coupon: PLA, 0.2 mm layers, 4 walls, 25% infill, supports OFF,
    kept flat with the bores vertical. 110 x 30 x 8 mm, four bores on a 26 mm pitch.'
  parts:
  - coupon
  hardware: []
  tool: Bambu Lab X1C, 0.4 mm nozzle
- n: '3'
  text: 'Press one 608 into each coupon bore - by hand first, then with the vice if
    it needs it. Left to right the bores are 22.00, 22.10, 22.20 and 22.30 mm. On
    the last print the 22.09 bore was the one that took a bearing snugly and held
    the wheel upside down, so 22.10 is the target: firm push, no wobble. Remember
    which bore is firmest while still going in by hand.'
  parts:
  - coupon
  hardware:
  - brg
  tool: vice or clamp + 22 mm socket
- n: '4'
  text: Print the wheel and three spacers, same settings as the coupon, wheel flat
    on the bed (axle axis vertical). Supports OFF - including inside the bearing pockets;
    the pockets are shaped to print without them. The wheel is about 31 g.
  parts:
  - wheel
  - spacer
  hardware: []
  tool: null
- n: '5'
  text: 'What changed since your last print: the seats are now 22.10 mm (they printed
    too tight before), and the roof over the lower bearing pocket is now a 1.3 mm
    ledge that steps inward 0.2 mm at a time to an 18 mm hole instead of a 3.9 mm
    bridge to a 14 mm hole. If the seats still come out too tight, warm the wheel
    in hand-hot water (about 60 C) for a minute before pressing; if they come out
    loose, wick a drop of Loctite 638 or cyanoacrylate around the bearing''s outer
    race.'
  parts:
  - wheel
  - coupon
  hardware:
  - brg
  tool: null
- n: '6'
  text: 'Before pressing, look into the lower pocket: you should see the 1.3 mm flat
    shoulder around the 18 mm hole, stepping in neatly. It may look slightly rough
    underneath - that is harmless, the hole has 3 mm of clearance to the spacer. Then
    press bearing A into the lower seat until its outer race lands flat on the shoulder,
    7 mm deep and flush with the wheel''s face. Push on the metal outer race only
    (a 22 mm socket or a short pipe makes a good pusher); never press on the shield
    or the balls. Go slowly.'
  parts:
  - wheel
  hardware:
  - brg
  tool: vice or clamp + 22 mm socket
- n: '7'
  text: Flip the wheel and press bearing B into the other seat the same way, until
    its outer race lands on the web. Both outer faces should finish flush with the
    wheel's faces.
  parts:
  - wheel
  hardware:
  - brg
  tool: null
- n: '8'
  text: Measure the gap between the two bearings' inner races, seen through the 18
    mm hole - it should be about 2.0 mm. Lay a printed spacer on 400-grit paper and
    sand its two flat faces until it just slips into that gap with no axial play.
    A tenth of a millimetre short is better than a hair long. Then drop it in so it
    rests between the two inner races, centred by the hole.
  parts:
  - wheel
  - spacer
  hardware: []
  tool: calipers, 400-grit paper
- n: '9'
  text: 'Mount it on the hanger: slide the axle through the hanger plate from the
    outside, slide a washer down the shank until it sits against the plate''s inner
    face, then slide the wheel on so the axle runs through both bearings and the spacer.
    Add the second washer and thread on the lock nut. The washer on the hanger side
    is what keeps the plate 1.6 mm clear of the wheel''s rotating face.'
  parts:
  - spacer
  - wheel
  hardware:
  - axle
  - lock_nut
  - washer
  tool: 6 mm hex key, 13 mm spanner
- n: '10'
  text: 'Tighten the lock nut until the wheel has no side-to-side play on the axle
    but still spins freely. The nut clamps only the two inner races and the spacer,
    so a snug nip by hand on a short spanner is all it needs - the nylon insert holds
    it there. Do not lean on it: the spacer is what protects the bearings, and a hard
    pull would load them through their balls.'
  parts: []
  hardware:
  - lock_nut
  tool: 13 mm spanner
- n: '11'
  text: 'Spin check before re-hanging the door: the wheel must turn freely and nothing
    - hanger plate, washer or nut - may touch the wheel''s side faces. If your hanger
    is a yoke with a plate on each side of the wheel, put a washer between each plate
    and its bearing as well (that needs about 3 mm more screw length, so use M8x45)
    and check the wheel still clears.'
  parts:
  - spacer
  - wheel
  hardware:
  - axle
  - washer
  tool: calipers or a feeler gauge
- n: '12'
  text: Re-hang the door and check it still runs at the right height and clears the
    track and the floor. If it sits too high or too low, tell me the old wheel's exact
    diameter and tread profile (flat, grooved or flanged) and I will re-cut the wheel;
    nothing else in the drawing changes.
  parts:
  - wheel
  hardware: []
  tool: null
