parts:
- id: wheel
  role: final
  material: PLA
  code: "import cadquery as cq\n\n\ndef build(p):\n    V = cq.Vector\n    up = V(0,\
    \ 0, 1)\n    R = p.wheel_od / 2.0\n    W = p.wheel_width\n    ec = p.rim_chamfer\n\
    \    br = (p.bearing_od - p.press_fit) / 2.0\n    ch = p.bore_chamfer\n    rr\
    \ = p.ridge_d / 2.0\n    rw = p.ridge_width\n\n    body = cq.Solid.makeCylinder(R,\
    \ W, V(0, 0, 0), up)\n\n    ring_t = cq.Solid.makeCylinder(R, ec, V(0, 0, W -\
    \ ec), up)\n    cone_t = cq.Solid.makeCone(R - ec, R, ec, V(0, 0, W - ec), up)\n\
    \    body = body.cut(ring_t.cut(cone_t))\n    ring_b = cq.Solid.makeCylinder(R,\
    \ ec, V(0, 0, 0), up)\n    cone_b = cq.Solid.makeCone(R, R - ec, ec, V(0, 0, 0),\
    \ up)\n    body = body.cut(ring_b.cut(cone_b))\n\n    z0 = (W - rw) / 2.0\n  \
    \  body = body.cut(cq.Solid.makeCylinder(br, z0, V(0, 0, 0), up))\n    body =\
    \ body.cut(cq.Solid.makeCylinder(br, z0, V(0, 0, W - z0), up))\n    body = body.cut(cq.Solid.makeCylinder(rr,\
    \ rw, V(0, 0, z0), up))\n\n    body = body.cut(cq.Solid.makeCone(br, br + ch,\
    \ ch, V(0, 0, ch), V(0, 0, -1)))\n    body = body.cut(cq.Solid.makeCone(br, br\
    \ + ch, ch, V(0, 0, W - ch), up))\n\n    return body\n"
  print_orientation: Wheel lying flat on the bed, axle axis vertical (world Z), z
    = 0 on the bed. One straight bore and two chamfered rim edges - no bridge and
    no overhang anywhere.
  use_orientation: Axle horizontal, wheel standing upright, on the M8 bolt between
    the door's roller fitting and the lock nut; rim sits on the track.
- id: fit-coupon
  role: coupon
  material: PLA
  code: "import cadquery as cq\n\n\ndef build(p):\n    up = cq.Vector(0, 0, 1)\n \
    \   dias = [p.fit_a, p.fit_b, p.fit_c, p.fit_d]\n    pitch = p.fit_pitch\n   \
    \ t = p.fit_bar_t\n    ch = p.bore_chamfer\n    n = len(dias)\n    L = pitch *\
    \ (n - 1) + 30.0\n    Wd = 30.0\n    body = cq.Solid.makeBox(L, Wd, t, cq.Vector(-L\
    \ / 2.0, -Wd / 2.0, 0.0))\n    x0 = -L / 2.0 + 15.0\n    for i, d in enumerate(dias):\n\
    \        r = d / 2.0\n        x = x0 + i * pitch\n        body = body.cut(cq.Solid.makeCylinder(r,\
    \ t + 2.0, cq.Vector(x, 0, -1.0), up))\n        body = body.cut(cq.Solid.makeCone(r,\
    \ r + ch, ch, cq.Vector(x, 0, ch), cq.Vector(0, 0, -1)))\n        body = body.cut(cq.Solid.makeCone(r,\
    \ r + ch, ch, cq.Vector(x, 0, t - ch), up))\n    return body\n"
  print_orientation: Bar flat on the bed, holes running vertically, z = 0 on the bed.
    No bridges - every hole is open top and bottom.
  use_orientation: Hand-held only; not part of the finished door.
