manual:
- n: '1'
  text: Print fit-coupon. A bar with four through-holes, left to right Ø21.90, 22.00,
    22.10, 22.20, each with a 1.2 mm chamfered mouth. Flat on the bed, 0.2 mm layers,
    3 walls, 15 percent infill, no supports.
  parts:
  - fit-coupon
  hardware: []
  tool: 3D printer
- n: '2'
  text: Push one 608 bearing into each hole in turn. You want a firm palm push that
    leaves no rock. The wheel is modelled at 22.00. If the 22.00 hole needs more than
    a firm push, add about +0.10 mm XY hole compensation in the slicer before printing
    the wheel; if it drops in loose, add -0.10 mm.
  parts: []
  hardware:
  - bearing
  tool: null
- n: '3'
  text: Print wheel. It is modelled lying flat with the axle vertical - print it that
    way, so the bore comes out a true circle. 0.2 mm layers, 4 walls, 5 top/bottom
    layers, 30 percent infill, no supports, no brim.
  parts:
  - wheel
  hardware: []
  tool: 3D printer
- n: '4'
  text: Push one bearing into each face of the wheel until it stops on the ridge inside.
    Each should finish about 0.4 mm below the face and neither should rock. Press
    straight in with a vise or a flat block and light taps - never hammer on the inner
    race. If one will not start, stand the wheel in hot tap water for a minute and
    try again. If one drops in loose, wick a drop of cyanoacrylate round its outer
    race.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '5'
  text: Take the broken wheel off the roller fitting on the door and leave the fitting
    in place. The M8 bolt has to pass through the fitting, so if its axle hole is
    smaller than 8.5 mm, drill it out to 8.5 mm.
  parts: []
  hardware: []
  tool: drill
- n: '6'
  text: 'Thread the axle: M8 bolt head, then through the door fitting, then a washer,
    then through the wheel (both bearings), then the second washer, then the lock
    nut.'
  parts:
  - wheel
  hardware:
  - bolt
  - washer
  - nut
  tool: null
- n: '7'
  text: Hold the bolt head with one spanner and tighten the lock nut. Clamp until
    the wheel cannot rock side to side but still spins freely, leaving about 1 mm
    of daylight between the fitting and each face of the wheel.
  parts:
  - wheel
  hardware:
  - nut
  tool: spanner
- n: '8'
  text: Hang the door back on its track. Check the wheel runs centred and quiet and
    sits on the same part of the track as the old one. Back the nut off a quarter
    turn if it feels stiff, and re-check after a day of use.
  parts:
  - wheel
  hardware: []
  tool: null
