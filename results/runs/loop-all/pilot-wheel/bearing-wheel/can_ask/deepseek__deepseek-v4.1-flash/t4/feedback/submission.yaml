task: bearing-wheel
note: 'Two changes fix the two faults you found. (1) The pocket roof is gone: the
  wheel now has one straight 22 mm bore right through it, so there is no internal
  void and nothing to bridge - the tangles you saw came from the slicer trying to
  bridge an annular pocket floor around the axle hole. A narrow ridge (21.6 mm dia
  x 1.2 mm) across the middle of the bore gives each bearing a positive stop, so you
  just push each bearing in from its own face until it stops; each ends up 0.4 mm
  below the face and the two are centred automatically. (2) The seat is now 22.00
  mm - line to line with the 608 OD - instead of 21.95, so it goes in with a firm
  push rather than needing a hammer, and the mouths are chamfered 1.2 mm to help start
  it square. The fit coupon now uses through-holes too, so it prints as cleanly as
  the wheel. Because the bearings now sit slightly inside the faces, two ISO 7089
  M8 washers go on the bolt either side of the wheel: they bear on the bearing inner
  races and hold the door fitting 1.2 mm clear of each spinning face. Still 50 x 16
  mm rim to match the old wheel.'
questions:
- text: You said the old wheel was about 50 x 16 mm - is the 16 mm the width across
    the rim including any lips, or just the running band? I modelled one plain 16
    mm band with 2 mm chamfered shoulders. If the old one had a groove round the middle
    to ride a rail, tell me its width and depth and I will add it.
  answer: null
- text: Does the door's roller fitting have a hole the axle goes through (so the M8
    bolt can pass through it), and how thick is its plate? I assumed a 3 mm plate,
    which is what the M8x30 bolt is sized for; a plate thicker than about 4.5 mm needs
    an M8x35.
  answer: null
- text: Is your own M8 bolt at least 30 mm long under the head? If it is shorter,
    use the ISO 4762 M8x30 from the list.
  answer: null
- text: What is the inside width of the track channel? I matched the rim to the old
    wheel's 16 mm instead of measuring the track, so there may be a little more side
    play than before.
  answer: null
