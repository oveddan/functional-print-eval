task: bearing-wheel
note: 'Changed, for two reasons. (1) THE BORE IS NOW A PLAIN THROUGH-HOLE: the old
  wheel had a 2 mm web between two pockets, so the pocket roof was an unsupported
  circular bridge - that is the "loose loops and tangles" you saw, and it is gone.
  Nothing inside the wheel has to bridge or be supported now. (2) THE BORE IS 22.00,
  NOT 21.85: your coupon bores all printed within 0.01 mm of nominal, which is excellent,
  but they were every one of them under the 22.000 mm bearing OD, so no bearing could
  even start. The wheel''s bore is now a line fit (22.00) with a 1.2 mm lead-in chamfer
  at each mouth, and the new coupon brackets the bearing OD (21.95 / 22.00 / 22.05
  / 22.10) so you can pick the smallest bore that still takes a bearing with a firm
  push. Print the coupon first and set wheel_bearing_bore_d to whatever that is; 22.00
  is what is drawn. The two bearings now sit back to back, touching each other, so
  the lock nut''s clamping load passes through steel rather than through printed plastic,
  and the two 3.5 mm axle rings are what locate the inner rings and hold the spinning
  rim 1.5-3.5 mm clear of the bracket plate and the washer - they cover 0-2 mm of
  bearing recess, so you do not have to press the bearings to any exact depth. Axle
  hardware is unchanged: M8x40 (or your own M8 bolt if it has 35 mm or more of shank)
  with two ISO 7089 M8 washers and an ISO 10511 M8 lock nut clamp the bearings to
  your existing bracket; it wants a bracket plate under about 6 mm thick.'
questions:
- text: Which coupon bore gave the fit you liked, and did any of them tangle or crack?
    The wheel is drawn at 22.00; tell me your number and I will hand the wheel back
    with that bore so you do not have to edit the model.
  answer: null
- text: Is the old wheel's running surface flat or grooved (for a raised rail)? I
    assumed flat - if it was grooved, give me the rail's width and I will set tread_groove_w/tread_groove_d
    so you only reprint the wheel.
  answer: null
- text: How thick is the bracket plate the axle passes through, and how long is your
    own M8 bolt under the head? I assumed a 3 mm plate and a bolt with at least 35
    mm of shank (an ISO 4762 M8x40 covers plates up to about 6 mm).
  answer: null
params:
  wheel_od:
    value: 50.0
    unit: mm
    kind: world
    source: asked
    note: old wheel was 'about 50 mm across'; keeping it keeps the door at the same
      height above the track
  wheel_w:
    value: 16.0
    unit: mm
    kind: world
    source: asked
    note: old wheel was 'about 16 mm wide'
  bracket_t:
    value: 3.0
    unit: mm
    kind: world
    source: guessed
    note: thickness of the plate the axle passes through - could not be measured;
      an M8x40 covers plates up to about 6 mm
  bracket_hole_d:
    value: 9.0
    unit: mm
    kind: world
    source: guessed
    note: axle hole in the existing bracket; must clear 8.4 mm for the M8 bolt - ream
      it out if smaller
  brg_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ outside diameter 22.000 -0.008; this is why the last coupon (every
      bore under 22.00) could not take a bearing
  brg_bore:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ bore 8.000 - the M8 shank passes through both
  brg_w:
    value: 7.0
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ width 7.000; two of them is 14 mm inside the 16 mm wheel, leaving
      2 mm of total recess
  brg_inner_ring_od:
    value: 11.6
    unit: mm
    kind: hardware
    source: guessed
    note: 608 inner-ring shoulder; the axle ring must sit inside it and press only
      the inner ring
  bolt_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8 shank; runs through both 608 bores and the two rings
  bolt_head_d:
    value: 13.0
    unit: mm
    kind: hardware
    source: catalog
    note: socket head diameter - smaller than the washer, so the washer spreads the
      load on the bracket
  bolt_head_h:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: socket head height
  bolt_len:
    value: 40.0
    unit: mm
    kind: hardware
    source: catalog
    note: 'ISO 4762 M8x40 axle bolt: 35.2 mm of clamped stack, leaving about 4.8 mm
      past the lock nut'
  bolt_thread_len:
    value: 28.0
    unit: mm
    kind: hardware
    source: catalog
    note: 'thread length from the tip on an M8x40 (M8 is fully threaded up to 35 mm):
      the lock nut sits entirely inside it'
  washer_id:
    value: 8.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 washer bore
  washer_od:
    value: 16.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 washer outside diameter - presses the 11 mm axle ring and clears
      the spinning rim
  washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 washer thickness; one under the head, one under the nut
  locknut_h:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 nylon-insert lock nut height (AF 13)
  wheel_bearing_bore_d:
    value: 22.0
    unit: mm
    kind: design
    source: design
    note: 'line fit on the 22.000 bearing OD with a 1.2 mm lead-in: your printer hits
      nominal within 0.01 mm, so at 22.00 the bearing starts on the chamfer and goes
      in with a firm push. Set this to the bore that felt right on the new coupon
      (21.95 = tight press, 22.10 = loose)'
  seat_depth:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: bearing engagement, and the fit coupon's bore depth = the 608 width; the
      wheel's own bore is a plain through-hole, there are no pockets
  max_recess:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: 'wheel_w - 2 x brg_w: the most a bearing can sit below a wheel face with
      the two bearings touching - what the axle rings have to cover'
  mouth_chamfer:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: 45 degree lead-in at each bore mouth (and on every coupon bore) so a bearing
      can start square on a line-fit hole
  rim_chamfer:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: ease on the two tread edges so the rim does not catch on the track
  tread_groove_w:
    value: 0.0
    unit: mm
    kind: design
    source: design
    note: 0 = flat tread (assumed - the old tyre could not be measured). Otherwise
      set to the rail width + 0.5
  tread_groove_d:
    value: 0.0
    unit: mm
    kind: design
    source: design
    note: 0 = flat tread; set to about 3 together with tread_groove_w if the wheel
      runs on a raised rail
  ring_od:
    value: 11.0
    unit: mm
    kind: design
    source: design
    note: axle ring OD - inside the 608 inner ring (11.6) so it can never touch the
      shield or the outer ring
  ring_id:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: matches the ISO 7089 M8 washer bore - 0.4 mm clearance on the bolt
  ring_t:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: 'axle ring thickness: with up to 2 mm of bearing recess it holds the spinning
      rim at least 1.5 mm clear of the bracket plate and the nut-side washer'
  axle_stack_len:
    value: 35.2
    unit: mm
    kind: design
    source: design
    note: washer + bracket + ring + 608 + 608 + ring + washer + lock nut, measured
      from under the head, with a 3 mm bracket and the two bearings touching - this
      is the bolt length you need
  coupon_a:
    value: 21.95
    unit: mm
    kind: design
    source: design
    note: coupon bore, 1 dot
  coupon_b:
    value: 22.0
    unit: mm
    kind: design
    source: design
    note: coupon bore, 2 dots - the value the wheel is drawn with
  coupon_c:
    value: 22.05
    unit: mm
    kind: design
    source: design
    note: coupon bore, 3 dots
  coupon_d:
    value: 22.1
    unit: mm
    kind: design
    source: design
    note: coupon bore, 4 dots
parts:
- id: wheel
  role: final
  material: PLA (high-speed black)
  code: "import cadquery as cq\n\n\ndef build(p):\n    od = p.wheel_od\n    h = p.wheel_w\n\
    \    bd = p.wheel_bearing_bore_d\n\n    # plain through-bore: no pockets, no web,\
    \ no shoulder - nothing inside the\n    # wheel has to bridge or be supported\n\
    \    body = cq.Workplane(\"XY\").circle(od / 2).extrude(h)\n    body = body.cut(cq.Workplane(\"\
    XY\").circle(bd / 2).extrude(h))\n\n    # 45 degree lead-in at both bore mouths\
    \ so a bearing starts square\n    r = bd / 2\n    c = p.mouth_chamfer\n    body\
    \ = body.cut(cq.Workplane(obj=cq.Solid.makeCone(r + c, r, c, cq.Vector(0, 0, 0))))\n\
    \    body = body.cut(\n        cq.Workplane(obj=cq.Solid.makeCone(r, r + c, c,\
    \ cq.Vector(0, 0, h - c)))\n    )\n\n    # optional tread groove (skipped while\
    \ tread_groove_d == 0, i.e. flat tread)\n    if p.tread_groove_d > 0 and p.tread_groove_w\
    \ > 0:\n        zi = h / 2 - p.tread_groove_w / 2\n        zo = h / 2 + p.tread_groove_w\
    \ / 2\n        rin = od / 2 - p.tread_groove_d\n        rout = od / 2 + 1\n  \
    \      prof = (\n            cq.Workplane(\"XZ\")\n            .moveTo(rin, zi)\n\
    \            .lineTo(rout, zi)\n            .lineTo(rout, zo)\n            .lineTo(rin,\
    \ zo)\n            .close()\n            .revolve(360, (0, 0, 0), (0, 0, 1))\n\
    \        )\n        body = body.cut(prof)\n\n    # ease the tread edges\n    try:\n\
    \        body = body.edges(cq.selectors.NearestToPointSelector((od / 2, 0, 0))).chamfer(\n\
    \            p.rim_chamfer\n        )\n        body = body.edges(cq.selectors.NearestToPointSelector((od\
    \ / 2, 0, h))).chamfer(\n            p.rim_chamfer\n        )\n    except Exception:\n\
    \        pass\n\n    return body\n"
  print_orientation: 'flat on one rim face: the axis is vertical (Z), z = 0 is the
    lower rim face. Plain vertical bore, so no supports and nothing to bridge.'
  use_orientation: 'axis horizontal, perpendicular to the door: the as-printed lower
    face points at the bracket plate, the upper face at the lock nut; the tread runs
    on the track.'
- id: axle_ring
  role: final
  material: PLA (high-speed black)
  code: "import cadquery as cq\n\n\ndef build(p):\n    ring = cq.Workplane(\"XY\"\
    ).circle(p.ring_od / 2).extrude(p.ring_t)\n    return ring.cut(cq.Workplane(\"\
    XY\").circle(p.ring_id / 2).extrude(p.ring_t))\n"
  print_orientation: 'flat: one ring face on the bed, axis vertical (Z). Print 2 identical
    rings.'
  use_orientation: 'axis horizontal, coaxial with the M8 bolt: the +Z face lands on
    a bearing''s inner ring, the bed face (z = 0) takes the bracket plate on one side
    and the washer + lock nut on the other.'
- id: fit_coupon
  role: coupon
  material: PLA (high-speed black)
  code: "import cadquery as cq\n\n\ndef build(p):\n    bores = [p.coupon_a, p.coupon_b,\
    \ p.coupon_c, p.coupon_d]\n    t = p.seat_depth  # same bearing engagement as\
    \ the wheel\n    pitch = 32.0\n    w = 40.0\n    length = pitch * (len(bores)\
    \ - 1) + w\n    c = p.mouth_chamfer\n\n    plate = cq.Workplane(\"XY\").box(length,\
    \ w, t).translate((0, 0, t / 2))\n    x0 = -pitch * (len(bores) - 1) / 2\n   \
    \ for i, d in enumerate(bores):\n        x = x0 + i * pitch\n        r = d / 2\n\
    \        plate = plate.cut(cq.Workplane(\"XY\").moveTo(x, 0).circle(r).extrude(t))\n\
    \        # the same lead-in chamfer as the wheel, so the coupon feels exactly\
    \ the same\n        plate = plate.cut(\n            cq.Workplane(obj=cq.Solid.makeCone(r\
    \ + c, r, c, cq.Vector(x, 0, t - c)))\n        )\n        # dots mark the bore:\
    \ 1 dot = smallest ... 4 dots = largest\n        for k in range(i + 1):\n    \
    \        plate = plate.cut(\n                cq.Workplane(\"XY\").moveTo(x - 6\
    \ + 4 * k, -16).circle(0.9).extrude(t)\n            )\n    return plate\n"
  print_orientation: 'flat on the bed: bores vertical (Z), 7 mm deep, with the same
    1.2 mm lead-in chamfers as the wheel.'
  use_orientation: 'a test piece only: push a 608ZZ into each bore, 1 dot (21.95)
    to 4 dots (22.10), and pick the smallest one that takes a firm push.'
