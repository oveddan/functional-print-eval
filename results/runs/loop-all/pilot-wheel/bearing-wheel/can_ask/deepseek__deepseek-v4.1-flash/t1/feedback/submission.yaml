  fastener: axle_bolt
  axis_origin:
  - 0.0
  - 0.0
  - -4.6
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: axle_ring
    feature: shoulder_face_a
    role: head_seat
  - part: wheel
    feature: bearing_bore
    role: clearance
  - part: axle_ring
    feature: shoulder_face_b
    role: washer
  nut: locknut
  external: null
criteria:
- id: bearing_fit
  part: wheel
  feature: bearing_bore
  relation: seats
  hardware: brg
  clearance_mm: 0.0
  params:
  - wheel_bearing_bore_d
  - brg_od
  - mouth_chamfer
  check:
    method: coupon
    ref: fit_coupon
    description: push a 608ZZ into each coupon bore (1 dot = 21.95, 2 = 22.00, 3 =
      22.05, 4 = 22.10); the wheel is drawn at 22.00 (2 dots) - set wheel_bearing_bore_d
      to the smallest bore that takes the bearing with a firm push and light taps
- id: no_internal_bridge
  part: wheel
  feature: bearing_bore
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - wheel_bearing_bore_d
  - wheel_w
  check:
    method: none
    ref: null
    description: the bore is a plain through-hole - no web, no shoulder, no internal
      roof - so nothing inside the wheel has to bridge (the earlier version's pocket
      roof is what tangled)
- id: ring_presses_inner_ring_only
  part: axle_ring
  feature: shoulder_face_a
  relation: seats
  hardware: brg
  clearance_mm: 0.6
  params:
  - ring_od
  - brg_inner_ring_od
  check:
    method: measure
    ref: null
    description: 'measure across the 608''s inner-ring face (the ring around the 8
      mm bore): it must be wider than 11.6 mm so the 11.0 mm axle ring lands on the
      inner ring and never rubs the shield or the balls'
- id: rim_clearance
  part: wheel
  feature: side_face
  relation: clears
  hardware: null
  clearance_mm: 1.5
  params:
  - ring_t
  - max_recess
  - washer_od
  check:
    method: none
    ref: null
    description: with each bearing pressed in flush to 2 mm deep, the 3.5 mm ring
      reaches at least 1.5 mm past the rim, so neither the bracket plate nor the nut-side
      washer can touch the spinning rim
- id: ring_bore_clears_bolt
  part: axle_ring
  feature: bolt_bore
  relation: clears
  hardware: axle_bolt
  clearance_mm: 0.4
  params:
  - ring_id
  - bolt_d
  check:
    method: none
    ref: null
    description: the ring slides on the 8 mm shank and is clamped between the bracket/washer
      (head side) or the washer/lock nut (nut side)
- id: axle_length
  part: axle_ring
  feature: shoulder_face_b
  relation: engages
  hardware: axle_bolt
  clearance_mm: null
  params:
  - axle_stack_len
  - bolt_len
  - bolt_thread_len
  - bracket_t
  - locknut_h
  check:
    method: none
    ref: null
    description: the two bearings sit back to back and touch, so the clamping load
      passes through steel and not through printed plastic; the clamped stack is 35.2
      mm from under the head with a 3 mm bracket, and the M8x40 leaves the lock nut
      fully inside the thread with about 4.8 mm spare (plates up to about 6 mm)
- id: tread_matches_track
  part: wheel
  feature: tread
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - wheel_w
  - tread_groove_w
  - tread_groove_d
  check:
    method: none
    ref: null
    description: 'assumed flat: 16 mm wide, 50 mm across, the same as the old wheel.
      If the old tyre had a groove for a raised rail, set tread_groove_w = rail width
      + 0.5 and tread_groove_d = 3 and reprint just the wheel'
manual:
- n: '1'
  text: 'Print the fit coupon flat on the bed (PLA, 0.2 mm, 4 perimeters). Push one
    608ZZ into each bore, starting it square on the lead-in chamfer, smallest end
    first: 1 dot = 21.95, 2 dots = 22.00, 3 dots = 22.05, 4 dots = 22.10. A mallet
    and a flat block that covers the whole bearing face is fair game. Pick the SMALLEST
    bore that takes a bearing with a firm push and does not drop in with a rattle
    - that is your fit number. The wheel is drawn as 22.00 (2 dots); if that is not
    the one you picked, change wheel_bearing_bore_d to your number before slicing
    the wheel.'
  parts:
  - fit_coupon
  hardware:
  - brg
  tool: mallet and flat block, or a vise
- n: '2'
  text: Print the wheel flat on one rim face - the axis vertical, the bore a plain
    vertical hole - PLA 0.2 mm, 4 perimeters, no supports. There is no pocket roof
    and no web in this one, so nothing inside it should tangle.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '3'
  text: Print the axle ring twice, flat on the bed (PLA, 0.2 mm, 4 perimeters).
  parts:
  - axle_ring
  hardware: []
  tool: null
- n: '4'
  text: 'Fit the bearings. Set the wheel on the bench, drop one 608ZZ into the bore,
    lay a wide flat block over it and press or tap down: the block stops on the wheel''s
    face, so the bearing ends up flush with that face. Then press the second bearing
    in from the other face - it stops when it hits the first one, about 2 mm in, and
    that is fine. If the fit is stiff, warm the wheel in ~50 C water for a minute
    and dry it, or freeze the bearings for 15 minutes first. Never tap on the shield.'
  parts:
  - wheel
  hardware:
  - brg
  tool: mallet and flat block, or a vise
- n: '5'
  text: 'Check the door''s bracket: the axle hole must clear the M8 bolt, at least
    8.4 mm across - drill or ream it to 8.5 mm if it is smaller. Keep the plate it
    passes through under about 6 mm. Your own M8 bolt is fine in place of the M8x40
    so long as it has at least 35 mm of shank under the head.'
  parts: []
  hardware:
  - axle_bolt
  tool: drill
- n: '6'
  text: 'Assemble on the axle: washer, then the bolt through the bracket from the
    outside, then an axle ring over the shank, then the wheel on its two bearings,
    then the second axle ring, the second washer and the ISO 10511 M8 lock nut. Each
    ring must land on a bearing''s inner ring only - at 11 mm across it cannot reach
    anything else. Snug it by hand plus a light nip with a wrench; the rings and the
    bracket are the stops, and there is no plastic in the clamp stack.'
  parts:
  - axle_ring
  - wheel
  hardware:
  - axle_bolt
  - locknut
  - washer_head
  - washer_nut
  tool: wrench
- n: '7'
  text: 'Spin test: the wheel should turn freely, with 1.5-3.5 mm of gap between the
    rim and the bracket plate on one side and the washer on the other. If it drags,
    back the lock nut off a touch. Side play along the axle should be at most about
    a millimetre; if the wheel slides freely along the bolt by more than that, the
    bore came out loose - add a drop of superglue at each bore/bearing joint, or reprint
    the wheel with the next bore size down.'
  parts:
  - axle_ring
  - wheel
  hardware: []
  tool: null
- n: '8'
  text: Refit the door on its track and roll it end to end. If the door now rides
    a millimetre or two high or low, the new tyre is slightly different across from
    the old one and the door's hanger height needs a turn.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '9'
  text: 'Only if your old wheel had a groove in its running surface (i.e. it ran on
    a raised rail rather than a flat surface): set tread_groove_w to the rail''s width
    + 0.5 and tread_groove_d to about 3, reprint the wheel, and press the bearings
    out of the old one to reuse them.'
  parts:
  - wheel
  hardware: []
  tool: null
