task: bearing-wheel
note: 'WHAT CHANGED SINCE YOUR PRINT. (1) The wheel''s bore: you printed 21.89 and
  the bearing would not go in, so the bore is now 21.96 - a 0.04 mm interference on
  the 22.00 mm bearing instead of 0.11 - and the manual now gives you four ways to
  seat it, in order: the warm-water fit (50 C for 2 minutes, PLA softens well below
  boiling, then press while warm - it grips hard on cooling), then a vise/clamp through
  a 22 mm socket, then reaming with a 22 mm drill or 240-grit, and finally superglue
  if it ends up loose. Nothing else about W1 changed: same code, same print orientation,
  only the one parameter moved. (2) The coupon C1 was broken and would not open -
  sorry for the wasted print. The cause: its entry chamfer was a cone whose base circle
  sat exactly on the bore''s cylindrical wall, a coincident/tangent face pair that
  can leave an invalid solid, so the exported file was unusable. The chamfer base
  is now strictly inside the bore and the boss/pocket solids are fused before any
  cut is taken, so no cut body is ever unioned back in. C1 now has three pockets at
  Ø21.90 / Ø21.96 / Ø22.10: the middle one is exactly the wheel''s bore, so a bearing
  you can press into the middle pocket by hand or with a clamp is a bearing you can
  fit into the wheel. Measure the pockets too - your last print came out 0.01 mm under
  nominal, which is why 21.96 should land at about 21.95. THE REST OF THE DESIGN,
  UNCHANGED. W1 is a Ø50 x 16 mm PLA tyre whose hub takes both 608ZZ bearings side
  by side (2 x 7 mm) in a 14 mm deep bore, stopped by a 2 mm internal lip, so the
  wheel spins on the bearings and the bearings spin on your M8 bolt''s plain shank
  (22 mm of unthreaded shank, then 28 mm of thread). The 2 mm lip is sized around
  the 1.6 mm washer so the Ø16 washer and the hex nut can pass through the Ø19 lip
  opening and clamp the bearing''s INNER ring - that is what stops the wheel rubbing
  instead of spinning. Axle stack, head to tip: bolt head (in the hub, on the top
  bearing''s inner ring) | wheel | washer | ISO 4032 hex nut | hanger plate | ISO
  10511 lock nut; about 31 mm plus your hanger''s thickness, hence the catalogue M8x50.
  Your own bolt works if it is at least ~40 mm under the head with a plain shank through
  the wheel. The two 608s are yours, so they are not catalogue hardware; they live
  in the parameters (Ø22.0 od, Ø8.0 bore, 7.0 wide). The tread stays a plain cylinder
  on purpose: neither the broken wheel''s profile nor the rail could be measured,
  and a plain tread rolls on both a flat bar and a rib, while the code still accepts
  a round groove if you later measure a rib. LIMITATIONS I RAN INTO: no shoulder bolt,
  spacer or retaining ring is on the hardware list, so the axle relies on a plain
  screw, washers and two nuts, and the head/washer can kiss the bearing''s shield
  if over-tightened; and only PLA is available, which creeps under a door''s standing
  load and relaxes a press fit over the years, so the superglue fallback matters more
  than it would in PETG or ASA.'
questions:
- text: What do C1's three pockets measure across the top with calipers, and how did
    the 608 go into each? That tells me where to put the wheel's bore next time -
    if the Ø21.96 middle pocket still will not take a bearing by hand, I will open
    the wheel's bore to about 22.06 and have you glue the bearings in instead.
  answer: null
- text: 'Measure one 608 bearing''s outside diameter properly: jaws square across
    the outer ring, not pinched on the tips, and a second reading 90 degrees round.
    If it comes out over 22.00 mm the bearing is the reason the first bore was so
    tight.'
  answer: null
- text: How thick is the hanger plate the axle passes through, and what diameter is
    the axle hole in it? (Thickness confirms the M8x50 is long enough; the hole diameter
    tells me whether the bolt fits snugly or needs a printed bushing.)
  answer: null
- text: Is the rail the wheel rolls on a flat steel bar, or a rib/rail that a grooved
    wheel would sit on? Everything works with the plain tread as submitted, but a
    measured rib lets me add the groove.
  answer: null
params:
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ bore; the M8 bolt's ~8 mm shank runs in it
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ nominal OD 22.000 -0.008. Your earlier caliper reading of 21.22 pinched
      the bearing at the jaw tips; if a square, careful re-measure of your bearing
      comes out bigger than 22.00, tell me - that would explain the tight seat and
      I would open the bore further
  bearing_width:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ width; two stacked = 14.0 mm
  bolt_len:
    value: 50
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8x50 socket head cap screw
  bolt_plain_len:
    value: 22
    unit: mm
    kind: hardware
    source: catalog
    note: 50 - 28 mm thread = 22 mm plain shank, which covers the 16 mm wheel plus
      the 1.6 mm washer before the threads start; the bearings run on plain metal,
      not on thread
  groove_depth:
    value: 0
    unit: mm
    kind: design
    source: design
    note: 'PLAIN tread, deliberately: the rail could not be measured, and a plain
      cylinder rolls correctly on both a flat bar and a rounded rib, whereas a grooved
      wheel only works on a rib. Set >0 (and groove_width) to add a round groove'
  groove_width:
    value: 4
    unit: mm
    kind: design
    source: design
    note: used only if groove_depth is changed to > 0; sized for a ~4 mm rib
  lip_id:
    value: 19
    unit: mm
    kind: design
    source: design
    note: small enough to catch the bearing's outer ring (face spans Ø16.5-22), large
      enough to clear the shield (~Ø16.5), the Ø16 washer, the Ø15 nut corners and
      the bolt
  lip_t:
    value: 2
    unit: mm
    kind: design
    source: design
    note: 0.4 mm deeper than the 1.6 mm washer, so the washer and the nut can reach
      the bearing's inner ring inside the lip while the nut's face stops 0.4 mm clear
      of the hub face
  nut_a_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M8 hex nut - clamps the wheel's inner rings
  nut_b_h:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 nylon-insert lock nut - traps the hanger plate so vibration
      cannot loosen the axle
  recess_depth:
    value: 2
    unit: mm
    kind: design
    source: design
    note: opens upward when printed flat, so no supports and no bridging
  recess_id:
    value: 28
    unit: mm
    kind: design
    source: design
    note: leaves a 3 mm wall around the bearing hub
  recess_od:
    value: 46
    unit: mm
    kind: design
    source: design
    note: 'top-face lightening pocket: leaves a 2 mm rim at the tread'
  seat_bore_d:
    value: 21.96
    unit: mm
    kind: design
    source: design
    note: 'CHANGED from 21.90 to 21.96: a 0.04 mm interference on the 22.00 bearing
      OD, a light press instead of the 0.11 you could not press in. Your print measured
      21.89 for the 21.90 bore, so this should land near 21.95. Fallbacks in the manual:
      warm water, clamp, ream, glue'
  shaft_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: 'owner''s reading across the M8 bolt''s shank: ''about 8 mm'''
  test_slip_d:
    value: 22.1
    unit: mm
    kind: design
    source: design
    note: 'coupon C1 only: plain bore with 0.10 mm clearance on the bearing, for a
      glued-in bearing if the wheel''s light press still proves too tight for you'
  test_tight_d:
    value: 21.9
    unit: mm
    kind: design
    source: design
    note: 'coupon C1 only: plain bore with 0.10 mm interference, the size that just
      failed in your hand, kept as a reference point'
  washer_od:
    value: 16
    unit: mm
    kind: hardware
    source: catalog
    note: fits through the Ø19 lip recess and lands on the bearing's inner ring without
      touching the hub
  washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: the broken wheel was 'about 50 mm across'; the pieces could not be re-measured,
      so this stands as given. Keeps the door at its old height
  wheel_width:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: '''about 16 mm wide''. Holds two 7 mm 608 bearings (14 mm) plus the 2 mm
      retaining lip'
parts:
- id: W1
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    R = p.wheel_od / 2.0          # tread radius\n    W =\
    \ p.wheel_width             # overall width\n    seat_r = p.seat_bore_d / 2.0\
    \  # bearing press-fit bore (21.96 -> 0.04 interference)\n    lip_r = p.lip_id\
    \ / 2.0\n    t = p.lip_t\n\n    s = cq.Solid.makeCylinder(R, W, cq.Vector(0, 0,\
    \ 0))\n\n    # optional round tread groove - skipped while groove_depth = 0 (plain\
    \ tread)\n    if p.groove_depth > 0.01:\n        gd = p.groove_depth\n       \
    \ gw = p.groove_width\n        rg = (gd * gd + (gw / 2.0) ** 2) / (2.0 * gd) \
    \  # arc through the groove edges\n        s = s.cut(cq.Solid.makeTorus(R - gd\
    \ + rg, rg, cq.Vector(0, 0, W / 2.0)))\n\n    # 0.6 x 45 chamfer on the bed-side\
    \ running edge (kills the elephant-foot flare)\n    ch = 0.6\n    tool = cq.Solid.makeCylinder(R\
    \ + 1.0, 2.0, cq.Vector(0, 0, -1.0))\n    tool = tool.cut(cq.Solid.makeCone(R\
    \ - ch - 1.0, R - ch + 1.0, 2.0, cq.Vector(0, 0, -1.0)))\n    s = s.cut(tool)\n\
    \n    # bearing seat: two 7 mm 608s (14 mm), open at the top face\n    s = s.cut(cq.Solid.makeCylinder(seat_r,\
    \ W - t + 0.5, cq.Vector(0, 0, t)))\n    # retaining lip: catches the outer ring,\
    \ clears shield / washer / nut / bolt\n    s = s.cut(cq.Solid.makeCylinder(lip_r,\
    \ t + 0.5, cq.Vector(0, 0, -0.5)))\n    # lead-in chamfer at the seat mouth (base\
    \ radius strictly inside the bore, so\n    # no coincident/tangent faces are created\
    \ in the Boolean)\n    s = s.cut(cq.Solid.makeCone(seat_r - 0.2, seat_r + 1.5,\
    \ 1.7, cq.Vector(0, 0, W - 1.2)))\n\n    # lightening pocket in the top face\n\
    \    ro = p.recess_od / 2.0\n    ri = p.recess_id / 2.0\n    pk = cq.Solid.makeCylinder(ro,\
    \ p.recess_depth + 0.5, cq.Vector(0, 0, W - p.recess_depth))\n    pk = pk.cut(cq.Solid.makeCylinder(ri,\
    \ p.recess_depth + 2.0, cq.Vector(0, 0, W - p.recess_depth - 1.0)))\n    s = s.cut(pk)\n\
    \    return s\n"
  print_orientation: 'Flat, wheel axis vertical: the bottom face (with the Ø19 lip
    opening) on the bed, the ring-shaped lightening pocket facing up. No supports,
    no bridging, 3-4 walls, 25% infill. Identical to the print you already made -
    only the bore diameter changed.'
  use_orientation: Axis horizontal on the M8 bolt, Ø50 tread running on the rail;
    the lip/recess face points up (the part is handed but either face works against
    the rail).
- id: C1
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    pl, pw, pt = 108.0, 40.0, 3.0     # base plate\n    bod,\
    \ bh = 30.0, 10.0              # boss each test bore sits in\n    xs = (-32.0,\
    \ 0.0, 32.0)\n    ds = (p.test_tight_d, p.seat_bore_d, p.test_slip_d)   # 21.90\
    \ / 21.96 (wheel) / 22.10\n\n    # plate and bosses fused FIRST, so no body that\
    \ has had a cut taken out of it\n    # is ever unioned back in (that is what broke\
    \ the previous coupon)\n    s = cq.Solid.makeBox(pl, pw, pt, cq.Vector(-pl / 2.0,\
    \ -pw / 2.0, 0.0))\n    for x in xs:\n        s = s.union(cq.Solid.makeCylinder(bod\
    \ / 2.0, bh + 0.5, cq.Vector(x, 0.0, pt - 0.5)))\n\n    for x, d in zip(xs, ds):\n\
    \        # test bore, open at the top\n        s = s.cut(cq.Solid.makeCylinder(d\
    \ / 2.0, bh + 2.0, cq.Vector(x, 0.0, pt - 1.0)))\n        # entry chamfer: cone\
    \ base sits strictly inside the bore, top exits above the\n        # boss face\
    \ - no tangent or coincident faces anywhere\n        s = s.cut(cq.Solid.makeCone(d\
    \ / 2.0 - 0.15, d / 2.0 + 2.0, 2.3, cq.Vector(x, 0.0, pt + bh - 2.3)))\n     \
    \   # Ø16 push-out hole through the plate, so the bearing can be pressed back\
    \ out\n        s = s.cut(cq.Solid.makeCylinder(8.0, 4.0, cq.Vector(x, 0.0, -1.0)))\n\
    \n    # corner notch marks the smallest (Ø21.90) bore at the notched end\n   \
    \ s = s.cut(cq.Solid.makeBox(10.0, 10.0, pt + bh + 6.0, cq.Vector(-pl / 2.0, pw\
    \ / 2.0 - 10.0, -2.0)))\n    return s\n"
  print_orientation: 'Flat: the 108 x 40 x 3 base plate on the bed, the three Ø30
    bosses pointing up. No supports.'
  use_orientation: Handling test piece only, printed before W1 to check the bearing
    fit and to see how much this printer shrinks a hole.
