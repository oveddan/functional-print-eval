params:
  access_d:
    value: 17
    unit: mm
    kind: design
    source: design
    note: washer access hole in the closed face; wider than the 16 mm washer, narrower
      than the 22 mm bearing OD so the outer ring is still stopped
  access_t:
    value: 1
    unit: mm
    kind: design
    source: design
    note: thickness of the closed face and bearing seat at z=0; the 1.6 mm washer
      stands 0.6 mm proud of it
  bolt_d:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: M8 nominal; this is what you measured across the shank
  bolt_len:
    value: 40
    unit: mm
    kind: hardware
    source: design
    note: 'M8x40 ISO 4762 covers a bracket up to about 14 mm thick: 17.2 mm steel
      stack plus bracket plus 8 mm nut'
  brg_bore:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ bore; the M8 shank slips inside it
  brg_od:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ OD 22.000; the 21.22 reading was the bearing pinched at the jaw tips
      and reads low
  brg_w:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ width; two stacked give the 14 mm the bore is sized for
  coupon_len:
    value: 104
    unit: mm
    kind: design
    source: design
    note: coupon plate length
  coupon_t:
    value: 10
    unit: mm
    kind: design
    source: design
    note: coupon plate thickness, i.e. test bore depth
  coupon_w:
    value: 30
    unit: mm
    kind: design
    source: design
    note: coupon plate width
  coupon_x_in:
    value: 13
    unit: mm
    kind: design
    source: design
    note: inner pair of test bores, 26 mm apart
  coupon_x_out:
    value: 39
    unit: mm
    kind: design
    source: design
    note: outer pair of test bores, 78 mm apart
  lead_in:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: 0.5 mm deep by 0.5 mm radial relief at the bore mouth so the bearing starts
      square
  nut_h:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 lock nut height
  pocket_d:
    value: 21.9
    unit: mm
    kind: design
    source: design
    note: press-fit bore for the 608 outer ring; confirm on coupon_fit and change
      if the winner is a different size
  pocket_dep:
    value: 15
    unit: mm
    kind: design
    source: design
    note: depth of the bearing bore, z=1 to z=16; holds both 7 mm bearings plus the
      1 mm mouth lip
  test_d1:
    value: 21.7
    unit: mm
    kind: design
    source: design
    note: coupon test bore 1 (left-most), 0.2 mm under nominal
  test_d2:
    value: 21.9
    unit: mm
    kind: design
    source: design
    note: coupon test bore 2; same as the wheel's default pocket_d
  test_d3:
    value: 22.1
    unit: mm
    kind: design
    source: design
    note: coupon test bore 3
  test_d4:
    value: 22.3
    unit: mm
    kind: design
    source: design
    note: coupon test bore 4 (right-most), 0.3 mm over nominal
  washer_od:
    value: 16
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 OD; must stay under the bearing outer-ring bore (~19) so it
      bears on the inner ring only
  washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 thickness; stands 0.6 mm proud of the 1 mm closed face and of
      the 1 mm mouth lip
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: diameter of the broken wheel; the replacement matches it so door height
      and track clearance are unchanged
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: width of the broken wheel; also 14 mm of bearings plus a 1 mm lip each side
parts:
- id: wheel
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    # Frame: z=0 is the bed = the closed face; the bearing\
    \ bore opens upward to z=wheel_w.\n    r_out = p[\"wheel_od\"] / 2.0\n    w =\
    \ float(p[\"wheel_w\"])\n    r_pk = p[\"pocket_d\"] / 2.0\n    r_acc = p[\"access_d\"\
    ] / 2.0\n    t_acc = float(p[\"access_t\"])\n    dep = float(p[\"pocket_dep\"\
    ])\n    lead = float(p[\"lead_in\"])\n\n    # solid disc\n    part = cq.Workplane(\"\
    XY\").circle(r_out).extrude(w)\n\n    # bearing bore: 21.9 dia, floor at z = access_t,\
    \ opening at the top face\n    bore = cq.Workplane(\"XY\").circle(r_pk).extrude(dep)\n\
    \    bore = bore.translate((0.0, 0.0, t_acc))\n    part = part.cut(bore)\n\n \
    \   # relief at the bore mouth so the bearing starts square\n    relief = cq.Workplane(\"\
    XY\").circle(r_pk + lead).extrude(lead)\n    relief = relief.translate((0.0, 0.0,\
    \ w - lead))\n    part = part.cut(relief)\n\n    # washer access hole straight\
    \ through the closed face\n    acc = cq.Workplane(\"XY\").circle(r_acc).extrude(w)\n\
    \    part = part.cut(acc)\n\n    return part\n"
  print_orientation: closed face (the 17 mm hole) flat on the bed, bearing bore opening
    upward; z=0 is the bed, wheel axis vertical
  use_orientation: axis horizontal, the 17 mm access hole facing the bracket, so the
    head washer drops into the recess and seats on the near bearing's inner ring
- id: coupon_fit
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    L = float(p[\"coupon_len\"])\n    W = float(p[\"coupon_w\"\
    ])\n    T = float(p[\"coupon_t\"])\n    xs = [-float(p[\"coupon_x_out\"]), -float(p[\"\
    coupon_x_in\"]),\n          float(p[\"coupon_x_in\"]), float(p[\"coupon_x_out\"\
    ])]\n    ds = [float(p[\"test_d1\"]), float(p[\"test_d2\"]),\n          float(p[\"\
    test_d3\"]), float(p[\"test_d4\"])]\n\n    # flat plate, z = 0 on the bed, top\
    \ face at z = coupon_t\n    part = cq.Workplane(\"XY\").box(L, W, T, centered=(True,\
    \ True, False))\n\n    for x, d in zip(xs, ds):\n        hole = cq.Workplane(\"\
    XY\").circle(d / 2.0).extrude(T)\n        hole = hole.translate((x, 0.0, 0.0))\n\
    \        part = part.cut(hole)\n\n    return part\n"
  print_orientation: flat on the bed, test bores vertical, z=0 on the bed
  use_orientation: press one 608 into each bore in turn; keep the one that needs firm
    hand pressure
