task: bearing-wheel
note: 'Both files failed to export last time, which almost certainly means one build()
  function raised and the whole batch was lost. I have rebuilt both parts using only
  cylinders and boolean cuts (no revolved polylines, no lofts, no edge chamfers),
  so they should export cleanly now. The rim chamfers are gone; step 5 has you deburr
  those edges by hand instead, which is better anyway because it also removes the
  elephant-foot bulge on the edge that rolls in the track.


  What you are printing. Two stacked 608s are exactly 14 mm wide, which is why the
  old wheel was about 16 mm: the wheel is a 50 x 16 mm roller with a 21.9 mm bore
  that both bearings press into, and your M8 bolt is the axle.


  The one part worth understanding. Both bearings go in from the SAME side and butt
  face to face in the middle, so their two inner rings touch. That matters: the two
  M8 washers clamp the inner rings against each other, so the tightening load never
  passes through the balls and never passes through the plastic. Nothing is preloaded,
  the wheel is located axially with only the bearings'' own internal clearance, and
  you can tighten the nut as firmly as you like. That is why there is no spacer or
  shoulder between the bearings - the washer reaches the inner ring through a 17 mm
  hole in the closed face. 17 mm is deliberate: wide enough for the 16 mm washer to
  drop through, narrow enough that the 22 mm bearing outer ring is still stopped by
  the 1 mm seat.


  Two smaller points:

  - The washer has to stick out of the wheel, or your bracket presses on the spinning
  wheel face. The closed face is 1 mm and the ISO 7089 M8 washer is 1.6 mm, so it
  stands 0.6 mm proud. Use the standard 1.6 mm washers.

  - The bearing bore must be a press fit, and that is the one thing a printer cannot
  be trusted to hit. Print coupon_fit first and press a bearing into each bore; the
  winner needs firm hand pressure and will not pull out. If it is not 21.9 mm, set
  pocket_d to that number and re-export. 21.9 mm is the default.


  Bolt length: the clamped steel stack is 1.6 + 7 + 7 + 1.6 = 17.2 mm. Add your bracket
  thickness and about 8 mm for the lock nut, so M8x40 covers a bracket up to roughly
  14 mm thick. Use M8x45 or M8x50 if yours is thicker - the bearings slide over the
  thread fine if it comes to that.


  Still unresolved: every attempt to measure your bracket or the bolt came back as
  the bolt''s shank diameter (8 mm). That confirmed the M8 but left the bracket''s
  slot width and plate thickness unknown, so the design is dimensioned around the
  wheel and bearings, and the manual works for either a single-plate bracket or a
  U-shaped one. If your bracket holds the wheel between two ears with a fixed gap,
  nothing changes - the bolt just passes through both ears and the wheel.'
