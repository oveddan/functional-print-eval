manual:
- n: '1'
  text: Print coupon_fit flat on the bed in PLA at 0.2 mm layers. It is a 104 x 30
    x 10 mm strip with four vertical test bores; from left (-X) to right (+X) they
    are 21.7, 21.9, 22.1 and 22.3 mm.
  parts:
  - coupon_fit
  hardware: []
  tool: null
- n: '2'
  text: Wipe one 608 clean of grease, then press it into each of the four bores in
    turn. Keep the bore that needs firm hand pressure or a light tap to enter and
    that will not come out when you pull the bearing by hand. Note which one it was.
  parts:
  - coupon_fit
  hardware:
  - bearing
  tool: your hands, then a vice or a light mallet and a flat block
- n: '3'
  text: 'If the winning bore is not 21.9 mm, open part ''wheel'' and set pocket_d
    to the winning number (21.7, 22.1 or 22.3), then re-export. Do not fix a loose
    bore by sanding the wheel: the outer ring must be gripped, or it will spin and
    chew the plastic.'
  parts:
  - coupon_fit
  - wheel
  hardware: []
  tool: null
- n: '4'
  text: 'Print the wheel as modelled: closed face down on the bed, bore opening up.
    No supports, no raft, no brim. The bore is a vertical hole and the only horizontal
    face is a 2.45 mm ring, so nothing needs support. Keep the rolling rim solid over
    its full 16 mm width.'
  parts:
  - wheel
  hardware: []
  tool: null
- n: '5'
  text: 'Deburr the rim: scrape or sand the rim edge that was on the bed until the
    elephant-foot bulge is gone, and break the other rim edge lightly too. That edge
    is what rolls in the track, so it must be clean and sharp-ish, not flared.'
  parts:
  - wheel
  hardware: []
  tool: knife or deburring tool, then 240 grit
- n: '6'
  text: Press the first 608 into the open bore from the top and drive it all the way
    down until it stops on the 1 mm seat - you will feel it hit bottom. Then press
    the second 608 in behind it until it stops hard against the first. Both bearings
    go in from the SAME side. When the second is home you will see a 1 mm deep lip
    of plastic standing around it and the two bearings touching face to face in the
    middle.
  parts:
  - wheel
  hardware:
  - bearing
  tool: a vice with a socket or flat plate, plus a drift that fits inside the 21.9
    mm bore
- n: '7'
  text: 'Check the axle: slide the M8 bolt shank through both bearing bores. It must
    slip through by hand with only a trace of play - bearing bore 8.000 mm, bolt shank
    about 7.85 mm, so this is a slip fit, not a press fit. If it will not go, the
    shank is oversize or burred; dress it with a file rather than forcing it.'
  parts:
  - wheel
  hardware:
  - bolt
  - bearing
  tool: null
- n: '8'
  text: 'Build the axle: bolt head outside your door''s bracket, shank through the
    bracket''s axle hole. Slide one M8 washer on, then slide the wheel on with its
    small 17 mm hole facing the bracket so the washer drops into the recess and lands
    flat on the near bearing''s inner ring. The wheel''s own face must stay clear
    of the bracket - the washer, not the wheel, is what touches.'
  parts:
  - wheel
  hardware:
  - bolt
  - washer
  tool: null
- n: '9'
  text: 'Slide the second M8 washer on and fit the M8 lock nut. Tighten it firmly:
    the load runs head washer - inner ring - inner ring - washer - nut, straight through
    steel, so firm tightening cannot preload the balls and cannot crush the plastic.
    Use the standard 1.6 mm washers; a thinner one would let the bracket rub on the
    spinning wheel.'
  parts:
  - wheel
  hardware:
  - washer
  - locknut
  tool: null
- n: '10'
  text: 'Spin test: the wheel should turn freely with no side-to-side play. If it
    drags or feels notchy, a bearing is not fully seated on the seat - press it home.
    If there is side play, slacken the nut, reseat both bearings, and re-tighten.
    Refit the door and check the wheel runs the whole length of the track.'
  parts:
  - wheel
  hardware: []
  tool: null
- n: '11'
  text: Keep the coupon strip. If you ever reprint the wheel in another filament or
    on another printer the fit will change, and the strip tells you which bore to
    use next time.
  parts:
  - coupon_fit
  hardware: []
  tool: null
