task: bearing-wheel
note: 'CHANGED, for two reasons. 1) The wheel failed where I was worried it would:
  its centre web made a 4.5 mm-wide flat ring that had to bridge over the pocket''s
  void - that is the \"roof\" you saw tangle, and the tangles drooped into the 13
  mm hole and half-closed it. That structure is now gone. The wheel is a plain cylinder
  with a 22.20 mm bore straight through it - vertical walls and 45 deg chamfers only,
  nothing overhangs or bridges anywhere - and the web''s two jobs have moved to a
  separate flat ring (stop_ring, 22.20 OD x 13 bore x 2 thick) that prints lying down
  as a washer. Assembly now sets itself: drop the ring in the bore, set the first
  bearing on it, press down until the bearing is flush with the wheel''s face, and
  the ring lands at exactly 7-9 mm. Then flip, drop in the 2 mm mid spacer, press
  the second bearing flush. Nothing to measure. 2) Your coupon answered the fit question:
  21.89 wouldn''t go in and 22.19 went in and held the bearing upside down, so pocket_dia
  is now 22.20 - note that''s 0.2 mm BIGGER than the bearing, which is what a printed
  22 mm hole shrinks back to. The round-2 coupon is a finer spread (22.05/22.15/22.25/22.35)
  if you want to tune it further; skipping it costs you nothing, 22.20 is already
  proven on your printer. Everything else is unchanged: two 608s fill 14 of the 16
  mm, the clamp load runs head -> side spacer -> inner ring -> mid spacer -> inner
  ring -> side spacer -> bracket -> lock nut (which is why the wheel must not sit
  between the inner rings, and why the stop ring has a 13 mm bore - it turns with
  the wheel and must never touch the inner rings). Unchanged guesses, all flagged:
  bracket thickness 3 mm (sets only the bolt length), bracket hole 8.4 mm, old wheel
  OD 50 mm and a flat tread - the track and the old wheel''s OD are still the two
  things I''d most like measured.'
questions:
- text: Which coupon bore grips a bearing best now (how many dots)? If a tighter bore
    than 22.20 still goes in and holds, I'll take it; if the wheel as sent presses
    in and spins, we're done tuning.
  answer: null
- text: What diameter does the old wheel actually measure across the tread, with the
    two broken halves held together? If it's more than about a millimetre off 50 mm
    I'll rescale the wheel so the door hangs at the same height.
  answer: null
- text: How does the axle mount - is there a bracket with a hole the bolt passes through
    with a nut on the far side, and roughly how thick is that material? That fixes
    the bolt length (3 mm assumed).
  answer: null
- text: Was the old wheel's rim flat and smooth across its whole width, or was there
    a groove in the middle (i.e. does it roll on a raised rail rather than sitting
    in a channel)? And how wide is the track where it runs?
  answer: null
- text: How long is your own M8 bolt from under the head to the tip? If it's 37-45
    mm you can use it and skip the catalog screw; over 45 mm I'll add washers or you
    can cut it down.
  answer: null
params:
  axle_d:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: M8 nominal shank. A real M8 screw measures 7.76-7.98 over the crests, so
      the bearings have a few hundredths of play on the thread.
  axle_len:
    value: 40
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8x40. 36 mm must be under the head with a 3 mm bracket; this leaves
      ~4 mm past the nut. Your own M8 bolt is fine if it's 37-45 mm under the head.
  bracket_hole_d:
    value: 8.4
    unit: mm
    kind: world
    source: guessed
    note: The existing hole the axle slides through; assumed a clearance hole for
      M8.
  bracket_t:
    value: 3
    unit: mm
    kind: world
    source: guessed
    note: Thickness of the door/bracket material the axle passes through - this is
      the measurement that never came back, so I assumed 3 mm. It only affects the
      bolt length (criterion c9).
  brg_bore:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ bore - the M8 axle passes through it.
  brg_ir_od:
    value: 11.9
    unit: mm
    kind: hardware
    source: guessed
    note: 608 inner-ring outside diameter - the hard ceiling on the printed spacer
      rings. Anything wider rubs the shield/seal and drags on the spinning wheel.
  brg_od:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: '608ZZ outer diameter, 22.000 -0.008. Round 1 on your machine agreed with
      this: a bore that grips sits about 0.2 mm above 22.0 on paper, which is a printed
      hole shrinking back down.'
  brg_w:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ width. Two of them = 14 mm of the 16 mm wheel width.
  head_d:
    value: 13
    unit: mm
    kind: hardware
    source: catalog
    note: M8 socket head diameter - it fully covers the 11.4 mm spacer ring, so no
      washer is needed under the head.
  head_h:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: M8 socket head height.
  nut_h:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 nylon-insert lock nut height.
  pocket_chamfer:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: 45 deg lead-in at both mouths of the wheel's bore so the bearings and the
      stop ring press in without cracking the rim.
  pocket_dia:
    value: 22.2
    unit: mm
    kind: design
    source: measured
    note: 'Set from your round-1 coupon: 21.89 wouldn''t go in, 22.19 went in and
      held the bearing upside down. 22.20 is that fit. The round-2 coupon refines
      it (22.05 / 22.15 / 22.25 / 22.35).'
  ring_bore:
    value: 13
    unit: mm
    kind: design
    source: design
    note: Stop ring bore. Must clear the 11.9 mm inner-ring OD so this ring - which
      turns with the wheel - never touches the stationary inner rings, and still let
      the 11.4 mm mid spacer sit inside it.
  ring_chamfer:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: 45 deg lead on both OD edges so the 2 mm-tall ring presses in straight without
      cocking.
  ring_t:
    value: 2
    unit: mm
    kind: design
    source: design
    note: 'Must equal spacer_mid_t: with both bearings pressed flush, the two inner
      rings finish exactly this far apart. Thick prints are sanded on this ring, never
      on the spacer.'
  spacer_id:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: Clearance bore over the M8 shank.
  spacer_mid_t:
    value: 2
    unit: mm
    kind: design
    source: design
    note: wheel_w - 2 x brg_w = 16 - 14. Sits between the two inner rings so the bolt
      clamps the inner rings, not the wheel - the job a skateboard bearing spacer
      does.
  spacer_od:
    value: 11.4
    unit: mm
    kind: design
    source: design
    note: Spacer ring OD - deliberately under the 11.9 mm inner-ring OD so the rings
      touch the inner ring only. This stands in for the shoulder washer that isn't
      in the hardware list.
  spacer_side_t:
    value: 3
    unit: mm
    kind: design
    source: design
    note: Thickness of each side spacer ring (two off). Lifts the screw head and the
      bracket clear of the rotating shields and gives a 3 mm gap between the wheel
      and the bracket.
  track_clear_w:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: Clear width of the track channel, and its shape - never measured. Must be
      more than 16 mm or the tread will rub the sides.
  tread_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: 45 deg lead on both tread edges so the wheel finds the track without a sharp
      catching lip.
  washer_t:
    value: 1
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 plain washer thickness (used under the nut, bracket side).
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: '"about 50 mm across". Drives the door''s ride height - if you get a caliper
      on the broken halves and it''s more than ~1 mm off, tell me and I''ll rescale.'
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: '"about 16 mm wide". Must be narrower than the track channel''s clear width.'
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    R = p.wheel_od / 2.0\n    w = p.wheel_w\n    rp = p.pocket_dia\
    \ / 2.0\n    c = p.tread_chamfer\n    c2 = p.pocket_chamfer\n    # Plain drum:\
    \ a 22.2 mm bore straight through, 45 deg chamfers at all four\n    # edges. No\
    \ web, no pocket roof - nothing overhangs or bridges.\n    pts = [\n        (rp\
    \ + c2, 0.0),      # bed face, inner edge (bore mouth chamfer)\n        (R - c,\
    \ 0.0),        # bed face out to the rim\n        (R, c),              # rim chamfer\n\
    \        (R, w - c),          # tread\n        (R - c, w),          # rim chamfer\n\
    \        (rp + c2, w),        # top face\n        (rp, w - c2),        # far bore\
    \ mouth chamfer\n        (rp, c2),            # bore wall\n    ]\n    return (cq.Workplane(\"\
    XZ\")\n            .polyline(pts).close()\n            .revolve(360.0, (0, 0,\
    \ 0), (0, 1, 0)))"
  print_orientation: 'Flat: either face on the bed, axle axis vertical. The bore is
    a vertical hole and every edge is a 45 deg chamfer, so there is no bridge and
    no overhang anywhere - no supports. 0.2 mm layers, 4+ perimeters, same profile
    as the coupon.'
  use_orientation: Axle axis horizontal, tread on the track. Both faces are identical
    (the part is mirror-symmetric), so either end can face the screw head.
- id: stop_ring
  role: final
  material: PLA
  code: "def build(p):\n    ro = p.pocket_dia / 2.0\n    ri = p.ring_bore / 2.0\n\
    \    t = p.ring_t\n    c = p.ring_chamfer\n    # The old centre web, reborn as\
    \ a flat washer that prints lying down.\n    pts = [\n        (ri, 0.0),\n   \
    \     (ro - c, 0.0),\n        (ro, c),\n        (ro, t - c),\n        (ro - c,\
    \ t),\n        (ri, t),\n    ]\n    return (cq.Workplane(\"XZ\")\n           \
    \ .polyline(pts).close()\n            .revolve(360.0, (0, 0, 0), (0, 1, 0)))"
  print_orientation: Flat on the bed, axis vertical - a 2 mm-thick washer. Print one.
    Perimeters all the way through (4+) rather than sparse infill, since it presses
    into the bore.
  use_orientation: Pressed 7 mm into the wheel's bore, so it sits at 7-9 mm with one
    bearing's outer ring flat against each of its faces. It turns with the wheel (its
    13 mm bore keeps it clear of the stationary inner rings) and it is what stops
    the two bearings going any deeper, replacing the pocket roof that printed badly.
- id: spacer_mid
  role: final
  material: PLA
  code: "def build(p):\n    return (cq.Workplane(\"XY\")\n            .circle(p.spacer_od\
    \ / 2.0)\n            .extrude(p.spacer_mid_t)\n            .faces(\">Z\").workplane()\n\
    \            .circle(p.spacer_id / 2.0)\n            .cutThruAll())"
  print_orientation: Flat ring, axis vertical, on the bed. Print one.
  use_orientation: Dropped into the wheel's bore between the two bearing inner rings.
    It carries the clamp load from one inner ring to the other, like a skateboard
    bearing spacer - without it the wheel would slide 2 mm along the axle.
- id: spacer_side
  role: final
  material: PLA
  code: "def build(p):\n    return (cq.Workplane(\"XY\")\n            .circle(p.spacer_od\
    \ / 2.0)\n            .extrude(p.spacer_side_t)\n            .faces(\">Z\").workplane()\n\
    \            .circle(p.spacer_id / 2.0)\n            .cutThruAll())"
  print_orientation: Flat ring, axis vertical, on the bed. Print two.
  use_orientation: 'One on each side of the wheel on the M8 axle: the head-side one
    between the screw head and the first bearing''s inner ring, the other between
    the far inner ring and the door bracket. It presses the inner ring only - its
    11.4 mm OD stays clear of the 11.9 mm inner-ring edge and of everything that rotates.'
- id: coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    L, Wd, T = 130.0, 42.0, 8.0\n    dias = [p.pocket_dia\
    \ - 0.15, p.pocket_dia - 0.05,\n            p.pocket_dia + 0.05, p.pocket_dia\
    \ + 0.15]\n    plate = cq.Workplane(\"XY\").box(L, Wd, T).translate((0, 0, T /\
    \ 2.0))\n    for i, d in enumerate(dias):\n        hole = (cq.Workplane(\"XY\"\
    )\n                .center(-45.0 + i * 30.0, 0)\n                .circle(d / 2.0)\n\
    \                .extrude(T + 40.0)\n                .translate((0, 0, -20.0)))\n\
    \        plate = plate.cut(hole)\n    # count-the-dots marker: 1 dot = smallest\
    \ bore, 4 dots = largest\n    for i in range(4):\n        for j in range(i + 1):\n\
    \            dot = (cq.Workplane(\"XY\")\n                   .center(-50.0 + 6.0\
    \ * j, 15.0)\n                   .circle(1.2)\n                   .extrude(T)\n\
    \                   .translate((0, 0, T - 2.0)))\n            plate = plate.cut(dot)\n\
    \    return plate"
  print_orientation: Flat on the bed, 8 mm thick, the four bores vertical - the same
    direction the wheel's bore prints, so the fit transfers. Same profile/settings
    as the wheel.
  use_orientation: Test only. Left to right the bores are 22.05 / 22.15 / 22.25 /
    22.35 mm, marked by 1 / 2 / 3 / 4 dots along the top edge.
hardware:
- id: brg
  ref: 608ZZ
  qty: 2
- id: axle
  ref: ISO 4762 M8x40
  qty: 1
- id: locknut
  ref: ISO 10511 M8
  qty: 1
- id: washer
  ref: ISO 7089 M8
  qty: 1
- id: axle_long
  ref: ISO 4762 M8x45
  qty: 1
joints:
- id: axle_joint
  fastener: axle
  axis_origin:
  - 0.0
  - 0.0
  - -3.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: spacer_side
    feature: outer face, screw-head side (the head bears here)
    role: head_seat
  - part: wheel
    feature: 22.20 mm through bore (axle passes clear through)
    role: clearance
  - part: stop_ring
    feature: 13 mm bore
    role: clearance
  - part: spacer_mid
    feature: 8.4 mm bore
    role: clearance
  - part: spacer_side
    feature: outer face, bracket side
    role: washer
  nut: locknut
  external: 'the door''s existing roller fitting: a plain clearance hole (assumed
    8.4 mm) through the bracket/door material (assumed 3 mm thick) that the axle passes
    through'
criteria:
- id: c1_pocket_fit
  part: wheel
  feature: 22.20 mm through bore (chamfered at both mouths)
  relation: contains
  hardware: brg
  clearance_mm: 0.2
  params:
  - pocket_dia
  - brg_od
  check:
    method: coupon
    ref: coupon
    description: 'Round 1 on your machine: 21.89 wouldn''t go in, 22.19 went in and
      held the bearing upside down. This print refines around that: work down the
      four bores left to right, support the plate flat on a vice jaw or wood block,
      push on the bearing''s outer ring only. Tell me the dot count of the smallest
      bore that still presses in and holds upside down. If you''d rather not iterate,
      print the wheel as sent (22.20) - it is the fit that already worked.'
- id: c2_ring_od
  part: stop_ring
  feature: 22.20 mm OD (presses into the wheel bore)
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - pocket_dia
  check:
    method: coupon
    ref: coupon
    description: The ring's OD is the same pocket_dia param as the wheel's bore, so
      it presses in with the same fit and the coupon result carries straight over.
- id: c3_ring_seats
  part: stop_ring
  feature: both faces (2.0 mm thick) - the bearing outer rings seat here
  relation: supports
  hardware: brg
  clearance_mm: null
  params:
  - ring_t
  - brg_w
  - wheel_w
  check:
    method: none
    ref: null
    description: This 2 mm-thick ring is what replaces the overhanging pocket roof.
      It is pushed 7 mm in by the first bearing, so each bearing's outer ring seats
      flat on one of its faces at exactly 7 and 9 mm - the bearings end up flush with
      the wheel's faces with no bridging anywhere.
- id: c4_ring_clears_rings
  part: stop_ring
  feature: 13 mm bore vs the bearing inner rings
  relation: clears
  hardware: brg
  clearance_mm: 1.1
  params:
  - ring_bore
  - brg_ir_od
  check:
    method: none
    ref: null
    description: 'Diametral: the ring''s 13 mm bore against a ~11.9 mm inner-ring
      OD. The ring must not touch the inner rings - it rotates with the wheel. Tell-tale
      of a bad print here would be drag when you spin it.'
- id: c5_ring_over_axle
  part: stop_ring
  feature: 13 mm bore
  relation: clears
  hardware: axle
  clearance_mm: 5.0
  params:
  - ring_bore
  - axle_d
  check:
    method: none
    ref: null
    description: Diametral clearance over the M8 shank.
- id: c6_spacer_od
  part: spacer_mid
  feature: 11.4 mm OD rim
  relation: clears
  hardware: brg
  clearance_mm: 0.5
  params:
  - spacer_od
  - brg_ir_od
  check:
    method: none
    ref: null
    description: 'Radial: 11.4 mm spacer OD against a ~11.9 mm inner-ring OD. A wider
      spacer would rub the shield and drag on the spinning wheel; this one touches
      only the inner ring.'
- id: c7_mid_spacer_t
  part: spacer_mid
  feature: 2.0 mm thickness - fills the gap between the two inner rings
  relation: faces
  hardware: brg
  clearance_mm: null
  params:
  - spacer_mid_t
  - ring_t
  check:
    method: none
    ref: null
    description: Must equal the stop ring's thickness, because the two inner rings
      finish exactly that far apart. If one of them prints thick, sand the stop ring
      (never the spacer) so the bearing faces end up flush or slightly inside the
      wheel's faces, never proud.
- id: c8_head_seat
  part: spacer_side
  feature: outer face, screw-head side
  relation: seats
  hardware: axle
  clearance_mm: null
  params:
  - spacer_side_t
  - head_d
  check:
    method: none
    ref: null
    description: The 13 mm socket head covers the 11.4 mm spacer face completely and
      sits 3 mm off the wheel, so it never touches the rotating shield.
- id: c9_axle_length
  part: spacer_side
  feature: outer face, bracket side (the stack the axle spans)
  relation: engages
  hardware: axle
  clearance_mm: null
  params:
  - wheel_w
  - spacer_side_t
  - bracket_t
  - washer_t
  - nut_h
  - axle_len
  check:
    method: template
    ref: required under-head length = 3 + 16 + 3 + bracket_t + 1 + 8 + 2 = 36 mm with
      a 3 mm bracket; ISO 4762 M8x40 (40 mm) covers brackets up to 6 mm with ~4 mm
      past the nut
    description: Measure the bracket thickness where the axle passes through and check
      the bolt reaches through with the nut fully engaged. Thicker than ~6 mm, use
      the M8x45 (or add M8 washers under the nut); more than a few mm sticking out
      past the nut, file it flush or pack with washers.
- id: c10_track
  part: wheel
  feature: 16 mm wide tread, 50 mm OD
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - wheel_w
  - wheel_od
  - track_clear_w
  check:
    method: measure
    ref: null
    description: 'Check against the track itself: the 16 mm tread must sit in the
      channel without rubbing the sides, and the new OD has to match the old wheel
      closely enough that the door still hangs at the right height. Track shape and
      the old wheel''s OD were never measured - tell me both and I''ll adjust wheel_od
      and the tread.'
manual:
- n: '1'
  text: 'Print the fit coupon first (0.2 mm layers, 4+ perimeters, no supports, hole
    compensation left exactly as it is). The four bores are now 22.05, 22.15, 22.25
    and 22.35 mm, marked 1-2-3-4 dots along the top edge - a finer spread around the
    22.19 that held last time. Press a bearing into each: support the plate flat on
    a vice jaw or hardwood block, push on the outer ring only. Tell me the dot count
    of the smallest bore that still goes in and holds the bearing upside down. If
    you''d rather skip the refinement, just print the wheel as sent - 22.20 is already
    a fit that works on your machine.'
  parts:
  - coupon
  hardware:
  - brg
  tool: vice or clamp, flat plate to press with
- n: '2'
  text: 'Print: wheel x1 (flat, either face on the bed - its bore is vertical and
    nothing overhangs, so no supports), stop_ring x1, spacer_mid x1, spacer_side x2.
    All the small rings print flat on the bed as washers. Same filament profile as
    the coupon.'
  parts:
  - wheel
  - stop_ring
  - spacer_mid
  - spacer_side
  hardware: []
  tool: printer
- n: '3'
  text: Lay the wheel flat. Drop the stop_ring into the bore mouth, then set one bearing
    on top of it, outer ring down, and press down with a flat plate or vice until
    the bearing's face is flush with the wheel's face. The bearing pushes the ring
    7 mm in as it goes, which is exactly where it belongs - no depth setting to judge.
  parts:
  - wheel
  - stop_ring
  hardware:
  - brg
  tool: vice or clamp, flat plate
- n: '4'
  text: Turn the wheel over and rest it flat on the bench, so the bearing you just
    fitted sits on the bench and cannot be pushed deeper. Drop the 2.0 mm spacer_mid
    into the open bore; it falls 7 mm and lands flat on that bearing's inner ring.
  parts:
  - wheel
  - spacer_mid
  hardware: []
  tool: null
- n: '5'
  text: 'Press the second bearing into the open bore until its face is flush with
    the wheel''s face. It traps the mid spacer against the first bearing''s inner
    ring. Both bearing faces should now be flush with the wheel''s faces, or up to
    ~0.2 mm inside - never proud. If one is proud, the stop ring printed thick: sand
    it on a flat surface and press again.'
  parts:
  - wheel
  - spacer_mid
  - stop_ring
  hardware:
  - brg
  tool: vice or clamp, flat plate
- n: '6'
  text: 'Spin the wheel on the axle: free, no wobble, no rattle, no drag. If a ring
    won''t slide onto the bolt, scrape the inside of its 8.4 mm bore with a knife
    until it does.'
  parts:
  - wheel
  - spacer_mid
  hardware:
  - axle
  tool: 6 mm hex key
- n: '7'
  text: 'Assemble on the door: slide a spacer_side onto the M8x40 screw (the head
    will press it), then the wheel assembly, then the other spacer_side, then push
    the screw through the bracket''s existing hole. Add the M8 washer and thread on
    the M8 lock nut. Hold the screw head (6 mm hex key) and tighten the nut (13 mm
    spanner) firmly - the head pulls one inner ring, the bracket the other, so the
    bearings stay clamped while the wheel spins. Your own M8 bolt replaces the catalog
    screw if it has 37-45 mm under the head.'
  parts:
  - wheel
  - spacer_side
  - spacer_mid
  - stop_ring
  hardware:
  - axle
  - locknut
  - washer
  tool: 6 mm hex key, 13 mm spanner
- n: '8'
  text: 'Check the joint: the wheel turns freely by hand, has no side-to-side rock,
    sits about 3 mm clear of the bracket, and the screw does not stick out more than
    a few mm past the nut (file it flush, or pack it with M8 washers, if it does).'
  parts:
  - wheel
  - spacer_side
  hardware:
  - axle
  - locknut
  tool: calipers
- n: '9'
  text: 'Fit it to the door and run it in the track: nothing should rub the track''s
    sides, the tread should roll on the same surface the old wheel did, and the door
    should hang at the same height (use the roller''s height adjustment if it has
    one). Load the door and roll it through its full travel - if it binds, or the
    door sits high or low, tell me the old wheel''s OD and the track''s shape and
    I''ll adjust wheel_od and the tread.'
  parts:
  - wheel
  hardware:
  - locknut
  tool: null
- n: '10'
  text: After a week of use, re-check that the lock nut is still tight and that the
    bearing outer rings have not started turning in the bore (scoring around the bore
    mouth means the fit is loose - report it and I'll open pocket_dia up a step).
  parts:
  - wheel
  hardware:
  - locknut
  tool: 13 mm spanner
