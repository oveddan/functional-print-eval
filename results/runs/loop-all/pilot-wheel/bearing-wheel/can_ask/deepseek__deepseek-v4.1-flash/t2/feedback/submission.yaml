task: bearing-wheel
note: 'Revision 2 after your first print. Three changes, all driven by what your printer
  did:


  1. NO MORE SHOULDER. The wheel is now a plain Ø50 x 16 disc with one straight Ø22.20
  through-bore - no roof, no overhang, nothing to droop. One 608ZZ presses in flush
  with each face from opposite sides, and the 2 mm that is left between the two bearings
  takes the third printed ring as a spacer (the two inner rings are clamped through
  it). The two outer rings do NOT need a shoulder: a deep-groove 608 holds its outer
  ring axially through the balls, so once the inner rings are clamped the outer rings
  are located too, and the press fit only has to stop them turning in the bore.


  2. SOCKET DIAMETER 21.9 -> 22.20. Your coupon is the calibration: Ø22.19 accepted
  a bearing and held it upside down, Ø22.04 and Ø21.89 would not go in at all. Your
  printer prints holes about 0.3 mm undersize, so the modelled hole has to be bigger
  than the bearing. The coupon is now built around 22.20 so you can see the range
  in one print.


  3. RING BORE 8.4 -> 8.80. Same shrinkage, applied to the rings: a modelled Ø8.4
  would have come out about Ø8.1 and gripped the M8 shank. Ø8.80 prints near Ø8.5
  and the three rings drop straight onto the bolt.


  Unchanged: the bolt stack is still plate + ring + wheel + ring + lock nut = 31 mm,
  so the M8x35 leaves 4 mm of thread past the lock nut; the rim is still flat with
  a 1.5 mm roundover; the two outer rings are still Ø12 so they press only the bearing
  inner rings and hold the hanger plate 2 mm off the wheel face.


  Assembly is simpler than before: press a bearing flush into each face, drop the
  third ring into the middle, and the rest is unchanged.'
questions:
- text: Did the 22.35 and 22.50 holes in the new coupon also hold a bearing upside
    down? If they do, the fit has room and I can leave socket_d alone. If the 22.20
    hole is the only one that holds, we are at the top of the working range.
  answer: null
- text: How long is your own M8 bolt from under the head to the tip? The stack needs
    31 mm (3 plate + 2 ring + 16 wheel + 2 ring + 8 lock nut), so 33-45 mm works.
  answer: null
- text: Is the track a flat strip or a raised rail (or a channel)? The rim is flat
    with a rounded edge. If the old wheel had a groove riding on a rail, say so and
    I will cut the matching groove.
  answer: null
- text: How thick is the hanger plate at the wheel? Above about 5 mm, swap the lock
    nut for the shorter ISO 4032 M8 nut (6.8 mm) or use a 40 mm bolt.
  answer: null
params:
  bearing_bore:
    value: 8.0
    unit: mm
    kind: hardware
    source: measured
    note: 608ZZ bore; user measured about 8 mm
  bearing_inner_ring_od:
    value: 12.7
    unit: mm
    kind: hardware
    source: guessed
    note: typical 608 inner-ring OD, not in the supplied data. Sets the Ø12 of the
      printed rings so they press the inner ring and never touch the shield.
  bearing_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: measured
    note: 608ZZ outer diameter; measured about 22 mm, datasheet 22.000 -0.008
  bearing_w:
    value: 7.0
    unit: mm
    kind: hardware
    source: measured
    note: 608ZZ width; measured about 7 mm
  bolt_len:
    value: 35.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8x35 - the shortest catalog bolt that spans plate + ring + wheel
      + ring + lock nut
  bolt_shank_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: measured
    note: user measured the M8 shank at about 8 mm
  lead_d:
    value: 23.0
    unit: mm
    kind: design
    source: design
    note: short lead-in counterbore at each face so a bearing starts square. 0.8 mm
      wider than the bore, so it only leaves a 0.4 mm inward ledge - one extrusion
      line, prints without support.
  lead_t:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: depth of the lead-in counterbore at each face
  nut_h:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 nylon-insert lock nut height
  plate_hole_d:
    value: 9.0
    unit: mm
    kind: world
    source: guessed
    note: hole the bolt passes through in the door's hanger plate; standard M8 clearance.
      If yours is smaller, drill it to 9 mm.
  plate_t:
    value: 3.0
    unit: mm
    kind: world
    source: guessed
    note: hanger plate thickness; could not be measured. With 3 mm the M8x35 leaves
      4 mm of thread past the lock nut; every extra mm of plate eats a mm of that.
  ring_id:
    value: 8.8
    unit: mm
    kind: design
    source: measured
    note: 'raises from 8.4 to 8.8 after round 1: holes print ~0.3 mm undersize here,
      so 8.4 would have gripped the shank. 8.8 prints near 8.5 and slides on freely.'
  ring_len:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: fills the 2 mm left between the two bearings and gives the same 2 mm of
      standoff from each wheel face
  ring_od:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: smaller than the 608 inner-ring OD (12.7) so a ring presses only the inner
      ring and misses the shield
  rim_round:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: roundover on the two rim edges; the rim itself stays cylindrical (flat)
      so it works on a flat track or a raised rail
  socket_d:
    value: 22.2
    unit: mm
    kind: design
    source: measured
    note: 'THE VALUE YOUR COUPON CALIBRATED. Round 1 was 21.90 and no bearing would
      enter. Your coupon: 22.19 accepted a 608 and held it upside down, 22.04 and
      21.89 would not go in. Your printer prints holes ~0.3 mm undersize, so the bore
      is modelled at 22.20. If a future coupon shows a better fit, this is the one
      number to change.'
  wheel_od:
    value: 50.0
    unit: mm
    kind: world
    source: asked
    note: old wheel measured about 50 mm across
  wheel_w:
    value: 16.0
    unit: mm
    kind: world
    source: asked
    note: old wheel about 16 mm wide; leaves exactly 2 mm between the two 7 mm bearings
parts:
- id: wheel
  role: final
  material: PLA (high-speed, black) - 0.4 mm nozzle, 0.2 mm layers
  code: "import cadquery as cq\n\n\ndef build(p):\n    R = p.wheel_od / 2.0      \
    \  # 25\n    W = p.wheel_w               # 16\n    bore_r = p.socket_d / 2.0 \
    \  # 11.1\n    lead_r = p.lead_d / 2.0     # 11.5\n    rr = p.rim_round      \
    \      # 1.5\n\n    # tyre: plain Ã¸50 x 16 disc, axis vertical. Convex rim edges\
    \ only, so\n    # every layer sits on the one below it - nothing overhangs.\n\
    \    w = cq.Workplane(\"XY\").circle(R).extrude(W)\n    w = w.faces(\">Z\").edges(\"\
    %CIRCLE\").fillet(rr)\n    w = w.faces(\"<Z\").edges(\"%CIRCLE\").fillet(rr)\n\
    \n    # one straight through-bore: a bearing presses in flush with each face\n\
    \    # and the 2 mm left in the middle takes the spacer ring.\n    w = w.cut(cq.Workplane(\"\
    XY\").circle(bore_r).extrude(W + 1.0))\n\n    # lead-in at each face\n    w =\
    \ w.cut(cq.Workplane(\"XY\").workplane(offset=-0.5).circle(lead_r).extrude(p.lead_t\
    \ + 0.5))\n    w = w.cut(cq.Workplane(\"XY\").workplane(offset=W - p.lead_t).circle(lead_r).extrude(p.lead_t\
    \ + 0.5))\n    return w\n"
  print_orientation: 'As modelled: flat, wheel axis vertical, z = 0 on the bed. No
    overhangs - the bore is a straight vertical hole.'
  use_orientation: Wheel axis horizontal on the M8 bolt; rim on the door track.
- id: ring
  role: final
  material: PLA (high-speed, black) - 0.4 mm nozzle, 0.2 mm layers. Print 3 per wheel.
  code: "import cadquery as cq\n\n\ndef build(p):\n    od = p.ring_od / 2.0\n    idr\
    \ = p.ring_id / 2.0\n    t = p.ring_len\n    r = cq.Workplane(\"XY\").circle(od).extrude(t)\n\
    \    r = r.cut(cq.Workplane(\"XY\").circle(idr).extrude(t))\n    return r\n"
  print_orientation: 'As modelled: flat, ring axis vertical, z = 0 on the bed.'
  use_orientation: Slides on the M8 bolt. One sits between the two bearing inner rings
    (in the 2 mm gap in the middle of the wheel) and one sits on each outside face
    - those two clamp the inner rings and hold the hanger plate and the lock nut off
    the bearing shields.
- id: coupon
  role: coupon
  material: PLA (high-speed, black) - same filament and layer height as the wheel
  code: "import cadquery as cq\n\n\ndef build(p):\n    L, Wd, H = 140.0, 32.0, 12.0\n\
    \    ds = [p.socket_d - 0.30, p.socket_d - 0.15, p.socket_d,\n          p.socket_d\
    \ + 0.15, p.socket_d + 0.30]\n    xs = [16.0, 43.0, 70.0, 97.0, 124.0]\n    body\
    \ = cq.Workplane(\"XY\").box(L, Wd, H, centered=(False, True, False))\n    for\
    \ x, d in zip(xs, ds):\n        body = body.cut(cq.Workplane(\"XY\").center(x,\
    \ 0.0).circle(d / 2.0).extrude(H + 1.0))\n    return body\n"
  print_orientation: 'As modelled: flat, holes vertical - the same orientation as
    the wheel''s bore.'
  use_orientation: Not part of the door. Five through-holes (now 21.90 / 22.05 / 22.20
    / 22.35 / 22.50). The middle one is the value already proved on your printer;
    the outer ones show you the range.
