criteria:
- id: c_press
  part: wheel
  feature: straight through-bore ÃÂsocket_d
  relation: contains
  hardware: bearing
  clearance_mm: 0.2
  params:
  - socket_d
  - bearing_od
  check:
    method: coupon
    ref: coupon
    description: 'Round 1 failed here: a modelled ÃÂ21.90 socket would not accept
      a bearing. Your coupon showed ÃÂ22.19 holds a 608 and ÃÂ22.04/ÃÂ21.89 do not.
      The model is therefore 0.2 mm larger than the bearing, because this printer
      prints holes ~0.3 mm undersize - the real fit is a light press, not the slip
      the nominal numbers suggest.'
- id: c_gap
  part: wheel
  feature: 2 mm gap left between the two flush bearings
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - wheel_w
  - bearing_w
  - ring_len
  check:
    method: none
    ref: null
    description: wheel_w - 2 x bearing_w = 16.0 - 14.0 = 2.0 = ring_len, so both bearings
      finish flush with their faces and the third ring exactly fills the gap between
      the inner rings without preloading them.
- id: c_ring_seat
  part: ring
  feature: ÃÂ12 face
  relation: seats
  hardware: bearing
  clearance_mm: 0.7
  params:
  - ring_od
  - bearing_inner_ring_od
  check:
    method: none
    ref: null
    description: The printed rings are 0.7 mm smaller than the inner-ring OD, so they
      press the inner ring only and never the shield. The nut (13 A/F) and the bolt
      head (ÃÂ13) both land on a ring, never on a bearing.
- id: c_ring_bore
  part: ring
  feature: bore ÃÂring_id
  relation: clears
  hardware: bolt
  clearance_mm: 0.8
  params:
  - ring_id
  - bolt_shank_d
  check:
    method: measure
    ref: null
    description: Round 1 set this at 8.40, which would have printed near 8.1 and gripped
      the shank. At 8.80 it prints near 8.5 and the three rings drop onto the bolt.
- id: c_plate_clear
  part: wheel
  feature: outer face at z = 0
  relation: clears
  hardware: null
  clearance_mm: 2.0
  params:
  - ring_len
  - plate_t
  check:
    method: measure
    ref: null
    description: Outer ring A stands 2 mm proud of the wheel face, so the stationary
      hanger plate clears the spinning wheel by 2 mm once the stack is snug.
- id: c_bolt_reach
  part: ring
  feature: outer face at the lock nut
  relation: engages
  hardware: bolt
  clearance_mm: null
  params:
  - bolt_len
  - plate_t
  - ring_len
  - wheel_w
  - nut_h
  check:
    method: measure
    ref: null
    description: Needs bolt_len >= plate_t + 2 x ring_len + wheel_w + nut_h = 31 mm;
      the M8x35 leaves 4 mm of thread past the lock nut. Check your own bolt against
      this before assembling.
manual:
- n: '1'
  text: 'Print the coupon (flat, holes vertical, same filament and layer height as
    the wheel). Press a 608ZZ into each of the five holes by hand or in a vice - they
    are through-holes, so push each one back out from underneath. The 21.90 hole should
    refuse and the 22.20 hole should accept and hold. This is only a confirmation
    now: 22.20 is already built into the wheel.'
  parts:
  - coupon
  hardware:
  - bearing
  tool: vice
- n: '2'
  text: Print the wheel flat, as modelled, in the same filament and layer height.
    Print one wheel for every roller you are replacing.
  parts:
  - wheel
  hardware: []
  tool: ''
- n: '3'
  text: Print three rings per wheel. All three are identical - two for the outside
    faces, one for the middle.
  parts:
  - ring
  hardware: []
  tool: ''
- n: '4'
  text: 'Press one 608ZZ into one face of the wheel and the other into the opposite
    face, each finishing FLUSH with its face. Draw them in squarely if they are tight
    - the M8 bolt through the bearing bore with a nut and a washer works as a press.
    Do not push one in past its face: leave the middle 2 mm clear for the spacer ring.'
  parts:
  - wheel
  hardware:
  - bearing
  - bolt
  - nut
  tool: vice, or an M8 bolt used as a press
- n: '5'
  text: Drop the third ring into the middle of the wheel's bore so it lands between
    the two bearing inner rings. Check it fills the gap and does not rattle.
  parts:
  - wheel
  - ring
  hardware: []
  tool: ''
- n: '6'
  text: 'Bench spin test: slide the bolt through the stack of inner rings and turn
    the wheel. It must spin freely with no scraping and no rocking, and the ring must
    not wander out.'
  parts:
  - wheel
  - ring
  hardware:
  - bolt
  - bearing
  tool: ''
- n: '7'
  text: 'On the door: pass the M8x35 bolt through the axle hole in the hanger plate
    from the outside, then slide on one ring, then the wheel assembly, then the second
    ring, then spin on the lock nut. From the bolt head the order is plate, ring,
    wheel, ring, lock nut. If the plate''s hole is under ÃÂ8.4, drill it out to 9
    mm first.'
  parts:
  - wheel
  - ring
  hardware:
  - bolt
  - nut
  tool: drill, only if the plate hole needs opening out
- n: '8'
  text: 'Tighten the lock nut snugly - just enough to take up the play. The clamping
    force runs head, plate, ring, inner ring, spacer ring, inner ring, ring, nut,
    so the bolt is locked to the door and the wheel turns on the bearings. Do not
    over-tighten: the rings are PLA. Check the wheel spins freely and its face clears
    the hanger plate by about 2 mm.'
  parts:
  - wheel
  - ring
  hardware:
  - bolt
  - nut
  tool: 6 mm hex key and 13 mm spanner
- n: '9'
  text: Refit the door on the track. The rim is flat with a rounded edge, so it runs
    on a flat track or a raised rail; check the plate and the bolt end foul nothing.
    Roll the door its full length.
  parts:
  - wheel
  hardware: []
  tool: ''
