task: tripod-plate
note: The clamp dovetail and bolt recess dimensions fit well on the first print, and
  the loose loops around the hole were caused by printing the circular hole in the
  middle of an unsupported bridge roof over the bottom pocket. Both parts are now
  modeled upside-down for printing (flat camera face on the bed at z = 0, bolt-head
  recess open at the top from z = 4.8 to 10.0 mm). This completely eliminates bridging
  over the pocket—the hole starts directly on the build plate and the bolt seat at
  z = 4.8 mm prints as a solid supported top surface, while the outer 45-degree dovetail
  slopes print cleanly without supports.
questions: []
params:
  camera_socket_engagement:
    value: 4.8
    unit: mm
    kind: world
    source: datasheet
    note: Standard 1/4-20 camera tripod socket thread engagement depth (ISO 1222)
  plate_h:
    value: 10
    unit: mm
    kind: design
    source: design
    note: Overall height of the quick-release plate
  bolt_head_recess_extra_h:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: Extra recess depth so the 5 mm bolt head stays recessed below the rim
  clamp_clearance:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: Width clearance so the plate drops smoothly into the 38 mm clamp jaws
  dovetail_h:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: Vertical height of the 45-degree angled dovetail bevel
  plate_l:
    value: 50
    unit: mm
    kind: design
    source: design
    note: Length of the full quick-release plate along the dovetail rails
  bolt_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 thread pitch
  bolt_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 nominal major diameter
  bolt_hole_clearance:
    value: 0.45
    unit: mm
    kind: design
    source: design
    note: Diametral clearance for the 1/4-20 bolt shaft through the plate web
  clamp_plate_w:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: Measured width of the plate accepted by the tripod clamp jaws
  coupon_l:
    value: 18
    unit: mm
    kind: design
    source: design
    note: Length of the quick test coupon along the clamp jaws
  bolt_shaft_l:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: Measured shaft length under the head of the salvaged webcam bolt
  base_lip_h:
    value: 2
    unit: mm
    kind: design
    source: design
    note: Vertical wall height adjacent to the 45-degree dovetail bevel on the wider
      clamp-floor side
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Measured height of the salvaged webcam bolt head
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Measured diameter across the salvaged webcam bolt head
  bolt_head_radial_clearance:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Radial clearance around the 15 mm bolt head inside the channel for finger
      access
  dovetail_angle:
    value: 45
    unit: deg
    kind: world
    source: datasheet
    note: Standard 45-degree dovetail angle for 38 mm Arca-Swiss style tripod clamps
parts:
- id: qr_plate
  role: final
  material: PLA
  code: "def build(p):\n    w = p.clamp_plate_w - p.clamp_clearance\n    half_w =\
    \ w / 2.0\n    lip_h = p.base_lip_h\n    dt_h = p.dovetail_h\n    h = p.plate_h\n\
    \    top_half_w = half_w - dt_h\n    neck_h = h - lip_h - dt_h\n\n    pts = [\n\
    \        (-top_half_w, 0.0),\n        (top_half_w, 0.0),\n        (top_half_w,\
    \ neck_h),\n        (half_w, neck_h + dt_h),\n        (half_w, h),\n        (-half_w,\
    \ h),\n        (-half_w, neck_h + dt_h),\n        (-top_half_w, neck_h),\n   \
    \ ]\n\n    body = (\n        cq.Workplane(\"XZ\")\n        .polyline(pts)\n  \
    \      .close()\n        .extrude(p.plate_l / 2.0, both=True)\n    )\n\n    cbore_h\
    \ = p.bolt_head_h + p.bolt_head_recess_extra_h\n    trough_w = p.bolt_head_d +\
    \ 2.0 * p.bolt_head_radial_clearance\n    hole_d = p.bolt_d + p.bolt_hole_clearance\n\
    \n    trough = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=h -\
    \ cbore_h)\n        .box(trough_w, p.plate_l, cbore_h, centered=(True, True, False))\n\
    \    )\n\n    shaft_hole = (\n        cq.Workplane(\"XY\")\n        .circle(hole_d\
    \ / 2.0)\n        .extrude(h)\n    )\n\n    return body.cut(trough).cut(shaft_hole)\n"
  print_orientation: Camera-facing flat deck on the build plate (z = 0) with the bolt-head
    recess channel facing upward (+Z), eliminating any roof bridging around the hole.
  use_orientation: Flipped 180 degrees from print orientation so the z = 0 face contacts
    the bottom of the camera (+Z down into the tripod clamp jaws).
- id: qr_fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    w = p.clamp_plate_w - p.clamp_clearance\n    half_w =\
    \ w / 2.0\n    lip_h = p.base_lip_h\n    dt_h = p.dovetail_h\n    h = p.plate_h\n\
    \    top_half_w = half_w - dt_h\n    neck_h = h - lip_h - dt_h\n\n    pts = [\n\
    \        (-top_half_w, 0.0),\n        (top_half_w, 0.0),\n        (top_half_w,\
    \ neck_h),\n        (half_w, neck_h + dt_h),\n        (half_w, h),\n        (-half_w,\
    \ h),\n        (-half_w, neck_h + dt_h),\n        (-top_half_w, neck_h),\n   \
    \ ]\n\n    body = (\n        cq.Workplane(\"XZ\")\n        .polyline(pts)\n  \
    \      .close()\n        .extrude(p.coupon_l / 2.0, both=True)\n    )\n\n    cbore_h\
    \ = p.bolt_head_h + p.bolt_head_recess_extra_h\n    trough_w = p.bolt_head_d +\
    \ 2.0 * p.bolt_head_radial_clearance\n    hole_d = p.bolt_d + p.bolt_hole_clearance\n\
    \n    trough = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=h -\
    \ cbore_h)\n        .box(trough_w, p.coupon_l, cbore_h, centered=(True, True,\
    \ False))\n    )\n\n    shaft_hole = (\n        cq.Workplane(\"XY\")\n       \
    \ .circle(hole_d / 2.0)\n        .extrude(h)\n    )\n\n    return body.cut(trough).cut(shaft_hole)\n"
  print_orientation: Camera-facing flat deck on the build plate (z = 0) with the bolt-head
    recess facing upward (+Z).
  use_orientation: Flipped 180 degrees from print orientation (+Z down) to test dovetail
    clamping and bolt protrusion.
hardware:
- id: webcam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_mount_joint
  fastener: webcam_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 4.8
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: qr_plate
    feature: bolt_head_recess
    role: head_seat
  - part: qr_plate
    feature: bolt_shaft_hole
    role: clearance
  nut: null
  external: camera 1/4-20 tripod socket
criteria:
- id: clamp_dovetail_fit
  part: qr_plate
  feature: dovetail_rails
  relation: engages
  hardware: null
  clearance_mm: 0.2
  params:
  - clamp_plate_w
  - clamp_clearance
  - dovetail_angle
  - base_lip_h
  - dovetail_h
  check:
    method: coupon
    ref: qr_fit_coupon
    description: Print the short fit coupon first, flip it over (open pocket facing
      down), and drop it into the tripod clamp jaws; tighten the clamp knob to verify
      the 38 mm 45-degree dovetail seats and locks securely.
- id: bolt_clearance_and_seat
  part: qr_plate
  feature: bolt_shaft_hole
  relation: seats
  hardware: webcam_bolt
  clearance_mm: 0.45
  params:
  - bolt_d
  - bolt_hole_clearance
  - bolt_head_d
  - bolt_head_h
  - bolt_head_radial_clearance
  - bolt_head_recess_extra_h
  - plate_h
  check:
    method: coupon
    ref: qr_fit_coupon
    description: Insert the salvaged 1/4-20 webcam mount bolt into the pocket and
      through the center hole to verify the hole prints cleanly with no hanging loops,
      the bolt head sits below the rim, and ~5.2 mm of thread protrudes from the flat
      camera face.
- id: camera_thread_engagement
  part: qr_plate
  feature: camera_top_deck
  relation: faces
  hardware: webcam_bolt
  clearance_mm: null
  params:
  - bolt_shaft_l
  - plate_h
  - bolt_head_h
  - bolt_head_recess_extra_h
  - camera_socket_engagement
  check:
    method: measure
    ref: null
    description: Check that the protruding 1/4-20 bolt threads smoothly into the camera
      tripod socket and pulls the camera base snug against the flat bed-side face
      of the plate without bottoming out early.
manual:
- n: '1'
  text: Print the short test coupon (qr_fit_coupon) first. Because it is now oriented
    with the camera face on the print bed (z = 0) and the bolt-head channel open at
    the top, the center hole prints from the bed up with no bridging over a pocket.
    Slip the salvaged 1/4-20 bolt through to confirm a clean hole and ~5.2 mm thread
    protrusion.
  parts:
  - qr_fit_coupon
  hardware:
  - webcam_bolt
  tool: null
- n: '2'
  text: Print the full quick-release plate (qr_plate) in PLA as modeled (camera-mounting
    face flat on the bed at z = 0, bolt-head channel open on top). Use at least 4
    perimeter walls and 40% infill.
  parts:
  - qr_plate
  hardware: []
  tool: null
- n: '3'
  text: Flip the printed qr_plate over so the flat bed-printed face is up toward the
    camera and the open channel is underneath. Insert the salvaged 1/4-20 webcam mount
    bolt from underneath through the center hole and thread it into the camera's tripod
    socket until snug.
  parts:
  - qr_plate
  hardware:
  - webcam_bolt
  tool: null
- n: '4'
  text: Drop the plate (with camera attached) into the tripod head's 38 mm clamp jaws
    from above and tighten the clamp knob firmly. Verify the jaws grip the 45-degree
    dovetail rails securely before releasing the camera.
  parts:
  - qr_plate
  hardware:
  - webcam_bolt
  tool: null
