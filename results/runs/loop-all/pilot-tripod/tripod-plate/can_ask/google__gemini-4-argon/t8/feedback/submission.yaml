task: tripod-plate
note: Inverted the print orientation of both arca_plate and fit_coupon so the camera-contact
  face sits on the build plate (z = 0) and the bolt head counterbore opens upward
  (+Z). This completely eliminates the downward-facing counterbore roof and mid-air
  hole perimeter that caused loose loops and tangles, while the 45-degree dovetail
  bevels still print cleanly without supports and the camera rests against a smooth
  bed-printed surface.
questions:
- text: What width and style of quick-release plate does the tripod clamp take?
  answer: 38 mm wide dovetail clamp with angled lips tightened by a knob (Arca-Swiss
    style).
- text: What are the dimensions of the salvaged 1/4-20 webcam mount bolt?
  answer: About 15 mm head diameter, 5 mm head height, and 10 mm shaft length under
    the head.
params:
  clamp_plate_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: Width of the quick-release plate the tripod clamp takes (38 mm Arca-Swiss
      style)
  bolt_head_clearance:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Diametral clearance around the ~15 mm bolt head inside the counterbore
  web_thickness:
    value: 5
    unit: mm
    kind: design
    source: design
    note: Solid PLA web thickness under the bolt head (z = 0 to 5.0 mm), leaving 5.0
      mm of bolt thread protruding past the camera face
  bolt_hole_clearance:
    value: 0.45
    unit: mm
    kind: design
    source: design
    note: Diametral clearance for the 1/4-20 shaft through-hole
  coupon_length:
    value: 22
    unit: mm
    kind: design
    source: design
    note: Short length along the rail for the quick test coupon
  bolt_length:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: Length of the salvaged 1/4-20 webcam bolt under the head
  plate_length:
    value: 50
    unit: mm
    kind: design
    source: design
    note: Length of the full quick-release plate along the clamp jaws
  plate_thickness:
    value: 10.2
    unit: mm
    kind: design
    source: design
    note: Total height of the quick-release plate (bolt_head_h + 0.2 mm recess + web_thickness)
  bolt_thread_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: Major diameter of 1/4-20 UNC thread (6.35 mm)
  dovetail_bevel_h:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: Height (and horizontal flare per side at 45 deg) of the dovetail bevel
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Diameter across the salvaged 1/4-20 webcam bolt head
  dovetail_lip_h:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Vertical rim height at the 38 mm dovetail base
  dovetail_clearance:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: Nominal width clearance on the 38 mm dovetail base
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Height of the salvaged 1/4-20 webcam bolt head
parts:
- id: arca_plate
  role: final
  material: PLA
  code: "def build(p):\n    w_base = p.clamp_plate_width - p.dovetail_clearance\n\
    \    h_total = p.plate_thickness\n    h_lip = p.dovetail_lip_h\n    bevel = p.dovetail_bevel_h\n\
    \    w_neck = w_base - 2.0 * bevel\n    h_neck = h_total - h_lip - bevel\n\n \
    \   pts = [\n        (-w_neck / 2.0, 0.0),\n        (w_neck / 2.0, 0.0),\n   \
    \     (w_neck / 2.0, h_neck),\n        (w_base / 2.0, h_neck + bevel),\n     \
    \   (w_base / 2.0, h_total),\n        (-w_base / 2.0, h_total),\n        (-w_base\
    \ / 2.0, h_neck + bevel),\n        (-w_neck / 2.0, h_neck),\n    ]\n    body =\
    \ (\n        cq.Workplane(\"YZ\")\n        .polyline(pts)\n        .close()\n\
    \        .extrude(p.plate_length / 2.0, both=True)\n    )\n\n    shaft_cutter\
    \ = (\n        cq.Workplane(\"XY\")\n        .circle((p.bolt_thread_d + p.bolt_hole_clearance)\
    \ / 2.0)\n        .extrude(h_total)\n    )\n    cbore_depth = h_total - p.web_thickness\n\
    \    cbore_cutter = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.web_thickness)\n\
    \        .circle((p.bolt_head_d + p.bolt_head_clearance) / 2.0)\n        .extrude(cbore_depth)\n\
    \    )\n    return body.cut(shaft_cutter).cut(cbore_cutter)\n"
  print_orientation: Camera-contact face flat on the bed (z = 0); counterbore opens
    upward (+Z) with zero bridging, and the 45-degree dovetail bevels flare outward
    without supports.
  use_orientation: 'Flipped upside-down from print orientation: z = plate_thickness
    face sits down in the tripod clamp jaws, and the smooth z = 0 face sits up against
    the camera base with the 1/4-20 bolt pointing toward -Z (up into the camera).'
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    w_base = p.clamp_plate_width - p.dovetail_clearance\n\
    \    h_total = p.plate_thickness\n    h_lip = p.dovetail_lip_h\n    bevel = p.dovetail_bevel_h\n\
    \    w_neck = w_base - 2.0 * bevel\n    h_neck = h_total - h_lip - bevel\n\n \
    \   pts = [\n        (-w_neck / 2.0, 0.0),\n        (w_neck / 2.0, 0.0),\n   \
    \     (w_neck / 2.0, h_neck),\n        (w_base / 2.0, h_neck + bevel),\n     \
    \   (w_base / 2.0, h_total),\n        (-w_base / 2.0, h_total),\n        (-w_base\
    \ / 2.0, h_neck + bevel),\n        (-w_neck / 2.0, h_neck),\n    ]\n    body =\
    \ (\n        cq.Workplane(\"YZ\")\n        .polyline(pts)\n        .close()\n\
    \        .extrude(p.coupon_length / 2.0, both=True)\n    )\n\n    shaft_cutter\
    \ = (\n        cq.Workplane(\"XY\")\n        .circle((p.bolt_thread_d + p.bolt_hole_clearance)\
    \ / 2.0)\n        .extrude(h_total)\n    )\n    cbore_depth = h_total - p.web_thickness\n\
    \    cbore_cutter = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.web_thickness)\n\
    \        .circle((p.bolt_head_d + p.bolt_head_clearance) / 2.0)\n        .extrude(cbore_depth)\n\
    \    )\n    return body.cut(shaft_cutter).cut(cbore_cutter)\n"
  print_orientation: Camera-contact face flat on the bed (z = 0); counterbore opens
    upward (+Z) with no bridging.
  use_orientation: 'Flipped upside-down from print orientation: z = plate_thickness
    face sits down in the tripod clamp jaws.'
hardware:
- id: camera_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_mount_joint
  fastener: camera_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 5.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: arca_plate
    feature: bolt_head_counterbore
    role: head_seat
  - part: arca_plate
    feature: bolt_shaft_hole
    role: clearance
  nut: null
  external: camera 1/4-20 tripod socket
criteria:
- id: clamp_dovetail_fit
  part: arca_plate
  feature: dovetail_rails
  relation: engages
  hardware: null
  clearance_mm: 0.2
  params:
  - clamp_plate_width
  - dovetail_clearance
  - dovetail_lip_h
  - dovetail_bevel_h
  - plate_thickness
  check:
    method: coupon
    ref: fit_coupon
    description: Flip fit_coupon into use orientation (counterbore facing down), drop
      it into the tripod clamp jaws, and tighten the knob to verify the 38 mm dovetail
      locks securely.
- id: bolt_head_seat_fit
  part: arca_plate
  feature: bolt_head_counterbore
  relation: seats
  hardware: camera_bolt
  clearance_mm: 1.5
  params:
  - bolt_head_d
  - bolt_head_h
  - bolt_head_clearance
  - plate_thickness
  - web_thickness
  check:
    method: coupon
    ref: fit_coupon
    description: Insert the salvaged 1/4-20 webcam bolt into the counterbore pocket
      of fit_coupon and verify the head seats flat against the upward-printed floor
      and sits recessed below the rim.
- id: bolt_shaft_clearance
  part: arca_plate
  feature: bolt_shaft_hole
  relation: clears
  hardware: camera_bolt
  clearance_mm: 0.45
  params:
  - bolt_thread_d
  - bolt_hole_clearance
  check:
    method: coupon
    ref: fit_coupon
    description: Pass the 1/4-20 bolt shaft through the center hole of fit_coupon
      to verify smooth passage with no loose bridge loops.
- id: camera_thread_engagement
  part: arca_plate
  feature: top_camera_pad
  relation: supports
  hardware: camera_bolt
  clearance_mm: null
  params:
  - bolt_length
  - web_thickness
  check:
    method: measure
    ref: null
    description: Thread the protruding 5 mm of the 1/4-20 bolt into the camera socket
      and verify the camera base pulls snug against the smooth bed-printed face of
      the plate.
manual:
- n: '1'
  text: Print fit_coupon with the narrow camera-contact face on the bed (z = 0) and
    the bolt counterbore opening upward (+Z), eliminating any roof bridging over the
    hole. Test the bolt fit and flip it over to verify clamp engagement.
  parts:
  - fit_coupon
  hardware:
  - camera_bolt
  tool: null
- n: '2'
  text: Print arca_plate in the same orientation (camera-contact face on the bed at
    z = 0, counterbore opening upward, 45-degree dovetail bevels flaring outward without
    supports).
  parts:
  - arca_plate
  hardware: []
  tool: null
- n: '3'
  text: Flip arca_plate into use orientation (counterbore facing down, smooth bed-printed
    face on top), insert the salvaged 1/4"-20 webcam bolt up through the bottom counterbore,
    and thread it into your camera's 1/4"-20 tripod socket until snug.
  parts:
  - arca_plate
  hardware:
  - camera_bolt
  tool: null
- n: '4'
  text: Drop the plate into the tripod clamp jaws and tighten the knob firmly. Keep
    a hand on the camera while testing a temporary PLA plate.
  parts:
  - arca_plate
  hardware:
  - camera_bolt
  tool: null
