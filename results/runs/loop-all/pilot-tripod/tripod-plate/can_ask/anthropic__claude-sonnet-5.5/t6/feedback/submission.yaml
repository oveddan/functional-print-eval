task: tripod-plate
note: 'Change from the last version: the roof over the bolt-head recess had a slot
  cut through it, so the printer was bridging a roof that had a hole in it. That is
  why you got loops and a half-closed hole. Now the roof is a solid 0.4 mm skin across
  the recess. The slot starts just above it, so the printer bridges a plain flat surface.
  After printing, punch the skin out of the slot with a screwdriver or a craft knife.
  Everything else is unchanged: it still uses your metal webcam bolt as the screw.
  The clamp thickness and the camera socket depth are still guesses, so print the
  coupon first and check the fit.'
questions:
- text: What is the gap height (plate thickness) the tripod clamp accepts? I couldn't
    get this measurement, so plate_t = 4 mm is a guess.
  answer: null
- text: How deep is the camera's 1/4-20 socket? The bolt is designed to stick up about
    5.5 mm. This is a guess.
  answer: null
- text: Did the plate slide into the clamp and get gripped? You couldn't tell me last
    time. The coupon will answer this.
  answer: null
params:
  clamp_w:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: width of plate the tripod clamp takes
  plate_clear:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: total side clearance so plate slides into the clamp
  plate_l:
    value: 60
    unit: mm
    kind: design
    source: design
    note: plate length; clamp length not obtained
  plate_t:
    value: 4
    unit: mm
    kind: world
    source: guessed
    note: flange thickness; clamp gap height could not be measured. Check with the
      coupon
  bolt_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 major diameter
  head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: salvaged bolt head, 'about 15 mm'
  head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: salvaged bolt head height, about 5 mm
  shank_len:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: length under head, about 10 mm
  head_clear:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: diametral clearance around bolt head
  head_depth_clear:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: extra counterbore depth over head height
  engage:
    value: 5.5
    unit: mm
    kind: world
    source: guessed
    note: how far the bolt sticks up above the plate into the camera. Camera socket
      depth could not be measured; 5-6 mm is typical
  hole_clear:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: diametral clearance of shank slot
  slot_travel:
    value: 6
    unit: mm
    kind: design
    source: design
    note: bolt position adjustment along plate length
  wall:
    value: 3
    unit: mm
    kind: design
    source: design
    note: wall around counterbore in the raised boss
  corner_r:
    value: 3
    unit: mm
    kind: design
    source: design
    note: plate corner radius
  coupon_l:
    value: 34
    unit: mm
    kind: design
    source: design
    note: length of the test coupon
  bridge_t:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: sacrificial solid skin (2 layers) across the top of the head recess, so
      the roof bridges cleanly. The shank slot starts above it, and you punch the
      skin out after printing
parts:
- id: plate
  role: final
  material: PLA
  code: "def build(p):\n    w = p.clamp_w - p.plate_clear\n    cb_d = p.head_d + p.head_clear\n\
    \    cb_len = cb_d + p.slot_travel\n    cb_depth = p.head_h + p.head_depth_clear\n\
    \    floor = p.shank_len - p.engage\n    total = cb_depth + floor\n    hole_d\
    \ = p.bolt_d + p.hole_clear\n    plate = (cq.Workplane('XY').box(w, p.plate_l,\
    \ p.plate_t, centered=(True, True, False))\n             .edges('|Z').fillet(p.corner_r))\n\
    \    boss = (cq.Workplane('XY').slot2D(cb_len + 2*p.wall, cb_d + 2*p.wall, 90)\n\
    \            .extrude(total))\n    body = plate.union(boss)\n    cb = cq.Workplane('XY').slot2D(cb_len,\
    \ cb_d, 90).extrude(cb_depth)\n    z0 = cb_depth + p.bridge_t\n    sl = (cq.Workplane('XY').workplane(offset=z0)\n\
    \          .slot2D(p.slot_travel + hole_d, hole_d, 90).extrude(total - z0))\n\
    \    return body.cut(cb).cut(sl)\n"
  print_orientation: underside (the side that sits in the tripod clamp) flat on the
    bed; the bolt-head recess opens onto the bed
  use_orientation: Underside down in the tripod clamp, raised boss up, camera on top
    of the boss
- id: plate-coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    w = p.clamp_w - p.plate_clear\n    cb_d = p.head_d + p.head_clear\n\
    \    cb_len = cb_d + p.slot_travel\n    cb_depth = p.head_h + p.head_depth_clear\n\
    \    floor = p.shank_len - p.engage\n    total = cb_depth + floor\n    hole_d\
    \ = p.bolt_d + p.hole_clear\n    plate = (cq.Workplane('XY').box(w, p.coupon_l,\
    \ p.plate_t, centered=(True, True, False))\n             .edges('|Z').fillet(p.corner_r))\n\
    \    boss = (cq.Workplane('XY').slot2D(cb_len + 2*p.wall, cb_d + 2*p.wall, 90)\n\
    \            .extrude(total))\n    body = plate.union(boss)\n    cb = cq.Workplane('XY').slot2D(cb_len,\
    \ cb_d, 90).extrude(cb_depth)\n    z0 = cb_depth + p.bridge_t\n    sl = (cq.Workplane('XY').workplane(offset=z0)\n\
    \          .slot2D(p.slot_travel + hole_d, hole_d, 90).extrude(total - z0))\n\
    \    return body.cut(cb).cut(sl)\n"
  print_orientation: underside flat on the bed
  use_orientation: 'Test only: slide into the tripod clamp and drop the salvaged bolt
    into the recess'
hardware:
- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera-screw
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 5.5
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: head counterbore (underside)
    role: head_seat
  - part: plate
    feature: shank slot
    role: clearance
  nut: null
  external: camera base 1/4-20 tripod socket
criteria:
- id: c-width
  part: plate-coupon
  feature: plate width and thickness in the tripod clamp
  relation: seats
  hardware: null
  clearance_mm: 0.2
  params:
  - clamp_w
  - plate_clear
  - plate_t
  check:
    method: coupon
    ref: plate-coupon
    description: Slide the coupon into the tripod clamp and tighten. It should enter
      without force and be held firmly. If loose or too thick, adjust plate_t or plate_clear.
- id: c-head
  part: plate
  feature: head counterbore
  relation: contains
  hardware: bolt
  clearance_mm: 0.4
  params:
  - head_d
  - head_h
  - head_clear
  - head_depth_clear
  check:
    method: coupon
    ref: plate-coupon
    description: The bolt head should drop into the recess and sit fully inside it,
      with no part of the head below the plate underside.
- id: c-slot
  part: plate
  feature: shank slot
  relation: clears
  hardware: bolt
  clearance_mm: 0.25
  params:
  - bolt_d
  - hole_clear
  - slot_travel
  - bridge_t
  check:
    method: coupon
    ref: plate-coupon
    description: After the thin skin is punched out, the bolt shank should slide freely
      along the full slot, and the roof should have clean edges around it.
- id: c-engage
  part: plate
  feature: bolt protrusion above boss
  relation: engages
  hardware: bolt
  clearance_mm: null
  params:
  - engage
  - shank_len
  check:
    method: measure
    ref: null
    description: With the bolt in place, measure how far the thread sticks out above
      the boss top (about 5.5 mm). It must be no more than the camera socket depth.
      If the bolt bottoms out before the camera sits on the boss, add a washer or
      shim.
manual:
- n: '1'
  text: Print the plate-coupon first (underside on the bed, about 10 minutes). Look
    at the roof of the head recess. It should now be a clean, flat skin with the slot
    starting just above it. Slide the coupon into the tripod clamp and check that
    it fits and is gripped. If the plate is too thick or loose, tell me and change
    plate_t.
  parts:
  - plate-coupon
  hardware: []
  tool: null
- n: '2'
  text: Print the plate with the underside on the bed. Use 4 walls, 20-25% infill
    and no supports. Turn on bridge-flow or 'thick bridges' if your slicer offers
    it. The roof of the head recess is now a solid skin, so it doesn't bridge over
    a hole.
  parts:
  - plate
  hardware: []
  tool: null
- n: '3'
  text: Turn the plate over and look into the head recess. A thin skin (0.4 mm) closes
    the bottom of the slot. Punch it out with a small screwdriver or a craft knife
    through the slot from the top, and clean the slot edges. Check the coupon the
    same way. Then drop the bolt head into the recess to check that it seats, and
    slide it along the slot.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '4'
  text: Push the webcam bolt up from the underside, so the head sits in the recess
    and the thread comes out through the slot on top of the boss.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '5'
  text: Set the camera on the boss and screw the bolt into the camera's 1/4-20 socket
    by turning the bolt head with your fingers. Stop when the camera is snug against
    the boss. Don't overtighten.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '6'
  text: Slide the plate into the tripod clamp (boss up, bolt head down) and lock the
    clamp. Check that the camera is held before you let go. PLA softens in a hot car
    or in direct sun, so don't leave it there.
  parts:
  - plate
  hardware: []
  tool: null
