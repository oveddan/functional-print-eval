task: tripod-plate
note: Only the print orientation changed. The clamp fit and the head recess both worked,
  so those dimensions are unchanged. The roof over the bolt pocket was a bridge of
  about 28 mm by 16 mm with the slot cut through it, and that caused the loops and
  the partly closed hole. Printing the plate camera-face-down opens the pocket to
  the air, so nothing has to bridge. The camera face also gets the smooth bed finish.
questions:
- text: How deep is the camera's tripod socket? Can you check that the bolt, which
    sticks out about 5 mm, doesn't bottom out before the camera sits flat?
  answer: null
params:
  plate_w:
    value: 38
    unit: mm
    kind: world
    source: guessed
    note: Arca-Swiss-style dovetail width. You said the plate fit the clamp, so this
      value stays.
  bevel_h:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: Height of the 45 degree dovetail bevel. The clamp fit was confirmed.
  plate_len:
    value: 60
    unit: mm
    kind: design
    source: design
    note: ''
  head_d:
    value: 15
    unit: mm
    kind: world
    source: measured
    note: Webcam bolt head, about 15 mm. The head fit the recess.
  head_h:
    value: 5
    unit: mm
    kind: world
    source: measured
    note: Webcam bolt head height, about 5 mm.
  bolt_len:
    value: 10
    unit: mm
    kind: world
    source: measured
    note: Length under the head, about 10 mm.
  bolt_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 major diameter.
  head_clear:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Total diametral clearance around the head pocket.
  head_depth_clear:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Pocket is slightly deeper than the head.
  shank_clear:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Total diametral clearance in the slot.
  wall:
    value: 5
    unit: mm
    kind: design
    source: design
    note: Plate material between the camera face and the head pocket. The bolt sticks
      out by bolt_len minus wall, which is 5 mm.
  slot_travel:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Bolt position adjustment along the plate.
  camera_socket_depth:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: Not measured. Typical camera sockets are about 5 to 6 mm deep. The bolt
      sticks out about 5 mm.
  coupon_len:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Length of each width step on the clamp coupon.
  coupon_step:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Width change per step on the coupon.
parts:
- id: plate
  role: final
  material: PLA (black), 4+ walls, 40% gyroid infill
  code: "def build(p):\n    T = p.head_h + p.head_depth_clear + p.wall\n    w = p.plate_w\n\
    \    hb = w/2 - p.bevel_h\n    pts = [(-hb,0),(hb,0),(w/2,p.bevel_h),(w/2,T),(-w/2,T),(-w/2,p.bevel_h)]\n\
    \    body = cq.Workplane('XZ').polyline(pts).close().extrude(p.plate_len/2, both=True)\n\
    \    pocket_d = p.head_d + p.head_clear\n    pocket = (cq.Workplane('XY').slot2D(pocket_d\
    \ + p.slot_travel, pocket_d, 90)\n              .extrude(p.head_h + p.head_depth_clear))\n\
    \    sd = p.bolt_d + p.shank_clear\n    slot = (cq.Workplane('XY').slot2D(sd +\
    \ p.slot_travel, sd, 90).extrude(T))\n    part = body.cut(pocket).cut(slot)\n\
    \    # flip so the camera face is on the bed (z=0) and the pocket opens upward\n\
    \    return part.rotate((0,0,0),(0,1,0),180).translate((0,0,T))\n"
  print_orientation: 'Flat camera face (the top) on the bed, and the dovetail and
    bolt pocket facing up. This change fixes the messy roof over the bolt hole: the
    pocket is now open to the air, so nothing needs to bridge. The bevels taper inward
    as the print rises, so no supports are needed.'
  use_orientation: Flip it over for use. The dovetail goes down in the tripod clamp,
    and the camera sits on the flat face that was on the bed.
- id: clamp-coupon
  role: coupon
  material: PLA (black)
  code: "def build(p):\n    T = p.head_h + p.head_depth_clear + p.wall\n    res =\
    \ None\n    for i, k in enumerate((-2, -1, 0, 1)):\n        w = p.plate_w + k\
    \ * p.coupon_step\n        hb = w/2 - p.bevel_h\n        pts = [(-hb,0),(hb,0),(w/2,p.bevel_h),(w/2,T),(-w/2,T),(-w/2,p.bevel_h)]\n\
    \        seg = (cq.Workplane('XZ').polyline(pts).close().extrude(p.coupon_len)\n\
    \               .translate((0, -i * p.coupon_len, 0)))\n        res = seg if res\
    \ is None else res.union(seg)\n    return res\n"
  print_orientation: Bottom face flat on the bed.
  use_orientation: Slide or drop each step into the tripod clamp.
hardware:
- id: webcam-bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: bolt-joint
  fastener: webcam-bolt
  axis_origin:
  - 0.0
  - 0.0
  - 5.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: plate
    feature: head pocket (open upward in print orientation)
    role: head_seat
  - part: plate
    feature: through slot
    role: clearance
  nut: null
  external: camera 1/4-20 tripod socket
criteria:
- id: c-dovetail
  part: plate
  feature: dovetail edges
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - plate_w
  - bevel_h
  check:
    method: measure
    ref: null
    description: 'Confirmed by the owner: the plate fits the tripod clamp.'
- id: c-head
  part: plate
  feature: head pocket
  relation: contains
  hardware: webcam-bolt
  clearance_mm: 0.4
  params:
  - head_d
  - head_h
  - head_clear
  - head_depth_clear
  check:
    method: measure
    ref: null
    description: 'Confirmed by the owner: the bolt head fits in the recess.'
- id: c-shank
  part: plate
  feature: through slot
  relation: clears
  hardware: webcam-bolt
  clearance_mm: 0.25
  params:
  - bolt_d
  - shank_clear
  - slot_travel
  check:
    method: measure
    ref: null
    description: The slot should be clean and open now that it prints with no bridging.
      The bolt shank should slide along it without binding.
- id: c-camera
  part: plate
  feature: camera face
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - bolt_len
  - wall
  - camera_socket_depth
  check:
    method: measure
    ref: null
    description: The bolt sticks out about 5 mm above the camera face. The camera
      should sit flat on the plate before the bolt bottoms out.
manual:
- n: '1'
  text: Print the plate with the flat camera face down on the bed and the pocket facing
    up. Use at least 4 walls and 40% infill. No supports are needed. The slot and
    the head pocket should now come out clean. You don't need to reprint the coupon,
    because the clamp fit is confirmed.
  parts:
  - plate
  hardware: []
  tool: null
- n: '2'
  text: Turn the plate over so the dovetail edges are down. Push the webcam bolt into
    the pocket in the dovetail face, so the thread comes out through the slot on the
    flat face. The 15 mm head sits in the pocket.
  parts:
  - plate
  hardware:
  - webcam-bolt
  tool: null
- n: '3'
  text: Drop the plate into the tripod clamp from above and tighten the knob.
  parts:
  - plate
  hardware: []
  tool: null
- n: '4'
  text: Slide the bolt along the slot to where you want it. Turn the camera onto the
    bolt until it sits flat on the plate. If the bolt bottoms out before the camera
    is flat, stop and tell me, because the plate wall needs to be thicker.
  parts:
  - plate
  hardware:
  - webcam-bolt
  tool: null
