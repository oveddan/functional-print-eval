parts:
- id: plate
  role: final
  material: PLA
  code: "import cadquery as cq\nfrom math import tan, radians\n\n\ndef build(p):\n\
    \    ht = p.plate_w_top / 2.0\n    hb = ht - p.bevel_h * tan(radians(p.dovetail_angle))\n\
    \    bh = p.plate_t - p.bevel_h\n\n    # cross-section in the XZ plane: flat base,\
    \ then 45 deg dovetail flaring out\n    prof = (cq.Workplane(\"XZ\")\n       \
    \     .moveTo(-hb, 0)\n            .lineTo(hb, 0)\n            .lineTo(hb, bh)\n\
    \            .lineTo(ht, p.plate_t)\n            .lineTo(-ht, p.plate_t)\n   \
    \         .close())\n    plate = prof.extrude(p.plate_len / 2.0, both=True)\n\n\
    \    # 1) screw-head pocket, open downward from the bed face\n    pocket = (cq.Workplane(\"\
    XY\", origin=(0, 0, -1.0))\n              .circle(p.pocket_d / 2.0)\n        \
    \      .extrude(p.pocket_depth + 1.0))\n\n    # 2) 45 deg funnel: roof steps up\
    \ from the 1.8 mm bearing ring to the\n    #    shank hole, so no layer has to\
    \ bridge across the hole\n    h_cone = (p.bearing_d - p.shank_hole_d) / 2.0\n\
    \    cone = cq.Solid.makeCone(p.bearing_d / 2.0,\n                           \
    \  p.shank_hole_d / 2.0,\n                             h_cone,\n             \
    \                cq.Vector(0, 0, p.pocket_depth),\n                          \
    \   cq.Vector(0, 0, 1))\n\n    # 3) clearance hole for the 1/4-20 thread\n   \
    \ shank = (cq.Workplane(\"XY\")\n             .circle(p.shank_hole_d / 2.0)\n\
    \             .extrude(p.plate_t + 2.0))\n\n    return plate.cut(pocket).cut(cq.Workplane(\"\
    XY\").add(cone)).cut(shank)\n"
  print_orientation: bottom face on the bed (z = 0). Dovetail sides are 45 degree
    self-supporting overhangs; the pocket roof is a 1.8 mm flat ring then a 45 degree
    funnel. No supports.
  use_orientation: wide 37.8 x 45 mm top face up with the camera resting on it; narrow
    bottom face (carrying the screw-head pocket and its 1 mm proud bolt head) down
    against the clamp base; slides into the clamp along its 45 mm length.
