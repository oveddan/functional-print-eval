manual:
- n: '1'
  text: 'Print plate. Bottom face on the bed, 0.2 mm layers, PLA. No supports: the
    45 degree dovetail sides and the pocket roof are all self-supporting.'
  parts:
  - plate
  hardware: []
  tool: Bambu Lab X1C
- n: '2'
  text: Inspect the screw-head pocket before you build anything up. Looking into the
    bottom face you should see a clean dia 15.6 hole, a narrow flat ring at the top
    of it (about four extrusion lines wide), then a funnel stepping up to the dia
    6.8 hole. There should be no loose strands and the hole should be open. If it
    is not, ream the hole with the bolt and tell me - the roof shape is the thing
    that changed.
  parts:
  - plate
  hardware: []
  tool: null
- n: '3'
  text: 'Trial-fit the salvaged bolt: drop it head-first into the pocket from below.
    The head should sit with about 1 mm standing proud of the plate''s bottom face,
    and the thread should come up through the plate and stand about 5 mm above the
    top face. If the head will not enter, do not force it - say so.'
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '4'
  text: 'Mount the camera: sit the camera on the plate''s wide top face, start the
    bolt up into the camera''s 1/4-20 socket and turn it finger-tight. Only 1 mm of
    the head is exposed, so if it is too slippery to grip, press a rubber band or
    a rubber glove against it rather than using pliers.'
  parts:
  - plate
  hardware:
  - bolt
  tool: rubber band or rubber glove
- n: '5'
  text: 'Fit to the tripod: slide the plate into the clamp along its 45 mm length
    so the clamp''s jaws sit on the two 45 degree dovetail faces, then tighten the
    clamp''s own knob. The plate will stand about 1 mm off the clamp''s flat base
    because the bolt head is proud - that is expected, the jaws hold the bevels, not
    the base.'
  parts:
  - plate
  hardware: []
  tool: null
- n: '6'
  text: 'Check it before you trust it: fit the empty plate in the clamp first, then
    with the camera mounted check there is no rock and that the camera cannot twist.
    PLA creeps, so check the bolt is still snug before each use and take the camera
    off before carrying the tripod. This is a stopgap, not a permanent plate.'
  parts:
  - plate
  hardware: []
  tool: null
