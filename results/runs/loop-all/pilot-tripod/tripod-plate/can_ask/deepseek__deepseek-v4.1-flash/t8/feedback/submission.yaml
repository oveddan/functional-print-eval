task: tripod-plate
note: 'Two things came back, and they needed different treatment.


  1) thread_coupon would not open. That is not a slicer problem - the part''s code
  builds a real 1/4-20 thread by sweeping a triangle along a helix, and that geometry
  does not produce a valid file here. I cannot test code before handing it over, so
  rather than send you another file that may not open, I removed the printed screw
  completely. Use the salvaged webcam-mount bolt: it is a real 1/4-20, 10 mm of thread
  under a 15 x 5 mm head, it is metal, and every one of its dimensions was measured,
  not guessed. The plastic part that actually needed designing was the plate. So you
  now have one printed part and one bolt, not two printed parts - the coupon is gone
  too, since there is no printed thread left to test.


  2) "Loose loops and tangles around the hole, hole partly closed" - that was the
  plate''s pocket roof. It used to be a 4.4 mm wide flat ring spanning from the pocket
  wall in to the dia 6.8 hole, with nothing under its inner edge, so the last few
  loops had nothing to anchor to and sagged into the hole. Fixed by changing the roof
  shape, not the size: the flat part is now only 1.8 mm wide (about four extrusion
  lines) and from there a 45 degree funnel steps up to the dia 6.8 hole. Nothing now
  spans more than 1.8 mm unsupported, and 45 degree steps are self-supporting on your
  printer. The funnel also self-centres the bolt head.


  One further change, forced by geometry: the pocket is 4.0 mm deep instead of 4.5,
  so the bolt head sits 1.0 mm proud instead of 0.5. That makes the head visibly seated
  and actually grippable, and it costs 0.5 mm of thread in the camera: 5.0 mm of engagement
  instead of 5.5, still about four threads, still clear of a 6.5 mm deep socket.


  Unchanged: the 37.8 mm dovetail you confirmed fits the clamp, 45 mm long, 9 mm thick,
  no supports. Still assumed, since the borrowed tripod could not be measured in detail:
  45 degree jaws, 6.5 mm socket depth, clamp takes a 45 mm plate.'
