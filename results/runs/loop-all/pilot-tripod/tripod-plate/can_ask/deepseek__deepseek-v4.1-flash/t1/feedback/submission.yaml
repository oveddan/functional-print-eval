  plate_hole_d:
    value: 7.2
    unit: mm
    kind: design
    source: design
    note: loosened from 7.0 so a partly-closing hole cannot grip the bolt (6.35 +
      0.85); chase with a 7 mm drill if it is still tight
  plate_len:
    value: 50
    unit: mm
    kind: design
    source: asked
    note: CONFIRMED in the clamp
  plate_t:
    value: 6
    unit: mm
    kind: design
    source: asked
    note: 'CONFIRMED: fitted the clamp at this thickness. Also sets thread engagement
      = 10 + 5.1 - 6.0 = 4.1 mm'
  plate_wid:
    value: 38
    unit: mm
    kind: design
    source: asked
    note: 'CONFIRMED: fitted the clamp at this width'
  pocket_roof:
    value: 0.9
    unit: mm
    kind: design
    source: design
    note: 'thickened from 0.8 to 0.9 mm: this is the roof the bolt head pulls up against,
      and the roof that printed as loose loops'
  pocket_w:
    value: 16.4
    unit: mm
    kind: design
    source: design
    note: 'square now, not round: 16.4 x 16.4 so the slicer bridges wall-to-wall instead
      of printing a ring in mid-air. Bolt head 15.0 + 0.7 per side'
  screw_head_d:
    value: 15
    unit: mm
    kind: design
    source: design
    note: made equal to the salvaged bolt head so either screw seats in the one pocket
  screw_head_h:
    value: 5
    unit: mm
    kind: design
    source: design
    note: equal to the bolt head; with the 5.1 pocket the head sits 0.1 mm recessed
  screw_thread_len:
    value: 10
    unit: mm
    kind: design
    source: design
    note: equal to the salvaged bolt so 4.1 mm projects above the plate's top face
  thread_minor_d:
    value: 4.98
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 UNC minor diameter ~4.98
  thread_od:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 major = 1/4 in; matches the camera socket
  thread_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: catalog
    note: ''
parts:
- id: plate
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    L = p.plate_len\n    W = p.plate_wid\n\
    \    t = p.plate_t\n    ang = p.plate_chamfer_deg\n    d = p.plate_hole_d\n  \
    \  pw = p.pocket_w\n    pd = p.plate_t - p.pocket_roof          # pocket depth,\
    \ roof left on top of it\n\n    # long sides tapered to the jaw angle: wide base,\
    \ narrow top (UNCHANGED - it fitted)\n    top_w = W - 2.0 * t / math.tan(math.radians(ang))\n\
    \n    body = (\n        cq.Workplane(\"XY\")\n        .rect(W, L)\n        .workplane(offset=t)\n\
    \        .rect(top_w, L)\n        .loft(combine=True)\n    )\n\n    # 1/4-20 clearance\
    \ hole, right through\n    body = body.cut(\n        cq.Workplane(\"XY\").circle(d\
    \ / 2.0).extrude(t + 2.0).translate((0, 0, -1.0))\n    )\n\n    # head pocket,\
    \ cut up from the bed face.\n    # SQUARE, NOT ROUND: straight walls let the slicer\
    \ bridge the ceiling\n    # wall-to-wall, instead of looping a ring of filament\
    \ in mid-air round the hole.\n    body = body.cut(\n        cq.Workplane(\"XY\"\
    )\n        .rect(pw, pw)\n        .extrude(pd + 0.2)\n        .translate((0, 0,\
    \ -0.2))\n    )\n    return body\n"
  print_orientation: 'wide 38 x 50 mm face flat on the bed (the face carrying the
    square head pocket), taper narrowing upward to the 24 mm top face. Support: ON
    (auto) - the pocket''s 0.9 mm ceiling is the only horizontal overhang in the part;
    the supports grow up from the bed inside the pocket and pull out in one piece.
    Do not raise the fan or slow the bridge; the square pocket bridges on its own'
  use_orientation: 'pocket face down: it rests on the clamp''s floor and holds the
    bolt head; tapered sides between the jaws; the camera base on the top face; the
    bolt goes up through it from underneath'
- id: screw
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    od = p.thread_od\n    P = p.thread_pitch\n\
    \    minor = p.thread_minor_d\n    hd = p.screw_head_d\n    hh = p.screw_head_h\n\
    \    tl = p.screw_thread_len\n\n    # head: printed face down, z from -hh to 0\n\
    \    head = cq.Workplane(\"XY\").circle(hd / 2.0).extrude(hh).translate((0, 0,\
    \ -hh))\n    for i in range(12):\n        a = math.radians(i * 30.0)\n       \
    \ x = math.cos(a) * hd / 2.0\n        y = math.sin(a) * hd / 2.0\n        head\
    \ = head.cut(\n            cq.Workplane(\"XY\")\n            .circle(1.1)\n  \
    \          .extrude(hh + 0.4)\n            .translate((x, y, -hh - 0.2))\n   \
    \     )\n\n    # shank core\n    core = (\n        cq.Workplane(\"XY\")\n    \
    \    .circle(minor / 2.0)\n        .extrude(tl + 0.5)\n        .translate((0,\
    \ 0, -0.5))\n    )\n\n    # 1/4-20 thread: V profile swept along a helix\n   \
    \ r_root = minor / 2.0 - 0.3\n    r_crest = od / 2.0\n    r_helix = (r_root +\
    \ r_crest) / 2.0\n    prof = (\n        cq.Workplane(\"XZ\")\n        .polyline([(r_root,\
    \ -P / 2.0), (r_crest, 0.0), (r_root, P / 2.0)])\n        .close()\n    )\n  \
    \  try:\n        helix = cq.Wire.makeHelix(P, tl, r_helix)\n        thread = prof.sweep(cq.Workplane(obj=helix),\
    \ isFrenet=True)\n        body = head.union(core).union(thread)\n    except Exception:\n\
    \        body = head.union(core)\n\n    # trim the thread flush at the tip\n \
    \   body = body.cut(\n        cq.Workplane(\"XY\")\n        .workplane(offset=tl)\n\
    \        .box(hd * 2.0, hd * 2.0, 20.0, centered=(True, True, False))\n    )\n\
    \    return body.translate((0, 0, hh))\n"
  print_orientation: 'standing: head face down on the bed, shank and thread rising
    vertically, no supports'
  use_orientation: head sits in the plate's square pocket, shank passes up through
    the plate and threads into the camera's 1/4-20 socket; the spare for the salvaged
    bolt
