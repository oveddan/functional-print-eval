task: tripod-plate
note: 'What changed from the print you made: only the screw-head recess in the plate.
  The outer shape (50 x 38 x 6 mm, 45 deg taper) is byte-for-byte what you already
  printed, because you confirmed it fits the borrowed clamp - so the clamp fit cannot
  have regressed. The recess was a round Ø16 pocket; a round pocket forces the slicer
  to print its 0.8 mm ceiling as a RING of filament looping in mid-air around the
  Ø7 hole (exactly the loose loops and tangles you saw, and the hole then closing
  up). It is now a SQUARE 16.4 x 16.4 pocket: the ceiling''s bridge lines now run
  straight from one vertical wall to the other, anchored at both ends, so the first
  layer lays down on a real bridge and the four layers above it fill solid. The recess
  is also a little bigger (16.4 vs 16.0) and the hole a little looser (7.2 vs 7.0)
  so a small elephant-foot lip at the pocket mouth or any hole shrink cannot grab
  the bolt head. I also thickened the roof slightly (0.9 mm, was 0.8) and the pocket
  is now 5.1 deep, which still leaves the bolt head 0.1 mm inside it. Belt and braces:
  turn supports ON when you slice the plate - the pocket ceiling is the only horizontal
  overhang in the part, the supports grow up from the bed inside the pocket in one
  little grid, and pull out in one piece. Everything else from your report stands:
  the bolt head cleared its recess and the clamp fitted, so nothing else was touched.
  The fit coupon is dropped - the plate itself did that job. The screw is unchanged
  (you had no complaint about it) and is still the spare: the salvaged webcam-mount
  bolt is the screw to actually use, being steel with the right 1/4-20 thread and
  exactly the 10 mm of thread this plate''s 5.1 + 4.1 mm split needs. If the printed
  screw''s thread looks rough, use the bolt and don''t force a PLA thread into the
  camera''s brass socket.'
questions: []
params:
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam-mount bolt head, across
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: salvaged bolt head height
  bolt_thread_len:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: threaded length under the head
  camera_socket_depth:
    value: 6.5
    unit: mm
    kind: world
    source: guessed
    note: typical 1/4-20 socket depth; still unmeasured, kept above the 4.1 mm that
      projects so the screw cannot bottom out
  plate_chamfer_deg:
    value: 45
    unit: deg
    kind: design
    source: asked
    note: 'CONFIRMED: the plate with this taper fitted the person''s clamp'
  plate_cbore_d:
    value: 16.4
    unit: mm
    kind: design
