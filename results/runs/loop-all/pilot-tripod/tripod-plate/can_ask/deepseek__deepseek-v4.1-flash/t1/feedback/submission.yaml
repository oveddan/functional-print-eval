- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_to_plate
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 5.1
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: square head pocket, 16.4 x 16.4 x 5.1 deep, in the bed-side face
    role: head_seat
  - part: plate
    feature: Ø7.2 clearance hole through the plate
    role: clearance
  nut: null
  external: camera's 1/4-20 tripod socket
criteria:
- id: pocket_takes_head
  part: plate
  feature: square head pocket in the bed-side face
  relation: contains
  hardware: bolt
  clearance_mm: 0.7
  params:
  - pocket_w
  - plate_t
  - pocket_roof
  - bolt_head_d
  - bolt_head_h
  check:
    method: measure
    ref: null
    description: the bolt head enters the 16.4 x 16.4 pocket and its top lands on
      the pocket ceiling, with the head 0.1 mm inside the plate rather than proud
      of the bed face. The pocket is 0.4 mm larger than the round one you already
      tried, so this is confirmed
- id: hole_clears_thread
  part: plate
  feature: Ø7.2 clearance hole through the plate
  relation: clears
  hardware: bolt
  clearance_mm: 0.85
  params:
  - plate_hole_d
  - thread_od
  check:
    method: measure
    ref: null
    description: the bolt's 6.35 mm shank slides through the 7.2 mm hole; if the hole
      came out tight, chase it with a 7 mm drill or work the bolt through by hand
      before assembling
- id: roof_prints_solid
  part: plate
  feature: 0.9 mm pocket roof and the hole through it
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - pocket_roof
  - pocket_w
  - plate_t
  - plate_hole_d
  check:
    method: measure
    ref: null
    description: 'inspect the printed 0.9 mm roof over the pocket before assembling:
      it must be solid, with no loose strands, and the hole must be open. This is
      the feature that failed last time (round pocket = ring of filament printed in
      mid-air); square pocket + supports must fix it. If it still comes out loose,
      print again with supports forced on and the bridge fan at 100%'
- id: seats_in_clamp
  part: plate
  feature: the two 45 deg tapered long sides
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - plate_wid
  - plate_t
  - plate_chamfer_deg
  check:
    method: measure
    ref: null
    description: 'the taper, width and thickness are exactly what you already printed
      and reported fitting the borrowed clamp, so this should only need re-checking:
      the plate drops in, sits down and the angled lips grip it when the knob is snugged'
- id: thread_reaches_camera
  part: screw
  feature: 1/4-20 thread standing proud of the plate's top face
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - screw_thread_len
  - screw_head_h
  - pocket_roof
  - plate_t
  - camera_socket_depth
  check:
    method: measure
    ref: null
    description: with either screw's head in the 5.1 mm pocket, 4.1 mm of 1/4-20 thread
      (10 mm of thread minus the 5.9 mm sitting in the pocket and plate) projects
      above the plate's top face - enough to hold a camera, and under the ~6.5 mm
      socket depth so it cannot bottom out and jack the plate off the camera
- id: plate_face_meets_camera
  part: plate
  feature: top face, 24 x 50 mm
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - plate_len
  - plate_wid
  - plate_t
  - plate_chamfer_deg
  check:
    method: none
    ref: null
    description: the camera's base lands flat on the 24 x 50 mm top face, ringed by
      the taper - check by eye that it pulls down flat as the screw is snugged
manual:
- n: '1'
  text: 'Slice plate: wide 38 x 50 mm face down on the bed, taper narrowing upward.
    Turn supports ON (auto) - the square head pocket''s 0.9 mm ceiling is the only
    place supports will generate, and they come out in one little grid. The pocket
    is square now, so its ceiling bridges straight from wall to wall instead of being
    looped in mid-air - that was the fault last time.'
  parts:
  - plate
  hardware: []
  tool: Bambu Studio
- n: '2'
  text: 'Optional: print screw, head down on the bed, standing vertically, no supports.'
  parts:
  - screw
  hardware: []
  tool: Bambu Studio
- n: '3'
  text: 'Pull the supports out of the pocket with tweezers or a small screwdriver.
    Now look at the roof over the pocket: it must be a solid 0.9 mm skin with an open
    hole, not loose strands. Push the bolt through the hole - if it is tight, chase
    the hole with a 7 mm drill or work the bolt through by hand. Don''t assemble until
    the roof is solid, because this roof is what the bolt head pulls against.'
  parts:
  - plate
  hardware: []
  tool: null
- n: '4'
  text: Drop the salvaged webcam-mount bolt (or the printed screw) into the square
    pocket from the bed side, head down, and push the thread up through the plate
    so it comes out of the top face.
  parts:
  - plate
  - screw
  hardware:
  - bolt
  tool: null
- n: '5'
  text: 'Screw it into the camera''s 1/4-20 socket until snug: the plate''s 24 mm-wide
    top face pulls flat against the camera''s base, and the head lifts to sit on the
    pocket roof. Snug only - the roof is 0.9 mm of PLA. If you are using the printed
    screw, go gently and stop if it binds; a PLA thread cross-threads far more easily
    than the steel bolt.'
  parts:
  - plate
  - screw
  hardware:
  - bolt
  tool: null
- n: '6'
  text: Loosen the clamp's knob, drop the camera + plate into the slot from above
    with the tapered sides between the jaws, and snug the knob so the lips bite the
    taper and press the plate down. This is the same outer shape you already fitted,
    so it should seat as before.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '7'
  text: 'Temporary-use only: PLA creeps and the printed thread wears. Re-check the
    knob before each session, keep the camera light, and never lift or carry the tripod
    by the camera.'
  parts:
  - plate
  - screw
  hardware:
  - bolt
  tool: null
