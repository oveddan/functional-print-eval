task: tripod-plate
note: 'Same design as before, with the two weak points made self-correcting, because
  I got no results back and can''t iterate on your numbers.


  Unchanged and still the core idea: the salvaged 1/4"-20 bolt is the screw (do not
  print a 1/4"-20 thread in PLA - it strips in a metal socket within a few cycles),
  and the printed plate is the flange. The bolt''s 15 x 5 mm head sits in a pocket
  in the plate''s clamp-side face, held by four press-fit ribs (0.2 mm per side into
  the head), so plate and bolt turn as one and you screw the whole plate onto the
  camera by twisting. The head ends 0.3 mm recessed, and the shank leaves 5.3 mm proud
  of the camera face, which is the standard tripod-screw engagement, so it should
  not bottom out.


  What changed:

  1. The bolt head is now deliberately reachable - it sits only 0.3 mm inside the
  pocket mouth, so a fingertip or a coin edge can hold it if the ribs ever slip. That
  removes the design''s dependence on friction alone.

  2. A paper-shim path for a shallow camera socket: a card disc in the pocket under
  the head reduces protrusion by its own thickness. No reprint needed.

  3. A 1.2 mm friction-pad groove on the camera-contact face, so a ring cut from a
  rubber band stops the camera twisting on a smooth PLA face.

  4. Ribs a touch tighter (14.5 mm tip circle) and the coupon lengthened to 24 mm
  so the pocket has solid walls at both ends.


  What is still unverified, and what the manual''s two gates are for: whether your
  clamp''s jaws are 45 deg or straight-sided, and how deep its slot is. You could
  only give me the 38 mm plate width, so the profile is 45 deg chamfered on both the
  top and bottom shoulders and 37.0 mm at its widest - it seats in either kind of
  jaw and always enters. Gate 1 (coupon in the clamp) and Gate 2 (bolt in the coupon)
  happen before you print the plate, so a bad fit costs ten minutes, not a camera.
  If a gate fails, the number I need is the clamp''s actual slot width, and I will
  re-cut it.'
questions: []
params:
  bolt_protrusion:
    value: 5.3
    unit: mm
    kind: design
    source: design
    note: shank_len - web_t; matches the ~5.6 mm thread of a standard tripod screw
      so it should not bottom out
  camera_screw_engagement:
    value: 5.6
    unit: mm
    kind: world
    source: datasheet
    note: approximate thread length of a standard 1/4-20 tripod screw (ISO 1222);
      target for bolt_protrusion
  clamp_plate_width:
    value: 38.0
    unit: mm
    kind: world
    source: measured
    note: width of plate the borrowed tripod's clamp takes, as reported; jaw shape
      and slot depth unknown
  coupon_len:
    value: 24.0
    unit: mm
    kind: design
    source: design
    note: test slice of the same cross-section; long enough for solid pocket walls
      at both ends
  head_d:
    value: 15.0
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam bolt head across
  head_h:
    value: 5.0
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam bolt head height
  mouth_chamfer:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: lead-in at the pocket mouth
  pad_groove_depth:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: depth for a ring cut from a rubber band or inner tube as a friction pad
  pad_groove_id:
    value: 22.0
    unit: mm
    kind: design
    source: design
    note: inner diameter of the friction-pad groove
  pad_groove_od:
    value: 26.0
    unit: mm
    kind: design
    source: design
    note: outer diameter of the friction-pad groove
  plate_len:
    value: 50.0
    unit: mm
    kind: design
    source: design
    note: along the clamp's slide axis
  plate_t:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: total thickness; common for plates of this family, and thin enough that
      the 5.3 mm bolt protrusion is right
  plate_w_face:
    value: 31.0
    unit: mm
    kind: design
    source: design
    note: flat camera-contact face; 45 deg shoulders flare from it out to plate_w_max
      and back in at the clamp face
  plate_w_max:
    value: 37.0
    unit: mm
    kind: design
    source: design
    note: clamp_plate_width minus 1.0 total (0.5 per side) so it enters freely; the
      clamp's screw takes up the slack
  pocket_d:
    value: 15.6
    unit: mm
    kind: design
    source: design
    note: head_d + 0.6 so the head drops in
  pocket_depth:
    value: 5.3
    unit: mm
    kind: design
    source: design
    note: head_h + 0.3, so the head ends 0.3 mm below the clamp-side face and stays
      reachable with a fingertip
  rib_d:
    value: 1.6
    unit: mm
    kind: design
    source: design
    note: diameter of each press-fit rib pin
  rib_tip_d:
    value: 14.5
    unit: mm
    kind: design
    source: design
    note: circle through the four rib tips = head_d - 0.5, i.e. 0.25 mm bite per side
      so twisting the plate drives the bolt
  shank_hole_d:
    value: 6.6
    unit: mm
    kind: design
    source: design
    note: 1/4 in = 6.35 mm plus 0.25 clearance
  shank_len:
    value: 10.0
    unit: mm
    kind: hardware
    source: measured
    note: threaded length under the head; the tight constraint on the whole design
  web_t:
    value: 4.7
    unit: mm
    kind: design
    source: design
    note: plate_t - pocket_depth; the material the shank passes through
parts:
- id: plate
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    W = p.plate_w_max\n    Wf = p.plate_w_face\n\
    \    T = p.plate_t\n    L = p.plate_len\n    c = (W - Wf) / 2.0\n    pts = [(-Wf/2.0,\
    \ 0.0), (Wf/2.0, 0.0), (W/2.0, c), (W/2.0, T-c),\n           (Wf/2.0, T), (-Wf/2.0,\
    \ T), (-W/2.0, T-c), (-W/2.0, c)]\n    body = cq.Workplane(\"YZ\").polyline(pts).close().extrude(L)\n\
    \    body = body.translate((-L/2.0, 0, 0))\n\n    zf = T - p.pocket_depth\n  \
    \  pr = p.pocket_d / 2.0\n\n    # bolt-head pocket, open at the clamp-side face\
    \ (z = T)\n    body = body.cut(cq.Workplane(\"XY\").workplane(offset=zf).circle(pr).extrude(p.pocket_depth\
    \ + 1.0))\n\n    # lead-in chamfer at the pocket mouth\n    cone = cq.Solid.makeCone(pr,\
    \ pr + p.mouth_chamfer, p.mouth_chamfer,\n                             cq.Vector(0,\
    \ 0, T - p.mouth_chamfer), cq.Vector(0, 0, 1))\n    body = body.cut(cq.Workplane(obj=cone))\n\
    \n    # four press-fit ribs that grip the bolt head\n    rc = p.rib_tip_d / 2.0\
    \ + p.rib_d / 2.0\n    rh = p.pocket_depth - 1.4\n    for a in (0.0, 90.0, 180.0,\
    \ 270.0):\n        ang = math.radians(a)\n        pin = cq.Solid.makeCylinder(p.rib_d\
    \ / 2.0, rh,\n                                    cq.Vector(rc*math.cos(ang),\
    \ rc*math.sin(ang), T - 1.0 - rh),\n                                    cq.Vector(0,\
    \ 0, 1))\n        body = body.union(cq.Workplane(obj=pin))\n\n    # shank clearance\
    \ hole through the web\n    body = body.cut(cq.Workplane(\"XY\").workplane(offset=-1.0)\n\
    \                    .circle(p.shank_hole_d/2.0).extrude(zf + 2.0))\n\n    # friction-pad\
    \ groove in the camera-contact face (z = 0)\n    outer = cq.Solid.makeCylinder(p.pad_groove_od/2.0,\
    \ p.pad_groove_depth + 0.5,\n                                  cq.Vector(0, 0,\
    \ -0.5), cq.Vector(0, 0, 1))\n    inner = cq.Solid.makeCylinder(p.pad_groove_id/2.0,\
    \ p.pad_groove_depth + 1.0,\n                                  cq.Vector(0, 0,\
    \ -1.0), cq.Vector(0, 0, 1))\n    body = body.cut(cq.Workplane(obj=outer.cut(inner)))\n\
    \    return body\n"
  print_orientation: flat camera-contact face down on the bed at z = 0; the part grows
    upward to the clamp-side face at z = 10, with the bolt-head pocket and the friction-pad
    groove both open upward
  use_orientation: 'flipped over: clamp-side face (pocket and bolt head) down toward
    the tripod head, flat 31 x 50 mm camera-contact face up against the camera base'
- id: coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    W = p.plate_w_max\n    Wf = p.plate_w_face\n\
    \    T = p.plate_t\n    L = p.coupon_len\n    c = (W - Wf) / 2.0\n    pts = [(-Wf/2.0,\
    \ 0.0), (Wf/2.0, 0.0), (W/2.0, c), (W/2.0, T-c),\n           (Wf/2.0, T), (-Wf/2.0,\
    \ T), (-W/2.0, T-c), (-W/2.0, c)]\n    body = cq.Workplane(\"YZ\").polyline(pts).close().extrude(L)\n\
    \    body = body.translate((-L/2.0, 0, 0))\n\n    zf = T - p.pocket_depth\n  \
    \  pr = p.pocket_d / 2.0\n\n    body = body.cut(cq.Workplane(\"XY\").workplane(offset=zf).circle(pr).extrude(p.pocket_depth\
    \ + 1.0))\n\n    cone = cq.Solid.makeCone(pr, pr + p.mouth_chamfer, p.mouth_chamfer,\n\
    \                             cq.Vector(0, 0, T - p.mouth_chamfer), cq.Vector(0,\
    \ 0, 1))\n    body = body.cut(cq.Workplane(obj=cone))\n\n    rc = p.rib_tip_d\
    \ / 2.0 + p.rib_d / 2.0\n    rh = p.pocket_depth - 1.4\n    for a in (0.0, 90.0,\
    \ 180.0, 270.0):\n        ang = math.radians(a)\n        pin = cq.Solid.makeCylinder(p.rib_d\
    \ / 2.0, rh,\n                                    cq.Vector(rc*math.cos(ang),\
    \ rc*math.sin(ang), T - 1.0 - rh),\n                                    cq.Vector(0,\
    \ 0, 1))\n        body = body.union(cq.Workplane(obj=pin))\n\n    body = body.cut(cq.Workplane(\"\
    XY\").workplane(offset=-1.0)\n                    .circle(p.shank_hole_d/2.0).extrude(zf\
    \ + 2.0))\n\n    outer = cq.Solid.makeCylinder(p.pad_groove_od/2.0, p.pad_groove_depth\
    \ + 0.5,\n                                  cq.Vector(0, 0, -0.5), cq.Vector(0,\
    \ 0, 1))\n    inner = cq.Solid.makeCylinder(p.pad_groove_id/2.0, p.pad_groove_depth\
    \ + 1.0,\n                                  cq.Vector(0, 0, -1.0), cq.Vector(0,\
    \ 0, 1))\n    body = body.cut(cq.Workplane(obj=outer.cut(inner)))\n    return\
    \ body\n"
  print_orientation: 'same as the plate: flat camera-contact face down on the bed
    at z = 0, pocket and pad groove open upward'
  use_orientation: slid into the borrowed clamp like the plate, then used to test
    the bolt's press-fit
