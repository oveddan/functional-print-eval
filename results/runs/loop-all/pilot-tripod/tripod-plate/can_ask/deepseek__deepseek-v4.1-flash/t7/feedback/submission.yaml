manual:
- n: '1'
  text: 'Print the COUPON first: 24 mm slice of the plate''s cross-section, same profile
    and same pocket. PLA, 0.2 mm layers, flat face on the bed, no supports. ~10 minutes.
    Everything below is gated on it.'
  parts:
  - coupon
  hardware: []
  tool: printer
- n: '2'
  text: 'GATE 1 - clamp fit. Back the borrowed clamp''s tightening screw off fully
    and slide the coupon into the slot from the end. PASS: it enters with light finger
    pressure and the screw then closes on it with travel to spare. If it jams, the
    slot is narrower than the 38 mm I was given, so the plate would jam too - do not
    print the plate; that is the one thing I would need a number for. If it rattles
    and the screw runs out of travel, tell me.'
  parts:
  - coupon
  hardware: []
  tool: null
- n: '3'
  text: GATE 2 - bolt grip. Press the bolt, thread first, into the coupon's pocket
    on the flat side. It should go in with firm thumb pressure and the four ribs should
    bite, so that twisting the coupon twists the bolt. The head must finish flush
    or just below the face. If it spins freely, tell me - the ribs are 0.2 mm into
    a 15 mm head and are the only thing that lets the plate drive the bolt.
  parts:
  - coupon
  hardware:
  - bolt
  tool: null
- n: '4'
  text: Print the PLATE. Same settings, flat camera-contact face on the bed, no supports.
    50 x 37 x 10 mm.
  parts:
  - plate
  hardware: []
  tool: printer
- n: '5'
  text: Press the bolt into the plate's pocket exactly as on the coupon, until the
    head sits below the clamp-side face. The plate now hangs on the bolt and turns
    with it.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '6'
  text: Hold the plate flat and bring the camera's socket down onto the bolt; twist
    the camera clockwise to screw it on, or twist the plate while the ribs drag the
    bolt. Straight down, no cross-threading. Hand-tight only.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '7'
  text: 'Self-fix if the bolt will not turn with the plate: the bolt head sits 0.3
    mm below the clamp-side face, so press a fingertip or the edge of a coin flat
    onto it through the pocket to hold it still while you turn the camera. Self-fix
    if the bolt stops before the plate touches the camera base: cut a disc of paper
    or thin card to the pocket size and lay it under the head - every 0.1 mm of shim
    removes 0.1 mm of protrusion, up to about 0.25 mm before the head stands proud
    of the face.'
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '8'
  text: 'Optional friction pad: cut a ring from a rubber band or an old inner tube,
    about 1.2 mm thick, 22-26 mm dia, and lay it in the groove on the camera-contact
    face before you tighten. Without it, hand-tight PLA against a camera base will
    let the camera twist about the bolt.'
  parts:
  - plate
  hardware: []
  tool: null
- n: '9'
  text: 'Slide the plate into the clamp from the end of the slot, camera up, and tighten
    the clamp screw. Then tug and rock the camera gently - the plate must not lift
    out of the jaws or slide lengthways. If it lifts, the clamp''s jaws are straight-sided
    rather than 45 deg, and the plate is only being held by the screw''s pressure:
    keep it level and accept it as a desk tripod only.'
  parts:
  - plate
  hardware: []
  tool: null
- n: '10'
  text: 'Temporary-mount rules: PLA creeps under steady load and softens in heat,
    so do not leave the camera hanging unattended and keep it out of a hot car. Re-check
    the clamp screw each session. To remove the camera, twist the plate off it - the
    bolt stays in the camera and the plate slips off its head.'
  parts:
  - plate
  - coupon
  hardware:
  - bolt
  tool: null
