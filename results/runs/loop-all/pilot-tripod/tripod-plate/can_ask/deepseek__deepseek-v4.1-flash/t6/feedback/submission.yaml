task: tripod-plate
note: 'What changed and why: nothing about the shape in use. The plate is now modelled
  in the orientation it is printed in with the CAMERA face on the bed, so the bolt-head
  pocket opens upward and prints as vertical walls with a flat floor. Previously the
  clamp face was on the bed, which made the pocket a downward-facing cavity whose
  ceiling was a ring bridged across thin air - that is the loose loops and tangled,
  half-closed hole you saw on both the coupon and the plate. There is now no bridge
  anywhere in the part and no overhang steeper than 45 degrees (the two dovetail chamfers
  at the bed edges), so it prints support-free.


  Because the in-use shape is unchanged, the clamp fit you already confirmed still
  holds: 37.6 mm across, 11 mm thick, 45 degree x 3 mm chamfers, which printed well
  enough to fit. The 0.4 mm side clearance and the 0.15 mm press fit on the bolt head
  are unchanged too.


  The bolt still does the work of "the part that screws in": a printed 1/4-20 thread
  in PLA holding a camera cantilevered off a tripod is the weak link of this whole
  thing, so the plate carries your salvaged steel webcam bolt instead, pressed into
  the pocket so it cannot spin while you thread the camera on. The load path is PLA
  plate, steel thread, camera''s own metal socket.


  Still unmeasured, and now the only real unknowns: the clamp''s jaw angle (the dovetail
  is the standard 38 mm / 45 degree / 3 mm form, and it fit) and your camera''s socket
  depth (the bolt stands proud by 4.5 mm, under the ~5.5 mm typical minimum). Use
  the coupon to check the pocket before committing 40 minutes to the plate.'
questions:
- text: After pressing the bolt into the new pocket, does the head stay put without
    turning when you thread the camera on?
  answer: null
- text: How deep is the 1/4-20 socket in the bottom of your camera, in mm? (Needed
    to confirm the 4.5 mm of bolt thread sticking out of the plate doesn't bottom
    out.)
  answer: null
