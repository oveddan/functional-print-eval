parts:
- id: plate
  role: final
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    W = p.plate_w_top\n    L = p.plate_len\n\
    \    T = p.plate_t\n    dvh = p.dv_h\n    dvw = p.dv_w_bot\n    cb_z = T - p.cb_depth\
    \          # floor of the bolt pocket\n    step_z = T - p.cb_lead_depth   # top\
    \ of the entry step\n\n    # cross-section (x = width, y = height), extruded to\
    \ length\n    prof = (cq.Workplane(\"XY\")\n            .polyline([(-W / 2.0,\
    \ 0.0), (W / 2.0, 0.0),\n                       (W / 2.0, T - dvh), (dvw / 2.0,\
    \ T),\n                       (-dvw / 2.0, T), (-W / 2.0, T - dvh)])\n       \
    \     .close())\n    s = prof.extrude(L).rotate((0, 0, 0), (1, 0, 0), 90).translate((0,\
    \ -L / 2.0, 0))\n\n    # bolt pocket, opening at the tripod-side face (top of\
    \ the print)\n    s = s.cut(cq.Workplane(\"XY\").workplane(offset=cb_z)\n    \
    \          .circle(p.cb_d / 2.0).extrude(T - cb_z + 1.0))\n    # wider entry step\
    \ at the mouth of the pocket\n    s = s.cut(cq.Workplane(\"XY\").workplane(offset=step_z)\n\
    \              .circle(p.cb_lead_d / 2.0).extrude(T - step_z + 1.0))\n    # shank\
    \ clearance hole, opening at the contact face (the bed)\n    s = s.cut(cq.Workplane(\"\
    XY\").workplane(offset=-1.0)\n              .circle(p.shank_hole_d / 2.0).extrude(cb_z\
    \ + 1.0))\n    # shallow grip recess in the contact face\n    s = s.cut(cq.Workplane(\"\
    XY\").workplane(offset=-1.0)\n              .circle(p.grip_recess_d / 2.0).extrude(p.grip_recess_z\
    \ + 1.0))\n    return s"
  print_orientation: 'Camera-contact face on the bed (z = 0). The part only gets narrower
    as it rises: the 38 mm flanks taper in at 45 degrees, and the bolt pocket opens
    at the top of the print with a flat floor, so there are no overhangs and no supports.
    Only the shallow 24 mm grip recess forms a short bridge, well inside the 50 mm
    limit.'
  use_orientation: Contact face up against the camera's base. The 26 mm foot goes
    down onto the clamp floor with the 45 degree flanks wedging into the jaws. The
    bolt head sits in the 17 mm pocket on the underside with an 18 mm entry step at
    the mouth, 1 mm recessed, its thread passing up through the 7 mm hole and out
    of the contact face into the camera.
- id: coupon
  role: coupon
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    W = p.plate_w_top\n    T = p.plate_t\n\
    \    dvh = p.dv_h\n    dvw = p.dv_w_bot\n    L = p.coupon_len\n    cb_z = T -\
    \ p.cb_depth\n    step_z = T - p.cb_lead_depth\n\n    prof = (cq.Workplane(\"\
    XY\")\n            .polyline([(-W / 2.0, 0.0), (W / 2.0, 0.0),\n             \
    \          (W / 2.0, T - dvh), (dvw / 2.0, T),\n                       (-dvw /\
    \ 2.0, T), (-W / 2.0, T - dvh)])\n            .close())\n    s = prof.extrude(L).rotate((0,\
    \ 0, 0), (1, 0, 0), 90).translate((0, -L / 2.0, 0))\n\n    s = s.cut(cq.Workplane(\"\
    XY\").workplane(offset=cb_z)\n              .circle(p.cb_d / 2.0).extrude(T -\
    \ cb_z + 1.0))\n    s = s.cut(cq.Workplane(\"XY\").workplane(offset=step_z)\n\
    \              .circle(p.cb_lead_d / 2.0).extrude(T - step_z + 1.0))\n    s =\
    \ s.cut(cq.Workplane(\"XY\").workplane(offset=-1.0)\n              .circle(p.shank_hole_d\
    \ / 2.0).extrude(cb_z + 1.0))\n    return s"
  print_orientation: 'Same as the plate: contact face on the bed, no supports. It
    is a 30 mm slice of the plate''s exact cross-section with the identical bolt pocket,
    so whatever it does, the plate does.'
  use_orientation: A gauge, not a functional part. Drop it into the clamp jaws to
    re-check the dovetail, and push the salvaged bolt through it to read whether the
    15 mm head clears the 18 mm entry step and the 17 mm bore with 1 mm to spare.
