manual:
- n: '1'
  text: 'Print the coupon exactly as modelled: the flat face on the bed, 0.2 mm layers,
    no supports. It is a short print and it holds the same bolt pocket as the plate.'
  parts:
  - coupon
  hardware: []
  tool: null
- n: '2'
  text: 'The clamp already fitted on your first print, so this step is just a re-check:
    drop the coupon between the jaws and tighten the knob. It should wedge down onto
    the clamp floor and not rock.'
  parts:
  - coupon
  hardware: []
  tool: the clamp's knob
- n: '3'
  text: 'Push the salvaged bolt, thread first, up through the coupon from its narrow
    (tripod) side. Read the result, don''t judge it: the head must drop fully into
    the pocket and end up level with or below the face around it, leaving a visible
    step of at least 1 mm. Two possible outcomes — it drops in: go on to step 4. It
    will not enter at all: the head is over 18 mm, so stop and tell me and I will
    open the pocket further. Do not force it or hammer it; if it is close, ease it
    with a round file.'
  parts:
  - coupon
  hardware:
  - bolt
  tool: null
- n: '4'
  text: Print the plate. Nothing needs changing.
  parts:
  - plate
  hardware: []
  tool: null
- n: '5'
  text: 'Optional but worth it: cut a 24 mm disc from a bicycle inner tube or a scrap
    of shelf liner, or use a square of double-sided tape, and drop it into the shallow
    24 mm recess in the contact face. This is the only thing stopping the camera spinning
    itself loose off the plate.'
  parts:
  - plate
  hardware: []
  tool: null
- n: '6'
  text: Slide the bolt up through the plate from the tripod side, head last. The head
    sits in the pocket, recessed 1 mm below the face, with the thread standing proud
    of the contact face.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '7'
  text: Hold the plate contact face up in one hand with your thumb pressed on the
    bolt head through the pocket, and screw the camera down onto the protruding thread.
    Turn the camera, not the plate. Finger-tight only — the thread is going into metal
    and the plate is PLA.
  parts:
  - plate
  hardware:
  - bolt
  tool: your hands
- n: '8'
  text: Loosen the clamp knob, drop the plate (camera and all) down between the jaws
    so the dovetail lands on the clamp floor, and tighten the knob firmly. Check the
    camera does not rock and the plate does not slide.
  parts:
  - plate
  hardware: []
  tool: the clamp's knob
- n: '9'
  text: 'Every time you use it: keep one hand on the camera while the knob is loose,
    and never carry the tripod with the camera attached. PLA relaxes under steady
    load and softens in a hot car or direct sun, and the whole clamp load passes through
    a printed flank. This is a stopgap until you find the real plate.'
  parts:
  - plate
  - coupon
  hardware: []
  tool: null
