task: tripod-plate
note: 'Revision 2 — the clamp fit is confirmed and untouched; only the bolt pocket
  changed.


  You could not tell how the bolt''s head went in, so rather than ask you to judge
  a fit, I made the pocket forgiving instead of exact. The 16 mm bore is now 17 mm,
  with an 18 mm x 1 mm entry step at the mouth, so a head anywhere from 15 mm up to
  nearly 18 mm drops straight in and the step guides it. The plate went 10 mm to 11
  mm thick and the pocket 5 mm to 6 mm deep, which gives the head a full 1 mm of slack
  if it is taller than the 5 mm I was told — so it can never stand proud of the tripod-side
  face and rock the plate on the clamp''s floor. The thread still stands exactly 5.0
  mm proud of the contact face (6 mm pocket + 10 mm thread - 11 mm plate), which is
  the same camera engagement as before and right at the usual limit, so it will not
  bottom out in a shallow socket.


  The dovetail is bit-for-bit unchanged: 38 mm across the top, 45 degree flanks 6
  mm tall, 26 mm foot. The only difference is 1 mm more slab above the flanks, which
  sits above the jaws where nothing can touch it.


  The one thing I still cannot verify is whether a head that measures "about 15 mm"
  actually drops into a 17 mm hole. Step 3 is written so the answer is a yes/no you
  can see: the head goes in, or it does not. If it does not, tell me and I will open
  the pocket again.


  Worth repeating: this is a temporary part. Do not carry the tripod with the camera
  on it, and keep a hand on the camera while the clamp knob is loose.'
questions:
- text: In step 3, did the bolt's head drop fully into the pocket — yes or no? That
    single answer is the only thing standing between this design and a working part.
    If it will not enter, I open the bore again; the dovetail stays as it is.
  answer: null
- text: How deep is your camera's 1/4-20 socket? I still have 6.5 mm assumed and 5.0
    mm of thread proud. If it is shallower than 5 mm, tell me — I would shave the
    plate rather than let the bolt bottom out and leave the plate rocking on the camera.
  answer: null
- text: What is on the flat face of the salvaged bolt's head, looking up from underneath
    — a slot, a hex socket, or plain? With a slot you can tighten it through the 17
    mm opening with a coin instead of by turning the camera.
  answer: null
