criteria:
- id: c1_head_pocket
  part: plate
  feature: 'bolt pocket: 17 mm bore x 5 mm, plus an 18 mm x 1 mm entry step, in the
    tripod-side face'
  relation: contains
  hardware: bolt
  clearance_mm: 2.0
  params:
  - cb_d
  - cb_lead_d
  - cb_lead_depth
  - cb_depth
  - bolt_head_d
  - bolt_head_h
  check:
    method: coupon
    ref: coupon
    description: push the bolt through the coupon from the narrow side. The head must
      drop in and end up with a visible step of at least 1 mm below the face around
      it. If it will not enter the 18 mm entry step at all, the head is bigger than
      18 mm — tell me and I will open it further.
