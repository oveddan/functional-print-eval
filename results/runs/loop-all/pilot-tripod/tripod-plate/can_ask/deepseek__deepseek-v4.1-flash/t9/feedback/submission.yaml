manual:
- n: '1'
  text: Print the coupon first - PLA, 0.2 mm layers, flat face on the bed, stud pointing
    up, no supports. About 10 minutes. It is now just a bar with the printed 1/4-20
    stud and a 6.9 mm hole.
  parts:
  - coupon_thread
  hardware: []
  tool: 3D printer
- n: '2'
  text: Test the coupon. (a) Slide the salvaged webcam bolt's thread through the 6.9
    mm hole - it should pass freely. (b) Screw the coupon's printed stud into the
    1/4-20 nut with light finger pressure; it must run in without cross-threading
    and it must hold.
  parts:
  - coupon_thread
  hardware:
  - bolt
  - nut_1_4_20
  tool: calipers
- n: '3'
  text: If the stud is too tight or cross-threads, lower screw_crest_d by 0.1 mm (and
    screw_root_d by 0.05 mm if it still fights) and reprint just the coupon. If it
    is sloppy and slips, raise screw_root_d by 0.05 mm. Only then print the real parts.
  parts:
  - coupon_thread
  hardware: []
  tool: 3D printer
- n: '4'
  text: Print the plate with its flat camera face on the bed (the pocket and its window
    open upward) and the thumbscrew with its head on the bed. No supports for either.
  parts:
  - plate
  - thumbscrew
  hardware: []
  tool: 3D printer
- n: '5'
  text: 'Dry-fit the empty plate into the tripod head: the chamfered long edges are
    the lead-in, so present that side first and let it drop in. It should slide in
    with a little slack and be gripped by the clamp. If it will not enter, sand the
    two long sides evenly until it does - do not force it.'
  parts:
  - plate
  hardware: []
  tool: null
- n: '6'
  text: 'Fit the salvaged bolt into the plate: push the thread up through the middle
    hole from the side with the pocket, so the head sits down in the pocket and the
    thread comes out of the flat camera face. It should not fall out when you turn
    the plate over.'
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '7'
  text: 'Sit the camera on the flat face of the plate and turn the bolt''s head to
    start it into the camera''s socket. You reach the head through the window cut
    in the end of the plate - press a thumb or thumbnail on the head''s rim and turn.
    Tighten firmly, since this is the only thing holding the camera, but do not gorilla
    it: the plate is plastic.'
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '8'
  text: Slide the loaded plate into the tripod head, chamfered edge first, and tighten
    the head's clamp screw or lever. Push down lightly on the camera to check the
    plate is not rocking in the recess and that the clamp has closed on it.
  parts:
  - plate
  hardware: []
  tool: null
- n: '9'
  text: 'If you lose the bolt, the printed thumbscrew is a drop-in substitute: head
    down in the pocket, thread up into the camera. Tighten it with the finger flutes
    through the window, or with a coin in the slot on its underside. Treat it as a
    spare - a printed PLA thread strips long before a metal one.'
  parts:
  - plate
  - thumbscrew
  hardware: []
  tool: null
- n: '10'
  text: If the camera twists about the screw in use, stick a small square of double-sided
    tape or a disc cut from a rubber band on the plate's flat camera face. There is
    no rubber pad in the parts list, so this is the fix.
  parts:
  - plate
  hardware: []
  tool: null
- n: '11'
  text: 'Limits of this part. It is a temporary stand-in, not a replacement: PLA creeps
    under load, so re-check the screw tightness before every use, and take the camera
    off the tripod between shots rather than leaving it mounted. Do not use it with
    a heavy camera or a long lens. If it ever feels loose, stop using it. If the plate
    does not sit down into the tripod''s recess, the recess is shallower than 9.7
    mm - reduce plate_t (keep it at least 5.6 mm so the bolt head still clears) and
    re-check that the thread still does not bottom out in the camera''s socket.'
  parts:
  - plate
  - thumbscrew
  hardware: []
  tool: null
