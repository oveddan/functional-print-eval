task: tripod-plate
note: 'What changed from the last version, and why. The coupon failed because of my
  geometry, not your printer: a Ø16.6 mm pocket in an 18 mm wide coupon left 0.85
  mm walls, and the pocket''s floor was being laid across the void left by the through-hole
  below it, so the printer had nothing to sit the loops on and they tangled and closed
  the hole. That pocket test was redundant anyway - you have already confirmed the
  metal bolt''s head fits the real plate''s recess - so the coupon is now only a bar
  with the printed 1/4-20 stud and the Ø6.9 clearance hole. The stud geometry is unchanged,
  since it was not what failed.


  The plate changed too. It is now 37.2 mm across the clamp jaws instead of 37.6,
  giving 0.4 mm per side rather than 0.2 mm; a 0.2 mm gap is inside the dimensional
  tolerance of a printed part, so the old plate could easily have come out too wide
  to enter a 38 mm head. It is also 37.0 mm long instead of 38, and the two long edges
  on the tripod side now have a 45° chamfer, so it presents a tapered lead-in to the
  jaws instead of a square corner that catches. Everything else - the 9.7 mm thickness,
  the 16.6 x 5.5 mm head pocket, the access window, the 5.8 mm thread protrusion -
  is unchanged, because those parts fit.


  One thing I cannot check for you, and which is why the clamp question came back
  unanswered: the borrowed head''s plate recess is only known to be 38 mm wide. Its
  length and its depth were never measured, and I have no way to probe a part that
  is missing. So the plate is deliberately a little undersized in both footprint directions
  and you should dry-fit it into the head (step 5) before you trust it with the camera.'
questions:
- text: Now that the plate is a little smaller, does it slide into the tripod head's
    clamp and get gripped? If it is loose rather than tight, raise plate_w toward
    37.8 and reprint - a clamp with travel prefers a snug plate.
  answer: null
- text: How deep is the plate recess in the tripod head, and how long a plate does
    it take front to back? The plate is 9.7 mm thick and 37 mm long because I could
    not measure either.
  answer: null
- text: How deep is the threaded socket in the camera's base? The screw stands 5.8
    mm proud, which suits the usual ~6.5 mm socket, but a shallow socket would need
    a thinner plate.
  answer: null
- text: Is the webcam bolt's head a round knurled knob with a flat underside (what
    I assumed, since it must sit flat on the pocket floor), or a hex or dome head?
    A dome head would need a deeper pocket.
  answer: null
