task: tripod-plate
note: 'Revision 2. The first print failed the same way on every part that had one:
  a circular roof printed over a void with a hole in it, anchored only round its outside
  - the pocket''s ceiling in the plate and the wedge coupon, and a flat slot roof
  in the screw. Fixes: the plate and wedge coupon now print with the narrow 19 x 38
  mm camera face on the bed, so the pocket opens upward and the 8 mm hole ends exactly
  where the pocket starts; the pocket floor then sits on solid layers and nothing
  bridges. The screw''s thread is now a rounded 0.4 mm-radius profile swept as a tube
  instead of a sharp 60 deg V (round cross-sections slice cleanly and self-support),
  and the drive is a 45 deg V-groove instead of a flat-roofed slot. Unchanged: 38
  mm dovetail, 5 mm pocket, 5.5 mm protrusion, the metal bolt remaining interchangeable.
  Still light duty - snug with a coin, no heavy lenses, keep PLA out of a hot car.'
questions:
- text: The clamp's jaw angle and channel depth were never measured, so I kept the
    standard 45 degree dovetail on a 38 mm plate. If the wedge coupon still sits on
    top of the jaws instead of wedging down between them, tell me and I will re-profile
    the flanks.
  answer: null
- text: Camera socket depth is still unmeasured; I kept the protrusion at the standard
    5.5 mm. If the thread coupon bottoms out with its shoulder more than about 1 mm
    clear of the camera's base, tell me and I will shorten the stud.
  answer: null
- text: Does the rounded thread now run into the camera cleanly, and does the plate
    drop in and lock without rocking? Those two answers decide whether this is finished.
  answer: null
params:
  bolt_head_d:
    value: 15.0
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam-mount bolt, head across
  bolt_head_h:
    value: 5.0
    unit: mm
    kind: hardware
    source: measured
    note: salvaged bolt, head height
  bolt_shank_len:
    value: 10.0
    unit: mm
    kind: hardware
    source: measured
    note: salvaged bolt, under the head
  camera_socket_depth:
    value: 6.5
    unit: mm
    kind: world
    source: guessed
    note: not measured; typical camera socket. Design only needs 5.5 mm so it is safe
