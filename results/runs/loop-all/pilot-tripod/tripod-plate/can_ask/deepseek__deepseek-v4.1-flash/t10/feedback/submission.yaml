manual:
- n: '1'
  text: 'Print the two coupons first - coupon_wedge and coupon_thread - PLA, 0.2 mm
    layers, no supports. Both now print with no bridging anywhere: the wedge coupon
    sits on its narrow 19 mm face with the pocket opening upward, and the thread coupon
    prints knob-down with the V-groove opening onto the bed.'
  parts:
  - coupon_wedge
  - coupon_thread
  hardware: []
  tool: 3D printer
- n: '2'
  text: 'Test coupon_wedge in the borrowed clamp: open the knob, drop it in with its
    wide 38 mm face down, tighten. It must wedge on its flanks and be pulled flat
    onto the clamp''s floor without rocking. Also confirm the clamp''s opening is
    at least 38 mm long (the full plate is 38 mm) and that the salvaged bolt''s head
    drops fully into the coupon''s pocket.'
  parts:
  - coupon_wedge
  hardware:
  - bolt1
  tool: null
- n: '3'
  text: 'Test coupon_thread in the camera: screw the rounded 1/4-20 stud in by hand.
    Expect about 4-5 turns, stopping with the knob 3-4 mm clear of the camera''s base
    - that gap proves the socket is deeper than the 5.5 mm the screw needs. If it
    is rough, chase the first turn with a knife or lightly sand the ridge.'
  parts:
  - coupon_thread
  hardware: []
  tool: knife (optional)
- n: '4'
  text: 'Print the plate and the screw: PLA, 0.2 mm layers, no supports and no brim
    needed. The plate goes narrow camera face down, so the pocket opens upward and
    only the 45 deg flanks overhang. The screw goes knob-down with its V-groove on
    the bed.'
  parts:
  - plate
  - screw
  hardware: []
  tool: 3D printer
- n: '5'
  text: 'Fit the camera to the plate: lay the camera with its base facing you, set
    the plate on it with the wide 38 mm face pointing away, drop the screw into the
    pocket knob-up, and turn it with the edge of a coin seated in the V-groove until
    the camera''s base is snug against the plate. Snug only - it is a plastic thread.'
  parts:
  - plate
  - screw
  hardware: []
  tool: coin
- n: '6'
  text: 'Mount: flip the assembly, open the clamp''s knob, drop the plate''s wide
    face into the jaws and tighten. It should pull down flat and stay put.'
  parts:
  - plate
  hardware: []
  tool: null
- n: '7'
  text: 'Optional metal thread: the salvaged bolt is interchangeable - its 15 mm head
    fits the same pocket and its 10 mm shank gives the same 5.5 mm protrusion. Its
    head sits flush so there is nothing to grip; nip it round with needle-nose pliers,
    or rest the plate face-down on a rubber mat so the head bites while you turn the
    camera onto the stud.'
  parts:
  - plate
  hardware:
  - bolt1
  tool: needle-nose pliers
