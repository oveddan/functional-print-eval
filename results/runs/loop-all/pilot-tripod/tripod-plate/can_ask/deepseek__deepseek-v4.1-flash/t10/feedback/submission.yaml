  clear_hole_d:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: 1/4-20 is 6.35; the extra lets the screw self-align with the camera's socket
  coupon_knob_d:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: bigger knob on the thread coupon for hand testing
  coupon_knob_h:
    value: 6.0
    unit: mm
    kind: design
    source: design
    note: thread coupon knob height
  coupon_len:
    value: 22.0
    unit: mm
    kind: design
    source: design
    note: long enough to carry the full pocket with 2.75 mm end walls
  engagement:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: protrusion above the camera face = pocket_depth + stud_len - plate_t; standard
      tripod screw figure
  groove_d:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: V-groove depth; half the opening width gives 45 deg walls that print without
      support
  groove_w:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: coin/screwdriver V-groove opening across the knob's outer face
  knob_d:
    value: 16.0
    unit: mm
    kind: design
    source: design
    note: fits the 16.5 pocket
  knob_h:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: equals the pocket depth so the knob sits flush
  plate_len:
    value: 38.0
    unit: mm
    kind: design
    source: design
    note: short enough to drop into any clamp that takes a 38 mm plate; lengthen if
      the clamp's opening is longer
  plate_t:
    value: 9.5
    unit: mm
    kind: design
    source: design
    note: 5 mm pocket for the bolt head plus 4.5 mm of material over it
  plate_width:
    value: 38.0
    unit: mm
    kind: world
    source: measured
    note: width of plate the borrowed clamp takes, measured at the clamp
  pocket_d:
    value: 16.5
    unit: mm
    kind: design
    source: design
    note: 15 mm bolt head plus 1.5 mm total clearance
  pocket_depth:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: equals the bolt head height so the head sits flush with the clamp face
  stud_len:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: matched to the salvaged bolt's shank so both screws give the same protrusion
  thread_depth:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: effective thread height from crest to the core; shallower than the 0.69
      standard so a printed thread does not bind
  thread_od:
    value: 6.2
    unit: mm
    kind: design
    source: design
    note: printed 0.15 under the 6.35 nominal so it starts easily
  thread_od_nominal:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4 inch major diameter of the camera thread
  thread_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 UNC, from the pitch table
  thread_tube_r:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: radius of the round profile swept along the helix; round cross-sections
      print and slice far more reliably than a sharp V
parts:
- id: plate
  role: final
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    W = p.plate_width          #\
    \ 38 at the clamp face (top of the print)\n    L = p.plate_len            # 38\n\
    \    T = p.plate_t              # 9.5\n    hw_clamp = W / 2.0         # 19\n \
    \   hw_cam = hw_clamp - T      # 9.5  (45 deg flanks)\n\n    prof = (\n      \
    \  cq.Workplane(\"XZ\")\n        .polyline(\n            [(-hw_cam, 0.0), (hw_cam,\
    \ 0.0), (hw_clamp, T), (-hw_clamp, T)]\n        )\n        .close()\n    )\n \
    \   body = prof.extrude(L, both=True)\n\n    zf = T - p.pocket_depth         \
    \ # 4.5: pocket floor, measured from the camera face\n    # through hole, from\
    \ the bed up to the pocket floor - ends exactly where the pocket starts\n    body\
    \ = body.cut(\n        cq.Workplane(\"XY\")\n        .workplane(offset=-1.0)\n\
    \        .circle(p.clear_hole_d / 2.0)\n        .extrude(zf + 1.0)\n    )\n  \
    \  # pocket, opening upward so nothing is bridged\n    body = body.cut(\n    \
    \    cq.Workplane(\"XY\")\n        .workplane(offset=zf)\n        .circle(p.pocket_d\
    \ / 2.0)\n        .extrude(T - zf + 1.0)\n    )\n    return body"
  print_orientation: narrow camera face (19 x 38 mm) on the bed, z = 0 is that face;
    the part widens upward at 45 deg to the 38 x 38 mm clamp face and the pocket opens
    upward, so there is no bridge anywhere - only a print-clean 45 deg overhang on
    the flanks
  use_orientation: wide 38 mm face down into the clamp, the 19 x 38 mm camera face
    up against the camera's base
- id: screw
  role: final
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    r_major = p.thread_od / 2.0\n\
    \    core_r = r_major - p.thread_depth\n    tube_r = p.thread_tube_r\n    r_ctr\
    \ = r_major - tube_r\n    kh = p.knob_h\n    L = p.stud_len\n    z0 = kh + 0.6\
    \                 # thread starts just above the knob\n    z1 = kh + L - 1.5 \
    \            # smooth lead-in left at the tip\n\n    s = cq.Workplane(\"XY\").circle(p.knob_d\
    \ / 2.0).extrude(kh)\n\n    # V-groove drive: 45 deg walls, apex up, opens on\
    \ the bed face - self supporting\n    s = s.cut(\n        cq.Workplane(\"YZ\"\
    )\n        .polyline(\n            [\n                (-p.groove_w / 2.0, 0.0),\n\
    \                (p.groove_w / 2.0, 0.0),\n                (0.0, p.groove_d),\n\
    \            ]\n        )\n        .close()\n        .extrude(p.knob_d + 6.0,\
    \ both=True)\n    )\n\n    # stud core\n    s = s.union(cq.Workplane(\"XY\").workplane(offset=kh).circle(core_r).extrude(L))\n\
    \n    # rounded thread: a tube swept along the helix (round profile -> no frame\
    \ ambiguity,\n    # no thin flange, slices as solid geometry)\n    helix = cq.Wire.makeHelix(\n\
    \        pitch=p.thread_pitch, height=z1 - z0, radius=r_ctr, center=(0.0, 0.0,\
    \ z0)\n    )\n    prof = cq.Workplane(\"XZ\").moveTo(r_ctr, z0).circle(tube_r)\n\
    \    s = s.union(prof.sweep(helix, isFrenet=True))\n\n    # small chamfer on the\
    \ stud tip\n    tip = cq.Solid.makeCone(\n        core_r, 0.1, 0.6, cq.Vector(0.0,\
    \ 0.0, kh + L - 0.6), cq.Vector(0.0, 0.0, 1.0)\n    )\n    s = s.cut(cq.Workplane(obj=tip))\n\
    \    return s"
  print_orientation: knob's outer face (the face with the V-groove) on the bed, 1/4-20
    stud pointing up; V-groove walls are 45 deg and the rounded thread self-supports,
    so no supports needed
  use_orientation: knob down inside the plate's pocket with its V-groove facing the
    clamp, 1/4-20 stud up into the camera's socket
- id: coupon_wedge
  role: coupon
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    W = p.plate_width\n    T = p.plate_t\n\
    \    hw_clamp = W / 2.0\n    hw_cam = hw_clamp - T\n\n    prof = (\n        cq.Workplane(\"\
    XZ\")\n        .polyline(\n            [(-hw_cam, 0.0), (hw_cam, 0.0), (hw_clamp,\
    \ T), (-hw_clamp, T)]\n        )\n        .close()\n    )\n    body = prof.extrude(p.coupon_len,\
    \ both=True)\n\n    zf = T - p.pocket_depth\n    body = body.cut(\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=-1.0)\n        .circle(p.clear_hole_d / 2.0)\n\
    \        .extrude(zf + 1.0)\n    )\n    body = body.cut(\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=zf)\n        .circle(p.pocket_d / 2.0)\n    \
    \    .extrude(T - zf + 1.0)\n    )\n    return body"
  print_orientation: 'narrow camera face on the bed, same as the plate: pocket opens
    upward, nothing bridged'
  use_orientation: same as the plate but only 22 mm long - a slice of the plate to
    test the clamp fit and the bolt head pocket
- id: coupon_thread
  role: coupon
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    r_major = p.thread_od / 2.0\n\
    \    core_r = r_major - p.thread_depth\n    tube_r = p.thread_tube_r\n    r_ctr\
    \ = r_major - tube_r\n    kh = p.coupon_knob_h\n    L = p.stud_len\n    z0 = kh\
    \ + 0.6\n    z1 = kh + L - 1.5\n\n    s = cq.Workplane(\"XY\").circle(p.coupon_knob_d\
    \ / 2.0).extrude(kh)\n\n    s = s.cut(\n        cq.Workplane(\"YZ\")\n       \
    \ .polyline(\n            [\n                (-p.groove_w / 2.0, 0.0),\n     \
    \           (p.groove_w / 2.0, 0.0),\n                (0.0, p.groove_d),\n   \
    \         ]\n        )\n        .close()\n        .extrude(p.coupon_knob_d + 6.0,\
    \ both=True)\n    )\n\n    s = s.union(cq.Workplane(\"XY\").workplane(offset=kh).circle(core_r).extrude(L))\n\
    \n    helix = cq.Wire.makeHelix(\n        pitch=p.thread_pitch, height=z1 - z0,\
    \ radius=r_ctr, center=(0.0, 0.0, z0)\n    )\n    prof = cq.Workplane(\"XZ\").moveTo(r_ctr,\
    \ z0).circle(tube_r)\n    s = s.union(prof.sweep(helix, isFrenet=True))\n\n  \
    \  tip = cq.Solid.makeCone(\n        core_r, 0.1, 0.6, cq.Vector(0.0, 0.0, kh\
    \ + L - 0.6), cq.Vector(0.0, 0.0, 1.0)\n    )\n    s = s.cut(cq.Workplane(obj=tip))\n\
    \    return s"
  print_orientation: knob's outer face on the bed, 1/4-20 stud pointing up; V-groove
    walls 45 deg, rounded thread self-supports
  use_orientation: hand test piece - screw the rounded 1/4-20 stud into the camera's
    socket to check fit and engagement depth
