task: tripod-plate
note: 'Same design, one real change: the plate now prints camera-face-down instead
  of clamp-face-down.


  Why: your report of "loose loops and tangles around the hole, hole partly closed"
  is the plate''s pocket roof failing to bridge. In the old orientation the 17.5 mm
  pocket was a void opening downward, so the 5.4 mm-thick roof above it had to be
  printed across open air, with the 6.9 mm screw hole cutting an unsupported inner
  edge into that bridge. Flipped over, the pocket is an ordinary recess opening upward
  - its floor is laid down on solid material, and the screw hole is a vertical hole
  running from the bed upward, so there is no bridging anywhere in the part and the
  hole can''t close over. The clamping geometry, pocket size and thread protrusion
  are all untouched, and the camera face gets a flat bed finish as a bonus.


  Confirmed against your test print and carried through unchanged: the dovetail cross-section
  fits your friend''s clamp, and the salvaged bolt''s 15 x 5 mm head drops into the
  17.5 mm pocket. What I still could not get is the clamp''s channel depth (the plate
  thickness is an assumed 9.0 mm) and the clamp''s actual jaw angle (assumed 45 deg)
  - the fit_gauge still brackets the width for you if you ever want to check it.


  The thumbscrew is unchanged; it printed knob-down on the bed, which needs no bridging
  at all. Remember it is the optional part - the salvaged metal 1/4"-20 bolt is the
  better camera screw, and the printed one is interchangeable with it in the same
  pocket.'
questions:
- text: Did the flipped plate print with a clean, open screw hole and a pocket floor
    with no loose strands? If any strands remain, tell me what the slicer preview
    shows around the hole.
  answer: null
- text: Is the clamp's channel depth (channel floor to the top of the jaw tips) something
    you can measure now? It is the only number still assumed - the plate's 9.0 mm
    thickness.
  answer: null
- text: Does the printed thread_gauge stud run into the camera socket by hand without
    binding?
  answer: null
- text: Is the salvaged bolt's head a knurled knob you can turn with your fingers,
    or a hex head needing a spanner?
  answer: null
