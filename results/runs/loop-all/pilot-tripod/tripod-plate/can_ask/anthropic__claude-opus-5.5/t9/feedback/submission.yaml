task: tripod-plate
note: 'Revision 2 changes only the roof over the head recess: it now prints as a stepped
  bridge to stop the loose loops in the slot. Nothing else has changed.'
questions: []
params:
  clamp_w:
    value: 38
    unit: mm
    kind: world
    source: asked
    note: tripod takes a 38 mm plate (Arca-Swiss width)
  bevel_angle:
    value: 45
    unit: deg
    kind: world
    source: guessed
    note: confirmed by the first plate fitting the clamp
  bevel_drop:
    value: 4
    unit: mm
    kind: world
    source: guessed
    note: confirmed by the first plate fitting the clamp
  edge_flat_h:
    value: 2
    unit: mm
    kind: world
    source: guessed
    note: ''
  plate_t:
    value: 10
    unit: mm
    kind: design
    source: design
    note: ''
  plate_l:
    value: 60
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_l:
    value: 15
    unit: mm
    kind: design
    source: design
    note: ''
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bolt_len:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bolt_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_clear:
    value: 6.9
    unit: mm
    kind: design
    source: design
    note: ''
  head_clear:
    value: 16
    unit: mm
    kind: design
    source: design
    note: ''
  cb_depth:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: ''
