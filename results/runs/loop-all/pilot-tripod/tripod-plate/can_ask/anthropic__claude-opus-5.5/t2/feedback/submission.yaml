task: tripod-plate
note: 'Rev 2: the only change is the roof over the bolt-head recess, which failed
  on the first print. It''s now a two-layer stepped bridge, so no bridge strand ends
  at the slot. The clamp fit and head recess are unchanged, since both worked. It''s
  still a temporary PLA plate, so keep heavy cameras and heat away from it.'
