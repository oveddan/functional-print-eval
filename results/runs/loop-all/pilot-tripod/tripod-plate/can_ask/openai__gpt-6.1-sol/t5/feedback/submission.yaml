task: tripod-plate
note: Unchanged unloaded fit-test geometry. No fit results were available, so there
  is no basis for adjusting dimensions or approving camera use. Do not mount a camera
  on this print. A nominal 38 mm clamp width does not verify dovetail compatibility.
  Use the metal salvaged bolt, never a printed camera screw, in any later validated
  design. Obtain the correct manufacturer's plate if fit and socket engagement cannot
  be verified.
questions:
- text: Did both clamp jaws seat on the angled flanks, with tightening travel remaining
    and no rocking or sliding?
  answer: null
- text: Did the metal bolt head seat flat, clear the pocket and remain accessible?
  answer: null
- text: What are the head model, jaw profile, camera socket usable depth and camera/lens
    load?
  answer: null
