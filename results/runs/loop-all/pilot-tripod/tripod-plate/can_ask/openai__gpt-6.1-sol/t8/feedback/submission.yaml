task: tripod-plate
note: 'Unchanged measurement-only design: no usable quick-release plate is included.
  The previous prints have no reported fit results, so there is no evidence supporting
  a dimensional revision. Reprinting is optional and will not resolve the missing
  clamp geometry or camera screw-depth specification. Neither coupon may support a
  camera. Use the correct replacement plate until the clamp interface and safe metal-screw
  engagement are established.'
questions:
- text: What is the tripod head or original quick-release plate model?
  answer: null
- text: What are the clamp cross-section, jaw height, contact length, locking mechanism,
    and retention-stop geometry?
  answer: null
- text: What camera and lens will be supported, and what is their combined mass?
  answer: null
- text: What screw insertion depth does the camera manufacturer permit?
  answer: null
- text: Is the webcam bolt threaded continuously over the length needed for the eventual
    plate?
  answer: null
- text: Do the printed width and bolt gauges match their intended dimensions and fit
    freely?
  answer: No usable inspection or fit results supplied.
