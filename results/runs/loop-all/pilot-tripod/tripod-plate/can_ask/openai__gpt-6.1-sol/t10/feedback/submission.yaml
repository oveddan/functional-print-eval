parts:
- id: width_and_hole_coupon
  role: coupon
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    body = cq.Workplane('XY').box(p.reported_plate_width,\
    \ p.coupon_length, p.coupon_thickness, centered=(True, True, False))\n    return\
    \ body.faces('>Z').workplane().hole(p.camera_thread_major_d + p.bolt_hole_diametral_allowance)\n"
  print_orientation: Broad rectangular face on bed, z=0. Print flat without supports.
  use_orientation: Loose, non-load-bearing sizing template only; 38 mm dimension across
    the jaws. No retaining dovetail or latch features.
hardware:
- id: webcam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints: []
criteria:
- id: width_reference
  part: width_and_hole_coupon
  feature: Outside width
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - reported_plate_width
  check:
    method: measure
    ref: null
    description: Measure printed width and compare loosely with the empty clamp. A
      width match does not establish retention. Previous print result is unknown.
- id: bolt_clearance
  part: width_and_hole_coupon
  feature: Central 6.8 mm unthreaded hole
  relation: clears
  hardware: webcam_bolt
  clearance_mm: 0.225
  params:
  - camera_thread_major_d
  - bolt_hole_diametral_allowance
  check:
    method: coupon
    ref: width_and_hole_coupon
    description: Away from the camera, check that the bolt passes freely. This does
      not verify camera engagement, head capture, or mounting safety. Previous result
      is unknown.
manual:
- n: '1'
  text: 'Reprinting is optional: geometry is unchanged because no fit observations
    are available. This print cannot support a camera.'
  parts:
  - width_and_hole_coupon
  hardware: []
  tool: null
- n: '2'
  text: Print flat at 0.2 mm layers, three or more walls, solid infill, without supports.
  parts:
  - width_and_hole_coupon
  hardware: []
  tool: null
- n: '3'
  text: Measure the coupon and compare it loosely with the empty clamp. Do not tighten
    it as a working plate. Obtain the head model or actual retaining-profile dimensions
    before designing a functional plate.
  parts:
  - width_and_hole_coupon
  hardware: []
  tool: Calipers or ruler
- n: '4'
  text: 'Away from the camera, check that webcam_bolt passes through the hole. Do
    not screw the coupon/bolt combination into the camera: about 8 mm of thread would
    protrude, and safe socket depth is unknown.'
  parts:
  - width_and_hole_coupon
  hardware:
  - webcam_bolt
  tool: null
- n: '5'
  text: Use the original or manufacturer-compatible plate until clamp retention, exact
    bolt dimensions, allowable camera screw engagement, and load are established.
    Do not print a camera screw or treat this coupon as a temporary mount.
  parts: []
  hardware: []
  tool: null
