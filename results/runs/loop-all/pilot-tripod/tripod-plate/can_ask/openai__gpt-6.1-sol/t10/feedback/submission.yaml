task: tripod-plate
note: 'Unchanged sizing coupon only. No usable fit results were supplied, so there
  is no basis to adjust dimensions or release a load-bearing plate. This is NOT a
  quick-release plate: never attach a camera to it. Reprinting cannot establish the
  missing clamp profile or camera socket depth. Use a manufacturer-compatible replacement
  plate until these are verified. Use a metal camera screw, not a printed screw.'
questions:
- text: 'Tripod head make/model and retaining profile: seating width, top opening,
    lip height, plate length, and latch/safety-stop requirements?'
  answer: null
- text: Camera model, lens/load, and manufacturer's permitted screw engagement or
    usable socket depth?
  answer: null
- text: Did the printed coupon fit or did the bolt pass freely?
  answer: No usable observations available; fit remains unverified.
params:
  reported_plate_width:
    value: 38
    unit: mm
    kind: world
    source: measured
    note: Reported width only; jaw geometry and measurement location unverified.
  coupon_length:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_thickness:
    value: 2
    unit: mm
    kind: design
    source: design
    note: ''
  camera_thread_major_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
