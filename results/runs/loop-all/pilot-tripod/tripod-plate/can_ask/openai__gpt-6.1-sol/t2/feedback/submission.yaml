task: tripod-plate
note: 'Unchanged unloaded fit coupon. No fit feedback was available, so there is no
  basis to adjust it or approve camera use. This is NOT a camera-supporting quick-release
  plate: its profile dimensions are arbitrary examples, not measured from your tripod.
  Reprinting will not resolve the missing measurements. Do not attach a camera. A
  final plate requires actual clamp dimensions, safety-stop geometry, camera load
  and usable socket depth. Use a metal camera screw, not a printed screw; obtain the
  correct commercial plate for immediate camera use.'
questions:
- text: What are the actual clamp bottom width, top width, lip height, usable length,
    adjustment range and safety-stop geometry?
  answer: null
- text: Does the coupon seat flat, contact both angled jaws, and resist lifting when
    lightly clamped?
  answer: No usable fit feedback available.
- text: What is the camera socket usable depth, does the webcam bolt thread smoothly,
    and what is the camera/lens weight?
  answer: Socket identified as 1/4-20; other information not established.
params:
  gauge_bottom_width:
    value: 40
    unit: mm
    kind: world
    source: guessed
    note: Arbitrary example; actual tripod dimension unknown.
  gauge_top_width:
    value: 34
    unit: mm
    kind: world
    source: guessed
    note: Arbitrary example; actual jaw angle unknown.
  gauge_height:
    value: 6
    unit: mm
    kind: world
    source: guessed
    note: Arbitrary example; actual lip height unknown.
  gauge_length:
    value: 20
    unit: mm
    kind: design
    source: design
    note: Short unloaded profile sample, not a full-length plate.
  grip_width:
    value: 12
    unit: mm
    kind: design
    source: design
    note: ''
  grip_length:
    value: 12
    unit: mm
    kind: design
    source: design
    note: ''
  grip_height:
    value: 12
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: unloaded_profile_coupon
  role: coupon
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    if not (p.gauge_bottom_width > p.gauge_top_width > p.grip_width\
    \ > 0):\n        raise ValueError('Require bottom width > top width > grip width\
    \ > 0')\n    if not (p.gauge_length > p.grip_length > 0 and p.gauge_height > 0\
    \ and p.grip_height > 0):\n        raise ValueError('Invalid dimensions')\n  \
    \  wedge = (cq.Workplane('XY').rect(p.gauge_bottom_width, p.gauge_length)\n  \
    \      .workplane(offset=p.gauge_height).rect(p.gauge_top_width, p.gauge_length)\n\
    \        .loft(combine=True, ruled=True))\n    grip = (cq.Workplane('XY').workplane(offset=p.gauge_height)\n\
    \        .rect(p.grip_width, p.grip_length).extrude(p.grip_height))\n    return\
    \ wedge.union(grip)\n"
  print_orientation: Wide base at z=0 on bed; grip upward. No supports.
  use_orientation: Unloaded clamp fit checking only; wide face toward pocket floor
    and grip upward. Never attach a camera.
hardware: []
joints: []
criteria:
- id: profile_trial
  part: unloaded_profile_coupon
  feature: Tapered sides and flat bottom
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - gauge_bottom_width
  - gauge_top_width
  - gauge_height
  - gauge_length
  check:
    method: coupon
    ref: unloaded_profile_coupon
    description: Not yet verified. Only attempt if visually compatible. Must enter
      without force and seat without rocking while leaving normal jaw adjustment.
      Check contact, gaps and lift-out. A snug short coupon does not qualify a full
      plate or establish load capacity.
manual:
- n: '1'
  text: This is the same coupon as before. If the previous print is intact, reuse
    it rather than reprint. Do not attach a camera. The default profile is arbitrary,
    not a recommended replacement size.
  parts:
  - unloaded_profile_coupon
  hardware: []
  tool: null
- n: '2'
  text: If reprinting, print wide face down in PLA with 0.2 mm layers, four walls,
    30% infill and no supports. Remove any brim or bottom-edge flare without changing
    the intended taper.
  parts:
  - unloaded_profile_coupon
  hardware: []
  tool: Bambu Lab X1C
- n: '3'
  text: With the tripod empty and stable, open the clamp and compare before insertion.
    Do not force the coupon, defeat a safety stop or overtighten against PLA. Stop
    if visibly mismatched.
  parts:
  - unloaded_profile_coupon
  hardware: []
  tool: null
- n: '4'
  text: If it enters freely, lightly close the jaws. Check floor and taper contact,
    rocking and lift-out. Record actual dimensions and adjustment range. Loosen and
    remove by the grip. If you cannot assess the fit, leave it unverified and do not
    proceed to camera use.
  parts:
  - unloaded_profile_coupon
  hardware: []
  tool: null
- n: '5'
  text: There is no separate printed clamp or bolt head in this submission. The existing
    tripod clamp is only used for unloaded checking. Before designing a real replacement,
    obtain full clamp and safety-stop dimensions, camera/lens load and usable socket
    depth. Measure the metal bolt accurately; do not print a load-bearing camera screw.
  parts: []
  hardware: []
  tool: null
- n: '6'
  text: In a future plate, bolt protrusion equals under-head bolt length minus thickness
    between its head seating surface and the camera underside. It must provide adequate
    thread engagement without bottoming out. Do not tighten an uncertain-length bolt
    into the camera. Use the correct original or compatible commercial plate until
    a replacement is properly designed and verified. This coupon must never support
    a camera.
  parts: []
  hardware: []
  tool: null
