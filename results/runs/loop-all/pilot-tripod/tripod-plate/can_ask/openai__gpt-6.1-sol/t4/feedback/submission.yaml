task: tripod-plate
note: 'Revised print orientation: camera-side deck on bed, bolt-head pocket open upward.
  This removes the failed pocket-roof bridge without changing the intended fit geometry.
  UNLOADED FIT TEST ONLY. Clamp profile, bolt seating/drive access, and safe camera
  thread engagement remain unverified. Do not attach a camera. No printed screw is
  provided.'
questions:
- text: What are the jaw gripping height, top-lip gap, usable jaw length, and retaining-stop
    arrangement?
  answer: null
- text: What is the usable camera socket depth, and is the salvaged bolt confirmed
    to have matching threads?
  answer: null
- text: Does the bolt head have a flat bearing face and an accessible drive?
  answer: null
