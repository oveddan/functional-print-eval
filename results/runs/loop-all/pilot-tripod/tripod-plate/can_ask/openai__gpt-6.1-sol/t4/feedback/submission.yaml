parts:
- id: unloaded_plate_coupon
  role: coupon
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    w = p.plate_nominal_width - p.base_width_allowance\n \
    \   t = w - 2*p.trial_side_inset\n    h = p.trial_dovetail_height\n    H = p.coupon_total_height\n\
    \    L = p.coupon_length\n    # Camera deck at z=0; wide clamp-side face at z=H.\n\
    \    # The dovetail expands outward at 45 degrees near the top.\n    profile =\
    \ [(-t/2,0),(t/2,0),(t/2,H-h),(w/2,H),(-w/2,H),(-t/2,H-h)]\n    body = cq.Workplane('XZ').polyline(profile).close().extrude(L/2,\
    \ both=True)\n    bore = cq.Workplane('XY').circle((p.camera_thread_d+p.bolt_hole_diametral_clearance)/2).extrude(H)\n\
    \    pocket = cq.Workplane('XY').workplane(offset=H-p.head_pocket_depth).circle((p.bolt_head_d+p.head_pocket_diametral_clearance)/2).extrude(p.head_pocket_depth)\n\
    \    return body.cut(bore).cut(pocket)\n"
  print_orientation: Flat narrow camera-side deck (29.8 x 60 mm) on bed at z=0. Wide
    dovetail face and large pocket opening point upward at z=12. Do not auto-flip
    onto the wider face.
  use_orientation: 'For unloaded clamp testing only, flip the printed part over: wide
    dovetail face down into clamp, narrow deck up. Long Y axis follows jaws.'
hardware:
- id: camera_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints: []
criteria:
- id: print_quality
  part: unloaded_plate_coupon
  feature: Upward-open bolt pocket and central through bore
  relation: clears
  hardware: camera_bolt
  clearance_mm: null
  params:
  - camera_thread_d
  - bolt_hole_diametral_clearance
  - head_pocket_depth
  check:
    method: coupon
    ref: unloaded_plate_coupon
    description: Confirm large pocket opens upward during printing, with no roof to
      bridge. Check that the small through bore is unobstructed and the pocket floor
      is solid rather than loose strands.
- id: trial_jaw_fit
  part: unloaded_plate_coupon
  feature: Trial inclined clamping faces
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - plate_nominal_width
  - base_width_allowance
  - trial_dovetail_height
  - trial_side_inset
  - jaw_height
  - jaw_top_gap
  - jaw_length
  check:
    method: coupon
    ref: unloaded_plate_coupon
    description: 'Unloaded only: check drop-in access, full-face contact, adjustment
      remaining, and no rocking, bottoming, or deck interference. Clamp result from
      first print was not reported; treat fit as unknown. Passing does not prove retention
      or load capacity.'
- id: bolt_head_fit
  part: unloaded_plate_coupon
  feature: 20 mm pocket, 5 mm deep, and 6.8 mm bore
  relation: contains
  hardware: camera_bolt
  clearance_mm: null
  params:
  - bolt_head_d
  - bolt_head_h
  - head_pocket_diametral_clearance
  - head_pocket_depth
  - camera_thread_d
  - bolt_hole_diametral_clearance
  check:
    method: coupon
    ref: unloaded_plate_coupon
    description: Off tripod and away from camera, check free shank passage, flat head
      seating, no head protrusion beyond wide face, and intended-driver access. First-print
      head fit was not reported and remains unknown.
- id: projection_check
  part: unloaded_plate_coupon
  feature: Bolt projection above camera-side deck
  relation: clears
  hardware: camera_bolt
  clearance_mm: null
  params:
  - bolt_underhead_length
  - coupon_total_height
  - head_pocket_depth
  - camera_socket_depth
  check:
    method: measure
    ref: null
    description: Measure actual projection on bench; nominal is 3 mm. Usable camera
      thread depth and required engagement remain unknown. Do not install in camera;
      this safety check remains unresolved.
manual:
- n: '1'
  text: Discard the failed coupon as a fit reference around the damaged pocket. This
    replacement is still an unloaded dimensional test, not a camera-supporting plate.
  parts:
  - unloaded_plate_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Slice at 0.2 mm layers with 5 walls and 50% infill. Keep the supplied orientation:
    narrow flat deck on bed, large pocket opening UP. Disable supports; no pocket-roof
    bridge is present. Preview layers to confirm the pocket stays open upward. The
    outer dovetail grows outward at 45 degrees.'
  parts:
  - unloaded_plate_coupon
  hardware: []
  tool: Slicer
- n: '3'
  text: Print and let cool. Remove any brim, bore strings, and bed-edge flare without
    changing the sloped clamping faces. Check the pocket floor is sound. If the through
    hole is obstructed or the floor is defective, stop and report the defect rather
    than forcing the bolt.
  parts:
  - unloaded_plate_coupon
  hardware: []
  tool: Deburring tool
- n: '4'
  text: On the bench, insert the metal webcam bolt through the large pocket toward
    the narrow deck. Verify free passage, flat bearing contact, head containment,
    and access with its original drive. Measure actual tip projection above the deck;
    nominally 3 mm. Do not thread it into the camera. Remove the bolt before clamp
    testing.
  parts:
  - unloaded_plate_coupon
  hardware:
  - camera_bolt
  tool: Calipers and original bolt driver if applicable
- n: '5'
  text: With no camera or bolt attached, flip the coupon so its wide face is down.
    Gently drop into the open tripod jaws, with the long axis along them. Tighten
    only by hand. Stop for rocking, edge-only contact, bottoming, deck interference,
    or excessive force. Do not modify or overtighten the borrowed tripod.
  parts:
  - unloaded_plate_coupon
  hardware: []
  tool: null
- n: '6'
  text: With hands ready to catch the unloaded coupon, gently check for lifting and
    sliding. Remove it afterward. Report clamp contact and bolt-head results if possible;
    neither is currently known. Even a successful fit does not establish safe camera
    support.
  parts:
  - unloaded_plate_coupon
  hardware: []
  tool: null
- n: '7'
  text: Do not attach a camera or ballast. A final load-bearing design requires the
    missing jaw geometry, stop arrangement, bolt details, and verified safe thread
    engagement. Until then, use a metal replacement plate matched to the tripod rather
    than this coupon.
  parts:
  - unloaded_plate_coupon
  hardware: []
  tool: null
