parts:
- id: qr-plate
  role: final
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    length = p.plate_length\n   \
    \ w_max = p.plate_width_max\n    w_min = p.plate_width_min\n    h = p.plate_height\n\
    \    \n    # Dovetail profile in X-Z plane:\n    # z = 0 is the bed (camera-mating\
    \ face)\n    # Profile rises with vertical walls, flares out at 45 deg to w_max,\n\
    \    # has a vertical flat, then bevels back in at 45 deg to w_min at z = h.\n\
    \    z_top_flat = p.dovetail_ridge_bottom_z - (w_max - w_min) / 2.0\n    z_slope1_top\
    \ = p.dovetail_ridge_bottom_z\n    z_ridge_top = p.dovetail_ridge_top_z\n    \n\
    \    pts = [\n        (-w_min / 2.0, 0.0),\n        (w_min / 2.0, 0.0),\n    \
    \    (w_min / 2.0, z_top_flat),\n        (w_max / 2.0, z_slope1_top),\n      \
    \  (w_max / 2.0, z_ridge_top),\n        (w_min / 2.0, h),\n        (-w_min / 2.0,\
    \ h),\n        (-w_max / 2.0, z_ridge_top),\n        (-w_max / 2.0, z_slope1_top),\n\
    \        (-w_min / 2.0, z_top_flat),\n    ]\n    \n    base = (\n        cq.Workplane(\"\
    XZ\")\n        .polyline(pts)\n        .close()\n        .extrude(length / 2.0,\
    \ both=True)\n    )\n    \n    # Through-slot for 1/4\"-20 bolt shank\n    slot_cut\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=-1.0)\n       \
    \ .rect(p.bolt_clearance_w, p.slot_length)\n        .extrude(h + 2.0)\n    )\n\
    \    base = base.cut(slot_cut)\n    \n    # Generous recessed pocket for 15 mm\
    \ bolt head on the bottom face (+Z in print frame)\n    pocket_bottom_z = h -\
    \ p.bolt_head_pocket_depth\n    pocket_cut = (\n        cq.Workplane(\"XY\")\n\
    \        .workplane(offset=pocket_bottom_z)\n        .rect(p.bolt_head_pocket_w,\
    \ p.bolt_head_pocket_l)\n        .extrude(p.bolt_head_pocket_depth + 2.0)\n  \
    \  )\n    base = base.cut(pocket_cut)\n    \n    return base\n"
  print_orientation: Camera-facing flat surface on the build bed (z = 0); all overhangs
    are 45 degrees or less, printing cleanly without supports.
  use_orientation: Flat face (z = 0) faces upward against the camera base; +z face
    with recessed pocket faces downward into the tripod clamp.
hardware:
- id: camera-bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera-mount-joint
  fastener: camera-bolt
  axis_origin:
  - 0.0
  - 0.0
  - 4.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: qr-plate
    feature: bolt_pocket
    role: head_seat
  - part: qr-plate
    feature: center_slot
    role: clearance
  nut: null
  external: Camera standard 1/4-20 threaded tripod socket
criteria:
- id: bolt-shank-clearance
  part: qr-plate
  feature: center_slot
  relation: clears
  hardware: camera-bolt
  clearance_mm: 1.15
  params:
  - bolt_thread_d
  - bolt_clearance_w
  check:
    method: measure
    ref: null
    description: Verify the 1/4-20 bolt shank slides freely through the center slot.
- id: bolt-head-pocket
  part: qr-plate
  feature: bolt_pocket
  relation: seats
  hardware: camera-bolt
  clearance_mm: 7.0
  params:
  - bolt_head_d
  - bolt_head_pocket_w
  - bolt_head_pocket_l
  - bolt_head_h
  - bolt_head_pocket_depth
  check:
    method: measure
    ref: null
    description: Verify the 15 mm bolt head fits easily in the widened pocket with
      ample finger clearance and sits 1.0 mm recessed below the bottom surface.
- id: dovetail-clamp-fit
  part: qr-plate
  feature: dovetail_rails
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - plate_width_max
  - plate_width_min
  - dovetail_angle
  check:
    method: template
    ref: null
    description: Confirm the 38 mm 45-degree dovetail drops in and clamps securely
      in the tripod head clamp.
manual:
- n: '1'
  text: Print the qr-plate in PLA with flat camera-facing surface on the bed (z =
    0) and at least 4-5 walls or 100% infill for solid strength. No supports are needed.
  parts:
  - qr-plate
  hardware: []
  tool: null
- n: '2'
  text: Insert the salvaged 1/4"-20 webcam mount bolt into the widened pocket on the
    bottom of the plate. Verify the 15 mm head drops in freely and sits 1 mm recessed
    below the bottom plane.
  parts:
  - qr-plate
  hardware:
  - camera-bolt
  tool: null
- n: '3'
  text: Thread the bolt into the camera's 1/4"-20 tripod socket and tighten it firmly
    against the bottom of the camera.
  parts:
  - qr-plate
  hardware:
  - camera-bolt
  tool: null
- n: '4'
  text: Open the tripod clamp jaws, drop the plate in from above, and tighten the
    clamp knob securely.
  parts:
  - qr-plate
  hardware: []
  tool: null
