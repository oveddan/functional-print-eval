task: tripod-plate
note: Revised quick-release plate with an expanded 22 x 30 x 6 mm pocket so the 15
  mm webcam bolt head fits with generous finger clearance and sits safely recessed.
questions:
- text: How hard would it be to 3D print the flat part?
  answer: Very easy. The quick-release plate is a 42 x 38 x 10 mm Arca-Swiss style
    dovetail block. Printing it with its flat camera face on the build plate requires
    zero supports because all dovetail angles are 45 degrees. On your Bambu Lab X1C,
    it prints in about 35-40 minutes at 0.2 mm layer height.
- text: How hard would it be to 3D print the part that screws in?
  answer: You should definitely NOT 3D print the screw. A 1/4"-20 plastic male thread
    printed in PLA with a 0.4 mm nozzle has weak layer adhesion and can easily shear
    off inside your camera's metal tripod socket, which is a nightmare to extract.
    Instead, use the salvaged 1/4"-20 webcam mount bolt (which has the exact matching
    standard camera thread, a 15 mm thumb head, and 10 mm length). The plate is specifically
    designed with a recessed pocket to seat this metal bolt flush so it won't interfere
    with the tripod clamp.
