task: nut-knob/M5
note: 'Revised retention. The nut no longer relies on a fixed press fit, because its
  size could not be measured or tested. The knob now has a slit collet sleeve: six
  fingers, 0.8 mm thick, standing 6 mm tall around the nut, with a flared mouth, and
  a 1.7 mm relief gap behind them so they can spring open. The sleeve is 7.60 mm across
  the flats as printed, i.e. smaller than any legal M5 nut (7.78-8.00), so every nut
  forces the fingers apart slightly; the fingers then press back on the nut''s six
  corners with ~2 N each. That gives (a) a hand press - about 12 N to push the nut
  in, no hammer, (b) retention when inverted: the spring grip is worth a few newtons
  of friction against a 0.01 N nut, and the nut cannot pass the 5.9 mm floor below
  it, and (c) torque: the fingertips are stiff in the tangential direction (about
  2 N.m to yield) so the nut keys against them and turns with the knob, no slipping,
  and the flared mouth lets the nut self-centre if a corner lands on a slit.


  Everything is inside the knob: the nut seats on the floor at z = 5.9 and its top
  face ends 1.4 mm below the rim, and the 5.5 mm clearance hole in that floor lets
  the M5 bolt come up from below, thread into the nut and leave through the open top.
  Prints flat, no supports, no bridging. Coupon A carries the same collet three times
  at 7.50 / 7.60 / 7.70 mm across the flats so the tightest one that still presses
  by hand can be chosen for the knob - a self-serve choice, no measuring or reporting
  needed. Default 7.60 sits in the middle of that range.'
questions:
- text: Why a collet instead of a plain hex pocket?
  answer: A rigid pocket only grips within about +-0.1 mm of the nut's size, and M5
    nuts run 7.78-8.00 mm across the flats. The 0.8 mm fingers bend elastically (under
    1% strain) so one printed sleeve grips any of them, and the same fingers take
    the turning load through their corners.
- text: Which way does the bolt pass through?
  answer: 'Assumed from below: the shank enters the 5.5 mm hole in the knob''s underside
    (the floor under the nut), threads into the nut, and the threaded tip comes out
    of the open top. The knob''s underside is flat - it does not seat a bolt head.'
- text: What if the nut is at the tight end of the range?
  answer: Press it into the 7.7 cup of coupon A first. If 7.7 presses comfortably
    by hand and holds when the coupon is inverted, set the knob's free_af to 7.7 and
    print. If even 7.5 is loose, that nut is undersized; report the across-flats and
    the sleeve can be closed up.
params:
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut, width across the flats; catalog 8.00 max, and the standard's
      lower limit is about 7.78. Not measurable here, so the collet is made compliant
      instead of sized.
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut height - the seated nut occupies this height above the
      floor.
  bolt_shank_d:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 nominal shank diameter.
  bolt_clear_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Clearance hole through the floor, 0.5 mm over the shank; much smaller than
      the nut, so the nut cannot pass through it.
  free_af:
    value: 7.6
    unit: mm
    kind: design
    source: design
    note: Width across flats of the collet sleeve as printed, i.e. the sleeve the
      nut has to spring open. Set from the coupon (7.50 / 7.60 / 7.70); 7.60 is the
      middle.
  finger_t:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: 'Radial thickness of each collet finger: thin enough to spring open for
      a big nut, thick enough to turn the nut without yielding.'
  knob_d:
    value: 30.0
    unit: mm
    kind: design
    source: asked
    note: User asked for about 30 mm across; this is the diameter at the un-grooved
      lobes.
  knob_h:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: Overall knob height. With the floor at 5.9 the seated nut's top face ends
      1.4 mm below the rim.
  floor_t:
    value: 5.9
    unit: mm
    kind: design
    source: design
    note: Height of the floor the nut seats on, and therefore the length of the collet
      fingers.
  funnel_z:
    value: 10.8
    unit: mm
    kind: design
    source: design
    note: Height where the fingers' straight inner wall ends and the flared mouth
      begins; just above the seated nut's top face (10.6).
  funnel_slope:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: 'Across-flats gained per mm of height in the flared mouth, about 27 degrees
      from vertical: printable, and wide enough at the rim for the nut''s corners
      to enter freely.'
  slit_w:
    value: 0.7
    unit: mm
    kind: design
    source: design
    note: Width of the six slits that separate the fingers, cut at the hexagon's flat
      midpoints so each finger carries a corner.
  gap_r:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: Inner radius of the knob's outer wall above the floor, i.e. how much relief
      space the fingers have to bend into.
  grip_flutes:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Number of vertical finger grooves around the rim.
  groove_r:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: Radius of the cutter forming each finger groove.
  groove_depth:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: Depth of each finger groove; cutter centre radius = knob_d/2 + groove_r
      - groove_depth.
  coupon_l:
    value: 66.0
    unit: mm
    kind: design
    source: design
    note: Coupon A length.
  coupon_w:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: Coupon A width.
  coupon_pitch:
    value: 22.0
    unit: mm
    kind: design
    source: design
    note: Spacing of the coupon's three test collets.
  coupon_cup_r:
    value: 9.0
    unit: mm
    kind: design
    source: design
    note: Outer radius of each coupon cup's wall.
  coupon_af_a:
    value: 7.5
    unit: mm
    kind: design
    source: design
    note: Across flats of coupon cup 1, the tightest (leftmost when printed).
  coupon_af_b:
    value: 7.6
    unit: mm
    kind: design
    source: design
    note: Across flats of coupon cup 2, the middle one; matches the knob's default
      free_af.
  coupon_af_c:
    value: 7.7
    unit: mm
    kind: design
    source: design
    note: Across flats of coupon cup 3, the loosest (rightmost when printed).
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef hex_pts(af, dx=0.0):\n    # regular hexagon by width across\
    \ flats, vertex on +X\n    R = af / (3 ** 0.5)\n    return [(dx + R * math.cos(math.radians(60\
    \ * i)),\n             R * math.sin(math.radians(60 * i))) for i in range(6)]\n\
    \ndef hex_solid(af, z0, z1, dx=0.0):\n    return (cq.Workplane(\"XY\").workplane(offset=z0)\n\
    \            .polyline(hex_pts(af, dx)).close()\n            .extrude(z1 - z0))\n\
    \ndef hex_funnel(af, z0, zs, zt, slope, dx=0.0):\n    # hex prism, straight from\
    \ z0 to zs, then flared outward up to zt\n    straight = hex_solid(af, z0, zs,\
    \ dx)\n    flare = (cq.Workplane(\"XY\").workplane(offset=zs)\n             .polyline(hex_pts(af,\
    \ dx)).close()\n             .workplane(offset=zt - zs)\n             .polyline(hex_pts(af\
    \ + slope * (zt - zs), dx)).close()\n             .loft())\n    return straight.union(flare)\n\
    \ndef build(p):\n    t = p.finger_t\n    z0 = p.floor_t          # pocket floor,\
    \ and base of the fingers\n    zs = p.funnel_z         # end of the straight walls\n\
    \    zt = p.knob_h + 0.3     # built a little past the top face\n\n    # outer\
    \ wall and floor slab\n    body = cq.Workplane(\"XY\").circle(p.knob_d / 2).extrude(zt)\n\
    \    body = body.cut(cq.Workplane(\"XY\").workplane(offset=z0)\n             \
    \       .circle(p.gap_r).extrude(zt - z0))\n\n    # collet sleeve: hex ring with\
    \ a flared mouth\n    sleeve = (hex_funnel(p.free_af + 2 * t, z0, zs, zt, p.funnel_slope)\n\
    \              .cut(hex_funnel(p.free_af, z0, zs, zt, p.funnel_slope)))\n    body\
    \ = body.union(sleeve)\n\n    # six slits at the flat midpoints -> six springy\
    \ fingers\n    for i in range(6):\n        a = 30 + 60 * i\n        slit = (cq.Workplane(\"\
    XY\")\n                .box(p.gap_r - 0.2, p.slit_w, zt - z0,\n              \
    \       centered=(False, True, False))\n                .translate((0, 0, z0))\n\
    \                .rotate((0, 0, 0), (0, 0, 1), a))\n        body = body.cut(slit)\n\
    \n    # M5 clearance hole through the floor\n    body = body.cut(cq.Workplane(\"\
    XY\").circle(p.bolt_clear_d / 2).extrude(zt))\n\n    # finger grooves around the\
    \ rim\n    ctr = p.knob_d / 2 + p.groove_r - p.groove_depth\n    for i in range(int(p.grip_flutes)):\n\
    \        a = 2 * math.pi * i / p.grip_flutes\n        body = body.cut(cq.Workplane(\"\
    XY\")\n                        .moveTo(ctr * math.cos(a), ctr * math.sin(a))\n\
    \                        .circle(p.groove_r)\n                        .extrude(p.knob_h))\n\
    \    return body\n"
  print_orientation: Flat bottom face on the bed, knob axis vertical (Z). The collet
    fingers stand straight up, their flared mouths open upward, and the relief gap
    behind them is an open groove - no overhangs past 30 degrees, nothing to bridge.
  use_orientation: Axis vertical, collet opening up. The nut presses down into the
    fingers from the top face; the M5 bolt comes up from below through the clearance
    hole and threads into the nut.
- id: coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef hex_pts(af, dx=0.0):\n    R = af / (3 ** 0.5)\n    return\
    \ [(dx + R * math.cos(math.radians(60 * i)),\n             R * math.sin(math.radians(60\
    \ * i))) for i in range(6)]\n\ndef hex_solid(af, z0, z1, dx=0.0):\n    return\
    \ (cq.Workplane(\"XY\").workplane(offset=z0)\n            .polyline(hex_pts(af,\
    \ dx)).close()\n            .extrude(z1 - z0))\n\ndef hex_funnel(af, z0, zs, zt,\
    \ slope, dx=0.0):\n    straight = hex_solid(af, z0, zs, dx)\n    flare = (cq.Workplane(\"\
    XY\").workplane(offset=zs)\n             .polyline(hex_pts(af, dx)).close()\n\
    \             .workplane(offset=zt - zs)\n             .polyline(hex_pts(af +\
    \ slope * (zt - zs), dx)).close()\n             .loft())\n    return straight.union(flare)\n\
    \ndef build(p):\n    z0 = p.floor_t\n    zs = p.funnel_z\n    zt = p.knob_h +\
    \ 0.3\n    afs = [p.coupon_af_a, p.coupon_af_b, p.coupon_af_c]\n\n    # base plate:\
    \ the same floor the nut seats on\n    body = cq.Workplane(\"XY\").box(p.coupon_l,\
    \ p.coupon_w, z0,\n                                   centered=(True, True, False))\n\
    \n    for k in range(len(afs)):\n        x = (k - 1) * p.coupon_pitch\n\n    \
    \    # cup wall\n        cup = (cq.Workplane(\"XY\").workplane(offset=z0).moveTo(x,\
    \ 0)\n               .circle(p.coupon_cup_r).extrude(zt - z0))\n        cup =\
    \ cup.cut(cq.Workplane(\"XY\").workplane(offset=z0).moveTo(x, 0)\n           \
    \           .circle(p.gap_r).extrude(zt - z0))\n        body = body.union(cup)\n\
    \n        # collet sleeve\n        sleeve = (hex_funnel(afs[k] + 2 * p.finger_t,\
    \ z0, zs, zt,\n                             p.funnel_slope, x)\n             \
    \     .cut(hex_funnel(afs[k], z0, zs, zt, p.funnel_slope, x)))\n        body =\
    \ body.union(sleeve)\n\n        # six slits -> six fingers\n        for i in range(6):\n\
    \            a = 30 + 60 * i\n            slit = (cq.Workplane(\"XY\")\n     \
    \               .box(p.gap_r - 0.2, p.slit_w, zt - z0,\n                     \
    \    centered=(False, True, False))\n                    .translate((x, 0, z0))\n\
    \                    .rotate((x, 0, 0), (x, 0, 1), a))\n            body = body.cut(slit)\n\
    \n        # M5 clearance hole through the floor\n        body = body.cut(cq.Workplane(\"\
    XY\").moveTo(x, 0)\n                        .circle(p.bolt_clear_d / 2).extrude(zt))\n\
    \n    return body\n"
  print_orientation: Flat base plate on the bed, the three collet cups standing up
    with their mouths open upward.
  use_orientation: 'Flat, mouths up: press the nut down into each cup in turn, then
    hold the coupon upside down and tap it to see which cups keep the nut.'
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
- id: bolt
  ref: ISO 4762 M5x20
  qty: 1
joints:
- id: j1
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: clearance hole through the floor under the nut
    role: clearance
  nut: nut
  external: null
criteria:
- id: c1
  part: knob
  feature: collet fingers
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - free_af
  - finger_t
  - nut_af
  check:
    method: coupon
    ref: coupon
    description: The six fingers spring open to take the nut (free across-flats 7.60
      is below any legal M5 nut, 7.78-8.00) and press back on its six corners. Coupon
      A tests 7.50 / 7.60 / 7.70 so the tightest one that still presses by hand can
      be chosen; the strain in a finger stays under 1% across the whole range.
- id: c2
  part: knob
  feature: flared mouth of the collet
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - funnel_slope
  - funnel_z
  - nut_af
  check:
    method: coupon
    ref: coupon
    description: The flare opens the fingers to about 8.85 mm across the flats at
      the rim, so the nut's corners (9.24 mm across corners for a maximum nut) enter
      freely and self-centre even if a corner lands on a slit.
- id: c3
  part: knob
  feature: floor under the nut
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - floor_t
  - nut_h
  - knob_h
  check:
    method: none
    ref: null
    description: The nut bottoms on a 5.9 mm floor with its top face 1.4 mm below
      the rim, so it sits fully inside and cannot be pushed out of the far side.
- id: c4
  part: knob
  feature: nut retention when inverted
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - free_af
  - finger_t
  - nut_h
  check:
    method: coupon
    ref: coupon
    description: 'With the knob upside down and tapped, the nut stays: the fingers''
      spring grip is worth newtons of friction against a 0.01 N nut, and it must hold
      without glue or any second printed piece.'
- id: c5
  part: knob
  feature: fingertip corners that key the nut
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - free_af
  - finger_t
  - nut_h
  check:
    method: coupon
    ref: coupon
    description: 'Hand-tightening torque is carried by form, not friction: each finger
      holds one corner of the nut and is stiff in the tangential direction, yielding
      only around 2 N.m - well past hand tightening - while a slight elastic give
      of well under a degree is what the nut keys against.'
- id: c6
  part: knob
  feature: clearance hole under the nut
  relation: clears
  hardware: bolt
  clearance_mm: 0.5
  params:
  - bolt_clear_d
  - bolt_shank_d
  check:
    method: measure
    ref: null
    description: 'Measure the hole at the knob''s underside: at least 5.0 mm, so the
      M5 shank passes freely up into the nut.'
- id: c7
  part: coupon
  feature: three test collets
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - coupon_af_a
  - coupon_af_b
  - coupon_af_c
  - finger_t
  check:
    method: coupon
    ref: coupon
    description: Each cup must take the nut with a firm thumb press and keep it when
      the coupon is inverted; the chosen value becomes the knob's free_af.
manual:
- n: '1'
  text: Print coupon (PLA, 0.2 mm layers, no supports, flat base on the bed). It has
    three collet cups standing up, their mouths open.
  parts:
  - coupon
  hardware: []
  tool: null
- n: '2'
  text: Press the M5 hex nut down into the left cup first. It should go in with a
    firm thumb press - the six fingers flare open, then close onto the nut's corners
    - and it should stop when it seats on the floor of the cup, about 1.4 mm below
    the top of the cup. If it will not go in at all, try the middle cup.
  parts:
  - coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: 'Hold the coupon upside down and tap it on the bench. The nut must stay in
    the cup. The cups left to right are 7.50, 7.60 and 7.70 mm across the flats: use
    the smallest (tightest) number that you can still press in by hand and that still
    holds the nut upside down. That number is the knob''s free_af.'
  parts:
  - coupon
  hardware:
  - nut
  tool: null
- n: '4'
  text: Print knob with free_af set to the number you chose in step 3 (default is
    7.60). PLA, 0.2 mm layers, no supports, flat bottom on the bed, collet opening
    upward.
  parts:
  - knob
  hardware: []
  tool: null
- n: '5'
  text: Press the M5 nut down into the knob's collet from the top face, square to
    the pocket, until it seats on the floor. Its top face should end about 1.4 mm
    below the knob's rim.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '6'
  text: Hold the knob upside down and tap it. The nut must not fall out. If it does,
    print the knob again with free_af one step smaller from the coupon (7.50 first,
    then 7.40 as a last resort if that still falls out).
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '7'
  text: Feed the M5 bolt up through the 5.5 mm hole in the knob's underside and turn
    it by hand into the nut until the threaded tip comes out of the open top of the
    knob.
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: null
- n: '8'
  text: 'To use: hold the knob and turn it. The fingers key the nut''s corners so
    it turns with the knob and drives the bolt - no tool needed, and no glue or extra
    hardware anywhere in the assembly.'
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: null
