task: nut-knob/M3
note: I had no fit results, so I moved the design toward a looser fit. The ribs are
  lower now (0.2 mm), the coupon tests 0.1/0.2/0.3 mm, and there's a 0.4 mm lead-in
  above the ribs.
questions: []
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_clear_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: ''
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: ''
  knob_h:
    value: 8
    unit: mm
    kind: design
    source: design
    note: ''
  scallops:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
  scallop_r:
    value: 1.8
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_pitch_r:
    value: 10.6
    unit: mm
    kind: design
    source: design
    note: ''
  pocket_clear:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: ''
  recess:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: free entry above the ribs, and the nut sits this far below the face
  rib_h:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: lowered from 0.3. There was no fit feedback, and 0.3 risked a fit too tight
      to press by thumb. Rib to opposite flat = 5.5 nominal; the printed undersize
      gives the grip
  rib_w:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    H=p.knob_h; D=p.knob_d\n    body=cq.Workplane('XY').circle(D/2).extrude(H).edges('>Z').chamfer(1.0).edges('<Z').chamfer(0.4)\n\
    \    n=int(p.scallops)\n    pts=[(p.scallop_pitch_r*math.cos(2*math.pi*i/n),p.scallop_pitch_r*math.sin(2*math.pi*i/n))\
    \ for i in range(n)]\n    body=body.cut(cq.Workplane('XY').pushPoints(pts).circle(p.scallop_r).extrude(H))\n\
    \    af=p.nut_af+p.pocket_clear\n    depth=p.nut_h+p.recess\n    body=body.cut(cq.Workplane('XY').workplane(offset=H-depth).polygon(6,af/math.cos(math.pi/6)).extrude(depth+1))\n\
    \    body=body.cut(cq.Workplane('XY').circle(p.bolt_clear_d/2).extrude(H+1))\n\
    \    for ang in (30,150,270):\n        t=p.rib_h+0.5\n        rib=cq.Workplane('XY').box(t,p.rib_w,p.nut_h,centered=(True,True,False)).translate((af/2-p.rib_h+t/2,0,H-depth)).rotate((0,0,0),(0,0,1),ang)\n\
    \        body=body.union(rib)\n    return body\n"
  print_orientation: Solid face (bolt-entry side) on the bed, hex pocket open upward;
    no supports
  use_orientation: Solid face against the work, so the bolt load pushes the nut onto
    the pocket floor
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\ndef build(p):\n    af=p.nut_af+p.pocket_clear\n    depth=p.nut_h+p.recess\n\
    \    H=depth+1.5\n    out=None\n    for k,rh in enumerate((p.rib_h-0.1,p.rib_h,p.rib_h+0.1)):\n\
    \        b=cq.Workplane('XY').box(10,10,H,centered=(True,True,False))\n      \
    \  b=b.cut(cq.Workplane('XY').workplane(offset=H-depth).polygon(6,af/math.cos(math.pi/6)).extrude(depth+1))\n\
    \        b=b.cut(cq.Workplane('XY').circle(p.bolt_clear_d/2).extrude(H+1))\n \
    \       for ang in (30,150,270):\n            t=rh+0.5\n            rib=cq.Workplane('XY').box(t,p.rib_w,p.nut_h,centered=(True,True,False)).translate((af/2-rh+t/2,0,H-depth)).rotate((0,0,0),(0,0,1),ang)\n\
    \            b=b.union(rib)\n        mk=[(-3.8+1.3*j,-3.8) for j in range(k+1)]\n\
    \        b=b.cut(cq.Workplane('XY').workplane(offset=H-0.6).pushPoints(mk).circle(0.4).extrude(1))\n\
    \        b=b.translate((k*12,0,0))\n        out=b if out is None else out.union(b)\n\
    \    return out\n"
  print_orientation: Flat on bed, pockets up
  use_orientation: Hand test only
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 4
joints: []
criteria:
- id: c1
  part: knob
  feature: hex pocket with crush ribs
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - nut_h
  - pocket_clear
  - rib_h
  - rib_w
  check:
    method: coupon
    ref: fit_coupon
    description: Nut presses in by thumb, sits on the floor, and stays in when held
      upside down and shaken
- id: c2
  part: knob
  feature: nut recess depth
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_h
  - recess
  check:
    method: measure
    ref: null
    description: Nut top sits about 0.4 mm below the knob face
- id: c3
  part: knob
  feature: 3.4 mm floor hole
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - bolt_clear_d
  - bolt_d
  check:
    method: none
    ref: null
    description: Bolt passes freely; the nut can't pass
manual:
- n: '1'
  text: 'Print fit_coupon. The dots mark the rib heights: 1 dot = 0.1 mm, 2 = 0.2,
    3 = 0.3. Press an M3 nut into each pocket with your thumb. Pick the tightest pocket
    where the nut still goes all the way down by hand and stays in when you hold it
    upside down and shake it. If the 2-dot pocket is that one, print the knob as sent.
    If it''s 1 dot, set rib_h to 0.1. If it''s 3 dots, set it to 0.3.'
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '2'
  text: Print the knob with the solid face down and the pocket facing up. It needs
    no supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: The nut drops in freely for the first 0.4 mm. Then press it down past the
    ribs with your thumb, or push it down on a table with a coin, until it sits on
    the floor.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Thread your M3 bolt in from the solid face, through the nut and out of the
    pocket side. Fit the knob so the solid face sits against the work.
  parts:
  - knob
  hardware:
  - nut
  tool: null
