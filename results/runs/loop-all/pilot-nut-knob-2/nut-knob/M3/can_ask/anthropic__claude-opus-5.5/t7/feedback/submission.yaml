manual:
- n: '1'
  text: Print fit_coupon. Cell 1 is at the clipped corner and the ribs get tighter
    toward cell 4. The rib-tip circles are 5.60, 5.50, 5.40 and 5.30 mm, which match
    rib_proud 0.05, 0.10, 0.15 and 0.20.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Press an M3 nut into each cell by hand, flats lined up, until it touches the
    floor. Pick the loosest cell where the nut stays in when you turn the coupon upside
    down and shake it. Set rib_proud to that cell's value. The default of 0.15 is
    cell 3. If even cell 4 lets the nut fall out, use 0.25. If even cell 1 won't press
    in, use 0.0.
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: Print the knob with the pocket facing up and no supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '4'
  text: Line the nut's flats up with the pocket and press it straight down until it
    bottoms out. Push against a table if it's stiff. Its top should sit just below
    the knob face.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Thread the M3 bolt into the nut and out through the bottom hole. Then tighten
    by hand.
  parts:
  - knob
  hardware:
  - nut
  tool: null
