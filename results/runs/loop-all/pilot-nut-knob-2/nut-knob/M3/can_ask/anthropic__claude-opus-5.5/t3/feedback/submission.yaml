task: nut-knob/M3
note: The geometry hasn't changed, because no fit result came back to tune from. The
  knob uses the 5.00 mm rib-tip size, the middle of the coupon's 5.20/5.00/4.80 range.
  Use whichever coupon pocket holds the nut to choose rib_protrude before you reprint.
questions:
- text: In the coupon, which pocket (5.20, 5.00 or 4.80) let the nut press in by hand
    and still hold it upside down? Were any too loose or too tight to press?
  answer: null
- text: Does the M3 bolt slide through the 3.5 mm floor hole by hand?
  answer: null
params:
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats. Couldn't be measured
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_clear_d:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: M3 clearance. Much smaller than the nut, so the nut can't pass the floor
  knob_d:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
  knob_h:
    value: 9
    unit: mm
    kind: design
    source: design
    note: ''
  edge_chamfer:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: ''
  grip_count:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
  grip_r:
    value: 2.2
    unit: mm
    kind: design
    source: design
    note: ''
  pocket_clear:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: hex pocket is 5.7 mm across flats. The ribs do the gripping
  rib_r:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: ''
  rib_protrude:
    value: 0.35
    unit: mm
    kind: design
    source: design
    note: 'Rib-tip size = 5.7 - 2*rib_protrude: 0.25 gives 5.20, 0.35 gives 5.00,
      0.45 gives 4.80. Unchanged because no fit result was reported'
  nut_recess:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: nut top sits this far below the knob's top face
  leadin_h:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_step:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_floor:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    r = p.knob_d/2\n    body = cq.Workplane('XY').circle(r).extrude(p.knob_h).edges('%CIRCLE').chamfer(p.edge_chamfer)\n\
    \    n = int(p.grip_count)\n    for i in range(n):\n        a = 2*math.pi*i/n\n\
    \        c = r + p.grip_r*0.45\n        body = body.cut(cq.Workplane('XY').center(c*math.cos(a),\
    \ c*math.sin(a)).circle(p.grip_r).extrude(p.knob_h))\n    body = body.cut(cq.Workplane('XY').circle(p.bolt_clear_d/2).extrude(p.knob_h))\n\
    \    af = p.nut_af + p.pocket_clear\n    depth = p.nut_h + p.nut_recess\n    z0\
    \ = p.knob_h - depth\n    body = body.cut(cq.Workplane('XY').workplane(offset=z0).polygon(6,\
    \ af/math.cos(math.pi/6)).extrude(depth))\n    for k in range(3):\n        ang\
    \ = math.radians(30 + 120*k)\n        d = af/2 + p.rib_r - p.rib_protrude\n  \
    \      body = body.union(cq.Workplane('XY').workplane(offset=z0).center(d*math.cos(ang),\
    \ d*math.sin(ang)).circle(p.rib_r).extrude(depth))\n    rb = af/2 - p.rib_protrude\n\
    \    rt = af/(2*math.cos(math.pi/6)) + 0.3\n    cone = cq.Solid.makeCone(rb, rt,\
    \ p.leadin_h, cq.Vector(0,0,p.knob_h-p.leadin_h), cq.Vector(0,0,1))\n    body\
    \ = body.cut(cone)\n    return body\n"
  print_orientation: flat face (pocket floor side) on the bed, nut pocket opening
    facing up. No supports, no bridges
  use_orientation: flat bottom face against the workpiece, nut pocket opening facing
    away from it
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\ndef build(p):\n    depth = p.nut_h + p.nut_recess\n    H = p.coupon_floor\
    \ + depth\n    pitch = 12.0\n    body = cq.Workplane('XY').box(3*pitch, 12, H,\
    \ centered=(True, True, False))\n    af = p.nut_af + p.pocket_clear\n    for j\
    \ in range(3):\n        x = (j-1)*pitch\n        prot = p.rib_protrude + (j-1)*p.coupon_step\n\
    \        body = body.cut(cq.Workplane('XY').center(x,0).circle(p.bolt_clear_d/2).extrude(H))\n\
    \        body = body.cut(cq.Workplane('XY').workplane(offset=p.coupon_floor).center(x,0).polygon(6,\
    \ af/math.cos(math.pi/6)).extrude(depth))\n        for k in range(3):\n      \
    \      ang = math.radians(30 + 120*k)\n            d = af/2 + p.rib_r - prot\n\
    \            body = body.union(cq.Workplane('XY').workplane(offset=p.coupon_floor).center(x\
    \ + d*math.cos(ang), d*math.sin(ang)).circle(p.rib_r).extrude(depth))\n      \
    \  rb = af/2 - prot\n        rt = af/(2*math.cos(math.pi/6)) + 0.3\n        body\
    \ = body.cut(cq.Solid.makeCone(rb, rt, p.leadin_h, cq.Vector(x,0,H-p.leadin_h),\
    \ cq.Vector(0,0,1)))\n        for m in range(j+1):\n            body = body.cut(cq.Workplane('XY').workplane(offset=H-0.6).center(x\
    \ - 2 + 2*m, -4.8).circle(0.5).extrude(0.6))\n    return body\n"
  print_orientation: flat bottom on the bed, pockets open upward
  use_orientation: handheld test piece
