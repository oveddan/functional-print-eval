manual:
- n: '1'
  text: 'If you still have the fit_coupon, use it. Otherwise print it. The three pockets
    are marked with dots: 1 dot = 5.20 mm, 2 dots = 5.00 mm, 3 dots = 4.80 mm. Each
    number is the gap between the rib tips, and smaller means tighter.'
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Press an M3 nut into each pocket, loosest (5.20) first. Choose the loosest
    pocket where the nut goes in with firm thumb or vise pressure, sits flat on the
    floor, and doesn't fall out when you turn the coupon over and shake it. If that's
    5.00, print the knob as sent. If it's 5.20, set rib_protrude = 0.25. If it's 4.80,
    set rib_protrude = 0.45. If even the 4.80 pocket is loose, set 0.55. If the 5.20
    pocket is too tight to press, set 0.15. Please tell me which pocket worked.
  parts:
  - fit_coupon
  hardware:
  - nut_test
  tool: null
- n: '3'
  text: Print the knob with its flat face on the bed and the hex pocket facing up.
    No supports needed. 3 walls and 25% infill are plenty.
  parts:
  - knob
  hardware: []
  tool: null
- n: '4'
  text: Line the nut's flats up with the pocket and press it straight down until it
    bottoms out on the floor, about 0.5 mm below the top face. Use a vise, flat pliers,
    or a bolt head if thumb pressure isn't enough. Don't use glue.
  parts:
  - knob
  hardware:
  - nut
  tool: thumb or vise
- n: '5'
  text: Push your M3 bolt into the flat bottom face of the knob and through the floor
    hole, then thread it through the nut and out the open top. When you tighten, the
    knob's flat face pushes against your workpiece and the pocket floor takes the
    load from the nut.
  parts:
  - knob
  hardware:
  - nut
  tool: null
