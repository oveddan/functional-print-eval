task: nut-knob/M3
note: 'Diagnosis first: the pockets you printed measured 5.60 / 5.40 / 5.24, exactly
  what I drew, so the printer is faithful and the tightness is not a slicing/dimension
  problem. The giveaway is that the 5.60 pocket (no ribs at all, i.e. 0.10 mm of clearance
  at the flats for a nominal 5.5 nut) still fought back. That is the hex nut''s CORNERS,
  not its flats: a hex nut''s corners are 6.35 across corners, so in a 5.60 pocket
  they have only ~0.06 mm per side - and a printed internal corner is never sharp,
  the extruder leaves a small fillet that eats exactly that clearance. The nut jams
  corner-first, whatever its across-flats. So I changed two things:


  1. Six CORNER NOTCHES (1.30 wide, cut from r 2.30 out to r 4.10). The nut''s corners
  drop into them, so insertion no longer depends on corner clearance, and the notches''
  side walls are also what stops the nut spinning in the knob when you tighten - no
  more relying on a friction fit to take the torque.


  2. The grip is now six thin flexible LEAVES instead of rigid ribs. Each leaf is
  0.6 mm thick, 2.55 mm tall, standing on the pocket floor with a 0.85 mm void ring
  behind it, so it tilts outward as the nut goes in and springs back on it. Their
  faces sit at 5.30 across flats. That means a nut anywhere from about 5.35 to 5.75
  presses in with a firm thumb and is gripped, instead of needing a precise interference
  - which matters because you could not measure your nut, and your print showed I
  cannot infer its size from the old coupon.


  Unchanged and still satisfied: the nut ends up fully inside (2.55 deep pocket, 2.4
  nut, so it sits 0.15 below the open face), it cannot be pushed out the far side
  (3.5 mm of solid PLA behind it with only the 3.5 mm bolt hole), and the bolt passes
  through it and out through the closed face (needs about 7 mm of free thread on the
  bolt). A 45 degree cone at the pocket mouth leads the nut in.


  Print the coupon first (about 10 minutes): three pockets, all the same construction,
  differing only in grip size - left 5.15 (tight), middle 5.30 (identical to the knob),
  right 5.45 (loose). Press the nut into the middle one and check it holds upside
  down before printing the knob.'
questions:
- text: In the coupon's middle pocket, does the nut press in with thumb pressure and
    then hold when you turn the coupon upside down? If it is too stiff or too loose
    I can shift the leaf faces (5.30 now) by a tenth either way and send it back.
  answer: null
- text: Do the six leaves survive printing at 0.6 mm thick and 2.55 mm tall - no wobble,
    no missing lines?
  answer: null
