manual:
- n: '1'
  text: 'Print the coupon flat on the bed, PLA, 0.2 mm layers, no supports. It is
    a 68 x 18 x 5 mm plate with five hex pockets, each with the same flared mouth
    as the knob. The rows of small dots alongside tell you which pocket is which:
    1 dot = 5.38 mm, 2 = 5.44, 3 = 5.50, 4 = 5.56, 5 = 5.62 mm across the flats.'
  parts:
  - coupon
  hardware: []
  tool: null
- n: '2'
  text: Press the M3 nut into pocket 1, then 2, 3, 4 and 5. Drop it in flat side down
    - you do NOT need to rotate it to match the hexagon any more, the flared mouth
    takes it at any angle and the taper turns it as it goes. Push each one until it
    stops against the pocket floor.
  parts:
  - coupon
  hardware:
  - m3-nut
  tool: null
- n: '3'
  text: 'Check each pocket: turn the plate upside down and tap it. Note the pocket
    that went in by hand but holds the nut when inverted - that is your size. Pocket
    3 (3 dots) is exactly the size built into the knob, so if pocket 3 works you can
    print the knob as it is; if pocket 2 or 4 is the one that grips best, change hex_pocket_af
    in the knob''s code to 5.44 or 5.56 before step 4.'
  parts:
  - coupon
  hardware:
  - m3-nut
  tool: null
- n: '4'
  text: 'Print the knob. It is already modelled in its print orientation: the flat
    countersunk face goes on the bed (z = 0) and the open hex pocket with its flared
    mouth faces up. PLA, 0.2 mm layers, no supports.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '5'
  text: Press the M3 nut flat side first into the wide hex opening (the end opposite
    the flat countersunk face). No aligning needed - push it straight in and it should
    travel to the ceiling and stop, sitting 0.6 mm inside the mouth. If it is stiff
    for the last millimetre, press it with a bench vise or smooth-jawed pliers; never
    hammer it.
  parts:
  - knob
  hardware:
  - m3-nut
  tool: null
- n: '6'
  text: 'Check the capture: hold the knob with the hex opening facing down and shake
    it - the nut must not fall out. Then press the nut the other way with a pencil
    tip through the opening; it must stop on the ceiling and must never appear at
    the countersunk face.'
  parts:
  - knob
  hardware:
  - m3-nut
  tool: null
- n: '7'
  text: Push the M3 bolt (M3x16 is ideal; anything from M3x12 to M3x25 works) through
    the countersunk 3.4 mm hole in the flat face, turn it into the nut's thread and
    keep turning until the tip comes out through the nut and is visible in the hex
    opening.
  parts:
  - knob
  hardware:
  - m3-bolt
  - m3-nut
  tool: null
- n: '8'
  text: 'Use it by turning the fluted body by hand. Always feed the bolt in through
    the flat countersunk face: tightening then pushes the nut into the ceiling, so
    the load never tries to pull the nut out of the pocket.'
  parts:
  - knob
  hardware:
  - m3-bolt
  tool: null
