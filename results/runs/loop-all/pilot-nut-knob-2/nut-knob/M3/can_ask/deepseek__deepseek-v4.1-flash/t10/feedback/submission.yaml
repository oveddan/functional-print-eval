task: nut-knob/M3
note: 'Sorry - the failure was my fault, and it was not the fit sizes. My old pocket
  mouth was a relief only 6.03 mm across the flats, but an M3 hex nut is 6.35 mm across
  its corners. Unless the nut was rotated almost exactly to match the hexagon, its
  corners hit the mouth flats and it could not start, at 5.42 and at 5.58 alike. That
  is why nothing would go in.


  What changed:

  1. The pocket mouth is now a flared funnel, 6.5 mm across flats at the surface,
  tapering down to the pocket size over 1.2 mm. 6.5 is bigger than the nut''s 6.35
  across corners, so the nut drops in at ANY rotation and the taper turns it onto
  the flats as you push. No aligning needed.

  2. The straight gripping section is now 1.8 mm of parallel hex below the funnel,
  and the pocket is a line-to-line 5.50 mm across flats against the catalog nut. Because
  a printed hex socket normally comes out a few hundredths tight, that gives a firm
  hand press; if it prints dead on size it is a snug friction fit. The nut always
  travels all the way to the ceiling, so it is always fully inside (0.6 mm in from
  the mouth).

  3. The ceiling is still pierced only by the 3.4 mm bolt hole, so the nut can never
  be pushed out the far side; the bolt enters there, passes through the nut and exits
  the wide end.


  New coupon: five pockets that are exact copies of the knob''s pocket (funnel and
  all) at 5.38 / 5.44 / 5.50 / 5.56 / 5.62 mm across flats. Pocket 3 with 3 dots is
  exactly the knob''s size, so if pocket 2 or 4 grips better, set hex_pocket_af to
  that value before printing the knob. Press the nut in - no rotation needed this
  time.'
questions:
- text: With the new flared mouth, did the nut go into the knob's pocket by hand,
    and did it stay in when you turned the knob upside down?
  answer: null
- text: On the coupon, which numbered pocket (1 = 5.38, 2 = 5.44, 3 = 5.50, 4 = 5.56,
    5 = 5.62 mm across flats) went in by hand and then held the nut when the plate
    was inverted? Tell me the number and I will set the knob's hex_pocket_af to match.
  answer: null
- text: Where did the nut end up sitting in the knob - at the ceiling (about 0.6 mm
    inside the mouth) or proud of the mouth? That tells me whether the pocket is too
    tight or too loose.
  answer: null
params:
  bolt_clearance:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: Added to bolt_d, giving the 3.4 mm hole through the pocket ceiling and the
      countersunk entry.
  bolt_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: M3 thread major diameter (ISO 4762 M3).
  bolt_lead_chamfer:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: '45 degree countersink at the bolt entry face: 3.4 mm opening widening to
      4.6 mm at the surface.'
  flute_count:
    value: 8
    unit: count
    kind: design
    source: design
    note: Number of finger flutes around the grip.
  flute_cutter_r:
    value: 4.0
    unit: mm
    kind: design
    source: design
    note: Radius of the cylindrical cutter forming each flute.
  flute_depth:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: Radial depth of the finger flutes; with flute_cutter_r this leaves 1.5 mm
      crest ridges.
  funnel_depth:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: Depth of the flared, self-aligning mouth, from the surface down to where
      the straight gripping hex begins.
  funnel_mouth_af:
    value: 6.5
    unit: mm
    kind: design
    source: design
    note: Width across flats of the pocket mouth. Larger than nut_ac (6.35), so the
      nut can be pushed in without rotating it to match the hexagon. This is the fix
      for the jammed first print.
  hex_pocket_af:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Straight gripping section of the pocket, line-to-line with the catalog nut.
      Printed hex sockets normally come out a few hundredths small, which turns this
      into a light press that holds the nut by friction; if it prints dead on size
      it is a snug friction fit. Confirmed by the coupon, whose middle pocket is this
      exact size.
  knob_h:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: Total knob height along the bolt axis.
  knob_od:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: Outer diameter at the flute crests - the ~20 mm across that was asked for.
  nut_ac:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: Nut width across corners = nut_af/cos(30) = 6.351. The pocket mouth must
      exceed this, or the nut only enters when its corners happen to line up with
      the pocket corners.
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut, width across flats. The nut could not be measured,
      so the catalog value is used.
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 nut thickness.
  pocket_depth:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: Depth from the mouth to the ceiling = nut_h + 0.6, so the pressed-in nut
      sits 0.6 mm inside the knob.
parts:
- id: knob
  role: final
  material: PLA (high-speed, black), 0.4 mm nozzle, 0.2 mm layers
  code: "import math\n\ndef hexpts(af):\n    r = af / math.sqrt(3.0)\n    return [(r\
    \ * math.cos(math.radians(60 * k)), r * math.sin(math.radians(60 * k))) for k\
    \ in range(6)]\n\ndef build(p):\n    R = p.knob_od / 2.0\n    H = p.knob_h\n \
    \   tw = H - p.pocket_depth            # pocket ceiling (shoulder) thickness\n\
    \    hr = (p.bolt_d + p.bolt_clearance) / 2.0\n\n    # --- fluted grip body ---\n\
    \    body = cq.Workplane(\"XY\").circle(R).extrude(H)\n    n = int(round(p.flute_count))\n\
    \    rf = p.flute_cutter_r\n    rc = R + rf - p.flute_depth\n    pts = [(rc *\
    \ math.cos(2 * math.pi * i / n),\n            rc * math.sin(2 * math.pi * i /\
    \ n)) for i in range(n)]\n    body = body.faces(\">Z\").workplane().pushPoints(pts).circle(rf).cutThruAll()\n\
    \n    # --- M3 clearance hole through the ceiling, from the flat bolt entry face\
    \ ---\n    body = body.cut(cq.Workplane(\"XY\").circle(hr).extrude(tw))\n\n  \
    \  # --- lead-in countersink at the bolt entry face ---\n    c1 = p.bolt_lead_chamfer\n\
    \    sink = cq.Solid.makeCone(hr + c1, hr, c1, cq.Vector(0, 0, 0), cq.Vector(0,\
    \ 0, 1))\n    body = body.cut(cq.Workplane(\"XY\").newObject([sink]))\n\n    #\
    \ --- hex nut pocket: parallel gripping section from the ceiling to z2 ---\n \
    \   af = p.hex_pocket_af\n    z2 = H - p.funnel_depth\n    ext = 0.6         \
    \                         # cut this far past the top face\n    z3 = H + ext\n\
    \    af3 = af + (p.funnel_mouth_af - af) * ((z3 - z2) / p.funnel_depth)\n\n  \
    \  body = body.cut(cq.Workplane(\"XY\").workplane(offset=tw)\n               \
    \     .polyline(hexpts(af)).close().extrude(z3 - tw))\n\n    # --- flared, self-aligning\
    \ mouth: af at z2 up to funnel_mouth_af at the surface ---\n    body = body.cut(cq.Workplane(\"\
    XY\").workplane(offset=z2)\n                    .polyline(hexpts(af)).close()\n\
    \                    .workplane(offset=(z3 - z2))\n                    .polyline(hexpts(af3)).close()\n\
    \                    .loft(ruled=True))\n\n    return body"
  print_orientation: z = 0 on the bed is the flat bolt-entry face (carrying the 3.4
    mm countersunk hole). Knob axis vertical, fluted wall rises straight up, the hex
    pocket with its flared mouth opens upward. No supports, no bridging.
  use_orientation: Knob axis vertical. Flat countersunk face up - the bolt enters
    there. The hex pocket opens downward; the nut is pressed in from below through
    the flared mouth and stops against the ceiling 0.6 mm inside.
- id: coupon
  role: coupon
  material: PLA (high-speed, black), 0.4 mm nozzle, 0.2 mm layers
  code: "import math\n\ndef hexpts(af):\n    r = af / math.sqrt(3.0)\n    return [(r\
    \ * math.cos(math.radians(60 * k)), r * math.sin(math.radians(60 * k))) for k\
    \ in range(6)]\n\ndef build(p):\n    af0 = p.hex_pocket_af\n    offs = [-0.12,\
    \ -0.06, 0.0, 0.06, 0.12]      # pockets 1..5; pocket 3 is the knob's size\n \
    \   n = len(offs)\n    pitch = 14.0\n    L = pitch * (n - 1) + 12.0\n    W = 18.0\n\
    \    T = 5.0\n    tw = T - p.pocket_depth                     # shoulder under\
    \ each pocket\n    hr = (p.bolt_d + p.bolt_clearance) / 2.0\n    z2 = T - p.funnel_depth\n\
    \    z3 = T + 0.6\n\n    plate = cq.Workplane(\"XY\").box(L, W, T, centered=(True,\
    \ True, False))\n    marks = []\n\n    for i, o in enumerate(offs):\n        x\
    \ = (i - (n - 1) / 2.0) * pitch\n        af = af0 + o\n        af3 = af + (p.funnel_mouth_af\
    \ - af) * ((z3 - z2) / p.funnel_depth)\n        hx = [(x + a, b) for (a, b) in\
    \ hexpts(af)]\n        hx3 = [(x + a, b) for (a, b) in hexpts(af3)]\n\n      \
    \  plate = plate.cut(cq.Workplane(\"XY\").workplane(offset=tw)\n             \
    \             .polyline(hx).close().extrude(z3 - tw))\n        plate = plate.cut(cq.Workplane(\"\
    XY\").workplane(offset=z2)\n                          .polyline(hx).close()\n\
    \                          .workplane(offset=(z3 - z2))\n                    \
    \      .polyline(hx3).close().loft(ruled=True))\n        plate = plate.cut(cq.Workplane(\"\
    XY\").center(x, 0).circle(hr).extrude(tw + 0.5))\n\n        for j in range(i +\
    \ 1):                  # 1..5 dots identify the pocket\n            marks.append((x\
    \ - 3.0 + j * 1.5, -6.5))\n\n    plate = plate.faces(\">Z\").workplane().pushPoints(marks).circle(0.45).cutThruAll()\n\
    \    return plate"
  print_orientation: z = 0 on the bed is the bottom of the plate; the pockets and
    their flared mouths open upward. Flat, no supports.
  use_orientation: Flat on a table, pockets up. Press the M3 nut into a pocket from
    above, then flip the plate and check the nut stays put and cannot be pushed through.
