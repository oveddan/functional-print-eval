  coupon_h:
    value: 6
    unit: mm
    kind: design
    source: design
    note: pocket depth 4.0 + 2.0 of solid lid
  coupon_w:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_pitch:
    value: 13
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_lip_af_1:
    value: 5.1
    unit: mm
    kind: design
    source: design
    note: 'coupon pocket with 1 dot: one step tighter than the knob'
  coupon_lip_af_2:
    value: 5.2
    unit: mm
    kind: design
    source: design
    note: 'coupon pocket with 2 dots: exactly the knob''s lip'
  coupon_lip_af_3:
    value: 5.3
    unit: mm
    kind: design
    source: design
    note: 'coupon pocket with 3 dots: one step looser'
parts:
- id: knob
  role: final
  material: PLA (Bambu high-speed PLA, black)
  code: "import math\n\ndef build(p):\n    R = p.knob_od / 2.0\n    H = p.knob_h\n\
    \    ch = p.top_chamfer\n\n    # body: cylinder with a chamfered top rim\n   \
    \ body = cq.Workplane(\"XY\").circle(R).extrude(H - ch)\n    body = body.union(cq.Workplane(obj=cq.Solid.makeCone(\n\
    \        R, R - ch, ch, cq.Vector(0, 0, H - ch), cq.Vector(0, 0, 1))))\n\n   \
    \ # finger flutes around the grip band\n    rc = R + p.flute_r - p.flute_depth\n\
    \    for i in range(int(p.flute_count)):\n        a = 2.0 * math.pi * i / p.flute_count\n\
    \        body = body.cut(\n            cq.Workplane(\"XY\")\n            .center(rc\
    \ * math.cos(a), rc * math.sin(a))\n            .circle(p.flute_r)\n         \
    \   .extrude(p.flute_band_h + 0.2)\n            .translate((0, 0, p.flute_z0 -\
    \ 0.1))\n        )\n\n    # bolt clearance bore: from the pocket roof straight\
    \ out of the top face\n    body = body.cut(cq.Workplane(\"XY\").circle(p.bore_d\
    \ / 2.0)\n                    .extrude(H + 2.0).translate((0, 0, -1.0)))\n\n \
    \   def hexprism(af, z0, z1):\n        d = af / math.cos(math.pi / 6.0)\n    \
    \    return (cq.Workplane(\"XY\").polygon(6, d)\n                .extrude((z1\
    \ - z0) + 0.1).translate((0, 0, z0 - 0.05)))\n\n    # nut pocket, from the mouth\
    \ upwards:\n    #   0.0 - 0.4 entry clearance (nut drops in squarely)\n    # \
    \  0.4 - 1.6 press lip / retainer (5.2, the tightest feature)\n    #   1.6 - 4.0\
    \ slip pocket (5.5) - the seated nut fills this exactly,\n    #             resting\
    \ on the lip's shoulder with no end float\n    lip_top = p.mouth_relief_h + p.lip_h\n\
    \    body = body.cut(hexprism(p.mouth_relief_af, -0.2, p.mouth_relief_h))\n  \
    \  body = body.cut(hexprism(p.pocket_lip_af, p.mouth_relief_h, lip_top))\n   \
    \ body = body.cut(hexprism(p.pocket_af, lip_top, p.pocket_depth))\n\n    # relief\
    \ ring behind the pocket wall: the wall bends outward here when\n    # the nut\
    \ is pressed in, so the press is a hand press, not a crushing fit\n    d_in =\
    \ p.groove_af_in / math.cos(math.pi / 6.0)\n    d_out = p.groove_af_out / math.cos(math.pi\
    \ / 6.0)\n    ring = (cq.Workplane(\"XY\").polygon(6, d_out)\n            .extrude(p.pocket_depth\
    \ + 0.1)\n            .cut(cq.Workplane(\"XY\").polygon(6, d_in)\n           \
    \      .extrude(p.pocket_depth + 1.0).translate((0, 0, -0.5))))\n    body = body.cut(ring.translate((0,\
    \ 0, -0.1)))\n    return body\n"
  print_orientation: 'as modelled: flat bottom face on the bed (z = 0); the pocket
    mouth and the relief ring open downwards, so the lip grows upward from the bed
    and nothing needs support (flutes, chamfer, bore and roof bridges are all self-supporting;
    the widest roof bridge is about 1.5 mm)'
  use_orientation: pocket mouth down onto the bolt's thread; turn by the fluted band
    (17-20 mm across); the bolt's tip appears in the 3.4 mm hole in the top face
- id: fit_coupon
  role: coupon
  material: PLA (same spool and settings as the knob)
  code: "import math\n\ndef build(p):\n    Hc = p.coupon_h\n    hx = p.coupon_pitch\
    \ + 7.0\n    body = cq.Workplane(\"XY\").rect(2.0 * hx, p.coupon_w).extrude(Hc)\n\
    \n    def hexprism(af, z0, z1, dx):\n        d = af / math.cos(math.pi / 6.0)\n\
    \        return (cq.Workplane(\"XY\").polygon(6, d)\n                .extrude((z1\
    \ - z0) + 0.1).translate((dx, 0, z0 - 0.05)))\n\n    d_in = p.groove_af_in / math.cos(math.pi\
    \ / 6.0)\n    d_out = p.groove_af_out / math.cos(math.pi / 6.0)\n    ring = (cq.Workplane(\"\
    XY\").polygon(6, d_out)\n            .extrude(p.pocket_depth + 0.1)\n        \
    \    .cut(cq.Workplane(\"XY\").polygon(6, d_in)\n                 .extrude(p.pocket_depth\
    \ + 1.0).translate((0, 0, -0.5))))\n\n    lips = [p.coupon_lip_af_1, p.coupon_lip_af_2,\
    \ p.coupon_lip_af_3]\n    for i in range(3):\n        af = lips[i]\n        dx\
    \ = (i - 1) * p.coupon_pitch\n        relief = af + (p.mouth_relief_af - p.pocket_lip_af)\n\
    \        body = body.cut(hexprism(relief, -0.2, p.mouth_relief_h, dx))\n     \
    \   body = body.cut(hexprism(af, p.mouth_relief_h,\n                         \
    \        p.mouth_relief_h + p.lip_h, dx))\n        body = body.cut(hexprism(p.pocket_af,\
    \ p.mouth_relief_h + p.lip_h,\n                                 p.pocket_depth,\
    \ dx))\n        body = body.cut(ring.translate((dx, 0, -0.1)))\n        body =\
    \ body.cut(cq.Workplane(\"XY\").circle(p.bore_d / 2.0)\n                     \
    \   .extrude(p.pocket_depth + 1.0)\n                        .translate((dx, 0,\
    \ p.pocket_depth - 0.05)))\n        # label dots on the top face: 1, 2 or 3 of\
    \ them\n        for k in range(i + 1):\n            body = body.cut(cq.Workplane(\"\
    XY\").circle(0.6).extrude(0.5)\n                            .translate((dx + (k\
    \ - i * 0.5) * 1.7,\n                                        p.coupon_w / 2.0\
    \ - 2.0, Hc - 0.5)))\n    return body\n"
  print_orientation: 'as modelled: flat bottom on the bed, all three pocket mouths
    opening downwards - the same orientation as the knob''s pocket, so what you feel
    here is what you get there'
  use_orientation: 'test rig only: press the nut into each pocket in turn, flats to
    flats, then turn the coupon pocket-down and tap it; 1 dot = 5.1 mm lip (tightest),
    2 dots = 5.2 mm (the knob''s size), 3 dots = 5.3 mm (loosest)'
hardware:
- id: m3nut
  ref: ISO 4032 M3
  qty: 1
- id: m3bolt
  ref: ISO 4762 M3x20
  qty: 1
joints:
- id: bolt_through_knob
  fastener: m3bolt
  axis_origin:
  - 0.0
  - 0.0
  - -5.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: entry clearance hexagon (5.9 across flats) and press lip (5.2) - the
      bolt shank passes both
    role: clearance
  - part: knob
    feature: pocket roof bore, 3.4 mm, from z = 4.0 out of the top face
    role: clearance
  nut: m3nut
  external: the part the bolt passes through (assumed 5 mm thick, so the bolt's head
    sits 5 mm below the knob's mouth)
criteria:
- id: c1_nut_presses_in_by_hand
  part: knob
  feature: nut pocket (entry 5.9 / lip 5.2 / pocket 5.5)
  relation: contains
  hardware: m3nut
  clearance_mm: null
  params:
  - pocket_lip_af
  - pocket_af
  - mouth_relief_af
  - mouth_relief_h
  - lip_h
  check:
    method: coupon
    ref: fit_coupon
    description: 'the 2-dot coupon pocket is the knob''s lip (5.2 across flats): the
      nut must go in with a firm press and still be in the pocket after you turn the
      coupon pocket-down and tap it'
- id: c2_lip_is_smaller_than_the_nut
  part: knob
  feature: press lip (hexagon 5.2 across flats)
  relation: engages
  hardware: m3nut
  clearance_mm: -0.3
  params:
  - pocket_lip_af
  - nut_af
  - nut_af_min
  check:
    method: coupon
    ref: fit_coupon
    description: 'the lip stays under even the smallest legal nut even if the printer
      runs 0.1 mm big: 5.2 + 0.1 = 5.3 < 5.32. This is what stops the nut falling
      out when the knob is turned upside down'
- id: c3_wall_flexes_for_the_press
  part: knob
  feature: pocket wall (0.8 mm thick) and relief ring behind it
  relation: engages
  hardware: m3nut
  clearance_mm: null
  params:
  - pocket_lip_af
  - nut_af
  - groove_af_in
  - groove_af_out
  - groove_w
  check:
    method: coupon
    ref: fit_coupon
    description: 0.15 mm radial interference over a 1.2 mm tall band; the 0.8 mm wall
      with the 1.2 mm relief ring behind it bends outward instead of crushing, which
      is what keeps this a press that can be done by hand (roughly 30-60 N) rather
      than a hammer job
- id: c4_nut_cannot_exit_the_far_side
  part: knob
  feature: pocket roof plus central bore (3.4 mm)
  relation: supports
  hardware: m3nut
  clearance_mm: 0.0
  params:
  - bore_d
  - nut_ac
  - pocket_depth
  - nut_h
  check:
    method: measure
    ref: null
    description: the roof at z = 4.0 is solid apart from the 3.4 mm bore; the nut
      is 6.35 mm across corners, so it can never be pushed out of the far side
- id: c5_nut_is_seated_shoulder_to_roof
  part: knob
  feature: lip shoulder (lip top face at z = 1.6) and pocket roof (z = 4.0)
  relation: supports
  hardware: m3nut
  clearance_mm: 0.0
  params:
  - pocket_depth
  - nut_h
  - lip_h
  - mouth_relief_h
  - pocket_lip_af
  - pocket_af
  check:
    method: measure
    ref: null
    description: seated, the nut's bottom face lands exactly on the lip's shoulder
      at z = 1.6 (4.0 - 2.4) with no end float, and its top face meets the roof; the
      shoulder's ledge is 0.15 mm wide at the six flats and 0.17 mm at the corners
- id: c6_nut_is_fully_inside
  part: knob
  feature: pocket mouth (z = 0)
  relation: contains
  hardware: m3nut
  clearance_mm: null
  params:
  - pocket_depth
  - nut_h
  check:
    method: measure
    ref: null
    description: seated against the roof, the nut's bottom face is 1.6 mm inside the
      mouth, so no part of the nut protrudes
- id: c7_bolt_passes_out_of_the_far_side
  part: knob
  feature: central bore (3.4 mm) and top opening (z = 11)
  relation: clears
  hardware: m3bolt
  clearance_mm: 0.4
  params:
  - bore_d
  - bolt_d
  - bolt_len
  - bolt_buried
  - knob_h
  check:
    method: measure
    ref: null
    description: an M3 shank (3.0 mm) has 0.4 mm of clearance from the roof bore out
      of the top; with 5 mm of the bolt buried the M3x20 tip reaches z = 15, i.e.
      4 mm past the knob's top face, so the bolt passes through the nut and out of
      the other side
manual:
- n: '1'
  text: 'Print fit_coupon. PLA, 0.2 mm layers, no supports: it lies flat with the
    three pocket mouths on the bed, which is exactly how the knob''s pocket prints,
    so what you feel here is what you will get in the knob.'
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Press the ISO 4032 M3 nut into each pocket in turn by hand, flats to flats.
    Read the dots: 1 dot = 5.1 mm across flats (tightest), 2 dots = 5.2 mm (the size
    used in the knob), 3 dots = 5.3 mm (loosest).'
  parts:
  - fit_coupon
  hardware:
  - m3nut
  tool: null
- n: '3'
  text: 'Judge the feel. The 2-dot pocket is the knob''s fit: it should take the nut
    with a firm press, and after you turn the coupon pocket-down and tap it the nut
    must still be in there - the pocket is smaller than the nut, so it is caught,
    not glued. Too tight in the 2-dot pocket? Expect the same in the knob and use
    the warm-water press in step 6. If only the 1-dot pocket grips your nut, your
    printer is running big: print the knob with pocket_lip_af reduced by 0.1 (to 5.1)
    - that is one number in the model.'
  parts:
  - fit_coupon
  hardware:
  - m3nut
  tool: null
- n: '4'
  text: Print knob. PLA, 0.2 mm layers, no supports, flat bottom face on the bed -
    the nut pocket faces down, so the lip is printed from the bed upwards.
  parts:
  - knob
  hardware: []
  tool: null
- n: '5'
  text: 'Check the mouth before you press anything in: a hexagon 5.9 mm across the
    flats for the first 0.4 mm, then the tight lip at 5.2 mm for 1.2 mm, then opening
    out to a 5.5 mm hexagon whose roof is 4.0 mm deep. A 3.4 mm hole runs from that
    roof straight out of the top face.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '6'
  text: Press the nut in. Put the nut on a hard flat surface, hold the knob mouth-down
    over it with the two hexagons aligned, and press straight down with your weight
    until it stops hard - the nut's top face has met the roof, and its bottom face
    is now sitting on the lip's shoulder 1.6 mm inside the mouth. It cannot go further,
    and it will not fall back out. If it will not go in by hand, warm the knob in
    about 60 C water for a minute, press the nut in with a cloth, then cool it under
    the tap so the PLA shrinks onto the nut. No glue, ever.
  parts:
  - knob
  hardware:
  - m3nut
  tool: null
- n: '7'
  text: 'Test it before you trust it: turn the knob upside down and shake and tap
    it. The nut stays in - the lip is smaller than the nut all round, so the nut is
    caught on the lip''s shoulder as well as gripped by the press.'
  parts:
  - knob
  hardware:
  - m3nut
  tool: null
- n: '8'
  text: 'Thread the bolt in: mouth facing you, turn the M3 bolt up through the nut
    (or hold the bolt and turn the knob). It goes through the nut and out of the far
    side - the tip shows in the 3.4 mm hole in the top face. The listed M3x20 shows
    about 4 mm of tip if roughly 5 mm of it is inside your part, so the bolt needs
    about 11 mm of free shank.'
  parts:
  - knob
  hardware:
  - m3bolt
  - m3nut
  tool: null
- n: '9'
  text: 'Use it: run the bolt through your part, start the knob mouth-first onto the
    thread and tighten by hand on the fluted band. To release, unscrew the knob; the
    nut stays captured inside it and comes back out only when you deliberately press
    it out.'
  parts:
  - knob
  hardware:
  - m3bolt
  - m3nut
  tool: null
