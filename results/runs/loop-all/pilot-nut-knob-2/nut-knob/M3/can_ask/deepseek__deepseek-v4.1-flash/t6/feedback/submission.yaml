task: nut-knob/M3
note: 'Resubmission, one change: the press lip is now 5.2 mm across flats (was 5.25)
  and 1.2 mm tall (was 0.8), and it is placed so the seated nut rests directly on
  the lip''s shoulder with no end-float. Reason: a standard ISO 4032 M3 nut can be
  as small as 5.32 mm across flats, so the retaining lip must stay under that even
  if your printer runs 0.1 mm big - 5.2 does, 5.25 was marginal. The pocket wall is
  still 0.8 mm thick with a 1.2 mm relief ring behind it, so the 0.15 mm radial press
  is absorbed by wall flex, not by crushing plastic, which keeps it a hand press;
  the coupon is included so you can judge the feel before/after printing, and the
  manual keeps the hot-water fallback for a tight print and the ''reduce pocket_lip_af
  by 0.1'' fix if your 2-dot pocket comes out loose.'
questions:
- text: How much free shank does your M3 bolt have - the length that sticks out of
    the thing it fastens? The knob is 11 mm tall, so you need about 11 mm for the
    bolt's tip to come out of the far side. If it is shorter, tell me the number and
    I will shorten the knob.
  answer: null
- text: 'After printing fit_coupon: which pocket took the nut with a firm press and
    still held it when you turned the coupon pocket-down and tapped it - 1 dot, 2
    dots or 3 dots? If it was not 2 dots, tell me which one and I will re-size the
    pitch of the knob''s lip to match.'
  answer: null
- text: Is your M3 nut a standard ISO 4032 one? Everything is cut to the catalog size
    (5.5 mm across flats, 2.4 mm tall), and I sized the lip against the smallest legal
    nut (5.32 mm) because you could not measure yours.
  answer: null
params:
  knob_od:
    value: 20
    unit: mm
    kind: world
    source: asked
    note: 'user: ''about 20 mm across''; diameter at the flute ridges'
  knob_h:
    value: 11
    unit: mm
    kind: design
    source: design
    note: kept short so a short bolt can still show at the top (needs ~11 mm of free
      shank)
  top_chamfer:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: ''
  flute_count:
    value: 8
    unit: count
    kind: design
    source: design
    note: finger scallops in the grip band
  flute_r:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: scallop radius
  flute_depth:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: grip bottoms are 17 mm across, ridges 20 mm
  flute_z0:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
  flute_band_h:
    value: 8
    unit: mm
    kind: design
    source: design
    note: ''
  bore_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: M3 shank 3.0 + 0.4 clearance; runs from the pocket roof (z=4.0) out of the
      top face - this is how the bolt gets out of the far side
  mouth_relief_af:
    value: 5.9
    unit: mm
    kind: design
    source: design
    note: 'clear entry hexagon 0.2 mm bigger than the nut all round, 0.4 mm tall:
      the nut drops in squarely and the bed-side elephant''s foot stays off the press
      lip'
  mouth_relief_h:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: ''
  pocket_lip_af:
    value: 5.2
    unit: mm
    kind: design
    source: design
    note: 'the press lip and the retainer: smaller than the smallest legal ISO 4032
      M3 nut (5.32), so the nut cannot pass it even if the print runs 0.1 big; also
      the 2-dot coupon pocket'
  lip_h:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: z = 0.4 to 1.6; its top face is the shoulder the seated nut rests on
  pocket_af:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: 'nut''s nominal across-flats: a slip fit above the lip, so the nut''s flats
      (not its corners) drive the knob'
  pocket_depth:
    value: 4
    unit: mm
    kind: design
    source: design
    note: entry 0.4 + lip 1.2 + nut 2.4; roof at 4.0, and the seated nut's bottom
      face lands exactly on the lip's shoulder at 1.6
  groove_af_in:
    value: 7.1
    unit: mm
    kind: design
    source: design
    note: pocket_af + 2 x 0.8 mm wall
  groove_w:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: ''
  groove_af_out:
    value: 9.5
    unit: mm
    kind: design
    source: design
    note: groove_af_in + 2 x groove_w; this ring is what lets the pocket wall bend
      outward instead of crushing
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats (catalog; you could not measure it)
  nut_af_min:
    value: 5.32
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 is 5.5 h13, so the smallest nut you could have is 5.32 across
      flats - the lip (5.2) is sized against this, not against 5.5
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3
  nut_ac:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: across corners = 5.5/cos30; far bigger than the 3.4 mm roof bore, so it
      cannot pass
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: M3 shank of your bolt
  bolt_len:
    value: 20
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3x20, threaded to the head; any M3 with >= 11 mm of free shank
