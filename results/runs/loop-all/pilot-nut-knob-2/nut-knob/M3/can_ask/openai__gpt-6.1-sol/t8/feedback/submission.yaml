task: nut-knob/M3
note: 'Unchanged fit geometry: no usable fit results were available, so there is no
  evidence for tightening or loosening the pockets. The final assembly is one printed
  knob plus one press-in M3 nut; the fit strip is only a test print. Test hand insertion
  and upside-down retention before selecting the final throat size.'
