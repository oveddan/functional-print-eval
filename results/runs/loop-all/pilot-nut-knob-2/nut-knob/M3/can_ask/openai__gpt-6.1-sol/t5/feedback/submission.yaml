task: nut-knob/M3
note: 'Unchanged geometry: there was no usable fit result to justify changing tolerances.
  The relaxed retaining-catch opening is 5.10 mm across opposing flat locations; the
  hex socket is 5.80 mm across flats. Finished assembly is one printed knob plus one
  ISO 4032 M3 nut. The coupon is only a preliminary test. Nominal hardware dimensions
  are used; successful hand insertion and retention must be confirmed on the coupon.'
questions:
- text: Actual nut across-flats width and thickness?
  answer: Unable to measure; use best judgment.
- text: Did the first prints accept and retain the nut?
  answer: No usable fit result supplied for either print.
