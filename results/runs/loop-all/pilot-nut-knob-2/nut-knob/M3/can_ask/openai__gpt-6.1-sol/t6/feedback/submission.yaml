criteria:
- id: hand_insertion_retention
  part: knob
  feature: Six flexible hex walls and inward retaining lips
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - socket_clearance
  - lip_interference
  - spring_wall_t
  - floor_t
  - lip_throat_z
  - corner_slot_width
  check:
    method: coupon
    ref: fit_coupon
    description: 'Nut must insert using thumb pressure alone without cracking or whitening
      the walls. Turn upside down and gently shake: nut must remain captured. This
      fit is not yet verified.'
- id: recessed_nut
  part: knob
  feature: Nut seat below retaining lips
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_height
  - nut_bottom_z
  - lip_under_z
  - height
  check:
    method: coupon
    ref: fit_coupon
    description: Nut must rest flat on the pedestal and be fully below the top. Nominal
      nut top is z=7.2 mm, compared with knob top z=8.2 mm.
- id: stop
  part: knob
  feature: Central annular pedestal and continuous bottom floor
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - pedestal_d
  - nut_bottom_z
  - bolt_d
  - bolt_clearance
  - floor_t
  check:
    method: coupon
    ref: fit_coupon
    description: Firm thumb pressure must not push the nut through the bottom. Check
      for cracks and delamination.
- id: bolt_passage
  part: knob
  feature: 3.5 mm axial through-hole
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - bolt_d
  - bolt_clearance
  check:
    method: coupon
    ref: fit_coupon
    description: Using the intended M3 bolt, confirm it screws freely through the
      captured nut and exits the opposite face without scraping or rotating the nut
      in its socket.
manual:
- n: '1'
  text: Print fit_coupon first, flat underside on the bed and opening upward. Use
    0.2 mm layers, 0.4 mm nozzle, four walls, and 100% infill. Disable supports; keep
    the spring slots and surrounding relief empty. Use the same settings for the final
    knob.
  parts:
  - fit_coupon
  hardware: []
  tool: Bambu Lab X1C slicer
- n: '2'
  text: Allow the coupon to cool. Inspect the six flexible walls and remove loose
    strings without enlarging the lips. Align the nut flats with the hex opening and
    press straight down with your thumb until the nut rests on the central stop. Do
    not hammer or use a screw to force insertion.
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: Confirm that the nut is fully recessed, stays in when inverted and gently
    shaken, and cannot be pressed through the bottom. Thread your intended M3 bolt
    through by hand and confirm it exits the other side. Stop if a wall cracks or
    whitens, or the nut spins. If insertion is too hard, reduce lip_interference by
    0.10 mm and retest; if retention is too loose, increase it by 0.10 mm and retest.
    Apply the same parameter change to both parts.
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '4'
  text: To reuse the test nut, gently spread opposing flexible walls with your fingernails
    while lifting the nut with a loosely threaded M3 bolt. Do not lever against the
    lips with a tool. If removal is difficult, leave the nut in the coupon and use
    another ISO 4032 M3 nut in the final knob.
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '5'
  text: Print knob with the validated settings and parameter values, opening upward
    and without supports. Cool fully and press the nut in as tested. Repeat the retention
    and through-bolt checks. The finished assembly contains one printed knob and one
    nut.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '6'
  text: Use as a captive hand nut on your M3 bolt. Tighten lightly by hand only; do
    not use pliers. This design does not capture a bolt head or lock permanently onto
    a bolt. Keep away from heat and replace the print if retaining walls crack or
    the nut becomes loose.
  parts:
  - knob
  hardware:
  - nut
  tool: null
