task: nut-knob/M3
note: 'Unchanged geometry: no usable fit feedback was available. Nominal 20 mm one-piece
  M3 hand knob with six flexible retaining walls, a recessed nut seat, and a through-hole.
  The 5.15 mm dimension is the retaining-lip throat, not the main socket; the main
  hex socket is 5.8 mm across flats. Fit and retention remain unverified. Print and
  test the optional coupon first. Intended for light hand tightening.'
