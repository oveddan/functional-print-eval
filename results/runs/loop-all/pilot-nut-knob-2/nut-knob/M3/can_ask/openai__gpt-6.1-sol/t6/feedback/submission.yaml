parts:
- id: knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "import math\n\ndef build(p):\n    def hexagon(af):\n        return [(af/math.sqrt(3)*math.cos(math.radians(30+60*i)),\
    \ af/math.sqrt(3)*math.sin(math.radians(30+60*i))) for i in range(6)]\n    def\
    \ prism(af,z,h):\n        return cq.Workplane('XY').workplane(offset=z).polyline(hexagon(af)).close().extrude(h)\n\
    \    def transition(af1,af2,z1,z2):\n        return cq.Workplane('XY').workplane(offset=z1).polyline(hexagon(af1)).close().workplane(offset=z2-z1).polyline(hexagon(af2)).close().loft()\n\
    \    eps=p.boolean_overlap\n    af=p.nut_af+p.socket_clearance\n    outer=af+2*p.spring_wall_t\n\
    \    relief=outer+2*p.relief_width\n    throat=p.nut_af-p.lip_interference\n \
    \   body=cq.Workplane('XY').circle(p.knob_d/2).extrude(p.height)\n    for i in\
    \ range(p.scallop_count):\n        a=2*math.pi*i/p.scallop_count\n        r=p.knob_d/2+p.scallop_center_offset\n\
    \        cut=cq.Workplane('XY').center(r*math.cos(a),r*math.sin(a)).circle(p.scallop_r).extrude(p.height+eps)\n\
    \        body=body.cut(cut)\n    moat=prism(relief,p.floor_t,p.height-p.floor_t+eps).cut(prism(outer,p.floor_t-eps,p.height-p.floor_t+3*eps))\n\
    \    body=body.cut(moat)\n    cavity=prism(af,p.floor_t,p.lip_under_z-p.floor_t)\n\
    \    cavity=cavity.union(transition(af,throat,p.lip_under_z,p.lip_throat_z))\n\
    \    cavity=cavity.union(prism(throat,p.lip_throat_z,p.lip_entry_z-p.lip_throat_z))\n\
    \    cavity=cavity.union(transition(throat,af,p.lip_entry_z,p.height))\n    cavity=cavity.union(prism(af,p.height-eps,2*eps))\n\
    \    body=body.cut(cavity)\n    pedestal=cq.Workplane('XY').circle(p.pedestal_d/2).extrude(p.nut_bottom_z)\n\
    \    body=body.union(pedestal)\n    for i in range(6):\n        length=p.corner_slot_outer_r-p.corner_slot_inner_r\n\
    \        mid=(p.corner_slot_outer_r+p.corner_slot_inner_r)/2\n        slot=cq.Workplane('XY').box(length,p.corner_slot_width,p.height-p.floor_t+eps,centered=(True,True,False)).translate((mid,0,p.floor_t)).rotate((0,0,0),(0,0,1),30+60*i)\n\
    \        body=body.cut(slot)\n    hole=cq.Workplane('XY').circle((p.bolt_d+p.bolt_clearance)/2).extrude(p.height+eps)\n\
    \    return body.cut(hole)\n"
  print_orientation: Flat circular underside on bed at z=0; nut opening and flexible
    lips face up. No supports.
  use_orientation: Nut enters at the top, z=8.2, and seats at z=4.8. Bolt axis is
    Z; bolt may enter from either side.
- id: fit_coupon
  role: coupon
  material: PLA (high-speed PLA, black)
  code: "import math\n\ndef build(p):\n    def hexagon(af):\n        return [(af/math.sqrt(3)*math.cos(math.radians(30+60*i)),af/math.sqrt(3)*math.sin(math.radians(30+60*i)))\
    \ for i in range(6)]\n    def prism(af,z,h):\n        return cq.Workplane('XY').workplane(offset=z).polyline(hexagon(af)).close().extrude(h)\n\
    \    def transition(a,b,z,w):\n        return cq.Workplane('XY').workplane(offset=z).polyline(hexagon(a)).close().workplane(offset=w-z).polyline(hexagon(b)).close().loft()\n\
    \    e=p.boolean_overlap\n    af=p.nut_af+p.socket_clearance\n    outer=af+2*p.spring_wall_t\n\
    \    relief=outer+2*p.relief_width\n    throat=p.nut_af-p.lip_interference\n \
    \   body=cq.Workplane('XY').circle(p.coupon_d/2).extrude(p.height)\n    moat=prism(relief,p.floor_t,p.height-p.floor_t+e).cut(prism(outer,p.floor_t-e,p.height-p.floor_t+3*e))\n\
    \    body=body.cut(moat)\n    cavity=prism(af,p.floor_t,p.lip_under_z-p.floor_t)\n\
    \    cavity=cavity.union(transition(af,throat,p.lip_under_z,p.lip_throat_z))\n\
    \    cavity=cavity.union(prism(throat,p.lip_throat_z,p.lip_entry_z-p.lip_throat_z))\n\
    \    cavity=cavity.union(transition(throat,af,p.lip_entry_z,p.height))\n    cavity=cavity.union(prism(af,p.height-e,2*e))\n\
    \    body=body.cut(cavity).union(cq.Workplane('XY').circle(p.pedestal_d/2).extrude(p.nut_bottom_z))\n\
    \    for i in range(6):\n        length=p.corner_slot_outer_r-p.corner_slot_inner_r\n\
    \        mid=(p.corner_slot_outer_r+p.corner_slot_inner_r)/2\n        slot=cq.Workplane('XY').box(length,p.corner_slot_width,p.height-p.floor_t+e,centered=(True,True,False)).translate((mid,0,p.floor_t)).rotate((0,0,0),(0,0,1),30+60*i)\n\
    \        body=body.cut(slot)\n    return body.cut(cq.Workplane('XY').circle((p.bolt_d+p.bolt_clearance)/2).extrude(p.height+e))\n"
  print_orientation: Flat underside on bed at z=0, opening upward. No supports.
  use_orientation: Same nut insertion direction and socket geometry as knob. Test
    only; not part of finished assembly.
