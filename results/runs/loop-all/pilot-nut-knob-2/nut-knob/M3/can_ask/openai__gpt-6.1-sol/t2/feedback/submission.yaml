    method: coupon
    ref: fit_coupon
    description: Nut must press in using firm thumb pressure only, without cracking
      fingers. Fingers must return inward and retain nut when inverted and gently
      shaken.
- id: seat
  part: knob
  feature: Recessed hex seat and bottom shoulder
  relation: seats
  hardware: nut
  clearance_mm: null
  params:
