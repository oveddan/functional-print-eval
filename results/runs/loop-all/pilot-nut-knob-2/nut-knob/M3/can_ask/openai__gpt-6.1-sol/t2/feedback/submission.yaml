  - nut_h
  - hex_clearance_af
  - floor_h
  - knob_h
  - nut_axial_play
  check:
    method: coupon
    ref: fit_coupon
    description: Nut must rest flat, entirely below top surface, and not spin freely
      during gentle bolt threading. Small axial play is intentional.
- id: passage
  part: knob
  feature: Central through bore
  relation: clears
  hardware: test_bolt
  clearance_mm: 0.25
  params:
  - bolt_d
  - bolt_clearance_d
  check:
    method: coupon
    ref: fit_coupon
    description: Thread bolt through nut by fingers until it exits bottom without
      binding on plastic.
- id: stop
  part: knob
  feature: Bottom shoulder around through bore
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - floor_h
  - nut_af
  - bolt_d
  - bolt_clearance_d
  check:
    method: coupon
    ref: fit_coupon
    description: Firm hand pressure must not push nut through bottom; do not use a
      hammer or press.
manual:
- n: '1'
  text: 'Print fit_coupon first in PLA: 0.4 mm nozzle, 0.2 mm layers, 4 walls, 100%
    infill, no supports. Use variable-width walls if available. Preview continuous
    0.8 mm fingers and open relief slots. Cool fully before testing.'
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Align nut flats with hex seat and press evenly with your thumb until nut
    passes all three catches and rests on shoulder. Do not hammer. Inspect for cracks
    or permanently bent fingers. Invert and gently shake: nut must stay in. Small
    axial movement is intentional.'
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: If hand insertion is too stiff, increase catch_throat_af from 5.2 to 5.3 mm
    and reprint coupon. If nut falls out, decrease to 5.1 mm and retest. If nut binds
    in the hex pocket itself, increase hex_clearance_af by 0.1 mm and repeat all tests.
    These changes are not applied to this submission because no fit outcome was available.
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '4'
  text: Thread test_bolt through captured nut by fingers until it emerges from bottom.
    Check nut does not spin and plastic does not bind. Remove bolt. To reclaim nut,
    gently push it out from below using the bolt's blunt end, keeping fingers clear;
    this may damage coupon catches. Alternatively use another ISO 4032 M3 nut for
    the final knob and repeat fit checks.
  parts:
  - fit_coupon
  hardware:
  - nut
  - test_bolt
  tool: null
- n: '5'
  text: After coupon passes, print knob with successful parameters and identical slicer
    settings, pocket up. Cool fully, press nut in by hand and repeat all retention,
    seating and passage checks. Finished item is one printed knob plus captive nut,
    without glue or separate retaining parts.
  parts:
  - knob
  hardware:
  - nut
  - test_bolt
  tool: null
- n: '6'
  text: Use as a captive-nut hand fastener on an M3 bolt. Start threads gently. Bolt
    can extend through the nut and out the other face. Flat bottom is bearing face
    for thumb-nut use. Tighten by hand only, without pliers. Avoid heat, safety-critical
    loads and repeated nut removal. Replace if cracked or retention fails.
  parts:
  - knob
  hardware:
  - nut
  tool: null
