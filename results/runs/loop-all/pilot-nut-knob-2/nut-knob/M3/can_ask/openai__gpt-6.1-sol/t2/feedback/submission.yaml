- id: retention
  part: knob
  feature: Three spring catches
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - catch_throat_af
  - finger_t
  - finger_w
  - finger_root_z
  - slot_gap
