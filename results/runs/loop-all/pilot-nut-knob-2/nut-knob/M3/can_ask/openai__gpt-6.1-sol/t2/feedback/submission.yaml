task: nut-knob/M3
note: 'Unchanged design: no usable fit result was reported, so there is no basis for
  a dimensional adjustment. The 5.20 mm parameter is the catch throat, not the hex
  pocket: the hex pocket is 5.90 mm across flats. Test hand insertion and upside-down
  retention on the coupon before using the knob. Finished assembly is one printed
  knob plus one captive nut.'
