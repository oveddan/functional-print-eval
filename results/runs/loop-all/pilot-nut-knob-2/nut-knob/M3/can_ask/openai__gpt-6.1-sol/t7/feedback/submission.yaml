    method: measure
    ref: null
    description: Thread an M3 bolt through by turning the knob. The nut must not spin
      inside it during light hand tightening. Recheck inverted retention after several
      tightening cycles.
manual:
- n: '1'
  text: 'Print hand_knob with its closed underside on the bed and the opening upward.
    Use the 0.4 mm nozzle, 0.2 mm layers, at least 4 walls, and 5 top/bottom layers.
    No supports: leave the flexible fingers and their surrounding gaps unobstructed.'
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '2'
  text: Allow the print to cool. Remove loose strings without cutting or bending the
    fingers. Confirm all six fingers are separate above the floor and that the central
    passage is clear.
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '3'
  text: Align each M3 nut flat with one finger. Press straight down by hand until
    the nut rests on the central pedestal, with its top approximately 1 mm below the
    rim. Do not hammer it or use a bolt to force it into place.
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: 'Invert over a tray and lightly shake. Report two results: whether the nut
    could be seated by hand, and whether it remained inside when inverted. The previous
    5.30 mm fit result was unknown, so this reprint intentionally uses the same fit.'
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: If it is loose, increase retention_interference by 0.1 mm and reprint. If
    it cannot be seated by hand, decrease retention_interference by 0.1 mm and reprint.
    Do not accept a loose or cracked part; nominal nut sizes and printer tolerances
    make a physical fit check necessary.
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '6'
  text: Feed your M3 bolt through the closed underside and turn the knob to engage
    the nut. Confirm the bolt passes through the nut and emerges on the open side
    without the nut spinning. Bolt length depends on your application and is not specified
    here.
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '7'
  text: Use for light hand tightening, not wrench-level torque or safety-critical
    clamping. Recheck retention after several cycles and periodically afterward. Keep
    away from heat; PLA fingers may relax over time.
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
