parts:
- id: hand_knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    import math\n    seat = p.knob_h - p.nut_recess - p.nut_thickness\n\
    \    bore = (p.bolt_d + p.bore_allowance)/2\n    body = cq.Workplane('XY').circle(p.knob_d/2).extrude(p.knob_h)\n\
    \    well = cq.Workplane('XY').workplane(offset=p.floor_t).circle(p.well_r).extrude(p.knob_h)\n\
    \    body = body.cut(well)\n    pedestal = cq.Workplane('XY').circle(p.pedestal_r).extrude(seat)\n\
    \    body = body.union(pedestal)\n    z0 = p.floor_t - p.finger_root_overlap\n\
    \    zb = seat + p.bump_start_above_seat\n    zc = zb + p.bump_ramp_h\n    zl\
    \ = p.knob_h - p.entry_lead_h\n    ri = p.finger_inner_r\n    rb = (p.nut_af-p.retention_interference)/2\n\
    \    re = p.nut_af/2+p.entry_extra_radius\n    ro = p.finger_outer_r\n    profile\
    \ = [(ri,z0),(ri,zb),(rb,zc),(rb,zl),(re,p.knob_h),(ro,p.knob_h),(ro,z0)]\n  \
    \  finger = cq.Workplane('XZ').polyline(profile).close().extrude(p.finger_width/2,both=True)\n\
    \    for i in range(int(p.finger_count)):\n        body = body.union(finger.rotate((0,0,0),(0,0,1),i*360/p.finger_count))\n\
    \    for i in range(int(p.grip_count)):\n        a = 2*math.pi*i/p.grip_count\n\
    \        r = p.knob_d/2+p.grip_cut_offset\n        cutter = cq.Workplane('XY').center(r*math.cos(a),r*math.sin(a)).circle(p.grip_cut_r).extrude(p.knob_h)\n\
    \        body = body.cut(cutter)\n    hole = cq.Workplane('XY').circle(bore).extrude(p.knob_h)\n\
    \    return body.cut(hole).clean()\n"
  print_orientation: Closed circular underside on the bed at z=0; nut opening upward.
    No supports.
  use_orientation: Closed underside faces the clamped item. Bolt enters through that
    underside, threads through the captive nut, and emerges into the open top.
