task: nut-knob/M3
note: 'Unchanged fit: the feedback on the 5.30 mm retaining opening was inconclusive,
  so there is no basis to tighten or loosen it yet. This is a one-piece knob with
  six flexible retaining fingers, a recessed nut seat, and a bolt passage through
  the opposite face. Please check hand insertion and inverted retention on this reprint.'
