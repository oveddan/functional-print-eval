task: nut-knob/M3
note: 'Unchanged fit dimensions for this reprint: the retaining-lip opening is 5.20
  mm across flats; the larger hex socket below it is 5.75 mm across flats. No usable
  fit result was reported, so there is no evidence for changing either dimension.
  The finished knob is one printed piece. Print the coupon first to verify hand insertion,
  retention and bolt passage with your nut.'
questions:
- text: Actual nut dimensions?
  answer: Measurement unavailable; using ISO 4032 M3 catalog nominal dimensions.
- text: Previous print fit result?
  answer: Unable to report the result for either part.
