parts:
- id: knob
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    def hex_points(af):\n        r=af/math.sqrt(3)\n\
    \        return [(r*math.cos(i*math.pi/3),r*math.sin(i*math.pi/3)) for i in range(6)]\n\
    \    body=cq.Workplane('XY').circle(p.knob_d/2).extrude(p.height)\n    for i in\
    \ range(int(p.scallop_count)):\n        a=2*math.pi*i/p.scallop_count\n      \
    \  cutter=cq.Workplane('XY').center(p.scallop_center_radius*math.cos(a),p.scallop_center_radius*math.sin(a)).circle(p.scallop_radius).extrude(p.height)\n\
    \        body=body.cut(cutter)\n    af=p.nut_af+p.hex_clearance\n    pocket=cq.Workplane('XY').workplane(offset=p.floor).polyline(hex_points(af)).close().extrude(p.height-p.floor)\n\
    \    entry=(cq.Workplane('XY').workplane(offset=p.height-p.lead_h).polyline(hex_points(af)).close().workplane(offset=p.lead_h).polyline(hex_points(af+p.hex_entry_extra)).close().loft())\n\
    \    body=body.cut(pocket).cut(entry)\n    bore=cq.Workplane('XY').circle((p.bolt_d+p.bolt_clearance)/2).extrude(p.height)\n\
    \    body=body.cut(bore)\n    a=(p.nut_af-p.grip_interference)/2\n    for s in\
    \ [-1,1]:\n        slot=(cq.Workplane('XY').center((p.slot_start_x+p.slot_end_x)/2,s*(p.slot_inner_y+p.slot_outer_y)/2).rect(p.slot_end_x-p.slot_start_x,p.slot_outer_y-p.slot_inner_y).extrude(p.height))\n\
    \        body=body.cut(slot)\n        profile=[(s*a,0),(s*(a+p.beam_t),0),(s*(a+p.beam_t),p.height),(s*(a+p.lead_relief),p.height),(s*a,p.height-p.lead_h)]\n\
    \        beam=(cq.Workplane('YZ',origin=(p.beam_root_x,0,0)).polyline(profile).close().extrude(p.beam_tip_x-p.beam_root_x))\n\
    \        body=body.union(beam)\n    return body.clean()\n"
  print_orientation: Flat underside on bed at z=0; socket upward. No supports.
  use_orientation: Nut enters from z=6 and seats on the z=2 shoulder. Bolt axis is
    Z.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    import math\n    def hp(af):\n        r=af/math.sqrt(3)\n\
    \        return [(r*math.cos(i*math.pi/3),r*math.sin(i*math.pi/3)) for i in range(6)]\n\
    \    body=cq.Workplane('XY').circle(p.coupon_d/2).extrude(p.height)\n    af=p.nut_af+p.hex_clearance\n\
    \    pocket=cq.Workplane('XY').workplane(offset=p.floor).polyline(hp(af)).close().extrude(p.height-p.floor)\n\
    \    entry=cq.Workplane('XY').workplane(offset=p.height-p.lead_h).polyline(hp(af)).close().workplane(offset=p.lead_h).polyline(hp(af+p.hex_entry_extra)).close().loft()\n\
    \    body=body.cut(pocket).cut(entry).cut(cq.Workplane('XY').circle((p.bolt_d+p.bolt_clearance)/2).extrude(p.height))\n\
    \    a=(p.nut_af-p.grip_interference)/2\n    for s in [-1,1]:\n        body=body.cut(cq.Workplane('XY').center((p.slot_start_x+p.slot_end_x)/2,s*(p.slot_inner_y+p.slot_outer_y)/2).rect(p.slot_end_x-p.slot_start_x,p.slot_outer_y-p.slot_inner_y).extrude(p.height))\n\
    \        profile=[(s*a,0),(s*(a+p.beam_t),0),(s*(a+p.beam_t),p.height),(s*(a+p.lead_relief),p.height),(s*a,p.height-p.lead_h)]\n\
    \        beam=cq.Workplane('YZ',origin=(p.beam_root_x,0,0)).polyline(profile).close().extrude(p.beam_tip_x-p.beam_root_x)\n\
    \        body=body.union(beam)\n    return body.clean()\n"
  print_orientation: Flat underside on bed at z=0, socket upward. No supports.
  use_orientation: Test with the same nut and bolt intended for the finished knob.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
- id: bolt
  ref: ISO 4762 M3x16
  qty: 1
joints:
- id: threaded_connection
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: Central 3.4 mm through bore; bolt head remains outside the knob or against
      the workpiece.
    role: clearance
  - part: knob
    feature: Recessed hex nut socket with bottom seat at z=2 mm.
    role: nut_pocket
  nut: nut
  external: null
criteria:
- id: hand_insertion_and_retention
  part: knob
  feature: Two compliant grip walls with lead-in ramps, nominal gap 5.30 mm.
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - grip_interference
  - beam_t
  - lead_h
  - lead_relief
  check:
    method: coupon
    ref: fit_coupon
    description: 'Insert nut fully with fingers only. Invert and gently tap: nut must
      remain captive. Reject whitening, cracks, or permanent spreading. Fit remains
      unverified because no usable print feedback was supplied.'
- id: closed_bottom
  part: knob
  feature: Bottom shoulder surrounding clearance bore.
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - floor
  - nut_af
  - nut_thickness
  - bolt_d
  - bolt_clearance
  - slot_inner_y
  check:
    method: coupon
    ref: fit_coupon
    description: Nut must seat fully below the top face and cannot pass through the
      bottom bore. Verify it bears on the shoulder under light tightening.
- id: through_bolt
  part: knob
  feature: Axial clearance bore.
  relation: clears
  hardware: bolt
  clearance_mm: 0.2
  params:
  - bolt_d
  - bolt_clearance
  check:
    method: coupon
    ref: fit_coupon
    description: Thread bolt through nut from either direction and confirm it emerges
      through the other face without binding on plastic.
- id: anti_rotation
  part: knob
  feature: Remaining rigid hex faces surrounding nut corners.
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - hex_clearance
  - slot_inner_y
  check:
    method: coupon
    ref: fit_coupon
    description: Hold bolt and gently turn coupon in both directions. Nut must not
      spin freely or escape. Do not tighten against a jammed bolt.
manual:
- n: '1'
  text: Print fit_coupon first using PLA, 0.4 mm nozzle, 0.2 mm layers, 4 wall loops
    and solid infill. Socket faces upward; no supports. Check the slicer preserves
    the full-height spring isolation slots. Use your normal elephant-foot compensation.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Remove loose strings from slots without thinning the spring faces. Align two
    nut flats with the two spring faces and press squarely down to the shoulder with
    fingers only. Do not hammer or use pliers. The nut should be completely below
    the top surface.
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: 'Turn upside down and gently tap: the nut must stay in. Check bolt passage
    and gentle turning in both directions. If insertion is too hard, reduce grip_interference
    by 0.1 mm and reprint; if loose, increase it by 0.1 mm. Do not exceed 0.4 mm total
    interference. Stop and revise the fit if retention still fails or any spring cracks
    or whitens. The current 5.30 mm setting is unchanged because no fit result was
    available.'
  parts:
  - fit_coupon
  hardware:
  - nut
  - bolt
  tool: null
- n: '4'
  text: Recover the nut by threading the bolt into it from the underside and gently
    pushing it toward the open socket while supporting the coupon. Print knob using
    the successful setting and the same filament and slicer settings. Only knob is
    part of the finished assembly.
  parts:
  - fit_coupon
  - knob
  hardware:
  - nut
  - bolt
  tool: null
- n: '5'
  text: Press nut into knob as tested; repeat the inversion and through-bolt checks.
    No glue or extra printed retainer is needed. The listed M3x16 bolt is a test/use
    option; required usable length depends on your workpiece. This knob captures the
    nut, not the bolt head.
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: null
- n: '6'
  text: 'Use light finger tightening only, with the workpiece against the underside
    so the nut bears on its shoulder. Stop if the nut spins or retention weakens.
    PLA can relax with time and heat: check retention before use and keep away from
    hot environments.'
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: null
