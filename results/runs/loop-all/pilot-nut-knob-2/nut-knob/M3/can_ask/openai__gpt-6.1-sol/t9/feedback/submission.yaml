task: nut-knob/M3
note: 'Resubmitted unchanged in fit: 5.30 mm between compliant grip faces. No usable
  fit feedback was available, so no clearance adjustment is justified. Print the coupon
  first; hand insertion and upside-down retention must be verified before relying
  on the knob. Final knob is one printed piece; coupon is optional test waste. This
  is a female threaded knob holding an M3 nut, not a bolt-head capture knob.'
