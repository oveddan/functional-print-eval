manual:
- n: '1'
  text: Print the knob with its flat bottom face (Z=0) on the build plate so the hexagonal
    nut pocket faces upward (+Z). No supports required.
  parts:
  - knob
  hardware:
  - m3_nut
  tool: 3D printer
- n: '2'
  text: Inspect the printed part and ensure the central 3.4 mm hole and the hexagonal
    pocket are clean.
  parts:
  - knob
  hardware:
  - m3_nut
  tool: null
- n: '3'
  text: Place the M3 hex nut (ISO 4032) into the top circular pilot opening of the
    knob and rotate slightly until its flats align with the hexagonal pocket.
  parts:
  - knob
  hardware:
  - m3_nut
  tool: null
- n: '4'
  text: Press the nut firmly into the pocket using your thumb or by pressing the knob
    down against a table until it seats against the bottom shoulder.
  parts:
  - knob
  hardware:
  - m3_nut
  tool: null
- n: '5'
  text: Confirm the nut is fully recessed below the top rim and remains captive when
    the knob is turned upside down.
  parts:
  - knob
  hardware:
  - m3_nut
  tool: null
- n: '6'
  text: Thread the knob onto your M3 bolt to tighten or loosen by hand without tools.
  parts:
  - knob
  hardware:
  - m3_nut
  tool: null
