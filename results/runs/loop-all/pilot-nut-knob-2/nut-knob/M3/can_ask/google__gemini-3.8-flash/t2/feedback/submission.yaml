  knob_dia:
    value: 20
    unit: mm
    kind: design
    source: design
    note: Outer diameter across lobes of the hand knob
  pocket_af:
    value: 5.58
    unit: mm
    kind: design
    source: design
    note: Hex pocket width across flats (5.5 mm + 0.08 mm press-fit allowance)
  knob_h:
    value: 8
    unit: mm
    kind: design
    source: design
    note: Total height / thickness of the hand knob
  bolt_clearance_dia:
    value: 3.4
    unit: mm
