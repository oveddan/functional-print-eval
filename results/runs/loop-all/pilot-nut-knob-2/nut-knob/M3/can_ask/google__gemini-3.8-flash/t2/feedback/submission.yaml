parts:
- id: knob
  role: final
  material: PLA
  code: "import math\nimport cadquery as cq\n\ndef build(p):\n    # Base cylindrical\
    \ body\n    knob = cq.Workplane(\"XY\").circle(p.knob_dia / 2.0).extrude(p.knob_h)\n\
    \n    # Chamfer top and bottom outer perimeter edges for hand comfort\n    knob\
    \ = knob.edges(\">Z\").chamfer(p.edge_chamfer)\n    knob = knob.edges(\"<Z\").chamfer(p.edge_chamfer)\n\
    \n    # Cut finger grip scallops around perimeter\n    scallop_pts = []\n    for\
    \ i in range(int(p.scallop_count)):\n        angle = i * (2.0 * math.pi / p.scallop_count)\n\
    \        x = p.scallop_center_r * math.cos(angle)\n        y = p.scallop_center_r\
    \ * math.sin(angle)\n        scallop_pts.append((x, y))\n\n    scallops = (\n\
    \        cq.Workplane(\"XY\")\n        .pushPoints(scallop_pts)\n        .circle(p.scallop_r)\n\
    \        .extrude(p.knob_h + 2.0)\n        .translate((0, 0, -1.0))\n    )\n \
    \   knob = knob.cut(scallops)\n\n    # Central bolt clearance through-hole\n \
    \   bolt_hole = (\n        cq.Workplane(\"XY\")\n        .circle(p.bolt_clearance_dia\
    \ / 2.0)\n        .extrude(p.knob_h + 2.0)\n        .translate((0, 0, -1.0))\n\
    \    )\n    knob = knob.cut(bolt_hole)\n\n    # Hexagonal pocket for M3 nut\n\
    \    # Polygon diameter in CadQuery is vertex-to-vertex diameter: AF / cos(30\
    \ deg) = AF * 2 / sqrt(3)\n    hex_corner_dia = p.pocket_af * 2.0 / math.sqrt(3.0)\n\
    \    hex_cut_z_start = p.knob_h - p.pocket_depth\n    hex_cut_len = p.pocket_depth\
    \ + 1.0\n\n    hex_pocket = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=hex_cut_z_start)\n\
    \        .polygon(6, hex_corner_dia)\n        .extrude(hex_cut_len)\n    )\n \
    \   knob = knob.cut(hex_pocket)\n\n    # Circular lead-in pilot counterbore at\
    \ top face for easy nut insertion\n    pilot_z_start = p.knob_h - p.pilot_depth\n\
    \    pilot_cut_len = p.pilot_depth + 1.0\n    pilot_cut = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=pilot_z_start)\n        .circle(p.pilot_dia /\
    \ 2.0)\n        .extrude(pilot_cut_len)\n    )\n    knob = knob.cut(pilot_cut)\n\
    \n    return knob\n"
  print_orientation: Bottom face (Z=0) flat on the build plate, with the hex pocket
    facing upward (+Z). 100% support-free.
  use_orientation: Hex pocket faces inward toward the user/thumb, clamping face on
    the bottom against the workpiece. An M3 bolt passes straight through the knob
    and threads into the captive nut.
