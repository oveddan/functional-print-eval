task: nut-knob/M3
note: One-piece ergonomic 20 mm hand knob for an M3 bolt. Features 6 finger grip scallops,
  a captive press-fit M3 hex nut pocket with pilot alignment recess, a solid 4.8 mm
  internal load-bearing shoulder, and a complete 3.4 mm bolt through-hole.
questions: []
