manual:
- n: '1'
  text: 'Print the nut-coupon (pocket face down). Press an M3 nut into each of its
    three pockets (5.50, 5.55 and 5.60 mm across flats) and turn it upside down. Choose
    the tightest pocket that you can still press in by hand and that keeps the nut
    when inverted. If it is not the 5.55 one, change pocket_af_clr in the knob to
    match: 0.0, 0.05 or 0.1.'
  parts:
  - nut-coupon
  hardware:
  - nut
  tool: null
- n: '2'
  text: Print the knob with the nut-pocket face on the bed (top up), PLA, 0.2 mm layers,
    at least 3 walls.
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Align a nut's flats with the hex pocket in the flat face and press it in with
    your thumb until it is fully inside, recessed below the face. Pressing it against
    a flat surface helps keep it square.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Thread your M3 bolt into the nut from the pocket side. It goes through the
    nut and can come out of the hole on top of the knob. Turn the knob to tighten.
  parts:
  - knob
  hardware:
  - nut
  tool: null
