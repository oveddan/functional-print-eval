task: nut-knob/M3
note: I still don't know how the 5.55 mm pocket fits. Your last report said only that
  the 5.45 mm pocket was too tight for the nut, and you couldn't tell me about the
  5.55 mm one. The knob keeps the 5.55 mm pocket as an unconfirmed guess. I changed
  the coupon pockets to 5.50, 5.55 and 5.60 mm, which are the sizes between "too tight"
  and my earlier loose guess, so the coupon will show which fits. The knob's pocket
  size might need to change after that test. The bolt is yours, so I didn't list it
  as hardware.
questions: []
params:
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: M3 bolt major diameter
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 thickness
  knob_d:
    value: 20
    unit: mm
    kind: world
    source: asked
    note: about 20 mm across
  knob_h:
    value: 8
    unit: mm
    kind: design
    source: design
    note: ''
  pocket_af_clr:
    value: 0.05
    unit: mm
    kind: design
    source: guessed
    note: 5.55 mm pocket. The 5.45 mm pocket (-0.05) was reported as 'won't go in'.
      The 5.55 and 5.65 results are not known, so this value is still unconfirmed.
  pocket_depth_margin:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: pocket is deeper than the nut so it sits fully inside, slightly recessed
  hole_clr:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: bolt clearance hole = bolt_d + this
  n_scallops:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
  scallop_r:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_clr_a:
    value: 0.0
    unit: mm
    kind: design
    source: design
    note: 5.50 mm; -0.05 was too tight to fit
  coupon_clr_b:
    value: 0.05
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_clr_c:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_h:
    value: 5
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    r = p.knob_d / 2.0\n    body = cq.Workplane('XY').circle(r).extrude(p.knob_h)\n\
    \    for i in range(int(p.n_scallops)):\n        a = 2 * math.pi * i / p.n_scallops\n\
    \        d = r + 0.4 * p.scallop_r\n        cut = (cq.Workplane('XY').center(d\
    \ * math.cos(a), d * math.sin(a))\n               .circle(p.scallop_r).extrude(p.knob_h))\n\
    \        body = body.cut(cut)\n    af = p.nut_af + p.pocket_af_clr\n    depth\
    \ = p.nut_h + p.pocket_depth_margin\n    pocket = cq.Workplane('XY').polygon(6,\
    \ af / math.cos(math.radians(30))).extrude(depth)\n    body = body.cut(pocket)\n\
    \    hole = cq.Workplane('XY').circle((p.bolt_d + p.hole_clr) / 2.0).extrude(p.knob_h)\n\
    \    return body.cut(hole)\n"
  print_orientation: Nut-pocket face flat on the bed, knob top facing up
  use_orientation: Pocket face toward the work, bolt end entering the pocket from
    below, knob on top
- id: nut-coupon
  role: coupon
  material: PLA
  code: "import math\ndef build(p):\n    w = 10.0\n    clrs = [p.coupon_clr_a, p.coupon_clr_b,\
    \ p.coupon_clr_c]\n    body = cq.Workplane('XY').center(w, 0).rect(w * 3, w).extrude(p.coupon_h)\n\
    \    depth = p.nut_h + p.pocket_depth_margin\n    for i, c in enumerate(clrs):\n\
    \        x = i * w + w / 2.0\n        af = p.nut_af + c\n        pk = (cq.Workplane('XY').center(x,\
    \ 0)\n              .polygon(6, af / math.cos(math.radians(30))).extrude(depth))\n\
    \        hl = cq.Workplane('XY').center(x, 0).circle((p.bolt_d + p.hole_clr) /\
    \ 2.0).extrude(p.coupon_h)\n        body = body.cut(pk).cut(hl)\n    return body.translate((-w\
    \ * 0.5, 0, 0))\n"
  print_orientation: Pocket face flat on the bed
  use_orientation: 'Test only: press an M3 nut into each pocket'
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
