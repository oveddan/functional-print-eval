task: nut-knob/M3
note: Single-piece fluted M3 hand knob (20 mm OD, 12 mm height) with a 5.55 mm across-flats
  internal hex pocket, paired with an 8-step nut_fit_coupon (5.45 mm to 5.80 mm AF
  in 0.05 mm steps) to dial in the exact hand press-fit.
questions: []
params:
  taper_h:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: Height of 45-degree supportless transition from boss_od to knob_od
  coupon_pocket_count:
    value: 8
    unit: count
    kind: design
    source: design
    note: Number of stepped hex pockets on test coupon (5.45 to 5.80 mm AF)
  coupon_w:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Width of test coupon strip
  boss_od:
    value: 11
    unit: mm
    kind: design
    source: design
    note: Outer diameter of bottom clamping boss
  bolt_clearance_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: Through-bore diameter for M3 bolt clearance; smaller than 5.5 mm nut AF
      so the nut cannot push out the far side
  coupon_h:
    value: 5
    unit: mm
    kind: design
    source: design
    note: Height of multi-pocket test coupon
  flute_count:
    value: 8
    unit: count
    kind: design
    source: design
    note: Number of finger grip flutes around perimeter
  nut_pocket_depth:
    value: 2.8
    unit: mm
    kind: design
    source: design
    note: Depth of hex pocket from top face (2.8 mm > 2.4 mm nut height so nut sits
      fully inside)
  coupon_step_clearance:
    value: 0.05
    unit: mm
    kind: design
    source: design
    note: Step increment of AF clearance on test coupon (0.05 mm)
  m3_nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut width across flats
  coupon_pitch:
    value: 11
    unit: mm
    kind: design
    source: design
    note: Center-to-center spacing of test pockets on coupon
  boss_h:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Height of bottom clamping boss cylinder
  m3_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal thread diameter of M3 bolt
  knob_h:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Overall height of the hand knob
  m3_pitch:
    value: 0.5
    unit: mm
    kind: hardware
    source: catalog
    note: M3 thread pitch
  flute_offset:
    value: 10.8
    unit: mm
    kind: design
    source: design
    note: Radial distance from center to flute cutter axis
  knob_od:
    value: 20
    unit: mm
    kind: design
    source: design
    note: Outer diameter of the hand knob (~20 mm requested)
  flute_r:
    value: 2.2
    unit: mm
    kind: design
    source: design
    note: Radius of each finger flute cutout
  coupon_min_clearance:
    value: -0.05
    unit: mm
    kind: design
    source: design
    note: Minimum AF clearance on test coupon (-0.05 mm -> 5.45 mm AF)
  nut_af_clearance:
    value: 0.05
    unit: mm
    kind: design
    source: design
    note: Clearance added to nominal nut AF for the hex pocket (0.05 mm -> 5.55 mm
      AF)
  m3_nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 hex nut thickness/height
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    # 1. Bottom boss cylinder (z = 0 to p.boss_h)\n\
    \    boss = cq.Workplane(\"XY\").circle(p.boss_od / 2.0).extrude(p.boss_h)\n\n\
    \    # 2. Supportless 45-deg conical transition (z = p.boss_h to p.boss_h + p.taper_h)\n\
    \    taper = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.boss_h)\n\
    \        .circle(p.boss_od / 2.0)\n        .workplane(offset=p.taper_h)\n    \
    \    .circle(p.knob_od / 2.0)\n        .loft(combine=False)\n    )\n\n    # 3.\
    \ Upper grip cylinder (z = p.boss_h + p.taper_h to p.knob_h)\n    grip_h = p.knob_h\
    \ - p.boss_h - p.taper_h\n    grip = (\n        cq.Workplane(\"XY\")\n       \
    \ .workplane(offset=p.boss_h + p.taper_h)\n        .circle(p.knob_od / 2.0)\n\
    \        .extrude(grip_h)\n    )\n\n    body = boss.union(taper).union(grip)\n\
    \n    # Cut finger flutes around the outer perimeter\n    for i in range(int(p.flute_count)):\n\
    \        angle = 2.0 * math.pi * i / p.flute_count\n        fx = p.flute_offset\
    \ * math.cos(angle)\n        fy = p.flute_offset * math.sin(angle)\n        flute\
    \ = (\n            cq.Workplane(\"XY\")\n            .center(fx, fy)\n       \
    \     .circle(p.flute_r)\n            .extrude(p.knob_h)\n        )\n        body\
    \ = body.cut(flute)\n\n    # Coaxial through-bore for the M3 bolt\n    bolt_hole\
    \ = (\n        cq.Workplane(\"XY\")\n        .circle(p.bolt_clearance_d / 2.0)\n\
    \        .extrude(p.knob_h)\n    )\n    body = body.cut(bolt_hole)\n\n    # Recessed\
    \ hexagonal pocket from top face with solid bottom floor at z = p.knob_h - p.nut_pocket_depth\n\
    \    pocket_z0 = p.knob_h - p.nut_pocket_depth\n    pocket_af = round(p.m3_nut_af\
    \ + p.nut_af_clearance, 4)\n    pocket_ac = pocket_af / math.cos(math.pi / 6.0)\n\
    \    hex_pocket = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=pocket_z0)\n\
    \        .polygon(6, pocket_ac)\n        .extrude(p.nut_pocket_depth)\n    )\n\
    \    body = body.cut(hex_pocket)\n\n    return body\n"
  print_orientation: Bottom boss face flat on the print bed (z = 0), hex nut pocket
    opening upward at z = 12 mm; prints without supports.
  use_orientation: Coaxial with the M3 bolt; bolt passes through the captured M3 nut
    and out the far side.
- id: nut_fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    n = int(p.coupon_pocket_count)\n    total_l\
    \ = n * p.coupon_pitch\n    body = (\n        cq.Workplane(\"XY\")\n        .box(total_l,\
    \ p.coupon_w, p.coupon_h, centered=(True, True, False))\n    )\n\n    pocket_z0\
    \ = p.coupon_h - p.nut_pocket_depth\n    start_x = -((n - 1) * p.coupon_pitch)\
    \ / 2.0\n\n    for i in range(n):\n        cx = start_x + i * p.coupon_pitch\n\
    \        af = round(p.m3_nut_af + p.coupon_min_clearance + i * p.coupon_step_clearance,\
    \ 4)\n        ac = af / math.cos(math.pi / 6.0)\n\n        bolt_hole = (\n   \
    \         cq.Workplane(\"XY\")\n            .center(cx, 0)\n            .circle(p.bolt_clearance_d\
    \ / 2.0)\n            .extrude(p.coupon_h)\n        )\n        body = body.cut(bolt_hole)\n\
    \n        hex_pocket = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=pocket_z0)\n\
    \            .center(cx, 0)\n            .polygon(6, ac)\n            .extrude(p.nut_pocket_depth)\n\
    \        )\n        body = body.cut(hex_pocket)\n\n    return body\n"
  print_orientation: Flat bottom face on the print bed (z = 0), stepped hex pockets
    opening upward.
  use_orientation: Test coupon with 8 stepped hex pockets (5.45 mm to 5.80 mm AF)
    for checking hand press-fit and retention of the ISO 4032 M3 nut.
hardware:
- id: m3_nut
  ref: ISO 4032 M3
  qty: 1
- id: m3_bolt
  ref: ISO 4762 M3x20
  qty: 1
joints:
- id: knob_m3_joint
  fastener: m3_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 12.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: hex_nut_pocket
    role: nut_pocket
  - part: knob
    feature: bolt_clearance_bore
    role: clearance
  nut: m3_nut
  external: null
criteria:
- id: nut_press_fit_retention
  part: knob
  feature: hex_nut_pocket
  relation: seats
  hardware: m3_nut
  clearance_mm: 0.05
  params:
  - m3_nut_af
  - m3_nut_h
  - nut_af_clearance
  - nut_pocket_depth
  check:
    method: coupon
    ref: nut_fit_coupon
    description: Press the ISO 4032 M3 nut into the hex pocket by hand; verify it
      seats on the internal floor below the top surface and stays in when turned upside
      down.
- id: bolt_through_clearance
  part: knob
  feature: bolt_clearance_bore
  relation: clears
  hardware: m3_bolt
  clearance_mm: 0.4
  params:
  - m3_d
  - bolt_clearance_d
  - knob_h
  - nut_pocket_depth
  check:
    method: measure
    ref: null
    description: Pass the M3 bolt through the nut and through the bottom clearance
      bore; verify the bolt passes freely out the far side while the solid pocket
      floor prevents the nut from pushing through.
manual:
- n: '1'
  text: Test-fit the ISO 4032 M3 hex nut into the stepped hex pockets of nut_fit_coupon
    (from 5.45 mm to 5.80 mm across flats) to verify the hand press-fit, then press
    the M3 nut by hand into the top hex pocket of the knob until it seats on the internal
    floor inside the knob. Turn the knob upside down to verify the nut stays retained.
  parts:
  - nut_fit_coupon
  - knob
  hardware:
  - m3_nut
  tool: null
- n: '2'
  text: Thread the M3 bolt through the captured nut and through the coaxial clearance
    bore so it passes out the far side of the knob.
  parts:
  - knob
  hardware:
  - m3_bolt
  tool: null
