task: nut-knob/M5
note: Single-piece 3D printed M5 hand knob with internal shoulder and hex pocket,
  paired with a multi-size coupon to verify hand-press fit and upside-down retention.
questions: []
params:
  scallop_pitch_radius:
    value: 16
    unit: mm
    kind: design
    source: design
    note: Radial center distance for finger scallops
  scallop_radius:
    value: 4
    unit: mm
    kind: design
    source: design
    note: Radius of finger grip cutout scallops
  chamfer_depth:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Lead-in chamfer depth at pocket entry
  knob_height:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Overall height/thickness of the hand knob
  pocket_af:
    value: 8.1
    unit: mm
    kind: design
    source: design
    note: Hex pocket width across flats
  bolt_nominal_diameter:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 bolt nominal thread diameter
  shoulder_thickness:
    value: 6.5
    unit: mm
    kind: design
    source: design
    note: Thickness of solid plastic shoulder supporting nut against push-through
  chamfer_top_diameter:
    value: 10.5
    unit: mm
    kind: design
    source: design
    note: Top diameter of pocket entrance lead-in chamfer
  knob_outer_diameter:
    value: 30
    unit: mm
    kind: design
    source: design
    note: Nominal outer diameter of hand knob across peaks
  nut_height:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut nominal height
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut width across flats
  num_scallops:
    value: 6
    unit: count
    kind: design
    source: design
    note: Number of ergonomic finger grip scallops
  pocket_depth:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Depth of hex nut pocket (recesses 4.7 mm nut fully)
  bolt_clearance_diameter:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: Clearance hole diameter for M5 bolt shank
parts:
- id: m5_hand_knob
  role: final
  material: PLA
  code: "import math\nimport cadquery as cq\n\ndef build(p):\n    # 1. Main cylindrical\
    \ knob body\n    body = (\n        cq.Workplane(\"XY\")\n        .circle(p.knob_outer_diameter\
    \ / 2.0)\n        .extrude(p.knob_height)\n    )\n\n    # 2. Ergonomic finger\
    \ grip scallops around perimeter\n    num_scallops = int(p.num_scallops)\n   \
    \ for i in range(num_scallops):\n        angle_deg = i * (360.0 / num_scallops)\n\
    \        rad = math.radians(angle_deg)\n        cx = p.scallop_pitch_radius *\
    \ math.cos(rad)\n        cy = p.scallop_pitch_radius * math.sin(rad)\n       \
    \ scallop = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=-1.0)\n\
    \            .moveTo(cx, cy)\n            .circle(p.scallop_radius)\n        \
    \    .extrude(p.knob_height + 2.0)\n        )\n        body = body.cut(scallop)\n\
    \n    # 3. Central through-hole for the M5 bolt\n    through_hole = (\n      \
    \  cq.Workplane(\"XY\")\n        .workplane(offset=-1.0)\n        .circle(p.bolt_clearance_diameter\
    \ / 2.0)\n        .extrude(p.knob_height + 2.0)\n    )\n    body = body.cut(through_hole)\n\
    \n    # 4. Hex nut pocket\n    hex_d = p.pocket_af / math.cos(math.radians(30))\n\
    \    pocket_z_start = p.knob_height - p.pocket_depth\n    cutter_height = p.pocket_depth\
    \ + 1.0\n\n    hex_cutter = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=pocket_z_start)\n\
    \        .polygon(6, hex_d)\n        .extrude(cutter_height)\n    )\n    body\
    \ = body.cut(hex_cutter)\n\n    # 5. Lead-in chamfer at pocket entrance for easy\
    \ nut alignment\n    chamfer_bottom_r = p.pocket_af / 2.0\n    chamfer_top_r =\
    \ p.chamfer_top_diameter / 2.0\n    chamfer_cutter = (\n        cq.Workplane(\"\
    XZ\")\n        .moveTo(0, p.knob_height - p.chamfer_depth)\n        .lineTo(chamfer_bottom_r,\
    \ p.knob_height - p.chamfer_depth)\n        .lineTo(chamfer_top_r, p.knob_height\
    \ + 0.1)\n        .lineTo(0, p.knob_height + 0.1)\n        .close()\n        .revolve()\n\
    \    )\n    body = body.cut(chamfer_cutter)\n\n    return body\n"
  print_orientation: Bottom face flat on build bed (z=0), printing upwards along +Z
  use_orientation: Bolt enters clearance hole at z=0 and threads into nut seated inside
    hex pocket
- id: hex_fit_coupon
  role: coupon
  material: PLA
  code: "import math\nimport cadquery as cq\n\ndef build(p):\n    coupon_width = 44.0\n\
    \    coupon_length = 95.0\n    coupon_height = p.pocket_depth + 2.5\n\n    test_sizes\
    \ = [7.9, 8.0, 8.05, 8.1, 8.15, 8.2, 8.25, 8.3, 8.4, 8.5]\n    x_coords = [-36.0,\
    \ -18.0, 0.0, 18.0, 36.0]\n    y_coords = [-11.0, 11.0]\n\n    body = (\n    \
    \    cq.Workplane(\"XY\")\n        .rect(coupon_length, coupon_width)\n      \
    \  .extrude(coupon_height)\n        .edges(\"|Z\")\n        .fillet(3.0)\n   \
    \ )\n\n    idx = 0\n    for y in y_coords:\n        for x in x_coords:\n     \
    \       size = test_sizes[idx]\n            idx += 1\n\n            # Clearance\
    \ hole\n            hole = (\n                cq.Workplane(\"XY\")\n         \
    \       .workplane(offset=-1.0)\n                .moveTo(x, y)\n             \
    \   .circle(p.bolt_clearance_diameter / 2.0)\n                .extrude(coupon_height\
    \ + 2.0)\n            )\n            body = body.cut(hole)\n\n            # Hex\
    \ pocket\n            hex_d = size / math.cos(math.radians(30))\n            pocket_z\
    \ = coupon_height - p.pocket_depth\n            pocket = (\n                cq.Workplane(\"\
    XY\")\n                .workplane(offset=pocket_z)\n                .moveTo(x,\
    \ y)\n                .polygon(6, hex_d)\n                .extrude(p.pocket_depth\
    \ + 1.0)\n            )\n            body = body.cut(pocket)\n\n            #\
    \ Lead-in chamfer\n            chamfer_r_bottom = size / 2.0\n            chamfer_r_top\
    \ = hex_d / 2.0 + 0.6\n            chamfer_cutter = (\n                cq.Workplane(\"\
    XZ\")\n                .moveTo(0, coupon_height - p.chamfer_depth)\n         \
    \       .lineTo(chamfer_r_bottom, coupon_height - p.chamfer_depth)\n         \
    \       .lineTo(chamfer_r_top, coupon_height + 0.1)\n                .lineTo(0,\
    \ coupon_height + 0.1)\n                .close()\n                .revolve()\n\
    \                .translate((x, y, 0))\n            )\n            body = body.cut(chamfer_cutter)\n\
    \n    return body\n"
  print_orientation: Bottom face flat on build bed (z=0), printing upwards along +Z
  use_orientation: Press M5 hex nut into the test pockets to verify fit and retention
hardware:
- id: m5_hex_nut
  ref: ISO 4032 M5
  qty: 1
- id: m5_bolt
  ref: ISO 4762 M5x20
  qty: 1
joints:
- id: knob_bolt_joint
  fastener: m5_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: m5_hand_knob
    feature: through_hole
    role: clearance
  - part: m5_hand_knob
    feature: hex_pocket
    role: nut_pocket
  nut: m5_hex_nut
  external: null
criteria:
- id: nut_retention_in_pocket
  part: m5_hand_knob
  feature: hex_pocket
  relation: contains
  hardware: m5_hex_nut
  clearance_mm: 0.1
  params:
  - pocket_af
  - pocket_depth
  - nut_af
  check:
    method: coupon
    ref: hex_fit_coupon
    description: Press M5 nut into test pockets on the coupon to determine the optimal
      hand-press fit and upside-down retention.
- id: bolt_shank_clearance
  part: m5_hand_knob
  feature: through_hole
  relation: clears
  hardware: m5_bolt
  clearance_mm: 0.4
  params:
  - bolt_clearance_diameter
  - bolt_nominal_diameter
  check:
    method: measure
    ref: null
    description: Verify that the M5 bolt shank passes freely through the through-hole
      without binding.
- id: nut_seats_on_shoulder
  part: m5_hand_knob
  feature: pocket_shoulder
  relation: seats
  hardware: m5_hex_nut
  clearance_mm: 0.0
  params:
  - shoulder_thickness
  - pocket_depth
  - knob_height
  check:
    method: none
    ref: null
    description: Nut seats firmly against the internal shoulder so clamping tension
      pulls against plastic, preventing push-through.
manual:
- n: '1'
  text: Print the 'hex_fit_coupon' to test nut fit across various pocket sizes. Press
    the ISO 4032 M5 hex nut into the test pockets by hand. Identify the pocket that
    presses in smoothly by hand and stays securely held when inverted.
  parts:
  - hex_fit_coupon
  hardware:
  - m5_hex_nut
  tool: null
- n: '2'
  text: Print the 'm5_hand_knob' with the bottom face (z = 0) on the build bed (no
    supports needed). Align the M5 hex nut with the hex pocket on the top face and
    press it firmly into the pocket using thumb pressure until it bottoms out against
    the shoulder. Verify that the nut is fully seated and does not fall out when inverted.
  parts:
  - m5_hand_knob
  hardware:
  - m5_hex_nut
  tool: null
- n: '3'
  text: Pass the M5 bolt through the clearance hole from the bottom and thread it
    into the captive nut. Use the outer finger scallops to hand-tighten the knob securely
    onto your assembly without any tools.
  parts:
  - m5_hand_knob
  hardware:
  - m5_bolt
  - m5_hex_nut
  tool: null
