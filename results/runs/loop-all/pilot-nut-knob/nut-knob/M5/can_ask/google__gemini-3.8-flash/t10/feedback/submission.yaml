parts:
- id: knob
  role: final
  material: PLA
  code: "import cadquery as cq\nimport math\n\ndef build(p):\n    knob_r = p.knob_outer_d\
    \ / 2.0\n    height = p.knob_h\n    shoulder_t = height - p.pocket_depth\n\n \
    \   # 1. Base cylinder\n    body = cq.Workplane(\"XY\").circle(knob_r).extrude(height)\n\
    \n    # 2. Chamfer top and bottom outer perimeter edges\n    body = (\n      \
    \  body.faces(\">Z\").edges().chamfer(p.chamfer_size)\n        .faces(\"<Z\").edges().chamfer(p.chamfer_size)\n\
    \    )\n\n    # 3. Cut finger grip flutes around perimeter\n    flute_pts = [\n\
    \        (\n            p.flute_offset_r * math.cos(i * 2.0 * math.pi / p.flute_count),\n\
    \            p.flute_offset_r * math.sin(i * 2.0 * math.pi / p.flute_count)\n\
    \        )\n        for i in range(int(p.flute_count))\n    ]\n    flutes = (\n\
    \        cq.Workplane(\"XY\")\n        .pushPoints(flute_pts)\n        .circle(p.flute_r)\n\
    \        .extrude(height * 2.0, both=True)\n    )\n    body = body.cut(flutes)\n\
    \n    # 4. Cut hexagonal nut pocket from top face down to shoulder\n    hex_r\
    \ = (p.pocket_af / 2.0) / math.cos(math.pi / 6.0)\n    hex_pts = [\n        (\n\
    \            hex_r * math.cos(math.radians(30.0 + 60.0 * i)),\n            hex_r\
    \ * math.sin(math.radians(30.0 + 60.0 * i))\n        )\n        for i in range(6)\n\
    \    ]\n    pocket = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=shoulder_t)\n\
    \        .polyline(hex_pts)\n        .close()\n        .extrude(p.pocket_depth\
    \ + 1.0)\n    )\n    body = body.cut(pocket)\n\n    # 5. Cut central bolt clearance\
    \ through-hole\n    hole = (\n        cq.Workplane(\"XY\")\n        .circle(p.through_hole_d\
    \ / 2.0)\n        .extrude(height * 2.0, both=True)\n    )\n    body = body.cut(hole)\n\
    \n    return body\n"
  print_orientation: Bottom face flat on print bed (z = 0), nut pocket opening facing
    up (+z)
  use_orientation: Hand-turned clamping knob; orientation depends on application
- id: coupon
  role: coupon
  material: PLA
  code: "import cadquery as cq\nimport math\n\ndef build(p):\n    sizes = [\n    \
    \    p.coupon_af_1,\n        p.coupon_af_2,\n        p.coupon_af_3,\n        p.coupon_af_4,\n\
    \        p.coupon_af_5,\n        p.coupon_af_6,\n        p.coupon_af_7,\n    \
    \    p.coupon_af_8,\n    ]\n    pitch = 14.0\n    margin = 10.0\n    length =\
    \ (len(sizes) - 1) * pitch + 2.0 * margin\n    width = 16.0\n    height = 7.0\n\
    \    pocket_depth = 5.2\n\n    block = cq.Workplane(\"XY\").box(length, width,\
    \ height, centered=(True, True, False))\n\n    start_x = -((len(sizes) - 1) *\
    \ pitch) / 2.0\n    for i, af in enumerate(sizes):\n        cx = start_x + i *\
    \ pitch\n        hex_r = (af / 2.0) / math.cos(math.pi / 6.0)\n        hex_pts\
    \ = [\n            (\n                cx + hex_r * math.cos(math.radians(30.0\
    \ + 60.0 * k)),\n                hex_r * math.sin(math.radians(30.0 + 60.0 * k))\n\
    \            )\n            for k in range(6)\n        ]\n        pocket = (\n\
    \            cq.Workplane(\"XY\")\n            .workplane(offset=height - pocket_depth)\n\
    \            .polyline(hex_pts)\n            .close()\n            .extrude(pocket_depth\
    \ + 1.0)\n        )\n        block = block.cut(pocket)\n\n        hole = (\n \
    \           cq.Workplane(\"XY\")\n            .workplane(offset=-1.0)\n      \
    \      .transformed(offset=(cx, 0, 0))\n            .circle(2.0)\n           \
    \ .extrude(height + 2.0)\n        )\n        block = block.cut(hole)\n\n    return\
    \ block\n"
  print_orientation: Bottom face flat on print bed (z = 0), pockets facing up (+z)
  use_orientation: Test coupon for evaluating M5 nut pocket press-fit
