manual:
- n: '1'
  text: Print the test coupon part in PLA at 0.2 mm layer height. Test press an M5
    hex nut (ISO 4032) into the pockets (ranging 7.90 mm to 8.30 mm) to evaluate hand
    press-fit and upside-down retention.
  parts:
  - coupon
  hardware: []
  tool: 3D printer
- n: '2'
  text: Print the knob part in PLA with 0.2 mm layer height, 4 perimeters, and 25%
    infill. Orient the knob flat on the build plate with the nut pocket facing up
    (z = 0 on bed). No supports needed.
  parts:
  - knob
  hardware: []
  tool: 3D printer
- n: '3'
  text: Take an M5 hex nut (ISO 4032) and align its flats with the hex pocket opening
    on the top face of the knob.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Press the nut firmly into the pocket by hand with thumb pressure until it
    seats against the bottom shoulder. The nut sits 0.8 mm sub-flush inside the knob.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Turn the knob upside down and verify that the nut stays retained inside the
    pocket without glue.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '6'
  text: Thread an M5 bolt through the nut and out the clearance hole on the far side
    to tighten assemblies by hand without tools.
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: null
