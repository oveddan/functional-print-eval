task: nut-knob/M5
note: 'Revision: the hex pocket is now tolerance-forgiving instead of one calculated
  interference. The pocket flats are 7.90 across flats (only 0.10 under nominal 8.00)
  but six narrow crush ribs (0.80 mm wide, 0.15 mm proud, one centred on each flat)
  bring the effective across-flats at the rib tips to 7.60. A nut anywhere in the
  ISO 4032 band (7.80-8.00) — or a pocket that prints 0.1-0.2 mm small — still bites:
  the ribs indent to the nut''s real size, while the loose plain flats stop a big
  nut binding hard. If a rib shears off, the plain-flat fit still grips. Unchanged:
  30 mm scalloped grip, 14 mm tall, pocket 5.2 mm deep so the nut ends 0.5 mm below
  the top face, and the 8.8 mm thick pocket floor (the lip, with the 5.5 mm bolt bore)
  stops the nut being pushed out the far side. New fit coupon uses the same ribbed
  pocket at 7.80/7.90/8.00/8.10 across flats from the index-dot end; 7.90 is the knob''s
  own size, so if the nut rattles in that pocket the printer''s holes are coming out
  large and I''ll re-slice.'
questions:
- text: How thick is the material you are clamping with the bolt? The screw has to
    reach through it plus about 14 mm of knob, and I would like to pin the exact screw
    length rather than suggest M5x30.
  answer: null
- text: 'Once you have printed the coupon: which of the four pockets (7.80, 7.90,
    8.00, 8.10 across flats, the second one being the knob''s) grips your nut best?
    If it is not 7.90 I will re-slice the knob''s pocket to match.'
  answer: null
params:
  knob_dia:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: user asked for about 30 mm across; 30 is the max diameter over the grip
      lands
  knob_h:
    value: 14
    unit: mm
    kind: design
    source: design
    note: gives 8.8 mm of material under the nut pocket floor
  scallop_count:
    value: 8
    unit: count
    kind: design
    source: design
    note: finger scallops around the rim
  scallop_radius:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: radius of the cutter that scoops each finger recess
  scallop_center_r:
    value: 17.0
    unit: mm
    kind: design
    source: design
    note: cutter centres at r=17 with r=5 gives a 3 mm deep scallop on the 15 mm rim
      and ~3.2 mm wide lands between them
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats, nominal. Person could not measure their nut; tolerance
      is 0/-0.2, which the crush ribs absorb
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 nut height
  press_interference:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: pocket across-flats = nut_af - this = 7.90, a light fit on its own; the
      ribs do the gripping
  rib_h:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: how far each rib stands in from its flat; effective across-flats at the
      rib tips = 7.90 - 0.30 = 7.60. Small enough to print as a slight bump and to
      indent by hand
  rib_w:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: rib width along the flat; the flat is 4.56 mm wide so the rib sits clear
      of the corners
  nut_recess:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: nut top face sits this far below the knob top face, so the nut is fully
      inside
  bolt_clearance_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: 'M5 free fit through the pocket floor: 0.5 mm total clearance on a 5.0 mm
      shank'
  lead_in_side:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: per-side widening of the pocket mouth so the nut starts squarely
  lead_in_depth:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: depth of the widened mouth; leaves 4.4 mm of ribbed wall gripping the 4.7
      mm nut
  bolt_length:
    value: null
    unit: mm
    kind: hardware
    source: unknown
    note: 'depends on what is being clamped: the screw must reach through the material
      plus ~14 mm of knob (8.8 mm floor + 5 mm of nut). M5x30 shown in the manual
      as an example'
  coupon_l:
    value: 64
    unit: mm
    kind: design
    source: design
    note: fit coupon bar length
  coupon_w:
    value: 18
    unit: mm
    kind: design
    source: design
    note: fit coupon bar width
  coupon_h:
    value: 8
    unit: mm
    kind: design
    source: design
    note: coupon thickness; leaves 2.8 mm under the 5.2 mm test pockets
  coupon_pitch:
    value: 15
    unit: mm
    kind: design
    source: design
    note: spacing of the four test pockets
  coupon_off_min:
    value: -0.2
    unit: mm
    kind: design
    source: design
    note: first test pocket is 0.20 across-flats TIGHTER than nominal, at the index-dot
      end (7.80)
  coupon_off_step:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: 'each pocket further from the dot is 0.10 looser: 7.80 / 7.90 / 8.00 / 8.10
      across flats; 7.90 is the knob''s own size'
parts:
- id: hand_knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    import math\n    R = p.knob_dia / 2.0\n    H = p.knob_h\n\
    \    n = int(p.scallop_count)\n\n    body = cq.Workplane(\"XY\").circle(R).extrude(H)\n\
    \n    # finger scallops around the rim\n    pts = [(p.scallop_center_r * math.cos(2.0\
    \ * math.pi * i / n),\n            p.scallop_center_r * math.sin(2.0 * math.pi\
    \ * i / n)) for i in range(n)]\n    body = body.cut(cq.Workplane(\"XY\").workplane(offset=-1.0)\n\
    \                    .pushPoints(pts).circle(p.scallop_radius).extrude(H + 2.0))\n\
    \n    def hex_prism(af, z0, z1):\n        # hexagon with a flat normal to +X,\
    \ so af is measured across flats along X\n        ac = af / math.cos(math.radians(30.0))\n\
    \        hp = [(0.5 * ac * math.cos(math.radians(60.0 * i + 30.0)),\n        \
    \       0.5 * ac * math.sin(math.radians(60.0 * i + 30.0))) for i in range(6)]\n\
    \        return (cq.Workplane(\"XY\").workplane(offset=z0)\n                .polyline(hp).close().extrude(z1\
    \ - z0))\n\n    af = p.nut_af - p.press_interference\n    z_floor = H - (p.nut_h\
    \ + p.nut_recess)\n\n    # nut pocket: hex slightly undersized across flats\n\
    \    body = body.cut(hex_prism(af, z_floor, H + 1.0))\n\n    # six crush ribs,\
    \ one centred on each flat: they indent to the nut's actual\n    # across-flats,\
    \ so one pocket size grips the whole ISO 4032 tolerance band\n    rl = p.rib_h\
    \ + 0.3\n    z0 = z_floor - 0.2\n    for i in range(6):\n        rib = (cq.Workplane(\"\
    XY\")\n               .box(rl, p.rib_w, (H + 0.5) - z0, centered=(True, True,\
    \ False))\n               .translate((af / 2.0 + p.rib_h - rl / 2.0, 0.0, z0))\n\
    \               .rotate((0, 0, 0), (0, 0, 1), 60.0 * i))\n        body = body.union(rib)\n\
    \n    # widened mouth, cut after the ribs so it trims their tops\n    body = body.cut(hex_prism(af\
    \ + 2.0 * p.lead_in_side, H - p.lead_in_depth, H + 1.0))\n\n    # bolt clearance\
    \ bore through the pocket floor\n    body = body.cut(cq.Workplane(\"XY\").workplane(offset=-1.0)\n\
    \                    .circle(p.bolt_clearance_d / 2.0).extrude(H + 3.0))\n   \
    \ return body\n"
  print_orientation: Flat underside (the face with the 5.5 mm bolt hole) on the bed
    at z = 0, hex nut pocket opening upward. All walls vertical, no supports, no brim
    needed.
  use_orientation: 'As printed: flat face down against the workpiece, nut pocket at
    the top. Works the same flipped, with the bolt entering through the nut pocket.'
- id: nut_fit_coupon
  role: coupon
  material: PLA (high-speed PLA, black)
  code: "def build(p):\n    import math\n    L, W, H = p.coupon_l, p.coupon_w, p.coupon_h\n\
    \    n = 4\n    body = cq.Workplane(\"XY\").box(L, W, H, centered=(True, True,\
    \ False))\n    z_floor = H - (p.nut_h + p.nut_recess)\n\n    def hex_prism(af,\
    \ cx, z0, z1):\n        ac = af / math.cos(math.radians(30.0))\n        hp = [(cx\
    \ + 0.5 * ac * math.cos(math.radians(60.0 * i + 30.0)),\n               0.5 *\
    \ ac * math.sin(math.radians(60.0 * i + 30.0))) for i in range(6)]\n        return\
    \ (cq.Workplane(\"XY\").workplane(offset=z0)\n                .polyline(hp).close().extrude(z1\
    \ - z0))\n\n    rl = p.rib_h + 0.3\n    z0 = z_floor - 0.2\n    for j in range(n):\n\
    \        af = p.nut_af + p.coupon_off_min + j * p.coupon_off_step\n        x =\
    \ -(n - 1) * p.coupon_pitch / 2.0 + j * p.coupon_pitch\n        body = body.cut(hex_prism(af,\
    \ x, z_floor, H + 1.0))\n        for i in range(6):\n            rib = (cq.Workplane(\"\
    XY\")\n                   .box(rl, p.rib_w, (H + 0.5) - z0, centered=(True, True,\
    \ False))\n                   .translate((af / 2.0 + p.rib_h - rl / 2.0, 0.0,\
    \ z0))\n                   .rotate((0, 0, 0), (0, 0, 1), 60.0 * i)\n         \
    \          .translate((x, 0.0, 0.0)))\n            body = body.union(rib)\n  \
    \      body = body.cut(hex_prism(af + 2.0 * p.lead_in_side, x, H - p.lead_in_depth,\
    \ H + 1.0))\n        body = body.cut(cq.Workplane(\"XY\").workplane(offset=-1.0)\n\
    \                        .pushPoints([(x, 0.0)]).circle(p.bolt_clearance_d / 2.0)\n\
    \                        .extrude(H + 3.0))\n\n    # index dot on the top face\
    \ marks the tightest pocket end\n    body = body.cut(cq.Workplane(\"XY\").workplane(offset=H)\n\
    \                    .pushPoints([(-L / 2.0 + 3.5, -W / 2.0 + 3.5)])\n       \
    \             .circle(0.6).extrude(-1.2))\n    return body\n"
  print_orientation: Flat on the bed at z = 0, the four ribbed hex pockets opening
    upward, index dot on top. No supports.
  use_orientation: As printed, lying flat; press the nut into each pocket from above,
    then flip the bar over to test retention.
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
- id: bolt
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: bolt_through_knob_into_nut
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - -12.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: hand_knob
    feature: bolt_bore_5.5
    role: clearance
  nut: nut
  external: null
criteria:
- id: c1_nut_press_fit
  part: hand_knob
  feature: hex_pocket
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - press_interference
  - rib_h
  - rib_w
  check:
    method: coupon
    ref: nut_fit_coupon
    description: Nut presses into the pocket by hand and stays in when the knob is
      turned upside down and tapped; the crush ribs grip across the whole 7.80-8.00
      nut tolerance band.
- id: c2_ribs_take_up_tolerance
  part: hand_knob
  feature: crush_ribs_6
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - rib_h
  - rib_w
  - press_interference
  check:
    method: coupon
    ref: nut_fit_coupon
    description: Effective across-flats at the rib tips is 7.60; the ribs indent to
      the nut and the nut does not rattle or rock in the pocket.
- id: c3_nut_retained_by_lip
  part: hand_knob
  feature: hex_pocket_floor
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - nut_h
  - nut_recess
  - knob_h
  - bolt_clearance_d
  check:
    method: coupon
    ref: nut_fit_coupon
    description: Nut bottoms on the pocket floor and cannot be pushed out of the far
      side; the 5.5 mm bore is smaller than the nut.
- id: c4_nut_fully_inside
  part: hand_knob
  feature: hex_pocket_depth
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_h
  - nut_recess
  check:
    method: measure
    ref: null
    description: With the nut seated, its top face sits about 0.5 mm below the knob's
      top face - nothing protrudes.
- id: c5_bolt_clears_bore
  part: hand_knob
  feature: bolt_bore_5.5
  relation: clears
  hardware: bolt
  clearance_mm: 0.5
  params:
  - bolt_clearance_d
  check:
    method: measure
    ref: null
    description: Bolt slides through the 5.5 mm bore from the flat underside with
      no binding.
- id: c6_pocket_drives_nut
  part: hand_knob
  feature: hex_pocket
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - press_interference
  - rib_h
  check:
    method: coupon
    ref: nut_fit_coupon
    description: Holding the bolt still and turning the knob turns the nut with it
      - no slipping in the pocket under hand torque.
- id: c7_coupon_finds_fit
  part: nut_fit_coupon
  feature: hex_pockets_4
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - coupon_off_min
  - coupon_off_step
  - nut_af
  check:
    method: coupon
    ref: nut_fit_coupon
    description: Trying the nut in all four ribbed pockets shows which across-flats
      (7.80-8.10) presses in by hand and still holds when the bar is flipped.
manual:
- n: '1'
  text: 'Print the fit coupon first: PLA, 0.2 mm layers, flat on the bed, pockets
    opening up, no supports. It uses the same ribbed pocket as the knob, so it tells
    you whether the knob''s pocket size is right before you commit to the big part.'
  parts:
  - nut_fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Press the M5 hex nut into each of the four pockets by hand, starting at the
    end with the small dot on the top face. From the dot end the pockets are 7.80,
    7.90, 8.00 and 8.10 mm across flats - the second one (7.90) is exactly what the
    knob is sliced at. Each ribbed pocket bites a little; press squarely, do not wiggle
    the nut in and out.
  parts:
  - nut_fit_coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: Flip the coupon over and shake it. If the 7.90 pocket (second from the dot)
    holds the nut and you could still press it in by hand, the knob's pocket is right.
    If the nut rattles or falls out of that pocket, the printer's holes are coming
    out large - tell me and I will re-slice the knob at a tighter across-flats. If
    no pocket lets you press the nut in by hand, tell me and I will re-slice looser.
  parts:
  - nut_fit_coupon
  hardware:
  - nut
  tool: null
- n: '4'
  text: 'Print the knob: flat underside on the bed, hex pocket opening up, no supports.'
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '5'
  text: Press the M5 hex nut into the knob's hex pocket in the top face, flat side
    first, until it bottoms on the pocket floor. Press squarely with both thumbs;
    a light tap on the nut's face with a soft mallet is fine, the pocket floor backs
    it up. The six thin ribs inside the pocket indent to your nut's exact size as
    it goes in - that is what holds it. It should finish about 0.5 mm below the top
    face, fully inside the knob.
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '6'
  text: 'Turn the knob upside down and tap it: the nut must stay in. The pocket floor
    stops it being pushed out the far side.'
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '7'
  text: Push your M5 bolt up through the 5.5 mm hole in the knob's flat underside
    and thread it into the nut; keep turning until the bolt comes out of the top of
    the knob. Any M5 screw long enough works - it must reach through your material
    plus about 14 mm of knob (8.8 mm of pocket floor and 5 mm of nut), so an M5x30
    suits a stack up to roughly 16 mm.
  parts:
  - hand_knob
  hardware:
  - bolt
  - nut
  tool: null
- n: '8'
  text: 'Check the drive: hold the bolt still and turn the knob. The nut must turn
    with the knob (no slipping in the pocket) and the bolt should feed through smoothly.
    The knob is ready to tighten by hand.'
  parts:
  - hand_knob
  hardware:
  - bolt
  - nut
  tool: null
- n: '9'
  text: To remove the nut later, push it out from below with a rod about 5.4 mm across
    through the bolt hole - it presses on the nut's bottom face ring.
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
