manual:
- n: '1'
  text: 'Slice both parts as they sit: flat bottom face on the bed, open mouth and
    fluted rim up. PLA, 0.2 mm layers, 4 perimeters, 25% infill, no supports. Print
    TEST_RING first - 5 g, and it holds the same socket, throat, cone and floor as
    the knob.'
  parts:
  - test_ring
  - hand_knob
  hardware: []
  tool: printer
- n: '2'
  text: Test the fit on TEST_RING. Mouth up, drop the M5 nut in, flats roughly lined
    up, and press it straight down with your thumb. Which of these happens? (a) it
    goes in easily; (b) firm but doable - it squeezes past a tight lip and drops onto
    the floor; (c) impossible with your thumb. If it is (c), try pressing the ring
    down onto the nut on the bench.
  parts:
  - test_ring
  hardware:
  - nut
  tool: null
- n: '3'
  text: 'Turn TEST_RING upside down, shake it hard and tap it on the bench. Does the
    nut stay in, or fall out? If it stayed in, you should be able to see the little
    ledge it has to squeeze past '
  parts:
  - test_ring
  hardware:
  - nut
  tool: null
- n: '4'
  text: 'Tell me which you got: (a) easy, (b) firm but doable, (c) impossible, and
    stayed in or fell out. That is all the information the fit needs - no calipers.
    Easy or fell out means I cut the throat tighter (7.85 down); impossible means
    I cut it looser (7.85 up); firm but doable plus stayed in means the knob you already
    have is right.'
  parts:
  - test_ring
  hardware:
  - nut
  tool: null
- n: '5'
  text: Turn HAND_KNOB mouth up (flat face with the small bolt hole down). Drop the
    M5 nut into the Ø12 mouth, flats lined up with the hexagonal socket, and press
    it straight down with your thumb until it drops past the lip and sits flat on
    the floor of the socket. It should end up 5.3 mm below the knob's top face, fully
    inside.
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '6'
  text: 'Turn the knob upside down and shake it: the nut stays in. That is the captive
    nut - no glue, nothing else to fit.'
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '7'
  text: 'Push the M5 bolt up through the Ø6.2 hole in the knob''s flat face (the chamfer
    guides it) and turn it into the nut by hand until the bolt''s tip appears in the
    mouth. The knob is now a captive hand knob on that bolt: it runs on and off without
    ever losing the nut.'
  parts:
  - hand_knob
  hardware:
  - nut
  - bolt
  tool: null
- n: '8'
  text: Fit the bolt through your workpiece with its head on the far side, then turn
    the knob by hand to tighten. The nut's bottom face presses on the knob's floor
    and the floor presses on your workpiece, so the clamp force travels through 3
    mm of plastic in compression, not through the little retaining ledge. Snug only
    - steel M5 into a plastic-seated nut, so stop when it feels tight rather than
    leaning on it.
  parts:
  - hand_knob
  hardware:
  - nut
  - bolt
  tool: null
- n: '9'
  text: 'Bolt length: the knob needs about 12 mm of shank past your workpiece so the
    tip clears the nut and shows in the mouth. An ISO 4762 M5x30 does that for workpieces
    up to roughly 18 mm thick; longer just sticks out further, shorter still works
    if it reaches through the nut at all.'
  parts:
  - hand_knob
  hardware:
  - bolt
  tool: null
