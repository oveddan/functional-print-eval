task: nut-knob/M5
note: 'UNCHANGED geometry. Your print report contained no dimension I can act on (you
  could not judge the 7.85 mm pocket in either part), so every number in the parts
  is exactly what you already printed. Reworking the throat on a guess would only
  trade one unknown for another. What I changed is the check: the test ring is now
  judged by three things your hands can tell me instead of a measurement you cannot
  take - does the nut press in, does it grab, does it drop through. Report those and
  I will re-cut the throat in one pass: too loose means throat across-flats goes down,
  too tight means it goes up, and only the one number moves.


  Why the design is shaped this way: the nut drops in the Ø12 mouth, is squeezed past
  a hexagonal throat 0.15 mm tighter across flats than the nut (7.85 against the catalog
  8.00), and lands flat on a 3 mm floor inside a socket 8.05 across flats. The throat
  leaves a ledge sitting over the nut, so the nut is captive and cannot fall out when
  you turn the knob upside down - no glue, and the floor has only a Ø6.2 bolt hole
  so it cannot be pushed out the far side. The bolt runs up through that hole, threads
  through the nut, and its tip comes back out of the mouth. Because the nut''s bottom
  face lands on the floor, the tightening force travels nut -> floor -> your workpiece,
  all in compression through 3 mm of plastic; the little retaining ledge never carries
  the clamp load, it only has to hold a 5 g nut. Print the ring first: same socket,
  throat, cone and floor as the knob, top cut off, 5 g of plastic to prove the fit
  before the knob.'
questions:
- text: When you press the nut into TEST_RING with your thumb, is it (a) easy, (b)
    firm but doable, or (c) impossible? This is the one answer that sets the throat
    size.
  answer: null
- text: Does the nut stay in TEST_RING when you turn it upside down and shake it,
    or does it fall out?
  answer: null
- text: What is your M5 nut's across-flats width (catalog says 8.00), if you can get
    a caliper on it at any point?
  answer: null
- text: How thick is the part you are clamping, and which M5 bolt do you have? That
    sets the bolt length only - the knob works with any M5 bolt.
  answer: null
