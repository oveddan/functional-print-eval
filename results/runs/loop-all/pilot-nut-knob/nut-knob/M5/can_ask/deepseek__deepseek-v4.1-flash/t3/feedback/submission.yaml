manual:
- n: '1'
  text: Print the fit coupon flat, as its file sits, in PLA at 0.2 mm layers with
    at least 3 perimeters. No supports; about 20 minutes.
  parts:
  - fit-coupon
  hardware: []
  tool: Bambu Studio, PLA profile
- n: '2'
  text: Press the ISO 4032 M5 nut into each of the three pockets with your thumb,
    flat face down, letting the lead-in chamfer start it. Left pocket has no ribs
    (plain 8.05 mm hex, the loose reference), middle has the 0.10 mm ribs used in
    the knob, right has taller 0.20 mm ribs (tight).
  parts: []
  hardware:
  - h-nut
  tool: thumb pressure
- n: '3'
  text: Turn the coupon upside down and shake it. The pocket that holds the nut and
    also pressed in comfortably is your working size; the knob is made at the middle
    (0.10 mm rib) size. If only the right pocket holds, your printer runs the hole
    on the large side - say so before relying on the knob. If even the left pocket
    is hard to press, the hole runs small.
  parts: []
  hardware:
  - h-nut
  tool: none
- n: '4'
  text: 'Print the knob bottom face down on the bed, exactly as oriented in the file.
    No supports: the flutes stop 2 mm above the bed and the pocket opens upward.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '5'
  text: Press the ISO 4032 M5 nut into the knob's hex pocket, flat face down, using
    the lead-in. Push evenly with both thumbs with the knob on a hard surface; the
    six ribs crush slightly as it goes. It stops hard on the shoulder with its top
    face about 1.5 mm below the knob's top face. No glue.
  parts: []
  hardware:
  - h-nut
  tool: hard flat surface (or vice with soft jaws if firm)
- n: '6'
  text: 'Check the nut is captive: turn the knob upside down over a table and shake.
    It must stay seated, and must not be able to move any deeper - the shoulder stops
    it.'
  parts: []
  hardware:
  - h-nut
  tool: null
- n: '7'
  text: Screw the ISO 4762 M5x30 bolt up through the countersink and clearance hole
    in the bottom face and into the nut; the thread picks up roughly 12 mm up from
    the bottom and the tip emerges from the recess in the top face. Any M5 bolt from
    25 to 35 mm long works as long as the tip projects past the nut.
  parts: []
  hardware:
  - h-bolt
  - h-nut
  tool: hand
- n: '8'
  text: Pass the bolt through your workpiece and tighten by turning the knob by hand
    - the scalloped flutes give the grip, and no tool is needed on the nut or the
    bolt head.
  parts: []
  hardware:
  - h-bolt
  tool: null
