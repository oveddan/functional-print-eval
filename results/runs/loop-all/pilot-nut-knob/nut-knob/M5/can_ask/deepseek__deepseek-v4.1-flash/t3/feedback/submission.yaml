task: nut-knob/M5
note: 'Same knob, one change: the nut pocket is now a hand-tolerant crush-rib fit
  instead of a plain interference fit. The pocket is 8.05 mm across flats (0.05 mm
  total clearance on the catalog 8.0 mm nut, so it can always be started by hand),
  and six small vertical ribs on the pocket flats stand 0.10 mm proud, so the grip
  comes from six small crushable lands rather than from the whole hex face. That way
  a printer that runs holes slightly small cannot make the knob un-pressable, and
  one that runs holes slightly large still has something to bite. A 1.2 mm 45-degree
  hex lead-in at the mouth starts the nut square, the nut seats on a flat shoulder
  1.5 mm below the top face (fully inside the knob, and it cannot pass the 5.6 mm
  bolt hole beneath it), and the M5 bolt enters from the bottom face, threads through
  the nut and exits the top. Two dials control the fit if the coupon says otherwise:
  `pocket_af` (base hex size) and `rib_protrusion`. The fit coupon now brackets the
  rib height (none / 0.10 as in the knob / 0.20 tight) so the printed result can be
  read off directly. I could not get a nut measurement or any printed-part feedback,
  so the nut data remains catalog (ISO 4032 M5, 8.0 AF, 4.7 high) and the fit is still
  unverified on the real machine.'
questions:
- text: 'On the new coupon, which pocket (left: no ribs, middle: 0.10 mm ribs, right:
    0.20 mm ribs) holds the nut when the coupon is upside down while still pressing
    in by hand?'
  answer: null
