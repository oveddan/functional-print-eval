parts:
- id: knob
  role: final
  material: PLA (high-speed, black), 0.4 mm nozzle, 0.2 mm layers
  code: "import math\n\ndef build(p):\n    R = p.knob_od / 2.0\n    h = p.knob_h\n\
    \    body = cq.Workplane(\"XY\").circle(R).extrude(h)\n\n    n = int(p.flute_n)\n\
    \    gr = p.flute_d / 2.0\n    for i in range(n):\n        a = 2.0 * math.pi *\
    \ i / n\n        cut = (cq.Workplane(\"XY\").workplane(offset=p.flute_z0)\n  \
    \             .center(p.flute_orbit * math.cos(a), p.flute_orbit * math.sin(a))\n\
    \               .circle(gr).extrude(p.flute_z1 - p.flute_z0))\n        body =\
    \ body.cut(cut)\n\n    body = body.faces(\">Z\").edges().chamfer(p.edge_chamfer)\n\
    \    body = body.faces(\"<Z\").edges().chamfer(p.edge_chamfer)\n\n    floor_z\
    \ = h - p.pocket_depth\n    rf = p.pocket_af / 2.0\n    ac = rf / math.cos(math.radians(30.0))\n\
    \n    def hex_pts(radius):\n        return [(radius * math.cos(math.radians(60.0\
    \ * i)),\n                 radius * math.sin(math.radians(60.0 * i))) for i in\
    \ range(6)]\n\n    # straight hex nut pocket, walls parallel to the pull-out direction\n\
    \    body = body.cut(cq.Workplane(\"XY\").workplane(offset=floor_z)\n        \
    \            .polyline(hex_pts(ac / 2.0)).close()\n                    .extrude(p.pocket_depth\
    \ + 0.5))\n\n    # 45 degree hex lead-in so the nut starts square by hand\n  \
    \  lead = (cq.Workplane(\"XY\").workplane(offset=h - p.mouth_lead)\n         \
    \   .polyline(hex_pts(ac / 2.0)).close()\n            .workplane(offset=p.mouth_lead)\n\
    \            .polyline(hex_pts(ac / 2.0 + p.mouth_lead)).close()\n           \
    \ .loft())\n    body = body.cut(lead)\n\n    # six crush ribs, one per pocket\
    \ flat, so grip does not depend on hole size\n    for i in range(6):\n       \
    \ a = 30.0 + 60.0 * i\n        rib = (cq.Workplane(\"XY\")\n               .box(p.rib_t,\
    \ p.rib_w, p.rib_h, centered=(True, True, False)).val()\n               .translate(cq.Vector(rf\
    \ + p.rib_t / 2.0 - p.rib_protrusion, 0.0, floor_z))\n               .rotate(cq.Vector(0,\
    \ 0, 0), cq.Vector(0, 0, 1), a))\n        body = body.union(cq.Workplane(obj=rib))\n\
    \n    # bolt clearance hole from the pocket floor to the bottom face\n    body\
    \ = body.cut(cq.Workplane(\"XY\").workplane(offset=-1.0)\n                   \
    \ .circle(p.bolt_hole_d / 2.0).extrude(floor_z + 2.0))\n\n    # countersink at\
    \ the bottom face to guide the bolt in\n    sink = cq.Solid.makeCone(p.sink_d\
    \ / 2.0, p.bolt_hole_d / 2.0, p.sink_h)\n    body = body.cut(cq.Workplane(obj=sink.translate(cq.Vector(0,\
    \ 0, -0.01))))\n\n    return body"
  print_orientation: bottom face on the bed (z = 0), nut pocket and flutes opening
    upward; no supports
  use_orientation: axis vertical, nut pocket at the top, bolt entering from the bottom
    face
- id: fit-coupon
  role: coupon
  material: PLA (high-speed, black), 0.4 mm nozzle, 0.2 mm layers
  code: "import math\n\ndef build(p):\n    L, W, H = p.coupon_l, p.coupon_w, p.coupon_h\n\
    \    body = cq.Workplane(\"XY\").box(L, W, H, centered=(True, True, False))\n\n\
    \    floor_z = H - p.pocket_depth\n    rf = p.pocket_af / 2.0\n    ac = rf / math.cos(math.radians(30.0))\n\
    \n    def hex_pts(radius):\n        return [(radius * math.cos(math.radians(60.0\
    \ * i)),\n                 radius * math.sin(math.radians(60.0 * i))) for i in\
    \ range(6)]\n\n    xs = (-p.coupon_pitch, 0.0, p.coupon_pitch)\n    protrusions\
    \ = (p.cp_rib_a, p.cp_rib_b, p.cp_rib_c)\n\n    for x, rp in zip(xs, protrusions):\n\
    \        pocket = (cq.Workplane(\"XY\").workplane(offset=floor_z)\n          \
    \        .polyline(hex_pts(ac / 2.0)).close()\n                  .extrude(p.pocket_depth\
    \ + 0.5))\n        lead = (cq.Workplane(\"XY\").workplane(offset=H - p.mouth_lead)\n\
    \                .polyline(hex_pts(ac / 2.0)).close()\n                .workplane(offset=p.mouth_lead)\n\
    \                .polyline(hex_pts(ac / 2.0 + p.mouth_lead)).close()\n       \
    \         .loft())\n        hole = (cq.Workplane(\"XY\").workplane(offset=-1.0)\n\
    \                .circle(p.bolt_hole_d / 2.0).extrude(floor_z + 2.0))\n      \
    \  for wp in (pocket, lead, hole):\n            body = body.cut(cq.Workplane(obj=wp.val().translate(cq.Vector(x,\
    \ 0, 0))))\n        if rp > 1e-6:\n            for i in range(6):\n          \
    \      a = 30.0 + 60.0 * i\n                rib = (cq.Workplane(\"XY\")\n    \
    \                   .box(p.rib_t, p.rib_w, p.rib_h, centered=(True, True, False)).val()\n\
    \                       .translate(cq.Vector(rf + p.rib_t / 2.0 - rp, 0.0, floor_z))\n\
    \                       .rotate(cq.Vector(0, 0, 0), cq.Vector(0, 0, 1), a)\n \
    \                      .translate(cq.Vector(x, 0, 0)))\n                body =\
    \ body.union(cq.Workplane(obj=rib))\n    return body"
  print_orientation: flat on the bed as modelled (z = 0), pockets opening upward;
    no supports
  use_orientation: flat block, press the M5 nut into each pocket and turn the block
    upside down
