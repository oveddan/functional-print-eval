criteria:
- id: c1
  part: knob
  feature: hex nut pocket (across flats 8.00, depth 5.0)
  relation: contains
  hardware: nutM5
  clearance_mm: null
  params:
  - pocket_af
  - pocket_depth
  - nut_af
  - nut_h
  check:
    method: coupon
    ref: coupon
    description: The 4.7 mm tall nut sits in a 5.0 mm deep pocket, so it ends up 0.3
      mm below the mouth and is fully inside the knob.
- id: c2
  part: knob
  feature: hex nut pocket flats
  relation: engages
  hardware: nutM5
  clearance_mm: 0.0
  params:
  - pocket_af
  - nut_af
  check:
    method: coupon
    ref: coupon
    description: 'Nominal pocket size equals the nut across-flats; the press comes
      from the printed pocket closing up slightly. Confirmed on the previous print:
      the same-size coupon pocket pushed in by hand and held the nut when inverted,
      which is the retention this knob needs. No glue.'
- id: c3
  part: knob
