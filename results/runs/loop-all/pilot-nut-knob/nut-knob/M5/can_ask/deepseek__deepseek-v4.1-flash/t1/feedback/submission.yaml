- id: c5
  part: coupon
  feature: middle hex pocket, 8.00 mm across flats
  relation: engages
  hardware: nutM5
  clearance_mm: 0.0
  params:
  - coupon_af_fit
  - pocket_af
  - nut_af
  check:
    method: coupon
    ref: coupon
    description: The middle pocket matches the knob's pocket_af exactly and is the
      pocket you already tested as a tight hand push that retained the nut; 8.10 and
      7.90 bracket it as loose and tight references.
manual:
- n: '1'
  text: 'You have already tested the key number: the 8.00 mm pocket on the first coupon
    pushed in by hand and held the nut when inverted. The knob now uses exactly that
    pocket, so you can go straight to printing the knob. (The coupon is reprinted
    only if you want the loose/tight brackets again: left 8.10, middle 8.00, right
    7.90.)'
  parts:
  - coupon
  hardware:
  - nutM5
  tool: null
- n: '2'
  text: 'Print the knob as modelled: the closed end (the small 5.5 mm hole) on the
    bed and the hex pocket opening upward. No supports and no bridges are needed.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Press the M5 hex nut into the knob's pocket, hex-to-hex and flat side first,
    until it rests on the pocket floor. Firm hand push, no tools. It should finish
    about 0.3 mm below the rim — fully inside the knob. No glue.
  parts:
  - knob
  hardware:
  - nutM5
  tool: null
- n: '4'
  text: Turn the knob upside down (pocket facing the floor) and give it a shake. The
    nut must stay in.
  parts:
  - knob
  hardware:
  - nutM5
  tool: null
- n: '5'
  text: 'Look down the 5.5 mm hole in the closed end: you should see the back of the
    nut. The nut is wider than the hole, so it cannot be pushed out that way.'
  parts:
  - knob
  hardware:
  - nutM5
  tool: null
- n: '6'
  text: Start your M5 bolt into the nut from the pocket side and keep turning. The
    bolt runs through the nut and out of the 5.5 mm hole in the closed end.
  parts:
  - knob
  hardware:
  - bolt
  tool: null
- n: '7'
  text: Fit the knob onto your bolt and tighten by hand on the fluted rim. No tools.
  parts:
  - knob
  hardware:
  - bolt
  tool: null
