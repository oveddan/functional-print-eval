manual:
- n: '1'
  text: Print the coupon in PLA at 0.2 mm layers, no supports, closed face on the
    bed. It is a 22 mm puck with the same hex pocket, slotted tabs and lip as the
    knob.
  parts:
  - coupon
  hardware: []
  tool: null
- n: '2'
  text: Press the M5 nut into the coupon's hex pocket from the open face, flats lined
    up with the pocket flats. It should slide most of the way, then pop past the lip
    with a firm thumb push until it stops on the shoulder.
  parts:
  - coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: Turn the coupon over so the pocket faces down and tap it on the bench. The
    nut must stay in. If it drops out, lower lip_af by 0.05 mm; if you cannot press
    it in at all, raise lip_af by 0.05 mm. Either way reprint the coupon before going
    further.
  parts:
  - coupon
  hardware:
  - nut
  tool: null
- n: '4'
  text: Print the knob in PLA at 0.2 mm layers, no supports, closed shoulder face
    on the bed. The hex pocket and hollow core open upward.
  parts:
  - knob
  hardware: []
  tool: null
- n: '5'
  text: Press the M5 nut into the knob's hex pocket from the open face (the face with
    the hex opening and the hollow ring around it, opposite the small bolt hole).
    Push until it seats on the shoulder, 1 mm below the mouth.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '6'
  text: Turn the knob upside down and shake it. The nut must stay in the pocket with
    no glue.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '7'
  text: Offer the knob, open face first, onto the M5 bolt protruding from your workpiece,
    and turn it on by hand. The bolt threads through the captive nut and its tip comes
    out of the 5.6 mm hole in the far face.
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: null
- n: '8'
  text: Tighten by hand only. The nut bears on a small PLA shoulder, so do not use
    a tool or lean your weight on it.
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: null
