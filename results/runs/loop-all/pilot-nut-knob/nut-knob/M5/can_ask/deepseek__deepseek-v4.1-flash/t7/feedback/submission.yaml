task: nut-knob/M5
note: 'Revision after printing round 1. I got no readable result for the 7.80 mm pocket,
  so I stopped relying on a tuned press fit and split the job instead: the pocket
  is now 8.05 mm so the nut drops in with 0.05 mm of clearance and never jams, and
  the mouth lip at 7.80 mm is the only thing that grips. That lip sits on three slender
  tabs (1.0 mm wall, cut free by three 0.8 mm slots), so the nut pops past it and
  the tabs spring back behind the nut''s face. Retention no longer depends on hitting
  a friction fit at FDM tolerance — if the pocket prints 0.1 mm small the lip just
  gets a bit tighter, if it prints 0.1 mm big the ledge on the lip''s underside still
  catches the nut, and either way a 3 g nut is held many times over. The nut bottoms
  on a 7 mm shoulder pierced only by a 5.6 mm bolt hole, so it cannot be pushed out
  the far side, and the bolt runs right through the nut and out that hole. Print the
  coupon first: it is the same pocket, tabs, slots and lip in a 22 mm puck, and it
  is your go/no-go. If the nut will not go in at all, raise lip_af by 0.05 mm and
  reprint the coupon; if it drops out when inverted, lower it by 0.05 mm. Hand-tight
  only — the nut bears on a small PLA annulus. Bolt length is your choice: the shank
  wants to be at least (workpiece thickness + 12 mm).'
questions: []
params:
  knob_d:
    value: 30.0
    unit: mm
    kind: design
    source: design
    note: across the flutes' outer circle; you asked for about 30 mm
  far_t:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: thickness of the shoulder the nut bears on; also the depth of the 5.6 mm
      bolt hole
  inner_d:
    value: 24.0
    unit: mm
    kind: design
    source: design
    note: hollow core, leaves a 3.0 mm outer wall
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats; you could not measure yours
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 height
  nut_recess:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: how far the nut's outer face sits below the mouth; exceeds lip_h so the
      lip's ledge ends up under the nut's face
  pocket_depth:
    value: 5.7
    unit: mm
    kind: design
    source: design
    note: nut_h + nut_recess
  pocket_af:
    value: 8.05
    unit: mm
    kind: design
    source: design
    note: slip fit, 0.05 mm clear of the nut across flats, so the nut can never jam
      on the pocket walls
  lip_af:
    value: 7.8
    unit: mm
    kind: design
    source: design
    note: 'the mouth lip: 0.125 mm per side inside the nut, 0.125 mm per side inside
      the pocket. This is the whole retention feature'
  lip_h:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: height of the lip band at the mouth
  collar_outer_af:
    value: 10.05
    unit: mm
    kind: design
    source: design
    note: 'gives the tabs a 1.0 mm wall: thin enough that a tight print still presses
      in by thumb'
  slot_w:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: width of the three slots that cut the collar into three tabs
  slot_r_in:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: inner end of the slot, inside the pocket void
  slot_r_out:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: outer end of the slot, clear of the collar wall
  bolt_clear_d:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: M5 clearance through the shoulder; smaller than the nut across corners so
      the nut cannot pass
  flute_count:
    value: 10
    unit: count
    kind: design
    source: design
    note: grip scallops around the rim
  flute_r:
    value: 2.2
    unit: mm
    kind: design
    source: design
    note: scallop cutter radius
  flute_center_r:
    value: 16.0
    unit: mm
    kind: design
    source: design
    note: gives a 1.2 mm deep scallop and leaves 1.8 mm of wall behind it
  top_chamfer:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: outer edge of the mouth face
  bot_chamfer:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: bed-side edge, for elephant-foot
  coupon_d:
    value: 22.0
    unit: mm
    kind: design
    source: design
    note: coupon puck diameter
  coupon_inner_d:
    value: 16.0
    unit: mm
    kind: design
    source: design
    note: coupon hollow core, same 3.0 mm wall
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef _hexp(af, z0, z1):\n    r = af / 2.0 / math.cos(math.pi\
    \ / 6.0)\n    pts = [(r * math.cos(i * math.pi / 3.0), r * math.sin(i * math.pi\
    \ / 3.0)) for i in range(6)]\n    return (cq.Workplane(\"XY\").workplane(offset=z0)\n\
    \            .polyline(pts).close().extrude(z1 - z0))\n\n\ndef build(p):\n   \
    \ R = p.knob_d / 2.0\n    H = p.far_t + p.pocket_depth\n\n    body = cq.Workplane(\"\
    XY\").circle(R).extrude(H)\n    body = body.faces(\">Z\").edges().chamfer(p.top_chamfer)\n\
    \    body = body.faces(\"<Z\").edges().chamfer(p.bot_chamfer)\n\n    pts = [(p.flute_center_r\
    \ * math.cos(2.0 * math.pi * i / p.flute_count),\n            p.flute_center_r\
    \ * math.sin(2.0 * math.pi * i / p.flute_count))\n           for i in range(p.flute_count)]\n\
    \    body = body.cut(cq.Workplane(\"XY\").pushPoints(pts).circle(p.flute_r)\n\
    \                    .extrude(H + 2.0).translate((0, 0, -1.0)))\n\n    body =\
    \ body.cut(cq.Workplane(\"XY\").workplane(offset=p.far_t)\n                  \
    \  .circle(p.inner_d / 2.0).extrude(p.pocket_depth + 1.0))\n\n    body = body.union(_hexp(p.collar_outer_af,\
    \ p.far_t, H))\n\n    body = body.cut(_hexp(p.lip_af, p.far_t, H + 1.0))\n   \
    \ body = body.cut(_hexp(p.pocket_af, p.far_t, H - p.lip_h))\n\n    L = p.slot_r_out\
    \ - p.slot_r_in\n    for k in range(3):\n        body = body.cut(\n          \
    \  cq.Workplane(\"XY\")\n            .box(L, p.slot_w, p.pocket_depth + 2.0, centered=(True,\
    \ True, False))\n            .translate(((p.slot_r_in + p.slot_r_out) / 2.0, 0.0,\
    \ p.far_t))\n            .rotate((0, 0, 0), (0, 0, 1), 120.0 * k))\n\n    body\
    \ = body.cut(cq.Workplane(\"XY\").workplane(offset=-1.0)\n                   \
    \ .circle(p.bolt_clear_d / 2.0).extrude(p.far_t + 2.0))\n    return body"
  print_orientation: 'Closed shoulder face on the bed (z = 0): the flat 30 mm disc
    with the 5.6 mm bolt hole in the middle. The hex pocket, the slotted tabs and
    the hollow core all open upward, so nothing overhangs and no supports are needed.'
  use_orientation: 'Flipped from the print: the hex pocket and the hollow core face
    down toward the workpiece, and the 5.6 mm bolt hole is on top. The nut is pressed
    in from below and the bolt comes up from below through it.'
- id: coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef _hexp(af, z0, z1):\n    r = af / 2.0 / math.cos(math.pi\
    \ / 6.0)\n    pts = [(r * math.cos(i * math.pi / 3.0), r * math.sin(i * math.pi\
    \ / 3.0)) for i in range(6)]\n    return (cq.Workplane(\"XY\").workplane(offset=z0)\n\
    \            .polyline(pts).close().extrude(z1 - z0))\n\n\ndef build(p):\n   \
    \ R = p.coupon_d / 2.0\n    H = p.far_t + p.pocket_depth\n\n    body = cq.Workplane(\"\
    XY\").circle(R).extrude(H)\n    body = body.faces(\">Z\").edges().chamfer(p.top_chamfer)\n\
    \    body = body.faces(\"<Z\").edges().chamfer(p.bot_chamfer)\n\n    body = body.cut(cq.Workplane(\"\
    XY\").workplane(offset=p.far_t)\n                    .circle(p.coupon_inner_d\
    \ / 2.0).extrude(p.pocket_depth + 1.0))\n\n    body = body.union(_hexp(p.collar_outer_af,\
    \ p.far_t, H))\n\n    body = body.cut(_hexp(p.lip_af, p.far_t, H + 1.0))\n   \
    \ body = body.cut(_hexp(p.pocket_af, p.far_t, H - p.lip_h))\n\n    L = p.slot_r_out\
    \ - p.slot_r_in\n    for k in range(3):\n        body = body.cut(\n          \
    \  cq.Workplane(\"XY\")\n            .box(L, p.slot_w, p.pocket_depth + 2.0, centered=(True,\
    \ True, False))\n            .translate(((p.slot_r_in + p.slot_r_out) / 2.0, 0.0,\
    \ p.far_t))\n            .rotate((0, 0, 0), (0, 0, 1), 120.0 * k))\n\n    body\
    \ = body.cut(cq.Workplane(\"XY\").workplane(offset=-1.0)\n                   \
    \ .circle(p.bolt_clear_d / 2.0).extrude(p.far_t + 2.0))\n    return body"
  print_orientation: 'Same as the knob: closed shoulder face on the bed, hex pocket
    and hollow core opening upward.'
  use_orientation: Held in the hand. Nut pressed into the hex pocket from the open
    face, then the coupon is turned over to check the nut stays.
