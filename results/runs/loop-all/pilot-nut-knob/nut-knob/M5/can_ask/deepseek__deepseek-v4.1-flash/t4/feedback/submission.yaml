task: nut-knob/M5
note: 'Revision 2. Same one-piece knob, but the nut socket is now tapered instead
  of straight.


  What changed and why: I could not measure the nut and the person could not report
  how the first print fitted, so an exact press fit is a guess. A straight socket
  has to be right to within ~0.05 mm or it either jams or drops the nut. The socket
  is now a wedge: 8.05 mm across flats 0.6 mm below the rim, closing to 7.80 mm (0.20
  mm tighter than the nut) at the pocket floor. The nut enters the mouth with a little
  clearance, contacts the walls about 3.5 mm above the floor, and is held by interference
  down to the floor, so the whole push ramps up smoothly and the fit has roughly twice
  the tolerance window of a straight socket. The 0.25 mm taper over 4.5 mm is a 1.6
  degree wedge, well inside the self-locking range, so the nut will not work loose
  - but it also means you remove the nut by jacking it out with the bolt, not by levering
  it.


  Everything that was already certain is unchanged: the nut bottoms 0.4 mm below the
  rim (fully inside) on top of a 12.9 mm solid slab, and that slab''s 5.6 mm hole
  (vs the nut''s 8.0 across flats) is what stops the nut going out the far side. All
  walls are vertical, nothing bridges, no supports.


  Still the one uncertainty: the 7.80 mm floor size. The coupon has the identical
  socket geometry at three sizes (floor across flats 7.70 / 7.80 / 7.90, i.e. 0.30
  / 0.20 / 0.10 mm interference). Print the coupon first and press the nut into the
  middle socket; that is exactly the knob''s socket. If the middle one is loose or
  too tight, print the knob anyway if the tighter or looser coupon socket felt right
  and tell me the number - but the taper should make the middle one work across most
  printers'' hole tolerances.'
questions:
- text: How long is the M5 bolt's shank measured from under the head? The knob is
    18 mm tall, so the bolt needs 20 mm or more to thread through the nut and come
    out the far side - tell me if yours is shorter and I'll flatten the knob to suit.
  answer: null
- text: 'After pressing the nut into the three coupon sockets: which socket holds
    the nut when the plate is inverted and still presses in by hand, and which is
    the left/middle/right one? If it isn''t the middle (7.80 mm at the floor) one,
    I''ll set the knob''s floor size to whichever socket behaved best.'
  answer: null
params:
  bolt_clear_d:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: 'Through-hole: M5 nominal 5.0 shank + 0.6 clearance, and well under the
      nut''s 8.0 across flats so it still stops the nut.'
  bolt_len_under_head:
    value: null
    unit: mm
    kind: hardware
    source: unknown
    note: Their own bolt, not measured. Must be 20 mm or more under the head so it
      exits the far side of the 18 mm tall knob.
  bolt_shank_d:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: M5 nominal shank diameter; the actual bolt could not be measured.
  coupon_l:
    value: 78.0
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_pitch:
    value: 24.0
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_step:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: Coupon sockets sit at the knob's interference -/+ this value.
  coupon_t:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: Same 5.1 pocket depth plus a 2.9 thick stop slab as the knob.
  coupon_w:
    value: 20.0
    unit: mm
    kind: design
    source: design
    note: ''
  knob_h:
    value: 18.0
    unit: mm
    kind: design
    source: design
    note: Overall height, socket mouth at z = 18. Kept short so a common 20-25 mm
      bolt still exits the far side.
  knob_od:
    value: 30.0
    unit: mm
    kind: design
    source: asked
    note: Owner asked for about 30 mm across; this is the tip-to-tip lobe diameter.
  lobe_amp:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: Lobe amplitude; grip runs 22 mm at the roots to 30 mm at the tips.
  lobe_count:
    value: 6
    unit: mm
    kind: design
    source: design
    note: Six grip lobes for finger purchase.
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats. Could not be measured - nominal used.
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 nut height. Could not be measured - nominal used.
  nut_recess:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: Socket is nut height + this, so the seated nut sits fully inside, below
      the rim.
  pocket_chamfer:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: 45 degree flare at the socket mouth, on top of the taper, so the nut starts
      square.
  press_interference:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: 'Interference across flats at the pocket FLOOR: the socket is this much
      smaller than the nut there, and it is the widest part of the push. Retention
      is by this fit alone; the wedge makes it progressive.'
  socket_taper:
    value: 0.25
    unit: mm
    kind: design
    source: design
    note: The socket widens by this much across flats from the pocket floor to 0.6
      mm below the rim (1.6 degree wedge). Nut enters with clearance and wedges in;
      self-locking, so it stays put.
parts:
- id: hand_knob
  role: final
  material: PLA (high-speed, black)
  code: "import cadquery as cq\nimport math\n\n\ndef _lobed_profile(rmid, amp, lobes,\
    \ n=180):\n    pts = []\n    for i in range(n):\n        th = 2.0 * math.pi *\
    \ i / n\n        r = rmid + amp * math.cos(lobes * th)\n        pts.append((r\
    \ * math.cos(th), r * math.sin(th)))\n    return pts\n\n\ndef _hexd(af):\n   \
    \ # circumscribed-circle diameter of a regular hexagon of size af across flats\n\
    \    return 2.0 * af / math.sqrt(3.0)\n\n\ndef build(p):\n    H = p.knob_h\n \
    \   amp = p.lobe_amp\n    rmid = p.knob_od / 2.0 - amp\n    body = (cq.Workplane(\"\
    XY\")\n            .polyline(_lobed_profile(rmid, amp, int(p.lobe_count)))\n \
    \           .close()\n            .extrude(H))\n\n    # --- nut socket: tapered\
    \ (wedge) hex ---------------\n    af_floor = p.nut_af - p.press_interference\
    \   # across flats at the pocket floor\n    af_top = af_floor + p.socket_taper\
    \           # across flats at the top of the wedge\n    ch = p.pocket_chamfer\n\
    \    depth = p.nut_h + p.nut_recess\n    floor = H - depth                   \
    \         # pocket floor = top of the stop slab\n    wtop = H - ch           \
    \                     # top of the wedge = start of the flare\n\n    wedge = (cq.Workplane(\"\
    XY\").workplane(offset=floor)\n             .polygon(6, _hexd(af_floor))\n   \
    \          .workplane(offset=wtop - floor)\n             .polygon(6, _hexd(af_top))\n\
    \             .loft())\n\n    flare = (cq.Workplane(\"XY\").workplane(offset=wtop)\n\
    \             .polygon(6, _hexd(af_top))\n             .workplane(offset=ch +\
    \ 0.3)\n             .polygon(6, _hexd(af_top + 2.0 * (ch + 0.3)))\n         \
    \    .loft())\n\n    body = body.cut(wedge).cut(flare)\n\n    # --- bolt through-hole:\
    \ clears the bolt, stops the nut ---------\n    body = body.cut(cq.Workplane(\"\
    XY\").workplane(offset=-1.0)\n                    .circle(p.bolt_clear_d / 2.0).extrude(floor\
    \ + 1.5))\n    return body"
  print_orientation: Flat bottom face on the bed (the face with the 5.6 mm hole).
    The knob axis is vertical, the nut socket opens straight up, so every wall is
    vertical and nothing bridges.
  use_orientation: Nut socket facing away from the work; the bolt comes up through
    the bottom 5.6 mm hole, threads into the embedded nut and exits the top face.
    Gripped by the six lobes.
- id: knob_fit_coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "import cadquery as cq\nimport math\n\n\ndef _hexd(af):\n    return 2.0 *\
    \ af / math.sqrt(3.0)\n\n\ndef build(p):\n    t = p.coupon_t\n    ch = p.pocket_chamfer\n\
    \    depth = p.nut_h + p.nut_recess\n    floor = t - depth\n    wtop = floor +\
    \ depth - ch            # same wedge length as the knob\n    af0 = p.nut_af -\
    \ p.press_interference\n    afs = [af0 - p.coupon_step, af0, af0 + p.coupon_step]\n\
    \n    plate = (cq.Workplane(\"XY\").box(p.coupon_l, p.coupon_w, t)\n         \
    \    .translate((0, 0, t / 2.0)))\n\n    for i, af in enumerate(afs):\n      \
    \  x = (i - 1) * p.coupon_pitch\n        af_top = af + p.socket_taper\n\n    \
    \    wedge = (cq.Workplane(\"XY\").workplane(offset=floor).center(x, 0)\n    \
    \             .polygon(6, _hexd(af))\n                 .workplane(offset=wtop\
    \ - floor)\n                 .polygon(6, _hexd(af_top))\n                 .loft())\n\
    \n        straight = (cq.Workplane(\"XY\").workplane(offset=wtop).center(x, 0)\n\
    \                    .polygon(6, _hexd(af_top))\n                    .extrude(t\
    \ - wtop + 0.5))\n\n        flare = (cq.Workplane(\"XY\").workplane(offset=t).center(x,\
    \ 0)\n                 .polygon(6, _hexd(af_top))\n                 .workplane(offset=ch\
    \ + 0.3)\n                 .polygon(6, _hexd(af_top + 2.0 * (ch + 0.3)))\n   \
    \              .loft())\n\n        plate = plate.cut(wedge).cut(straight).cut(flare)\n\
    \n        plate = plate.cut(cq.Workplane(\"XY\").workplane(offset=-1.0).center(x,\
    \ 0)\n                          .circle(p.bolt_clear_d / 2.0).extrude(floor +\
    \ 2.0))\n    return plate"
  print_orientation: Flat on the bed, sockets facing up - same layer-by-layer situation
    as the knob's socket.
  use_orientation: 'Handling test piece: press the nut into each of the three sockets,
    then invert the plate to check the nut is held.'
