manual:
- n: '1'
  text: Print knob_fit_coupon first, PLA, laid flat on the bed with the three hex
    sockets facing up. This is the same layer-by-layer situation as the knob's socket,
    so the fit transfers.
  parts:
  - knob_fit_coupon
  hardware: []
  tool: Bambu Lab X1C, 0.4 mm nozzle, 0.2 mm layers
- n: '2'
  text: 'Press the M5 nut into each of the three sockets with your thumb, or your
    palm with the plate on the bench. Each socket starts with a little clearance and
    gets firm over the last millimetre or two, then stops solid on the floor. Then
    hold the plate sockets-down and tap it on the bench: the nut must stay in.'
  parts:
  - knob_fit_coupon
  hardware:
  - nut_m5
  tool: null
- n: '3'
  text: The three sockets run left to right as 7.70, 7.80 and 7.90 mm across the flats
    at the floor, i.e. 0.30, 0.20 and 0.10 mm tighter than the nut. The middle one
    (7.80) is exactly what the knob uses. If the middle socket holds the nut and can
    still be pressed in by hand, go ahead. If the middle one is loose while a tighter
    one grips, or the middle one is too tight while a looser one is pressable, tell
    me which and I will set the knob to that size.
  parts:
  - knob_fit_coupon
  hardware:
  - nut_m5
  tool: null
- n: '4'
  text: Print hand_knob, flat bottom face on the bed (the face with the small 5.6
    mm hole). The six-lobed knob stands 18 mm tall with the hex socket opening straight
    up. No supports needed.
  parts:
  - hand_knob
  hardware: []
  tool: Same printer settings
- n: '5'
  text: Press the M5 nut into the hex socket at the top of the knob, flare first,
    with your thumb and palm - the first few millimetres go in easily, the last millimetre
    or two are a firm push. It stops solidly when it reaches the floor, about 0.4
    mm below the rim. No glue, no tools.
  parts:
  - hand_knob
  hardware:
  - nut_m5
  tool: null
- n: '6'
  text: 'Turn the knob upside down and tap it on the bench: the nut must stay in the
    socket. Then push the nut hard from the socket side - it must not pass through
    to the far side, because the 5.6 mm hole is smaller than the nut.'
  parts:
  - hand_knob
  hardware:
  - nut_m5
  tool: null
- n: '7'
  text: Push the M5 bolt up through the 5.6 mm hole in the knob's bottom face and
    turn the knob to thread it into the nut. The bolt passes freely through the hole,
    engages the nut, and comes out through the knob's top face. Use a bolt with at
    least 20 mm of shank under the head (25 mm is ideal) - the knob is 18 mm tall,
    so anything shorter will not reach out the other side.
  parts:
  - hand_knob
  hardware:
  - bolt_m5
  - nut_m5
  tool: null
- n: '8'
  text: 'To release the nut later: thread the bolt in from the bottom until its head
    bottoms on the knob''s bottom face, then keep turning. The nut is jacked up out
    of the socket. The wedge is self-locking, so do not try to pry or lever the nut
    out.'
  parts:
  - hand_knob
  hardware:
  - bolt_m5
  - nut_m5
  tool: null
