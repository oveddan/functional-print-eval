manual:
- n: '1'
  text: Print fit_coupon (PLA, 0.2 mm layers, no supports). The pockets are marked
    by 1, 2 and 3 edge notches. Their crush ribs stick out 0.15, 0.25 and 0.35 mm.
    Measured from a rib to the opposite flat, they are about 7.95, 7.85 and 7.75 mm,
    and the nut is 8.0 mm.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Press the M5 nut into each pocket with your thumb. Choose the tightest pocket
    where it goes fully in by hand and stays in when you turn the coupon over and
    shake it. Set rib_protrusion to that pocket's value. The default is 0.25 (2 notches).
    To get the nut back out, push it through the 5.5 mm hole with a screwdriver.
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: Print the knob with the closed scalloped face on the bed and the pocket facing
    up. No supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '4'
  text: Line the nut up with the pocket and press it in until it bottoms out, about
    0.3 mm below the face. Check that it stays in when you turn the knob upside down.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Thread your M5 bolt in from the pocket side, through the nut and out through
    the closed face. Turn the knob by hand.
  parts:
  - knob
  hardware:
  - nut
  tool: null
