    note: Ribs are on 3 alternating flats, each opposite a bare flat, so the interference
      is 0.25 - 0.1 = 0.15 mm per rib. That's moderate for a thumb press. Kept at
      0.25 because the first coupon gave no feedback
  rib_try_1:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: ''
  rib_try_2:
    value: 0.25
    unit: mm
