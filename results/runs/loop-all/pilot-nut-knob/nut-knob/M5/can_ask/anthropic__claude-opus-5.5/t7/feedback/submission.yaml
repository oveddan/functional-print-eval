task: nut-knob/M5
note: Unchanged from the last version because no fit result came back. The pocket
  sizes you listed (7.4, 7.6 and 7.8 mm) are the pocket width with both ribs' protrusion
  subtracted. Each rib sits opposite a bare flat, though, so the real rib-to-flat
  sizes are 7.95, 7.85 and 7.75 mm. Use the coupon to choose rib_protrusion.
questions: []
params:
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: about 30 mm across, as requested
  knob_h:
    value: 11
    unit: mm
    kind: design
    source: design
    note: ''
  lobe_count:
    value: 6
    unit: count
    kind: design
    source: design
    note: ''
