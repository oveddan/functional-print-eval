  - pocket_clear
  - rib_h
  - rib_w
  check:
    method: coupon
    ref: fit_coupon
    description: Nut presses in by hand and stays in when turned upside down and shaken
- id: nut_flush_inside
  part: knob
  feature: pocket depth
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_h
  - nut_recess
  check:
    method: measure
    ref: null
    description: Nut top sits about 0.4 mm below the knob face
- id: no_push_through
  part: knob
  feature: floor hole
  relation: supports
  hardware: nut
  clearance_mm: null
