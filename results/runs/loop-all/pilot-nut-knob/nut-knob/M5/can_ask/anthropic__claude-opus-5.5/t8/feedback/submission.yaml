parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef _pocket(s, cx, cy, ztop, p, rib_h):\n    af_p = p.nut_af\
    \ + 2*p.pocket_clear\n    depth = p.nut_h + p.nut_recess\n    circ = af_p/math.cos(math.radians(30))\n\
    \    hexcut = cq.Workplane('XY').workplane(offset=ztop-depth).center(cx, cy).polygon(6,\
    \ circ).extrude(depth+1)\n    s = s.cut(hexcut)\n    cone = cq.Solid.makeCone(circ/2,\
    \ circ/2+p.lead_in, p.lead_in, pnt=cq.Vector(cx, cy, ztop-p.lead_in))\n    s =\
    \ s.cut(cq.Workplane('XY').add(cone))\n    d = af_p/2 - rib_h/2 + 0.2\n    for\
    \ k in range(6):\n        deg = 30 + 60*k\n        th = math.radians(deg)\n  \
    \      rib = (cq.Workplane('XY').box(rib_h+0.4, p.rib_w, depth-p.lead_in, centered=(True,\
    \ True, False))\n               .rotate((0,0,0),(0,0,1),deg)\n               .translate((cx+d*math.cos(th),\
    \ cy+d*math.sin(th), ztop-depth)))\n        s = s.union(rib)\n    return s\n\n\
    def build(p):\n    R = p.knob_d/2\n    H = p.knob_h\n    s = cq.Workplane('XY').circle(R).extrude(H)\n\
    \    n = int(p.lobes)\n    rc = R + p.scallop_r - p.scallop_inset\n    for i in\
    \ range(n):\n        a = 2*math.pi*i/n\n        cut = cq.Workplane('XY').workplane(offset=-1).center(rc*math.cos(a),\
    \ rc*math.sin(a)).circle(p.scallop_r).extrude(H+2)\n        s = s.cut(cut)\n \
    \   s = s.cut(cq.Workplane('XY').workplane(offset=-1).circle(p.bolt_clear/2).extrude(H+2))\n\
    \    s = _pocket(s, 0, 0, H, p, p.rib_h)\n    return s\n"
  print_orientation: Solid face (floor with the bolt hole) on the bed, hex pocket
    opening facing up
  use_orientation: Nut pocket faces away from the work. The bolt comes up through
    the floor hole and into the nut
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef _pocket(s, cx, cy, ztop, p, rib_h):\n    af_p = p.nut_af\
    \ + 2*p.pocket_clear\n    depth = p.nut_h + p.nut_recess\n    circ = af_p/math.cos(math.radians(30))\n\
    \    hexcut = cq.Workplane('XY').workplane(offset=ztop-depth).center(cx, cy).polygon(6,\
    \ circ).extrude(depth+1)\n    s = s.cut(hexcut)\n    cone = cq.Solid.makeCone(circ/2,\
    \ circ/2+p.lead_in, p.lead_in, pnt=cq.Vector(cx, cy, ztop-p.lead_in))\n    s =\
    \ s.cut(cq.Workplane('XY').add(cone))\n    d = af_p/2 - rib_h/2 + 0.2\n    for\
    \ k in range(6):\n        deg = 30 + 60*k\n        th = math.radians(deg)\n  \
    \      rib = (cq.Workplane('XY').box(rib_h+0.4, p.rib_w, depth-p.lead_in, centered=(True,\
    \ True, False))\n               .rotate((0,0,0),(0,0,1),deg)\n               .translate((cx+d*math.cos(th),\
    \ cy+d*math.sin(th), ztop-depth)))\n        s = s.union(rib)\n    return s\n\n\
    def build(p):\n    depth = p.nut_h + p.nut_recess\n    H = depth + 1.6\n    s\
    \ = cq.Workplane('XY').box(56, 16, H, centered=(True, True, False))\n    ribs\
    \ = [p.coupon_rib_a, p.coupon_rib_b, p.coupon_rib_c]\n    for i, x in enumerate([-18,\
    \ 0, 18]):\n        s = s.cut(cq.Workplane('XY').workplane(offset=-1).center(x,\
    \ 0).circle(p.bolt_clear/2).extrude(H+2))\n        s = _pocket(s, x, 0, H, p,\
    \ ribs[i])\n        for j in range(i+1):\n            nx = x - 3*i/2.0 + 3*j\n\
    \            s = s.cut(cq.Workplane('XY').box(1.2, 2.0, H+2, centered=(True, True,\
    \ False)).translate((nx, 8.0, -1)))\n    return s\n"
  print_orientation: Flat side on the bed, pockets facing up
  use_orientation: 'Hand-held test: press a nut into each pocket'
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
joints: []
criteria:
- id: nut_retained
  part: knob
  feature: hex pocket with crush ribs
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
