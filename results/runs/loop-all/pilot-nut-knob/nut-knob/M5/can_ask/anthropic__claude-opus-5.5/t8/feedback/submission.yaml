task: nut-knob/M5
note: I left this unchanged because no fit results came back, so I had nothing to
  tune from. The knob uses the middle setting (7.8 mm effective across flats). Use
  the coupon to pick the final rib_h.
questions: []
params:
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 height
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_clear:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: smaller than the 8 mm nut, so the nut can't be pushed out through the floor
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: design
    note: ''
  knob_h:
    value: 12
    unit: mm
    kind: design
    source: design
    note: ''
  lobes:
    value: 6
    unit: count
    kind: design
    source: design
    note: ''
  scallop_r:
    value: 4
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_inset:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: ''
  pocket_clear:
    value: 0.2
    unit: mm
    kind: design
    source: design
