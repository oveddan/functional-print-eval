    method: coupon
    ref: fit_coupon
    description: M5 bolt passes through the floor hole and threads into the seated
      nut
manual:
- n: '1'
  text: 'Print fit_coupon (pockets facing up, no supports). The notches give the effective
    across-flats size: 1 notch = 8.0 mm, 2 notches = 7.8 mm, 3 notches = 7.6 mm.'
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Press an M5 nut into each pocket. You can use thumb pressure, a vise, or
    a flat piece of wood. Pick the tightest pocket where the nut seats fully below
    the surface and stays in when you turn it upside down and shake it. If that isn''t
    the 2-notch pocket, set rib_h to match before printing the knob: 1 notch = 0.2,
    3 notches = 0.4. To get a nut out, push it from the back with a screwdriver.'
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: Print the knob with the floor face on the bed and the pocket facing up. No
    supports needed.
  parts:
  - knob
  hardware: []
  tool: null
- n: '4'
  text: Line up the nut's flats with the pocket and press it straight down until it
    sits just below the face.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Put the M5 bolt in through the floor hole and thread it through the nut so
    it comes out the pocket side. Tightening pulls the nut against the floor.
  parts:
  - knob
  hardware:
  - nut
  tool: null
