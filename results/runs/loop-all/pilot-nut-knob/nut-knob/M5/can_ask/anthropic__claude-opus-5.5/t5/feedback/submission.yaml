task: nut-knob/M5
note: 'Resubmitted unchanged because there was no feedback on fit. Please report which
  coupon pocket (7.90/7.70/7.50 mm across the ribs) holds the nut: pushes in by hand
  and doesn''t fall out upside down. That sets rib_protrude for the knob.'
questions: []
params:
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats; couldn't be measured
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_clear:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: through-hole for M5 bolt below nut
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: ''
  knob_h:
    value: 12
    unit: mm
    kind: design
    source: design
    note: ''
  pocket_depth:
    value: 5.2
    unit: mm
    kind: design
    source: design
    note: nut_h + 0.5 so nut sits fully below top face
  pocket_clear:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: hex pocket AF = nut_af + this; ribs provide the grip
  rib_protrude:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: crush-rib height from each flat (7.70 mm across ribs); set to the coupon
      winner
  rib_w:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: ''
  lead_in:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: ''
  n_scallops:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
  scallop_r:
    value: 3
    unit: mm
    kind: design
    source: design
    note: ''
  rib_a:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: coupon pocket 1 (1 dot), 7.90 across ribs
  rib_b:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: coupon pocket 2 (2 dots), 7.70 across ribs
  rib_c:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: coupon pocket 3 (3 dots), 7.50 across ribs
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    H=p.knob_h; D=p.knob_d\n    body=cq.Workplane('XY').circle(D/2).extrude(H).edges('>Z').fillet(1.5).edges('<Z').chamfer(0.4)\n\
    \    for i in range(int(p.n_scallops)):\n        a=2*math.pi*i/p.n_scallops\n\
    \        r=D/2+p.scallop_r*0.4\n        s=cq.Workplane('XY').center(r*math.cos(a),r*math.sin(a)).circle(p.scallop_r).extrude(H)\n\
    \        body=body.cut(s)\n    af=p.nut_af+p.pocket_clear\n    cd=af/math.cos(math.radians(30))\n\
    \    z0=H-p.pocket_depth\n    pocket=cq.Workplane('XY').workplane(offset=z0).polygon(6,cd).extrude(p.pocket_depth+1)\n\
    \    body=body.cut(pocket)\n    cone=cq.Solid.makeCone(cd/2, cd/2+p.lead_in, p.lead_in+0.01,\
    \ cq.Vector(0,0,H-p.lead_in), cq.Vector(0,0,1))\n    body=body.cut(cq.Workplane('XY').add(cone))\n\
    \    rh=p.pocket_depth-p.lead_in\n    L=p.rib_protrude+0.5\n    rc=af/2-p.rib_protrude+L/2\n\
    \    for k in range(6):\n        rib=cq.Workplane('XY').box(L,p.rib_w,rh,centered=(True,True,False)).translate((rc,0,z0)).rotate((0,0,0),(0,0,1),30+60*k)\n\
    \        body=body.union(rib)\n    hole=cq.Workplane('XY').circle(p.bolt_clear/2).extrude(H)\n\
    \    return body.cut(hole)\n"
  print_orientation: flat bottom face on bed, nut pocket opening facing up
  use_orientation: nut pocket faces away from the work; bolt comes up through the
    bottom hole into the nut
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\ndef build(p):\n    H=p.pocket_depth+1.5\n    blk=cq.Workplane('XY').box(42,15,H,centered=(True,True,False))\n\
    \    af=p.nut_af+p.pocket_clear\n    cd=af/math.cos(math.radians(30))\n    z0=H-p.pocket_depth\n\
    \    rh=p.pocket_depth-p.lead_in\n    for j,rp in enumerate([p.rib_a,p.rib_b,p.rib_c]):\n\
    \        x=(j-1)*13.5\n        blk=blk.cut(cq.Workplane('XY').workplane(offset=z0).center(x,0).polygon(6,cd).extrude(p.pocket_depth+1))\n\
    \        cone=cq.Solid.makeCone(cd/2,cd/2+p.lead_in,p.lead_in+0.01,cq.Vector(x,0,H-p.lead_in),cq.Vector(0,0,1))\n\
    \        blk=blk.cut(cq.Workplane('XY').add(cone))\n        L=rp+0.5; rc=af/2-rp+L/2\n\
    \        for k in range(6):\n            blk=blk.union(cq.Workplane('XY').box(L,p.rib_w,rh,centered=(True,True,False)).translate((rc,0,z0)).rotate((0,0,0),(0,0,1),30+60*k).translate((x,0,0)))\n\
    \        blk=blk.cut(cq.Workplane('XY').center(x,0).circle(p.bolt_clear/2).extrude(H))\n\
    \        for d in range(j+1):\n            blk=blk.cut(cq.Workplane('XY').workplane(offset=H-0.6).center(x-2+d*2,6.3).circle(0.5).extrude(1))\n\
    \    return blk\n"
  print_orientation: flat bottom on bed, pockets facing up
  use_orientation: held in hand to test-press the nut
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
joints:
- id: j1
  fastener: nut
  axis_origin:
  - 0.0
  - 0.0
  - 12.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: hex nut pocket
    role: nut_pocket
  - part: knob
    feature: bolt through-hole
    role: clearance
  nut: null
  external: the user's M5 bolt, threading up through the knob's bottom hole
criteria:
- id: c1
  part: knob
  feature: hex nut pocket with crush ribs
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - pocket_clear
  - rib_protrude
  - pocket_depth
  - nut_h
  check:
    method: coupon
    ref: fit_coupon
    description: Nut presses in by thumb (or a firm push on a table), sits below the
      top face, and doesn't fall out when held upside down and shaken
- id: c2
  part: knob
  feature: floor under pocket with bolt hole
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - bolt_clear
  - nut_af
  check:
    method: measure
    ref: null
    description: The bolt hole (5.6) is smaller than the nut's flats (8.0), so the
      nut can't be pushed out through the bottom
- id: c3
  part: knob
  feature: bolt through-hole
  relation: clears
  hardware: null
  clearance_mm: 0.6
  params:
  - bolt_clear
  - bolt_d
  check:
    method: none
    ref: null
    description: The M5 bolt slides through the bottom by hand
manual:
- n: '1'
  text: Print fit_coupon flat on the bed with the pockets facing up. Use at least
    3 walls. The pockets measure 7.90 mm (1 dot), 7.70 mm (2 dots) and 7.50 mm (3
    dots) across the ribs. The more dots, the tighter the fit.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Press the M5 nut into each pocket in turn. Pick the tightest pocket where
    you can still push the nut fully home by hand and where it stays in when you turn
    the coupon upside down and shake it. Set rib_protrude to match: 1 dot = 0.2, 2
    dots = 0.3 (the default), 3 dots = 0.4.'
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: Print the knob flat on the bed with the pocket facing up. No supports are
    needed. Use 3 or more walls and at least 25% infill.
  parts:
  - knob
  hardware: []
  tool: null
- n: '4'
  text: Press the nut into the hex pocket until it sits below the top face. The chamfer
    at the opening helps start it straight.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Push the M5 bolt in through the hole in the bottom of the knob and screw it
    through the nut and out the top. The floor under the nut stops the nut from being
    pushed out.
  parts:
  - knob
  hardware:
  - nut
  tool: null
