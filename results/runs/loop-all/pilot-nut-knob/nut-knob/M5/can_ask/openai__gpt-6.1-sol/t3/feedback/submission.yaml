task: nut-knob/M5
note: 'Unchanged fit geometry: no usable fit result was available, so there is no
  basis for adjusting it. The 7.60 mm dimension is the retaining-finger throat, not
  the main nut pocket: the hex pocket is 8.50 mm across flats. Finished knob is one
  printed piece, 30 mm across and 10 mm tall. The separate coupon is only a test print.'
questions:
- text: How did the previous 7.60 mm retaining throat fit?
  answer: Could not report the result for either print.
params:
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats; actual nut not measured
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_clearance:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: ''
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: ''
  floor_t:
    value: 3
    unit: mm
    kind: design
    source: design
    note: ''
  pocket_af_clearance:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Main hex pocket is nut_af plus this value
  nut_axial_play:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: ''
  finger_t:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: ''
  finger_w:
    value: 3.2
    unit: mm
    kind: design
    source: design
    note: ''
  finger_back_gap:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
  finger_side_gap:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: ''
  lip_intrusion:
    value: 0.45
    unit: mm
    kind: design
    source: design
    note: Each finger protrudes this far into pocket; throat = nut_af + pocket_af_clearance
      - 2*lip_intrusion = 7.60 mm
  lip_band_h:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: ''
  lead_h:
    value: 1.4
    unit: mm
    kind: design
    source: design
    note: ''
  lip_overlap:
    value: 0.08
    unit: mm
    kind: design
    source: design
    note: ''
  grip_count:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
  grip_cut_r:
    value: 2
    unit: mm
    kind: design
    source: design
    note: ''
  grip_cut_offset:
    value: 15.5
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_d:
    value: 18
    unit: mm
    kind: design
    source: design
    note: ''
  cut_extra:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    a=(p.nut_af+p.pocket_af_clearance)/2\n\
    \    zl=p.floor_t+p.nut_h+p.nut_axial_play\n    H=zl+p.lip_band_h+p.lead_h\n \
    \   out=cq.Workplane('XY').circle(p.knob_d/2).extrude(H)\n    for i in range(int(p.grip_count)):\n\
    \        t=2*math.pi*i/p.grip_count\n        out=out.cut(cq.Workplane('XY').center(p.grip_cut_offset*math.cos(t),p.grip_cut_offset*math.sin(t)).circle(p.grip_cut_r).extrude(H+p.cut_extra))\n\
    \    v=[(a,a/math.sqrt(3)),(0,2*a/math.sqrt(3)),(-a,a/math.sqrt(3)),(-a,-a/math.sqrt(3)),(0,-2*a/math.sqrt(3)),(a,-a/math.sqrt(3))]\n\
    \    out=out.cut(cq.Workplane('XY',origin=(0,0,p.floor_t)).polyline(v).close().extrude(H-p.floor_t+p.cut_extra))\n\
    \    out=out.cut(cq.Workplane('XY').circle((p.bolt_d+p.bolt_clearance)/2).extrude(H+p.cut_extra))\n\
    \    for s in (-1,1):\n        out=out.cut(cq.Workplane('XY',origin=(s*(a+p.finger_t+p.finger_back_gap/2),0,p.floor_t)).box(p.finger_back_gap,p.finger_w+2*p.finger_side_gap,H-p.floor_t+p.cut_extra,centered=(True,True,False)))\n\
    \        lo=a-p.lip_intrusion-p.cut_extra\n        hi=a+p.finger_t+p.finger_back_gap\n\
    \        for side in (-1,1):\n            out=out.cut(cq.Workplane('XY',origin=(s*(lo+hi)/2,side*(p.finger_w/2+p.finger_side_gap/2),p.floor_t)).box(hi-lo,p.finger_side_gap,H-p.floor_t+p.cut_extra,centered=(True,True,False)))\n\
    \        pts=[(s*(a-p.lip_intrusion),zl),(s*(a+p.lip_overlap),zl),(s*(a+p.lip_overlap),H),(s*a,H),(s*(a-p.lip_intrusion),zl+p.lip_band_h)]\n\
    \        out=out.union(cq.Workplane('XZ').polyline(pts).close().extrude(p.finger_w).translate((0,p.finger_w/2,0)))\n\
    \    return out\n"
  print_orientation: Flat underside on bed at z=0; nut opening upward. No supports.
  use_orientation: Nut inserts from top. Bolt axis Z, accessible from either end.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    a=(p.nut_af+p.pocket_af_clearance)/2\n\
    \    zl=p.floor_t+p.nut_h+p.nut_axial_play\n    H=zl+p.lip_band_h+p.lead_h\n \
    \   out=cq.Workplane('XY').circle(p.coupon_d/2).extrude(H)\n    v=[(a,a/math.sqrt(3)),(0,2*a/math.sqrt(3)),(-a,a/math.sqrt(3)),(-a,-a/math.sqrt(3)),(0,-2*a/math.sqrt(3)),(a,-a/math.sqrt(3))]\n\
    \    out=out.cut(cq.Workplane('XY',origin=(0,0,p.floor_t)).polyline(v).close().extrude(H-p.floor_t+p.cut_extra))\n\
    \    out=out.cut(cq.Workplane('XY').circle((p.bolt_d+p.bolt_clearance)/2).extrude(H+p.cut_extra))\n\
    \    for s in (-1,1):\n        out=out.cut(cq.Workplane('XY',origin=(s*(a+p.finger_t+p.finger_back_gap/2),0,p.floor_t)).box(p.finger_back_gap,p.finger_w+2*p.finger_side_gap,H-p.floor_t+p.cut_extra,centered=(True,True,False)))\n\
    \        lo=a-p.lip_intrusion-p.cut_extra\n        hi=a+p.finger_t+p.finger_back_gap\n\
    \        for side in (-1,1):\n            out=out.cut(cq.Workplane('XY',origin=(s*(lo+hi)/2,side*(p.finger_w/2+p.finger_side_gap/2),p.floor_t)).box(hi-lo,p.finger_side_gap,H-p.floor_t+p.cut_extra,centered=(True,True,False)))\n\
    \        pts=[(s*(a-p.lip_intrusion),zl),(s*(a+p.lip_overlap),zl),(s*(a+p.lip_overlap),H),(s*a,H),(s*(a-p.lip_intrusion),zl+p.lip_band_h)]\n\
    \        out=out.union(cq.Workplane('XZ').polyline(pts).close().extrude(p.finger_w).translate((0,p.finger_w/2,0)))\n\
    \    return out\n"
  print_orientation: Flat underside on bed at z=0; nut opening upward. No supports.
  use_orientation: Test only; not part of final assembly.
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
joints: []
criteria:
- id: hand_fit
  part: knob
  feature: Hex pocket and flexible entry fingers
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - nut_h
  - pocket_af_clearance
  - finger_t
  - lip_intrusion
  check:
    method: coupon
    ref: fit_coupon
    description: Nut must seat on floor with thumb pressure alone. Both fingers must
      return over nut without cracking or whitening.
- id: retention
  part: knob
  feature: Two retaining lips
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - lip_intrusion
  - nut_axial_play
  check:
    method: coupon
    ref: fit_coupon
    description: 'Without bolt, invert and gently shake: nut must remain captive.
      Repeat on finished knob.'
- id: stop
  part: knob
  feature: Pocket floor surrounding bolt hole
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - floor_t
  - bolt_d
  - bolt_clearance
  check:
    method: coupon
    ref: fit_coupon
    description: Nut rests fully recessed on floor and cannot pass through underside.
- id: torque
  part: knob
  feature: Hex pocket walls
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - pocket_af_clearance
  check:
    method: coupon
    ref: fit_coupon
    description: Nut must not spin freely; slight angular play is acceptable.
- id: passage
  part: knob
  feature: Axial through-hole
  relation: clears
  hardware: null
  clearance_mm: 0.3
  params:
  - bolt_d
  - bolt_clearance
  check:
    method: coupon
    ref: fit_coupon
    description: Intended M5 bolt threads by hand through nut and emerges opposite
      side without plastic interference.
manual:
- n: '1'
  text: 'Print fit_coupon first: PLA, 0.4 mm nozzle, 0.2 mm layers, 4 walls, 5 top/bottom
    layers, 25% infill. Open pocket upward, no supports. Keep finger relief slots
    empty.'
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Align nut flats with pocket and press straight down with your thumb until
    seated on floor. Both fingers must return inward above nut. Do not hammer or pull
    it in using a bolt. Check that it stays in when inverted, cannot pass through
    the floor, does not spin freely, and accepts your M5 bolt through both ends.
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: If insertion is too stiff, reduce lip_intrusion by 0.05 mm and reprint coupon.
    If retention fails, increase it by 0.05 mm and retest. If nut binds below fingers,
    increase pocket_af_clearance by 0.1 mm and retest. Reject cracked or whitened
    fingers. Do not proceed until checks pass.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '4'
  text: Recover nut by gently spreading both fingers while lifting it with your M5
    bolt threaded into it a few turns. Do not force the fingers. Print knob using
    successful parameters and the same settings and orientation.
  parts:
  - fit_coupon
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Press nut into knob by hand and repeat inversion and bolt-passage checks.
    Nut is fully recessed; small axial play is intentional. Thread your M5 bolt through
    the nut and out the opposite opening. The floor prevents nut passing through underside.
    No glue required.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '6'
  text: Light-duty hand tightening only. Do not use pliers or rely on it for safety-critical
    loads. Keep PLA away from heat. Replace knob if fingers crack or retention weakens.
  parts:
  - knob
  hardware: []
  tool: null
