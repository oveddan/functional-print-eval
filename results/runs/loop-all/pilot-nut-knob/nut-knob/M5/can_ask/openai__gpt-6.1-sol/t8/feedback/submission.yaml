task: nut-knob/M5
note: 'Unchanged fit geometry: no usable fit result was reported, so there is no evidence
  to justify tightening or loosening it. The 7.70 mm dimension is the retaining throat,
  not the main nut pocket; the pocket is 8.40 mm across flats. Print and check the
  coupon before committing to the knob. Finished assembly is one printed knob plus
  one M5 nut.'
