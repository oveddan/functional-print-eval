task: nut-knob/M5
note: 'Unchanged geometry: no usable fit feedback was available. The hex pocket is
  8.30 mm across flats. The retaining lips project inward to a local 7.40 mm opening;
  they flex outward during insertion. One printed knob plus one ISO 4032 M5 nut forms
  the finished assembly. Coupon is optional and sacrificial.'
questions:
- text: Can you measure nut across flats and thickness?
  answer: Cannot measure; use best judgment.
- text: Did either prior print accept and retain the nut?
  answer: No usable fit result supplied for either print.
