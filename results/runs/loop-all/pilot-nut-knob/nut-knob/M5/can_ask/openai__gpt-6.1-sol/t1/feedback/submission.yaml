parts:
- id: knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "import math\n\ndef build(p):\n    h=p.height\n    body=cq.Workplane('XY').circle(p.body_radius).extrude(h)\n\
    \    ring=p.knob_d/2-p.lobe_radius\n    for i in range(int(p.lobe_count)):\n \
    \       a=2*math.pi*i/p.lobe_count\n        body=body.union(cq.Workplane('XY').center(ring*math.cos(a),ring*math.sin(a)).circle(p.lobe_radius).extrude(h))\n\
    \    af=p.nut_af+p.socket_af_clearance\n    r=af/math.sqrt(3)\n    vertices=[(r*math.cos(math.radians(30+60*i)),r*math.sin(math.radians(30+60*i)))\
    \ for i in range(6)]\n    body=body.cut(cq.Workplane('XY').workplane(offset=p.floor_t).polyline(vertices).close().extrude(h-p.floor_t+p.cut_overrun))\n\
    \    body=body.cut(cq.Workplane('XY').circle((p.bolt_d+p.bolt_d_clearance)/2).extrude(h+p.cut_overrun))\n\
    \    x=af/2\n    z0=p.finger_root_z\n    cut_h=h-z0+p.cut_overrun\n    for i in\
    \ range(int(p.finger_count)):\n        angle=i*360/p.finger_count\n        back=cq.Workplane('XY').box(p.finger_back_gap,p.finger_width+2*p.finger_side_gap,cut_h,centered=(False,True,False)).translate((x+p.finger_t,0,z0))\n\
    \        body=body.cut(back.rotate((0,0,0),(0,0,1),angle))\n        for sign in\
    \ (-1,1):\n            side=cq.Workplane('XY').box(p.cut_overrun+p.finger_t+p.finger_back_gap,p.finger_side_gap,cut_h,centered=(False,True,False)).translate((x-p.cut_overrun,sign*(p.finger_width+p.finger_side_gap)/2,z0))\n\
    \            body=body.cut(side.rotate((0,0,0),(0,0,1),angle))\n    lip_z=p.floor_t+p.nut_h+p.nut_axial_clearance\n\
    \    profile=[(x+p.lip_union_overlap,lip_z),(x-p.lip_projection,lip_z),(x-p.lip_projection,lip_z+p.lip_vertical_land),(x,p.lip_top_z),(x+p.lip_union_overlap,p.lip_top_z)]\n\
    \    for i in range(int(p.finger_count)):\n        lip=cq.Workplane('XZ').polyline(profile).close().extrude(p.finger_width).translate((0,p.finger_width/2,0))\n\
    \        body=body.union(lip.rotate((0,0,0),(0,0,1),i*360/p.finger_count))\n \
    \   return body\n"
  print_orientation: Flat bottom on bed at z=0; pocket upward. No supports.
  use_orientation: Nut enters from +Z. Bolt runs along Z and may enter from either
    side.
- id: socket_coupon
  role: coupon
  material: PLA (high-speed PLA, black)
  code: "import math\n\ndef build(p):\n    h=p.height\n    body=cq.Workplane('XY').circle(p.coupon_d/2).extrude(h)\n\
    \    af=p.nut_af+p.socket_af_clearance\n    r=af/math.sqrt(3)\n    vertices=[(r*math.cos(math.radians(30+60*i)),r*math.sin(math.radians(30+60*i)))\
    \ for i in range(6)]\n    body=body.cut(cq.Workplane('XY').workplane(offset=p.floor_t).polyline(vertices).close().extrude(h-p.floor_t+p.cut_overrun))\n\
    \    body=body.cut(cq.Workplane('XY').circle((p.bolt_d+p.bolt_d_clearance)/2).extrude(h+p.cut_overrun))\n\
    \    x=af/2\n    z0=p.finger_root_z\n    cut_h=h-z0+p.cut_overrun\n    for i in\
    \ range(int(p.finger_count)):\n        angle=i*360/p.finger_count\n        back=cq.Workplane('XY').box(p.finger_back_gap,p.finger_width+2*p.finger_side_gap,cut_h,centered=(False,True,False)).translate((x+p.finger_t,0,z0))\n\
    \        body=body.cut(back.rotate((0,0,0),(0,0,1),angle))\n        for sign in\
    \ (-1,1):\n            side=cq.Workplane('XY').box(p.cut_overrun+p.finger_t+p.finger_back_gap,p.finger_side_gap,cut_h,centered=(False,True,False)).translate((x-p.cut_overrun,sign*(p.finger_width+p.finger_side_gap)/2,z0))\n\
    \            body=body.cut(side.rotate((0,0,0),(0,0,1),angle))\n    lip_z=p.floor_t+p.nut_h+p.nut_axial_clearance\n\
    \    profile=[(x+p.lip_union_overlap,lip_z),(x-p.lip_projection,lip_z),(x-p.lip_projection,lip_z+p.lip_vertical_land),(x,p.lip_top_z),(x+p.lip_union_overlap,p.lip_top_z)]\n\
    \    for i in range(int(p.finger_count)):\n        lip=cq.Workplane('XZ').polyline(profile).close().extrude(p.finger_width).translate((0,p.finger_width/2,0))\n\
    \        body=body.union(lip.rotate((0,0,0),(0,0,1),i*360/p.finger_count))\n \
    \   return body\n"
  print_orientation: Flat bottom on bed at z=0; pocket upward. No supports. Match
    knob settings.
  use_orientation: Sacrificial fit test only; not part of finished assembly.
hardware:
- id: captive_nut
  ref: ISO 4032 M5
  qty: 1
joints: []
criteria:
- id: hex_fit
  part: knob
  feature: 8.30 mm across-flats socket below retaining lips
  relation: contains
  hardware: captive_nut
  clearance_mm: 0.15
  params:
  - nut_af
  - socket_af_clearance
  check:
    method: coupon
    ref: socket_coupon
    description: Nut must press in by thumb with flats aligned, without cracking or
      whitening tabs.
- id: retention
  part: knob
  feature: Three spring lips
  relation: engages
  hardware: captive_nut
  clearance_mm: null
  params:
  - lip_projection
  - finger_t
  - finger_root_z
  - nut_h
  - nut_axial_clearance
  check:
    method: coupon
    ref: socket_coupon
    description: All three lips spring back above seated nut; nut remains in place
      when inverted and gently shaken.
- id: bottom_stop
  part: knob
  feature: 3 mm floor around 5.60 mm hole
  relation: supports
  hardware: captive_nut
  clearance_mm: null
  params:
  - floor_t
  - bolt_d
  - bolt_d_clearance
  - nut_af
  check:
    method: coupon
    ref: socket_coupon
    description: Nut is fully below top surface and cannot be pressed through the
      bottom hole by hand.
- id: bolt_passage
  part: knob
  feature: 5.60 mm axial bore
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - bolt_d
  - bolt_d_clearance
  check:
    method: measure
    ref: null
    description: Intended M5 bolt must pass through plastic freely and thread through
      nut by hand.
manual:
- n: '1'
  text: 'Optional but recommended: print socket_coupon first, using 0.2 mm layers,
    4 walls, 5 top/bottom layers, 30% infill and no supports. Keep spring gaps empty.
    Use identical settings for knob. Coupon is a test only, not part of assembly.'
  parts:
  - socket_coupon
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Cool the print fully. Remove loose strings without cutting tabs or enlarging
    the pocket. Verify tabs are not fused to surrounding walls.
  parts:
  - socket_coupon
  - knob
  hardware: []
  tool: null
- n: '3'
  text: For the coupon test, align nut flats and press straight down with your thumb
    until seated on the shoulder and all three lips spring back above it. Do not hammer
    or use a bolt to pull it in. Check upside-down retention and free threading with
    your intended M5 bolt. Stop if insertion requires excessive force or a tab cracks
    or whitens.
  parts:
  - socket_coupon
  hardware:
  - captive_nut
  tool: null
- n: '4'
  text: If fit fails, do not force assembly. A further fit revision needs to know
    whether insertion is too tight or retention is too loose. If you used the coupon,
    recover the nut by carefully cutting away its sacrificial walls and tabs with
    side cutters; wear eye protection and keep fingers clear. Do not force nut through
    bottom hole.
  parts:
  - socket_coupon
  hardware:
  - captive_nut
  tool: Side cutters and eye protection, only if recovering nut from coupon
- n: '5'
  text: Print knob after fit testing. Press the nut in by hand as above. Confirm all
    three lips return, the nut is entirely below the top surface, and it stays captive
    upside down. No glue or additional assembly hardware is required.
  parts:
  - knob
  hardware:
  - captive_nut
  tool: null
- n: '6'
  text: Thread your M5 bolt through the captive nut from either side. Tighten using
    the knob by hand only; do not add torque using pliers. Hex flats transmit torque
    and tabs retain the nut during handling. Avoid high heat and replace if cracked.
    Not a rated or safety-critical fastener.
  parts:
  - knob
  hardware:
  - captive_nut
  tool: null
