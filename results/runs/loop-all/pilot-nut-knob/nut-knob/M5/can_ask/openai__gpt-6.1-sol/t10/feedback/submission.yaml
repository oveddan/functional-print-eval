parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    a=(p.nut_af+p.hex_allowance)/2\n    outer=a+p.finger_t\n\
    \    throat=p.nut_af/2-p.snap_overlap\n    lip_z=p.floor+p.nut_h+p.nut_axial_play\n\
    \    body=cq.Workplane('XY').circle(p.knob_d/2).extrude(p.height)\n    for k in\
    \ range(int(p.scallop_count)):\n        t=2*math.pi*k/p.scallop_count\n      \
    \  cut=cq.Workplane('XY').center(p.scallop_offset*math.cos(t),p.scallop_offset*math.sin(t)).circle(p.scallop_radius).extrude(p.height)\n\
    \        body=body.cut(cut)\n    verts=[(a/math.cos(math.pi/6)*math.cos(math.pi/6+k*math.pi/3),a/math.cos(math.pi/6)*math.sin(math.pi/6+k*math.pi/3))\
    \ for k in range(6)]\n    body=body.cut(cq.Workplane('XY').workplane(offset=p.floor).polyline(verts).close().extrude(p.height-p.floor))\n\
    \    body=body.cut(cq.Workplane('XY').circle((p.bolt_d+p.bore_allowance)/2).extrude(p.height))\n\
    \    for angle in (0,180):\n        slots=cq.Workplane('XY').box(p.relief,p.finger_w+2*p.relief,p.height-p.slot_start,centered=(True,True,False)).translate((outer+p.relief/2,0,p.slot_start))\n\
    \        for sign in (-1,1):\n            side=cq.Workplane('XY').box(p.finger_t+p.relief,p.relief,p.height-p.slot_start,centered=(True,True,False)).translate(((a+outer+p.relief)/2,sign*(p.finger_w/2+p.relief/2),p.slot_start))\n\
    \            slots=slots.union(side)\n        body=body.cut(slots.rotate((0,0,0),(0,0,1),angle))\n\
    \        lip=cq.Workplane('XZ').polyline([(a,lip_z),(throat,lip_z),(throat,lip_z+p.lip_land),(a,p.height)]).close().extrude(p.finger_w/2,both=True)\n\
    \        body=body.union(lip.rotate((0,0,0),(0,0,1),angle))\n    return body\n"
  print_orientation: Closed flat underside on bed at z=0; hex pocket upward. No supports.
  use_orientation: Nut enters from the pocket side; bolt passes through the underside
    hole and nut.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    a=(p.nut_af+p.hex_allowance)/2\n    outer=a+p.finger_t\n\
    \    throat=p.nut_af/2-p.snap_overlap\n    lip_z=p.floor+p.nut_h+p.nut_axial_play\n\
    \    body=cq.Workplane('XY').circle(p.coupon_d/2).extrude(p.height)\n    verts=[(a/math.cos(math.pi/6)*math.cos(math.pi/6+k*math.pi/3),a/math.cos(math.pi/6)*math.sin(math.pi/6+k*math.pi/3))\
    \ for k in range(6)]\n    body=body.cut(cq.Workplane('XY').workplane(offset=p.floor).polyline(verts).close().extrude(p.height-p.floor))\n\
    \    body=body.cut(cq.Workplane('XY').circle((p.bolt_d+p.bore_allowance)/2).extrude(p.height))\n\
    \    for angle in (0,180):\n        slots=cq.Workplane('XY').box(p.relief,p.finger_w+2*p.relief,p.height-p.slot_start,centered=(True,True,False)).translate((outer+p.relief/2,0,p.slot_start))\n\
    \        for sign in (-1,1):\n            side=cq.Workplane('XY').box(p.finger_t+p.relief,p.relief,p.height-p.slot_start,centered=(True,True,False)).translate(((a+outer+p.relief)/2,sign*(p.finger_w/2+p.relief/2),p.slot_start))\n\
    \            slots=slots.union(side)\n        body=body.cut(slots.rotate((0,0,0),(0,0,1),angle))\n\
    \        lip=cq.Workplane('XZ').polyline([(a,lip_z),(throat,lip_z),(throat,lip_z+p.lip_land),(a,p.height)]).close().extrude(p.finger_w/2,both=True)\n\
    \        body=body.union(lip.rotate((0,0,0),(0,0,1),angle))\n    return body\n"
  print_orientation: Flat underside on bed at z=0; hex pocket upward. No supports.
  use_orientation: Test nut insertion, retention, and bolt passage; not assembled
    into the finished knob.
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
- id: bolt
  ref: ISO 4762 M5x20
  qty: 1
joints:
- id: bolt_through_knob
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: Flat underside around central bore
    role: head_seat
  - part: knob
    feature: Central through-hole
    role: clearance
  - part: knob
    feature: Hex pocket with floor and flexible retaining lips
    role: nut_pocket
  nut: nut
  external: null
criteria:
- id: nut_seating
  part: knob
  feature: Hex pocket and bottom stop
  relation: seats
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - nut_h
  - hex_allowance
  - floor
  check:
    method: coupon
    ref: fit_coupon
    description: Nut presses down by hand onto the floor, fully below the top face,
      and cannot rotate or pass through the floor.
- id: nut_retention
  part: knob
  feature: Two integral snap lips
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - snap_overlap
  - finger_t
  - finger_w
  - nut_axial_play
  check:
    method: coupon
    ref: fit_coupon
    description: Both fingers spring back over the seated nut. Nut remains captured
      when inverted and gently shaken; no cracks or permanently bent fingers.
- id: bolt_clearance
  part: knob
  feature: Through bore aligned with nut
  relation: clears
  hardware: bolt
  clearance_mm: null
  params:
  - bolt_d
  - bore_allowance
  check:
    method: coupon
    ref: fit_coupon
    description: Bolt passes freely through the printed hole, threads through the
      nut by hand, and emerges from the other side.
manual:
- n: '1'
  text: 'Recommended: print fit_coupon first, pocket upward, in PLA at 0.2 mm layers
    with 4 walls and 30% infill. Use no supports. Cool completely and clear any strings
    from the finger slots.'
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Align the nut flats to the hex pocket. Press straight down by thumb until
    the nut rests on the floor and both fingers return over it. Do not hammer or force
    it. Invert and gently shake: the nut must remain captured. Check bolt passage
    from the underside.'
  parts:
  - fit_coupon
  hardware:
  - nut
  - bolt
  tool: null
- n: '3'
  text: If the lips require excessive force, reduce snap_overlap by 0.05 mm and retest.
    If the hex walls bind, increase hex_allowance by 0.10 mm. If the nut falls out,
    increase snap_overlap by 0.05 mm and retest. Reject cracked or permanently bent
    fingers. Recover the coupon nut by gently spreading the fingers just enough to
    release it while pushing upward through the bottom hole with the bolt tip; do
    not pry hard.
  parts:
  - fit_coupon
  hardware:
  - nut
  - bolt
  tool: null
- n: '4'
  text: Print knob using the tested parameters and identical settings. Clear strings
    and cool fully. Press the nut into its pocket as tested. Only knob and nut remain
    in the finished assembly; the coupon is not an assembly part.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Insert the bolt through the flat underside and thread it through the nut.
    The listed M5x20 is an example bolt; working length depends on your application.
    Turn the knob with modest hand force only. The nut is retained against rotation
    and falling out, but the bolt is not permanently locked to the knob. Avoid pliers,
    excessive torque, and heat.
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: null
