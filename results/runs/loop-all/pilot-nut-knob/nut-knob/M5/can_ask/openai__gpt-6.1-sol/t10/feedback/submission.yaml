task: nut-knob/M5
note: 'Unchanged fit geometry: no usable fit result was reported, so there is no basis
  for changing tolerances. The hex pocket is 8.35 mm across flats; 7.80 mm is only
  the gap between the flexible retaining lips, not the full pocket width. The coupon
  is optional and is not part of the finished one-piece knob.'
