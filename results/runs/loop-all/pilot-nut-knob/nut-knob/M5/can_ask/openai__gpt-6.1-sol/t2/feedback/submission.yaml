parts:
- id: knob
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    af = p.nut_af+p.pocket_allowance\n  \
    \  h = p.height\n    b = cq.Workplane('XY').circle(p.knob_d/2).extrude(h)\n  \
    \  for i in range(int(p.grip_count)):\n        a = 2*math.pi*i/p.grip_count\n\
    \        b = b.cut(cq.Workplane('XY').center(p.knob_d/2*math.cos(a),p.knob_d/2*math.sin(a)).circle(p.grip_cut_d/2).extrude(h))\n\
    \    verts = [(af/math.sqrt(3)*math.cos(math.pi*i/3),af/math.sqrt(3)*math.sin(math.pi*i/3))\
    \ for i in range(6)]\n    b = b.cut(cq.Workplane('XY').workplane(offset=p.floor).polyline(verts).close().extrude(h))\n\
    \    b = b.cut(cq.Workplane('XY').circle((p.bolt_d+p.bolt_allowance)/2).extrude(h))\n\
    \    inner = af/2\n    outer = inner+p.finger_wall\n    w = p.finger_width\n \
    \   s = p.slot_width\n    zlip = p.floor+p.nut_h+p.axial_play\n    for sign in\
    \ (-1,1):\n        b = b.cut(cq.Workplane('XY').box(w+2*s,s,h-p.root_z,centered=(True,True,False)).translate((0,sign*(outer+s/2),p.root_z)))\n\
    \        y0 = inner-p.slot_overlap\n        y1 = outer+s\n        for side in\
    \ (-1,1):\n            b = b.cut(cq.Workplane('XY').box(s,y1-y0,h-p.root_z,centered=(True,True,False)).translate((side*(w/2+s/2),sign*(y0+y1)/2,p.root_z)))\n\
    \        b = b.cut(cq.Workplane('XY').box(w,y1-y0,h-p.finger_top,centered=(True,True,False)).translate((0,sign*(y0+y1)/2,p.finger_top)))\n\
    \        tip = (p.nut_af-p.latch_interference)/2\n        profile = [(sign*inner,zlip),(sign*tip,zlip),(sign*tip,zlip+p.lip_land),(sign*inner,zlip+p.lip_land+p.ramp_h)]\n\
    \        b = b.union(cq.Workplane('YZ').polyline(profile).close().extrude(w).translate((-w/2,0,0)))\n\
    \    return b"
  print_orientation: Flat underside on bed at z=0; nut opening upward. No supports.
  use_orientation: Nut enters top pocket. Bolt follows z axis. Solid underside faces
    clamped work.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    import math\n    af = p.nut_af+p.pocket_allowance\n  \
    \  h = p.height\n    b = cq.Workplane('XY').circle(p.coupon_d/2).extrude(h)\n\
    \    verts = [(af/math.sqrt(3)*math.cos(math.pi*i/3),af/math.sqrt(3)*math.sin(math.pi*i/3))\
    \ for i in range(6)]\n    b = b.cut(cq.Workplane('XY').workplane(offset=p.floor).polyline(verts).close().extrude(h))\n\
    \    b = b.cut(cq.Workplane('XY').circle((p.bolt_d+p.bolt_allowance)/2).extrude(h))\n\
    \    inner = af/2\n    outer = inner+p.finger_wall\n    w = p.finger_width\n \
    \   s = p.slot_width\n    zlip = p.floor+p.nut_h+p.axial_play\n    for sign in\
    \ (-1,1):\n        b = b.cut(cq.Workplane('XY').box(w+2*s,s,h-p.root_z,centered=(True,True,False)).translate((0,sign*(outer+s/2),p.root_z)))\n\
    \        y0 = inner-p.slot_overlap\n        y1 = outer+s\n        for side in\
    \ (-1,1):\n            b = b.cut(cq.Workplane('XY').box(s,y1-y0,h-p.root_z,centered=(True,True,False)).translate((side*(w/2+s/2),sign*(y0+y1)/2,p.root_z)))\n\
    \        b = b.cut(cq.Workplane('XY').box(w,y1-y0,h-p.finger_top,centered=(True,True,False)).translate((0,sign*(y0+y1)/2,p.finger_top)))\n\
    \        tip = (p.nut_af-p.latch_interference)/2\n        profile = [(sign*inner,zlip),(sign*tip,zlip),(sign*tip,zlip+p.lip_land),(sign*inner,zlip+p.lip_land+p.ramp_h)]\n\
    \        b = b.union(cq.Workplane('YZ').polyline(profile).close().extrude(w).translate((-w/2,0,0)))\n\
    \    return b"
  print_orientation: Flat underside on bed at z=0; opening upward. No supports.
  use_orientation: Test only; duplicates final nut pocket, shoulder, fingers and bolt
    passage.
