- id: bolt_joint
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: Central 5.6 mm through passage; illustrative bench-check bolt location
    role: clearance
  nut: null
  external: 'Captured hardware nut: ISO 4032 M5 at z=2.4 to 7.1 mm. In service bolt
    head seats on external work.'
criteria:
- id: hex_fit
  part: knob
  feature: 8.4 mm across-flats hex pocket
  relation: contains
  hardware: nut
  clearance_mm: 0.4
  params:
  - nut_af
  - pocket_allowance
  check:
    method: coupon
    ref: fit_coupon
    description: Nut presses fully home using fingers only.
- id: retention
  part: knob
  feature: Two snap fingers with 7.5 mm opposed tip gap and 0.4 mm nominal axial play
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - nut_h
  - latch_interference
  - axial_play
  - floor
  - finger_wall
  - finger_width
  check:
    method: coupon
    ref: fit_coupon
    description: Both fingers spring back over nut. Nut stays captured when inverted
      and gently shaken without bolt. No cracks or permanent deformation.
- id: stop
  part: knob
  feature: 2.4 mm bottom shoulder around 5.6 mm passage
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - floor
  - bolt_d
  - bolt_allowance
  - nut_af
  check:
    method: coupon
    ref: fit_coupon
    description: Nut rests on shoulder and cannot pass through bottom opening.
- id: recess
  part: knob
  feature: Nut top nominally at z=7.1 mm below 10.4 mm rim
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - floor
  - nut_h
  - height
  check:
    method: coupon
    ref: fit_coupon
    description: Nut is entirely below rim.
- id: bolt_path
  part: knob
  feature: Central through passage
  relation: clears
  hardware: bolt
  clearance_mm: 0.6
  params:
  - bolt_d
  - bolt_allowance
  check:
    method: coupon
    ref: fit_coupon
    description: Bolt threads through nut by hand and tip exits opposite face without
      binding on plastic.
manual:
- n: '1'
  text: 'Print fit_coupon first: PLA, 0.2 mm layers, flat underside down, 4 walls,
    5 top/bottom layers and 30% infill. Disable supports, including in slots. Use
    identical settings for knob. The hex pocket is 8.4 mm across flats; 7.5 mm describes
    only the opposed retaining-tip gap.'
  parts:
  - fit_coupon
  hardware: []
  tool: 3D printer
- n: '2'
  text: Cool fully and remove stray strings. Align nut flats with pocket and push
    straight down with your thumb until both fingers spring back above it. Do not
    hammer or use bolt to force insertion. Nut must be entirely below rim.
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: Invert and gently shake over a tray without bolt. Nut must stay in and fingers
    must be intact and returned. Thread bolt through by hand to confirm its tip exits
    the other face. If latch force is excessive, reduce latch_interference from 0.5
    to 0.3 mm and reprint coupon. If hex walls bind, increase pocket_allowance by
    0.1 mm and retest. If retention fails, increase latch_interference by 0.1 mm and
    retest. Do not proceed with failed tests.
  parts:
  - fit_coupon
  hardware:
  - nut
  - bolt
  tool: null
- n: '4'
  text: Print knob with validated parameters and identical settings. To recover test
    nut, remove bolt, gently spread coupon fingers with fingertips and push nut out
    from underneath with a fingertip. If it will not release by hand, sacrifice coupon
    or use another identical nut; do not pry against fingers intended for reuse.
  parts:
  - knob
  - fit_coupon
  hardware:
  - nut
  tool: 3D printer
- n: '5'
  text: Press nut into knob as tested. Verify both latches return, nut sits fully
    inside and inversion retention passes. No glue or extra printed pieces are needed.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '6'
  text: Turn knob onto M5 bolt by hand. Face solid underside toward clamped work so
    tightening loads the shoulder, not snap fingers. M5x30 is listed for fit checking;
    available projection must suit your application. Tighten only by hand without
    pliers or levers. Avoid heat and safety-critical use.
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: null
