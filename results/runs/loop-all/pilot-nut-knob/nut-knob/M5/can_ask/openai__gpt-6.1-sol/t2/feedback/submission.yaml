task: nut-knob/M5
note: 'Unchanged geometry: 30 mm one-piece knob, 8.4 mm across-flats nut pocket and
  7.5 mm gap between snap-retaining tips. Previous print feedback did not establish
  fit, so no dimensional correction has been made. Optional coupon tests the same
  retention features.'
