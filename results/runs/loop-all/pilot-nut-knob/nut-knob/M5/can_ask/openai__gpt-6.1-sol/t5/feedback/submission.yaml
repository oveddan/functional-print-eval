task: nut-knob/M5
note: 'Unchanged fit geometry: the print report did not establish whether the fit
  passed or failed. The main hex socket is 8.40 mm across flats; the catches project
  inward to a nominal 7.50 mm envelope. That smaller entry dimension is intentional:
  the tabs flex during insertion. Print and test the optional coupon first. Finished
  assembly is one printed knob and one M5 nut.'
questions:
- text: Can the nut dimensions be measured?
  answer: No; use best judgment.
- text: Did the previous print accept and retain the nut?
  answer: No usable fit result was available.
