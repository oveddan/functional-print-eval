task: nut-knob/M5
note: 'Unchanged fit geometry: 8.30 mm across-flats hex socket, 7.60 mm relaxed gap
  between retaining lips. The reported 7.64 mm pocket result did not establish fit,
  so no fit adjustment has been made. Print the coupon first. Finished assembly uses
  one printed knob and one M5 nut; the coupon is only a test print. Catalog-based,
  unverified fit; intended for light hand tightening at room temperature.'
