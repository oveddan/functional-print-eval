task: nut-knob/M5
note: 'Resubmitted unchanged: no usable fit result was available. Main hex pocket
  is 8.4 mm across flats, not 7.6 mm; inward retaining lips locally narrow the opening.
  One printed knob captures one ISO 4032 M5 nut without glue. Optional coupon is a
  separate test print, not part of the assembly. Nominal nut dimensions are unverified;
  test before printing the knob. For light hand tightening only.'
questions:
- text: Can you measure the nut across flats and thickness?
  answer: Cannot measure; use best judgment.
- text: How did the previous prints fit?
  answer: No confirmed fit result for either print; reported pocket label was 7.60
    mm.
