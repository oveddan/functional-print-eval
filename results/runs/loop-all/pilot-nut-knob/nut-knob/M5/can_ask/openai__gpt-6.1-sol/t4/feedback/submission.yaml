parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    h=p.knob_h\n    a=(p.nut_af+p.pocket_af_clearance)/2\n\
    \    r=2*a/math.sqrt(3)\n    body=cq.Workplane('XY').circle(p.knob_d/2).extrude(h)\n\
    \    for i in range(int(p.grip_count)):\n        t=2*math.pi*i/p.grip_count\n\
    \        cut=cq.Workplane('XY').center(p.grip_center_radius*math.cos(t),p.grip_center_radius*math.sin(t)).circle(p.grip_radius).extrude(h)\n\
    \        body=body.cut(cut)\n    pts=[(r*math.cos(math.radians(30+60*i)),r*math.sin(math.radians(30+60*i)))\
    \ for i in range(6)]\n    pocket=cq.Workplane('XY').workplane(offset=p.floor_h).polyline(pts).close().extrude(h-p.floor_h)\n\
    \    body=body.cut(pocket).cut(cq.Workplane('XY').circle((p.bolt_d+p.bolt_d_clearance)/2).extrude(h))\n\
    \    w=p.tab_width\n    x1=a+p.tab_wall\n    x2=x1+p.tab_slot\n    z=p.tab_root_z\n\
    \    def boxcut(xlo,xhi,ylo,yhi):\n        return cq.Workplane('XY').box(xhi-xlo,yhi-ylo,h-z,centered=(False,False,False)).translate((xlo,ylo,z))\n\
    \    slots=boxcut(x1,x2,-w/2-p.tab_slot,w/2+p.tab_slot)\n    slots=slots.union(boxcut(a-p.slot_inner_overlap,x2,w/2,w/2+p.tab_slot))\n\
    \    slots=slots.union(boxcut(a-p.slot_inner_overlap,x2,-w/2-p.tab_slot,-w/2))\n\
    \    low=p.floor_h+p.nut_h+p.lip_above_nut\n    profile=[(a,low),(a-p.lip_projection,low+p.lip_lower_ramp_h),(a,low+p.lip_lower_ramp_h+p.lip_upper_ramp_h)]\n\
    \    lip=cq.Workplane('XZ').polyline(profile).close().extrude(w/2,both=True)\n\
    \    for angle in (0,120,240):\n        body=body.cut(slots.rotate((0,0,0),(0,0,1),angle))\n\
    \        body=body.union(lip.rotate((0,0,0),(0,0,1),angle))\n    return body.clean()\n"
  print_orientation: Flat circular shoulder face down at z=0. Pocket and retaining
    tabs face up. No supports.
  use_orientation: Nut inserts from the z=9 pocket opening; bolt axis is Z.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    h=p.knob_h\n    a=(p.nut_af+p.pocket_af_clearance)/2\n\
    \    r=2*a/math.sqrt(3)\n    body=cq.Workplane('XY').circle(p.coupon_d/2).extrude(h)\n\
    \    pts=[(r*math.cos(math.radians(30+60*i)),r*math.sin(math.radians(30+60*i)))\
    \ for i in range(6)]\n    body=body.cut(cq.Workplane('XY').workplane(offset=p.floor_h).polyline(pts).close().extrude(h-p.floor_h))\n\
    \    body=body.cut(cq.Workplane('XY').circle((p.bolt_d+p.bolt_d_clearance)/2).extrude(h))\n\
    \    w=p.tab_width\n    x1=a+p.tab_wall\n    x2=x1+p.tab_slot\n    z=p.tab_root_z\n\
    \    def boxcut(xlo,xhi,ylo,yhi):\n        return cq.Workplane('XY').box(xhi-xlo,yhi-ylo,h-z,centered=(False,False,False)).translate((xlo,ylo,z))\n\
    \    slots=boxcut(x1,x2,-w/2-p.tab_slot,w/2+p.tab_slot)\n    slots=slots.union(boxcut(a-p.slot_inner_overlap,x2,w/2,w/2+p.tab_slot))\n\
    \    slots=slots.union(boxcut(a-p.slot_inner_overlap,x2,-w/2-p.tab_slot,-w/2))\n\
    \    low=p.floor_h+p.nut_h+p.lip_above_nut\n    lip=cq.Workplane('XZ').polyline([(a,low),(a-p.lip_projection,low+p.lip_lower_ramp_h),(a,low+p.lip_lower_ramp_h+p.lip_upper_ramp_h)]).close().extrude(w/2,both=True)\n\
    \    for angle in (0,120,240):\n        body=body.cut(slots.rotate((0,0,0),(0,0,1),angle))\n\
    \        body=body.union(lip.rotate((0,0,0),(0,0,1),angle))\n    return body.clean()\n"
  print_orientation: Flat shoulder face at z=0 on bed; pocket faces up. No supports.
  use_orientation: Bench test only; identical pocket, floor, bolt passage and tabs
    to knob.
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
joints: []
criteria:
- id: nut_seating
  part: knob
  feature: 8.4 mm AF hex pocket with floor at z=3; nominal nut top at z=7.7 below
    knob top at z=9
  relation: contains
  hardware: nut
  clearance_mm: 0.4
  params:
  - nut_af
  - nut_h
  - pocket_af_clearance
  - floor_h
  - knob_h
  check:
    method: coupon
    ref: fit_coupon
    description: Nut must seat flat using fingers only, fully recessed, without cracking
      tabs, and must not rotate freely.
- id: snap_retention
  part: knob
  feature: Three flexible tongues with inward lips above seated nut
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - tab_width
  - tab_wall
  - tab_slot
  - tab_root_z
  - lip_projection
  - lip_above_nut
  - lip_lower_ramp_h
  - lip_upper_ramp_h
  check:
    method: coupon
    ref: fit_coupon
    description: After insertion, turn pocket-down and shake gently over a table.
      Nut must remain captured and tabs must return inward without whitening or cracks.
- id: shoulder
  part: knob
  feature: 3 mm thick floor surrounding 5.6 mm bolt passage
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - floor_h
  - bolt_d
  - bolt_d_clearance
  - nut_af
  check:
    method: coupon
    ref: fit_coupon
    description: 'Press seated nut toward floor with thumb: it must not pass through
      opposite face.'
- id: bolt_passage
  part: knob
  feature: Axial 5.6 mm through-hole aligned with nut thread
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - bolt_d
  - bolt_d_clearance
  check:
    method: coupon
    ref: fit_coupon
    description: Thread your M5 bolt through captured nut by fingers; it must emerge
      through opposite face without binding on plastic.
manual:
- n: '1'
  text: Print fit_coupon first in PLA at 0.2 mm layers with a 0.4 mm nozzle, 4 walls
    and 100% infill. Disable supports. Use the same settings for knob. Keep narrow
    tab slots clear of brim, support and debris.
  parts:
  - fit_coupon
  hardware: []
  tool: Slicer
- n: '2'
  text: Let coupon cool. Align nut flats with hex pocket. Push straight down evenly
    with your thumb until it passes the three lips and rests on the floor. Do not
    hammer, heat, or use pliers; stop if it requires more than firm finger pressure
    or tabs whiten.
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: 'Confirm nut is entirely recessed, cannot turn in the pocket, and remains
    captured with opening facing down and gentle shaking. Try your M5 bolt from the
    pocket side: it must thread normally and emerge through the floor hole. If fit
    fails, do not print the full knob: reduce lip_projection by 0.1 mm for excessive
    insertion force, or increase it by 0.1 mm for poor retention, then retest. Change
    pocket_af_clearance only if the hex pocket itself binds the nut. A cracked tab
    requires a fresh print.'
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '4'
  text: Recover the test nut by gently deflecting the tabs outward while easing nut
    up; do not lever against one tab. If necessary sacrifice the coupon rather than
    damage the nut. Print knob with verified parameters, flat floor face on bed, pocket
    up, no supports.
  parts:
  - fit_coupon
  - knob
  hardware:
  - nut
  tool: Slicer
- n: '5'
  text: Press nut into knob as tested. Repeat inverted retention and bolt-passage
    checks. Coupon is not used in final assembly; knob is the only printed component.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '6'
  text: 'Thread onto your M5 bolt and tighten by hand only. This is a captive-nut
    knob, not a bolt-head socket: it turns the nut on the bolt. Stop if plastic distorts
    or nut starts rotating. Keep away from heat and inspect tabs after any nut removal.'
  parts:
  - knob
  hardware:
  - nut
  tool: null
