task: nut-knob/M5
note: 'Geometry unchanged: no usable fit feedback was available. Final knob fit_af
  remains an UNVERIFIED 7.90 mm. Coupon throat sizes are 7.80, 7.90, 8.00 and 8.10
  mm (not 8.01). Print and test the coupon before using the knob. Finished knob is
  one printed piece with a recessed, rotation-captured M5 nut, friction-retention
  ribs, and a retaining floor around a bolt clearance hole.'
questions:
- text: Measured nut dimensions?
  answer: User cannot measure; nominal catalog dimensions used.
- text: Did any printed pocket pass the fit test?
  answer: No usable result reported for any pocket; fit remains unverified.
