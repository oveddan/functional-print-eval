parts:
- id: knob
  role: final
  material: PLA (high-speed PLA, black)
  code: "import math\n\ndef build(p):\n    h = p.floor_t + p.nut_h + p.pocket_extra_depth\n\
    \    pocket_af = p.nut_af + p.pocket_af_clearance\n    body = cq.Workplane('XY').circle(p.knob_d/2).extrude(h)\n\
    \    for i in range(int(p.scallop_count)):\n        a = 2*math.pi*i/p.scallop_count\n\
    \        x,y = p.scallop_center_r*math.cos(a),p.scallop_center_r*math.sin(a)\n\
    \        tool = cq.Workplane('XY').center(x,y).circle(p.scallop_r).extrude(h+p.cut_overrun)\n\
    \        body = body.cut(tool)\n    pocket = cq.Workplane('XY').workplane(offset=p.floor_t).polygon(6,pocket_af/math.cos(math.pi/6)).extrude(h-p.floor_t+p.cut_overrun)\n\
    \    body = body.cut(pocket)\n    center_r = p.fit_af/2 + p.rib_r\n    tip_r =\
    \ max(p.cut_overrun, center_r-pocket_af/2+p.cut_overrun)\n    for i in range(int(p.rib_count)):\n\
    \        a = math.pi/6 + i*2*math.pi/p.rib_count\n        x,y = center_r*math.cos(a),center_r*math.sin(a)\n\
    \        rib = cq.Workplane('XY').workplane(offset=p.floor_t).center(x,y).circle(p.rib_r).extrude(h-p.floor_t-p.lead_height)\n\
    \        lead = cq.Workplane('XY').workplane(offset=h-p.lead_height).center(x,y).circle(p.rib_r).workplane(offset=p.lead_height).circle(tip_r).loft()\n\
    \        body = body.union(rib).union(lead)\n    hole = cq.Workplane('XY').circle((p.bolt_d+p.bolt_clearance)/2).extrude(h+p.cut_overrun)\n\
    \    return body.cut(hole).clean()\n"
  print_orientation: Broad closed underside on bed at z=0; hex pocket opens upward.
    No supports.
  use_orientation: Nut presses into the open hex pocket and seats on its floor. Bolt
    passes axially through the nut and floor hole.
- id: fit_coupon
  role: coupon
  material: PLA (high-speed PLA, black)
  code: "import math\n\ndef build(p):\n    h = p.floor_t + p.nut_h + p.pocket_extra_depth\n\
    \    pocket_af = p.nut_af + p.pocket_af_clearance\n    result = None\n    for\
    \ j in range(int(p.coupon_count)):\n        x0 = j*p.coupon_pitch\n        fit\
    \ = p.coupon_fit_start + j*p.coupon_fit_step\n        body = cq.Workplane('XY').center(x0,0).circle(p.coupon_d/2).extrude(h)\n\
    \        pocket = cq.Workplane('XY').workplane(offset=p.floor_t).center(x0,0).polygon(6,pocket_af/math.cos(math.pi/6)).extrude(h-p.floor_t+p.cut_overrun)\n\
    \        body = body.cut(pocket)\n        center_r = fit/2+p.rib_r\n        tip_r\
    \ = max(p.cut_overrun,center_r-pocket_af/2+p.cut_overrun)\n        for i in range(int(p.rib_count)):\n\
    \            a = math.pi/6+i*2*math.pi/p.rib_count\n            x,y = x0+center_r*math.cos(a),center_r*math.sin(a)\n\
    \            rib = cq.Workplane('XY').workplane(offset=p.floor_t).center(x,y).circle(p.rib_r).extrude(h-p.floor_t-p.lead_height)\n\
    \            lead = cq.Workplane('XY').workplane(offset=h-p.lead_height).center(x,y).circle(p.rib_r).workplane(offset=p.lead_height).circle(tip_r).loft()\n\
    \            body = body.union(rib).union(lead)\n        hole = cq.Workplane('XY').center(x0,0).circle((p.bolt_d+p.bolt_clearance)/2).extrude(h+p.cut_overrun)\n\
    \        body = body.cut(hole)\n        result = body if result is None else result.union(body)\n\
    \    link = cq.Workplane('XY').center((p.coupon_count-1)*p.coupon_pitch/2,0).rect((p.coupon_count-1)*p.coupon_pitch,p.coupon_link_w).extrude(p.floor_t)\n\
    \    result = result.union(link)\n    for j in range(int(p.coupon_count)):\n \
    \       hole = cq.Workplane('XY').center(j*p.coupon_pitch,0).circle((p.bolt_d+p.bolt_clearance)/2).extrude(h+p.cut_overrun)\n\
    \        result = result.cut(hole)\n    return result.clean()\n"
  print_orientation: Socket floors and connecting strip on bed at z=0; all pockets
    open upward. No supports.
  use_orientation: Increasing local X gives effective rib-tip widths 7.80, 7.90, 8.00,
    8.10 mm. Test nut insertion, recess, retention and bolt passage.
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
joints: []
criteria:
- id: hand_fit
  part: knob
  feature: Six interference ribs in hex pocket
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - fit_af
  - rib_r
  - lead_height
  - pocket_af_clearance
  check:
    method: coupon
    ref: fit_coupon
    description: UNVERIFIED. Find a pocket allowing full seating with firm thumb pressure,
      no tools and no cracking, while retaining the nut when inverted and gently tapped
      over a tray. Transfer its effective width to fit_af.
- id: recess
  part: knob
  feature: Hex pocket depth
  relation: contains
  hardware: nut
  clearance_mm: 1.3
  params:
  - nut_h
  - pocket_extra_depth
  check:
    method: coupon
    ref: fit_coupon
    description: Confirm seated nut is completely below the pocket opening.
- id: floor
  part: knob
  feature: Retaining floor around bolt clearance hole
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - floor_t
  - bolt_d
  - bolt_clearance
  - nut_af
  check:
    method: coupon
    ref: fit_coupon
    description: Confirm nut seats on the floor and cannot pass through the opposite
      side.
- id: bolt_passage
  part: knob
  feature: 5.6 mm axial through-hole
  relation: clears
  hardware: null
  clearance_mm: 0.6
  params:
  - bolt_d
  - bolt_clearance
  check:
    method: coupon
    ref: fit_coupon
    description: Before fitting the nut, check an intended M5 bolt slides freely through
      the printed floor hole. After fitting, verify the bolt screws through the nut
      and emerges from the opposite side.
manual:
- n: '1'
  text: Print fit_coupon first with 0.2 mm layers, 0.4 mm nozzle, 4 wall loops, 5
    bottom/top layers and 30% infill, using the specified PLA. Put its flat underside
    on the bed; pockets face up. No supports. Use identical slicer compensation and
    print settings for the final knob.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'In the slicer identify local X=0,16,32,48 mm pocket centers: their effective
    rib-tip widths are respectively 7.80, 7.90, 8.00, 8.10 mm. Mark them on the print
    before losing track of orientation. The last value is 8.10, not 8.01.'
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '3'
  text: Start with the 8.10 mm pocket and work toward smaller sizes if needed. Align
    the nut flats with the hex pocket and press straight down by hand. Stop if excessive
    force is needed; do not hammer, heat, or use a vise. A passing fit reaches the
    floor, leaves the nut fully recessed, and holds it when inverted and gently tapped
    over a tray.
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '4'
  text: 'Check your intended M5 bolt passes through the floor hole and threads through
    the seated nut. To recover the nut, push it toward the open pocket with a slender
    blunt rod through the floor hole; avoid prying against the ribs. If no coupon
    pocket passes, do not assume the default knob fits: adjust coupon_fit_start, reprint
    and test again. Record each result as too tight, passes, or too loose.'
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: Optional slender blunt rod for removing the test nut
- n: '5'
  text: Set fit_af to the successful coupon width, then generate and print knob with
    the same settings. If printing the submitted default 7.90 mm knob unchanged, treat
    it as unverified unless the 7.90 mm coupon has passed. Let the print cool and
    clear any loose strings.
  parts:
  - knob
  hardware: []
  tool: null
- n: '6'
  text: Align the M5 nut and press it fully down to the floor by hand. Confirm it
    is recessed and retained when inverted. No glue is required. Screw the knob onto
    your intended M5 bolt, or feed the bolt through the underside and nut; use sufficient
    threaded length for the application. This design captures a nut, not the bolt
    head.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '7'
  text: Use for light-duty hand tightening only, without pliers or added leverage.
    Stop if the nut spins or the plastic cracks. Keep away from heat; PLA can soften
    or relax. Recheck retention periodically and replace the knob if the fit loosens.
  parts:
  - knob
  hardware:
  - nut
  tool: null
