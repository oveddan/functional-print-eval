task: nut-knob/M5
note: Reoriented the knob geometry so the wide 30 mm scalloped grip base sits directly
  on the build plate (z = 0 to 10 mm) and the narrower 18 mm boss is on top (z = 10
  to 13 mm), with the 8.05 mm hex nut pocket opening upward at the top face (z = 7
  to 13 mm). This eliminates both the outer overhang and any roof/bridge over the
  hex pocket.
questions: []
params:
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut width across flats
  grip_h:
    value: 10
    unit: mm
    kind: design
    source: design
    note: Height of the 30 mm lower grip section resting on the bed (z = 0)
  boss_h:
    value: 3
    unit: mm
    kind: design
    source: design
    note: Height of the upper collar boss on top of the grip
  nut_fit_clearance:
    value: 0.05
    unit: mm
    kind: design
    source: design
    note: Across-flats snug press-fit allowance for PLA hand press-fit
  knob_od:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: Overall outer diameter of the hand knob (~30 mm requested)
  nut_recess:
    value: 1.3
    unit: mm
    kind: design
    source: design
    note: Extra pocket depth beyond nut height so nut sits fully below top face
  bolt_clearance:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Diametral clearance for the M5 bolt through-hole
  flute_cut_depth:
    value: 2
    unit: mm
    kind: design
    source: design
    note: Radial depth of each finger grip scallop
  flute_count:
    value: 6
    unit: count
    kind: design
    source: design
    note: Number of finger grip scallops around circumference
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal diameter of M5 bolt
  flute_r:
    value: 5
    unit: mm
    kind: design
    source: design
    note: Radius of scallop cutter cylinder
  boss_od:
    value: 18
    unit: mm
    kind: design
    source: design
    note: Outer diameter of the upper collar boss on top of the grip
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut thickness
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    total_h = p.grip_h + p.boss_h\n    knob_r\
    \ = p.knob_od / 2.0\n    boss_r = p.boss_od / 2.0\n\n    # Wide 30 mm grip section\
    \ flat on the bed (z = 0 to grip_h)\n    part = (\n        cq.Workplane(\"XY\"\
    )\n        .circle(knob_r)\n        .extrude(p.grip_h)\n    )\n\n    # Cut finger\
    \ grip scallops around the lower grip section (z = 0 to grip_h)\n    flute_center_r\
    \ = knob_r + p.flute_r - p.flute_cut_depth\n    for i in range(int(p.flute_count)):\n\
    \        angle = 2.0 * math.pi * i / p.flute_count\n        cx = flute_center_r\
    \ * math.cos(angle)\n        cy = flute_center_r * math.sin(angle)\n        cutter\
    \ = (\n            cq.Workplane(\"XY\")\n            .center(cx, cy)\n       \
    \     .circle(p.flute_r)\n            .extrude(p.grip_h)\n        )\n        part\
    \ = part.cut(cutter)\n\n    # Upper boss on top of the grip (z = grip_h to total_h)\
    \ so there is no overhang\n    part = part.union(\n        cq.Workplane(\"XY\"\
    )\n        .workplane(offset=p.grip_h)\n        .circle(boss_r)\n        .extrude(p.boss_h)\n\
    \    )\n\n    # Central M5 bolt clearance through-hole (z = 0 to total_h)\n  \
    \  bolt_hole_r = (p.bolt_d + p.bolt_clearance) / 2.0\n    part = part.cut(\n \
    \       cq.Workplane(\"XY\")\n        .circle(bolt_hole_r)\n        .extrude(total_h)\n\
    \    )\n\n    # Upward-opening recessed hex nut pocket at top face (z = total_h\
    \ - pocket_depth to total_h)\n    # Supported from below by the solid floor (z\
    \ = 0 to total_h - pocket_depth), so no roof over the pocket\n    pocket_af =\
    \ p.nut_af + p.nut_fit_clearance\n    pocket_circum_d = 2.0 * pocket_af / math.sqrt(3.0)\n\
    \    pocket_depth = p.nut_h + p.nut_recess\n    hex_pocket = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=total_h - pocket_depth)\n        .polygon(6,\
    \ pocket_circum_d)\n        .extrude(pocket_depth)\n    )\n    part = part.cut(hex_pocket)\n\
    \n    return part\n"
  print_orientation: Wide 30 mm flat grip face on the build plate (z = 0), with the
    18 mm boss and open hex pocket facing upward at z = 13 mm.
  use_orientation: M5 hex nut pressed into the top pocket; M5 bolt passes through
    the nut and central through-bore out the opposite end.
hardware:
- id: m5_nut
  ref: ISO 4032 M5
  qty: 1
- id: m5_bolt
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: knob_bolt_joint
  fastener: m5_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 13.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: nut_pocket
    role: nut_pocket
  - part: knob
    feature: bolt_bore
    role: clearance
  nut: m5_nut
  external: null
criteria:
- id: nut_press_fit
  part: knob
  feature: nut_pocket
  relation: seats
  hardware: m5_nut
  clearance_mm: 0.05
  params:
  - nut_af
  - nut_h
  - nut_fit_clearance
  - nut_recess
  check:
    method: measure
    ref: nut_pocket
    description: Press the M5 hex nut into the upward-opening top hex pocket by hand;
      confirm it seats against the floor below the top rim and stays in when inverted.
- id: nut_fully_enclosed_and_stopped
  part: knob
  feature: nut_pocket
  relation: contains
  hardware: m5_nut
  clearance_mm: 1.3
  params:
  - nut_h
  - nut_recess
  - grip_h
  - boss_h
  check:
    method: measure
    ref: nut_pocket
    description: Verify the seated M5 nut is fully recessed below the top face and
      cannot be pushed out through the bottom side due to the solid lower floor.
- id: bolt_through_clearance
  part: knob
  feature: bolt_bore
  relation: clears
  hardware: m5_bolt
  clearance_mm: 0.5
  params:
  - bolt_d
  - bolt_clearance
  check:
    method: measure
    ref: bolt_bore
    description: Pass the M5 bolt through the central clearance bore and thread it
      through the captured M5 nut and out the opposite face.
manual:
- n: '1'
  text: Align the ISO 4032 M5 hex nut with the hexagonal pocket on the top boss face
    of the printed knob and press it firmly in by hand until it seats against the
    internal floor 6 mm below the rim. Turn the knob upside down to verify the friction
    fit holds the nut securely.
  parts:
  - knob
  hardware:
  - m5_nut
  tool: null
- n: '2'
  text: Thread the M5 bolt through the captured nut and central 5.5 mm through-bore
    so it passes out the far side of the knob.
  parts:
  - knob
  hardware:
  - m5_bolt
  tool: null
