hardware:
- id: m5_nut
  ref: ISO 4032 M5
  qty: 1
- id: m5_bolt
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: knob_nut_joint
  fastener: m5_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 5.5
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: m5_hand_knob
    feature: hex_nut_pocket
    role: nut_pocket
  - part: m5_hand_knob
    feature: bolt_thru_hole
    role: clearance
  nut: m5_nut
  external: null
criteria:
- id: nut_press_fit_retention
  part: m5_hand_knob
  feature: hex_nut_pocket
  relation: seats
  hardware: m5_nut
  clearance_mm: 0.05
  params:
  - nut_af
  - nut_h
  - pocket_clearance
  - pocket_depth
  check:
    method: coupon
    ref: coupon_8_05
    description: Press the ISO 4032 M5 hex nut into the hex pocket by hand, confirm
      it seats against the internal floor below the top rim, and turn it upside down
      to verify it stays retained without glue.
- id: nut_axial_stop
  part: m5_hand_knob
  feature: pocket_floor
  relation: supports
  hardware: m5_nut
  clearance_mm: 0.0
  params:
  - nut_af
  - bolt_clearance_d
  - floor_t
  check:
    method: coupon
    ref: coupon_8_05
    description: Verify the M5 nut bottoms out on the internal floor and cannot pass
      through the far side.
- id: bolt_passes_through
  part: m5_hand_knob
  feature: bolt_thru_hole
  relation: clears
  hardware: m5_bolt
  clearance_mm: 0.4
  params:
  - bolt_d
  - bolt_clearance_d
  check:
    method: measure
    ref: null
    description: Pass the M5 bolt through the nut and out the through-hole on the
      far side of the knob.
manual:
- n: '1'
  text: Test the ISO 4032 M5 hex nut in the test coupons to verify which across-flats
    pocket size presses in by hand and stays retained when turned upside down.
  parts:
  - coupon_8_00
  - coupon_8_05
  - coupon_8_10
  - coupon_8_15
  - coupon_8_20
  hardware:
  - m5_nut
  tool: null
- n: '2'
  text: Press the ISO 4032 M5 hex nut into the hex pocket on the top face of the m5_hand_knob
    by hand until it seats against the internal floor, recessed below the top face.
  parts:
  - m5_hand_knob
  hardware:
  - m5_nut
  tool: null
- n: '3'
  text: Thread the M5 bolt through the captured nut so the bolt passes out the clearance
    hole on the far side of the knob, and tighten by hand.
  parts:
  - m5_hand_knob
  hardware:
  - m5_bolt
  tool: null
