  feature: bolt through hole
  relation: clears
  hardware: nut
  clearance_mm: 0.25
  params:
  - bolt_hole_d
  - bolt_d
  check:
    method: measure
    ref: null
    description: An M5 bolt passes freely through the 5.5 mm hole and threads into
      the seated nut.
- id: c3
  part: knob
  feature: pocket ceiling
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - bolt_hole_d
  - nut_af
  - knob_h
  - nut_h
  check:
    method: measure
    ref: null
    description: The 5.5 mm hole is smaller than the 8 mm nut flats, so the nut cannot
      be pushed out of the far side. About 7 mm of solid wall sits above the nut.
manual:
- n: '1'
  text: Print the knob with the nut-pocket face on the bed and the top up (PLA, 0.2
    mm layers). No supports needed. The coupon is optional; you have already used
    it to confirm the fit.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Press an M5 nut into the pocket from the open face, lining its flats up with
    the hex. Push it in square with your thumb on a flat surface until it is fully
    seated against the ceiling.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Thread your M5 bolt into the nut from the pocket side. The tip comes out through
    the hole in the top. Turn the knob to tighten.
  parts:
  - knob
  hardware:
  - nut
  tool: null
