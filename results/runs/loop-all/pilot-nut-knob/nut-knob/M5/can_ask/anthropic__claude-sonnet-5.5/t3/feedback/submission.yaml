task: nut-knob/M5
note: 'Unchanged from the first version. Your print test confirmed the 8.10 mm pocket
  (fit_clr 0.1): snug, and the nut held when turned upside down and shaken, on both
  the knob and the coupon. 8.00 was tight and 8.20 was loose.'
questions: []
params:
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats; could not be measured by user
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 thickness
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  fit_clr:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: 'Added to nut across-flats for the pocket. Confirmed by printing: the 8.10
      mm pocket is snug and the nut stayed in upside down and shaken, on both the
      coupon and the knob. 8.00 was tight and 8.20 was loose.'
  fit_step:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: Step between the three coupon pockets
  hole_clr:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Bolt hole is bolt_d + this
  recess:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: Nut top sits this far below the pocket mouth, so the nut is fully inside
  lead_in:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Chamfered lead-in height at pocket mouth
  lead_in_extra:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Extra across-flats at the very mouth
  ceiling:
    value: 6
    unit: mm
    kind: design
    source: design
    note: Solid knob material above the nut, stops the nut leaving the far side
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: User asked for about 30 mm
  lobes:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
  scallop_r:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: Grip scallop radius
  scallop_off:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: Scallop centre sits this fraction of scallop_r outside the rim
  coupon_ceiling:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_pitch:
    value: 14
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    af = p.nut_af + p.fit_clr\n    dc = af /\
    \ math.cos(math.radians(30))\n    depth = p.nut_h + p.recess\n    H = depth +\
    \ p.ceiling\n    R = p.knob_d / 2\n    body = cq.Workplane('XY').circle(R).extrude(H)\n\
    \    pts = []\n    for i in range(int(p.lobes)):\n        a = 2 * math.pi * i\
    \ / p.lobes\n        r = R + p.scallop_r * p.scallop_off\n        pts.append((r\
    \ * math.cos(a), r * math.sin(a)))\n    cut = cq.Workplane('XY').pushPoints(pts).circle(p.scallop_r).extrude(H)\n\
    \    body = body.cut(cut)\n    pocket = cq.Workplane('XY').polygon(6, dc).extrude(depth)\n\
    \    body = body.cut(pocket)\n    dbig = (af + p.lead_in_extra) / math.cos(math.radians(30))\n\
    \    lead = (cq.Workplane('XY').polygon(6, dbig)\n            .workplane(offset=p.lead_in).polygon(6,\
    \ dc).loft())\n    body = body.cut(lead)\n    hole = cq.Workplane('XY').circle((p.bolt_d\
    \ + p.hole_clr) / 2).extrude(H)\n    body = body.cut(hole)\n    return body\n"
  print_orientation: Nut-pocket opening face down on the bed (z=0); the ceiling over
    the pocket is a ~9 mm bridge, well within the 50 mm limit
  use_orientation: Pocket opening faces the clamped object, bolt threaded end comes
    up through the knob; hand turns it by the scalloped rim
- id: nut-fit-coupon
  role: coupon
  material: PLA
  code: "import math\ndef build(p):\n    depth = p.nut_h + p.recess\n    T = depth\
    \ + p.coupon_ceiling\n    L = p.coupon_pitch * 3\n    W = 14.0\n    plate = cq.Workplane('XY').box(L,\
    \ W, T, centered=(True, True, False))\n    for k, c in enumerate([-1, 0, 1]):\n\
    \        x = (k - 1) * p.coupon_pitch\n        af = p.nut_af + p.fit_clr + c *\
    \ p.fit_step\n        dc = af / math.cos(math.radians(30))\n        pk = cq.Workplane('XY').center(x,\
    \ 0).polygon(6, dc).extrude(depth)\n        dbig = (af + p.lead_in_extra) / math.cos(math.radians(30))\n\
    \        ld = (cq.Workplane('XY').center(x, 0).polygon(6, dbig)\n            \
    \  .workplane(offset=p.lead_in).polygon(6, dc).loft())\n        h = cq.Workplane('XY').center(x,\
    \ 0).circle((p.bolt_d + p.hole_clr) / 2).extrude(T)\n        plate = plate.cut(pk).cut(ld).cut(h)\n\
    \    return plate\n"
  print_orientation: Flat, pocket openings face down on the bed
  use_orientation: 'Test piece only: press an M5 nut into each pocket from below'
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
- id: bolt
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: bolt-through-knob
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - -20.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: nut_pocket_hex
    role: nut_pocket
  - part: knob
    feature: bolt_through_hole
    role: clearance
  nut: nut
  external: null
criteria:
- id: c1
  part: knob
  feature: hex nut pocket (across flats = nut_af + fit_clr)
  relation: contains
  hardware: nut
  clearance_mm: 0.1
  params:
  - nut_af
  - fit_clr
  check:
    method: coupon
    ref: nut-fit-coupon
    description: Press an M5 nut into the three coupon pockets (clearance 0.0/0.1/0.2).
      The 0.1 pocket (8.10 mm) was snug and held the nut when turned upside down and
      shaken, on the coupon and on the knob.
- id: c2
  part: knob
  feature: pocket depth = nut_h + recess
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_h
  - recess
  check:
    method: measure
    ref: null
    description: Seated nut top is 0.4 mm below the knob's bottom face, so it is fully
      inside.
- id: c3
  part: knob
  feature: bolt through-hole (bolt_d + hole_clr)
  relation: clears
  hardware: bolt
  clearance_mm: 0.5
  params:
  - bolt_d
  - hole_clr
  check:
    method: measure
    ref: null
    description: M5 bolt passes freely through the hole in the ceiling.
- id: c4
  part: knob
  feature: solid ceiling above the pocket
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - ceiling
  - nut_h
  check:
    method: measure
    ref: null
    description: The nut cannot be pushed out of the far side, since the hole is smaller
      than the nut.
manual:
- n: '1'
  text: Print the knob with the hex-pocket opening face down on the bed. Use 0.2 mm
    layers and at least 4 walls, so the pocket walls are solid. PLA is fine. The coupon
    is optional now, because the 8.10 mm pocket was already tested.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Set the M5 nut on the pocket opening, lined up with the hex. Press it in with
    your thumb, or press it against a flat table, until it is fully seated against
    the ceiling. It ends up 0.4 mm below the face.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Turn the knob upside down to check that the nut stays put. Thread the M5 bolt
    through the part you are clamping, then into the nut from the pocket side. The
    bolt tip can come out through the hole in the top. Tighten by hand with the knob.
    An M5x30 bolt is only an example, so pick a length for your stack.
  parts:
  - knob
  hardware:
  - bolt
  tool: null
