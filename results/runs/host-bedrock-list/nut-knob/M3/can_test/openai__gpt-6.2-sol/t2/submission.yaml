task: nut-knob/M3
note: 20 mm scalloped knob with a chamfered press-fit pocket and a solid shoulder
  that stops the nut while letting the bolt pass through. The interference is a starting
  value; verify retention on your print.
questions: []
params:
  af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_d:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  fit:
    value: -0.1
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    w=cq.Workplane('XY').circle(10).extrude(7)\n\
    \    for i in range(8):\n        a=i*math.pi/4\n        w=w.cut(cq.Workplane('XY').center(10.5*math.cos(a),10.5*math.sin(a)).circle(1.6).extrude(7))\n\
    \    w=w.cut(cq.Workplane('XY').circle((p.bolt_d+0.5)/2).extrude(7))\n    z=7-p.nut_h-0.6\n\
    \    d=(p.af+p.fit)/math.cos(math.pi/6)\n    pocket=cq.Workplane('XY').workplane(offset=z).polygon(6,d).extrude(3)\n\
    \    lead=cq.Workplane('XY').workplane(offset=6.55).polygon(6,d).workplane(offset=0.45).polygon(6,d+0.8).loft()\n\
    \    return w.cut(pocket.union(lead))"
  print_orientation: Solid annular shoulder face down; hex pocket opens upward.
  use_orientation: Nut pocket faces the work; bolt exits the opposite face.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print flat with the hex pocket up, at 0.2 mm layer height, no supports. Remove
    any strings from the pocket and through-hole.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align the nut flats with the pocket and press it in squarely by hand until
    it bottoms out below the rim. If it won't seat by hand, increase fit by 0.05 mm
    and reprint; if loose, decrease fit by 0.05 mm and reprint.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Invert the knob over a tray to verify the nut stays in. Start your M3 bolt
    from the pocket side by hand and verify that it threads freely and exits the opposite
    face. Use the knob for light hand tightening.
  parts:
  - knob
  hardware:
  - nut
  tool: null
