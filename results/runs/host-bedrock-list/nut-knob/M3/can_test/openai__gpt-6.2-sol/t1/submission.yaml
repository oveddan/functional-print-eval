task: nut-knob/M3
note: One-piece 20 mm tip-to-tip knob. The hex pocket resists nut rotation, and the
  solid shoulder around the 3.5 mm through-hole stops the nut from passing through.
  Press fit is a starting setting; verify on your print.
questions: []
params:
  af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt:
    value: 3
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  fit:
    value: 0.05
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    pts=[((10 if i%2==0 else 8.7)*math.cos(i*math.pi/12),(10\
    \ if i%2==0 else 8.7)*math.sin(i*math.pi/12)) for i in range(24)]\n    s=cq.Workplane('XY').polyline(pts).close().extrude(9)\n\
    \    s=s.cut(cq.Workplane('XY').circle((p.bolt+0.5)/2).extrude(9))\n    def hexpts(af):\n\
    \        return [(af/math.sqrt(3)*math.cos(i*math.pi/3),af/math.sqrt(3)*math.sin(i*math.pi/3))\
    \ for i in range(6)]\n    z=9-p.h-0.4\n    pocket=cq.Workplane('XY',origin=(0,0,z)).polyline(hexpts(p.af-p.fit)).close().extrude(9-z)\n\
    \    lead=cq.Workplane('XY',origin=(0,0,8.6)).polyline(hexpts(p.af-p.fit)).close().workplane(offset=0.4).polyline(hexpts(p.af+0.5)).close().loft()\n\
    \    return s.cut(pocket).cut(lead)"
  print_orientation: Flat closed shoulder face on bed; nut pocket faces up.
  use_orientation: Pocket faces the incoming bolt and the clamped object.
hardware:
- id: nut
  ref: ISO 4032 M3
  qty: 1
joints: []
criteria:
- id: retention
  part: knob
  feature: Hex press-fit pocket
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - af
  - h
  - fit
  check:
    method: none
    ref: null
    description: Press in by thumb, then invert and lightly tap the knob. Nut must
      remain fully recessed and must not drop out.
manual:
- n: '1'
  text: Print flat, pocket up, without supports. Use 0.2 mm layers and four walls.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align the nut flats with the pocket and press straight in with your thumb
    until it bottoms on the shoulder. Invert and lightly tap to verify retention.
    If too tight to seat by hand, reduce fit by 0.05 mm and reprint; if loose, increase
    fit by 0.05 mm and reprint.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Start your M3 bolt from the recessed nut side. Hand-tighten the knob; the
    bolt can pass through the shoulder and exit the opposite face.
  parts:
  - knob
  hardware:
  - nut
  tool: null
