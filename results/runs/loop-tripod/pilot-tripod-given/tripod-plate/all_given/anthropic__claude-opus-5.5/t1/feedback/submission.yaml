task: tripod-plate
note: Revision 2 fixes the messy roof over the screw hole with a one-layer bridging
  step, so the hole roof is built in two short bridges. The clamp fit and head recess
  are unchanged because both were confirmed. The head now bears one layer higher,
  so the screw sticks up about 0.2 mm more (about 5.0 mm).
questions: []
params:
  dt_w:
    value: 38
    unit: mm
    kind: world
    source: guessed
    note: Arca-Swiss width. The plate fits the clamp, so this is unchanged.
  dt_h:
    value: 8
    unit: mm
    kind: world
    source: guessed
    note: double 45° bevel height. Fit confirmed on the printed plate.
  plate_l:
    value: 60
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_l:
    value: 15
    unit: mm
    kind: design
    source: design
    note: ''
  bolt_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 major diameter
  bolt_clear_d:
    value: 6.9
    unit: mm
    kind: design
    source: design
    note: ''
  head_d:
    value: 15
    unit: mm
    kind: hardware
    source: asked
    note: about 15. Fits the recess.
  head_h:
    value: 5
    unit: mm
    kind: hardware
    source: asked
    note: about 5
  bolt_len:
    value: 10
    unit: mm
    kind: hardware
    source: asked
    note: under head, about 10
  head_clear:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: ''
  cb_extra:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: ''
  protrude:
    value: 4.8
    unit: mm
    kind: design
    source: design
    note: becomes about 5.0 because the head now bears one layer higher
