task: tripod-plate
note: 'Updated the plate to address the hole-roof failure: the plate is 2 mm thicker
  and the underside head pocket now transitions to the through-hole with a 45° conical
  roof instead of a flat bridge. The clamp fit was confirmed on the previous version,
  but this version is taller; re-check that the clamp still closes and retains it
  before attaching a camera. Continue using the salvaged metal bolt, not a printed
  screw.'
questions: []
params:
  plate_top_width_mm:
    value: 38.0
    unit: mm
    kind: world
    source: guessed
    note: Best-guess Arca-style width; previous version fit this clamp.
  plate_bottom_width_mm:
    value: 30.0
    unit: mm
    kind: world
    source: guessed
    note: Previous version fit the clamp.
  plate_length_mm:
    value: 50.0
    unit: mm
    kind: design
    source: design
    note: ''
  plate_thickness_mm:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: Increased from 8 mm to allow a self-supporting conical roof above the head
      pocket.
  lower_straight_height_mm:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: ''
  dovetail_height_mm:
    value: 4.0
    unit: mm
    kind: design
