task: tripod-plate
note: 'Reviewed: the plate geometry remains a best-guess 38 mm Arca-style dovetail
  because the clamp opening was not measured. I have corrected the fastener seat location
  in the joint description; the printed part geometry is otherwise unchanged. Do not
  print/use this as a load-rated mount: verify the fit without a camera, and use only
  as a temporary mount for light equipment where a failure cannot cause injury or
  damage. The screw is the existing metal salvaged webcam bolt, not printed plastic.'
questions: []
params:
  plate_top_width_mm:
    value: 38.0
    unit: mm
    kind: world
    source: guessed
    note: Common Arca-style plate width; clamp not measured.
  plate_bottom_width_mm:
    value: 30.0
    unit: mm
    kind: world
    source: guessed
    note: Assumed narrow foot width for a drop-in dovetail clamp.
  plate_length_mm:
    value: 50.0
    unit: mm
    kind: design
    source: design
    note: ''
  plate_thickness_mm:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: ''
  lower_straight_height_mm:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: ''
  dovetail_height_mm:
    value: 4.0
    unit: mm
    kind: design
    source: design
    note: ''
  bolt_head_diameter_mm:
    value: 15.0
    unit: mm
    kind: hardware
    source: asked
    note: User measured approximately 15 mm.
  bolt_head_height_mm:
    value: 5.0
    unit: mm
    kind: hardware
    source: asked
    note: User measured approximately 5 mm.
  bolt_under_head_length_mm:
    value: 10.0
    unit: mm
    kind: hardware
    source: asked
    note: User measured approximately 10 mm.
  bolt_thread_major_diameter_mm:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal diameter for 1/4-20.
  bolt_pitch_mm:
    value: 1.27
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_clearance_hole_diameter_mm:
    value: 6.8
    unit: mm
    kind: design
    source: design
    note: ''
  head_pocket_diameter_mm:
    value: 15.6
    unit: mm
    kind: design
    source: design
    note: 0.6 mm diametral clearance around measured head.
  head_pocket_depth_mm:
    value: 4.6
    unit: mm
    kind: design
    source: design
    note: Leaves the head about 0.4 mm proud for gripping from below.
parts:
- id: camera_plate
  role: final
  material: PLA, high-speed PLA
  code: "def build(p):\n    bw = p.plate_bottom_width_mm\n    tw = p.plate_top_width_mm\n\
    \    z0 = p.lower_straight_height_mm\n    z1 = z0 + p.dovetail_height_mm\n   \
    \ h = p.plate_thickness_mm\n    pts = [(-bw/2, 0), (bw/2, 0), (bw/2, z0), (tw/2,\
    \ z1), (tw/2, h), (-tw/2, h), (-tw/2, z1), (-bw/2, z0)]\n    body = cq.Workplane('XZ').polyline(pts).close().extrude(p.plate_length_mm).translate((0,\
    \ p.plate_length_mm/2, 0))\n    through = cq.Workplane('XY').workplane(offset=-0.1).circle(p.bolt_clearance_hole_diameter_mm/2).extrude(h\
    \ + 0.2)\n    pocket = cq.Workplane('XY').workplane(offset=-0.1).circle(p.head_pocket_diameter_mm/2).extrude(p.head_pocket_depth_mm\
    \ + 0.1)\n    return body.cut(through).cut(pocket)"
  print_orientation: Narrow flat foot (z=0) on the bed; camera-contact face at z=8
    mm.
  use_orientation: Dovetail edges run along the clamp jaws; the metal 1/4-20 bolt
    passes upward through the centered hole into the camera socket.
hardware:
- id: camera_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_attachment
  fastener: camera_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 4.6
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: camera_plate
    feature: underside counterbore ceiling (head bearing face at z=4.6 mm)
    role: head_seat
  - part: camera_plate
    feature: centered 6.8 mm through-hole
    role: clearance
  nut: null
  external: Camera's 1/4-20 socket
criteria:
- id: clamp_fit
  part: camera_plate
  feature: dovetail side faces and overall width
  relation: clears
  hardware: null
  clearance_mm: 0.0
  params:
  - plate_top_width_mm
  - plate_bottom_width_mm
  - plate_thickness_mm
  - dovetail_height_mm
  check:
    method: measure
    ref: null
    description: Clamp dimensions were unavailable, so this profile is an estimate.
      Check that the plate drops between the jaws and the lips engage the slopes without
      force before attaching a camera.
- id: bolt_fit
  part: camera_plate
  feature: centered clearance hole and underside head pocket
  relation: clears
  hardware: camera_bolt
  clearance_mm: 0.2
  params:
  - bolt_head_diameter_mm
  - bolt_head_height_mm
  - bolt_under_head_length_mm
  - bolt_clearance_hole_diameter_mm
  - head_pocket_diameter_mm
  - head_pocket_depth_mm
  check:
    method: measure
    ref: null
    description: Check that the bolt passes freely, its head is grippable from below,
      and it engages the camera socket without bottoming out.
manual:
- n: '1'
  text: Print camera_plate with its narrow, flat foot on the bed. Use several walls
    and solid top/bottom layers. This PLA part is temporary and not load-rated.
  parts:
  - camera_plate
  hardware: []
  tool: 3D printer
- n: '2'
  text: Test the plate in the tripod clamp without a camera. It should drop in and
    the jaws should contact the sloped sides when tightened lightly. If it binds,
    is not retained, or rocks, do not force it or use it; the clamp was not measured
    and this profile is only an estimate.
  parts:
  - camera_plate
  hardware: []
  tool: null
- n: '3'
  text: Place the salvaged metal webcam bolt into the counterbore from the underside.
    Confirm the head can be gripped and turned from below, and the shank passes through
    the hole.
  parts:
  - camera_plate
  hardware:
  - camera_bolt
  tool: null
- n: '4'
  text: Start the 1/4-20 bolt into the camera socket by hand. Stop if it binds or
    bottoms out; do not force or overtighten. Seat the camera, tighten only enough
    to secure it, and check the clamp again before use. Use only where a failure cannot
    cause injury or damage.
  parts:
  - camera_plate
  hardware:
  - camera_bolt
  tool: null
