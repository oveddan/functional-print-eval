task: tripod-plate
note: 'CHANGED: the plate''s bolt pocket roof, and a small tweak to the printed screw.
  Everything else is as before.


  WHY (from your print): the pocket was a flat ceiling with the Ø6.9 shank hole through
  it. Under that ceiling is empty space (the Ø15.4 head recess) and under the hole
  is empty space too, so the last few ceiling layers were a floating ring of plastic
  - nothing to lay them on. That is exactly your "loose loops and tangles around the
  hole; hole partly closed".


  THE FIX: the pocket is now a straight Ø15.4 wall 5.1 mm deep, then a 45 deg CONICAL
  roof that climbs inward to the Ø6.9 shank hole at 9.35 mm. Every layer of that roof
  sits on the layer below it (0.2 mm step per 0.2 mm layer), so it needs no supports,
  no bridging, and the hole comes out round and open. The Ø15 bolt head still seats
  at exactly the same height: it sinks until its rim touches the cone at z = 5.3,
  so your "the bolt''s head fits in its recess" still holds - the pocket is 0.3 mm
  deeper, if anything. A bonus: a conical seat self-centers the bolt and bites into
  the head, so the screw is less likely to spin when you tighten it.


  Consequence to know: the pocket roof needs room. plate_t must stay at or above 9.7
  mm (5.1 wall + 4.25 cone + a bit of hole). Below that, the cone would break through
  the plate''s top face - so if your clamp''s pocket turns out shallower than about
  10.5 mm, either print the plate with supports under that small roof, or tell me
  and I will re-cut the pocket for a thinner plate. If you reduce plate_t, do not
  go below 9.7 mm.


  ALSO CHANGED: printed screw''s thread. Its ridge is now centered right at the core''s
  surface (major Ø6.0, ridge Ø1.0 on a Ø4.9 core) instead of 0.15 mm outside it, so
  the ridge is supported by the core as it prints instead of bridging; the thread
  still has a 0.27 mm valley between turns so it screws in.


  UNCHANGED and still the important bit: I still have no measurement of your borrowed
  clamp, so plate_w = 42.4 mm and plate_t = 10.3 mm are my guesses for a 43 mm opening
  / 11 mm deep pocket. The fit_gauge coupon decides. Print the gauge first, find the
  widest tile (1 notch = 35, 2 = 39, 3 = 43, 4 = 47 mm) that drops in AND sits flat
  on the pocket floor, and set plate_w to that number if it is not 43.


  Standing caveat: PLA, not metal, and the fit is still a guess until the gauge confirms
  it. Keep a hand on the camera and check the knob each session.'
questions:
- text: How wide is the clamp's opening between the two jaw lip tips, with the knob
    loosened a few turns (nearest mm)? The printed fit_gauge will answer it, but a
    real measurement would let me size the plate exactly instead of shipping a 42.4
    mm guess.
  answer: null
- text: How deep is the clamp's pocket, from the jaw top face down to the floor the
    plate rests on (nearest mm)? It sets the plate's thickness, which is what keeps
    the plate under the lips - and with the new conical pocket roof, plate_t must
    stay at or above 9.7 mm.
  answer: null
- text: How deep is the 1/4-20 threaded socket in the base of the camera you are mounting
    (nearest mm)? It decides how much thread may stand proud of the plate's top face
    (currently 5.0 mm).
  answer: null
params:
  bolt_thread_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 UNC major diameter (0.25 in).
  bolt_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 = 20 tpi.
  bolt_head_d:
    value: 15.0
    unit: mm
    kind: hardware
    source: asked
    note: Salvaged webcam bolt head across, ~15 mm (you measured this).
  bolt_head_h:
    value: 5.0
    unit: mm
    kind: hardware
    source: asked
    note: Salvaged webcam bolt head height (you measured this).
  bolt_len:
    value: 10.0
    unit: mm
    kind: hardware
    source: asked
    note: Salvaged webcam bolt length under the head (you measured this).
  cam_socket_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: Camera base socket is the standard 1/4-20.
  clamp_mouth_w:
    value: 43.0
    unit: mm
    kind: world
    source: guessed
    note: Opening between the jaw lip tips on the borrowed clamp (200PL/RC2 class).
      Never measured - the fit_gauge coupon determines the real value.
  clamp_channel_w:
    value: 49.0
    unit: mm
    kind: world
    source: guessed
    note: Widest internal width of the jaw channel, below the lips.
  clamp_lip_h:
    value: 3.5
    unit: mm
    kind: world
    source: guessed
    note: Depth of the lip overhang below the jaw top face.
  clamp_depth:
    value: 11.0
    unit: mm
    kind: world
    source: guessed
    note: Jaw top face down to the floor the plate rests on.
  clamp_len:
    value: 52.0
    unit: mm
    kind: world
    source: guessed
    note: Length of the clamp opening end to end.
  lip_angle_deg:
    value: 45.0
    unit: deg
    kind: world
    source: guessed
    note: Jaw lip faces measured from vertical; the plate's top bevel matches it so
      the two faces wedge face-to-face.
  cam_socket_depth:
    value: 6.5
    unit: mm
    kind: world
    source: guessed
    note: Typical 1/4-20 socket depth in a camera base. Sets how much thread may stand
      proud.
  clearance_side:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: Drop-in clearance per side against the clamp opening.
  plate_w:
    value: 42.4
    unit: mm
    kind: design
    source: design
    note: '= clamp_mouth_w - 2*clearance_side. THE NUMBER TO EDIT: set it to the widest
      fit_gauge tile that drops in.'
  plate_t:
    value: 10.3
    unit: mm
    kind: design
    source: design
    note: = clamp_depth - 0.7, and <= cb_cyl_depth + bolt_len - min_engagement. MUST
      stay >= 9.7 or the conical pocket roof breaks through the top face.
  plate_t_min:
    value: 9.7
    unit: mm
    kind: design
    source: design
    note: 'Floor set by the pocket: cb_cyl_depth (5.1) + cone rise (4.25) + 0.35 of
      shank hole.'
  plate_len:
    value: 50.0
    unit: mm
    kind: design
    source: design
    note: = clamp_len - 2.
  top_bevel_h:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: Height of the downward-widening bevel on the two long top edges; it is the
      surface the jaw lips bite. At 45 deg from vertical it prints as a plain overhang.
  corner_r:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: Plan-view corner radius, to help it drop past the lips.
  cb_dia:
    value: 15.4
    unit: mm
    kind: design
    source: design
    note: = bolt_head_d + 0.4. Bolt head pocket, opening downwards. You confirmed
      the head fits.
  cb_cyl_depth:
    value: 5.1
    unit: mm
    kind: design
    source: design
    note: Straight wall of the head pocket before the roof cone starts. Head bottom
      ends up 0.3 mm above the plate's bottom face.
  cb_cone_rise:
    value: 4.25
    unit: mm
    kind: design
    source: design
    note: '= (cb_dia - shank_hole_d)/2, i.e. exactly 45 deg. This is what makes the
      roof self-supporting: no bridging, no supports.'
  cb_seat:
    value: 5.3
    unit: mm
    kind: design
    source: design
    note: = cb_cyl_depth + (cb_dia - bolt_head_d)/2. Where a Ø15 head's rim lands
      on the cone and its top face comes to rest.
  shank_hole_d:
    value: 6.9
    unit: mm
    kind: design
    source: design
    note: = bolt_thread_d + 0.55; clears both the metal bolt and the printed screw.
      Also sets the cone rise.
  min_engagement:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: Minimum thread into the camera.
  protrusion:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: = cb_seat + bolt_len - plate_t. Thread standing above the plate face - under
      cam_socket_depth, so the plate still seats on the camera's base.
  rib_h:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: Anti-rotation rib height on the top face.
  rib_w:
    value: 36.0
    unit: mm
    kind: design
    source: design
    note: Rib length across the plate, inside the bevel.
  rib_len_x:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: Rib thickness along the plate.
  rib_inset:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: Rib position from the plate end.
  ps_head_d:
    value: 14.8
    unit: mm
    kind: design
    source: design
    note: Printed screw head, to match the salvaged bolt's envelope.
  ps_head_h:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: ''
  ps_core_d:
    value: 4.9
    unit: mm
    kind: design
    source: design
    note: Core under the thread ridge; small enough to enter the socket's minor diameter.
  ps_ridge_d:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: Diameter of the helical ridge swept along the shank. Kept below the pitch
      so a 0.27 mm valley is left between turns, or it could not screw in.
  ps_major_d:
    value: 6.0
    unit: mm
    kind: design
    source: design
    note: Effective major diameter. Its ridge centreline now lands on the core's surface,
      so the ridge is supported while printing instead of bridging. Was 6.2, why the
