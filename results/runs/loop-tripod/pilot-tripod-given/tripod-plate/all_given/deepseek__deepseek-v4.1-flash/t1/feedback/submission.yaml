  ps_shank_len:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: = protrusion + (plate_t - cb_cyl_depth). EDIT ONLY if the camera's socket
      is shallower.
  ps_head_chamfer:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: ''
  ps_tip_chamfer:
    value: 0.7
    unit: mm
    kind: design
    source: design
    note: Lead-in on the shank tip.
  gauge_w1:
    value: 35.0
    unit: mm
    kind: design
    source: design
    note: Tile 1, 1 notch.
  gauge_w2:
    value: 39.0
    unit: mm
    kind: design
    source: design
    note: Tile 2, 2 notches.
  gauge_w3:
    value: 43.0
    unit: mm
    kind: design
    source: design
    note: Tile 3, 3 notches. If this is the one that fits, keep plate_w = 42.4.
  gauge_w4:
    value: 47.0
    unit: mm
    kind: design
    source: design
    note: Tile 4, 4 notches.
  gauge_seg_len:
    value: 12.0
    unit: mm
    kind: design
