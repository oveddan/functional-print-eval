task: tripod-plate
note: 'Revised the bolt recess to use a sloped, self-supporting funnel instead of
  a flat roof over the recess. The clamp fit and head recess dimensions remain the
  same. This is still a temporary PLA camera support: inspect the new print closely,
  keep a hand under the camera while testing, and don''t use over people or valuables.'
