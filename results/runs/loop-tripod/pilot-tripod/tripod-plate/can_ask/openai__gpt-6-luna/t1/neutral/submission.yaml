task: tripod-plate
note: 'Revised for better access to the bolt head: the underside access channel is
  widened so the reported 15 mm head can actually be gripped. The clamp dimensions
  still were not measurable, so the 38 mm dovetail profile remains an unverified Arca-Swiss-style
  guess. Print the coupon and verify fit before using the final. PLA is only a temporary,
  low-risk solution; support the camera during testing, and do not use it over people
  or valuables. Hand-check that the supplied metal 1/4-20 bolt threads smoothly into
  the camera; stop if it binds.'
