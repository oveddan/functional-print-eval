      underside recess and the shank passes through; verify the bolt does not bottom
      out in the camera.
manual:
- n: '1'
  text: Before mounting a camera, measure the clamp and bolt head. The clamp and bolt
    dimensions were not provided, so adjust the guessed rail widths/heights and head
    recess if necessary.
  parts:
  - plate
  hardware:
  - webcam_bolt
  tool: null
- n: '2'
  text: Print the revised plate with its rail bottoms on the bed. Inspect the funnel
    around the hole; it should be a clean sloping surface, not a flat bridge.
  parts:
  - plate
  hardware: []
  tool: null
- n: '3'
  text: Test the rail fit in the clamp with no camera, and test the metal bolt through
    the plate. Do not force either fit; revise dimensions if needed.
  parts:
  - plate
  hardware:
  - webcam_bolt
  tool: null
- n: '4'
  text: Confirm the bolt threads into the camera by hand and does not bottom out.
    Tighten gently. Use only as a stationary light-duty temporary mount; keep a hand
    on the camera and never carry it attached to the tripod.
  parts:
  - plate
  hardware:
  - webcam_bolt
  tool: null
