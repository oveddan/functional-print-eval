task: tripod-plate
note: 'Added a two-stage sequential bridge at the ceiling of the bolt-head counterbore
  (stage 1: a straight slot of width bolt_hole_d spanning across the counterbore diameter
  so the ceiling bridges in straight lines from wall to wall; stage 2: a perpendicular
  bolt_hole_d x bolt_hole_d square bridge across the slot to support the circular
  shaft hole above). This eliminates mid-air circular perimeters and prevents loose
  loops around the hole while preserving the flat bolt-head seat and the outer dovetail
  geometry.'
questions:
- text: What is the shape and size of the tripod clamp socket where the plate sits?
  answer: 'tripod clamp style: jaws with angled lips, tightened by a knob; the plate
    drops in from above; camera socket thread: 1/4-20 (the usual camera thread)'
- text: What are the dimensions of the salvaged 1/4"-20 webcam-mount bolt?
  answer: 'webcam bolt head across: about 15 mm; webcam bolt head height: about 5
    mm; webcam bolt length: about 10 mm (under the head)'
params:
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Salvaged webcam-mount-bolt head diameter (~15 mm across)
  bridge_step_h:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: Height of each sequential bridge stage above the counterbore ceiling (2
      layers at 0.2 mm layer height)
  bolt_clearance:
    value: 0.45
    unit: mm
    kind: design
    source: design
    note: Diametral clearance for the 1/4-20 bolt shaft through-hole
  camera_thread_engagement:
    value: 4.5
    unit: mm
    kind: world
    source: datasheet
    note: Standard ISO 1222 camera 1/4-20 socket thread engagement depth (4.5 mm)
  dovetail_base_w:
    value: 38
    unit: mm
    kind: world
    source: datasheet
    note: Standard Arca-Swiss dovetail base width across the angled lips (38 mm)
  head_recess_margin:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Extra depth in the bottom counterbore so the 5 mm bolt head stays recessed
      above the clamp floor
  bolt_shaft_l:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: Salvaged webcam-mount-bolt shaft length under the head (~10 mm)
  plate_l:
    value: 50
    unit: mm
    kind: design
    source: design
    note: Overall length of the quick-release plate along the clamp jaws
  dovetail_angle:
    value: 45
    unit: deg
    kind: world
    source: datasheet
    note: Standard Arca-Swiss dovetail jaw angle (45 degrees)
  bolt_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 nominal major thread diameter (6.35 mm)
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Salvaged webcam-mount-bolt head height (~5 mm)
  coupon_l:
    value: 22
    unit: mm
    kind: design
    source: design
    note: Length of the test coupon slice along the jaw axis (encloses the full counterbore)
  bolt_head_clearance:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Diametral clearance around the 15 mm bolt head in the counterbore
  dovetail_lip_h:
    value: 6
    unit: mm
    kind: design
    source: design
    note: Height of the 45-degree angled dovetail lip on each side of the plate
parts:
- id: qr_plate
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    rad = math.radians(p.dovetail_angle)\n\
    \    lip_inset = p.dovetail_lip_h / math.tan(rad)\n    top_w = p.dovetail_base_w\
    \ - 2.0 * lip_inset\n\n    web_t = p.bolt_shaft_l - p.camera_thread_engagement\n\
    \    cbore_h = p.bolt_head_h + p.head_recess_margin\n    plate_h = web_t + cbore_h\n\
    \n    bolt_hole_d = p.bolt_d + p.bolt_clearance\n    head_pocket_d = p.bolt_head_d\
    \ + p.bolt_head_clearance\n\n    pts = [\n        (-p.dovetail_base_w / 2.0, 0.0),\n\
    \        (p.dovetail_base_w / 2.0, 0.0),\n        (top_w / 2.0, p.dovetail_lip_h),\n\
    \        (top_w / 2.0, plate_h),\n        (-top_w / 2.0, plate_h),\n        (-top_w\
    \ / 2.0, p.dovetail_lip_h),\n    ]\n\n    body = (\n        cq.Workplane(\"YZ\"\
    )\n        .polyline(pts)\n        .close()\n        .extrude(p.plate_l / 2.0,\
    \ both=True)\n    )\n\n    cbore = cq.Workplane(\"XY\").circle(head_pocket_d /\
    \ 2.0).extrude(cbore_h)\n\n    bridge_stage1 = (\n        cq.Workplane(\"XY\"\
    )\n        .workplane(offset=cbore_h)\n        .rect(head_pocket_d, bolt_hole_d)\n\
    \        .extrude(p.bridge_step_h)\n        .intersect(\n            cq.Workplane(\"\
    XY\")\n            .workplane(offset=cbore_h)\n            .circle(head_pocket_d\
    \ / 2.0)\n            .extrude(p.bridge_step_h)\n        )\n    )\n\n    bridge_stage2\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=cbore_h + p.bridge_step_h)\n\
    \        .rect(bolt_hole_d, bolt_hole_d)\n        .extrude(p.bridge_step_h)\n\
    \    )\n\n    thru_hole = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=cbore_h\
    \ + 2.0 * p.bridge_step_h)\n        .circle(bolt_hole_d / 2.0)\n        .extrude(plate_h\
    \ - (cbore_h + 2.0 * p.bridge_step_h))\n    )\n\n    return body.cut(cbore).cut(bridge_stage1).cut(bridge_stage2).cut(thru_hole)\n"
  print_orientation: Bottom face of the plate on the build plate (z = 0), camera deck
    at z = 11 mm; counterbore ceiling uses two-stage sequential bridging to print
    cleanly without supports.
  use_orientation: 'Same as print orientation: bottom face (z = 0) rests in the tripod
    clamp jaws, top face (z = 11 mm) faces the bottom of the camera.'
- id: dovetail_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    import math\n    rad = math.radians(p.dovetail_angle)\n\
    \    lip_inset = p.dovetail_lip_h / math.tan(rad)\n    top_w = p.dovetail_base_w\
    \ - 2.0 * lip_inset\n\n    web_t = p.bolt_shaft_l - p.camera_thread_engagement\n\
    \    cbore_h = p.bolt_head_h + p.head_recess_margin\n    plate_h = web_t + cbore_h\n\
    \n    bolt_hole_d = p.bolt_d + p.bolt_clearance\n    head_pocket_d = p.bolt_head_d\
    \ + p.bolt_head_clearance\n\n    pts = [\n        (-p.dovetail_base_w / 2.0, 0.0),\n\
    \        (p.dovetail_base_w / 2.0, 0.0),\n        (top_w / 2.0, p.dovetail_lip_h),\n\
    \        (top_w / 2.0, plate_h),\n        (-top_w / 2.0, plate_h),\n        (-top_w\
    \ / 2.0, p.dovetail_lip_h),\n    ]\n\n    body = (\n        cq.Workplane(\"YZ\"\
    )\n        .polyline(pts)\n        .close()\n        .extrude(p.coupon_l / 2.0,\
    \ both=True)\n    )\n\n    cbore = cq.Workplane(\"XY\").circle(head_pocket_d /\
    \ 2.0).extrude(cbore_h)\n\n    bridge_stage1 = (\n        cq.Workplane(\"XY\"\
    )\n        .workplane(offset=cbore_h)\n        .rect(head_pocket_d, bolt_hole_d)\n\
    \        .extrude(p.bridge_step_h)\n        .intersect(\n            cq.Workplane(\"\
    XY\")\n            .workplane(offset=cbore_h)\n            .circle(head_pocket_d\
    \ / 2.0)\n            .extrude(p.bridge_step_h)\n        )\n    )\n\n    bridge_stage2\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=cbore_h + p.bridge_step_h)\n\
    \        .rect(bolt_hole_d, bolt_hole_d)\n        .extrude(p.bridge_step_h)\n\
    \    )\n\n    thru_hole = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=cbore_h\
    \ + 2.0 * p.bridge_step_h)\n        .circle(bolt_hole_d / 2.0)\n        .extrude(plate_h\
    \ - (cbore_h + 2.0 * p.bridge_step_h))\n    )\n\n    return body.cut(cbore).cut(bridge_stage1).cut(bridge_stage2).cut(thru_hole)\n"
  print_orientation: Bottom face on the build plate (z = 0), same as qr_plate, with
    two-stage sequential bridging over the counterbore.
  use_orientation: 'Same as print orientation: test-fit into the tripod clamp jaws
    and test-fit the salvaged 1/4-20 bolt.'
hardware:
- id: camera_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_mount_joint
  fastener: camera_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 5.5
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: qr_plate
    feature: bolt_head_counterbore
    role: head_seat
  - part: qr_plate
    feature: bolt_shaft_hole
    role: clearance
  nut: null
  external: camera 1/4-20 tripod socket
criteria:
- id: clamp_dovetail_fit
  part: qr_plate
  feature: dovetail_profile
  relation: engages
  hardware: null
  clearance_mm: 0.0
  params:
  - dovetail_base_w
  - dovetail_angle
  - dovetail_lip_h
  check:
    method: coupon
    ref: dovetail_coupon
    description: Test-fit the dovetail coupon into the tripod clamp jaws and tighten
      the knob to verify the 38 mm 45-degree dovetail seats and locks securely.
- id: bolt_head_seat_fit
  part: qr_plate
  feature: bolt_head_counterbore
  relation: seats
  hardware: camera_bolt
  clearance_mm: 1.5
  params:
  - bolt_head_d
  - bolt_head_clearance
  - bolt_head_h
  - head_recess_margin
  check:
    method: coupon
    ref: dovetail_coupon
    description: Insert the salvaged 1/4-20 webcam-mount bolt into the bottom counterbore
      of the coupon to verify the 15 mm head seats freely against the counterbore
      ceiling below the bottom surface.
- id: bolt_shaft_clearance
  part: qr_plate
  feature: bolt_shaft_hole
  relation: clears
  hardware: camera_bolt
  clearance_mm: 0.45
  params:
  - bolt_d
  - bolt_clearance
  - bridge_step_h
  check:
    method: coupon
    ref: dovetail_coupon
    description: Pass the 1/4-20 bolt shaft through the two-stage sequentially bridged
      center hole of the coupon to verify clean bridging and free sliding clearance.
- id: bolt_thread_protrusion
  part: qr_plate
  feature: camera_top_deck
  relation: faces
  hardware: camera_bolt
  clearance_mm: null
  params:
  - bolt_shaft_l
  - camera_thread_engagement
  check:
    method: measure
    ref: null
    description: Verify that ~4.5 mm of the 10 mm bolt shaft protrudes above the top
      surface of the plate to thread securely into the camera's 1/4-20 socket without
      bottoming out.
manual:
- n: '1'
  text: Print the dovetail_coupon first (bottom face z = 0 on the build plate, no
    supports needed). The counterbore ceiling now uses two-stage sequential bridging
    (a straight wall-to-wall slot followed by a perpendicular square bridge) so the
    hole prints cleanly without mid-air loops. Verify the bolt shaft passes smoothly
    through the hole, the bolt head seats in the recess, and the dovetail locks into
    the tripod clamp.
  parts:
  - dovetail_coupon
  hardware:
  - camera_bolt
  tool: null
- n: '2'
  text: Print the full qr_plate in PLA with its bottom face (z = 0) on the build plate
    and no supports. Use at least 4 perimeters and 40% infill for clamping strength.
  parts:
  - qr_plate
  hardware: []
  tool: null
- n: '3'
  text: Insert the salvaged 1/4"-20 webcam-mount bolt upward through the bottom counterbore
    of the qr_plate and thread it into the camera's 1/4"-20 tripod socket until snug.
  parts:
  - qr_plate
  hardware:
  - camera_bolt
  tool: null
- n: '4'
  text: Open the tripod clamp jaws with the knob, drop the qr_plate (with camera attached)
    into the clamp from above, and tighten the clamp knob firmly against the angled
    dovetail lips.
  parts:
  - qr_plate
  hardware:
  - camera_bolt
  tool: null
