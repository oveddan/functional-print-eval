  - bevel
  - flat
  check:
    method: none
    ref: null
    description: Confirmed fitting on print 1, unchanged
- id: head_recess
  part: qr_plate
  feature: counterbore slot
  relation: contains
  hardware: bolt
  clearance_mm: null
  params:
  - bolt_head_d
  - bolt_head_h
  - head_clear
  check:
    method: none
    ref: null
    description: Confirmed on print 1, unchanged
- id: bolt_protrusion
  part: qr_plate
  feature: floor under counterbore
  relation: clears
  hardware: null
  clearance_mm: 4.5
  params:
  - bolt_len
  - plate_t
  - bolt_head_h
  - cb_extra
  check:
    method: measure
    ref: null
    description: Bolt pokes about 4.5 mm above the top face, less than the camera
      socket depth
manual:
- n: '1'
  text: Print qr_plate with the recessed side on the bed and 100% infill (or 6 walls).
    Keep the slicer's layer height at 0.2 mm. You can skip fit_coupon, since the last
    plate already fit.
  parts:
  - qr_plate
  hardware: []
  tool: null
- n: '2'
  text: Look up into the head recess. It now has a thin solid skin (0.4 mm) closing
    off the bolt slot. That's on purpose. From the top face, run a hobby knife round
    the inside of the slot and push the skin out. Then clean the edges with the knife
    or a 7 mm drill bit until the bolt slides freely along the whole slot.
  parts:
  - qr_plate
  hardware: []
  tool: hobby knife (or 7 mm drill bit)
- n: '3'
  text: Push the webcam bolt up from underneath, through the slot, so its head sits
    in the recess.
  parts:
  - qr_plate
  hardware:
  - bolt
  tool: null
- n: '4'
  text: Hold the bolt head still from below and spin the camera onto the bolt until
    it's snug. Slide it along the slot to balance the camera first. Hand-tight only.
  parts:
  - qr_plate
  hardware:
  - bolt
  tool: null
- n: '5'
  text: Open the tripod knob, drop the plate in from above with the recessed side
    down, and tighten the knob. Give the camera a gentle tug before letting go.
  parts:
  - qr_plate
  hardware: []
  tool: null
