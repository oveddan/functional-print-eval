task: tripod-plate
note: 'Rev 2: the roof over the head recess had a hole in its first layer, so the
  bridge strands had nothing to anchor to and tangled. The through-slot now starts
  2 layers above the recess roof, so the roof prints as a plain solid bridge. Cut
  that skin out after printing. Nothing else changed.'
questions: []
params:
  arca_w:
    value: 38
    unit: mm
    kind: world
    source: guessed
    note: Arca-Swiss standard. The full plate fits the clamp (print 1).
  bevel:
    value: 4
    unit: mm
    kind: world
    source: guessed
    note: 45 deg dovetail flank depth; fit confirmed by print 1
  flat:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
  plate_t:
    value: 11
    unit: mm
    kind: design
    source: design
    note: ''
  plate_l:
    value: 60
    unit: mm
    kind: design
    source: design
    note: ''
  slot_l:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
  bolt_clear_d:
    value: 6.8
    unit: mm
    kind: hardware
    source: design
    note: 1/4-20 major dia 6.35 + clearance
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bolt_len:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: ''
  head_clear:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
  cb_extra:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: ''
  layer_h:
    value: 0.2
    unit: mm
    kind: world
    source: asked
    note: their slicer layer height
  membrane_layers:
    value: 2
    unit: count
    kind: design
    source: design
    note: solid sacrificial bridge over the head recess so the roof prints clean.
