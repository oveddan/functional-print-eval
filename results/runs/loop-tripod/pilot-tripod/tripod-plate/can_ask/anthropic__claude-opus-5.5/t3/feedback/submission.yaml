parts:
- id: qr_plate
  role: final
  material: PLA
  code: "def build(p):\n    W=p.arca_w; b=p.bevel; f=p.flat; T=p.plate_t; L=p.plate_l\n\
    \    pts=[(-W/2,0),(W/2,0),(W/2,f),(W/2-b,f+b),(W/2-b,T),(-(W/2-b),T),(-(W/2-b),f+b),(-W/2,f)]\n\
    \    body=cq.Workplane('YZ').polyline(pts).close().extrude(L).translate((-L/2,0,0))\n\
    \    cbw=p.bolt_head_d+p.head_clear\n    cbd=p.bolt_head_h+p.cb_extra\n    cb=cq.Workplane('XY').slot2D(p.slot_l+cbw,cbw).extrude(cbd)\n\
    \    mem=p.layer_h*p.membrane_layers\n    z0=cbd+mem\n    th=cq.Workplane('XY').workplane(offset=z0).slot2D(p.slot_l+p.bolt_clear_d,p.bolt_clear_d).extrude(T-z0)\n\
    \    return body.cut(cb).cut(th)\n"
  print_orientation: bottom face (bolt-head recess side) on bed, z=0; 100% infill
    or 6 walls
  use_orientation: 'same as printed: recess down in the tripod clamp, narrow top face
    against camera'
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    W=p.arca_w; b=p.bevel; f=p.flat; T=p.plate_t\n    pts=[(-W/2,0),(W/2,0),(W/2,f),(W/2-b,f+b),(W/2-b,T),(-(W/2-b),T),(-(W/2-b),f+b),(-W/2,f)]\n\
    \    return cq.Workplane('YZ').polyline(pts).close().extrude(p.coupon_l)\n"
  print_orientation: wide bottom face on bed
  use_orientation: drop into tripod clamp to test fit (optional now, since the plate
    already fits)
hardware:
- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_bolt
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.5
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: qr_plate
    feature: counterbore slot
    role: head_seat
  - part: qr_plate
    feature: through slot (after membrane removed)
    role: clearance
  nut: null
  external: camera 1/4-20 tripod socket
criteria:
- id: roof_clean
  part: qr_plate
  feature: sacrificial membrane over head recess
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - layer_h
  - membrane_layers
  check:
    method: none
    ref: null
    description: The recess roof prints as a plain solid bridge with no loose loops.
      After cutting the membrane, the slot is fully open and the bolt slides along
      it.
- id: dovetail_fit
  part: qr_plate
  feature: dovetail profile
  relation: engages
  hardware: null
  clearance_mm: null
  params:
