  bolt_len:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: ''
  cb_d:
    value: 16
    unit: mm
    kind: design
    source: design
    note: ''
  cb_depth:
    value: 5
    unit: mm
    kind: design
    source: design
    note: ''
