task: tripod-plate
note: 'Changed only the roof over the bolt-head recess. Before, the slicer had to
  print the loop around the hole in mid-air, which made the tangles. Now it bridges
  in two one-layer steps: first lengthwise beside a bolt-wide gap, then across that
  gap. Everything else is unchanged, since it fit the clamp and the head fit its recess.'
questions: []
params:
  arca_width:
    value: 38
    unit: mm
    kind: world
    source: guessed
    note: Arca-Swiss standard width. The printed plate fits the clamp.
  bevel_depth:
    value: 4
    unit: mm
    kind: world
    source: guessed
    note: 45-degree dovetail bevel. The printed plate fits the clamp.
  land:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: ''
  plate_t:
    value: 10
    unit: mm
    kind: design
    source: design
    note: ''
  plate_len:
    value: 60
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_len:
    value: 15
    unit: mm
    kind: design
    source: design
    note: ''
  bolt_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_clear_d:
    value: 6.9
    unit: mm
    kind: design
    source: design
    note: ''
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
