  - bolt_head_h
  - cb_d
  - cb_depth
  check:
    method: measure
    ref: null
    description: 'Already confirmed: the head fits its recess'
- id: clean_roof
  part: qr_plate
  feature: stepped bridge roof over head recess
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - layer_h
  - bolt_clear_d
  - cb_d
  - slot_travel
  - cb_depth
  check:
    method: measure
    ref: null
    description: Looking up into the recess, you see straight bridge strands with
      no loose loops, and the bolt slides the full length of the slot without trimming
- id: thread_reach
  part: qr_plate
  feature: floor under counterbore
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - bolt_len
  - cb_depth
  - plate_t
  check:
    method: measure
    ref: null
    description: About 5 mm of thread sticks out the top, and the camera tightens
      down onto the plate
manual:
- n: '1'
  text: Print qr_plate in PLA, bottom face down, with 4+ walls and 40%+ infill. Use
    the slicer's default bridge settings. Skip fit_coupon, since the plate already
    fits.
  parts:
  - qr_plate
  hardware: []
  tool: null
- n: '2'
  text: Look up into the head recess. The roof should be clean straight strands. If
    any stray strings are hanging in the hole, clear them with a hobby knife or a
    7 mm drill turned by hand.
  parts:
  - qr_plate
  hardware: []
  tool: null
- n: '3'
  text: Push the webcam bolt up through the slot from the bottom so its head sits
    in the recess.
  parts:
  - qr_plate
  hardware:
  - cam_bolt
  tool: null
- n: '4'
  text: Screw the bolt into the camera's tripod socket, moving it along the slot until
    the camera balances. Tighten until it's snug, not hard.
  parts:
  - qr_plate
  hardware:
  - cam_bolt
  tool: null
- n: '5'
  text: Put the plate into the tripod clamp, tighten the knob, and wiggle-test before
    letting go of the camera. Rubber or grip tape on top helps stop the camera twisting.
  parts:
  - qr_plate
  hardware: []
  tool: null
