    note: printer layer height. The bridging step is one layer thick.
parts:
- id: qr_plate
  role: final
  material: PLA
  code: "def build(p):\n    W = p.arca_width\n    Wt = W - 2*p.bevel_depth\n    z1\
    \ = p.land\n    z2 = p.land + p.bevel_depth\n    pts = [(-W/2,0),(W/2,0),(W/2,z1),(Wt/2,z2),(Wt/2,p.plate_t),(-Wt/2,p.plate_t),(-Wt/2,z2),(-W/2,z1)]\n\
    \    body = cq.Workplane('XZ').polyline(pts).close().extrude(p.plate_len/2, both=True)\n\
    \    cb_len = p.slot_travel + p.cb_d\n    cb = cq.Workplane('XY').slot2D(cb_len,\
    \ p.cb_d, 90).extrude(p.cb_depth)\n    stripe = cq.Workplane('XY').workplane(offset=p.cb_depth).rect(p.bolt_clear_d,\
    \ cb_len).extrude(p.layer_h)\n    hole = cq.Workplane('XY').workplane(offset=p.cb_depth\
    \ + p.layer_h).slot2D(p.slot_travel + p.bolt_clear_d, p.bolt_clear_d, 90).extrude(p.plate_t)\n\
    \    return body.cut(cb).cut(stripe).cut(hole)\n"
  print_orientation: 'tripod (bottom, widest) face on the bed. The roof over the head
    recess uses a stepped bridge: layer 1 spans the recess lengthwise (28 mm) beside
    a bolt-width gap, and layer 2 spans that 6.9 mm gap. So no perimeter around the
    hole is printed in mid-air.'
  use_orientation: bevelled side down in the tripod clamp, narrow flat top against
    the camera
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    W = p.arca_width\n    Wt = W - 2*p.bevel_depth\n    z1\
    \ = p.land\n    z2 = p.land + p.bevel_depth\n    pts = [(-W/2,0),(W/2,0),(W/2,z1),(Wt/2,z2),(Wt/2,p.plate_t),(-Wt/2,p.plate_t),(-Wt/2,z2),(-W/2,z1)]\n\
    \    return cq.Workplane('XZ').polyline(pts).close().extrude(p.coupon_len/2, both=True)\n"
  print_orientation: bottom face on the bed
  use_orientation: clamp in the tripod head to test fit (optional now, since the plate
    already fits)
hardware:
- id: cam_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_screw
  fastener: cam_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: qr_plate
    feature: counterbore slot
    role: head_seat
  - part: qr_plate
    feature: clearance slot
    role: clearance
  nut: null
  external: camera's 1/4-20 tripod socket
criteria:
- id: dovetail_fit
  part: qr_plate
  feature: 45-degree side bevels
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - arca_width
  - bevel_depth
  - land
  - plate_t
  check:
    method: measure
    ref: null
    description: 'Already confirmed: the plate locks in the clamp'
