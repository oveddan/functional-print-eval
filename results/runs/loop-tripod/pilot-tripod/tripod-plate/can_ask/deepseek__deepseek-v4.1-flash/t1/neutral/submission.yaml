task: tripod-plate
note: 'Second pass. Changed from the first submission: (1) the printed screw''s thread
  was 5 mm too long - I had measured its 10 mm from the head''s top face, whereas
  the salvaged bolt''s 10 mm is under the head, so the screw would have stood 9.2
  mm proud of the plate and bottomed out in the camera socket. It is now 5.0 mm of
  thread, giving the same 4.2 mm of engagement as the bolt. (2) The head pocket went
  Ø16 -> Ø18, because a 15 mm head is 15 mm across flats but 17.3 mm across corners,
  so a hex head would not have entered the old pocket; the printed screw''s head is
  now Ø17 to match. (3) The plate is now modelled with the narrow camera face on the
  bed and is flipped over to use: that puts the flat camera contact face and the bolt-head
  seat on the bed / on solid layers instead of spanning a 16 mm bridge, which was
  sagging exactly where the head bears. (4) The coupon is now three pieces and includes
  a working slice of the plate (same width, taper, pocket and hole), so the bolt and
  camera joint can be proved before the plate is printed. Unchanged and still guessed:
  plate_wid 38, plate_t 6.0, plate_chamfer_deg 45 - the borrowed clamp''s mouth width
  and slot depth could not be measured, so the coupon is the gate for those three.
  Everything sized from real hardware is settled (Ø18 x 5.2 pocket, Ø7 hole, 4.2 mm
  engagement vs a ~6.5 mm socket). Use the salvaged bolt as the real screw - it is
  the right thread, the right length, and steel, which is what carries the camera.'
questions: []
params:
  bolt_head_d:
    value: 15.0
    unit: mm
    kind: hardware
    source: measured
    note: salvaged webcam-mount bolt, head across - likely across flats, hence the
      generous pocket
  bolt_head_h:
    value: 5.0
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bolt_thread_len:
    value: 10.0
    unit: mm
    kind: hardware
    source: measured
    note: threaded length under the head, not from the head's top face
  camera_socket_depth:
    value: 6.5
    unit: mm
    kind: world
    source: guessed
    note: typical 1/4-20 camera socket; could not be measured. Kept above our 4.2
      mm of engagement so neither screw can bottom out
  coupon_blk_len:
    value: 34.0
    unit: mm
    kind: design
    source: design
    note: long enough to hold the Ø18 pocket and be gripped by the jaws
  coupon_blk_w:
    value: 38.0
    unit: mm
    kind: design
    source: design
    note: 'the middle piece: a working slice of the plate, same width/taper/pocket/hole'
  coupon_len:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: length of the two plain width gauges
  coupon_t:
    value: 6.0
    unit: mm
    kind: design
    source: design
    note: same as plate_t so the thickness is tested too
  coupon_w1:
    value: 33.0
    unit: mm
    kind: design
    source: design
    note: narrow width gauge, left of centre
  coupon_w2:
    value: 43.0
    unit: mm
    kind: design
    source: design
    note: wide width gauge, right of centre
  coupon_x:
    value: 50.0
    unit: mm
    kind: design
    source: design
    note: ''
  plate_chamfer_deg:
    value: 45
    unit: deg
    kind: design
    source: guessed
    note: 'matches the ''angled lips'' described; 30 if they look much shallower.
      This sets the camera face width: 38 - 2x6 = 26 mm'
  plate_cbore_d:
    value: 18.0
    unit: mm
    kind: design
    source: design
    note: head 15 across flats is 17.3 across corners, +0.7; the printed screw head
      is 17.0 to match
  plate_cbore_depth:
    value: 5.2
    unit: mm
    kind: design
    source: design
    note: head 5.0 + 0.2, leaving a 0.8 mm roof on the camera side and the head 0.2
      mm inside the wide face
  plate_hole_d:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: '1/4-20 clearance: 6.35 + 0.65'
  plate_len:
    value: 50.0
    unit: mm
    kind: design
    source: design
    note: along the plate, across the clamp
  plate_t:
    value: 6.0
    unit: mm
    kind: design
    source: guessed
    note: 'GUESS for the clamp''s slot depth. Also gives the 0.8 mm roof and the 4.2
      mm engagement: exposed thread = bolt_thread_len - head_h - roof'
  plate_wid:
    value: 38.0
    unit: mm
    kind: design
    source: guessed
    note: GUESS for the borrowed clamp's jaw span - gate it with plate_fit_coupon
      before printing the plate
  screw_head_d:
    value: 17.0
    unit: mm
    kind: design
    source: design
    note: 17.0 fits the Ø18 pocket with 0.5 per side, and the salvaged bolt's 15.0
      head still fits too
  screw_head_h:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: same as the salvaged bolt head so either seats in the same pocket
  screw_thread_len:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: 'only 5.0: the head''s top face sits at the pocket floor, 0.8 mm below the
      camera face, so 5.0 - 0.8 = 4.2 mm stands proud - the same as the bolt'
  thread_minor_d:
    value: 4.98
    unit: mm
    kind: hardware
    source: datasheet
    note: 1/4-20 UNC minor ~4.98
  thread_od:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: 1/4-20 major = 1/4 in; camera socket and both screws match
  thread_pitch:
    value: 1.27
    unit: mm
    kind: hardware
    source: catalog
    note: ''
parts:
- id: plate
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    L = p.plate_len\n    W = p.plate_wid\n\
    \    t = p.plate_t\n    ang = p.plate_chamfer_deg\n    d = p.plate_hole_d\n  \
    \  cbd = p.plate_cbore_d\n    cbh = p.plate_cbore_depth\n\n    # printed camera-face\
    \ down: narrow face on the bed, body flares out to the wide face\n    narrow =\
    \ W - 2.0 * t / math.tan(math.radians(ang))\n\n    body = (\n        cq.Workplane(\"\
    XY\")\n        .rect(narrow, L)\n        .workplane(offset=t)\n        .rect(W,\
    \ L)\n        .loft(combine=True)\n    )\n\n    # 1/4-20 clearance hole, right\
    \ through\n    body = body.cut(\n        cq.Workplane(\"XY\").circle(d / 2.0).extrude(t\
    \ + 2.0).translate((0, 0, -1.0))\n    )\n\n    # head pocket, opening from the\
    \ wide (top) face; its floor is 0.8 mm above the camera face\n    body = body.cut(\n\
    \        cq.Workplane(\"XY\")\n        .circle(cbd / 2.0)\n        .extrude(cbh\
    \ + 0.2)\n        .translate((0, 0, t - cbh))\n    )\n    return body\n"
  print_orientation: narrow 26 x 50 mm camera face on the bed (z = 0); the body flares
    outward and upward at 45 deg to the wide 38 x 50 face, with the Ø18 pocket opening
    upward. No supports anywhere - supports under the pocket would fill it
  use_orientation: 'flip it over from the printed orientation: the wide face with
    the Ø18 pocket goes face down onto the clamp floor (holding the bolt head, 0.2
    mm inside it), the tapered sides face the jaws, and the 26 x 50 mm camera face
    points up to meet the camera''s base; the bolt goes up through it from underneath'
- id: plate_fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    L = p.coupon_len\n    Lb = p.coupon_blk_len\n\
    \    W = p.coupon_blk_w\n    t = p.coupon_t\n    ang = p.plate_chamfer_deg\n \
    \   d = p.plate_hole_d\n    cbd = p.plate_cbore_d\n    cbh = p.plate_cbore_depth\n\
    \    x = p.coupon_x\n\n    solids = []\n\n    # two plain width gauges, wide face\
    \ down so they are tried without flipping\n    for w, xoff in ((p.coupon_w1, -x),\
    \ (p.coupon_w2, x)):\n        narrow = w - 2.0 * t / math.tan(math.radians(ang))\n\
    \        blk = (\n            cq.Workplane(\"XY\")\n            .rect(w, L)\n\
    \            .workplane(offset=t)\n            .rect(narrow, L)\n            .loft(combine=True)\n\
    \        )\n        solids.append(blk.translate((xoff, 0, 0)).val())\n\n    #\
    \ middle piece: a working slice of the plate - width, taper, head pocket and thread\
    \ hole\n    narrow = W - 2.0 * t / math.tan(math.radians(ang))\n    blk = (\n\
    \        cq.Workplane(\"XY\")\n        .rect(W, Lb)\n        .workplane(offset=t)\n\
    \        .rect(narrow, Lb)\n        .loft(combine=True)\n    )\n    blk = blk.cut(\n\
    \        cq.Workplane(\"XY\").circle(d / 2.0).extrude(t + 2.0).translate((0, 0,\
    \ -1.0))\n    )\n    blk = blk.cut(\n        cq.Workplane(\"XY\")\n        .circle(cbd\
    \ / 2.0)\n        .extrude(cbh + 0.2)\n        .translate((0, 0, t - cbh))\n \
    \   )\n    solids.append(blk.val())\n\n    return cq.Compound.makeCompound(solids)\n"
  print_orientation: flat, wide face down as modelled (the same orientation they are
    used in), each piece tapering upward to its narrow face; three separate pieces
    in a row along X (33 mm gauge, 38 mm pocket block, 43 mm gauge); no supports
  use_orientation: 'no flipping: drop each piece into the tripod clamp exactly as
    printed to find the plate width that seats and grips. The middle block''s pocket
    takes the salvaged bolt from underneath so the bolt + camera joint can be tried
    before the plate is printed'
- id: screw
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    od = p.thread_od\n    P = p.thread_pitch\n\
    \    minor = p.thread_minor_d\n    hd = p.screw_head_d\n    hh = p.screw_head_h\n\
    \    tl = p.screw_thread_len\n\n    # head printed face down: z from -hh to 0\n\
    \    head = cq.Workplane(\"XY\").circle(hd / 2.0).extrude(hh).translate((0, 0,\
    \ -hh))\n    for i in range(12):\n        a = math.radians(i * 30.0)\n       \
    \ x = math.cos(a) * hd / 2.0\n        y = math.sin(a) * hd / 2.0\n        head\
    \ = head.cut(\n            cq.Workplane(\"XY\")\n            .circle(1.1)\n  \
    \          .extrude(hh + 0.4)\n            .translate((x, y, -hh - 0.2))\n   \
    \     )\n\n    # shank core, starting inside the head so the union is solid\n\
    \    core = (\n        cq.Workplane(\"XY\")\n        .circle(minor / 2.0)\n  \
    \      .extrude(tl + 0.5)\n        .translate((0, 0, -0.5))\n    )\n\n    # 1/4-20\
    \ thread: V profile swept along a helix, starting at the head's top face\n   \
    \ r_root = minor / 2.0 - 0.3\n    r_crest = od / 2.0\n    r_helix = (r_root +\
    \ r_crest) / 2.0\n    prof = (\n        cq.Workplane(\"XZ\")\n        .polyline([(r_root,\
    \ -P / 2.0), (r_crest, 0.0), (r_root, P / 2.0)])\n        .close()\n    )\n  \
    \  try:\n        helix = cq.Wire.makeHelix(P, tl, r_helix)\n        thread = prof.sweep(cq.Workplane(obj=helix),\
    \ isFrenet=True)\n        body = head.union(core).union(thread)\n    except Exception:\n\
    \        body = head.union(core)\n\n    # trim the thread flush at the tip\n \
    \   body = body.cut(\n        cq.Workplane(\"XY\")\n        .workplane(offset=tl)\n\
    \        .box(hd * 2.0, hd * 2.0, 20.0, centered=(True, True, False))\n    )\n\
    \    return body.translate((0, 0, hh))\n"
  print_orientation: 'standing: head face down on the bed, shank and thread rising
    vertically; no supports (the thread flanks are the only overhang)'
  use_orientation: 'a spare for the salvaged bolt: the Ø17 head drops into the plate''s
    Ø18 pocket and its 5 mm of thread passes up through the plate and into the camera''s
    1/4-20 socket, 4.2 mm proud of the camera face'
hardware:
- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_to_plate
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.8
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: plate
    feature: floor of the Ø18 head pocket (bears on the bolt head's top face)
    role: head_seat
  - part: plate
    feature: Ø7 clearance hole through the plate
    role: clearance
  nut: null
  external: camera's 1/4-20 tripod socket
criteria:
- id: pocket_takes_head
  part: plate
  feature: Ø18 head pocket in the wide face, 5.2 mm deep, leaving a 0.8 mm roof on
    the camera side
  relation: contains
  hardware: bolt
  clearance_mm: 1.5
  params:
  - plate_cbore_d
  - plate_cbore_depth
  - bolt_head_d
  - bolt_head_h
  check:
    method: measure
    ref: null
    description: 'drop the bolt head into the pocket: it goes in freely and lands
      on the pocket floor with its face 0.2 mm inside the plate''s wide face, so the
      plate still sits flat on the clamp. The pocket is sized for a head measured
      across flats (15 across flats = 17.3 across corners); if the head is a round/knurled
      one it has 1.5 mm of play per side'
- id: hole_clears_thread
  part: plate
  feature: 1/4-20 clearance hole through the plate
  relation: clears
  hardware: bolt
  clearance_mm: 0.65
  params:
  - plate_hole_d
  - thread_od
  check:
    method: measure
    ref: null
    description: the bolt's threaded shank passes through the Ø7 hole with no binding
      (0.65 mm diametral clearance on the 6.35 mm major)
- id: seats_in_clamp
  part: plate
  feature: 'the two 45 deg tapered long sides: 38 mm across the wide face, 26 mm across
    the camera face'
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - plate_wid
  - plate_t
  - plate_chamfer_deg
  - coupon_w1
  - coupon_w2
  - coupon_blk_w
  - coupon_t
  - coupon_len
  - coupon_blk_len
  - coupon_x
  check:
    method: coupon
    ref: plate_fit_coupon
    description: 'print the coupon FIRST. Pieces sit flat as modelled, wide face down,
      no flipping: 33 mm gauge, 43 mm gauge, and the 38 mm pocket block in the middle.
      Loosen the clamp knob and drop each into the slot: the one that drops in, sits
      down on the slot floor and is gripped by the angled lips when you snug the knob
      gives the correct plate_wid. If they will not enter, reduce plate_wid (and coupon_w1/w2/blk_w
      with it) by 3 mm; if they enter but the jaws never touch them, increase by 3
      mm. If the lips look much shallower than 45 deg, set plate_chamfer_deg to 30.
      Reprint the coupon (minutes) before the plate'
- id: thread_reaches_camera
  part: screw
  feature: 1/4-20 thread standing proud of the camera face
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - screw_thread_len
  - screw_head_h
  - plate_cbore_depth
  - plate_t
  - camera_socket_depth
  - thread_od
  - thread_pitch
  check:
    method: measure
    ref: null
    description: 'head (5.0) sits in the 5.2 deep pocket, so the 5.0 mm of thread
      on the shank stands 4.2 mm proud of the camera face - identical to the salvaged
      bolt, whose 10.0 mm under a 5.0 mm head also leaves 4.2 mm past the face. Both
      are under the ~6.5 mm socket depth, so neither can bottom out and lift the plate
      off the camera. Confirm with the coupon''s pocket block: bolt in the pocket,
      camera screwed on, plate pulls flat'
- id: plate_face_meets_camera
  part: plate
  feature: camera face, 26 x 50 mm, with the bolt emerging through its centre
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - plate_len
  - plate_wid
  - plate_t
  - plate_chamfer_deg
  check:
    method: none
    ref: null
    description: the camera's base lands flat on the 26 x 50 mm camera face, which
      was printed on the bed so it is dead flat; check by eye that it pulls down square
      with no rocking before the clamp knob is tightened
manual:
- n: '1'
  text: Print plate_fit_coupon first - three small pieces, a few grams, no supports.
    They come off the bed exactly as they should be tried in the clamp (wide face
    down), so do not flip them.
  parts:
  - plate_fit_coupon
  hardware: []
  tool: 3D printer
- n: '2'
  text: 'Take the middle piece (the 38 mm block with the pocket). Push the salvaged
    webcam-mount bolt up into the pocket from underneath and screw your camera onto
    the thread. Check two things: the head sits fully in the pocket without standing
    proud of the wide face, and the camera pulls down flat on the 26 mm face with
    4.2 mm of thread engaged - not bottoming out. This is the same joint the finished
    plate makes.'
  parts:
  - plate_fit_coupon
  hardware:
  - bolt
  tool: null
- n: '3'
  text: 'Loosen the tripod clamp''s knob and drop the three pieces into the slot one
    at a time: 33 mm gauge, 43 mm gauge, and the 38 mm block. Find the one that drops
    in, sits down on the slot floor, and is gripped by the angled jaw lips when you
    snug the knob.'
  parts:
  - plate_fit_coupon
  hardware: []
  tool: null
- n: '4'
  text: 'If the 38 mm one is the one that grips, print plate as sent. If not: edit
    plate_wid (and coupon_w1, coupon_w2, coupon_blk_w with it) by 3 mm in the direction
    the test showed, or set plate_chamfer_deg to 30 if the jaw lips look much shallower,
    and reprint the coupon. Keep plate_t at 6.0 unless the pieces are too tall to
    sit down in the slot, in which case drop it to 5.0 (the bolt then bites 5.2 mm
    into the camera, still fine).'
  parts:
  - plate_fit_coupon
  hardware: []
  tool: null
- n: '5'
  text: 'Print plate. It is modelled flipped from how it is used: the narrow 26 x
    50 mm camera face is on the bed, and the body flares outward and upward at 45
    deg to the wide face. That overhang needs no supports - leave supports off entirely,
    and do not let the slicer put any under the pocket. Print it as modelled.'
  parts:
  - plate
  hardware: []
  tool: 3D printer
- n: '6'
  text: 'Optional: print screw, head down on the bed, standing vertically, no supports.
    Its thread is only 5 mm long by design - 4.2 mm of it has to stand proud of the
    plate, the rest sits inside the plate''s hole. Try it in your camera''s socket
    gently first; a PLA thread cross-threads more easily than the steel bolt.'
  parts:
  - screw
  hardware: []
  tool: 3D printer
- n: '7'
  text: 'Flip the printed plate over: the wide face with the Ø18 pocket now faces
    down and the 26 x 50 mm face is on top, facing the camera. Push the salvaged bolt
    (or the printed screw) up into the pocket from underneath, thread first.'
  parts:
  - plate
  - screw
  hardware: []
  tool: null
- n: '8'
  text: 'Screw it into the camera''s 1/4-20 tripod socket until snug - the plate''s
    top face should pull flat against the camera''s base. Snug only: there is just
    0.8 mm of PLA between the bolt head and the face the camera sits on, so do not
    crank on it.'
  parts:
  - plate
  - screw
  hardware:
  - bolt
  tool: null
- n: '9'
  text: Loosen the clamp's knob, drop camera + plate into the slot from above with
    the tapered sides between the jaws, and snug the knob so the jaws bite the taper
    and press the plate down onto the clamp floor.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '10'
  text: 'Temporary mount only: PLA creeps under load and the printed thread wears.
    Check the knob is snug before every session, keep the camera light, never hang
    a strap or a bag from it, and never pick the tripod up by the camera.'
  parts:
  - plate
  - screw
  hardware:
  - bolt
  tool: null
