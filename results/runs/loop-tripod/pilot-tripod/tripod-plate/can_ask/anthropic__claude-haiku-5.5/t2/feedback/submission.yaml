task: tripod-plate
note: Temporary stand-in only. Plate dimensions are guessed because the measure tool
  did not return them. Check the plate against the real tripod jaws before mounting
  any camera, and keep the load light. The hole is printed undersized and must be
  drilled to 6.6 mm. The 1/4-20 thread is the salvaged metal bolt, not printed. The
  clamp part's print result is still unknown.
questions: []
params:
  plate_l:
    value: 60
    unit: mm
    kind: design
    source: guessed
    note: Guessed typical quick-release plate length. Not measured. Check against
      the real plate.
  plate_w:
    value: 40
    unit: mm
    kind: design
    source: guessed
    note: Guessed plate width. Not measured. Check against the real plate.
  plate_t:
    value: 6
    unit: mm
    kind: design
    source: guessed
    note: Guessed plate thickness. Must match the jaw gap on the real tripod head.
      Not measured.
  hole_print_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Undersized printed hole so the hole prints cleanly. Drill it out to hole_drill_d
      after printing.
  hole_drill_d:
    value: 6.6
    unit: mm
    kind: design
    source: design
    note: Final clearance for the 1/4-20 bolt shank, made by drilling.
  head_d:
    value: 15
    unit: mm
    kind: world
    source: asked
    note: Webcam bolt head diameter, as reported by the person (about 15 mm).
  head_h:
    value: 5
    unit: mm
    kind: world
    source: guessed
    note: Bolt head height. Not measured. Head fitted in its recess in the printed
      test.
  bolt_l:
    value: 10
    unit: mm
    kind: world
    source: asked
    note: Webcam bolt length under the head, about 10 mm as reported. Verify the shank
      stands proud of the plate.
parts:
- id: plate
  role: final
  material: PLA
  code: "def build(p):\n    plate = cq.Workplane('XY').box(p.plate_l, p.plate_w, p.plate_t,\
    \ centered=(True, True, False))\n    plate = plate.cut(cq.Workplane('XY').circle(p.hole_print_d\
    \ / 2).extrude(p.plate_t))\n    pocket = cq.Workplane('XY').circle(p.head_d /\
    \ 2 + 0.3).extrude(p.head_h + 0.2)\n    return plate.cut(pocket)"
  print_orientation: plate lying flat, underside (head pocket opening) on the bed
  use_orientation: plate lying flat under the camera, bolt head seated in the underside
    pocket
hardware:
- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: j1
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: pocket
    role: head_seat
  nut: null
  external: null
criteria:
- id: c1
  part: plate
  feature: underside pocket for the bolt head
  relation: seats
  hardware: bolt
  clearance_mm: null
  params:
  - head_d
  - head_h
  check:
    method: measure
    ref: null
    description: Head sits flush in the pocket without rocking. Confirmed on the printed
      test.
- id: c2
  part: plate
  feature: bolt clearance hole, drilled to size
  relation: clears
  hardware: bolt
  clearance_mm: null
  params:
  - hole_print_d
  - hole_drill_d
  check:
    method: measure
    ref: null
    description: Shank passes through freely after drilling to 6.6 mm.
- id: c3
  part: plate
  feature: plate thickness vs tripod jaw gap
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - plate_t
  - plate_l
  - plate_w
  check:
    method: template
    ref: null
    description: Plate grips firmly in the real tripod jaws without slipping. Not
      yet verified, because the plate dimensions were guessed.
manual:
- n: '1'
  text: Print the plate flat, with the pocket side on the bed. The centre hole prints
    at 5.5 mm.
  parts:
  - plate
  hardware: []
  tool: null
- n: '2'
  text: Drill the centre hole out to 6.6 mm with a drill, turning by hand so the plastic
    does not melt or split. Clear any loose strands from the hole.
  parts:
  - plate
  hardware: []
  tool: 6.6 mm drill bit
- n: '3'
  text: Drop the bolt head-first into the underside pocket so the head sits flush
    inside it. The shank passes up through the hole.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '4'
  text: Check the shank stands far enough above the plate to thread into the camera.
    Use the camera's own 1/4-20 socket as the test. Do not overtighten.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '5'
  text: Check the plate against the real tripod jaws. Slide it in until it clicks
    and tighten the knob. Confirm it does not slip before mounting a camera. Plate
    dimensions are guessed, so adjust them and reprint if the grip is poor.
  parts:
  - plate
  hardware: []
  tool: null
