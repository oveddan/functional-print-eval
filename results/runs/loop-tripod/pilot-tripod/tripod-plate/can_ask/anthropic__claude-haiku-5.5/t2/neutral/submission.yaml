task: tripod-plate
note: Temporary stand-in only. Plate dimensions are guessed because measurements could
  not be obtained. Do not print as final until plate_l, plate_w and plate_t are checked
  against the real plate and jaw gap. Keep the load light. The 1/4-20 thread is the
  salvaged metal bolt, not printed.
questions:
- text: Length, width and thickness of the real quick-release plate, in mm?
  answer: null
- text: Jaw gap of the tripod head, in mm?
  answer: null
- text: Length of the salvaged bolt's threaded shank above the head, and head height?
  answer: null
params:
  plate_l:
    value: 60
    unit: mm
    kind: design
    source: guessed
    note: Guessed typical quick-release plate length. Not measured. Check against
      the real plate before printing.
  plate_w:
    value: 40
    unit: mm
    kind: design
    source: guessed
    note: Guessed plate width. Not measured. Check against the real plate before printing.
  plate_t:
    value: 6
    unit: mm
    kind: design
    source: guessed
    note: Guessed plate thickness. Must match the jaw gap on the real tripod head.
      Not measured.
  hole_d:
    value: 6.6
    unit: mm
    kind: design
    source: design
    note: Clearance hole for the 1/4-20 bolt shank.
  head_d:
    value: 15
    unit: mm
    kind: world
    source: asked
    note: Webcam bolt head diameter, as reported by the person (about 15 mm).
  head_h:
    value: 5
    unit: mm
    kind: world
    source: guessed
    note: Bolt head height. Not measured.
  bolt_l:
    value: 10
    unit: mm
    kind: world
    source: asked
    note: Webcam bolt length under the head, about 10 mm as reported. Shank must stand
      proud of the plate to thread into the camera. Verify.
parts:
- id: plate
  role: final
  material: PLA
  code: "def build(p):\n    plate = cq.Workplane('XY').box(p.plate_l, p.plate_w, p.plate_t,\
    \ centered=(True, True, False))\n    plate = plate.cut(cq.Workplane('XY').circle(p.hole_d\
    \ / 2).extrude(p.plate_t))\n    pocket = cq.Workplane('XY').circle(p.head_d /\
    \ 2 + 0.3).extrude(p.head_h + 0.2)\n    return plate.cut(pocket)"
  print_orientation: plate lying flat, underside (head pocket opening) on the bed
  use_orientation: plate lying flat under the camera, bolt head seated in the underside
    pocket
hardware:
- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: j1
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: pocket
    role: head_seat
  nut: null
  external: null
criteria:
- id: c1
  part: plate
  feature: underside pocket for the bolt head
  relation: seats
  hardware: bolt
  clearance_mm: null
  params:
  - head_d
  - head_h
  check:
    method: measure
    ref: null
    description: Head sits flush in the pocket without rocking.
- id: c2
  part: plate
  feature: bolt clearance hole
  relation: clears
  hardware: bolt
  clearance_mm: null
  params:
  - hole_d
  check:
    method: measure
    ref: null
    description: Shank passes through freely.
- id: c3
  part: plate
  feature: plate thickness vs tripod jaw gap
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - plate_t
  - plate_l
  - plate_w
  check:
    method: template
    ref: null
    description: Plate grips firmly in the real tripod jaws without slipping. Verify
      before trusting with a camera.
manual:
- n: '1'
  text: Before printing, measure the real quick-release plate and the tripod jaw gap,
    and update plate_l, plate_w and plate_t to match. Print the plate flat, with the
    pocket side on the bed.
  parts:
  - plate
  hardware: []
  tool: null
- n: '2'
  text: Drop the bolt head-first into the underside pocket so the head sits flush
    inside it. The shank passes up through the hole.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '3'
  text: Check the shank stands far enough above the plate to thread into the camera.
    Use the camera's own 1/4-20 socket as the test. Do not overtighten.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '4'
  text: Slide the plate into the tripod jaws until it clicks. Tighten the knob until
    the plate is held firmly. Before mounting the camera, confirm it does not slip.
  parts:
  - plate
  hardware: []
  tool: null
