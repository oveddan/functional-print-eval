task: tripod-plate
note: Both parts are now oriented for printing with the flat camera-mounting face
  on the build plate (z = 0) and the bolt-head counterbore pocket opening upward (+z).
  This completely eliminates the bridged roof over the pocket so the 6.8 mm hole and
  bolt-head seat print cleanly on solid base layers without loose loops or tangles,
  while keeping the exact external dovetail and pocket dimensions that fit your clamp
  and webcam bolt.
questions:
- text: How hard would it be to 3D print it, both the flat part and the part that
    screws in?
  answer: Printing the flat quick-release plate in PLA works well because the tripod
    clamp jaws load it in compression, whereas 3D-printing the 1/4"-20 camera screw
    in PLA is risky—a printed plastic screw can snap off flush inside your camera's
    tripod socket. This updated design keeps the exact dovetail and pocket dimensions
    that fit your clamp and salvaged 1/4"-20 webcam-mount-bolt, and flips the print
    orientation so the flat camera deck lies on the build plate (z = 0) and the bolt-head
    pocket opens upward (+z), eliminating the bridged roof over the hole.
params:
  counterbore_l:
    value: 36
    unit: mm
    kind: design
    source: design
    note: Length of the counterbore pocket along Y for thumb access to turn the bolt
      head
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Measured head height of salvaged webcam-mount-bolt (~5 mm)
  coupon_l:
    value: 24
    unit: mm
    kind: design
    source: design
    note: Length of the quick test coupon along Y
  arca_base_w:
    value: 38
    unit: mm
    kind: world
    source: datasheet
    note: Standard Arca-Swiss dovetail base width for knob-tightened drop-in jaw clamp
  corner_fillet_r:
    value: 2
    unit: mm
    kind: design
    source: design
    note: Corner fillet radius on vertical plate corners for smooth drop-in into clamp
      jaws
  head_radial_clearance:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Radial clearance per side around the 15 mm bolt head (giving an 18 mm wide
      pocket)
  bolt_head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Measured head diameter of salvaged webcam-mount-bolt (~15 mm)
  head_recess_clearance:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Extra pocket depth beyond the 5 mm bolt head height so the head stays recessed
      below the clamp rails
  arca_angle_deg:
    value: 45
    unit: deg
    kind: world
    source: datasheet
    note: Standard Arca-Swiss dovetail jaw angle (also a self-supporting 45-degree
      print angle)
  plate_l:
    value: 50
    unit: mm
    kind: design
    source: design
    note: Overall length of the quick-release plate along the clamp jaws
  camera_thread_od:
    value: 6.35
    unit: mm
    kind: world
    source: asked
    note: 1/4-20 UNC camera tripod socket major thread diameter
  camera_thread_engagement:
    value: 5
    unit: mm
    kind: world
    source: datasheet
    note: Standard ISO 1222 1/4-20 camera tripod socket thread engagement depth
  bevel_h:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Vertical height of the 45-degree dovetail bevel engaged by the angled clamp
      lips
  bevel_foot_h:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Vertical side land at the 38 mm clamp-rail edge beyond the 45-degree dovetail
      bevel
  bolt_length:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: Measured under-head length of salvaged webcam-mount-bolt (~10 mm)
  bolt_radial_clearance:
    value: 0.45
    unit: mm
    kind: design
    source: design
    note: Diametral clearance added to 6.35 mm bolt OD for a 6.8 mm through-hole
parts:
- id: qr_plate
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    web_t = p.bolt_length - p.camera_thread_engagement\n\
    \    counterbore_h = p.bolt_head_h + p.head_recess_clearance\n    plate_h = web_t\
    \ + counterbore_h\n    bolt_clearance_d = p.camera_thread_od + p.bolt_radial_clearance\n\
    \    counterbore_w = p.bolt_head_d + 2.0 * p.head_radial_clearance\n    half_w\
    \ = p.arca_base_w / 2.0\n    bevel_run = p.bevel_h / math.tan(math.radians(p.arca_angle_deg))\n\
    \    neck_half_w = half_w - bevel_run\n    neck_h = plate_h - p.bevel_foot_h -\
    \ p.bevel_h\n\n    pts = [\n        (-neck_half_w, 0.0),\n        (neck_half_w,\
    \ 0.0),\n        (neck_half_w, neck_h),\n        (half_w, neck_h + p.bevel_h),\n\
    \        (half_w, plate_h),\n        (-half_w, plate_h),\n        (-half_w, neck_h\
    \ + p.bevel_h),\n        (-neck_half_w, neck_h),\n    ]\n    body = (\n      \
    \  cq.Workplane(\"XZ\")\n        .polyline(pts)\n        .close()\n        .extrude(p.plate_l\
    \ / 2.0, both=True)\n        .edges(\"|Z\")\n        .fillet(p.corner_fillet_r)\n\
    \    )\n\n    pocket = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=web_t)\n\
    \        .rect(counterbore_w, p.counterbore_l)\n        .extrude(counterbore_h)\n\
    \        .edges(\"|Z\")\n        .fillet(counterbore_w / 2.0 - 0.1)\n    )\n \
    \   body = body.cut(pocket)\n\n    bolt_hole = (\n        cq.Workplane(\"XY\"\
    )\n        .circle(bolt_clearance_d / 2.0)\n        .extrude(plate_h)\n    )\n\
    \    body = body.cut(bolt_hole)\n    return body\n"
  print_orientation: Flat camera-mounting deck on the build plate (z = 0), bolt-head
    counterbore pocket opening upward (+z) from z = 5.0 mm to z = 10.5 mm
  use_orientation: 'Flipped 180 degrees from print orientation: 38 mm rails (z = 10.5
    mm in print frame) resting on the tripod clamp floor, 45-degree dovetail bevels
    engaged by the clamp jaws along +/-X, flat deck (z = 0 in print frame) against
    the camera base'
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    web_t = p.bolt_length - p.camera_thread_engagement\n\
    \    counterbore_h = p.bolt_head_h + p.head_recess_clearance\n    plate_h = web_t\
    \ + counterbore_h\n    bolt_clearance_d = p.camera_thread_od + p.bolt_radial_clearance\n\
    \    counterbore_w = p.bolt_head_d + 2.0 * p.head_radial_clearance\n    half_w\
    \ = p.arca_base_w / 2.0\n    bevel_run = p.bevel_h / math.tan(math.radians(p.arca_angle_deg))\n\
    \    neck_half_w = half_w - bevel_run\n    neck_h = plate_h - p.bevel_foot_h -\
    \ p.bevel_h\n\n    pts = [\n        (-neck_half_w, 0.0),\n        (neck_half_w,\
    \ 0.0),\n        (neck_half_w, neck_h),\n        (half_w, neck_h + p.bevel_h),\n\
    \        (half_w, plate_h),\n        (-half_w, plate_h),\n        (-half_w, neck_h\
    \ + p.bevel_h),\n        (-neck_half_w, neck_h),\n    ]\n    body = (\n      \
    \  cq.Workplane(\"XZ\")\n        .polyline(pts)\n        .close()\n        .extrude(p.coupon_l\
    \ / 2.0, both=True)\n    )\n\n    pocket = (\n        cq.Workplane(\"XY\")\n \
    \       .workplane(offset=web_t)\n        .rect(counterbore_w, p.coupon_l + 2.0)\n\
    \        .extrude(counterbore_h)\n    )\n    body = body.cut(pocket)\n\n    bolt_hole\
    \ = (\n        cq.Workplane(\"XY\")\n        .circle(bolt_clearance_d / 2.0)\n\
    \        .extrude(plate_h)\n    )\n    body = body.cut(bolt_hole)\n    return\
    \ body\n"
  print_orientation: Flat camera-mounting deck on the build plate (z = 0), bolt-head
    pocket opening upward (+z)
  use_orientation: 'Flipped 180 degrees from print orientation: drop into tripod clamp
    jaws with the 38 mm rail side down and insert the salvaged webcam-mount-bolt from
    below'
hardware:
- id: camera_bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_mount_joint
  fastener: camera_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 5.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: qr_plate
    feature: upward-printed counterbore floor at z = 5.0 mm
    role: head_seat
  - part: qr_plate
    feature: central 6.8 mm clearance bore through 5.0 mm web (z = 5.0 mm to z = 0.0
      mm)
    role: clearance
  nut: null
  external: camera 1/4-20 tripod socket
criteria:
- id: clamp_dovetail_fit
  part: qr_plate
  feature: 45-degree dovetail bevels and 38 mm base rails
  relation: engages
  hardware: null
  clearance_mm: 0.0
  params:
  - arca_base_w
  - arca_angle_deg
  - bevel_foot_h
  - bevel_h
  check:
    method: coupon
    ref: fit_coupon
    description: Test-fit the coupon (flipped into use orientation with the 38 mm
      rail side down) into the tripod clamp jaws from above and tighten the clamp
      knob to verify the 38 mm 45-degree dovetail seats flat and locks securely.
- id: bolt_head_recess_fit
  part: qr_plate
  feature: thumb-access counterbore pocket (18 mm wide x 5.5 mm deep, printed opening
    upward)
  relation: seats
  hardware: camera_bolt
  clearance_mm: 0.5
  params:
  - bolt_head_d
  - bolt_head_h
  - head_radial_clearance
  - head_recess_clearance
  - counterbore_l
  check:
    method: coupon
    ref: fit_coupon
    description: Insert the salvaged webcam-mount-bolt into the counterbore pocket
      of the coupon and verify the ~15x5 mm bolt head spins freely on the solid pocket
      floor and stays recessed below the clamp rails.
- id: bolt_shaft_and_protrusion
  part: qr_plate
  feature: central 6.8 mm clearance hole through 5.0 mm web (printed directly on the
    bed from z = 0 to z = 5.0 mm)
  relation: clears
  hardware: camera_bolt
  clearance_mm: 0.45
  params:
  - camera_thread_od
  - bolt_radial_clearance
  - bolt_length
  - camera_thread_engagement
  check:
    method: coupon
    ref: fit_coupon
    description: Pass the 1/4-20 shaft of the salvaged webcam-mount-bolt through the
      central clearance hole of the coupon and verify ~5 mm of thread protrudes past
      the camera-mounting deck to thread into the camera socket.
- id: camera_base_support
  part: qr_plate
  feature: flat camera-mounting deck (z = 0 mm in print frame)
  relation: supports
  hardware: null
  clearance_mm: 0.0
  params:
  - arca_base_w
  - bevel_h
  - plate_l
  check:
    method: coupon
    ref: fit_coupon
    description: Check that the flat camera-mounting deck of the plate (printed on
      the build plate at z = 0) sits flush against the base of the camera when the
      bolt is tightened.
manual:
- n: '1'
  text: Print the fit_coupon with its flat camera-mounting face on the build plate
    (z = 0) and the bolt-head pocket facing up (+z), with no supports. Because the
    pocket opens upward during printing, the 6.8 mm bolt hole sits directly on the
    build plate and the pocket floor prints cleanly on solid layers with no bridging
    over a cavity.
  parts:
  - fit_coupon
  hardware:
  - camera_bolt
  tool: null
- n: '2'
  text: Flip the printed fit_coupon into use orientation (pocket facing down), insert
    the salvaged 1/4"-20 webcam-mount-bolt up through the hole to confirm the head
    sits recessed and ~5 mm of thread protrudes, and drop the coupon into the tripod
    clamp jaws to confirm fit.
  parts:
  - fit_coupon
  hardware:
  - camera_bolt
  tool: null
- n: '3'
  text: 'Print the full qr_plate in the same orientation: flat camera-mounting face
    on the bed (z = 0), bolt-head pocket opening upward (+z), and self-supporting
    45-degree dovetail bevels on the sides (no supports needed).'
  parts:
  - qr_plate
  hardware: []
  tool: null
- n: '4'
  text: Flip the qr_plate into use orientation (flat camera-mounting face against
    the camera bottom, pocket facing down), insert the salvaged 1/4"-20 webcam-mount-bolt
    up through the central hole, and use your thumb inside the 36 mm long underside
    pocket to spin and tighten the bolt head into the camera's 1/4"-20 tripod socket.
  parts:
  - qr_plate
  hardware:
  - camera_bolt
  tool: null
- n: '5'
  text: Loosen the tripod clamp knob, drop the qr_plate (attached to the camera) straight
    down between the angled clamp jaws so the bottom rails sit flat on the clamp floor,
    and tighten the clamp knob firmly against the 45-degree dovetail sides. Always
    keep a hand on the camera until you confirm the jaws are locked.
  parts:
  - qr_plate
  hardware:
  - camera_bolt
  tool: null
