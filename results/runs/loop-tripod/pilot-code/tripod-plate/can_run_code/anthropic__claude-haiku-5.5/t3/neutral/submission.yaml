task: tripod-plate
note: ''
questions:
- text: 'Plate length, width and thickness, and the clamp grip width: please measure
    these before printing.'
  answer: null
- text: How deep is the camera's 1/4-20 socket? The webcam bolt has only about 10
    mm of thread.
  answer: null
params:
  plate_l:
    value: 60
    unit: mm
    kind: design
    source: guessed
    note: Placeholder. Not measured. Must match the friend's clamp grip before printing
  plate_w:
    value: 40
    unit: mm
    kind: design
    source: guessed
    note: Placeholder. Not measured. Must match the friend's clamp grip before printing
  plate_t:
    value: 6
    unit: mm
    kind: design
    source: guessed
    note: Placeholder thickness; not measured
  head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: Webcam bolt head across, approx.
  head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: Webcam bolt head height, approx.
  bolt_clear_d:
    value: 6.5
    unit: mm
    kind: design
    source: design
    note: Clearance for 1/4-20 bolt shank
  head_clear:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Extra clearance around the bolt head in its counterbore
parts:
- id: plate
  role: final
  material: PLA (black)
  code: "def build(p):\n    plate = cq.Workplane('XY').box(p.plate_l, p.plate_w, p.plate_t,\
    \ centered=(True, True, False))\n    cb = cq.Workplane('XY').circle((p.head_d\
    \ + p.head_clear) / 2).extrude(p.head_h + 0.5)\n    plate = plate.cut(cb)\n  \
    \  hole = cq.Workplane('XY').circle(p.bolt_clear_d / 2).extrude(p.plate_t + 2).translate((0,\
    \ 0, -1))\n    plate = plate.cut(hole)\n    return plate\n"
  print_orientation: flat, plate bottom on the bed
  use_orientation: flat, camera on top, clamp grips the long edges
hardware:
- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints: []
criteria:
- id: c1
  part: plate
  feature: bolt counterbore
  relation: seats
  hardware: bolt
  clearance_mm: null
  params:
  - head_d
  - head_h
  - head_clear
  check:
    method: measure
    ref: null
    description: Bolt head sits flush in the underside counterbore
- id: c2
  part: plate
  feature: clamp grip
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - plate_l
  - plate_w
  - plate_t
  check:
    method: measure
    ref: null
    description: Plate sits in the clamp jaws and the knob holds it. Plate dimensions
      are guessed; unverified.
- id: c3
  part: plate
  feature: camera thread engagement
  relation: engages
  hardware: bolt
  clearance_mm: null
  params:
  - plate_t
  check:
    method: measure
    ref: null
    description: 'Bolt threads into the camera socket with enough engagement to hold
      the camera. Unverified: a 10 mm shank through a 6 mm plate leaves about 4 mm
      to engage.'
manual:
- n: '0'
  text: DO NOT PRINT YET. Plate size and clamp fit are unmeasured. Get the plate's
    length, width, thickness and clamp grip width first.
  parts:
  - plate
  hardware: []
  tool: null
- n: '1'
  text: Print the plate flat on the bed, black PLA, 100% infill, counterbore facing
    up.
  parts:
  - plate
  hardware: []
  tool: null
- n: '2'
  text: Test-fit the plate in the friend's clamp. Stop if it doesn't seat or grip.
  parts:
  - plate
  hardware: []
  tool: null
- n: '3'
  text: Push the webcam bolt up through the counterbore and hole so the head sits
    in the underside counterbore.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '4'
  text: Screw the bolt into the camera's socket. Check the thread engagement first;
    with a 10 mm shank and 6 mm plate, only about 4 mm enters the camera.
  parts: []
  hardware:
  - bolt
  tool: null
- n: '5'
  text: Drop the plate into the clamp and tighten the knob.
  parts:
  - plate
  hardware: []
  tool: null
