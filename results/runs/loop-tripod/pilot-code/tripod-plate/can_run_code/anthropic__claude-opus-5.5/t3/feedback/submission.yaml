task: tripod-plate
note: 'Only change: the roof over the bolt recess is now stepped so it bridges cleanly.
  The clamp fit and the head recess are the same as before.'
questions: []
params:
  arca_width:
    value: 38
    unit: mm
    kind: world
    source: datasheet
    note: Arca-Swiss standard; the plate fits the clamp
  bevel_h:
    value: 5
    unit: mm
    kind: world
    source: guessed
    note: worked in the print
  plate_t:
    value: 10
    unit: mm
    kind: design
    source: design
    note: ''
  plate_len:
    value: 60
    unit: mm
    kind: design
    source: design
    note: ''
  slot_len:
    value: 20
    unit: mm
    kind: design
    source: design
    note: ''
  head_d:
    value: 15
    unit: mm
    kind: hardware
    source: measured
    note: ''
  head_h:
    value: 5
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bolt_len:
    value: 10
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bolt_d:
    value: 6.35
    unit: mm
    kind: hardware
    source: datasheet
    note: ''
  layer_h:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: printer layer height; one-layer bridging step
parts:
- id: plate
  role: final
  material: PLA
  code: "def build(p):\n    W=p.arca_width; b=p.bevel_h; t=p.plate_t; L=p.plate_len\n\
    \    top_w=W-2*b\n    prof=(cq.Workplane('YZ').polyline([(-W/2,0),(W/2,0),(top_w/2,b),(top_w/2,t),(-top_w/2,t),(-top_w/2,b)]).close().extrude(L).translate((-L/2,0,0)))\n\
    \    sl=p.slot_len; h0=p.head_h+0.5; sw=p.bolt_d+0.6\n    head=cq.Workplane('XY').slot2D(sl+p.head_d+1.0,p.head_d+1.0).extrude(h0)\n\
    \    step=cq.Workplane('XY').box(sl+p.head_d+1.0,sw,p.layer_h,centered=(True,True,False)).translate((0,0,h0))\n\
    \    thru=cq.Workplane('XY').slot2D(sl+sw,sw).extrude(t+1)\n    return prof.cut(head).cut(step).cut(thru)\n"
  print_orientation: 'wide 38 mm bottom face on the bed; counterbore opens to the
    bed. Its roof is stepped: the first bridged layer is two strips running the full
    length of the recess on each side of the slot, and the next layer bridges the
    short ends across them'
  use_orientation: bottom face down in the tripod clamp, camera on top
hardware:
- id: bolt
  ref: salvaged:webcam-mount-bolt
  qty: 1
joints:
- id: camera_screw
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: plate
    feature: counterbored slot
    role: head_seat
  - part: plate
    feature: through slot
    role: clearance
  nut: null
  external: camera's 1/4-20 tripod socket
criteria:
- id: slot_roof
  part: plate
  feature: stepped roof over the bolt recess
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - layer_h
  - bolt_d
  check:
    method: none
    ref: null
    description: Slot comes out clean with no loose loops, and the bolt slides along
      the slot its full length
- id: bolt_reach
  part: plate
  feature: slot floor
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - head_h
  - bolt_len
  - plate_t
  check:
    method: measure
    ref: null
    description: Bolt tip sticks out about 5 mm above the top of the plate
manual:
- n: '1'
  text: Print the plate flat, wide face down, with 5+ walls or 100% infill. If a stray
    strand is left in the slot, pick it out with a knife.
  parts:
  - plate
  hardware: []
  tool: null
- n: '2'
  text: Push the webcam bolt up from below through the slot so its head sits in the
    recess. Screw it into the camera's tripod socket and tighten it.
  parts:
  - plate
  hardware:
  - bolt
  tool: null
- n: '3'
  text: Open the clamp knob, drop the plate in wide face down, and tighten. Hold onto
    the camera the first time you tilt it.
  parts:
  - plate
  hardware: []
  tool: null
