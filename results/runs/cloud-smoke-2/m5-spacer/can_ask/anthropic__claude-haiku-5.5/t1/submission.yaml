task: m5-spacer
note: 'Simple tube spacer: 12 mm OD, 20 mm long, 5.5 mm clearance bore for M5. Printed
  upright so the bore is vertical and no supports are needed.'
questions: []
params:
  spacer_len:
    value: 20
    unit: mm
    kind: design
    source: asked
    note: Spacer length, from the request
  spacer_od:
    value: 12
    unit: mm
    kind: design
    source: asked
    note: Outside diameter, from the request
  bore_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Clearance bore for an M5 shank (ISO 273 medium fit, 5.5 mm)
parts:
- id: spacer
  role: final
  material: PLA
  code: "def build(p):\n    return (cq.Workplane('XY')\n            .circle(p.spacer_od\
    \ / 2)\n            .circle(p.bore_d / 2)\n            .extrude(p.spacer_len))"
  print_orientation: Axis vertical (z = 0 on the bed, bore vertical, no overhangs)
  use_orientation: Between two plates on an M5 bolt, axis along the bolt
hardware: []
joints: []
criteria:
- id: bore-clears-m5
  part: spacer
  feature: bore_d through-hole
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - bore_d
  check:
    method: measure
    ref: null
    description: Print a test and confirm an M5 bolt slides through the bore freely
manual:
- n: '1'
  text: Print the spacer upright (bore vertical) with 0.2 mm layers. Remove supports
    if any and clear the bore of stringing.
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Slide the M5 bolt through the spacer and place the spacer between the two
    plates so the bolt passes through both plates and the spacer.
  parts: []
  hardware: []
  tool: null
