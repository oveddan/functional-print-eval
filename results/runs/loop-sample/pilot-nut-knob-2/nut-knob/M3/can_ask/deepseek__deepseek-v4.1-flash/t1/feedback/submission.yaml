task: nut-knob/M3
note: 'Revised after your coupon print. Your data — 5.50 pocket: nut will not enter;
  5.60 pocket: really struggles — says the printed across-flats comes out roughly
  0.2 mm under nominal, so the fit point sits above the coupon''s range. The knob''s
  `nut_pocket_af` is now 5.65 (interference ≈0.05 mm where it actually prints, versus
  ≈0.10 mm at 5.60 which you found too tight). Everything else about the part is unchanged.


  The knob, unchanged in shape: 20 mm across (12 vertical grip grooves, vertical walls),
  one printed piece. Open face has a Ø6.6 x 3.2 counterbore (wide enough for the nut''s
  6.35 across-corners to be pressed through, and the home for the M3x16 socket head
  so it sits 0.2 mm inside). Behind it a 2.8 mm deep hex pocket, 0.15 mm under the
  nut''s 5.5 across-flats - a hand press fit, no glue, and it holds the nut when the
  knob is upside down because the flats are gripped. The nut ends up fully inside,
  recessed behind the open face. Behind the nut is a 2.5 mm wall pierced only by the
  Ø3.4 bolt hole: far smaller than the nut, so the nut can never be pushed out of
  the far face, and the bolt threads through the nut and out of that far face, tip
  proud by ~7.7 mm. The bolt is captive too (5.5 head vs 5.4 across-flats pocket).


  Fixed print recipe: far face on the bed, counterbore up; every hole either widens
  toward the top of the print or has vertical walls, so no supports, no bridges, and
  the full Ø20 disc is on the bed.


  If the nut feels loose in the finished knob, the one-number fix is nut_pocket_af
  = 5.60 - the pocket you have already proven presses in by hand and holds. The re-centred
  coupon (5.60 / 5.65 / 5.70 / 5.75) is there if you want to verify before committing;
  it is optional.'
questions: []
params:
  bolt_hole_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: = screw_shank_d + 0.4 clearance; far smaller than nut_af, which is what
      stops the nut leaving the far face
  ceiling_t:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: wall between the nut pocket and the far face, pierced by bolt_hole_d
  coupon_af_1:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: 'round-2 coupon, nub end: your proven tight-but-fits pocket (~0.10 mm interference
      as printed) - fallback if 5.65 comes out loose'
  coupon_af_2:
    value: 5.65
    unit: mm
    kind: design
    source: design
    note: 'round-2 coupon: the chosen nut_pocket_af (~0.05 mm interference as printed)'
  coupon_af_3:
    value: 5.7
    unit: mm
    kind: design
    source: design
    note: 'round-2 coupon: 0.05 looser than chosen (~0.00 as printed)'
  coupon_af_4:
    value: 5.75
    unit: mm
    kind: design
    source: design
    note: 'round-2 coupon, loosest: 0.10 above chosen (~0.05 mm clearance as printed)'
  coupon_floor_t:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: thin floor under the test pockets; the nut's 6.35 across-corners cannot
      pass
  coupon_len:
    value: 56.0
    unit: mm
    kind: design
    source: design
    note: coupon blank length
  coupon_pitch:
    value: 13.0
    unit: mm
    kind: design
    source: design
    note: spacing of the four test pockets along the coupon
  coupon_push_hole_d:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: '> a 4 mm pusher so a stuck nut can be pushed back out; < nut_af so the
      nut still stops on the floor'
  coupon_w:
    value: 16.0
    unit: mm
    kind: design
    source: design
    note: coupon blank width
  grip_count:
    value: 12
    unit: count
    kind: design
    source: design
    note: vertical finger grooves around the rim; vertical walls, no supports
  grip_groove_r:
    value: 1.8
    unit: mm
    kind: design
    source: design
    note: radius of the cutter cylinder centred on the rim; valleys end up ~16.4 mm
      across
  head_pocket_d:
    value: 6.6
    unit: mm
    kind: design
    source: design
    note: must exceed nut_ac (6.35) and the pocket's own across-corners (6.52) so
      the nut can be pressed in through it; leaves 0.55 mm around the 5.5 head
  head_pocket_depth:
    value: 3.2
    unit: mm
    kind: design
    source: design
    note: = screw_head_h + 0.2, so the head sits fully inside, 0.2 mm behind the open
      face
  knob_od:
    value: 20.0
    unit: mm
    kind: design
    source: asked
    note: 'user: hand knob about 20 mm across - this is the diameter across the grip
      lobes'
  nut_ac:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: across-corners, = nut_af / cos30 = 5.5/0.86603
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across-flats; person could not measure it
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height
  nut_pocket_af:
    value: 5.65
    unit: mm
    kind: design
    source: design
    note: 'REVISED from 5.42 to 5.65: round-1 coupon showed 5.50 will not take the
      nut and 5.60 is very tight, i.e. printed pockets run ~0.2 mm under nominal,
      so 5.65 gives ~0.05 mm interference as printed (a firm thumb press that holds).
      Fallback 5.60.'
  nut_pocket_depth:
    value: 2.8
    unit: mm
    kind: design
    source: design
    note: = nut_h + 0.4, so the nut is fully inside the knob and recessed from the
      open face; also the coupon's pocket depth
  print_af_offset:
    value: 0.2
    unit: mm
    kind: design
    source: guessed
    note: 'calibration from your coupon: a nominal 5.50 pocket would not accept the
      5.5 nut and 5.60 only just did, so printed across-flats ≈ nominal - 0.2. Used
      to place nut_pocket_af and the round-2 coupon; not used in the part code.'
  screw_head_d:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3 socket head diameter
  screw_head_h:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3 socket head height
  screw_len:
    value: 16.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3x16, fully threaded (threaded-to-head max 20). Head underside
      sits 8.3 mm from the far face, so the tip leaves the far face by ~7.7 mm
  screw_shank_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3 shank
parts:
- id: knob
  role: final
  material: PLA (high-speed, black)
  code: "import math\n\n\ndef build(p):\n    # Print frame: z = 0 is the bed = the\
    \ knob's FAR face (the face the bolt tip exits).\n    # Going up, every opening\
    \ widens (Ø3.4 -> hex pocket -> Ø6.6), so nothing overhangs.\n    H = p.ceiling_t\
    \ + p.nut_pocket_depth + p.head_pocket_depth\n    R = p.knob_od / 2.0\n\n    #\
    \ knob body\n    body = cq.Workplane(\"XY\").circle(R).extrude(H)\n\n    # 12\
    \ vertical finger grooves (vertical walls: printable, no supports)\n    n = int(round(p.grip_count))\n\
    \    for i in range(n):\n        a = 2.0 * math.pi * i / n\n        body = body.cut(\n\
    \            cq.Workplane(\"XY\")\n            .center(R * math.cos(a), R * math.sin(a))\n\
    \            .circle(p.grip_groove_r)\n            .extrude(H)\n        )\n\n\
    \    # bolt shank hole through the far wall (smaller than the nut: nut can never\
    \ pass)\n    body = body.cut(cq.Workplane(\"XY\").circle(p.bolt_hole_d / 2.0).extrude(H))\n\
    \n    # hex pocket for the ISO 4032 M3 nut, across-flats = nut_pocket_af (press\
    \ fit)\n    rv = (p.nut_pocket_af / math.cos(math.radians(30.0))) / 2.0  # across-corners\
    \ / 2\n    pts = [(rv * math.cos(math.radians(60.0 * i)),\n            rv * math.sin(math.radians(60.0\
    \ * i))) for i in range(6)]\n    body = body.cut(\n        cq.Workplane(\"XY\"\
    )\n        .workplane(offset=p.ceiling_t)\n        .polyline(pts).close()\n  \
    \      .extrude(p.nut_pocket_depth)\n    )\n\n    # counterbore for the bolt head,\
    \ open at the top: big enough for the nut to be pressed through\n    body = body.cut(\n\
    \        cq.Workplane(\"XY\")\n        .workplane(offset=p.ceiling_t + p.nut_pocket_depth)\n\
    \        .circle(p.head_pocket_d / 2.0)\n        .extrude(p.head_pocket_depth)\n\
    \    )\n    return body\n"
  print_orientation: 'Far face on the bed: z = 0 is the flat Ø20 face pierced by the
    small Ø3.4 hole (the face the bolt tip exits); the nut pocket and the Ø6.6 counterbore
    open upward at z = 8.5. No supports.'
  use_orientation: Held in the hand with the far face (where the threaded tip sticks
    out) pointing at the workpiece and the wide Ø6.6 counterbore facing the hand;
    the nut is pressed in from the counterbore side and the bolt is dropped in from
    that same side.
- id: coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "import math\n\n\ndef build(p):\n    # Print frame: z = 0 is the bed = the\
    \ coupon's thin floor (with the push-out holes).\n    T = p.coupon_floor_t + p.nut_pocket_depth\n\
    \    L = p.coupon_len\n    W = p.coupon_w\n    body = cq.Workplane(\"XY\").box(L,\
    \ W, T, centered=(False, True, False))\n\n    afs = [p.coupon_af_1, p.coupon_af_2,\
    \ p.coupon_af_3, p.coupon_af_4]\n    x0 = (L - p.coupon_pitch * (len(afs) - 1))\
    \ / 2.0\n    for i, af in enumerate(afs):\n        x = x0 + i * p.coupon_pitch\n\
    \        # push-out hole in the floor\n        body = body.cut(\n            cq.Workplane(\"\
    XY\").center(x, 0.0)\n            .circle(p.coupon_push_hole_d / 2.0)\n      \
    \      .extrude(p.coupon_floor_t + 0.2)\n        )\n        # hex test pocket:\
    \ same depth as the knob's nut pocket, different across-flats\n        rv = (af\
    \ / math.cos(math.radians(30.0))) / 2.0\n        pts = [(x + rv * math.cos(math.radians(60.0\
    \ * k)),\n                rv * math.sin(math.radians(60.0 * k))) for k in range(6)]\n\
    \        body = body.cut(\n            cq.Workplane(\"XY\")\n            .workplane(offset=p.coupon_floor_t)\n\
    \            .polyline(pts).close()\n            .extrude(p.nut_pocket_depth +\
    \ 0.2)\n        )\n\n    # small nub marking the end nearest the tightest (5.60)\
    \ pocket\n    body = body.union(\n        cq.Workplane(\"XY\").workplane(offset=T)\n\
    \        .center(x0 - 4.5, 6.0)\n        .circle(1.0)\n        .extrude(1.5)\n\
    \    )\n    return body\n"
  print_orientation: Thin floor with the four Ø4.5 push-out holes on the bed (z =
    0); the four hex test pockets open upward. No supports (each pocket widens toward
    the top of the print).
  use_orientation: Flat on the bench, pockets up. Press the M3 nut into each pocket
    from above, flats aligned; test retention; push a stuck nut back out from below
    through the Ø4.5 hole with a 4 mm pusher.
