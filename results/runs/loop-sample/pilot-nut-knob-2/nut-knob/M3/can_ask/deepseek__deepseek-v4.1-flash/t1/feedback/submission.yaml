criteria:
- id: c1_nut_press_fit
  part: knob
  feature: hex nut pocket (six flats, across-flats = nut_pocket_af, 2.8 mm deep, open
    at the counterbore floor)
  relation: engages
  hardware: nut_m3
  clearance_mm: -0.05
  params:
  - nut_pocket_af
  - nut_af
  - nut_pocket_depth
  - nut_h
  - print_af_offset
  - coupon_af_1
  - coupon_af_2
  check:
    method: coupon
    ref: coupon
    description: 'Coupon round 1 result: a 5.50 pocket would not take the nut and
      a 5.60 pocket was very tight, so the printed across-flats runs about 0.2 mm
      under nominal. The knob''s pocket is therefore set to 5.65 nominal (≈0.05 mm
      interference as printed): it should press in with firm thumb pressure and hold.
      Optional round 2: press the nut into the re-centred coupon (5.60 = known tight-but-fits,
      5.65 = chosen, 5.70, 5.75) and keep the tightest that goes in by hand and still
      holds the nut upside down.'
- id: c2_nut_fully_inside
  part: knob
  feature: nut pocket (2.8 mm deep, floor 3.2 mm behind the open face) and the Ø6.6
    counterbore the nut passes through
  relation: contains
  hardware: nut_m3
  clearance_mm: null
  params:
  - nut_pocket_depth
  - nut_h
  - head_pocket_d
  - nut_ac
  - nut_pocket_af
  check:
    method: measure
    ref: null
    description: Pocket depth 2.8 > nut height 2.4, and head_pocket_d 6.6 is wider
      than both the nut across-corners (6.35) and the pocket across-corners (6.52),
      so the nut can be pressed in through the counterbore; it then sits fully inside
      the knob, recessed behind the open face.
- id: c3_nut_cannot_leave_far_side
  part: knob
  feature: 'far end of the nut pocket: 2.5 mm ceiling wall pierced by the Ø3.4 bolt
    hole'
  relation: faces
  hardware: nut_m3
  clearance_mm: null
  params:
  - ceiling_t
  - bolt_hole_d
  - nut_af
  - nut_ac
  check:
    method: measure
    ref: null
    description: The only opening beyond the nut is Ø3.4, far smaller than the nut's
      5.5 across-flats / 6.35 across-corners, so the nut has no path out of the far
      face however hard it is pushed. The nut is also blocked by the bolt head once
      the bolt is in.
- id: c4_bolt_through_and_out
  part: knob
  feature: Ø3.4 bolt hole through the ceiling plus the Ø6.6 x 3.2 counterbore
  relation: clears
  hardware: screw_m3
  clearance_mm: null
  params:
  - bolt_hole_d
  - screw_shank_d
  - head_pocket_d
  - head_pocket_depth
  - screw_head_d
  - screw_head_h
  - screw_len
  check:
    method: measure
    ref: null
    description: 'Drop the M3x16 into the counterbore and turn it into the nut: the
      Ø3.4 hole clears the 3.0 shank, the tip comes out of the far face by about 7.7
      mm, and the 5.5 x 3.0 head sits in the Ø6.6 x 3.2 recess 0.2 mm behind the open
      face.'
- id: c5_grip_od
  part: knob
  feature: 'finger grip: 12 vertical grooves; outer lobes'
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - knob_od
  - grip_count
  - grip_groove_r
  check:
    method: measure
    ref: null
    description: Outer diameter across the lobes ≈ 20 mm as asked (across the valleys
      ≈ 16.4 mm), so it is a two-finger hand knob.
- id: c6_coupon_pockets
  part: coupon
  feature: four hex test pockets, across-flats coupon_af_1..4, each 2.8 mm deep over
    a Ø4.5 push-out hole
  relation: contains
  hardware: nut_m3
  clearance_mm: -0.05
  params:
  - coupon_af_1
  - coupon_af_2
  - coupon_af_3
  - coupon_af_4
  - nut_pocket_depth
  - coupon_push_hole_d
  check:
    method: measure
    ref: null
    description: 'The round-2 coupon brackets the chosen value at the knob''s real
      2.8 mm engagement depth: 5.60 (your known tight-but-fits pocket), 5.65 (chosen),
      5.70 and 5.75, i.e. from ~0.10 mm interference to ~0.05 mm clearance as printed.
      The Ø4.5 floor hole lets a 4 mm pusher free a stuck nut.'
manual:
- n: '1'
  text: 'Print `knob` in PLA at 0.2 mm layers exactly as modelled, no supports: the
    flat far face with the small Ø3.4 hole on the bed, the wide Ø6.6 counterbore facing
    up at the top. Its nut pocket is set to 5.65 mm across-flats (0.15 mm under the
    nut) - that is the value your first coupon pointed to: a 5.50 pocket would not
    take the nut, a 5.60 pocket was very tight, so a 5.65 pocket should be a firm
    thumb press.'
  parts:
  - knob
  hardware: []
  tool: Bambu Lab X1C
- n: '2'
  text: 'Press the M3 hex nut into the hex pocket: bring it in through the wide Ø6.6
    counterbore (it passes straight through), line its flats up with the pocket''s
    flats, and push it home with your thumb. Expect real resistance about half a millimetre
    in, then it should seat 2.8 mm deep and vanish inside the knob.'
  parts:
  - knob
  hardware:
  - nut_m3
  tool: null
- n: '3'
  text: 'Turn the knob upside down and tap it on the bench: the nut must stay in,
    with no glue. If it drops out the pocket is too loose - print the knob again with
    nut_pocket_af = 5.60, the pocket you already know presses in and holds. If you
    cannot get the nut in at all, go the other way to 5.70. Change only that one number.'
  parts:
  - knob
  hardware:
  - nut_m3
  tool: null
- n: '4'
  text: 'Optional, before you commit: print `coupon` (no supports; thin floor with
    the four Ø4.5 holes on the bed, pockets up). Its four pockets are now re-centred
    around your result - 5.60, 5.65, 5.70, 5.75 across-flats, nub nearest the 5.60
    end - all at the knob''s real 2.8 mm depth. Whichever is the tightest that presses
    in by hand and still holds the nut when you turn the coupon upside down is your
    nut_pocket_af.'
  parts:
  - coupon
  hardware:
  - nut_m3
  tool: Bambu Lab X1C
- n: '5'
  text: 'Drop the ISO 4762 M3x16 bolt into the Ø6.6 counterbore tip-first and turn
    it into the nut by hand. Keep turning: the thread runs through the nut and the
    tip comes out of the far face by about 7.7 mm. The head comes to rest in the counterbore
    0.2 mm inside the open face, and it cannot fall back out - the 5.5 head is wider
    than the pocket''s 5.4 across-flats.'
  parts:
  - knob
  hardware:
  - screw_m3
  tool: 2.5 mm hex key (only if you want to start the bolt)
- n: '6'
  text: 'To use it: grip the 20 mm grooved rim, poke the bolt''s protruding tip into
    the hole you are clamping, and turn the knob. The trapped nut turns with the knob,
    so the knob winds itself along the bolt and clamps. Turn the other way to release.'
  parts:
  - knob
  hardware: []
  tool: null
