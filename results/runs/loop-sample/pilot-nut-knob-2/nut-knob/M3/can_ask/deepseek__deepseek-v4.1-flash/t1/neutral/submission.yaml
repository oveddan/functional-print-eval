criteria:
- id: c1_nut_press_fit
  part: knob
  feature: hex nut pocket, straight press-fit section (across-flats = nut_pocket_af,
    full 2.4 mm of the nut's height engaged)
  relation: engages
  hardware: nut_m3
  clearance_mm: -0.08
  params:
  - nut_pocket_af
  - nut_af
  - nut_h
  check:
    method: coupon
    ref: coupon
    description: Print the coupon and press the M3 nut into each of the four test
      pockets in turn. Keep the tightest across-flats that goes in by hand AND still
      holds the nut when the coupon is turned upside down and tapped; set nut_pocket_af
      to that value before printing the knob.
- id: c2_nut_fully_inside
  part: knob
  feature: 'nut pocket (3.4 deep: 2.4 straight + 1.0 lead-in) with the nut seated
    on its floor'
  relation: contains
  hardware: nut_m3
  clearance_mm: null
  params:
  - nut_pocket_depth
  - nut_h
  - lead_in_t
  check:
    method: measure
    ref: null
    description: 'Pocket depth 3.4 > nut height 2.4, so the nut seats on the pocket
      floor with its outer face 1.0 mm behind the open face: fully inside, nothing
      standing proud.'
- id: c3_nut_cannot_leave_far_side
  part: knob
  feature: 3.5 mm far wall pierced by the Ø3.4 bolt hole (the only opening beyond
    the nut)
  relation: faces
  hardware: nut_m3
  clearance_mm: null
  params:
  - ceiling_t
  - bolt_hole_d
  - nut_af
  - nut_ac
  check:
    method: measure
    ref: null
    description: The only hole past the nut is Ø3.4, far smaller than the nut's 5.5
      across-flats / 6.35 across-corners, so the nut has no path out of the far side
      however hard it is pushed.
- id: c4_bolt_through_and_out
  part: knob
  feature: Ø3.4 bolt hole through the far wall + pocket-mouth lead-in (6-flat, nut_pocket_af
    + 0.4, 1.0 deep)
  relation: clears
  hardware: screw_m3
  clearance_mm: null
  params:
  - bolt_hole_d
  - screw_shank_d
  - lead_in_af
  - lead_in_t
  - nut_pocket_depth
  - screw_head_d
  - screw_head_h
  - screw_len
  - ceiling_t
  check:
    method: measure
    ref: null
    description: 'Drop the M3x12 head-first into the pocket mouth: the 5.5 head sinks
      1.0 mm into the lead-in and seats on the step / nut face; the 3.0 shank threads
      the nut and the tip leaves the far face by ~6 mm. Anything from M3x8 to M3x20
      also reaches out the far side.'
- id: c5_grip_od
  part: knob
  feature: 'finger grip: 12 vertical grooves, 20 mm across the lobes'
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - knob_od
  - grip_count
  - grip_groove_r
  check:
    method: measure
    ref: null
    description: Outer diameter across the lobes ≈ 20 mm as asked (≈16.4 mm across
      the valleys) — a two-finger hand knob.
- id: c6_coupon_pockets
  part: coupon
  feature: four hex test pockets, across-flats coupon_af_1..4, straight section 2.4
    mm + 1.0 mm lead-in, over a Ø4.5 push-out hole
  relation: contains
  hardware: nut_m3
  clearance_mm: null
  params:
  - coupon_af_1
  - coupon_af_2
  - coupon_af_3
  - coupon_af_4
  - nut_pocket_depth
  - coupon_push_hole_d
  check:
    method: measure
    ref: null
    description: Pockets span 0.20 mm interference (5.30), 0.10 mm interference (5.40),
      nominal (5.50) and 0.10 mm clearance (5.60) around the nut's 5.5 across-flats,
      all with the knob's real pocket depth and lead-in; the Ø4.5 floor hole lets
      a 4 mm pusher free a stuck nut.
- id: c7_prints_without_supports
  part: knob
  feature: 'print orientation: far face on the bed; every hole widens upward, all
    walls vertical'
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - ceiling_t
  - nut_pocket_depth
  - lead_in_t
  - grip_count
  check:
    method: none
    ref: null
    description: 'Ø3.4 → hex pocket → lead-in hexagon all widen toward the top of
      the print, and the grip grooves are vertical walls: no supports, no bridges,
      no overhangs.'
manual:
- n: '1'
  text: 'Print `coupon` in PLA at 0.2 mm layers exactly as modelled, no supports:
    the thin floor with the four Ø4.5 holes sits on the bed and the four hex pockets
    open upward.'
  parts:
  - coupon
  hardware: []
  tool: Bambu Lab X1C
- n: '2'
  text: 'Press the M3 hex nut into the test pocket nearest the small nub on the top
    face (that end is the tightest, 5.30 across-flats). Align the nut''s flats with
    the pocket''s flats and push it in until it stops against the floor. Then try
    the next pockets along the row: 5.40, 5.50, 5.60. If one will not start by hand,
    do not force it.'
  parts:
  - coupon
  hardware:
  - nut_m3
  tool: null
- n: '3'
  text: 'Test each pocket you filled: turn the coupon upside down and tap it on the
    bench. The nut must stay in. Note the across-flats of the tightest pocket that
    both pressed in by hand AND holds the nut upside down. A nut stuck in too tight
    a pocket pushes back out from below through the Ø4.5 hole with a 4 mm pusher.'
  parts:
  - coupon
  hardware:
  - nut_m3
  tool: 4 mm pusher (blunt drill shank, hex key shank)
- n: '4'
  text: 'Set the knob''s `nut_pocket_af` to the across-flats you noted (default 5.42,
    i.e. 0.08 mm interference) and print `knob` in PLA at 0.2 mm layers exactly as
    modelled, no supports: the flat far face with the small Ø3.4 hole on the bed,
    the hex pocket opening upward.'
  parts:
  - knob
  hardware: []
  tool: Bambu Lab X1C
- n: '5'
  text: Press the M3 hex nut into the hex pocket at the open face. The wide 1 mm deep
    lead-in chamfer starts it; line the nut's flats up with the pocket's flats and
    push with your thumb until it stops hard on the pocket floor. Its outer face should
    now sit 1.0 mm below the knob's face.
  parts:
  - knob
  hardware:
  - nut_m3
  tool: null
- n: '6'
  text: 'Turn the knob upside down and tap it on the bench: the nut must stay in with
    no glue. If it falls out, the pocket is too loose — print the knob again with
    a smaller `nut_pocket_af`, or re-check the coupon. If it would not press in, go
    the other way.'
  parts:
  - knob
  hardware:
  - nut_m3
  tool: null
- n: '7'
  text: 'Drop the ISO 4762 M3x12 in head-first, tip down, into the pocket at the open
    face: the 5.5 head sinks into the 1 mm lead-in and stops on the step while the
    thread picks up the nut. Turn it by hand until the tip comes out of the far face
    (about 6 mm of thread showing beyond the far wall).'
  parts:
  - knob
  hardware:
  - screw_m3
  tool: 2.5 mm hex key (optional, only to start the thread)
- n: '8'
  text: 'To use it: grip the 20 mm knurled rim and turn. The trapped nut turns with
    the knob, so it winds along the bolt — no tool needed, and the nut stays put even
    with the knob upside down.'
  parts:
  - knob
  hardware: []
  tool: null
