task: nut-knob/M3
note: 'A 20 mm knurled hand knob that traps one ISO 4032 M3 hex nut and passes the
  bolt out the far side.


  How it holds the nut: the nut is pressed in from the open face, through a 1.0 mm
  deep six-flat lead-in (0.4 mm wider across flats, so it starts by hand), into a
  straight six-flat section that is 2.4 mm deep — exactly the nut''s height — and
  0.08 mm under its 5.5 mm across-flats. The nut stops on the pocket floor with its
  outer face 1.0 mm inside the knob: fully inside, held by friction on all six flats,
  no glue. Turned upside down it stays. The only opening beyond the nut is a Ø3.4
  hole through the 3.5 mm far wall, far smaller than the nut''s 5.5 across-flats,
  so the nut can never be pushed out of the far side.


  How the bolt goes through: drop an ISO 4762 M3x12 in head-first at the open face.
  Its 5.5 head sinks into the lead-in and seats on the step / the nut''s face (the
  two are flush by design), the 3.0 shank threads the nut and continues through the
  Ø3.4 far hole, leaving ~6 mm of thread out the far side. Any M3 from x8 to x20 also
  reaches out the far face; x12 is the middle of that range. (If you use it the other
  way — screwing the knob onto a bolt already protruding from your work — the bolt
  enters the far Ø3.4 hole, threads the nut and comes out the open face. Same part,
  no change.)


  Printing: everything is modelled in its print orientation, z = 0 on the bed. The
  flat far face (with the small Ø3.4 hole) goes on the bed; every void then widens
  upward (Ø3.4 → hex pocket → lead-in hexagon) and the 12 grip grooves are plain vertical
  walls, so there are no overhangs, bridges or supports anywhere. 6.9 mm tall, 20
  mm across, ~8 g.


  The one thing I could not pin down: the actual press fit, because the nut could
  not be measured and FDM hole tolerance dominates. So the coupon is part of the design
  — it has the same 2.4 mm straight pocket + 1.0 mm lead-in at 5.30 / 5.40 / 5.50
  / 5.60 across-flats. Print it, find the tightest pocket that hand-presses and holds
  upside down, set nut_pocket_af to that, then print the knob. Each coupon pocket
  has a Ø4.5 hole under it so a nut stuck in too tight a pocket can be pushed back
  out with a 4 mm pusher.'
questions: []
params:
  bolt_hole_d:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: = screw_shank_d + 0.4 clearance; the only opening past the nut, so it is
      what retains it
  ceiling_t:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: far wall between the nut pocket floor and the far face; also guides the
      bolt. Sets the knob height with nut_pocket_depth (3.5 + 3.4 = 6.9 mm)
  coupon_af_1:
    value: 5.3
    unit: mm
    kind: design
    source: design
    note: 'tightest test pocket: 0.20 mm interference on the nut''s 5.5 across-flats'
  coupon_af_2:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: 'test pocket: 0.10 mm interference'
  coupon_af_3:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: 'test pocket: nominal, zero interference'
  coupon_af_4:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: 'loosest test pocket: 0.10 mm clearance, covers undersized printing'
  coupon_floor_t:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: thin floor under the test pockets; the nut's 6.35 across-corners cannot
      pass it, so the nut seats at the same depth as in the knob
  coupon_len:
    value: 56.0
    unit: mm
    kind: design
    source: design
    note: coupon blank length
  coupon_pitch:
    value: 13.0
    unit: mm
    kind: design
    source: design
    note: spacing of the four test pockets
  coupon_push_hole_d:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: '> a 4 mm pusher so a stuck nut can be pushed back out; < nut_af so the
      nut still stops on the floor'
  coupon_w:
    value: 16.0
    unit: mm
    kind: design
    source: design
    note: coupon blank width
  grip_count:
    value: 12
    unit: count
    kind: design
    source: design
    note: vertical finger grooves around the rim; vertical walls, no supports
  grip_groove_r:
    value: 1.8
    unit: mm
    kind: design
    source: design
    note: radius of the cutter cylinder centred on the rim; valleys end up ~16.4 mm
      across
  knob_od:
    value: 20.0
    unit: mm
    kind: design
    source: asked
    note: 'user: hand knob about 20 mm across — diameter across the grip lobes'
  lead_in_af:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: extra across-flats at the pocket mouth so the nut starts by hand; the bolt
      head (5.5) sinks into it and is located within ~0.16 mm
  lead_in_t:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: depth of the lead-in at the mouth; stops right at the nut's outer face,
      so the seated nut bears the bolt head
  nut_ac:
    value: 6.35
    unit: mm
    kind: hardware
    source: catalog
    note: across-corners = nut_af / cos30 = 5.5 / 0.86603
  nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across-flats; the person could not measure it, so catalog value
  nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height; the straight pocket section is made equal to this
  nut_pocket_af:
    value: 5.42
    unit: mm
    kind: design
    source: design
    note: press fit = nut_af - 0.08. SET THIS FROM THE COUPON TEST before printing
      the knob (coupon covers 5.30-5.60)
  nut_pocket_depth:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: '= nut_h + lead_in_t: 2.4 mm straight press-fit section (the nut''s full
      height) plus the 1.0 mm lead-in, so the seated nut is 1.0 mm inside the open
      face'
  screw_head_d:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3 socket head diameter; wider than the 5.42 pocket, so the head
      stops at the mouth
  screw_head_h:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3 socket head height; 2.0 mm of it stands proud of the open face
  screw_len:
    value: 12.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3x12, fully threaded (threaded-to-head max 20). Head face sits
      5.9 mm from the far face, so ~6 mm of thread comes out the far side
  screw_shank_d:
    value: 3.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M3 shank
parts:
- id: knob
  role: final
  material: PLA (high-speed, black)
  code: "import math\n\n\ndef hex_pts(af, cx=0.0, cy=0.0):\n    # across-flats ->\
    \ across-corners -> circumradius, vertices of a regular hexagon\n    rv = (af\
    \ / math.cos(math.radians(30.0))) / 2.0\n    return [(cx + rv * math.cos(math.radians(60.0\
    \ * k)),\n             cy + rv * math.sin(math.radians(60.0 * k))) for k in range(6)]\n\
    \n\ndef build(p):\n    # Print frame: z = 0 is the bed = the knob's FAR face (the\
    \ face the bolt tip exits).\n    # Going up the holes only widen: Ø3.4 -> hex\
    \ pocket -> lead-in hexagon. No overhangs.\n    H = p.ceiling_t + p.nut_pocket_depth\n\
    \    R = p.knob_od / 2.0\n\n    # knob body\n    body = cq.Workplane(\"XY\").circle(R).extrude(H)\n\
    \n    # 12 vertical finger grooves (vertical walls: printable without supports)\n\
    \    n = int(round(p.grip_count))\n    for i in range(n):\n        a = 2.0 * math.pi\
    \ * i / n\n        body = body.cut(\n            cq.Workplane(\"XY\")\n      \
    \      .center(R * math.cos(a), R * math.sin(a))\n            .circle(p.grip_groove_r)\n\
    \            .extrude(H)\n        )\n\n    # bolt hole through the far wall: smaller\
    \ than the nut, so the nut can never pass\n    body = body.cut(cq.Workplane(\"\
    XY\").circle(p.bolt_hole_d / 2.0).extrude(H))\n\n    # straight press-fit section\
    \ of the hex nut pocket (full nut height)\n    body = body.cut(\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.ceiling_t)\n        .polyline(hex_pts(p.nut_pocket_af)).close()\n\
    \        .extrude(p.nut_pocket_depth)\n    )\n\n    # lead-in at the mouth, so\
    \ the nut and the bolt head both start by hand\n    body = body.cut(\n       \
    \ cq.Workplane(\"XY\")\n        .workplane(offset=H - p.lead_in_t)\n        .polyline(hex_pts(p.nut_pocket_af\
    \ + p.lead_in_af)).close()\n        .extrude(p.lead_in_t + 0.5)\n    )\n    return\
    \ body\n"
  print_orientation: 'Far face on the bed: z = 0 is the flat Ø20 face pierced by the
    small Ø3.4 hole (the face the bolt tip exits); the hex nut pocket and its lead-in
    open upward at z = 6.9. No supports needed.'
  use_orientation: Held in the hand by the grooved rim. The far face (with the Ø3.4
    hole) faces the work; the open face, where the nut was pressed in and the bolt
    head sits, faces the hand. The trapped nut winds the knob along the bolt.
- id: coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "import math\n\n\ndef hex_pts(af, cx=0.0, cy=0.0):\n    rv = (af / math.cos(math.radians(30.0)))\
    \ / 2.0\n    return [(cx + rv * math.cos(math.radians(60.0 * k)),\n          \
    \   cy + rv * math.sin(math.radians(60.0 * k))) for k in range(6)]\n\n\ndef build(p):\n\
    \    # Print frame: z = 0 is the bed = the coupon's thin floor (with the push-out\
    \ holes).\n    T = p.coupon_floor_t + p.nut_pocket_depth\n    L = p.coupon_len\n\
    \    W = p.coupon_w\n    body = cq.Workplane(\"XY\").box(L, W, T, centered=(False,\
    \ True, False))\n\n    afs = [p.coupon_af_1, p.coupon_af_2, p.coupon_af_3, p.coupon_af_4]\n\
    \    x0 = (L - p.coupon_pitch * (len(afs) - 1)) / 2.0\n    for i, af in enumerate(afs):\n\
    \        x = x0 + i * p.coupon_pitch\n        # push-out hole in the floor (nut\
    \ cannot pass: Ø4.5 < 5.5 across-flats)\n        body = body.cut(\n          \
    \  cq.Workplane(\"XY\").center(x, 0.0)\n            .circle(p.coupon_push_hole_d\
    \ / 2.0)\n            .extrude(p.coupon_floor_t + 0.2)\n        )\n        # straight\
    \ test section: same depth as the knob's press-fit section\n        body = body.cut(\n\
    \            cq.Workplane(\"XY\").workplane(offset=p.coupon_floor_t)\n       \
    \     .polyline(hex_pts(af, x, 0.0)).close()\n            .extrude(p.nut_pocket_depth\
    \ + 0.2)\n        )\n        # same mouth lead-in as the knob\n        body =\
    \ body.cut(\n            cq.Workplane(\"XY\").workplane(offset=T - p.lead_in_t)\n\
    \            .polyline(hex_pts(af + p.lead_in_af, x, 0.0)).close()\n         \
    \   .extrude(p.lead_in_t + 0.5)\n        )\n\n    # small nub marking the end\
    \ nearest the tightest (5.30) pocket\n    body = body.union(\n        cq.Workplane(\"\
    XY\").workplane(offset=T)\n        .center(x0 - 4.5, 6.0)\n        .circle(1.0)\n\
    \        .extrude(1.5)\n    )\n    return body\n"
  print_orientation: Thin floor with the four Ø4.5 push-out holes on the bed (z =
    0); the four hex test pockets open upward. Every pocket widens toward the top
    of the print, so no supports.
  use_orientation: Flat on the bench, pockets up. Press the M3 nut into each pocket
    from above, flats aligned, until it stops on the floor; test retention by turning
    it upside down; free a stuck nut from below through the Ø4.5 hole with a 4 mm
    pusher.
