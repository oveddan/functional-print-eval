manual:
- n: '1'
  text: Print coupon (PLA, 0.2 mm layers, no supports). It lies flat with the six
    hex pockets opening upward; nothing overhangs and nothing bridges.
  parts:
  - coupon
  hardware: []
  tool: null
- n: '2'
  text: Lying flat as printed with the long axis left-right, the pockets from left
    to right are 7.95, 7.85, 7.75, 7.65, 7.55 and 7.45 mm across the flats. Press
    your M5 hex nut into each pocket in turn, flat face up, starting at the left (loosest).
    Start it square in the 45 degree flare at the mouth.
  parts:
  - coupon
  hardware:
  - nut
  tool: fingers; a light tap with a mallet handle is fine
- n: '3'
  text: For every pocket the nut enters, hold the coupon upside down and tap it on
    the bench. Find the smallest pocket that the nut went into by hand and that still
    holds the nut when inverted. Write that across-flats number down. If you have
    calipers, also measure that pocket across two opposite flats and compare with
    its nominal value - if the print came out larger than nominal, choose one pocket
    smaller.
  parts:
  - coupon
  hardware:
  - nut
  tool: calipers (optional)
- n: '4'
  text: Print knob, but first set the knob's pocket_af to the number you wrote down
    (default 7.85 mm). PLA, 0.2 mm layers, no supports, flat bottom on the bed, hex
    pocket opening up.
  parts:
  - knob
  hardware: []
  tool: null
- n: '5'
  text: Press the M5 hex nut down into the knob's hex pocket from the top face, square
    to the pocket, until it bottoms out on the floor. Its top face should end up about
    0.8 mm below the knob's rim, so the nut is fully inside.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '6'
  text: Turn the knob upside down and tap it. The nut must stay in place. If it falls
    out, reprint the knob with the pocket one size smaller across the flats (0.10
    mm less).
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '7'
  text: Feed the M5 bolt up through the clearance hole in the knob's underside and
    turn it into the nut by hand until the threaded tip comes out of the top of the
    knob.
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: null
- n: '8'
  text: 'To use: hold the knob and turn it by hand. The hex pocket stops the nut rotating,
    so the nut turns with the knob and drives the bolt in or out - no wrench needed.'
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: null
