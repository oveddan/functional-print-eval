    method: coupon
    ref: coupon
    description: The six 1.0 mm fingers print cleanly and flex without cracking, and
      the nut presses in by hand - checked on the coupon before the knob is printed.
manual:
- n: '1'
  text: Print coupon (PLA, 0.2 mm layers, no supports). It lies flat with the socket
    opening upward; every wall is vertical, so nothing overhangs and nothing bridges.
  parts:
  - coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Look into the socket: you should see six 1.0 mm thick fingers standing in
    a ring, separated by slots at the corners with a gap behind each. Flick one with
    a fingernail - it should bend outward and spring back.'
  parts:
  - coupon
  hardware: []
  tool: null
- n: '3'
  text: Press your M5 hex nut into the socket from the top, flat face down, square
    to the hexagon. It should go in with a firm push as the fingers flex out, and
    stop on the floor with its top face about 0.8 mm below the rim.
  parts:
  - coupon
  hardware:
  - nut
  tool: fingers (a light tap with a mallet handle is fine)
- n: '4'
  text: Turn the coupon upside down and tap it on the bench. The nut must stay in
    - the fingers spring against the nut's flats and hold it. If it drops out (possible
    only if your printer printed the socket more than about 0.2 mm oversize), reprint
    with socket_af reduced from 7.40 by 0.10 mm.
  parts:
  - coupon
  hardware:
  - nut
  tool: null
- n: '5'
  text: Print knob (PLA, 0.2 mm layers, no supports), flat bottom face on the bed
    with the socket opening upward.
  parts:
  - knob
  hardware: []
  tool: null
- n: '6'
  text: Press the M5 hex nut into the knob's socket from the top face, flat side down,
    until it bottoms on the pocket floor. Its top face should end up about 0.8 mm
    below the rim, so the nut is fully inside.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '7'
  text: 'Turn the knob upside down and tap it: the nut must stay in place. To remove
    it later, push it out from below with a 5 mm pin.'
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '8'
  text: Feed the M5 bolt up through the clearance hole in the knob's underside and
    turn it by hand into the nut until the threaded tip comes out of the top of the
    knob.
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: null
- n: '9'
  text: 'To use: grip the knob and turn it by hand. The fingers grip the nut and its
    corners key into the corner slots, so the nut turns with the knob and the bolt
    is driven in or out without a wrench.'
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: null
