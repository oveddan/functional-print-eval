task: nut-knob/M5
note: 'Revised: the fixed-interference hex pocket is replaced by a self-adjusting
  compliant socket, because that fit was the one thing that depended on data the user
  cannot supply (their nut''s across-flats, and any coupon result).


  What changed. The knob''s pocket is now a collet. Six flexible fingers - the flats
  of a 7.40 mm-across-flats hexagon, 1.0 mm thick, 5.5 mm tall, rooted on the pocket
  floor - stand inside an 11.0 mm cavity with a 0.8 mm free gap behind them and 1.2
  mm corner slots separating them. The 7.40 socket is smaller than the smallest nut
  ISO 4032 allows (7.64), so every possible nut is gripped, and the fingers simply
  flex further for a bigger one: 0.12 to 0.30 mm of flex per side over the whole 7.64-8.00
  mm band. Insertion is a firm hand push (roughly 30-50 N through the 1.0 mm lead-in
  taper at the mouth); retention is the fingers'' elastic spring force, which needs
  only about 0.005 N to hold a 1 g nut when the knob is inverted, so it is never marginal.
  It also stays grippy if the printer is off by +/-0.2 mm, which a fixed undersized
  pocket would not.


  Everything else the user asked for is unchanged and dimensional: the nut presses
  in from the top face and sits 0.8 mm below the rim (fully inside); it bottoms on
  a 6.5 mm floor whose only opening is the 5.5 mm bolt clearance hole, so it cannot
  be pushed out of the far side; and the M5 bolt passes up through that hole, threads
  into the nut and its tip comes out of the open top. One printed piece, no glue,
  no supports, no bridging - every wall is vertical, the fingers included.


  Turning torque: the nut''s corners sit in the 1.2 mm corner slots, so after about
  6 degrees of free play the knob drives the nut by form contact, not just friction
  - it will tighten a joint by hand without slipping.


  One tuning knob, if it is ever needed: socket_af. It is 7.40 by design; if the printed
  fingers are too tight to press (or too loose to hold), reprint with it 0.1 mm larger
  or smaller. The coupon prints that same socket in a small block so this can be checked
  in 10 minutes before committing to the knob.'
questions:
- text: Which way does the bolt pass through the knob?
  answer: 'From below: the shank enters the 5.5 mm clearance hole in the knob''s underside
    (the pocket floor), threads into the nut and the threaded tip comes out of the
    open top. The underside is flat - it does not seat a bolt head; the head bears
    on whatever is being clamped.'
- text: What holds the nut in, with no glue and no measurement of the nut?
  answer: 'Six flexible fingers forming a 7.40 mm-across-flats socket, smaller than
    any ISO 4032 M5 nut (7.64 mm minimum), so every nut is gripped elastically and
    stays in when the knob is inverted. Chosen precisely because the nut''s size is
    unknown: the fingers absorb the whole 7.64-8.00 mm range plus about +/-0.2 mm
    of printer error, where a fixed undersized pocket would be a coin flip.'
- text: Why is a coupon supplied when the earlier one could not be reported on?
  answer: This coupon carries the new socket geometry, so it is the only way to confirm
    the 1.0 mm fingers print cleanly and feel right before printing the knob. Nothing
    about the knob depends on the result - it is a check, not a calibration; the only
    parameter anyone would ever change is socket_af, by 0.1 mm.
params:
  bolt_clear_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: 'Bolt clearance hole through the pocket floor: 0.5 mm over the M5 shank.
      Far smaller than any nut, so the nut cannot pass through it.'
  bolt_shank_d:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 nominal shank diameter.
  coupon_h:
    value: 10.0
    unit: mm
    kind: design
    source: design
    note: Coupon thickness; floor is the same 4.5 mm below the socket as in the knob,
      so the fingers are identical.
  coupon_l:
    value: 24.0
    unit: mm
    kind: design
    source: design
    note: Coupon length.
  coupon_w:
    value: 24.0
    unit: mm
    kind: design
    source: design
    note: Coupon width.
  finger_t:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: Wall thickness of each flexible finger; 2.5 nozzle widths at 0.4 mm. Sets
      the grip stiffness.
  gap_behind:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Free gap behind each finger, i.e. the travel available as it flexes. The
      worst case needs only 0.40 mm.
  grip_flutes:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Number of vertical finger grooves around the knob's rim.
  groove_depth:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: Depth of each rim groove; cutter centre radius = knob_d/2 + groove_r - groove_depth.
  groove_r:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: Radius of the cutter forming each rim groove.
  knob_d:
    value: 30.0
    unit: mm
    kind: design
    source: asked
    note: User asked for about 30 mm across; measured at the un-grooved lobes.
  knob_h:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: Knob height, giving a 6.5 mm floor under the nut and 5.5 mm tall fingers.
  lead_in:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Radial lead-in taper at the socket mouth, per side, so the nut starts square
      and the fingers are cammed out gradually.
  lead_in_h:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: Height over which the lead-in taper runs; about a 50 degree wedge.
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: 'ISO 4032 M5 hex nut, width across flats: 8.00 mm maximum, 7.64 mm minimum.
      Not measurable by the user; the socket is sized below the minimum so that either
      extreme is gripped.'
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut height.
  pocket_recess:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: How far the nut's top face ends up below the knob's top face, so the nut
      sits fully inside.
  slit_r_in:
    value: 3.9
    unit: mm
    kind: design
    source: design
    note: Inner end of each corner slot, measured from the knob's axis.
  slit_r_out:
    value: 6.1
    unit: mm
    kind: design
    source: design
    note: Outer end of each corner slot, past the outer corner of the finger sleeve.
  slit_w:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: Width of the slot at each hexagon corner that frees the fingers from one
      another; also the keyway the nut's corners sit in to drive it.
  socket_af:
    value: 7.4
    unit: mm
    kind: design
    source: design
    note: Across-flats presented by the idle fingers. Below the 7.64 mm ISO 4032 minimum,
      so every nut is gripped; the fingers flex 0.12-0.30 mm per side across the whole
      nut range. The one parameter to change (by 0.1 mm) if the printed grip is ever
      wrong.
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\n\ndef _hex(af, dx=0.0, dy=0.0):\n    # regular hexagon by\
    \ its width across flats, vertex on +X\n    R = af / (3 ** 0.5)\n    return [(dx\
    \ + R * math.cos(math.radians(60 * i)),\n             dy + R * math.sin(math.radians(60\
    \ * i))) for i in range(6)]\n\n\ndef _prism(af, z0, h):\n    return (cq.Workplane(\"\
    XY\").workplane(offset=z0)\n            .polyline(_hex(af)).close().extrude(h))\n\
    \n\ndef build(p):\n    top = p.knob_h\n    floor_z = top - (p.nut_h + p.pocket_recess)\n\
    \    finger_out_af = p.socket_af + 2.0 * p.finger_t\n    cavity_af = finger_out_af\
    \ + 2.0 * p.gap_behind\n    mouth_af = p.socket_af + 2.0 * p.lead_in\n\n    #\
    \ --- body ------------------------------------------------------\n    body =\
    \ cq.Workplane(\"XY\").circle(p.knob_d / 2.0).extrude(p.knob_h)\n\n    ctr = p.knob_d\
    \ / 2.0 + p.groove_r - p.groove_depth\n    n = int(p.grip_flutes)\n    for i in\
    \ range(n):\n        a = 2.0 * math.pi * i / n\n        body = body.cut(cq.Workplane(\"\
    XY\")\n                        .moveTo(ctr * math.cos(a), ctr * math.sin(a))\n\
    \                        .circle(p.groove_r)\n                        .extrude(p.knob_h))\n\
    \n    # --- socket ----------------------------------------------------\n    #\
    \ cavity behind the fingers, open at the top face\n    body = body.cut(_prism(cavity_af,\
    \ floor_z, top - floor_z + 1.0))\n\n    # the finger sleeve: hex annulus rooted\
    \ on the pocket floor\n    sleeve = _prism(finger_out_af, floor_z, top - floor_z)\n\
    \    sleeve = sleeve.cut(_prism(p.socket_af, floor_z - 0.5,\n                \
    \               top - floor_z + 1.5))\n    body = body.union(sleeve)\n\n    #\
    \ corner slots that free the six fingers from one another\n    hw = p.slit_w /\
    \ 2.0\n    for i in range(6):\n        a = math.radians(60 * i)\n        ux, uy\
    \ = math.cos(a), math.sin(a)\n        tx, ty = -math.sin(a), math.cos(a)\n   \
    \     quad = []\n        for (rr, ss) in ((p.slit_r_in, -hw), (p.slit_r_out, -hw),\n\
    \                         (p.slit_r_out, hw), (p.slit_r_in, hw)):\n          \
    \  quad.append((rr * ux + ss * tx, rr * uy + ss * ty))\n        body = body.cut(cq.Workplane(\"\
    XY\").workplane(offset=floor_z)\n                        .polyline(quad).close()\n\
    \                        .extrude(top - floor_z + 1.0))\n\n    # lead-in taper\
    \ at the socket mouth, then clear above it\n    lead = (cq.Workplane(\"XY\").workplane(offset=top\
    \ - p.lead_in_h)\n            .polyline(_hex(p.socket_af)).close()\n         \
    \   .workplane(offset=p.lead_in_h)\n            .polyline(_hex(mouth_af)).close()\n\
    \            .loft())\n    body = body.cut(lead)\n    body = body.cut(_prism(mouth_af,\
    \ top - 0.001, 1.5))\n\n    # M5 clearance hole through the pocket floor\n   \
    \ body = body.cut(cq.Workplane(\"XY\")\n                    .circle(p.bolt_clear_d\
    \ / 2.0)\n                    .extrude(p.knob_h))\n\n    return body\n"
  print_orientation: Flat bottom face on the bed, knob axis vertical (Z), socket opening
    upward. Every wall is vertical - fingers, corner slots, rim grooves - so there
    are no overhangs and nothing bridges.
  use_orientation: Axis vertical, socket up. The nut presses in from the top face;
    the M5 bolt comes up from below through the clearance hole and its tip leaves
    through the open top.
- id: coupon
  role: coupon
  material: PLA
  code: "import math\n\n\ndef _hex(af, dx=0.0, dy=0.0):\n    # regular hexagon by\
    \ its width across flats, vertex on +X\n    R = af / (3 ** 0.5)\n    return [(dx\
    \ + R * math.cos(math.radians(60 * i)),\n             dy + R * math.sin(math.radians(60\
    \ * i))) for i in range(6)]\n\n\ndef _prism(af, z0, h):\n    return (cq.Workplane(\"\
    XY\").workplane(offset=z0)\n            .polyline(_hex(af)).close().extrude(h))\n\
    \n\ndef build(p):\n    top = p.coupon_h\n    floor_z = top - (p.nut_h + p.pocket_recess)\n\
    \    finger_out_af = p.socket_af + 2.0 * p.finger_t\n    cavity_af = finger_out_af\
    \ + 2.0 * p.gap_behind\n    mouth_af = p.socket_af + 2.0 * p.lead_in\n\n    #\
    \ --- block -----------------------------------------------------\n    body =\
    \ cq.Workplane(\"XY\").box(p.coupon_l, p.coupon_w, p.coupon_h,\n             \
    \                      centered=(True, True, False))\n\n    # --- same socket\
    \ as the knob -----------------------------------\n    body = body.cut(_prism(cavity_af,\
    \ floor_z, top - floor_z + 1.0))\n\n    sleeve = _prism(finger_out_af, floor_z,\
    \ top - floor_z)\n    sleeve = sleeve.cut(_prism(p.socket_af, floor_z - 0.5,\n\
    \                               top - floor_z + 1.5))\n    body = body.union(sleeve)\n\
    \n    hw = p.slit_w / 2.0\n    for i in range(6):\n        a = math.radians(60\
    \ * i)\n        ux, uy = math.cos(a), math.sin(a)\n        tx, ty = -math.sin(a),\
    \ math.cos(a)\n        quad = []\n        for (rr, ss) in ((p.slit_r_in, -hw),\
    \ (p.slit_r_out, -hw),\n                         (p.slit_r_out, hw), (p.slit_r_in,\
    \ hw)):\n            quad.append((rr * ux + ss * tx, rr * uy + ss * ty))\n   \
    \     body = body.cut(cq.Workplane(\"XY\").workplane(offset=floor_z)\n       \
    \                 .polyline(quad).close()\n                        .extrude(top\
    \ - floor_z + 1.0))\n\n    lead = (cq.Workplane(\"XY\").workplane(offset=top -\
    \ p.lead_in_h)\n            .polyline(_hex(p.socket_af)).close()\n           \
    \ .workplane(offset=p.lead_in_h)\n            .polyline(_hex(mouth_af)).close()\n\
    \            .loft())\n    body = body.cut(lead)\n    body = body.cut(_prism(mouth_af,\
    \ top - 0.001, 1.5))\n\n    body = body.cut(cq.Workplane(\"XY\")\n           \
    \         .circle(p.bolt_clear_d / 2.0)\n                    .extrude(p.coupon_h))\n\
    \n    return body\n"
  print_orientation: Flat bottom face on the bed, socket opening upward.
  use_orientation: 'Flat, socket up: press the nut in, then hold the coupon upside
    down and tap it to check the fingers hold.'
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
- id: bolt
  ref: ISO 4762 M5x20
  qty: 1
joints:
- id: j1
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: bolt clearance hole through the pocket floor
    role: clearance
  nut: nut
  external: null
criteria:
- id: c1
  part: knob
  feature: six flexible fingers forming the socket
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - socket_af
  - nut_af
  - finger_t
  - gap_behind
  check:
    method: coupon
    ref: coupon
    description: Any ISO 4032 M5 nut (7.64-8.00 mm across flats) enters the socket.
      The fingers present 7.40 mm, so each finger flexes 0.12-0.30 mm per side; the
      gap behind them is 0.8 mm, so the worst case still has travel in hand.
- id: c2
  part: knob
  feature: elastic grip of the fingers
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - socket_af
  - finger_t
  - gap_behind
  - nut_af
  check:
    method: coupon
    ref: coupon
    description: 'With the knob upside down and tapped, the nut does not fall out.
      Designed for this without any measured data: the fingers spring on the nut''s
      flats, a force thousands of times larger than the 1 g nut''s weight, for every
      nut size in the tolerance band.'
- id: c3
  part: knob
  feature: pocket floor under the socket
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - nut_h
  - pocket_recess
  - knob_h
  check:
    method: none
    ref: null
    description: The nut bottoms on a solid 6.5 mm floor and cannot be pushed out
      of the far side; its top face ends up 0.8 mm below the rim, so it sits fully
      inside.
- id: c4
  part: knob
  feature: bolt clearance hole through the pocket floor
  relation: clears
  hardware: bolt
  clearance_mm: 0.5
  params:
  - bolt_clear_d
  - bolt_shank_d
  check:
    method: measure
    ref: null
    description: 'Measure the printed hole at the knob''s underside: at least 5.0
      mm, so the M5 shank passes freely into the nut and its tip leaves through the
      open top.'
- id: c5
  part: knob
  feature: corner slots between the fingers
  relation: engages
  hardware: nut
