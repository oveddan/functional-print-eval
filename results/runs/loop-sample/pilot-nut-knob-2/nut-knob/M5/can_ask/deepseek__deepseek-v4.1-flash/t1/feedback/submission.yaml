  params:
  - slit_w
  - nut_af
  check:
    method: none
    ref: null
    description: The nut's corners key into the 1.2 mm corner slots, so turning the
      knob drives the nut by form contact rather than friction alone.
- id: c6
  part: coupon
  feature: printed socket and fingers
  relation: engages
  hardware: nut
  clearance_mm: null
  params:
  - socket_af
  - finger_t
  - slit_w
  - coupon_h
