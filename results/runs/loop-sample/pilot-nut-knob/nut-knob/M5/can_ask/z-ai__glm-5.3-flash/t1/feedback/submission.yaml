task: nut-knob/M5
note: 'Fluted hand knob Ø30 × 15 for an M5 bolt, one piece, no glue. The ISO 4032
  M5 nut presses by hand into a blind hex pocket in the top face: 45° mouth chamfer,
  0.10 mm-clearance slip zones, a 17° tapered lead-in, then a 1.0 mm snap band at
  0.25 mm undersize (7.75 vs 8.0 across flats). Past the band the nut is axially trapped
  by geometry — its flats can''t pass the band in any position, so it stays in upside-down,
  and the solid floor means it can''t be pushed out the far side; nut top sits 0.4
  mm below the face. The centre Ø5.5 hole passes the bolt through the nut and out
  the other side. Coupon (optional) repeats the pocket at 0.15/0.25/0.35 mm undersize
  to preview press feel; the knob ships with 0.25 — if the press is too hard for your
  thumb, set p.pocket_snap_under = 0.15 and reprint.'
questions:
- text: 'If you do test the coupon pockets: which one presses in with a firm thumb
    press and holds the nut upside-down? (left = 0.15, middle = 0.25, right = 0.35
    mm undersize) — the knob ships with the middle value'
  answer: null
