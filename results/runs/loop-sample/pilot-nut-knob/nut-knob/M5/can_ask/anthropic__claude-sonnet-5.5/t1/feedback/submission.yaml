task: nut-knob/M5
note: 'Resubmitted unchanged in geometry. The coupon result was not reported, so the
  8.05 mm pocket (nut AF + 0.05 mm) is still unverified. Manual step 1 tells you how
  to adjust pocket_fit from the coupon: lower it if the nut is loose, raise it if
  it won''t press in.'
questions:
- text: How did the 8.05 mm pocket on the fit coupon come out (too tight, snug, or
    loose with the nut falling out)?
  answer: 'Not reported: the coupon result could not be given.'
params:
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 thickness
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: M5 shank
  bolt_clear:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: added to bolt_d for the through hole (5.5 mm)
  pocket_fit:
    value: 0.05
    unit: mm
    kind: design
    source: design
    note: 'added to nut across-flats (pocket 8.05 mm). UNVERIFIED: the coupon result
      was not reported, so this is still a guess. Lower it (0.0) if the nut is loose,
      raise it (0.1) if it will not press in.'
  nut_recess:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: nut sits this far below the knob face, so it is fully inside
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: about 30 mm across, requested
  knob_h:
    value: 12
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_n:
    value: 6
    unit: count
    kind: design
    source: design
    note: ''
  scallop_r:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: grip scallop radius
  lead_in:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: mouth chamfer on the pocket flats
  coupon_d:
    value: 18
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_h:
    value: 8
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    H = p.knob_h\n    af = p.nut_af + p.pocket_fit\n\
    \    circ = af / math.cos(math.radians(30))\n    depth = p.nut_h + p.nut_recess\n\
    \    body = cq.Workplane('XY').circle(p.knob_d/2).extrude(H).faces('<Z').chamfer(1.0)\n\
    \    for i in range(int(p.scallop_n)):\n        a = 2*math.pi*i/p.scallop_n\n\
    \        R = p.knob_d/2 + p.scallop_r - 3.0\n        cut = cq.Workplane('XY').center(R*math.cos(a),\
    \ R*math.sin(a)).circle(p.scallop_r).extrude(H)\n        body = body.cut(cut)\n\
    \    pocket = cq.Workplane('XY').workplane(offset=H-depth).polygon(6, circ).extrude(depth)\n\
    \    body = body.cut(pocket)\n    ap = af/2\n    cone = cq.Workplane('XY').add(cq.Solid.makeCone(ap,\
    \ ap+p.lead_in, p.lead_in, pnt=cq.Vector(0,0,H-p.lead_in), dir=cq.Vector(0,0,1)))\n\
    \    body = body.cut(cone)\n    hole = cq.Workplane('XY').circle((p.bolt_d+p.bolt_clear)/2).extrude(H)\n\
    \    body = body.cut(hole)\n    return body\n"
  print_orientation: Knob's top face (the face away from the nut pocket) flat on the
    bed; pocket opens upward, so no supports or bridges are needed.
  use_orientation: Pocket faces down toward the work, towards the bolt; the knob is
    turned by its scalloped rim.
- id: fit-coupon
  role: coupon
  material: PLA
  code: "import math\ndef build(p):\n    H = p.coupon_h\n    af = p.nut_af + p.pocket_fit\n\
    \    circ = af / math.cos(math.radians(30))\n    depth = p.nut_h + p.nut_recess\n\
    \    body = cq.Workplane('XY').circle(p.coupon_d/2).extrude(H)\n    pocket = cq.Workplane('XY').workplane(offset=H-depth).polygon(6,\
    \ circ).extrude(depth)\n    body = body.cut(pocket)\n    ap = af/2\n    cone =\
    \ cq.Workplane('XY').add(cq.Solid.makeCone(ap, ap+p.lead_in, p.lead_in, pnt=cq.Vector(0,0,H-p.lead_in),\
    \ dir=cq.Vector(0,0,1)))\n    body = body.cut(cone)\n    body = body.cut(cq.Workplane('XY').circle((p.bolt_d+p.bolt_clear)/2).extrude(H))\n\
    \    return body\n"
  print_orientation: Flat face (away from pocket) on the bed; pocket opens upward.
  use_orientation: 'Test piece only: press an M5 nut in, turn upside down, shake.'
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
- id: bolt
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: knob-bolt
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 12.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: hex_pocket
    role: nut_pocket
  - part: knob
    feature: bolt_through_hole
    role: clearance
  nut: nut
  external: null
criteria:
- id: c-nut-pocket
  part: knob
  feature: hex_pocket
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - nut_h
  - pocket_fit
  - nut_recess
  check:
    method: coupon
    ref: fit-coupon
    description: Press an M5 nut into the coupon by hand; it must go in with thumb
      pressure, stay in when upside down and shaken, and sit below the face. Result
      not yet reported.
- id: c-nut-retained
  part: knob
  feature: ceiling above pocket
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - knob_h
  - nut_h
  - nut_recess
  check:
    method: measure
    ref: null
    description: 'Nut cannot be pushed through the far side: the closed ceiling is
      about 7 mm thick with only the 5.5 mm bolt hole.'
- id: c-bolt-hole
  part: knob
  feature: bolt_through_hole
  relation: clears
  hardware: bolt
  clearance_mm: 0.25
  params:
  - bolt_d
  - bolt_clear
  check:
    method: coupon
    ref: fit-coupon
    description: An M5 bolt slides through the hole in the coupon.
manual:
- n: '1'
  text: 'Before the knob, check the fit-coupon you printed: press an M5 nut into the
    pocket by hand, turn the coupon upside down and shake. If the nut falls out or
    is loose, lower pocket_fit by 0.05 mm and reprint; if you can''t press it in with
    your thumb, raise it by 0.05 mm. If it holds, print the knob as is.'
  parts:
  - fit-coupon
  hardware:
  - nut
  tool: null
- n: '2'
  text: Print the knob with its flat top on the bed, in black PLA, 0.2 mm layers,
    no supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Align the nut's flats with the hex pocket in the underside of the knob and
    press it in with your thumb until it is fully below the face (bottom of the pocket).
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Thread the M5 bolt into the nut by turning the knob; the bolt tip can pass
    into the through hole in the knob. Tighten by hand.
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: null
