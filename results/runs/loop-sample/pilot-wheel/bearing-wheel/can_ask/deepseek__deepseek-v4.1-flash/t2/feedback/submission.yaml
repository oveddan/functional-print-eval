- id: c_plate_clear
  part: wheel
  feature: outer face at z = 0
  relation: clears
  hardware: null
  clearance_mm: 2.0
  params:
  - ring_len
  - plate_t
  check:
    method: measure
    ref: null
    description: Outer ring A stands 2 mm proud of the wheel face, so the stationary
      hanger plate clears the spinning wheel by 2 mm when the stack is snug.
- id: c_bolt_reach
  part: ring
  feature: outer face at the lock nut
  relation: engages
  hardware: bolt
  clearance_mm: null
  params:
  - bolt_len
  - plate_t
  - ring_len
  - wheel_w
  - nut_h
  check:
    method: measure
    ref: null
    description: Needs bolt_len >= plate_t + 2 x ring_len + wheel_w + nut_h = 31 mm;
      the M8x35 gives 4 mm of thread past the lock nut. Check your own bolt against
      this before assembling.
manual:
- n: '1'
  text: 'Coupon step already done: the seat printed at 22.19 mm takes a 608ZZ by hand
    and holds it upside down, and the four smaller seats were too tight to press.
    socket_d is set to 22.19, so the wheel below is ready to slice as-is. Do not reprint
    the coupon.'
  parts: []
  hardware: []
  tool: ''
- n: '2'
  text: Print the wheel flat, as modelled, in the same filament and layer height as
    the coupon (PLA, 0.2 mm layers, 0.4 mm nozzle). Print one wheel for every roller
    you are replacing - the one that snapped, and its partner on the other side of
    the door if it is worn.
  parts:
  - wheel
  hardware: []
  tool: ''
- n: '3'
  text: 'Print three rings per wheel (part: ring). They are all identical - two for
    the outside faces and one for the middle.'
  parts:
  - ring
  hardware: []
  tool: ''
- n: '4'
  text: Press one 608ZZ into one face of the wheel and one into the other face, from
    opposite sides, until each bearing sits flush with the wheel face. Keep pressing
    until each one bottoms on the 2 mm shoulder in the middle - do not let one go
    in past its face. The fit is a light push; if a bearing feels at all loose once
    seated, wick a drop of superglue around the outer-ring edge.
  parts:
  - wheel
  hardware:
  - bearing
  - bolt
  - nut
  tool: hand pressure, or a vice / an M8 bolt used as a press
- n: '5'
  text: Drop one ring into the middle of the wheel so it sits between the two bearing
    inner rings, inside the ÃƒÂ¸14 bore. It must fill the gap with no rattle.
  parts:
  - wheel
  - ring
  hardware: []
  tool: ''
- n: '6'
  text: 'Spin test on the bench: slide the bolt through the stack of inner rings and
    turn the wheel. It must spin freely with no scraping and no rocking.'
  parts:
  - wheel
  - ring
  hardware:
  - bolt
  - bearing
  tool: ''
- n: '7'
  text: 'On the door: pass the M8x35 bolt through the axle hole in the hanger plate
    from the outside, then slide on one ring, then the wheel assembly, then the second
    ring, then spin on the lock nut. Order from the bolt head: plate, ring, wheel,
    ring, lock nut. If the plate''s hole is under ÃƒÂ¸8.4, drill it out to 9 mm first.'
  parts:
  - wheel
  - ring
  hardware:
  - bolt
  - nut
  tool: drill (only if the plate hole needs opening out)
- n: '8'
  text: 'Tighten the lock nut snugly - just enough to take up the play. The clamping
    force runs head-to-plate-to-ring-to-inner ring-to-spacer-ring-to-inner ring-to-ring-to-nut,
    so the bolt is locked to the door and the wheel turns on the bearings. Do not
    over-tighten: the rings are PLA. Check that the wheel spins freely and that its
    face clears the hanger plate by about 2 mm.'
  parts:
  - wheel
  - ring
  hardware:
  - bolt
  - nut
  tool: 6 mm hex key and 13 mm spanner
- n: '9'
  text: Refit the door on the track. The rim is flat with a rounded edge, so it runs
    on a flat track or a raised rail; the wheel should sit on the track without the
    plate or the bolt end fouling anything. Roll the door its full length and check
    it runs smoothly.
  parts:
  - wheel
  hardware: []
  tool: ''
