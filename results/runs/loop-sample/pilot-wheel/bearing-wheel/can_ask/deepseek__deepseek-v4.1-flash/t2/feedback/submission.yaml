- id: c_ring_seat
  part: ring
  feature: ÃƒÂ¸12 face
  relation: seats
  hardware: bearing
  clearance_mm: 0.7
  params:
  - ring_od
  - bearing_inner_ring_od
  check:
    method: none
    ref: null
    description: The ring is 0.7 mm smaller than the inner-ring OD, so it presses
      the inner ring only and never the shield; the nut (13 A/F) and the bolt head
      (ÃƒÂ¸13) both land on the ring, not on the bearing.
- id: c_ring_bore
  part: ring
  feature: bore ÃƒÂ¸8.4
  relation: clears
  hardware: bolt
  clearance_mm: 0.4
  params:
  - ring_id
  - bolt_shank_d
  check:
    method: measure
    ref: null
