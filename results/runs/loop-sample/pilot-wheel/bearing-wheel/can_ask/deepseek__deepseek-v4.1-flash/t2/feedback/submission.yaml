task: bearing-wheel
note: 'CHANGE FROM THE FIRST SUBMISSION: one number - socket_d is now 22.19 instead
  of 21.9, because your coupon showed that the Ø22.19 seat takes a 608 by hand and
  still holds it inverted, while everything smaller was too tight to press. Nothing
  else changed. Your printer prints these bores undersized, and the coupon was the
  middle hole''s nominal value, so this simply puts the wheel''s sockets at the size
  your printer actually produces as a snug, retained fit.


  Everything else is as before: a 50 x 16 printed wheel with two 608ZZ bearings pressed
  in from either face; the M8 bolt is the axle and the wheel spins on the bearing
  outer rings. The two inner rings are clamped by the bolt head and a lock nut through
  three small printed rings (Ø12 x Ø8.4 x 2), so nothing stationary rubs the spinning
  wheel and no washer touches a bearing shield. The 2 mm internal shoulder locates
  both outer rings, its Ø14 bore is bigger than the 608 inner ring (12.7) so the shoulder
  touches only the rotating outer rings, and the printed rings stand 2 mm proud of
  each face so the fixed hanger plate clears the wheel.


  Assumptions still open, unchanged: the hanger plate is ~3 mm thick (guessed; above
  ~5 mm use the plain ISO 4032 M8 nut or a 40 mm bolt), and the bolt is the catalog
  ISO 4762 M8x35. The socket is now a light fit rather than a press, so the bearings
  are easy to seat and can be checked by hand; if either feels loose after seating,
  a drop of superglue at the outer-ring edge, or the socket reprinted at the next
  coupon size down, will lock it. Rim is flat with a 1.5 mm roundover - it rolls on
  a flat track or a rail; tell me if the old wheel was grooved and I will cut a matching
  groove.'
questions:
- text: How long is your own M8 bolt from under the head to the tip? The stack needs
    31 mm (3 mm plate + 2 mm ring + 16 mm wheel + 2 mm ring + 8 mm lock nut); the
    catalog M8x35 leaves 4 mm spare, so anything from 33 mm to 45 mm works.
  answer: null
- text: How thick is the hanger plate at the wheel? Above about 5 mm, swap the lock
    nut for the shorter ISO 4032 M8 nut (6.8 mm) or use a 40 mm bolt.
  answer: null
- text: Is the track a flat strip or a raised rail (or a channel the wheel sits in)?
    The rim is currently flat with a rounded edge. If the old wheel had a groove that
    rode on a rail, tell me and I will put a matching groove in the rim.
  answer: null
- text: How many rollers does the door have, and did only one wheel snap? Print one
    wheel per roller - two bearings are used per wheel, and you have two.
  answer: null
params:
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: 608ZZ bore; user measured about 8 mm
  bearing_inner_ring_od:
    value: 12.7
    unit: mm
    kind: hardware
    source: guessed
    note: typical 608 inner-ring OD, not in the supplied data. The shoulder bore and
      the printed rings are sized from it, so that neither can rub the bearing shield.
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: 608ZZ outer diameter; user measured about 22 mm, datasheet 22.000 -0.008
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: 608ZZ width; user measured about 7 mm
  bolt_len:
    value: 35
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8x35; the shortest catalog bolt that spans plate + ring + wheel
      + ring + lock nut
  bolt_shank_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: user measured the M8 shank at about 8 mm
  lead_d:
    value: 22.9
    unit: mm
    kind: design
    source: design
    note: lead-in counterbore at each face so a bearing can be started square
  lead_t:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: depth of the lead-in counterbore
  nut_h:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 nylon-insert lock nut height
  plate_hole_d:
    value: 9
    unit: mm
    kind: world
    source: guessed
    note: hole the bolt passes through in the door's hanger plate; a standard M8 clearance
      hole. If yours is smaller, drill it to 9 mm.
  plate_t:
    value: 3
    unit: mm
    kind: world
    source: guessed
    note: hanger plate thickness; not measurable by the user. With this value the
      M8x35 leaves 4 mm of thread past the lock nut. Every extra 1 mm of plate eats
      1 mm of that margin.
  rim_round:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: roundover on the two rim edges; the rim itself is left cylindrical (flat)
      so it works on a flat track or a rail
  ring_id:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: clears the M8 shank by 0.4 mm
  ring_len:
    value: 2
    unit: mm
    kind: design
    source: design
    note: 2 mm between the two inner rings (matches the shoulder) and the same 2 mm
      of standoff from the wheel face on each side; one part, printed three times
      per wheel
  ring_od:
    value: 12
    unit: mm
    kind: design
    source: design
    note: smaller than the 608 inner-ring OD (12.7) so the ring presses only the inner
      ring and misses the shield
  shoulder_bore_d:
    value: 14
    unit: mm
    kind: design
    source: design
    note: central bore through the shoulder; clears the 608 inner ring (12.7) by 1.3
      mm so the shoulder touches only the outer rings
  shoulder_w:
    value: 2
    unit: mm
    kind: design
    source: design
    note: width of the internal shoulder both bearing outer rings seat against
  socket_d:
    value: 22.19
    unit: mm
    kind: design
    source: measured
    note: 'CHANGED from 21.9 after the coupon test: the seat printed at this nominal
      diameter took a 608 by hand and held it upside down, and every smaller seat
      was too tight to press. Tuned to this printer''s undersized bores, so it prints
      as a snug retained fit rather than a hard press.'
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: old wheel measured ~50 mm across (the user's own figure)
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: old wheel ~16 mm wide; kept equal to 2 x bearing width + the 2 mm shoulder
parts:
- id: wheel
  role: final
  material: PLA (high-speed, black) - 0.4 mm nozzle, 0.2 mm layers
  code: "import cadquery as cq\n\n\ndef build(p):\n    R = p.wheel_od / 2.0      \
    \    # 25\n    W = p.wheel_w                 # 16\n    bz = p.bearing_w      \
    \        # 7\n    sw = p.shoulder_w             # 2\n    sock_r = p.socket_d /\
    \ 2.0     # 11.095 (from the coupon test)\n    lead_r = p.lead_d / 2.0       #\
    \ 11.45\n    sho_r = p.shoulder_bore_d / 2.0  # 7\n    rr = p.rim_round      \
    \        # 1.5\n\n    # tyre: ÃƒÂ¸50 x 16 disc, axis vertical\n    w = cq.Workplane(\"\
    XY\").circle(R).extrude(W)\n    w = w.faces(\">Z\").edges(\"%CIRCLE\").fillet(rr)\n\
    \    w = w.faces(\"<Z\").edges(\"%CIRCLE\").fillet(rr)\n\n    # bearing sockets,\
    \ one pressed in from each face, ending at the shoulder\n    w = w.cut(cq.Workplane(\"\
    XY\").circle(sock_r).extrude(bz + 0.1))\n    w = w.cut(cq.Workplane(\"XY\").workplane(offset=bz\
    \ + sw).circle(sock_r).extrude(bz + 1.0))\n\n    # lead-in counterbores so a bearing\
    \ can be started square\n    w = w.cut(cq.Workplane(\"XY\").workplane(offset=-0.5).circle(lead_r).extrude(p.lead_t\
    \ + 0.5))\n    w = w.cut(cq.Workplane(\"XY\").workplane(offset=W - p.lead_t).circle(lead_r).extrude(p.lead_t\
    \ + 0.5))\n\n    # shoulder bore: bigger than the 608 inner ring so only the outer\
    \ rings seat on it\n    w = w.cut(cq.Workplane(\"XY\").workplane(offset=bz - 1.0).circle(sho_r).extrude(sw\
    \ + 2.0))\n    return w\n"
  print_orientation: 'As modelled: flat, wheel axis vertical, z = 0 on the bed. The
    bearing sockets print as vertical round bores, which is the orientation the coupon
    gauged.'
  use_orientation: Wheel axis horizontal, on the M8 bolt as its axle; rim on the door
    track.
- id: ring
  role: final
  material: PLA (high-speed, black) - 0.4 mm nozzle, 0.2 mm layers. Print 3 per wheel.
  code: "import cadquery as cq\n\n\ndef build(p):\n    od = p.ring_od / 2.0\n    idr\
    \ = p.ring_id / 2.0\n    t = p.ring_len\n    r = cq.Workplane(\"XY\").circle(od).extrude(t)\n\
    \    r = r.cut(cq.Workplane(\"XY\").circle(idr).extrude(t))\n    return r\n"
  print_orientation: 'As modelled: flat, ring axis vertical, z = 0 on the bed.'
  use_orientation: Slides on the M8 bolt. One goes between the two 608 inner rings
    (in the wheel's ÃƒÂ¸14 shoulder bore), and one goes on each outside face of the
    wheel - those two press the inner rings and hold the bracket plate and the lock
    nut off the bearing shields.
- id: coupon
  role: coupon
  material: PLA (high-speed, black) - same filament and layer height as the wheel
  code: "import cadquery as cq\n\n\ndef build(p):\n    L, Wd, H = 140.0, 32.0, 12.0\n\
    \    ds = [p.socket_d - 0.30, p.socket_d - 0.15, p.socket_d,\n          p.socket_d\
    \ + 0.15, p.socket_d + 0.30]\n    xs = [16.0, 43.0, 70.0, 97.0, 124.0]\n    body\
    \ = cq.Workplane(\"XY\").box(L, Wd, H, centered=(False, True, False))\n    for\
    \ x, d in zip(xs, ds):\n        body = body.cut(cq.Workplane(\"XY\").center(x,\
    \ 0.0).circle(d / 2.0).extrude(H + 1.0))\n    return body\n"
  print_orientation: 'As modelled: flat, holes vertical (same orientation as the wheel''s
    bearing sockets).'
  use_orientation: 'Not part of the door. Already run: the five seats tested 21.59
    / 21.74 / 21.89 / 22.04 / 22.19 mm and the 22.19 seat is the one that took a 608
    by hand and held it inverted. No need to reprint it; the middle hole is always
    the value now set as socket_d.'
