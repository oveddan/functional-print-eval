task: bearing-wheel
note: 'Revised. Changes from the last version: (1) one shared param, spacer_len, now
  drives both the wheel''s internal shoulder width and the length of all three rings
  (they must match exactly, or tightening the nut will crush the bearings); (2) added
  an optional rim groove param (groove_r, currently 0 = flat rim) so a rail-riding
  rim can be switched on without a redesign; (3) print settings and pressing advice
  added. Everything else checked out.


  HOW IT WORKS: 50 x 16 mm wheel, a 608ZZ pressed into a socket in each face, both
  bearings bottoming on a 2 mm internal shoulder so each ends up flush with its face.
  The M8 bolt is the axle. Three identical printed rings (Ã¸12 x 2, bore 8.4) sit
  on the bolt: one between the two bearing inner rings, one on each outside face.
  The stack from the bolt head is plate -> ring -> wheel -> ring -> lock nut. Clamping
  the nut squeezes the inner rings together through the spacer ring, so the bolt and
  all three rings are locked to the door and only the balls rotate - nothing stationary
  touches the spinning wheel, and no washer or nut can reach a bearing shield, because
  the rings are 0.7 mm smaller than the 608 inner-ring OD (12.7).


  KEY CLEARANCES: shoulder bore Ã¸14 clears the inner ring by 1.3 mm, so the shoulder
  touches only the rotating outer rings. Outer rings stand 2 mm proud of each wheel
  face, so the hanger plate clears the wheel by 2 mm. Socket is Ã¸21.9 (0.1 mm interference
  on a 22.000/-0.008 bearing); gauge this with the coupon before printing the wheel,
  and change the single number socket_d if your printer needs it.


  ASSUMPTIONS I COULD NOT CONFIRM (asked twice, not measurable): hanger plate ~3 mm
  thick, and an ISO 4762 M8x35 bolt (catalog). Stack needs plate + 2x2 + 16 + 8 =
  31 mm, so the M8x35 leaves 4 mm of thread past the lock nut. If the plate is over
  ~5 mm, use the plain ISO 4032 M8 nut (6.8 mm) instead, or a 40 mm bolt, or trim
  yours. Check step 8 before assembling.


  KNOWN LIMITS: an M8x35 has only ~7 mm of unthreaded shank, so the bearing bores
  sit on thread crests. It still works (the inner rings never rotate on the bolt)
  but adds a little radial play; if you want it gone, use an ISO 4762 M8x50 (22 mm
  of plain shank, and trim its threaded end to ~32 mm). Also, the whole assembly needs
  about 28 mm of clear depth from the plate''s inner face to the end of the lock nut,
  plus the plate and bolt head on the other side - check it fits the door''s routing.


  THE RIM: currently flat with a 1.5 mm roundover. If your track is a raised rail
  and the old wheel had a groove that rode on it, set groove_r = 2.0 (4 mm wide, 2
  mm deep round groove) and re-slice. If you are not sure, check the old wheel: a
  flat wheel sits flat on a tabletop, a grooved one rocks on two shoulders.'
questions:
- text: How long is your own M8 bolt from under the head to the tip? The stack needs
    31 mm (3 mm plate + 2 + 16 + 2 + 8 lock nut); the catalog M8x35 leaves 4 mm spare,
    so anything from 33 to 45 mm works.
  answer: null
- text: How thick is the hanger plate at the wheel? Above about 5 mm, swap the lock
    nut for the shorter ISO 4032 M8 nut (6.8 mm) or use a 40 mm bolt.
  answer: null
- text: Is the track a flat strip or a raised rail? The rim is flat with a rounded
    edge now. If the old wheel has a groove (a flat wheel sits flat on a tabletop,
    a grooved one rocks on two shoulders), set groove_r = 2.0 and re-slice.
  answer: null
- text: Is there about 28 mm of clear depth behind the hanger plate (plus the plate
    and bolt head on the other side) for the roller stack? If the door's routing is
    shallower, tell me and I will narrow the wheel and drop the outer rings.
  answer: null
- text: How many rollers does the door have? Two bearings are used per wheel and you
    have two, so if both rollers are worn you will need two more 608s.
  answer: null
params:
  wheel_od:
    value: 50.0
    unit: mm
    kind: world
    source: asked
    note: old wheel measured about 50 mm across (the user's own figure)
  wheel_w:
    value: 16.0
    unit: mm
    kind: world
    source: asked
    note: old wheel about 16 mm wide; kept equal to 2 x bearing_w + spacer_len
  bearing_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: measured
    note: 608ZZ OD; user measured about 22 mm, datasheet 22.000 -0.008
  bearing_w:
    value: 7.0
    unit: mm
    kind: hardware
    source: measured
    note: 608ZZ width; user measured about 7 mm
  bearing_bore:
    value: 8.0
    unit: mm
    kind: hardware
    source: measured
    note: 608ZZ bore; user measured about 8 mm
  bearing_inner_ring_od:
    value: 12.7
    unit: mm
    kind: hardware
    source: guessed
    note: typical 608 inner-ring OD; not in the supplied data. The shoulder bore and
      the printed rings are both sized from it so that neither can rub a shield.
  bolt_shank_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: measured
    note: user measured the M8 shank at about 8 mm
  bolt_len:
    value: 35.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8x35; shortest catalog bolt that spans plate + ring + wheel +
      ring + lock nut
  nut_h:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 lock nut height (the ISO 4032 M8 hex nut is 6.8 if you need
      the extra 1.2 mm)
  spacer_len:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: 'ONE number with three jobs: the wheel''s internal shoulder width, the length
      of all three printed rings, and the standoff of each outer ring from the wheel
      face. It must stay equal in both parts, or the nut will squeeze the bearings
      by the difference.'
  shoulder_bore_d:
    value: 14.0
    unit: mm
    kind: design
    source: design
    note: central bore through the shoulder, clearing the 608 inner ring (12.7) by
      1.3 mm so the shoulder touches only the outer rings
  socket_d:
    value: 21.9
    unit: mm
    kind: design
    source: design
    note: printed bearing socket, 0.1 mm interference on the 22.000/-0.008 bearing.
      Confirm on the coupon and change this one number if your printer needs to.
  lead_d:
    value: 22.9
    unit: mm
    kind: design
    source: design
    note: lead-in counterbore at each face so a bearing can be started square and
      a ring can sit in it
  lead_t:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: depth of the lead-in counterbore
  rim_round:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: roundover on the two rim edges; the rim between them is left cylindrical
      (flat)
  groove_r:
    value: 0.0
    unit: mm
    kind: design
    source: design
    note: 0 = flat rim. Set to 2.0 to cut a 4 mm wide, 2 mm deep round groove for
      a raised track rail.
  ring_od:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: smaller than the 608 inner-ring OD (12.7), so each ring presses the inner
      ring only and misses the shield; the nut and bolt head both land on the ring,
      not the bearing
  ring_id:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: clears the M8 shank by 0.4 mm
  plate_t:
    value: 3.0
    unit: mm
    kind: world
    source: guessed
    note: hanger plate thickness; the user could not measure it. Every extra 1 mm
      eats 1 mm of the M8x35's 4 mm of margin past the lock nut.
  plate_hole_d:
    value: 9.0
    unit: mm
    kind: world
    source: guessed
    note: hole the bolt passes through in the door's hanger plate - a standard M8
      clearance hole. If yours is smaller, drill it to 9 mm.
parts:
- id: wheel
  role: final
  material: PLA (high-speed, black), 0.4 mm nozzle, 0.2 mm layers, 4 perimeters, 40%
    infill
  code: "import cadquery as cq\n\n\ndef build(p):\n    R = p.wheel_od / 2.0      \
    \        # 25\n    W = p.wheel_w                     # 16\n    bz = p.bearing_w\
    \                  # 7\n    sw = p.spacer_len                 # 2  (shoulder width\
    \ = gap between inner rings)\n    sock_r = p.socket_d / 2.0         # 10.95\n\
    \    lead_r = p.lead_d / 2.0           # 11.45\n    sho_r = p.shoulder_bore_d\
    \ / 2.0   # 7\n    rr = p.rim_round                  # 1.5\n\n    # tyre: full\
    \ disc, axis vertical, rim edges rounded\n    w = cq.Workplane(\"XY\").circle(R).extrude(W)\n\
    \    w = w.faces(\">Z\").edges(\"%CIRCLE\").fillet(rr)\n    w = w.faces(\"<Z\"\
    ).edges(\"%CIRCLE\").fillet(rr)\n\n    # bearing sockets, one from each face,\
    \ both ending on the shoulder\n    w = w.cut(cq.Workplane(\"XY\").circle(sock_r).extrude(bz\
    \ + 0.1))\n    w = w.cut(cq.Workplane(\"XY\").workplane(offset=bz + sw).circle(sock_r).extrude(bz\
    \ + 1.0))\n\n    # lead-in counterbores so a bearing can be started square\n \
    \   w = w.cut(cq.Workplane(\"XY\").workplane(offset=-0.5).circle(lead_r).extrude(p.lead_t\
    \ + 0.5))\n    w = w.cut(cq.Workplane(\"XY\").workplane(offset=W - p.lead_t).circle(lead_r).extrude(p.lead_t\
    \ + 0.5))\n\n    # shoulder bore: clears the 608 inner ring, so only the outer\
    \ rings seat on the shoulder\n    w = w.cut(cq.Workplane(\"XY\").workplane(offset=bz\
    \ - 1.0).circle(sho_r).extrude(sw + 2.0))\n\n    # optional rolling groove for\
    \ a raised track rail (groove_r = 0 leaves a flat rim)\n    if p.groove_r > 0.0:\n\
    \        torus = (cq.Workplane(\"XZ\").moveTo(R, W / 2.0)\n                 .circle(p.groove_r).revolve(360,\
    \ (0, 0, 0), (0, 0, 1)))\n        w = w.cut(torus)\n\n    return w\n"
  print_orientation: 'As modelled: flat, wheel axis vertical, z = 0 on the bed. Both
    bearing sockets print as vertical round bores, which is the orientation the coupon
    gauges. Nothing overhangs except the 4 mm internal shoulder, which bridges inward
    from the socket wall.'
  use_orientation: Wheel axis horizontal, on the M8 bolt as its axle, rim on the door
    track. The M8 bolt passes through the two 608 inner rings; the wheel turns on
    the bearing outer rings.
- id: ring
  role: final
  material: PLA (high-speed, black), 0.4 mm nozzle, 0.2 mm layers. Print 3 per wheel
    - all three are identical.
  code: "import cadquery as cq\n\n\ndef build(p):\n    od = p.ring_od / 2.0\n    idr\
    \ = p.ring_id / 2.0\n    t = p.spacer_len\n    r = cq.Workplane(\"XY\").circle(od).extrude(t)\n\
    \    r = r.cut(cq.Workplane(\"XY\").circle(idr).extrude(t))\n    return r\n"
  print_orientation: 'As modelled: flat, ring axis vertical, z = 0 on the bed.'
  use_orientation: Slides on the M8 bolt. One goes between the two 608 inner rings
    (inside the wheel's Ã¸14 shoulder bore) and one goes against each outside bearing
    face - those two press the inner rings, and keep the hanger plate and the lock
    nut off the bearing shields.
- id: coupon
  role: coupon
  material: PLA (high-speed, black), 0.4 mm nozzle, 0.2 mm layers - same filament,
    layer height and slicer settings as the wheel
  code: "import cadquery as cq\n\n\ndef build(p):\n    L, Wd, H = 140.0, 32.0, 12.0\n\
    \    ds = [p.socket_d - 0.30, p.socket_d - 0.15, p.socket_d,\n          p.socket_d\
    \ + 0.15, p.socket_d + 0.30]\n    xs = [16.0, 43.0, 70.0, 97.0, 124.0]\n    body\
    \ = cq.Workplane(\"XY\").box(L, Wd, H, centered=(False, True, False))\n    for\
    \ x, d in zip(xs, ds):\n        body = body.cut(cq.Workplane(\"XY\").center(x,\
    \ 0.0).circle(d / 2.0).extrude(H + 1.0))\n    return body\n"
  print_orientation: 'As modelled: flat, holes vertical - the same orientation as
    the wheel''s bearing sockets.'
  use_orientation: Not part of the door. Press a 608 into each of the five holes and
    pick the one that holds it firmly. Left to right the holes are socket_d - 0.30,
    -0.15, 0, +0.15 and +0.30, i.e. 21.60, 21.75, 21.90, 22.05 and 22.20 as supplied.
