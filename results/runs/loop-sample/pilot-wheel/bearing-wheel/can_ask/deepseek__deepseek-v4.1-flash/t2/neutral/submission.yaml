criteria:
- id: c_press
  part: wheel
  feature: bearing socket, both faces (Ã¸socket_d x bearing_w deep)
  relation: contains
  hardware: bearing
  clearance_mm: -0.1
  params:
  - socket_d
  - bearing_od
  - bearing_w
  check:
    method: coupon
    ref: coupon
    description: Negative clearance = press fit. Print the coupon, press a 608 into
      each hole, and set socket_d to the best-fitting hole if it is not Ã¸21.9.
- id: c_width
  part: wheel
  feature: overall width across the two bearing sockets
  relation: supports
  hardware: bearing
  clearance_mm: null
  params:
  - wheel_w
  - bearing_w
  - spacer_len
  check:
    method: none
    ref: null
    description: wheel_w = 2 x bearing_w + spacer_len = 16.0, so each bearing seats
      on the shoulder and finishes flush with its face.
- id: c_shoulder
  part: wheel
  feature: internal shoulder, 2 mm wide, between the two sockets
  relation: seats
  hardware: bearing
  clearance_mm: null
  params:
  - spacer_len
  - bearing_w
  check:
    method: measure
    ref: null
    description: Both outer rings butt this shoulder; press each bearing until it
      bottoms, which is flush with its face.
- id: c_shoulder_clear
  part: wheel
  feature: shoulder bore Ã¸14
  relation: clears
  hardware: bearing
  clearance_mm: 1.3
  params:
  - shoulder_bore_d
  - bearing_inner_ring_od
  check:
    method: none
    ref: null
    description: 1.3 mm larger than the 608 inner-ring OD, so the shoulder touches
      only the rotating outer rings.
- id: c_spacer
  part: ring
  feature: end faces, length = spacer_len
  relation: faces
  hardware: bearing
  clearance_mm: 0.0
  params:
  - spacer_len
  check:
    method: measure
    ref: null
    description: The middle ring fills the 2 mm gap between the two inner rings exactly;
      if it is too long the nut strains the bearings, if it is short the nut preloads
      them. It uses the same number as the wheel's shoulder.
- id: c_ring_seat
  part: ring
  feature: Ã¸12 face
  relation: seats
  hardware: bearing
  clearance_mm: 0.7
  params:
  - ring_od
  - bearing_inner_ring_od
  check:
    method: none
    ref: null
    description: The ring is 0.7 mm smaller than the inner-ring OD, so it presses
      the inner ring only and never the shield; the nut (13 A/F) and the bolt head
      (Ã¸13) both land on the ring, not the bearing.
- id: c_ring_bore
  part: ring
  feature: bore Ã¸8.4
  relation: clears
  hardware: bolt
  clearance_mm: 0.4
  params:
  - ring_id
  - bolt_shank_d
  check:
    method: measure
    ref: null
    description: All three rings must slide onto the bolt's shank with a little play
      before assembly.
- id: c_plate_clear
  part: wheel
  feature: outer face at z = 0
  relation: clears
  hardware: null
  clearance_mm: 2.0
  params:
  - spacer_len
  - plate_t
  check:
    method: measure
    ref: null
    description: Outer ring A stands 2 mm proud, so the stationary hanger plate clears
      the spinning wheel by 2 mm once the stack is snug.
- id: c_bolt_reach
  part: ring
  feature: outer face at z = 18, the lock nut's seat
  relation: engages
  hardware: bolt
  clearance_mm: null
  params:
  - bolt_len
  - plate_t
  - spacer_len
  - wheel_w
  - nut_h
  check:
    method: measure
    ref: null
    description: Needs bolt_len >= plate_t + 2 x spacer_len + wheel_w + nut_h = 31
      mm; the M8x35 leaves 4 mm of thread past the lock nut. Check your own bolt against
      this before assembling.
manual:
- n: '1'
  text: Print the coupon in PLA with the same filament, layer height and slicer settings
    you will use for the wheel (flat, as modelled). Press one 608ZZ bearing into each
    of the five holes by hand or in a vice - they are through-holes, so push each
    one back out from underneath. Pick the hole that holds the bearing firmly with
    no rock but can still be pressed in by hand. Left to right the holes are Ã¸21.60,
    21.75, 21.90, 22.05 and 22.20. If the best one is not the middle (21.90), set
    socket_d to that diameter before slicing the wheel.
  parts:
  - coupon
  hardware:
  - bearing
  tool: vice
- n: '2'
  text: Print the wheel flat, as modelled, with 4 perimeters and about 40% infill.
    Print one wheel for every roller you are replacing - the one that snapped, and
    its partner on the other side of the door if it is worn (two bearings per wheel).
  parts:
  - wheel
  hardware: []
  tool: null
- n: '3'
  text: 'Print three rings per wheel. They are identical: two go on the outside faces
    and one goes in the middle.'
  parts:
  - ring
  hardware: []
  tool: null
- n: '4'
  text: Press one bearing into one face of the wheel and one into the other face,
    from opposite sides. Press on the OUTER ring face, or support the wheel on a flat
    offcut and press on the whole bearing - do not press on the inner ring of a bearing
    that is still in the air, that loads the balls. Each bearing bottoms out on the
    internal shoulder, so it should finish flush with the wheel face. A bolt, two
    nuts and a washer through the bore also works as a press if they are tight.
  parts:
  - wheel
  hardware:
  - bearing
  - bolt
  - nut
  tool: vice or an M8 bolt used as a press
- n: '5'
  text: Drop one ring into the middle of the wheel so it sits in the Ã¸14 bore between
    the two bearing inner rings. It should fill that gap with no rattle - that gap
    is what stops the nut from squeezing the bearings.
  parts:
  - wheel
  - ring
  hardware: []
  tool: null
- n: '6'
  text: 'Bench spin test: slide the bolt through the stack of inner rings and turn
    the wheel. It must spin freely with no scraping, no rocking and no grit.'
  parts:
  - wheel
  - ring
  hardware:
  - bolt
  - bearing
  tool: ''
- n: '7'
  text: 'On the door: pass the M8x35 bolt through the axle hole in the hanger plate
    from the outside, then slide on one ring, then the wheel assembly, then the second
    ring, then spin on the lock nut. Order from the bolt head: plate, ring, wheel,
    ring, lock nut. If the plate''s hole is smaller than Ã¸8.4, drill it to 9 mm first;
    if the old wheel sat on a welded pin rather than a hole, cut the pin off and drill
    a Ã¸9 hole where it was.'
  parts:
  - wheel
  - ring
  hardware:
  - bolt
  - nut
  tool: drill (only if the plate has no Ã¸9 hole)
- n: '8'
  text: 'Tighten the lock nut snugly - just until the stack stops rattling, about
    1 Nm. The clamp runs head-to-plate-to-ring-to-inner ring-to-middle ring-to-inner
    ring-to-ring-to-nut, so the bolt is locked to the door and the wheel turns only
    on the balls. Do not over-tighten: the rings are PLA and too much preload will
    make the wheel stiff. If the plate is thicker than about 5 mm the M8x35 will not
    reach, so swap in the ISO 4032 M8 hex nut (6.8 mm tall) or use a 40 mm bolt.'
  parts:
  - wheel
  - ring
  hardware:
  - bolt
  - nut
  - nut_alt
  tool: 6 mm hex key and 13 mm spanner
- n: '9'
  text: 'Check the finished joint: with the nut snug the wheel must spin freely by
    hand, and its face must clear the hanger plate by about 2 mm (that is what the
    outer rings are for). Feel for anything dragging - a rub here means the rings
    are missing or a bearing is not seated on the shoulder.'
  parts:
  - wheel
  - ring
  hardware:
  - bolt
  - nut
  tool: ''
- n: '10'
  text: Refit the door on the track. The rim as supplied is flat with a rounded edge
    and runs on a flat track or a rail. If the old wheel had a groove that rode on
    a raised rail, set groove_r = 2.0 and re-print the wheel; if the old wheel sits
    flat on a tabletop, keep it flat as is. Roll the door its full length and check
    it runs smoothly and the bolt end and plate foul nothing.
  parts:
  - wheel
  hardware: []
  tool: null
