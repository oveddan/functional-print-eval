task: bearing-wheel
note: 'REVISED. One replacement roller wheel: a Ø50 x 16 mm printed wheel whose bore
  carries both of your 608ZZ bearings (they come out back to back, separated by the
  2 mm web that also stops them at the right depth), spinning on an M8 bolt that is
  clamped to the door''s existing bracket by an M8 washer and a nylon-insert lock
  nut. Two printed axle rings sit between the bracket/washers and the bearings; at
  10.8 mm across they land only on the 608''s inner ring, never on the shield or the
  balls, and they hold the spinning rim 2.5 mm clear of the plate and the washer either
  side.


  Changes since the last version: (1) press-fit bore 21.85 -> 21.95, because a 22
  mm vertical hole on an X1C typically prints 0.1-0.2 mm undersize and I do not want
  you hammering a bearing into a brittle rim; (2) the fit coupon now brackets that
  in both directions (21.85 / 21.95 / 22.05 / 22.15) so you can pick the firm-push
  bore for YOUR printer and set wheel_bearing_bore_d to it before slicing the wheel;
  (3) spacer ring OD 11.0 -> 10.8 for more clearance to the inner-ring shoulder, with
  a note to sand it down if your bearings are the narrow-shoulder kind; (4) manual
  now says to print the coupon with the same filament/profile as the wheel, gives
  the "the wheel grips harder than the coupon" rule, and covers the bolt head and
  the bolt end standing proud.


  Assumptions I could not measure and could not verify: flat 16 mm tread (if your
  old tyre had a groove, set tread_groove_w = rail width + 0.5 and tread_groove_d
  = 3 and reprint just the wheel), a 3 mm bracket plate, and an axle bolt with at
  least 35 mm under the head (ISO 4762 M8x40 covers plates up to ~6 mm; your own M8
  bolt is fine if it is that long, and better if its head is lower than a socket head''s
  8 mm). Tighten the lock nut snug, not hard — the clamp load passes through the printed
  web and the two rings.'
questions:
- text: Is the old wheel's running surface flat, or does it have a groove down the
    middle for a raised rail? I assumed flat - if it was grooved, tell me the rail's
    width and I will set tread_groove_w / tread_groove_d so you reprint just the wheel.
  answer: null
- text: How long is your own M8 bolt under the head? The axle stack needs at least
    35 mm with a 3 mm bracket; shorter than that and you want an ISO 4762 M8x40, longer
    just stands proud of the lock nut.
  answer: null
- text: How thick is the bracket plate the axle passes through, and how big is its
    axle hole? I assumed 3 mm and that it will clear 8.4 mm for the M8 bolt.
  answer: null
- text: How wide is the 608's inner-ring face (the small ring around the 8 mm bore)?
    It needs to be at least 11.2 mm across for the 10.8 mm spacer rings to sit on
    it; narrower and you should sand the rings down.
  answer: null
params:
  axle_stack_len:
    value: 35.2
    unit: mm
    kind: design
    source: design
    note: 'washer + bracket + ring + wheel (16) + ring + washer + lock nut, measured
      from under the head, with a 3 mm bracket: the bolt needs at least this much
      length under the head'
  bolt_d:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8 shank; it passes through both bearings, so the inner rings need
      clamping to stop them spinning on it
  bolt_head_d:
    value: 13.0
    unit: mm
    kind: hardware
    source: catalog
    note: socket head diameter; the head presses the M8 washer, which presses the
      bracket, which presses the axle ring
  bolt_head_h:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: socket head height - it stands 8 mm plus the 1.6 mm washer off the outside
      of the bracket; if that fouls the track or the frame, use your own lower-head
      M8 bolt
  bolt_len:
    value: 40.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8x40 axle bolt; covers bracket plates from ~0 to 6 mm, roughly
      5 mm of it ends up proud of the lock nut
  bolt_thread_len:
    value: 28.0
    unit: mm
    kind: hardware
    source: catalog
    note: thread length from the tip on an M8x40 (M8 is threaded to the head up to
      35 mm); the lock nut sits well inside it
  bracket_hole_d:
    value: 9.0
    unit: mm
    kind: world
    source: guessed
    note: axle hole in the existing bracket; must clear 8.4 mm for the M8 bolt - ream
      it out if it is smaller
  bracket_t:
    value: 3.0
    unit: mm
    kind: world
    source: guessed
    note: thickness of the plate the axle passes through - could not be measured,
      assumed 3 mm; this is what sets the required axle bolt length
  brg_bore:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ bore 8.000 - the M8 shank runs through both bearings
  brg_inner_ring_od:
    value: 11.6
    unit: mm
    kind: hardware
    source: guessed
    note: 'typical 608 inner-ring shoulder across the face; the axle ring must sit
      inside it (criterion: measure it - needs to be at least 11.2 mm across)'
  brg_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ outside diameter 22.000 (you measured 'about 22')
  brg_w:
    value: 7.0
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ width 7.000 - sets the bearing seat depth, so a bearing pressed until
      it bottoms on the web ends up flush with the wheel face
  coupon_a:
    value: 21.85
    unit: mm
    kind: design
    source: design
    note: fit coupon bore, 1 dot - tight
  coupon_b:
    value: 21.95
    unit: mm
    kind: design
    source: design
    note: fit coupon bore, 2 dots - the value the wheel is drawn with
  coupon_c:
    value: 22.05
    unit: mm
    kind: design
    source: design
    note: fit coupon bore, 3 dots
  coupon_d:
    value: 22.15
    unit: mm
    kind: design
    source: design
    note: fit coupon bore, 4 dots - loose
  edge_chamfer:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: 0.6 mm lead-in chamfer at both bearing seat mouths, and the same ease on
      the two tread edges
  locknut_h:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 nylon-insert lock nut height (AF 13); its nylon insert keeps
      the preload from backing off
  ring_id:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: matches the ISO 7089 M8 washer bore (0.4 mm clearance on the 8 mm shank)
  ring_od:
    value: 10.8
    unit: mm
    kind: design
    source: design
    note: 'axle ring OD, 0.8 mm inside the 608 inner-ring shoulder: it can only land
      on the inner ring, never on the shield or the balls. Sand it smaller if your
      bearings have a narrow shoulder'
  ring_t:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: 'axle ring thickness = rim-to-plate clearance: with the bearings flush with
      the wheel faces the ring stands 2.5 mm proud of the rim'
  seat_depth:
    value: 7.0
    unit: mm
    kind: design
    source: design
    note: = the 608 width, so each bearing presses in until it bottoms on the web
      and its face ends up flush with the wheel face; leaves a 2 mm web (wheel_w -
      2 x seat_depth)
  tread_groove_d:
    value: 0.0
    unit: mm
    kind: design
    source: design
    note: 0 = flat tread; set to about 3 together with tread_groove_w if the wheel
      has to run on a raised rail
  tread_groove_w:
    value: 0.0
    unit: mm
    kind: design
    source: design
    note: 0 = flat tread (assumed - the old tyre could not be measured); set to rail
      width + 0.5 for a grooved tyre
  washer_id:
    value: 8.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 washer bore
  washer_od:
    value: 16.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 washer outside diameter, wide enough to cover the 10.8 mm axle
      ring
  washer_t:
    value: 1.6
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M8 washer thickness; one under the head, one under the lock nut
  web_bore_d:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: bolt clearance hole through the 2 mm web (web thickness = wheel_w - 2 x
      seat_depth = 2.0)
  wheel_bearing_bore_d:
    value: 21.95
    unit: mm
    kind: design
    source: design
    note: 0.05 mm interference on the 22.000 bearing OD as drawn; a 22 mm vertical
      hole normally prints 0.1-0.2 mm undersize, so real interference is 0.1-0.2 mm.
      Set this to your best coupon bore before slicing
  wheel_od:
    value: 50.0
    unit: mm
    kind: world
    source: asked
    note: your old wheel was 'about 50 mm across'; keeping it keeps the door at the
      same height above the track
  wheel_w:
    value: 16.0
    unit: mm
    kind: world
    source: asked
    note: your old wheel was 'about 16 mm wide'; two 608ZZ (14 mm) plus a 2 mm web
      fits inside it
parts:
- id: wheel
  role: final
  material: PLA (high-speed black)
  code: "import cadquery as cq\n\n\ndef build(p):\n    od = p.wheel_od\n    h = p.wheel_w\n\
    \    sd = p.seat_depth\n    bd = p.wheel_bearing_bore_d\n    c = p.edge_chamfer\n\
    \n    body = cq.Workplane(\"XY\").circle(od / 2).extrude(h)\n\n    # one bearing\
    \ seat cut from each face; the web left between them is the depth stop\n    body\
    \ = body.cut(cq.Workplane(\"XY\").circle(bd / 2).extrude(sd))\n    body = body.cut(\n\
    \        cq.Workplane(\"XY\", origin=(0, 0, h - sd)).circle(bd / 2).extrude(sd)\n\
    \    )\n\n    # bolt clearance hole through the central web\n    body = body.cut(\n\
    \        cq.Workplane(\"XY\", origin=(0, 0, sd))\n        .circle(p.web_bore_d\
    \ / 2)\n        .extrude(h - 2 * sd)\n    )\n\n    # lead-in chamfers at the two\
    \ bearing seat mouths\n    r = bd / 2\n    body = body.cut(cq.Workplane(obj=cq.Solid.makeCone(r\
    \ + c, r, c, cq.Vector(0, 0, 0))))\n    body = body.cut(\n        cq.Workplane(obj=cq.Solid.makeCone(r,\
    \ r + c, c, cq.Vector(0, 0, h - c)))\n    )\n\n    # optional tread groove (skipped\
    \ while tread_groove_d == 0, i.e. flat tread)\n    if p.tread_groove_d > 0 and\
    \ p.tread_groove_w > 0:\n        zi = h / 2 - p.tread_groove_w / 2\n        zo\
    \ = h / 2 + p.tread_groove_w / 2\n        rin = od / 2 - p.tread_groove_d\n  \
    \      rout = od / 2 + 1\n        prof = (\n            cq.Workplane(\"XZ\")\n\
    \            .moveTo(rin, zi)\n            .lineTo(rout, zi)\n            .lineTo(rout,\
    \ zo)\n            .lineTo(rin, zo)\n            .close()\n            .revolve(360,\
    \ (0, 0, 0), (0, 0, 1))\n        )\n        body = body.cut(prof)\n\n    # ease\
    \ the tread edges so the rim does not catch on the track\n    try:\n        body\
    \ = body.edges(cq.selectors.NearestToPointSelector((od / 2, 0, 0))).chamfer(c)\n\
    \        body = body.edges(cq.selectors.NearestToPointSelector((od / 2, 0, h))).chamfer(c)\n\
    \    except Exception:\n        pass\n\n    return body\n"
  print_orientation: 'flat on one rim face: the wheel''s axis is vertical (Z), z =
    0 is the lower rim face, the bearing pockets open up and down. No supports. The
    only bridge is the 6.7 mm ring that becomes the central web, which is well inside
    your printer''s 50 mm.'
  use_orientation: 'axis horizontal, perpendicular to the door: the lower face (as
    printed) faces the bracket plate, the upper face faces the nut; the tread runs
    on the track. Either face can face the bracket - the wheel is symmetric.'
- id: axle_ring
  role: final
  material: PLA (high-speed black)
  code: "import cadquery as cq\n\n\ndef build(p):\n    ring = cq.Workplane(\"XY\"\
    ).circle(p.ring_od / 2).extrude(p.ring_t)\n    return ring.cut(cq.Workplane(\"\
    XY\").circle(p.ring_id / 2).extrude(p.ring_t))\n"
  print_orientation: 'flat on the bed: one ring face on the bed, axis vertical (Z),
    so the ring''s faces print flat and take the clamp load straight down the layers.
    Print 2 identical rings.'
  use_orientation: 'axis horizontal, coaxial with the M8 bolt: one ring between the
    bracket plate and the near bearing''s inner ring, the other between the far bearing''s
    inner ring and the nut-side washer. The two faces are identical (it is a flat
    annulus), so it cannot go in the wrong way round.'
- id: fit_coupon
  role: coupon
  material: PLA (high-speed black)
  code: "import cadquery as cq\n\n\ndef build(p):\n    bores = [p.coupon_a, p.coupon_b,\
    \ p.coupon_c, p.coupon_d]\n    t = p.seat_depth  # same depth as the wheel's bearing\
    \ seats\n    pitch = 30.0\n    w = 38.0\n    length = pitch * (len(bores) - 1)\
    \ + w\n\n    plate = cq.Workplane(\"XY\").box(length, w, t).translate((0, 0, t\
    \ / 2))\n    x0 = -pitch * (len(bores) - 1) / 2\n    for i, d in enumerate(bores):\n\
    \        x = x0 + i * pitch\n        plate = plate.cut(cq.Workplane(\"XY\").moveTo(x,\
    \ 0).circle(d / 2).extrude(t))\n        # dots mark the bore: 1 dot = smallest\
    \ (21.85) ... 4 dots = largest (22.15)\n        for k in range(i + 1):\n     \
    \       plate = plate.cut(\n                cq.Workplane(\"XY\")\n           \
    \     .moveTo(x - 6 + 4 * k, -15)\n                .circle(0.9)\n            \
    \    .extrude(t)\n            )\n    return plate\n"
  print_orientation: 'flat on the bed: bores vertical (Z), 7 mm deep, printed the
    same way as the wheel''s seats but with 8 mm walls instead of 14 mm.'
  use_orientation: 'a test piece only: press a 608ZZ into each bore, 1 dot (21.85)
    to 4 dots (22.15), and pick the firm push fit.'
