- id: brg
  ref: 608ZZ
  qty: 2
- id: axle_bolt
  ref: ISO 4762 M8x40
  qty: 1
- id: washer_head
  ref: ISO 7089 M8
  qty: 1
- id: washer_nut
  ref: ISO 7089 M8
  qty: 1
- id: locknut
  ref: ISO 10511 M8
  qty: 1
joints:
- id: axle
  fastener: axle_bolt
  axis_origin:
  - 0.0
  - 0.0
  - -4.6
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: axle_ring
    feature: shoulder_face_a
    role: head_seat
  - part: wheel
    feature: web_bore
    role: clearance
  - part: axle_ring
    feature: shoulder_face_b
    role: washer
  nut: locknut
  external: null
criteria:
- id: bearing_press_fit
  part: wheel
  feature: bearing_seat
  relation: seats
  hardware: brg
  clearance_mm: -0.05
  params:
  - wheel_bearing_bore_d
  - brg_od
  - seat_depth
  check:
    method: coupon
    ref: fit_coupon
    description: press a 608ZZ into each coupon bore (1 dot 21.85, 2 dots 21.95, 3
      dots 22.05, 4 dots 22.15) with the same filament and profile as the wheel. The
      wheel is drawn at 21.95 (2 dots); set wheel_bearing_bore_d to whichever bore
      gives a firm, straight push that grips, then re-slice the wheel. The coupon's
      walls are thinner than the wheel's, so the same bore grips harder in the wheel
      - if two bores both feel right, take the larger.
- id: web_stops_bearings
  part: wheel
  feature: web_face
  relation: supports
  hardware: brg
  clearance_mm: 0.0
  params:
  - wheel_w
  - seat_depth
  - brg_w
  - web_bore_d
  check:
    method: none
    ref: null
    description: each bearing is pressed in from its own face until it bottoms on
      the 2 mm web; because seat_depth equals the 608 width, that lands each bearing
      flush with the wheel face and at the right depth for the spacer rings
- id: web_bore_clears_bolt
  part: wheel
  feature: web_bore
  relation: clears
  hardware: axle_bolt
  clearance_mm: 0.4
  params:
  - web_bore_d
  - bolt_d
  check:
    method: none
    ref: null
    description: the 8.4 mm web hole clears the 8 mm shank; the web is 2 mm thick
      (= wheel_w - 2 x seat_depth) and its ring spans 6.7 mm radially, a plain circular
      bridge when printed
- id: ring_bore_clears_bolt
  part: axle_ring
  feature: bolt_bore
  relation: clears
  hardware: axle_bolt
  clearance_mm: 0.4
  params:
  - ring_id
  - bolt_d
  check:
    method: none
    ref: null
    description: the ring slides onto the shank and is clamped between the washer
      (head side) or washer and lock nut (nut side) and the bearing face
- id: ring_presses_inner_ring_only
  part: axle_ring
  feature: shoulder_face_a
  relation: seats
  hardware: brg
  clearance_mm: 0.8
  params:
  - ring_od
  - brg_inner_ring_od
  check:
    method: measure
    ref: null
    description: 'measure across the 608''s inner-ring face (the ring around the 8
      mm bore): it needs to be at least 11.2 mm across so the 10.8 mm ring lands on
      the inner ring and can never rub the shield or the balls. If your bearings are
      narrower there, sand the ring''s OD down until it clears.'
- id: rim_clearance
  part: wheel
  feature: side_face
  relation: clears
  hardware: null
  clearance_mm: 2.5
  params:
  - ring_t
  - seat_depth
  - brg_w
  check:
    method: none
    ref: null
    description: with the bearings flush with the wheel faces the ring reaches 2.5
      mm past the rim, so with the bearings clamped the bracket plate and the nut-side
      washer stay 2.5 mm clear of the spinning rim
- id: axle_length
  part: axle_ring
  feature: shoulder_face_b
  relation: engages
  hardware: axle_bolt
  clearance_mm: null
  params:
  - axle_stack_len
  - bolt_len
  - bolt_thread_len
  - bracket_t
  - locknut_h
  check:
    method: none
    ref: null
    description: with a 3 mm bracket the clamped stack is 35.2 mm from under the head,
      so the lock nut is fully inside the M8x40's thread with ~5 mm to spare; plates
      up to ~6 mm work, thicker ones need M8x45
- id: tread_matches_track
  part: wheel
  feature: tread
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - wheel_od
  - wheel_w
  - tread_groove_w
  - tread_groove_d
  check:
    method: none
    ref: null
    description: 'assumed flat: 16 mm wide and 50 mm across, the same as the old wheel.
      If the old tyre had a groove for a raised rail, set tread_groove_w = rail width
      + 0.5 and tread_groove_d = 3 and reprint just the wheel.'
manual:
- n: '1'
  text: 'Print the fit coupon flat on the bed, with the same printer, filament and
    profile you will use for the wheel (PLA, 0.2 mm layers, 4 perimeters). Press one
    608ZZ into each bore, smallest end first: 1 dot = 21.85, 2 dots = 21.95, 3 dots
    = 22.05, 4 dots = 22.15. Pick the bore that takes a firm, straight push and grips
    - not a drop-in, not a hammer job, and nothing that cracks the plastic. The wheel
    is drawn at 21.95 (2 dots). The coupon''s walls are thinner than the wheel''s,
    so the same bore grips a little harder in the wheel: if two bores both feel acceptable,
    take the larger one. If your best bore is not 21.95, set wheel_bearing_bore_d
    to it and re-slice before printing the wheel.'
  parts:
  - fit_coupon
  hardware:
  - brg
  tool: vise or soft mallet
- n: '2'
  text: Print the wheel flat on one rim face - both bearing pockets open up and down
    - PLA, 0.2 mm layers, 4 perimeters, no supports. Nothing overhangs except the
    small ring that becomes the web, so it is a clean print. If the coupon gave you
    a different bore, change wheel_bearing_bore_d first.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '3'
  text: Print the axle ring twice, flat on the bed, PLA, 0.2 mm layers, 4 perimeters.
    The two rings are identical.
  parts:
  - axle_ring
  hardware: []
  tool: null
- n: '4'
  text: 'Press one 608ZZ into each face of the wheel: push squarely with a vise or
    a mallet and a flat block that bears on the bearing''s OUTER ring only, never
    on the shield. Each bearing bottoms on the web inside, so its face ends up flush
    with the wheel''s face and the spacing is set for you - press the second one with
    the wheel on the table so the first bearing gives the reaction. If they fight
    you, freezer the bearings for 15 minutes first; if a bearing goes in crooked,
    tap it out with a drift on the outer ring and start again.'
  parts:
  - wheel
  hardware:
  - brg
  tool: vise or mallet, flat block
- n: '5'
  text: 'Check the door''s bracket: the axle hole has to clear the M8 bolt, so at
    least 8.4 mm across - drill or ream it to 8.5 mm if it is smaller. The plate the
    axle passes through should be no more than about 6 mm thick for an M8x40.'
  parts: []
  hardware:
  - axle_bolt
  tool: drill
- n: '6'
  text: Slide a washer onto the bolt and push the bolt through the bracket's axle
    hole from the outside, then slide an axle ring over the shank, then the wheel
    with its bearings, then the second axle ring, the second washer and the ISO 10511
    M8 lock nut. Each ring must rest on a bearing's inner ring - it is only 10.8 mm
    across, so it cannot land anywhere else. Snug it by hand plus a light nip with
    a wrench; do not crank it, because the clamp load runs through the printed web
    and the two rings.
  parts:
  - axle_ring
  - wheel
  hardware:
  - axle_bolt
  - washer_head
  - washer_nut
  - locknut
  tool: wrench
- n: '7'
  text: 'Spin test: the wheel should turn freely with about a 2.5 mm gap between the
    rim and the bracket plate and the nut-side washer. If it drags, back the lock
    nut off a touch; if the wheel rocks sideways, give it another light nip. The bolt''s
    socket head stands 8 mm plus the washer off the outside of the bracket and the
    bolt ends about 5 mm past the lock nut - if either fouls the track or the frame,
    cut the end off or swap in your own lower-head M8 bolt (any M8 bolt with 35 mm
    or more of shank works).'
  parts:
  - wheel
  - axle_ring
  hardware:
  - axle_bolt
  tool: wrench
- n: '8'
  text: Refit the door on its track and roll it end to end. If the door rides a millimetre
    or two high or low, the new tyre differs slightly from the old one across the
    tread and the hanger's height adjustment needs a turn.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '9'
  text: 'Only if your old wheel had a groove in its running surface (i.e. it ran on
    a raised rail rather than a flat surface): set tread_groove_w to the rail''s width
    + 0.5 and tread_groove_d to about 3, reprint the wheel, and press the bearings
    out of the old one to reuse them.'
  parts:
  - wheel
  hardware: []
  tool: null
