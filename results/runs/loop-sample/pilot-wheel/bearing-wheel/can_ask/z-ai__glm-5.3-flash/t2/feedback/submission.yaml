manual:
- n: '1'
  text: 'DONE - your coupon passed: seat 22.09 mm, bearing snug, holds upside down.
    If you skipped the bolt check: the M8x50 socket-cap screw should slip through
    the bearing''s bore and the bearing should spin freely on the shank.'
  parts:
  - coupon
  hardware:
  - bearing-608
  - axle-bolt
  tool: null
- n: '2'
  text: Print 1 wheel per broken roller - flat, the z=0 face (a snap-lip mouth) on
    the bed, no supports, 3+ wall loops for strength. Print 3 thrust washers.
  parts:
  - wheel
  - thrust_washer
  hardware: []
  tool: null
- n: '3'
  text: 'First bearing: the coupon fit is snug, so press straight and steadily. Push
    the bearing into either mouth of the wheel with your thumb until it stops - it
    lands on the ledge of the opposite lip, about 7.5 mm down from the mouth you pushed
    it through.'
  parts:
  - wheel
  hardware:
  - bearing-608
  tool: null
- n: '4'
  text: 'Second bearing: put an M8 washer and the plain M8 nut onto the M8x50 socket-cap
    screw a few turns. Push the screw HEAD-first into the other mouth so the head
    sits just inside the bore, drop the second bearing in on top of the head, then
    tighten the nut - the head presses the bearing home through the snug bore until
    its face sits about 0.5-1 mm below flush and the far lip snaps over its rim. Unwind,
    pull the screw out.'
  parts:
  - wheel
  hardware:
  - axle-bolt
  - axle-washer
  - press-nut
  - bearing-608
  tool: null
- n: '5'
  text: Check both bearings spin freely with a finger through the bore.
  parts:
  - wheel
  hardware:
  - bearing-608
  tool: null
- n: '6'
  text: 'Offer the axle to the roller bracket still on the door. (a) Plain opening
    >= 8.5 mm: pass the screw through from the track side, washer under the head on
    the bracket face. (b) Threaded M8 socket: screw in only 4-6 mm so the wheel lands
    on smooth shank, or drill the socket out to 8.5 mm and use it as a plain hole.
    (c) Opening smaller than 8.5 mm: drill it to 8.5 mm. Your own M8 bolt (shank measured
    ~8 mm) replaces the supplied screw if at least 30 mm can protrude past the bracket
    face with at least 17 mm of smooth shank where the wheel will sit - threads under
    the bearings would damage them.'
  parts: []
  hardware:
  - axle-bolt
  - axle-washer
  tool: 8.5 mm drill bit (only if the bracket opening is undersized)
- n: '7'
  text: Slide the wheel onto the axle (either flat face outward), then a printed thrust
    washer with its face against the bearing, an M8 washer, and the M8 nyloc. Tighten
    until the axial play just disappears and the wheel still spins freely by flicking
    it; back off an eighth of a turn if it drags. The third thrust washer is a spare,
    or use it under the bolt head if the bracket opening is much bigger than the bolt.
  parts:
  - wheel
  - thrust_washer
  hardware:
  - axle-bolt
  - axle-washer
  - axle-nyloc
  tool: null
- n: '8'
  text: Hang the door and roll it. The wheel is 50 x 16 like the old one, so ride
    height should be unchanged; take up any small height error at the bracket if it
    has adjustment.
  parts: []
  hardware: []
  tool: null
