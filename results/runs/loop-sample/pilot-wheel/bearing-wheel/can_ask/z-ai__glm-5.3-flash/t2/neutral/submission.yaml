manual:
- n: '1'
  text: 'Print the coupon flat, pocket up, no supports. Three checks. (a) Slip a bearing
    over the M8x50 screw''s shank - it must slide on and spin freely. (b) Hand-start
    a bearing into the coupon''s pocket: it should grip within a few mm and not fall
    out when shaken. (c) Full press rehearsal: slip the press plate onto the screw
    against the head, push head-first into the pocket so the plate sits on the bearing,
    lay the reaction plate on the coupon''s back face, run the plain M8 nut on and
    tighten - the bearing should draw in until its face sits flush. If it takes huge
    force or the PLA creaks, stop and tell me.'
  parts:
  - coupon
  - press_plate
  - reaction_plate
  hardware:
  - axle-bolt
  - bearing-608
  - press-nut
  tool: null
- n: '2'
  text: Print 1 wheel per broken roller - flat, the z=0 face (a pocket mouth) on the
    bed, no supports, 3+ wall loops for strength. Also print 2 thrust washers, 1 press
    plate, 1 reaction plate.
  parts:
  - wheel
  - thrust_washer
  - press_plate
  - reaction_plate
  hardware: []
  tool: null
- n: '3'
  text: 'First bearing: hold the wheel flat with your chosen door-side face DOWN.
    Drop a bearing into the downward-facing pocket and push until it grips. Slip the
    press plate onto the M8x50 screw right against the head. From below, push head-first
    into the pocket until the plate sits flat on the bearing''s outer face. On top,
    lay the reaction plate on the wheel face over the pocket mouth, run the plain
    M8 nut down and tighten - the bearing draws in until it bottoms on the pocket
    floor, face flush with the wheel face. Unwind, remove the screw and plate.'
  parts:
  - wheel
  - press_plate
  - reaction_plate
  hardware:
  - axle-bolt
  - press-nut
  - bearing-608
  tool: null
- n: '4'
  text: 'Second bearing: drop it into the open pocket and push until it grips. This
    time the screw works from above: press plate against the head, push head-first
    into the pocket until the plate sits on the bearing. Below the wheel, put an M8
    washer over the shank where it exits the first bearing''s pocket and run the plain
    nut up - the washer will rest on the first bearing''s face. Tighten until the
    second bearing bottoms on its floor, face flush. Unwind, remove.'
  parts:
  - wheel
  - press_plate
  hardware:
  - axle-bolt
  - axle-washer
  - press-nut
  - bearing-608
  tool: null
- n: '5'
  text: 'Check both bearings: faces flush with the wheel faces (a fingernail laid
    across should feel them about level), and both spin freely.'
  parts:
  - wheel
  hardware:
  - bearing-608
  tool: null
- n: '6'
  text: 'Offer the axle to the roller bracket still on the door. (a) Plain opening
    >= 8.5 mm: pass the screw through from the track side, washer under the head on
    the bracket face. (b) Threaded M8 socket: screw in only 4-6 mm so the wheel lands
    on smooth shank, or drill the socket out to 8.5 mm and use it as a plain hole.
    (c) Opening smaller than 8.5 mm: drill it to 8.5 mm. Your own M8 bolt (shank measured
    ~8 mm) replaces the supplied screw if at least 30 mm can protrude past the bracket
    face with at least 17 mm of smooth shank where the wheel will sit - threads under
    the bearings would damage them.'
  parts: []
  hardware:
  - axle-bolt
  - axle-washer
  tool: 8.5 mm drill bit (only if the bracket opening is undersized)
- n: '7'
  text: Slide the wheel onto the axle (either face toward the door), then the thrust
    washer with its face against the bearing, an M8 washer, and the M8 nyloc. Tighten
    until the axial play just disappears and the wheel still spins freely; back off
    an eighth of a turn if it drags. The second thrust washer is a spare, or use it
    under the head if the bracket opening is much larger than the screw.
  parts:
  - wheel
  - thrust_washer
  hardware:
  - axle-bolt
  - axle-washer
  - axle-nyloc
  tool: null
- n: '8'
  text: Hang the door and roll it. The wheel is 50 x 16 like the old roller, so ride
    height and track fit are unchanged; take up any small height error at the bracket
    if it has adjustment.
  parts: []
  hardware: []
  tool: null
