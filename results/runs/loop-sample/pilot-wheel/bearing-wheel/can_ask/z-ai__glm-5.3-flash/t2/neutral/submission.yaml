task: bearing-wheel
note: 'REVISED after review: the earlier snap-lip retention was unbuildable (the lip
  could not flex far enough to let a bearing pass). New wheel: Ø50 × 16 one-piece
  disc, two Ø21.95 × 7 pockets for the 608s separated by a 2 mm web with a Ø12 axle
  window. Bearings are pressed in with the M8x50 screw itself (press plate + plain
  nut as a puller) until they bottom on the pocket floors, faces flush; the M8 axle
  then passes through both bores and clamps the inner races between the bracket-side
  washer and a printed thrust washer, so the wheel spins on the bearings with nothing
  rubbing. Coupon first: it doubles as a full rehearsal rig for the press. Wheel OD/width
  match the old roller (50 x 16), so ride height and track fit are unchanged.'
questions:
- text: Does the M8 bolt pass through an opening (>=8.5 mm) in the surviving bracket,
    or screw into a threaded socket?
  answer: Unknown - step 6 covers pass-through, shallow threaded socket, and drill-out.
- text: Is your own M8 bolt at least 40 mm long with a smooth (unthreaded) shank section?
  answer: Unknown - the supplied ISO 4762 M8x50 is the default axle; the user's bolt
    is a drop-in alternative if it meets the rule in step 6.
params:
  axle_len:
    value: 50
    unit: mm
    kind: hardware
    source: catalog
    note: 'ISO 4762 M8x50: 22 mm smooth shank keeps both bearings off the threads
      in every press and in the final assembly'
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: 608 nominal 8.0; sheet's caliper read 7.94
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: catalog
    note: 608 nominal 22.0; sheet's 21.22 reading was flagged as a jaw-pinch error
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: catalog
    note: nominal 7.0, width not measured
  bolt_shank_d:
    value: 8
    unit: mm
    kind: hardware
    source: measured
    note: user's own M8 bolt, 'about 8 mm', confirmed three times; also typical of
      the catalog M8 shank
  edge_chamfer:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: kind to the track walls
  mouth_chamfer:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: lead-in at each pocket mouth for bearing entry
  plate_id:
    value: 8.6
    unit: mm
    kind: design
    source: design
    note: plate centre hole clears the 8.0 shank
  plate_t:
    value: 4
    unit: mm
    kind: design
    source: design
    note: 4 mm so the plates stay well below PLA bending stress under the press load
  pocket_depth:
    value: 7
    unit: mm
    kind: design
    source: design
    note: = bearing width 7.0; bearing bottoms on the pocket floor with its face flush
  pocket_d:
    value: 21.95
    unit: mm
    kind: design
    source: design
    note: 0.025/side nominal interference on the 22.0 bearing; FDM hole undersize
      brings the real press to ~0.05-0.1/side. Coupon reveals the actual fit before
      the wheel matters
  press_plate_d:
    value: 21.5
    unit: mm
    kind: design
    source: design
    note: enters the 21.95 pocket and spans the bearing face (r 4.3-10.75) so the
      press loads the outer race, not just the inner race
  reaction_plate_d:
    value: 26
    unit: mm
    kind: design
    source: design
    note: sits on the wheel face around the 21.95 pocket mouth; bigger than the pocket
      so it cannot drop in
  thrust_id:
    value: 8.6
    unit: mm
    kind: design
    source: design
    note: 0.3 mm clearance on the ~8.0 shank
  thrust_od:
    value: 15
    unit: mm
    kind: design
    source: design
    note: contacts only the inner race face (race OD ~15.4), never the shield or outer
      race
  thrust_t:
    value: 2
    unit: mm
    kind: design
    source: design
    note: thrust washer thickness
  web_t:
    value: 2
    unit: mm
    kind: design
    source: design
    note: web between the pockets; carries the press reaction and separates the two
      bearing rows
  wheel_od:
    value: 50
    unit: mm
    kind: world
    source: asked
    note: 'user''s first message: old wheel ''about 50 mm across'''
  wheel_w:
    value: 16
    unit: mm
    kind: world
    source: asked
    note: 'user''s first message: old wheel ''about 16 mm wide'''
  window_d:
    value: 12
    unit: mm
    kind: design
    source: design
    note: axle window through the web; clears the 8.0 shank and lets the press reaction
      anchor on the web floor
parts:
- id: wheel
  role: final
  material: PLA
  code: "def build(p):\n    R = p.wheel_od / 2.0\n    H = p.wheel_w\n    c = p.edge_chamfer\n\
    \    pr = p.pocket_d / 2.0\n    mc = p.mouth_chamfer\n    wr = p.window_d / 2.0\n\
    \    t = p.web_t\n    z0 = p.pocket_depth\n    z1 = z0 + t\n    # one revolved\
    \ profile: rim with chamfered edges, two bearing pockets,\n    # web between them\
    \ with the axle window - no booleans needed\n    prof = [\n        (wr, z0),\n\
    \        (pr, z0),\n        (pr, mc),\n        (pr + mc, 0.0),\n        (R - c,\
    \ 0.0),\n        (R, c),\n        (R, H - c),\n        (R - c, H),\n        (pr\
    \ + mc, H),\n        (pr, H - mc),\n        (pr, z1),\n        (wr, z1),\n   \
    \ ]\n    body = (cq.Workplane(\"XZ\")\n            .polyline(prof)\n         \
    \   .close()\n            .revolve(360.0, (0, 0, 0), (0, 1, 0)))\n    return body\n"
  print_orientation: 'flat: the z=0 face (one pocket mouth) on the bed; every hole
    is vertical, no supports'
  use_orientation: axle horizontal; wheel outboard in the floor track; either flat
    face toward the door
- id: thrust_washer
  role: final
  material: PLA
  code: "def build(p):\n    return (cq.Workplane(\"XY\")\n            .circle(p.thrust_od\
    \ / 2.0)\n            .circle(p.thrust_id / 2.0)\n            .extrude(p.thrust_t))\n"
  print_orientation: flat on the bed
  use_orientation: on the axle, printed face against the outboard bearing's inner
    race
- id: press_plate
  role: final
  material: PLA
  code: "def build(p):\n    return (cq.Workplane(\"XY\")\n            .circle(p.press_plate_d\
    \ / 2.0)\n            .circle(p.plate_id / 2.0)\n            .extrude(p.plate_t))\n"
  print_orientation: flat on the bed
  use_orientation: 'assembly tool: rides on the screw shank against the head, presses
    the bearing face inside the pocket'
- id: reaction_plate
  role: final
  material: PLA
  code: "def build(p):\n    return (cq.Workplane(\"XY\")\n            .circle(p.reaction_plate_d\
    \ / 2.0)\n            .circle(p.plate_id / 2.0)\n            .extrude(p.plate_t))\n"
  print_orientation: flat on the bed
  use_orientation: 'assembly tool: lies on the wheel face over the pocket mouth as
    the nut''s anchor during the first press'
- id: coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    R = 22.0\n    H = 9.0\n    pr = p.pocket_d / 2.0\n   \
    \ mc = p.mouth_chamfer\n    wr = p.window_d / 2.0\n    t = p.web_t\n    z0 = p.pocket_depth\n\
    \    prof = [\n        (wr, 0.0),\n        (wr, t),\n        (pr, t),\n      \
    \  (pr, H - mc),\n        (pr + mc, H),\n        (R, H),\n        (R, 0.0),\n\
    \    ]\n    disc = (cq.Workplane(\"XZ\")\n            .polyline(prof)\n      \
    \      .close()\n            .revolve(360.0, (0, 0, 0), (0, 1, 0)))\n    label\
    \ = cq.Workplane(\"XY\", origin=(0, -17, H)).text(\"21.95\", 4.5, 0.8)\n    return\
    \ disc.union(label)\n"
  print_orientation: flat on the bed, pocket up; pocket and window are vertical holes,
    no supports
  use_orientation: bench test and press rehearsal only
