  - part: wheel
    feature: lip_bore
    role: clearance
  - part: spacer
    feature: bore
    role: clearance
  - part: spacer-side
    feature: bore
    role: clearance
  nut: locknut
  external: null
criteria:
- id: c1
  part: wheel
  feature: bearing pockets (both)
  relation: contains
  hardware: null
  clearance_mm: 0.1
  params:
  - bearing_od
  - fit_clearance
  - bearing_w
  - lead_in
  check:
    method: coupon
    ref: fit-coupon
    description: Press a 608 bearing into the coupon from the bed side. It should
      need firm thumb pressure and not fall out. If it is loose or too tight, change
      fit_clearance by 0.05 to 0.1 mm.
- id: c2
  part: wheel
  feature: lip_bore
  relation: clears
  hardware: null
  clearance_mm: 1.0
  params:
  - lip_bore
  check:
    method: measure
    ref: null
    description: 'Calipers: the web hole should be at least 13.5 mm, so the inner
      races and spacer spin freely.'
- id: c3
  part: spacer
  feature: bore
  relation: clears
  hardware: null
  clearance_mm: 0.2
  params:
  - bolt_d
  - spacer_clearance
  check:
    method: template
    ref: null
    description: The M8 bolt slides through the spacers by hand.
- id: c4
  part: spacer
  feature: length
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - wheel_w
  - bearing_w
  check:
    method: measure
    ref: null
    description: The spacer length equals wheel_w minus 2 x bearing_w, which is 2
      mm. It holds the inner races apart so the nut clamps them and not the wheel.
- id: c5
  part: spacer-side
  feature: thickness
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - side_spacer_t
  - spacer_od
  check:
    method: measure
    ref: null
    description: Each side spacer is 1 mm thick and 11 mm across, so it touches only
      the inner race (about 12 mm OD). The wheel face then stands 1 mm off the bracket
      and the nut washer.
- id: c6
  part: wheel
  feature: axle bore
  relation: faces
  hardware: bolt
  clearance_mm: null
  params:
  - bolt_d
  check:
    method: measure
    ref: null
    description: The bolt passes through both bearing bores and the wheel spins freely
      on it.
manual:
- n: '1'
  text: Print the fit-coupon first (about 10 minutes), pocket side down on the bed.
    Press one 608 bearing into it from the bottom. It should seat flush and hold with
    firm thumb pressure. If it is loose or very tight, tell me and change fit_clearance.
  parts:
  - fit-coupon
  hardware:
  - bearing
  tool: null
- n: '2'
  text: Print the wheel, 1 spacer and 2 spacer-side in black PLA with 5 walls and
    40% infill.
  parts:
  - wheel
  - spacer
  - spacer-side
  hardware: []
  tool: null
- n: '3'
  text: Press one bearing into each side of the wheel until it is flush with the face.
    Press on the outer ring only. Use a vise with a flat board, or tap it with a mallet
    and a flat block.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '4'
  text: Slide the bolt through the bracket (a washer under the bolt head if the bracket
    needs one). Put one spacer-side on the bolt against the bracket, then the wheel.
    Drop the 2 mm spacer into the web so it sits between the two inner races as the
    wheel goes on.
  parts:
  - wheel
  - spacer
  - spacer-side
  hardware:
  - bolt
  - bearing
  tool: null
- n: '5'
  text: Put the second spacer-side on the bolt against the outer inner race, then
    a washer, then the lock nut. Tighten until the inner races are clamped between
    the bracket and the washer, with no side play. The wheel must still spin freely
    and must not touch the bracket. If the stack is too loose, add an M8 washer as
    a shim. If it binds, check that the spacers are not touching the wheel.
  parts:
  - spacer-side
  hardware:
  - washer
  - locknut
  tool: 13 mm spanner
- n: '6'
  text: Spin the wheel by hand. It should turn smoothly and not wobble. Then refit
    the door on its track.
  parts:
  - wheel
  hardware: []
  tool: null
