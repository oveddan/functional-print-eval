task: nut-knob/M5
note: One-piece 30 mm fluted M5 hand knob with a recessed hex nut pocket, internal
  stop shoulder, through-bore for the bolt, and 6 axial crush ribs on the hex flats
  so the ISO 4032 M5 nut presses in by hand and stays retained when inverted without
  glue.
questions: []
params:
  bolt_clearance:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Diametral clearance for M5 bolt through-bore
  knob_od:
    value: 30
    unit: mm
    kind: design
    source: design
    note: Nominal outer diameter of the hand knob (~30 mm requested)
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut thickness/height
  flute_depth:
    value: 1.8
    unit: mm
    kind: design
    source: design
    note: Radial depth of each finger flute cut into the outer rim
  pocket_recess:
    value: 1.3
    unit: mm
    kind: design
    source: design
    note: Extra depth beyond nut_h so the nut sits fully recessed inside the knob
      with a lead-in rim
  flute_count:
    value: 8
    unit: count
    kind: design
    source: design
    note: Number of finger grip flutes around the circumference
  knob_h:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Total height of the hand knob
  rib_interference:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: Total diametral interference across opposing crush ribs relative to nut_af
      (0.05 mm crush per side)
  flute_radius:
    value: 5
    unit: mm
    kind: design
    source: design
    note: Radius of cylindrical cutter forming each finger grip flute
  coupon_od:
    value: 15
    unit: mm
    kind: design
    source: design
    note: Outer diameter of the quick test coupon cylinder
  pocket_clearance:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: Clearance added to nut_af on the hex flats so corners clear easily while
      crush ribs grip the flats
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut across flats
  rib_radius:
    value: 0.45
    unit: mm
    kind: design
    source: design
    note: Radius of the 6 vertical crush ribs centered on the hex flats
  edge_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Top and bottom outer edge chamfer for comfort and elephant-foot relief
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 nominal thread diameter
parts:
- id: m5_hand_knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    pocket_depth = p.nut_h + p.pocket_recess\n\
    \    floor_z = p.knob_h - pocket_depth\n    pocket_af = p.nut_af + p.pocket_clearance\n\
    \    pocket_circum_d = pocket_af / math.cos(math.radians(30))\n    bore_d = p.bolt_d\
    \ + p.bolt_clearance\n\n    # Base cylinder on bed z = 0..knob_h\n    knob = (\n\
    \        cq.Workplane(\"XY\")\n        .circle(p.knob_od / 2.0)\n        .extrude(p.knob_h)\n\
    \        .edges()\n        .chamfer(p.edge_chamfer)\n    )\n\n    # Cut finger\
    \ flutes around perimeter\n    flute_center_r = p.knob_od / 2.0 + p.flute_radius\
    \ - p.flute_depth\n    for i in range(int(p.flute_count)):\n        angle = math.radians(i\
    \ * 360.0 / p.flute_count)\n        cx = flute_center_r * math.cos(angle)\n  \
    \      cy = flute_center_r * math.sin(angle)\n        cutter = (\n           \
    \ cq.Workplane(\"XY\")\n            .center(cx, cy)\n            .circle(p.flute_radius)\n\
    \            .extrude(p.knob_h)\n        )\n        knob = knob.cut(cutter)\n\n\
    \    # Cut through-bore for the M5 bolt\n    knob = (\n        knob.faces(\"<Z\"\
    )\n        .workplane()\n        .circle(bore_d / 2.0)\n        .cutThruAll()\n\
    \    )\n\n    # Cut recessed hex pocket from the top face down to floor_z\n  \
    \  hex_cut = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=floor_z)\n\
    \        .polygon(6, pocket_circum_d)\n        .extrude(pocket_depth)\n    )\n\
    \    knob = knob.cut(hex_cut)\n\n    # Add 6 axial crush ribs on the midpoints\
    \ of the 6 hex flats\n    # Flat normal angles for polygon(6, d) which has vertices\
    \ along X axis (0, 60, 120...):\n    # Flats are at 30, 90, 150, 210, 270, 330\
    \ degrees.\n    target_rib_span = p.nut_af - p.rib_interference\n    rib_center_r\
    \ = target_rib_span / 2.0 + p.rib_radius\n    rib_h = pocket_depth - 0.6  # Leave\
    \ 0.6 mm top lead-in above ribs for easy hand starting\n    for i in range(6):\n\
    \        angle = math.radians(30.0 + i * 60.0)\n        rx = rib_center_r * math.cos(angle)\n\
    \        ry = rib_center_r * math.sin(angle)\n        rib = (\n            cq.Workplane(\"\
    XY\")\n            .workplane(offset=floor_z)\n            .center(rx, ry)\n \
    \           .circle(p.rib_radius)\n            .extrude(rib_h)\n        )\n  \
    \      knob = knob.union(rib)\n\n    return knob\n"
  print_orientation: Bottom flat face on the print bed (z = 0), with the recessed
    hex nut pocket opening upward at z = knob_h.
  use_orientation: Threads onto an M5 bolt along the Z axis; the M5 nut stays captured
    inside the pocket while the bolt passes through both the nut and the bottom bore.
- id: nut_fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    pocket_depth = p.nut_h + p.pocket_recess\n\
    \    floor_h = 2.0\n    total_h = floor_h + pocket_depth\n    pocket_af = p.nut_af\
    \ + p.pocket_clearance\n    pocket_circum_d = pocket_af / math.cos(math.radians(30))\n\
    \    bore_d = p.bolt_d + p.bolt_clearance\n\n    coupon = (\n        cq.Workplane(\"\
    XY\")\n        .circle(p.coupon_od / 2.0)\n        .extrude(total_h)\n    )\n\n\
    \    coupon = (\n        coupon.faces(\"<Z\")\n        .workplane()\n        .circle(bore_d\
    \ / 2.0)\n        .cutThruAll()\n    )\n\n    hex_cut = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=floor_h)\n        .polygon(6, pocket_circum_d)\n\
    \        .extrude(pocket_depth)\n    )\n    coupon = coupon.cut(hex_cut)\n\n \
    \   target_rib_span = p.nut_af - p.rib_interference\n    rib_center_r = target_rib_span\
    \ / 2.0 + p.rib_radius\n    rib_h = pocket_depth - 0.6\n    for i in range(6):\n\
    \        angle = math.radians(30.0 + i * 60.0)\n        rx = rib_center_r * math.cos(angle)\n\
    \        ry = rib_center_r * math.sin(angle)\n        rib = (\n            cq.Workplane(\"\
    XY\")\n            .workplane(offset=floor_h)\n            .center(rx, ry)\n \
    \           .circle(p.rib_radius)\n            .extrude(rib_h)\n        )\n  \
    \      coupon = coupon.union(rib)\n\n    return coupon\n"
  print_orientation: Bottom flat face on the print bed (z = 0), hex pocket opening
    upward.
  use_orientation: Test piece for checking hand press-fit and inverted retention of
    the ISO 4032 M5 nut.
hardware:
- id: m5_nut
  ref: ISO 4032 M5
  qty: 1
- id: m5_bolt
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: knob_m5_joint
  fastener: m5_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: m5_hand_knob
    feature: bolt_through_bore
    role: clearance
  - part: m5_hand_knob
    feature: hex_nut_pocket
    role: nut_pocket
  nut: m5_nut
  external: null
criteria:
- id: nut_press_fit_retention
  part: m5_hand_knob
  feature: hex_nut_pocket
  relation: seats
  hardware: m5_nut
  clearance_mm: -0.1
  params:
  - nut_af
  - nut_h
  - pocket_clearance
  - rib_interference
  - rib_radius
  - pocket_recess
  check:
    method: coupon
    ref: nut_fit_coupon
    description: Press the M5 hex nut into the coupon pocket by hand and invert it
      to verify retention before printing the full knob.
- id: nut_enclosed_and_stopped
  part: m5_hand_knob
  feature: hex_nut_pocket_floor
  relation: contains
  hardware: m5_nut
  clearance_mm: 1.3
  params:
  - nut_h
  - pocket_recess
  - knob_h
  check:
    method: measure
    ref: null
    description: Verify the M5 nut sits below the top rim and stops against the internal
      floor shoulder.
- id: bolt_passes_through
  part: m5_hand_knob
  feature: bolt_through_bore
  relation: clears
  hardware: m5_bolt
  clearance_mm: 0.5
  params:
  - bolt_d
  - bolt_clearance
  check:
    method: measure
    ref: null
    description: Pass the M5 bolt all the way through the nut and through the bottom
      exit bore.
manual:
- n: '1'
  text: Print the nut_fit_coupon first and press the ISO 4032 M5 hex nut into the
    hex pocket by hand until it seats against the bottom shoulder. Turn the coupon
    upside down to confirm the crush ribs hold the nut in place without glue. If it
    is too tight or loose, adjust rib_interference slightly.
  parts:
  - nut_fit_coupon
  hardware:
  - m5_nut
  tool: null
- n: '2'
  text: Print the m5_hand_knob with its flat bottom face on the build plate (no supports
    required). Align the M5 hex nut with the top hex opening and press it firmly by
    hand all the way down against the internal shoulder so it sits recessed inside
    the knob.
  parts:
  - m5_hand_knob
  hardware:
  - m5_nut
  tool: null
- n: '3'
  text: Thread the M5 bolt through the captured M5 nut so the bolt passes out the
    other side of the knob, ready for hand tightening.
  parts:
  - m5_hand_knob
  hardware:
  - m5_bolt
  tool: null
