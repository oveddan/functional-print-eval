task: nut-knob/M5
note: Single-piece 30 mm fluted M5 hand knob with an internal stop shoulder, recessed
  hex pocket, and 6 vertical crush ribs for tool-free hand press-fit retention.
questions: []
params:
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut thickness/height
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut width across flats
  bolt_clearance_d:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: Through-hole diameter clearing the M5 bolt shaft and threads
  Coupon_stop_t:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: Bottom stop wall thickness on the test coupon
  coupon_od:
    value: 16
    unit: mm
    kind: design
    source: design
    note: Outer diameter of test coupon cylinder
  rib_protrusion:
    value: 0.16
    unit: mm
    kind: design
    source: design
    note: Inward radial protrusion of each of the 6 crush ribs into the hex flat
  flute_count:
    value: 8
    unit: count
    kind: design
    source: design
    note: Number of finger grip scallops around perimeter
  rib_lead_in:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Top portion of pocket above the crush ribs for easy initial nut alignment
      by hand
  flute_cut_r:
    value: 4
    unit: mm
    kind: design
    source: design
    note: Radius of each perimeter grip scallop
  pocket_clearance_af:
    value: 0.16
    unit: mm
    kind: design
    source: design
    note: Clearance added to nut_af across flats so corners clear easily while ribs
      provide interference
  knob_od:
    value: 30
    unit: mm
    kind: design
    source: design
    note: Outer diameter of the hand knob (~30 mm across)
  pocket_depth:
    value: 6.5
    unit: mm
    kind: design
    source: design
    note: Depth of the hex nut pocket (> nut_h so the nut sits 1.8 mm recessed inside)
  knob_h:
    value: 15
    unit: mm
    kind: design
    source: design
    note: Total height of the hand knob (stop wall + pocket depth)
  stop_wall_t:
    value: 8.5
    unit: mm
    kind: design
    source: design
    note: Thickness of the solid far-side stop wall beneath the nut pocket
  flute_ring_r:
    value: 17.2
    unit: mm
    kind: design
    source: design
    note: Radial center distance of scallop cutouts from knob axis
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal diameter of M5 bolt
  rib_radius:
    value: 0.45
    unit: mm
    kind: design
    source: design
    note: Radius of each vertical semi-cylindrical crush rib on the hex flats
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    af = p.nut_af + p.pocket_clearance_af\n\
    \    r_circum = af / math.sqrt(3.0)\n    total_h = p.stop_wall_t + p.pocket_depth\n\
    \    z_seat = p.stop_wall_t\n\n    # Outer cylindrical body with top and bottom\
    \ chamfers\n    body = (\n        cq.Workplane(\"XY\")\n        .circle(p.knob_od\
    \ / 2.0)\n        .extrude(total_h)\n        .edges()\n        .chamfer(1.0)\n\
    \    )\n\n    # Subtract perimeter finger flutes for grip\n    for i in range(int(p.flute_count)):\n\
    \        ang = math.radians(i * 360.0 / p.flute_count)\n        fx = p.flute_ring_r\
    \ * math.cos(ang)\n        fy = p.flute_ring_r * math.sin(ang)\n        flute\
    \ = (\n            cq.Workplane(\"XY\")\n            .center(fx, fy)\n       \
    \     .circle(p.flute_cut_r)\n            .extrude(total_h)\n        )\n     \
    \   body = body.cut(flute)\n\n    # Subtract M5 bolt through-hole all the way\
    \ through\n    bolt_hole = (\n        cq.Workplane(\"XY\")\n        .circle(p.bolt_clearance_d\
    \ / 2.0)\n        .extrude(total_h)\n    )\n    body = body.cut(bolt_hole)\n\n\
    \    # Subtract recessed hex nut pocket from z_seat to top\n    hex_pocket = (\n\
    \        cq.Workplane(\"XY\")\n        .workplane(offset=z_seat)\n        .polygon(6,\
    \ 2.0 * r_circum)\n        .extrude(p.pocket_depth)\n    )\n    body = body.cut(hex_pocket)\n\
    \n    # Add 6 vertical crush ribs along the center of each hex flat for hand-press\
    \ retention\n    # Polygon(6, d) places vertices at 0, 60, 120... degrees, so\
    \ flat normals are at 30, 90, 150... degrees\n    rib_h = p.pocket_depth - p.rib_lead_in\n\
    \    rib_center_r = (af / 2.0) + p.rib_radius - p.rib_protrusion\n    for i in\
    \ range(6):\n        ang = math.radians(30.0 + i * 60.0)\n        rx = rib_center_r\
    \ * math.cos(ang)\n        ry = rib_center_r * math.sin(ang)\n        rib = (\n\
    \            cq.Workplane(\"XY\")\n            .workplane(offset=z_seat)\n   \
    \         .center(rx, ry)\n            .circle(p.rib_radius)\n            .extrude(rib_h)\n\
    \        )\n        body = body.union(rib)\n\n    return body\n"
  print_orientation: Flat bottom stop face on the bed (z = 0), hex nut pocket opening
    upward (+Z) so no bridges or supports are required.
  use_orientation: Held by the fluted outer rim and turned by hand; M5 bolt passes
    through the captured internal nut and exits the z = 0 stop face.
- id: nut_fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    af = p.nut_af + p.pocket_clearance_af\n\
    \    r_circum = af / math.sqrt(3.0)\n    z_seat = p.Coupon_stop_t\n    total_h\
    \ = z_seat + p.pocket_depth\n\n    body = (\n        cq.Workplane(\"XY\")\n  \
    \      .circle(p.coupon_od / 2.0)\n        .extrude(total_h)\n    )\n\n    bolt_hole\
    \ = (\n        cq.Workplane(\"XY\")\n        .circle(p.bolt_clearance_d / 2.0)\n\
    \        .extrude(total_h)\n    )\n    body = body.cut(bolt_hole)\n\n    hex_pocket\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=z_seat)\n     \
    \   .polygon(6, 2.0 * r_circum)\n        .extrude(p.pocket_depth)\n    )\n   \
    \ body = body.cut(hex_pocket)\n\n    rib_h = p.pocket_depth - p.rib_lead_in\n\
    \    rib_center_r = (af / 2.0) + p.rib_radius - p.rib_protrusion\n    for i in\
    \ range(6):\n        ang = math.radians(30.0 + i * 60.0)\n        rx = rib_center_r\
    \ * math.cos(ang)\n        ry = rib_center_r * math.sin(ang)\n        rib = (\n\
    \            cq.Workplane(\"XY\")\n            .workplane(offset=z_seat)\n   \
    \         .center(rx, ry)\n            .circle(p.rib_radius)\n            .extrude(rib_h)\n\
    \        )\n        body = body.union(rib)\n\n    return body\n"
  print_orientation: Flat bottom face on the bed (z = 0), hex pocket opening upward
    (+Z).
  use_orientation: Test coupon to check M5 nut hand press-fit and retention before
    printing the full knob.
hardware:
- id: nut_m5
  ref: ISO 4032 M5
  qty: 1
- id: bolt_m5
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: knob_m5_joint
  fastener: bolt_m5
  axis_origin:
  - 0.0
  - 0.0
  - 15.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: hex_nut_pocket_with_ribs
    role: nut_pocket
  - part: knob
    feature: bolt_through_hole
    role: clearance
  nut: nut_m5
  external: null
criteria:
- id: nut_press_fit_and_retention
  part: knob
  feature: hex_nut_pocket_with_ribs
  relation: contains
  hardware: nut_m5
  clearance_mm: -0.15
  params:
  - nut_af
  - nut_h
  - pocket_clearance_af
  - pocket_depth
  - rib_protrusion
  - rib_radius
  check:
    method: coupon
    ref: nut_fit_coupon
    description: Print the nut_fit_coupon first and press the ISO 4032 M5 nut in by
      hand; verify it seats against the bottom stop, sits fully below the rim, and
      does not fall out when inverted and shaken.
- id: nut_bottom_stop
  part: knob
  feature: nut_seat_shoulder
  relation: seats
  hardware: nut_m5
  clearance_mm: 0.0
  params:
  - nut_af
  - bolt_d
  - bolt_clearance_d
  - stop_wall_t
  check:
    method: coupon
    ref: nut_fit_coupon
    description: Verify the M5 nut stops firmly against the internal shoulder and
      cannot pass through the bolt hole on the far side.
- id: bolt_through_clearance
  part: knob
  feature: bolt_through_hole
  relation: clears
  hardware: bolt_m5
  clearance_mm: 0.4
  params:
  - bolt_d
  - bolt_clearance_d
  check:
    method: measure
    ref: null
    description: Pass the M5 bolt all the way through the nut and out the far side
      clearance hole without thread interference on the plastic bore.
manual:
- n: '1'
  text: Print the nut_fit_coupon first and press your ISO 4032 M5 hex nut into the
    top pocket by hand to verify a snug thumb-press fit that holds the nut when turned
    upside down.
  parts:
  - nut_fit_coupon
  hardware:
  - nut_m5
  tool: null
- n: '2'
  text: Print the knob with its flat stop face on the build plate (z = 0). Align the
    M5 hex nut with the top hex pocket and press it firmly by hand all the way down
    until it seats against the internal stop shoulder below the rim.
  parts:
  - knob
  hardware:
  - nut_m5
  tool: null
- n: '3'
  text: Thread your M5 bolt into the captured nut (from either side) so the bolt passes
    through the nut and exits out the far side through-hole.
  parts:
  - knob
  hardware:
  - bolt_m5
  - nut_m5
  tool: null
