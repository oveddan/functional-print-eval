task: nut-knob/M5
note: Single-piece 30 mm ergonomic M5 hand knob printed flat on its closed base (z
  = 0) with no supports or bridges. The top-entry hex pocket has a 1.2 mm alignment
  lead-in and 6 internal vertical crush ribs that allow hand-pressing an ISO 4032
  M5 nut while retaining it upside down without glue. An internal floor stops the
  nut from pushing out the far side while a 5.4 mm thru-hole lets the M5 bolt pass
  through.
questions: []
params:
  floor_t:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Thickness of the solid floor under the hex nut pocket stopping the nut from
      pushing through
  flute_r:
    value: 4
    unit: mm
    kind: design
    source: design
    note: Radius of each finger grip scallop cutter
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut height/thickness
  rib_crush:
    value: 0.12
    unit: mm
    kind: design
    source: design
    note: Protrusion of each vertical crush rib into the hex flat for hand-press retention
  flute_offset:
    value: 2.2
    unit: mm
    kind: design
    source: design
    note: Radial offset of scallop cutter center outside the knob radius
  flute_count:
    value: 8
    unit: count
    kind: design
    source: design
    note: Number of finger grip scallops around the knob perimeter
  pocket_clearance:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: Clearance added to nut_af for the base hex pocket across flats before crush
      ribs
  knob_h:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Total height of the knob (floor_t + pocket_depth)
  coupon_od:
    value: 14
    unit: mm
    kind: design
    source: design
    note: Outer diameter of the quick-print nut fit test coupon
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal M5 screw thread diameter
  rib_r:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Radius of the cylindrical crush rib feature on each hex flat
  lead_in_h:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: Top portion of hex pocket without crush ribs so the nut aligns and starts
      by hand
  outer_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Top and bottom outer edge chamfer for comfort and elephant-foot relief
  pocket_depth:
    value: 6.5
    unit: mm
    kind: design
    source: design
    note: Depth of hex nut pocket (> 4.7 mm nut_h so nut sits 1.8 mm recessed inside)
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut width across flats
  bolt_clearance_d:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: Clearance hole diameter for M5 bolt to pass freely through the far side
  knob_od:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: Outer diameter of the hand knob (~30 mm requested)
parts:
- id: m5_hand_knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    # Main knob body sitting on z = 0\n   \
    \ body = (\n        cq.Workplane(\"XY\")\n        .circle(p.knob_od / 2.0)\n \
    \       .extrude(p.knob_h)\n        .edges(\"|Z\")\n        . edges() # no-op\
    \ safeguard\n    )\n    body = (\n        cq.Workplane(\"XY\")\n        .circle(p.knob_od\
    \ / 2.0)\n        .extrude(p.knob_h)\n        .faces(\"<Z or >Z\")\n        .edges()\n\
    \        .chamfer(p.outer_chamfer)\n    )\n\n    # Cut finger grip flutes around\
    \ the perimeter\n    flute_rad = (p.knob_od / 2.0) + p.flute_offset\n    for i\
    \ in range(int(p.flute_count)):\n        ang = 2.0 * math.pi * i / p.flute_count\n\
    \        fx = flute_rad * math.cos(ang)\n        fy = flute_rad * math.sin(ang)\n\
    \        cutter = (\n            cq.Workplane(\"XY\")\n            .center(fx,\
    \ fy)\n            .circle(p.flute_r)\n            .extrude(p.knob_h)\n      \
    \  )\n        body = body.cut(cutter)\n\n    # Cut M5 bolt clearance through-hole\
    \ all the way through\n    bolt_hole = (\n        cq.Workplane(\"XY\")\n     \
    \   .circle(p.bolt_clearance_d / 2.0)\n        .extrude(p.knob_h)\n    )\n   \
    \ body = body.cut(bolt_hole)\n\n    # Cut recessed hex nut pocket from z = floor_t\
    \ to z = knob_h\n    af = p.nut_af + p.pocket_clearance\n    circum_r = af / math.sqrt(3.0)\n\
    \    hex_pts = [\n        (circum_r * math.cos(k * math.pi / 3.0), circum_r *\
    \ math.sin(k * math.pi / 3.0))\n        for k in range(6)\n    ]\n    hex_pocket\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.floor_t)\n  \
    \      .polyline(hex_pts)\n        .close()\n        .extrude(p.pocket_depth)\n\
    \    )\n\n    # Subtract 6 vertical crush ribs from the hex pocket cut tool (so\
    \ ribs remain on the part)\n    rib_h = p.pocket_depth - p.lead_in_h\n    rib_center_dist\
    \ = (af / 2.0) + p.rib_r - p.rib_crush\n    for k in range(6):\n        flat_ang\
    \ = (k * 60.0 + 30.0) * math.pi / 180.0\n        rx = rib_center_dist * math.cos(flat_ang)\n\
    \        ry = rib_center_dist * math.sin(flat_ang)\n        rib = (\n        \
    \    cq.Workplane(\"XY\")\n            .workplane(offset=p.floor_t)\n        \
    \    .center(rx, ry)\n            .circle(p.rib_r)\n            .extrude(rib_h)\n\
    \        )\n        hex_pocket = hex_pocket.cut(rib)\n\n    body = body.cut(hex_pocket)\n\
    \    return body\n"
  print_orientation: Bottom closed face (bolt exit side) flat on the print bed at
    z = 0; hex nut pocket opens upward at z = 12 mm so it prints with zero overhangs
    or bridges.
  use_orientation: Held by the fluted outer rim with the captured M5 nut inside; bolt
    threads through the nut and exits the closed base face.
- id: nut_fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    # Compact test coupon with identical pocket\
    \ and through-hole geometry\n    body = (\n        cq.Workplane(\"XY\")\n    \
    \    .circle(p.coupon_od / 2.0)\n        .extrude(p.knob_h)\n    )\n\n    bolt_hole\
    \ = (\n        cq.Workplane(\"XY\")\n        .circle(p.bolt_clearance_d / 2.0)\n\
    \        .extrude(p.knob_h)\n    )\n    body = body.cut(bolt_hole)\n\n    af =\
    \ p.nut_af + p.pocket_clearance\n    circum_r = af / math.sqrt(3.0)\n    hex_pts\
    \ = [\n        (circum_r * math.cos(k * math.pi / 3.0), circum_r * math.sin(k\
    \ * math.pi / 3.0))\n        for k in range(6)\n    ]\n    hex_pocket = (\n  \
    \      cq.Workplane(\"XY\")\n        .workplane(offset=p.floor_t)\n        .polyline(hex_pts)\n\
    \        .close()\n        .extrude(p.pocket_depth)\n    )\n\n    rib_h = p.pocket_depth\
    \ - p.lead_in_h\n    rib_center_dist = (af / 2.0) + p.rib_r - p.rib_crush\n  \
    \  for k in range(6):\n        flat_ang = (k * 60.0 + 30.0) * math.pi / 180.0\n\
    \        rx = rib_center_dist * math.cos(flat_ang)\n        ry = rib_center_dist\
    \ * math.sin(flat_ang)\n        rib = (\n            cq.Workplane(\"XY\")\n  \
    \          .workplane(offset=p.floor_t)\n            .center(rx, ry)\n       \
    \     .circle(p.rib_r)\n            .extrude(rib_h)\n        )\n        hex_pocket\
    \ = hex_pocket.cut(rib)\n\n    body = body.cut(hex_pocket)\n    return body\n"
  print_orientation: Bottom closed face flat on the print bed at z = 0; hex pocket
    opening upward.
  use_orientation: Test coupon to verify hand-press fit and upside-down retention
    of the ISO 4032 M5 nut.
hardware:
- id: m5_nut
  ref: ISO 4032 M5
  qty: 1
- id: m5_bolt
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: knob_nut_joint
  fastener: m5_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 5.5
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: m5_hand_knob
    feature: hex_nut_pocket
    role: nut_pocket
  - part: m5_hand_knob
    feature: bolt_thru_hole
    role: clearance
  nut: m5_nut
  external: null
criteria:
- id: nut_press_fit_retention
  part: m5_hand_knob
  feature: hex_nut_pocket
  relation: seats
  hardware: m5_nut
  clearance_mm: 0.15
  params:
  - nut_af
  - nut_h
  - pocket_clearance
  - pocket_depth
  - rib_crush
  - rib_r
  - lead_in_h
  check:
    method: coupon
    ref: nut_fit_coupon
    description: Press the ISO 4032 M5 hex nut into the coupon pocket by hand, confirm
      it seats against the internal floor below the top rim, and turn it upside down
      to verify it stays retained without glue.
- id: nut_axial_stop
  part: m5_hand_knob
  feature: pocket_floor
  relation: supports
  hardware: m5_nut
  clearance_mm: 0.0
  params:
  - nut_af
  - bolt_clearance_d
  - floor_t
  check:
    method: coupon
    ref: nut_fit_coupon
    description: Verify the M5 nut bottoms out on the internal floor and cannot pass
      through the far side.
- id: bolt_passes_through
  part: m5_hand_knob
  feature: bolt_thru_hole
  relation: clears
  hardware: m5_bolt
  clearance_mm: 0.4
  params:
  - bolt_d
  - bolt_clearance_d
  check:
    method: measure
    ref: null
    description: Pass the M5 bolt through the nut and out the through-hole on the
      far side of the knob.
manual:
- n: '1'
  text: Print the optional nut_fit_coupon first if you want a quick check of the press
    fit. Align the M5 hex nut with the top lead-in of the hex pocket and press it
    in by hand until it seats against the floor, then turn it upside down to confirm
    the crush ribs hold it in place.
  parts:
  - nut_fit_coupon
  hardware:
  - m5_nut
  tool: null
- n: '2'
  text: Align the ISO 4032 M5 hex nut with the hex pocket on the top face of the m5_hand_knob
    (the smooth 1.2 mm lead-in at the top of the pocket guides the flats into alignment)
    and press it firmly with your thumb until it bottoms out on the internal floor,
    sitting recessed inside the knob.
  parts:
  - m5_hand_knob
  hardware:
  - m5_nut
  tool: null
- n: '3'
  text: Thread the M5 bolt through the captured nut so the bolt passes out the clearance
    hole on the other side of the knob, and tighten by hand.
  parts:
  - m5_hand_knob
  hardware:
  - m5_bolt
  tool: null
