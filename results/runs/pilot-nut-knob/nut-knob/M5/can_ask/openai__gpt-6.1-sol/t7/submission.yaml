task: nut-knob/M5
note: One-piece, approximately 30 mm hand knob with a captive ISO 4032 M5 nut. Two
  integral snap tabs retain the nut; the hex pocket transmits torque and a bottom
  shoulder prevents push-through. The coupon is a separate fit test, not part of the
  finished assembly. Fit is based on catalog nut dimensions and must be checked before
  printing the final knob. Intended for hand tightening only; do not use for safety-critical
  loads or hot environments.
questions:
- text: Actual nut width across flats?
  answer: Could not measure; using catalog 8.0 mm.
- text: Actual nut thickness?
  answer: Could not measure; using catalog 4.7 mm.
params:
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 nominal across flats; actual nut unmeasured.
  nut_thickness:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_diameter:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  knob_diameter:
    value: 30
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_diameter:
    value: 16
    unit: mm
    kind: design
    source: design
    note: ''
  floor_thickness:
    value: 2.8
    unit: mm
    kind: design
    source: design
    note: ''
  pocket_af_allowance:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: Diametral clearance across flats, not interference. Snap tabs provide retention.
  bore_allowance:
    value: 0.6
    unit: mm
    kind: design
