    note: Rising insertion ramp from lip underside to tab top.
  latch_projection:
    value: 0.35
    unit: mm
    kind: design
    source: design
    note: Inward projection from socket flat; relaxed gap between lips is 7.6 mm.
  tab_t:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: ''
  tab_w:
    value: 3.2
    unit: mm
    kind: design
    source: design
    note: ''
  tab_side_gap:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Clear gap on each side of each flexible tab.
  tab_back_gap:
    value: 1.6
    unit: mm
    kind: design
    source: design
    note: ''
  grip_count:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
  grip_cutter_r:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: ''
