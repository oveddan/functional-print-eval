task: nut-knob/M5
note: One-piece, approximately 30 mm hand knob with a recessed ISO 4032 M5 nut, two
  integral snap-retention tabs, a closed bottom shoulder and a through-hole for the
  bolt. The nut fit is based on catalog dimensions, not a measurement; print the coupon
  first. The coupon is a separate test print, not part of the assembled knob. Intended
  for light hand tightening at room temperature, not high torque or elevated temperatures.
questions: []
params:
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 nominal across flats; actual nut unmeasured.
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: M5 nominal major diameter.
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_d:
    value: 18
    unit: mm
    kind: design
    source: design
    note: ''
  floor_t:
    value: 2.4
    unit: mm
    kind: design
    source: design
    note: Solid nut stop, except for bolt clearance hole.
  socket_af_clearance:
    value: 0.3
    unit: mm
    kind: design
