task: nut-knob/M5
note: 'One-piece, approximately 30 mm hand knob with a hand-installed captive M5 nut.
  Six split socket walls flex during insertion; small lips retain the nut when inverted.
  A solid floor prevents push-through while a central clearance hole lets the bolt
  pass. Nut dimensions are nominal because measurement was unavailable. Print the
  optional coupon first: actual nut tolerances and PLA printing accuracy affect snap
  fit. Intended for hand tightening, not high-torque or safety-critical clamping.'
questions:
- text: Measure the nut across flats and its thickness.
  answer: Unable to measure; use standard dimensions.
params:
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 nominal across flats; actual nut may be smaller.
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: M5 nominal major diameter.
  knob_d:
    value: 30
    unit: mm
    kind: design
