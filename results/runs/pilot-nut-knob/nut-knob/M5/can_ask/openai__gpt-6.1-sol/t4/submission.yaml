task: nut-knob/M5
note: One-piece, approximately 30 mm hand knob for an ISO 4032 M5 nut. Three integral
  snap tabs retain the nut without glue; the hex pocket transmits torque and a bottom
  shoulder prevents push-through. Nominal hardware dimensions are used because measurement
  was unavailable. Print the optional coupon first to verify hand insertion and retention;
  it is not an assembly component. Intended for light hand tightening, not wrench-level
  torque or hot environments.
questions:
- text: Can you measure the nut across flats and thickness?
  answer: Cannot measure; use best judgment.
