task: nut-knob/M5
note: One-piece, approximately 30 mm hand knob with a recessed M5 nut and two integral
  snap-retaining fingers. The closed pocket floor prevents the nut passing through;
  the central hole lets the bolt pass through. Nut dimensions are catalog nominal
  because measurement was unavailable. An optional small fit coupon checks printer/material
  tolerances before printing the knob; it is not part of the assembly.
questions: []
