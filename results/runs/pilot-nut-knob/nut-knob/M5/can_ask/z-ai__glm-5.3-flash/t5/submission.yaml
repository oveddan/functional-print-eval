task: nut-knob/M5
note: 'One-piece 30 mm hand knob, 14 mm tall, with a hex nut pocket opening on the
  grab face. The nut presses in by hand (0.4 mm interference over the flats, no glue)
  and is captured underneath by a moulded retainer ring with a 6.8 mm hole: the bolt
  passes through it, but the nut (8.0 mm across flats) cannot, so it stays in when
  flipped and cannot be pushed out through the far side. Upward retention comes from
  the press fit itself. A coupon is included to check the press fit before printing
  the knob. Your own M5 bolt is assumed; only the nut is listed as hardware.'
questions: []
params:
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: design
    note: user asked for about 30 mm across
  knob_h:
    value: 14
    unit: mm
    kind: design
    source: design
    note: 6.9 mm floor under the nut pocket, comfortable grip height
  flute_count:
    value: 16
    unit: count
    kind: design
    source: design
    note: grip flutes around the rim
  flute_d:
    value: 4
    unit: mm
    kind: design
    source: design
    note: ''
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 nut, across flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 nut thickness
  pocket_af:
    value: 8.4
    unit: mm
    kind: design
    source: design
    note: 0.4 mm interference over the nut flats for a firm hand press, no glue
  pocket_depth:
    value: 5.1
    unit: mm
    kind: design
    source: design
    note: nut height plus 0.4 clearance, so the nut seats 0.4 mm below the mouth
  disc_t:
    value: 2
    unit: mm
    kind: design
    source: design
    note: moulded retainer ring under the nut
  retainer_hole_d:
    value: 6.8
    unit: mm
    kind: design
    source: design
    note: smaller than the nut's 8.0 flats so the nut cannot pass down, larger than
      the 5.0 bolt shank so the bolt passes through
  bolt_hole_d:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: ''
  head_recess_d:
    value: 10
    unit: mm
    kind: design
    source: design
    note: lets an M5 socket head nest flush if the head ends up under the knob
  head_recess_depth:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA (high-speed, black)
  code: "import math\n\ndef build(p):\n    H = p.knob_h\n    body = cq.Workplane(\"\
    XY\").circle(p.knob_d / 2.0).extrude(H)\n    for i in range(p.flute_count):\n\
    \        a = 2.0 * math.pi * i / p.flute_count\n        x = p.knob_d / 2.0 * math.cos(a)\n\
    \        y = p.knob_d / 2.0 * math.sin(a)\n        body = body.cut(\n        \
    \    cq.Workplane(\"XY\").pushPoints([(x, y)])\n            .circle(p.flute_d\
    \ / 2.0).extrude(H)\n        )\n    pocket_ac = p.pocket_af / math.cos(math.pi\
    \ / 6.0)\n    body = body.cut(\n        cq.Workplane(\"XY\").polygon(6, pocket_ac).extrude(p.pocket_depth)\n\
    \    )\n    body = body.cut(\n        cq.Workplane(\"XY\").workplane(offset=p.pocket_depth)\n\
    \        .circle(p.retainer_hole_d / 2.0).extrude(p.disc_t)\n    )\n    body =\
    \ body.cut(\n        cq.Workplane(\"XY\").workplane(offset=p.pocket_depth + p.disc_t\
    \ - 0.01)\n        .circle(p.bolt_hole_d / 2.0).extrude(H)\n    )\n    body =\
    \ body.cut(\n        cq.Workplane(\"XY\").workplane(offset=H - p.head_recess_depth)\n\
    \        .circle(p.head_recess_d / 2.0).extrude(p.head_recess_depth + 0.01)\n\
    \    )\n    return body\n"
  print_orientation: nut-mouth face (grab face) on the bed
  use_orientation: nut-mouth face up, bolt exits through the underside
- id: nut-fit-coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "import math\n\ndef build(p):\n    w = 18.0\n    h = 11.0\n    block = cq.Workplane(\"\
    XY\").rect(w, w).extrude(h)\n    pocket_ac = p.pocket_af / math.cos(math.pi /\
    \ 6.0)\n    block = block.cut(\n        cq.Workplane(\"XY\").polygon(6, pocket_ac).extrude(p.pocket_depth)\n\
    \    )\n    block = block.cut(\n        cq.Workplane(\"XY\").workplane(offset=p.pocket_depth)\n\
    \        .circle(p.retainer_hole_d / 2.0).extrude(h)\n    )\n    return block\n"
  print_orientation: pocket-mouth face on the bed, same as the knob
  use_orientation: mouth up for testing
hardware:
- id: m5-nut
  ref: ISO 4032 M5
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print the nut-fit-coupon first, with the pocket mouth on the bed (same orientation
    the knob will print in). Use the same PLA and settings as the final knob.
  parts:
  - nut-fit-coupon
  hardware: []
  tool: 3D printer
- n: '2'
  text: 'Press the ISO 4032 M5 nut into the coupon''s hex pocket with firm thumb pressure.
    It should not slide in freely, and it should not need a hammer. Check your M5
    bolt''s shank drops freely through the centre hole, then turn the coupon upside
    down: the nut must stay in. If the fit is too tight or too loose, reprint with
    pocket_af changed by 0.2 mm and retest before printing the knob.'
  parts:
  - nut-fit-coupon
  hardware:
  - m5-nut
  tool: null
- n: '3'
  text: Print the knob with the nut-mouth (grab) face on the bed; the grip flutes
    face up.
  parts:
  - knob
  hardware: []
  tool: 3D printer
- n: '4'
  text: Press the M5 nut straight into the hex pocket of the knob until it bottoms
    on the moulded retainer ring inside (it stops about 0.4 mm below the surface).
    Firm thumb pressure against a table edge is enough; do not hammer.
  parts:
  - knob
  hardware:
  - m5-nut
  tool: null
- n: '5'
  text: 'Turn the knob upside down over your hand: the nut must stay captured on the
    retainer ring. If it drops out, the press fit is too light - reprint with pocket_af
    at 8.2 instead of 8.4.'
  parts:
  - knob
  hardware:
  - m5-nut
  tool: null
- n: '6'
  text: Thread your own M5 bolt through the centre hole (past the retainer ring) and
    into the nut in the knob. Turning the knob now winds the bolt in or out with no
    tools. The shallow 10 mm recess under the knob accepts an M5 socket head if the
    head ends up on the knob side.
  parts:
  - knob
  hardware:
  - m5-nut
  tool: null
