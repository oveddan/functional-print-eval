task: nut-knob/M5
note: One-piece Ø30×16 mm fluted hand knob with a captive ISO 4032 M5 nut. The nut
  presses in by hand through a lead-in funnel, clicks past a narrow snap throat (hex,
  ~0.05 mm per side pinch, 5° self-locking taper) and lands in a blind hex pocket
  (8.15 across flats × 4.9 deep) that bottoms on a 1.6 mm web with a Ø5.6 exit hole
  — so the nut can never be pushed out the far side, stays in when inverted, and the
  bolt passes through the nut and out the back. The bolt head seats in the grip-face
  recess (~flush) and caps the stack. The bolt itself is the customer's own M5 bolt
  (cannot be declared as hardware — documented via criteria/manual instead). Because
  the press fit is sensitive to the actual nut and to printed-hole accuracy, a 4-hole
  coupon (7.85/7.95/8.05/8.15 across flats, replicating the knob's funnel→throat→pocket
  stack) is printed first; the winning size is set as the knob's pinch_af parameter.
  Nut and bolt-head dims are catalog values (measurement was not available); head
  dims assumed to match an ISO 4762 socket cap screw.
questions:
- text: 'Coupon result: which hole held the nut best — 1 dimple (7.85), 2 (7.95),
    3 (8.05) or 4 (8.15) across flats?'
  answer: null
- text: Does your M5 bolt's head actually match the assumed socket-cap Ø8.5 × 5.0
    (fits flush in the recess)?
  answer: null
params:
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: you asked for about 30 mm across; chosen exactly 30
  knob_h:
    value: 16
    unit: mm
    kind: design
    source: design
    note: 5.4 head recess + 1.1 snap throat + 4.9 nut pocket + 1.6 web + 3.0 back
      wall
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats (not measurable, catalog value assumed; coupon
      compensates)
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 nut height, catalog value assumed
  head_d:
    value: 8.5
    unit: mm
    kind: hardware
    source: guessed
    note: bolt head width assumed = ISO 4762 M5 socket cap (8.5); verify your bolt's
      head fits the recess
  head_h:
    value: 5
    unit: mm
    kind: hardware
    source: guessed
    note: bolt head height assumed = ISO 4762 M5 socket cap (5.0)
  screw_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: M5 nominal shank diameter
  pinch_af:
    value: 7.95
    unit: mm
    kind: design
    source: design
    note: snap throat across-flats = nut_af − 0.05; tune to the winning coupon hole
      (7.85–8.15)
  pocket_clear:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: 'pocket across-flats = nut_af + 0.15: slides in, small rotational slop for
      torque pickup'
  funnel_h:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: lead-in funnel above the snap throat, ~38° from vertical
  funnel_af_extra:
    value: 0.65
    unit: mm
    kind: design
    source: design
    note: funnel wide end = pocket_af + 0.65
  ring_h:
    value: 1.1
    unit: mm
    kind: design
    source: design
    note: snap throat thickness; narrow end faces the head recess
  web_h:
    value: 1.6
    unit: mm
    kind: design
    source: design
    note: floor behind the nut with the exit hole; nut (8.0 flats) cannot pass it
  top_clear:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: clearance added under the head recess floor and above the nut pocket floor
  side_clear_head:
    value: 0.65
    unit: mm
    kind: design
    source: design
    note: per side around the bolt head in the recess; enlarge recess_d if your head
      is wider
  side_clear_shank:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: per side for the M5 shank in the exit hole
  n_flutes:
    value: 12
    unit: count
    kind: design
    source: design
    note: finger flutes around the rim
  flute_r:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: flute cutter radius
  flute_c:
    value: 16
    unit: mm
    kind: design
    source: design
    note: flute cutter centre radius; cuts 1.5 mm deep into the Ø30 rim
parts:
- id: hand-knob
  role: final
  material: PLA (high-speed, black)
  code: "import math\n\ndef _ac(af):\n    return af / math.cos(math.radians(30.0))\n\
    \ndef build(p):\n    H = p.knob_h\n    recess_h = p.head_h + p.top_clear\n   \
    \ recess_d = p.head_d + 2.0 * p.side_clear_head\n    pocket_af = p.nut_af + p.pocket_clear\n\
    \    pocket_h = p.nut_h + p.top_clear\n    funnel_af = pocket_af + p.funnel_af_extra\n\
    \    exit_d = p.screw_d + 2.0 * p.side_clear_shank\n    z_pocket = recess_h +\
    \ p.ring_h\n    z_web = z_pocket + pocket_h\n\n    knob = cq.Workplane(\"XY\"\
    ).circle(p.knob_d / 2.0).extrude(H)\n\n    # bolt-head recess open at the grip\
    \ face (z=0), with a 0.5 mm lead-in cone\n    knob = knob.cut(cq.Workplane(\"\
    XY\").circle(recess_d / 2.0).extrude(recess_h))\n    knob = knob.cut(\n      \
    \  cq.Workplane(\"XY\")\n        .circle((recess_d + 1.0) / 2.0)\n        .workplane(offset=0.5)\n\
    \        .circle(recess_d / 2.0)\n        .loft(ruled=True)\n    )\n\n    # nut\
    \ path: lead-in funnel -> snap throat (narrow end at the recess side) -> pocket\n\
    \    knob = knob.cut(\n        cq.Workplane(\"XY\", origin=(0.0, 0.0, recess_h\
    \ - p.funnel_h))\n        .polygon(6, _ac(funnel_af))\n        .workplane(offset=p.funnel_h)\n\
    \        .polygon(6, _ac(p.pinch_af))\n        .workplane(offset=p.ring_h)\n \
    \       .polygon(6, _ac(pocket_af))\n        .loft(ruled=True)\n    )\n    # blind\
    \ nut pocket, closed by the web below it\n    knob = knob.cut(\n        cq.Workplane(\"\
    XY\", origin=(0.0, 0.0, z_pocket))\n        .polygon(6, _ac(pocket_af))\n    \
    \    .extrude(pocket_h)\n    )\n\n    # bolt exit hole through the web and back\
    \ wall, out the far face\n    knob = knob.cut(\n        cq.Workplane(\"XY\", origin=(0.0,\
    \ 0.0, z_web))\n        .circle(exit_d / 2.0)\n        .extrude(H - z_web + 1.0)\n\
    \    )\n\n    # finger flutes around the rim (vertical grooves, print-friendly)\n\
    \    for i in range(int(p.n_flutes)):\n        a = 2.0 * math.pi * i / p.n_flutes\n\
    \        knob = knob.cut(\n            cq.Workplane(\"XY\", origin=(p.flute_c\
    \ * math.cos(a), p.flute_c * math.sin(a), -1.0))\n            .circle(p.flute_r)\n\
    \            .extrude(H + 2.0)\n        )\n    return knob\n"
  print_orientation: grip face (the face with the bolt-head recess) flat on the bed,
    knob axis vertical; no supports needed
  use_orientation: 'as printed: grip face toward the hand, exit face (opposite the
    recess) toward the work, bolt axis through the centre'
- id: fit-coupon
  role: coupon
  material: PLA (high-speed, black)
  code: "import math\n\ndef _ac(af):\n    return af / math.cos(math.radians(30.0))\n\
    \ndef build(p):\n    L, W, T = 68.0, 20.0, 10.0\n    pocket_af = p.nut_af + p.pocket_clear\n\
    \    funnel_af = pocket_af + p.funnel_af_extra\n    pocket_h = p.nut_h + p.top_clear\n\
    \    pinches = [p.nut_af - 0.15, p.nut_af - 0.05, p.nut_af + 0.05, p.nut_af +\
    \ 0.15]\n    plate = cq.Workplane(\"XY\").box(L, W, T, centered=False)\n    for\
    \ i, pinch in enumerate(pinches):\n        x = 9.0 + 15.5 * i\n        y = W /\
    \ 2.0\n        # replica of the knob's stack, entry from the top face:\n     \
    \   # lead-in funnel -> snap throat -> blind pocket with a solid floor\n     \
    \   hole = (\n            cq.Workplane(\"XY\", origin=(x, y, T - p.funnel_h))\n\
    \            .polygon(6, _ac(funnel_af))\n            .workplane(offset=p.funnel_h)\n\
    \            .polygon(6, _ac(pinch))\n            .workplane(offset=p.ring_h)\n\
    \            .polygon(6, _ac(pocket_af))\n            .workplane(offset=pocket_h)\n\
    \            .polygon(6, _ac(pocket_af))\n            .loft(ruled=True)\n    \
    \    )\n        plate = plate.cut(hole)\n        # dimple count marks the test\
    \ size: 1..4\n        for k in range(i + 1):\n            plate = plate.cut(\n\
    \                cq.Workplane(\"XY\", origin=(x + 7.5, 3.5 + 4.2 * k, T - 0.8))\n\
    \                .circle(0.9)\n                .extrude(0.8)\n            )\n\
    \    return plate\n"
  print_orientation: flat, bottom face on the bed; no supports needed
  use_orientation: flat on a table, hole openings facing up
hardware:
- id: m5-nut
  ref: ISO 4032 M5
  qty: 1
joints:
- id: nut-captive
  fastener: m5-nut
  axis_origin:
  - 0.0
  - 0.0
  - 11.4
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: hand-knob
    feature: blind hex nut pocket (8.15 across flats x 4.9 deep) above the web
    role: nut_pocket
  nut: null
  external: null
criteria:
- id: nut-fully-inside
  part: hand-knob
  feature: blind hex nut pocket closed by the web
  relation: contains
  hardware: m5-nut
  clearance_mm: null
  params:
  - nut_af
  - nut_h
  - pocket_clear
  - top_clear
  - ring_h
  check:
    method: coupon
    ref: fit-coupon
    description: 'press the nut into the matching coupon hole: it must bottom fully
      below the surface, as it will in the knob'
- id: mouth-retains-upside-down
  part: hand-knob
  feature: snap throat, narrow end facing the head recess
  relation: engages
  hardware: m5-nut
  clearance_mm: null
  params:
  - pinch_af
  - nut_af
  - ring_h
  - funnel_h
  check:
    method: coupon
    ref: fit-coupon
    description: 'coupon: pick the hole that snaps in by thumb pressure and holds
      the nut upside-down; set pinch_af to that size before printing the knob'
- id: web-stops-nut
  part: hand-knob
  feature: 1.6 mm web with Ø5.6 exit hole behind the nut
  relation: supports
  hardware: m5-nut
  clearance_mm: null
  params:
  - web_h
  - screw_d
  - side_clear_shank
  check:
    method: none
    ref: null
    description: nut flats 8.0 cannot pass the 5.6 hole; the web is backed by a 3
      mm solid back wall
- id: exit-clears-bolt
  part: hand-knob
  feature: bolt exit hole through web and back wall
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - screw_d
  - side_clear_shank
  check:
    method: none
    ref: null
    description: exit hole = screw_d + 0.6 (M5 shank +0.3 per side), straight vertical
      hole; the customer's own bolt passes through and out the back
- id: head-seats-in-recess
  part: hand-knob
  feature: bolt-head recess in the grip face
  relation: seats
  hardware: null
  clearance_mm: null
  params:
  - head_d
  - head_h
  - top_clear
  - side_clear_head
  check:
    method: none
    ref: null
    description: recess Ø9.8 x 5.4 fits an assumed socket cap head Ø8.5 x 5.0 with
      the head ~0.4 below flush; a 4 mm hex key still reaches the socket. If the customer's
      bolt head is wider/taller, enlarge recess_d / recess_h
- id: coupon-replicates-throat
  part: fit-coupon
  feature: four hex test holes replicating the knob's funnel, throat and pocket stack
  relation: contains
  hardware: m5-nut
  clearance_mm: null
  params:
  - nut_af
  - pocket_clear
  - funnel_h
  - funnel_af_extra
  - ring_h
  - top_clear
  check:
    method: none
    ref: null
    description: same funnel/throat/pocket stack and clearances as the knob, only
      the snap size varies
manual:
- n: '1'
  text: Print fit-coupon flat on the bed in PLA, no supports. It is a small plate
    with four hex test holes and 1–4 dimples marking them.
  parts:
  - fit-coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Press your M5 nut into each coupon hole. Dimple marks: 1 dimple = 7.85 mm
    across flats, 2 = 7.95, 3 = 8.05, 4 = 8.15. Each nut should push through with
    firm thumb pressure and end up fully below the surface.'
  parts:
  - fit-coupon
  hardware:
  - m5-nut
  tool: null
- n: '3'
  text: 'Turn the coupon upside down over your palm and tap it: the nut must not fall
    out of the winning hole. Pick the LARGEST hole size that still holds the nut.
    If it is not hole 2 (7.95), set the hand-knob''s pinch_af parameter to the winning
    value (7.85, 8.05 or 8.15) before slicing the knob.'
  parts:
  - fit-coupon
  hardware:
  - m5-nut
  tool: null
- n: '4'
  text: Print hand-knob in PLA with the grip face (the side with the big round recess)
    flat on the bed, no supports.
  parts:
  - hand-knob
  hardware: []
  tool: null
- n: '5'
  text: 'Press the ISO 4032 M5 nut into the knob''s recess, funnel-side first: it
    passes the lead-in funnel, clicks through the narrow snap throat and bottoms on
    the web inside. It ends up fully inside the knob, about 6 mm below the grip face.'
  parts:
  - hand-knob
  hardware:
  - m5-nut
  tool: null
- n: '6'
  text: 'Check the capture: turn the knob upside down and tap it — the nut must stay
    in. If it can fall out, reprint with pinch_af 0.1 smaller; if it needed pliers
    to insert, use 0.1 larger. No glue at any point.'
  parts:
  - hand-knob
  hardware:
  - m5-nut
  tool: null
- n: '7'
  text: Drop your own M5 bolt in head-first from the grip face and thread it through
    the captive nut until the head sits roughly flush in the recess and the shank
    sticks out of the back face. (The design assumes a socket-cap head Ø8.5 × 5.0;
    if your head is bigger, enlarge recess_d / recess_h and reprint.)
  parts:
  - hand-knob
  hardware: []
  tool: null
- n: '8'
  text: 'Use it: engage the bolt tip in your assembly, grip the fluted knob and twist.
    The nut stays captive in the knob through every turn. Optional: a 4 mm hex key
    reaches the bolt''s socket through the recess if you ever want tool-tightening.'
  parts:
  - hand-knob
  hardware: []
  tool: null
