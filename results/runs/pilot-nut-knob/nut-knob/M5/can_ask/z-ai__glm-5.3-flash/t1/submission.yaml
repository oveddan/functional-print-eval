task: nut-knob/M5
note: 'Fluted hand knob Ø30 × 15 for an M5 bolt. The ISO 4032 M5 nut presses by hand
  into a blind hex pocket in the top face and is captured by an internal snap ring:
  the ring''s across-flats is 0.25 mm under the nut, so once past it the nut cannot
  come out the mouth (upside-down safe) and the solid floor means it can never be
  pushed out the far side. No glue. Print the coupon first — it has the same pocket
  at 0.15/0.25/0.35 mm undersize so you can feel which press suits you; the knob ships
  with the 0.25 mm ring (set p.pocket_snap_under to 0.15 or 0.35 and reprint if you
  prefer another).'
questions:
- text: 'Coupon test: did the MIDDLE pocket (2 dots, 0.25 mm undersize) press in with
    a firm thumb press and hold the nut upside-down? If not, which one did (left =
    0.15, right = 0.35)?'
  answer: null
- text: In the knob, did the nut click past the snap ring and sit about 0.4 mm below
    the top surface?
  answer: null
