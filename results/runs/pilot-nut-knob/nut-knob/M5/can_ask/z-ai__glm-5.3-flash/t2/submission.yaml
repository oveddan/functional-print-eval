task: nut-knob/M5
note: 'Captive-nut hand knob, one printed piece, 30 mm across, 14 mm tall. The ISO
  4032 M5 nut presses by hand through a flexing snap lip (0.1 mm interference per
  side, relief groove behind the lip) into a hex chamber with a solid floor, so it
  is trapped both ways: it cannot fall out the mouth upside down and cannot be pushed
  out the far side. A 5.5 mm clearance bore lets the M5 bolt pass through the nut
  and out the bottom; the funnel mouth doubles as the bolt-head seat. Printed mouth-up
  with all overhangs at 45 degrees: no supports, no glue. Includes a coupon with the
  identical lip stack to rehearse the press fit first. Nut dimensions from the ISO
  4032 catalog (8.0 across flats, 4.7 thick) because the nut could not be measured;
  tolerances have roughly 0.1 mm of margin on each feature to absorb real-nut variance.'
questions:
- text: Is it fine that the bolt tip protrudes from the knob's flat bottom (that is
    what 'through the nut and out the other side' gives with a head-in-funnel assembly)?
  answer: Assumed no. The catalog ISO 4762 M5x30 leaves about 19 mm protruding; any
    M5 with 12 mm or more under the head passes through.
- text: Which side do you drive the bolt from?
  answer: The funnel recess takes a socket head (M5x30, head 8.5) with the shank centered;
    a hex head rests on it the same way. If you bolt from below, nothing changes for
    the knob itself.
params:
  bolt_d:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: M5 shank diameter, catalog value
  bore_chamfer:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: 45 deg lead-in so the bolt tip finds the bore easily
  bore_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: 0.25 mm/side clearance for the M5 shank passing through to the far side
  chamber_clear:
    value: 0.35
    unit: mm
    kind: design
    source: design
    note: 0.175 per side radial rattle; torque still transfers to the chamber flats
  chamber_slop:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: axial headroom above the seated nut
  flute_depth:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: grip groove depth
  flute_n:
    value: 12
    unit: count
    kind: design
    source: design
    note: 12 flutes around the rim
  flute_r:
    value: 1.6
    unit: mm
    kind: design
    source: design
    note: flute cutter radius
  floor_t:
    value: 5.225
    unit: mm
    kind: design
    source: design
    note: solid floor closes the pocket's far side so the nut cannot be pushed out;
      also the clearance-bore length
  groove_h:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: relief groove height behind the lip, so the lip is a thin flexing ring
  knob_d:
    value: 30.0
    unit: mm
    kind: design
    source: design
    note: user asked for about 30 mm across
  knob_h:
    value: 14.0
    unit: mm
    kind: design
    source: design
    note: comfortable thumb-height knob; 70 layers at 0.2 mm
  lip_band_h:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: height of the snap-lip band
  lip_interf:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: '0.1 mm per side: firm thumb press to insert, positive retention against
      gravity and vibration'
  lip_t:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: radial thickness of the flexing lip ring (thin so it presses in by hand)
  mouth_af:
    value: 9.9
    unit: mm
    kind: design
    source: design
    note: 'funnel mouth across flats: admits the nut (9.24 across corners) and doubles
      as a bolt-head seat'
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats; user could not measure, so catalog nominal is
      used, with margin built into the fits
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 nut thickness; catalog
  rim_chamfer:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: 45 deg chamfer top and bottom rims
parts:
- id: knob
  role: final
  material: PLA (high-speed, black)
  code: "import math\n\ndef _hex_pts(af):\n    R = af / math.sqrt(3.0)\n    return\
    \ [(R * math.cos(math.radians(30.0 + 60.0 * i)),\n             R * math.sin(math.radians(30.0\
    \ + 60.0 * i))) for i in range(6)]\n\ndef build(p):\n    # Pocket profile: aligned\
    \ hex stations from the pocket floor upward.\n    af_c = p.nut_af + p.chamber_clear\
    \      # nut chamber across flats\n    af_l = p.nut_af - p.lip_interf        \
    \ # snap-lip opening across flats\n    af_g = af_l + 2.0 * p.lip_t           \
    \ # relief groove across flats\n    af_m = p.mouth_af                      # mouth\
    \ across flats\n    z = p.floor_t\n    st = [(z, af_c)]\n    z += p.nut_h + p.chamber_slop;\
    \  st.append((z, af_c))   # chamber top\n    z += (af_g - af_c) / 2.0;       st.append((z,\
    \ af_g))   # 45deg flare up-out\n    z += p.groove_h;                st.append((z,\
    \ af_g))   # relief groove\n    z += (af_g - af_l) / 2.0;       st.append((z,\
    \ af_l))   # 45deg lip underside\n    z += p.lip_band_h;              st.append((z,\
    \ af_l))   # lip band top\n    z += (af_m - af_l) / 2.0;       st.append((z, af_m))\
    \   # 45deg funnel to mouth\n    st.append((p.knob_h + 0.5, af_m))           \
    \           # cut-through extension\n\n    r = p.knob_d / 2.0\n    ch = p.rim_chamfer\n\
    \    prof = [(0.0, 0.0), (r - ch, 0.0), (r, ch),\n            (r, p.knob_h - ch),\
    \ (r - ch, p.knob_h), (0.0, p.knob_h)]\n    knob = (cq.Workplane(\"XZ\").polyline(prof).close()\n\
    \            .revolve(360.0, (0, 0), (0, 1)))\n\n    pocket = None\n    for (za,\
    \ afa), (zb, afb) in zip(st[:-1], st[1:]):\n        seg = (cq.Workplane(\"XY\"\
    , origin=(0.0, 0.0, za))\n               .polyline(_hex_pts(afa)).close()\n  \
    \             .workplane(offset=zb - za)\n               .polyline(_hex_pts(afb)).close()\n\
    \               .loft(ruled=True))\n        pocket = pocket.union(seg) if pocket\
    \ is not None else seg\n    knob = knob.cut(pocket)\n\n    # Bolt clearance bore\
    \ from the bottom face up to the pocket floor.\n    bore = (cq.Workplane(\"XY\"\
    , origin=(0.0, 0.0, -1.0))\n            .circle(p.bore_d / 2.0).extrude(p.floor_t\
    \ + 1.1))\n    knob = knob.cut(bore)\n\n    # 45deg lead-in chamfer at the bore's\
    \ bottom mouth.\n    cone = cq.Solid.makeCone(p.bore_d / 2.0 + p.bore_chamfer,\
    \ p.bore_d / 2.0,\n                             p.bore_chamfer, cq.Vector(0.0,\
    \ 0.0, 0.0))\n    knob = knob.cut(cone)\n\n    # Vertical grip flutes around the\
    \ rim.\n    flutes = None\n    rc = r + p.flute_r - p.flute_depth\n    for i in\
    \ range(int(p.flute_n)):\n        a = 2.0 * math.pi * i / int(p.flute_n)\n   \
    \     c = (cq.Workplane(\"XY\", origin=(rc * math.cos(a), rc * math.sin(a), -1.0))\n\
    \             .circle(p.flute_r).extrude(p.knob_h + 2.0))\n        flutes = flutes.union(c)\
    \ if flutes is not None else c\n    knob = knob.cut(flutes)\n\n    return knob\n"
  print_orientation: 'As modeled: flat bottom face on the bed, nut-pocket mouth up;
    all pocket overhangs are 45 degrees, no supports'
  use_orientation: 'Mouth up in use: nut pressed in from the top, bolt head seats
    in the funnel, bolt tip exits the flat bottom'
- id: fit_check
  role: coupon
  material: PLA (high-speed, black)
  code: "import math\n\ndef _hex_pts(af):\n    R = af / math.sqrt(3.0)\n    return\
    \ [(R * math.cos(math.radians(30.0 + 60.0 * i)),\n             R * math.sin(math.radians(30.0\
    \ + 60.0 * i))) for i in range(6)]\n\ndef build(p):\n    # Rehearsal coupon: identical\
    \ lip / groove / chamber stack as the knob,\n    # on a short 26 mm disc, so the\
    \ hand press-fit can be checked first.\n    af_c = p.nut_af + p.chamber_clear\n\
    \    af_l = p.nut_af - p.lip_interf\n    af_g = af_l + 2.0 * p.lip_t\n    af_m\
    \ = p.mouth_af\n    floor = 2.5\n    z = floor\n    st = [(z, af_c)]\n    z +=\
    \ p.nut_h + p.chamber_slop;  st.append((z, af_c))\n    z += (af_g - af_c) / 2.0;\
    \       st.append((z, af_g))\n    z += p.groove_h;                st.append((z,\
    \ af_g))\n    z += (af_g - af_l) / 2.0;       st.append((z, af_l))\n    z += p.lip_band_h;\
    \              st.append((z, af_l))\n    z += (af_m - af_l) / 2.0;       st.append((z,\
    \ af_m))\n    top = z\n    st.append((top + 0.5, af_m))\n\n    disc = cq.Workplane(\"\
    XY\").circle(13.0).extrude(top)\n    pocket = None\n    for (za, afa), (zb, afb)\
    \ in zip(st[:-1], st[1:]):\n        seg = (cq.Workplane(\"XY\", origin=(0.0, 0.0,\
    \ za))\n               .polyline(_hex_pts(afa)).close()\n               .workplane(offset=zb\
    \ - za)\n               .polyline(_hex_pts(afb)).close()\n               .loft(ruled=True))\n\
    \        pocket = pocket.union(seg) if pocket is not None else seg\n    disc =\
    \ disc.cut(pocket)\n\n    bore = (cq.Workplane(\"XY\", origin=(0.0, 0.0, -1.0))\n\
    \            .circle(p.bore_d / 2.0).extrude(floor + 1.1))\n    disc = disc.cut(bore)\n\
    \n    cone = cq.Solid.makeCone(p.bore_d / 2.0 + p.bore_chamfer, p.bore_d / 2.0,\n\
    \                             p.bore_chamfer, cq.Vector(0.0, 0.0, 0.0))\n    disc\
    \ = disc.cut(cone)\n    return disc\n"
  print_orientation: 'As modeled: flat bottom on the bed, pocket mouth up'
  use_orientation: As printed (test piece)
hardware:
- id: nut1
  ref: ISO 4032 M5
  qty: 1
- id: bolt1
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: j1
  fastener: bolt1
  axis_origin:
  - 0.0
  - 0.0
  - 13.4
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: funnel mouth bevel (45 deg recess in top face)
    role: head_seat
  - part: knob
    feature: bolt clearance bore through the floor (D5.5)
    role: clearance
  - part: knob
    feature: hex nut chamber with snap lip (nut pressed in, captive)
    role: nut_pocket
  nut: nut1
  external: null
criteria:
- id: c1
  part: knob
  feature: hex nut chamber (across flats = nut_af + chamber_clear, depth = nut_h +
    chamber_slop, solid floor below)
  relation: contains
  hardware: nut1
  clearance_mm: null
  params:
  - nut_af
  - nut_h
  - chamber_clear
  - chamber_slop
  - floor_t
  check:
    method: coupon
    ref: fit_check
    description: 'Print the coupon first: the nut must drop into the chamber (bottoming
      on the floor) and, with the coupon inverted, must not fall out of the mouth.'
- id: c2
  part: knob
  feature: snap-lip opening (across flats = nut_af - lip_interf, flexing ring with
    relief groove)
  relation: engages
  hardware: nut1
  clearance_mm: null
  params:
  - nut_af
  - lip_interf
  - lip_t
  - lip_band_h
  - groove_h
  check:
    method: coupon
    ref: fit_check
    description: 'On the coupon: pressing the nut through the lip must need only firm
      thumb pressure (or bolt-pull trick), with a click; inverted, the nut stays trapped.
      If it needs pliers or falls through, tune lip_interf by ±0.05 mm.'
- id: c3
  part: knob
  feature: bolt clearance bore (D = bore_d) from pocket floor to bottom face
  relation: clears
  hardware: bolt1
  clearance_mm: null
  params:
  - bolt_d
  - bore_d
  check:
    method: coupon
    ref: fit_check
    description: 'Coupon shares the bore: the bolt must slide through by hand from
      the bottom up to the pocket floor.'
- id: c4
  part: knob
  feature: funnel mouth bevel (45 deg, across flats 7.8 to 9.9)
  relation: seats
  hardware: bolt1
  clearance_mm: null
  params:
  - mouth_af
  check:
    method: none
    ref: null
    description: 'No coupon check needed: any head up to about 9.5 mm across rests
      in the funnel; a socket-head M5 wedges centered on the 45 degree bevel.'
- id: c5
  part: knob
  feature: pocket floor under the nut (solid, bore 5.5 only)
  relation: supports
  hardware: nut1
  clearance_mm: null
  params:
  - floor_t
  - bore_d
  - nut_af
  check:
    method: none
    ref: null
    description: Floor thickness 5.225 mm with a 5.5 mm bore; the nut (8.0 across
      flats) cannot pass, by geometry, no check print needed.
manual:
- n: '1'
  text: 'Print both parts in PLA, 0.2 mm layers, exactly as oriented: flat bottom
    on the bed, nut-pocket mouth up. No supports needed - every overhang in the pocket
    and on the rim is 45 degrees or shallower.'
  parts:
  - knob
  - fit_check
  hardware: []
  tool: 3D printer
- n: '2'
  text: 'Rehearse the fit on the coupon before committing the knob. Set the M5 nut
    on the funnel mouth and press it through the snap lip with firm thumb pressure
    (or hold the coupon mouth-down over the nut on a table and lean on it). It should
    click past the lip and drop onto the floor; turn it upside down and shake - the
    nut must stay in. Then slide the M5 bolt up through the bottom bore: it should
    pass freely and meet the nut. Expected feel: a firm thumb press (a few kilograms
    of force), never pliers.'
  parts:
  - fit_check
  hardware: []
  tool: null
- n: '3'
  text: 'Press the nut into the knob the same way. If it feels stiff: thread the M5
    bolt two turns into the nut, hold the bolt, and pull the knob down over it - the
    lip flexes and the nut snaps in; then unscrew the bolt. Check the knob upside
    down: the nut stays.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '4'
  text: Screw the M5 bolt into the captive nut from the mouth side (the head comes
    to rest in the funnel recess on top) until the tip exits the flat bottom face.
    Any M5 bolt with at least 12 mm under the head protrudes; the catalog M5x30 leaves
    about 19 mm out.
  parts:
  - knob
  hardware: []
  tool: null
- n: '5'
  text: 'Use: grip the fluted rim and turn the knob - the captive nut drives the bolt
    with no tools. To remove the nut later (it cannot be pushed out the far side by
    design): thread the bolt two turns from the mouth side and pull - it draws the
    nut back out through the lip.'
  parts:
  - knob
  hardware: []
  tool: null
