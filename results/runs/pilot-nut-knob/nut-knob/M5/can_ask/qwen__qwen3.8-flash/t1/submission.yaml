task: nut-knob/M5
note: 'One printed knob (plus a throw-away fit-test coupon you print first, since
  the press fit is the only thing holding the nut in and it depends on their printer).


  Stack-up, knob axis = z, printed with the flat base (A) on the bed:

  - z 0 -> 5.0   floor wall, Ø5.6 exit bore through it (far side: the nut''s 8.0 A/F
  can''t be pushed through it)

  - z 5.0 -> 10.3 hex pocket, 7.85 A/F (0.15 diametral interference on the 8.00 nut)
  x 5.3 deep, so the M5 nut stands on the floor with its top face 0.6 below the pocket
  roof

  - z 10.3 -> 10.5 0.2 relief step, so nothing touches the nut''s top face

  - z 10.5 -> 16.0 mouth bore Ø9.6: the nut goes in (and back out) here, and an M5
  socket head (Ø8.5 x 5) passes through it and ends up inside


  Retention when the knob is turned upside down is pure press fit on the six flats
  — no glue, no separate clip. That''s why the coupon exists: three hex pockets at
  7.70 / 7.85 / 8.00 A/F, printed in the same orientation, let them pick the fit on
  their own machine before committing to the knob.


  Grip: Ø30 across the crests, 25.6 across the 6 vertical flutes, 16 tall, 45° top
  chamfer. Every wall is vertical or ≤45°; no bridges, no supports, nothing enclosed.


  If their bolt isn''t an ISO 4762 cap head (e.g. a pan head), widen insert_min_open
  and bolt_clear_hole to suit — insert_min_open is the one diameter the nut (9.24
  across corners) has to clear to go in.'
questions:
- text: Is your M5 bolt a socket head cap screw (ISO 4762, Ø8.5 head)? You couldn't
    measure it - the knob's mouth is sized 9.6 so it passes both the nut and an M5
    cap head. A pan head or a flange bolt may need that widened.
  answer: null
- text: Should I print the coupon (knob_press_test) before the knob, and do you want
    the press-fit direction recorded once your fit is chosen?
  answer: null
params:
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut, across flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 nut thickness
  bolt_d:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: M5 thread major dia, ISO 4762 M5
  bolt_head_d:
    value: 8.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 socket head dia (max). Their bolt couldn't be measured; widen
      if it isn't a cap head.
  bolt_head_h:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 socket head height
  knob_dia:
    value: 30.0
    unit: mm
    kind: design
    source: design
    note: across the flute crests - the ~30 mm asked for
  body_h:
    value: 16.0
    unit: mm
    kind: design
    source: design
    note: minimum 15.7 so an M5 head can sit inside above the nut; build() takes max(body_h,
      that minimum)
  top_chamfer:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: 45 deg break at the top rim
  floor_t:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: far-side wall the nut stands on (the shoulder)
  bolt_clear_hole:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: 'Ø through the floor: M5 passes, the nut (8.0 A/F) cannot'
  pocket_af:
    value: 7.85
    unit: mm
    kind: design
    source: design
    note: hex pocket across flats = 0.15 mm diametral interference on the nut; this
      is the press fit, tune with the coupon
  pocket_lead_af:
    value: 8.45
    unit: mm
    kind: design
    source: design
    note: 0.8 mm lead-in at the pocket mouth so the nut starts square
  pocket_lead_len:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: ''
  nut_top_clear:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: hex pocket depth = nut_h + this, so the nut is buried and fully inside
  relief_wall:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: step above the nut's top face; nothing printed touches the nut there
  insert_min_open:
    value: 9.6
    unit: mm
    kind: design
    source: design
    note: 'mouth bore: must pass the nut''s 9.24 across-corners (and an M5 head),
      so it is the nut''s insertion opening'
  head_top_clear:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: an M5 head swallowed through the mouth stays this far below the knob's top
      face
  flute_n:
    value: 6
    unit: count
    kind: design
    source: design
    note: ''
  flute_depth:
    value: 2.2
    unit: mm
    kind: design
    source: design
    note: scallop into the rim -> 25.6 mm over the flutes
  flute_cutter_d:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: Ø of the vertical rod used to cut each scallop
  flute_z0:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: flutes stop here, leaving a full Ø30 band on the bed
  coupon_af_tight:
    value: 7.7
    unit: mm
    kind: design
    source: design
    note: coupon pocket 1 (very firm)
  coupon_af_nom:
    value: 7.85
    unit: mm
    kind: design
    source: design
    note: coupon pocket 2 = the knob's fit
  coupon_af_loose:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: coupon pocket 3 (free, reference only)
  coupon_wall:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_h:
    value: 8.0
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA (high-speed, black)
  code: "def build(p):\n    # ---- hardware, from params (do not hard-code) ----\n\
    \    af   = p.nut_af          # M5 hex nut across flats\n    nh   = p.nut_h  \
    \         # M5 hex nut thickness\n    cb   = p.bolt_clear_hole # far-side exit\
    \ bore (nut cannot pass)\n    bhd  = p.bolt_head_d\n    bhh  = p.bolt_head_h\n\
    \    # ---- own choices ----\n    R    = p.knob_dia / 2.0\n    tf   = p.floor_t\n\
    \    pa   = p.pocket_af\n    la   = p.pocket_lead_af\n    ll   = p.pocket_lead_len\n\
    \    mo   = p.insert_min_open\n    ch   = p.top_chamfer\n    rw   = p.relief_wall\n\
    \n    hex_c  = pa * 2.0 / sqrt(3.0)          # pocket across corners\n    lead_c\
    \ = la * 2.0 / sqrt(3.0)\n    pk_h   = nh + p.nut_top_clear          # hex pocket\
    \ depth\n    pk_top = tf + pk_h                     # roof of the hex pocket\n\
    \    mtop   = pk_top + rw                   # mouth bore starts here\n    H  \
    \    = max(p.body_h, tf + nh + bhh + p.head_top_clear)  # tall enough to swallow\
    \ an M5 head\n\n    z0 = 2.0\n    # solid band 0..z0 with the Øcb exit bore, then\
    \ the body up to H with the mouth bore void\n    s = (cq.Workplane(\"XY\")\n \
    \        .circle(R).circle(cb / 2.0).extrude(z0)\n         .faces(\">Z\").workplane().circle(R).circle(mo\
    \ / 2.0).extrude(H - z0))\n    # 45 deg chamfer on the top rim (added cone, then\
    \ cut, to avoid a 3-point fillet)\n    s = s.faces(\">Z\").workplane().circle(R).extrude(ch)\n\
    \    cone = (cq.Workplane(\"XY\").workplane(offset=H - ch)\n            .circle(R).circle(mo\
    \ / 2.0).cone(ch, ch, True))\n    s = s.cut(cone)\n    # above the top face: 0.8\
    \ of lead-in hex, then the press-fit hex pocket (cut back next)\n    s = (s.faces(\"\
    >Z\").workplane().polygon(6, lead_c).extrude(ll)\n           .faces(\">Z\").workplane().polygon(6,\
    \ hex_c).extrude(pk_h - ll))\n    # mouth bore: from above everything down to\
    \ mtop -> leaves the 0.2 relief ledge over the nut\n    mouth = (cq.Workplane(\"\
    XY\").workplane(offset=H + pk_h + 1.0)\n             .circle(mo / 2.0).extrude(-(H\
    \ + pk_h + 1.0 - mtop)))\n    s = s.cut(mouth)\n    # 6 vertical finger scallops,\
    \ fading out into the top chamfer\n    rc = R - p.flute_depth + p.flute_cutter_d\
    \ / 2.0\n    for i in range(int(p.flute_n)):\n        a = radians(360.0 * i /\
    \ p.flute_n)\n        sc = (cq.Workplane(\"XY\").workplane(offset=p.flute_z0)\n\
    \              .center(rc * cos(a), rc * sin(a))\n              .circle(p.flute_cutter_d\
    \ / 2.0)\n              .extrude(H - p.flute_z0 + 1.0))\n        s = s.cut(sc)\n\
    \    # the far-side exit bore, printed as a vertical hole from the bed up\n  \
    \  thru = cq.Workplane(\"XY\").circle(cb / 2.0).extrude(tf + 1.0)\n    return\
    \ s.cut(thru)"
  print_orientation: Flat base (the annular face around the Ø5.6 exit bore) down on
    the bed, knob axis vertical, hex pocket and mouth facing up. 0.2 mm layers, 3
    perimeters, no supports, no adhesion needed - nothing spans, every wall is vertical
    or 45 deg.
  use_orientation: Axis along the bolt. The flat base (printed z=0, the Ø5.6 exit
    bore side) faces the workpiece and rests on it; the bolt tip comes out of that
    bore, the mouth bore faces away.
- id: knob_press_test
  role: coupon
  material: PLA (high-speed, black)
  code: "def build(p):\n    # three hex pockets in one printed, same as the knob's,\
    \ plus a copy of the Ø5.6 exit bore\n    afs   = [p.coupon_af_tight, p.coupon_af_nom,\
    \ p.coupon_af_loose]\n    wall  = p.coupon_wall\n    H     = p.coupon_h\n    nh\
    \    = p.nut_h\n    cb    = p.bolt_clear_hole\n    hexc  = [a * 2.0 / sqrt(3.0)\
    \ for a in afs]      # across corners\n    xs, x = [0.0], 0.0\n    for i in range(1,\
    \ len(afs)):\n        x = x + (hexc[i - 1] + hexc[i]) / 2.0 + wall\n        xs.append(x)\n\
    \    x0, x1 = xs[0] - hexc[0] / 2.0 - wall, xs[-1] + hexc[-1] / 2.0 + wall\n \
    \   hmax = max(hexc)\n    ytop = hmax / 2.0 + wall\n    yb   = -(hmax / 2.0 +\
    \ wall + cb / 2.0)          # centre of the bolt-passing test bore\n    ybot =\
    \ yb - cb / 2.0 - wall\n    blk = (cq.Workplane(\"XY\")\n           .center((x0\
    \ + x1) / 2.0, (ytop + ybot) / 2.0)\n           .rect(x1 - x0, ytop - ybot).extrude(H))\n\
    \    depth = nh + 0.7                                # blind, same depth as the\
    \ knob's pocket\n    for x, a in zip(xs, afs):\n        c = (cq.Workplane(\"XY\"\
    ).workplane(offset=H - depth).center(x, 0.0)\n             .polygon(6, a * 2.0\
    \ / sqrt(3.0)).extrude(depth + 1.0))\n        blk = blk.cut(c)\n    b = (cq.Workplane(\"\
    XY\").workplane(offset=-0.5).center(xs[0], yb)\n         .circle(cb / 2.0).extrude(H\
    \ + 1.0))\n    return blk.cut(b)"
  print_orientation: Flat block on the bed, the three hex pockets facing up - same
    wall orientation as the knob's pocket, so the fit it shows is the fit the knob
    gives.
  use_orientation: Not fitted to anything; it is the fit test. Turn it upside down
    to check the nut stays in.
hardware:
- id: nut_m5
  ref: ISO 4032 M5
  qty: 1
- id: bolt_m5
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: nut_in_pocket
  fastener: nut_m5
  axis_origin:
  - 0.0
  - 0.0
  - 5.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: nut_pocket
    role: nut_pocket
  - part: knob
    feature: shoulder
    role: head_seat
  nut: null
  external: null
- id: bolt_through_knob
  fastener: bolt_m5
  axis_origin:
  - 0.0
  - 0.0
  - 15.7
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: mouth_bore
    role: head_seat
  - part: knob
    feature: nut_pocket
    role: thread
  - part: knob
    feature: far_side_bore
    role: clearance
  nut: null
  external: null
criteria:
- id: press_fit
  part: knob
  feature: nut_pocket
  relation: seats
  hardware: nut_m5
  clearance_mm: null
  params:
  - pocket_af
  - nut_af
  - nut_h
  check:
    method: coupon
    ref: knob_press_test
    description: 'Press a nut into the 7.85 pocket of the coupon with your thumb:
      it should need real pressure, seat squarely, and stay in when the block is turned
      upside down and shaken. If it falls out, drop pocket_af by 0.1 (or use the pocket
      that worked); if you cannot push it in, raise it by 0.05-0.1.'
- id: nut_held_inverted
  part: knob
  feature: nut_pocket
  relation: seats
  hardware: nut_m5
  clearance_mm: null
  params:
  - pocket_af
  - nut_top_clear
  check:
    method: measure
    ref: null
    description: With the nut seated, hold the knob mouth-down over a soft surface
      and shake it. The nut must not move. If it does, the pocket is worn or was printed
      loose - reprint with pocket_af 0.1 smaller.
- id: cannot_be_pushed_out_far_side
  part: knob
  feature: far_side_bore
  relation: supports
  hardware: nut_m5
  clearance_mm: null
  params:
  - bolt_clear_hole
  - nut_af
  - floor_t
  check:
    method: measure
    ref: null
    description: The far-side bore is Ø5.6 against the nut's 8.00 across flats / 9.24
      across corners, and the shoulder behind it is 5 mm thick, so the nut cannot
      be pushed or fall through it.
- id: nut_fully_inside
  part: knob
  feature: nut_pocket
  relation: contains
  hardware: nut_m5
  clearance_mm: null
  params:
  - floor_t
  - nut_h
  - nut_top_clear
  - body_h
  - insert_min_open
  check:
    method: measure
    ref: null
    description: 'Nut top face sits at 5.0 + 4.7 = 9.7 mm from the base, 0.6 mm below
      the start of the mouth bore and 6.3 mm below the knob''s top face: nothing of
      the nut shows, and it cannot be pushed out of the mouth by the bolt tip.'
- id: bolt_passes_far_side
  part: knob
  feature: far_side_bore
  relation: clears
  hardware: bolt_m5
  clearance_mm: 0.3
  params:
  - bolt_clear_hole
  - bolt_d
  check:
    method: coupon
    ref: knob_press_test
    description: The M5 bolt must slide freely through the Ø5.6 test bore in the coupon
      (a printed hole of the same size and orientation as the knob's). If it binds,
      open bolt_clear_hole to 5.8.
- id: head_passes_mouth
  part: knob
  feature: mouth_bore
  relation: clears
  hardware: bolt_m5
  clearance_mm: 0.55
  params:
  - insert_min_open
  - bolt_head_d
  check:
    method: measure
    ref: null
    description: 'Mouth bore Ø9.6 against the bolt head Ø8.5: the head drops in and
      lands on the nut. Check against your actual bolt head - if it is a pan/round
      head, widen insert_min_open (it must stay above 9.3 for the nut to go in at
      all).'
- id: head_stays_inside
  part: knob
  feature: mouth_bore
  relation: faces
  hardware: bolt_m5
  clearance_mm: null
  params:
  - floor_t
  - nut_h
  - bolt_head_h
  - head_top_clear
  - body_h
  check:
    method: measure
    ref: null
    description: 'Head seated on the nut: its top face must be below the knob''s top
      face, so the knob lies flat on the work.'
- id: grip_size
  part: knob
  feature: flutes
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - knob_dia
  - flute_depth
  - flute_n
  check:
    method: none
    ref: null
    description: 'Ø30 over the crests, 25.6 over the six scallops, 16 mm tall: pinch
      it between thumb and fingers in the grooves.'
manual:
- n: '1'
  text: Print knob_press_test and knob in PLA, 0.2 mm layers, 3 perimeters, no supports.
    Both sit flat on the bed with their holes facing up - that is what makes the coupon's
    fit match the knob's fit. Print the coupon first if you'd rather check before
    committing.
  parts:
  - knob_press_test
  - knob
  hardware: []
  tool: null
- n: '2'
  text: 'On the coupon, press one M5 hex nut by hand into each of the three pockets
    - 7.70 (very firm), 7.85 (what the knob uses), 8.00 (free, for reference). Turn
    the block upside down over a table and shake: only pockets with an interference
    fit will hold the nut.'
  parts:
  - knob_press_test
  hardware:
  - nut_m5
  tool: null
- n: '3'
  text: Read the fit off the coupon before touching the knob. If the nut dropped out
    of 7.85, reprint the knob with pocket_af lowered by 0.1 (7.75). If 7.70 was impossible
    to push in by hand, raise pocket_af by 0.05. The pocket you want is the one that
    needs firm thumb pressure and then holds.
  parts:
  - knob_press_test
  hardware:
  - nut_m5
  tool: null
- n: '4'
  text: 'Test the bolt bore: the M5 bolt should slide freely through the small round
    hole in the corner of the coupon. That hole is the same Ø5.6 as the knob''s far-side
    exit bore.'
  parts:
  - knob_press_test
  hardware:
  - bolt_m5
  tool: calipers, optional
- n: '5'
  text: 'Settle the nut into the knob: stand the knob mouth-up on the table, drop
    the nut through the mouth, then put the M5 bolt tip-down into the mouth and press
    on the bolt head - the head is Ø8.5, so it acts as the ram and drives the nut
    the last 6 mm into the pocket until it stands on the shoulder. The nut''s top
    face ends up 0.6 mm below the mouth roof, fully buried.'
  parts:
  - knob
  hardware:
  - nut_m5
  - bolt_m5
  tool: null
- n: '6'
  text: 'Check it: turn the knob upside down and shake it - the nut must not stir.
    Try to push the nut toward the small far-side hole with a rod: the Ø5.6 bore is
    smaller than the nut''s 8.0 mm across flats, so it stops against the shoulder.
    If either fails, the press fit is too loose - reprint with pocket_af 0.1 lower
    (nothing else changes).'
  parts:
  - knob
  hardware:
  - nut_m5
  tool: null
- n: '7'
  text: 'To use it as a handle: pass the bolt head-first through the mouth, thread
    it into the nut and let the tip come out of the Ø5.6 bore on the base. Stand the
    knob''s flat base on the work and turn; clockwise tightens. The head stays inside
    the mouth bore, under the knob''s top face.'
  parts:
  - knob
  hardware:
  - bolt_m5
  tool: null
- n: '8'
  text: To turn a bolt whose head is down on the work, drop the nut into the pocket,
    rest the knob's base on the work around the bolt, and pass the exposed threaded
    end up through the base bore into the nut. Same part either way; no glue anywhere.
  parts:
  - knob
  hardware:
  - nut_m5
  - bolt_m5
  tool: null
