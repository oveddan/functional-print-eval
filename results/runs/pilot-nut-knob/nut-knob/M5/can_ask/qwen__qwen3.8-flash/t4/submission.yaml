criteria:
- id: c_nut_press_fit
  part: knob
  feature: nut_socket
  relation: seats
  hardware: nut_m5
  clearance_mm: null
  params:
  - pocket_af
  - nut_af
  - lead_in_af
  - lead_in_h
  - pocket_depth
  - nut_h
  check:
    method: coupon
    ref: fit_coupon
    description: The M5 hex nut must need firm thumb pressure to enter the socket
      and must not pull out by hand. Set pocket_af to the across-flats of the coupon
      socket that gripped best; the socket walls carry the torque.
- id: c_nut_inverted
  part: knob
  feature: lead_in
  relation: seats
  hardware: nut_m5
  clearance_mm: null
  params:
  - lead_in_af
  - pocket_af
  - pocket_depth
  check:
    method: coupon
    ref: fit_coupon
    description: Inverted and shaken, the nut stays in (an M5 nut weighs about 1.3
      g, so about 0.013 N to hold - the 4.2 mm of engaged interference over six flats
      is worth tens of newtons). The coupon's shallowest socket is the same diameter
      as the knob's lead-in step, which is what you check this against.
- id: c_nut_fully_inside
  part: knob
  feature: pocket_floor
  relation: supports
  hardware: nut_m5
  clearance_mm: null
  params:
  - pocket_depth
  - nut_h
  check:
    method: measure
    ref: null
    description: Nut bottom face on the pocket floor, its top face 0.3 mm below the
      crown. In the coupon's 4.7 mm deep sockets the nut should finish flush with
      the surface.
- id: c_no_pushout_far_side
  part: knob
  feature: pocket_floor
  relation: clears
  hardware: nut_m5
  clearance_mm: 1.2
  params:
  - bore_d
  - nut_af
  check:
    method: measure
    ref: null
    description: The only way out of the far side is the 5.6 mm bore, smaller than
      the nut's 8.0 mm across flats, so the nut cannot be pushed or threaded through
      it.
- id: c_bolt_clearance
  part: knob
  feature: bolt_bore
  relation: clears
  hardware: bolt_m5
  clearance_mm: 0.3
  params:
  - bore_d
  - bolt_d
  check:
    method: coupon
    ref: fit_coupon
    description: The bolt shank must slide freely through the coupon's round test
      hole. If it binds, raise bore_d a little and reprint.
- id: c_tip_exits
  part: knob
  feature: crown_mouth
  relation: clears
  hardware: bolt_m5
  clearance_mm: 0.5
  params:
  - bore_d
  - lead_in_af
  - pocket_depth
  check:
    method: none
    ref: null
    description: 'The bolt goes through the nut and out the other side: the crown
      opening (8.3 mm across flats) and the funnel above it are wider than the 5.0
      mm thread, and they are the only exit.'
- id: c_head_seats
  part: knob
  feature: head_washer_recess
  relation: contains
  hardware: bolt_m5
  clearance_mm: null
  params:
  - bolt_head_d
  - bolt_head_h
  - washer_od
  - recess_margin
  - recess_extra
  - grip_len
  check:
    method: none
    ref: null
    description: The 24.2 x 3.6 mm counterbore holds an ISO 4762 M5 head (8.5 x 5)
      or an ISO 7089 M5 washer (10 mm), and still leaves 8 mm of bolt to grip when
      the knob is hand tight.
- id: c_thread_engage
  part: knob
  feature: bolt_bore
  relation: engages
  hardware: nut_m5
  clearance_mm: null
  params:
  - grip_len
  - pocket_depth
  - nut_h
  - recess_extra
  check:
    method: none
    ref: null
    description: At least 1 mm of bare shank plus 2 mm of thread must reach the nut
      before the head bottoms in the recess.
- id: c_grip
  part: knob
  feature: lobes
  relation: faces
  hardware: null
  clearance_mm: null
  params:
  - knob_dia
  - groove_r
  - groove_c
  - n_grooves
  - knob_h
  check:
    method: none
    ref: null
    description: Six 4 mm deep grooves leave 6.3 mm wide lobe flats at the 30 mm rim,
      for fingers over about 19 mm of height.
manual:
- n: '1'
  text: Print both in PLA, 0.2 mm layers, no supports. The coupon goes flat as printed;
    the knob stands on its plain bottom band with the crown (the socket side) up,
    and needs at least 4 perimeter walls and 25%+ infill - that infill is what the
    nut presses against. 256 mm bed, plenty of room.
  parts:
  - fit_coupon
  - knob
  hardware: []
  tool: null
- n: '2'
  text: 'Peel the coupon off the bed by the bar, not the tabs. Stand the coupon on
    the bench, start face up, nearest the end with the single round hole: the four
    hex sockets run from tightest to loosest, and their depths step up 3.0, 3.8, 4.7,
    4.7 mm. Press the M5 nut into each one with your thumb and feel which grips. Sockets
    3 and 4 are 4.7 mm deep - full nut thickness - so the nut should finish flush
    with the surface there; that is the fit the knob''s socket gives over its whole
    4.7 mm. Socket 1 is the same diameter as the knob''s 0.5 mm entry step, so it
    shows what the nut passes through on its way in. Socket 4 is pocket_af + 0.1 and
    is only a loose-fit reference - do not pick it.'
  parts:
  - fit_coupon
  hardware:
  - nut_m5
  tool: null
- n: '3'
  text: 'Slide the bolt''s shank down through the coupon''s round test hole: it should
    run freely. If it binds, add 0.2 to bore_d before printing the knob.'
  parts:
  - knob
  - fit_coupon
  hardware:
  - bolt_m5
  tool: null
- n: '4'
  text: Set the knob crown-up on the bench. Drop the nut into the hex socket flat-side
    down (any clocking) and push it in with your thumb, squarely, all the way to the
    floor. The entry step centres it; the interference does the rest. Do not hammer
    it - if it will not start by thumb, warm the knob in hot water and try the nut
    again, or go a shade looser on pocket_af.
  parts:
  - knob
  hardware:
  - nut_m5
  tool: null
- n: '5'
  text: 'Hold the knob 200 mm above a bed of scrap and turn it upside down, bolt-side
    down. The nut stays in. Give it a light shake - the nut weighs about 1.3 g, so
    if it drops out the fit is too loose: reprint the knob with pocket_af set to the
    across-flats of the grippiest coupon socket you found (or 0.05 below it).'
  parts:
  - knob
  hardware:
  - nut_m5
  tool: null
- n: '6'
  text: Check the bolt. With the nut seated, 17.6 mm of the knob's height is below
    the pocket floor, so the bolt must stick out of whatever it is threaded into by
    at least grip_len (8 mm) plus head height. If the head bottoms in the counterbore
    before the tip finds the nut, get a longer bolt (ISO 4762 M5x35/40/45) or raise
    grip_len and reprint. If the tip will not pass the crown opening, raise bore_d.
  parts:
  - knob
  hardware:
  - bolt_m5
  tool: null
- n: '7'
  text: Put the bolt through the workpiece, add the ISO 7089 M5 washer under the head
    if you want the load spread, and start the tip into the knob's socket from the
    crown side - you can see the nut's thread through the opening. Turn the knob clockwise
    looking at its crown to tighten.
  parts:
  - knob
  hardware:
  - bolt_m5
  - washer_m5
  - nut_m5
  tool: null
- n: '8'
  text: Tighten by hand on the six lobes. The knob bears around the bolt head on the
    plain 3 mm band at its bottom. If the nut starts turning in its socket under load,
    tighten less hard and reprint with pocket_af 0.05-0.1 lower; if the knob's bottom
    counterbore will not sit over your surface, set recess_margin and recess_extra
    to 0 and reprint - that drops the counterbore and the knob then bears on its whole
    bottom face.
  parts:
  - knob
  hardware:
  - bolt_m5
  tool: null
