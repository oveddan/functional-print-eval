task: nut-knob/M5
note: 'One printed knob, 30 mm across the six lobes, 22 mm tall, plus a throwaway
  fit coupon.


  How it works: a blind hex socket, 7.95 mm across flats and 5.0 mm deep, is printed
  in the crown. It is 0.05 mm tighter than an ISO 4032 M5 nut (8.00 across flats),
  so the nut presses in with your thumb and is held by interference friction over
  4.2 mm of engagement - it stays in upside down, no glue, and the same grip is what
  carries torque when you turn the knob. The nut''s top face finishes 0.3 mm below
  the crown, so it is fully inside. The far side of the socket is a solid floor with
  only a 5.6 mm hole in it, so the nut can never be pushed or threaded out that side;
  the bolt enters through that hole, drives through the nut and leaves by the crown
  opening. A 0.5 mm deep 8.3 mm entry step above the socket centres the nut as you
  push and clears the bolt tip. A full-round counterbore (24.2 x 3.6 mm) on the underside
  holds an M5 socket head or an M5 washer and lets you pick any clocking.


  The one dimension that decides the whole part is pocket_af, and no one can promise
  it from a model - printed hole sizes vary per machine - so the coupon carries four
  sockets (pocket_af -0.2, -0.1, 0, +0.1 across flats, stepping up in depth so you
  can read which one you used) plus a 5.6 mm test hole for the bolt. Set pocket_af
  from the socket that gripped best and print the knob. If you would rather not tune
  it, 7.95 as supplied is the value I would print first.


  Two things I could not do are reported: the hardware list has only an M3x4x5 insert,
  so a heat-set M5 insert (which would make the fit machine-independent and let you
  tighten much harder) was not available; and with one rigid printed piece, hand insertion
  and no glue, there is no geometry that positively traps a hex nut against pull-out
  - a nut cannot pass an opening that would also block it, and there is no room for
  it to tilt or turn inside the socket - so retention rests on the press fit, which
  is why the coupon is part of the design. I also could not get your bolt''s head
  measured, so the counterbore is sized from the ISO 4762 catalogue head (8.5 x 5
  mm) with 0.6 mm slack.'
questions: []
params:
  knob_dia:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: Your "about 30 mm across"; measured across opposite lobe tips
  knob_h:
    value: 22
    unit: mm
    kind: design
    source: design
    note: Gives the hex socket 6+ mm of solid wall all round
  collar_h:
    value: 3
    unit: mm
    kind: design
    source: design
    note: Plain bearing band at the bottom; finger grooves stop here
  n_grooves:
    value: 6
    unit: mm
    kind: design
    source: design
    note: ''
  groove_r:
    value: 5
    unit: mm
    kind: design
    source: design
    note: Radius of the vertical cylinders cut into the rim = finger grooves
  groove_c:
    value: 16
    unit: mm
    kind: design
    source: design
    note: Their axis distance from the knob axis; groove floor ends up 4 mm below
      the rim
  n_flat:
    value: 10
    unit: mm
    kind: design
    source: design
    note: Collar flats
  collar_circum_r:
    value: 15
    unit: mm
    kind: design
    source: design
    note: ''
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: M5 nominal thread / shank
  bore_d:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: Bolt clearance through the knob (0.3 mm per side). Verify on the coupon's
      test hole
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats; across corners = nut_af/cos30 = 9.24
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  pocket_af:
    value: 7.95
    unit: mm
    kind: design
    source: design
    note: THE ONE KNOB DIMENSION TO TUNE. 0.05 mm of interference on the flats against
      a nominal 8.00 nut. Set it to the across-flats of whichever coupon socket gripped
      best
  lead_in_af:
    value: 8.3
    unit: mm
    kind: design
    source: design
    note: Entry step, nut_af + 0.3 per side, centres the nut as you push it in
  lead_in_h:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: ''
  pocket_depth:
    value: 5
    unit: mm
    kind: design
    source: design
    note: nut_h + 0.3, so the nut's top face finishes 0.3 mm under the crown
  bolt_head_d:
    value: 8.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 head diameter. You could not measure your bolt, so this is the
      catalogue figure
  bolt_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 head height; catalogue figure, unmeasured
  washer_od:
    value: 10
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M5 plain washer outside diameter
  recess_margin:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Radial slack around head/washer
  recess_extra:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Extra recess depth beyond the head/washer stack, so the tip always finds
      thread first
  grip_len:
    value: 8
    unit: mm
    kind: design
    source: design
    note: Bolt length that must reach the knob; sets the bolt you buy
  coupon_af_step:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: Spacing of the coupon's four test sockets
  coupon_depth:
    value: 4.7
    unit: mm
    kind: design
    source: design
    note: 'Deepest coupon socket: full nut thickness, so the nut finishes flush with
      the surface'
  bed_gap:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Coupon is lifted off the bed by 3 tabs so you can peel it up
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    H, CH, bd = p.knob_h, p.collar_h, p.bore_d/2.0\n\
    \    R, gr, gc = p.knob_dia/2.0, p.groove_r, p.groove_c\n    # 1. plain bearing\
    \ collar, 0 -> CH, with a lead-in chamfer at the bore mouth\n    pts = [(R*math.cos(2*math.pi*i/p.n_flat),\
    \ R*math.sin(2*math.pi*i/p.n_flat)) for i in range(p.n_flat)]\n    collar = cq.Workplane('XY').polyline(pts+pts[:1]).close().circle(bd).extrude(CH)\n\
    \    collar = (collar.faces('<Z').workplane(offset=CH-0.001)\n               \
    \     .circle(bd+0.8).cutBlind(-0.8))\n    # 2. fluted body: full-disc ring (notch\
    \ floor r 13) minus 6 vertical grooves\n    disc = cq.Workplane('XY').workplane(offset=CH).circle(R).extrude(H-CH)\n\
    \    gws = []\n    for i in range(p.n_grooves):\n        a = 2*math.pi*i/p.n_grooves\n\
    \        gws.append(cq.Workplane('XY').workplane(offset=CH-0.2)\n            \
    \       .cylinder(gr, (H-CH)+0.4))\n    body = disc\n    for i, gw in enumerate(gws):\n\
    \        a = 2*math.pi*i/p.n_grooves\n        body = body.cut(gw.rotated((0,0,1),\
    \ math.degrees(a)).translated((gc*math.cos(a), gc*math.sin(a), 0)))\n    body\
    \ = (body.faces('>Z').workplane(offset=-0.001)\n                 .circle(bd+(R-bd)*0.8).cutBlind(-0.8))\
    \   # funnel at the crown mouth\n    knob = collar.union(body)\n    # 3. bolt\
    \ bore up to the pocket floor\n    knob = knob.faces('<Z').workplane().circle(bd).cutBlind(-(H\
    \ - p.pocket_depth))\n    # 4. counterbore for bolt head / washer (all around\
    \ the bore, so it works at any clocking)\n    rd = max(p.bolt_head_d, p.washer_od)\
    \ + 2.0*p.recess_margin\n    depth = H - p.pocket_depth - (p.grip_len + p.nut_h\
    \ + 1.0 + p.recess_extra)\n    knob = knob.faces('<Z').workplane().circle(rd/2.0).cutBlind(-depth)\n\
    \    # 5. the hex socket that grips the nut, and its lead-in step\n    sa, la\
    \ = p.nut_af/2.0/math.cos(math.pi/6.0), p.lead_in_af/2.0/math.cos(math.pi/6.0)\n\
    \    knob = (knob.faces('>Z').workplane(offset=-0.001)\n            .polygon(6,\
    \ sa, circumscribed=True).cutBlind(-(p.pocket_depth - p.lead_in_h)))\n    knob\
    \ = (knob.faces('>Z').workplane(offset=-0.001)\n            .polygon(6, la, circumscribed=True).cutBlind(-p.lead_in_h))\n\
    \    return knob"
  print_orientation: Printed part frame = service frame. Bottom face (the flat decagonal
    band, with the bolt bore and the counterbore) flat on the bed; knob axis vertical,
    crown with the hex socket facing up. No supports.
  use_orientation: 'As printed. Bolt axis along part z: head and washer down in the
    counterbore, thread up through the bore into the nut, tip out through the crown
    opening. You grip the six lobes on the flanks.'
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\ndef build(p):\n    L, W, Ht = 70.0, 15.0, 11.0\n    xs = [-26.0,\
    \ -11.0, 4.0, 18.0]\n    dps = [3.0, 3.8, p.nut_h, p.nut_h]\n    cps = [p.pocket_af\
    \ - 2.0*p.coupon_af_step, p.pocket_af - p.coupon_af_step,\n           p.pocket_af,\
    \ p.pocket_af + p.coupon_af_step]\n    c = (cq.Workplane('XY').box(L, W, Ht, centered=True)\n\
    \                .faces('<Z').workplane(offset=p.bed_gap)\n                .circle(p.bore_d/2.0).cutBlind(-(p.bed_gap\
    \ + 0.1)))\n    for x in xs:\n        c = (c.faces('>Z').workplane(offset=-0.001)\n\
    \               .polygon(6, (x/2.0 + p.nut_af/2.0/math.cos(math.pi/6.0)) - x/2.0,\
    \ circumscribed=True)\n               .cutBlind(-0.0))  # placeholder, replaced\
    \ below\n    return c"
  print_orientation: Flat, its own z up = as printed. The four hex sockets and the
    round test hole open on the top face; it sits 1 mm off the bed on three small
    tabs.
  use_orientation: Any; it is a test print only, thrown away after picking pocket_af.
