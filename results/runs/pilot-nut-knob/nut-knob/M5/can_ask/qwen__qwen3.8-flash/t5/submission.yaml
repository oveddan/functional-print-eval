task: nut-knob/M5
note: 'Single-piece PLA hand knob, 30 mm across, 22 mm tall, 8 flutes for grip. An
  ISO 4032 M5 nut is pressed in by thumb through a 9.59 mm round mouth into a 7.90
  mm across-flats hex socket (0.05 mm interference per flat = friction retention when
  inverted, no glue); six 2.8 mm corner-relief bores keep the load on the flats so
  insertion stays hand-forceable. The socket is closed at the far end by a solid wall
  with only a 5.5 mm bolt hole, so the nut cannot be pushed out that side and its
  face ends 0.5 mm below the mouth (fully inside). The M5 passes through the nut and
  out the 5.5 mm hole; its head stops on the 0.5 mm mouth shoulder. Printed tip-face-down,
  mouth up: no supports, no bridged roofs. A four-pocket 7.80/7.90/8.00/8.10 mm coupon
  is included to verify the press fit before trusting the knob, with socket_af as
  the single tuning parameter.'
questions: []
params:
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut across flats; the socket flats are cut from this
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 nut height; sets socket depth
  m5_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 shank diameter; the bolt hole is m5_d + bolt_clearance
  m5_head_d:
    value: 8.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 head diameter. The 9.59 mm mouth bore lets this head (and a
      9.24 mm-across-corners hex head) enter the 0.5 mm mouth and stop on the shoulder
      at the socket entry.
  knob_dia:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: you asked for about 30 mm across
  knob_h:
    value: 22
    unit: mm
    kind: design
    source: design
    note: grip length for two fingers; the closed end above the socket is 16.5 mm
      of solid
  top_chamfer:
    value: 2
    unit: mm
    kind: design
    source: design
    note: chamfer on the tip face (bed face)
  n_flutes:
    value: 8
    unit: count
    kind: design
    source: design
    note: finger grooves
  flute_d:
    value: 12
    unit: mm
    kind: design
    source: design
    note: groove cutter diameter -> 3 mm deep scallops
  flute_center_r:
    value: 18
    unit: mm
    kind: design
    source: design
    note: groove cutter centre radius; scallop floor at r=12, ridges back at r=15
  flute_z0:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: grooves stop this far from the mouth rim, keeping the rim round
  grip_top:
    value: 17
    unit: mm
    kind: design
    source: design
    note: grooves run from mouth rim inward to here; beyond is a plain collar
  socket_af:
    value: 7.9
    unit: mm
    kind: design
    source: design
    note: PRESS FIT = nut_af - 0.10 (0.05 mm per flat). Verify on fit_coupon and retune
      if your printer wants it looser/tighter
  socket_depth:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: mouth_depth + nut_h + 0.3 mm end clearance, so the nut is fully inside with
      room at the closed end
  mouth_depth:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: depth of the widened entry bore; the nut's face finishes this far below
      the mouth face
  mouth_clear:
    value: 0.35
    unit: mm
    kind: design
    source: design
    note: added to the nut's across-corners for the entry bore, so the nut drops in
      without touching anything
  relief_d:
    value: 2.8
    unit: mm
    kind: design
    source: design
    note: the six corner-relief bores drilled on the socket's corner vertices
  bolt_clearance:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: M5 shank clearance in the 5.5 mm tip hole
  coupon_l:
    value: 62
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_w:
    value: 18
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_t:
    value: 6
    unit: mm
    kind: design
    source: design
    note: pocket depth 4.7 (nut height) + 1.3 floor, matching the knob's closed end
  coupon_floor:
    value: 1.3
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_n:
    value: 4
    unit: count
    kind: design
    source: design
    note: pockets at socket_af-0.1, socket_af, +0.1, +0.2
  coupon_step:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_spacing:
    value: 14
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_notch_r:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: marker notch beside the tightest pocket
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    # Hand knob for an M5 bolt. Printed standing\
    \ on its tip face so the nut\n    # mouth is the last layer and the socket cavity\
    \ never needs a bridge.\n    # print-frame z = knob_h - use-frame z, use-frame\
    \ z = 0 at the mouth face.\n    R = p.knob_dia / 2.0\n    h = p.knob_h\n    nut_ac\
    \ = 2.0 * p.nut_af / math.sqrt(3.0)        # nut across corners\n    mouth_d =\
    \ nut_ac + p.mouth_clear                # the nut drops through this\n    hex_r\
    \ = p.socket_af / math.sqrt(3.0)            # socket corner radius\n    hole_r\
    \ = (p.m5_d + p.bolt_clearance) / 2.0\n\n    def zp(z_use):\n        return h\
    \ - z_use\n\n    w = cq.Workplane(\"XY\").circle(R).extrude(h)\n    w = w.faces(\"\
    <Z\").chamfer(p.top_chamfer)        # bolt-tip face, chamfered rim\n\n    # finger\
    \ flutes: vertical grooves, stopped short of the mouth rim so the\n    # mouth\
    \ stays a clean round opening and the chamfered tip is untouched\n    n = int(p.n_flutes)\n\
    \    rr = p.flute_d / 2.0\n    rc = p.flute_center_r\n    pts = [(rc * math.cos(2.0\
    \ * math.pi * i / n), rc * math.sin(2.0 * math.pi * i / n))\n           for i\
    \ in range(n)]\n    z_lo, z_hi = zp(p.grip_top), zp(p.flute_z0)\n    w = w.cut(cq.Workplane(\"\
    XY\").workplane(offset=z_lo).pushPoints(pts)\n              .circle(rr).extrude(z_hi\
    \ - z_lo))\n\n    # ---- nut cavity, cut as ONE union (the knob is a single printed\
    \ piece)\n    cav = []\n    # mouth: shallow bore wider than the nut's corners,\
    \ so after pressing, the\n    # nut's face ends mouth_depth BELOW the surface\
    \ -> the nut is fully inside\n    cav.append(cq.Workplane(\"XY\").workplane(offset=zp(p.mouth_depth))\n\
    \               .circle(mouth_d / 2.0).extrude(p.mouth_depth))\n    # hex socket:\
    \ flats at socket_af (0.10 under the nut's flats) from the mouth\n    # floor\
    \ up to the closed end; the nut is press-fit on its six flats\n    apts = [(hex_r\
    \ * math.cos(math.radians(60.0 * k + 30.0)),\n             hex_r * math.sin(math.radians(60.0\
    \ * k + 30.0))) for k in range(6)]\n    hw = cq.Workplane(\"XY\").workplane(offset=zp(p.socket_depth)).moveTo(apts[0][0],\
    \ apts[0][1])\n    for q in apts[1:]:\n        hw = hw.lineTo(q[0], q[1])\n  \
    \  cav.append(hw.close().extrude(p.socket_depth))\n    # corner reliefs: six small\
    \ bores along the socket's corners, so the nut's\n    # corners have somewhere\
    \ to go and only its flats bear on the plastic\n    rpts = [(hex_r * math.cos(math.radians(60.0\
    \ * k)),\n             hex_r * math.sin(math.radians(60.0 * k))) for k in range(6)]\n\
    \    cav.append(cq.Workplane(\"XY\").workplane(offset=zp(p.socket_depth) - 0.2)\n\
    \               .pushPoints(rpts).circle(p.relief_d / 2.0)\n               .extrude(p.socket_depth\
    \ + 0.2))\n    # bolt hole: through the closed end and out the tip face. Its 5.5\
    \ mm is far\n    # under the nut's 9.24 mm corners, so the nut can never be pushed\
    \ out here\n    cav.append(cq.Workplane(\"XY\").workplane(offset=-1.0).circle(hole_r)\n\
    \               .extrude(zp(p.socket_depth) + 1.0))\n\n    cavity = cav[0]\n \
    \   for c in cav[1:]:\n        cavity = cavity.union(c)\n    return w.cut(cavity)"
  print_orientation: 'tip face down on the bed (the flat end the bolt tip comes out
    of), nut mouth up, exactly as modelled: z=0 is the tip face, z=knob_h is the mouth
    face'
  use_orientation: axis along the M5 bolt; the mouth face sits against the bolt head
    / workpiece, the bolt tip exits through the tip face (the printed bed face)
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    # Press-fit coupon: four blind hex pockets,\
    \ 0.10 mm apart in across-flats,\n    # same wall geometry, floor thickness and\
    \ corner reliefs as the knob's\n    # socket, so the pocket that fits by hand\
    \ tells you what socket_af to print.\n    L, W, T, F = p.coupon_l, p.coupon_w,\
    \ p.coupon_t, p.coupon_floor\n    n = int(p.coupon_n)\n    w = cq.Workplane(\"\
    XY\").box(L, W, T, centered=(True, True, False))\n    # marker notch: the pocket\
    \ nearest it is the tightest\n    w = w.cut(cq.Workplane(\"XY\").workplane(offset=-0.5).center(-L\
    \ / 2.0, 0.0)\n              .circle(p.coupon_notch_r).extrude(T + 1.0))\n   \
    \ for i in range(n):\n        af = p.socket_af + (i - 1) * p.coupon_step   # socket_af-0.1\
    \ ... +0.2\n        x = (i - (n - 1) / 2.0) * p.coupon_spacing\n        r = af\
    \ / math.sqrt(3.0)\n        pts = [(x + r * math.cos(math.radians(60.0 * k + 30.0)),\n\
    \                r * math.sin(math.radians(60.0 * k + 30.0))) for k in range(6)]\n\
    \        hw = cq.Workplane(\"XY\").workplane(offset=T - F).moveTo(pts[0][0], pts[0][1])\n\
    \        for q in pts[1:]:\n            hw = hw.lineTo(q[0], q[1])\n        pocket\
    \ = hw.close().extrude(F)\n        rp = [(x + r * math.cos(math.radians(60.0 *\
    \ k)),\n               r * math.sin(math.radians(60.0 * k))) for k in range(6)]\n\
    \        pocket = pocket.union(cq.Workplane(\"XY\").workplane(offset=T - F - 0.2)\n\
    \                              .pushPoints(rp).circle(p.relief_d / 2.0).extrude(F\
    \ + 0.2))\n        w = w.cut(pocket)\n    return w"
  print_orientation: flat on the bed, the face with the four hex pockets up, as modelled
    (z=0 is the bed)
  use_orientation: not used in the finished knob - throwaway fit test
hardware:
- id: nut_m5
  ref: ISO 4032 M5
  qty: 1
- id: bolt_m5
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: knob_nut
  fastener: nut_m5
  axis_origin:
  - 0.0
  - 0.0
  - 19.15
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: hex_socket
    role: nut_pocket
  - part: knob
    feature: nut_mouth
    role: clearance
  nut: null
  external: null
- id: knob_bolt
  fastener: bolt_m5
  axis_origin:
  - 0.0
  - 0.0
  - 22.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: mouth_shoulder
    role: head_seat
  - part: knob
    feature: bolt_hole
    role: clearance
  nut: nut_m5
  external: null
criteria:
- id: nut_press_fit
  part: knob
  feature: hex_socket
  relation: seats
  hardware: nut_m5
  clearance_mm: null
  params:
  - nut_af
  - nut_h
  - socket_af
  - socket_depth
  - mouth_depth
  - relief_d
  check:
    method: coupon
    ref: fit_coupon
    description: On the coupon, the pocket labelled by the 7.90 mm socket_af pocket
      must take an M5 nut with firm thumb pressure and no cracking. If only a neighbouring
      pocket is pressable by hand, set socket_af to that pocket's across-flats and
      reprint the knob.
- id: nut_holds_inverted
  part: knob
  feature: hex_socket
  relation: engages
  hardware: nut_m5
  clearance_mm: null
  params:
  - socket_af
  - nut_af
  - relief_d
  check:
    method: coupon
    ref: fit_coupon
    description: 'With a nut pressed home in each coupon pocket, hold the coupon upside
      down and shake it: the nut must not drop. The 0.10 mm interference over six
      flats is what holds it - no glue.'
- id: nut_fully_inside
  part: knob
  feature: nut_mouth
  relation: contains
  hardware: nut_m5
  clearance_mm: null
  params:
  - mouth_depth
  - nut_h
  - socket_depth
  - mouth_clear
  check:
    method: measure
    ref: null
    description: 'After pressing home, the nut''s outer face should sit about 0.5
      mm below the knob''s mouth face (finger-test: the rim is proud of the nut).
      The nut''s far face ends ~0.3 mm under the closed end.'
- id: nut_cannot_be_pushed_out
  part: knob
  feature: socket_end
  relation: supports
  hardware: nut_m5
  clearance_mm: null
  params:
  - m5_d
  - bolt_clearance
  - nut_af
  check:
    method: measure
    ref: null
    description: The tip hole is 5.5 mm; the nut is 9.24 mm across corners, so the
      closed end physically blocks the nut from being pushed or driven out of the
      far side. Verify the printed hole measures 5.5-5.8 mm, i.e. well under 8.0 mm.
- id: bolt_passes_through
  part: knob
  feature: bolt_hole
  relation: clears
  hardware: bolt_m5
  clearance_mm: 0.25
  params:
  - m5_d
  - bolt_clearance
  - socket_depth
  check:
    method: measure
    ref: null
    description: An M5 shank must drop freely through the hole and out the tip face
      once the bolt is threaded into the captured nut.
- id: head_seats_on_knob
  part: knob
  feature: mouth_shoulder
  relation: faces
  hardware: bolt_m5
  clearance_mm: null
  params:
  - m5_head_d
  - mouth_depth
  - mouth_clear
  check:
    method: none
    ref: null
    description: The 8.5 mm head (9.24 mm across corners on a hex-head bolt) enters
      the 9.59 mm mouth bore and stops on the shoulder at 0.5 mm depth, so the knob's
      face - not the plastic socket walls - takes the clamping load. A large flange
      head will not enter; then the knob simply stands off the workpiece.
- id: socket_wall
  part: knob
  feature: flute_grooves
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - knob_dia
  - flute_d
  - flute_center_r
  - socket_af
  - relief_d
  check:
    method: none
    ref: null
    description: Scallop floors are at r=12 mm, the socket's outermost point (relief
      bores) is at r=5.96 mm -> 6 mm of solid around the press fit, so the socket
      walls stay stiff and the interference is real.
manual:
- n: '1'
  text: 'Print both parts, as modelled. knob: standing on its tip face (the end the
    bolt tip comes out of) with the nut mouth pointing up - no supports anywhere.
    fit_coupon: flat, pockets up. Settings that matter for the press fit: 0.2 mm layers,
    4+ side walls, 30-40 % infill, and the same nozzle temp/speed you''ll use for
    the knob. Both parts print with the socket walls as vertical perimeters, which
    is why the pockets are the right size.'
  parts:
  - knob
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: 'Calibrate the fit on the coupon before you trust the knob. Press an M5 nut
    into each of the four pockets, hardest first: the pocket next to the corner notch
    is 0.10 mm tighter than the knob''s socket, then the knob size (7.90), then 0.10
    and 0.20 mm looser. A nut is in by hand when your thumb can drive it home in one
    smooth push without cracking the plastic; it is retained when the coupon held
    upside down and shaken does not drop it.'
  parts:
  - fit_coupon
  hardware:
  - nut_m5
  tool: null
- n: '3'
  text: Pick the size. Leave knob's socket_af at 7.90 if the 7.90 pocket both pressed
    in by hand and held. If the 7.80/7.90 pockets were too tight to press but the
    nut is loose in 8.00, keep 7.90 and use step 4's drift instead of your thumb.
    If even the loosest pocket drops out upside down, raise socket_af by 0.05 mm steps
    on the knob - interference, not glue, is what holds the nut. If your printer runs
    large on internal features, drop socket_af by 0.05 mm.
  parts:
  - knob
  hardware: []
  tool: null
- n: '4'
  text: 'Fit the nut to the knob. Stand the knob on its tip face, mouth up. Drop the
    nut into the round mouth - its corners pass the 9.59 mm bore freely and its top
    enters the hexagonal socket; it will only sit one way, flats against the socket
    flats (all six rotations are equivalent). Press straight down on the nut''s face
    with your thumb about 4.5 mm. If the thumb is not enough, use the end of another
    M5 bolt or a 8 mm drift as a punch: its face lands on the nut, not on the socket
    walls. Stop when the nut''s face is about 0.5 mm below the mouth rim - that is
    fully inside, with ~0.3 mm clearance at the closed end. Do not hammer it: the
    corner reliefs mean the flats are doing the work.'
  parts:
  - knob
  hardware:
  - nut_m5
  tool: null
- n: '5'
  text: 'Retention check: hold the knob with the mouth straight down over a soft surface,
    shake it and tap the side on the bench. The nut must stay in. If it drops, the
    press fit is too loose - reprint with socket_af 0.05-0.10 mm lower (or press the
    nut home with the drift, so it seats fully on its flats).'
  parts:
  - knob
  hardware:
  - nut_m5
  tool: null
- n: '6'
  text: Use it. Thread the knob onto your M5 bolt and turn; the captured nut drives
    the bolt and the bolt's head bears on the shoulder around the mouth. The shank
    goes through the nut and the tip comes out of the hole in the opposite face -
    it can keep protruding, that is normal, and it is also what makes the nut impossible
    to push out of the far side. Any M5 length works (the ISO 4762 M5x30 listed here
    is only an example). Turn with two fingers in the flutes; the plain collar around
    the mouth is where your palm rests.
  parts:
  - knob
  hardware:
  - bolt_m5
  - nut_m5
  tool: null
- n: '7'
  text: 'Taking the nut out (it is not a consumable - it comes back out to reuse):
    stand the knob on its tip face, mouth up, and push the nut out with a dowel, awl
    or the shank of a bolt pressed on the nut''s face. It levers out with thumb pressure
    because the interference is only 0.05 mm per flat. To reuse, press it back in
    as in step 4.'
  parts:
  - knob
  hardware:
  - nut_m5
  tool: dowel or bolt shank
