task: nut-knob/M5
note: The knob is 30 mm across and 11 mm tall, with 6 finger scallops. The nut sits
  in a hex pocket 8.1 mm across flats and 5.0 mm deep, with three vertical crush ribs
  and a lead-in chamfer. Below it is a 5 mm floor with a 5.5 mm bolt hole. The pocket
  opens upward when printed, so there are no bridges or overhangs.
questions: []
params:
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: about 30 mm across, as requested
  knob_h:
    value: 11
    unit: mm
    kind: design
    source: design
    note: ''
  lobe_count:
    value: 6
    unit: count
    kind: design
    source: design
    note: ''
  scallop_r:
    value: 4
    unit: mm
    kind: design
    source: design
    note: finger scallops around the rim
  edge_chamfer:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: ''
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 height
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
