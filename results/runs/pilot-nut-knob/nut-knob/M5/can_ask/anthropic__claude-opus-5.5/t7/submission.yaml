    value: 5.5
    unit: mm
    kind: design
    source: design
    note: clearance hole on the closed side. Smaller than the nut's 8 mm across-flats,
      so the nut can't be pushed through
  pocket_af:
    value: 8.1
    unit: mm
    kind: design
    source: design
    note: hex pocket across flats, 0.1 mm over the nut. Crush ribs do the gripping
  pocket_recess:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: the nut sits this far below the open face, fully inside the knob
  lead_in:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: chamfer at the pocket mouth, rib-free
  rib_r:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: ''
  rib_protrusion:
    value: 0.25
    unit: mm
    kind: design
    source: design
    note: how far each of the 3 vertical crush ribs sticks into the pocket. Set this
      from the coupon
  rib_try_1:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: ''
  rib_try_2:
    value: 0.25
    unit: mm
    kind: design
    source: design
    note: ''
  rib_try_3:
    value: 0.35
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    D = p.knob_d; H = p.knob_h\n    body =\
    \ cq.Workplane('XY').circle(D/2).extrude(H).edges().chamfer(p.edge_chamfer)\n\
    \    n = int(p.lobe_count)\n    for i in range(n):\n        a = math.radians(360.0/n*i\
    \ + 180.0/n)\n        rr = D/2 + p.scallop_r*0.4\n        c = cq.Workplane('XY').center(rr*math.cos(a),\
    \ rr*math.sin(a)).circle(p.scallop_r).extrude(H)\n        body = body.cut(c)\n\
    \    body = body.cut(cq.Workplane('XY').circle(p.bolt_clear/2).extrude(H))\n \
    \   depth = p.nut_h + p.pocket_recess\n    k = 1.0/math.cos(math.radians(30))\n\
    \    pocket = cq.Workplane('XY').workplane(offset=H-depth).polygon(6, p.pocket_af*k).extrude(depth+1)\n\
    \    body = body.cut(pocket)\n    lead = (cq.Workplane('XY').workplane(offset=H-p.lead_in).polygon(6,\
    \ p.pocket_af*k)\n            .workplane(offset=p.lead_in+0.01).polygon(6, (p.pocket_af+2*p.lead_in)*k).loft())\n\
    \    body = body.cut(lead)\n    rib_h = depth - p.lead_in\n    for ang in (30,\
    \ 150, 270):\n        a = math.radians(ang)\n        dist = p.pocket_af/2 + p.rib_r\
    \ - p.rib_protrusion\n        rib = (cq.Workplane('XY').workplane(offset=H-depth)\n\
    \               .center(dist*math.cos(a), dist*math.sin(a)).circle(p.rib_r).extrude(rib_h))\n\
    \        body = body.union(rib)\n    return body\n"
  print_orientation: Closed (grip) face on the bed, hex pocket opening facing up.
    No supports or bridges needed.
  use_orientation: Closed face toward your hand. The pocket side faces the work, and
    the bolt comes out through the closed face.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    depth = p.nut_h + p.pocket_recess\n   \
    \ T = depth + 1.2\n    pitch = 14.0\n    k = 1.0/math.cos(math.radians(30))\n\
    \    blk = cq.Workplane('XY').box(3*pitch, 14, T, centered=(True, True, False))\n\
    \    tries = [p.rib_try_1, p.rib_try_2, p.rib_try_3]\n    for j, prot in enumerate(tries):\n\
    \        x = (j-1)*pitch\n        blk = blk.cut(cq.Workplane('XY').center(x, 0).circle(p.bolt_clear/2).extrude(T))\n\
    \        blk = blk.cut(cq.Workplane('XY').workplane(offset=T-depth).center(x,\
    \ 0).polygon(6, p.pocket_af*k).extrude(depth+1))\n        lead = (cq.Workplane('XY').workplane(offset=T-p.lead_in).center(x,\
    \ 0).polygon(6, p.pocket_af*k)\n                .workplane(offset=p.lead_in+0.01).polygon(6,\
    \ (p.pocket_af+2*p.lead_in)*k).loft())\n        blk = blk.cut(lead)\n        for\
    \ ang in (30, 150, 270):\n            a = math.radians(ang)\n            dist\
    \ = p.pocket_af/2 + p.rib_r - prot\n            rib = (cq.Workplane('XY').workplane(offset=T-depth)\n\
    \                   .center(x + dist*math.cos(a), dist*math.sin(a)).circle(p.rib_r).extrude(depth\
    \ - p.lead_in))\n            blk = blk.union(rib)\n        # marker notches: j+1\
    \ small notches on the edge next to each pocket\n        for m in range(j+1):\n\
    \            blk = blk.cut(cq.Workplane('XY').center(x - 3 + m*3, -7).rect(1.2,\
    \ 1.6).extrude(T))\n    return blk\n"
  print_orientation: Flat face on the bed, pockets facing up
  use_orientation: 'Test only: press the nut into each pocket'
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
joints: []
criteria:
- id: c_press
  part: knob
  feature: hex pocket with crush ribs
  relation: contains
