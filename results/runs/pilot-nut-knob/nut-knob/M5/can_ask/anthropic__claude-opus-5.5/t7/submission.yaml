    ref: null
    description: ''
manual:
- n: '1'
  text: Print fit_coupon first (PLA, 0.2 mm layers, no supports, flat face down).
    The pockets are marked by 1, 2 and 3 edge notches. They have rib protrusions of
    0.15, 0.25 and 0.35 mm.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Press the M5 nut into each pocket with your thumb, flat face first, lining
    up its flats with the pocket. Choose the tightest pocket where the nut still goes
    fully in by hand and doesn't fall out when you turn the coupon over and shake
    it. Set rib_protrusion to that pocket's value. The default is 0.25 (2 notches).
    To get the nut back out, push it out with a screwdriver through the 5.5 mm hole.
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: Print the knob with the closed, scalloped face on the bed and the hex pocket
    opening facing up. No supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '4'
  text: Line the nut up with the hex pocket and press it in by hand until it bottoms
    out, about 0.3 mm below the face. If it's stiff, put the knob pocket-up on the
    table and press the nut down with your thumb or a flat object. Check that it stays
    in when you turn the knob upside down.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Thread your M5 bolt into the nut from the pocket side, so it goes through
    the nut and out through the 5.5 mm hole in the closed face. Turn the knob by hand
    to tighten.
  parts:
  - knob
  hardware:
  - nut
  tool: null
