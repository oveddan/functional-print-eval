  params:
  - nut_h
  - pocket_recess
  check:
    method: measure
    ref: null
    description: Once pressed in, the nut sits about 0.3 mm below the face, not proud
- id: c_stop
  part: knob
  feature: pocket floor / 5.5 mm bolt hole
  relation: supports
