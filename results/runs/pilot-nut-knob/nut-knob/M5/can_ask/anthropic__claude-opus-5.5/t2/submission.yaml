task: nut-knob/M5
note: The 30 mm scalloped knob is 10 mm tall. The pocket is a hex with a little clearance
  and 3 crush ribs that hold the nut by friction, so no glue is needed. A 5 mm floor
  with a 5.5 mm hole stops the nut from going through. The pocket prints facing up,
  so it needs no supports or bridges.
questions: []
params:
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 height
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  bolt_clear_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: M5 clearance, smaller than the nut so it can't push through
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: design
    note: ''
  knob_h:
    value: 10
    unit: mm
    kind: design
    source: design
    note: ''
  pocket_extra_depth:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: nut sits 0.4 mm below the top face
  pocket_clear:
    value: 0.25
    unit: mm
    kind: design
    source: design
    note: added to across-flats so the nut drops in between the ribs
  rib_r:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: ''
  rib_interf:
    value: 0.3
    unit: mm
    kind: design
    source: design
