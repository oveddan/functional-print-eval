manual:
- n: '1'
  text: Print fit_coupon. It has three pockets with tighter and tighter ribs, marked
    with 1, 2 and 3 dots. Press an M5 nut into each one by thumb. Pick the pocket
    where the nut goes in with firm thumb pressure, sits flat, and doesn't fall out
    when you turn the coupon over and tap it. 1 dot = 0.15, 2 dots = 0.30, 3 dots
    = 0.45. Set rib_interf to that value. The default is 0.30.
  parts:
  - fit_coupon
  hardware:
  - nut
  tool: null
- n: '2'
  text: Print the knob with the flat floor on the bed and the hex pocket facing up.
    Use 3 or more walls and 30% or more infill so it's strong around the nut.
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Line up the nut's flats with the pocket and press it straight down with your
    thumb, or squeeze it in with a vise, until it sits on the pocket floor just below
    the top face.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: 'Use it: put the floor side against your work. Thread the M5 bolt up through
    the floor hole and into the nut. It can stick out of the pocket side. Turn the
    knob by hand.'
  parts:
  - knob
  hardware:
  - nut
  tool: null
