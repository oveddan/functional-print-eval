task: nut-knob/M5
note: The knob is 30 mm across and 10 mm tall, with 8 finger scallops around the edge.
  The M5 nut press-fits into a hex pocket 5.0 mm deep, so it sits 0.3 mm below the
  face. Under it is a 5 mm floor with a 5.6 mm hole for the bolt. The hole is smaller
  than the nut, so the nut can't come out the far side. Because the pocket opens upward,
  the print has no bridges or overhangs. The coupon lets you set the press-fit size.
questions: []
