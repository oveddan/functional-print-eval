manual:
- n: '1'
  text: Print pocket_coupon flat, with the openings facing up. The pockets go from
    7.9 to 8.3 mm across flats, left to right, and the dots at the front edge count
    1 to 5.
  parts:
  - pocket_coupon
  hardware: []
  tool: null
- n: '2'
  text: Press the M5 nut into each pocket with your thumb. Pick the smallest pocket
    where the nut goes all the way down by hand and stays in when you hold the coupon
    upside down and shake it. If that isn't pocket 3 (8.1 mm), set nut_pocket_af to
    that pocket's size. Check that an M5 bolt passes through the hole in the floor.
  parts:
  - pocket_coupon
  hardware:
  - nut
  tool: null
- n: '3'
  text: Print the knob with its flat solid bottom on the bed and the hex pocket facing
    up. You don't need supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '4'
  text: Line the nut's flats up with the pocket and press it in by hand until it bottoms
    out. It should end up flush with the top face or slightly below it. If it's tight,
    press it against a table edge, or warm the pocket briefly with a hair dryer.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Thread your M5 bolt through the nut and out through the hole in the floor.
    The floor holds the nut when you tighten from the pocket side. Turn the knob by
    hand.
  parts:
  - knob
  hardware:
  - nut
  tool: null
