parts:
- id: pocket_coupon
  role: coupon
  material: PLA
  code: "import math\ndef build(p):\n    sizes=[p.c_af1,p.c_af2,p.c_af3,p.c_af4,p.c_af5]\n\
    \    n=len(sizes)\n    L=n*p.coupon_pitch\n    W=16.0\n    H=p.coupon_floor+p.pocket_depth\n\
    \    c=cq.Workplane('XY').box(L,W,H,centered=(True,True,False))\n    for i,af\
    \ in enumerate(sizes):\n        x=-L/2+p.coupon_pitch*(i+0.5)\n        d=af/math.cos(math.radians(30))\n\
    \        pk=cq.Workplane('XY').workplane(offset=p.coupon_floor).center(x,1.5).polygon(6,d).extrude(p.pocket_depth+1)\n\
    \        c=c.cut(pk)\n        h=cq.Workplane('XY').center(x,1.5).circle(p.bolt_clear_d/2).extrude(H)\n\
    \        c=c.cut(h)\n        for j in range(i+1):\n            dx=x+(j-i/2.0)*1.8\n\
    \            dot=cq.Workplane('XY').workplane(offset=H-0.6).center(dx,-W/2+1.6).circle(0.5).extrude(1)\n\
    \            c=c.cut(dot)\n    return c\n"
  print_orientation: flat underside on the bed, pocket openings facing up (same as
    the knob)
  use_orientation: test only
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    R=p.knob_d/2\n    k=cq.Workplane('XY').circle(R).extrude(p.knob_h)\n\
    \    k=k.edges().chamfer(p.edge_chamfer)\n    n=int(p.grip_count)\n    off=R+p.grip_r*0.4\n\
    \    for i in range(n):\n        a=2*math.pi*i/n\n        s=cq.Workplane('XY').center(off*math.cos(a),off*math.sin(a)).circle(p.grip_r).extrude(p.knob_h)\n\
    \        k=k.cut(s)\n    d=p.nut_pocket_af/math.cos(math.radians(30))\n    pk=cq.Workplane('XY').workplane(offset=p.knob_h-p.pocket_depth).polygon(6,d).extrude(p.pocket_depth+1)\n\
    \    k=k.cut(pk)\n    h=cq.Workplane('XY').circle(p.bolt_clear_d/2).extrude(p.knob_h)\n\
    \    k=k.cut(h)\n    return k\n"
  print_orientation: flat bottom (solid floor with bolt hole) on the bed, nut pocket
    opening facing up; no supports or bridges
  use_orientation: nut pocket faces the bolt head side or the work, either way; the
    bolt passes through nut and floor
