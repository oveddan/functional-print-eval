task: nut-knob/M5
note: One-piece 30 mm PLA hand knob. An ISO 4032 M5 nut drops into a hex pocket 0.5
  mm over nominal and is gripped by three vertical spring clips (0.25 mm interference,
  relief slots behind them) so a thumb press retains it upside down without glue.
  A 2.4 mm shoulder with a 5.5 mm hole stops the nut from being pushed out the far
  side while letting the M5 bolt pass through. Nut size could not be measured, so
  the trap is sized from the catalog and a fit coupon uses the same pocket.
questions: []
params:
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 width across flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 nut thickness
  bolt_d:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: M5 nominal screw diameter
  knob_od:
    value: 30.0
    unit: mm
    kind: design
    source: design
    note: About 30 mm across, as requested
  knob_h:
    value: 18.0
    unit: mm
    kind: design
    source: design
    note: Grip height; nut sits well below the top face
  coupon_od:
    value: 26.0
    unit: mm
    kind: design
    source: design
    note: Fit coupon outer diameter
  coupon_h:
    value: 12.0
    unit: mm
    kind: design
    source: design
    note: Fit coupon height; same trap as the knob
  shoulder_t:
    value: 2.4
    unit: mm
    kind: design
    source: design
    note: Solid floor under the nut; bolt hole is smaller than the nut
  bolt_hole_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Clearance hole for an M5 bolt, smaller than nut across flats
  exit_relief_d:
    value: 6.8
    unit: mm
    kind: design
    source: design
    note: Shallow exit counterbore so elephant foot cannot pinch the bolt; still smaller
      than the nut
  exit_relief_h:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Depth of the exit counterbore
  pocket_af:
    value: 8.5
    unit: mm
    kind: design
    source: design
    note: Hex pocket across flats; 0.5 mm over nominal so the nut slides in and flats
      take torque
  mouth_af:
    value: 10.2
    unit: mm
    kind: design
    source: design
    note: Wider hex mouth so the nut starts easily; clears across-corners of an 8
      mm nut
  mouth_h:
    value: 1.6
    unit: mm
    kind: design
    source: design
    note: Depth of the lead-in mouth
  clip_count:
    value: 3
    unit: mm
    kind: design
    source: design
    note: Three spring clips on alternate flats
  clip_interference:
    value: 0.25
    unit: mm
    kind: design
    source: design
    note: How far each clip stands inside the nut flat, per side
  clip_t:
    value: 1.2
    unit: mm
    kind: design
    source: design
    note: Clip thickness, three 0.4 mm perimeters
  clip_w:
    value: 3.2
    unit: mm
    kind: design
    source: design
    note: Clip width along the flat
  clip_extra:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: Full-grip length above the catalog nut height
  lead_in_h:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: Ramp at the top of each clip
  relief_gap:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: Slot behind each clip so it can flex
  relief_extra_w:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Relief wider than the clip so the sides are free
  root_embed:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Clip rooted into the shoulder
  grip_count:
    value: 6
    unit: mm
    kind: design
    source: design
    note: Finger scallops
  grip_depth:
    value: 3.5
    unit: mm
    kind: design
    source: design
    note: Scallop depth
  grip_cutter_r:
    value: 6.0
    unit: mm
    kind: design
    source: design
    note: Scallop cutter radius
  grip_phase_deg:
    value: 30.0
    unit: mm
    kind: design
    source: design
    note: Scallops between the clips so the wall behind each clip stays thick
  top_chamfer:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Top outer edge break
parts:
- id: knob
  role: final
  material: PLA
  code: "def build(p):\n    import math\n\n    def hex_prism(af, z0, depth, rot_deg):\n\
    \        R = af / math.sqrt(3.0)\n        pts = []\n        for i in range(6):\n\
    \            a = math.radians(rot_deg + i * 60.0)\n            pts.append((R *\
    \ math.cos(a), R * math.sin(a)))\n        return (\n            cq.Workplane('XY')\n\
    \            .workplane(offset=z0)\n            .polyline(pts)\n            .close()\n\
    \            .extrude(depth)\n        )\n\n    def add_nut_trap(body, part_h):\n\
    \        body = body.cut(hex_prism(p.pocket_af, p.shoulder_t, part_h - p.shoulder_t\
    \ + 1.0, 30.0))\n        r_in = p.nut_af / 2.0 - p.clip_interference\n       \
    \ r_pocket = p.pocket_af / 2.0\n        r_out = r_in + p.clip_t\n        r_embed\
    \ = r_out + p.relief_gap + 0.5\n        z_root = p.shoulder_t - p.root_embed\n\
    \        z_grip = p.shoulder_t + p.nut_h + p.clip_extra\n        z_top = z_grip\
    \ + p.lead_in_h\n        hw = p.clip_w / 2.0\n        for i in range(int(p.clip_count)):\n\
    \            ang = i * 360.0 / float(p.clip_count)\n            pts = [\n    \
    \            (r_in, z_root),\n                (r_embed, z_root),\n           \
    \     (r_embed, z_top),\n                (r_pocket, z_top),\n                (r_in,\
    \ z_grip),\n            ]\n            clip = (\n                cq.Workplane('XZ')\n\
    \                .polyline(pts)\n                .close()\n                .extrude(p.clip_w)\n\
    \                .translate((0, -hw, 0))\n                .rotate((0, 0, 0), (0,\
    \ 0, 1), ang)\n            )\n            body = body.union(clip)\n          \
    \  slot_z0 = p.shoulder_t + 0.05\n            slot_h = part_h - slot_z0 + 1.0\n\
    \            relief_w = p.clip_w + p.relief_extra_w\n            r_mid = r_out\
    \ + p.relief_gap / 2.0\n            slot = (\n                cq.Workplane('XY')\n\
    \                .box(p.relief_gap, relief_w, slot_h)\n                .translate((r_mid,\
    \ 0, slot_z0 + slot_h / 2.0))\n                .rotate((0, 0, 0), (0, 0, 1), ang)\n\
    \            )\n            body = body.cut(slot)\n        mouth_z = part_h -\
    \ p.mouth_h\n        body = body.cut(hex_prism(p.mouth_af, mouth_z, p.mouth_h\
    \ + 1.0, 30.0))\n        body = body.cut(\n            cq.Workplane('XY').circle(p.bolt_hole_d\
    \ / 2.0).extrude(part_h + 2.0).translate((0, 0, -1.0))\n        )\n        body\
    \ = body.cut(\n            cq.Workplane('XY').circle(p.exit_relief_d / 2.0).extrude(p.exit_relief_h)\n\
    \        )\n        return body\n\n    body = cq.Workplane('XY').circle(p.knob_od\
    \ / 2.0).extrude(p.knob_h)\n    body = body.edges('>Z').chamfer(p.top_chamfer)\n\
    \    n = int(p.grip_count)\n    for i in range(n):\n        a = math.radians(i\
    \ * 360.0 / n + p.grip_phase_deg)\n        rad = p.knob_od / 2.0 + p.grip_cutter_r\
    \ - p.grip_depth\n        cutter = (\n            cq.Workplane('XY')\n       \
    \     .center(math.cos(a) * rad, math.sin(a) * rad)\n            .circle(p.grip_cutter_r)\n\
    \            .extrude(p.knob_h)\n        )\n        body = body.cut(cutter)\n\
    \    return add_nut_trap(body, p.knob_h)\n"
  print_orientation: Shoulder face on the bed (z=0); nut opening faces up. No supports.
  use_orientation: Opening up. Nut is pressed in from the top and seats on the shoulder.
    The M5 bolt passes through the nut and exits the flat shoulder face.
- id: fit-coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    import math\n\n    def hex_prism(af, z0, depth, rot_deg):\n\
    \        R = af / math.sqrt(3.0)\n        pts = []\n        for i in range(6):\n\
    \            a = math.radians(rot_deg + i * 60.0)\n            pts.append((R *\
    \ math.cos(a), R * math.sin(a)))\n        return (\n            cq.Workplane('XY')\n\
    \            .workplane(offset=z0)\n            .polyline(pts)\n            .close()\n\
    \            .extrude(depth)\n        )\n\n    def add_nut_trap(body, part_h):\n\
    \        body = body.cut(hex_prism(p.pocket_af, p.shoulder_t, part_h - p.shoulder_t\
    \ + 1.0, 30.0))\n        r_in = p.nut_af / 2.0 - p.clip_interference\n       \
    \ r_pocket = p.pocket_af / 2.0\n        r_out = r_in + p.clip_t\n        r_embed\
    \ = r_out + p.relief_gap + 0.5\n        z_root = p.shoulder_t - p.root_embed\n\
    \        z_grip = p.shoulder_t + p.nut_h + p.clip_extra\n        z_top = z_grip\
    \ + p.lead_in_h\n        hw = p.clip_w / 2.0\n        for i in range(int(p.clip_count)):\n\
    \            ang = i * 360.0 / float(p.clip_count)\n            pts = [\n    \
    \            (r_in, z_root),\n                (r_embed, z_root),\n           \
    \     (r_embed, z_top),\n                (r_pocket, z_top),\n                (r_in,\
    \ z_grip),\n            ]\n            clip = (\n                cq.Workplane('XZ')\n\
    \                .polyline(pts)\n                .close()\n                .extrude(p.clip_w)\n\
    \                .translate((0, -hw, 0))\n                .rotate((0, 0, 0), (0,\
    \ 0, 1), ang)\n            )\n            body = body.union(clip)\n          \
    \  slot_z0 = p.shoulder_t + 0.05\n            slot_h = part_h - slot_z0 + 1.0\n\
    \            relief_w = p.clip_w + p.relief_extra_w\n            r_mid = r_out\
    \ + p.relief_gap / 2.0\n            slot = (\n                cq.Workplane('XY')\n\
    \                .box(p.relief_gap, relief_w, slot_h)\n                .translate((r_mid,\
    \ 0, slot_z0 + slot_h / 2.0))\n                .rotate((0, 0, 0), (0, 0, 1), ang)\n\
    \            )\n            body = body.cut(slot)\n        mouth_z = part_h -\
    \ p.mouth_h\n        body = body.cut(hex_prism(p.mouth_af, mouth_z, p.mouth_h\
    \ + 1.0, 30.0))\n        body = body.cut(\n            cq.Workplane('XY').circle(p.bolt_hole_d\
    \ / 2.0).extrude(part_h + 2.0).translate((0, 0, -1.0))\n        )\n        body\
    \ = body.cut(\n            cq.Workplane('XY').circle(p.exit_relief_d / 2.0).extrude(p.exit_relief_h)\n\
    \        )\n        return body\n\n    body = cq.Workplane('XY').circle(p.coupon_od\
    \ / 2.0).extrude(p.coupon_h)\n    body = body.edges('>Z').chamfer(0.6)\n    return\
    \ add_nut_trap(body, p.coupon_h)\n"
  print_orientation: Shoulder face on the bed (z=0); nut opening faces up. No supports.
  use_orientation: Test print only. Same nut trap as the knob, so the press fit can
    be checked before printing the knob.
hardware:
- id: nut_m5
  ref: ISO 4032 M5
  qty: 1
joints: []
criteria:
- id: nut-inside
  part: knob
  feature: hex pocket
  relation: contains
  hardware: nut_m5
  clearance_mm: null
  params:
  - nut_af
  - nut_h
  - knob_h
  - shoulder_t
  - pocket_af
  check:
    method: coupon
    ref: fit-coupon
    description: Press the nut in until it stops. Its top face must sit below the
      rim of the opening, fully inside the part.
- id: nut-stays
  part: knob
  feature: spring clips
  relation: engages
  hardware: nut_m5
  clearance_mm: null
  params:
  - nut_af
  - clip_interference
  - clip_t
  - clip_w
  - relief_gap
  check:
    method: coupon
    ref: fit-coupon
    description: With the nut seated, turn the part upside down over your hand. The
      nut must stay in. No glue.
- id: nut-seats
  part: knob
  feature: shoulder
  relation: seats
  hardware: nut_m5
  clearance_mm: null
  params:
  - nut_h
  - shoulder_t
  check:
    method: coupon
    ref: fit-coupon
    description: The nut must stop on the internal floor, not keep sliding. The floor
      is the face that was on the print bed, seen through the small hole.
- id: no-push-through
  part: knob
  feature: shoulder hole
  relation: supports
  hardware: nut_m5
  clearance_mm: null
  params:
  - nut_af
  - bolt_hole_d
  - exit_relief_d
  check:
    method: coupon
    ref: fit-coupon
    description: From the bed face, push the M5 bolt against the nut. The nut must
      not come out through that face. The hole is 5.5 mm; the nut is 8 mm across flats.
- id: bolt-clears
  part: knob
  feature: through hole
  relation: clears
  hardware: null
  clearance_mm: 0.25
  params:
  - bolt_d
  - bolt_hole_d
  check:
    method: measure
    ref: null
    description: An M5 bolt must pass through the nut and stick out of the flat shoulder
      face.
- id: torque-flats
  part: knob
  feature: hex pocket flats
  relation: supports
  hardware: nut_m5
  clearance_mm: null
  params:
  - nut_af
  - pocket_af
  check:
    method: coupon
    ref: fit-coupon
    description: Once seated, the nut must not spin freely in the pocket. Turning
      the part must turn the nut.
manual:
- n: '1'
  text: Slice fit-coupon in PLA at 0.2 mm layers, 0.4 mm nozzle, 4 walls, 100% infill.
    No supports. Do not scale it. Print it and let it cool.
  parts:
  - fit-coupon
  hardware: []
  tool: null
- n: '2'
  text: Hold fit-coupon with the open hex facing up (the face that was off the bed).
    Align an ISO 4032 M5 nut with the hex and press it in with your thumb until it
    stops on the floor. It should take a firm push, not a hammer.
  parts:
  - fit-coupon
  hardware:
  - nut_m5
  tool: null
- n: '3'
  text: Turn fit-coupon upside down over your hand. The nut must stay in. Then, from
    the flat bed face, push your M5 bolt against the nut. The nut must not come out
    through that small hole.
  parts:
  - fit-coupon
  hardware:
  - nut_m5
  tool: null
- n: '4'
  text: Thread your M5 bolt into the nut and pull the nut back out through the opening,
    straight along the hole. Keep the nut for the knob. The coupon is only a test.
  parts:
  - fit-coupon
  hardware:
  - nut_m5
  tool: null
- n: '5'
  text: 'Slice knob the same way: PLA, 0.2 mm layers, 0.4 mm nozzle, 4 walls, 40%
    infill, no supports, no scaling. The flat face goes on the bed. Print and let
    it cool.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '6'
  text: Press the same M5 nut into the open top of knob until it seats on the shoulder.
    It must sit fully below the rim. No glue.
  parts:
  - knob
  hardware:
  - nut_m5
  tool: null
- n: '7'
  text: Turn the knob upside down. The nut must stay in. Thread your M5 bolt through
    the nut until it comes out the flat face. Tighten by hand with the knob.
  parts:
  - knob
  hardware:
  - nut_m5
  tool: null
