parts:
- id: knob
  role: final
  material: PLA (high-speed, black), 0.4 mm nozzle, 0.2 mm layers
  code: "import math\n\ndef build(p):\n    R = p.knob_od / 2.0\n    h = p.knob_h\n\
    \    body = cq.Workplane(\"XY\").circle(R).extrude(h)\n\n    n = int(p.flute_n)\n\
    \    gr = p.flute_d / 2.0\n    for i in range(n):\n        a = 2.0 * math.pi *\
    \ i / n\n        cx = p.flute_orbit * math.cos(a)\n        cy = p.flute_orbit\
    \ * math.sin(a)\n        cut = (cq.Workplane(\"XY\").workplane(offset=p.flute_z0)\n\
    \               .center(cx, cy).circle(gr)\n               .extrude(p.flute_z1\
    \ - p.flute_z0))\n        body = body.cut(cut)\n\n    body = body.faces(\">Z\"\
    ).edges().chamfer(p.edge_chamfer)\n    body = body.faces(\"<Z\").edges().chamfer(p.edge_chamfer)\n\
    \n    floor_z = h - p.pocket_depth\n    ac = p.pocket_af / math.cos(math.radians(30.0))\n\
    \n    # hex nut pocket, straight walls, open at the top\n    body = body.cut(cq.Workplane(\"\
    XY\").workplane(offset=floor_z)\n                    .polygon(6, ac).extrude(p.pocket_depth\
    \ + 0.5))\n\n    # 45 degree lead-in so the nut starts by hand\n    lead = (cq.Workplane(\"\
    XY\").workplane(offset=h - p.mouth_lead)\n            .polygon(6, ac)\n      \
    \      .workplane(offset=p.mouth_lead)\n            .polygon(6, ac + 2.0 * p.mouth_lead)\n\
    \            .loft())\n    body = body.cut(lead)\n\n    # bolt clearance hole\
    \ from the pocket floor to the bottom face\n    body = body.cut(cq.Workplane(\"\
    XY\").workplane(offset=-1.0)\n                    .circle(p.bolt_hole_d / 2.0).extrude(floor_z\
    \ + 2.0))\n\n    # countersink at the bottom face to guide the bolt in\n    sink\
    \ = cq.Solid.makeCone(p.sink_d / 2.0, p.bolt_hole_d / 2.0, p.sink_h)\n    body\
    \ = body.cut(cq.Workplane(obj=sink.translate(cq.Vector(0, 0, -0.01))))\n\n   \
    \ return body"
  print_orientation: bottom face on the bed (z = 0), nut pocket and flutes opening
    upward; no supports
  use_orientation: axis vertical, nut pocket at the top, bolt entering from the bottom
    face
- id: fit-coupon
  role: coupon
  material: PLA (high-speed, black), 0.4 mm nozzle, 0.2 mm layers
  code: "import math\n\ndef build(p):\n    L, W, H = p.coupon_l, p.coupon_w, p.coupon_h\n\
    \    body = cq.Workplane(\"XY\").box(L, W, H, centered=(True, True, False))\n\
    \    floor_z = H - p.pocket_depth\n    xs = (-p.coupon_pitch, 0.0, p.coupon_pitch)\n\
    \    inters = (p.cp_int_a, p.cp_int_b, p.cp_int_c)\n    for x, it in zip(xs, inters):\n\
    \        ac = (p.nut_af - it) / math.cos(math.radians(30.0))\n        pocket =\
    \ (cq.Workplane(\"XY\").workplane(offset=floor_z)\n                  .polygon(6,\
    \ ac).extrude(p.pocket_depth + 0.5))\n        lead = (cq.Workplane(\"XY\").workplane(offset=H\
    \ - p.mouth_lead)\n                .polygon(6, ac)\n                .workplane(offset=p.mouth_lead)\n\
    \                .polygon(6, ac + 2.0 * p.mouth_lead)\n                .loft())\n\
    \        hole = (cq.Workplane(\"XY\").workplane(offset=-1.0)\n               \
    \ .circle(p.bolt_hole_d / 2.0).extrude(floor_z + 2.0))\n        for wp in (pocket,\
    \ lead, hole):\n            s = wp.val().translate(cq.Vector(x, 0, 0))\n     \
    \       body = body.cut(cq.Workplane(obj=s))\n    return body"
  print_orientation: flat on the bed as modelled (z = 0), pockets opening upward;
    no supports
  use_orientation: flat block, press the M5 nut into each pocket and turn the block
    upside down
