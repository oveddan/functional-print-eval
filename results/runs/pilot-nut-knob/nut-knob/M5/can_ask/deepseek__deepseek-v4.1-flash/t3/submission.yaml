task: nut-knob/M5
note: 'One-piece hand knob, 30 mm across, printed bottom-face-down with no supports.
  A hex pocket in the top holds the ISO 4032 M5 nut as a light press fit (0.05 mm
  perpocket-flat interference, ~0.05 mm total), with a 1.2 mm 45-degree lead-in at
  the mouth, a flat shoulder under the nut, and a 5.6 mm bolt clearance hole down
  to the bottom face. The nut seats about 1.5 mm below the top face (fully inside),
  cannot pass the shoulder, and the bolt enters from below, threads through it and
  exits the top. Because press-fit force varies with printer calibration, the package
  includes a bench coupon with three pocket sizes (8.02 / 7.95 / 7.88 mm across flats)
  so the fit is proven on the actual machine before the knob is printed; the knob
  uses the middle size. I could not measure the user''s nut (no calipers available),
  so the nut data is catalog (ISO 4032 M5: 8.0 AF, 4.7 high) and the coupon is there
  to absorb that uncertainty. If the coupon shows the middle pocket is loose, the
  knob pocket can be tightened by editing pocket_af only.'
questions:
- text: When you turn the coupon upside down, which of the three pockets (left 8.02,
    middle 7.95, right 7.88) holds the nut while still pressing in by hand?
  answer: null
