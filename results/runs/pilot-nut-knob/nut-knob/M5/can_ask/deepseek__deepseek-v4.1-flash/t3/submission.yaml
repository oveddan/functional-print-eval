manual:
- n: '1'
  text: Print the fit coupon flat, as its file sits, in PLA at 0.2 mm layers with
    at least 3 perimeters. It takes about 15 minutes; no supports.
  parts:
  - fit-coupon
  hardware: []
  tool: Bambu Studio, PLA profile
- n: '2'
  text: Press the ISO 4032 M5 nut into each of the three pockets, starting with the
    leading chamfer. Left pocket is 8.02 mm across flats (loose), middle is 7.95 mm
    (the size used in the knob), right is 7.88 mm (tight). Press with a thumb, nut
    flat face down, until it stops on the shoulder.
  parts:
  - fit-coupon
  hardware:
  - h-nut
  tool: null
- n: '3'
  text: Turn the coupon upside down and shake it. The pocket that holds the nut without
    it falling out, yet went in with a firm hand press, is your printer's working
    size. The knob is made at the middle size; if the nut only stays in the tight
    pocket, the knob pocket is 0.07 mm too big for your machine - say so before using
    the knob in earnest.
  parts:
  - fit-coupon
  hardware:
  - h-nut
  tool: null
- n: '4'
  text: Print the knob bottom face down on the bed, exactly as oriented in the file.
    No supports are needed - the flutes stop 2 mm above the bed and the nut pocket
    opens upward.
  parts:
  - knob
  hardware: []
  tool: Bambu Studio
- n: '5'
  text: Press the ISO 4032 M5 nut into the knob's hex pocket, flat face down, using
    the lead-in chamfer. Use an even press with both thumbs with the knob resting
    on a hard surface (or a vice with soft jaws if it is firm). It stops hard on the
    shoulder, with its top face about 1.5 mm below the knob's top face. No glue.
  parts:
  - knob
  hardware:
  - h-nut
  tool: hard surface or vice with soft jaws
- n: '6'
  text: 'Check the nut is captive: turn the knob upside down over a table and shake.
    The nut must stay seated, and must not be able to go any deeper (the shoulder
    stops it).'
  parts:
  - knob
  hardware:
  - h-nut
  tool: null
- n: '7'
  text: Screw the ISO 4762 M5x30 bolt up through the countersink and clearance hole
    in the knob's bottom face and into the nut. The thread should pick up about 12
    mm up from the bottom; the tip emerges from the recess in the top face. If you
    use a different M5 bolt, anything from 25 to 35 mm long works; the tip must project
    past the nut.
  parts:
  - knob
  hardware:
  - h-bolt
  - h-nut
  tool: null
- n: '8'
  text: Fit the bolt through your workpiece and tighten by turning the knob by hand.
    The scalloped flutes give grip; no tool is needed on the nut or the bolt head.
  parts:
  - knob
  hardware:
  - h-bolt
  tool: null
