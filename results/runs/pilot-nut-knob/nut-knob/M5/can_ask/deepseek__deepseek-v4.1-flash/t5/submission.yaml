task: nut-knob/M5
note: 'Hand knob Ø30 �� with a captive M5 hex nut. The pocket is 8.10 mm across flats
  (0.10 mm clearance on the nut''s 8.0), so the nut drops in and seats using only
  thumb pressure — no clamp, no glue, and the pocket''s hex flats still drive the
  nut so it cannot spin. Retention is geometric, not friction: three 0.9 x 1.4 mm
  PLA fingers stand in notches at alternate hex corners and carry a 0.25 mm barb whose
  flat underside ends up 0.3 mm above the seated nut''s top face. The barb''s ramp
  lets the nut''s bottom face push the finger outward (~0.15 mm, ~1 % strain, elastic)
  as it descends; once the nut''s top face passes, the finger springs back over it.
  Hanging 0.02 N of nut cannot cam three fingers open, so it stays in when inverted.
  The nut seats on a pocket floor 9.3 mm thick with only a Ø5.8 bolt bore through
  it, so it can never be pushed out the far side, and the bolt''s tip leaves through
  the pocket mouth. Printed upright on its flat underside: every wall vertical, no
  bridges, no supports. Print the coupon first — it is the same pocket, fingers, seat
  and bore in a small block, so the snap and the hand-press can be proven before touching
  the knob.'
questions:
- text: 'The nut''s across-flats and height could not be measured, so the pocket uses
    the ISO 4032 catalog values (8.0 mm across flats, 4.7 mm high) plus 0.10 mm clearance.
    If your nut is noticeably different, the coupon in step 2 will show it: too tight
    means the pocket needs the 0.10 mm clearance increased, too loose is harmless
    because the fingers do the retaining.'
  answer: null
