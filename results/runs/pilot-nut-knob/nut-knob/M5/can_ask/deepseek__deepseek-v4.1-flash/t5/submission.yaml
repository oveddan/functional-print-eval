criteria:
- id: c1_nut_presses_by_hand
  part: knob
  feature: hex nut pocket mouth and lead-in, 8.10 mm across flats
  relation: clears
  hardware: m5_nut
  clearance_mm: 0.1
  params:
  - nut_af
  - pocket_af
  - lead_in_h
  - lead_in_w
  check:
    method: coupon
    ref: coupon
    description: Hold the coupon pocket-mouth up and press the nut in with your thumb
      only. It must travel to the floor without a clamp or hammer, i.e. the knob's
      0.10 mm-per-side clearance is a hand fit on your printer.
- id: c2_nut_retained_upright_down
  part: knob
  feature: three elastic barbed fingers at alternate pocket corners
  relation: engages
  hardware: m5_nut
  clearance_mm: null
  params:
  - finger_count
  - finger_t
  - finger_w
  - barb_protrusion
  - barb_lift
  - barb_ramp_h
  check:
    method: coupon
    ref: coupon
    description: Turn the coupon mouth-down and tap it on the bench, then shake. The
      nut must stay in; it should only come free if you pry it with a fingernail or
      pliers. This is the same finger/ledge geometry as the knob.
- id: c3_nut_cannot_pass_far_side
  part: knob
  feature: pocket floor (nut seat) pierced only by the Ø5.8 bolt bore
  relation: supports
  hardware: m5_nut
  clearance_mm: null
  params:
  - nut_af
  - bolt_clear_d
  - nut_h
  check:
    method: measure
    ref: calipers at the flat underside
    description: 'Measure the through-bore at the underside: 5.8 mm, smaller than
      the nut''s 8.0 mm across flats and its 9.24 mm corner span, so pressing the
      nut from the mouth can never push it out the far side.'
- id: c4_nut_fully_inside
  part: knob
  feature: 1.0 mm nut recess below the top face
  relation: contains
  hardware: m5_nut
  clearance_mm: null
  params:
  - nut_recess
  - nut_h
  - knob_h
  check:
    method: measure
    ref: straightedge across the pocket mouth
    description: 'After pressing the nut in, lay a straightedge across the mouth:
      the nut''s top face sits about 1.0 mm below the knob''s top face, so no part
      of the nut is proud of the knob.'
- id: c5_bolt_passes_through
  part: knob
  feature: Ø5.8 floor bore, nut bore, and open pocket mouth above the nut
  relation: clears
  hardware: m5_bolt
  clearance_mm: 0.8
  params:
  - bolt_clear_d
  - bolt_d
  - nut_recess
  check:
    method: coupon
    ref: coupon
    description: Push the M5x20 bolt into the bore from the coupon's flat underside
      and turn it by hand until it threads through the nut; the threaded tip must
      come out of the pocket mouth, i.e. through and out the other side.
- id: c6_grip_across
  part: knob
  feature: Ø30 grip body with 8 flutes
  relation: contains
  hardware: null
  clearance_mm: null
  params:
  - knob_d
  - flute_count
  - flute_r
  - flute_d
  check:
    method: measure
    ref: calipers across the grip
    description: 'Measure across the fluted grip at its widest: 30 mm, matching the
      requested ~30 mm across, so it can be gripped and turned by hand.'
manual:
- n: '1'
  text: Print the two parts (knob and coupon) in PLA at 0.2 mm layers with the flat
    underside on the bed and the nut pocket mouth facing up. No supports, no brim
    needed. Print the coupon first — it is the same pocket, fingers, seat and bore
    in a small block, so a mistake costs minutes, not the knob.
  parts:
  - knob
  - coupon
  hardware: []
  tool: printer
- n: '2'
  text: 'Fit test on the coupon: hold it with the pocket mouth up, drop the M5 nut
    in, and press it straight down with your thumb. It should go in with hand pressure
    and you should feel/hear the three fingers click over its top face. If it will
    not go, scrape the pocket''s six flats lightly with a knife and try again — do
    not force it with a clamp.'
  parts:
  - coupon
  hardware:
  - m5_nut
  tool: thumb
- n: '3'
  text: 'Retention test on the coupon: turn it mouth-down over the bench and tap it.
    The nut must stay in. Then pry the nut out with a fingernail or pliers — it is
    reusable — and keep it for the knob.'
  parts:
  - coupon
  hardware:
  - m5_nut
  tool: null
- n: '4'
  text: 'Press the M5 nut into the knob the same way: pocket mouth up, nut flat and
    square to the pocket, thumb pressure until it seats on the floor and the barbs
    click. Its top face ends up about 1 mm inside the pocket.'
  parts:
  - knob
  hardware:
  - m5_nut
  tool: thumb
- n: '5'
  text: 'Check the far side: push hard on the nut from the mouth. It stops on the
    pocket floor — the only opening below it is the Ø5.8 bolt bore, so it cannot be
    pushed through.'
  parts:
  - knob
  hardware:
  - m5_nut
  tool: null
- n: '6'
  text: Turn the knob upside down and shake it. The nut stays captured by the three
    barbs. This is the finished, glue-free nut retention.
  parts:
  - knob
  hardware:
  - m5_nut
  tool: null
- n: '7'
  text: 'Thread the bolt in from the flat underside: push the M5x20 bolt into the
    Ø5.8 bore and turn it by hand. It picks up the nut''s thread, passes through the
    nut, and its tip comes out of the pocket mouth. Turn until the socket head meets
    the underside face.'
  parts:
  - knob
  hardware:
  - m5_bolt
  - m5_nut
  tool: null
- n: '8'
  text: Grip the flutes and turn the knob. The pocket's hex flats hold the nut so
    it cannot spin, and the barbs stop it lifting out while you work. To remove, turn
    the knob off the bolt; the nut stays in the knob.
  parts:
  - knob
  hardware:
  - m5_bolt
  - m5_nut
  tool: null
