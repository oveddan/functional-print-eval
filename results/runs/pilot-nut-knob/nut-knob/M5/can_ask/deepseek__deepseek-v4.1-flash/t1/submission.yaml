criteria:
- id: c1
  part: knob
  feature: hex nut pocket (across flats 7.90, depth 5.0)
  relation: contains
  hardware: nutM5
  clearance_mm: null
  params:
  - pocket_af
  - pocket_depth
  - nut_af
  - nut_h
  check:
    method: coupon
    ref: coupon
    description: The 4.7 mm tall nut sits in a 5.0 mm deep pocket, so it ends up 0.3
      mm below the mouth and is fully inside the knob.
- id: c2
  part: knob
  feature: hex nut pocket flats
  relation: engages
  hardware: nutM5
  clearance_mm: -0.1
  params:
  - pocket_af
  - nut_af
  check:
    method: coupon
    ref: coupon
    description: '0.10 mm interference on the flats: pushes in by hand (no tools,
      no glue) and holds the nut by friction when the knob is turned pocket-down.'
- id: c3
  part: knob
  feature: pocket floor at z = 7.0 with the 5.5 mm bolt hole
  relation: supports
  hardware: nutM5
  clearance_mm: null
  params:
  - floor_t
  - bore_d
  - nut_af
  check:
    method: none
    ref: null
    description: The floor stops the nut at the right depth, and the 5.5 mm hole is
      smaller than the 8.0 mm across-flats nut, so the nut cannot be pushed out through
      the far side.
- id: c4
  part: knob
  feature: 5.5 mm bolt clearance hole through the closed end
  relation: clears
  hardware: bolt
  clearance_mm: 0.5
  params:
  - bore_d
  - bolt_d
  check:
    method: measure
    ref: null
    description: Your M5 bolt should slide/turn freely through the 5.5 mm hole and
      stick out of the closed end.
- id: c5
  part: coupon
  feature: middle hex pocket, 7.90 mm across flats
  relation: engages
  hardware: nutM5
  clearance_mm: -0.1
  params:
  - coupon_af_fit
  - pocket_af
  - nut_af
  check:
    method: coupon
    ref: coupon
    description: The middle pocket matches the knob's pocket_af exactly, so it predicts
      the knob's fit; the 8.00 and 7.80 pockets bracket it as loose and tight references.
manual:
- n: '1'
  text: Print the coupon first. Lay it flat exactly as modelled (solid face on the
    bed; the three hex pockets open upward). PLA, 0.4 mm nozzle, 0.2 mm layers.
  parts:
  - coupon
  hardware: []
  tool: null
- n: '2'
  text: 'With the coupon on the table, press your M5 hex nut into each of the three
    pockets by hand, no tools: left = 8.00 mm across flats, middle = 7.90 mm, right
    = 7.80 mm.'
  parts:
  - coupon
  hardware:
  - nutM5
  tool: null
- n: '3'
  text: Turn the coupon pocket-down and shake. You are looking for the pocket where
    the nut needed a firm hand push to go all the way in, and then stayed put when
    inverted. The middle pocket (7.90) is what the knob is built to; left is a loose
    reference, right a tight one. If 7.80 clearly fits better for you, say so before
    printing the knob — 7.90 is the only number that would change.
  parts:
  - coupon
  hardware:
  - nutM5
  tool: null
- n: '4'
  text: 'Print the knob as modelled: the closed end (the small 5.5 mm hole) on the
    bed and the hex pocket opening upward. No supports and no bridges are needed.'
  parts:
  - knob
  hardware: []
  tool: null
- n: '5'
  text: Press the M5 hex nut into the knob's pocket, hex-to-hex and flat side first,
    until it rests on the pocket floor. It should take a firm hand push and finish
    about 0.3 mm below the rim — fully inside the knob. No glue.
  parts:
  - knob
  hardware:
  - nutM5
  tool: null
- n: '6'
  text: Turn the knob upside down (pocket facing the floor) and give it a shake. The
    nut must stay in — that is the press fit doing its job.
  parts:
  - knob
  hardware:
  - nutM5
  tool: null
- n: '7'
  text: 'Look down the 5.5 mm hole in the closed end: you should see the back of the
    nut. The nut is wider than the hole, so it cannot be pushed out that way.'
  parts:
  - knob
  hardware:
  - nutM5
  tool: null
- n: '8'
  text: Start your M5 bolt into the nut from the pocket side and keep turning. The
    bolt runs through the nut and out of the 5.5 mm hole in the closed end.
  parts:
  - knob
  hardware:
  - bolt
  tool: null
- n: '9'
  text: Fit the knob onto your bolt and tighten by hand on the fluted rim. No tools.
  parts:
  - knob
  hardware:
  - bolt
  tool: null
