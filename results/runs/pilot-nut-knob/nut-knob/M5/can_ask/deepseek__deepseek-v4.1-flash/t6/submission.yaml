task: nut-knob/M5
note: 'One printed knob plus a throwaway test ring. The knob is a fluted 30 mm disc,
  13 mm tall, with a hexagonal socket in the top for the ISO 4032 M5 nut. The nut
  drops in through a Ø12 mouth, is pressed past a hexagonal throat that is 0.15 mm
  tighter than the nut across flats (7.85 against 8.00), and lands flat on a 3 mm
  floor. The throat leaves a ledge above the nut, so the nut is captive: it cannot
  fall out when you turn the knob upside down, and it cannot pass the floor, which
  has only a Ø6.2 bolt hole. The bolt threads up through that hole, through the nut,
  and its tip reappears in the mouth. The floor is what carries the clamping load
  (nut face onto plastic, full hex annulus), so PLA in compression takes the force
  - the throat only has to hold a 5 g nut. Print the test ring first: it is the same
  socket, throat and floor with the top cut off, so if the nut presses in and stays
  put in the ring, the knob is good. If the nut is loose in the ring, the throat is
  too big; if it will not go in with thumb pressure, it is too tight - either way,
  tell me and I will re-cut the throat.'
questions:
- text: What is your M5 nut's across-flats width, if you ever get a caliper on it?
    You could not measure it, so the fit is cut for the catalog 8.00 with a 7.85 throat.
  answer: null
- text: How thick is the part you are clamping, and which M5 bolt do you have? That
    sets the bolt length only - the knob works with any M5 bolt.
  answer: null
