manual:
- n: '1'
  text: 'Slice both parts as they sit: flat bottom face on the bed, open mouth and
    fluted rim up. PLA, 0.2 mm layers, 4 perimeters, 25% infill, no supports. Print
    TEST_RING first - it is 5 g and it is the same socket, throat, cone and floor
    as the knob, just cut off above the throat.'
  parts:
  - test_ring
  - hand_knob
  hardware: []
  tool: printer
- n: '2'
  text: Check the fit on TEST_RING. Mouth up, drop the M5 nut in, flats roughly aligned
    with the socket, and press it straight down with your thumb. It should go past
    the tight lip with firm thumb pressure (if it stops, press the ring down onto
    the nut on the bench - do not hammer it) and then land flat on the floor with
    a small drop. The nut's top face should sit below the ring's top face.
  parts:
  - test_ring
  hardware:
  - nut
  tool: null
- n: '3'
  text: Turn TEST_RING upside down and shake it, then tap it on the bench. The nut
    must stay in. That little ledge the nut just squeezed past is the only thing holding
    it, and it is the same ledge that will hold the nut in the knob.
  parts:
  - test_ring
  hardware:
  - nut
  tool: null
- n: '4'
  text: If the nut fell out, or would not go in with thumb pressure, stop here and
    tell me what happened - the knob would behave the same way. Otherwise the fit
    is good and the knob is safe to use.
  parts:
  - test_ring
  hardware: []
  tool: null
- n: '5'
  text: Turn HAND_KNOB mouth up (flat face with the small bolt hole down). Drop the
    M5 nut into the Ø12 mouth, flats lined up with the hexagonal socket, and press
    it straight down with your thumb until it drops past the lip and seats flat on
    the floor of the socket. It should sit 5.3 mm below the knob's top face, fully
    inside.
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '6'
  text: 'Turn the knob upside down and shake it: the nut stays in. That is the captive
    nut - no glue, nothing else to fit.'
  parts:
  - hand_knob
  hardware:
  - nut
  tool: null
- n: '7'
  text: Push the M5 bolt up through the Ø6.2 hole in the knob's flat face (the chamfer
    guides it) and turn it into the nut by hand. Keep going until the bolt's tip appears
    in the mouth. The knob is now a captive hand knob on that bolt; it will run on
    and off the bolt and never lose the nut.
  parts:
  - hand_knob
  hardware:
  - nut
  - bolt
  tool: null
- n: '8'
  text: Fit the bolt through your workpiece with its head on the far side, then turn
    the knob by hand to tighten. The nut's bottom face presses on the knob's floor
    and the floor presses on your workpiece, so the clamp force goes through solid
    plastic, not through the little retaining lip. Snug only - you are turning a steel
    M5 bolt into a plastic-seated nut, so stop when it feels tight rather than leaning
    on it.
  parts:
  - hand_knob
  hardware:
  - nut
  - bolt
  tool: null
- n: '9'
  text: 'Bolt length: the knob needs the bolt''s shank to reach about 12 mm past your
    workpiece so the tip clears the nut and shows in the mouth. An ISO 4762 M5x30
    does that for workpieces up to roughly 18 mm thick; a longer M5 bolt just sticks
    out further, a shorter one still works if it at least reaches through the nut.'
  parts:
  - hand_knob
  hardware:
  - bolt
  tool: null
