  params:
  - pocket_af
  - pocket_depth
  - nut_af
  - nut_h
  - rib_protrusion
  check:
    method: none
    ref: null
    description: Check that the M5 nut presses into the hex pocket with firm thumb
      force and remains retained inside the pocket when inverted without falling out.
- id: bolt_clearance
  part: knob
  feature: bolt_through_hole
  relation: clears
  hardware: null
  clearance_mm: 0.4
  params:
  - bolt_clearance_d
  - bolt_d
  check:
    method: none
    ref: null
    description: Check that an M5 bolt threads freely through the nut and passes completely
      through the clearance hole without binding.
- id: nut_retention_shoulder
  part: knob
  feature: pocket_shoulder
  relation: supports
  hardware: nut_m5
  clearance_mm: null
  params:
  - pocket_depth
  - knob_h
  - nut_af
  - bolt_clearance_d
  check:
    method: none
    ref: null
    description: Verify that the solid internal shoulder stops the nut and prevents
      it from pushing out through the far side under clamping loads.
manual:
- n: '1'
  text: Print the knob oriented with its flat bottom face on the build plate (z =
    0). Standard 0.2 mm layer height with 0.4 mm nozzle in PLA, 100% infill or 4+
    perimeters for maximum strength. No supports are needed.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Orient the M5 hex nut (ISO 4032) over the hex opening on the top face of the
    knob, aligning the nut flats with the pocket walls. The initial 0.8 mm lead-in
    zone allows the nut to easily start straight.
  parts:
  - knob
  hardware:
  - nut_m5
  tool: null
- n: '3'
  text: Press the nut firmly into the pocket with your thumb until it bottoms out
    against the internal solid shoulder. The six rounded crush ribs along the pocket
    flats will firmly grip the nut. When fully seated, the nut sits recessed ~0.5
    mm below the top surface.
  parts:
  - knob
  hardware:
  - nut_m5
  tool: null
- n: '4'
  text: 'Turn the knob upside down to verify retention: the nut stays firmly in place
    under gravity without glue.'
  parts:
  - knob
  hardware:
  - nut_m5
  tool: null
- n: '5'
  text: Thread the knob onto your M5 bolt. The through-hole allows the bolt to pass
    through the nut and extend out the far side as far as needed.
  parts:
  - knob
  hardware:
  - nut_m5
  tool: null
