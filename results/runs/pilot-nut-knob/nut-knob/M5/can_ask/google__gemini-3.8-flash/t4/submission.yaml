task: nut-knob/M5
note: Single-piece 30 mm hand knob for an M5 bolt with an integrated friction-fit
  pocket for an ISO 4032 M5 hex nut. Incorporates 6 crush ribs on the hex flats and
  a mouth lead-in chamfer for easy hand-press assembly and secure retention upside
  down without glue. Internal shoulder prevents push-through while allowing full through-bolt
  passage.
questions: []
params:
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal height of ISO 4032 M5 hex nut
  knob_h:
    value: 11
    unit: mm
    kind: design
    source: design
    note: Total height of knob
  pocket_af:
    value: 8.2
    unit: mm
    kind: design
