task: nut-knob/M5
note: Ergonomic 30 mm hand knob with a captive ISO 4032 M5 hex nut pocket and full
  through-hole clearance. Press-fit pocket sized for hand installation and upside-down
  friction retention without glue.
questions: []
params:
  scallop_offset:
    value: 16
    unit: mm
    kind: design
    source: design
    note: Radial offset from center for scallop cutter centers
  knob_od:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: Outer diameter of the knob across lobe peaks (~30 mm across)
  scallop_count:
    value: 6
    unit: count
    kind: design
    source: design
    note: Number of ergonomic finger grip scallops around perimeter
  nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut width across flats
  nut_pocket_af:
    value: 8
    unit: mm
    kind: design
    source: design
    note: Hex pocket width across flats for snug hand press-fit in 3D printed PLA
  nut_pocket_depth:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Depth of hex pocket so the 4.7 mm nut sits fully inside the knob
  lead_in_d:
    value: 9.8
    unit: mm
    kind: design
    source: design
    note: Diameter of circular lead-in recess at the pocket mouth for easy nut alignment
  bolt_clearance_d:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: Clearance through-hole diameter for M5 bolt (ISO 273 normal/medium clearance)
  knob_h:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Total overall height of the hand knob
  lead_in_depth:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: Depth of circular lead-in recess at the pocket mouth
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut nominal thickness
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: M5 bolt nominal outer thread diameter
  rim_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Ergonomic 45-degree chamfer on top and bottom outer rims
  scallop_r:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: Radius of finger grip scallop cuts
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\nimport cadquery as cq\n\ndef build(p):\n    knob_od = p.knob_od\n\
    \    knob_h = p.knob_h\n    scallop_count = int(p.scallop_count)\n    scallop_r\
    \ = p.scallop_r\n    scallop_offset = p.scallop_offset\n    bolt_clearance_d =\
    \ p.bolt_clearance_d\n    nut_pocket_af = p.nut_pocket_af\n    nut_pocket_depth\
    \ = p.nut_pocket_depth\n    lead_in_d = p.lead_in_d\n    lead_in_depth = p.lead_in_depth\n\
    \    rim_chamfer = p.rim_chamfer\n\n    # 1. Base cylinder (Z = 0 on print bed)\n\
    \    cylinder = cq.Workplane(\"XY\").circle(knob_od / 2.0).extrude(knob_h)\n\n\
    \    # 2. Chamfer top and bottom outer edges for comfortable grip and anti-elephant\
    \ foot\n    cylinder = cylinder.faces(\">Z\").edges().chamfer(rim_chamfer)\n \
    \   cylinder = cylinder.faces(\"<Z\").edges().chamfer(rim_chamfer)\n\n    # 3.\
    \ Cut finger scallops around the perimeter for tool-free torque\n    body = cylinder\n\
    \    for i in range(scallop_count):\n        angle = 2.0 * math.pi * i / scallop_count\n\
    \        cx = scallop_offset * math.cos(angle)\n        cy = scallop_offset *\
    \ math.sin(angle)\n        scallop_cutter = (\n            cq.Workplane(\"XY\"\
    )\n            .moveTo(cx, cy)\n            .circle(scallop_r)\n            .extrude(knob_h\
    \ * 2.0)\n            .translate((0, 0, -knob_h * 0.5))\n        )\n        body\
    \ = body.cut(scallop_cutter)\n\n    # 4. Central clearance through-hole for M5\
    \ bolt\n    bolt_hole = (\n        cq.Workplane(\"XY\")\n        .circle(bolt_clearance_d\
    \ / 2.0)\n        .extrude(knob_h * 2.0)\n        .translate((0, 0, -knob_h *\
    \ 0.5))\n    )\n    body = body.cut(bolt_hole)\n\n    # 5. Hexagonal nut pocket\
    \ from top face down to shoulder\n    hex_d = nut_pocket_af * 2.0 / math.sqrt(3.0)\n\
    \    z_pocket_bottom = knob_h - nut_pocket_depth\n    hex_cutter = (\n       \
    \ cq.Workplane(\"XY\", origin=(0, 0, z_pocket_bottom))\n        .polygon(6, hex_d)\n\
    \        .extrude(nut_pocket_depth + 1.0)\n    )\n    body = body.cut(hex_cutter)\n\
    \n    # 6. Circular lead-in recess at the pocket mouth for self-alignment\n  \
    \  lead_in_cutter = (\n        cq.Workplane(\"XY\", origin=(0, 0, knob_h - lead_in_depth))\n\
    \        .circle(lead_in_d / 2.0)\n        .extrude(lead_in_depth + 1.0)\n   \
    \ )\n    body = body.cut(lead_in_cutter)\n\n    return body\n"
  print_orientation: Bottom face on bed (Z = 0); prints cleanly without supports
  use_orientation: Z-axis aligned with bolt axis; bottom face seats against assembly
    or washer
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
- id: bolt
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: knob_joint
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - 12.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: knob
    feature: nut_pocket
    role: nut_pocket
  - part: knob
    feature: through_hole
    role: clearance
  nut: nut
  external: null
criteria:
- id: crit_nut_retention
  part: knob
  feature: nut_pocket
  relation: contains
  hardware: nut
  clearance_mm: 0.0
  params:
  - nut_pocket_af
  - nut_af
  - nut_pocket_depth
  - nut_h
  check:
    method: measure
    ref: null
    description: Press M5 hex nut into the pocket by hand. Verify it stays securely
      in place when inverted and shaken, without glue.
- id: crit_shoulder_stop
  part: knob
  feature: shoulder
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - bolt_clearance_d
  - nut_pocket_af
  - knob_h
  - nut_pocket_depth
  check:
    method: none
    ref: null
    description: Ensure the shoulder ledge supports the nut and prevents it from being
      pushed out through the bottom face when tightening.
- id: crit_bolt_clearance
  part: knob
  feature: through_hole
  relation: clears
  hardware: bolt
  clearance_mm: 0.4
  params:
  - bolt_clearance_d
  - bolt_d
  check:
    method: measure
    ref: null
    description: Verify M5 bolt clears the through-hole freely and threads through
      the captive nut.
manual:
- n: '1'
  text: Place the printed knob on a flat, sturdy surface with the hex pocket opening
    facing upwards. Align the M5 hex nut (ISO 4032) with the opening, using the shallow
    circular lead-in recess to center and orient the flats of the nut.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '2'
  text: Press the M5 nut straight down into the pocket using firm thumb pressure,
    or flip the knob onto a table surface and push down firmly until the nut seats
    fully against the internal shoulder. The nut will sit completely inside the knob
    (recessed below the top rim). Verify that turning the knob upside down retains
    the nut by friction without any glue.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Thread your M5 bolt through the knob and into the nut. The bolt passes completely
    through the nut and out the far side. Hand-tighten using the 6 ergonomic finger
    scallops without needing any tools.
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: null
