task: nut-knob/M5
note: Single-piece ergonomic 30 mm hand knob for an M5 bolt. Features a captive ISO
  4032 M5 hex nut pocket with 6 sacrificial crush ribs for easy hand press-fit and
  inverted retention without glue, a solid internal thrust shoulder to bear clamping
  loads, and a through-clearance hole allowing the bolt to extend completely through.
questions: []
params:
  bolt_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: Nominal diameter of M5 bolt
  knob_height:
    value: 12
    unit: mm
    kind: design
    source: design
    note: Total height of the knob for comfortable fingertip grip
  rib_width:
    value: 1.2
    unit: mm
    kind: design
    source: design
