manual:
- n: '1'
  text: Remove the printed knob from the build plate. Inspect the hexagonal nut pocket,
    vertical crush ribs, and central through-hole to confirm clean bridging and no
    stringing.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align an M5 hex nut (ISO 4032) with the hexagonal pocket at the top face of
    the knob. Place the nut into the entry lead-in chamfer.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Press the nut firmly into the pocket using thumb pressure (or by inverting
    the knob onto a table and pushing down) until the nut seats flat against the bottom
    internal shoulder. The nut sits fully inside the pocket. Turn the knob upside
    down to confirm the integrated crush ribs hold the nut securely in place without
    glue.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Thread your M5 bolt through the knob. The bolt passes through the nut and
    exits through the opposite clearance hole. Hand-tighten the knob via the 6 contoured
    finger lobes without tools.
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: null
