    note: Number of ergonomic finger scallops around perimeter
  rim_bottom_chamfer:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Bottom edge chamfer to eliminate elephant's foot and sharp edges
  knob_outer_diameter:
    value: 30
    unit: mm
    kind: design
