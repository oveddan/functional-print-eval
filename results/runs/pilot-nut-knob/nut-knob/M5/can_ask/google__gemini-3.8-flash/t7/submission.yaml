    note: Outer diameter of the knob across lobe crests
  bolt_clearance_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: Through-hole clearance diameter for M5 bolt
  rim_top_chamfer:
    value: 1
    unit: mm
    kind: design
    source: design
    note: Top outer rim chamfer for comfortable grip
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\nimport cadquery as cq\n\n\ndef build(p):\n  # 1. Base cylindrical\
    \ body of the knob\n  knob = (\n      cq.Workplane(\"XY\")\n      .circle(p.knob_outer_diameter\
    \ / 2.0)\n      .extrude(p.knob_height)\n  )\n\n  # 2. Outer rim chamfers for\
    \ comfortable hand grip and clean first layer\n  knob = knob.edges(\">Z\").chamfer(p.rim_top_chamfer)\n\
    \  knob = knob.edges(\"<Z\").chamfer(p.rim_bottom_chamfer)\n\n  # 3. Cut finger\
    \ scallops around perimeter to create 6 ergonomic grip lobes\n  for i in range(int(p.num_lobes)):\n\
    \    angle = i * (2.0 * math.pi / p.num_lobes)\n    cx = p.scallop_center_radius\
    \ * math.cos(angle)\n    cy = p.scallop_center_radius * math.sin(angle)\n    scallop\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=-1.0)\n       \
    \ .center(cx, cy)\n        .circle(p.scallop_radius)\n        .extrude(p.knob_height\
    \ + 2.0)\n    )\n    knob = knob.cut(scallop)\n\n  # 4. Central clearance through-hole\
    \ for M5 bolt\n  through_hole = (\n      cq.Workplane(\"XY\")\n      .workplane(offset=-1.0)\n\
    \      .circle(p.bolt_clearance_d / 2.0)\n      .extrude(p.knob_height + 2.0)\n\
    \  )\n  knob = knob.cut(through_hole)\n\n  # 5. Hexagonal nut pocket with 6 sacrificial\
    \ crush ribs\n  af_pocket = p.nut_af + p.pocket_af_clearance\n  r_flat = af_pocket\
    \ / 2.0\n  half_flat_len = r_flat / math.sqrt(3.0)\n  w_rib = p.rib_width\n  rib_h\
    \ = p.rib_protrusion\n\n  pts = []\n  for i in range(6):\n    angle = i * (math.pi\
    \ / 3.0)\n    nx = math.cos(angle)\n    ny = math.sin(angle)\n    tx = -math.sin(angle)\n\
    \    ty = math.cos(angle)\n\n    p_corner = (\n        r_flat * nx - half_flat_len\
    \ * tx,\n        r_flat * ny - half_flat_len * ty,\n    )\n    p_rib_start = (\n\
    \        r_flat * nx - (w_rib / 2.0) * tx,\n        r_flat * ny - (w_rib / 2.0)\
    \ * ty,\n    )\n    p_rib_tip = (\n        (r_flat - rib_h) * nx,\n        (r_flat\
    \ - rib_h) * ny,\n    )\n    p_rib_end = (\n        r_flat * nx + (w_rib / 2.0)\
    \ * tx,\n        r_flat * ny + (w_rib / 2.0) * ty,\n    )\n\n    pts.extend([p_corner,\
    \ p_rib_start, p_rib_tip, p_rib_end])\n\n  pocket_depth = p.knob_height - p.shoulder_thickness\n\
    \  pocket = (\n      cq.Workplane(\"XY\")\n      .workplane(offset=p.shoulder_thickness)\n\
    \      .polyline(pts)\n      .close()\n      .extrude(pocket_depth + 1.0)\n  )\n\
    \  knob = knob.cut(pocket)\n\n  # 6. Lead-in chamfer at the top of the hex pocket\n\
    \  r_corner = r_flat / math.cos(math.pi / 6.0)\n  chamfer_cut = (\n      cq.Workplane(\"\
    XY\")\n      .workplane(offset=p.knob_height - p.entry_chamfer)\n      .circle(r_corner)\n\
    \      .workplane(offset=p.entry_chamfer + 0.5)\n      .circle(r_corner + p.entry_chamfer\
    \ + 0.5)\n      .loft(combine=False)\n  )\n  knob = knob.cut(chamfer_cut)\n\n\
    \  return knob\n"
  print_orientation: Bottom clamping face flat on bed (Z=0), nut pocket facing upward
    (+Z), no supports needed
  use_orientation: Bottom face (Z=0) sits against clamped workpiece/washer; hex nut
    pressed flush inside top pocket; gripped and rotated by hand
