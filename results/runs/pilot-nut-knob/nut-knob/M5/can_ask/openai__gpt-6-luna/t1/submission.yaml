task: nut-knob/M5
note: 'One-piece, flat-printing hand knob with an underside hex pocket for a captive
  ISO 4032 M5 nut and a 5.5 mm through-bore. The nut is pressed in from the bed-facing
  side; the solid roof around the smaller bolt bore stops it being pushed through
  the far face. The pocket is intentionally a slight press fit, but printed fit varies:
  if the nut is too tight or loose, adjust `nut_pocket_af` in small increments (about
  0.05 mm) and reprint. The bolt is the user''s own M5 bolt; it is not included in
  the listed hardware.'
questions: []
