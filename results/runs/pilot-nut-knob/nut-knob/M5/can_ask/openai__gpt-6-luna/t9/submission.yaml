task: nut-knob/M5
note: 'One-piece, vertically printed hand knob with a segmented snap-in nut retainer.
  The M5 nut is inserted from the underside: a narrow hex throat and radial relief
  slots let the PLA lip flex, then the nut seats in the larger internal hex pocket.
  The pocket roof stops the nut going out the far side; a round bore continues through
  the knob for the bolt. Fit is based on the catalog 8 mm nut width because the nut
  could not be measured; press the nut in squarely and do not force it if the print
  is visibly undersized or the lip is damaged.'
