parts:
- id: hand_knob
  role: final
  material: PLA (high-speed PLA)
  code: "import math\n\ndef hex_prism(af, z, h):\n    # Regular hexagon with vertices\
    \ on the x axis; AF = sqrt(3) * circumradius.\n    R = af / math.sqrt(3.0)\n \
    \   pts = [(R*math.cos(math.radians(60*i)), R*math.sin(math.radians(60*i))) for\
    \ i in range(6)]\n    return cq.Workplane('XY').polyline(pts).close().extrude(h).translate((0,\
    \ 0, z))\n\ndef build(p):\n    body = cq.Workplane('XY').circle(p.core_r).extrude(p.knob_h)\n\
    \    for i in range(6):\n        a = math.radians(i*60)\n        x, y = p.grip_r*math.cos(a),\
    \ p.grip_r*math.sin(a)\n        lobe = cq.Workplane('XY').center(x, y).circle(p.lobe_r).extrude(p.knob_h)\n\
    \        body = body.union(lobe)\n    # Hex nut seat and its smaller underside\
    \ retaining throat.\n    body = body.cut(hex_prism(p.seat_af, p.seat_z, p.seat_depth))\n\
    \    body = body.cut(hex_prism(p.throat_af, 0, p.throat_h))\n    # Six radial\
    \ relief cuts split the shallow retaining lip into compliant sectors.\n    slot_len\
    \ = p.slot_r1 - p.slot_r0\n    for i in range(6):\n        slot = cq.Workplane('XY').box(slot_len,\
    \ p.slot_w, p.slot_h, centered=(False, True, False))\n        slot = slot.translate((p.slot_r0,\
    \ 0, 0)).rotate((0,0,0), (0,0,1), i*60)\n        body = body.cut(slot)\n    #\
    \ A continuous bolt passage through the nut pocket and the far side of the knob.\n\
    \    bore = cq.Workplane('XY').circle(p.bore_d/2).extrude(p.knob_h)\n    body\
    \ = body.cut(bore)\n    return body"
  print_orientation: Flat underside on the build plate; knob axis vertical (Z). The
    underside nut-entry opening faces the build plate.
  use_orientation: Grip the six-lobed circumference. Press the M5 nut into the hex
    opening on the underside, then thread an M5 bolt through the nut; its shank passes
    through and exits the top bore.
