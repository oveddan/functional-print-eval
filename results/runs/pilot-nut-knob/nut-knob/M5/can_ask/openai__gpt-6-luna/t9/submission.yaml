manual:
- n: '1'
  text: Print the hand_knob with its flat underside on the build plate. Remove any
    brim or stringing from the underside hex opening and bolt bore; do not enlarge
    the retaining throat unless the nut cannot be pressed in safely.
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '2'
  text: Align the ISO 4032 M5 nut with the underside hex opening and press it straight
    in by hand until it sits fully inside the recessed hex pocket. The relief slots
    allow the lip to flex. Do not hammer it or force it if the lip begins to crack.
  parts:
  - hand_knob
  hardware:
  - m5_nut
  tool: null
- n: '3'
  text: Turn the knob upside down briefly to check the nut stays captured. Thread
    the M5 bolt into the nut; its shank should pass through the nut and continue through
    the top bore.
  parts:
  - hand_knob
  hardware:
  - m5_nut
  tool: null
