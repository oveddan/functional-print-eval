parts:
- id: knob
  role: final
  material: PLA (high-speed PLA)
  code: "def build(p):\n    import math\n    def hex_pts(af):\n        r = af / math.sqrt(3.0)\n\
    \        return [(r * math.cos(math.radians(a)), r * math.sin(math.radians(a)))\
    \ for a in (0, 60, 120, 180, 240, 300)]\n\n    body = cq.Workplane(\"XY\").circle(p.knob_d\
    \ / 2.0).extrude(p.knob_h)\n    # Six shallow vertical scallops provide finger\
    \ grip.\n    for i in range(p.grip_count):\n        a = 2.0 * math.pi * i / p.grip_count\n\
    \        x = p.grip_cut_center_r * math.cos(a)\n        y = p.grip_cut_center_r\
    \ * math.sin(a)\n        cutter = cq.Workplane(\"XY\").center(x, y).circle(p.grip_cut_r).extrude(p.knob_h)\n\
    \        body = body.cut(cutter)\n\n    # Nut enters from z=0. The hexagonal roof\
    \ at pocket_depth captures it;\n    # the axial bore passes through that roof\
    \ and the far side of the knob.\n    pocket = cq.Workplane(\"XY\").polyline(hex_pts(p.pocket_af)).close().extrude(p.pocket_depth)\n\
    \    lead_in = (cq.Workplane(\"XY\").polyline(hex_pts(p.pocket_entry_af)).close()\n\
    \               .workplane(offset=p.lead_h).polyline(hex_pts(p.pocket_af)).close()\n\
    \               .loft(combine=True))\n    through_bore = cq.Workplane(\"XY\").circle(p.bolt_clear_d\
    \ / 2.0).extrude(p.knob_h)\n    return body.cut(pocket).cut(lead_in).cut(through_bore)"
  print_orientation: Print upright with the recessed hex-nut insertion face on the
    build plate (z=0); the through-bore is vertical.
  use_orientation: Insert the M5 nut from the recessed bottom face. The opposite,
    flat face is the bolt-entry side.
