task: nut-knob/M5
note: One-piece, 30 mm hand knob for a captive ISO 4032 M5 nut. The nut presses into
  the recessed hex pocket from the bottom; the pocket roof stops it being pushed through
  the far side. A continuous 5.6 mm axial clearance bore lets an M5 bolt enter from
  the top, thread through the nut, and emerge from the bottom. The nut's catalog dimensions
  were used because you could not measure yours; the 7.9 mm pocket across flats is
  a deliberate press-fit choice, so fit may vary with printer calibration and nut
  tolerances.
questions: []
