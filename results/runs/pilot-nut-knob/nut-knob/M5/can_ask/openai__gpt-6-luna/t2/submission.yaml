manual:
- n: '1'
  text: Print the knob upright, with the recessed hex-nut insertion face on the build
    plate. Let the print cool before fitting the nut.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align an ISO 4032 M5 nut with the bottom hex pocket and press it in by hand,
    keeping its faces aligned with the pocket. Push until it stops against the internal
    roof; its lower face will be recessed from the knob face.
  parts:
  - knob
  hardware:
  - m5_nut
  tool: null
- n: '3'
  text: Turn the knob upside down and check the nut stays in place. From the opposite
    face, feed an M5 bolt through the axial bore, thread it through the nut, and continue
    until the bolt emerges from the recessed bottom opening.
  parts:
  - knob
  hardware:
  - m5_nut
  tool: null
