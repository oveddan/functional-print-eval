manual:
- n: '1'
  text: Print the hand_knob with its flat underside on the build plate and the hex
    pocket opening upward. Remove any brim or debris from the pocket and bore.
  parts:
  - hand_knob
  hardware: []
  tool: null
- n: '2'
  text: Align the ISO 4032 M5 nut with the hex pocket and press it straight in by
    hand until it bottoms on the pocket floor. It should sit recessed below the opening.
    Do not hammer it or force it if it will not seat with firm hand pressure.
  parts:
  - hand_knob
  hardware:
  - m5_nut
  tool: null
- n: '3'
  text: Check that the nut stays in place with the knob inverted. Pass an M5 bolt
    through the nut from the pocket side; the shank goes through the nut and continues
    out through the central bore on the opposite side. The bolt head does not fit
    through the bore.
  parts:
  - hand_knob
  hardware:
  - m5_nut
  tool: null
