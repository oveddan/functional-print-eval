parts:
- id: hand_knob
  role: final
  material: PLA (high-speed PLA)
  code: "import math\n\ndef build(p):\n    body = cq.Workplane(\"XY\").circle(p.core_radius).extrude(p.knob_thickness)\n\
    \    for i in range(p.lobe_count):\n        a = 2.0 * math.pi * i / p.lobe_count\n\
    \        x = p.lobe_pitch_radius * math.cos(a)\n        y = p.lobe_pitch_radius\
    \ * math.sin(a)\n        lobe = cq.Workplane(\"XY\").center(x, y).circle(p.lobe_radius).extrude(p.knob_thickness)\n\
    \        body = body.union(lobe)\n\n    top_z = p.knob_thickness\n    lead_z =\
    \ top_z - p.socket_leadin_h\n    main_h = lead_z - p.socket_floor_z\n    socket_diam\
    \ = p.socket_af * p.hex_circumdiam_factor\n    entry_diam = p.socket_entry_af\
    \ * p.hex_circumdiam_factor\n\n    socket = (cq.Workplane(\"XY\")\n          \
    \    .workplane(offset=p.socket_floor_z)\n              .polygon(6, socket_diam)\n\
    \              .extrude(main_h))\n    lead = (cq.Workplane(\"XY\")\n         \
    \   .workplane(offset=lead_z)\n            .polygon(6, socket_diam)\n        \
    \    .workplane(offset=p.socket_leadin_h)\n            .polygon(6, entry_diam)\n\
    \            .loft())\n    body = body.cut(socket.union(lead))\n    bore = cq.Workplane(\"\
    XY\").circle(p.bolt_clear_d / 2.0).extrude(p.knob_thickness)\n    return body.cut(bore)"
  print_orientation: Print with the flat underside (z=0) on the bed and the nut-pocket
    opening facing upward. The through-bore is vertical; no supports should be needed.
  use_orientation: Press the M5 nut into the hex pocket from its open face until it
    rests on the pocket floor. The nut is recessed below the pocket opening. Pass
    an M5 bolt through the opening-side nut; its shank continues through the central
    clearance bore and out the opposite face.
