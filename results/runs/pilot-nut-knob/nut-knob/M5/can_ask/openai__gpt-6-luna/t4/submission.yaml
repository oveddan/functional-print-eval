task: nut-knob/M5
note: Single-piece, approximately 29.4 mm across, with a recessed M5 hex-nut pocket.
  The nut is pressed into a nominal 7.85 mm-across-flats socket; the pocket floor
  prevents it being pushed through the far side, and a 5.6 mm clearance bore continues
  through the knob. The nut-side opening faces upward during printing. Press the nut
  in by hand; the slight nominal interference is intended to retain it when inverted.
  Printed fit depends on printer calibration and the actual nut tolerance, so do not
  force a nut that will not seat with firm hand pressure.
