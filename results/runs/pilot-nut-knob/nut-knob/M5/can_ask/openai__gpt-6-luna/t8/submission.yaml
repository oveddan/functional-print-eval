manual:
- n: '1'
  text: Print the knob flat on its z=0 face, with the nut-entry throat upward. Do
    not use supports. Let the print cool before fitting the nut.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Align the ISO 4032 M5 nut's flats with the hex throat. Press it straight down
    by hand until it passes the flexible slotted lip and seats against the chamber
    floor. The nut remains recessed inside the knob; do not force it at an angle.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '3'
  text: Pass the M5 bolt shank through the throat and nut so it exits through the
    opposite face. Turn the knob by hand to tighten it onto the bolt. The bolt head
    stays outside the knob.
  parts:
  - knob
  hardware:
  - bolt
  tool: null
