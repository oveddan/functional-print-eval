task: nut-knob/M5
note: 'A single-piece, six-lobed hand knob for an M5 threaded bolt. Press the ISO
  4032 M5 nut into the hex pocket from the lobed/top face: the narrow, slotted throat
  flexes during insertion, then retains the nut behind a shoulder. The opposite face
  has an M5 clearance passage, so the bolt shank passes through the nut and exits
  the knob. The example hardware includes an M5x30 screw; its head remains outside
  the knob. Print with the flat z=0 face on the bed. The pocket floor is a short internal
  bridge (about 9.6 mm corner-to-corner), well within the stated printer setup.'
