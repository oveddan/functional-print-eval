parts:
- id: knob
  role: final
  material: PLA (high-speed PLA)
  code: "import math\n\ndef build(p):\n    # Rounded six-lobe outline gives finger\
    \ purchase while keeping the\n    # maximum diameter at approximately 30 mm.\n\
    \    body = cq.Workplane('XY').circle(p.knob_core_r).extrude(p.knob_h)\n    for\
    \ i in range(6):\n        a = math.radians(60 * i)\n        x = p.lobe_pitch_r\
    \ * math.cos(a)\n        y = p.lobe_pitch_r * math.sin(a)\n        lobe = cq.Workplane('XY').center(x,\
    \ y).circle(p.lobe_r).extrude(p.knob_h)\n        body = body.union(lobe)\n\n \
    \   def hex_cut(af, z, height):\n        circum_d = 2.0 * af / math.sqrt(3.0)\n\
    \        return cq.Workplane('XY').workplane(offset=z).polygon(6, circum_d).extrude(height)\n\
    \n    # Nut chamber, with a narrower hex throat above it. The chamber has a\n\
    \    # closed floor except for the bolt passage.\n    chamber_h = p.nut_h + p.pocket_clearance_h\n\
    \    chamber_top = p.pocket_floor_z + chamber_h\n    body = body.cut(hex_cut(p.pocket_af,\
    \ p.pocket_floor_z, chamber_h))\n    body = body.cut(hex_cut(p.throat_af, chamber_top,\
    \ p.knob_h - chamber_top + 0.2))\n\n    # Axial clearance bore lets the bolt pass\
    \ through the nut and out the\n    # far face of the knob.\n    bore = cq.Workplane('XY').workplane(offset=-0.2).circle(p.bolt_clearance_d\
    \ / 2.0).extrude(p.knob_h + 0.4)\n    body = body.cut(bore)\n\n    # Six radial\
    \ relief slots make the upper throat petals compliant for\n    # pressing the\
    \ nut in by hand. They open at the perimeter and run down\n    # to just above\
    \ the nut chamber.\n    for i in range(6):\n        slot = cq.Workplane('XY').box(p.slot_length,\
    \ p.slot_width, p.knob_h - p.slot_start_z + 0.2,\n                           \
    \           centered=(True, True, False))\n        slot = slot.translate((p.slot_center_r,\
    \ 0, p.slot_start_z))\n        slot = slot.rotate((0, 0, 0), (0, 0, 1), 60 * i)\n\
    \        body = body.cut(slot)\n    return body"
  print_orientation: Place the flat z=0 face on the bed; the nut-entry throat faces
    upward. No supports are intended.
  use_orientation: Press the M5 nut into the slotted hex throat from the top/lobed
    face. The M5 bolt enters from that same face, threads through the nut, and its
    shank exits the z=0 face.
