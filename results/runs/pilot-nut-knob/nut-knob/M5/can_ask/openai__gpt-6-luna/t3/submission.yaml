task: nut-knob/M5
note: One-piece knob with a blind internal M5 hex-nut pocket and a 5.6 mm through-bore.
  The nut is inserted from the top; the pocket floor stops it being pushed through
  the far side, while the M5 bolt passes through the nut and exits the bottom. Since
  printed press-fit tolerances vary, print the small coupon first, test your nut,
  then set `pocket_af` in the knob to the tightest coupon size that you can press
  in by hand and that stays put when inverted. The coupon is only a fit test; the
  finished knob itself is one piece.
questions: []
params:
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: design
    note: Nominal outside diameter.
  knob_h:
    value: 14
    unit: mm
    kind: design
    source: design
    note: ''
  pocket_af:
    value: 8.1
    unit: mm
    kind: design
    source: design
    note: Starting value; tune using the coupon. Nut nominal AF is 8.0 mm.
  nut_depth:
    value: 5.2
    unit: mm
    kind: hardware
    source: catalog
    note: M5 nut thickness is 4.7 mm; the extra depth recesses it below the knob face.
  bolt_clearance_d:
    value: 5.6
    unit: mm
    kind: design
    source: design
    note: Clearance for an M5 bolt through the knob.
  grip_count:
    value: 10
    unit: count
    kind: design
    source: design
    note: Shallow perimeter scallops.
  grip_cut_r:
    value: 2
    unit: mm
    kind: design
    source: design
    note: ''
  grip_cut_radius:
    value: 16.4
    unit: mm
    kind: design
    source: design
    note: Scallop cutter center radius from knob axis.
  coupon_l:
    value: 32
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_w:
    value: 12
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_t:
    value: 6
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_floor:
    value: 1
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_pitch:
    value: 10
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_af_lo:
    value: 7.9
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_af_mid:
    value: 8.1
    unit: mm
    kind: design
    source: design
    note: ''
  coupon_af_hi:
    value: 8.3
    unit: mm
    kind: design
