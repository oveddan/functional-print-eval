task: nut-knob/M5
note: The nut is held by friction in a hex pocket that is about 0.2 mm deeper than
  the nut. The closed floor stops it going through the far side. The right fit depends
  on your printer, so the coupon has three pocket sizes to check it. The pocket is
  oriented so it prints without bridging or supports.
questions: []
params:
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: requested about 30 mm across
  knob_h:
    value: 12
    unit: mm
    kind: design
    source: design
    note: ''
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 thickness
  bolt_d:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: M5 bolt major diameter
  hole_clearance:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: bolt hole 5.5 mm
  fit_offset:
    value: 0.0
    unit: mm
    kind: design
    source: guessed
    note: added to nut AF for the press-fit pocket. 0.0 gives a light interference
      because printed pockets come out slightly small. Check with the coupon, which
      tests -0.1, 0 and +0.1.
  depth_extra:
    value: 0.2
    unit: mm
    kind: design
    source: design
    note: pocket is deeper than the nut so the nut sits fully inside, recessed
  flute_count:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
  flute_d:
    value: 7
    unit: mm
    kind: design
    source: design
    note: grip scallop diameter
  flute_depth:
    value: 2
    unit: mm
    kind: design
    source: design
    note: how far each scallop cuts into the rim
  foot_chamfer:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: chamfer on the bed edge to hide elephant foot
  coupon_floor:
    value: 2
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    r = p.knob_d / 2.0\n    body = cq.Workplane('XY').circle(r).extrude(p.knob_h)\n\
    \    body = body.faces('<Z').chamfer(p.foot_chamfer)\n    cr = r + p.flute_d /\
    \ 2.0 - p.flute_depth\n    for i in range(int(p.flute_count)):\n        a = 2\
    \ * math.pi * i / p.flute_count\n        cut = (cq.Workplane('XY').center(cr *\
    \ math.cos(a), cr * math.sin(a))\n               .circle(p.flute_d / 2.0).extrude(p.knob_h))\n\
    \        body = body.cut(cut)\n    depth = p.nut_h + p.depth_extra\n    af = p.nut_af\
    \ + p.fit_offset\n    dc = af / math.cos(math.pi / 6)\n    pocket = (cq.Workplane('XY').workplane(offset=p.knob_h\
    \ - depth)\n              .polygon(6, dc).extrude(depth + 1))\n    body = body.cut(pocket)\n\
    \    hole = cq.Workplane('XY').circle((p.bolt_d + p.hole_clearance) / 2.0).extrude(p.knob_h)\n\
    \    body = body.cut(hole)\n    return body\n"
  print_orientation: Grip end (the closed face with the bolt hole) flat on the bed;
    the hex pocket opens upward, so it needs no bridging or supports.
  use_orientation: 'Flipped over: the open nut pocket faces the work and the bolt
    comes in through it. The closed end is the top.'
- id: fit-coupon
  role: coupon
  material: PLA
  code: "import math\ndef build(p):\n    depth = p.nut_h + p.depth_extra\n    t =\
    \ p.coupon_floor + depth\n    body = cq.Workplane('XY').rect(40, 14).extrude(t)\n\
    \    for i, off in enumerate((-0.1, 0.0, 0.1)):\n        x = (i - 1) * 12.0\n\
    \        af = p.nut_af + p.fit_offset + off\n        dc = af / math.cos(math.pi\
    \ / 6)\n        pk = (cq.Workplane('XY').workplane(offset=t - depth).center(x,\
    \ 0)\n              .polygon(6, dc).extrude(depth + 1))\n        body = body.cut(pk)\n\
    \        h = cq.Workplane('XY').center(x, 0).circle((p.bolt_d + p.hole_clearance)\
    \ / 2.0).extrude(t)\n        body = body.cut(h)\n    return body\n"
  print_orientation: Flat on the bed with the pockets opening upward, same as the
    knob.
  use_orientation: 'Test only: press an M5 nut into each pocket and pick the one that
    is snug and holds the nut when inverted and shaken.'
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
joints: []
criteria:
- id: c-pocket
  part: knob
  feature: hex nut pocket
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - nut_h
  - fit_offset
  - depth_extra
  check:
    method: coupon
    ref: fit-coupon
    description: Print the coupon first. The nut should press in by hand with firm
      thumb pressure, stay in when inverted and shaken, and sit below the face. If
      the fit is loose or too tight, change fit_offset to the value of the pocket
      that worked.
- id: c-floor
  part: knob
  feature: closed floor of the pocket
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - knob_h
  - nut_h
  - depth_extra
  check:
    method: measure
    ref: null
    description: The floor is about 7 mm thick, with no opening large enough for the
      nut. The nut can't be pushed out through the far side.
- id: c-hole
  part: knob
  feature: bolt through-hole
  relation: clears
  hardware: nut
  clearance_mm: 0.5
  params:
  - bolt_d
  - hole_clearance
  check:
    method: measure
    ref: null
    description: An M5 bolt passes freely through the 5.5 mm hole and then threads
      into the nut.
manual:
- n: '1'
  text: Print the fit coupon first (about 10 minutes). It has three hex pockets, from
    tighter to looser. Press an M5 nut into each. Pick the one where the nut needs
    firm thumb pressure and doesn't fall out when you turn it upside down and shake
    it. The middle pocket is the knob's default. If a different one fits better, change
    fit_offset by that pocket's offset (-0.1 or +0.1) and regenerate.
  parts:
  - fit-coupon
  hardware:
  - nut
  tool: null
- n: '2'
  text: Print the knob with the closed grip face on the bed and the hex pocket facing
    up. Use 0.2 mm layers, at least 4 walls and 15-20% infill or more, and no supports.
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Turn the knob so the pocket faces up. Put the M5 nut into the pocket with
    its flats lined up with the hex walls. Press it in by hand until it bottoms out
    against the floor. It ends up slightly below the face. If it is hard to start,
    press it in on a flat table.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Push the M5 bolt in through the open pocket side, through the nut and out
    through the 5.5 mm hole in the closed end. A bolt is for the other direction only
    if you thread it from the pocket side. Turn the knob by hand to tighten.
  parts:
  - knob
  hardware:
  - nut
  tool: null
