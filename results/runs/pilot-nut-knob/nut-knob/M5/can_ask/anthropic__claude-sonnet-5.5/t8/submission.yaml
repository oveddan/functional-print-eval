task: nut-knob/M5
note: The nut press-fit depends on how your printer sizes small hex holes, and I couldn't
  get a measurement of your nut. I used catalog 8.0 mm across flats and set fit =
  0.0, which is a guess. Print the small fit coupon first. It has pockets at -0.1,
  0.0 and +0.1 mm, so you can pick the right one and set 'fit' to match before printing
  the knob. The knob is 30 mm across and 12 mm tall, with 8 grip scallops. Its pocket
  opens on the face that goes against the work, and the 5.4 mm hole in the top is
  too small for the nut to pass. The M5x30 bolt is just an example length.
questions:
- text: Could you measure the across-flats width of your M5 nut? I couldn't get it,
    so I used the catalog 8.0 mm.
  answer: null
params:
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 thickness
  bolt_d:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: M5 shank
  knob_d:
    value: 30
    unit: mm
    kind: world
    source: asked
    note: about 30 mm across
  knob_h:
    value: 12
    unit: mm
    kind: design
    source: design
    note: ''
  edge_r:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: fillet on the top edge, which is the edge on the bed
  n_scallops:
    value: 8
    unit: count
    kind: design
    source: design
    note: ''
  scallop_r:
    value: 4
    unit: mm
    kind: design
    source: design
    note: ''
  scallop_depth:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: ''
  bolt_clear:
    value: 0.4
    unit: mm
    kind: design
    source: design
    note: diametral clearance for the bolt hole
  fit:
    value: 0.0
    unit: mm
    kind: design
    source: guessed
    note: added to nut across-flats for the pocket. 0.0 is a guess; confirm on the
      coupon, then edit
  fit_a:
    value: -0.1
    unit: mm
    kind: design
    source: design
    note: 'coupon variant: tighter'
  fit_b:
    value: 0.0
    unit: mm
    kind: design
    source: design
    note: 'coupon variant: same as the knob'
  fit_c:
    value: 0.1
    unit: mm
    kind: design
    source: design
    note: 'coupon variant: looser'
  pocket_extra:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: pocket depth beyond nut thickness, so the nut sits fully recessed
  coupon_floor:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: knob
  role: final
  material: PLA
  code: "def build(p):\n    R = p.knob_d / 2.0\n    H = p.knob_h\n    body = cq.Workplane('XY').circle(R).extrude(H)\n\
    \    body = body.faces('<Z').edges().fillet(p.edge_r)\n    import math\n    pts\
    \ = []\n    cr = R + p.scallop_r - p.scallop_depth\n    for i in range(int(p.n_scallops)):\n\
    \        a = 2 * math.pi * i / p.n_scallops\n        pts.append((cr * math.cos(a),\
    \ cr * math.sin(a)))\n    cut = cq.Workplane('XY').pushPoints(pts).circle(p.scallop_r).extrude(H)\n\
    \    body = body.cut(cut)\n    pocket_d = p.nut_h + p.pocket_extra\n    af = p.nut_af\
    \ + p.fit\n    pocket = (cq.Workplane('XY').workplane(offset=H - pocket_d)\n \
    \             .polygon(6, af / 0.8660254).extrude(pocket_d + 1))\n    body = body.cut(pocket)\n\
    \    hole = cq.Workplane('XY').circle((p.bolt_d + p.bolt_clear) / 2.0).extrude(H\
    \ + 1)\n    body = body.cut(hole)\n    return body\n"
  print_orientation: Top face (the flat face with the 5.4 mm bolt hole) on the bed;
    the hex pocket opens upward, so nothing needs support or bridging.
  use_orientation: 'Flip over: the pocket opening faces down against the work and
    the bolt comes up through it. The knob can also be held upside down with the nut
    in it.'
- id: fit-coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    d = p.nut_h + p.pocket_extra\n    h = d + p.coupon_floor\n\
    \    blk = cq.Workplane('XY').box(46, 15, h, centered=(True, True, False))\n \
    \   for x, f in ((-14, p.fit_a), (0, p.fit_b), (14, p.fit_c)):\n        af = p.nut_af\
    \ + f\n        pk = (cq.Workplane('XY').workplane(offset=h - d).center(x, 0)\n\
    \              .polygon(6, af / 0.8660254).extrude(d + 1))\n        blk = blk.cut(pk)\n\
    \        ho = cq.Workplane('XY').center(x, 0).circle((p.bolt_d + p.bolt_clear)\
    \ / 2.0).extrude(h + 1)\n        blk = blk.cut(ho)\n    return blk\n"
  print_orientation: Flat block on the bed, hex pockets opening upward (same as the
    knob).
  use_orientation: 'Test piece only: press an M5 nut into each pocket and keep the
    one that is a firm hand press and holds when turned upside down and shaken.'
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
- id: bolt
  ref: ISO 4762 M5x30
  qty: 1
joints:
- id: bolt-through-knob
  fastener: bolt
  axis_origin:
  - 0.0
  - 0.0
  - -18.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: knob
    feature: hex pocket
    role: nut_pocket
  - part: knob
    feature: 5.4 mm bolt hole through the floor
    role: clearance
  nut: nut
  external: null
criteria:
- id: c-nut-retained
  part: knob
  feature: hex pocket
  relation: contains
  hardware: nut
  clearance_mm: 0.0
  params:
  - nut_af
  - nut_h
  - fit
  - pocket_extra
  check:
    method: coupon
    ref: fit-coupon
    description: Nut presses in by hand and stays in when the piece is held upside
      down and shaken. Pick the pocket (fit_a, fit_b or fit_c) that does this and
      set 'fit' to match.
- id: c-nut-stop
  part: knob
  feature: floor with 5.4 mm hole
  relation: supports
  hardware: nut
  clearance_mm: null
  params:
  - bolt_d
  - bolt_clear
  - nut_af
  check:
    method: measure
    ref: null
    description: The hole is 5.4 mm, smaller than the nut's 8 mm across flats, so
      the nut cannot pass through the far side.
- id: c-bolt-clear
  part: knob
  feature: bolt hole
  relation: clears
  hardware: bolt
  clearance_mm: 0.2
  params:
  - bolt_d
  - bolt_clear
  check:
    method: measure
    ref: null
    description: M5 bolt passes through the nut and the floor hole freely.
manual:
- n: '1'
  text: Print the fit coupon first (about 10 min). It has three hex pockets, tight,
    nominal and loose. Press an M5 nut into each. Pick the one that needs a firm hand
    press and stays in when you turn the block upside down and shake it. If it's not
    the middle one, change the 'fit' param to that pocket's value (-0.1 or +0.1) and
    regenerate.
  parts:
  - fit-coupon
  hardware:
  - nut
  tool: null
- n: '2'
  text: Print the knob with the flat top on the bed and the hex pocket facing up.
    Use PLA, 0.2 mm layers, at least 4 walls and 20% or more infill.
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Align the nut's flats with the hex pocket. Press it in with your thumb until
    it sits flat on the pocket floor, below the open face. Use a flat surface to push
    it in if needed.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Turn the knob upside down to check the nut stays in. Then pass the M5 bolt
    through your part, through the nut from the open side, and out through the hole
    in the knob's top. Turn the knob to tighten. The bolt should be long enough to
    reach through the nut; 30 mm is shown as an example.
  parts:
  - knob
  hardware:
  - bolt
  - nut
  tool: null
