task: nut-knob/M5
note: Captive-nut hand knob, one print. Nut is a press fit by friction in a hex pocket
  open at the bottom; the top ceiling with a 5.5 mm hole stops the nut from leaving
  upward. Retention relies on PLA friction, so the pocket size may need one tweak
  after the first print.
questions: []
params:
  knob_d:
    value: 30
    unit: mm
    kind: design
    source: asked
    note: about 30 mm across, per request
  knob_h:
    value: 18
    unit: mm
    kind: design
    source: design
    note: grip height; leaves about 13 mm of solid ceiling above the nut pocket
  flute_count:
    value: 12
    unit: count
    kind: design
    source: design
    note: grip flutes around the rim
  flute_r:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: radius of each grip flute cut
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 across flats
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 thickness
  pocket_af:
    value: 7.8
    unit: mm
    kind: design
    source: design
    note: nut pocket across flats, 0.2 mm under nut af so the nut press-fits and is
      held by friction in PLA
  pocket_depth:
    value: 4.7
    unit: mm
    kind: design
    source: design
    note: equal to nut thickness; nut sits flush with the knob bottom
  bolt_clear_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: M5 clearance hole through the ceiling; smaller than the nut so the nut cannot
      pass out the top
parts:
- id: knob
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    R = p.knob_d / 2.0\n    body = cq.Workplane('XY').circle(R).extrude(p.knob_h)\n\
    \    pts = [(R * math.cos(2 * math.pi * i / p.flute_count), R * math.sin(2 * math.pi\
    \ * i / p.flute_count)) for i in range(int(p.flute_count))]\n    flutes = cq.Workplane('XY').pushPoints(pts).circle(p.flute_r).extrude(p.knob_h)\n\
    \    body = body.cut(flutes)\n    d_circ = p.pocket_af / math.cos(math.radians(30))\n\
    \    pocket = cq.Workplane('XY').polygon(6, d_circ).extrude(p.pocket_depth)\n\
    \    body = body.cut(pocket)\n    bolt = cq.Workplane('XY').circle(p.bolt_clear_d\
    \ / 2.0).extrude(p.knob_h)\n    body = body.cut(bolt)\n    return body"
  print_orientation: knob axis vertical, nut pocket opening on the bed (bottom face
    down), grip top up
  use_orientation: bolt axis vertical, nut pocket at the bottom, bolt head side at
    the top
hardware:
- id: nut
  ref: ISO 4032 M5
  qty: 1
- id: bolt
  ref: ISO 4762 M5x30
  qty: 1
joints: []
criteria:
- id: nut_pocket
  part: knob
  feature: hex nut pocket, open at bottom, 7.8 mm across flats, 4.7 mm deep
  relation: seats
  hardware: nut
  clearance_mm: null
  params:
  - pocket_af
  - pocket_depth
  - nut_af
  - nut_h
  check:
    method: measure
    ref: null
    description: After printing, check that the ISO 4032 M5 nut press-fits into the
      pocket and stays in when the knob is inverted.
- id: bolt_clear
  part: knob
  feature: M5 clearance hole through the ceiling
  relation: clears
  hardware: bolt
  clearance_mm: null
  params:
  - bolt_clear_d
  check:
    method: measure
    ref: null
    description: Confirm the M5 bolt passes freely through the clearance hole and
      the nut can't pass through it.
manual:
- n: '1'
  text: Print the knob with the nut pocket on the bed (bottom face down). No supports
    are needed for the pocket; the ceiling above it is a short bridge.
  parts:
  - knob
  hardware: []
  tool: null
- n: '2'
  text: Remove the print. Check that the hex pocket is clean and open at the bottom
    face.
  parts:
  - knob
  hardware: []
  tool: null
- n: '3'
  text: Line up the flats of the M5 hex nut with the pocket and press the nut up into
    the pocket by hand until it sits flush with the bottom face. It should be a snug
    press fit. If it does not start, rotate the nut to match the flats; do not force
    it.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '4'
  text: Turn the knob upside down to confirm the nut stays in. If it drops out, the
    pocket is too loose for the nut and the knob needs reprinting with a smaller pocket_af.
  parts:
  - knob
  hardware:
  - nut
  tool: null
- n: '5'
  text: Push the M5x30 bolt down through the clearance hole at the top of the knob
    and thread it into the captive nut by hand, turning the knob to tighten. The bolt
    exits the nut and out the bottom side.
  parts:
  - knob
  hardware:
  - nut
  - bolt
  tool: null
