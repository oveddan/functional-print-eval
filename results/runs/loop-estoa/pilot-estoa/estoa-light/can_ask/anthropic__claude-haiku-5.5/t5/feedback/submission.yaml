manual:
- n: '1'
  text: Print the box with its open back on the bed. Support is needed under the roof
    inside the box; pull it out through the open back after printing.
  parts:
  - box
  hardware: []
  tool: null
- n: '2'
  text: Press one M3x4x5 heat-set insert into each of the two 4.3 mm holes in the
    roof, from inside the box.
  parts:
  - box
  hardware:
  - insert
  tool: soldering iron
- n: '3'
  text: Set the perfboard with the ESP32 on its top face onto the four corner posts,
    ESP32 side toward the roof, USB-C port toward the bottom wall. Fix each corner
    with an M2x6 self-tapping screw through the board's corner hole, from the ESP32
    side.
  parts:
  - box
  hardware:
  - m2_self_tap
  - perfboard
  - esp32
  tool: null
- n: '4'
  text: Route the four wires from the perfboard out through the 8 x 6 mm slot near
    the top of the roof and across the back of the disc to its input connector at
    12 o'clock.
  parts: []
  hardware:
  - led_disk
  tool: null
- n: '5'
  text: Lay the disc against the roof so its two 3.3 mm holes line up with the inserts
    (3 and 9 o'clock). Drive an M3x8 socket head screw through each hole from the
    LED side into its insert.
  parts:
  - box
  hardware:
  - m3_screw
  - led_disk
  tool: null
- n: '6'
  text: 'Drive two #8 wall screws into the wall 40 mm apart, heads about 3.5 mm out.
    Slide the keyholes in the two top tabs over the heads, then drop the box so the
    heads sit in the narrow slots.'
  parts:
  - box
  hardware: []
  tool: null
- n: '7'
  text: Plug the USB-C charger into the ESP32 through the bottom-wall cutout.
  parts:
  - box
  hardware:
  - esp32
  tool: null
