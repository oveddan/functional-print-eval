parts:
- id: box
  role: final
  material: PLA, matte white
  code: "import cadquery as cq\n\ndef build(p):\n    W, H, D = p.box_w, p.box_h, p.box_d\n\
    \    t, ft = p.wall_t, p.front_t\n    body = cq.Workplane('XY').box(W, H, D, centered=(True,\
    \ True, False))\n    # open at the back (z=0): the wall closes it\n    cav = cq.Workplane('XY').box(W\
    \ - 2*t, H - 2*t, D - ft + 1, centered=(True, True, False)).translate((0, 0, -1))\n\
    \    body = body.cut(cav)\n    cx = p.perf_w/2 - p.perf_hole_inset\n    cy = p.perf_l/2\
    \ - p.perf_hole_inset\n    for sx in (-1, 1):\n        for sy in (-1, 1):\n  \
    \          x, y = sx*cx, sy*cy\n            a = sx*(cx - p.post_d/2)\n       \
    \     b = sx*(W/2 - t + 1)\n            blk = cq.Workplane('XY').box(abs(b - a),\
    \ p.post_d, p.post_h, centered=(True, True, False)).translate(((a + b)/2, y, 0))\n\
    \            body = body.union(blk)\n            pilot = cq.Workplane('XY').circle(p.m2_pilot_d/2).extrude(p.post_h\
    \ + 2).translate((x, y, -1))\n            body = body.cut(pilot)\n    # hanging\
    \ tabs above the box top, flat on the wall\n    y0 = H/2 - 4\n    y1 = p.hang_y\
    \ + 6\n    for sx in (-1, 1):\n        x = sx*p.hang_spacing/2\n        tab =\
    \ cq.Workplane('XY').box(16, y1 - y0, p.tab_t, centered=(True, False, False)).translate((x,\
    \ y0, 0))\n        big = cq.Workplane('XY').circle(p.keyhole_d/2).extrude(p.tab_t\
    \ + 2).translate((x, p.hang_y, -1))\n        slot = cq.Workplane('XY').box(p.slot_w,\
    \ p.slot_len, p.tab_t + 2, centered=(True, False, False)).translate((x, p.hang_y\
    \ - p.slot_len, -1))\n        rnd = cq.Workplane('XY').circle(p.slot_w/2).extrude(p.tab_t\
    \ + 2).translate((x, p.hang_y - p.slot_len, -1))\n        tab = tab.cut(big).cut(slot).cut(rnd)\n\
    \        body = body.union(tab)\n    # heat-set insert holes in the roof\n   \
    \ for sx in (-1, 1):\n        h = cq.Workplane('XY').circle(p.insert_hole_d/2).extrude(ft\
    \ + 2).translate((sx*p.disc_hole_pitch/2, 0, D - ft - 1))\n        body = body.cut(h)\n\
    \    # wire slot near top of roof\n    ws = cq.Workplane('XY').box(p.wire_slot_w,\
    \ 6, 10).translate((0, p.wire_slot_y, D - 2))\n    body = body.cut(ws)\n    #\
    \ USB-C access in bottom wall\n    port_z = p.post_h + p.perf_t + p.esp_port_bottom\
    \ + p.esp_port_h/2\n    usb = cq.Workplane('XY').box(p.usb_cut_w, 8, p.usb_cut_h).translate((p.esp_port_x_off,\
    \ -H/2 + 2, port_z))\n    body = body.cut(usb)\n    return body\n"
  print_orientation: back (open rim, z=0) on the bed; roof support removable through
    the open back
  use_orientation: back flat against the wall, roof facing out
