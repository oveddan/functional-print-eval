parts:
- id: box
  role: final
  material: PLA, matte white
  code: "import cadquery as cq\n\ndef build(p):\n    W, H, D = p.box_w, p.box_h, p.box_d\n\
    \    t, bp, ft = p.wall_t, p.back_t, p.front_t\n    body = cq.Workplane('XY').box(W,\
    \ H, D, centered=(True, True, False))\n    cav = cq.Workplane('XY').box(W - 2*t,\
    \ H - 2*t, D - bp - ft, centered=(True, True, False)).translate((0, 0, bp))\n\
    \    body = body.cut(cav)\n    cx = p.perf_w/2 - p.perf_hole_inset\n    cy = p.perf_l/2\
    \ - p.perf_hole_inset\n    for sx in (-1, 1):\n        for sy in (-1, 1):\n  \
    \          x, y = sx*cx, sy*cy\n            post = cq.Workplane('XY').circle(p.standoff_d/2).extrude(p.standoff_h).translate((x,\
    \ y, bp))\n            body = body.union(post)\n            pilot = cq.Workplane('XY').circle(p.m2_pilot_d/2).extrude(p.standoff_h\
    \ + 1).translate((x, y, bp))\n            body = body.cut(pilot)\n    win = cq.Workplane('XY').box(p.win_w,\
    \ p.win_y1 - p.win_y0, bp + 2, centered=(True, False, False)).translate((-p.win_w/2,\
    \ p.win_y0, -1))\n    body = body.cut(win)\n    for sx in (-1, 1):\n        x\
    \ = sx*p.hang_spacing/2\n        y = p.hang_y\n        big = cq.Workplane('XY').circle(p.keyhole_d/2).extrude(bp\
    \ + 2).translate((x, y, -1))\n        slot = cq.Workplane('XY').box(p.slot_w,\
    \ p.slot_len, bp + 2, centered=(True, False, False)).translate((x, y - p.slot_len,\
    \ -1))\n        rnd = cq.Workplane('XY').circle(p.slot_w/2).extrude(bp + 2).translate((x,\
    \ y - p.slot_len, -1))\n        body = body.cut(big).cut(slot).cut(rnd)\n    for\
    \ sx in (-1, 1):\n        h = cq.Workplane('XY').circle(p.insert_hole_d/2).extrude(ft\
    \ + 2).translate((sx*p.disc_hole_pitch/2, 0, D - ft - 1))\n        body = body.cut(h)\n\
    \    ws = cq.Workplane('XY').box(p.wire_slot_w, 6, 10).translate((0, p.wire_slot_y,\
    \ D - 2))\n    body = body.cut(ws)\n    port_z = bp + p.standoff_h + p.perf_t\
    \ + p.esp_port_bottom + p.esp_port_h/2\n    usb = cq.Workplane('XY').box(p.usb_cut_w,\
    \ 8, p.usb_cut_h).translate((p.esp_port_x_off, -H/2 + 2, port_z))\n    body =\
    \ body.cut(usb)\n    return body\n"
  print_orientation: back face (z=0) on the bed; front wall needs support inside the
    cavity, removed through the back window
  use_orientation: back flat against the wall, front wall facing out
