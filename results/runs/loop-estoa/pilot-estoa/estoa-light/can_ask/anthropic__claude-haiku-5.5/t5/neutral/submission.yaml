manual:
- n: '1'
  text: Print the box with the back face on the bed. Print support under the front
    wall inside the cavity, standing on the bed through the large window in the back
    plate. Pull the support out through the window after printing.
  parts:
  - box
  hardware: []
  tool: null
- n: '2'
  text: Press one M3x4x5 heat-set insert into each of the two 4.3 mm holes in the
    front wall, from inside the box.
  parts:
  - box
  hardware:
  - insert
  tool: soldering iron
- n: '3'
  text: Set the perfboard with the ESP32 on its top face onto the four corner posts,
    ESP32 side facing the front wall, USB-C port toward the bottom wall. Fix each
    corner with an M2x6 self-tapping screw through the board's corner hole.
  parts:
  - box
  hardware:
  - m2_self_tap
  - perfboard
  - esp32
  tool: null
- n: '4'
  text: Route the four wires from the perfboard out through the 8 x 6 mm slot near
    the top of the front wall and across the back of the disc to its input connector
    at 12 o'clock.
  parts: []
  hardware:
  - led_disk
  tool: null
- n: '5'
  text: Lay the disc against the front wall so its two 3.3 mm holes line up with the
    inserts (3 and 9 o'clock). Drive an M3x8 socket head screw through each hole from
    the LED side into its insert.
  parts:
  - box
  hardware:
  - m3_screw
  - led_disk
  tool: null
- n: '6'
  text: 'Drive two #8 wall screws into the wall 40 mm apart, leaving the heads about
    3.5 mm out. Slide the keyhole openings over the heads and let the box drop so
    the heads sit in the narrow slots.'
  parts:
  - box
  hardware: []
  tool: null
- n: '7'
  text: Plug the USB-C charger into the ESP32 through the bottom-wall cutout.
  parts:
  - box
  hardware:
  - esp32
  tool: null
