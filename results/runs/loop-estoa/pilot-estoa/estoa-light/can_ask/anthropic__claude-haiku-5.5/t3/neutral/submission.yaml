manual:
- n: '1'
  text: Print the back box in matte white PLA, back plate on the bed. Check the print
    fits the bed (about 241 mm across).
  parts:
  - back-box
  hardware: []
  tool: null
- n: '2'
  text: Press the two M3x4x5 heat-set inserts into the two holes in the top of the
    central hub, flush with the top face, using a soldering iron.
  parts:
  - back-box
  hardware:
  - insert
  tool: null
- n: '3'
  text: Solder the four wires from the ESP32 perfboard to the LED disc's input connector.
    Route them up through the box interior.
  parts: []
  hardware:
  - perfboard
  - disc
  tool: null
- n: '4'
  text: Set the perfboard on the four standoffs with the ESP32 on top, so the USB-C
    port points out through the rim cutout. Fix it with four M2x6 self-tapping screws
    through the corner holes.
  parts:
  - back-box
  hardware:
  - perfboard
  - esp32
  - m2
  tool: null
- n: '5'
  text: Plug the ESP32 onto the perfboard headers if not already done.
  parts: []
  hardware:
  - esp32
  tool: null
- n: '6'
  text: Lay the LED disc on the rim and hub with its wires on the inside. Line up
    the two 3.3 mm holes with the inserts.
  parts:
  - back-box
  hardware:
  - disc
  tool: null
- n: '7'
  text: Fix the disc with two M3x8 socket head screws through its holes into the inserts.
  parts: []
  hardware:
  - m3screw
  - insert
  tool: null
- n: '8'
  text: Hang the box flat on the wall using the two keyhole slots on the back plate.
    Use two wall screws matched to the keyholes.
  parts: []
  hardware: []
  tool: null
