task: estoa-light
note: ''
questions:
- text: What is the thickness of the LED disc? I guessed 3 mm, which sets the M3 screw
    length. Confirm before buying screws.
  answer: null
- text: 'What is the wall screw size and head diameter? I used an 8 mm keyhole head,
    which assumes a #8-ish screw.'
  answer: null
- text: What is the perfboard thickness and the USB-C port opening size? I guessed
    1.6 mm and used a 12 x 12 mm cutout.
  answer: null
- text: Where does the ESP32 sit on the perfboard? Measurements gave the USB mouth
    4.8 mm past the board edge, but the 7.53 mm perfboard-edge figure didn't fit the
    63 mm board on a 70 mm side. I placed it centred on the board's long axis.
  answer: null
