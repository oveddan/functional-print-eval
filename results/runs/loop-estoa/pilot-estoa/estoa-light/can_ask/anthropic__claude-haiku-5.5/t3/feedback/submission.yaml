manual:
- n: '1'
  text: Print the back box in matte white PLA, back plate on the bed. It is about
    241 mm across.
  parts:
  - back-box
  hardware: []
  tool: null
- n: '2'
  text: Press the two M3x4x5 heat-set inserts into the top of the hub, flush, at the
    two disc-hole positions.
  parts:
  - back-box
  hardware:
  - insert
  tool: null
- n: '3'
  text: Solder the four wires from the perfboard to the LED disc's input connector.
  parts: []
  hardware:
  - perfboard
  - disc
  tool: null
- n: '4'
  text: Set the perfboard on the four standoffs with the ESP32 on top, USB-C port
    toward the rim cutout. Fix with four M2x6 self-tapping screws through the corner
    holes.
  parts:
  - back-box
  hardware:
  - perfboard
  - esp32
  - m2
  tool: null
- n: '5'
  text: Plug the ESP32 onto the perfboard headers if not already done.
  parts: []
  hardware:
  - esp32
  tool: null
- n: '6'
  text: Lay the LED disc on the rim and hub with its wires inside. Line up the two
    3.3 mm holes with the inserts.
  parts:
  - back-box
  hardware:
  - disc
  tool: null
- n: '7'
  text: Tighten the two M3x8 socket head screws through the disc holes into the inserts
    until the heads are snug on the disc.
  parts: []
  hardware:
  - m3screw
  - insert
  tool: null
- n: '8'
  text: Hang the box on the two wall screws through the keyhole heads, then slide
    it down into the slots. Check the wall screw spacing matches the design first.
  parts:
  - back-box
  hardware: []
  tool: null
