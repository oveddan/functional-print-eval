parts:
- id: back-box
  role: final
  material: PLA matte white
  code: "def build(p):\n    R = p.disc_d / 2\n    H = p.depth\n    t = p.wall_t\n\
    \    base = cq.Workplane('XY').circle(R).extrude(p.back_t)\n    rim = cq.Workplane('XY').circle(R).circle(R\
    \ - t).extrude(H)\n    hub = cq.Workplane('XY').circle(p.hub_r).extrude(H)\n \
    \   body = base.union(rim).union(hub)\n    ox = p.perf_L / 2 - (p.perf_hole_edge\
    \ + p.perf_hole_d / 2)\n    oy = p.perf_W / 2 - (p.perf_hole_edge + p.perf_hole_d\
    \ / 2)\n    pts = [(p.perf_cx + sx * ox, p.perf_cy + sy * oy) for sx in (-1, 1)\
    \ for sy in (-1, 1)]\n    so = cq.Workplane('XY').pushPoints(pts).circle(p.standoff_d\
    \ / 2).extrude(p.standoff_h)\n    body = body.union(so)\n    pil = cq.Workplane('XY').workplane(offset=p.standoff_h\
    \ - 4).pushPoints(pts).circle(p.pilot_d / 2).extrude(5)\n    body = body.cut(pil)\n\
    \    hp = p.disc_hole_pitch / 2\n    ins = cq.Workplane('XY').workplane(offset=H\
    \ - p.hub_hole_depth).pushPoints([(-hp, 0), (hp, 0)]).circle(p.insert_hole_d /\
    \ 2).extrude(p.hub_hole_depth + 1)\n    body = body.cut(ins)\n    sp = p.wall_span\
    \ / 2\n    for x in (-sp, sp):\n        head = cq.Workplane('XY').workplane(offset=-1).center(x,\
    \ 75).circle(p.key_head_d / 2).extrude(p.back_t + 2)\n        slot = cq.Workplane('XY').workplane(offset=-1).center(x,\
    \ 70).rect(p.key_slot_w, 10).extrude(p.back_t + 2)\n        body = body.cut(head).cut(slot)\n\
    \    cy = p.perf_cy\n    hw = p.usb_w / 2\n    prof = [(cy - hw, 16), (cy + hw,\
    \ 16), (cy + hw, 22), (cy, 16 + p.usb_h), (cy - hw, 22)]\n    usb = cq.Workplane('YZ',\
    \ origin=(-125, 0, 0)).polyline(prof).close().extrude(25)\n    body = body.cut(usb)\n\
    \    return body\n"
  print_orientation: back plate face down on the bed (z=0 is the wall face)
  use_orientation: back plate flat against the wall, opening toward +z (out toward
    the viewer)
