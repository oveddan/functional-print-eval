task: estoa-light
note: ''
questions:
- text: 'Wall screw spacing: the keyholes assume the two wall screws are 110 mm apart
    and level. Please check the spacing on the wall and the screw head size before
    drilling.'
  answer: null
- text: Disc thickness was not measured; I used 2 mm. If it is thicker, the M3x6 disc
    screws will be too short.
  answer: null
- text: Perfboard thickness was not measured; I used 1.6 mm.
  answer: null
- text: The ESP32 is 63.17 mm long on a 70 mm perfboard, which does not match the
    7.53 mm measured end gap. I centred the ESP32. Please check the placement.
  answer: null
- text: The charger plug head was not measured; the 12 x 7 mm slot is a guess.
  answer: null
- text: The disc screw heads sit on the LED face, about 3 mm proud. The front cover
    must clear them.
  answer: null
