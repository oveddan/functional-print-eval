manual:
- n: '1'
  text: Print the shell (back plate on the bed) and the lid (inner face on the bed).
    Remove supports and clean the holes.
  parts:
  - shell
  - lid
  hardware: []
  tool: null
- n: '2'
  text: Heat-set six M3x4x5 inserts into the bosses at the rim top of the shell (evenly
    spaced at 60 degrees, avoiding the bottom slot). Start each insert straight with
    a guide or the iron held square, and stop as soon as it is flush. Heat-set two
    more into the lid at the disc positions, from the disc side.
  parts:
  - shell
  - lid
  hardware:
  - insert
  tool: soldering iron with heat-set tip
- n: '3'
  text: The ESP32 is already plugged into the perfboard. Fit the perfboard onto the
    four standoffs inside the shell, using the four corner holes, and drive the M2
    self-tapping screws into the standoffs.
  parts:
  - shell
  hardware:
  - perfboard
  - esp32
  - m2_screw
  tool: small screwdriver
- n: '4'
  text: Feed the disc's four input wires up through the lid's wire slot at the top
    (12 o'clock). Keep the wires clear of the ESP32.
  parts:
  - lid
  hardware:
  - perfboard
  tool: null
- n: '5'
  text: Set the lid on the rim. Fix it with six M3x6 socket screws through the counterbored
    holes into the rim inserts.
  parts:
  - lid
  hardware:
  - m3_screw
  tool: hex key
- n: '6'
  text: Lay the disc over the lid with its wires at 12 o'clock and the two holes at
    3 and 9 o'clock. Connect the four wires to the disc connector. Fix the disc with
    two M3x6 socket screws through its holes into the lid inserts. The heads sit on
    the LED face.
  parts:
  - lid
  hardware:
  - disc
  - m3_screw
  tool: hex key
- n: '7'
  text: 'Hang the box: the keyholes are 110 mm apart, 60 mm above the box centre.
    Put the big end of each keyhole over a wall screw head, then slide the box down
    so each shank sits in the narrow slot. The screws must be spaced 110 mm apart;
    if they are not, tell me before drilling.'
  parts:
  - shell
  hardware: []
  tool: null
- n: '8'
  text: Plug a USB-C charger into the ESP32 through the slot at the bottom of the
    shell.
  parts:
  - shell
  hardware:
  - esp32
  tool: null
