parts:
- id: shell
  role: final
  material: matte white PLA
  code: "def build(p):\n    import math\n    R = p.box_od/2.0\n    ri = R - p.wall\n\
    \    body = cq.Workplane('XY').circle(R).extrude(p.back_t)\n    body = body.union(cq.Workplane('XY').circle(R).circle(ri).extrude(p.rim_h))\n\
    \    dx = p.pb_hole_sx/2.0; dy = p.pb_hole_sy/2.0; cy = p.pb_cy\n    pts = [(dx,\
    \ cy+dy), (-dx, cy+dy), (dx, cy-dy), (-dx, cy-dy)]\n    for (x, y) in pts:\n \
    \       s = cq.Workplane('XY').workplane(offset=p.back_t).center(x, y).circle(p.standoff_od/2.0).extrude(p.pb_standoff_h)\n\
    \        body = body.union(s)\n    rp = [(p.rim_r_ins*math.cos(math.radians(a)),\
    \ p.rim_r_ins*math.sin(math.radians(a))) for a in (0, 60, 120, 180, 240, 300)]\n\
    \    boss = cq.Workplane('XY').workplane(offset=p.rim_h-6).pushPoints(rp).circle(p.insert_boss_d/2.0).extrude(6)\n\
    \    body = body.union(boss)\n    pil = cq.Workplane('XY').workplane(offset=p.back_t+0.5).pushPoints(pts).circle(p.m2_pilot_d/2.0).extrude(p.pb_standoff_h+2)\n\
    \    body = body.cut(pil)\n    for x in (-p.kh_x, p.kh_x):\n        hole = cq.Workplane('XY').workplane(offset=-1).center(x,\
    \ p.kh_y).circle(p.kh_d/2.0).extrude(p.back_t+2)\n        slot = cq.Workplane('XY').workplane(offset=-1).center(x,\
    \ p.kh_y - p.kh_slot_len/2.0).rect(p.kh_slot_w, p.kh_slot_len).extrude(p.back_t+2)\n\
    \        body = body.cut(hole).cut(slot)\n    ins = cq.Workplane('XY').workplane(offset=p.rim_h-4).pushPoints(rp).circle(p.insert_hole_d/2.0).extrude(5)\n\
    \    body = body.cut(ins)\n    port = cq.Workplane('XY').box(p.port_slot_w, 12,\
    \ p.port_slot_h).translate((0, -117.5, p.port_slot_z))\n    body = body.cut(port)\n\
    \    return body"
  print_orientation: back plate on the bed, rim opening up
  use_orientation: back plate flat against the wall, rim toward the viewer
- id: lid
  role: final
  material: matte white PLA
  code: "def build(p):\n    import math\n    R = p.box_od/2.0\n    lid = cq.Workplane('XY').circle(R).extrude(p.lid_t)\n\
    \    rp = [(p.rim_r_ins*math.cos(math.radians(a)), p.rim_r_ins*math.sin(math.radians(a)))\
    \ for a in (0, 60, 120, 180, 240, 300)]\n    dpts = [(p.disc_hole_x, 0), (-p.disc_hole_x,\
    \ 0)]\n    cb = cq.Workplane('XY').workplane(offset=p.lid_t-p.cb_depth).pushPoints(rp).circle(p.cb_d/2.0).extrude(p.cb_depth+1)\n\
    \    th = cq.Workplane('XY').workplane(offset=-1).pushPoints(rp).circle(p.clear_d/2.0).extrude(p.lid_t+2)\n\
    \    dh = cq.Workplane('XY').workplane(offset=-1).pushPoints(dpts).circle(p.insert_hole_d/2.0).extrude(p.lid_t+2)\n\
    \    ws = cq.Workplane('XY').workplane(offset=-1).center(0, p.wire_slot_y).rect(p.wire_slot_w,\
    \ p.wire_slot_h).extrude(p.lid_t+2)\n    return lid.cut(cb).cut(th).cut(dh).cut(ws)"
  print_orientation: inner face (shell side) on the bed
  use_orientation: on top of the rim, disc side up
