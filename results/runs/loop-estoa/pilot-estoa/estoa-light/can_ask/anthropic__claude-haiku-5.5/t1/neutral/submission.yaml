task: estoa-light
note: ''
questions:
- text: 'Which way does the ESP32 USB port sit off the centreline: toward +y (up when
    the box hangs) or -y? I assumed +y.'
  answer: null
- text: What is the perfboard thickness, and how tall is the tallest component on
    it? I assumed 1.6 mm and that everything fits under the 16 mm ESP32 height.
  answer: null
- text: 'Please measure the USB-C wall charger: body length, width and thickness.
    I need to confirm the wall opening and that the charger body clears the wall.'
  answer: null
- text: The ESP32 (63.17 mm) plus 7.53 mm to the perfboard edge is 70.7 mm, slightly
    over the 70 mm perfboard. Can you check whether the ESP32 overhangs the perfboard
    end?
  answer: null
- text: Is 100 mm between the wall screws with keyholes 80 mm above centre fine, and
    are the screws in studs or the 1/4 inch anchors?
  answer: null
