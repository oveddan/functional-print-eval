manual:
- n: '1'
  text: Print the box with the back plate flat on the bed, walls up. No supports are
    needed.
  parts:
  - box
  hardware: []
  tool: null
- n: '2'
  text: Heat-set the two M3x4x5 inserts into the pockets at the tops of the two bosses,
    flush with the boss tops. Use a soldering iron with a heat-set tip.
  parts:
  - box
  hardware:
  - insert
  tool: soldering iron with heat-set tip
- n: '3'
  text: Fit the ESP32 onto the perfboard headers, USB-C port toward the nearest long-edge
    corner. Set the perfboard on the four standoffs and drive the M2x6 self-tapping
    screws into the standoffs through the corner holes.
  parts:
  - box
  hardware:
  - perfboard
  - esp32
  - standoff_screw
  tool: null
- n: '4'
  text: Route the four wires from the perfboard to the disc input connector at the
    12 o'clock edge of the disc.
  parts:
  - box
  hardware:
  - perfboard
  - disc
  tool: null
- n: '5'
  text: 'Hang the box on the wall using the two keyhole slots (100 mm apart) over
    the heads of the #8 wall screws.'
  parts:
  - box
  hardware: []
  tool: null
- n: '6'
  text: Set the disc onto the top rim and the two bosses with its holes over the inserts.
    Fasten with the two M3x6 screws from the LED side.
  parts:
  - box
  hardware:
  - disc
  - disc_screw
  tool: 2.5 mm hex key
- n: '7'
  text: Plug the USB-C charger into the ESP32 port through the wall opening on the
    +x side of the box.
  parts:
  - box
  hardware:
  - esp32
  tool: null
