parts:
- id: box
  role: final
  material: PLA matte white
  code: "import cadquery as cq\n\ndef build(p):\n    R = p.box_od / 2.0\n    ri =\
    \ R - p.wall_t\n    H = p.box_h\n    t = p.plate_t\n    P = p.standoff_h\n   \
    \ hx = p.disc_hole_spacing / 2.0\n\n    body = cq.Workplane('XY').circle(R).extrude(t)\n\
    \    ring = cq.Workplane('XY').circle(R).circle(ri).extrude(H)\n    body = body.union(ring)\n\
    \    for sx in (-1, 1):\n        boss = cq.Workplane('XY').center(sx * hx, 0).circle(p.boss_d\
    \ / 2.0).extrude(H)\n        body = body.union(boss)\n\n    x0 = p.pb_cx - p.pb_l\
    \ / 2.0\n    x1 = p.pb_cx + p.pb_l / 2.0\n    e = p.pb_hole_edge + p.pb_hole_d\
    \ / 2.0\n    yc = p.pb_w / 2.0 - e\n    corners = [(x0 + e, yc), (x0 + e, -yc),\
    \ (x1 - e, yc), (x1 - e, -yc)]\n    pillars = cq.Workplane('XY').workplane(offset=t).pushPoints(corners).circle(p.standoff_d\
    \ / 2.0).extrude(P - t)\n    body = body.union(pillars)\n    pilots = cq.Workplane('XY').workplane(offset=P\
    \ - 4.0).pushPoints(corners).circle(p.pilot_d / 2.0).extrude(5.0)\n    body =\
    \ body.cut(pilots)\n\n    ins_pts = [(-hx, 0), (hx, 0)]\n    pockets = cq.Workplane('XY').workplane(offset=H\
    \ - p.insert_len - 0.5).pushPoints(ins_pts).circle(p.insert_hole_d / 2.0).extrude(p.insert_len\
    \ + 1.5)\n    body = body.cut(pockets)\n\n    kh_pts = [(-p.kh_spacing / 2.0,\
    \ p.kh_y), (p.kh_spacing / 2.0, p.kh_y)]\n    recess = cq.Workplane('XY').pushPoints(kh_pts).circle(p.recess_d\
    \ / 2.0).extrude(p.recess_depth)\n    body = body.cut(recess)\n    cut_pts = []\n\
    \    for (x, y) in kh_pts:\n        cut_pts += [(x, y), (x, y - p.kh_slot_len)]\n\
    \    slot_round = cq.Workplane('XY').workplane(offset=-1).pushPoints(cut_pts).circle(p.kh_slot\
    \ / 2.0).extrude(t + 2)\n    slot_box = cq.Workplane('XY').workplane(offset=-1).pushPoints([(x,\
    \ y - p.kh_slot_len / 2.0) for (x, y) in kh_pts]).rect(p.kh_slot, p.kh_slot_len).extrude(t\
    \ + 2)\n    body = body.cut(slot_round).cut(slot_box)\n\n    z_port = (P + p.pb_t)\
    \ + p.usb_bottom + p.usb_h / 2.0\n    cutter = cq.Workplane('XY').box(15, p.opening_w,\
    \ p.opening_h).translate((p.usb_wall_x, p.usb_y, z_port))\n    body = body.cut(cutter)\n\
    \    return body\n"
  print_orientation: back plate flat on the bed (z=0 on bed), walls up
  use_orientation: z=0 against the wall, +z out of the wall, box hung as it sits
