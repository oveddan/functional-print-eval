task: estoa-light
note: 'REVISED FINAL DESIGN: rear box plus adjustable electronics carrier. The original
  fixed perfboard mounts are removed. Carrier slides radially and rotates so the actual
  USB socket can be placed near a side window before clamping. Exact USB geometry
  remains unknown, so final positioning and access verification are mandatory. Front
  diffuser and future outer sides are not included; preserve ventilation and USB access
  when adding them. Matte white PLA requested; black is the only confirmed available
  stock. Existing wall screws/anchors are external fixtures, not supplied design hardware.
  Assembly depicts a provisional carrier setting; actual USB frame is not measured.'
questions:
- text: Disk geometry?
  answer: 3.3 mm holes; 30.2 mm inner-edge gap gives 33.5 mm pitch, symmetric left/right.
    Opposite outer-hole-edge to board-edge measurements 102.54 and 102.24 mm imply
    approximately 241.58 mm diameter if measured along the hole diameter. Thickness
    and backside projections unknown.
- text: Perfboard geometry?
  answer: 50 x 70 mm, 2.4 mm corner holes, nearest hole edge 0.9 mm from board edge.
    Derived centre rectangle 45.8 x 65.8 mm assumes symmetric corner holes. Board
    thickness and solder projection unknown.
- text: USB geometry?
  answer: ESP32 63.17 x 28.25 mm; maximum height about 16 mm above perfboard and underside
    11.05 mm above it. Reported 4.80 and 7.53 mm edge distances do not locate the
    port reliably. Sliding/rotating carrier replaces a guessed fixed location.
- text: Wall mounting?
  answer: 'User reports #8 round-head screws with heads at most 9 mm, in 1/4-inch
    anchors. Place 130 mm apart, level. Adjust underside-head gap near 3.5 mm for
    the 3 mm backplate; verify anchors suit actual wall.'
