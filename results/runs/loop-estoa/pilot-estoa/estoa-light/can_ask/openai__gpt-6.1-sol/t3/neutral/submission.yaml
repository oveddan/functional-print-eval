parts:
- id: rear_box
  role: final
  material: PLA; matte white requested, black only confirmed stock
  code: "def build(p):\n    import math\n    e = p.geometry_overcut\n    r = p.box_d/2\n\
    \    s = cq.Workplane('XY').circle(r).extrude(p.base_t)\n    wall = cq.Workplane('XY').workplane(offset=p.base_t).circle(r).circle(r-p.wall_t).extrude(p.box_h-p.base_t)\n\
    \    for i in range(int(p.window_count)):\n        cut = cq.Workplane('XY').box(p.window_radial_depth,p.window_w,p.window_top-p.window_bottom,centered=(True,True,False)).translate((r-p.wall_t/2,0,p.window_bottom))\n\
    \        cut = cut.rotate((0,0,0),(0,0,1),i*360/p.window_count)\n        wall\
    \ = wall.cut(cut)\n    s = s.union(wall)\n    for x in (-p.disk_pitch/2,p.disk_pitch/2):\n\
    \        foot = cq.Workplane('XY').workplane(offset=p.base_t).center(x,0).circle(p.disk_boss_foot_d/2).extrude(p.boss_foot_h)\n\
    \        post = cq.Workplane('XY').workplane(offset=p.base_t).center(x,0).circle(p.disk_boss_d/2).extrude(p.box_h-p.base_t)\n\
    \        s = s.union(foot).union(post)\n        bore = cq.Workplane('XY').workplane(offset=p.base_t).center(x,0).circle(p.m3_bore/2).extrude(p.box_h-p.base_t+e)\n\
    \        pocket = cq.Workplane('XY').workplane(offset=p.box_h-p.m3_nut_h-p.nut_depth_allowance).center(x,0).polygon(6,(p.m3_nut_af+p.nut_af_allowance)/math.cos(math.pi/6)).extrude(p.m3_nut_h+p.nut_depth_allowance+e)\n\
    \        s = s.cut(bore).cut(pocket)\n    cy = (p.track_near_y+p.track_far_y)/2\n\
    \    travel = p.track_near_y-p.track_far_y\n    pad = cq.Workplane('XY').workplane(offset=p.base_t).center(0,cy).rect(p.track_pad_w,p.track_pad_l).extrude(p.track_pad_top-p.base_t)\n\
    \    s = s.union(pad)\n    shaft = cq.Workplane('XY').workplane(offset=-e).center(0,cy).slot2D(travel+p.m3_bore,p.m3_bore,90).extrude(p.track_pad_top+2*e)\n\
    \    channel = cq.Workplane('XY').workplane(offset=-e).center(0,cy).rect(p.m3_nut_af+p.nut_af_allowance,travel+2*(p.m3_nut_af+p.nut_af_allowance)/math.sqrt(3)).extrude(p.m3_nut_h+p.nut_depth_allowance+e)\n\
    \    s = s.cut(shaft).cut(channel)\n    for x in (-p.key_pitch/2,p.key_pitch/2):\n\
    \        y = p.key_entry_y\n        entry = cq.Workplane('XY').workplane(offset=-e).center(x,y).circle(p.key_entry_d/2).extrude(p.base_t+2*e)\n\
    \        neck = cq.Workplane('XY').workplane(offset=-e).center(x,y+p.key_travel/2).rect(p.key_slot_w,p.key_travel).extrude(p.base_t+2*e)\n\
    \        end = cq.Workplane('XY').workplane(offset=-e).center(x,y+p.key_travel).circle(p.key_slot_w/2).extrude(p.base_t+2*e)\n\
    \        s = s.cut(entry).cut(neck).cut(end)\n    return s"
  print_orientation: Flat outside back on bed, z=0. Open front upward. No supports.
    Window roofs bridge approximately 38 mm; underside nut channel is 5.8 mm wide.
  use_orientation: Back against wall, +y up and +z toward viewer. Adjustable carrier
    track below centre.
- id: electronics_carrier
  role: final
  material: Same PLA as rear_box
  code: "def build(p):\n    e = p.geometry_overcut\n    hx = p.board_w/2-p.board_hole_edge_gap-p.board_hole_d/2\n\
    \    hy = p.board_l/2-p.board_hole_edge_gap-p.board_hole_d/2\n    s = cq.Workplane('XY').rect(2*hx,2*hy).extrude(p.carrier_t)\n\
    \    for x in (-hx,hx):\n        for y in (-hy,hy):\n            post = cq.Workplane('XY').center(x,y).circle(p.board_post_d/2).extrude(p.carrier_t+p.carrier_post_h)\n\
    \            pilot = cq.Workplane('XY').workplane(offset=p.carrier_t+p.carrier_post_h-p.board_pilot_depth).center(x,y).circle(p.board_pilot_d/2).extrude(p.board_pilot_depth+e)\n\
    \            s = s.union(post).cut(pilot)\n    centre = cq.Workplane('XY').workplane(offset=-e).circle(p.m3_bore/2).extrude(p.carrier_t+2*e)\n\
    \    return s.cut(centre)"
  print_orientation: Broad flat underside on bed at z=0, four posts upward. No supports.
  use_orientation: Underside rests on rear_box track pad at global z=6. Nominal centre
    (0,-74,6), local +y up. Slide and rotate before clamping so USB faces a nearby
    window.
- id: fit_coupon
  role: coupon
  material: Same PLA and settings as final parts
  code: "def build(p):\n    import math\n    e = p.geometry_overcut\n    s = cq.Workplane('XY').box(p.coupon_w,p.coupon_l,p.coupon_base,centered=(True,True,False))\n\
    \    for x in (-p.disk_pitch/2,p.disk_pitch/2):\n        post = cq.Workplane('XY').workplane(offset=p.coupon_base).center(x,p.coupon_disk_y).circle(p.disk_boss_d/2).extrude(p.coupon_boss_top-p.coupon_base)\n\
    \        bore = cq.Workplane('XY').workplane(offset=p.coupon_base).center(x,p.coupon_disk_y).circle(p.m3_bore/2).extrude(p.coupon_boss_top-p.coupon_base+e)\n\
    \        pocket = cq.Workplane('XY').workplane(offset=p.coupon_boss_top-p.m3_nut_h-p.nut_depth_allowance).center(x,p.coupon_disk_y).polygon(6,(p.m3_nut_af+p.nut_af_allowance)/math.cos(math.pi/6)).extrude(p.m3_nut_h+p.nut_depth_allowance+e)\n\
    \        s = s.union(post).cut(bore).cut(pocket)\n    top = p.coupon_base+p.carrier_post_h\n\
    \    for i in range(3):\n        x = (i-1)*p.coupon_pilot_step\n        post =\
    \ cq.Workplane('XY').workplane(offset=p.coupon_base).center(x,p.coupon_pilot_y).circle(p.board_post_d/2).extrude(p.carrier_post_h)\n\
    \        pilot = cq.Workplane('XY').workplane(offset=top-p.board_pilot_depth).center(x,p.coupon_pilot_y).circle((p.board_pilot_d+i*p.coupon_pilot_increment)/2).extrude(p.board_pilot_depth+e)\n\
    \        s = s.union(post).cut(pilot)\n    return s"
  print_orientation: Flat rectangular base on bed; bosses upward. No supports.
  use_orientation: Test only. Disk boss pair at y=8. Pilot row at y=-14.
