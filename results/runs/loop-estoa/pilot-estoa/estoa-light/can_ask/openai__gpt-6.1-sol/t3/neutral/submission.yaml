manual:
- n: '1'
  text: 'Print fit_coupon first: intended PLA, 0.2 mm layers, 0.4 mm nozzle, four
    walls, five top/bottom layers, 20% infill, no supports. Matte white PLA must be
    available separately if using the requested colour.'
  parts:
  - fit_coupon
  hardware: []
  tool: Bambu X1C
- n: '2'
  text: Unplug electronics. Put M3 nuts in the coupon's paired hex pockets; lay disk
    on bosses and test both M3x8 screws. Check hole alignment, safe head contact and
    full nut engagement. Finger-snug only; unknown disk thickness makes this check
    mandatory. Recover disk, nuts and screws.
  parts:
  - fit_coupon
  hardware:
  - disk
  - disk_screws
  - disk_nuts
  tool: 2.5 mm hex key
- n: '3'
  text: Test M2x6 screw in pilot row, left-to-right 1.6, 1.8, 2.0 mm. Use smallest
    that grips without splitting; update board_pilot_d before generating final parts
    if needed. Verify actual board corner-hole centres form a 45.8 x 65.8 mm rectangle
    and screw heads safely span holes.
  parts:
  - fit_coupon
  hardware:
  - perfboard
  - board_screws
  tool: Hand screwdriver and ruler/calipers
- n: '4'
  text: Print rear_box flat back down and electronics_carrier flat underside down,
    both without supports, using tested settings. Window roofs bridge about 38 mm.
    Clean strings from bores, keyholes, nut pockets and the rear nut channel. Verify
    actual disk covers the 238 mm footprint.
  parts:
  - rear_box
  - electronics_carrier
  hardware:
  - disk
  tool: Bambu X1C
- n: '5'
  text: Before installing perfboard, put carrier on the raised track pad inside box.
    From rear, insert carrier_nut into the straight channel with its two opposite
    flats against channel sidewalls. Pass M3x10 down through carrier centre and track
    slot into nut. Start loosely so carrier slides/rotates. Nut must seat below rear
    plane and screw tip must not protrude behind box. No washer in this joint.
  parts:
  - rear_box
  - electronics_carrier
  hardware:
  - carrier_screw
  - carrier_nut
  tool: 2.5 mm hex key
- n: '6'
  text: Temporarily place assembled perfboard/ESP32 on carrier posts. Keep power disconnected.
    Rotate carrier so USB socket faces a side window; slide toward that window without
    letting board, carrier or components touch the wall or disk towers. Slot positions
    cannot all be used at every angle. Nominal carrier centre is y=-74, but actual
    setting depends on your socket orientation.
  parts:
  - rear_box
  - electronics_carrier
  hardware:
  - perfboard
  - esp32
  tool: null
- n: '7'
  text: 'Using the actual USB plug from outside, establish a setting allowing easy
    insertion and removal. Lift perfboard off without shifting carrier, snug carrier
    clamp, then replace board and recheck. Clamp only enough to prevent sliding or
    rotation; do not crush PLA. Ensure solder clears carrier and clamp head: 7 mm
    gap above carrier, only 4 mm above clamp head. Aim for at least 2 mm spare. If
    no setting passes all checks, stop and revise rather than force a connector or
    board.'
  parts:
  - rear_box
  - electronics_carrier
  hardware:
  - perfboard
  - esp32
  - carrier_screw
  tool: 2.5 mm hex key
- n: '8'
  text: Fasten perfboard with four M2x6 self-tapping screws by hand, just seated.
    Confirm at least 3 mm engagement without bottoming, splitting posts or crushing
    board. Route four disk wires clear of screws, posts and USB connector, with service
    slack. Check carrier cannot move under normal plugging force.
  parts:
  - electronics_carrier
  - rear_box
  hardware:
  - perfboard
  - board_screws
  - esp32
  tool: Hand screwdriver
- n: '9'
  text: Put one M3 nut in each disk boss pocket. Align disk with input wires upward
    and mounting holes left/right. Confirm all rear disk features and wires clear
    electronics; estimated electronics top is z=34.6, leaving only 13.4 mm to disk
    back where overlapping. Disk must rest without rocking on rim and bosses. Fasten
    with two M3x8 screws finger-snug. Recheck USB insertion/removal from outside with
    disk closed.
  parts:
  - rear_box
  - electronics_carrier
  hardware:
  - disk
  - disk_nuts
  - disk_screws
  tool: 2.5 mm hex key
- n: '10'
  text: 'Install user''s existing #8 round-head wall screws and appropriate anchors
    as external fixtures, level and 130 mm centre-to-centre. Follow actual anchor
    instructions for wall type, drill size and embedment. Set underside of heads about
    3.5 mm from wall, then adjust for snug fit. Actual heads must pass 10 mm entries
    but not 5 mm throats. Check carrier nut/screw remain recessed or flush at back.'
  parts:
  - rear_box
  hardware: []
  tool: Level, drill and suitable screwdriver
- n: '11'
  text: Disconnect USB. Offer large keyhole entries over both wall screw heads and
    lower entire light 10 mm into narrow upper ends. Seated fixture axes are approximately
    (-65,60) and (65,60) in box XY; heads lie near z=3.5 and screws point toward wall
    (-z). Support and gently test retention. These are lift-off slots, not locks;
    cable slack must prevent upward pull.
  parts:
  - rear_box
  hardware: []
  tool: null
- n: '12'
  text: Reconnect low-voltage USB through selected window and start at low brightness.
    Verify supply, wires, terminals and power path support programmed LED load; do
    not assume ESP32 USB can supply unrestricted full-white current for 255 LEDs.
    Run a supervised temperature test before extended use. Keep ventilation open.
    Future transparent front/sides must preserve USB access and sufficient ventilation;
    they are not part of this submission.
  parts:
  - rear_box
  - electronics_carrier
  hardware:
  - disk
  - perfboard
  - esp32
  tool: null
