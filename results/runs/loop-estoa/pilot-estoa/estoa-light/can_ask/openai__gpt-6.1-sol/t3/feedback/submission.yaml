manual:
- n: '1'
  text: Revision 2 must be printed BACK DOWN, open front UP. First print roof_coupon
    upright on its wide foot, no supports. Use 0.2 mm layers, 0.4 mm nozzle, four
    walls, five top/bottom layers, 20% infill, and the PLA profile appropriate to
    your filament. Confirm pointed roof prints cleanly; do not print another full
    box if it tangles.
  parts:
  - roof_coupon
  hardware: []
  tool: Bambu X1C
- n: '2'
  text: Print revised rear_box in the stated orientation without supports. It is 238
    mm diameter and 80 mm tall. Inspect pointed roofs, upward-open nut pockets and
    keyholes. Remove loose strings. Do not reuse a partly closed or deformed opening
    as-is.
  parts:
  - rear_box
  hardware: []
  tool: Bambu X1C
- n: '3'
  text: With all power disconnected, put perfboard on its four posts below centre,
    long direction up/down. Verify all four holes align freely, posts do not hit components,
    and solder clears the back by at least 2 mm. ESP32 remains in its existing headers.
    Do not press the board down onto an obstruction.
  parts:
  - rear_box
  hardware:
  - perfboard
  - esp32
  tool: null
- n: '4'
  text: Dry-fit the disk at the 80 mm front rim BEFORE fastening anything. Find and
    inspect the closest component/wire. All rear disk features, wires and ESP32 must
    remain clear, preferably by at least 3 mm. The previous failure was not dimensioned,
    so do not assume added depth guarantees fit. If it still cannot close, stop and
    measure the specific interference rather than forcing it.
  parts:
  - rear_box
  hardware:
  - disk
  - perfboard
  - esp32
  tool: null
- n: '5'
  text: Check USB insertion and removal from outside through a window. If necessary
    rotate complete perfboard 180 degrees on the same posts; repeat all fit checks.
    ESP32 location in assembly is illustrative, not measured. If port remains blocked,
    stop and establish its exact location before modifying or reprinting.
  parts:
  - rear_box
  hardware:
  - perfboard
  - esp32
  tool: null
- n: '6'
  text: Install four M2x6 self-tapping screws by hand only. Verify heads safely span
    board holes and screws engage at least 3 mm without bottoming, splitting posts
    or stripping. Stop when just seated. Route four disk wires with slack, clear of
    mounting posts and USB port.
  parts:
  - rear_box
  hardware:
  - board_screws
  - perfboard
  tool: Hand screwdriver
- n: '7'
  text: Place M3 nuts in the two upward-open boss pockets. Place disk with input wires
    toward top and mounting holes left/right. It must sit flat on rim and bosses without
    pressure. Fit M3x8 screws, checking full nut engagement despite unknown disk thickness.
    Tighten only lightly; heads must not contact LEDs or unsafe copper. Recheck external
    USB access after closure.
  parts:
  - rear_box
  hardware:
  - disk
  - disk_nuts
  - disk_screws
  tool: 2.5 mm hex key
- n: '8'
  text: 'Use user''s existing external #8 wall screws with appropriate anchors, level
    at 130 mm centres. Follow anchor instructions for actual wall. Adjust head undersides
    near 3.5 mm from wall. Verify heads pass large keyhole entries but not narrow
    throats. Because revised box is deeper, check anchor capacity and security carefully.'
  parts:
  - rear_box
  hardware: []
  tool: Level and suitable screwdriver; drill only if new anchors are needed
- n: '9'
  text: 'Disconnect USB, offer keyhole entries over both heads, and lower box 10 mm
    to seat. External screw axes when seated are approximately (-65,60,3.5) and (65,60,3.5),
    head undersides in box frame, pointing toward wall along -z. Adjust for snug,
    flat fit. Support light while gently testing retention. Keep cable slack: these
    are lift-off slots, not locks.'
  parts:
  - rear_box
  hardware: []
  tool: null
- n: '10'
  text: Reconnect low-voltage USB and test initially at low brightness. Verify power
    supply, wiring, terminals and current path suit programmed maximum LED load; do
    not assume ESP32 USB supports unrestricted full-white current for 255 LEDs. Supervise
    initial thermal test. Keep ventilation open and preserve USB access in later outer
    sides. No mains wiring belongs inside this PLA box.
  parts:
  - rear_box
  hardware:
  - disk
  - perfboard
  - esp32
  tool: null
