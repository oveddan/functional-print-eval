task: estoa-light
note: 'Revision 2: replaces all flat side-window roofs with self-supporting 45-degree
  pointed arches and increases disk seating height from 48 to 80 mm. The returned
  measurements did not identify the tangled opening or establish the closing obstruction''s
  height. These changes address likely bridging and height problems, but do not establish
  an exact USB fit. Print roof_coupon first. Rear box only, no diffuser or future
  outer skin. Existing wall screws are external fixtures. ESP32 frame and board-thickness-dependent
  screw elevations remain illustrative. Matte white PLA requested; only black stock
  was confirmed.'
questions:
- text: What failed in revision 1?
  answer: User reports loose loops/tangles around an opening, partially closing it,
    and enclosure would not close around ESP32. Exact opening and interference location/height
    were not identified in follow-up.
- text: What changed?
  answer: Depth 48 to 80 mm; side openings now have 45-degree pointed roofs instead
    of 38 mm flat bridges. Lower full-width window section extends from z=6 to z=50;
    peak z=69.
- text: What remains unmeasured?
  answer: Disk thickness/rear features, solder projection, exact port frame and connector
    envelope, and actual maximum assembled electronics height. Mandatory dry-fit checks
    remain.
