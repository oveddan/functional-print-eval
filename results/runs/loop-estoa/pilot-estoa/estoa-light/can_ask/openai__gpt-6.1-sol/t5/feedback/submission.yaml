criteria:
- id: revised_hanger_fit
  part: box_v2
  feature: Recessed head races behind narrow keyhole webs
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - wall_head_d_max
  - wall_head_h
  - wall_shank_d
  - head_relief_w
  - head_relief_depth
  - hanger_web_t
  - keyhole_entry_d
  - keyhole_neck_w
  - wall_head_under_z
  check:
    method: coupon
    ref: hanger_coupon_v2
    description: 'Mandatory before box print: head enters 12.5 mm opening, slides
      freely inside 15 mm race, and cannot pull through 5.6 mm neck. Adjust screw
      underside to about 4.5 mm from wall. Coupon must rest flat and slide down 14
      mm without head binding. If actual head height exceeds recess, it may protrude
      into open interior; check unobstructed engagement. Do not enlarge narrow slot
      until head can pull through.'
- id: revised_closure
  part: box_v2
  feature: Larger and deeper electronics chamber
  relation: clears
  hardware: perfboard
  clearance_mm: null
  params:
  - box_d
  - box_depth
  - carrier_y
  - pivot_top
  - standoff_h
  - perf_t
  - loaded_board_max_height
  - disk_rear_projection
  - wire_length
  check:
    method: template
    ref: carrier
    description: 'Use loaded carrier and a paper 244 mm circle. Carrier centre is
      (0,-58), underside z=16, perfboard underside z=31. Hold disk back at z=100.
      Verify actual terminals, capacitor, ESP32, wires and disk rear features have
      at least 2 mm separation and no sidewall collision. Nominal perfboard top is
      32.6: there is 67.4 mm to disk back. Actual failure location remains unknown;
      do not assume increased depth fixes an unrelated interference.'
- id: revised_supports
  part: box_v2
  feature: 20 mm central post tops and outer support rim
  relation: supports
  hardware: led_disk
  clearance_mm: null
  params:
  - mount_post_d
  - disk_hole_pitch
  - disk_d
  - box_d
  - wall_t
  - disk_t
  check:
    method: coupon
    ref: led_mount_coupon_v2
    description: Check widened post tops touch only bare safe rear PCB lands; no solder
      or connector can be compressed. Rim inner radius is 119 mm; inferred disk radius
      120.79 mm gives 1.79 mm support overlap. Box rim projects slightly beyond disk.
      Verify actual edge overlap around all remaining rim, both screw heads and flat
      seating.
