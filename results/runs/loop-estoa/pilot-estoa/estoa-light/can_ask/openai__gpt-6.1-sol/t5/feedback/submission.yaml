manual:
- n: '1'
  text: Disconnect power and dismantle the failed box. Reuse undamaged electronics,
    nuts, screws, washer and carrier. This revision intentionally changes the box,
    not the supplied measurements. Print hanger_coupon_v2 first; the old wall coupon
    does not represent the new recessed hanger.
  parts:
  - hanger_coupon_v2
  hardware:
  - led_disk
  - perfboard
  - esp32
  tool: 3D printer and hand tools
- n: '2'
  text: 'Test revised hanger coupon on an actual external #8 wall screw. Head goes
    through the larger round entry, then coupon slides DOWN 14 mm so shank reaches
    upper neck end and head sits in wide inside recess. Set head UNDERSIDE approximately
    4.5 mm from wall—not 10.5 mm despite thicker back. Adjust until coupon rests flat,
    moves without binding and cannot pull straight off. Do not print big box unless
    this succeeds. Check anchor/screw suitability for the wall using their packaging.'
  parts:
  - hanger_coupon_v2
  hardware: []
  tool: Ruler and screwdriver
- n: '3'
  text: 'Reuse carrier if sound. Before printing box, reproduce revised envelope on
    paper: outer circle 244 mm, inner wall circle 238 mm; carrier centre 58 mm below
    circle centre. Hold carrier underside 16 mm off simulated wall and disk BACK 100
    mm off wall. With populated perfboard mounted, identify what interfered previously
    and verify it now has at least 2 mm clearance. Include capacitor, terminals, solder,
    wires and disk rear connector. Rotate actual USB toward bottom bay and insert/remove
    the actual plug. Stop if any collision remains; unmeasured geometry must not be
    forced closed.'
  parts:
  - carrier
  hardware:
  - perfboard
  - esp32
  - led_disk
  tool: Paper, ruler and actual USB cable
- n: '4'
  text: Print led_mount_coupon_v2 to check the widened 20 mm pillar footprints and
    existing M3 hardware. Confirm bare rear support lands, hole spacing, safe screw-head
    lands and full nut engagement. If a post contacts solder or a component, do not
    print the box unchanged. If carrier needs replacement, retain the pilot diameter
    already proven by your first print; otherwise test pilot_coupon before printing
    carrier.
  parts:
  - led_mount_coupon_v2
  - pilot_coupon
  - carrier
  hardware:
  - led_screws
  - led_nuts
  - pcb_screws
  - led_disk
  tool: 2.5 mm hex key and hand screwdriver
- n: '5'
  text: 'Print box_v2 flat wall-back down, centred on bed. Use 0.2 mm layers, 5 walls,
    6 top/bottom layers and 30% infill. No supports in nut channels or upward-open
    head recesses. At 244 mm diameter only 6 mm remains to each X1C bed edge: use
    no brim or at most 4 mm brim and inspect slicer placement. All parts stay within
    256 mm height. Inspect tall posts and back for cracks or warping.'
  parts:
  - box_v2
  hardware: []
  tool: 3D printer
- n: '6'
  text: Slide pivot nut into low boss from +y, flats against straight channel walls.
    Seat carrier on boss at z=16, fit M3 washer and M3x10 pivot screw loosely. Fit
    perfboard with four M2x6 screws using light hand torque. Aim real USB port into
    bottom bay, then snug pivot. Confirm solder clears pivot head by at least 2 mm.
    The assembly lists nominal, estimated ESP32 coordinates; actual carrier rotation
    can differ.
  parts:
  - box_v2
  - carrier
  hardware:
  - pivot_nut
  - pivot_washer
  - pivot_screw
  - pcb_screws
  - perfboard
  - esp32
  tool: 2.5 mm hex key and hand screwdriver
- n: '7'
  text: 'Dry-fit disk before hanging: route four wires clear of rim/posts, slide LED
    nuts fully into tall pillar channels from +y, place disk with input wires toward
    +y. It must rest flat under its own weight without compressing electronics or
    wires. Verify edge support on the 119 mm inner-radius rim. Do not use screws to
    draw a nonclosing box shut. Remove disk temporarily for wall fitting.'
  parts:
  - box_v2
  - carrier
  hardware:
  - led_nuts
  - led_disk
  - perfboard
  tool: Ruler
- n: '8'
  text: 'The user''s wall screws and anchors remain external fixings. Screw centres
    stay level and 120 mm apart, corresponding to box x=±60, y=64. Reuse existing
    anchors only if secure and appropriate for wall, otherwise follow anchor packaging;
    avoid hidden pipes/wiring. Apply coupon-proven head stand-off. Test empty box:
    pass heads through entry holes, then slide box downward 14 mm. Both heads must
    move into recessed races and fully capture behind webs, with back flat against
    wall. This is a lift-off hanger, not childproof or impact-resistant.'
  parts:
  - box_v2
  - hanger_coupon_v2
  hardware: []
  tool: Level and screwdriver; suitable drill only if new wall holes required
- n: '9'
  text: Lift box off wall. Seat disk flat on verified lands and gently secure with
    two M3x10 screws. Rehang, check both hanger captures and then insert USB through
    bottom opening. The bottom bay deliberately remains open; future transparent front/side
    shell must preserve access and lift-off travel. Do not cover the slightly projecting
    box rim until designing that shell.
  parts:
  - box_v2
  - carrier
  hardware:
  - led_disk
  - led_screws
  - led_nuts
  tool: 2.5 mm hex key
- n: '10'
  text: Use only the existing appropriately rated low-voltage supply and wiring. This
    mechanical revision does not validate power delivery to 255 LEDs. Start dim, check
    heating, keep PLA away from softening temperatures, sunlight and heaters. Do not
    enclose a mains charger. Periodically inspect PLA screw seats, anchors and wall
    capture.
  parts:
  - box_v2
  hardware:
  - esp32
  - led_disk
  tool: null
