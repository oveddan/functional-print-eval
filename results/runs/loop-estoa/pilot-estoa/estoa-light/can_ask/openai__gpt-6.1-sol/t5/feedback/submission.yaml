task: estoa-light
note: 'REVISED after the reported failures. Do not reprint the original box. Changes:
  outside diameter 232→244 mm; disk support height 60→100 mm; electronics carrier
  moved 5 mm downward; tall disk posts increased to 20 mm diameter; back increased
  to 10 mm with dedicated 15 mm wide, 6 mm deep screw-head recesses behind both keyholes;
  keyhole entry increased to 12.5 mm and neck to 5.6 mm. These are conservative design
  changes, NOT newly measured clearances. Actual interference location and component/head
  heights remain unknown. Print the revised hanger coupon and check the electronics
  envelope before the large box. Existing M3 screws/nuts, washer and carrier can be
  reused if undamaged. Nominal ESP32 placement remains provisional. User''s wall screws/anchors
  are external wall fixings.'
questions:
- text: What was changed for the perfboard closure failure?
  answer: Box diameter increased to 244 mm and depth to 100 mm. Carrier centre moved
    to y=-58 mm. Perfboard top is nominally z=32.6 mm, leaving 67.4 mm to disk back,
    versus 33.4 mm previously. This provides much more component and wire clearance,
    but the actual collision was not identified.
- text: What was changed for screw heads behind slots?
  answer: Each keyhole now has a 15 mm wide internal head recess, 6 mm deep, behind
    a 4 mm retaining web. Entry holes are 12.5 mm and necks 5.6 mm. Actual screws
    must pass the revised coupon test.
- text: Did the follow-up establish actual component or screw-head heights?
  answer: No. Only the previous perfboard corner-hole measurements and at-most-9-mm
    head diameter were repeated. Heights remain unverified.
