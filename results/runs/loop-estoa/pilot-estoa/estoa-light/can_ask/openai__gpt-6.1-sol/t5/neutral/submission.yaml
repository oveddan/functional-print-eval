criteria:
- id: disk_mount_fit
  part: led_mount_coupon
  feature: Two nut-backed support posts
  relation: supports
  hardware: led_disk
  clearance_mm: null
  params:
  - disk_hole_pitch
  - disk_hole_d
  - disk_t
  - disk_d
  - disk_rear_envelope
  check:
    method: coupon
    ref: led_mount_coupon
    description: Both screws enter freely. Verify 16 mm post footprints touch only
      safe bare rear lands, and 5.5 mm heads clear LEDs/traces. Verify full nut engagement
      without bowing board. Separately check 232 mm outer/226 mm inner rim footprint
      against disk rear. If any land is obstructed, revise supports before printing
      box.
- id: nut_capture
  part: box
  feature: Side-loaded M3 nut channels and roofs
  relation: contains
  hardware: led_nuts
  clearance_mm: 0.4
  params:
  - nut_m3_af
  - nut_m3_h
  - nut_width_allowance
  - nut_height_allowance
  - nut_roof
  - screw_m3_length
  - disk_t
  check:
    method: coupon
    ref: led_mount_coupon
    description: Nut flats face straight sidewalls; slide to closed end. Tightening
      must clamp without spinning nuts, splitting PLA or bottoming screws. Estimated
      disk screw projects 2.8 mm beyond fully seated nut; check actual board thickness.
- id: selftap_fit
  part: carrier
  feature: Standoff pilots
  relation: engages
  hardware: pcb_screws
  clearance_mm: null
  params:
