parts:
- id: box
  role: final
  material: PLA, black; equivalent matte-white PLA if obtained and fit-tested
  code: "def build(p):\n    import math\n    r = p.box_d/2\n    b = cq.Workplane('XY').circle(r).extrude(p.back_t)\n\
    \    rim = cq.Workplane('XY').workplane(offset=p.back_t).circle(r).circle(r-p.wall_t).extrude(p.box_depth-p.back_t)\n\
    \    b = b.union(rim)\n    # Opening runs through rim top: there is no unsupported\
    \ USB-bay roof.\n    bay = cq.Workplane('XY').box(p.access_w,p.box_d,p.box_depth+2,centered=(True,True,False)).translate((0,p.access_inner_y-p.box_d/2,p.back_t))\n\
    \    b = b.cut(bay)\n    def add_mount(s,x,y,d,top):\n        post = cq.Workplane('XY').workplane(offset=p.back_t).center(x,y).circle(d/2).extrude(top-p.back_t)\n\
    \        s = s.union(post)\n        bore = cq.Workplane('XY').center(x,y).circle(p.m3_clearance/2).extrude(top+1)\n\
    \        h = p.nut_m3_h+p.nut_height_allowance\n        rear = -(p.nut_m3_af/math.sqrt(3)+p.nut_width_allowance/2)\n\
    \        front = d/2+1\n        channel = cq.Workplane('XY').box(p.nut_m3_af+p.nut_width_allowance,front-rear,h,centered=(True,True,False)).translate((x,y+(front+rear)/2,top-p.nut_roof-h))\n\
    \        return s.cut(bore).cut(channel)\n    for x in (-p.disk_hole_pitch/2,p.disk_hole_pitch/2):\n\
    \        b = add_mount(b,x,0,p.mount_post_d,p.box_depth)\n    b = add_mount(b,0,p.carrier_y,p.pivot_post_d,p.pivot_top)\n\
    \    for x in (-p.wall_mount_pitch/2,p.wall_mount_pitch/2):\n        entry = cq.Workplane('XY').center(x,p.keyhole_entry_y).circle(p.keyhole_entry_d/2).extrude(p.back_t+1)\n\
    \        neck = cq.Workplane('XY').center(x,p.keyhole_entry_y+p.keyhole_travel/2).rect(p.keyhole_neck_w,p.keyhole_travel).extrude(p.back_t+1)\n\
    \        end = cq.Workplane('XY').center(x,p.keyhole_entry_y+p.keyhole_travel).circle(p.keyhole_neck_w/2).extrude(p.back_t+1)\n\
    \        b = b.cut(entry.union(neck).union(end))\n    return b"
  print_orientation: Flat wall-contact back on bed, z=0. Nut-channel bridges are only
    5.9 mm wide; keep them support-free. Bottom bay has no roof.
  use_orientation: Back against wall, +y up and +z toward LEDs. USB bay downward.
- id: carrier
  role: final
  material: Same PLA as box
  code: "def build(p):\n    b = cq.Workplane('XY').circle(p.carrier_d/2).extrude(p.carrier_t)\n\
    \    for x in (-p.perf_pitch_x/2,p.perf_pitch_x/2):\n        for y in (-p.perf_pitch_y/2,p.perf_pitch_y/2):\n\
    \            boss = cq.Workplane('XY').workplane(offset=p.carrier_t).center(x,y).circle(p.standoff_d/2).extrude(p.standoff_h)\n\
    \            b = b.union(boss)\n            hole = cq.Workplane('XY').workplane(offset=p.carrier_t+p.standoff_h-p.pilot_depth).center(x,y).circle(p.pilot_d/2).extrude(p.pilot_depth+1)\n\
    \            b = b.cut(hole)\n    return b.cut(cq.Workplane('XY').circle(p.m3_clearance/2).extrude(p.carrier_t+1))"
  print_orientation: Circular underside flat on bed, standoffs upward.
  use_orientation: Underside on low pivot boss at y=-55. Rotate in plane to aim real
    USB port into bottom bay; nominal assembly has long board dimension vertical.
- id: led_mount_coupon
  role: coupon
  material: Same PLA and print settings as box
  code: "def build(p):\n    import math\n    span = p.disk_hole_pitch+2*p.mount_post_d\n\
    \    b = cq.Workplane('XY').box(span,p.mount_post_d+4,2,centered=(True,True,False))\n\
    \    for x in (-p.disk_hole_pitch/2,p.disk_hole_pitch/2):\n        b = b.union(cq.Workplane('XY').workplane(offset=2).center(x,0).circle(p.mount_post_d/2).extrude(p.test_post_h-2))\n\
    \        b = b.cut(cq.Workplane('XY').center(x,0).circle(p.m3_clearance/2).extrude(p.test_post_h+1))\n\
    \        rear = -(p.nut_m3_af/math.sqrt(3)+p.nut_width_allowance/2)\n        front\
    \ = p.mount_post_d/2+2\n        h = p.nut_m3_h+p.nut_height_allowance\n      \
    \  slot = cq.Workplane('XY').box(p.nut_m3_af+p.nut_width_allowance,front-rear,h,centered=(True,True,False)).translate((x,(front+rear)/2,p.test_post_h-p.nut_roof-h))\n\
    \        b = b.cut(slot)\n    return b"
  print_orientation: Connecting strip flat on bed.
  use_orientation: Temporary support behind disk for hole spacing, rear support, screw-head
    clearance and nut-capture tests.
- id: pilot_coupon
  role: coupon
  material: Same PLA and print settings as carrier
  code: "def build(p):\n    b = cq.Workplane('XY').box(40,16,2,centered=(True,True,False))\n\
    \    for x,d in ((-12,p.pilot_test_low),(0,p.pilot_d),(12,p.pilot_test_high)):\n\
    \        b = b.union(cq.Workplane('XY').workplane(offset=2).center(x,0).circle(p.standoff_d/2).extrude(p.standoff_h))\n\
    \        hole = cq.Workplane('XY').workplane(offset=2+p.standoff_h-p.pilot_depth).center(x,0).circle(d/2).extrude(p.pilot_depth+1)\n\
    \        b = b.cut(hole)\n    return b"
  print_orientation: Flat strip on bed, pilots vertical.
  use_orientation: 'Bench test only. Left-to-right pilots: 1.6, 1.7, 1.8 mm.'
- id: wall_coupon
  role: coupon
  material: Same PLA and print settings as box
  code: "def build(p):\n    b = cq.Workplane('XY').box(30,p.keyhole_travel+22,p.back_t,centered=(True,True,False))\n\
    \    y = -p.keyhole_travel/2\n    e = cq.Workplane('XY').center(0,y).circle(p.keyhole_entry_d/2).extrude(p.back_t+1)\n\
    \    n = cq.Workplane('XY').rect(p.keyhole_neck_w,p.keyhole_travel).extrude(p.back_t+1)\n\
    \    t = cq.Workplane('XY').center(0,-y).circle(p.keyhole_neck_w/2).extrude(p.back_t+1)\n\
    \    return b.cut(e.union(n).union(t))"
  print_orientation: Wall-contact face flat on bed.
  use_orientation: Against wall for testing actual external wall screw and stand-off.
