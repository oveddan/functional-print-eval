  - pilot_depth
  - selftap_length
  - perf_t
  check:
    method: coupon
    ref: pilot_coupon
    description: Choose smallest pilot that drives by hand without splitting and holds
      without stripping. Update pilot_d before carrier print. Recheck with actual
      board.
- id: pcb_fit
  part: carrier
  feature: Four standoffs and central pivot-head clearance
  relation: supports
