task: estoa-light
note: 'REVIEWED REVISION: carrier centre moved from y=-53 to y=-55, increasing circular
  carrier-to-LED-pillar clearance from approximately 0.6 to 2.5 mm. Final box is 232
  mm diameter and 60 mm deep, with a rotating electronics carrier and broad bottom
  USB access bay. The disk closes the front; diffuser/front shell not included. IMPORTANT:
  USB coordinates, PCB thickness, rear solder/connector projections and safe PCB support
  lands remain unverified. Print coupons and carrier and pass the checks before printing
  box. ESP32 placement is provisional. Black PLA is confirmed available; use equivalent
  matte-white PLA if obtained and fit-tested. User''s wall screws/anchors are external
  wall fixings, not design hardware.'
questions:
- text: What changed after review?
  answer: Carrier and its pivot moved 2 mm downward. All corresponding nominal board
    and screw placements updated. Screw engagement, nut-pocket roofs, short bridges
    and build-volume fit were reviewed geometrically, not physically tested.
- text: Which real dimensions are still unverified?
  answer: USB mouth position and plug envelope, PCB thickness, rear projections, full
    component heights, wire reach and bare support lands. These are mandatory fit
    checks, not guaranteed fits.
- text: LED mounting dimensions?
  answer: 'Two 3.3 mm holes on horizontal centreline, 33.5 mm centre spacing: measured
    inner-edge gap 30.2 plus diameter 3.3. Supplied edge measurements imply about
    241.58 mm disk diameter.'
