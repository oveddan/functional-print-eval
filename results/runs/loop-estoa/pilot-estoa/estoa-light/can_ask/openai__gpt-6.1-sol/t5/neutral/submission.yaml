manual:
- n: '1'
  text: Disconnect power. Print coupons in final filament at 0.2 mm layers, 5 walls,
    6 top/bottom layers and 25–30% infill. Keep short nut channels support-free. Largest
    part footprint is 232 mm, within X1C volume. Only black PLA is confirmed; equivalent
    white PLA needs the same fit checks.
  parts:
  - led_mount_coupon
  - pilot_coupon
  - wall_coupon
  hardware: []
  tool: 3D printer
- n: '2'
  text: 'Test LED coupon with actual disk, M3 nuts and M3x10 screws. Nuts enter from
    +y with flat faces against straight channel sidewalls; push fully to closed ends.
    Verify spacing, rear support lands, screw-head clearance and engagement. Tighten
    only gently by hand without bending PCB. Separately mark/test the rim footprint:
    diameter 232 outside, 226 inside. No rim or post may press solder/components or
    unsafe circuitry. If interference exists, revise before box print. Remove test
    hardware afterwards.'
  parts:
  - led_mount_coupon
  hardware:
  - led_disk
  - led_screws
  - led_nuts
  tool: 2.5 mm hex key, ruler and paper
- n: '3'
  text: Test actual M2x6 screws in pilot coupon. Select pilot that neither splits
    nor strips; update pilot_d if needed. Print carrier and test actual perfboard
    hole pattern. All four standoffs must seat flat and heads must not bridge copper.
    Confirm solder clearance above carrier and future central pivot head.
  parts:
  - pilot_coupon
  - carrier
  hardware:
  - pcb_screws
  - perfboard
  tool: Hand screwdriver
- n: '4'
  text: 'Before printing box, perform paper-circle USB check: draw 232 mm circle,
    carrier centre 55 mm below centre, bottom bay 96 mm wide from y=-70 downward.
    Rotate actual loaded carrier so USB points down. Check actual plug insertion/removal
    with wall plane z=0 and disk back z=60. Actual USB coordinates are unknown; ESP32
    placement is provisional. Measure rear projections and tallest components and
    verify at least 2 mm air gaps, safe support lands and existing wire reach. If
    any check fails, revise before box print.'
  parts:
  - carrier
  hardware:
  - perfboard
  - esp32
  - led_disk
  tool: Paper, ruler and actual USB cable
- n: '5'
  text: Print box flat back down with 5 walls, 6 top/bottom layers, 30% infill and
    no supports inside short nut channels. Optional brim for adhesion. Inspect keyholes,
    posts, back/rim junction and layer bonding. Reject cracked or warped parts.
  parts:
  - box
  hardware: []
  tool: 3D printer
- n: '6'
  text: Slide pivot nut into low boss channel from +y. Place carrier on boss, washer
    above carrier, then M3x10 screw. Leave loose enough to rotate. Attach perfboard
    with four M2x6 self-tapping screws using light hand torque; estimated engagement
    is 4.4 mm into standoffs with a 1.6 mm board. Aim actual USB into bottom bay,
    then lightly tighten pivot. Keep solder at least 2 mm from pivot head and wires
    clear of carrier edge.
  parts:
  - box
  - carrier
  hardware:
  - pivot_nut
  - pivot_screw
  - pivot_washer
  - pcb_screws
  - perfboard
  - esp32
  tool: 2.5 mm hex key and hand screwdriver
- n: '7'
  text: Route existing four wires clear of pivot, pillars and rim, with slack. Slide
    LED nuts into tall pillars from +y. Temporarily seat disk with its input wires
    toward +y; recheck every rear component and intended support land. Check access
    with real USB cable. Remove disk before wall-fixing work.
  parts:
  - box
  - carrier
  hardware:
  - led_nuts
  - led_disk
  - perfboard
  tool: Ruler
- n: '8'
  text: 'Use user''s external #8 round-head wall screws and 1/4 inch anchors. Test
    actual screws with wall coupon. Mark level wall screw centres 120 mm apart, corresponding
    to box x=±60, y=64. Avoid hidden pipes/wires. Install anchors per packaging and
    wall construction; screw length/embedment must be adequate. Set screw-head undersides
    approximately 4.5 mm off wall, then adjust for fit. Place heads through keyhole
    entries and slide box DOWN 14 mm. Both shanks must reach upper ends, heads capture
    securely and box back rest flat. This is a lift-off hanger, not childproof or
    impact-resistant.'
  parts:
  - wall_coupon
  - box
  hardware: []
  tool: Level, suitable drill and screwdriver
- n: '9'
  text: Lift box off wall. Seat disk on verified supports, without pinching wires,
    and gently install two M3x10 screws into captured nuts. Never bow PCB. Rehang
    and check secure capture before connecting USB through bottom bay. Bay intentionally
    remains open; future transparent shell must preserve USB access and 14 mm lift-off
    travel.
  parts:
  - box
  - carrier
  hardware:
  - led_disk
  - led_screws
  - led_nuts
  tool: 2.5 mm hex key
- n: '10'
  text: Use only a correctly rated existing low-voltage USB supply and wiring. This
    mechanical design does not validate ESP32 power-path current capacity or electrical
    power needed by 255 LEDs. Start at low brightness and monitor heating. Keep PLA
    well below softening conditions, away from sunlight/heaters. Do not enclose a
    mains charger. Periodically inspect PLA seats, screws and wall capture.
  parts:
  - box
  hardware:
  - esp32
  - led_disk
  tool: null
