manual:
- n: '1'
  text: 'Print fit_coupon_v2 first: PLA, 0.2 mm layers, 4 perimeters, no supports.
    Test actual #8 round-head wall screw in the keyhole. Head must pass the large
    entry and remain captured by the neck. This checks the previous hanging failure
    before another large print.'
  parts:
  - fit_coupon_v2
  hardware: []
  tool: null
- n: '2'
  text: Test actual disk and M3 hardware on coupon towers, and M2 screw through a
    perfboard corner on end pad. Power disconnected. No force, cracking, PCB bending
    or head contact with copper. Reuse only undamaged hardware from old print.
  parts:
  - fit_coupon_v2
  hardware:
  - disk
  - disk_screws
  - disk_nuts
  - disk_washers
  - perf
  - perf_screws
  tool: Matching hand screwdrivers and 2.5 mm hex key
- n: '3'
  text: Make closure and USB templates described in criteria before full print. Include
    the whole assembled perfboard, not just its bare outline. This revision adds 30
    mm depth and shifts the board inward, but the actual previous obstruction was
    not identified. If any component still clashes, do not print full box yet.
  parts: []
  hardware:
  - perf
  - esp
  - disk
  tool: null
- n: '4'
  text: 'Print back_box_v2 outside-back down, cavity up: PLA, 0.2 mm layers, 5 perimeters,
    at least 5 top/bottom layers, approximately 25% infill. Optional 5 mm brim stays
    inside the 256 mm bed. No supports in pilots or nut slots. Available filament
    is black; obtain matte white for requested colour.'
  parts:
  - back_box_v2
  hardware: []
  tool: null
- n: '5'
  text: 'Assembly axes: box origin at outside-back centre, +x right, +y up wall, +z
    toward LEDs. Perfboard top centre goes at (0,-55,12) mm with long side along y,
    USB-facing end downward. M2 screws point -z at x=±22.9, y=-87.9 and -22.1, z=12.
    Seat on all four bosses and tighten gently by hand. Check solder clears floor.'
  parts:
  - back_box_v2
  hardware:
  - perf
  - perf_screws
  tool: Matching hand screwdriver
- n: '6'
  text: ESP32 remains in existing headers. Port-frame +x points assembly -y, +z points
    assembly +z. Estimated mouth origin (0,-85,26) mm is unverified and does not override
    actual header placement. Check actual USB plug access through bottom notch now.
  parts:
  - back_box_v2
  hardware:
  - esp
  - perf
  tool: null
- n: '7'
  text: Slide M3 nuts sideways into central tower pockets. Route four existing wires
    loosely away from screw tips, rim and USB path. Disk back centre goes at (0,0,70)
    mm, input wires +y, LEDs +z. Confirm all rear parts clear before fastening.
  parts:
  - back_box_v2
  hardware:
  - disk
  - disk_nuts
  - perf
  tool: null
- n: '8'
  text: Fit washers and M3x10 screws at x=±16.75, y=0, pointing -z. Actual under-head
    z is 70 + disk thickness + 0.5 mm washer, nominally 72.1. Verify full nut engagement
    without bottoming and tighten only lightly. Do not bow PCB or contact LEDs/traces.
    Confirm box closes freely and USB plug inserts/removes.
  parts:
  - back_box_v2
  hardware:
  - disk
  - disk_screws
  - disk_washers
  - disk_nuts
  - esp
  tool: 2.5 mm hex key
- n: '9'
  text: 'External wall fixings: use your reported #8 round-head screws (heads at most
    9 mm) and compatible 1/4 inch anchors, not the earlier M4 assumption. Follow anchor
    instructions for wall substrate, screw length, engagement and assembled weight.
    Diameter alone is not a load rating. Do not hang until suitability is verified.'
  parts: []
  hardware: []
  tool: null
- n: '10'
  text: Place wall screw axes level, 130 mm apart. Initial under-head gap about 3.4
    mm, adjusted to snugly capture printed 3 mm back. Pass both heads through large
    entries and lower box 12 mm into necks. Seated under-head positions are (±65,65,3.4)
    mm in box frame, screw directions -z; actual z depends on gap. Keep supporting
    light while confirming both heads captured and anchors firm. Leave USB cable slack
    so it cannot lift box off keyholes.
  parts:
  - back_box_v2
  hardware: []
  tool: Level and tools specified by anchor maker
- n: '11'
  text: Keep mains charger outside. Only suitable low-voltage USB wiring belongs inside.
    Start at low brightness then supervise intended-brightness test. Stop/reduce brightness
    if PLA warms/softens or wiring overheats. Increased depth does not validate full-power
    operation of 255 LEDs. Recheck thermal performance after future diffuser is added.
  parts:
  - back_box_v2
  hardware:
  - disk
  - perf
  - esp
  tool: null
