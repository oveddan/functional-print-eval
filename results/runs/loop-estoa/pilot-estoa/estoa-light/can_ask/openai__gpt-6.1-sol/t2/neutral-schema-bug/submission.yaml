criteria:
- id: disk_fit
  part: back_box
  feature: Disk outline and mounting towers
  relation: supports
  hardware: disk
  clearance_mm: null
  params:
  - disk_d
  - disk_pitch
  - disk_hole_d
  - box_d
  check:
    method: coupon
    ref: fit_coupon
    description: Both screws must enter freely, disk wires up. Compare strip endpoints
      with disk left/right edges. Confirm 238 mm box outline is inside disk perimeter
      using a paper circle; rim must miss disk rear components. An incorrect inferred
      diameter requires revised CAD before full printing.
- id: nut_fit
  part: back_box
  feature: Side-loaded nut pockets
  relation: contains
  hardware: disk_nuts
  clearance_mm: 0.3
  params:
