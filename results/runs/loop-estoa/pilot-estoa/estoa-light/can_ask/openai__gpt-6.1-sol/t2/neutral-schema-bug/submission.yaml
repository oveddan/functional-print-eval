manual:
- n: '1'
  text: 'ASSEMBLY: back_box origin is centre of outside back; +x right, +y up, +z
    away from wall. Its final pose is unrotated at (0,0,0). Disk supplied-frame origin
    is (0,0,40), axes aligned to box: LEDs forward, input wires up. Coupon is not
    installed. Perfboard supplied-frame origin is (0,-65,10), axes aligned, assuming
    1.6 mm thickness. Its long direction is vertical.'
  parts:
  - back_box
  hardware:
  - disk
  - perf
  tool: null
- n: '2'
  text: 'ESP32 supplied-frame provisional origin is (0,-95,24), with +x toward box
    -y, +y toward box +x, +z toward box +z. THIS POSE IS GUESSED: the real header
    placement determines the exact USB position. Orient port toward the bottom opening
    without modifying soldered circuitry. Physical access test must validate actual
    assembly; do not force the assumed pose.'
  parts: []
  hardware:
  - perf
  - esp
  tool: null
- n: '3'
  text: 'Print fit_coupon first: PLA, 0.2 mm layers, 4 perimeters, no supports. De-energize
    boards. Insert M3 nuts sideways and test disk using M3x10 screws and washers,
    finger-tight only. Verify holes, full nut engagement and safe washer lands. Compare
    strip ends against disk edges to confirm inferred diameter. Remove hardware after
    testing.'
  parts:
  - fit_coupon
  hardware:
  - disk
  - disk_nuts
  - disk_screws
  - disk_washers
  tool: 2.5 mm hex key
- n: '4'
  text: Test actual perfboard corner and M2x6 screw on coupon end pad using a hand
    screwdriver. Stop if boss splits or torque rises sharply. Verify safe head contact,
    board thickness, four-hole pattern and solder clearance. Perform cardboard USB/disk-back/component-clearance
    checks in criteria. DO NOT print full box if these fail or remain unresolved.
  parts:
  - fit_coupon
  hardware:
  - perf
  - perf_screws
  - esp
  - disk
  tool: Matching hand screwdriver
- n: '5'
  text: 'Print back_box outside-back down, cavity up: PLA, 0.2 mm layers, 5 perimeters,
    at least 5 top/bottom layers, about 25% infill. Optional 5 mm brim gives 248 mm
    footprint, within bed. No supports inside holes/slots. Black PLA is available;
    matte-white PLA must be obtained separately. Remove brim/burrs without enlarging
    hanger necks.'
  parts:
  - back_box
  hardware: []
  tool: null
- n: '6'
  text: Slide one M3 nut into each tower from its +x side; pockets span z=33.9 to
    36.6. Seat perfboard on 8.4 mm-high bosses. Install four M2x6 screws through corner
    holes at (-22.9,-97.9), (22.9,-97.9), (-22.9,-32.1), (22.9,-32.1), all pointing
    -z; nominal head bearing plane z=10. Tighten gently without bending board. ESP32
    remains plugged into existing headers.
  parts:
  - back_box
  hardware:
  - disk_nuts
  - perf
  - esp
  - perf_screws
  tool: Matching hand screwdriver
- n: '7'
  text: Route four disk wires loosely, clear of nut slots, towers, rim and USB plug
    path. Keep bare conductors separated. Seat disk back at z=40, LEDs forward, wires
    up. Put an M3 washer under each M3x10 head and screw at (-16.75,0) and (16.75,0),
    pointing -z. Nominal head bearing z=42.1 assumes 1.6 mm PCB; actual position follows
    actual thickness. Snug only enough to retain PCB, never bow it. Confirm no trapped
    rear components/wires and repeat USB access test.
  parts:
  - back_box
  hardware:
  - disk
  - disk_screws
  - disk_washers
  - perf
  - esp
  tool: 2.5 mm hex key
- n: '8'
  text: 'WALL-MOUNT HOLD POINT: M4 machine screws are not appropriate to drive directly
    into an unknown wall. No anchors are included and wall construction is unknown.
    Do not hang until a suitable load-bearing existing M4 threaded wall attachment
    is verified. If none exists, permitted hardware cannot complete wall installation;
    obtain a revised fixing plan. The next step provides positioning, not proof of
    fixing safety.'
  parts: []
  hardware:
  - wall_screws
  tool: null
- n: '9'
  text: 'Only after verifying compatible wall attachment: install M4x20 screws level,
    130 mm apart, at final box-frame axes (-65,65) and (65,65), pointing -z. Set under-head
    gap about 3 mm, adjusting for snug capture of back. Approximately 17 mm screw
    insertion remains; attachment must accept it safely. Put large keyhole entries
    over heads, press flat to wall, and lower box 8 mm into both narrow upper ends.
    Check both heads capture back before releasing. Head bearing planes are nominally
    z=3, heads extend to z=7 inside. Keep USB lead slack so it cannot lift light off
    hangers.'
  parts:
  - back_box
  hardware:
  - wall_screws
  tool: Level and 3 mm hex key
- n: '10'
  text: Only low-voltage USB belongs inside; keep mains charger outside. Test at low
    brightness while supervised, then monitor temperature at sustained intended brightness.
    Reduce brightness or stop for softened/warm PLA, hot wiring or odour. Enclosure
    does not validate supply capacity, wiring gauge or full-power use of 255 LEDs.
    Keep dry. Recheck heat and access after adding future diffuser.
  parts:
  - back_box
  hardware:
  - disk
  - perf
  - esp
  tool: null
