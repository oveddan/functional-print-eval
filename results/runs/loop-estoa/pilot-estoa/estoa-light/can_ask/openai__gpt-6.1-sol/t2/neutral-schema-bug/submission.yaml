task: estoa-light
note: 'Rechecked back box only. Print coupon and perform paper/cardboard clearance
  checks BEFORE printing back_box: inferred disk diameter, unknown disk thickness/rear
  projections and unknown USB pose prevent a verified drop-in fit. Geometry is unchanged
  from the preceding design. Wall mounting requires verified compatible load-bearing
  wall fixings; the permitted M4 machine screws alone are NOT wall anchors. Available
  filament is black PLA; obtain matte white for the requested colour. ESP32 assembly
  pose is explicitly provisional. Do not enclose a mains charger.'
