manual:
- n: '1'
  text: Print fit_coupon first in PLA at 0.2 mm layers, 4 perimeters, no supports.
    Keep both boards disconnected from power for all fit checks. Do not proceed straight
    to the final print.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Slide M3 nuts into coupon side slots. Place disk back on the bosses, input
    wires upward. Try M3x10 screws with M3 washers, finger-tight only. Confirm screw
    engagement, safe washer lands and free hole alignment. Check the 241.58 mm strip
    against the disk diameter. Make the full-scale paper rim/tower template described
    in disk_layout and inspect disk rear contacts. If anything conflicts, stop and
    correct dimensions before printing.
  parts:
  - fit_coupon
  hardware:
  - disk
  - disk_nuts
  - disk_screws
  - disk_washers
  tool: 2.5 mm hex key
- n: '3'
  text: Test an M2x6 self-tapping screw in the coupon end pad using one perfboard
    corner. Turn by hand; stop if the boss cracks or torque rises sharply. Check head
    overlap, copper clearance, actual board thickness and solder clearance. Use a
    paper template to check the four corner centres at 45.8 x 65.8 mm. Remove and
    retain the screws.
  parts:
  - fit_coupon
  hardware:
  - perf
  - perf_screws
  tool: Matching hand screwdriver
- n: '4'
  text: Complete the USB cardboard mock-up and internal-clearance checks before printing.
    Port must face down and accept the actual plug from outside while a disk substitute
    covers the front. The ESP32 assembly pose is estimated, not a confirmed port location.
    If port, capacitor, solder, rear disk connector or wires do not fit, revise the
    model rather than forcing assembly.
  parts: []
  hardware:
  - perf
  - esp
  - disk
  tool: null
- n: '5'
  text: After checks pass, print back_box outside-back down, cavity up, PLA, 0.2 mm
    layers, 5 perimeters, at least 5 top/bottom layers, approximately 25% infill.
    Use a 5 mm brim if needed; footprint with brim is about 248 mm. No supports in
    nut slots or screw pilots. Available PLA is black; obtain matte white separately
    for the requested colour. Remove brim and slot burrs gently.
  parts:
  - back_box
  hardware: []
  tool: null
- n: '6'
  text: Insert M3 nuts into both tower side slots. Place perfboard on its four bosses,
    USB toward bottom opening, leaving ESP32 in its existing headers. Install four
    M2x6 screws gently by hand. Do not bend the board or clamp solder joints against
    plastic; verify screw tips do not penetrate the outside back.
  parts:
  - back_box
  hardware:
  - disk_nuts
  - perf
  - esp
  - perf_screws
  tool: Matching hand screwdriver
- n: '7'
  text: Route the four existing disk wires loosely inside, clear of screws, rim and
    USB path. Seat disk back on rim and centre towers, input wires up. Install M3
    washers and M3x10 screws through disk holes into nuts. Tighten only enough to
    retain the PCB without bowing it. Confirm no rear component is carrying clamping
    load. Recheck plug insertion/removal with disk installed.
  parts:
  - back_box
  hardware:
  - disk
  - disk_screws
  - disk_washers
  - perf
  - esp
  tool: 2.5 mm hex key
- n: '8'
  text: 'WALL-MOUNTING HOLD POINT: no wall attachment has been established. M4 machine
    screws must not be driven directly into unknown plasterboard, masonry or timber
    as a substitute for proper wall fixings. Do not hang until a suitable existing
    load-bearing M4 threaded attachment is verified. No wall anchors are included
    in the allowed hardware.'
  parts: []
  hardware:
  - wall_screws
  tool: null
- n: '9'
  text: Only after that verification, set two M4x20 screws level, 130 mm apart, with
    nominal 3.2 mm under-head gap, adjusted for snug sliding fit. Hold both large
    keyhole entries over the heads, press box to wall, then lower it 8 mm so both
    heads capture the narrow upper ends. Check retention before releasing. In the
