criteria:
- id: disk_layout
  part: back_box
  feature: Disk hole pitch, perimeter support and electrical keep-outs
  relation: supports
  hardware: disk
  clearance_mm: null
  params:
  - disk_d
  - disk_pitch
  - disk_hole_d
  - box_d
  - wall_t
  - boss_r
  check:
    method: coupon
    ref: fit_coupon
    description: Place unpowered disk on the two coupon bosses, wires upward. Screws
      must align without forcing. Compare strip ends with disk outer edges. Make a
      full-scale 238 mm paper circle with 3 mm rim and 12 mm tower footprints; verify
      these touch only safe, flat PCB regions, not solder joints/components. Stop
      if inferred diameter or rear clearances are wrong.
- id: nut_fit
  part: back_box
  feature: Side-loaded hex pockets
  relation: contains
  hardware: disk_nuts
  clearance_mm: 0.3
  params:
  - nut_af
  - nut_h
  - nut_slack
  check:
    method: coupon
    ref: fit_coupon
    description: Nuts must slide sideways into aligned pockets and resist rotation
      under finger-tight screws. Do not force undersized slots.
