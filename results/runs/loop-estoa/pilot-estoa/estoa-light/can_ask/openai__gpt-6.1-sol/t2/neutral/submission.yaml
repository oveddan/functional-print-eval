task: estoa-light
note: 'Rechecked back-box design; no diffuser included. Wall screw under-head gap
  revised to 3.2 mm for sliding clearance. The disk diameter is inferred, not independently
  verified; its thickness and the USB pose remain estimates. Print the fit coupon
  and complete the paper/cardboard layout checks BEFORE printing back_box. Do not
  hang until a suitable existing M4 threaded wall attachment is verified: the available
  hardware contains no wall anchors. Available filament is black PLA; matte-white
  PLA must be obtained separately if desired. This enclosure does not validate the
  electrical supply or full-brightness operation of 255 LEDs.'
