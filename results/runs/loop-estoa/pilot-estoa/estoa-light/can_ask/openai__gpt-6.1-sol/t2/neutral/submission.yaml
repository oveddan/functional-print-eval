parts:
- id: back_box
  role: final
  material: PLA; available black, or matte white when obtained
  code: "def build(p):\n    import math\n    e=0.02\n    body=cq.Workplane('XY').circle(p.box_d/2).extrude(p.box_h)\n\
    \    cavity=cq.Workplane('XY').workplane(offset=p.floor_t).circle(p.box_d/2-p.wall_t).extrude(p.box_h)\n\
    \    body=body.cut(cavity)\n    # Open bottom sidewall while retaining the flat\
    \ back.\n    reach=p.box_d\n    opening=cq.Workplane('XY').box(p.access_w,reach,p.box_h,centered=(True,True,False)).translate((0,p.access_start_y-reach/2,p.floor_t))\n\
    \    body=body.cut(opening)\n    for x in (-p.disk_pitch/2,p.disk_pitch/2):\n\
    \        body=body.union(cq.Workplane('XY').center(x,0).circle(p.boss_r).extrude(p.box_h))\n\
    \        body=body.cut(cq.Workplane('XY').center(x,0).circle(p.m3_clear_d/2).extrude(p.box_h+e))\n\
    \        af=p.nut_af+p.nut_slack\n        depth=p.nut_h+p.nut_slack\n        z=p.box_h-p.nut_roof-depth\n\
    \        pocket=cq.Workplane('XY').workplane(offset=z).center(x,0).polygon(6,af/math.cos(math.pi/6)).extrude(depth)\n\
    \        slot=cq.Workplane('XY').box(p.boss_r+e,af,depth,centered=(False,True,False)).translate((x,0,z))\n\
    \        body=body.cut(pocket.union(slot))\n    dx=p.perf_w/2-p.perf_edge_land-p.perf_hole_d/2\n\
    \    dy=p.perf_l/2-p.perf_edge_land-p.perf_hole_d/2\n    h=p.perf_top_z-p.perf_t\n\
    \    for x in (-dx,dx):\n        for y in (p.perf_y-dy,p.perf_y+dy):\n       \
    \     body=body.union(cq.Workplane('XY').center(x,y).circle(p.perf_boss_r).extrude(h))\n\
    \            pilot=cq.Workplane('XY').workplane(offset=p.floor_t).center(x,y).circle(p.pilot_d/2).extrude(h-p.floor_t+e)\n\
    \            body=body.cut(pilot)\n    for x in (-p.hang_x,p.hang_x):\n      \
    \  y=p.hang_y\n        entry=cq.Workplane('XY').center(x,y-p.key_travel).circle(p.key_entry_d/2).extrude(p.floor_t+e)\n\
    \        neck=cq.Workplane('XY').center(x,y).circle(p.key_neck_d/2).extrude(p.floor_t+e)\n\
    \        stem=cq.Workplane('XY').box(p.key_neck_d,p.key_travel,p.floor_t+e,centered=(True,False,False)).translate((x,y-p.key_travel,0))\n\
    \        body=body.cut(entry.union(neck).union(stem))\n    return body"
  print_orientation: Circular outside back at z=0 on bed, open cavity up. No supports
    in nut slots or pilots.
  use_orientation: Flat back against wall z=0; disk support plane z=40; bottom access
    notch points down (-y).
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    import math\n    e=0.02\n    a=cq.Workplane('XY').box(p.disk_d,p.coupon_w,p.coupon_t,centered=(True,True,False))\n\
    \    af=p.nut_af+p.nut_slack\n    depth=p.nut_h+p.nut_slack\n    z=p.coupon_h-p.nut_roof-depth\n\
    \    for x in (-p.disk_pitch/2,p.disk_pitch/2):\n        a=a.union(cq.Workplane('XY').center(x,0).circle(p.boss_r).extrude(p.coupon_h))\n\
    \        a=a.cut(cq.Workplane('XY').center(x,0).circle(p.m3_clear_d/2).extrude(p.coupon_h+e))\n\
    \        pocket=cq.Workplane('XY').workplane(offset=z).center(x,0).polygon(6,af/math.cos(math.pi/6)).extrude(depth)\n\
    \        slot=cq.Workplane('XY').box(p.boss_r+e,af,depth,centered=(False,True,False)).translate((x,0,z))\n\
    \        a=a.cut(pocket.union(slot))\n    x=p.disk_d/2-p.perf_boss_r-p.wall_t\n\
    \    h=p.perf_top_z-p.perf_t\n    a=a.union(cq.Workplane('XY').center(x,0).circle(p.perf_boss_r).extrude(h))\n\
    \    a=a.cut(cq.Workplane('XY').workplane(offset=p.floor_t).center(x,0).circle(p.pilot_d/2).extrude(h-p.floor_t+e))\n\
    \    return a"
  print_orientation: Flat strip underside at z=0 on bed, bosses up; no supports.
  use_orientation: Temporary disk hole/diameter gauge and screw-fit test, not installed.
