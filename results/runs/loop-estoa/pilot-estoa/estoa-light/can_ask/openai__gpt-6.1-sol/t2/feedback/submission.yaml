parts:
- id: back_box_v2
  role: final
  material: PLA; available black, or matte white if obtained
  code: "def build(p):\n    import math\n    e=0.02\n    body=cq.Workplane('XY').circle(p.box_d/2).extrude(p.box_h)\n\
    \    cavity=cq.Workplane('XY').workplane(offset=p.floor_t).circle(p.box_d/2-p.wall_t).extrude(p.box_h)\n\
    \    body=body.cut(cavity)\n    opening=cq.Workplane('XY').box(p.access_w,p.box_d,p.box_h,centered=(True,True,False)).translate((0,p.access_start_y-p.box_d/2,p.floor_t))\n\
    \    body=body.cut(opening)\n    for x in (-p.disk_pitch/2,p.disk_pitch/2):\n\
    \        body=body.union(cq.Workplane('XY').center(x,0).circle(p.boss_r).extrude(p.box_h))\n\
    \        body=body.cut(cq.Workplane('XY').center(x,0).circle(p.m3_clear_d/2).extrude(p.box_h+e))\n\
    \        af=p.nut_af+p.nut_slack\n        depth=p.nut_h+p.nut_slack\n        z=p.box_h-p.nut_roof-depth\n\
    \        pocket=cq.Workplane('XY').workplane(offset=z).center(x,0).polygon(6,af/math.cos(math.pi/6)).extrude(depth)\n\
    \        slot=cq.Workplane('XY').box(p.boss_r+e,af,depth,centered=(False,True,False)).translate((x,0,z))\n\
    \        body=body.cut(pocket.union(slot))\n    dx=p.perf_w/2-p.perf_edge_land-p.perf_hole_d/2\n\
    \    dy=p.perf_l/2-p.perf_edge_land-p.perf_hole_d/2\n    h=p.perf_top_z-p.perf_t\n\
    \    for x in (-dx,dx):\n        for y in (p.perf_y-dy,p.perf_y+dy):\n       \
    \     body=body.union(cq.Workplane('XY').center(x,y).circle(p.perf_boss_r).extrude(h))\n\
    \            body=body.cut(cq.Workplane('XY').workplane(offset=p.floor_t).center(x,y).circle(p.pilot_d/2).extrude(h-p.floor_t+e))\n\
    \    for x in (-p.hang_x,p.hang_x):\n        entry=cq.Workplane('XY').center(x,p.hang_y-p.key_travel).circle(p.key_entry_d/2).extrude(p.floor_t+e)\n\
    \        neck=cq.Workplane('XY').center(x,p.hang_y).circle(p.key_neck_d/2).extrude(p.floor_t+e)\n\
    \        stem=cq.Workplane('XY').box(p.key_neck_d,p.key_travel,p.floor_t+e,centered=(True,False,False)).translate((x,p.hang_y-p.key_travel,0))\n\
    \        body=body.cut(entry.union(neck).union(stem))\n    return body"
  print_orientation: Circular outside back at z=0 on bed, cavity upward. No supports
    in nut slots or pilots.
  use_orientation: Back against wall z=0, open bottom toward -y; disk back at z=64.
- id: keyhole_coupon_v2
  role: coupon
  material: PLA
  code: "def build(p):\n    e=0.02\n    a=cq.Workplane('XY').box(p.coupon_w,p.coupon_l,p.floor_t,centered=(True,True,False))\n\
    \    y=p.coupon_entry_y\n    entry=cq.Workplane('XY').center(0,y).circle(p.key_entry_d/2).extrude(p.floor_t+e)\n\
    \    neck=cq.Workplane('XY').center(0,y+p.key_travel).circle(p.key_neck_d/2).extrude(p.floor_t+e)\n\
    \    stem=cq.Workplane('XY').box(p.key_neck_d,p.key_travel,p.floor_t+e,centered=(True,False,False)).translate((0,y,0))\n\
    \    a=a.cut(entry.union(neck).union(stem))\n    h=p.perf_top_z-p.perf_t\n   \
    \ a=a.union(cq.Workplane('XY').center(p.coupon_pilot_x,p.coupon_pilot_y).circle(p.perf_boss_r).extrude(h))\n\
    \    a=a.cut(cq.Workplane('XY').workplane(offset=p.floor_t).center(p.coupon_pilot_x,p.coupon_pilot_y).circle(p.pilot_d/2).extrude(h-p.floor_t+e))\n\
    \    return a"
  print_orientation: Flat plate at z=0 on bed, pilot boss upward.
  use_orientation: Temporary actual-screw keyhole and perfboard corner test; not installed.
