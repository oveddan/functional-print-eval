manual:
- n: '1'
  text: Keep boards unpowered while fitting. This version is 24 mm deeper and raises
    perfboard 4 mm, adding 20 mm above the board and 4 mm below it. The exact previous
    closing obstruction was not identified; do not assume depth fixes every possible
    collision.
  parts: []
  hardware:
  - disk
  - perf
  - esp
  tool: null
- n: '2'
  text: 'Print keyhole_coupon_v2 first: PLA, 0.2 mm layers, 5 perimeters, no supports.
    Test BOTH actual external #8 round-head wall screws. Each head must pass through
    the large hole; shank must slide into neck; head must not pull through neck. At
    3.5 mm gap from wall to UNDERSIDE of head, the 3 mm plate should slide behind
    it. Clear burrs, but do not enlarge neck casually.'
  parts:
  - keyhole_coupon_v2
  hardware: []
  tool: null
- n: '3'
  text: Test a perfboard corner and M2x6 screw on coupon's raised boss by hand. Confirm
    safe screw-head bearing, pilot grip and solder clearance. Make a cardboard 64
    mm depth mock-up and test actual USB plug access to the raised board before full
    printing.
  parts:
  - keyhole_coupon_v2
  hardware:
  - perf
  - esp
  - perf_screws
  tool: Matching hand screwdriver
- n: '4'
  text: 'Print back_box_v2 outside-back down, cavity up: PLA, 0.2 mm layers, 5 perimeters,
    at least 5 top/bottom layers and about 25% infill. A 5 mm brim fits within X1C
    bed. No supports inside nut slots or pilots. Use available black PLA, or matte
    white if obtained.'
  parts:
  - back_box_v2
  hardware: []
  tool: null
- n: '5'
  text: Transfer M3 nuts into new tower side slots. Place perfboard on four raised
    bosses, USB toward bottom opening. Install four M2x6 screws gently by hand. Do
    not pull misaligned holes into place with screws. Check solder tails clear floor
    and metal heads do not touch circuitry.
  parts:
  - back_box_v2
  hardware:
  - disk_nuts
  - perf
  - esp
  - perf_screws
  tool: Matching hand screwdriver
- n: '6'
  text: Without disk screws, lay disk onto rim and towers. Route four existing wires
    away from contact surfaces. Disk must lie flat without force and have at least
    3 mm clearance to internal components. If it still will not close, stop and identify/measure
    the exact obstruction; never screw it down against interference. Check actual
    USB plug insertion and removal with disk in place.
  parts:
  - back_box_v2
  hardware:
  - disk
  - perf
  - esp
  tool: null
- n: '7'
  text: Once fit is confirmed, install M3 washers and M3x10 screws through disk holes
    into nuts. Verify full nut engagement using actual disk thickness and safe metal
    clearance from LEDs/traces. Tighten only finger-snug; do not bend PCB.
  parts:
  - back_box_v2
  hardware:
  - disk
  - disk_screws
  - disk_washers
  - disk_nuts
  tool: 2.5 mm hex key
- n: '8'
  text: 'Use the actual external #8 round-head screws and 1/4-inch anchors you described,
    NOT the earlier assumed M4 screws. Install anchors according to manufacturer instructions
    for your wall. Screw axes must be level and 130 mm apart. Verify anchor load rating,
    #8 compatibility and sufficient engagement with 3.5 mm UNDER-head gap. Screw length
    and anchor specification are unmeasured; verify them rather than assuming safety.'
  parts: []
  hardware: []
  tool: Level, drill and matching screwdriver appropriate to actual anchors
- n: '9'
  text: Place both large keyhole openings over heads, press back toward wall, and
    lower light 10 mm until both shanks reach closed upper neck ends. Adjust gaps
    for snug sliding fit. Check both heads are captured before releasing. Final screw
    undersides are at box coordinates (-65,65,3.5) and (65,65,3.5), pointing toward
    wall along -z. Leave USB cable slack so it cannot lift light off keyholes.
  parts:
  - back_box_v2
  hardware: []
  tool: null
- n: '10'
  text: Power only via intended low-voltage USB connection; keep mains charger outside.
    Start at low brightness under supervision, then verify wiring and PLA remain cool
    at intended brightness. Stop/reduce brightness for overheating or softening. Enclosure
    does not validate full-power electrical suitability of 255 LEDs.
  parts:
  - back_box_v2
  hardware:
  - disk
  - perf
  - esp
  tool: null
