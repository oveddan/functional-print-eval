task: estoa-light
note: 'Revision 2: depth increased 40→64 mm; perfboard top raised 10→14 mm. Keyhole
  entries increased to 11 mm for actual external #8 round-head screw heads at most
  9 mm, with 5.2 mm necks and 10 mm travel. Actual external wall screws/anchors cannot
  be listed in this submission''s fixed hardware catalog; they are NOT replaced by
  M4 screws. Their finished head-underside positions are (-65,65,3.5) and (65,65,3.5),
  pointing into wall along -z. Exact closing obstruction remains unknown; deeper box
  is a conservative correction, not verified fit. USB/ESP32 pose and board thickness
  are provisional. Print coupon first. No diffuser included.'
