task: estoa-light
note: 'REVISION 2: replace the old box and carrier. All printed roofs over nut holes
  are removed; separate flat disk caps cover upward-open pockets. The circular box
  is deeper and the perfboard moves down, clear of disk posts. Bottom access has no
  bridging lintel. Keyholes have13 mm head entries,5.4 mm stems and clear interior
  head space for the newly reported #8 round heads (at most9 mm diameter). Those purchased
  wall screws/anchors cannot be listed as hardware because this submission system
  rejects additions to its fixed catalog. They are external wall fixtures, NOT substituted
  M4 cap screws. Their final head-under centres are (-50,70,4.3) and (50,70,4.3) mm,
  pointing toward wall along -z; anchor axes are x=±50,y=70. Validate their actual
  fit with the coupon. PCB thicknesses and exact USB coordinates remain unknown; indicated
  electronic frame heights/USB positions are explicitly illustrative. Unpowered fit
  checks are mandatory before closure.'
questions:
- text: What was changed for the failed screw-hole roof?
  answer: 'No integral roof remains: nuts drop in from above; two separately printed
    flat disk caps cover them.'
- text: What specifically blocked PCB closure?
  answer: Not measured. Carrier moved farther below disk posts and enclosure deepened24
    mm; mandatory closure check remains.
- text: Actual wall fixings?
  answer: 'User-purchased external #8 round heads, at most9 mm diameter, with1/4-inch
    anchors. Fixed catalog prevents representing these as hardware entries; exact
    external positions are recorded in note/manual.'
- text: Exact component envelope, PCB thickness and USB mouth frame?
  answer: null
- text: Are electronic assembly coordinates verified?
  answer: No. PCB top and screw-head heights assume1.6 mm PCB thickness for preview.
    ESP32 USB-mouth position is a labelled guess. Measure actuals and verify unpowered
    before closing.
