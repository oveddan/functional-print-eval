manual:
- n: '1'
  text: 'Print wall_fit_coupon_v2 and nut_fit_coupon_v2 first, NOT the old revision.
    Test the actual newly purchased #8 round-head wall screws, not the previously
    assumed M4 cap screws. Keep electronics unpowered.'
  parts:
  - wall_fit_coupon_v2
  - nut_fit_coupon_v2
  hardware:
  - m3_nuts
  tool: null
- n: '2'
  text: 'Pass each actual wall-screw head through coupon''s large circle. Move shank
    to upper narrow end. Require free sliding and at least1.2 mm head overlap per
    side: actual head diameter must be at least7.8 mm. Maximum reported9 mm diameter
    fits13 mm entry. Set screw-head underside4.3 mm from wall to accept4 mm plate.
    Head sits on INSIDE face; do not trap it between wall and rear plate. Check actual
    head height is no more than12 mm.'
  parts:
  - wall_fit_coupon_v2
  hardware: []
  tool: Calipers/ruler and actual screw's screwdriver
- n: '3'
  text: Print back_box_v2, perf_carrier_v2 and both disk caps flat as specified,0.2
    mm layers,4 perimeters,5 top/bottom layers, about30% infill. No supports. No printed
    roof exists over a nut hole and no lintel spans the bottom opening.232 mm diameter
    fits256 mm bed. Use black available PLA or separately acquired matte white.
  parts:
  - back_box_v2
  - perf_carrier_v2
  - disk_cap_left_v2
  - disk_cap_right_v2
  hardware: []
  tool: 3D printer
- n: '4'
  text: Trial-hang EMPTY back_box_v2 on the actual wall screws:100 mm horizontal centres,
    large entries engage first, then lower box15 mm. Check both heads enter, both
    shanks slide to upper ends and both heads have clear space inside. Rear must lie
    flat. Remove box to fit electronics. If this check fails, stop and measure actual
    screw geometry rather than forcing it.
  parts:
  - back_box_v2
  hardware: []
  tool: null
- n: '5'
  text: Drop four M3 nuts into the four SHORT bosses from inside the box. Attach perfboard
    to perf_carrier_v2 gently with four M2x6 self-tapping screws. Check holes align,
    solder clears carrier at least1 mm, screw tips do not break through plate and
    bosses avoid solder. Do not overtighten.
  parts:
  - back_box_v2
  - perf_carrier_v2
  hardware:
  - m3_nuts
  - perfboard
  - esp32
  - pcb_screws
  tool: Matching screwdriver
- n: '6'
  text: Fit carrier at NEW centre y=-60 mm, not old y=-42. Rotate carrier/electronics
    together in90-degree steps to aim USB toward bottom. Fasten with four M3x12 screws.
    The perfboard now sits below the two disk posts, with increased overhead space.
  parts:
  - back_box_v2
  - perf_carrier_v2
  hardware:
  - carrier_screws
  - m3_nuts
  - perfboard
  - esp32
  tool: 2.5 mm hex key
- n: '7'
  text: Drop two remaining M3 nuts into TALL posts. Set disk_cap_left_v2 and disk_cap_right_v2
    flat on post tops, align vertical bores. These separately printed5 mm covers replace
    the failed printed roofs. Disk screws retain caps; no glue needed.
  parts:
  - back_box_v2
  - disk_cap_left_v2
  - disk_cap_right_v2
  hardware:
  - m3_nuts
  tool: null
- n: '8'
  text: 'Route existing four wires away from posts, screws and USB access. Trial-set
    disk on both caps, input wires up. It must sit level without pressure on wires
    or components. Require at least3 mm separation between opposing components/wires;
    check rim avoids rear solder. Test actual charger insertion/removal through bottom.
    If closure still fails, STOP: measure the specific obstruction; do not pull disk
    shut with screws.'
  parts:
  - back_box_v2
  - perf_carrier_v2
  - disk_cap_left_v2
  - disk_cap_right_v2
  hardware:
  - disk
  - perfboard
  - esp32
  tool: null
- n: '9'
  text: Measure disk thickness; verify rear cap landing footprints and5.5 mm screw-head
    landing areas are safe bare board. If M3x16 fully engages nuts without bottoming,
    fasten disk through caps with light finger torque only. Preview head positions
    assume1.6 mm disk thickness, not a measured value.
  parts:
  - back_box_v2
  - disk_cap_left_v2
  - disk_cap_right_v2
  hardware:
  - disk
  - disk_screws
  - m3_nuts
  tool: 2.5 mm hex key
- n: '10'
  text: 'Use the purchased1/4-inch anchors only if their package permits actual #8
    screws, wall material and assembled load. Anchor size alone does not establish
    suitability. Screw length must meet anchor instructions while retaining4.3 mm
    underside clearance. Check for hidden services. The submission cannot list these
    newly purchased external fixings; final screw head-under positions are(-50,70,4.3)
    and(50,70,4.3), directed toward wall.'
  parts: []
  hardware: []
  tool: Wall-appropriate tools per anchor instructions
- n: '11'
  text: Engage both large circles over wall heads and lower box15 mm to retain at
    upper slot ends. Support it while verifying both heads retain it securely. No
    anti-lift latch is provided; avoid upward knocks and cable pull. Plug charger
    through bottom, supervise initial powered use and check temperatures. Front diffuser/outer
    translucent sides remain outside this design.
  parts:
  - back_box_v2
  hardware:
  - disk
  - esp32
  tool: null
