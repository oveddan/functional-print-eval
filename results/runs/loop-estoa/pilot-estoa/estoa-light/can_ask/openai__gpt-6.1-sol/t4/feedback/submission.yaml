parts:
- id: back_box_v2
  role: final
  material: PLA; available black, or separately obtained matte white
  code: "def build(p):\n    import math\n    b=cq.Workplane('XY').circle(p.box_d/2).extrude(p.base_t)\n\
    \    ring=cq.Workplane('XY').workplane(offset=p.base_t).circle(p.box_d/2).circle(p.box_d/2-p.wall_t).extrude(p.rim_z-p.base_t)\n\
    \    cut=cq.Workplane('XY').box(p.opening_w,p.box_d,p.rim_z+2,centered=(True,False,False)).translate((0,p.opening_back_y-p.box_d,p.base_t))\n\
    \    b=b.union(ring.cut(cut))\n    nd=(p.m3_nut_af+p.nut_af_extra)/math.cos(math.pi/6)\n\
    \    depth=p.m3_nut_h+p.nut_depth_extra\n    for x in (-p.disk_pitch/2,p.disk_pitch/2):\n\
    \        post=cq.Workplane('XY').workplane(offset=p.base_t).center(x,0).circle(p.post_r).extrude(p.post_top-p.base_t)\n\
    \        pocket=cq.Workplane('XY').workplane(offset=p.post_top-depth).center(x,0).polygon(6,nd).extrude(depth+1)\n\
    \        shaft=cq.Workplane('XY').workplane(offset=p.post_top-p.disk_screw_l).center(x,0).circle(p.m3_clear/2).extrude(p.disk_screw_l+1)\n\
    \        b=b.union(post.cut(pocket).cut(shaft))\n    for x in (-p.carrier_half_pitch,p.carrier_half_pitch):\n\
    \        for yy in (-p.carrier_half_pitch,p.carrier_half_pitch):\n           \
    \ y=p.carrier_y+yy\n            b=b.union(cq.Workplane('XY').workplane(offset=p.base_t).center(x,y).circle(p.carrier_boss_r).extrude(p.carrier_z-p.base_t))\n\
    \            b=b.cut(cq.Workplane('XY').workplane(offset=p.carrier_z-depth).center(x,y).polygon(6,nd).extrude(depth+1))\n\
    \            b=b.cut(cq.Workplane('XY').center(x,y).circle(p.m3_clear/2).extrude(p.carrier_z+1))\n\
    \    for x in (-p.key_half_pitch,p.key_half_pitch):\n        entry=cq.Workplane('XY').center(x,p.key_y-p.key_travel).circle(p.key_entry_d/2).extrude(p.base_t+1)\n\
    \        stem=cq.Workplane('XY').center(x,p.key_y-p.key_travel/2).slot2D(p.key_travel+p.key_stem_w,p.key_stem_w,90).extrude(p.base_t+1)\n\
    \        b=b.cut(entry).cut(stem)\n    return b"
  print_orientation: Flat rear face on bed. Nut pockets and holes open upward. No
    supports; no nut-pocket roofs or bottom-opening lintel.
  use_orientation: Rear z=0 against wall, +y up, +z toward disk; bottom opening down.
- id: perf_carrier_v2
  role: final
  material: PLA
  code: "def build(p):\n    b=cq.Workplane('XY').box(p.carrier_size,p.carrier_size,p.carrier_t,centered=(True,True,False))\n\
    \    hx=p.pcb_w/2-p.pcb_hole_edge-p.pcb_hole_d/2\n    hy=p.pcb_l/2-p.pcb_hole_edge-p.pcb_hole_d/2\n\
    \    for x in (-hx,hx):\n        for y in (-hy,hy):\n            b=b.union(cq.Workplane('XY').workplane(offset=p.carrier_t).center(x,y).circle(p.pcb_standoff_r).extrude(p.pcb_standoff_h))\n\
    \            b=b.cut(cq.Workplane('XY').workplane(offset=p.carrier_t).center(x,y).circle(p.pilot_d/2).extrude(p.pcb_standoff_h+1))\n\
    \    for x in (-p.carrier_half_pitch,p.carrier_half_pitch):\n        for y in\
    \ (-p.carrier_half_pitch,p.carrier_half_pitch):\n            b=b.cut(cq.Workplane('XY').center(x,y).circle(p.m3_clear/2).extrude(p.carrier_t+1))\n\
    \    return b"
  print_orientation: Flat broad underside on bed, standoffs up; no supports.
  use_orientation: Centre (0,-60,12); rotate90-degree steps with electronics to aim
    USB toward bottom.
- id: disk_cap_left_v2
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.cap_r).circle(p.m3_clear/2).extrude(p.cap_t)"
  print_orientation: Flat annular face on bed, hole vertical; no bridge.
  use_orientation: On left post, underside z91 and top z96.
- id: disk_cap_right_v2
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.cap_r).circle(p.m3_clear/2).extrude(p.cap_t)"
  print_orientation: Flat annular face on bed, hole vertical; no bridge.
  use_orientation: On right post, underside z91 and top z96.
- id: wall_fit_coupon_v2
  role: coupon
  material: PLA
  code: "def build(p):\n    b=cq.Workplane('XY').box(32,44,p.base_t,centered=(True,True,False))\n\
    \    entry=cq.Workplane('XY').center(0,-p.key_travel/2).circle(p.key_entry_d/2).extrude(p.base_t+1)\n\
    \    stem=cq.Workplane('XY').slot2D(p.key_travel+p.key_stem_w,p.key_stem_w,90).extrude(p.base_t+1)\n\
    \    return b.cut(entry).cut(stem)"
  print_orientation: Flat on bed.
  use_orientation: Rear against wall; actual wall screw enters lower large circle,
    then lower coupon15 mm.
- id: nut_fit_coupon_v2
  role: coupon
  material: PLA
  code: "def build(p):\n    import math\n    h=8\n    depth=p.m3_nut_h+p.nut_depth_extra\n\
    \    nd=(p.m3_nut_af+p.nut_af_extra)/math.cos(math.pi/6)\n    b=cq.Workplane('XY').box(24,24,h,centered=(True,True,False))\n\
    \    b=b.cut(cq.Workplane('XY').circle(p.m3_clear/2).extrude(h+1))\n    return\
    \ b.cut(cq.Workplane('XY').workplane(offset=h-depth).polygon(6,nd).extrude(depth+1))"
  print_orientation: Flat bottom on bed, nut recess upward.
  use_orientation: Bench check for nut fit; no bridged roof.
