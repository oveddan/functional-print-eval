  feature: Bottom access opening lintel and shoulders
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - bottom_open_w
  - opening_top_w
  - bottom_open_high
  - proven_bridge
  check:
    method: none
    ref: null
    description: Geometry uses 45-degree shoulders rising from z25 to z62, then a
      40 mm bridge, below the stated 50 mm proven length. Inspect slicer bridge direction
      across x and inspect finished bridge before use.
- id: disk_pattern
  part: disk_template
  feature: Pair of slotted holes
  relation: clears
  hardware: disk_screws
  clearance_mm: null
  params:
  - disk_pitch
  - disk_hole_d
  - m3_clear
  - disk_slot_extra
  check:
    method: template
    ref: disk_template
    description: Both screws must pass freely through template and disk without force.
      The unequal radial edge measurements imply about 0.15 mm midpoint asymmetry,
      accommodated by the slots.
- id: nut_fit
  part: back_box
  feature: Disk nut pockets
  relation: contains
  hardware: m3_nuts
  clearance_mm: null
  params:
  - m3_nut_af
  - m3_nut_h
  - nut_af_allowance
  - nut_height_allowance
  check:
    method: coupon
    ref: fastener_coupon
    description: Nut must enter by hand and not rotate under gentle tightening. Do
      not hammer nuts into PLA.
- id: selftap_fit
  part: perf_carrier
  feature: Four pilot holes
  relation: engages
  hardware: pcb_screws
  clearance_mm: null
  params:
  - selftap_pilot
  - m2_d
  - m2_length
  - pcb_t
  check:
    method: coupon
    ref: fastener_coupon
    description: Test actual screw without splitting or stripping. Verify actual PCB
      thickness leaves at least 3 mm thread engagement and prevents tip from reaching
      the carrier plate.
- id: pcb_pattern
  part: perf_carrier
  feature: 45.8 by 65.8 mm standoff pattern
  relation: supports
  hardware: perfboard
  clearance_mm: null
  params:
  - pcb_w
  - pcb_l
  - pcb_hole_d
  - pcb_hole_edge_gap
  check:
    method: template
    ref: perf_carrier
    description: Assumes all corner holes share the stated inset. Dry-fit all four
      holes and check bosses do not contact solder or conductors.
- id: post_clearance
  part: back_box
  feature: Disk posts adjacent to perfboard
  relation: clears
  hardware: perfboard
  clearance_mm: null
  params:
  - carrier_y
  - pcb_l
  - pcb_w
  - post_r
  check:
    method: measure
    ref: null
    description: With long perfboard dimension vertical, its nearest edge is y=-11.5,
      4 mm below the posts' lowest edge y=-7.5. Rotating board 90 degrees increases
      this nominal clearance. Verify actual protruding components and wires also clear
      posts by at least 3 mm.
- id: internal_clearance
  part: back_box
  feature: Enclosed electronics volume
  relation: clears
  hardware: perfboard
  clearance_mm: null
  params:
  - pcb_t
  - solder_depth
  - component_height
  - disk_rear_depth
  - carrier_z
  - carrier_t
  - pcb_standoff_h
  check:
    method: measure
    ref: null
    description: At least 1 mm between solder and carrier (6 mm nominal underside
      gap), and at least 3 mm between front/rear components and wires. Check actual
      disk rear components against rim, posts, wiring and ESP32. Guessed preview dimensions
      do not establish clearance.
- id: usb_access
  part: back_box
  feature: Large downward access opening
  relation: clears
  hardware: esp32
  clearance_mm: null
  params:
  - bottom_open_w
  - opening_top_w
  - bottom_open_low
  - bottom_open_high
  - usb_mouth_x
  - usb_mouth_y
  - usb_mouth_z
  check:
    method: measure
    ref: null
    description: With carrier oriented appropriately and disk temporarily in place,
      actual charger plug must insert and remove through opening without forcing ESP32
      or sharply bending cable. Stop and redesign from measured port/plug coordinates
      if it cannot.
- id: disk_seating
  part: back_box
  feature: Two disk post tops and rim below disk
  relation: supports
  hardware: disk
  clearance_mm: null
  params:
  - disk_t
  - m3_head_d
  - m3_disk_length
  - disk_back_z
  - disk_nut_z
  - rim_z
  check:
    method: measure
    ref: null
    description: 'M3 heads need safe 5.5 mm landing circles. Post tops must bear on
      safe PCB areas; rim must not touch rear solder/components. M3x16 nominally suits
      approximately 0.8–4 mm disk thickness: verify actual full nut engagement and
      no bottoming. Do not clamp a trace or component.'
- id: wall_mount
  part: back_box
  feature: Two keyholes 100 mm apart
  relation: seats
  hardware: wall_screws
  clearance_mm: null
  params:
  - wall_hole_half_pitch
  - m4_d
  - m4_head_d
  - base_t
  check:
    method: measure
    ref: null
    description: No suitable anchors are in the inventory. Once resolved, verify anchors
      suit wall/load, both heads fully overlap narrow slots, rear lies flat, and both
      fasteners engage before releasing. Mount has no anti-lift latch.
manual:
- n: '1'
  text: Use this revision, not the earlier files. With electronics unpowered, print
    disk_template and fastener_coupon first. Verify disk screw alignment, M3 nut insertion
    and M2 pilot fit. These small tests are required before committing to the final
    parts.
  parts:
  - disk_template
  - fastener_coupon
  hardware:
  - disk
  - disk_screws
  - m3_nuts
  - pcb_screws
  tool: null
- n: '2'
  text: Measure actual PCB thicknesses and protruding solder/components; confirm safe
    5.5 mm head landing circles at disk holes. Unknown dimensions were not solved
    by this revision. If head landings are unsafe, holes disagree, or component clearances
    fail, stop rather than force the assembly.
  parts: []
  hardware:
  - disk
  - perfboard
  - esp32
  tool: Calipers or ruler
- n: '3'
  text: Print back_box and perf_carrier with broad rear faces down, 0.2 mm layers,
    4 perimeters, 5 top/bottom layers and about 30% infill. No supports intended.
    In the slicer confirm that the opening roof bridges across its 40 mm width, not
    along another unsupported path. Inspect nut roofs and opening bridge after printing.
    Black PLA is listed stock; matte white requires separately obtained PLA.
  parts:
  - back_box
  - perf_carrier
  hardware: []
  tool: 3D printer
- n: '4'
  text: From the rear of back_box, insert four M3 nuts into carrier-mount pockets
    and seat them against the pocket roofs. Temporarily thread the carrier screws
    to check that the nuts seat without spinning. These nuts need not remain captive
    while loose; hold them during first assembly.
  parts:
  - back_box
  hardware:
  - m3_nuts
  - carrier_screws
  tool: null
- n: '5'
  text: Dry-fit perfboard on perf_carrier's four standoffs. Confirm all holes align
    and bosses avoid solder and exposed conductors. Attach with four M2x6 self-tapping
    screws using light torque. Require at least 1 mm solder clearance, at least 3
    mm screw engagement, and no screw tip reaching the carrier plate.
  parts:
  - perf_carrier
  hardware:
  - perfboard
  - esp32
  - pcb_screws
  tool: Driver matching actual self-tapping heads
- n: '6'
  text: Place carrier at its mounting bosses. Rotate carrier and electronics together
    in 90-degree increments to aim the actual USB connector toward the bottom opening.
    Fit four M3x12 screws into the rear-loaded nuts. Check components and wires clear
    disk posts by at least 3 mm. Assembly coordinates show only the initial orientation,
    not a measured USB position.
  parts:
  - back_box
  - perf_carrier
  hardware:
  - carrier_screws
  - m3_nuts
  - perfboard
  - esp32
  tool: 2.5 mm hex key
- n: '7'
  text: Insert the remaining two M3 nuts into disk-post pockets from their +y sides.
    Route the existing four disk wires clear of holes, screw tips, rim and access
    opening. Leave gentle bends and slack for disk removal. Keep conductors away from
    metal fasteners.
  parts:
  - back_box
  hardware:
  - m3_nuts
  - disk
  - perfboard
  tool: null
- n: '8'
  text: 'Trial-place disk on post tops with input wires toward +y. Verify rim and
    post tops touch no solder/component and leave at least 3 mm between opposing components
    and wires. Trial-insert and remove the actual USB charger plug through the bottom
    opening with disk held in position. If it does not work without force, stop: measure
    port/plug location and redesign rather than cutting blindly near electronics.'
  parts:
  - back_box
  - perf_carrier
  hardware:
  - disk
  - esp32
  - perfboard
  tool: null
- n: '9'
  text: Only after fit checks pass, secure disk with two M3x16 screws, lightly tightened.
    Verify full nut engagement and no bottoming using actual PCB thickness; illustrated
    screw-head locations assume 1.6 mm, not a measurement. Do not bend disk or clamp
    exposed traces, LEDs or solder.
  parts:
  - back_box
  hardware:
  - disk
  - disk_screws
  - m3_nuts
  tool: 2.5 mm hex key
- n: '10'
  text: Wall mounting is blocked by missing suitable anchorage. Do not substitute
    PCB screws, printed anchors or M4 machine screws driven directly into an unsuitable
    wall. Obtain or identify load-rated wall-specific female M4 anchorage before proceeding.
    Two M4x20 screw positions are 100 mm apart horizontally; nominal head undersides
    are 4 mm off the flat wall, leaving 16 mm of screw below the wall plane. Actual
    anchorage must accept that engagement and the complete light's load.
  parts:
  - back_box
  hardware:
  - wall_screws
  tool: Tools appropriate to validated wall anchorage
- n: '11'
  text: After anchorage is validated, engage both large keyhole openings over heads
    and lower box 10 mm until both shanks seat in narrow upper ends. Verify both are
    engaged and back sits flat before releasing. No anti-lift latch is included; keep
    cable slack and avoid upward knocks or cable pulling.
  parts:
  - back_box
  hardware:
  - wall_screws
  tool: null
- n: '12'
  text: 'Plug USB in through the bottom without loading the ESP32. This mechanical
    design does not validate the electrical power path: a 255-LED disk can draw far
    more than an ESP32 board or USB supply safely carries. Verify wiring, connector
    ratings, supply capacity and firmware brightness limits separately; do not assume
    full-white operation is safe. Supervise initial use and check temperatures. Keep
    PLA out of direct sun and away from heat.'
  parts: []
  hardware:
  - esp32
  - perfboard
  - disk
  tool: null
