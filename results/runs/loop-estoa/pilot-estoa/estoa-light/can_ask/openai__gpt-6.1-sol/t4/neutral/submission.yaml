task: estoa-light
note: 'REVISED design: replaces the unsupported 114 mm opening roof with 45-degree
  shoulders and a 40 mm bridge; moves carrier centre from y=-42 to -46.5 to avoid
  PCB/post interference. Supersedes the previous submission. This remains a fit-gated
  design, not a verified fit: PCB thicknesses, disk rear components, USB location,
  safe screw-head landing areas and wall anchorage are unknown. Do not force assembly
  if checks fail. Electronics assembly coordinates containing guessed dimensions are
  illustrative, explicitly not measured. Front diffuser and translucent sides are
  excluded. Listed stock is black PLA; white requires obtaining different filament.'
questions:
- text: What changed after review?
  answer: Bottom opening now has 45-degree shoulders and a 40 mm bridge instead of
    a 114 mm bridge. Carrier moved down 4.5 mm, establishing 4 mm nominal board-edge
    clearance from disk posts in its initial orientation.
- text: Are disk diameter and thickness verified?
  answer: Diameter is conditionally inferred as 241.58 mm, not directly measured.
    Thickness is unknown.
- text: Is the PCB mounting pattern measured?
  answer: 'Inferred from measured 50 x 70 mm board, 2.4 mm holes and 0.9 mm edge gaps:
    45.8 x 65.8 mm. Requires dry-fit verification.'
- text: Is actual USB position known?
  answer: No. ESP32 frame in assembly is an explicitly guessed preview. Carrier rotation
    and actual plug test are mandatory; redesign if access fails.
- text: Are component heights, rear protrusions and safe disk head landings verified?
  answer: null
- text: Are suitable wall anchors available?
  answer: null
- text: Are all assembly heights measured?
  answer: No. Disk head height and perfboard top/screw heights assume 1.6 mm PCB thickness
    for illustration only. Printed seating planes are fixed; actual electronics frames
    must be updated after thickness and USB measurements.
