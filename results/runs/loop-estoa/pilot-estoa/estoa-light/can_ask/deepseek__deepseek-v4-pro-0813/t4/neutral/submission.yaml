    method: measure
    ref: null
    description: Confirm the USB port faces the wall with the slot and the plug height
      lines up.
manual:
- n: '1'
  text: Print the box (back wall flat on the bed).
  parts:
  - box
  hardware: []
  tool: null
- n: '2'
  text: 'Test the disc mount: place the disc on the front flange; its two holes should
    line up with the box''s M3 holes.'
  parts:
  - box
  hardware:
  - disc_screw
  tool: null
- n: '3'
  text: Press four of your own M2x6 self-tapping screws up through the perfboard's
    corner holes into the printed standoff pilots, ESP32 facing forward.
  parts:
  - box
  hardware: []
  tool: null
- n: '4'
  text: Route the four wires from the perfboard to the disc's input connector at 12
    o'clock, tucking slack into the void.
  parts:
  - box
  hardware: []
  tool: null
- n: '5'
  text: Screw the disc onto the front flange with two M3x8 screws through the disc's
    holes.
  parts:
  - box
  hardware:
  - disc_screw
  tool: null
- n: '6'
  text: Before closing up, confirm the USB port faces the slotted wall and a plug
    reaches it; then hang the box on two wall screws via the keyhole slots.
  parts:
  - box
  hardware: []
  tool: null
