parts:
- id: box
  role: final
  material: PLA (matte white)
  code: "def build(p):\n    import math\n    R = p['disc_od']/2.0 + p['disc_clearance']\n\
    \    wall = p['box_wall_t']\n    depth = p['box_void_depth'] + wall\n    # outer\
    \ round shell\n    box = cq.Workplane('XY').circle(R).extrude(depth)\n    # hollow\
    \ from the front, leaving the back wall\n    box = box.faces('>Z').workplane().circle(R\
    \ - wall).cutBlind(-depth + wall)\n    # front flange with disc mounting holes,\
    \ honoring hole-pair angle\n    flange_t = 2.5\n    half = p['disc_hole_pitch']\
    \ / 2.0\n    ang = math.radians(p['disc_hole_angle'])\n    x1, y1 = half*math.cos(ang),\
    \ half*math.sin(ang)\n    rad = p['disc_hole_d']/2.0 + 0.4\n    flange = cq.Workplane('XY').circle(R).extrude(flange_t)\n\
    \    flange = (flange.faces('>Z').workplane()\n              .pushPoints([(x1,\
    \ y1), (-x1, -y1)]).hole(rad*2))\n    box = box.union(flange)\n    # perfboard\
    \ standoffs at its four corner-hole centres\n    inset = p['perf_hole_inset']\n\
    \    l, w = p['perf_l'], p['perf_w']\n    cx, cy = l/2.0 - inset, w/2.0 - inset\n\
    \    pts = [(cx, cy), (-cx, cy), (-cx, -cy), (cx, -cy)]\n    sh = p['perf_top_z']\
    \ - p['perf_t']  # pilot column from back wall to perfboard underside\n    box\
    \ = (box.faces('<Z').workplane().pushPoints(pts)\n           .circle(p['perf_hole_d']/2.0\
    \ + 1.0).extrude(sh))\n    box = (box.faces('<Z').workplane().pushPoints(pts).hole(1.6,\
    \ sh))\n    # keyhole slots cut all the way through the back wall\n    box = (box.faces('>Z').workplane()\n\
    \           .pushPoints([(p['wall_screw_pitch']/2.0, 0), (-p['wall_screw_pitch']/2.0,\
    \ 0)])\n           .slot2D(p['keyhole_slot_l'], p['keyhole_id_top'], 0)\n    \
    \       .cutBlind(-wall))\n    # USB-C slot in the top side wall, aligned to the\
    \ port height in box coords\n    zc = wall + p['perf_top_z'] + p['usb_recep_bottom']\
    \ + p['usb_recep_h']/2.0\n    box = (box.faces('>Y').workplane().center(0, zc)\n\
    \           .slot2D(p['usb_slot_w'], p['usb_recep_h'] + 4.0, 0)\n           .cutBlind(-wall))\n\
    \    return box"
  print_orientation: back wall (-z face) flat on the bed, void and flange facing up
  use_orientation: back wall against the wall; +z out toward the disc; +y up
