task: estoa-light
note: 'Box (back housing) for a wall-mounted Adafruit DotStar 255-LED disc. Disc screws
  onto a front flange with two M3x8 screws through its measured 33.5-mm-pitch mounting
  holes; perfboard+ESP32 mount inside on four printed standoffs (person''s own M2x6
  self-tapping screws); two keyhole slots hang it on wall screws (cut all the way
  through the back wall); a slot in the side wall reaches the ESP32''s USB-C port.
  Front/top frosted cover comes later. Open question: which side the USB port faces
  was never measured (the tool only returned the perfboard size), so the slot is placed
  on the top wall and made generous, and is flagged as a question to confirm before
  printing.'
