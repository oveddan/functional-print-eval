parts:
- id: box
  role: final
  material: matte white PLA
  code: "import cadquery as cq\n\ndef build(p):\n    Ro = p.disk_d/2 + p.box_wall\n\
    \    Ri = p.disk_d/2\n    base = cq.Workplane('XY').circle(Ro).extrude(p.base_t)\n\
    \    wall = (cq.Workplane('XY').circle(Ro)\n            .circle(Ri)\n        \
    \    .extrude(p.box_depth))\n    box = base.union(wall)\n\n    # two bosses near\
    \ centre for the disk's two mounting screws\n    hr = p.disk_holes_c_c / 2\n \
    \   boss_d = p.m3_head_d + 8\n    boss_h = p.disk_thick + 4\n    boss = cq.Workplane('XY').circle(boss_d/2).extrude(boss_h)\n\
    \    for x in (-hr, hr):\n        box = box.union(boss.translate((x, 0, p.base_t)))\n\
    \n    pilot = cq.Workplane('XY').circle(p.m3_pilot_d/2).extrude(100)\n    for\
    \ x in (-hr, hr):\n        box = box.cut(pilot.translate((x, 0, 0)))\n\n    sd\
    \ = p.perf_corner_hole_d + 4.5\n    ix = p.perf_corner_hole_inset\n    px = [-p.perf_l/2\
    \ + ix, p.perf_l/2 - ix]\n    py = [-p.perf_w/2 + ix, p.perf_w/2 - ix]\n    stall\
    \ = cq.Workplane('XY').circle(sd/2).extrude(p.perf_standoff_h)\n    for sx in\
    \ px:\n        for sy in py:\n            box = box.union(stall.translate((sx,\
    \ sy, p.base_t)))\n\n    for sx in px:\n        for sy in py:\n            box\
    \ = box.cut(pilot.translate((sx, sy, p.base_t + p.perf_standoff_h - 5)))\n\n \
    \   slot_h = p.perf_standoff_h + 6\n    slot = (cq.Workplane('XZ')\n         \
    \   .rect(p.usbc_w, p.usbc_h)\n            .extrude(4*p.box_wall))\n    box =\
    \ box.cut(slot.translate((Ro, 0, p.base_t + slot_h)))\n\n    return box\n"
  print_orientation: base down on the bed (-z face down), open side (+z) facing up
  use_orientation: base against the wall; the disc mounts over the open side, its
    LED face pointing away from the wall
