parts:
- id: box
  role: final
  material: matte white PLA
  code: "import cadquery as cq\n\ndef build(p):\n    Ro = p.disk_d/2 + p.box_wall\n\
    \    Ri = p.disk_d/2\n    base = cq.Workplane('XY').circle(Ro).extrude(p.base_t)\n\
    \    wall = cq.Workplane('XY').circle(Ro).circle(Ri).extrude(p.box_depth)\n  \
    \  box = base.union(wall)\n\n    hr = p.disk_holes_c_c/2\n    boss_d = p.m3_head_d\
    \ + 6\n    boss = cq.Workplane('XY').circle(boss_d/2).extrude(p.box_depth - p.base_t)\n\
    \    for x in (-hr, hr):\n        box = box.union(boss.translate((x, 0, p.base_t)))\n\
    \n    pilot = cq.Workplane('XY').circle(p.m3_pilot_d/2).extrude(p.box_depth -\
    \ p.base_t - 2)\n    for x in (-hr, hr):\n        box = box.cut(pilot.translate((x,\
    \ 0, p.base_t + 2)))\n\n    sd = p.perf_corner_hole_d + 4.5\n    ix = p.perf_corner_hole_inset\n\
    \    px = [-p.perf_l/2 + ix, p.perf_l/2 - ix]\n    py = [-p.perf_w/2 + ix, p.perf_w/2\
    \ - ix]\n    stall = cq.Workplane('XY').circle(sd/2).extrude(p.perf_standoff_h)\n\
    \    for sx in px:\n        for sy in py:\n            box = box.union(stall.translate((sx,\
    \ sy, p.base_t)))\n\n    spilot = cq.Workplane('XY').circle(p.m3_pilot_d/2).extrude(p.perf_standoff_h\
    \ - 3)\n    for sx in px:\n        for sy in py:\n            box = box.cut(spilot.translate((sx,\
    \ sy, p.base_t + 3)))\n\n    slot = cq.Workplane('XY').box(4*p.box_wall, p.usbc_w,\
    \ p.usbc_h)\n    box = box.cut(slot.translate(((Ro+Ri)/2, 0, p.usbc_z)))\n\n \
    \   return box\n"
  print_orientation: base face down on the bed, walls pointing up
  use_orientation: base against the wall; open side faces out, disc mounts onto the
    rim/bosses
- id: disk_boss_coupon
  role: coupon
  material: matte white PLA
  code: "import cadquery as cq\n\ndef build(p):\n    hr = p.disk_holes_c_c/2\n   \
    \ boss_d = p.m3_head_d + 6\n    plate = cq.Workplane('XY').rect(60, 30).extrude(p.base_t)\n\
    \    boss = cq.Workplane('XY').circle(boss_d/2).extrude(8)\n    plate = plate.union(boss.translate((-hr,\
    \ 0, p.base_t)))\n    plate = plate.union(boss.translate((hr, 0, p.base_t)))\n\
    \    pilot = cq.Workplane('XY').circle(p.m3_pilot_d/2).extrude(6)\n    plate =\
    \ plate.cut(pilot.translate((-hr, 0, p.base_t + 2)))\n    plate = plate.cut(pilot.translate((hr,\
    \ 0, p.base_t + 2)))\n    return plate\n"
  print_orientation: plate flat on the bed, bosses up
  use_orientation: n/a
