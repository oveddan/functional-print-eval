task: estoa-light
note: 'Corrected box. Fixes: (1) all pilot holes blind, so no screw tip/head pokes
  out the back; (2) disk bosses rise from base to rim, disk mounts on rim with screws
  in from the front; (3) USB-C slot is a clean axis-aligned through-rectangle in the
  +x wall; (4) depth 40 mm so electronics sit fully inside; (5) coupon to verify disc
  screw spacing.'
