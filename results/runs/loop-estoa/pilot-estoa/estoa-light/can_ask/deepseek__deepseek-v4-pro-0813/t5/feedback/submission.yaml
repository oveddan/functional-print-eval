manual:
- n: '1'
  text: Print disc_hole_test and usbc_slot_test; check the M3 screws pass the disc's
    two holes at 33.5 mm pitch, and your USB-C cable/plug passes the 16x14 slot.
  parts:
  - disc_hole_test
  - usbc_slot_test
  hardware:
  - disc_screw
  tool: null
- n: '2'
  text: Print box_front (front face down) and box_back (wall face down) in matte white
    PLA.
  parts:
  - box_front
  - box_back
  hardware: []
  tool: null
- n: '3'
  text: Heat-set three M3x4x5 inserts into the three bosses on the inner wall of box_front.
  parts:
  - box_front
  hardware:
  - cover_insert
  tool: soldering iron
- n: '4'
  text: Screw the perfboard onto the four standoffs with four M2x6 self-tappers (underside
    of board toward box front).
  parts:
  - box_front
  hardware:
  - perf_screw
  tool: 1.5 mm hex key
- n: '5'
  text: Plug the USB-C cable into the ESP32 and route it out through the +x side slot.
  parts:
  - box_front
  hardware: []
  tool: null
- n: '6'
  text: Attach box_back with three M3x8 into the inserts; heads sit flush in the counterbores
    so the box sits flat on the wall.
  parts:
  - box_back
  hardware:
  - cover_screw
  tool: 2.5 mm hex key
- n: '7'
  text: Set the disc on the front face, LED side out, its two holes over ±16.75 mm
    and its input wires through the top slot.
  parts:
  - box_front
  hardware: []
  tool: null
- n: '8'
  text: Screw two M3x8 from the front through the disc into the M3 nuts in the pockets.
  parts:
  - box_front
  hardware:
  - disc_screw
  - disc_nut
  tool: 2.5 mm hex key
- n: '9'
  text: 'Hang: drive two #8 round-head screws (heads <=9 mm, ~100 mm apart, level)
    and hook the keyholes, sliding the box down.'
  parts:
  - box_back
  hardware: []
  tool: null
