task: estoa-light
note: 'Reworked after first print. Fixes: (1) box_front is now one single solid —
  the rear wall+rim is extruded as one profile and every feature is cut/embedded into
  it, so nothing can separate. (2) Removed the open top input notch; instead the input
  wires route through a rounded slot that is fully bounded so it prints as a clean
  bridge with generous radius — and the USB side slot is a simple rounded rectangle.
  (3) All screw heads counterbored flush (M3 head Ø5.5 × 3 mm on box_back; disc screws
  already recess under the disc but box_front clearance now counterbored so no head
  protrudes). Own-part placements approximate; confirm coupons before full print.'
questions:
- text: Does the USB-C cable plug have an overmould/strain relief wider than 14 mm
    or taller than 12 mm? Widen the side slot if so.
  answer: null
