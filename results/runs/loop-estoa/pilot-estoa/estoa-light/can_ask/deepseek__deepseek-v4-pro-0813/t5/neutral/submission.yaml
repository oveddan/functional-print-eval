task: estoa-light
note: 'Box behind an Adafruit DotStar 255-LED disc (Ø ~205 mm), matte white, wall-hung
  via two #8 screws in keyholes.


  Geometry recap:

  - box_front: Ø214 round plate (3 mm) + annular wall (4 mm, inner Ø206) to total
  depth 29 mm. Two M3 nut pockets on the inner face at ±16.75 mm for the disc. Four
  Ø6 standoffs (5 mm tall, Ø1.7 pilot) at the perfboard''s corner holes (±32.9, ±22.9).
  A 14×12 mm USB-C slot through the +x wall at z=22. A 14 mm radial notch at 12 o''clock
  for the disc''s input wires. Three Ø8 bosses (with Ø4.3 insert holes) at r=97, 30°/150°/270°
  for the back cover.

  - box_back: Ø206 plate (2 mm), three Ø3.2 cover-screw holes matching the bosses,
  and two keyholes (Ø10 head hole + downward Ø5 slot, 100 mm apart) for hanging.


  Own-part orientation (assembly frame: z=0 at wall, +z away from wall, +y up):

  - own:led-disk: back-face centre at (0,0,29), LEDs facing +z, input wires pointing
  +y (up); its two screw holes land on the horizontal axis at ±16.75 mm.

  - own:perfboard: top-face centre at (0,0,19.4) with components facing the wall;
  70 mm side along x, so its corner holes align with the standoffs.

  - own:esp32: mounted on the perfboard with its USB-C port facing +x (toward the
  side slot); port mouth centred near (20, 4, 11.9).


  Unmeasured values handled conservatively and flagged as guessed in params: disc
  thickness (1.6 mm), disc back-face protrusion (cleared by the 5 mm standoffs), input
  connector width (14 mm notch), charger/cable size (14×12 slot). Print the two coupons
  first to confirm the disc hole pitch and the USB-C cable pass.'
questions:
- text: Does the USB-C cable you plug into the ESP32 have an overmould or strain-relief
    near the plug that is wider than 14 mm or taller than 12 mm? If so, widen the
    side slot.
  answer: null
