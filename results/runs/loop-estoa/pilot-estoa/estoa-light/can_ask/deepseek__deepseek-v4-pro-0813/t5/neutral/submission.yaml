parts:
- id: box_front
  role: final
  material: PLA matte white
  code: "import cadquery as cq\nimport math\ndef build(p):\n    bo_r = p.box_od/2.0\n\
    \    ir = bo_r - p.wall_t\n    front = cq.Workplane('XY').circle(bo_r).extrude(p.front_t)\n\
    \    wall = cq.Workplane('XY').circle(bo_r).circle(ir).extrude(p.front_t + p.inner_depth)\n\
    \    shape = front.union(wall)\n    for sx in (-p.disc_hole_pitch/2.0, p.disc_hole_pitch/2.0):\n\
    \        shape = shape.cut(cq.Workplane('XY').center(sx,0).circle(p.m3_clear_d/2.0).extrude(p.front_t+0.5).translate((0,0,-0.5)))\n\
    \        shape = shape.cut(cq.Workplane('XY').center(sx,0).circle(p.m3_nut_pocket_d/2.0).extrude(p.m3_nut_h+0.2).translate((0,0,p.front_t)))\n\
    \    hx = p.perf_l/2.0 - p.perf_inset\n    hy = p.perf_w/2.0 - p.perf_inset\n\
    \    for x in (-hx, hx):\n        for y in (-hy, hy):\n            post = cq.Workplane('XY').center(x,y).circle(p.standoff_d/2.0).extrude(p.stand_h).translate((0,0,p.front_t))\n\
    \            hole = cq.Workplane('XY').center(x,y).circle(p.m2_pilot_d/2.0).extrude(p.stand_h+0.5).translate((0,0,p.front_t-0.5))\n\
    \            shape = shape.union(post).cut(hole)\n    shape = shape.cut(cq.Workplane('XY').box(p.wall_t+6,\
    \ p.usb_slot_w, p.usb_slot_h).translate((bo_r - p.wall_t/2.0, 0, p.usb_slot_z)))\n\
    \    yc = (ir + bo_r)/2.0\n    shape = shape.cut(cq.Workplane('XY').box(p.disc_input_notch_w,\
    \ bo_r - ir + 6, p.front_t + p.inner_depth + 1).translate((0, yc, (p.front_t +\
    \ p.inner_depth)/2.0)))\n    boss_r = ir - 6\n    for ang in (30.0, 150.0, 270.0):\n\
    \        a = math.radians(ang)\n        bx = boss_r*math.cos(a); by = boss_r*math.sin(a)\n\
    \        bz = p.front_t + p.inner_depth - p.boss_h\n        shape = shape.union(cq.Workplane('XY').center(bx,by).circle(p.boss_d/2.0).extrude(p.boss_h).translate((0,0,bz)))\n\
    \        shape = shape.cut(cq.Workplane('XY').center(bx,by).circle(p.insert_hole_d/2.0).extrude(p.boss_h+0.5).translate((0,0,bz-0.5)))\n\
    \    return shape"
  print_orientation: front face (disc side, z=0) flat on the bed
  use_orientation: front face outward toward the disc; +z points back toward the wall
- id: box_back
  role: final
  material: PLA matte white
  code: "import cadquery as cq\nimport math\ndef build(p):\n    shape = cq.Workplane('XY').circle(p.cover_od/2.0).extrude(p.cover_t)\n\
    \    ir = p.box_od/2.0 - p.wall_t\n    boss_r = ir - 6\n    for ang in (30.0,\
    \ 150.0, 270.0):\n        a = math.radians(ang)\n        bx = boss_r*math.cos(a);\
    \ by = boss_r*math.sin(a)\n        shape = shape.cut(cq.Workplane('XY').center(bx,by).circle(p.cover_hole_d/2.0).extrude(p.cover_t+1))\n\
    \    for sx in (-p.keyhole_spacing/2.0, p.keyhole_spacing/2.0):\n        shape\
    \ = shape.cut(cq.Workplane('XY').center(sx,0).circle(p.keyhole_big/2.0).extrude(p.cover_t+1))\n\
    \        shape = shape.cut(cq.Workplane('XY').center(sx, -p.keyhole_big/2.0 -\
    \ p.keyhole_slot_len/2.0).rect(p.keyhole_small, p.keyhole_slot_len).extrude(p.cover_t+1))\n\
    \    return shape"
  print_orientation: wall-facing face (z=0) flat on the bed
  use_orientation: against the wall; +z points into the box
- id: disc_hole_test
  role: coupon
  material: PLA
  code: "import cadquery as cq\ndef build(p):\n    s = cq.Workplane('XY').box(60,\
    \ 25, 3)\n    for sx in (-p.disc_hole_pitch/2.0, p.disc_hole_pitch/2.0):\n   \
    \     s = s.cut(cq.Workplane('XY').center(sx,0).circle(p.disc_hole_d/2.0).extrude(4))\n\
    \        s = s.cut(cq.Workplane('XY').center(sx,0).circle(p.m3_head_d/2.0).extrude(2))\n\
    \    return s"
  print_orientation: flat, z=0 down
  use_orientation: n/a
- id: usbc_slot_test
  role: coupon
  material: PLA
  code: "import cadquery as cq\ndef build(p):\n    s = cq.Workplane('XY').rect(p.usb_slot_w+12,\
    \ p.usb_slot_h+12).extrude(p.wall_t)\n    s = s.cut(cq.Workplane('XY').rect(p.usb_slot_w,\
    \ p.usb_slot_h).extrude(p.wall_t+2))\n    return s"
  print_orientation: flat, z=0 down
  use_orientation: n/a
