parts:
- id: box
  role: final
  material: PLA (matte white)
  code: "import cadquery as cq\n\ndef build(p):\n    R = p.disk_radius + p.wall\n\
    \    box = cq.Workplane('XY').circle(R).extrude(p.box_depth)\n    inner = cq.Workplane('XY').circle(p.disk_radius).translate((0,0,p.back_thick)).extrude(p.box_depth\
    \ - p.back_thick)\n    box = box.cut(inner)\n    disk_seat_z = p.box_depth - p.disk_t\
    \ - p.disk_lip_h\n    box = box.cut(cq.Workplane('XY').circle(p.disk_radius +\
    \ p.disk_lip_t).translate((0,0,disk_seat_z)).extrude(p.disk_lip_h))\n    box =\
    \ box.cut(cq.Workplane('XY').circle(p.disk_radius - p.disk_lip_t).translate((0,0,disk_seat_z)).extrude(p.disk_lip_h))\n\
    \    for x in (-p.disk_hole_radius, p.disk_hole_radius):\n        box = box.union(cq.Workplane('XY').circle(3.0).translate((x,0,disk_seat_z)).extrude(p.disk_lip_h))\n\
    \    px = p.perf_l/2 - p.perf_hole_inset - p.perf_hole_d/2\n    py = p.perf_w/2\
    \ - p.perf_hole_inset - p.perf_hole_d/2\n    for xx in (-px, px):\n        for\
    \ yy in (-py, py):\n            box = box.union(cq.Workplane('XY').circle(2.5).translate((xx,yy,0)).extrude(p.back_thick+6))\n\
    \    usb_y = p.disk_radius - p.usb_slot_inset\n    slot = cq.Workplane('XY').box(p.usb_port_w+2,\
    \ 10, centered=True).translate((0, usb_y, p.box_depth - p.disk_lip_h - p.usb_port_h/2\
    \ - 1)).extrude(12)\n    box = box.cut(slot)\n    for hx in (-p.hang_inset, p.hang_inset):\n\
    \        box = box.cut(cq.Workplane('XY').circle(p.hang_d/2).translate((hx,0,-1)).extrude(p.back_thick+2))\n\
    \    return box\n"
  print_orientation: back face (z=0) on the bed, cavity opening up
  use_orientation: back against wall, +z opening toward viewer
