task: estoa-light
note: 'Reworked into a complete back box: heat-set-insert bosses for the disk''s two
  M3 holes, four M2 posts for the perfboard, a top USB-C opening for the ESP32''s
  port, a top wire gap for the disk''s 4-wire connector, and two keyhole slots to
  hang it on wall screws.'
