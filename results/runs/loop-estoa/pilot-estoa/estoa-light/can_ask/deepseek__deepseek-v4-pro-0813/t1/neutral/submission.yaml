parts:
- id: box
  role: final
  material: PLA (matte white)
  code: "import cadquery as cq\n\ndef build(p):\n    R = p.rim_radius\n    box = (cq.Workplane('XY').circle(R).extrude(p.depth)\n\
    \           .cut(cq.Workplane('XY').circle(p.disk_radius)\n                .translate((0,\
    \ 0, p.wall)).extrude(p.depth - p.wall)))\n\n    for sx in (p.disk_hole_offset,\
    \ -p.disk_hole_offset):\n        box = box.union(cq.Workplane('XY').circle(p.boss_r).center(sx,\
    \ 0).extrude(p.depth))\n        box = box.cut(cq.Workplane('XY').center(sx, 0).circle(p.insert_hole_d\
    \ / 2)\n                      .translate((0, 0, p.depth - p.insert_depth)).extrude(p.insert_depth))\n\
    \n    cx = p.perf_w / 2 - p.perf_hole_center_inset\n    cy = p.perf_l / 2 - p.perf_hole_center_inset\n\
    \    for (px, py) in ((cx, cy), (-cx, cy), (cx, -cy), (-cx, -cy)):\n        box\
    \ = box.union(cq.Workplane('XY').circle(p.post_r).center(px, py).extrude(p.post_top))\n\
    \        box = box.cut(cq.Workplane('XY').center(px, py).circle(p.m2_pilot_d /\
    \ 2)\n                      .translate((0, 0, p.post_top - p.pilot_depth)).extrude(p.pilot_depth))\n\
    \n    box = box.cut(cq.Workplane('XY').box(p.usb_slot_w, p.wall + 8, p.usb_slot_h)\n\
    \                  .translate((p.usb_x, p.rim_radius - p.wall / 2, p.usb_z)))\n\
    \n    box = box.cut(cq.Workplane('XY').box(p.wire_slot_w, p.wall + 8, p.depth)\n\
    \                  .translate((0, p.rim_radius - p.wall / 2, p.depth / 2)))\n\n\
    \    for hx in (p.hang_x, -p.hang_x):\n        k = (cq.Workplane('XY').circle(p.hang_hole_d\
    \ / 2).center(hx, p.hang_y)\n             .union(cq.Workplane('XY').rect(p.hang_slot_w,\
    \ p.hang_slot_l)\n                    .center(hx, p.hang_y - p.hang_slot_l / 2)))\n\
    \        box = box.cut(k.extrude(p.wall))\n\n    return box\n"
  print_orientation: back face (z=0) flat on the bed, opening facing up
  use_orientation: back against the wall, +z out toward the disc/viewer, +y up
