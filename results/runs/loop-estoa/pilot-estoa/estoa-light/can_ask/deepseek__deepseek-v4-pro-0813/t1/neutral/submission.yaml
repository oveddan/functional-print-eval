manual:
- n: '1'
  text: Print the box flat on its back face (opening up).
  parts:
  - box
  hardware: []
  tool: null
- n: '2'
  text: Heat-set the two M3x4x5 inserts into the two bosses on the box's front face
    (one at 3 o'clock, one at 9 o'clock).
  parts:
  - box
  hardware:
  - h_insert
  tool: soldering iron (heat-set tip)
- n: '3'
  text: Mount the perfboard (ESP32 facing out toward the disc) onto the four posts
    using four M2 self-tapping screws through its corner holes.
  parts:
  - box
  hardware:
  - h_perf_screw
  tool: null
- n: '4'
  text: Hang the box on the two wall screws using the keyhole slots.
  parts:
  - box
  hardware: []
  tool: null
- n: '5'
  text: Route the disc's 4-wire connector through the top gap and plug it into the
    perfboard, then screw the disc to the box with the two M3x10 screws through the
    disc's two holes into the inserts. Plug the USB-C charger into the ESP32's port
    through the top opening.
  parts:
  - box
  hardware:
  - h_disk_screw
  tool: null
