task: estoa-light
note: 'Changes from the first print. (1) The hole roofs that printed as tangles are
  fixed. The keyholes are now a 2.4 mm lip at the wall face, with a window behind
  it that is open to the inside of the box, so nothing bridges over a hole. Each M3
  counterbore keeps a one-layer membrane: pierce it with a 3 mm drill or an M3 screw.
  (2) The keyholes are redone for your #8 screws (9 mm heads). Before, the lip was
  on the wrong side of the head, so the heads pulled through, and the channel was
  narrower than the head. Now a 10.2 mm round hole passes the head, the window is
  9.8 mm wide, and the slot is 5.0 mm wide, so a 2 mm lip on each side holds the head.
  Head height 3.6 mm is assumed. (3) The inserts: the bosses are 10 mm instead of
  8 mm, so the wall around each insert is 2.85 mm instead of 1.85 mm, and the back
  plate is 8 mm thick. The plate screws are now M3x10. Still unverified: disc diameter
  and connector position (wire slot is a guess at y = 29..41), which way the ESP32
  is offset on the perfboard, perfboard thickness, and which USB-C port you use (the
  slot is 26 x 10 mm to cover either).'
