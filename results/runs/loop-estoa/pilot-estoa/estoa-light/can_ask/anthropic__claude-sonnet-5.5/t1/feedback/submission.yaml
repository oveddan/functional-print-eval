parts:
- id: box
  role: final
  material: matte white PLA
  code: "import math\ndef build(p):\n    R_in = math.hypot(p.perf_w/2, p.perf_l/2)\
    \ + p.board_clear\n    R_out = R_in + p.wall\n    H = p.front_t + p.gap_front\
    \ + p.esp_h + p.perf_t + p.back_clear\n    top = p.front_t + p.gap_front + p.esp_h\n\
    \    def cyl(pts, d, z0, h):\n        return cq.Workplane('XY').workplane(offset=z0).pushPoints(pts).circle(d/2).extrude(h)\n\
    \    body = cq.Workplane('XY').circle(R_out).extrude(H)\n    body = body.cut(cq.Workplane('XY').workplane(offset=p.front_t).circle(R_in).extrude(H))\n\
    \    hx = p.perf_w/2 - p.perf_hole_edge - p.perf_hole_d/2\n    hy = p.perf_l/2\
    \ - p.perf_hole_edge - p.perf_hole_d/2\n    posts = [(hx,hy),(-hx,hy),(hx,-hy),(-hx,-hy)]\n\
    \    body = body.union(cyl(posts, p.post_d, p.front_t-0.5, top-p.front_t+0.5))\n\
    \    bpts = [(p.boss_r,0),(-p.boss_r,0),(0,p.boss_r)]\n    body = body.union(cyl(bpts,\
    \ p.boss_d, H-p.boss_h, p.boss_h))\n    body = body.cut(cyl(posts, p.m2_pilot,\
    \ top-8, 9))\n    body = body.cut(cyl(bpts, p.insert_hole_d, H-p.boss_pocket,\
    \ p.boss_pocket+1))\n    pitch = p.disc_hole_gap + p.disc_hole_d\n    dpts = [(pitch/2,0),(-pitch/2,0)]\n\
    \    body = body.cut(cyl(dpts, p.m3_clear, -1, p.front_t+2))\n    body = body.cut(cyl(dpts,\
    \ p.insert_hole_d, p.front_skin, p.front_t))\n    ws = cq.Workplane('XY').box(p.wire_slot_w,\
    \ p.wire_slot_y1-p.wire_slot_y0, p.front_t+2, centered=(True,False,False)).translate((0,p.wire_slot_y0,-1))\n\
    \    body = body.cut(ws)\n    esp_off = p.perf_w/2 - p.esp_edge_gap - p.esp_w/2\n\
    \    port_z = top - (p.esp_under + p.esp_pcb_t + p.port_h/2)\n    ylen = (R_out+3)\
    \ - (R_in-6)\n    us = cq.Workplane('XY').box(p.usb_slot_w, ylen, p.usb_slot_h).translate((esp_off,\
    \ -((R_out+3) + (R_in-6))/2, port_z))\n    body = body.cut(us)\n    return body\n"
  print_orientation: front face (the face the disc screws onto) flat on the bed, open
    side up
  use_orientation: front face toward +z, away from the wall; open side toward the
    wall, closed by the back plate
- id: back_plate
  role: final
  material: matte white PLA
  code: "import math\ndef build(p):\n    R_in = math.hypot(p.perf_w/2, p.perf_l/2)\
    \ + p.board_clear\n    R_out = R_in + p.wall\n    def cyl(pts, d, z0, h):\n  \
    \      return cq.Workplane('XY').workplane(offset=z0).pushPoints(pts).circle(d/2).extrude(h)\n\
    \    plate = cq.Workplane('XY').circle(R_out).extrude(p.plate_t)\n    bpts = [(p.boss_r,0),(-p.boss_r,0),(0,p.boss_r)]\n\
    \    seat = p.m3_head_h + 0.2\n    # counterbore from the wall face, closed by\
    \ a one-layer membrane, then the clearance hole above it\n    plate = plate.cut(cyl(bpts,\
    \ p.m3_head_d+0.7, -1, seat+1))\n    plate = plate.cut(cyl(bpts, p.m3_clear, seat+p.membrane,\
    \ p.plate_t))\n    big_d = p.wscrew_head_d + 1.2\n    win_w = p.wscrew_head_d\
    \ + 0.8\n    slot_w = p.wscrew_shank_d + 0.8\n    cy = p.key_y + p.key_slot_len/2\n\
    \    for sx in (-1, 1):\n        x = sx*p.wscrew_pitch/2\n        # lip at the\
    \ wall face: big hole for the head plus a narrow slot for the shank\n        c\
    \ = cq.Workplane('XY').workplane(offset=-1).center(x, p.key_y).circle(big_d/2).extrude(p.lip_t+1.01)\n\
    \        sl = cq.Workplane('XY').workplane(offset=-1).center(x, cy).slot2D(p.key_slot_len\
    \ + slot_w, slot_w, 90).extrude(p.lip_t+1.01)\n        # window behind the lip,\
    \ open to the inside of the box, where the head slides\n        win = cq.Workplane('XY').workplane(offset=p.lip_t).center(x,\
    \ cy).slot2D(p.key_slot_len + win_w, win_w, 90).extrude(p.plate_t)\n        plate\
    \ = plate.cut(c).cut(sl).cut(win)\n    return plate\n"
  print_orientation: wall-side face flat on the bed
  use_orientation: wall-side face against the wall (z = 0)
