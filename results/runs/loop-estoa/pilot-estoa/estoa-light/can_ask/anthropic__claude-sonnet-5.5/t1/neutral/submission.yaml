task: estoa-light
note: 'ASSUMPTIONS TO CHECK before printing. (1) Disc diameter (~100 mm), disc thickness
  and the location of its input connector could not be measured. The wire slot in
  the front plate is a guess at y = 29..41 mm, 14 mm wide. (2) The perfboard and ESP32
  are modelled with the USB end toward the bottom, and the ESP32 offset 3.35 mm sideways,
  from the 7.53 mm reading. I assumed the 4.8 and 7.53 mm readings are sideways. The
  USB slot is 26 x 10 mm and is meant to cover either port. (3) The wall screws are
  assumed to have an 8 mm head, 3 mm head thickness and 4 mm shank. The keyholes have
  a 10 mm entry hole, a 4.8 mm slot in the 2.5 mm wall-side skin, and an inner track
  for the head. (4) Perfboard thickness is assumed to be 1.6 mm. (5) The box is 93.8
  mm across, so it sits inside a 100 mm disc. The transparent sides will need to go
  around it. The disc is held by two M3x8 screws into heat-set inserts, and the back
  plate by three M3x8 screws. Hang the whole assembled light on the two wall screws.
  Change in this version: the keyhole was fixed. The narrow slot is now in the wall-side
  skin, so the screw heads are trapped. Before, the head track was on the wrong side.'
