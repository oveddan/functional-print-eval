manual:
- n: '1'
  text: Print 'box' with its front face on the bed and the open side up, and 'back_plate'
    with its wall side on the bed. Use matte white PLA.
  parts:
  - box
  - back_plate
  hardware: []
  tool: null
- n: '2'
  text: Heat-set the two M3 inserts from inside the box into the pockets behind the
    two small front holes. Push each in until it sits at the bottom of the pocket.
    Heat-set the three remaining inserts into the boss holes at the open rim.
  parts:
  - box
  hardware:
  - insert
  tool: soldering iron with insert tip
- n: '3'
  text: Screw the perfboard onto the four posts with the four M2 self-tapping screws.
    Do this from the solder side, with the ESP32 facing the front plate. Orient it
    so the USB-C end is at the slot in the lower wall. Take the 4 wires out through
    the slot in the front plate, near 12 o'clock.
  parts:
  - box
  hardware:
  - m2_screw
  - perf
  - esp
  tool: small Phillips screwdriver
- n: '4'
  text: Seat the LED disk on the front face with its wire side at the top (12 o'clock).
    Connect the four wires. Screw it down with the two M3x8 screws into the inserts.
  parts:
  - box
  hardware:
  - disc
  - disc_screw
  tool: 2.5 mm hex key
- n: '5'
  text: Put the back plate on the open rim and tighten the three M3x8 screws. Their
    heads sit in the counterbores on the wall side.
  parts:
  - back_plate
  - box
  hardware:
  - plate_screw
  tool: 2.5 mm hex key
- n: '6'
  text: Drive two wall screws 40 mm apart, level. Leave each screw head about 3.5
    mm off the wall (underside of the head), so about 6.5 mm of screw sticks out.
    Push the plate's big round entry holes over the heads, then slide the light down
    so the shanks go into the narrow slots and the heads are trapped behind them.
    Plug the USB-C charger straight into the ESP32 through the slot at the bottom.
  parts: []
  hardware: []
  tool: null
