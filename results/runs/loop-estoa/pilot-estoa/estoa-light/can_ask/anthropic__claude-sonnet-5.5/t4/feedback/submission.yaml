task: estoa-light
note: 'Change from the first print: the keyholes failed. The round opening is now
  11.5 mm (was 10) and the slot is 6 mm wide (was 5). The inside face has a 2.4 mm
  recess around each keyhole, so the screw heads only need to stand 1.6 mm or more
  off the wall (was 4 mm or more). Mark the wall through the round openings of the
  printed box instead of measuring the 52 mm spacing. If your screws still don''t
  fit, I need the real shank diameter and head diameter and height. Everything else
  is unchanged and still rests on the guesses listed in the params.'
questions:
- text: 'Still unmeasured: wall-screw shank diameter and head height, disc board thickness,
    perfboard thickness, plug housing size, tallest part on the perfboard, solder
    tail length, the disc''s wire connector position, and the sideways position of
    the USB-C port on the perfboard.'
  answer: null
