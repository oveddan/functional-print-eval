parts:
- id: box
  role: final
  material: matte white PLA
  code: "def build(p):\n    def rect(x0,x1,y0,y1,z0,z1):\n        return cq.Workplane('XY').box(x1-x0,y1-y0,z1-z0,centered=False).translate((x0,y0,z0))\n\
    \    def cyl(x,y,r,z0,z1):\n        return cq.Workplane('XY').workplane(offset=z0).center(x,y).circle(r).extrude(z1-z0)\n\
    \    hx=(p.disc_hole_gap+p.disc_hole_d)/2\n    zs=p.plate_t+p.standoff_h\n   \
    \ H=zs+p.pcb_t+p.esp_h+p.headroom\n    ix=p.pcb_len+2*p.clear\n    iy=p.pcb_w+2*p.clear\n\
    \    rp=p.post_od/2\n    y_in_top=rp-0.5\n    y_board_top=-(rp+1.0)\n    y_in_bot=y_board_top-iy\n\
    \    yb=y_board_top-iy/2\n    ox=ix/2+p.wall\n    y0=y_in_bot-p.wall\n    y1=y_in_top+p.wall\n\
    \    body=rect(-ox,ox,y0,y1,0,H).cut(rect(-ix/2,ix/2,y_in_bot,y_in_top,p.plate_t,H+1))\n\
    \    for sx in (-1,1):\n        body=body.union(cyl(sx*hx,0,rp,p.plate_t-0.1,H))\n\
    \        body=body.union(rect(sx*hx-rp,sx*hx+rp,0,y_in_top+0.1,p.plate_t-0.1,H))\n\
    \    for sx in (-1,1):\n        body=body.cut(cyl(sx*hx,0,p.insert_hole_d/2,H-p.insert_len-0.5,H+1))\n\
    \        body=body.cut(cyl(sx*hx,0,p.m3_clear_d/2,H-p.insert_len-0.5-12,H-p.insert_len))\n\
    \    dx=p.pcb_len/2-(p.pcb_hole_edge+p.pcb_hole_d/2)\n    dy=p.pcb_w/2-(p.pcb_hole_edge+p.pcb_hole_d/2)\n\
    \    for sx in (-1,1):\n        for sy in (-1,1):\n            body=body.union(cyl(sx*dx,yb+sy*dy,p.standoff_od/2,p.plate_t-0.1,zs))\n\
    \    for sx in (-1,1):\n        for sy in (-1,1):\n            body=body.cut(cyl(sx*dx,yb+sy*dy,p.m2_pilot_d/2,zs-8,zs+1))\n\
    \    # keyholes: round opening + slot through the plate, plus a recess in the\
    \ inside face so the head can sit close to the wall\n    rr=p.kh_round_d/2\n \
    \   sw=p.kh_slot_w/2\n    rec_r=(p.wall_head_d+2.0)/2\n    for sx in (-1,1):\n\
    \        x=sx*p.kh_x\n        body=body.cut(cyl(x,yb,rr,-1,p.plate_t+1))\n   \
    \     body=body.cut(rect(x-sw,x+sw,yb,yb+p.kh_slot,-1,p.plate_t+1))\n        zr=p.plate_t-p.kh_recess\n\
    \        body=body.cut(cyl(x,yb,rec_r,zr,p.plate_t+1))\n        body=body.cut(cyl(x,yb+p.kh_slot,rec_r,zr,p.plate_t+1))\n\
    \        body=body.cut(rect(x-rec_r,x+rec_r,yb,yb+p.kh_slot,zr,p.plate_t+1))\n\
    \    zn=zs+p.pcb_t+p.port_h-p.plug_half_h\n    body=body.cut(rect(ix/2-0.1,ox+1,yb-p.port_win/2,yb+p.port_win/2,zn,H+1))\n\
    \    body=body.cut(rect(-p.wire_notch_w/2,p.wire_notch_w/2,y_in_top-0.1,y1+1,H-p.wire_notch_h,H+1))\n\
    \    return body\n"
  print_orientation: back plate flat on the bed (z=0), open side up, no supports needed
  use_orientation: back plate against the wall, open side facing out and covered by
    the disc; +y up; the USB-C notch is on the right (+x)
