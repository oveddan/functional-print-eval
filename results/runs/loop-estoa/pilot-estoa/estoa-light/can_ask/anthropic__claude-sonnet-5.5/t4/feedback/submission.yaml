manual:
- n: '1'
  text: Print the box in matte white PLA, back plate on the bed, open side up. No
    supports.
  parts:
  - box
  hardware: []
  tool: null
- n: '2'
  text: Press an M3 heat-set insert into the top of each of the two tall posts, flush
    with the top face. Use a soldering iron and keep the insert square.
  parts:
  - box
  hardware:
  - insert
  tool: soldering iron
- n: '3'
  text: 'Before drilling, check one of your wall screws on the box: its head should
    drop through a round opening (11.5 mm) in the back plate, and its shank should
    slide in the slot above it (6 mm). If it doesn''t, tell me the real head and shank
    sizes. Then hold the empty box against the wall, level, in the position you want,
    and mark the wall through the centre of both round openings. They are 52 mm apart.
    Drill, fit the anchors, and drive the #8 screws until the underside of each head
    is 2 to 4 mm off the wall.'
  parts:
  - box
  hardware: []
  tool: null
- n: '4'
  text: Push the box onto the screws so the heads pass through the round openings,
    then slide the box down 10 mm so the screw shanks sit at the top of the slots.
    The heads end up in the recesses on the inside face of the back plate. Do this
    before the electronics go in.
  parts:
  - box
  hardware: []
  tool: null
- n: '5'
  text: Set the perfboard on the four standoffs. Turn it so the ESP32's USB-C ports
    face the notch in the right-hand wall. Fix it with four M2 self-tapping screws.
  parts:
  - box
  hardware:
  - m2screw
  - pcb
  tool: small Phillips screwdriver
- n: '6'
  text: Plug the charger's USB-C plug into the ESP32. Its housing should sit in the
    notch. Plug the four wires into the disc's input, leaving the wires slack. They
    can run up between the posts and out through the notch in the top wall.
  parts: []
  hardware:
  - esp
  - disc
  tool: null
- n: '7'
  text: Lay the disc on the box with its wires at 12 o'clock and its two holes over
    the posts. Fix it with two M3x8 screws. Don't trap the wires under the rim.
  parts:
  - box
  hardware:
  - m3screw
  - disc
  tool: 2.5 mm hex key
