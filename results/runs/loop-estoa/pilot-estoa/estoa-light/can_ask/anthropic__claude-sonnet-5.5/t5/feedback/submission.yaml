criteria:
- id: c-insert-boss
  part: box-tray
  feature: corner boss insert pockets
  relation: seats
  hardware: ins-lid
  clearance_mm: null
  params:
  - boss_d
  - insert_hole_d
  - insert_len
  - insert_pocket_extra
  check:
    method: coupon
    ref: insert-coupon
    description: Print the coupon first and press one insert into the boss and one
      into the plate. The boss must not bulge and the insert must sit straight and
      flush. If it still bulges, lower the iron temperature or reduce the pocket to
      4.2 mm.
- id: c-keyholes
  part: box-tray
  feature: keyholes with head channel
  relation: engages
  hardware: null
  clearance_mm: null
  params:
