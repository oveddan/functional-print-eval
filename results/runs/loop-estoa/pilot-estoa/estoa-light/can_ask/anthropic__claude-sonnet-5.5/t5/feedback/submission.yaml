    description: Two keyholes, 30 mm apart. The entry hole is 10.4 mm, the slot is
      4.8 mm wide and slides up 9 mm. The floor lip behind the head is 2.0 mm thick.
      With the screw heads standing 3.5 mm off the wall, the head sits 1.5 mm clear
      of the lip.
