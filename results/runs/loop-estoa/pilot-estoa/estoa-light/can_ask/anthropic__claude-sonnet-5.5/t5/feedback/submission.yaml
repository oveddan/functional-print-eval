parts:
- id: box-tray
  role: final
  material: matte white PLA
  code: "def build(p):\n    W = p.inner_w + 2*p.wall_t\n    L = p.inner_l + 2*p.wall_t\n\
    \    H = p.floor_t + p.int_h\n    def cyl(x, y, d, z0, z1):\n        return cq.Workplane('XY').workplane(offset=z0).center(x,\
    \ y).circle(d/2).extrude(z1 - z0)\n    body = cq.Workplane('XY').rect(W, L).extrude(H).edges('|Z').fillet(p.corner_r)\n\
    \    cav = (cq.Workplane('XY').workplane(offset=p.floor_t).rect(p.inner_w, p.inner_l)\n\
    \           .extrude(p.int_h + 1).edges('|Z').fillet(p.corner_r - p.wall_t))\n\
    \    body = body.cut(cav)\n    bx = p.inner_w/2 - p.boss_inset\n    by = p.inner_l/2\
    \ - p.boss_inset\n    pocket = p.insert_len + p.insert_pocket_extra\n    for sx\
    \ in (-1, 1):\n        for sy in (-1, 1):\n            body = body.union(cyl(sx*bx,\
    \ sy*by, p.boss_d, 0, H))\n    for sx in (-1, 1):\n        for sy in (-1, 1):\n\
    \            body = body.cut(cyl(sx*bx, sy*by, p.insert_hole_d, H - pocket, H\
    \ + 1))\n            body = body.cut(cyl(sx*bx, sy*by, p.m3_d + 0.2, H - pocket\
    \ - 5, H))\n    px = p.pb_w/2 - p.pb_hole_edge - p.pb_hole_d/2\n    py = p.pb_l/2\
    \ - p.pb_hole_edge - p.pb_hole_d/2\n    ztop = p.floor_t + p.post_h\n    for sx\
    \ in (-1, 1):\n        for sy in (-1, 1):\n            body = body.union(cyl(sx*px,\
    \ sy*py, p.post_d, p.floor_t - 0.1, ztop))\n    for sx in (-1, 1):\n        for\
    \ sy in (-1, 1):\n            body = body.cut(cyl(sx*px, sy*py, p.pilot_d, ztop\
    \ - p.m2_len, ztop + 0.1))\n    key_hole_d = p.wall_head_d + p.key_clear\n   \
    \ slot_w = p.wall_shank_d + 0.6\n    for sx in (-1, 1):\n        cx = sx*p.key_x\n\
    \        # head channel: thins the floor to a lip on the inside, so the head has\
    \ room behind it\n        chan = (cq.Workplane('XY').workplane(offset=p.floor_t\
    \ - p.key_pocket)\n                .center(cx, p.key_y + p.key_len/2)\n      \
    \          .slot2D(p.key_len + key_hole_d, key_hole_d, 90).extrude(p.key_pocket\
    \ + 1))\n        body = body.cut(chan)\n        body = body.cut(cyl(cx, p.key_y,\
    \ key_hole_d, -1, p.floor_t + 1))\n        slot = (cq.Workplane('XY').workplane(offset=-1).center(cx,\
    \ p.key_y + p.key_len/2)\n                .slot2D(p.key_len + slot_w, slot_w,\
    \ 90).extrude(p.floor_t + 2))\n        body = body.cut(slot)\n    mouth_z = p.floor_t\
    \ + p.post_h + p.pb_t + p.usb_bottom + p.usb_h/2\n    zc = mouth_z - p.plug_h/2\n\
    \    n1 = (cq.Workplane('XY').box(p.plug_w, p.wall_t + 2, H - zc + 1, centered=(True,\
    \ True, False))\n          .translate((-p.esp_off, -(p.inner_l/2 + p.wall_t/2),\
    \ zc)))\n    body = body.cut(n1)\n    n2 = (cq.Workplane('XY').box(p.wire_w, p.wall_t\
    \ + 2, p.wire_h + 1, centered=(True, True, False))\n          .translate((0, p.inner_l/2\
    \ + p.wall_t/2, H - p.wire_h)))\n    body = body.cut(n2)\n    return body\n"
  print_orientation: back face (the wall side, z=0) flat on the bed, open side up
  use_orientation: back face against the wall, open side facing out
- id: box-lid
  role: final
  material: matte white PLA
  code: "def build(p):\n    W = p.inner_w + 2*p.wall_t\n    L = p.inner_l + 2*p.wall_t\n\
    \    def cyl(x, y, d, z0, z1):\n        return cq.Workplane('XY').workplane(offset=z0).center(x,\
    \ y).circle(d/2).extrude(z1 - z0)\n    lid = cq.Workplane('XY').rect(W, L).extrude(p.lid_t).edges('|Z').fillet(p.corner_r)\n\
    \    pitch = p.disc_hole_gap + p.disc_hole_d\n    for sx in (-1, 1):\n       \
    \ lid = lid.cut(cyl(sx*pitch/2, 0, p.insert_hole_d, p.lid_t - (p.insert_len +\
    \ 0.8), p.lid_t + 1))\n        lid = lid.cut(cyl(sx*pitch/2, 0, p.m3_d + p.cb_clear,\
    \ -1, p.lid_t + 1))\n    bx = p.inner_w/2 - p.boss_inset\n    by = p.inner_l/2\
    \ - p.boss_inset\n    for sx in (-1, 1):\n        for sy in (-1, 1):\n       \
    \     lid = lid.cut(cyl(sx*bx, sy*by, p.m3_d + p.cb_clear, -1, p.lid_t + 1))\n\
    \            lid = lid.cut(cyl(sx*bx, sy*by, p.m3_head_d + 0.9, p.lid_t - (p.m3_head_h\
    \ + 0.3), p.lid_t + 1))\n    return lid\n"
  print_orientation: rear face (the side facing the tray, z=0) flat on the bed, front
    face up
  use_orientation: front plate on the tray rim, front face out; the disc sits on it
- id: insert-coupon
  role: coupon
  material: matte white PLA
  code: "def build(p):\n    def cyl(x, y, d, z0, z1):\n        return cq.Workplane('XY').workplane(offset=z0).center(x,\
    \ y).circle(d/2).extrude(z1 - z0)\n    pocket = p.insert_len + p.insert_pocket_extra\n\
    \    h = pocket + 6\n    boss = cyl(0, 0, p.boss_d, 0, h)\n    boss = boss.cut(cyl(0,\
    \ 0, p.insert_hole_d, h - pocket, h + 1))\n    boss = boss.cut(cyl(0, 0, p.m3_d\
    \ + 0.2, 0, h))\n    plate = cq.Workplane('XY').center(22, 0).rect(16, 16).extrude(p.lid_t)\n\
    \    plate = plate.cut(cyl(22, 0, p.insert_hole_d, p.lid_t - (p.insert_len + 0.8),\
    \ p.lid_t + 1))\n    plate = plate.cut(cyl(22, 0, p.m3_d + p.cb_clear, -1, p.lid_t\
    \ + 1))\n    return boss.union(plate)\n"
  print_orientation: flat on the bed, pockets facing up
  use_orientation: test piece only, not part of the finished light
