    description: A 14 x 6 mm notch at 12 o'clock lets the four wires leave to the
      disc connector. The lid closes the top of the notch.
manual:
- n: '1'
  text: Print insert-coupon first, in the same white PLA. Press one heat-set insert
    into the boss and one into the flat plate. Check that the boss does not bulge
    and the insert sits straight and flush. If it does bulge, lower the iron temperature
    a little and press more slowly.
  parts:
  - insert-coupon
  hardware:
  - ins-lid
  tool: soldering iron with an insert tip
- n: '2'
  text: Print box-tray and box-lid in matte white PLA, with at least 4 perimeters.
    The tray goes back face down, open side up. The lid goes with its rear face down,
    so the counterbores face up.
  parts:
  - box-tray
  - box-lid
  hardware: []
  tool: null
- n: '3'
  text: Heat-set 4 inserts into the tray's corner bosses from the open rim. Heat-set
    2 inserts into the lid's two centre pockets from the front face. Set the iron
    to about 200-220 C for PLA. Rest the insert square in the hole, press it down
    straight, stop when it is flush, and hold it still until the plastic sets. Do
    not push it in crooked and correct it afterwards.
  parts:
  - box-tray
  - box-lid
  hardware:
  - ins-lid
  - ins-disc
  tool: soldering iron with an insert tip
- n: '4'
  text: Set the perfboard on the four posts so the ESP32's USB-C port faces the notch
    in the bottom wall. Screw it down with the four M2 self-tapping screws. Do not
    overtighten.
  parts:
  - box-tray
  hardware:
  - m2-board
  - perfboard
  - esp32
  tool: small Phillips screwdriver
- n: '5'
  text: Feed the four wires from the perfboard out through the notch in the top wall,
    leaving enough length to reach the disc's input connector. Set the lid on the
    tray with its counterbores over the corner bosses, trapping the wires in the notch.
    Fasten it with four M3x8 screws.
  parts:
  - box-lid
  - box-tray
  hardware:
  - m3-lid
  tool: 2.5 mm hex key
- n: '6'
  text: Lay the disc on the lid front with its wire side at 12 o'clock, over the notch,
    and connect the four wires. Line the disc's two holes up with the lid's inserts
    and fasten it with two M3x8 screws.
  parts:
  - box-lid
  hardware:
  - m3-disc
  - disc
  tool: 2.5 mm hex key
- n: '7'
  text: 'Put two #8 screws in the wall, 30 mm apart horizontally and level. Leave
    the underside of each head 3.5 mm out from the wall, no more and no less than
    about 0.5 mm either way. Hold the box with its keyhole entry holes (the larger
    round ends, lower) over the heads, push it flat against the wall so the heads
    go through, then slide it down so the shanks sit in the top of the slots. Plug
    the USB-C charger into the port through the opening in the bottom wall.'
  parts:
  - box-tray
  hardware: []
  tool: null
