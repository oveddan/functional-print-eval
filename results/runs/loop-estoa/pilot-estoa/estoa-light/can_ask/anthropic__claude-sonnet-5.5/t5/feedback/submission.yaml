task: estoa-light
note: 'Two fixes this round. (1) Inserts: the corner bosses are now 10 mm across,
  up from 8, and the box is 4 mm wider and taller to make room for them. The pockets
  are 1.5 mm deeper than the insert. The lid is 6 mm thick, up from 5. A small coupon
  is added to check inserts before the big print. (2) Wall screws: the old floor was
  3.5 mm thick and the screw heads stood 3.5 mm off the wall, so there was no room
  behind the plate. The inside of the floor around each keyhole now has a 1.5 mm channel,
  so the lip is 2.0 mm thick and a 3.5 mm standoff leaves 1.5 mm of clearance. The
  posts are 11 mm tall, up from 9. The box is now about 73 x 93 x 41.5 mm. The other
  assumptions are unchanged and listed in the questions.'
questions:
- text: Which end of the perfboard does the USB-C port face, and is the ESP32 on the
    +x or -x side? I assumed +y and +x. Column 1 is on the -x side.
  answer: null
- text: 'How tall is the #8 screw head? I only know it is 9 mm across. The posts are
    now 11 mm so it clears the board.'
  answer: null
- text: What is the disc's actual thickness? I guessed 1.6 mm for the PCB.
  answer: null
