parts:
- id: box
  role: final
  material: matte white PLA
  code: "import math\ndef build(p):\n    Ro = p.box_od/2.0\n    Ri = Ro - p.wall\n\
    \    H = p.plate_t + p.cavity_d\n    a = math.radians(p.boss_angle)\n    bx =\
    \ p.boss_r*math.sin(a)\n    by = p.boss_r*math.cos(a)\n    body = cq.Workplane('XY').circle(Ro).extrude(H)\n\
    \    cav = cq.Workplane('XY').workplane(offset=p.plate_t).circle(Ri).extrude(p.cavity_d+1)\n\
    \    body = body.cut(cav)\n    for sx in (1,-1):\n        for sy in (1,-1):\n\
    \            boss = cq.Workplane('XY').workplane(offset=p.plate_t-0.1).center(sx*bx,\
    \ sy*by).circle(p.boss_od/2.0).extrude(p.cavity_d+0.1)\n            body = body.union(boss)\n\
    \    for sx in (1,-1):\n        for sy in (1,-1):\n            h = cq.Workplane('XY').workplane(offset=H-p.boss_hole_depth).center(sx*bx,\
    \ sy*by).circle(p.insert_hole_d/2.0).extrude(p.boss_hole_depth+1)\n          \
    \  body = body.cut(h)\n    ix = p.pcb_w/2.0 - (p.pcb_hole_edge + p.pcb_hole_d/2.0)\n\
    \    iy = p.pcb_l/2.0 - (p.pcb_hole_edge + p.pcb_hole_d/2.0)\n    for sx in (1,-1):\n\
    \        for sy in (1,-1):\n            so = cq.Workplane('XY').workplane(offset=p.plate_t-0.1).center(sx*ix,\
    \ sy*iy).circle(p.standoff_od/2.0).extrude(p.standoff_h+0.1)\n            body\
    \ = body.union(so)\n    for sx in (1,-1):\n        for sy in (1,-1):\n       \
    \     top = p.plate_t + p.standoff_h\n            h = cq.Workplane('XY').workplane(offset=top-p.m2_pilot_depth).center(sx*ix,\
    \ sy*iy).circle(p.m2_pilot/2.0).extrude(p.m2_pilot_depth+1)\n            body\
    \ = body.cut(h)\n    pitch = p.disc_hole_gap + p.disc_hole_d\n    for sx in (1,-1):\n\
    \        h1 = cq.Workplane('XY').workplane(offset=p.plate_t-p.insert_depth).center(sx*pitch/2.0,\
    \ 0).circle(p.insert_hole_d/2.0).extrude(p.insert_depth+1)\n        h2 = cq.Workplane('XY').workplane(offset=-1).center(sx*pitch/2.0,\
    \ 0).circle(p.m3_clear/2.0).extrude(p.plate_t+2)\n        body = body.cut(h1).cut(h2)\n\
    \    slot = cq.Workplane('XY').box(p.wire_slot_w, p.wire_slot_y1-p.wire_slot_y0,\
    \ p.plate_t+2, centered=(True, False, False)).translate((0, p.wire_slot_y0, -1))\n\
    \    body = body.cut(slot)\n    notch = cq.Workplane('XY').box(p.notch_w, 9, p.notch_h+1,\
    \ centered=(True, False, False)).translate((0, -Ro-2, H-p.notch_h))\n    body\
    \ = body.cut(notch)\n    return body\n"
  print_orientation: front face (the one the disc touches) flat on the bed, open side
    up, no supports; use 4+ perimeters so the insert bosses are solid
  use_orientation: front face toward the viewer, open side toward the wall
- id: cover
  role: final
  material: matte white PLA
  code: "import math\ndef build(p):\n    Ro = p.box_od/2.0\n    cov = cq.Workplane('XY').circle(Ro).extrude(p.cover_t)\n\
    \    a = math.radians(p.boss_angle)\n    bx = p.boss_r*math.sin(a)\n    by = p.boss_r*math.cos(a)\n\
    \    cbd = p.m3_head_d + p.cb_clear\n    cbh = p.m3_head_h + 0.3\n    for sx in\
    \ (1,-1):\n        for sy in (1,-1):\n            hole = cq.Workplane('XY').workplane(offset=-1).center(sx*bx,\
    \ sy*by).circle(p.m3_clear/2.0).extrude(p.cover_t+2)\n            cb = cq.Workplane('XY').workplane(offset=-1).center(sx*bx,\
    \ sy*by).circle(cbd/2.0).extrude(cbh+1)\n            cov = cov.cut(hole).cut(cb)\n\
    \    big = p.wall_head_d + 2*p.kh_clear\n    sw = p.wall_shank_d + p.kh_clear\n\
    \    pd = p.cover_t - p.ledge_t\n    for sx in (1,-1):\n        x = sx*p.hang_pitch/2.0\n\
    \        # pocket from the inside face (head sits here, behind the ledge)\n  \
    \      pk1 = cq.Workplane('XY').workplane(offset=p.ledge_t).center(x, p.kh_y).circle(big/2.0).extrude(pd+1)\n\
    \        pk2 = cq.Workplane('XY').workplane(offset=p.ledge_t).center(x, p.kh_y+p.kh_slot).circle(big/2.0).extrude(pd+1)\n\
    \        pk3 = cq.Workplane('XY').box(big, p.kh_slot, pd+1, centered=(True, False,\
    \ False)).translate((x, p.kh_y, p.ledge_t))\n        # through: big hole for the\
    \ head, narrow slot for the shank\n        a1 = cq.Workplane('XY').workplane(offset=-1).center(x,\
    \ p.kh_y).circle(big/2.0).extrude(p.cover_t+2)\n        b = cq.Workplane('XY').box(sw,\
    \ p.kh_slot, p.cover_t+2, centered=(True, False, False)).translate((x, p.kh_y,\
    \ -1))\n        d = cq.Workplane('XY').workplane(offset=-1).center(x, p.kh_y+p.kh_slot).circle(sw/2.0).extrude(p.cover_t+2)\n\
    \        cov = cov.cut(pk1).cut(pk2).cut(pk3).cut(a1).cut(b).cut(d)\n    return\
    \ cov\n"
  print_orientation: wall-side face flat on the bed, no supports
  use_orientation: wall-side face against the wall (same as printed)
