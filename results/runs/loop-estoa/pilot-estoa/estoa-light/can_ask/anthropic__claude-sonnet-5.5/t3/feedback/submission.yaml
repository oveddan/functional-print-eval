task: estoa-light
note: 'Changes after the first print: (1) insert bosses were only 1.35 mm thick round
  the hole; now 10 mm OD (2.85 mm wall), moved to 60 deg from vertical to clear the
  perfboard, with a shallower 6.5 mm hole so the insert stays square. (2) Keyholes:
  the head used to need to stand about 10 mm off the wall inside the box; the cover
  is now thinned to a 2.5 mm ledge under each slot with a head pocket on the inside,
  so the head only needs to be about 3 mm off the wall; big hole 11 mm, slot 5.2 mm.
  Still assumed: disc diameter (100 mm guess), perfboard/disc thickness 1.6, #8 shank
  4.2 mm, port at the perfboard''s -y end, cable plug (not a charger body) leaves
  through the notch. I could not tell exactly why the heads did not fit, so if the
  screws still do not go in, tell me the head height and how far the screw sticks
  out of the wall.'
questions: []
