manual:
- n: '1'
  text: Print insert_coupon first. Set the iron to about 200-220 °C (not hotter).
    Rest the insert upright in the chamfered mouth, put the tip in it, and let it
    sink in under almost no pressure, keeping the iron vertical. Stop when the insert
    is about 0.3 mm proud. Remove the iron and press it flush right away with something
    flat and cold (a metal ruler, say) so it sets square. If the post still bulges,
    turn the iron down 10 °C.
  parts:
  - insert_coupon
  hardware:
  - insert
  tool: soldering iron with insert tip
- n: '2'
  text: Print back_box and lid in matte white PLA, flat side down, no supports, with
    4 walls/perimeters so the posts are solid around the inserts.
  parts:
  - back_box
  - lid
  hardware: []
  tool: null
- n: '3'
  text: Use the same method to set 4 inserts in the box's rim posts and 2 in the lid's
    centre holes (counterbored side up).
  parts:
  - back_box
  - lid
  hardware:
  - insert
  tool: soldering iron with insert tip
- n: '4'
  text: Screw the perfboard onto the four standoffs with the M2 self-tappers, USB-C
    port facing the bottom notch.
  parts:
  - back_box
  hardware:
  - pb_screw
  - perfboard
  - esp32
  tool: small Phillips screwdriver
- n: '5'
  text: Check that the charger plugs in through the notch. Feed the disc wires through
    the lid slot.
  parts:
  - back_box
  - lid
  hardware:
  - esp32
  tool: null
- n: '6'
  text: Fit the lid with its slot at 12 o'clock, using four M3x8 screws.
  parts:
  - lid
  - back_box
  hardware:
  - lid_screw
  tool: 2.5 mm hex key
- n: '7'
  text: Connect the disc and screw it down through its two centre holes with M3x6
    screws, input wires at 12 o'clock.
  parts:
  - lid
  hardware:
  - disc_screw
  - disk
  tool: 2.5 mm hex key
- n: '8'
  text: 'On the wall: two #8 screws, level, 72 mm apart, heads standing about 3 mm
    off the wall. Hook the keyholes over them and slide the box down 8 mm.'
  parts:
  - back_box
  hardware: []
  tool: null
