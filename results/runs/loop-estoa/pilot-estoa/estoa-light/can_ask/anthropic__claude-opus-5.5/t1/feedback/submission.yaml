parts:
- id: insert_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    h = 12\n    c = cq.Workplane('XY').box(30, 14, 3, centered=(True,\
    \ True, False))\n    c = c.union(cq.Workplane('XY').pushPoints([(-7.5, 0), (7.5,\
    \ 0)]).circle(p.lid_boss_d/2).extrude(h))\n    for x in (-7.5, 7.5):\n       \
    \ c = c.cut(cq.Workplane('XY').workplane(offset=h-p.insert_hole_depth).center(x,\
    \ 0).circle(p.insert_hole_d/2).extrude(p.insert_hole_depth))\n        c = c.cut(cq.Workplane('XY').add(cq.Solid.makeCone(p.insert_hole_d/2,\
    \ p.insert_hole_d/2+0.5, 0.5, cq.Vector(x, 0, h-0.5), cq.Vector(0, 0, 1))))\n\
    \    return c\n"
  print_orientation: flat base on the bed
  use_orientation: test only
- id: back_box
  role: final
  material: PLA (matte white)
  code: "import math\ndef build(p):\n    Ro = p.disc_d/2\n    Ri = Ro - p.wall_t\n\
    \    H = p.box_h\n    body = cq.Workplane('XY').circle(Ro).extrude(H)\n    body\
    \ = body.cut(cq.Workplane('XY').workplane(offset=p.floor_t).circle(Ri).extrude(H))\n\
    \    angs = [30, 150, 225, 315]\n    pts = [(p.lid_screw_r*math.cos(math.radians(a)),\
    \ p.lid_screw_r*math.sin(math.radians(a))) for a in angs]\n    bosses = cq.Workplane('XY').pushPoints(pts).circle(p.lid_boss_d/2).extrude(H)\n\
    \    body = body.union(bosses.intersect(cq.Workplane('XY').circle(Ro).extrude(H)))\n\
    \    d = p.insert_hole_depth\n    body = body.cut(cq.Workplane('XY').workplane(offset=H-d).pushPoints(pts).circle(p.insert_hole_d/2).extrude(d))\n\
    \    for (x, y) in pts:\n        body = body.cut(cq.Workplane('XY').add(cq.Solid.makeCone(p.insert_hole_d/2,\
    \ p.insert_hole_d/2+0.5, 0.5, cq.Vector(x, y, H-0.5), cq.Vector(0, 0, 1))))\n\
    \    hc = p.pb_hole_edge + p.pb_hole_d/2\n    sx = p.pb_w/2 - hc\n    spts = [(sx,\
    \ p.pb_y_bottom+hc), (-sx, p.pb_y_bottom+hc), (sx, p.pb_y_bottom+p.pb_l-hc), (-sx,\
    \ p.pb_y_bottom+p.pb_l-hc)]\n    st = p.floor_t + p.standoff_h\n    body = body.union(cq.Workplane('XY').pushPoints(spts).circle(p.standoff_d/2).extrude(st))\n\
    \    body = body.cut(cq.Workplane('XY').workplane(offset=st-6).pushPoints(spts).circle(p.m2_pilot_d/2).extrude(6))\n\
    \    ent = p.wall_screw_head_d + 1.0\n    slot_w = p.wall_screw_shank_d + 0.4\n\
    \    pk_w = p.wall_screw_head_d + 1.4\n    for kx in (p.keyhole_x, -p.keyhole_x):\n\
    \        body = body.union(cq.Workplane('XY').box(16, 24, 8.5, centered=(True,\
    \ True, False)).translate((kx, 4, 0)))\n        body = body.cut(cq.Workplane('XY').center(kx,\
    \ 0).circle(ent/2).extrude(7))\n        body = body.cut(cq.Workplane('XY').center(kx,\
    \ p.keyhole_travel/2).slot2D(p.keyhole_travel+slot_w, slot_w, 90).extrude(2.5))\n\
    \        body = body.cut(cq.Workplane('XY').workplane(offset=2.5).center(kx, p.keyhole_travel/2).slot2D(p.keyhole_travel+pk_w,\
    \ pk_w, 90).extrude(4.5))\n    body = body.cut(cq.Workplane('XY').box(p.usb_notch_w,\
    \ 9, H, centered=(True, True, False)).translate((-3, -Ro+3.5, p.usb_notch_z0)))\n\
    \    return body\n"
  print_orientation: back face (z=0) on the bed, no supports
  use_orientation: z=0 against the wall, USB notch at the bottom
- id: lid
  role: final
  material: PLA (matte white)
  code: "import math\ndef build(p):\n    Ro = p.disc_d/2\n    T = p.lid_t\n    lid\
    \ = cq.Workplane('XY').circle(Ro).extrude(T)\n    angs = [30, 150, 225, 315]\n\
    \    pts = [(p.lid_screw_r*math.cos(math.radians(a)), p.lid_screw_r*math.sin(math.radians(a)))\
    \ for a in angs]\n    lid = lid.cut(cq.Workplane('XY').pushPoints(pts).circle(p.m3_clear_d/2).extrude(T))\n\
    \    ch = p.m3_head_h + 0.2\n    lid = lid.cut(cq.Workplane('XY').workplane(offset=T-ch).pushPoints(pts).circle((p.m3_head_d+0.7)/2).extrude(ch))\n\
    \    pitch = p.disc_hole_inner_gap + p.disc_hole_d\n    dd = p.insert_len + 0.5\n\
    \    for x in (pitch/2, -pitch/2):\n        lid = lid.cut(cq.Workplane('XY').workplane(offset=T-dd).center(x,\
    \ 0).circle(p.insert_hole_d/2).extrude(dd))\n        lid = lid.cut(cq.Workplane('XY').add(cq.Solid.makeCone(p.insert_hole_d/2,\
    \ p.insert_hole_d/2+0.5, 0.5, cq.Vector(x, 0, T-0.5), cq.Vector(0, 0, 1))))\n\
    \    lid = lid.cut(cq.Workplane('XY').center(0, 30).slot2D(20, 12, 90).extrude(T))\n\
    \    return lid\n"
  print_orientation: inner face (z=0) on the bed, counterbores facing up
  use_orientation: on the box rim; the disc screws onto its top face
