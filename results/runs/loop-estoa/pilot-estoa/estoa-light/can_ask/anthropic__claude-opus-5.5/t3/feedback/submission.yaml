parts:
- id: back_shell
  role: final
  material: PLA matte white
  code: "import math\ndef build(p):\n    def dshape(r, yf, h):\n        c = cq.Workplane('XY').circle(r).extrude(h)\n\
    \        b = cq.Workplane('XY').center(0, (r - yf) / 2.0).rect(2 * r + 2, r +\
    \ yf).extrude(h)\n        return c.intersect(b)\n    R_in = p.box_r - p.wall_t\n\
    \    yf_in = p.box_flat - p.wall_t\n    H = p.box_h\n    s = dshape(p.box_r, p.box_flat,\
    \ H)\n    s = s.cut(dshape(R_in, yf_in, H).translate((0, 0, p.back_t)))\n    rr\
    \ = R_in - p.boss_inset\n    pts = [(rr * math.cos(math.radians(a)), rr * math.sin(math.radians(a)))\
    \ for a in (45, 135, 225, 315)]\n    top = H - p.lid_pad_t\n    bosses = cq.Workplane('XY').pushPoints(pts).circle(p.boss_d\
    \ / 2.0).extrude(top)\n    bosses = bosses.intersect(dshape(p.box_r, p.box_flat,\
    \ H))\n    s = s.union(bosses)\n    s = s.cut(cq.Workplane('XY').pushPoints(pts).circle(p.insert_hole_d\
    \ / 2.0).extrude(p.insert_hole_depth).translate((0, 0, top - p.insert_hole_depth)))\n\
    \    for (x, y) in pts:\n        s = s.cut(cq.Workplane('XY').add(cq.Solid.makeCone(p.insert_hole_d\
    \ / 2.0, p.insert_hole_d / 2.0 + 0.6, 0.6, cq.Vector(x, y, top - 0.6))))\n   \
    \ cy = -yf_in + p.pb_edge_gap + p.pb_l / 2.0\n    hx = p.pb_w / 2.0 - p.pb_hole_edge\
    \ - p.pb_hole_d / 2.0\n    hy = p.pb_l / 2.0 - p.pb_hole_edge - p.pb_hole_d /\
    \ 2.0\n    sp = [(sx * hx, cy + sy * hy) for sx in (-1, 1) for sy in (-1, 1)]\n\
    \    so = cq.Workplane('XY').pushPoints(sp).circle(p.standoff_d / 2.0).extrude(p.back_t\
    \ + p.standoff_h)\n    s = s.union(so)\n    s = s.cut(cq.Workplane('XY').pushPoints(sp).circle(p.m2_pilot_d\
    \ / 2.0).extrude(p.standoff_h + p.back_t - 1).translate((0, 0, 1)))\n    ew =\
    \ p.wall_head_d + 1\n    nw = p.wall_shank_d + 0.6\n    for sx in (-1, 1):\n \
    \       x = sx * p.key_dx / 2.0\n        yc = p.key_y + p.key_travel / 2.0\n \
    \       s = s.union(cq.Workplane('XY').center(x, yc).rect(p.key_pad_w, p.key_pad_l).extrude(p.key_pad_t))\n\
    \        entry = cq.Workplane('XY').center(x, p.key_y).circle(ew / 2.0).extrude(p.key_neck_t\
    \ + 0.5)\n        neck = cq.Workplane('XY').center(x, yc).rect(nw, p.key_travel).extrude(p.key_neck_t\
    \ + 0.5)\n        neck_end = cq.Workplane('XY').center(x, p.key_y + p.key_travel).circle(nw\
    \ / 2.0).extrude(p.key_neck_t + 0.5)\n        zn = p.key_neck_t\n        zg =\
    \ zn + p.key_head_gap\n        y_end = p.key_y + p.key_travel + ew / 2.0\n   \
    \     L = p.key_travel + ew\n        cav = (cq.Workplane('XZ', origin=(0, y_end,\
    \ 0))\n               .polyline([(x - ew / 2.0, zn), (x + ew / 2.0, zn), (x +\
    \ ew / 2.0, zg), (x, zg + p.key_roof_h), (x - ew / 2.0, zg)]).close()\n      \
    \         .extrude(L))\n        s = s.cut(entry).cut(neck).cut(neck_end).cut(cav)\n\
    \    col_mid = (p.esp_col_a + p.esp_col_b) / 2.0\n    esp_x = (col_mid - (p.pb_cols\
    \ + 1) / 2.0) * p.pb_pitch\n    z_port = p.back_t + p.standoff_h + p.pb_t + p.usb_bottom_h\
    \ + p.usb_h / 2.0\n    slot_w = 2 * p.usb_offset + p.plug_grip_w + 2 * p.usb_clear\n\
    \    slot_h = p.plug_grip_t + 2 * p.usb_clear\n    z0 = z_port - slot_h / 2.0\n\
    \    notch = cq.Workplane('XY').box(slot_w, p.wall_t * 4, H - z0 + 1, centered=(True,\
    \ True, False)).translate((esp_x, -p.box_flat + p.wall_t / 2.0, z0))\n    s =\
    \ s.cut(notch)\n    return s\n"
  print_orientation: back (wall) face on the bed, z=0
  use_orientation: z=0 against the wall, flat face down
- id: front_lid
  role: final
  material: PLA matte white
  code: "import math\ndef build(p):\n    def dshape(r, yf, h):\n        c = cq.Workplane('XY').circle(r).extrude(h)\n\
    \        b = cq.Workplane('XY').center(0, (r - yf) / 2.0).rect(2 * r + 2, r +\
    \ yf).extrude(h)\n        return c.intersect(b)\n    R_in = p.box_r - p.wall_t\n\
    \    yf_in = p.box_flat - p.wall_t\n    tot = p.lid_t + p.lid_pad_t\n    s = dshape(p.box_r,\
    \ p.box_flat, p.lid_t)\n    rr = R_in - p.boss_inset\n    pts = [(rr * math.cos(math.radians(a)),\
    \ rr * math.sin(math.radians(a))) for a in (45, 135, 225, 315)]\n    lip = dshape(R_in\
    \ - 0.3, yf_in - 0.3, 2).cut(dshape(R_in - 1.8, yf_in - 1.8, 2))\n    lip = lip.cut(cq.Workplane('XY').pushPoints(pts).circle(p.boss_d\
    \ / 2.0 + 0.6).extrude(2))\n    col_mid = (p.esp_col_a + p.esp_col_b) / 2.0\n\
    \    esp_x = (col_mid - (p.pb_cols + 1) / 2.0) * p.pb_pitch\n    slot_w = 2 *\
    \ p.usb_offset + p.plug_grip_w + 2 * p.usb_clear\n    lip = lip.cut(cq.Workplane('XY').box(slot_w,\
    \ 8, 2, centered=(True, True, False)).translate((-esp_x, -yf_in, 0)))\n    s =\
    \ s.union(lip.translate((0, 0, p.lid_t - 0.01)))\n    pads = cq.Workplane('XY').pushPoints(pts).circle(p.boss_d\
    \ / 2.0).extrude(p.lid_pad_t + 0.5).translate((0, 0, p.lid_t - 0.5))\n    pads\
    \ = pads.intersect(dshape(R_in - 0.3, yf_in - 0.3, tot))\n    s = s.union(pads)\n\
    \    dx = (p.disc_hole_gap + p.disc_hole_d) / 2.0\n    dpts = [(-dx, 0), (dx,\
    \ 0)]\n    s = s.union(cq.Workplane('XY').pushPoints(dpts).circle(p.boss_d / 2.0).extrude(p.lid_pad_t\
    \ + 0.5).translate((0, 0, p.lid_t - 0.5)))\n    s = s.cut(cq.Workplane('XY').pushPoints(pts).circle(1.7).extrude(tot))\n\
    \    s = s.cut(cq.Workplane('XY').pushPoints(pts).circle(p.m3_head_d / 2.0 + 0.5).extrude(p.m3_head_h\
    \ + 0.4))\n    s = s.cut(cq.Workplane('XY').pushPoints(dpts).circle(p.insert_hole_d\
    \ / 2.0).extrude(tot - 0.5))\n    for (x, y) in dpts:\n        s = s.cut(cq.Workplane('XY').add(cq.Solid.makeCone(p.insert_hole_d\
    \ / 2.0 + 0.6, p.insert_hole_d / 2.0, 0.6, cq.Vector(x, y, 0))))\n    ws = cq.Workplane('XY').center(0,\
    \ (p.wire_slot_y0 + p.wire_slot_y1) / 2.0).slot2D(p.wire_slot_y1 - p.wire_slot_y0,\
    \ p.wire_slot_w, 90).extrude(tot)\n    s = s.cut(ws)\n    return s\n"
  print_orientation: front face (disc side) on the bed, z=0; pads and lip face up
  use_orientation: front face toward the room, disc screwed onto it
