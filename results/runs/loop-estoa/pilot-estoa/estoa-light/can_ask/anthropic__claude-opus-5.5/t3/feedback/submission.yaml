manual:
- n: '1'
  text: 'Print back_shell with its wall face on the bed and front_lid with its front
    face on the bed, in matte white PLA, with no supports. On the textured or PEI
    plate, add a 5 mm brim to back_shell and wipe the plate with glue stick: the base
    is 180 mm across and must stay down. In the slicer, check that back_shell shows
    as one object.'
  parts:
  - back_shell
  - front_lid
  hardware: []
  tool: null
- n: '2'
  text: 'Heat-set inserts: set the iron to about 200 °C, not hotter. Put the insert
    on the chamfered hole, hold the iron upright and let it sink in under light pressure,
    without forcing it. Stop when it''s flush, then pull the iron away and press the
    insert square with a flat metal tool while it cools. Fit 4 in the shell''s wall
    bosses and 2 in the lid''s centre holes (from the lid''s front face).'
  parts:
  - back_shell
  - front_lid
  hardware:
  - insert
  tool: soldering iron with insert tip
- n: '3'
  text: Set the perfboard ESP32-side up on the 4 standoffs. The ESP32's USB end goes
    against the flat bottom wall, with the ESP32 on the same side as the notch. Fix
    it with the 4 M2x6 self-tapping screws.
  parts: []
  hardware:
  - perfboard
  - pb_screw
  tool: small Phillips screwdriver
- n: '4'
  text: Check that the charger plug goes through the bottom notch and clicks fully
    into the ESP32 port.
  parts: []
  hardware:
  - esp32
  tool: null
- n: '5'
  text: Feed the disc wires out through the lid's long slot. Fit the lid onto the
    shell, with the flat edges together and the lip inside the wall; the lid closes
    off the top of the USB notch. Fix it with 4 M3x8 screws.
  parts:
  - front_lid
  - back_shell
  hardware:
  - lid_screw
  tool: 2.5 mm hex key
- n: '6'
  text: Plug the wires into the disc. Lay the disc on the lid with its wires at 12
    o'clock, away from the flat bottom, and screw it on through its centre holes with
    2 M3x6 screws.
  parts: []
  hardware:
  - disc
  - disc_screw
  tool: 2.5 mm hex key
- n: '7'
  text: 'Fix two #8 screws 80 mm apart and level, with the heads standing 3.2 mm off
    the wall. Put the heads into the round openings, slide the box down 12 mm and
    plug in the charger.'
  parts:
  - back_shell
  hardware: []
  tool: drill, level
