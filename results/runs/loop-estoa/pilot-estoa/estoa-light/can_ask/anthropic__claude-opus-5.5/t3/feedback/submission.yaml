task: estoa-light
note: 'Rev 2. (1) Split into pieces: the wall bosses only touched the wall along a
  line and were extruded from the top of the back plate. Now the bosses and standoffs
  start at z=0 and overlap the wall by 1.5 mm, so the shell is one solid. Also added
  a brim and glue-stick advice for the 180 mm base. (2) Messy roof around the hole:
  there are no flat bridges now. The USB opening is a notch open at the top, which
  the lid closes. The keyhole head pocket has a 45° peaked roof. (3) Inserts: bosses
  are now 12 mm across instead of 10, fused to the wall, with a chamfered lead-in,
  plus lower-temperature pressing steps.'
questions:
- text: Is anything sticking out on the disc's back, and how thick is the disc?
  answer: null
- text: Is the ESP32's USB-C mouth flush with the end of its board?
  answer: null
