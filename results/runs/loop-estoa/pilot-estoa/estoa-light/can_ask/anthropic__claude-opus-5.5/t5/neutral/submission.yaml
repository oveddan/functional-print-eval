manual:
- n: '1'
  text: Print fit_coupon. Use a soldering iron to press two inserts into the disc
    holes until they sit flush. Check that the perfboard sits on the four standoffs
    with its holes lined up and that the M2 screws bite. Check that the disc goes
    on with two M3x6 screws. If anything is off, tell me before you print the big
    parts.
  parts:
  - fit_coupon
  hardware:
  - insert
  - m3x6
  - m2
  - perf
  - disc
  tool: soldering iron
- n: '2'
  text: Print the shell with its front face on the bed and the back_plate with its
    counterbored face on the bed. Neither needs supports.
  parts:
  - shell
  - back_plate
  hardware: []
  tool: null
- n: '3'
  text: Use the soldering iron to press inserts into the two holes in the shell's
    front face and the four holes in the rim bosses at the back. Each should end up
    flush.
  parts:
  - shell
  hardware:
  - insert
  tool: soldering iron
- n: '4'
  text: Put the perfboard inside the shell with the ESP32 side facing out of the open
    back and the USB-C end toward the flat bottom wall. Fix it to the four standoffs
    with the M2 self-tapping screws.
  parts:
  - shell
  hardware:
  - perf
  - esp
  - m2
  tool: small screwdriver
- n: '5'
  text: Feed the four disc wires out through the slot at 12 o'clock in the front face.
    Connect them to the disc. Lay the disc on the front face with its wires at 12
    o'clock and screw it down through its two centre holes with the M3x6 screws. Don't
    overtighten.
  parts:
  - shell
  hardware:
  - disc
  - m3x6
  tool: 2.5 mm hex key
- n: '6'
  text: Push the charger's plug through the opening in the flat bottom and into the
    ESP32 to check it reaches. Then put the back_plate on, lining up its flat edge
    with the shell's flat bottom, and fasten it with four M3x8 screws into the rim
    inserts.
  parts:
  - back_plate
  - shell
  hardware:
  - m3x8
  tool: 2.5 mm hex key
- n: '7'
  text: 'In the wall, put two #8 screws 80 mm apart on a level line, with their heads
    sticking out about 6 mm. Fit the large ends of the keyholes over the heads and
    let the box drop about 10 mm so the narrow slots hold it.'
  parts:
  - back_plate
  hardware: []
  tool: null
