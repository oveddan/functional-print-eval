task: estoa-light
note: 'The disc is 241.6 mm across, which works out from your measurements. The box
  behind it is 180 mm round with a flat bottom, so the disc overhangs it on all sides
  and the box stays hidden. The USB opening is in that flat bottom, so the cable hangs
  straight down. In this revision I widened the opening to 34 x 11 mm, because the
  ESP32''s left/right position on the perfboard is unknown and the port might sit
  up to about 15 mm off centre. Still guessed: how deep the port sits (port measurements
  were ambiguous), and the disc and perfboard thickness (1.6 mm each). If the disc
  has anything tall on its back, tell me and I''ll add relief pockets.'
