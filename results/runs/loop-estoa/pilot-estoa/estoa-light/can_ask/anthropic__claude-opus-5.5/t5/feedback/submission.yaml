manual:
- n: '1'
  text: Print fit_coupon if you haven't already, and test the perfboard (M2 screws)
    and the disc (inserts and M3x6 screws) on it.
  parts:
  - fit_coupon
  hardware:
  - insert
  - m3x6
  - m2
  - perf
  - disc
  tool: soldering iron
- n: '2'
  text: Print the shell with its front face on the bed and the back_plate with its
    counterbored face on the bed. Neither needs supports. The USB opening is now a
    notch that runs out to the shell's back rim, so there's nothing to bridge over
    it; the back plate closes it off.
  parts:
  - shell
  - back_plate
  hardware: []
  tool: null
- n: '3'
  text: Use the soldering iron to press inserts into the 2 holes in the front face
    and the 4 holes in the rim bosses until they sit flush.
  parts:
  - shell
  hardware:
  - insert
  tool: soldering iron
- n: '4'
  text: Fix the perfboard to the four standoffs with the M2 screws, ESP32 side facing
    out of the open back and the USB-C end toward the flat bottom.
  parts:
  - shell
  hardware:
  - perf
  - esp
  - m2
  tool: small screwdriver
- n: '5'
  text: Feed the disc wires through the slot at 12 o'clock and connect them. Lay the
    disc on the front face with its wires at 12 o'clock and fix it with the two M3x6
    screws.
  parts:
  - shell
  hardware:
  - disc
  - m3x6
  tool: 2.5 mm hex key
- n: '6'
  text: Check that the charger plug goes through the notch and into the port. Put
    the back_plate on with its flat edge matching the shell's flat bottom, and fasten
    it with four M3x8 screws.
  parts:
  - back_plate
  - shell
  hardware:
  - m3x8
  tool: 2.5 mm hex key
- n: '7'
  text: 'Drive the two #8 wall screws 80 mm apart on a level line, leaving 3 to 4
    mm of bare shank between the wall and the underside of each head. Put the round
    ends of the keyholes over the heads and let the box drop 10 mm. Only a 2 mm lip
    sits between the wall and each head, and behind it there''s an 11 mm channel the
    head slides up into.'
  parts:
  - back_plate
  hardware: []
  tool: null
