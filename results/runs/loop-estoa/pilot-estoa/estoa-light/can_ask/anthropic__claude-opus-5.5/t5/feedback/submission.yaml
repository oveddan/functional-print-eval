task: estoa-light
note: 'Rev 2. First, the shell''s USB opening is now a notch open to the back rim,
  so it has no roof to bridge. Second, I rebuilt the keyholes: the plate is only 2
  mm thick between the wall and the screw head, and behind that is a head-width channel.
  Before, the heads had to clear the full 5 mm plate.'
