parts:
- id: shell
  role: final
  material: PLA matte white
  code: "import math\ndef build(p):\n    R=p.box_r; t=p.wall_t; H=p.box_depth; ft=p.front_t;\
    \ fy=p.flat_y\n    def prof(r, flat, z0, h):\n        c = cq.Workplane('XY').workplane(offset=z0).circle(r).extrude(h)\n\
    \        b = cq.Workplane('XY').box(4*r, 2*r, 4*H).translate((0, -flat - r, 0))\n\
    \        return c.cut(b)\n    body = prof(R, fy, 0, H)\n    body = body.cut(prof(R\
    \ - t, fy - t, ft, H))\n    a = p.back_boss_r/math.sqrt(2)\n    back_pts = [(a,a),(-a,a),(a,-a),(-a,-a)]\n\
    \    body = body.union(cq.Workplane('XY').workplane(offset=ft-0.5).pushPoints(back_pts).circle(p.boss_d/2).extrude(H-ft+0.5))\n\
    \    d = p.disc_hole_pitch/2\n    disc_pts = [(d,0),(-d,0)]\n    body = body.union(cq.Workplane('XY').workplane(offset=ft-0.5).pushPoints(disc_pts).circle(p.boss_d/2).extrude(p.disc_boss_h+0.5))\n\
    \    hx = p.perf_w/2 - p.perf_hole_inset\n    yb = -(fy - t) + p.perf_gap\n  \
    \  y0 = yb + p.perf_hole_inset\n    y1 = yb + p.perf_l - p.perf_hole_inset\n \
    \   so_pts = [(hx,y0),(-hx,y0),(hx,y1),(-hx,y1)]\n    body = body.union(cq.Workplane('XY').workplane(offset=ft-0.5).pushPoints(so_pts).circle(p.standoff_d/2).extrude(p.standoff_h+0.5))\n\
    \    body = body.cut(cq.Workplane('XY').pushPoints(disc_pts).circle(p.insert_hole_d/2).extrude(p.disc_insert_depth))\n\
    \    body = body.cut(cq.Workplane('XY').workplane(offset=H-p.back_insert_depth).pushPoints(back_pts).circle(p.insert_hole_d/2).extrude(p.back_insert_depth+1))\n\
    \    body = body.cut(cq.Workplane('XY').workplane(offset=ft-1).pushPoints(so_pts).circle(p.m2_pilot_d/2).extrude(p.standoff_h+2))\n\
    \    uz = ft + p.standoff_h + p.perf_t + p.esp_port_z\n    zb = uz - p.usb_open_h/2\n\
    \    hh = H + 1 - zb\n    body = body.cut(cq.Workplane('XY').box(p.usb_open_w,\
    \ 3*t, hh).translate((0, -(fy - t/2), zb + hh/2)))\n    L = R + 10 - p.wire_slot_r0\n\
    \    body = body.cut(cq.Workplane('XY').box(p.wire_slot_w, L, 2*ft).translate((0,\
    \ p.wire_slot_r0 + L/2, 0)))\n    return body\n"
  print_orientation: front face (the one the disc sits on) on the bed, open side up;
    no supports
  use_orientation: front face toward the room, open side against the back plate
- id: back_plate
  role: final
  material: PLA matte white
  code: "import math\ndef build(p):\n    R=p.box_r; fy=p.flat_y; T=p.back_t\n    plate\
    \ = cq.Workplane('XY').circle(R).extrude(T)\n    plate = plate.cut(cq.Workplane('XY').box(4*R,\
    \ 2*R, 4*T).translate((0, -fy - R, 0)))\n    a = p.back_boss_r/math.sqrt(2)\n\
    \    pts = [(a,a),(-a,a),(a,-a),(-a,-a)]\n    plate = plate.cut(cq.Workplane('XY').pushPoints(pts).circle(p.m3_clear_d/2).extrude(T))\n\
    \    plate = plate.cut(cq.Workplane('XY').pushPoints(pts).circle(p.m3_cb_d/2).extrude(p.m3_cb_depth))\n\
    \    for sx in (1, -1):\n        x = sx*p.keyhole_x\n        plate = plate.cut(cq.Workplane('XY').center(x,\
    \ p.keyhole_y).circle(p.keyhole_big_d/2).extrude(T))\n        plate = plate.cut(cq.Workplane('XY').center(x,\
    \ p.keyhole_y + p.keyhole_travel/2).slot2D(p.keyhole_travel + p.keyhole_slot_w,\
    \ p.keyhole_slot_w, 90).extrude(T))\n        plate = plate.cut(cq.Workplane('XY').workplane(offset=p.keyhole_lip).center(x,\
    \ p.keyhole_y + p.keyhole_travel/2).slot2D(p.keyhole_travel + p.keyhole_big_d,\
    \ p.keyhole_big_d, 90).extrude(T))\n    return plate\n"
  print_orientation: wall face (with the screw counterbores) on the bed
  use_orientation: flat against the wall, closing the back of the shell
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    W = p.perf_w + 6; L = p.perf_l + 6\n    base = cq.Workplane('XY').box(W,\
    \ L, 2, centered=(True, True, False))\n    hx = p.perf_w/2 - p.perf_hole_inset;\
    \ hy = p.perf_l/2 - p.perf_hole_inset\n    so = [(hx,hy),(-hx,hy),(hx,-hy),(-hx,-hy)]\n\
    \    d = p.disc_hole_pitch/2\n    dp = [(d,0),(-d,0)]\n    base = base.union(cq.Workplane('XY').workplane(offset=1.5).pushPoints(so).circle(p.standoff_d/2).extrude(p.standoff_h+0.5))\n\
    \    base = base.union(cq.Workplane('XY').workplane(offset=1.5).pushPoints(dp).circle(p.boss_d/2).extrude(p.disc_boss_h+1.5))\n\
    \    base = base.cut(cq.Workplane('XY').workplane(offset=1).pushPoints(so).circle(p.m2_pilot_d/2).extrude(p.standoff_h+2))\n\
    \    base = base.cut(cq.Workplane('XY').pushPoints(dp).circle(p.insert_hole_d/2).extrude(p.disc_insert_depth))\n\
    \    return base\n"
  print_orientation: flat plate on the bed, standoffs up
  use_orientation: test only
