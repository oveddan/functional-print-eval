task: estoa-light
note: 'Only change: the USB opening in the bottom wall had a 30 mm roof that printed
  as a curved bridge and sagged. It''s now a notch open to the rim, so nothing has
  to bridge, and the disc closes it from the front once it''s on. Everything else
  is unchanged.'
