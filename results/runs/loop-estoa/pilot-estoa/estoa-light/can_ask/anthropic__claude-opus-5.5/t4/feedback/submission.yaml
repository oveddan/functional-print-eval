manual:
- n: '1'
  text: If you've already checked fit_coupon, skip this step. Otherwise print it,
    press an M3 insert into each pillar, screw the disc to it with the two M3x8 screws,
    and hang its keyhole on a wall screw.
  parts:
  - fit_coupon
  hardware:
  - m3_insert
  - m3_screw
  - disc
  tool: soldering iron, 2.5 mm hex key
- n: '2'
  text: Print back_box in matte white PLA, back face on the bed, with no supports
    and the brim off. The USB opening at the bottom is now a notch open up to the
    rim, so there's no bridged roof to sag.
  parts:
  - back_box
  hardware: []
  tool: null
- n: '3'
  text: Press an M3 insert into each of the two centre pillars, flush with the top.
  parts:
  - back_box
  hardware:
  - m3_insert
  tool: soldering iron
- n: '4'
  text: Put the perfboard on the four standoffs near the bottom, ESP32 side up, with
    the USB-C port pointing down at the notch. Fix it with the four M2x6 self-tapping
    screws.
  parts:
  - back_box
  hardware:
  - perfboard
  - esp32
  - m2_screw
  tool: small Phillips screwdriver
- n: '5'
  text: Plug the wires into the disc's input (they need to reach about 200 mm to the
    12 o'clock input). Lay the disc on the rim, LED side out, wires at the top, and
    screw it to the pillars with the two M3x8 screws. The disc closes off the top
    of the USB notch.
  parts:
  - back_box
  hardware:
  - disc
  - m3_screw
  tool: 2.5 mm hex key
- n: '6'
  text: Put two wall screws level, 120 mm apart, with each head about 5 mm out from
    the wall. Push the screw heads into the keyholes and slide the light down so it
    locks. The disc's centre ends up 80 mm below the screws. Plug the charger in through
    the bottom notch.
  parts:
  - back_box
  hardware: []
  tool: null
