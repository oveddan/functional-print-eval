criteria:
- id: disk_hole_pitch_and_insert
  part: light_box
  feature: central_disk_bosses
  relation: engages
  hardware: m3_insert
  clearance_mm: null
  params:
  - led_disk_between_holes
  - led_disk_hole_d
  - m3_insert_hole_d
  - m3_insert_len
  check:
    method: coupon
    ref: fit_coupon
    description: Verify the 33.5 mm hole spacing against the two central holes on
      the LED disk and press-fit the M3x4x5 heat-set inserts into the 4.3 mm pockets.
- id: disk_perimeter_support
  part: light_box
  feature: outer_rim
  relation: supports
  hardware: led_disk
  clearance_mm: null
  params:
  - led_disk_between_holes
  - led_disk_hole_d
  - led_disk_hole_to_edge_1
  - led_disk_hole_to_edge_2
  - box_depth
  check:
    method: measure
    ref: null
    description: Verify the outer rim supports the 241.58 mm LED disk perimeter cleanly
      with wire clearance at 12 o'clock.
- id: perfboard_mount_fit
  part: light_box
  feature: perfboard_standoffs
  relation: engages
  hardware: m2_perf_screw
  clearance_mm: null
  params:
  - perfboard_w
  - perfboard_l
  - perfboard_hole_d
  - perfboard_hole_edge_dist
  - m2_pilot_d
  - perfboard_standoff_h
  check:
    method: coupon
    ref: fit_coupon
    description: Verify the M2x6 self-tapping screw threads smoothly into the 1.7
      mm standoff hole and that the 45.8 x 65.8 mm standoff grid matches the perfboard
      corner holes.
- id: usb_plug_access
  part: light_box
  feature: usb_access_cutout
  relation: clears
  hardware: esp32
  clearance_mm: 5.0
  params:
  - esp32_l
  - esp32_w
  - esp32_edge_to_perf_edge
  - esp32_usb_to_edge
  - esp32_usb_w
  - esp32_usb_h
  - esp32_usb_bottom_z
  - usb_cutout_w
  - usb_cutout_wall_h
  - usb_cutout_z_min
  check:
    method: measure
    ref: null
    description: Ensure the USB-C charger plug passes freely through the bottom access
      opening into the ESP32 USB-C receptacle, with the 45-degree gabled arch printing
      cleanly with zero sagging loops.
- id: wall_keyhole_fit
  part: light_box
  feature: keyhole_hangers
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - wall_screw_head_d
  - wall_screw_shaft_d
  - keyhole_entry_d
  - keyhole_slot_w
  - keyhole_slot_l
  check:
    method: coupon
    ref: fit_coupon
    description: 'Test the #8 round-head wall screw (up to 9 mm head) in the coupon
      keyhole slot to confirm the head enters and slides into the captive pocket flush
      with the back face.'
manual:
- n: '1'
  text: 'Print the fit_coupon first. Hold it against the two central holes on the
    LED disk to verify the 33.5 mm spacing, test-fit your #8 wall screw head in the
    keyhole slot, press an M3x4x5 heat-set insert into one boss, and test an M2x6
    self-tapping screw in the small standoff boss.'
  parts:
  - fit_coupon
  hardware:
  - m3_insert
  - m2_perf_screw
  - led_disk
  tool: Soldering iron and Phillips screwdriver
- n: '2'
  text: Print the light_box flat on the build plate (back face on z = 0, no supports
    needed). Use a soldering iron to press the two M3x4x5 heat-set inserts flush into
    the top of the two central mounting pillars.
  parts:
  - light_box
  hardware:
  - m3_insert
  tool: Soldering iron
- n: '3'
  text: Place the perfboard (with the ESP32 installed in its female headers) onto
    the four lower standoffs inside the light_box so the ESP32's USB-C port faces
    the bottom access opening at 6 o'clock. Fasten the four corners using the four
    M2x6 self-tapping screws.
  parts:
  - light_box
  hardware:
  - perfboard
  - esp32
  - m2_perf_screw
  tool: Small Phillips screwdriver
- n: '4'
  text: Route the four wires from the perfboard to the LED disk's 4-pin input at 12
    o'clock (resting inside the top inner rim relief). Align the two central holes
    of the LED disk over the central pillars and fasten with the two ISO 4762 M3x8
    socket head cap screws.
  parts:
  - light_box
  hardware:
  - led_disk
  - m3_disk_screw
  tool: 2.5 mm hex key
- n: '5'
  text: 'Install your two #8 wall screws into the wall horizontally spaced 120.0 mm
    apart, leaving the undersides of their heads ~2.3 mm off the wall. Plug the USB-C
    charger cable straight up through the bottom access opening into the ESP32, and
    hang the box flat against the wall on the two keyhole slots.'
  parts:
  - light_box
  hardware: []
  tool: Level and screwdriver
