task: estoa-light
note: Replaced the flat bridge over the curved bottom USB-C opening with a self-supporting
  45-degree peaked gable roof centered on the ESP32 USB-C port (x = +7.335 mm). Because
  the cylindrical wall curves in X-Y, a horizontal bridge at z = 28 mm sagged into
  loose loops; the 45-degree gabled roof eliminates the horizontal overhang completely
  while keeping the top rim continuous at z = 35 mm.
