parts:
- id: light_box
  role: final
  material: PLA
  code: "def build(p):\n    disk_od = (\n        p.led_disk_between_holes\n      \
    \  + 2.0 * p.led_disk_hole_d\n        + p.led_disk_hole_to_edge_1\n        + p.led_disk_hole_to_edge_2\n\
    \    )\n    box_r = disk_od / 2.0\n    inner_r = box_r - p.side_wall_t\n    disk_hole_pitch\
    \ = p.led_disk_between_holes + p.led_disk_hole_d\n\n    perf_dx = p.perfboard_w\
    \ / 2.0 - (p.perfboard_hole_edge_dist + p.perfboard_hole_d / 2.0)\n    perf_dy\
    \ = p.perfboard_l / 2.0 - (p.perfboard_hole_edge_dist + p.perfboard_hole_d / 2.0)\n\
    \n    # 1. Outer cylindrical body and hollow interior\n    outer = cq.Workplane(\"\
    XY\").circle(box_r).extrude(p.box_depth)\n    cavity = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.back_wall_t)\n        .circle(inner_r)\n  \
    \      .extrude(p.box_depth)\n    )\n    part = outer.cut(cavity)\n\n    # 2.\
    \ Central mounting bosses for the LED disk + stiffening rib\n    rib = (\n   \
    \     cq.Workplane(\"XY\")\n        .box(disk_hole_pitch, 5.0, 12.0, centered=(True,\
    \ True, False))\n    )\n    boss_pts = [(-disk_hole_pitch / 2.0, 0.0), (disk_hole_pitch\
    \ / 2.0, 0.0)]\n    disk_bosses = (\n        cq.Workplane(\"XY\")\n        .pushPoints(boss_pts)\n\
    \        .circle(p.disk_boss_od / 2.0)\n        .extrude(p.box_depth)\n    )\n\
    \    part = part.union(rib).union(disk_bosses)\n\n    # M3 heat-set insert pockets\
    \ in the top of the two central bosses\n    insert_cuts = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.box_depth - (p.m3_insert_len + 2.0))\n    \
    \    .pushPoints(boss_pts)\n        .circle(p.m3_insert_hole_d / 2.0)\n      \
    \  .extrude(p.m3_insert_len + 2.5)\n    )\n    part = part.cut(insert_cuts)\n\n\
    \    # 3. Four standoffs for the perfboard\n    standoff_pts = [\n        (-perf_dx,\
    \ p.perfboard_center_y - perf_dy),\n        (perf_dx, p.perfboard_center_y - perf_dy),\n\
    \        (-perf_dx, p.perfboard_center_y + perf_dy),\n        (perf_dx, p.perfboard_center_y\
    \ + perf_dy),\n    ]\n    standoffs = (\n        cq.Workplane(\"XY\")\n      \
    \  .workplane(offset=p.back_wall_t)\n        .pushPoints(standoff_pts)\n     \
    \   .circle(p.perfboard_standoff_od / 2.0)\n        .extrude(p.perfboard_standoff_h)\n\
    \    )\n    part = part.union(standoffs)\n\n    pilot_cuts = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.back_wall_t + 0.4)\n        .pushPoints(standoff_pts)\n\
    \        .circle(p.m2_pilot_d / 2.0)\n        .extrude(p.perfboard_standoff_h)\n\
    \    )\n    part = part.cut(pilot_cuts)\n\n    # 4. Two keyhole wall-mounting\
    \ bosses and slots\n    kh_xs = [-p.keyhole_spacing_x / 2.0, p.keyhole_spacing_x\
    \ / 2.0]\n    kh_boss_h = 8.5\n    kh_lip_t = 2.4\n    kh_pocket_z_max = 6.2\n\
    \    kh_pocket_d = p.keyhole_entry_d + 1.5\n\n    for kx in kh_xs:\n        kh_pad\
    \ = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=0.0)\n\
    \            .center(kx, p.keyhole_y + p.keyhole_slot_l / 2.0)\n            .box(kh_pocket_d\
    \ + 8.0, p.keyhole_entry_d + p.keyhole_slot_l + 8.0, kh_boss_h, centered=(True,\
    \ True, False))\n        )\n        part = part.union(kh_pad)\n\n        # Entry\
    \ hole from z = 0 to kh_pocket_z_max\n        entry_cut = (\n            cq.Workplane(\"\
    XY\")\n            .center(kx, p.keyhole_y)\n            .circle(p.keyhole_entry_d\
    \ / 2.0)\n            .extrude(kh_pocket_z_max)\n        )\n        # Narrow shaft\
    \ slot through the back lip (z = 0 to kh_lip_t)\n        slot_cut = (\n      \
    \      cq.Workplane(\"XY\")\n            .center(kx, p.keyhole_y + p.keyhole_slot_l\
    \ / 2.0)\n            .box(p.keyhole_slot_w, p.keyhole_slot_l, kh_lip_t, centered=(True,\
    \ True, False))\n        )\n        top_round_cut = (\n            cq.Workplane(\"\
    XY\")\n            .center(kx, p.keyhole_y + p.keyhole_slot_l)\n            .circle(p.keyhole_slot_w\
    \ / 2.0)\n            .extrude(kh_lip_t)\n        )\n        # Internal captive\
    \ pocket for the screw head (z = kh_lip_t to kh_pocket_z_max)\n        head_pocket_slot\
    \ = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=kh_lip_t)\n\
    \            .center(kx, p.keyhole_y + p.keyhole_slot_l / 2.0)\n            .box(kh_pocket_d,\
    \ p.keyhole_slot_l, kh_pocket_z_max - kh_lip_t, centered=(True, True, False))\n\
    \        )\n        head_pocket_top = (\n            cq.Workplane(\"XY\")\n  \
    \          .workplane(offset=kh_lip_t)\n            .center(kx, p.keyhole_y +\
    \ p.keyhole_slot_l)\n            .circle(kh_pocket_d / 2.0)\n            .extrude(kh_pocket_z_max\
    \ - kh_lip_t)\n        )\n        part = (\n            part.cut(entry_cut)\n\
    \            .cut(slot_cut)\n            .cut(top_round_cut)\n            .cut(head_pocket_slot)\n\
    \            .cut(head_pocket_top)\n        )\n\n    # 5. Bottom USB-C charger\
    \ access opening with 45-degree self-supporting gable roof\n    usb_x_c = (\n\
    \        p.perfboard_w / 2.0\n        - p.esp32_edge_to_perf_edge\n        - p.esp32_usb_to_edge\n\
    \        - p.esp32_usb_w / 2.0\n    )\n    w2 = p.usb_cutout_w / 2.0\n    z0 =\
    \ p.usb_cutout_z_min\n    z1 = z0 + p.usb_cutout_wall_h\n    z2 = z1 + w2\n\n\
    \    gable_prism = (\n        cq.Workplane(\"XZ\")\n        .polyline([\n    \
    \        (usb_x_c - w2, z0),\n            (usb_x_c + w2, z0),\n            (usb_x_c\
    \ + w2, z1),\n            (usb_x_c, z2),\n            (usb_x_c - w2, z1),\n  \
    \      ])\n        .close()\n        .extrude(box_r + 25.0, both=True)\n    )\n\
    \    usb_bbox = (\n        cq.Workplane(\"XY\")\n        .center(usb_x_c, -box_r)\n\
    \        .box(p.usb_cutout_w + 10.0, 30.0, p.box_depth, centered=(True, True,\
    \ False))\n    )\n    usb_cut = gable_prism.intersect(usb_bbox)\n    part = part.cut(usb_cut)\n\
    \n    # 6. Top inner-rim relief at 12 o'clock (+Y) for LED disk input wire solder\
    \ joints\n    wire_relief = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.box_depth\
    \ - 6.0)\n        .center(0.0, inner_r)\n        .box(36.0, 4.0, 6.5, centered=(True,\
    \ True, False))\n    )\n    part = part.cut(wire_relief)\n\n    return part\n"
  print_orientation: Flat on the back face (z = 0 on the print bed), with the open
    front facing +z. The USB-C opening uses a 45-degree peaked gable roof so there
    are no curved horizontal bridges.
  use_orientation: 'Same as print orientation: back face (z = 0) rests flat against
    the wall, +y points up toward 12 o''clock, and +z points out through the LED disk.'
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    disk_hole_pitch = p.led_disk_between_holes + p.led_disk_hole_d\n\
    \    kh_lip_t = 2.4\n    kh_pocket_z_max = 6.2\n    kh_pocket_d = p.keyhole_entry_d\
    \ + 1.5\n\n    # Compact test plate combining:\n    # - 2 bosses at disk_hole_pitch\
    \ (33.5 mm) with M3 insert hole\n    # - 1 perfboard standoff with M2 self-tapping\
    \ pilot hole\n    # - 1 keyhole hanger slot for the #8 wall screw\n    base =\
    \ cq.Workplane(\"XY\").box(52.0, 44.0, 8.5, centered=(True, True, False))\n\n\
    \    # Keyhole at x = 0, y = -8..+2\n    entry_cut = (\n        cq.Workplane(\"\
    XY\")\n        .center(0.0, -8.0)\n        .circle(p.keyhole_entry_d / 2.0)\n\
    \        .extrude(kh_pocket_z_max)\n    )\n    slot_cut = (\n        cq.Workplane(\"\
    XY\")\n        .center(0.0, -8.0 + p.keyhole_slot_l / 2.0)\n        .box(p.keyhole_slot_w,\
    \ p.keyhole_slot_l, kh_lip_t, centered=(True, True, False))\n    )\n    top_round_cut\
    \ = (\n        cq.Workplane(\"XY\")\n        .center(0.0, -8.0 + p.keyhole_slot_l)\n\
    \        .circle(p.keyhole_slot_w / 2.0)\n        .extrude(kh_lip_t)\n    )\n\
    \    head_pocket_slot = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=kh_lip_t)\n\
    \        .center(0.0, -8.0 + p.keyhole_slot_l / 2.0)\n        .box(kh_pocket_d,\
    \ p.keyhole_slot_l, kh_pocket_z_max - kh_lip_t, centered=(True, True, False))\n\
    \    )\n    head_pocket_top = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=kh_lip_t)\n\
    \        .center(0.0, -8.0 + p.keyhole_slot_l)\n        .circle(kh_pocket_d /\
    \ 2.0)\n        .extrude(kh_pocket_z_max - kh_lip_t)\n    )\n\n    # Two M3 insert\
    \ holes spaced by disk_hole_pitch at y = +14\n    boss_pts = [(-disk_hole_pitch\
    \ / 2.0, 14.0), (disk_hole_pitch / 2.0, 14.0)]\n    insert_cuts = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=8.5 - (p.m3_insert_len + 2.0))\n        .pushPoints(boss_pts)\n\
    \        .circle(p.m3_insert_hole_d / 2.0)\n        .extrude(p.m3_insert_len +\
    \ 2.5)\n    )\n\n    # One M2 self-tapping pilot boss at x = 18, y = -8\n    m2_boss\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=8.5)\n        .center(18.0,\
    \ -8.0)\n        .circle(p.perfboard_standoff_od / 2.0)\n        .extrude(p.perfboard_standoff_h)\n\
    \    )\n    m2_cut = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=8.5)\n\
    \        .center(18.0, -8.0)\n        .circle(p.m2_pilot_d / 2.0)\n        .extrude(p.perfboard_standoff_h)\n\
    \    )\n\n    coupon = (\n        base.union(m2_boss)\n        .cut(entry_cut)\n\
    \        .cut(slot_cut)\n        .cut(top_round_cut)\n        .cut(head_pocket_slot)\n\
    \        .cut(head_pocket_top)\n        .cut(insert_cuts)\n        .cut(m2_cut)\n\
    \    )\n    return coupon\n"
  print_orientation: Flat on z = 0 on the print bed.
  use_orientation: 'Test coupon only: verify LED disk hole pitch (33.5 mm), M3x4x5
    heat-set insert fit, M2x6 self-tapping screw fit, and #8 wall screw keyhole fit.'
