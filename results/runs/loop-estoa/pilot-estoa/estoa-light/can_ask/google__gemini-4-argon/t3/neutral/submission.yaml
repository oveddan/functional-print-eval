parts:
- id: back_box
  role: final
  material: PLA (matte white)
  code: "def build(p):\n    # Outer diameter of LED disk and box from measured hole-to-edge\
    \ and hole-gap readings\n    box_od = (\n        p.led_disk_hole_to_edge_1\n \
    \       + p.led_disk_hole_to_edge_2\n        + p.led_disk_hole_gap\n        +\
    \ 2.0 * p.led_disk_hole_d\n    )\n    box_r = box_od / 2.0\n    inner_r = box_r\
    \ - p.wall_t\n\n    # 1. Main cylindrical shell (z = 0 on print bed / wall, z\
    \ = p.box_depth at LED disk back face)\n    body = cq.Workplane(\"XY\").circle(box_r).extrude(p.box_depth)\n\
    \    cavity = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.back_wall_t)\n\
    \        .circle(inner_r)\n        .extrude(p.box_depth)\n    )\n    body = body.cut(cavity)\n\
    \n    # Wire relief notch on inner half of rim at 12 o'clock (+y) for LED disk\
    \ input solder pads/wires\n    wire_relief = (\n        cq.Workplane(\"XY\")\n\
    \        .workplane(offset=p.box_depth - 6.0)\n        .center(0.0, inner_r)\n\
    \        .box(50.0, 5.0, 10.0, centered=(True, True, False))\n    )\n    body\
    \ = body.cut(wire_relief)\n\n    # 2. USB-C charger access window through the\
    \ 6 o'clock (-y) cylindrical wall\n    # Sits above the perfboard top face (perf_top_z\
    \ = 9.6 mm) from z = 15.0 mm to z = 29.0 mm,\n    # leaving a continuous 3.0 mm\
    \ top bridge at the front rim (span 44 mm < 50 mm max bridge).\n    perf_top_z\
    \ = p.back_wall_t + p.perfboard_standoff_h + p.perfboard_t\n    usb_win_z_min\
    \ = perf_top_z + p.esp32_under_h - 5.5\n    usb_win_z_max = p.box_depth - 3.0\n\
    \    usb_win_h = usb_win_z_max - usb_win_z_min\n    usb_window = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=usb_win_z_min)\n        .center(0.0, -box_r)\n\
    \        .box(p.usb_window_w, 24.0, usb_win_h, centered=(True, True, False))\n\
    \    )\n    body = body.cut(usb_window)\n\n    # 3. Two central M3 mounting pillars\
    \ for own:led-disk (at 3 o'clock and 9 o'clock)\n    disk_hole_pitch = p.led_disk_hole_gap\
    \ + p.led_disk_hole_d\n    nut_slot_w = p.m3_nut_af + 0.25\n    nut_slot_h = p.m3_nut_h\
    \ + 0.4\n    nut_slot_z = p.box_depth - 3.5 - nut_slot_h\n\n    for side in (-1.0,\
    \ 1.0):\n        px = side * (disk_hole_pitch / 2.0)\n        pillar = (\n   \
    \         cq.Workplane(\"XY\")\n            .center(px, 0.0)\n            .circle(p.disk_pillar_od\
    \ / 2.0)\n            .extrude(p.box_depth)\n        )\n        body = body.union(pillar)\n\
    \n        # M3 clearance bore from top of pillar\n        m3_bore = (\n      \
    \      cq.Workplane(\"XY\")\n            .workplane(offset=p.box_depth - 14.0)\n\
    \            .center(px, 0.0)\n            .circle(p.m3_clearance_d / 2.0)\n \
    \           .extrude(15.0)\n        )\n        body = body.cut(m3_bore)\n\n  \
    \      # Side-entry captive hex nut slot (opening towards +y)\n        nut_slot\
    \ = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=nut_slot_z)\n\
    \            .center(px, p.disk_pillar_od / 4.0)\n            .box(\n        \
    \        nut_slot_w,\n                p.disk_pillar_od / 2.0 + p.m3_nut_af / 1.732,\n\
    \                nut_slot_h,\n                centered=(True, True, False),\n\
    \            )\n        )\n        body = body.cut(nut_slot)\n\n    # 4. Four\
    \ mid-span support posts so the 241.6 mm LED disk never flexes\n    for sx in\
    \ (-75.0, 75.0):\n        for sy in (-45.0, 45.0):\n            post = (\n   \
    \             cq.Workplane(\"XY\")\n                .center(sx, sy)\n        \
    \        .circle(4.5)\n                .extrude(p.box_depth)\n            )\n\
    \            body = body.union(post)\n\n    # 5. Four perfboard mounting standoffs\
    \ (centered at x = 0, y = p.perfboard_y)\n    hole_inset = p.perfboard_hole_to_edge\
    \ + p.perfboard_hole_d / 2.0\n    perf_pitch_x = p.perfboard_w - 2.0 * hole_inset\n\
    \    perf_pitch_y = p.perfboard_l - 2.0 * hole_inset\n    standoff_top_z = p.back_wall_t\
    \ + p.perfboard_standoff_h\n\n    for dx in (-perf_pitch_x / 2.0, perf_pitch_x\
    \ / 2.0):\n        for dy in (-perf_pitch_y / 2.0, perf_pitch_y / 2.0):\n    \
    \        sx = dx\n            sy = p.perfboard_y + dy\n            standoff =\
    \ (\n                cq.Workplane(\"XY\")\n                .center(sx, sy)\n \
    \               .circle(3.5)\n                .extrude(standoff_top_z)\n     \
    \       )\n            body = body.union(standoff)\n\n            pilot = (\n\
    \                cq.Workplane(\"XY\")\n                .workplane(offset=standoff_top_z\
    \ - (p.m2_screw_l - p.perfboard_t + 0.6))\n                .center(sx, sy)\n \
    \               .circle(p.m2_pilot_d / 2.0)\n                .extrude(p.m2_screw_l)\n\
    \            )\n            body = body.cut(pilot)\n\n    # 6. Two wall-mounting\
    \ keyhole housings with recessed head pockets (so z = 0 sits flat on wall)\n \
    \   entry_d = p.wall_screw_head_d + 1.5\n    slot_w = p.wall_screw_shaft_d + 0.8\n\
    \    pocket_w = p.wall_screw_head_d + 2.5\n    slot_len = 10.0\n\n    for side\
    \ in (-1.0, 1.0):\n        kx = side * (p.wall_screw_pitch / 2.0)\n        ky_seat\
    \ = p.wall_screw_y\n        ky_entry = ky_seat - slot_len\n\n        # Internal\
    \ housing pad rising to z = 8.5 mm\n        housing = (\n            cq.Workplane(\"\
    XY\")\n            .center(kx, (ky_seat + ky_entry) / 2.0)\n            .box(pocket_w\
    \ + 6.0, slot_len + entry_d + 8.0, 8.5, centered=(True, True, False))\n      \
    \  )\n        body = body.union(housing)\n\n        # Entry circle through back\
    \ wall and housing\n        entry_hole = (\n            cq.Workplane(\"XY\")\n\
    \            .center(kx, ky_entry)\n            .circle(entry_d / 2.0)\n     \
    \       .extrude(6.2)\n        )\n        body = body.cut(entry_hole)\n\n    \
    \    # Narrow shaft slot through back wall (z = 0 to z = p.back_wall_t)\n    \
    \    shaft_slot = (\n            cq.Workplane(\"XY\")\n            .center(kx,\
    \ (ky_seat + ky_entry) / 2.0)\n            .box(slot_w, slot_len, p.back_wall_t\
    \ + 0.2, centered=(True, True, False))\n        )\n        top_round = (\n   \
    \         cq.Workplane(\"XY\")\n            .center(kx, ky_seat)\n           \
    \ .circle(slot_w / 2.0)\n            .extrude(p.back_wall_t + 0.2)\n        )\n\
    \        body = body.cut(shaft_slot).cut(top_round)\n\n        # Internal screw-head\
    \ pocket above back wall (z = p.back_wall_t to z = 6.2 mm, bridged at top)\n \
    \       head_pocket = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=p.back_wall_t)\n\
    \            .center(kx, (ky_seat + ky_entry) / 2.0)\n            .box(pocket_w,\
    \ slot_len, 3.2, centered=(True, True, False))\n        )\n        head_pocket_top\
    \ = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=p.back_wall_t)\n\
    \            .center(kx, ky_seat)\n            .circle(pocket_w / 2.0)\n     \
    \       .extrude(3.2)\n        )\n        body = body.cut(head_pocket).cut(head_pocket_top)\n\
    \n    return body\n"
  print_orientation: Back face of the box flat on the build plate (z = 0 on the bed;
    open front towards +z). Prints with zero supports.
  use_orientation: Back face (z = 0) rests flat against the wall; +z points out through
    the LED disk; +y points up (12 o'clock, towards the LED disk input wires); +x
    points to 3 o'clock.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    # Compact test coupon verifying:\n    # 1. LED disk centre\
    \ hole spacing (33.5 mm) and M3 clearance + ISO 4032 M3 nut pocket\n    # 2. Perfboard\
    \ width corner-hole spacing (45.8 mm) and M2x6 self-tapping pilot holes\n    disk_hole_pitch\
    \ = p.led_disk_hole_gap + p.led_disk_hole_d\n    hole_inset = p.perfboard_hole_to_edge\
    \ + p.perfboard_hole_d / 2.0\n    perf_pitch_x = p.perfboard_w - 2.0 * hole_inset\n\
    \n    bar_len = perf_pitch_x + 10.0\n    bar = cq.Workplane(\"XY\").box(bar_len,\
    \ 12.0, 6.0, centered=(True, True, False))\n\n    # Two M3 pillars at ±disk_hole_pitch/2\n\
    \    nut_slot_w = p.m3_nut_af + 0.25\n    nut_slot_h = p.m3_nut_h + 0.4\n    for\
    \ side in (-1.0, 1.0):\n        px = side * (disk_hole_pitch / 2.0)\n        pillar\
    \ = cq.Workplane(\"XY\").center(px, 0.0).circle(6.0).extrude(10.0)\n        bar\
    \ = bar.union(pillar)\n        bore = cq.Workplane(\"XY\").center(px, 0.0).circle(p.m3_clearance_d\
    \ / 2.0).extrude(11.0)\n        bar = bar.cut(bore)\n\n    # Captive M3 nut slot\
    \ on the +x pillar\n    nut_slot = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=10.0\
    \ - 3.0 - nut_slot_h)\n        .center(disk_hole_pitch / 2.0, 3.0)\n        .box(nut_slot_w,\
    \ 7.0, nut_slot_h, centered=(True, True, False))\n    )\n    bar = bar.cut(nut_slot)\n\
    \n    # Two M2x6 self-tapping pilot holes at ±perf_pitch_x/2\n    for side in\
    \ (-1.0, 1.0):\n        mx = side * (perf_pitch_x / 2.0)\n        pilot = (\n\
    \            cq.Workplane(\"XY\")\n            .workplane(offset=0.8)\n      \
    \      .center(mx, 0.0)\n            .circle(p.m2_pilot_d / 2.0)\n           \
    \ .extrude(6.0)\n        )\n        bar = bar.cut(pilot)\n\n    return bar\n"
  print_orientation: Flat bottom face on the build plate (z = 0).
  use_orientation: Hold against the LED disk's two centre holes and the perfboard's
    short-side corner holes to verify spacing and fastener fits before printing back_box.
