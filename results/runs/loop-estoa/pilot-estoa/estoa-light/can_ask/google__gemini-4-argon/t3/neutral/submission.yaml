manual:
- n: '1'
  text: Print the small fit_coupon first. Slide an ISO 4032 M3 hex nut into its side
    slot and verify that the two M3 holes align with the two holes near the centre
    of the LED disk (33.5 mm centre-to-centre). Also test-thread an M2x6 self-tapping
    screw into one of the two end bosses and verify the 45.8 mm width spacing against
    two corner holes on the short side of your perfboard.
  parts:
  - fit_coupon
  hardware:
  - led_disk
  - perfboard
  - disk_screw
  - disk_nut
  - perfboard_screw
  tool: 2.5 mm Allen key and small Phillips screwdriver
- n: '2'
  text: Print back_box flat on its back face (z = 0 on the build plate, no supports
    required). Press one ISO 4032 M3 hex nut into the side slot near the top of each
    of the two central mounting pillars until it aligns with the vertical M3 hole.
  parts:
  - back_box
  hardware:
  - disk_nut
  tool: null
- n: '3'
  text: Place the perfboard (with the ESP32 plugged into its headers and its USB-C
    port facing down towards the 6 o'clock window) onto the four lower standoffs inside
    back_box. Fasten the four corners using four M2x6 self-tapping screws.
  parts:
  - back_box
  hardware:
  - perfboard
  - esp32
  - perfboard_screw
  tool: Small Phillips screwdriver
- n: '4'
  text: Route the four wires from the perfboard to the LED disk's 4-pin input at 12
    o'clock (resting inside the top internal wire relief channel). Seat the back of
    the LED disk flat against the outer rim and central pillars of back_box, align
    the two centre holes at 3 o'clock and 9 o'clock, and secure with two ISO 4762
    M3x12 socket head screws.
  parts:
  - back_box
  hardware:
  - led_disk
  - disk_screw
  tool: 2.5 mm Allen key
- n: '5'
  text: 'Install two #8 round-head wall screws (<= 9 mm head diameter) into wall anchors
    spaced 120.0 mm apart horizontally (level), leaving the underside of the screw
    heads about 2.5 mm from the wall surface. Plug the USB-C wall charger straight
    into the ESP32''s USB-C port through the 6 o''clock window, then hang back_box
    flat against the wall using the two keyhole slots on the back.'
  parts:
  - back_box
  hardware:
  - esp32
  tool: Spirit level and screwdriver
