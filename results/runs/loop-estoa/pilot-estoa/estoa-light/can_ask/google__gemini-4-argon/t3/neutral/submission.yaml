task: estoa-light
note: Refined the 6 o'clock USB-C port access and centred the perfboard horizontally
  (x = 0, y = -78 mm) so all four perfboard corner standoffs have complete, unobstructed
  vertical clearance inside the cylindrical wall while a 44 mm wide window in the
  6 o'clock outer wall (under the 50 mm max clean bridge limit) provides direct plug
  access to the ESP32's USB-C port regardless of header orientation.
questions:
- text: What are the diameter, spacing, and positions of the two mounting holes near
    the centre of the LED disk, and the disk's diameter?
  answer: 3.3 mm diameter, 30.2 mm inner edge-to-edge (33.5 mm centre-to-centre),
    at 3 o'clock and 9 o'clock with input wires at 12 o'clock; 102.54 mm and 102.24
    mm from outer hole edges to disk edge (241.58 mm outer diameter).
- text: What are the dimensions and mounting hole positions of the perfboard, and
    where does the ESP32's USB-C port sit on it?
  answer: 50 x 70 mm board with 2.4 mm corner holes set 0.9 mm from each edge (45.8
    x 65.8 mm hole pitch). ESP32-S3 (63.17 x 28.25 mm) sits in female headers on columns
    8 and 18, rows 2 to 23, standing 11.05 mm (underside) to 16 mm (top) above the
    perfboard, with its USB-C port 4.80 mm from the ESP32 side edge and 7.53 mm from
    the perfboard end.
- text: What size and spacing are the two wall screws the box hangs on?
  answer: '#8 round-head screws in 1/4 inch wall anchors, head diameter at most 9
    mm, at any spacing we specify (120 mm horizontal spacing chosen).'
