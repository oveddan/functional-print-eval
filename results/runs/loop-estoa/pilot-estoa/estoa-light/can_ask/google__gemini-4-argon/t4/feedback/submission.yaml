parts:
- id: wall_box
  role: final
  material: PLA (matte white)
  code: "def build(p):\n    # Derived LED disk outer diameter and hole pitch from\
    \ caliper readings\n    disk_d = (\n        p.led_disk_hole_span_inner\n     \
    \   + 2.0 * p.led_disk_hole_d\n        + p.led_disk_hole_to_edge_1\n        +\
    \ p.led_disk_hole_to_edge_2\n    )\n    r_out = disk_d / 2.0\n    r_in = r_out\
    \ - p.side_wall_t\n    led_hole_pitch = p.led_disk_hole_span_inner + p.led_disk_hole_d\n\
    \n    # Perfboard corner hole centre-to-centre pitches\n    pb_hole_offset = p.perfboard_hole_edge\
    \ + p.perfboard_hole_d / 2.0\n    pb_pitch_x = p.perfboard_w - 2.0 * pb_hole_offset\n\
    \    pb_pitch_y = p.perfboard_l - 2.0 * pb_hole_offset\n\n    # 1. Outer cylindrical\
    \ shell (z = 0 on the bed to z = p.box_depth)\n    outer = cq.Workplane(\"XY\"\
    ).circle(r_out).extrude(p.box_depth)\n    cavity = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.back_wall_t)\n        .circle(r_in)\n     \
    \   .extrude(p.box_depth)\n    )\n    body = outer.cut(cavity)\n\n    # 2. Central\
    \ LED disk mounting pillars and connecting web\n    pillar_pts = [(-led_hole_pitch\
    \ / 2.0, 0.0), (led_hole_pitch / 2.0, 0.0)]\n    pillars = (\n        cq.Workplane(\"\
    XY\")\n        .pushPoints(pillar_pts)\n        .circle(p.led_pillar_od / 2.0)\n\
    \        .extrude(p.box_depth)\n    )\n    web = (\n        cq.Workplane(\"XY\"\
    )\n        .rect(led_hole_pitch, 5.0)\n        .extrude(p.box_depth - 4.0)\n \
    \   )\n    body = body.union(pillars).union(web)\n\n    # Heat-set insert blind\
    \ holes in the top of the two central pillars\n    insert_holes = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.box_depth - p.insert_hole_depth)\n        .pushPoints(pillar_pts)\n\
    \        .circle(p.insert_hole_d / 2.0)\n        .extrude(p.insert_hole_depth\
    \ + 1.0)\n    )\n    body = body.cut(insert_holes)\n\n    # 3. Four standoffs\
    \ for the perfboard (M2x6 self-tapping screws)\n    standoff_top_z = p.back_wall_t\
    \ + p.pb_standoff_h\n    pb_pts = [\n        (-pb_pitch_x / 2.0, p.perfboard_center_y\
    \ - pb_pitch_y / 2.0),\n        (pb_pitch_x / 2.0, p.perfboard_center_y - pb_pitch_y\
    \ / 2.0),\n        (-pb_pitch_x / 2.0, p.perfboard_center_y + pb_pitch_y / 2.0),\n\
    \        (pb_pitch_x / 2.0, p.perfboard_center_y + pb_pitch_y / 2.0),\n    ]\n\
    \    standoffs = (\n        cq.Workplane(\"XY\")\n        .pushPoints(pb_pts)\n\
    \        .circle(p.pb_standoff_od / 2.0)\n        .extrude(standoff_top_z)\n \
    \   )\n    body = body.union(standoffs)\n\n    pilot_depth = min(p.m2_screw_l,\
    \ standoff_top_z - 1.5)\n    pb_pilots = (\n        cq.Workplane(\"XY\")\n   \
    \     .workplane(offset=standoff_top_z - pilot_depth)\n        .pushPoints(pb_pts)\n\
    \        .circle(p.m2_pilot_d / 2.0)\n        .extrude(pilot_depth + 0.5)\n  \
    \  )\n    body = body.cut(pb_pilots)\n\n    # 4. Open-top stepped keyhole bosses\
    \ (zero roof / zero downward overhang!)\n    kh_head_clear_d = p.wall_screw_head_d\
    \ + 1.5\n    kh_boss_w = kh_head_clear_d + 6.0\n    kh_boss_h = p.back_wall_t\
    \ + 5.0\n\n    for sx in (-p.wall_screw_spacing / 2.0, p.wall_screw_spacing /\
    \ 2.0):\n        y_top = p.wall_screw_y\n        y_bot = p.wall_screw_y - p.keyhole_travel\n\
    \        y_mid = 0.5 * (y_top + y_bot)\n\n        boss = (\n            cq.Workplane(\"\
    XY\")\n            .center(sx, y_mid)\n            .slot2D(p.keyhole_travel +\
    \ kh_boss_w, kh_boss_w, 90)\n            .extrude(kh_boss_h)\n        )\n    \
    \    body = body.union(boss)\n\n        # Through entry circle for the 9 mm screw\
    \ head (z = 0 to kh_boss_h + 1)\n        entry_cut = (\n            cq.Workplane(\"\
    XY\")\n            .center(sx, y_bot)\n            .circle(kh_head_clear_d / 2.0)\n\
    \            .extrude(kh_boss_h + 1.0)\n        )\n        # Narrow shaft slot\
    \ through the back wall (z = 0 to back_wall_t)\n        shaft_slot = (\n     \
    \       cq.Workplane(\"XY\")\n            .center(sx, y_mid)\n            .slot2D(p.keyhole_travel\
    \ + p.wall_screw_shaft_clear_d, p.wall_screw_shaft_clear_d, 90)\n            .extrude(p.back_wall_t\
    \ + 0.2)\n        )\n        # Open-top stepped counterbore for the screw head\
    \ (z = back_wall_t to kh_boss_h + 1)\n        head_pocket = (\n            cq.Workplane(\"\
    XY\")\n            .workplane(offset=p.back_wall_t)\n            .center(sx, y_mid)\n\
    \            .slot2D(p.keyhole_travel + kh_head_clear_d, kh_head_clear_d, 90)\n\
    \            .extrude(kh_boss_h - p.back_wall_t + 1.0)\n        )\n        body\
    \ = body.cut(entry_cut).cut(shaft_slot).cut(head_pocket)\n\n    # 5. Bottom USB-C\
    \ open-top U-slot & full-height flat exterior recess (zero overhangs)\n    usb_x_center\
    \ = 6.0\n    usb_cut = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.usb_window_z_bottom)\n\
    \        .center(usb_x_center, -r_out)\n        .rect(p.usb_window_w, 40.0)\n\
    \        .extrude(p.box_depth - p.usb_window_z_bottom + 1.0)\n    )\n    plug_flat_recess\
    \ = (\n        cq.Workplane(\"XY\")\n        .center(usb_x_center, -r_out - 8.5)\n\
    \        .rect(p.usb_window_w + 8.0, 20.0)\n        .extrude(p.box_depth + 1.0)\n\
    \    )\n    body = body.cut(usb_cut).cut(plug_flat_recess)\n\n    # 6. Top inner\
    \ wire-relief notch at 12 o'clock (+y) for LED disk input wires\n    wire_relief\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.box_depth - 6.0)\n\
    \        .center(0.0, r_in - 2.0)\n        .rect(28.0, 2.0 * (p.side_wall_t -\
    \ 1.8) + 4.0)\n        .extrude(7.0)\n    )\n    body = body.cut(wire_relief)\n\
    \n    return body\n"
  print_orientation: Back wall flat on the print bed (z = 0 on the bed, open front
    rim facing +z up). Every horizontal surface above z = 0 faces upward (+Z), so
    there are zero overhangs, zero bridges, and zero roofs over holes.
  use_orientation: Back wall (z = 0) flush against the wall; +z away from the wall
    toward the LED disk; +y pointing up (12 o'clock) so the USB-C port is at the bottom
    (6 o'clock).
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    # Compact frame test coupon to verify both the LED disk\
    \ hole pitch/inserts\n    # and the perfboard corner hole pitch before printing\
    \ the full 241.6 mm box.\n    led_hole_pitch = p.led_disk_hole_span_inner + p.led_disk_hole_d\n\
    \    pb_hole_offset = p.perfboard_hole_edge + p.perfboard_hole_d / 2.0\n    pb_pitch_x\
    \ = p.perfboard_w - 2.0 * pb_hole_offset\n    pb_pitch_y = p.perfboard_l - 2.0\
    \ * pb_hole_offset\n\n    base_t = 2.5\n    pb_frame = (\n        cq.Workplane(\"\
    XY\")\n        .rect(pb_pitch_x + 8.0, pb_pitch_y + 8.0)\n        .extrude(base_t)\n\
    \        .faces(\">Z\")\n        .workplane()\n        .rect(pb_pitch_x - 6.0,\
    \ pb_pitch_y - 6.0)\n        .cutThruAll()\n    )\n    pb_pts = [\n        (-pb_pitch_x\
    \ / 2.0, -pb_pitch_y / 2.0),\n        (pb_pitch_x / 2.0, -pb_pitch_y / 2.0),\n\
    \        (-pb_pitch_x / 2.0, pb_pitch_y / 2.0),\n        (pb_pitch_x / 2.0, pb_pitch_y\
    \ / 2.0),\n    ]\n    pb_bosses = (\n        cq.Workplane(\"XY\")\n        .pushPoints(pb_pts)\n\
    \        .circle(p.pb_standoff_od / 2.0)\n        .extrude(base_t + p.pb_standoff_h)\n\
    \    )\n    pb_holes = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=1.0)\n\
    \        .pushPoints(pb_pts)\n        .circle(p.m2_pilot_d / 2.0)\n        .extrude(base_t\
    \ + p.pb_standoff_h)\n    )\n\n    led_bar = (\n        cq.Workplane(\"XY\")\n\
    \        .rect(pb_pitch_x + 8.0, 12.0)\n        .extrude(base_t)\n    )\n    led_pts\
    \ = [(-led_hole_pitch / 2.0, 0.0), (led_hole_pitch / 2.0, 0.0)]\n    led_bosses\
    \ = (\n        cq.Workplane(\"XY\")\n        .pushPoints(led_pts)\n        .circle(p.led_pillar_od\
    \ / 2.0)\n        .extrude(base_t + 6.0)\n    )\n    led_holes = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=0.5)\n        .pushPoints(led_pts)\n        .circle(p.insert_hole_d\
    \ / 2.0)\n        .extrude(base_t + 6.0)\n    )\n\n    coupon = (\n        pb_frame.union(pb_bosses)\n\
    \        .cut(pb_holes)\n        .union(led_bar)\n        .union(led_bosses)\n\
    \        .cut(led_holes)\n    )\n    return coupon\n"
  print_orientation: Flat bottom face on the build plate (z = 0).
  use_orientation: Test gauge held against the perfboard's four corner holes and the
    LED disk's two central holes.
