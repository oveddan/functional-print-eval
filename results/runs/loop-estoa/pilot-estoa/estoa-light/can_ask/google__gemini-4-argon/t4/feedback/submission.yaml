criteria:
- id: led_disk_hole_fit
  part: wall_box
  feature: led_disk_bosses
  relation: engages
  hardware: led_disk
  clearance_mm: null
  params:
  - led_disk_hole_d
  - led_disk_hole_span_inner
  - insert_hole_d
  - insert_hole_depth
  check:
    method: coupon
    ref: fit_coupon
    description: Test-fit the two central M3 holes of the LED disk and the M3x4x5
      heat-set inserts against the coupon bosses before printing the full box.
- id: led_disk_rim_support
  part: wall_box
  feature: front_rim
  relation: supports
  hardware: led_disk
  clearance_mm: 0.0
  params:
  - led_disk_hole_d
  - led_disk_hole_span_inner
  - led_disk_hole_to_edge_1
  - led_disk_hole_to_edge_2
  - side_wall_t
  check:
    method: measure
    ref: null
    description: Verify that the outer rim diameter matches the LED disk outer perimeter
      and supports it flat on the front plane.
- id: perfboard_mount_fit
  part: wall_box
  feature: perfboard_standoffs
  relation: supports
  hardware: perfboard
  clearance_mm: 5.0
  params:
