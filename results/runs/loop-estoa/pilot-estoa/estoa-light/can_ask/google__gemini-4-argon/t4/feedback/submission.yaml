task: estoa-light
note: Eliminated the enclosed roof over the keyhole counterbores and converted the
  bottom USB-C opening into an open-top U-slot with a full-height flat exterior recess,
  so every horizontal surface above z = 0 faces upward (+Z) with zero roofs over holes
  and zero unsupported overhangs.
questions:
- text: What are the LED disk mounting hole dimensions, positions, and outer diameter?
  answer: 3.3 mm diameter, 30.2 mm inner edge-to-edge span (33.5 mm centre-to-centre
    pitch) on the horizontal 3-to-9 o'clock line, with 102.54 mm and 102.24 mm from
    the outer edges of the holes to the disk perimeter (giving a 241.58 mm outer diameter).
- text: What are the perfboard and ESP32 dimensions and how are they positioned?
  answer: 50 x 70 mm perfboard with 2.4 mm corner holes set 0.9 mm from each edge
    (45.8 x 65.8 mm hole pitch). The ESP32 (63.17 x 28.25 mm) sits in female headers
    on columns 8 and 18, rows 2 to 23, standing 16 mm above the perfboard (11.05 mm
    to the underside of the ESP32 PCB), with its edge 7.53 mm from the perfboard edge
    and its USB-C port 4.80 mm from the ESP32 edge.
- text: What wall screws are used to hang the box?
  answer: '#8 round-head screws in 1/4 inch anchors with heads at most 9 mm across,
    at any spacing we specify (120 mm horizontal spacing chosen).'
