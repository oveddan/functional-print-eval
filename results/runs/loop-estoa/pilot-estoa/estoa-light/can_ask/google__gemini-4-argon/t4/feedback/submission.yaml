manual:
- n: '1'
  text: Print the fit_coupon first. Check that the two bosses on its central bar line
    up with the two 3.3 mm central holes on the LED disk, and that the four corner
    holes on the perfboard line up with the four M2 pilot holes before printing the
    full wall_box.
  parts:
  - fit_coupon
  hardware:
  - led_disk
  - perfboard
  - led_insert
  - perfboard_screw
  tool: null
- n: '2'
  text: Print the wall_box flat on the build plate (back face down at z = 0). Press
    two M3x4x5 heat-set inserts into the tops of the two central pillars (at x = ±16.75
    mm, y = 0) using a soldering iron until flush with the front face.
  parts:
  - wall_box
  hardware:
  - led_insert
  tool: soldering iron
- n: '3'
  text: Place the perfboard (with the ESP32 plugged into its female headers and its
    USB-C port facing down towards the bottom U-slot at 6 o'clock) onto the four internal
    standoffs. Fasten the four corners with the four M2 x 6 self-tapping screws.
  parts:
  - wall_box
  hardware:
  - perfboard
  - esp32
  - perfboard_screw
  tool: Phillips screwdriver
- n: '4'
  text: Route the four wires from the perfboard to the LED disk's input at 12 o'clock
    (using the inner wire-relief channel at the top rim). Seat the LED disk flat against
    the front rim and central pillars of the wall_box, then secure it through its
    two central holes using two ISO 4762 M3x8 socket head screws.
  parts:
  - wall_box
  hardware:
  - led_disk
  - led_screw
  tool: 2.5 mm hex key
- n: '5'
  text: 'Install your two #8 round-head wall screws into 1/4 inch wall anchors on
    a horizontal line spaced 120.0 mm apart, leaving the undersides of the screw heads
    about 2.5 mm off the wall so they slide cleanly onto the stepped internal keyhole
    shelves. Plug the USB-C charger cable into the ESP32 through the bottom slot and
    hang the light flat against the wall.'
  parts:
  - wall_box
  hardware: []
  tool: spirit level and screwdriver
