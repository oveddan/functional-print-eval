parts:
- id: wall_box
  role: final
  material: PLA
  code: "def build(p):\n    # Derived dimensions from measured parameters\n    led_hole_pitch\
    \ = p.led_between_holes + p.led_hole_d\n    led_disk_od = p.led_between_holes\
    \ + 2.0 * p.led_hole_d + p.led_hole_to_edge_1 + p.led_hole_to_edge_2\n    r_out\
    \ = led_disk_od / 2.0\n    r_in = r_out - p.wall_t\n\n    perf_margin = p.perfboard_hole_edge_dist\
    \ + p.perfboard_hole_d / 2.0\n    perf_pitch_x = p.perfboard_w - 2.0 * perf_margin\n\
    \    perf_pitch_y = p.perfboard_l - 2.0 * perf_margin\n\n    esp32_center_col\
    \ = 0.5 * (p.esp32_col_a + p.esp32_col_b)\n    grid_center_col = 0.5 * (1.0 +\
    \ p.perfboard_cols)\n    esp32_x_offset = (esp32_center_col - grid_center_col)\
    \ * p.perfboard_grid_pitch\n\n    perf_top_z = p.back_wall_t + p.perf_standoff_h\
    \ + p.perfboard_t\n    usb_port_z = perf_top_z + 0.5 * ((p.esp32_underside_h +\
    \ p.esp32_pcb_t) + p.esp32_h)\n\n    # 1. Outer cylindrical shell with flat back\
    \ wall at z=0\n    outer = cq.Workplane(\"XY\").circle(r_out).extrude(p.box_depth)\n\
    \    inner_cavity = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.back_wall_t)\n\
    \        .circle(r_in)\n        .extrude(p.box_depth)\n    )\n    box = outer.cut(inner_cavity)\n\
    \n    # Inner rim wire/solder relief at 12 o'clock (+y) so input wires pass freely\
    \ inside while keeping outer lip intact\n    wire_relief = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.box_depth - 6.0)\n        .center(0, r_in)\n\
    \        .box(50.0, 4.0, 12.0, centered=(True, True, False))\n    )\n    box =\
    \ box.cut(wire_relief)\n\n    # 2. Central M3 mounting pillars for the LED disk\
    \ + stiffening floor rib\n    pillar_rib = (\n        cq.Workplane(\"XY\")\n \
    \       .box(led_hole_pitch, 5.0, p.back_wall_t + 6.0, centered=(True, True, False))\n\
    \    )\n    pillars = (\n        cq.Workplane(\"XY\")\n        .pushPoints([(-led_hole_pitch\
    \ / 2.0, 0.0), (led_hole_pitch / 2.0, 0.0)])\n        .circle(p.led_pillar_od\
    \ / 2.0)\n        .extrude(p.box_depth)\n    )\n    box = box.union(pillar_rib).union(pillars)\n\
    \n    # Heat-set insert holes in the tops of the two central pillars\n    insert_holes\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.box_depth - p.insert_hole_depth)\n\
    \        .pushPoints([(-led_hole_pitch / 2.0, 0.0), (led_hole_pitch / 2.0, 0.0)])\n\
    \        .circle(p.insert_hole_d / 2.0)\n        .extrude(p.insert_hole_depth\
    \ + 1.0)\n    )\n    box = box.cut(insert_holes)\n\n    # 3. Four corner standoffs\
    \ for the perfboard\n    standoff_pts = [\n        (-perf_pitch_x / 2.0, p.perfboard_center_y\
    \ - perf_pitch_y / 2.0),\n        (perf_pitch_x / 2.0, p.perfboard_center_y -\
    \ perf_pitch_y / 2.0),\n        (-perf_pitch_x / 2.0, p.perfboard_center_y + perf_pitch_y\
    \ / 2.0),\n        (perf_pitch_x / 2.0, p.perfboard_center_y + perf_pitch_y /\
    \ 2.0),\n    ]\n    standoff_top_z = p.back_wall_t + p.perf_standoff_h\n    standoffs\
    \ = (\n        cq.Workplane(\"XY\")\n        .pushPoints(standoff_pts)\n     \
    \   .circle(p.perf_standoff_od / 2.0)\n        .extrude(standoff_top_z)\n    )\n\
    \    box = box.union(standoffs)\n\n    pilot_depth = p.m2_screw_l - p.perfboard_t\
    \ + 0.8\n    pilot_holes = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=standoff_top_z\
    \ - pilot_depth)\n        .pushPoints(standoff_pts)\n        .circle(p.m2_pilot_d\
    \ / 2.0)\n        .extrude(pilot_depth + 1.0)\n    )\n    box = box.cut(pilot_holes)\n\
    \n    # 4. Internal keyhole bosses and keyhole cuts for the two #8 wall screws\n\
    \    kh_centers = [\n        (-p.wall_screw_pitch / 2.0, p.wall_screw_y + p.keyhole_slot_l\
    \ / 2.0),\n        (p.wall_screw_pitch / 2.0, p.wall_screw_y + p.keyhole_slot_l\
    \ / 2.0),\n    ]\n    boss_len = p.keyhole_slot_l + p.keyhole_entry_d + 6.0\n\
    \    boss_w = p.keyhole_entry_d + 6.0\n    kh_bosses = (\n        cq.Workplane(\"\
    XY\")\n        .pushPoints(kh_centers)\n        .slot2D(boss_len, boss_w, 90)\n\
    \        .extrude(p.keyhole_boss_h)\n    )\n    box = box.union(kh_bosses)\n\n\
    \    # Entry holes at bottom of keyhole\n    kh_entries = (\n        cq.Workplane(\"\
    XY\")\n        .pushPoints([\n            (-p.wall_screw_pitch / 2.0, p.wall_screw_y),\n\
    \            (p.wall_screw_pitch / 2.0, p.wall_screw_y),\n        ])\n       \
    \ .circle(p.keyhole_entry_d / 2.0)\n        .extrude(p.keyhole_lip_t + p.wall_screw_Head_h_clear)\n\
    \    )\n    # Narrow shank slot through outer lip\n    kh_shank_slots = (\n  \
    \      cq.Workplane(\"XY\")\n        .pushPoints(kh_centers)\n        .slot2D(p.keyhole_slot_l\
    \ + p.keyhole_slot_w, p.keyhole_slot_w, 90)\n        .extrude(p.keyhole_lip_t\
    \ + 0.1)\n    )\n    # Wide internal head clearance channel behind the lip\n \
    \   kh_head_channels = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.keyhole_lip_t)\n\
    \        .pushPoints(kh_centers)\n        .slot2D(p.keyhole_slot_l + p.keyhole_entry_d,\
    \ p.keyhole_entry_d, 90)\n        .extrude(p.wall_screw_Head_h_clear)\n    )\n\
    \    box = box.cut(kh_entries).cut(kh_shank_slots).cut(kh_head_channels)\n\n \
    \   # 5. USB-C charger access window at 6 o'clock (-y) aligned with ESP32 port\n\
    \    usb_cut = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=usb_port_z\
    \ - p.usb_window_h / 2.0)\n        .center(esp32_x_offset, -r_out)\n        .box(p.usb_window_w,\
    \ 30.0, p.usb_window_h, centered=(True, True, False))\n    )\n    box = box.cut(usb_cut)\n\
    \n    return box\n"
  print_orientation: Flat back face on the build plate (z = 0 on the bed, open front
    facing +z)
  use_orientation: Flat back face against the wall (z = 0 on the wall, +y pointing
    up to 12 o'clock, +z pointing away from the wall)
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    led_hole_pitch = p.led_between_holes + p.led_hole_d\n\
    \    perf_margin = p.perfboard_hole_edge_dist + p.perfboard_hole_d / 2.0\n   \
    \ perf_pitch_x = p.perfboard_w - 2.0 * perf_margin\n\n    esp32_center_col = 0.5\
    \ * (p.esp32_col_a + p.esp32_col_b)\n    grid_center_col = 0.5 * (1.0 + p.perfboard_cols)\n\
    \    esp32_x_offset = (esp32_center_col - grid_center_col) * p.perfboard_grid_pitch\n\
    \n    base_t = 2.4\n    # Compact test gauge checking LED disk hole pitch (top\
    \ bar) and perfboard hole pitch + USB-C offset (bottom bar)\n    plate = (\n \
    \       cq.Workplane(\"XY\")\n        .box(perf_pitch_x + 12.0, 26.0, base_t,\
    \ centered=(True, True, False))\n    )\n    # Two LED disk test bosses at y =\
    \ +7 mm\n    led_bosses = (\n        cq.Workplane(\"XY\")\n        .pushPoints([(-led_hole_pitch\
    \ / 2.0, 7.0), (led_hole_pitch / 2.0, 7.0)])\n        .circle(p.led_pillar_od\
    \ / 2.0)\n        .extrude(base_t + p.insert_length + 1.0)\n    )\n    led_holes\
    \ = (\n        cq.Workplane(\"XY\")\n        .pushPoints([(-led_hole_pitch / 2.0,\
    \ 7.0), (led_hole_pitch / 2.0, 7.0)])\n        .circle(p.insert_hole_d / 2.0)\n\
    \        .extrude(base_t + p.insert_length + 2.0)\n    )\n    # Two perfboard\
    \ test standoffs at y = -7 mm\n    perf_bosses = (\n        cq.Workplane(\"XY\"\
    )\n        .pushPoints([(-perf_pitch_x / 2.0, -7.0), (perf_pitch_x / 2.0, -7.0)])\n\
    \        .circle(p.perf_standoff_od / 2.0)\n        .extrude(base_t + p.perf_standoff_h)\n\
    \    )\n    perf_holes = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=1.6)\n\
    \        .pushPoints([(-perf_pitch_x / 2.0, -7.0), (perf_pitch_x / 2.0, -7.0)])\n\
    \        .circle(p.m2_pilot_d / 2.0)\n        .extrude(base_t + p.perf_standoff_h)\n\
    \    )\n    # Alignment notch showing the ESP32 centerline offset along the bottom\
    \ edge\n    usb_notch = (\n        cq.Workplane(\"XY\")\n        .center(esp32_x_offset,\
    \ -13.0)\n        .box(10.0, 4.0, base_t + 1.0, centered=(True, True, False))\n\
    \    )\n    return plate.union(led_bosses).cut(led_holes).union(perf_bosses).cut(perf_holes).cut(usb_notch)\n"
  print_orientation: Flat base on the build plate (z = 0)
  use_orientation: Held against the LED disk mounting holes and perfboard bottom edge
    to verify hole pitch and insert/screw fit
