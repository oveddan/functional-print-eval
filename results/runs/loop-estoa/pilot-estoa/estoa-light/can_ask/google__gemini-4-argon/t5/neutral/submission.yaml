task: estoa-light
note: 'Round wall-mounted enclosure box behind the 255-LED DotStar disk (Adafruit
  2477), housing the 50x70 mm perfboard and ESP32-S3-DevKitC-1 in the lower half with
  a bottom USB-C access window at 6 o''clock, two central M3 heat-set insert pillars
  for the LED disk''s mounting holes, inner rim wire relief at 12 o''clock, and captive
  keyhole slots on the back for two #8 wall screws spaced 120 mm apart.'
