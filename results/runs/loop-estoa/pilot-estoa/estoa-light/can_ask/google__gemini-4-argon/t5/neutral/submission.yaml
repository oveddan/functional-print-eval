criteria:
- id: led_disk_hole_pitch_check
  part: wall_box
  feature: led_mount_pillars
  relation: engages
  hardware: led_insert
  clearance_mm: null
  params:
  - led_hole_d
  - led_between_holes
  - insert_hole_d
  - insert_length
  check:
    method: coupon
    ref: fit_coupon
    description: Test-fit the coupon against the two central mounting holes on the
      LED disk and press-fit an M3x4x5 insert to verify the 33.5 mm pitch and hole
      sizing.
- id: perfboard_mount_and_usb_check
  part: wall_box
  feature: perfboard_standoffs
  relation: supports
  hardware: perfboard
  clearance_mm: null
  params:
  - perfboard_w
  - perfboard_l
  - perfboard_hole_d
  - perfboard_hole_edge_dist
  - m2_pilot_d
  - esp32_usb_to_edge
  - esp32_edge_to_perf_edge
  - esp32_h
  - esp32_underside_h
  check:
    method: coupon
    ref: fit_coupon
    description: Verify the four M2 self-tapping standoffs on the coupon align with
      the perfboard corner holes and that the USB-C window lines up with the ESP32
      USB-C port.
- id: led_disk_rim_support
  part: wall_box
  feature: outer_rim_and_wire_relief
  relation: supports
  hardware: led_disk
  clearance_mm: 2.0
  params:
  - led_hole_d
  - led_between_holes
  - led_hole_to_edge_1
  - led_hole_to_edge_2
  check:
    method: measure
    ref: null
    description: Check that the outer rim of the box matches the LED disk diameter
      and clears the input wires and solder joints at 12 o'clock.
- id: wall_screw_keyhole_fit
  part: wall_box
  feature: wall_keyholes
  relation: engages
  hardware: null
  clearance_mm: 0.75
  params:
  - wall_screw_head_d
  - wall_screw_shank_d
  - wall_screw_pitch
  check:
    method: measure
    ref: null
    description: 'Slide a #8 round-head wall screw into each keyhole slot on the back
      of the box to confirm the 9 mm head enters and slides smoothly into the captive
      channel.'
manual:
- n: '1'
  text: Print fit_coupon first. Check that its two central bosses match the two mounting
    holes near the centre of the LED disk (33.5 mm centre-to-centre), and that its
    corner standoffs and USB-C alignment notch match the perfboard's corner holes
    and the ESP32's USB-C port.
  parts:
  - fit_coupon
  hardware:
  - led_insert
  - perfboard_screw
  - led_disk
  - perfboard
  - esp32
  tool: null
- n: '2'
  text: Print wall_box in matte white PLA with its flat back face on the build plate.
    Use a soldering iron to press the two M3x4x5 heat-set inserts flush into the tops
    of the two central mounting pillars.
  parts:
  - wall_box
  hardware:
  - led_insert
  tool: soldering iron
- n: '3'
  text: Set the perfboard (with the ESP32 plugged into its headers) onto the four
    standoffs in the lower half of wall_box so the ESP32's USB-C port faces the bottom
    access window at 6 o'clock. Fasten the perfboard down at its four corners using
    the four M2 x 6 self-tapping screws.
  parts:
  - wall_box
  hardware:
  - perfboard
  - esp32
  - perfboard_screw
  tool: Phillips screwdriver
- n: '4'
  text: Connect the four input wires from the perfboard to the LED disk's 4-pin connector,
    routing the wires into the box through the 12 o'clock interior relief. Seat the
    LED disk onto the front rim and central pillars of wall_box with the input wires
    at 12 o'clock, and secure it through its two central holes with the two ISO 4762
    M3x8 socket head screws.
  parts:
  - wall_box
  hardware:
  - led_disk
  - led_screw
  tool: 2.5 mm hex key
- n: '5'
  text: 'Install your two #8 round-head wall screws into 1/4-inch wall anchors spaced
    120 mm apart horizontally on a level line, leaving the underside of the screw
    heads about 2 mm off the wall. Plug the USB-C charger cable into the ESP32 through
    the bottom window at 6 o''clock, seat the two keyhole openings on the back of
    wall_box over the wall screw heads, and slide the box down 12 mm until locked
    flat against the wall.'
  parts:
  - wall_box
  hardware: []
  tool: spirit level and screwdriver
