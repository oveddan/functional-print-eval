      IMG_6174). He held the plate with each row as a column, read top to bottom: the clip shows the row with the two M3 pockets
      at positions 3 and 4 from the top, so that row runs L2, L1, R5, R4, R3 and the other R2, R1, U3, U2, U1. He named U3,
      R1 and R2 one by one; U1 and U2 rest on his closing line. Second test, same day: the nut threaded on a bolt and pressed
      in. Dan held the plate with the M3 row on top; the photos IMG_6180/6181 show the M3 nut in the second M3 pocket and
      the M5 at the row''s end, matching R4 and R3. That puts the rows as L2, L1, R5, R4, R3 (top, left to right) and R2,
      R1, U3, U2, U1 (bottom). L1 and L2 weren''t pressed. R1 went from refusing a thumb press to loose: the thumb attempts
