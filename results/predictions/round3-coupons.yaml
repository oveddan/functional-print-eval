M_servo_mount:
  source: 'Claude''s expectation from test print D, not a grader. For tasks/servo-mount (branch claude/servo-mount): R1''s
    0 to 0.25 band, R3''s rib channel, R2''s 10 mm'
  how_to_test: push the MG996R up through each frame and plate from underneath, shaft first; on M1 and M2, check both tabs
    sit flat and try an M3 screw through each hole
  plates:
  - plate: M1
    clearance: 0.25
    channels:
    - 2.1
    - 2.1
    channel_room_a_side:
    - 0.295
    - 0.295
    expected: servo comes up from underneath, tabs flush with the ribs in their channels; M3 screws find all four holes, so
      the 10 mm across a tab is right
    outcome: 'same as the other plate: a bit loose, but the ribs go into the slots and the tabs sit flush (Dan, 2026-11-12)'
    notes: 'Plate flipped grooved face up and the servo dropped in from the top (the cable stops a push from underneath).
      Holes: no screw tried; Dan looked through them with the servo seated: ''visually it is a clear hole, there is no obstruction''
      (2026-11-12). Taken as the plate''s holes (10 mm across a tab, 3.4 mm) lining up with the tabs''.'
  - plate: M2
    clearance: 0.25
    channels:
    - 1.61
    - 1.81
    channel_room_a_side:
    - 0.05
    - 0.15
    expected: the 0.05-a-side channel (dotted end) binds or rocks the tab; the 0.15 side sits flush
    outcome: 'same as the other plate: a bit loose, but the ribs go into the slots and the tabs sit flush (Dan, 2026-11-12)'
    notes: 'Plate flipped grooved face up and the servo dropped in from the top (the cable stops a push from underneath).
      Holes: no screw tried; Dan looked through them with the servo seated: ''visually it is a clear hole, there is no obstruction''
      (2026-11-12). Taken as the plate''s holes (10 mm across a tab, 3.4 mm) lining up with the tabs''.'
  frames:
  - frame_clearance: 0.0
    expected: won't go through
    outcome: fits very snugly (Dan, 2026-11-12)
    notes: Slid over the body from the top (the cable stops a push from underneath). Identified by Dan by dot count.
  - frame_clearance: 0.1
    expected: goes through tight
    outcome: fits snugly, but not as snug as the 0.0 frame (Dan, 2026-11-12)
    notes: Slid over the body from the top (the cable stops a push from underneath). Identified by Dan by dot count.
  reported_unassigned:
  - 'Dan, 2026-11-12: ''the fit plate fits snugly around it. but wont slide up past the cables. thats expected.'' Which frame
    (no dot = 0.0, one dot = 0.1) not yet said. Assigned 2026-11-12: see frames.'
  - 'Dan, 2026-11-12: ''teh top mount flushes nicely too.'' Which plate (M1 or M2) and whether the tabs sat on the grooved
    face not yet said. Grooved-face test done 2026-11-12: see plates.'
  - 'Media: Making Documentation, Print Build Eval/06 Photos, servo-mount IMG_6182; 04 Test print footage, servo-mount IMG_6184.'
N_horn_pockets:
  source: Claude's expectation, not a grader. For tasks/servo-arm's R4 with the aluminium horn
  how_to_test: set the 25T aluminium horn's hub into each pocket, face down
  pockets:
  - pocket_d: 14.76
    over_hub: 0.1
    expected: hub goes in tight or not at all
    outcome: 'fits nicely: cozy, a bit loose but doesn''t fall out, no hard push needed (Dan, 2026-11-12)'
    notes: 'Dan: ''2 are too big. one fits nicely''. Read as the +0.1 pocket fitting, the only order that fits his words (two
      looser pockets too big). The clip shows the horn staying in when the plate is tipped on edge. Clip: Making Documentation,
      Print Build Eval/04 Test print footage, round3-horn-pockets IMG_6186. Dan: ''a bit loose is fine.'' (2026-11-12)'
  - pocket_d: 15.16
    over_hub: 0.5
    expected: hub goes in, a little play
    outcome: too big (Dan, 2026-11-12)
    notes: 'Dan: ''2 are too big. one fits nicely''. Read as the +0.1 pocket fitting, the only order that fits his words (two
      looser pockets too big). The clip shows the horn staying in when the plate is tipped on edge. Clip: Making Documentation,
      Print Build Eval/04 Test print footage, round3-horn-pockets IMG_6186.'
  - pocket_d: 15.66
    over_hub: 1.0
    expected: hub drops in, loose
    outcome: too big (Dan, 2026-11-12)
    notes: 'Dan: ''2 are too big. one fits nicely''. Read as the +0.1 pocket fitting, the only order that fits his words (two
      looser pockets too big). The clip shows the horn staying in when the plate is tipped on edge. Clip: Making Documentation,
      Print Build Eval/04 Test print footage, round3-horn-pockets IMG_6186.'
