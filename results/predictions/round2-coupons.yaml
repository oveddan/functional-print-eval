D_servos:
  source: Claude's expectation from round 1's square-hole fits, not a grader
  how_to_test: drop each servo into its cutout from above, then screw its tabs down
  cutouts:
  - servo: MG996R
    per_side: 0.25
    body_l: 40.58
    body_w: 19.82
    expected: drops in
    screws_reach: 'yes: slot centres at reading + hole diameter'
    outcome: seats from underneath; slightly loose on the sides
    screws_outcome: 'yes: all four tab holes show through the slots'
    notes: 'Dan: goes in that far; a notch between the tab holes stops it being snug; slightly loose on the sides'
    how_tested: first pushed all the way through from above (stopped at the cable exit); then seated from underneath, shaft
      first, tabs against the plate (Dan, IMG_5449-50)
  - servo: MG90S
    per_side: 0.15
    body_l: 22.63
    body_w: 12.33
    expected: 'drops in, snug (round 1: 10 mm peg tight at 0.1, slid at 0.2)'
    screws_reach: 'yes: slot centres at reading + hole diameter'
    outcome: seats from underneath; snug
    screws_outcome: 'yes: both tab holes sit in the slots'
    notes: 'Dan: goes in that far; snug (IMG_5449)'
    how_tested: first pushed all the way through from above (stopped at the cable exit); then seated from underneath, shaft
      first, tabs against the plate (Dan, IMG_5449-50)
  - servo: MG90S
    per_side: 0.3
    body_l: 22.63
    body_w: 12.33
    expected: drops in, rattles
    screws_reach: 'yes: slot centres at reading + hole diameter'
    outcome: less snug than 0.15 (judged while pushing through, not seated)
    screws_outcome: not tested seated
    notes: 'Dan: the cable blocks it from sliding through; right before the cable it''s snug, more snug in the
      0.15 cutout'
    how_tested: first pushed all the way through from above (stopped at the cable exit); then seated from underneath, shaft
      first, tabs against the plate (Dan, IMG_5449-50)
