written: before round 1 was printed
code_at: the coupon code as committed with these predictions, before the print
printer: Bambu Lab X1C
print_settings:
  layer_mm: 0.2
  supports: 'off'
  filament: black PLA, high speed (Dan)
  nozzle_c: null
  walls: 4
  infill: 15%
A_bridges:
  source: bridge check (pbe/bridges.py), run blind on coupons/out/A-bridges.stl
  settings:
    layer: 0.2
    max_span_mm: 40
    small_overhang_mm: 1.5
    anchor_tol_mm: 0.3
    min_anchored: 0.95
  cells:
  - cell: '20'
    pocket_mm: 20
    hole: none
    prediction: clean
    why: '1 overhang(s); worst: 100% of strands anchored at both ends, longest strand 20.0 mm (limit 40 mm)'
    outcome: clean
    notes: straight strands anchored both ends, slight waviness
  - cell: '30'
    pocket_mm: 30
    hole: none
    prediction: clean
    why: '1 overhang(s); worst: 100% of strands anchored at both ends, longest strand 30.0 mm (limit 40 mm)'
    outcome: clean
    notes: flat, even strands
  - cell: '40'
    pocket_mm: 40
    hole: none
    prediction: clean
    why: '1 overhang(s); worst: 100% of strands anchored at both ends, longest strand 40.0 mm (limit 40 mm)'
    outcome: sagging
    notes: anchored, but loose wavy strands and droop lines across the roof; sag depth not measured
  - cell: '50'
    pocket_mm: 50
    hole: none
    prediction: tangled or sagging
    why: '1 overhang(s); worst: 100% of strands anchored at both ends, longest strand 50.0 mm (limit 40 mm)'
    outcome: clean
    notes: flat and even from above; Dan looked side-on and saw no sag (caliper couldn't reach, so not measured)
  - cell: H
    pocket_mm: 20
    hole: plain
    prediction: tangled or sagging
    why: '1 overhang(s); worst: 65% of strands anchored at both ends, longest strand 21.9 mm (limit 40 mm)'
    outcome: tangled
    notes: loose loops and tangles around the hole; hole partly closed
  - cell: S
    pocket_mm: 20
    hole: stepped
    prediction: clean
    why: '4 overhang(s); worst: 100% of strands anchored at both ends, longest strand 20.0 mm (limit 40 mm)'
    outcome: clean
    notes: stepped strips visible, hole open; a few loose strands near the hole
