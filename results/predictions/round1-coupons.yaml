C_fits:
  source: earlier prints, not a grader
  square_holes_for_10mm_peg:
  - hole: 1 dot(s)
    per_side: 0.1
    expected: no data (first measurement)
    outcome: tight
    notes: 'Dan: goes in, snug'
  - hole: 2 dot(s)
    per_side: 0.2
    expected: no data (first measurement)
    outcome: slides
    notes: 'Dan: slides through easily'
  - hole: 3 dot(s)
    per_side: 0.3
    expected: no data (first measurement)
    outcome: slides
    notes: 'Dan: slides through easily'
  - hole: 4 dot(s)
    per_side: 0.4
    expected: no data (first measurement)
    outcome: slides
    notes: 'Dan: slides through easily'
  tunnels_for_10x6_bar:
  - tunnel: '1'
    per_side: 0.2
    above: 0.2
    bed_flare: 0.0
    expected: won't seat without force (Estoa's first leg pocket, 2026-10-02)
    outcome: 'failed: roof stranded'
    notes: 'Dan (IMG_5409, underside): roof is loose strands running along the tunnel, bar can''t go through.
      The bridge check passes this roof (anchored both sides, 10.4 mm across) but wasn''t run on C before printing. Likely
      cause, not yet confirmed in the slicer preview: Bambu laid the bridge lengthwise (76 mm) instead of across; tunnel 2''s
      failure beside it may have contributed.'
  - tunnel: '2'
    per_side: 0.35
    above: 0.6
    bed_flare: 0.5
    expected: slides in (Estoa's fixed leg pocket)
    outcome: 'void: coupon bug'
    notes: tunnel 2 is 10.7 mm wide centred 4 mm from the back face, so it cuts through the back wall and its roof is a one-sided
      cantilever; printed as spaghetti. The bridge check flags it (z 6.6, 4% anchored) when run on C-fits after the print,
      code unchanged since 6025e57; it wasn't run on C before printing.
outcomes_recorded: after round 1, by eye from top-down photos IMG_5401-5408 (indexed in docs/media/photos.md); sag not
