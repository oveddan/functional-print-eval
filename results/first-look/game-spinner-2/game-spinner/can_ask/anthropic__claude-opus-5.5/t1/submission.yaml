task: game-spinner
note: 'The wheel is one 70 mm piece with a 608ZZ bearing pressed into its centre.
  The board-side M8 bolt is fitted before the wheel goes on, so after that everything
  is done from the front. A lip above the bearing stops the wheel coming off when
  the board is upside down, and the lock nut can''t shake loose. The handle screw
  threads into a nut sealed inside the wheel during the print pause. Board thickness
  wasn''t measured; I assumed 3 mm. M8x35 suits boards about 1-6.5 mm thick. For thicker
  boards use a longer, fully threaded M8 bolt: an M8x40 from this list is only threaded
  28 mm and the front nut wouldn''t reach the board.'
questions:
- text: How thick is the board, and what is it made of? Soft cardboard may crush under
    the M8 clamp; if so, add a larger washer on each side.
  answer: null
params:
  wheel_d:
    value: 70
    unit: mm
    kind: design
    source: design
    note: user asked ~70 mm
  hub_od:
    value: 34
    unit: mm
    kind: design
    source: design
    note: ''
  bearing_od:
