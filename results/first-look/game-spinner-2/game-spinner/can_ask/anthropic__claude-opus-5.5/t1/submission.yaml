  nut: m5nut
  external: null
criteria:
- id: bearing_press
  part: wheel
  feature: bearing_bore
  relation: contains
  hardware: null
  clearance_mm: null
  params:
  - bearing_od
  - bearing_fit
  check:
    method: coupon
    ref: fit_coupon
    description: 'Bearing should press in firmly by thumb and not drop out when the
      coupon is turned over. Too loose: lower bearing_fit by 0.05. Too tight to press
      by hand: raise it by 0.05.'
- id: nut_pocket
  part: wheel
  feature: handle_nut_pocket
  relation: contains
  hardware: null
  clearance_mm: null
  params:
  - m5_nut_af
  - m5_nut_h
  - nut_clear
  check:
    method: coupon
    ref: fit_coupon
    description: M5 nut drops into the hex freely, doesn't spin, and its top sits
      below the pocket top
- id: wheel_clears_board
  part: wheel
  feature: underside
  relation: clears
  hardware: null
  clearance_mm: 1.5
  params:
  - gap
  - m8_washer_t
  - m8_nut_h
  check:
    method: measure
    ref: null
    description: After assembly the wheel spins without touching the board
manual:
- n: '1'
  text: Print fit_coupon. Press the 608ZZ bearing into the round bore from the chamfered
    side until it stops against the lip, and drop an M5 nut into the hex. Adjust bearing_fit
    if needed (see checks).
  parts:
  - fit_coupon
  hardware:
  - bearing
  - m5nut
  tool: null
- n: '2'
  text: Print the wheel underside-down. Add a pause at 6.6 mm in Bambu Studio (right-click
    the layer slider > add pause). When it pauses, drop the M5 nut flat into the hex
    pocket near the edge and resume. This seals the nut inside the wheel so it can't
    fall out.
  parts:
  - wheel
  hardware:
  - m5nut
  tool: null
- n: '3'
  text: Drill an 8.5 mm hole in the board where the spinner goes. While you can still
    reach the back, push the M8x35 bolt through from behind with an M8 washer under
    its head. On the front, put on an M8 washer and then the M8 hex nut. Hold the
    bolt head with a 6 mm hex key from behind and tighten the nut firmly. The bolt
    is now fixed to the board, and nothing after this step needs the back.
  parts: []
  hardware:
  - axle
  - m8washer
  - m8nut
  tool: 8.5 mm drill, 6 mm hex key, 13 mm spanner
- n: '4'
  text: Press the bearing into the wheel's underside bore until it stops against the
    lip. Do it by hand, or squeeze it in a vice with a flat block.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '5'
  text: Put an M8 washer on the front nut, then slide the wheel (bearing side first)
    onto the bolt so the inner ring rests on that washer. Add the last M8 washer and
    the M8 nylon lock nut. Snug it until the inner ring is clamped, then check the
    wheel spins freely and clears the board. If the bolt turns, tighten the front
    nut more in step 3.
  parts:
  - wheel
  hardware:
  - m8washer
  - m8lock
  tool: 13 mm spanner
- n: '6'
  text: 'Handle: screw the M5x30 into the hole by the rim by hand until the tip bottoms
    gently, then stop. The smooth shank and head stand about 22 mm proud and work
    as the finger handle. Unscrew it by hand to pack the game flat. The nut stays
    sealed in the wheel.'
  parts:
  - wheel
  hardware:
  - handle
  tool: null
