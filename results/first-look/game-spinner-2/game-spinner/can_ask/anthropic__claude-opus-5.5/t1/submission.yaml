parts:
- id: wheel
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    bb = 2*p.m8_washer_t + p.m8_nut_h - p.gap\n\
    \    hub_h = bb + p.bearing_w + p.ledge_t\n    pocket_h = p.m5_nut_h + p.nut_clear\n\
    \    disc_t = p.floor_t + pocket_h + p.ceiling_t\n    bore_d = p.bearing_od +\
    \ p.bearing_fit\n    w = cq.Workplane('XY').circle(p.wheel_d/2).extrude(disc_t)\n\
    \    w = w.union(cq.Workplane('XY').circle(p.hub_od/2).extrude(hub_h))\n    w\
    \ = w.cut(cq.Workplane('XY').circle(bore_d/2).extrude(bb + p.bearing_w))\n   \
    \ w = w.cut(cq.Workplane('XY').circle(p.ledge_id/2).extrude(hub_h + 1))\n    cham\
    \ = cq.Workplane('XY').circle(bore_d/2 + 0.6).workplane(offset=0.6).circle(bore_d/2).loft()\n\
    \    w = w.cut(cham)\n    af = p.m5_nut_af + p.nut_clear\n    pocket = cq.Workplane('XY').workplane(offset=p.floor_t).center(p.handle_r,\
    \ 0).polygon(6, af/math.cos(math.radians(30))).extrude(pocket_h)\n    w = w.cut(pocket)\n\
    \    hole = cq.Workplane('XY').workplane(offset=p.floor_t).center(p.handle_r,\
    \ 0).circle(p.m5_clear_d/2).extrude(disc_t)\n    w = w.cut(hole)\n    return w\n"
  print_orientation: underside (board side) on the bed, hub up, no supports. PAUSE
    at 6.6 mm (before the layer that prints 6.6-6.8) and drop the M5 nut into the
    hex pocket
  use_orientation: underside faces the board, hub and handle facing you
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\ndef build(p):\n    bore_d = p.bearing_od + p.bearing_fit\n \
    \   h = p.bearing_w + p.ledge_t\n    c = cq.Workplane('XY').circle(p.hub_od/2).extrude(h)\n\
    \    c = c.cut(cq.Workplane('XY').circle(bore_d/2).extrude(p.bearing_w))\n   \
    \ c = c.cut(cq.Workplane('XY').circle(p.ledge_id/2).extrude(h + 1))\n    cham\
    \ = cq.Workplane('XY').circle(bore_d/2 + 0.6).workplane(offset=0.6).circle(bore_d/2).loft()\n\
    \    c = c.cut(cham)\n    af = p.m5_nut_af + p.nut_clear\n    lug = cq.Workplane('XY').center(p.hub_od/2\
    \ + 6, 0).rect(14, 14).extrude(p.m5_nut_h + p.nut_clear + p.ceiling_t)\n    c\
    \ = c.union(lug)\n    c = c.cut(cq.Workplane('XY').center(p.hub_od/2 + 6, 0).polygon(6,\
    \ af/math.cos(math.radians(30))).extrude(p.m5_nut_h + p.nut_clear))\n    c = c.cut(cq.Workplane('XY').center(p.hub_od/2\
    \ + 6, 0).circle(p.m5_clear_d/2).extrude(20))\n    return c\n"
  print_orientation: flat on the bed as modelled
  use_orientation: handheld test
