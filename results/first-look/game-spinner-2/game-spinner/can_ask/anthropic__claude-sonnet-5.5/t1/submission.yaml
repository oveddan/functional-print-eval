  - fit_offset
  check:
    method: coupon
    ref: fit-coupon
    description: Bearing must press in by hand/thumb pressure and hold firmly (should
      not fall out when the coupon is turned over and tapped). If loose, set fit_offset
      to -0.1; if it needs a hammer, +0.1.
- id: c2
  part: wheel
  feature: bearing_lip
  relation: seats
  hardware: bearing
  clearance_mm: null
  params:
  - bearing_w
  - lip_t
  - m8_nut_h
  - board_gap
  check:
    method: coupon
    ref: fit-coupon
    description: Bearing pushed in from below stops against the lip with its top face
