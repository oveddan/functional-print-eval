manual:
- n: '1'
  text: Print the fit coupon first (about 15 minutes), underside down, no supports.
    Press a 608 bearing into the big round pocket from the underside. It should need
    firm thumb pressure and then hold. If it falls out or is loose, set fit_offset
    to -0.1 and reprint; if you need a hammer, use +0.1. Also check an M5 nut drops
    into the hex pocket and an M5 screw passes through the hole. Then print the wheel
    and knob with the flat sides down, no supports.
  parts:
  - fit-coupon
  - wheel
  - knob
  hardware: []
  tool: null
- n: '2'
  text: 'Drill an 8.4 mm hole through the board where the spinner centre goes. Choose
    the M8 bolt length: board thickness + 22 mm, rounded up to the next length you
    have (30 mm suits boards up to 8 mm thick). The bolt tip should end roughly level
    with the top nut.'
  parts: []
  hardware:
  - m8bolt
  tool: null
- n: '3'
  text: 'While you can still reach the back of the board: push the M8 bolt up through
    the hole from behind, head on the back. On the front, screw the plain M8 nut down
    onto the board and tighten it firmly with a spanner while holding the head. This
    is the fixed shoulder the bearing will sit on, so it must not move.'
  parts: []
  hardware:
  - m8bolt
  - m8nut
  tool: 13 mm spanner
- n: '4'
  text: Press the 608 bearing into the wheel from the underside (the side with the
    big round opening) until it stops against the lip. Use your thumbs, pushing evenly.
  parts:
  - wheel
  hardware:
  - bearing
  tool: null
- n: '5'
  text: Drop the M5 nut into the hex pocket on the wheel underside, near the edge.
    It sits flat and cannot fall out once the wheel is on the board, because the board
    is only 1.5 mm below it.
  parts:
  - wheel
  hardware:
  - m5nut
  tool: null
- n: '6'
  text: Hold the wheel with its underside down and the nut still in its pocket (pinch
    the nut in with a fingertip if you need to). Lower it over the bolt so the bearing's
    inner ring rests on the plain M8 nut.
  parts:
  - wheel
  hardware: []
  tool: null
- n: '7'
  text: From the front, screw the M8 lock nut onto the bolt until it sits on the bearing's
    inner ring. Tighten just until the inner ring is snug against the lower nut, then
    no more; the wheel should spin freely and wobble-free, and be about 1.5 mm above
    the board. You never need to reach behind the board for this step.
  parts: []
  hardware:
  - m8lock
  tool: 13 mm spanner
- n: '8'
  text: Put the knob on the wheel over the handle hole, drop the M5x20 screw into
    its counterbore, and screw it into the nut underneath with a 4 mm hex key until
    snug. To pack the game flat, unscrew the M5 screw and lift the knob off. The nut
    stays in its pocket and the bolt and wheel stay on the board.
  parts:
  - knob
  hardware:
  - m5screw
  tool: 4 mm hex key
