task: game-spinner
note: The wheel is one printed piece. The removable handle is a small second printed
  knob, held on by an M5 screw that threads into an M5 nut trapped under the wheel.
  If you wanted the handle to be only the screw, say so. Board thickness couldn't
  be measured, so the M8 bolt length is picked by the rule in the manual. I assumed
  you can reach behind the board before the wheel goes on, to fit the bolt and its
  first nut. I haven't added a pointer or sections to the wheel, so stick paper on
  it or ask me. The 608 press fit should be checked with the coupon before printing
  the wheel.
questions:
- text: What is the thickness of the board where the spinner mounts, and is there
    already a hole?
  answer: Could not be measured. Board thickness assumed 6 mm for the model; the manual
    gives a rule for choosing the M8 bolt length.
params:
  wheel_d:
    value: 70
    unit: mm
    kind: design
    source: asked
    note: wheel about 70 mm across
  disc_t:
    value: 8
    unit: mm
    kind: design
    source: design
    note: ''
  hub_d:
    value: 34
    unit: mm
    kind: design
    source: design
    note: ''
  bearing_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: measured
    note: 608 skateboard bearing; user re-measured about 22; matches 608 nominal 22.000
  bearing_bore:
    value: 8.0
    unit: mm
    kind: hardware
    source: measured
    note: about 8 mm
  bearing_w:
    value: 7.0
    unit: mm
    kind: hardware
    source: measured
    note: about 7 mm
  fit_offset:
    value: 0.0
    unit: mm
    kind: design
    source: design
    note: 'added to pocket diameter. 0 = nominal 22.0, which should print slightly
      tight (press fit). Tune with the fit coupon: +0.1 if too tight, -0.1 if loose'
  lower_relief:
    value: 0.6
    unit: mm
    kind: design
    source: design
    note: extra diameter in the entry zone below the press zone so the bearing slides
      in freely first
  lip_t:
    value: 2.0
    unit: mm
    kind: design
    source: design
    note: ''
  lip_hole_d:
    value: 17.0
    unit: mm
    kind: design
    source: design
    note: larger than the M8 nut corners (about 14.4) and than the inner race, so
      only the outer race touches the lip
  m8_nut_h:
    value: 6.8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M8 lower nut, lifts bearing off the board
  m8_lock_h:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 10511 M8 top nut
  m8_nut_af:
    value: 13.0
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  board_gap:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: gap from wheel underside to board
  board_t:
    value: 6.0
    unit: mm
    kind: world
    source: guessed
    note: user could not measure board thickness. Only affects M8 bolt length; manual
      tells the user how to choose
  handle_r:
    value: 27.5
    unit: mm
    kind: design
    source: design
    note: ''
  m5_hole_d:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: M5 clearance hole
  m5_nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  m5_nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  m5_nut_clear:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: added to nut across-flats for the hex pocket
  nut_pocket_extra:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: pocket depth beyond nut height
  m5_len:
    value: 20
    unit: mm
    kind: hardware
    source: catalog
    note: M5x20 handle screw
  m5_head_d:
    value: 8.5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  m5_head_h:
    value: 5.0
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  cb_clear:
    value: 0.7
    unit: mm
    kind: design
    source: design
    note: counterbore diameter clearance over screw head
  cb_extra:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: counterbore depth beyond head height
  knob_d:
    value: 14
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: wheel
  role: final
  material: PLA
  code: "import math\nbz0 = p.m8_nut_h - p.board_gap\nhub_h = bz0 + p.bearing_w +\
    \ p.lip_t\nbody = cq.Workplane('XY').circle(p.wheel_d/2).extrude(p.disc_t)\nbody\
    \ = body.union(cq.Workplane('XY').circle(p.hub_d/2).extrude(hub_h))\nrelief =\
    \ cq.Workplane('XY').circle((p.bearing_od+p.lower_relief)/2).extrude(bz0)\npress\
    \ = cq.Workplane('XY').workplane(offset=bz0).circle((p.bearing_od+p.fit_offset)/2).extrude(p.bearing_w)\n\
    lip = cq.Workplane('XY').workplane(offset=bz0+p.bearing_w).circle(p.lip_hole_d/2).extrude(p.lip_t+1)\n\
    body = body.cut(relief).cut(press).cut(lip)\npocket_depth = p.m5_nut_h + p.nut_pocket_extra\n\
    hexd = (p.m5_nut_af + p.m5_nut_clear)/math.cos(math.pi/6)\nbody = body.cut(cq.Workplane('XY').center(p.handle_r,0).polygon(6,hexd).extrude(pocket_depth))\n\
    body = body.cut(cq.Workplane('XY').center(p.handle_r,0).circle(p.m5_hole_d/2).extrude(p.disc_t+1))\n\
    result = body\ndef build_result():\n    return result\nreturn_value = result\n\
    \ndef build(p):\n    return result\n"
  print_orientation: underside (the face that faces the board) on the bed, z=0; bearing
    pocket and nut pocket open downward
  use_orientation: flat on the board, hub up, spinning about the vertical M8 stud
- id: knob
  role: final
  material: PLA
  code: "def build(p):\n    cb_d = p.m5_head_d + p.cb_clear\n    cb = p.m5_head_h\
    \ + p.cb_extra\n    knob_h = p.m5_len - p.disc_t + cb\n    k = cq.Workplane('XY').circle(p.knob_d/2).extrude(knob_h)\n\
    \    k = k.faces('>Z').edges().fillet(1.0)\n    k = k.cut(cq.Workplane('XY').circle(p.m5_hole_d/2).extrude(knob_h))\n\
    \    k = k.cut(cq.Workplane('XY').workplane(offset=knob_h-cb).circle(cb_d/2).extrude(cb))\n\
    \    return k\n"
  print_orientation: flat bottom face on the bed, screw-head counterbore facing up
  use_orientation: standing on top of the wheel at the handle position; removable
- id: fit-coupon
  role: coupon
  material: PLA
  code: "import math\ndef build(p):\n    bz0 = p.m8_nut_h - p.board_gap\n    hub_h\
    \ = bz0 + p.bearing_w + p.lip_t\n    body = cq.Workplane('XY').circle(p.hub_d/2).extrude(hub_h)\n\
    \    blk = cq.Workplane('XY').center(23,0).rect(16,14).extrude(p.disc_t)\n   \
    \ body = body.union(blk)\n    relief = cq.Workplane('XY').circle((p.bearing_od+p.lower_relief)/2).extrude(bz0)\n\
    \    press = cq.Workplane('XY').workplane(offset=bz0).circle((p.bearing_od+p.fit_offset)/2).extrude(p.bearing_w)\n\
    \    lip = cq.Workplane('XY').workplane(offset=bz0+p.bearing_w).circle(p.lip_hole_d/2).extrude(p.lip_t+1)\n\
    \    body = body.cut(relief).cut(press).cut(lip)\n    pocket_depth = p.m5_nut_h\
    \ + p.nut_pocket_extra\n    hexd = (p.m5_nut_af + p.m5_nut_clear)/math.cos(math.pi/6)\n\
    \    body = body.cut(cq.Workplane('XY').center(23,0).polygon(6,hexd).extrude(pocket_depth))\n\
    \    body = body.cut(cq.Workplane('XY').center(23,0).circle(p.m5_hole_d/2).extrude(p.disc_t+1))\n\
    \    return body\n"
  print_orientation: underside on the bed, pockets open downward, same as the wheel
  use_orientation: 'test piece only: try the 608 bearing and an M5 nut and M5 screw
    in it'
