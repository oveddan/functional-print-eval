task: game-spinner
note: 'Conditional design, NOT full compliance with the hand-only requirement: the
  axle requires tools for dependable tightening and access behind the board during
  initial installation. Board thickness and box clearance are unverified. One printed
  wheel; removable metal screw-head handle. Use only for a supervised, light-duty
  board game, not a certified children''s toy. Captive features require a physical
  retention check before use. All dimensions are mm unless stated.'
questions:
- text: Bearing dimensions?
  answer: Approximately 22 mm OD, 8 mm bore, 7 mm wide.
- text: Board thickness, box clearance, initial rear access, and acceptance of a metal
    handle?
  answer: User could not measure; requested best judgment. A 6 mm board is assumed
    only for selecting axle length. Initial rear access and metal-handle acceptance
    remain unconfirmed.
