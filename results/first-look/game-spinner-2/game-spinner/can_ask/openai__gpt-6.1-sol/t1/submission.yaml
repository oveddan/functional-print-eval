parts:
- id: wheel
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    eps = 0.02\n    ro = (p.bearing_od + p.bearing_diam_clearance)/2\
    \ + p.bearing_wall\n    rim = ro + p.moat_w\n    bz = p.bearing_bottom + p.bearing_width\n\
    \    lz = bz + p.lip_gap\n    top = lz + p.lip_t + p.lead_h\n    def cyl(r, z,\
    \ h):\n        return cq.Workplane('XY').workplane(offset=z).circle(r).extrude(h)\n\
    \    def hexcut(af,z,h):\n        return cq.Workplane('XY').workplane(offset=z).polygon(6,2*af/math.sqrt(3)).extrude(h)\n\
    \    w = cyl(p.wheel_d/2,0,p.disk_t)\n    # Free the long central snap fingers\
    \ from the surrounding disc.\n    w = w.cut(cyl(rim,p.flex_root_z,p.disk_t+top))\n\
    \    w = w.union(cyl(ro,0,top))\n    w = w.cut(cyl(p.shoulder_id/2,-eps,p.bearing_bottom+2*eps))\n\
    \    w = w.cut(cyl((p.bearing_od+p.bearing_diam_clearance)/2,p.bearing_bottom,lz-p.bearing_bottom))\n\
    \    throat = p.bearing_od/2-p.bearing_lip_overlap\n    w = w.cut(cyl(throat,lz,p.lip_t+eps))\n\
    \    lead = cq.Workplane('XY').workplane(offset=lz+p.lip_t).circle(throat).workplane(offset=p.lead_h).circle((p.bearing_od+p.bearing_diam_clearance)/2).loft()\n\
    \    w = w.cut(lead)\n    for i in range(int(p.finger_count)):\n        slot =\
    \ cq.Workplane('XY').box(2*rim,p.flex_slot,top-p.flex_root_z+eps,centered=(False,True,False)).translate((0,0,p.flex_root_z)).rotate((0,0,0),(0,0,1),i*360/p.finger_count)\n\
    \        w = w.cut(slot)\n    # Isolated slotted hex socket: nut enters from the\
    \ board-facing side.\n    nr = p.nut_boss_r\n    moat = cyl(nr+p.nut_moat_w,p.nut_root_z,p.disk_t).cut(cyl(nr,p.nut_root_z-eps,p.disk_t+2*eps))\n\
    \    w = w.cut(moat.translate((p.handle_radius,0,0)))\n    af = p.handle_nut_af+p.nut_af_clearance\n\
    \    pocket = hexcut(af,p.nut_floor,p.nut_lip_z-p.nut_floor)\n    pocket = pocket.union(hexcut(p.nut_lip_af,p.nut_lip_z,p.nut_lip_t+eps))\n\
    \    leadnut = cq.Workplane('XY').workplane(offset=p.nut_lip_z+p.nut_lip_t).polygon(6,2*p.nut_lip_af/math.sqrt(3)).workplane(offset=p.disk_t-p.nut_lip_z-p.nut_lip_t).polygon(6,2*p.nut_entry_af/math.sqrt(3)).loft()\n\
    \    pocket = pocket.union(leadnut)\n    w = w.cut(pocket.translate((p.handle_radius,0,0)))\n\
    \    w = w.cut(cyl(p.handle_clearance_d/2,-eps,p.nut_floor+2*eps).translate((p.handle_radius,0,0)))\n\
    \    for i in range(int(p.finger_count)):\n        slot = cq.Workplane('XY').box(nr+p.nut_moat_w,p.flex_slot,p.disk_t-p.nut_root_z+eps,centered=(False,True,False)).translate((0,0,p.nut_root_z)).rotate((0,0,0),(0,0,1),i*360/p.finger_count)\n\
    \        w = w.cut(slot.translate((p.handle_radius,0,0)))\n    return w\n"
  print_orientation: Flat uninterrupted display face on bed at z=0. Bearing and nut
    snap sockets open upward. No supports inside sockets or slots.
  use_orientation: 'Flip over after printing: print +Z faces the board; print z=0
    is the visible upper face. The screw-head handle projects above that face. Wheel
    rotates about its central Z axis.'
