criteria:
- id: bearing_snap
  part: wheel
  feature: Six flexible fingers retain bearing behind outer-race shoulder and lip
  relation: contains
  hardware: bearing
  clearance_mm: 0.15
  params:
  - bearing_od
  - bearing_width
  - bearing_diam_clearance
  - bearing_lip_overlap
  - bearing_wall
  - flex_root_z
  check:
    method: measure
    ref: null
    description: Before board mounting, press bearing straight in with thumbs. It
      must fully seat, spin freely, and resist firm hand pull and inverted shaking.
      Reject cracked fingers or a bearing that can escape. Do not force a tight fit;
      adjust parameters and reprint.
- id: nut_snap
  part: wheel
  feature: Captive M5 nut socket remains closed when handle is removed
  relation: contains
  hardware: handle_nut
  clearance_mm: null
  params:
  - handle_nut_af
  - handle_nut_h
  - nut_af_clearance
  - nut_lip_af
  - nut_lip_z
  check:
    method: measure
    ref: null
    description: Nut must seat flat behind all lips. Remove the handle and shake the
      wheel upside down over a tray; nut must remain captured. Reject cracked or weak
      fingers.
- id: inner_race_stack
  part: wheel
  feature: Washers clear housing, shield, and rotating wheel
  relation: clears
  hardware: axle_washers
  clearance_mm: null
  params:
  - shoulder_id
  - axle_washer_od
  - axle_washer_t
  - bearing_width
  - lip_gap
  - lip_t
  - lead_h
  check:
    method: measure
    ref: null
    description: Before full installation check washer contacts only the bearing inner
      race. After tightening, wheel must rotate freely without scraping board or washers.
      If washers touch the bearing shield or outer race, this stack is unsuitable;
      do not assemble.
- id: board_stack
  part: wheel
  feature: Axle length and packing envelope
  relation: clears
  hardware: axle
  clearance_mm: null
  params:
  - board_t
  - axle_length
  - bearing_width
  - axle_washer_t
  - axle_nut_h
  - axle_pitch
  - minimum_tip_threads
  - box_clearance
  check:
    method: template
    ref: null
    description: Dry assemble through actual board before it becomes inaccessible.
      Require both nuts fully engaged and at least two thread pitches visible beyond
      the rear nut. Visible height above board is approximately 18.2 mm including
      the axle head; test box closure without forcing.
- id: handle_engagement
  part: wheel
  feature: Short removable screw-head finger peg
  relation: engages
  hardware: handle
  clearance_mm: null
  params:
  - handle_screw_length
  - nut_floor
  - handle_nut_h
  check:
    method: measure
    ref: null
    description: M5x6 should engage approximately 4.6 mm of the nut and not project
      into the board. Verify finger-tight retention and comfortable grip. Do not substitute
      a longer handle screw without checking board clearance.
manual:
- n: '1'
  text: 'Check the limitations before printing. You must be able to reach the back
    of the board once during initial installation, and use tools to secure the axle.
    If assembly truly must be entirely by hand, stop: this design does not meet that
    requirement. Keep loose nuts, bolts and bearing away from small children.'
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Print wheel with its flat display face on the bed, 0.2 mm layers, at least
    4 walls, 5 top/bottom layers, and 30–40% infill. No supports in sockets. Use normal
    PLA cooling and conservative speeds for the thin retaining fingers. Let cool fully;
    remove any elephant-foot or stringing without thinning the clips.
  parts:
  - wheel
  hardware: []
  tool: Slicer; deburring tool if needed
- n: '3'
  text: With socket side up, press the M5 nut squarely into the off-centre hex socket
    until all retaining fingers return over it. Press the bearing squarely into the
    central socket, pushing only its outer race, until the shoulder supports it and
    all lips overlap it. Do not hammer. If either part will not seat by reasonable
    thumb pressure, adjust clearances and reprint rather than force it.
  parts:
  - wheel
  hardware:
  - handle_nut
  - bearing
  tool: null
- n: '4'
  text: Over a tray, turn wheel over and shake it with the handle absent. Firmly hand-test
    both captive parts for escape. Reject cracks, displaced fingers or looseness.
    The single full wheel is the fit test; no additional printed coupon or part is
    required.
  parts:
  - wheel
  hardware:
  - bearing
  - handle_nut
  tool: null
- n: '5'
  text: Verify or make an 8.5 mm axle hole in the board. Check board strength and
    thickness. The M8x35 selection assumes roughly 6 mm board thickness; dry assembly
    must leave at least 2.5 mm of thread beyond both rear nuts. Change to another
    listed M8 length if needed. Do not mount on thin card, foam or an unsupported
    fragile board.
  parts: []
  hardware:
  - axle
  - axle_nuts
  - axle_washers
  tool: Ruler; drill and 8.5 mm bit if no suitable hole exists
- n: '6'
  text: Flip wheel so flat face is visible and snap fingers face board. From visible
    side, put one M8 washer on the M8 screw, pass it through bearing, then add second
    washer, board, third washer, and first M8 nut, in that order. Washers must seat
    on inner race only. Secure first nut snugly without crushing board. Fit second
    rear nut and jam it against first while holding first stationary. Proper tool
    tightening is required; finger-tight jam nuts are not a reliable substitute. Verify
    two thread pitches beyond outer nut.
  parts:
  - wheel
  hardware:
  - axle
  - bearing
  - axle_washers
  - axle_nuts
  tool: 6 mm hex key and two 13 mm spanners
- n: '7'
  text: 'Spin wheel before hiding the rear hardware. It must rotate freely and clear
    board throughout a revolution. Stop if shields rub, wheel scrapes, board deforms,
    or axle loosens. Check box closure: the axle head reaches about 18.2 mm above
    board for the specified stack. Only make the back inaccessible after all checks
    pass.'
  parts:
  - wheel
  hardware:
  - axle
  - bearing
  tool: null
- n: '8'
  text: 'From visible side, thread M5x6 into captive nut by hand, just finger snug.
    Its 8.5 mm diameter, 5 mm high head is the removable short handle: flick it with
    a fingertip, do not pull or lean on it. Unscrew for storage and keep loose handle
    in a closed compartment; bearing and nut must stay captured without it. The axle
    remains mounted. Do not use a longer screw as a tall handle.'
  parts:
  - wheel
  hardware:
  - handle
  - handle_nut
  tool: null
- n: '9'
  text: Before each play session, check axle security, bearing retention and nut retention
    with handle removed. Discontinue use if clips crack or loosen, or if the bearing
    starts to bind. PLA can creep or soften in heat; store cool and do not leave in
    a hot car. Supervise use, particularly around children who mouth small objects.
  parts:
  - wheel
  hardware:
  - bearing
  - axle
  - handle
  - handle_nut
  - axle_nuts
  tool: null
