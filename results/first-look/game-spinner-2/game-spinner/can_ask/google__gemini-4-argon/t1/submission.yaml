parts:
- id: spinner_wheel
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    r_outer = p.wheel_od / 2.0\n    snap_z0\
    \ = p.bearing_lip_h + p.bearing_w + p.bearing_axial_clear\n\n    # 1. Main wheel\
    \ disc on XY bed (z = 0 to p.wheel_h)\n    wheel = cq.Workplane(\"XY\").circle(r_outer).extrude(p.wheel_h)\n\
    \n    # 2. Grip scallops around the outer rim (skipping 0 deg nut slot and 180\
    \ deg pointer)\n    for i in range(12):\n        ang_deg = i * 30.0\n        if\
    \ i in (0, 6):\n            continue\n        ang = math.radians(ang_deg)\n  \
    \      gx = (r_outer + 1.2) * math.cos(ang)\n        gy = (r_outer + 1.2) * math.sin(ang)\n\
    \        flute = cq.Workplane(\"XY\").center(gx, gy).circle(2.5).extrude(p.wheel_h)\n\
    \        wheel = wheel.cut(flute)\n\n    # 3. Center 608ZZ bearing pocket with\
    \ bottom lip and top snap-fit ring\n    # Through-bore clearing M8 nut (18 mm\
    \ ID)\n    wheel = wheel.cut(\n        cq.Workplane(\"XY\").circle(p.bearing_lip_id\
    \ / 2.0).extrude(p.wheel_h)\n    )\n    # Main bearing seat bore from z = bearing_lip_h\
    \ to top\n    wheel = wheel.cut(\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.bearing_lip_h)\n\
    \        .circle(p.bearing_pocket_d / 2.0)\n        .extrude(p.wheel_h - p.bearing_lip_h)\n\
    \    )\n    # Add top snap-fit retaining lip (z = snap_z0 to p.wheel_h - 0.3)\n\
    \    snap_h = max(0.6, (p.wheel_h - 0.2) - snap_z0)\n    snap_ring = (\n     \
    \   cq.Workplane(\"XY\")\n        .workplane(offset=snap_z0)\n        .circle(p.bearing_pocket_d\
    \ / 2.0)\n        .circle(p.bearing_snap_id / 2.0)\n        .extrude(snap_h)\n\
    \    )\n    wheel = wheel.union(snap_ring)\n\n    # Annular flex-relief moat around\
    \ top portion of bearing wall so snap tabs flex by hand\n    moat_r_in = p.bearing_pocket_d\
    \ / 2.0 + 1.25\n    moat_r_out = moat_r_in + 1.5\n    moat = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.bearing_lip_h + 1.5)\n        .circle(moat_r_out)\n\
    \        .circle(moat_r_in)\n        .extrude(p.wheel_h - (p.bearing_lip_h + 1.5))\n\
    \    )\n    wheel = wheel.cut(moat)\n\n    # 6 radial slots splitting the upper\
    \ bearing wall into 6 compliant snap segments\n    for i in range(6):\n      \
    \  ang_deg = i * 60.0 + 30.0\n        slot = (\n            cq.Workplane(\"XY\"\
    )\n            .workplane(offset=p.bearing_lip_h + 1.5)\n            .transformed(rotate=(0,\
    \ 0, ang_deg))\n            .center((p.bearing_snap_id / 2.0 + moat_r_out) / 2.0,\
    \ 0)\n            .rect(moat_r_out - p.bearing_snap_id / 2.0 + 1.0, 1.6)\n   \
    \         .extrude(p.wheel_h - (p.bearing_lip_h + 1.5))\n        )\n        wheel\
    \ = wheel.cut(slot)\n\n    # 4. Captive M5 handle nut pocket & radial entry channel\
    \ at (+handle_r, 0)\n    # Blind bolt hole: stops at z = nut_floor_h - 0.8 (1.2\
    \ mm solid floor at bottom)\n    bolt_z0 = max(1.0, p.nut_floor_h - 0.8)\n   \
    \ bolt_hole = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=bolt_z0)\n\
    \        .center(p.handle_r, 0)\n        .circle(p.m5_clear_d / 2.0)\n       \
    \ .extrude(p.wheel_h - bolt_z0)\n    )\n    wheel = wheel.cut(bolt_hole)\n\n \
    \   # Hex nut seat (flats parallel to Y axis) + radial entry slot from rim\n \
    \   hex_circum_d = p.m5_nut_pocket_af / math.cos(math.radians(30))\n    hex_seat\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.nut_floor_h)\n\
    \        .center(p.handle_r, 0)\n        .polygon(6, hex_circum_d)\n        .extrude(p.m5_nut_pocket_h)\n\
    \    )\n    entry_len = (r_outer + 3.0) - p.handle_r\n    entry_slot = (\n   \
    \     cq.Workplane(\"XY\")\n        .workplane(offset=p.nut_floor_h)\n       \
    \ .center(p.handle_r + entry_len / 2.0, 0)\n        .rect(entry_len, p.m5_nut_pocket_af)\n\
    \        .extrude(p.m5_nut_pocket_h)\n    )\n    wheel = wheel.cut(hex_seat).cut(entry_slot)\n\
    \n    # Compliant pinch detent nubs in radial entry slot just outside the seated\
    \ hex nut\n    nub_x = p.handle_r + hex_circum_d / 2.0 + 0.9\n    protrusion =\
    \ (p.m5_nut_pocket_af - p.nut_detent_gap) / 2.0\n    for sign in (-1, 1):\n  \
    \      nub = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=p.nut_floor_h)\n\
    \            .center(nub_x, sign * (p.m5_nut_pocket_af / 2.0 - protrusion / 2.0\
    \ + 0.2))\n            .rect(1.8, protrusion + 0.4)\n            .extrude(p.m5_nut_pocket_h)\n\
    \        )\n        wheel = wheel.union(nub)\n        # Relief slot behind each\
    \ pinch wall so the detent flexes smoothly by thumb\n        relief = (\n    \
    \        cq.Workplane(\"XY\")\n            .workplane(offset=p.nut_floor_h - 0.5)\n\
    \            .center(nub_x + 0.5, sign * (p.m5_nut_pocket_af / 2.0 + 1.8))\n \
    \           .rect(5.5, 1.2)\n            .extrude(p.m5_nut_pocket_h + 1.0)\n \
    \       )\n        wheel = wheel.cut(relief)\n\n    # 5. Weight-reduction windows\
    \ on the handle (+X) side to help balance the M5 hardware\n    for ang_deg in\
    \ (-58.0, 58.0):\n        ang = math.radians(ang_deg)\n        wx = 22.5 * math.cos(ang)\n\
    \        wy = 22.5 * math.sin(ang)\n        win = cq.Workplane(\"XY\").center(wx,\
    \ wy).circle(5.5).extrude(p.wheel_h)\n        wheel = wheel.cut(win)\n\n    #\
    \ 6. Pointer arrow engraved on top face at -X (180 deg, opposite the handle)\n\
    \    arrow_pts = [\n        (-r_outer + 1.5, 0.0),\n        (-r_outer + 9.5, 5.0),\n\
    \        (-r_outer + 9.5, 2.0),\n        (-16.5, 2.0),\n        (-16.5, -2.0),\n\
    \        (-r_outer + 9.5, -2.0),\n        (-r_outer + 9.5, -5.0),\n    ]\n   \
    \ arrow = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.wheel_h\
    \ - 1.0)\n        .polyline(arrow_pts)\n        .close()\n        .extrude(1.0)\n\
    \    )\n    wheel = wheel.cut(arrow)\n\n    return wheel\n"
  print_orientation: Flat on build plate with bottom face at z = 0 (no supports required)
  use_orientation: Horizontal above game board with bottom face at z = 0 and handle
    pointing up (+Z)
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    r_outer = p.wheel_od / 2.0\n    snap_z0\
    \ = p.bearing_lip_h + p.bearing_w + p.bearing_axial_clear\n\n    # Compact test\
    \ coupon combining the center bearing snap pocket and the radial captive M5 nut\
    \ pocket\n    base_hub = cq.Workplane(\"XY\").circle(16.0).extrude(p.wheel_h)\n\
    \    arm_len = r_outer\n    arm = (\n        cq.Workplane(\"XY\")\n        .center(arm_len\
    \ / 2.0, 0)\n        .rect(arm_len, 18.0)\n        .extrude(p.wheel_h)\n    )\n\
    \    coupon = base_hub.union(arm)\n\n    # Center 608ZZ pocket\n    coupon = coupon.cut(\n\
    \        cq.Workplane(\"XY\").circle(p.bearing_lip_id / 2.0).extrude(p.wheel_h)\n\
    \    )\n    coupon = coupon.cut(\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.bearing_lip_h)\n\
    \        .circle(p.bearing_pocket_d / 2.0)\n        .extrude(p.wheel_h - p.bearing_lip_h)\n\
    \    )\n    snap_h = max(0.6, (p.wheel_h - 0.2) - snap_z0)\n    snap_ring = (\n\
    \        cq.Workplane(\"XY\")\n        .workplane(offset=snap_z0)\n        .circle(p.bearing_pocket_d\
    \ / 2.0)\n        .circle(p.bearing_snap_id / 2.0)\n        .extrude(snap_h)\n\
    \    )\n    coupon = coupon.union(snap_ring)\n\n    moat_r_in = p.bearing_pocket_d\
    \ / 2.0 + 1.25\n    moat_r_out = moat_r_in + 1.5\n    moat = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.bearing_lip_h + 1.5)\n        .circle(moat_r_out)\n\
    \        .circle(moat_r_in)\n        .extrude(p.wheel_h - (p.bearing_lip_h + 1.5))\n\
    \    )\n    coupon = coupon.cut(moat)\n\n    for i in range(6):\n        ang_deg\
    \ = i * 60.0 + 30.0\n        slot = (\n            cq.Workplane(\"XY\")\n    \
    \        .workplane(offset=p.bearing_lip_h + 1.5)\n            .transformed(rotate=(0,\
    \ 0, ang_deg))\n            .center((p.bearing_snap_id / 2.0 + moat_r_out) / 2.0,\
    \ 0)\n            .rect(moat_r_out - p.bearing_snap_id / 2.0 + 1.0, 1.6)\n   \
    \         .extrude(p.wheel_h - (p.bearing_lip_h + 1.5))\n        )\n        coupon\
    \ = coupon.cut(slot)\n\n    # Captive M5 nut pocket & radial entry slot\n    bolt_z0\
    \ = max(1.0, p.nut_floor_h - 0.8)\n    bolt_hole = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=bolt_z0)\n        .center(p.handle_r, 0)\n  \
    \      .circle(p.m5_clear_d / 2.0)\n        .extrude(p.wheel_h - bolt_z0)\n  \
    \  )\n    coupon = coupon.cut(bolt_hole)\n\n    hex_circum_d = p.m5_nut_pocket_af\
    \ / math.cos(math.radians(30))\n    hex_seat = (\n        cq.Workplane(\"XY\"\
    )\n        .workplane(offset=p.nut_floor_h)\n        .center(p.handle_r, 0)\n\
    \        .polygon(6, hex_circum_d)\n        .extrude(p.m5_nut_pocket_h)\n    )\n\
    \    entry_len = (r_outer + 3.0) - p.handle_r\n    entry_slot = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.nut_floor_h)\n        .center(p.handle_r +\
    \ entry_len / 2.0, 0)\n        .rect(entry_len, p.m5_nut_pocket_af)\n        .extrude(p.m5_nut_pocket_h)\n\
    \    )\n    coupon = coupon.cut(hex_seat).cut(entry_slot)\n\n    nub_x = p.handle_r\
    \ + hex_circum_d / 2.0 + 0.9\n    protrusion = (p.m5_nut_pocket_af - p.nut_detent_gap)\
    \ / 2.0\n    for sign in (-1, 1):\n        nub = (\n            cq.Workplane(\"\
    XY\")\n            .workplane(offset=p.nut_floor_h)\n            .center(nub_x,\
    \ sign * (p.m5_nut_pocket_af / 2.0 - protrusion / 2.0 + 0.2))\n            .rect(1.8,\
    \ protrusion + 0.4)\n            .extrude(p.m5_nut_pocket_h)\n        )\n    \
    \    coupon = coupon.union(nub)\n        relief = (\n            cq.Workplane(\"\
    XY\")\n            .workplane(offset=p.nut_floor_h - 0.5)\n            .center(nub_x\
    \ + 0.5, sign * (p.m5_nut_pocket_af / 2.0 + 1.8))\n            .rect(5.5, 1.2)\n\
    \            .extrude(p.m5_nut_pocket_h + 1.0)\n        )\n        coupon = coupon.cut(relief)\n\
    \n    return coupon\n"
  print_orientation: Flat on build plate with bottom face at z = 0
  use_orientation: Test coupon for checking 608ZZ snap pocket and captive M5 nut slot
    before printing full wheel
hardware:
- id: bearing_608
  ref: 608ZZ
  qty: 1
- id: center_bolt
  ref: ISO 4762 M8x30
  qty: 1
- id: center_nut
  ref: ISO 4032 M8
  qty: 2
- id: handle_bolt
  ref: ISO 4762 M5x25
  qty: 1
- id: handle_nut
  ref: ISO 4032 M5
  qty: 1
joints:
- id: center_pivot
  fastener: center_bolt
  axis_origin:
  - 0.0
  - 0.0
  - 8.65
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: spinner_wheel
    feature: bearing_pocket
    role: clearance
  nut: center_nut
  external: game board mounting hole
- id: removable_handle
  fastener: handle_bolt
  axis_origin:
  - 25.0
  - 0.0
  - 10.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: spinner_wheel
    feature: handle_bolt_bore
    role: clearance
  - part: spinner_wheel
    feature: handle_nut_pocket
    role: nut_pocket
  nut: handle_nut
  external: null
criteria:
- id: bearing_seat_fit
  part: spinner_wheel
  feature: bearing_pocket
  relation: seats
  hardware: bearing_608
  clearance_mm: 0.15
  params:
  - bearing_od
  - bearing_w
  - bearing_pocket_d
  - bearing_axial_clear
  - bearing_snap_id
  check:
    method: coupon
    ref: fit_coupon
    description: Press the 608ZZ bearing into the coupon's bearing pocket by thumb;
      verify it clicks past the top snap ring and sits against the bottom lip without
      play or falling out when inverted.
- id: m8_spacer_nut_clears_lip
  part: spinner_wheel
  feature: bearing_bottom_lip
  relation: clears
  hardware: center_nut
  clearance_mm: 1.5
  params:
  - m8_nut_af
  - bearing_lip_id
  - bearing_lip_h
  check:
    method: coupon
    ref: fit_coupon
    description: Verify that an ISO 4032 M8 nut passes freely inside the bottom retaining
      lip opening (18.0 mm ID vs 15.0 mm nut corner-to-corner) so it can clamp against
      the bearing inner race and space the wheel above the game board.
- id: m8_bolt_head_clears_snap
  part: spinner_wheel
  feature: bearing_top_snap
  relation: clears
  hardware: center_bolt
  clearance_mm: 4.0
  params:
  - m8_head_d
  - bearing_snap_id
  check:
    method: coupon
    ref: fit_coupon
    description: Verify the ISO 4762 M8x30 bolt head clears the top snap ring opening
      of the bearing pocket and clamps directly onto the 608ZZ inner ring.
- id: captive_m5_nut_fit
  part: spinner_wheel
  feature: handle_nut_pocket
  relation: contains
  hardware: handle_nut
  clearance_mm: 0.2
  params:
  - m5_nut_af
  - m5_nut_h
  - m5_nut_pocket_af
  - m5_nut_pocket_h
  - nut_detent_gap
  check:
    method: coupon
    ref: fit_coupon
    description: Push the ISO 4032 M5 nut radially into the side entry slot until
      it clicks past the pinch nubs into the hex seat; turn upside down and shake
      to confirm it stays captive.
- id: removable_handle_lock
  part: spinner_wheel
  feature: handle_bolt_bore
  relation: engages
  hardware: handle_bolt
  clearance_mm: 0.4
  params:
  - m5_d
  - m5_clear_d
  - nut_floor_h
  - m5_nut_pocket_h
  - wheel_h
  check:
    method: coupon
    ref: fit_coupon
    description: Thread the ISO 4762 M5x25 handle bolt down through the top hole and
      captive M5 nut by hand until its tip bottoms out on the solid blind floor, locking
      the handle upright; unscrew by hand to verify flat storage.
manual:
- n: '1'
  text: 'Optional fit check: Print fit_coupon first. Press the 608ZZ bearing into
    the center pocket by thumb until it clicks under the top retaining ring, and push
    the ISO 4032 M5 nut sideways into the edge slot until it clicks past the detent
    nubs. Thread the ISO 4762 M5x25 bolt in from the top by hand to confirm it locks
    upright against the blind floor. Remove the hardware before assembling the final
    wheel.'
  parts:
  - fit_coupon
  hardware:
  - bearing_608
  - handle_nut
  - handle_bolt
  tool: null
- n: '2'
  text: Press the 608ZZ bearing into the central pocket on the top of spinner_wheel
    by hand until it clicks beneath the 6 compliant snap-fit tabs and seats against
    the bottom lip.
  parts:
  - spinner_wheel
  hardware:
  - bearing_608
  tool: null
- n: '3'
  text: Push the ISO 4032 M5 hex nut radially inward into the slot on the outer rim
    of spinner_wheel (with two flats aligned to the slot sides) until it clicks past
    the compliant pinch nubs and stops over the vertical hole. The nut is now permanently
    captured against falling out in any orientation.
  parts:
  - spinner_wheel
  hardware:
  - handle_nut
  tool: null
- n: '4'
  text: Pass the ISO 4762 M8x30 bolt down through the 608ZZ bearing bore. Thread one
    ISO 4032 M8 nut onto the bolt underneath the bearing until it seats against the
    bearing's inner race (inside the 18 mm bottom opening of the wheel) to act as
    a standoff spacer above the board. Pass the protruding bolt through the game board
    hole and secure from behind with the second ISO 4032 M8 nut by hand.
  parts:
  - spinner_wheel
  hardware:
  - center_bolt
  - center_nut
  tool: null
- n: '5'
  text: To play, thread the ISO 4762 M5x25 bolt into the top rim hole by hand until
    its tip bottoms out firmly on the solid pocket floor, locking it upright as a
    21.5 mm tall spinning handle. To pack the game flat in its box, simply unscrew
    the M5x25 bolt by hand from the top; the captive M5 nut and 608ZZ bearing remain
    locked inside the wheel even if turned upside down.
  parts:
  - spinner_wheel
  hardware:
  - handle_bolt
  tool: null
