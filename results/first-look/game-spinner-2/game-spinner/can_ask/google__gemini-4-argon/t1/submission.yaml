task: game-spinner
note: Single-piece 70 mm spinner wheel with snap-in 608ZZ center bearing pocket and
  a radial snap-in captive M5 nut pocket with a solid blind floor for a tool-free
  removable M5x25 handle.
questions: []
params:
  bearing_lip_id:
    value: 18
    unit: mm
    kind: design
    source: design
    note: ID of bottom bearing lip; supports 22 mm outer ring while clearing 15.0
      mm M8 nut corners
  handle_r:
    value: 25
    unit: mm
    kind: design
    source: design
    note: Radial distance of removable handle axis from wheel center
  bearing_pocket_d:
    value: 22.15
    unit: mm
    kind: design
    source: design
    note: Pocket bore diameter for hand press-fit of 608ZZ bearing
  m5_clear_d:
    value: 5.4
    unit: mm
    kind: design
    source: design
    note: Clearance hole diameter for M5 handle bolt shaft
  wheel_od:
    value: 70
    unit: mm
    kind: design
    source: asked
    note: Outer diameter of spinner wheel (~70 mm requested)
  bearing_axial_clear:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: Axial clearance for 608ZZ bearing in snap pocket
  m5_len:
    value: 25
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5x25 bolt length
  m5_head_h:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 socket head height
  m8_len:
    value: 30
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8x30 bolt length
  m8_d:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8 nominal thread diameter
  m5_d:
    value: 5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 nominal thread diameter
  nut_detent_gap:
    value: 7.3
    unit: mm
    kind: design
    source: design
    note: Pinched width at radial entry detent to retain M5 nut
  bearing_snap_id:
    value: 21.1
    unit: mm
    kind: design
    source: design
    note: ID of top compliant snap ring retaining the 608ZZ bearing
  wheel_h:
    value: 10
    unit: mm
    kind: design
    source: design
    note: Total height (thickness) of spinner wheel
  m5_nut_pocket_af:
    value: 8.2
    unit: mm
    kind: design
    source: design
    note: Across-flats width of captive M5 nut pocket
  m8_head_h:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M8 socket head height
  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: 608ZZ nominal inner bore diameter
  m5_nut_af:
    value: 8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M5 hex nut width across flats
  bearing_lip_h:
    value: 1.5
    unit: mm
    kind: design
    source: design
    note: Thickness of bottom retaining lip under bearing outer race
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: measured
    note: 608ZZ bearing width (thickness)
  m5_head_d:
    value: 8.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4762 M5 socket head diameter
  m8_nut_af:
    value: 13
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M8 hex nut width across flats
  m8_nut_h:
    value: 6.8
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M8 hex nut height
  nut_floor_h:
    value: 2
    unit: mm
    kind: design
    source: design
    note: Height of solid floor under captive M5 nut pocket
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: measured
    note: 608ZZ bearing outer diameter, measured and catalog nominal
  m5_nut_pocket_h:
    value: 5
    unit: mm
    kind: design
    source: design
    note: Height of captive M5 nut pocket (bridged at top)
