criteria:
- id: body_fit
  part: plate
  feature: Central rectangular opening
  relation: clears
  hardware: null
  clearance_mm: 0.3
  params:
  - body_length
  - body_width
  - body_clearance_per_side
  check:
    method: coupon
    ref: fit_template
    description: Servo must slide into template up to tab undersides without force;
      all tab bearing surfaces must lie flat. Also check final 6 mm depth does not
      interfere with case ribs.
- id: four_slot_alignment
  part: plate
  feature: Two elongated screw slots
  relation: clears
  hardware: tab_screws
  clearance_mm: null
  params:
  - opposed_slot_inside_gap
  - servo_slot_width
  - mount_slot_length
  - mount_slot_width
  check:
    method: coupon
    ref: fit_template
    description: Place all four screws through actual tab slots and template simultaneously,
      without forcing. Each top washer must bear on solid tab material on both sides
      of its U-slot, not the case; washers must not overlap one another.
- id: washer_support
  part: plate
  feature: Flat lands alongside screw slots
  relation: supports
  hardware: tab_washers
  clearance_mm: null
  params:
  - washer_od
  - mount_slot_width
  - plate_thickness
  check:
    method: measure
    ref: null
    description: All bottom washers must sit flat, span the plate slots, and not overhang
      the central opening. Inspect for plate flex or rocking after tightening.
- id: thread_engagement
  part: plate
  feature: Through-bolt stack
  relation: engages
  hardware: tab_nuts
  clearance_mm: null
  params:
  - screw_length
  - tab_thickness
  - plate_thickness
  - washer_thickness
  - locknut_height
  - screw_pitch
  check:
    method: measure
    ref: null
    description: Nominal stack is 13.28 mm, leaving 2.72 mm protrusion with M3x16.
      Verify each screw extends past the nylon locking ring and at least two complete
      threads beyond nut.
- id: cable_fit
  part: plate
  feature: Central opening and underside
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - cable_envelope
  - plate_thickness
  check:
    method: coupon
    ref: fit_template
    description: With power disconnected, check plug/cable can pass through opening
      and servo can seat without trapping cable. Check clearance again with full-thickness
      plate; template does not prove underside clearance.
manual:
- n: '1'
  text: Print fit_template flat at 0.2 mm layers. Deburr only rough edges. Disconnect
    servo power and remove horn if it obstructs handling. Feed cable/plug through
    opening first, then lower body until tabs rest flat on template. Do not force
    body or cable.
  parts:
  - fit_template
  hardware: []
  tool: null
- n: '2'
  text: Check all four tab slots align with the two long template slots. Insert four
    screws loosely with one washer under each head; check washer contact on both sides
    of every U-slot and clearance from case and adjacent washer. Do not tighten on
    template. If fit, slot alignment or cable routing fails, stop and correct dimensions
    before printing the full plate.
  parts:
  - fit_template
  hardware:
  - tab_screws
  - tab_washers
  tool: null
- n: '3'
  text: 'Print plate flat: 0.2 mm layers, 5 walls, 6 top/bottom layers, 50% gyroid
    infill, no supports. The opening and slots are vertical and require no bridges.
    Remove brim or first-layer lip from opening if used.'
  parts:
  - plate
  hardware: []
  tool: 3D printer
- n: '4'
  text: 'With power disconnected, feed cable through plate and seat servo tabs on
    top. Confirm full-thickness plate clears case and cable, with both tabs flat.
    At each of four positions assemble from above: M3x16 screw, M3 washer, servo tab,
    plate, M3 washer, M3 lock nut. Hold screw and turn nut. Hardware joint Y positions
    are adjustable and must follow actual servo slots.'
  parts:
  - plate
  hardware:
  - tab_screws
  - tab_washers
  - tab_nuts
  tool: 2.5 mm hex key and 5.5 mm nut driver or wrench
- n: '5'
  text: 'Tighten gradually in a diagonal sequence just until both tabs are clamped
    and servo cannot rock or slide by hand. Do not use a high torque: plastic tabs
    and PLA can crush. Verify screw ends pass the nylon rings and show at least two
    full threads. If washers tilt, tabs bend or plate rocks, stop rather than tightening
    harder.'
  parts:
  - plate
  hardware:
  - tab_screws
  - tab_washers
  - tab_nuts
  tool: null
- n: '6'
  text: Do not run a loaded arm until plate has a rigid base attachment. Future base
    must leave clearance beneath the plate for case, cable bend and screw ends, and
    allow nut access. Recheck clamping after first use; discontinue if PLA creeps,
    cracks, warms noticeably or develops play. Internal servo gearbox backlash is
    not removed by this mount.
  parts:
  - plate
  hardware: []
  tool: null
