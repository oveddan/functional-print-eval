task: servo-mount
note: Under-tab servo mounting plate, shaft upward. Four adjustable M3 bolted clamps
  accommodate the unmeasured spacing across each tab. Print and check the template
  before the full plate; fit and cable clearance are not yet verified. This holds
  the servo relative to the plate, not the plate to a base. PLA is for a room-temperature
  prototype, not a validated high-load robot-arm joint.
