parts:
- id: plate
  role: final
  material: Black high-speed PLA
  code: "def build(p):\n    a = cq.Workplane('XY').box(p.plate_length, p.plate_width,\
    \ p.plate_thickness, centered=(True, True, False))\n    opening = cq.Workplane('XY').rect(p.body_length\
    \ + 2*p.body_clearance_per_side, p.body_width + 2*p.body_clearance_per_side).extrude(p.plate_thickness)\n\
    \    a = a.cut(opening)\n    x = (p.opposed_slot_inside_gap + p.servo_slot_width)/2\n\
    \    for xx in (-x, x):\n        cutter = cq.Workplane('XY').center(xx, 0).slot2D(p.mount_slot_length,\
    \ p.mount_slot_width, 90).extrude(p.plate_thickness)\n        a = a.cut(cutter)\n\
    \    return a"
  print_orientation: Large flat bottom on bed, z=0; print without supports.
  use_orientation: XY horizontal; top z=6 supports underside of servo tabs. Output
    shaft points +Z; body hangs through opening below plate.
- id: fit_template
  role: coupon
  material: Black high-speed PLA
  code: "def build(p):\n    a = cq.Workplane('XY').box(p.plate_length, p.plate_width,\
    \ p.template_thickness, centered=(True, True, False))\n    opening = cq.Workplane('XY').rect(p.body_length\
    \ + 2*p.body_clearance_per_side, p.body_width + 2*p.body_clearance_per_side).extrude(p.template_thickness)\n\
    \    a = a.cut(opening)\n    x = (p.opposed_slot_inside_gap + p.servo_slot_width)/2\n\
    \    for xx in (-x, x):\n        cutter = cq.Workplane('XY').center(xx, 0).slot2D(p.mount_slot_length,\
    \ p.mount_slot_width, 90).extrude(p.template_thickness)\n        a = a.cut(cutter)\n\
    \    return a"
  print_orientation: Flat on bed, z=0, no supports.
  use_orientation: Temporary template under tabs, shaft upward. Do not tighten fasteners
    or operate servo on this thin part.
