parts:
- id: servo_mount_plate
  role: final
  material: PLA
  code: "def build(p):\n    cut_l = p.servo_body_length + 2.0 * p.body_clearance\n\
    \    cut_w = p.servo_body_width + 2.0 * p.body_clearance\n    hole_x = (p.servo_hole_spacing\
    \ + p.servo_tab_hole_d) / 2.0\n    hole_y_outer = p.servo_rib_pos - p.servo_tab_hole_d\
    \ / 2.0\n    hole_y_inner = p.hole_y_min\n    slot_y_center = (hole_y_outer +\
    \ hole_y_inner) / 2.0\n    slot_y_span = abs(hole_y_outer - hole_y_inner) + p.m4_clearance_d\n\
    \    rib_slot_w = p.servo_rib_width + 2.0 * p.rib_clearance\n    rib_slot_d =\
    \ p.servo_rib_height + p.rib_clearance\n    rib_span_x = cut_l + 2.0 * p.tab_seat_length\n\
    \    cable_span_x = cut_l + 2.0 * p.cable_slot_depth\n\n    plate = (\n      \
    \  cq.Workplane(\"XY\")\n        .box(p.plate_length, p.plate_width, p.plate_thickness,\
    \ centered=(True, True, False))\n        .edges(\"|Z\")\n        .fillet(p.corner_fillet)\n\
    \    )\n\n    # Central servo body window\n    plate = (\n        plate.faces(\"\
    >Z\")\n        .workplane(centerOption=\"ProjectedOrigin\")\n        .rect(cut_l,\
    \ cut_w)\n        .cutThruAll()\n    )\n\n    # Symmetric cable exit notches at\
    \ both ends of the body cutout\n    plate = (\n        plate.faces(\">Z\")\n \
    \       .workplane(centerOption=\"ProjectedOrigin\")\n        .rect(cable_span_x,\
    \ p.cable_slot_width)\n        .cutThruAll()\n    )\n\n    # Centerline rib clearance\
    \ channel on top face (z = plate_thickness) so tab top-face rib sits flush\n \
    \   plate = (\n        plate.faces(\">Z\")\n        .workplane(centerOption=\"\
    ProjectedOrigin\")\n        .rect(rib_span_x, rib_slot_w)\n        .cutBlind(-rib_slot_d)\n\
    \    )\n\n    # 4 mounting holes through the plate for M4x16 screws\n    pts =\
    \ [\n        (-hole_x, -slot_y_center),\n        (-hole_x, slot_y_center),\n \
    \       (hole_x, -slot_y_center),\n        (hole_x, slot_y_center),\n    ]\n \
    \   plate = (\n        plate.faces(\">Z\")\n        .workplane(centerOption=\"\
    ProjectedOrigin\")\n        .pushPoints(pts)\n        .slot2D(slot_y_span, p.m4_clearance_d,\
    \ 90)\n        .cutThruAll()\n    )\n\n    return plate\n"
  print_orientation: Flat on the build plate with the bottom face at z = 0 and the
    rib-clearance groove on the top face (z = plate_thickness); prints cleanly with
    no supports.
  use_orientation: Horizontal plate holding the MG996R servo vertically with its output
    shaft sticking up (+Z). If mounting the servo from underneath the plate, orient
    the grooved face toward the servo tabs so the 1.8 mm tab ribs drop into the grooves;
    if mounting from above, feed the cable through the end notch and seat the flat
    bottom of the tabs against the flat face.
- id: servo_fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    cut_l = p.servo_body_length + 2.0 * p.body_clearance\n\
    \    cut_w = p.servo_body_width + 2.0 * p.body_clearance\n    hole_x = (p.servo_hole_spacing\
    \ + p.servo_tab_hole_d) / 2.0\n    hole_y_outer = p.servo_rib_pos - p.servo_tab_hole_d\
    \ / 2.0\n    hole_y_inner = p.hole_y_min\n    slot_y_center = (hole_y_outer +\
    \ hole_y_inner) / 2.0\n    slot_y_span = abs(hole_y_outer - hole_y_inner) + p.m4_clearance_d\n\
    \    rib_slot_w = p.servo_rib_width + 2.0 * p.rib_clearance\n    rib_slot_d =\
    \ min(p.servo_rib_height + p.rib_clearance, p.coupon_thickness - 0.6)\n    rib_span_x\
    \ = cut_l + 2.0 * p.tab_seat_length\n    cable_span_x = cut_l + 2.0 * p.cable_slot_depth\n\
    \n    coupon_l = 2.0 * hole_x + p.m4_clearance_d + 2.0 * p.coupon_margin\n   \
    \ coupon_w = cut_w + 2.0 * p.coupon_margin\n\n    coupon = (\n        cq.Workplane(\"\
    XY\")\n        .box(coupon_l, coupon_w, p.coupon_thickness, centered=(True, True,\
    \ False))\n        .edges(\"|Z\")\n        .fillet(2.0)\n    )\n\n    coupon =\
    \ (\n        coupon.faces(\">Z\")\n        .workplane(centerOption=\"ProjectedOrigin\"\
    )\n        .rect(cut_l, cut_w)\n        .cutThruAll()\n    )\n\n    coupon = (\n\
    \        coupon.faces(\">Z\")\n        .workplane(centerOption=\"ProjectedOrigin\"\
    )\n        .rect(cable_span_x, p.cable_slot_width)\n        .cutThruAll()\n  \
    \  )\n\n    coupon = (\n        coupon.faces(\">Z\")\n        .workplane(centerOption=\"\
    ProjectedOrigin\")\n        .rect(rib_span_x, rib_slot_w)\n        .cutBlind(-rib_slot_d)\n\
    \    )\n\n    pts = [\n        (-hole_x, -slot_y_center),\n        (-hole_x, slot_y_center),\n\
    \        (hole_x, -slot_y_center),\n        (hole_x, slot_y_center),\n    ]\n\
    \    coupon = (\n        coupon.faces(\">Z\")\n        .workplane(centerOption=\"\
    ProjectedOrigin\")\n        .pushPoints(pts)\n        .slot2D(slot_y_span, p.m4_clearance_d,\
    \ 90)\n        .cutThruAll()\n    )\n\n    return coupon\n"
  print_orientation: Flat on the build plate with z = 0 on the bed.
  use_orientation: Slide over the MG996R servo body and align with the mounting tabs
    to test body fit, cable passage, rib clearance, and M4 screw alignment before
    printing the full plate.
