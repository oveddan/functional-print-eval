task: servo-mount
note: Designed for the MG996R servo with shaft sticking up. Includes a 6 mm thick
  rigid mounting plate with a close-fitting body window, symmetric cable exit notches
  at both ends, centerline rib clearance channels so the raised 1.51 x 1.8 mm tab
  ribs never prevent flush seating, and M4x16 + washer + nylon locknut clamping hardware.
