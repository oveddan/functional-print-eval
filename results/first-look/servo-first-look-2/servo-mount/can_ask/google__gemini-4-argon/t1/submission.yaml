criteria:
- id: servo_body_fit
  part: servo_mount_plate
  feature: servo_body_window
  relation: contains
  hardware: null
  clearance_mm: 0.15
  params:
  - servo_body_length
  - servo_body_width
  - body_clearance
  - cable_slot_width
  - cable_slot_depth
  check:
    method: coupon
    ref: servo_fit_coupon
    description: Test-fit the MG996R servo body into the central rectangular cutout
      of the coupon and main plate; verify a snug slip fit on all four walls with
      no lateral or rotational play and that the cable passes cleanly through the
      end relief slot.
- id: tab_rib_clearance
  part: servo_mount_plate
  feature: tab_rib_groove
  relation: clears
  hardware: null
  clearance_mm: 0.4
  params:
  - servo_rib_width
  - servo_rib_height
  - rib_clearance
  - servo_tab_thickness
  check:
    method: coupon
    ref: servo_fit_coupon
    description: Check that the servo mounting tabs sit completely flat against the
      plate face; when the shaft-side of the tabs faces the plate, verify the 1.51
      mm x 1.8 mm tab rib drops cleanly into the top centerline rib groove without
      holding the tabs off the surface.
- id: tab_bolt_alignment
  part: servo_mount_plate
  feature: tab_mount_holes
  relation: engages
  hardware: m4_screw
  clearance_mm: 0.3
  params:
  - servo_hole_spacing
  - servo_tab_hole_d
  - servo_rib_pos
  - hole_y_min
  - m4_clearance_d
  - m4_screw_d
  - m4_head_d
  check:
    method: coupon
    ref: servo_fit_coupon
    description: Verify all four M4x16 socket head cap screws pass through the servo
      tab U-holes and the plate mounting slots, and that the 7.0 mm screw heads clear
      both the servo case wall and the central tab rib while clamping the tabs down
      firmly with M4 washers and M4 locknuts.
manual:
- n: '1'
  text: Print the thin test coupon (servo_fit_coupon) first. Slide it onto the MG996R
    servo body to verify a snug, wobble-free fit around the 40.58 x 19.82 mm case,
    check that the cable passes freely through the end notch, and confirm that the
    1.51 x 1.8 mm tab rib drops into the centerline groove and all four mounting holes
    align with the tab U-slots.
  parts:
  - servo_fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Print the main mounting plate (servo_mount_plate) flat on the build plate
    with z = 0 on the bed (no supports needed).
  parts:
  - servo_mount_plate
  hardware: []
  tool: null
- n: '3'
  text: 'Insert the MG996R servo into the central window with its output shaft sticking
    up: either from underneath the plate (with the shaft-side of the mounting tabs
    pressed against the grooved face of the plate so the 1.8 mm center ribs sit inside
    the rib clearance grooves, allowing the tabs to sit completely flush) or from
    above the plate (feeding the servo cable and grommet down through one of the end
    cable relief notches so the flat underside of the tabs rests flush on the plate).'
  parts:
  - servo_mount_plate
  hardware: []
  tool: null
- n: '4'
  text: Pass four ISO 4762 M4x16 socket head cap screws through the four mounting
    holes (with the 7.0 mm screw heads on the servo tab side, where they clear both
    the servo case walls and the central tab rib). Place an ISO 7089 M4 washer and
    an ISO 10511 M4 nylon-insert locknut on the opposite face of the plate for each
    screw, and tighten evenly in a diagonal pattern until the tabs are clamped firmly
    with zero wobble.
  parts:
  - servo_mount_plate
  hardware:
  - m4_screw
  - m4_washer
  - m4_locknut
  tool: 3 mm hex key and 7 mm wrench/socket
