      pressed by hand.
manual:
- n: '1'
  text: Print the fit_coupon first (flat, nut-pocket side down, 0.2 mm layers, 3+
    walls). Lay one servo tab on it. Check that the case end fits the cutout, that
    an M3 screw goes through the tab hole into the coupon hole, and that an M3 nut
    fits the pocket. If the screw won't line up, tell me the real spacing between
    the two holes on one tab and I'll adjust.
  parts:
  - fit_coupon
  hardware:
  - screw
  - nut
  - washer
  tool: null
- n: '2'
  text: Print servo_plate flat with the pocket side on the bed, in black PLA, 0.2
    mm layers, 4 walls, about 30% infill.
  parts:
  - servo_plate
  hardware: []
  tool: null
- n: '3'
  text: Press an M3 nut into each of the four hex pockets on the underside of the
    plate.
  parts:
  - servo_plate
  hardware:
  - nut
  tool: null
- n: '4'
  text: Lower the servo from above, output shaft up, so its case goes down through
    the cutout and both tabs lie flat on the plate's top face. Line up the tab holes
    with the plate holes.
  parts:
  - servo_plate
  hardware: []
  tool: null
- n: '5'
  text: Put an M3 washer on each M3x8 screw. Pass them down through the tab holes
    and tighten into the nuts with a 2.5 mm hex key. Tighten in a cross pattern until
    snug. Don't overtighten, because PLA creeps.
  parts:
  - servo_plate
  hardware:
  - screw
  - washer
  - nut
  tool: 2.5 mm hex key
- n: '6'
  text: Hold the servo and try to rock it. It should not move relative to the plate.
  parts: []
  hardware: []
  tool: null
