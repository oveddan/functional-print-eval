task: servo-mount
note: Servo case drops through a 40.88 x 20.12 mm cutout. The tabs rest on the plate
  top and are clamped with 4x M3x8 screws, washers and captured nuts. I used M3, not
  M4. The tab holes are 4.58 mm and sit only about 4.3 mm from the case end, so an
  M4 nut pocket would leave a wall of about 0.4 mm next to the cutout. The M3 pocket
  leaves about 1.2 mm. The 4.58 mm tab holes are oversize for M3, but the washers
  cover them and the cutout locates the servo, so it should not wobble. The 10 mm
  hole pitch across the tab is unverified, so print the coupon first.
questions:
- text: What is the centre-to-centre spacing of the two holes on one servo tab? I
    used 10 mm from the datasheet because the measurement didn't come back.
  answer: null
- text: How will the plate fix to the base later? The 6 mm plate has a free area around
    the cutout. The case hangs below the plate, so the base needs a gap for it.
  answer: null
params:
  body_l:
    value: 40.58
    unit: mm
    kind: world
    source: measured
    note: servo case end to end, excluding tabs
  body_w:
    value: 19.82
    unit: mm
    kind: world
    source: measured
    note: servo case side to side
  hole_d:
    value: 4.58
    unit: mm
    kind: world
    source: measured
    note: tab mounting hole (U-slot) diameter
  hole_gap_inner:
    value: 44.61
    unit: mm
    kind: world
    source: measured
    note: inside edge to inside edge of the holes on opposite tabs; centre spacing
      = this + hole_d = 49.19
  tab_t:
    value: 2.28
    unit: mm
    kind: world
    source: measured
    note: tab thickness
  hole_pitch_y:
    value: 10.0
    unit: mm
    kind: world
    source: guessed
    note: spacing between the two holes on one tab; MG996R datasheet value, NOT measured
      (measurement request returned nothing). Verify with the coupon.
  body_clr:
    value: 0.15
    unit: mm
    kind: design
    source: design
    note: clearance per side between servo case and plate cutout
  plate_t:
    value: 6.0
    unit: mm
    kind: design
    source: design
    note: sized so an M3x8 screw tip ends just inside the nut and does not poke out
      under the plate
  plate_l:
    value: 64.0
    unit: mm
    kind: design
    source: design
    note: ''
  plate_w:
    value: 36.0
    unit: mm
    kind: design
    source: design
    note: ''
  corner_r:
    value: 3.0
    unit: mm
    kind: design
    source: design
    note: ''
  m3_clear:
    value: 3.4
    unit: mm
    kind: design
    source: design
    note: M3 clearance hole through plate
  m3_nut_af:
    value: 5.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 across flats
  m3_nut_h:
    value: 2.4
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 4032 M3 height
  nut_clr:
    value: 0.3
    unit: mm
    kind: design
    source: design
    note: extra across-flats clearance in nut pocket
  washer_t:
    value: 0.5
    unit: mm
    kind: hardware
    source: catalog
    note: ISO 7089 M3 thickness
  coupon_x0:
    value: 15.0
    unit: mm
    kind: design
    source: design
    note: coupon keeps the plate only for x beyond this value (one tab end)
parts:
- id: servo_plate
  role: final
  material: PLA
  code: "def build(p):\n    cx = (p.hole_gap_inner + p.hole_d) / 2.0\n    py = p.hole_pitch_y\
    \ / 2.0\n    plate = cq.Workplane('XY').box(p.plate_l, p.plate_w, p.plate_t, centered=(True,\
    \ True, False)).edges('|Z').fillet(p.corner_r)\n    cut = cq.Workplane('XY').box(p.body_l\
    \ + 2*p.body_clr, p.body_w + 2*p.body_clr, p.plate_t*3, centered=True)\n    plate\
    \ = plate.cut(cut)\n    pts = [(sx*cx, sy*py) for sx in (-1, 1) for sy in (-1,\
    \ 1)]\n    holes = cq.Workplane('XY').pushPoints(pts).circle(p.m3_clear/2.0).extrude(p.plate_t)\n\
    \    plate = plate.cut(holes)\n    import math\n    d = (p.m3_nut_af + p.nut_clr)\
    \ / math.cos(math.radians(30))\n    depth = p.m3_nut_h + 0.4\n    for (x, y) in\
    \ pts:\n        pk = cq.Workplane('XY').polygon(6, d).extrude(depth).rotate((0,0,0),(0,0,1),30).translate((x,\
    \ y, 0))\n        plate = plate.cut(pk)\n    return plate\n"
  print_orientation: flat, underside (nut-pocket side) on the bed
  use_orientation: flat, servo tabs resting on the top face, shaft pointing up
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    import math\n    cx = (p.hole_gap_inner + p.hole_d) /\
    \ 2.0\n    py = p.hole_pitch_y / 2.0\n    plate = cq.Workplane('XY').box(p.plate_l,\
    \ p.plate_w, p.plate_t, centered=(True, True, False)).edges('|Z').fillet(p.corner_r)\n\
    \    cut = cq.Workplane('XY').box(p.body_l + 2*p.body_clr, p.body_w + 2*p.body_clr,\
    \ p.plate_t*3, centered=True)\n    plate = plate.cut(cut)\n    pts = [(sx*cx,\
    \ sy*py) for sx in (-1, 1) for sy in (-1, 1)]\n    holes = cq.Workplane('XY').pushPoints(pts).circle(p.m3_clear/2.0).extrude(p.plate_t)\n\
    \    plate = plate.cut(holes)\n    d = (p.m3_nut_af + p.nut_clr) / math.cos(math.radians(30))\n\
    \    depth = p.m3_nut_h + 0.4\n    for (x, y) in pts:\n        pk = cq.Workplane('XY').polygon(6,\
    \ d).extrude(depth).rotate((0,0,0),(0,0,1),30).translate((x, y, 0))\n        plate\
    \ = plate.cut(pk)\n    keep = cq.Workplane('XY').box(p.plate_l, p.plate_w, p.plate_t,\
    \ centered=(False, True, False)).translate((p.coupon_x0, 0, 0))\n    return plate.intersect(keep)\n"
  print_orientation: flat, underside on the bed
  use_orientation: 'test only: set one servo tab on it with an M3 screw, washer and
    nut'
