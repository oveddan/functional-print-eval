criteria:
- id: c_cutout
  part: servo_plate
  feature: servo body cutout
  relation: contains
  hardware: null
  clearance_mm: null
  params:
  - body_l
  - body_w
  - body_clr
  check:
    method: coupon
    ref: fit_coupon
    description: Servo case end slides into the coupon's cutout edge with no rocking
      and no binding; the tab lies flat on the top face.
- id: c_holes
  part: servo_plate
  feature: M3 clearance holes
  relation: clears
  hardware: screw
  clearance_mm: 0.4
  params:
  - m3_clear
  - hole_pitch_y
  - hole_gap_inner
  - hole_d
  check:
    method: coupon
    ref: fit_coupon
    description: M3 screw passes through the servo tab hole and the plate hole together,
      confirming the 10 mm hole pitch (guessed value).
- id: c_nut
  part: servo_plate
  feature: hex nut pockets
  relation: seats
  hardware: nut
  clearance_mm: null
  params:
