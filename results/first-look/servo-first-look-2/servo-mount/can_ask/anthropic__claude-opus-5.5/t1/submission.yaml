task: servo-mount
note: The servo drops through a close-fitting opening, which stops it moving sideways,
  and four M4 screws clamp the tabs down onto a 9 mm plate. The nuts sit in captive
  pockets underneath. The spacing between the two holes on each tab wasn't measured,
  so the plate has slots that cover 7–13 mm. Nothing is provided yet for fixing the
  plate to the base.
questions:
- text: How far below the tabs does the cable leave the case? The plate assumes it's
    more than 9 mm below them.
  answer: null
- text: How do you want the plate fixed to the base? Edge holes or a bolt pattern
    can be added later.
  answer: null
