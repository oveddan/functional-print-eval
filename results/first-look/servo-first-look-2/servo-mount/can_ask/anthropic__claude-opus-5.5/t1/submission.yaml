manual:
- n: '1'
  text: Print fit_template (2 mm thick, takes a few minutes). Push the servo case
    down through the opening until the template rests on the tabs. It should be snug,
    with no rattle. Check that all four tab U-slots line up with the template's slots.
    If the case won't go in, or the holes don't line up, stop and report the numbers
    before you print the plate.
  parts:
  - fit_template
  hardware: []
  tool: null
- n: '2'
  text: Print servo_plate flat, with the side that has the pockets on the bed. Use
    4+ walls and about 40% infill so the clamping is stiff.
  parts:
  - servo_plate
  hardware: []
  tool: null
- n: '3'
  text: Turn the plate over and press one M4 nut into each of the four underside pocket
    positions, two nuts per end pocket. The pocket walls keep them from turning.
  parts:
  - servo_plate
  hardware:
  - nut
  tool: null
- n: '4'
  text: 'Turn the plate right side up. Lower the servo in with the shaft up, so the
    case passes through the opening and the tabs rest flat on the top face. Feed the
    cable down through the opening first. If the cable grommet catches on the plate,
    stop: it exits higher than 9 mm below the tabs.'
  parts:
  - servo_plate
  hardware: []
  tool: null
- n: '5'
  text: Put an M4 washer on each M4x12 screw. Drop the screws through the tab slots
    and plate slots, find the nuts, and tighten evenly in a cross pattern until the
    tabs are firmly clamped. Don't crush the tabs.
  parts:
  - servo_plate
  hardware:
  - screw
  - washer
  - nut
  tool: 3 mm hex key
