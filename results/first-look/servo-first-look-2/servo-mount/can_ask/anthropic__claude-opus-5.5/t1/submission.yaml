parts:
- id: servo_plate
  role: final
  material: PLA
  code: "def build(p):\n    L=p.plate_len; W=p.plate_wid; T=p.plate_t\n    ox=p.body_len+2*p.body_clr;\
    \ oy=p.body_wid+2*p.body_clr\n    hx=(p.hole_inner_span+p.tab_hole_d)/2\n    plate=cq.Workplane('XY').box(L,W,T,centered=(True,True,False)).edges('|Z').fillet(3)\n\
    \    plate=plate.cut(cq.Workplane('XY').box(ox,oy,T,centered=(True,True,False)))\n\
    \    nut_fx=p.nut_af+2*p.nut_clr\n    corner=p.nut_af/(3**0.5)\n    py=p.hole_across+2*p.slot_travel+2*corner+2*p.nut_clr\n\
    \    for sx in (-1,1):\n        for sy in (-1,1):\n            s=(cq.Workplane('XY').center(sx*hx,\
    \ sy*p.hole_across/2)\n               .slot2D(p.screw_clr_d+2*p.slot_travel, p.screw_clr_d,\
    \ angle=90).extrude(T))\n            plate=plate.cut(s)\n        pk=cq.Workplane('XY').box(nut_fx,py,p.pocket_depth,centered=(True,True,False)).translate((sx*hx,0,0))\n\
    \        plate=plate.cut(pk)\n    return plate\n"
  print_orientation: bottom face (nut pocket side) on the bed, z=0
  use_orientation: 'same as printed: flat on the base, servo dropped in from the top,
    shaft up'
- id: fit_template
  role: coupon
  material: PLA
  code: "def build(p):\n    L=p.plate_len; W=p.plate_wid; T=p.template_t\n    ox=p.body_len+2*p.body_clr;\
    \ oy=p.body_wid+2*p.body_clr\n    hx=(p.hole_inner_span+p.tab_hole_d)/2\n    t=cq.Workplane('XY').box(L,W,T,centered=(True,True,False)).edges('|Z').fillet(3)\n\
    \    t=t.cut(cq.Workplane('XY').box(ox,oy,T,centered=(True,True,False)))\n   \
    \ for sx in (-1,1):\n        for sy in (-1,1):\n            s=(cq.Workplane('XY').center(sx*hx,\
    \ sy*p.hole_across/2)\n               .slot2D(p.screw_clr_d+2*p.slot_travel, p.screw_clr_d,\
    \ angle=90).extrude(T))\n            t=t.cut(s)\n    return t\n"
  print_orientation: flat on the bed
  use_orientation: lay on the servo tabs to check hole and body positions
