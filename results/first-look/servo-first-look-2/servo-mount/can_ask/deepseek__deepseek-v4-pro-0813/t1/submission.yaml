parts:
- id: servo_plate
  role: final
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    L = p.case_len + 2*p.tab_reach\
    \ + 6\n    W = p.case_width + 2*6\n    T = p.plate_t\n    base = cq.Workplane('XY').box(L,\
    \ W, T)\n    # central shaft clearance bore\n    base = (base.faces('>Z').workplane()\n\
    \            .hole(8.0))\n    # case-grip pocket on the underside (z=0 is bed;\
    \ underside faces up when printed? keep pocket on bottom)\n    pocket_w = p.case_width\
    \ + p.pocket_clear\n    pocket_l = p.case_len + p.pocket_clear\n    base = (base.faces('<Z').workplane()\n\
    \            .rect(pocket_l, pocket_w, centered=True)\n            .cutBlind(-(p.case_height\
    \ - p.tab_to_top)))\n    # rib clearance slots along left/right at tab top face\
    \ level\n    # rib sits on top face of tab, at rib_pos from hole side\n    # two\
    \ screw slots (elongated along case length) at hole_spread\n    x = p.hole_spread\
    \ / 2\n    for sgn in (1, -1):\n        base = (base.faces('>Z').workplane()\n\
    \                .center(sgn*x, 0)\n                .slot2D(p.slot_len, p.screw_d\
    \ + 0.4, 0)\n                .cutThruAll())\n    return base\n"
  print_orientation: Top face (flat, shaft bore up) on the bed is NOT flat; print
    with the case pocket opening upward so the flat rim sits on the bed. Orient so
    the large flat side (opposite the pocket) is z=0.
  use_orientation: Case pocket faces down over the servo; shaft bore over the output
    shaft; screws pass down through tabs
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    # small coupon: pocket width\
    \ to check grip fit\n    w = p.case_width + p.pocket_clear\n    l = 20.0\n   \
    \ return cq.Workplane('XY').box(l, w, 4.0)\n"
  print_orientation: flat side on bed
  use_orientation: test fit over servo case width
hardware:
- id: m3_screw
  ref: ISO 4762 M3x16
  qty: 2
- id: m3_nut
  ref: ISO 4032 M3
  qty: 2
joints:
- id: tab_left
  fastener: m3_screw
  axis_origin:
  - -24.6
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: servo_plate
    feature: left slot
    role: clearance
  - part: servo_plate
    feature: left slot
    role: thread
  nut: m3_nut
  external: null
- id: tab_right
  fastener: m3_screw
  axis_origin:
  - 24.6
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: servo_plate
    feature: right slot
    role: clearance
  nut: m3_nut
  external: null
criteria:
- id: grip_fit
  part: servo_plate
  feature: case pocket
  relation: contains
  hardware: null
  clearance_mm: null
  params: []
  check:
    method: coupon
    ref: fit_coupon
    description: Pocket must slide over case width with slight friction
- id: screw_align
  part: servo_plate
  feature: slots
  relation: engages
  hardware: m3_screw
  clearance_mm: null
  params: []
  check:
    method: measure
    ref: null
    description: Slot centers at hole_spread 49.19 mm
manual:
- n: '1'
  text: Print servo_plate (flat, pocket up) and fit_coupon.
  parts:
  - servo_plate
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Slide fit_coupon over the servo case to confirm grip. If too tight/loose,
    adjust pocket_clear.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '3'
  text: Place servo_plate over the servo so the pocket seats on the case top face
    and the output shaft pokes through the center bore.
  parts:
  - servo_plate
  hardware: []
  tool: null
- n: '4'
  text: Drop M3 screws through the slots into the tab's U-holes and thread M3 nuts
    from below the tabs. Tighten snug (do not overtighten).
  parts:
  - servo_plate
  hardware:
  - m3_screw
  - m3_nut
  tool: hex key
