- id: c_cable_clearance
  part: servo_plate
  feature: tab_seating_pocket
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - servo_tab_to_top
  - tab_pocket_depth
  check:
    method: none
    ref: null
    description: Confirm the open-ended tab pocket channel leaves the area below the
      mounting tab unobstructed where the servo cable exits the case.
manual:
- n: '1'
  text: Print the small fit_coupon first (flat on the bed, no supports needed). Slide
    it over one end of the MG996R servo from the shaft side down onto the mounting
    tab to verify that the 19.82 mm case width fits snugly without play, the top rib
    drops cleanly into the center relief slot so the tab seats flat, and two M4x16
    screws pass smoothly through the mounting slots and tab U-holes.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Print the servo_plate with its flat top face on the build plate (z = 0). All
    pockets and rib-relief channels face upward during printing, so no supports or
    bridges are required.
  parts:
  - servo_plate
  hardware: []
  tool: null
- n: '3'
  text: Flip the printed servo_plate into its use orientation (recessed tab channel
    facing downward) and insert the MG996R servo from underneath so the output shaft
    sticks up through the central window. The upper 5.69 mm of the servo case will
    sit flush with the top surface of the plate, the 1.51 x 1.8 mm tab ribs will nest
    inside the center relief slots, and the servo cable will exit freely below the
    open-ended tab channel.
  parts:
  - servo_plate
  hardware: []
  tool: null
- n: '4'
  text: Place an M4 washer on each of the four M4x16 socket head cap screws and insert
    them from the top face of the plate down through the four mounting slots and the
    servo tab U-holes. From underneath, add an M4 washer and an M4 nylon-insert lock
    nut onto each screw and tighten evenly until the washers clamp firmly against
    the bottom of the servo tabs.
  parts:
  - servo_plate
  hardware:
  - screw_m4x16
  - washer_m4
  - locknut_m4
  tool: 3 mm hex key and 7 mm wrench/socket
