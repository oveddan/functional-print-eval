parts:
- id: servo_plate
  role: final
  material: PLA
  code: "def build(p):\n    total_h = p.servo_tab_to_top + p.tab_pocket_depth\n  \
    \  win_l = p.servo_body_length + 2.0 * p.body_clearance\n    win_w = p.servo_body_width\
    \ + 2.0 * p.body_clearance\n    rib_slot_w = p.servo_rib_width + p.rib_width_clearance\n\
    \    rib_slot_h = p.servo_rib_height + p.rib_height_clearance\n\n    hole_x =\
    \ (p.servo_hole_spacing_inner + p.servo_tab_hole_d) / 2.0\n    hole_y_outer =\
    \ p.servo_rib_position - p.servo_tab_hole_d / 2.0\n    hole_y_inner = p.hole_slot_min_y\n\
    \    hole_y_mid = (hole_y_outer + hole_y_inner) / 2.0\n    slot_len_y = abs(hole_y_outer\
    \ - hole_y_inner) + p.m4_washer_id\n\n    # Base plate with z=0 as the top face\
    \ in use (printed flat on the bed)\n    part = (\n        cq.Workplane(\"XY\"\
    )\n        .box(p.plate_length, p.plate_width, total_h, centered=(True, True,\
    \ False))\n        .edges(\"|Z\")\n        .fillet(p.plate_corner_r)\n    )\n\n\
    \    # Central through-window for upper servo body\n    part = (\n        part.faces(\"\
    <Z\")\n        .workplane()\n        .rect(win_l, win_w)\n        .cutThruAll()\n\
    \    )\n\n    # Corner dogbone reliefs on the central window so sharp servo corners\
    \ never bind\n    corners = [\n        (sx * win_l / 2.0, sy * win_w / 2.0)\n\
    \        for sx in (-1.0, 1.0)\n        for sy in (-1.0, 1.0)\n    ]\n    part\
    \ = (\n        part.faces(\"<Z\")\n        .workplane()\n        .pushPoints(corners)\n\
    \        .circle(p.corner_relief_r)\n        .cutThruAll()\n    )\n\n    # Open-ended\
    \ tab seating channel on the top of the print (underside in use)\n    tab_channel\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.servo_tab_to_top)\n\
    \        .box(p.plate_length + 2.0, win_w, p.tab_pocket_depth + 1.0, centered=(True,\
    \ True, False))\n    )\n    part = part.cut(tab_channel)\n\n    # Rib relief channel\
    \ cut into the tab seating face (from z = servo_tab_to_top - rib_slot_h upward)\n\
    \    rib_channel = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.servo_tab_to_top\
    \ - rib_slot_h)\n        .box(p.plate_length + 2.0, rib_slot_w, rib_slot_h + p.tab_pocket_depth\
    \ + 1.0, centered=(True, True, False))\n    )\n    part = part.cut(rib_channel)\n\
    \n    # Four lateral-slotted M4 mounting holes through the plate\n    mount_pts\
    \ = [\n        (sx * hole_x, sy * hole_y_mid)\n        for sx in (-1.0, 1.0)\n\
    \        for sy in (-1.0, 1.0)\n    ]\n    for pt in mount_pts:\n        slot_cut\
    \ = (\n            cq.Workplane(\"XY\")\n            .center(pt[0], pt[1])\n \
    \           .slot2D(slot_len_y, p.m4_washer_id, 90.0)\n            .extrude(total_h\
    \ + 1.0)\n        )\n        part = part.cut(slot_cut)\n\n    return part\n"
  print_orientation: Flat on the bed with z = 0 as the top face of the plate; the
    tab guide channel and rib relief slots face upward (+Z) so there are zero overhangs
    or bridges.
  use_orientation: Flipped upside down from print orientation so z = 0 is the top
    face (shaft side) and the tab guide channel faces downward; the servo inserts
    upward from underneath.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    total_h = p.servo_tab_to_top + p.tab_pocket_depth\n  \
    \  win_l = p.servo_body_length + 2.0 * p.body_clearance\n    win_w = p.servo_body_width\
    \ + 2.0 * p.body_clearance\n    rib_slot_w = p.servo_rib_width + p.rib_width_clearance\n\
    \    rib_slot_h = p.servo_rib_height + p.rib_height_clearance\n\n    hole_x =\
    \ (p.servo_hole_spacing_inner + p.servo_tab_hole_d) / 2.0\n    hole_y_outer =\
    \ p.servo_rib_position - p.servo_tab_hole_d / 2.0\n    hole_y_inner = p.hole_slot_min_y\n\
    \    hole_y_mid = (hole_y_outer + hole_y_inner) / 2.0\n    slot_len_y = abs(hole_y_outer\
    \ - hole_y_inner) + p.m4_washer_id\n\n    x_min = win_l / 2.0 - p.coupon_overlap_l\n\
    \    x_max = hole_x + p.coupon_end_margin\n    coup_l = x_max - x_min\n    coup_w\
    \ = win_w + 14.0\n    x_center = (x_min + x_max) / 2.0\n\n    part = (\n     \
    \   cq.Workplane(\"XY\")\n        .center(x_center, 0.0)\n        .box(coup_l,\
    \ coup_w, total_h, centered=(True, True, False))\n    )\n\n    # Cut servo body\
    \ window on the inner end\n    win_cut = (\n        cq.Workplane(\"XY\")\n   \
    \     .box(win_l, win_w, total_h + 1.0, centered=(True, True, False))\n    )\n\
    \    part = part.cut(win_cut)\n\n    # Corner dogbone reliefs at the two inner\
    \ corners\n    for sy in (-1.0, 1.0):\n        c_cut = (\n            cq.Workplane(\"\
    XY\")\n            .center(win_l / 2.0, sy * win_w / 2.0)\n            .circle(p.corner_relief_r)\n\
    \            .extrude(total_h + 1.0)\n        )\n        part = part.cut(c_cut)\n\
    \n    # Tab pocket channel\n    tab_channel = (\n        cq.Workplane(\"XY\")\n\
    \        .workplane(offset=p.servo_tab_to_top)\n        .center(x_center, 0.0)\n\
    \        .box(coup_l + 2.0, win_w, p.tab_pocket_depth + 1.0, centered=(True, True,\
    \ False))\n    )\n    part = part.cut(tab_channel)\n\n    # Rib relief channel\n\
    \    rib_channel = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.servo_tab_to_top\
    \ - rib_slot_h)\n        .center(x_center, 0.0)\n        .box(coup_l + 2.0, rib_slot_w,\
    \ rib_slot_h + p.tab_pocket_depth + 1.0, centered=(True, True, False))\n    )\n\
    \    part = part.cut(rib_channel)\n\n    # Two mounting slots for one tab\n  \
    \  for sy in (-1.0, 1.0):\n        slot_cut = (\n            cq.Workplane(\"XY\"\
    )\n            .center(hole_x, sy * hole_y_mid)\n            .slot2D(slot_len_y,\
    \ p.m4_washer_id, 90.0)\n            .extrude(total_h + 1.0)\n        )\n    \
    \    part = part.cut(slot_cut)\n\n    return part\n"
  print_orientation: Flat on the bed with z = 0 on the build plate, matching servo_plate.
  use_orientation: Slide over one end of the servo from the shaft side down onto the
    mounting tab to test fit before printing the full plate.
