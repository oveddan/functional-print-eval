  part: servo_plate
  feature: rib_relief_slot
  relation: clears
  hardware: null
  clearance_mm: 0.5
  params:
  - servo_rib_width
  - servo_rib_height
  - rib_width_clearance
  - rib_height_clearance
  check:
    method: coupon
    ref: fit_coupon
    description: Check in fit_coupon that the top face of the mounting tab seats completely
      flat against the pocket floor with the 1.51 x 1.8 mm center rib inside the relief
