  part: servo_plate
  feature: tab_seating_pocket
  relation: seats
  hardware: null
  clearance_mm: 0.0
  params:
  - servo_tab_to_top
  - servo_tab_thickness
  - tab_pocket_depth
  check:
    method: coupon
    ref: fit_coupon
    description: Verify that the servo tabs sit inside the 1.8 mm deep guide channel
      with ~0.48 mm of the 2.28 mm tab standing proud so the bottom washers clamp
