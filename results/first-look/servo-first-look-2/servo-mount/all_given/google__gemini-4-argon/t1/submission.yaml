task: servo-mount
note: The servo inserts into the plate from underneath (shaft sticking up). This captures
  the full 40.58 x 19.82 mm upper servo case inside the 5.69 mm thick upper window
  for zero wobble, seats the top face of the mounting tabs flat by clearing the 1.51
  x 1.8 mm center ribs in dedicated relief slots, guides the tabs laterally in a 1.8
  mm deep channel (leaving 0.48 mm of the 2.28 mm tab proud so the bottom washers
  clamp directly onto the tabs), and leaves the cable exit below the tabs completely
  unobstructed.
questions:
- text: What is the center-to-center or inside-edge spacing between the two holes
    on a single mounting tab? (The design uses short lateral slots spanning 10.0 to
    12.04 mm pitch so M4 screws align cleanly across both standard MG996R spacing
    and the 8.31 mm rib-to-hole measurement.)
  answer: null
