parts:
- id: servo_plate
  role: final
  material: PLA
  code: "def build(p):\n    L, W, T = p.plate_len, p.plate_w, p.plate_t\n    plate\
    \ = cq.Workplane('XY').box(L, W, T, centered=(True, True, False))\n    cl = p.body_clearance\n\
    \    cut = cq.Workplane('XY').box(p.body_len + 2*cl, p.body_w + 2*cl, T + 2, centered=(True,\
    \ True, False)).translate((0, 0, -1))\n    plate = plate.cut(cut)\n    hx = (p.hole_inner_span\
    \ + p.tab_hole_d) / 2.0\n    yc = (p.hole_y_min + p.hole_y_max) / 2.0\n    slen\
    \ = (p.hole_y_max - p.hole_y_min) + p.screw_clear_d\n    for sx in (-1, 1):\n\
    \        for sy in (-1, 1):\n            s = (cq.Workplane('XY').center(sx*hx,\
    \ sy*yc)\n                 .slot2D(slen, p.screw_clear_d, angle=90)\n        \
    \         .extrude(T + 2).translate((0, 0, -1)))\n            plate = plate.cut(s)\n\
    \    gw = p.rib_w + 2*p.rib_clear\n    gd = p.rib_h + p.rib_groove_extra\n   \
    \ x0 = p.body_len/2.0\n    glen = L/2.0 + 1 - x0\n    for sx in (-1, 1):\n   \
    \     g = cq.Workplane('XY').box(glen, gw, gd + 1, centered=(True, True, False)).translate((sx*(x0\
    \ + glen/2.0), 0, -1))\n        plate = plate.cut(g)\n    return plate\n"
  print_orientation: Underside (the face with the two rib grooves, which goes against
    the servo tabs) on the bed, as modelled. No supports.
  use_orientation: Grooved face down. The servo's top end comes up from below through
    the rectangular cutout, with the shaft pointing up and the tabs clamped under
    the plate.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    L, W, T = p.plate_len, p.plate_w, p.coupon_t\n    plate\
    \ = cq.Workplane('XY').box(L, W, T, centered=(True, True, False))\n    cl = p.body_clearance\n\
    \    plate = plate.cut(cq.Workplane('XY').box(p.body_len + 2*cl, p.body_w + 2*cl,\
    \ T + 2, centered=(True, True, False)).translate((0, 0, -1)))\n    hx = (p.hole_inner_span\
    \ + p.tab_hole_d) / 2.0\n    yc = (p.hole_y_min + p.hole_y_max) / 2.0\n    slen\
    \ = (p.hole_y_max - p.hole_y_min) + p.screw_clear_d\n    for sx in (-1, 1):\n\
    \        for sy in (-1, 1):\n            plate = plate.cut(cq.Workplane('XY').center(sx*hx,\
    \ sy*yc).slot2D(slen, p.screw_clear_d, angle=90).extrude(T + 2).translate((0,\
    \ 0, -1)))\n    gw = p.rib_w + 2*p.rib_clear\n    gd = p.rib_h + p.rib_groove_extra\n\
    \    x0 = p.body_len/2.0\n    glen = L/2.0 + 1 - x0\n    for sx in (-1, 1):\n\
    \        plate = plate.cut(cq.Workplane('XY').box(glen, gw, gd + 1, centered=(True,\
    \ True, False)).translate((sx*(x0 + glen/2.0), 0, -1)))\n    # lighten: hollow\
    \ out the outer margin, keep a 5 mm frame around the cutout and slots\n    return\
    \ plate\n"
  print_orientation: Grooved face on the bed
  use_orientation: Held up against the servo by hand to test the fit
