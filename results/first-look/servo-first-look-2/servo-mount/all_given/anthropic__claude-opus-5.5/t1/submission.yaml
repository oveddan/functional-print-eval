manual:
- n: '1'
  text: 'Print fit_coupon (3 mm thick, about 15 min) with the grooved face down. Push
    the top end of the servo up into it from the grooved side. Check three things:
    the case is snug with no play, the ribs on the tabs drop into the grooves so the
    tabs sit flat, and each tab hole lines up inside a slot. If the fit is off, change
    body_clearance and print the coupon again.'
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Print servo_plate in PLA with the grooved face on the bed. No supports needed.
    4 walls or 40% infill is enough.
  parts:
  - servo_plate
  hardware: []
  tool: null
- n: '3'
  text: Hold the plate grooved side down. From below, push the shaft end of the servo
    up through the cutout until the tabs press against the underside, with each rib
    in its groove. The cable stays below the plate.
  parts:
  - servo_plate
  hardware: []
  tool: null
- n: '4'
  text: 'From the top, put a washer on each M4x16 screw and push it down through a
    slot and the tab hole under it. Under each tab, add a washer and then a lock nut.
    Tighten all four in a cross pattern with a 3 mm hex key until the tabs are pulled
    flat. Stop there: overtightening will crush the PLA.'
  parts:
  - servo_plate
  hardware:
  - screw
  - washer
  - locknut
  tool: 3 mm hex key, 7 mm spanner
