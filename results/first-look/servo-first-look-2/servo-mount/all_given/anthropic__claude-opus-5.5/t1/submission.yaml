criteria:
- id: c_body
  part: servo_plate
  feature: rectangular cutout
  relation: contains
  hardware: null
  clearance_mm: 0.2
  params:
  - body_len
  - body_w
  - body_clearance
  check:
    method: coupon
    ref: fit_coupon
    description: The case top should slide into the cutout by hand with no play you
      can feel. If it's too tight, raise body_clearance to 0.3. If it rocks, lower
      it to 0.1.
- id: c_rib
