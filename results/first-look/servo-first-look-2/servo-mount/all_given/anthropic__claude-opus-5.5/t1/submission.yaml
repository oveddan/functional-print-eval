task: servo-mount
note: The servo hangs below the plate and only its top end comes through, so the cable
  never has to pass through the cutout. The snug cutout and the rib grooves stop it
  moving sideways, and the four clamped tabs stop it rocking. M4 screws fit the 4.58
  mm tab holes. The heads are small enough not to hit the ribs. You don't need the
  coupon's outer border; it's just the plate printed at 3 mm.
questions:
- text: I couldn't get the spacing between the two holes on one tab. I used the datasheet's
    10 mm, and the slots also cover a 12 mm spacing. Do your tab holes fall inside
    the slots?
  answer: null
- text: The grooves assume each rib runs along the servo's long axis, centred between
    the tab's two holes. Is that right?
  answer: null
