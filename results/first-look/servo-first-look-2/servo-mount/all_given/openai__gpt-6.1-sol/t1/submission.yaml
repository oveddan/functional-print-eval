task: servo-mount
note: 'Adjustable U-shaped plate with two separate tab-support rails. Shaft points
  up; tab undersides rest on rails. The open end routes the cable without assuming
  its boot size. Four M3 screws clamp the servo tabs; four more clamp the rails to
  the plate. Fit checks are mandatory: the supplied measurements do not establish
  the complete hole pattern, underside flatness, or cable envelope. This design does
  not include attachment to the robot base and must not be operated as an unsupported
  robot joint.'
questions:
- text: Center spacing between the two slots on one tab?
  answer: null
- text: Are tab undersides flat and free of projections?
  answer: null
- text: Cable boot size and projection?
  answer: null
