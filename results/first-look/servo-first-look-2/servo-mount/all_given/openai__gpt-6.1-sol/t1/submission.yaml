parts:
- id: plate
  role: final
  material: PLA
  code: "def build(p):\n    d=p.screw_d+p.hole_clearance\n    s=cq.Workplane('XY').box(p.plate_length,p.plate_width,p.plate_t,centered=(True,True,False))\n\
    \    end=p.plate_length/2+1\n    cut=cq.Workplane('XY').box(end-p.opening_back_x,p.opening_width,p.plate_t+2,centered=(True,True,False)).translate(((end+p.opening_back_x)/2,0,-1))\n\
    \    s=s.cut(cut)\n    mid=(p.rail_x_min+p.rail_x_max)/2\n    for sign in (-1,1):\n\
    \        for y in (-p.anchor_y,p.anchor_y):\n            c=cq.Workplane('XY').workplane(offset=-1).center(sign*mid,y).slot2D(p.rail_x_max-p.rail_x_min+d,d,0).extrude(p.plate_t+2)\n\
    \            s=s.cut(c)\n    return s"
  print_orientation: Broad flat underside at z=0; no supports.
  use_orientation: Same axes as printed. Shaft points +Z; cable end points +X toward
    open end. Rails sit on z=6 top face.
- id: rail_left
  role: final
  material: PLA
  code: "def build(p):\n    d=p.screw_d+p.hole_clearance\n    s=cq.Workplane('XY').box(p.rail_width,p.rail_length,p.rail_t,centered=(True,True,False))\n\
    \    c=cq.Workplane('XY').workplane(offset=-1).slot2D(2*p.servo_slot_halftravel+d,d,90).extrude(p.rail_t+2)\n\
    \    s=s.cut(c)\n    for y in (-p.anchor_y,p.anchor_y):\n        c=cq.Workplane('XY').workplane(offset=-1).center(0,y).circle(d/2).extrude(p.rail_t+2)\n\
    \        s=s.cut(c)\n    return s"
  print_orientation: Flat underside at z=0, length along Y; no supports.
  use_orientation: Translate to approximately X=-24.595, Y=0, Z=6 in plate frame;
    adjust X to fit actual servo. Flat top supports underside of negative-X tab.
- id: rail_right
  role: final
  material: PLA
  code: "def build(p):\n    d=p.screw_d+p.hole_clearance\n    s=cq.Workplane('XY').box(p.rail_width,p.rail_length,p.rail_t,centered=(True,True,False))\n\
    \    c=cq.Workplane('XY').workplane(offset=-1).slot2D(2*p.servo_slot_halftravel+d,d,90).extrude(p.rail_t+2)\n\
    \    s=s.cut(c)\n    for y in (-p.anchor_y,p.anchor_y):\n        c=cq.Workplane('XY').workplane(offset=-1).center(0,y).circle(d/2).extrude(p.rail_t+2)\n\
    \        s=s.cut(c)\n    return s"
  print_orientation: Flat underside at z=0, length along Y; no supports.
  use_orientation: Translate to approximately X=+24.595, Y=0, Z=6 in plate frame;
    adjust X to fit actual servo. Flat top supports underside of positive-X tab.
- id: fit_strip
  role: coupon
  material: PLA
  code: "def build(p):\n    d=p.screw_d+p.hole_clearance\n    s=cq.Workplane('XY').box(p.rail_width,p.rail_length,p.coupon_t,centered=(True,True,False))\n\
    \    c=cq.Workplane('XY').workplane(offset=-1).slot2D(2*p.servo_slot_halftravel+d,d,90).extrude(p.coupon_t+2)\n\
    \    s=s.cut(c)\n    for y in (-p.anchor_y,p.anchor_y):\n        s=s.cut(cq.Workplane('XY').workplane(offset=-1).center(0,y).circle(d/2).extrude(p.coupon_t+2))\n\
    \    return s"
  print_orientation: Broad face at z=0; no supports.
  use_orientation: Temporary thin substitute for either rail, flat against tab underside.
    Not a structural part.
