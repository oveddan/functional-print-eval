criteria:
- id: tab_fit
  part: fit_strip
  feature: Flat contact with tab underside; actual two slot positions both accessible
    within continuous slot.
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - rail_width
  - servo_slot_halftravel
  - tab_underside_projection
  - same_tab_pitch
  check:
    method: coupon
    ref: fit_strip
    description: Test each tab. Strip must sit flat without rocking, clear the case,
      and accept two M3 screws through round bottoms of servo slots. Stop if it fails.
- id: washer_rib_clearance
  part: fit_strip
  feature: Washer seats on tab beside rib, bridges open servo slot and stays inside
    closed slot bottom.
  relation: seats
  hardware: washers
  clearance_mm: null
  params:
  - washer_od
  - tab_slot_width
  - rib_height
  - rib_width
  check:
    method: coupon
    ref: fit_strip
    description: Place washers and screws loosely on both tabs. Every upper washer
      must lie flat on tab, not on rib or case, and bridge both sides of its U-slot.
      Do not tighten coupon with long screws.
- id: case_clearance
  part: rail_left
  feature: Rail inner edge and servo case.
  relation: clears
  hardware: null
  clearance_mm: 0.4
  params:
  - body_length
  - rail_width
  - rail_x_min
  - rail_x_max
  - minimum_case_clearance
  check:
    method: measure
    ref: null
    description: With actual rails adjusted to hole positions, confirm at least 0.4
      mm clearance between each rail inner edge and case; repeat on right rail. Do
      not use screws to force alignment.
- id: plate_route
  part: plate
  feature: Open U-shaped case and cable route.
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - opening_width
  - opening_back_x
  - body_width
  - cable_projection
  check:
    method: measure
    ref: null
    description: Check case, wire boot and cable clear all plate edges, nuts and screw
      tips through normal cable routing; no pinching or rubbing. Verify 30 mm clearance
      below plate is sufficient.
- id: screw_fit
  part: fit_strip
  feature: M3 clearance slot and round anchor holes.
  relation: clears
  hardware: servo_screws
  clearance_mm: null
  params:
  - screw_d
  - hole_clearance
  check:
    method: coupon
    ref: fit_strip
    description: M3 screws must slide freely without threading into PLA.
- id: clamp_check
  part: plate
  feature: Rail-to-plate friction clamps and servo tab clamps.
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - plate_t
  - rail_t
  check:
    method: measure
    ref: null
    description: With base secured and servo unpowered, gently push/pull the case
      in all directions. No tab or rail slipping, rocking, cracked plastic or visible
      gaps permitted. This is a fit check, not a rated load test.
manual:
- n: '1'
  text: Print fit_strip first at 0.2 mm layers. Test both tab undersides and all four
    servo slots as described in criteria. An M3 screw must pass freely; each 7 mm
    washer must bridge its servo slot and lie flat without contacting the raised rib.
    Unknown tab geometry is a stop condition, not permission to clamp on a rib. If
    any test fails, revise the design before printing the full assembly.
  parts:
  - fit_strip
  hardware:
  - servo_screws
  - washers
  tool: Calipers and 2.5 mm hex key
- n: '2'
  text: 'Print plate and both rails in their specified orientations: 5 walls, 6 top/bottom
    layers, 45% infill. No supports needed. Remove burrs without enlarging slots unnecessarily.
    Rails are identical. Do not substitute the thin fit_strip for a final rail.'
  parts:
  - plate
  - rail_left
  - rail_right
  hardware: []
  tool: null
- n: '3'
  text: Place rails across the U opening, with their lengths along Y, on the plate
    top. Begin near X=+/-24.595 mm; this is only an edge-derived estimate, not a measured
    hole pattern. At each of four rail end holes insert M3x20 downward with one washer
    under its head, then through the plate adjustment slot; add one washer and M3
    nut underneath. Leave loose enough to slide rails.
  parts:
  - plate
  - rail_left
  - rail_right
  hardware:
  - rail_screws
  - washers
  - nuts
  tool: 2.5 mm hex key and 5.5 mm wrench
- n: '4'
  text: 'Support the assembly with its underside accessible and at least 30 mm empty
    space beneath the plate. Lower servo between rails, shaft up, cable end toward
    open +X. Tab undersides sit on the rail top faces. Slide rails until centered
    under the actual tab slots, maintaining at least 0.4 mm case clearance. Both tabs
    must sit flat simultaneously. Rail adjustment may not cover an unexpected servo
    variant: stop rather than force it.'
  parts:
  - plate
  - rail_left
  - rail_right
  hardware: []
  tool: Calipers
- n: '5'
  text: Fit four M3x16 downward through one washer each, the servo's actual U-slots
    and the continuous rail slots. Position shafts at the closed round bottoms of
    the servo slots; add one washer and M3 nut below each rail. Screw Y positions
    are set by the actual servo, not the illustrative joint coordinates. Confirm full
    nut engagement, at least one thread projecting, flat washers, and no screw-tip
    contact with cable or case.
  parts:
  - rail_left
  - rail_right
  hardware:
  - servo_screws
  - washers
  - nuts
  tool: 2.5 mm hex key and 5.5 mm wrench
- n: '6'
  text: Snug the four servo clamps gradually in a diagonal sequence while supporting
    each nut with the wrench. Then snug the four rail anchors. Use hand tools only;
    stop when clamped without crushing or bending servo tabs or PLA. No torque rating
    is asserted. The screws provide clamping friction, not close-fitting location
    in the servo's oversized slots.
  parts:
  - plate
  - rail_left
  - rail_right
  hardware:
  - servo_screws
  - rail_screws
  - washers
  - nuts
  tool: 2.5 mm hex key and 5.5 mm wrench
- n: '7'
  text: Before powering, securely attach/support this plate on the eventual base without
    obstructing the servo, cable, nuts or screw tips. Base attachment is not included
    here. Check for rocking or slip by hand, then begin with low-load motion. Recheck
    nut tightness after initial use; PLA can creep. Keep away from heat and do not
    treat this as a rated robot-arm structural joint. Shaft or gearbox backlash inside
    the servo is not removed by this mount.
  parts:
  - plate
  - rail_left
  - rail_right
  hardware: []
  tool: null
