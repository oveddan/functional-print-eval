parts:
- id: plate
  role: final
  material: PLA black (high-speed)
  code: "import math\n\ndef build(p):\n    T = p.plate_t\n    hx = p.hole_span / 2\
    \ + p.tab_hole_d / 2\n    hy = p.hole_y_spacing / 2\n    ox = p.body_len / 2 +\
    \ p.opening_clear\n    oy = p.body_w / 2 + p.opening_clear\n    plate = cq.Workplane('XY').box(2\
    \ * p.plate_half_x, 2 * p.plate_half_y, T, centered=(True, True, False))\n   \
    \ opening = cq.Workplane('XY').box(2 * ox, 2 * oy, T + 2, centered=(True, True,\
    \ False)).translate((0, 0, -1))\n    plate = plate.cut(opening)\n    pts = [(sx\
    \ * hx, sy * hy) for sx in (-1, 1) for sy in (-1, 1)]\n    clear = cq.Workplane('XY').pushPoints(pts).circle(p.screw_clear\
    \ / 2).extrude(T + 2).translate((0, 0, -1))\n    plate = plate.cut(clear)\n  \
    \  nut_d = (p.nut_af + p.nut_clear) / math.cos(math.radians(30))\n    nuts = cq.Workplane('XY').pushPoints(pts).polygon(6,\
    \ nut_d).extrude(p.nut_h + 1.3).translate((0, 0, -1))\n    plate = plate.cut(nuts)\n\
    \    slot = cq.Workplane('XY').box(p.plate_half_x - ox + 2, p.cable_slot_w, T\
    \ + 2, centered=(False, True, False)).translate((ox - 1, 0, -1))\n    plate =\
    \ plate.cut(slot)\n    return plate\n"
  print_orientation: bottom face (z=0) on the bed, tab ledge face up
  use_orientation: bottom face down, shaft pointing up, servo body hanging through
    the opening
