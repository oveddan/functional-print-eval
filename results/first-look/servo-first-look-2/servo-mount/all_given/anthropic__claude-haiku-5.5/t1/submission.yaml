task: servo-mount
note: 'Design is a plate with a through opening for the servo body. The tabs rest
  on the top ledges and four M4 screws clamp them down into hex nut pockets underneath.
  The servo hangs below the plate, so the tab clamp carries the load. Several inputs
  are unmeasured: the two-hole spacing on one tab (guessed 14 mm), cable diameter
  and exit height (guessed 6 mm slot), tab width, and whether the top-face rib interferes
  with the washers. The design should not be printed until the hole spacing is confirmed.'
questions:
- text: Centre-to-centre distance between the two holes on one tab (not measured;
    plate uses a guessed 14 mm). Please measure before printing.
  answer: null
- text: Cable outer diameter and where it exits the case end (height below the tab).
    Slot is guessed at 6 mm wide.
  answer: null
- text: 'Rib: which direction it runs and whether it sits under the washer footprint
    (washer OD 9 mm). The rib stands 1.8 mm above the tab top, so a washer on the
    rib may tilt. If it does, add a shallow recess in the plate or a thicker washer.'
  answer: null
- text: Tab width across the body. Plate is 25 mm wide, assumed to fit under the tabs.
  answer: null
