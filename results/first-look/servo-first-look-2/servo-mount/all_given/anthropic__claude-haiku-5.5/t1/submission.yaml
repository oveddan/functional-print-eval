manual:
- n: '1'
  text: Print the plate with its flat bottom on the bed. Check the four clearance
    holes and the four hex pockets on the underside are clean.
  parts:
  - plate
  hardware: []
  tool: null
- n: '2'
  text: Press one M4 hex nut into each of the four hex pockets from the underside
    of the plate. The nut corners point along the plate length (X). Nuts should sit
    flush or slightly recessed.
  parts:
  - plate
  hardware:
  - nut4
  tool: null
- n: '3'
  text: Lower the servo shaft-first down through the opening from the top of the plate,
    with the cable end toward the cable slot. The two tabs should rest on the plate
    top ledges on either side of the opening. Feed the cable out through the slot.
  parts:
  - plate
  hardware: []
  tool: null
- n: '4'
  text: Place one M4 washer on each tab hole on top of the tab.
  parts:
  - plate
  hardware:
  - washer4
  tool: null
- n: '5'
  text: Insert an M4x10 socket head screw through each washer and tab hole and thread
    it into the nut below. Tighten evenly across the four screws until the tabs are
    clamped and the servo does not wobble. Do not overtighten the PLA.
  parts:
  - plate
  hardware:
  - screw4
  tool: 2.5 mm hex key
