task: servo-mount
note: The plate sits under the servo tabs. The case hangs through a cutout and the
  shaft points up. M3 screws with washers go down through the tab holes and slots
  into nuts held in pockets on the underside. I used M3 instead of M4 so the nut pockets
  leave about 1 mm of wall next to the cutout. The hole spacing across one tab was
  not measured, so the slots allow roughly 9.2 to 12.8 mm. The cable exit height was
  not measured either, so no cable relief is cut. Run the fit-coupon first to check
  both.
questions:
- text: What is the centre-to-centre spacing of the two holes on one tab? The slots
    cover 9.2 to 12.8 mm, so this only needs checking if the coupon shows a miss.
  answer: null
- text: How far below the tab underside does the cable leave the case? The plate is
    6 mm thick and I haven't cut a relief for the cable.
  answer: null
