manual:
- n: '1'
  text: Print the fit-coupon first (about 10 minutes, flat with the pocket side on
    the bed). Lay one servo tab on it with the case end in the cutout. Check that
    the two tab holes sit over the slots, that an M3 nut drops into the pocket, and
    that the case fits the cutout. If the holes miss the slots, stop and tell me the
    hole spacing on one tab.
  parts:
  - fit-coupon
  hardware:
  - nut
  tool: null
- n: '2'
  text: Print the plate flat with the nut pockets on the bed. Use 4 or more walls
    and 40% or more infill.
  parts:
  - plate
  hardware: []
  tool: null
- n: '3'
  text: Press an M3 nut into each of the 4 pockets from the underside. The nut can
    slide along the pocket but cannot turn.
  parts:
  - plate
  hardware:
  - nut
  tool: null
- n: '4'
  text: Lower the servo case, shaft up, through the cutout until the tabs rest on
    the plate top face. Check which end the cable leaves. If the cable touches the
    plate, tell me the height of the cable exit below the tab and I will cut a relief
    for it.
  parts:
  - plate
  hardware: []
  tool: null
- n: '5'
  text: Put an M3 washer on each of the 4 tab holes. Drop an M3x8 screw through each
    washer, tab hole and plate slot, and start it into the nut below. Slide the nut
    and screw within the slot until they sit in the tab hole.
  parts:
  - plate
  hardware:
  - screw
  - washer
  - nut
  tool: 2.5 mm hex key
- n: '6'
  text: Tighten the four screws a little at a time, working in a cross pattern, until
    the servo is firm on the plate. Don't crush the printed plate. The screw tips
    end up flush with or just above the underside of the plate.
  parts:
  - plate
  hardware:
  - screw
  tool: 2.5 mm hex key
