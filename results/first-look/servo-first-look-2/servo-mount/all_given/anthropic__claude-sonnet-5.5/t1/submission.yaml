parts:
- id: plate
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    pitch = p.hole_gap_inner + p.tab_hole_d\n\
    \    pocket_af = p.nut_af + p.pocket_clr\n    plate_l = pitch + 2*(pocket_af/2\
    \ + p.edge_margin)\n    t = p.plate_t\n    plate = cq.Workplane('XY').box(plate_l,\
    \ p.plate_w, t, centered=(True, True, False)).edges('|Z').fillet(3)\n    cut =\
    \ cq.Workplane('XY').box(p.body_len + 2*p.fit_clr, p.body_w + 2*p.fit_clr, t,\
    \ centered=(True, True, False))\n    plate = plate.cut(cut)\n    R = pocket_af\
    \ / math.sqrt(3)\n    pts = [(R*math.cos(math.radians(90+60*k)), R*math.sin(math.radians(90+60*k)))\
    \ for k in range(6)]\n    depth = p.nut_h + p.pocket_depth_extra\n    ymid = (p.slot_y_min\
    \ + p.slot_y_max)/2\n    span = p.slot_y_max - p.slot_y_min\n    for sx in (-1,\
    \ 1):\n        for sy in (-1, 1):\n            x = sx*pitch/2\n            slot\
    \ = cq.Workplane('XY').center(x, sy*ymid).slot2D(span + p.screw_slot_d, p.screw_slot_d,\
    \ 90).extrude(t)\n            plate = plate.cut(slot)\n            for yy in (p.slot_y_min,\
    \ p.slot_y_max):\n                hexp = cq.Workplane('XY').polyline([(x+a, sy*yy+b)\
    \ for a, b in pts]).close().extrude(depth)\n                plate = plate.cut(hexp)\n\
    \            bar = cq.Workplane('XY').center(x, sy*ymid).rect(pocket_af, span).extrude(depth)\n\
    \            plate = plate.cut(bar)\n    return plate"
  print_orientation: flat, bottom face (nut pockets open) on the bed
  use_orientation: horizontal; servo hangs down through the cutout with the shaft
    pointing up, tabs rest on the top face
- id: fit-coupon
  role: coupon
  material: PLA
  code: "import math\ndef build(p):\n    pitch = p.hole_gap_inner + p.tab_hole_d\n\
    \    pocket_af = p.nut_af + p.pocket_clr\n    plate_l = pitch + 2*(pocket_af/2\
    \ + p.edge_margin)\n    t = p.plate_t\n    plate = cq.Workplane('XY').box(plate_l,\
    \ p.plate_w, t, centered=(True, True, False)).edges('|Z').fillet(3)\n    cut =\
    \ cq.Workplane('XY').box(p.body_len + 2*p.fit_clr, p.body_w + 2*p.fit_clr, t,\
    \ centered=(True, True, False))\n    plate = plate.cut(cut)\n    R = pocket_af\
    \ / math.sqrt(3)\n    pts = [(R*math.cos(math.radians(90+60*k)), R*math.sin(math.radians(90+60*k)))\
    \ for k in range(6)]\n    depth = p.nut_h + p.pocket_depth_extra\n    ymid = (p.slot_y_min\
    \ + p.slot_y_max)/2\n    span = p.slot_y_max - p.slot_y_min\n    sx = 1\n    for\
    \ sy in (-1, 1):\n        x = sx*pitch/2\n        slot = cq.Workplane('XY').center(x,\
    \ sy*ymid).slot2D(span + p.screw_slot_d, p.screw_slot_d, 90).extrude(t)\n    \
    \    plate = plate.cut(slot)\n        for yy in (p.slot_y_min, p.slot_y_max):\n\
    \            hexp = cq.Workplane('XY').polyline([(x+a, sy*yy+b) for a, b in pts]).close().extrude(depth)\n\
    \            plate = plate.cut(hexp)\n        bar = cq.Workplane('XY').center(x,\
    \ sy*ymid).rect(pocket_af, span).extrude(depth)\n        plate = plate.cut(bar)\n\
    \    keep = cq.Workplane('XY').box(plate_l/2 - 12 + 0.0, p.plate_w, t, centered=(False,\
    \ True, False)).translate((12, 0, 0))\n    return plate.intersect(keep)"
  print_orientation: flat, bottom face (nut pockets open) on the bed
  use_orientation: 'test only: lay one servo tab on it, case end in the cutout'
