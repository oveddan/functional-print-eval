task: servo-mount
note: 'Assumptions made from the measurements given: the two holes on each tab are
  symmetric about the rib, so their centers are 21.2 mm apart along the tab length,
  and that pattern is centered on the case; the cross-tab hole centers are 49.19 mm
  apart (44.61 mm inside edges + 4.58 mm). The total tab outer span was not available,
  so the plate is 70 mm wide to cover the tabs with margin; the fit-check coupon lets
  you confirm the hole positions before printing the full plate. The case top pokes
  up through the central opening because the tabs sit about 5.66 mm below the top
  of the case. Screw length check: 3.0 mm plate below the counterbore + 2.28 mm tab
  + 0.8 mm washer + 5.0 mm lock nut = 11.08 mm, so M4x16 leaves ~4.9 mm of thread
  past the nut.'
