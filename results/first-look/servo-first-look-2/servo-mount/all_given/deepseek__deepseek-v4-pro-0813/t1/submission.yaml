parts:
- id: servo_mount_plate
  role: final
  material: PLA
  code: "def build(p):\n    import cadquery as cq\n\n    hole_x = p.hole_cross_inner\
    \ / 2.0 + p.hole_d / 2.0\n    hole_y = (2.0 * p.rib_pos + p.hole_d) / 2.0\n\n\
    \    plate = (cq.Workplane(\"XY\")\n             .rect(p.plate_w, p.plate_len)\n\
    \             .vertices().fillet(p.corner_r)\n             .extrude(p.plate_t))\n\
    \n    opening = (cq.Workplane(\"XY\")\n               .rect(p.case_len + 2.0 *\
    \ p.open_clear,\n                     p.case_wid + 2.0 * p.open_clear)\n     \
    \          .vertices().fillet(p.open_r)\n               .extrude(p.plate_t + 2.0))\n\
    \    plate = plate.cut(opening)\n\n    pts = [(hole_x, hole_y), (hole_x, -hole_y),\n\
    \           (-hole_x, hole_y), (-hole_x, -hole_y)]\n    plate = (plate.faces(\"\
    >Z\").workplane()\n             .pushPoints(pts)\n             .cboreHole(p.m4_clear_d,\
    \ p.cb_d, p.cb_depth))\n\n    gx0 = p.case_wid / 2.0 + p.groove_start\n    gx1\
    \ = p.plate_w / 2.0 - p.groove_end_margin\n    gxc = (gx0 + gx1) / 2.0\n    gxl\
    \ = gx1 - gx0\n    for s in (-1.0, 1.0):\n        plate = plate.cut(\n       \
    \     cq.Workplane(\"XY\")\n            .center(s * gxc, 0.0)\n            .rect(gxl,\
    \ p.groove_w)\n            .extrude(p.groove_depth + 1.0)\n            .translate((0.0,\
    \ 0.0, -0.5)))\n\n    return plate"
  print_orientation: grooved face (tab-contact side) flat on the bed, counterbored
    face up
  use_orientation: grooved face down against the servo's mounting tabs; counterbored
    face up; output shaft points up through the central opening
- id: fit_check_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    import cadquery as cq\n\n    hole_x = p.hole_cross_inner\
    \ / 2.0 + p.hole_d / 2.0\n    hole_y = (2.0 * p.rib_pos + p.hole_d) / 2.0\n\n\
    \    coupon = (cq.Workplane(\"XY\")\n              .rect(p.plate_w, p.plate_len)\n\
    \              .vertices().fillet(p.corner_r)\n              .extrude(p.coupon_t))\n\
    \n    coupon = coupon.cut(\n        cq.Workplane(\"XY\")\n        .rect(p.case_len\
    \ + 2.0 * p.open_clear,\n              p.case_wid + 2.0 * p.open_clear)\n    \
    \    .vertices().fillet(p.open_r)\n        .extrude(p.coupon_t + 2.0))\n\n   \
    \ pts = [(hole_x, hole_y), (hole_x, -hole_y),\n           (-hole_x, hole_y), (-hole_x,\
    \ -hole_y)]\n    coupon = (coupon.faces(\">Z\").workplane()\n              .pushPoints(pts)\n\
    \              .hole(p.m4_clear_d))\n\n    gx0 = p.case_wid / 2.0 + p.groove_start\n\
    \    gx1 = p.plate_w / 2.0 - p.groove_end_margin\n    gxc = (gx0 + gx1) / 2.0\n\
    \    gxl = gx1 - gx0\n    for s in (-1.0, 1.0):\n        coupon = coupon.cut(\n\
    \            cq.Workplane(\"XY\")\n            .center(s * gxc, 0.0)\n       \
    \     .rect(gxl, p.groove_w)\n            .extrude(p.groove_depth + 1.0)\n   \
    \         .translate((0.0, 0.0, -0.5)))\n\n    return coupon"
  print_orientation: grooved face flat on the bed
  use_orientation: grooved face down on the servo's mounting tabs, shaft side up
