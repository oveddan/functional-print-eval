manual:
- n: '1'
  text: Print the fit-check coupon (fit_check_coupon) first. Lay it on the servo's
    mounting tabs with the grooved face down. Check that the case top slips through
    the central opening and all four holes line up with the tab U-slots. If a hole
    is off, note which way and by how much before printing the full plate.
  parts:
  - fit_check_coupon
  hardware: []
  tool: null
- n: '2'
  text: Print the servo mount plate (servo_mount_plate) with the grooved face flat
    on the print bed and the counterbored face up.
  parts:
  - servo_mount_plate
  hardware: []
  tool: null
- n: '3'
  text: Hold the plate over the servo so the grooved face is against the mounting
    tabs (shaft side). The case top and output shaft come up through the central opening,
    and the two ribs on the tabs sit in the two grooves.
  parts:
  - servo_mount_plate
  hardware: []
  tool: null
- n: '4'
  text: 'At each of the four holes: drop an M4 washer into the counterbore, then push
    an M4x16 screw down through the plate and the tab''s U-slot. Under the tab, add
    an M4 washer and then an M4 lock nut.'
  parts:
  - servo_mount_plate
  hardware:
  - scr
  - washer
  - locknut
  tool: 3 mm hex key and 7 mm spanner
- n: '5'
  text: Tighten all four lock nuts evenly until the plate sits firm with no rocking.
    Do not overtighten the plastic tabs.
  parts:
  - servo_mount_plate
  hardware:
  - locknut
  tool: 3 mm hex key and 7 mm spanner
