parts:
- id: servo_mount_plate
  role: final
  material: PLA
  code: "import cadquery as cq\n\ndef build(p):\n    hole_d = p.servo_tab_hole_d \
    \ # screw passes through the U-hole\n    # center-to-center across tabs\n    ctc\
    \ = p.servo_hole_spacing_inside + hole_d  # inside->inside + one hole dia = center->center\n\
    \    plate_w = p.servo_body_w + 2*18.0  # width covering both tabs\n    plate_l\
    \ = p.servo_body_l + 60.0      # length spanning both tabs\n\n    base = (cq.Workplane('XY')\n\
    \            .box(plate_l, ctc + 2*10.0, p.plate_t, centered=(True,True,False)))\n\
    \n    # central opening for servo body + shaft\n    base = base.faces('>Z').workplane().rect(p.servo_body_l\
    \ + 14.0, p.servo_body_w + 14.0).cutBlind(-p.plate_t)\n    base = base.faces('>Z').workplane().hole(p.shaft_opening_d)\n\
    \n    # four screw holes at the tab positions (two per tab)\n    x = p.servo_body_l/2.0\n\
    \    y = ctc/2.0\n    for sx in (x, -x):\n        for sy in (y, -y):\n       \
    \     base = (base.faces('>Z').workplane()\n                    .moveTo(sx, sy)\n\
    \                    .cboreHole(p.screw_d + p.clearance, p.screw_head_d + p.clearance,\
    \ p.screw_head_h + 1.0))\n\n    # rib-clearance pockets on underside (tab faces\
    \ the plate's underside)\n    # rib runs along the tab between the two holes;\
    \ pocket centered at rib position from hole side\n    # approximate: pocket spans\
    \ the tab width at rib location\n    for sx in (p.servo_body_l/2.0 + 8.0, -p.servo_body_l/2.0\
    \ - 8.0):\n        base = (base.faces('<Z').workplane()\n                .center(sx,\
    \ 0)\n                .rect(p.rib_pocket_w, ctc + 4.0)\n                .cutBlind(-p.rib_pocket_h))\n\
    \n    return base"
  print_orientation: flat, large face down on bed (the face that contacts the servo
    tabs faces up)
  use_orientation: servo tabs face the plate underside, shaft pokes up through center
    opening
