  nut: nuts
  external: null
criteria: []
manual:
- n: '1'
  text: Print servo_mount_plate flat, large face on the bed.
  parts:
  - servo_mount_plate
  hardware: []
  tool: null
- n: '2'
  text: Lay the plate flat. Slide the servo in from below so its two mounting tabs
    sit against the plate's underside and the shaft pokes up through the center opening.
  parts:
  - servo_mount_plate
  hardware: []
  tool: null
- n: '3'
  text: Drop one M3x16 screw through each of the four holes, threading through the
    servo's tab U-holes.
  parts:
  - servo_mount_plate
  hardware:
  - screws
  tool: null
- n: '4'
  text: From below, slip a washer and spin an M3 nut onto each screw. Tighten evenly
    until the tabs sit flat and there is no wobble.
  parts:
  - servo_mount_plate
  hardware:
  - nuts
  - washers
  tool: null
