task: servo-mount
note: The plate holds the MG996R by its mounting tabs, body hanging below and shaft
  up. The hole pattern uses your measured 44.61 mm inside-edge gap. The spacing between
  the two holes on a single tab was not measured, so 10 mm is a placeholder that must
  be verified before printing. The rib on each tab sits between the washer and tab
  face, so clamping is through the rib crests; check for residual rock after tightening.
questions:
- text: Measure the centre-to-centre distance between the two mounting holes on one
    servo tab. The plate uses 10 mm as a placeholder; if your servo's spacing differs,
    the holes will not line up.
  answer: null
- text: Does the servo's body sit fully through the 40.98 x 20.22 mm opening without
    binding?
  answer: null
params:
  body_len:
    value: 40.58
    unit: mm
    kind: world
    source: measured
    note: servo case length, end to end, excluding tabs
  body_w:
    value: 19.82
    unit: mm
    kind: world
    source: measured
    note: servo case width
  body_clear:
