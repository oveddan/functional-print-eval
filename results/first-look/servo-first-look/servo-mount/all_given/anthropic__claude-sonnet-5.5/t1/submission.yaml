parts:
- id: plate
  role: final
  material: PLA
  code: "def build(p):\n    T = p.plate_t\n    plate = cq.Workplane('XY').box(p.plate_len,\
    \ p.plate_w, T, centered=(True, True, False)).edges('|Z').fillet(p.corner_r)\n\
    \    pocket = cq.Workplane('XY').workplane(offset=-1).rect(p.servo_len + 2*p.fit_clear,\
    \ p.servo_wid + 2*p.fit_clear).extrude(T + 2)\n    plate = plate.cut(pocket)\n\
    \    hx = (p.hole_gap_inner + p.tab_hole_d) / 2.0\n    pts = [(sx*hx, sy*p.hole_pitch/2.0)\
    \ for sx in (-1, 1) for sy in (-1, 1)]\n    holes = cq.Workplane('XY').workplane(offset=T\
    \ - p.insert_hole_depth).pushPoints(pts).circle(p.insert_hole_d/2.0).extrude(p.insert_hole_depth\
    \ + 1)\n    return plate.cut(holes)\n"
  print_orientation: flat, underside on the bed, insert holes facing up
  use_orientation: flat, servo drops in from above with shaft up
- id: fit-coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    T = p.plate_t\n    x0 = p.plate_len/2.0 - 9.5\n    c =\
    \ cq.Workplane('XY').box(19, p.plate_w, T, centered=(True, True, False)).translate((x0,\
    \ 0, 0))\n    pocket = cq.Workplane('XY').workplane(offset=-1).rect(p.servo_len\
    \ + 2*p.fit_clear, p.servo_wid + 2*p.fit_clear).extrude(T + 2)\n    c = c.cut(pocket)\n\
    \    hx = (p.hole_gap_inner + p.tab_hole_d) / 2.0\n    pts = [(hx, sy*p.hole_pitch/2.0)\
    \ for sy in (-1, 1)]\n    holes = cq.Workplane('XY').workplane(offset=T - p.insert_hole_depth).pushPoints(pts).circle(p.insert_hole_d/2.0).extrude(p.insert_hole_depth\
    \ + 1)\n    return c.cut(holes)\n"
  print_orientation: flat, underside on the bed
  use_orientation: flat; test the servo tab on it
