manual:
- n: '1'
  text: Print the fit-coupon first (flat, 0.2 mm layers, 3 walls). Press the servo's
    tab onto it. The servo end should drop into the pocket with no rocking, and the
    two round holes should line up with the middle of the tab's two U slots.
  parts:
  - fit-coupon
  hardware: []
  tool: null
- n: '2'
  text: If the holes don't line up, tell me the real distance between the two holes
    on one tab and I'll adjust the plate. I guessed 10 mm because I couldn't get it
    measured. Otherwise print the plate flat, with the insert holes facing up.
  parts:
  - plate
  hardware: []
  tool: null
- n: '3'
  text: Heat-set the four M3 inserts into the round holes in the plate's top face.
    Use a soldering iron at about 200-220 C, push each one in straight until it is
    flush with the surface, and let it cool.
  parts:
  - plate
  hardware:
  - insert
  tool: soldering iron
- n: '4'
  text: Lower the servo into the rectangular opening with the shaft pointing up. The
    two tabs rest flat on the plate top. Slide it so each tab's U slots sit over the
    insert holes.
  parts:
  - plate
  hardware: []
  tool: null
- n: '5'
  text: Put an M3 washer over each insert hole on the tab. Drive in an M3x8 screw
    through each washer and U slot into the insert. Tighten all four evenly in a cross
    pattern until snug. Don't overtighten, because the PLA and tab can crush.
  parts:
  - plate
  hardware:
  - screw
  - washer
  tool: 2.5 mm hex key
