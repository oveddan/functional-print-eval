task: servo-mount
note: 'Plate has a rectangular opening for the servo case (0.25 mm clearance per side).
  The case hangs through it, shaft up, and the tabs rest flat on the plate top. The
  ribs are on the top of the tabs, so they don''t get in the way. The tab holes (4.58
  mm) are too small for M5, so I used M3 screws, washers and heat-set inserts instead
  of M4 nuts. A nut pocket would have left only about 0.4 mm of wall against the servo
  opening. The screw spacing across the tab (10 mm) is a guess, so print the coupon
  before the full plate. Not modelled: a wire notch, and how the plate fixes to the
  base.'
questions:
- text: What is the centre-to-centre spacing of the two holes on one tab? I assumed
    10 mm, the usual MG996R value, because it wasn't measured.
  answer: null
- text: Which way should the servo's cable exit face? The opening has no wire notch,
    so the cable runs below the plate.
  answer: null
