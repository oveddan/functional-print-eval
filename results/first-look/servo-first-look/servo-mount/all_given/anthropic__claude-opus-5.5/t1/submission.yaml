criteria:
- id: c1
  part: servo_plate
  feature: body cutout
  relation: contains
  hardware: null
  clearance_mm: 0.2
  params:
  - body_len
  - body_w
  - body_clear
  check:
    method: coupon
    ref: fit_coupon
    description: End of servo case slides into the cutout end without forcing and
      without side play
- id: c2
  part: servo_plate
  feature: tab holes
  relation: engages
  hardware: null
  clearance_mm: null
  params:
  - hole_inner_span
  - tab_hole_d
  - tab_hole_pitch
  check:
    method: coupon
    ref: fit_coupon
    description: With the case end in the coupon cutout, both tab U-slots sit over
      the two coupon holes and an M4 screw drops through each
- id: c3
  part: servo_plate
  feature: nut pockets
  relation: contains
  hardware: nut
  clearance_mm: null
  params:
  - nut_af
  - nut_clear
  - nut_pocket_depth
  check:
    method: coupon
    ref: fit_coupon
    description: M4 nut presses into the pocket and doesn't spin
- id: c4
  part: servo_plate
  feature: top face
  relation: supports
  hardware: screw
  clearance_mm: null
  params:
  - screw_head_d
  - rib_w
  - tab_hole_pitch
  check:
    method: coupon
    ref: fit_coupon
    description: M4 screw head sits flat on the tab next to the rib without riding
      up on it
manual:
- n: '1'
  text: 'Print fit_coupon first (about 10 minutes). Push an M4 nut into each hex pocket
    on its underside. Put one end of the servo case into the coupon''s cutout so the
    tab lies flat on top. Check: the case fits snugly with no side play, both U-slots
    line up with the holes, and an M4x10 screw goes through and threads into the nut,
    with its head sitting flat beside the rib. If the holes don''t line up, tell me
    the hole spacing on one tab.'
  parts:
  - fit_coupon
  hardware:
  - screw
  - nut
  tool: null
- n: '2'
  text: Print servo_plate the way it's modelled, hex pockets down on the bed. No supports
    needed.
  parts:
  - servo_plate
  hardware: []
  tool: null
- n: '3'
  text: Press the four M4 nuts into the hex pockets on the underside. If they're tight,
    tap them in or seat them by pulling a screw down from the top.
  parts:
  - servo_plate
  hardware:
  - nut
  tool: null
- n: '4'
  text: 'Lower the servo, shaft up, through the rectangular cutout from the top until
    both tabs rest flat on the plate. Skip washers: they would hit the rib on the
    tabs.'
  parts:
  - servo_plate
  hardware: []
  tool: null
- n: '5'
  text: Put an M4x10 screw down through each of the four tab slots into its nut. Tighten
    them in a cross pattern until snug. Don't over-tighten, or the PLA and the servo
    tabs will crack. About 1.7 mm of each screw will stick out below the plate, so
    allow for that when you design the base.
  parts:
  - servo_plate
  hardware:
  - screw
  - nut
  tool: 3 mm hex key
