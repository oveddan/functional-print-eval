task: servo-mount
note: The plate is 72x36x6 mm with a close-fitting cutout (0.2 mm per side) that the
  servo case drops through. The tabs rest on the plate and are held by M4x10 screws
  into captive M4 nuts. Your tab slots are 4.58 mm, too narrow for M5 screws, so I
  used M4. Hole spacing between the two tabs comes from your measurement (49.19 mm
  centre to centre). The spacing between the two holes on one tab is the MG996R datasheet
  value (10 mm), so check it with the coupon. About 32.5 mm of the case hangs below
  the plate.
questions:
- text: Your rib position (8.31 mm from the holes to the rib centre) doesn't match
    a rib midway between holes 10 mm apart. Does the rib run between the two holes,
    or somewhere else? The coupon will show whether the screw heads clear it.
  answer: null
