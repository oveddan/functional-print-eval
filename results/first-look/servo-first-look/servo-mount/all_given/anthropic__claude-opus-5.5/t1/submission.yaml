parts:
- id: servo_plate
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    L=p.plate_len; W=p.plate_w; T=p.plate_t\n\
    \    cx=p.body_len+2*p.body_clear; cy=p.body_w+2*p.body_clear\n    hx=(p.hole_inner_span+p.tab_hole_d)/2;\
    \ hy=p.tab_hole_pitch/2\n    plate=cq.Workplane('XY').box(L,W,T,centered=(True,True,False)).edges('|Z').fillet(4)\n\
    \    plate=plate.cut(cq.Workplane('XY').rect(cx,cy).extrude(T))\n    pts=[(sx*hx,sy*hy)\
    \ for sx in (-1,1) for sy in (-1,1)]\n    plate=plate.cut(cq.Workplane('XY').pushPoints(pts).circle(p.screw_clear_d/2).extrude(T))\n\
    \    nd=(p.nut_af+p.nut_clear)/math.cos(math.radians(30))\n    for (x,y) in pts:\n\
    \        hexp=cq.Workplane('XY').polygon(6,nd).extrude(p.nut_pocket_depth).rotate((0,0,0),(0,0,1),90).translate((x,y,0))\n\
    \        plate=plate.cut(hexp)\n    return plate\n"
  print_orientation: bottom face (with the nut pockets) on the bed, as modelled
  use_orientation: 'same way up: servo dropped in from the top with the shaft up,
    tabs resting on the top face'
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\ndef build(p):\n    L=p.plate_len; W=p.plate_w; T=p.plate_t\n\
    \    cx=p.body_len+2*p.body_clear; cy=p.body_w+2*p.body_clear\n    hx=(p.hole_inner_span+p.tab_hole_d)/2;\
    \ hy=p.tab_hole_pitch/2\n    plate=cq.Workplane('XY').box(L,W,T,centered=(True,True,False)).edges('|Z').fillet(4)\n\
    \    plate=plate.cut(cq.Workplane('XY').rect(cx,cy).extrude(T))\n    pts=[(hx,sy*hy)\
    \ for sy in (-1,1)]\n    plate=plate.cut(cq.Workplane('XY').pushPoints(pts).circle(p.screw_clear_d/2).extrude(T))\n\
    \    nd=(p.nut_af+p.nut_clear)/math.cos(math.radians(30))\n    for (x,y) in pts:\n\
    \        plate=plate.cut(cq.Workplane('XY').polygon(6,nd).extrude(p.nut_pocket_depth).rotate((0,0,0),(0,0,1),90).translate((x,y,0)))\n\
    \    x0=cx/2-6\n    keep=cq.Workplane('XY').box(L/2-x0,W,T,centered=(False,True,False)).translate((x0,0,0))\n\
    \    return plate.intersect(keep)\n"
  print_orientation: bottom face on the bed
  use_orientation: lay one servo tab on it to check the fit
