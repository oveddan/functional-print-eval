task: servo-mount
note: 'Shaft-up servo mounting plate, supported under the mounting tabs. Four adjustable
  screw positions avoid inventing the unmeasured spacing within each tab. Printed
  spacer sleeves raise the upper washers above the tab ribs. Print the fit template
  first: the supplied measurements do not establish the slot spacing across the width,
  cable clearance, or underside-tab flatness. This is a servo mount, not a load-rated
  robot-arm joint; it must be secured to a rigid base before operation.'
questions:
- text: Centre spacing between the two slots on one tab?
  answer: null
- text: Do the tab undersides seat flat, and can the cable and connector pass through
    the opening?
  answer: null
- text: Can the upper spacer sleeves seat flat beside the ribs?
  answer: null
