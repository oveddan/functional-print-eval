parts:
- id: plate
  role: final
  material: PLA
  code: "def build(p):\n    a = cq.Workplane('XY').box(p.plate_l, p.plate_w, p.plate_t,\
    \ centered=(True, True, False)).edges('|Z').fillet(p.corner_r)\n    opening =\
    \ cq.Workplane('XY').rect(p.body_l + 2*p.body_clearance_per_side, p.body_w + 2*p.body_clearance_per_side).extrude(p.plate_t)\n\
    \    a = a.cut(opening)\n    row = (p.opposite_slot_inner_gap + p.tab_slot_w)/2\n\
    \    for x in (-row, row):\n        cut = cq.Workplane('XY').center(x, 0).slot2D(p.mount_slot_travel\
    \ + p.mount_slot_w, p.mount_slot_w, 90).extrude(p.plate_t)\n        a = a.cut(cut)\n\
    \    return a"
  print_orientation: Broad lower face on bed, z=0; opening and slots vertical. No
    supports.
  use_orientation: Horizontal below the servo tabs, with shaft pointing +Z. Servo
    body hangs through the centre opening.
- id: fit_template
  role: coupon
  material: PLA
  code: "def build(p):\n    a = cq.Workplane('XY').box(p.plate_l, p.plate_w, p.template_t,\
    \ centered=(True, True, False)).edges('|Z').fillet(p.corner_r)\n    a = a.cut(cq.Workplane('XY').rect(p.body_l\
    \ + 2*p.body_clearance_per_side, p.body_w + 2*p.body_clearance_per_side).extrude(p.template_t))\n\
    \    row = (p.opposite_slot_inner_gap + p.tab_slot_w)/2\n    for x in (-row, row):\n\
    \        a = a.cut(cq.Workplane('XY').center(x,0).slot2D(p.mount_slot_travel +\
    \ p.mount_slot_w,p.mount_slot_w,90).extrude(p.template_t))\n    return a"
  print_orientation: Flat on bed, z=0; no supports.
  use_orientation: Temporary underside-tab fit template only; not a structural mounting
    plate.
- id: spacer_1
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_id/2).extrude(p.spacer_h)"
  print_orientation: Annular end on bed, z=0.
  use_orientation: Between a tab's upper face and its upper washer; axis vertical.
- id: spacer_2
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_id/2).extrude(p.spacer_h)"
  print_orientation: Annular end on bed, z=0.
  use_orientation: Between a tab's upper face and its upper washer; axis vertical.
- id: spacer_3
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_id/2).extrude(p.spacer_h)"
  print_orientation: Annular end on bed, z=0.
  use_orientation: Between a tab's upper face and its upper washer; axis vertical.
- id: spacer_4
  role: final
  material: PLA
  code: "def build(p):\n    return cq.Workplane('XY').circle(p.spacer_od/2).circle(p.spacer_id/2).extrude(p.spacer_h)"
  print_orientation: Annular end on bed, z=0.
  use_orientation: Between a tab's upper face and its upper washer; axis vertical.
