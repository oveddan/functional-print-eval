criteria:
- id: case_fit
  part: plate
  feature: 41.38 x 20.62 mm central opening
  relation: clears
  hardware: null
  clearance_mm: 0.4
  params:
  - body_l
  - body_w
  - body_clearance_per_side
  check:
    method: coupon
    ref: fit_template
    description: With power disconnected, pass the cable/connector through first,
      then lower the servo body through. Case must pass freely; both tab undersides
      must rest flat. Do not force the connector or pinch its cable.
- id: slot_alignment
  part: plate
  feature: Two continuous widthwise slots on inferred 49.19 mm row spacing
  relation: clears
  hardware: mount_screws
  clearance_mm: null
  params:
  - opposite_slot_inner_gap
  - tab_slot_w
  - mount_slot_travel
  - mount_slot_w
  - screw_d
  check:
    method: coupon
    ref: fit_template
    description: Insert all four M4 screws through the servo tabs and template without
      tightening. All four must fit simultaneously without forcing or spreading tabs,
      with clearance from rounded slot ends. If not, stop and obtain actual centre
      spacings before changing the design.
- id: tab_support
  part: plate
  feature: Top face under both mounting tabs
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - plate_t
  - body_l
  - body_w
  check:
    method: coupon
    ref: fit_template
    description: Both tab undersides must sit flat without rocking, trapped cable,
      moulded bosses or grommets holding them up. Confirm each slot's lower washer
      will bridge the plate slot and rest fully on flat plate material, without crossing
      the case opening.
- id: rib_clearance
  part: spacer_1
  feature: Four identical 3.2 mm tall washer-lifting sleeves
  relation: supports
  hardware: mount_washers
  clearance_mm: null
  params:
  - spacer_h
  - spacer_od
  - spacer_id
  - rib_h
  - washer_od
  check:
    method: measure
    ref: null
    description: Check all four sleeves on the actual servo before assembly. Each
      must sit flat around its screw without touching a rib or overhanging the tab
      end. Upper washers should clear the 1.8 mm ribs by nominally 1.4 mm. Stop if
      a sleeve rocks or a washer contacts a rib.
- id: thread_engagement
  part: plate
  feature: Four through-bolted mounting stacks
  relation: engages
  hardware: mount_screws
  clearance_mm: null
  params:
  - screw_l
  - plate_t
  - tab_t
  - spacer_h
  - washer_t
  - nut_h
  check:
    method: measure
    ref: null
    description: 'Stack: upper washer, sleeve, tab, 8 mm plate, lower washer, nut.
      Nominal stack through nut is 18.28 mm, leaving 1.72 mm of the 20 mm screw beyond
      the nut. Verify full nut engagement and at least two visible screw threads past
      each nut; do not use the thin template for this check.'
manual:
- n: '1'
  text: Print fit_template and spacer_1 first, at 0.2 mm layers. Remove brim and elephant-foot
    burrs from openings. Keep the servo unpowered and disconnect its cable.
  parts:
  - fit_template
  - spacer_1
  hardware: []
  tool: Slicer; deburring tool
- n: '2'
  text: Pass the connector and case through fit_template, shaft up, until the tab
    undersides rest on its top face. Check all four M4 screws pass freely through
    both sets of slots. Test spacer_1 and an upper washer at every tab slot. Follow
    all coupon criteria; do not proceed if anything rocks, interferes, or needs force.
    The unmeasured within-tab spacing is accommodated only within the printed slots'
    travel.
  parts:
  - fit_template
  - spacer_1
  hardware:
  - mount_screws
  - mount_washers
  tool: null
- n: '3'
  text: After the fit test passes, print plate and the remaining three sleeves. Use
    6 walls, 6 top/bottom layers and 50% infill for plate; print the small sleeves
    solid. All parts print flat without supports. Inspect especially the narrow material
    between the central opening and mounting slots. Discard the template as a load-bearing
    part.
  parts:
  - plate
  - spacer_2
  - spacer_3
  - spacer_4
  hardware: []
  tool: null
- n: '4'
  text: 'Route the cable through plate and lower the servo into its opening. The tabs
    sit directly on top of plate. At each slot assemble, top to bottom: M4 screw head,
    M4 washer, printed sleeve, servo tab, plate, M4 washer, M4 nut. The sleeve lifts
    the upper washer clear of the rib. Use one of each sleeve, four screws and nuts,
    and all eight washers. Leave everything loose initially.'
  parts:
  - plate
  - spacer_1
  - spacer_2
  - spacer_3
  - spacer_4
  hardware:
  - mount_screws
  - mount_nuts
  - mount_washers
  tool: null
- n: '5'
  text: 'Centre the case without forcing it against the opening. Confirm every sleeve
    is flat on its tab and every lower washer bridges its plate slot. Hold each nut
    with a wrench and snug the screws gradually in a diagonal sequence. Use hand tools
    only: stop as soon as the tabs are firmly clamped. Do not crush the tabs, sleeves
    or PLA. Verify full nut engagement and at least two threads projecting beyond
    each nut.'
  parts:
  - plate
  - spacer_1
  - spacer_2
  - spacer_3
  - spacer_4
  hardware:
  - mount_screws
  - mount_nuts
  - mount_washers
  tool: M4 socket-head Allen key and 7 mm wrench
- n: '6'
  text: Holding the plate, gently rock the servo case in every direction. There must
    be no movement at the tab interfaces, washer rocking, or cable pinching. Recheck
    after initial use because PLA can creep. Mount the plate securely to your eventual
    rigid base before powering the servo; no base attachment or robot-arm load rating
    is included. Avoid hot environments, unattended operation and over-tightening
    to compensate for flex.
  parts:
  - plate
  hardware:
  - mount_screws
  - mount_nuts
  tool: null
