parts:
- id: servo_plate
  role: final
  material: PLA
  code: "def build(p):\n    cut_l = p.servo_body_length + 2.0 * p.body_clearance\n\
    \    cut_w = p.servo_body_width + 2.0 * p.body_clearance\n    hole_d = p.m4_d\
    \ + p.hole_clearance\n    hole_x = (p.servo_hole_spacing_inner + p.servo_tab_hole_d)\
    \ / 2.0\n    y_inner = p.servo_tab_hole_pitch_y_nominal / 2.0\n    y_outer = p.servo_rib_pos\
    \ - p.servo_tab_hole_d / 2.0\n    y_mid = 0.5 * (y_inner + y_outer)\n    slot_len\
    \ = abs(y_outer - y_inner) + hole_d\n    rib_w = p.servo_rib_width + p.rib_width_clearance\n\
    \    rib_h = p.servo_rib_height + p.rib_height_clearance\n\n    part = (\n   \
    \     cq.Workplane(\"XY\")\n        .box(p.plate_length, p.plate_width, p.plate_thickness,\
    \ centered=(True, True, False))\n        .edges(\"|Z\")\n        .fillet(p.plate_corner_r)\n\
    \        .faces(\">Z\")\n        .workplane()\n        .rect(cut_l, cut_w)\n \
    \       .cutThruAll()\n    )\n\n    hole_pts = [\n        (sx * hole_x, sy * y_mid)\n\
    \        for sx in (-1.0, 1.0)\n        for sy in (-1.0, 1.0)\n    ]\n    part\
    \ = (\n        part.faces(\">Z\")\n        .workplane()\n        .pushPoints(hole_pts)\n\
    \        .slot2D(slot_len, hole_d, 90.0)\n        .cutThruAll()\n    )\n\n   \
    \ rib_cut = (\n        cq.Workplane(\"XY\")\n        .box(p.plate_length, rib_w,\
    \ rib_h, centered=(True, True, False))\n    )\n    part = part.cut(rib_cut)\n\
    \    return part\n"
  print_orientation: Flat on bed with z = 0 face down (rib relief channel on bottom
    face bridges 2.31 mm cleanly without supports)
  use_orientation: 'Same as print orientation: z = 0 bottom face rests on the top
    (shaft-side) face of the servo mounting tabs, with the servo shaft pointing up
    (+Z)'
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    cut_l = p.servo_body_length + 2.0 * p.body_clearance\n\
    \    cut_w = p.servo_body_width + 2.0 * p.body_clearance\n    hole_d = p.m4_d\
    \ + p.hole_clearance\n    hole_x = (p.servo_hole_spacing_inner + p.servo_tab_hole_d)\
    \ / 2.0\n    y_inner = p.servo_tab_hole_pitch_y_nominal / 2.0\n    y_outer = p.servo_rib_pos\
    \ - p.servo_tab_hole_d / 2.0\n    y_mid = 0.5 * (y_inner + y_outer)\n    slot_len\
    \ = abs(y_outer - y_inner) + hole_d\n    rib_w = p.servo_rib_width + p.rib_width_clearance\n\
    \    rib_h = p.servo_rib_height + p.rib_height_clearance\n\n    coupon_l = 2.0\
    \ * hole_x + 12.0\n    coupon_w = cut_w + 10.0\n\n    part = (\n        cq.Workplane(\"\
    XY\")\n        .box(coupon_l, coupon_w, p.coupon_thickness, centered=(True, True,\
    \ False))\n        .edges(\"|Z\")\n        .fillet(2.0)\n        .faces(\">Z\"\
    )\n        .workplane()\n        .rect(cut_l, cut_w)\n        .cutThruAll()\n\
    \    )\n\n    hole_pts = [\n        (sx * hole_x, sy * y_mid)\n        for sx\
    \ in (-1.0, 1.0)\n        for sy in (-1.0, 1.0)\n    ]\n    part = (\n       \
    \ part.faces(\">Z\")\n        .workplane()\n        .pushPoints(hole_pts)\n  \
    \      .slot2D(slot_len, hole_d, 90.0)\n        .cutThruAll()\n    )\n\n    rib_cut\
    \ = (\n        cq.Workplane(\"XY\")\n        .box(coupon_l, rib_w, rib_h, centered=(True,\
    \ True, False))\n    )\n    part = part.cut(rib_cut)\n    return part\n"
  print_orientation: Flat on bed with z = 0 face down
  use_orientation: 'Same as print orientation: slip over top of servo case against
    the top face of the mounting tabs to verify fit'
