criteria:
- id: servo_case_fit
  part: servo_plate
  feature: servo_body_window
  relation: contains
  hardware: null
  clearance_mm: 0.2
  params:
  - servo_body_length
  - servo_body_width
  - body_clearance
  check:
    method: coupon
    ref: fit_coupon
    description: Check that the upper servo case slips smoothly into the central rectangular
      cutout with no play or rocking.
- id: tab_rib_clearance
  part: servo_plate
  feature: rib_relief_channel
  relation: clears
  hardware: null
  clearance_mm: 0.4
  params:
  - servo_rib_width
  - servo_rib_height
  - rib_width_clearance
  - rib_height_clearance
  check:
    method: coupon
    ref: fit_coupon
    description: Verify that the bottom face of the coupon sits completely flat against
      the top face of both servo mounting tabs, with the tab ribs clearing the underside
      relief channel.
- id: tab_hole_alignment
  part: servo_plate
  feature: tab_mounting_holes
  relation: engages
  hardware: screw_m4x12
  clearance_mm: 0.3
  params:
  - servo_hole_spacing_inner
  - servo_tab_hole_d
  - servo_rib_pos
  - servo_tab_hole_pitch_y_nominal
  - m4_d
  - hole_clearance
  check:
    method: coupon
    ref: fit_coupon
    description: Verify that four M4x12 screws pass cleanly through the plate's mounting
      slots and the servo's tab holes simultaneously.
- id: tab_seat_flushness
  part: servo_plate
  feature: tab_mating_face
  relation: faces
  hardware: null
  clearance_mm: 0.0
  params:
  - servo_tab_to_top
  - plate_thickness
  check:
    method: measure
    ref: null
    description: Verify that the top face of the plate sits flush with the top of
      the servo case when the tabs are clamped against the bottom face.
manual:
- n: '1'
  text: Print the thin fit_coupon first (z = 0 on the build plate, no supports needed).
    Slip it over the top of the MG996R servo case so the bottom of the coupon rests
    against the top (shaft-side) face of the mounting tabs. Confirm the case fits
    snugly in the rectangular window, the tab ribs sit inside the bottom relief groove
    so the tabs sit flat, and the four mounting slots line up with the servo tab holes.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Print the final servo_plate flat on the build plate (z = 0 on the bed, no
    supports needed; the 2.31 mm wide rib relief channel bridges cleanly).
  parts:
  - servo_plate
  hardware: []
  tool: null
- n: '3'
  text: Insert the top of the MG996R servo up through the bottom of the servo_plate
    window until the top face of the servo mounting tabs rests flush against the underside
    of the plate (with the tab ribs nested in the underside channel). Place an ISO
    7089 M4 washer under each of the four ISO 4762 M4x12 screws, pass them down through
    the plate and servo tab holes, and thread an ISO 4032 M4 hex nut onto each screw
    underneath the tab (with one flat of the nut facing the servo case wall). Tighten
    all four screws evenly with a 3 mm hex key.
  parts:
  - servo_plate
  hardware:
  - screw_m4x12
  - washer_m4
  - nut_m4
  tool: 3 mm hex key and 7 mm wrench/pliers
