task: servo-mount
note: The plate mates against the top (shaft-side) face of the MG996R mounting tabs
  and closely surrounds the 5.69 mm upper section of the servo case on all four sides
  to eliminate lateral play or twisting, while a 2.31 x 2.20 mm relief channel on
  the underside clears the central tab ribs so the tabs clamp dead flat. Because width-wise
  hole spacing wasn't directly measured, the holes are precision-fitted in X and have
  a 1.02 mm slot travel in Y spanning both standard 10.0 mm datasheet spacing and
  the 8.31 mm rib-to-hole-edge measurement.
