task: servo-mount
note: 'The servo drops through a snug cutout (0.2 mm clearance per side) in a 10 mm
  plate, so the case is held sideways. Four M4x12 screws through the tab slots clamp
  the tabs onto the top face, into nylon-insert lock nuts trapped underneath so they
  won''t shake loose. Measured hole pitch along the length: 44.61 + 4.58 = 49.19 mm.
  The spacing across the two holes on one tab (10 mm) comes from the datasheet, and
  the coupon checks it. The case hangs about 32.5 mm below the plate (40.4 - 5.66
  - 2.28), so leave room for it when you design the base. The plate is solid all round
  the cutout, so you can drill or add fixing holes later.'
questions:
- text: Distance between the two holes on one tab (centre to centre) wasn't measured.
    I used the datasheet's 10 mm. Please confirm it with the coupon.
  answer: null
