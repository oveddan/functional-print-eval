parts:
- id: servo_plate
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    t = p.plate_t\n    pitch = p.tab_hole_inner_gap\
    \ + p.tab_hole_d\n    hx = pitch/2.0; hy = p.tab_hole_across/2.0\n    plate =\
    \ cq.Workplane('XY').box(p.plate_l, p.plate_w, t, centered=(True, True, False))\n\
    \    cut = cq.Workplane('XY').box(p.servo_body_l + 2*p.body_fit_clear, p.servo_body_w\
    \ + 2*p.body_fit_clear, t + 2, centered=(True, True, False)).translate((0, 0,\
    \ -1))\n    plate = plate.cut(cut)\n    pts = [(sx*hx, sy*hy) for sx in (-1, 1)\
    \ for sy in (-1, 1)]\n    holes = cq.Workplane('XY').pushPoints(pts).circle(p.m4_clear_d/2.0).extrude(t\
    \ + 2).translate((0, 0, -1))\n    plate = plate.cut(holes)\n    dc = (p.nut_af\
    \ + p.nut_clear)/math.cos(math.radians(30))\n    depth = p.nut_h + p.nut_pocket_extra\n\
    \    for (x, y) in pts:\n        hexp = cq.Workplane('XY').polygon(6, dc).extrude(depth\
    \ + 1).rotate((0, 0, 0), (0, 0, 1), 90).translate((x, y, -1))\n        plate =\
    \ plate.cut(hexp)\n    return plate\n"
  print_orientation: Underside (nut-pocket side) on the bed, z=0. Flat, no supports.
    The only bridges are the 7.3 mm roofs over the nut pockets
  use_orientation: Same way up as printed. Servo drops in from the top with the shaft
    pointing up, the tabs rest on the top face, and the case hangs about 32 mm below
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\ndef build(p):\n    t = p.coupon_t\n    pitch = p.tab_hole_inner_gap\
    \ + p.tab_hole_d\n    hx = pitch/2.0; hy = p.tab_hole_across/2.0\n    plate =\
    \ cq.Workplane('XY').box(p.plate_l, p.plate_w, t, centered=(True, True, False))\n\
    \    cut = cq.Workplane('XY').box(p.servo_body_l + 2*p.body_fit_clear, p.servo_body_w\
    \ + 2*p.body_fit_clear, t + 2, centered=(True, True, False)).translate((0, 0,\
    \ -1))\n    plate = plate.cut(cut)\n    pts = [(sx*hx, sy*hy) for sx in (-1, 1)\
    \ for sy in (-1, 1)]\n    holes = cq.Workplane('XY').pushPoints(pts).circle(p.m4_clear_d/2.0).extrude(t\
    \ + 2).translate((0, 0, -1))\n    plate = plate.cut(holes)\n    dc = (p.nut_af\
    \ + p.nut_clear)/math.cos(math.radians(30))\n    depth = p.nut_h + p.nut_pocket_extra\n\
    \    for (x, y) in pts:\n        hexp = cq.Workplane('XY').polygon(6, dc).extrude(depth\
    \ + 1).rotate((0, 0, 0), (0, 0, 1), 90).translate((x, y, -1))\n        plate =\
    \ plate.cut(hexp)\n    return plate\n"
  print_orientation: Underside on the bed, same as servo_plate
  use_orientation: Test fit only
