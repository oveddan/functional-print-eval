manual:
- n: '1'
  text: 'Print fit_coupon first: underside down, PLA, no supports. Push the servo
    down through the rectangular cutout from the top, shaft up. It should go in snug,
    with no rattle. Check that all four slots in the tabs line up with the four holes.
    Press an M4 lock nut into each hex pocket on the underside. If everything fits,
    go to step 2. If not, report back which feature didn''t fit.'
  parts:
  - fit_coupon
  hardware:
  - locknut
  tool: null
- n: '2'
  text: 'Print servo_plate the same way: underside (the side with the hex pockets)
    on the bed, no supports. 3-4 walls and about 30% infill keep it stiff.'
  parts:
  - servo_plate
  hardware: []
  tool: null
- n: '3'
  text: Press an M4 nylon-insert lock nut into each of the 4 hex pockets on the underside,
    nylon ring facing down (away from the screw head). Seat each one fully against
    the top of its pocket. A screw drawn up from above will finish seating it.
  parts:
  - servo_plate
  hardware:
  - locknut
  tool: null
- n: '4'
  text: Turn the plate pocket-side down. Feed the servo cable down through the cutout,
    then lower the servo in from above, shaft up, until the tabs sit flat on the top
    face of the plate.
  parts:
  - servo_plate
  hardware: []
  tool: null
- n: '5'
  text: Put an M4x12 socket head screw through each tab slot (no washer, because the
    9 mm washer could ride up on the tab rib) and thread it into the nut below. Tighten
    in a cross pattern until the tabs are clamped flat. Stop there, or the plastic
    tabs will crack.
  parts:
  - servo_plate
  hardware:
  - screw
  - locknut
  tool: 3 mm hex key
