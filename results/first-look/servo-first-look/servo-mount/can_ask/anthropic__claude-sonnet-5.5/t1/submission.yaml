manual:
- n: '1'
  text: Print the plate with the underside (the face with the open nut tunnels) down.
    Optionally print the two small coupons first. Check that the fit-coupon frame
    slips over the servo case and that an M4 nut slides into the nut-coupon tunnel.
  parts:
  - plate
  - fit-coupon
  - nut-coupon
  hardware: []
  tool: null
- n: '2'
  text: Slide an M4 nut into each of the four tunnel positions from the open edge
    of the plate (the +y long edge). Put two nuts in each tunnel, flats aligned with
    the tunnel walls. Push them roughly under where the tab holes will land.
  parts:
  - plate
  hardware:
  - nut
  tool: null
- n: '3'
  text: Lower the servo into the cutout, shaft up, until both tabs rest on the top
    face of the plate. The case should sit snug in the cutout.
  parts:
  - plate
  hardware: []
  tool: null
- n: '4'
  text: Push an M4x8 screw through each of the four tab holes and the slots below.
    Slide each nut under its screw by moving it along the tunnel, then turn the screw
    into it. Tighten evenly, diagonally across the four, until the tabs are clamped
    flat. Don't overtighten the PLA.
  parts:
  - plate
  hardware:
  - screw
  - nut
  tool: 2.5 mm hex key
