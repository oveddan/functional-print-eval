task: servo-mount
note: 'Rigid slotted mounting plate for the measured servo, shaft upward. Four M4
  screws and washers clamp the mounting tabs; transverse plate slots accommodate the
  unmeasured same-tab hole spacing. Lengthwise screw spacing is inferred from the
  reported inner-edge gap plus slot width, so the fit coupon is mandatory. No base
  attachment or stand-off height is specified: the body hangs below the plate. This
  is not a load-rated robot joint; check tab strength, plate deflection and fastener
  retention under intended loads.'
questions:
- text: Center-to-center spacing of the two slots on one tab?
  answer: null
- text: Tab underside to servo bottom, and cable exit location?
  answer: null
- text: Actual lengthwise slot-center spacing?
  answer: Not directly measured. Inferred as 44.61 + 4.58 = 49.19 mm; validate with
    fit coupon.
