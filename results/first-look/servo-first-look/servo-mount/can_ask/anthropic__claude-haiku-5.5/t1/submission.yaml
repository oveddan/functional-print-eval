parts:
- id: plate
  role: final
  material: PLA (high-speed, black)
  code: "import math\n\ndef build(p):\n    L = p.plate_len\n    W = p.plate_w\n  \
    \  T = p.plate_t\n    plate = cq.Workplane('XY').box(L, W, T, centered=(True,\
    \ True, False))\n    cut_l = p.body_len + 2 * p.clear\n    cut_w = p.body_w +\
    \ 2 * p.clear\n    body_cut = cq.Workplane('XY').box(cut_l, cut_w, T + 2, centered=(True,\
    \ True, False)).translate((0, 0, -1))\n    plate = plate.cut(body_cut)\n    hx\
    \ = p.hole_c / 2.0\n    af = p.nut_af + p.nut_clear\n    R = af / 2.0 / math.cos(math.radians(30))\n\
    \    for sx in (-1, 1):\n        x = sx * hx\n        bore = cq.Workplane('XY').circle(p.bolt_hole_d\
    \ / 2.0).extrude(T + 2).translate((x, 0, -1))\n        plate = plate.cut(bore)\n\
    \        pts = [(x + R * math.cos(math.radians(a)), R * math.sin(math.radians(a)))\
    \ for a in (30, 90, 150, 210, 270, 330)]\n        pocket = cq.Workplane('XY').polyline(pts).close().extrude(p.nut_h\
    \ + p.nut_clear + 1).translate((0, 0, -1))\n        plate = plate.cut(pocket)\n\
    \    return plate\n"
  print_orientation: flat, bottom face (z=0) on the bed
  use_orientation: flat, bottom face down, servo body passing through the cutout with
    shaft up
