task: servo-mount
note: 'Plate holds the MG996R in a centre cutout, with its tabs clamped on top by
  one M4 bolt, washer and nylon lock nut on each side. The shaft points up, with the
  body hanging through the plate. Not yet verified: the spacing between the two holes
  on each tab, which was not measured, and whether one bolt per tab is enough for
  the no-wobble requirement. The cutout walls prevent the body from rotating. The
  base attachment is left for later, as requested.'
questions:
- text: Each MG996R tab has two holes separated by a rib, but the spacing between
    them was never measured. The plate uses one M4 bolt per tab, at the tab hole centre,
    so the servo is held by one bolt per side plus the cutout walls. Please measure
    the centre-to-centre distance between the two holes on one tab, and confirm the
    bolt position lines up with a tab hole, before printing.
  answer: null
- text: Confirm the hole_c value of 49.19 mm (derived from the 44.61 mm inside-edge
    gap plus the 4.58 mm hole diameter) against the servo before printing.
  answer: null
