manual:
- n: '1'
  text: Print the plate flat, bottom face on the bed. Remove supports from the body
    cutout and the two nut pockets (the nut pockets are open on the underside).
  parts:
  - plate
  hardware: []
  tool: null
- n: '2'
  text: Test-fit the servo body through the centre cutout from above, shaft up, before
    fastening. It should drop through with the tabs resting on the plate top. If it
    binds, sand the cutout walls lightly.
  parts:
  - plate
  hardware: []
  tool: null
- n: '3'
  text: Push one M4 lock nut (ISO 10511) up into each nut pocket from the underside
    so it seats against the pocket ceiling, with the hex flats aligned to the pocket.
  parts:
  - plate
  hardware:
  - nut_m4
  tool: null
- n: '4'
  text: Lower the servo into the cutout until both tabs sit on the plate top. Place
    an M4 washer (ISO 7089) on each tab hole.
  parts:
  - plate
  hardware:
  - washer_m4
  tool: null
- n: '5'
  text: Insert an M4x20 socket head screw down through each washer, tab hole and plate
    hole, and thread it into its nut. Tighten evenly, alternating between the two
    sides, until the servo is firm. Do not overtighten the PLA.
  parts:
  - plate
  hardware:
  - bolt_m4
  - washer_m4
  - nut_m4
  tool: 2.5 mm hex key
- n: '6'
  text: Check for wobble by gently rocking the servo body. The body should not move
    relative to the plate. If it does, check that both bolts are tight and that the
    tabs are seated on the plate top.
  parts:
  - plate
  hardware: []
  tool: null
