parts:
- id: servo_mount_plate
  role: final
  material: PLA
  code: "def build(p):\n    cutout_l = p.servo_body_length + p.body_clearance\n  \
    \  cutout_w = p.servo_body_width + p.body_clearance\n    hole_x = (p.servo_hole_inner_span\
    \ + p.servo_tab_hole_d) / 2.0\n    hole_y = p.servo_tab_hole_pitch_y / 2.0\n \
    \   hole_pts = [\n        (-hole_x, -hole_y),\n        (-hole_x, hole_y),\n  \
    \      (hole_x, -hole_y),\n        (hole_x, hole_y),\n    ]\n    nut_af = p.m4_nut_af\
    \ + p.nut_af_clearance\n    nut_circum_d = nut_af / 0.8660254037844386\n\n   \
    \ part = (\n        cq.Workplane(\"XY\")\n        .box(p.plate_length, p.plate_width,\
    \ p.plate_thickness, centered=(True, True, False))\n        .edges(\"|Z\")\n \
    \       .fillet(p.plate_corner_r)\n        .faces(\">Z\")\n        .workplane()\n\
    \        .rect(cutout_l, cutout_w)\n        .cutThruAll()\n        .faces(\">Z\"\
    )\n        .workplane()\n        .pushPoints(hole_pts)\n        .hole(p.m4_clearance_d)\n\
    \    )\n\n    nut_cutters = (\n        cq.Workplane(\"XY\")\n        .pushPoints(hole_pts)\n\
    \        .polygon(6, nut_circum_d)\n        .extrude(p.nut_pocket_depth)\n   \
    \ )\n\n    return part.cut(nut_cutters)\n"
  print_orientation: Bottom face of the plate on the build plate (z = 0 to z = 9.5
    mm)
  use_orientation: Horizontal, with the top face (z = 9.5 mm) supporting the underside
    of the MG996R mounting tabs and the servo shaft pointing up (+Z)
- id: servo_fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    cutout_l = p.servo_body_length + p.body_clearance\n  \
    \  cutout_w = p.servo_body_width + p.body_clearance\n    hole_x = (p.servo_hole_inner_span\
    \ + p.servo_tab_hole_d) / 2.0\n    hole_y = p.servo_tab_hole_pitch_y / 2.0\n \
    \   hole_pts = [\n        (-hole_x, -hole_y),\n        (-hole_x, hole_y),\n  \
    \      (hole_x, -hole_y),\n        (hole_x, hole_y),\n    ]\n    coupon_l = 2.0\
    \ * hole_x + p.m4_clearance_d + 2.0 * p.coupon_margin\n    coupon_w = cutout_w\
    \ + 2.0 * p.coupon_margin\n\n    coupon = (\n        cq.Workplane(\"XY\")\n  \
    \      .box(coupon_l, coupon_w, p.coupon_thickness, centered=(True, True, False))\n\
    \        .faces(\">Z\")\n        .workplane()\n        .rect(cutout_l, cutout_w)\n\
    \        .cutThruAll()\n        .faces(\">Z\")\n        .workplane()\n       \
    \ .pushPoints(hole_pts)\n        .hole(p.m4_clearance_d)\n    )\n    return coupon\n"
  print_orientation: Flat on the build plate (z = 0 to z = 2.0 mm)
  use_orientation: Slid over the MG996R body against the underside of the mounting
    tabs to verify cutout fit and hole spacing
