task: servo-mount
note: The 9.5 mm thick plate closely hugs the 40.58 x 19.82 mm servo body on all four
  sides to eliminate lateral play, while four M4x12 screws with M4 washers clamp the
  2.28 mm thick U-slotted mounting tabs against captive M4 hex nuts recessed into
  the underside of the plate.
questions:
- text: Since the spacing between the two holes on a single mounting tab wasn't measured,
    it is set to the MG996R datasheet value of 10.0 mm; print the 2 mm thick servo_fit_coupon
    first to confirm the hole alignment on your servo.
  answer: null
