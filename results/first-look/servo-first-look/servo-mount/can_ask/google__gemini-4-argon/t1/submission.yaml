criteria:
- id: servo_body_snug_fit
  part: servo_mount_plate
  feature: servo_body_pocket
  relation: contains
  hardware: null
  clearance_mm: 0.25
  params:
  - servo_body_length
  - servo_body_width
  - body_clearance
  check:
    method: coupon
    ref: servo_fit_coupon
    description: Test-fit the MG996R servo case into the rectangular cutout of the
      coupon before printing the full plate.
- id: servo_tab_hole_alignment
  part: servo_mount_plate
  feature: m4_clearance_holes
  relation: clears
  hardware: screw_m4x12
  clearance_mm: 0.3
  params:
  - servo_hole_inner_span
  - servo_tab_hole_d
  - servo_tab_hole_pitch_y
  - m4_clearance_d
  check:
    method: coupon
    ref: servo_fit_coupon
    description: Align the coupon over the four mounting holes on the MG996R tabs
      and check that four M4 screws pass through both the servo tabs and the coupon
      holes.
- id: washer_bridges_tab_slot
  part: servo_mount_plate
  feature: top_mounting_face
  relation: supports
  hardware: washer_m4
  clearance_mm: 1.0
  params:
  - servo_tab_hole_d
  - servo_tab_hole_pitch_y
  - m4_washer_od
  check:
    method: measure
    ref: null
    description: Verify that the M4 washers sit flat on the servo mounting tabs and
      bridge across the 4.58 mm U-shaped tab slots without overlapping each other.
- id: nut_pocket_fit
  part: servo_mount_plate
  feature: m4_nut_pockets
  relation: seats
  hardware: nut_m4
  clearance_mm: 0.25
  params:
  - m4_nut_af
  - m4_nut_h
  - nut_af_clearance
  - nut_pocket_depth
  check:
    method: measure
    ref: null
    description: Press an ISO 4032 M4 hex nut into each bottom hex pocket and verify
      that it seats cleanly below the bottom face of the plate.
manual:
- n: '1'
  text: Print the 2 mm thick servo_fit_coupon first. Slide it over the bottom of the
    MG996R servo case up to the mounting tabs to confirm the snug slip fit around
    the case and verify that all four hole centers line up with the servo's tab slots.
  parts:
  - servo_fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Print the servo_mount_plate and press four ISO 4032 M4 hex nuts into the hexagonal
    pockets on the bottom face of the plate.
  parts:
  - servo_mount_plate
  hardware:
  - nut_m4
  tool: null
- n: '3'
  text: Feed the servo wire and connector down through the central rectangular cutout
    of the servo_mount_plate, then slide the MG996R body down into the cutout so its
    mounting tabs sit flat on the top face of the plate with the servo shaft sticking
    up.
  parts:
  - servo_mount_plate
  hardware: []
  tool: null
- n: '4'
  text: Place an ISO 7089 M4 washer over each of the four open-ended U-slots on the
    servo mounting tabs, insert the four ISO 4762 M4x12 socket head cap screws down
    through the washers, servo tabs, and plate, and tighten them into the captive
    M4 nuts with a 3 mm hex key.
  parts:
  - servo_mount_plate
  hardware:
  - screw_m4x12
  - washer_m4
  - nut_m4
  tool: 3 mm hex key
