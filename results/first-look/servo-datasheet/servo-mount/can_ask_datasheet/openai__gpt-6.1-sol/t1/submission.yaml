task: servo-mount
note: 'Shaft-up MG996R mounting plate with four M4 tab clamps. Transverse slots accommodate
  the unmeasured spacing between holes on each tab. Print and pass the coupon before
  the full plate: the inferred long-axis hole pitch is not independently confirmed.
  Base attachment is intentionally left undesigned. This plate restrains the servo
  case, not internal gear backlash, and is not a rated robot-arm bearing support.'
questions:
- text: What is the mounting-hole pitch along the servo body?
  answer: Reported inside-edge gap 44.61 mm and U-hole width 4.58 mm imply 49.19 mm
    centre pitch. Verify with coupon; the user did not independently confirm the interpretation.
- text: What is the spacing between holes on one tab?
  answer: Not provided despite requests. Continuous transverse slots accommodate centres
    from -8 to +8 mm about the body centreline; no guessed fixed transverse hole pattern
    is used.
- text: How does the plate attach to the base?
  answer: Deferred by the user. The plate must be secured to a suitable base before
    powered use; leave space beneath for the servo, cable, nuts and screw tips.
