criteria:
- id: body_passage
  part: servo_plate
  feature: Central rectangular opening passes lower case without force; both tab undersides
    contact plate flat.
  relation: clears
  hardware: null
  clearance_mm: 0.3
  params:
  - body_length
  - body_width
  - body_clearance
  check:
    method: coupon
    ref: fit_coupon
    description: Feed connector first and lower servo into coupon. Check the whole
      lower body passes, with no cable pinching and no rocking on case features. If
      tight, adjust opening parameters and reprint coupon; do not force servo.
- id: pattern_fit
  part: servo_plate
  feature: Two transverse slots align with all four servo U-holes.
  relation: clears
  hardware: tab_screws
  clearance_mm: null
  params:
  - hole_inside_gap
  - servo_slot_width
  - slot_half_travel
  - mount_slot_width
  check:
    method: coupon
    ref: fit_coupon
    description: With servo sitting flat, insert all four M4 screws by hand simultaneously
      through washers, servo holes and coupon slots. Do not use screws to pull misaligned
      holes into position. If long-axis alignment fails, remeasure centre pitch, correct
      hole_inside_gap accordingly, and reprint coupon.
- id: washer_bearing
  part: servo_plate
  feature: Upper washers bear on sound tab plastic around U-holes; lower washers bridge
    printed slots.
  relation: supports
  hardware: tab_washers
  clearance_mm: null
  params:
  - washer_od
  - washer_id
  - mount_slot_width
  - servo_slot_width
  check:
    method: coupon
    ref: fit_coupon
    description: Check washer positions at all four actual holes. Upper washers must
      not tilt on case shoulders or hang entirely beyond tab ends; lower washers must
      sit flat across both slot edges and not collide with neighbours. Stop if adequate
      flat bearing is absent.
- id: fastener_engagement
  part: servo_plate
  feature: Four M4x20 screws engage full nylon lock-nut height.
  relation: engages
  hardware: tab_screws
  clearance_mm: null
  params:
  - screw_length
  - plate_thickness
  - tab_thickness
  - washer_thickness
  - nut_height
  check:
    method: measure
    ref: null
    description: Final stack is 16.88 mm from head bearing face through nut; nominal
      protrusion 3.12 mm. Verify at least two full threads are visible beyond each
      lock nut and nuts cannot bottom against the case.
- id: firm_mount
  part: servo_plate
  feature: Flat tab seats and four clamped screws resist case rocking.
  relation: supports
  hardware: null
  clearance_mm: null
  params:
  - plate_thickness
  - tab_thickness
  check:
    method: measure
    ref: null
    description: With the plate held securely and power disconnected, gently rock
      the case in each direction. No visible movement at tab/plate interfaces is acceptable.
      Stop on creaking, whitening or tab bending. Recheck after initial low-load operation.
manual:
- n: '1'
  text: Print fit_coupon in PLA at 0.2 mm layers, flat on the bed, without supports.
    Remove any brim or first-layer lip from the opening and slots. This thin part
    is only a fit gauge.
  parts:
  - fit_coupon
  hardware: []
  tool: Slicer and printer
- n: '2'
  text: Disconnect servo power. Feed the cable connector through the coupon opening
    first, then lower the servo body through with shaft up. Tabs must lie flat, with
    the case and wire clear. Check all four M4 screws fit simultaneously through upper
    washers, servo U-holes and the two slots. Each slot takes two screws. Use the
    fit criteria above; if anything binds or washers cannot bear flat, correct the
    parameters and reprint the coupon before proceeding. Do not drill or force the
    servo tabs.
  parts:
  - fit_coupon
  hardware:
  - tab_screws
  - tab_washers
  tool: null
- n: '3'
  text: 'After the coupon passes, print servo_plate flat in PLA: 0.2 mm layers, 6
    walls, 6 top and bottom layers, 50% gyroid infill, no supports. Inspect for warping,
    gaps or layer separation; reject a warped plate. Clear first-layer lips and verify
    M4 screws slide freely in the slots.'
  parts:
  - servo_plate
  hardware:
  - tab_screws
  tool: Slicer and printer
- n: '4'
  text: Feed the cable through and lower the servo into servo_plate. At each of the
    four tab holes, install one M4x20 screw downward with one M4 washer beneath its
    head. Below the plate fit one M4 washer and one M4 nylon-insert lock nut. The
    slots intentionally permit the actual transverse spacing; the +/-5 mm joint coordinates
    are illustrative only. Centre the body in the opening with all screws loose.
  parts:
  - servo_plate
  hardware:
  - tab_screws
  - tab_washers
  - tab_nuts
  tool: null
- n: '5'
  text: Hold each lock nut with a 7 mm wrench and turn its screw using a 3 mm hex
    key. Snug screws gradually in a diagonal sequence until washers sit flat and tabs
    cannot rock. Nylon lock-nut turning resistance is not evidence that the tab is
    already clamped. Do not crush tabs, bow the plate or use power tools. Confirm
    at least two full threads protrude beyond each nut. Stop if washers tilt, plastic
    whitens or tabs flex visibly.
  parts:
  - servo_plate
  hardware:
  - tab_screws
  - tab_washers
  - tab_nuts
  tool: 3 mm hex key and 7 mm wrench
- n: '6'
  text: 'Support the plate securely and gently check for case movement with power
    off. This design has no legs or base fasteners: plan a rigid base attachment before
    powered operation. Provide at least 35 mm initial clearance below the plate for
    the lower case and wiring, then verify on the actual assembly; increase as needed.
    Keep the cable free of pinch points and allow nut/tool access.'
  parts:
  - servo_plate
  hardware: []
  tool: null
- n: '7'
  text: Begin with unloaded, slow movements only after the base is secure. Inspect
    and recheck clamp tightness after initial use and periodically thereafter; PLA
    can creep or soften near a warm servo. Do not leave a stalled servo heating the
    mount. For substantial arm bending loads, use a separate joint bearing/support
    rather than relying on the servo output shaft and plastic tabs alone.
  parts:
  - servo_plate
  hardware:
  - tab_screws
  - tab_nuts
  tool: null
