parts:
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    t = p.coupon_thickness\n    pitch = p.hole_inside_gap\
    \ + p.servo_slot_width\n    a = cq.Workplane('XY').rect(p.coupon_length, p.coupon_width).extrude(t)\n\
    \    opening = cq.Workplane('XY').rect(p.body_length + 2*p.body_clearance, p.body_width\
    \ + 2*p.body_clearance).extrude(t)\n    a = a.cut(opening)\n    for x in (-pitch/2,\
    \ pitch/2):\n        cutter = cq.Workplane('XY').center(x, 0).slot2D(2*p.slot_half_travel\
    \ + p.mount_slot_width, p.mount_slot_width, 90).extrude(t)\n        a = a.cut(cutter)\n\
    \    return a"
  print_orientation: Broad flat underside on bed, z=0; thickness extends upward. No
    supports.
  use_orientation: Temporary fit template under mounting tabs, shaft up; not a structural
    mount.
- id: servo_plate
  role: final
  material: PLA
  code: "def build(p):\n    t = p.plate_thickness\n    pitch = p.hole_inside_gap +\
    \ p.servo_slot_width\n    a = cq.Workplane('XY').rect(p.plate_length, p.plate_width).extrude(t)\n\
    \    a = a.edges('|Z').fillet(p.corner_radius)\n    opening = cq.Workplane('XY').rect(p.body_length\
    \ + 2*p.body_clearance, p.body_width + 2*p.body_clearance).extrude(t)\n    a =\
    \ a.cut(opening)\n    for x in (-pitch/2, pitch/2):\n        cutter = cq.Workplane('XY').center(x,\
    \ 0).slot2D(2*p.slot_half_travel + p.mount_slot_width, p.mount_slot_width, 90).extrude(t)\n\
    \        a = a.cut(cutter)\n    return a"
  print_orientation: Flat underside on bed at z=0, top at z=8 mm. Print with no supports;
    all openings run vertically.
  use_orientation: Same orientation as printed. Servo body extends down through central
    opening; tabs rest on plate top at z=8 mm; output shaft points +Z. X follows servo
    length.
