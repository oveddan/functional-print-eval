task: servo-mount
note: 'Servo hangs through a rectangular cutout in the plate and its tabs clamp to
  the plate''s top face with M4x12 screws and nuts. The tab holes are 4.58 mm, so
  M4 fits. The nuts sit in channels on the underside. The channels open into the cutout
  because the hole sits only about 4.3 mm from the case wall. The nut can''t spin
  fully but isn''t a tight hex fit. Not measured, so check them: (1) the spacing between
  the two holes on one tab. I assumed 10 mm and made the plate holes slots that adjust
  by +-2 mm, and the coupon tests this. (2) The cable exit size. The plate is 8 mm
  thick, and the cable should leave below it, but I haven''t verified that. There
  is no way to fix the plate to the base yet, as you said. You can add mounting holes
  in the 66 x 30 plate''s outer margins later. The M4x12 screws pass about 1.7 mm
  beyond the nut. Washers are left out on purpose, because the rib on the tab top
  would hit them.'
questions: []
