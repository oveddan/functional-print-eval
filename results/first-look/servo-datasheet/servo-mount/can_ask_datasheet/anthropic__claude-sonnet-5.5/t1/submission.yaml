parts:
- id: plate
  role: final
  material: PLA
  code: "def build(p):\n    T = p.plate_t\n    hx = (p.hole_inner_spacing + p.tab_hole_d)\
    \ / 2.0\n    plate = cq.Workplane('XY').box(p.plate_l, p.plate_w, T, centered=(True,\
    \ True, False))\n    cl_l = p.body_l + 2 * p.fit_clear\n    cl_w = p.body_w +\
    \ 2 * p.fit_clear\n    cut = cq.Workplane('XY').box(cl_l, cl_w, T, centered=(True,\
    \ True, False))\n    plate = plate.cut(cut)\n    slot_len = p.screw_clear_d +\
    \ 2 * p.slot_travel\n    for sx in (-1, 1):\n        for sy in (-1, 1):\n    \
    \        s = (cq.Workplane('XY').center(sx * hx, sy * p.hole_across / 2.0)\n \
    \                .slot2D(slot_len, p.screw_clear_d, 90).extrude(T))\n        \
    \    plate = plate.cut(s)\n    nut_corner = p.nut_af / 0.8660254\n    y_half =\
    \ p.hole_across / 2.0 + p.slot_travel + nut_corner / 2.0 + 0.1\n    x_in = cl_l\
    \ / 2.0 - 0.01\n    x_out = hx + p.nut_af / 2.0 + 0.2\n    for sx in (-1, 1):\n\
    \        w = x_out - x_in\n        cxm = sx * (x_in + w / 2.0)\n        ch = (cq.Workplane('XY').workplane(offset=T\
    \ - p.pocket_depth)\n              .center(cxm, 0).rect(w, 2 * y_half).extrude(p.pocket_depth))\n\
    \        plate = plate.cut(ch)\n    return plate\n"
  print_orientation: Servo-seat face (the face the tabs rest on) down on the bed;
    nut channels open upward.
  use_orientation: 'Flipped over: seat face up, tabs resting on it, servo hanging
    down through the cutout with the shaft pointing up, nuts fitted from underneath.'
- id: fit-coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    T = p.plate_t\n    hx = (p.hole_inner_spacing + p.tab_hole_d)\
    \ / 2.0\n    plate = cq.Workplane('XY').box(p.plate_l, p.plate_w, T, centered=(True,\
    \ True, False))\n    cl_l = p.body_l + 2 * p.fit_clear\n    cl_w = p.body_w +\
    \ 2 * p.fit_clear\n    cut = cq.Workplane('XY').box(cl_l, cl_w, T, centered=(True,\
    \ True, False))\n    plate = plate.cut(cut)\n    slot_len = p.screw_clear_d +\
    \ 2 * p.slot_travel\n    for sx in (-1, 1):\n        for sy in (-1, 1):\n    \
    \        s = (cq.Workplane('XY').center(sx * hx, sy * p.hole_across / 2.0)\n \
    \                .slot2D(slot_len, p.screw_clear_d, 90).extrude(T))\n        \
    \    plate = plate.cut(s)\n    nut_corner = p.nut_af / 0.8660254\n    y_half =\
    \ p.hole_across / 2.0 + p.slot_travel + nut_corner / 2.0 + 0.1\n    x_in = cl_l\
    \ / 2.0 - 0.01\n    x_out = hx + p.nut_af / 2.0 + 0.2\n    for sx in (-1, 1):\n\
    \        w = x_out - x_in\n        cxm = sx * (x_in + w / 2.0)\n        ch = (cq.Workplane('XY').workplane(offset=T\
    \ - p.pocket_depth)\n              .center(cxm, 0).rect(w, 2 * y_half).extrude(p.pocket_depth))\n\
    \        plate = plate.cut(ch)\n    keep = cq.Workplane('XY').center(21.5, 0).box(23,\
    \ p.plate_w, T, centered=(True, True, False))\n    return plate.intersect(keep)\n"
  print_orientation: Servo-seat face down on the bed, same as the plate.
  use_orientation: Seat face up; rest one servo tab on it to test hole positions,
    then the servo end in the notch.
