manual:
- n: '1'
  text: Print the fit-coupon first, seat face down. Rest one servo tab on its flat
    face. Check that the tab holes line up with the slots and the servo end sits in
    the notch. Drop an M4 nut into the channel from below. If the holes don't line
    up within the slot travel, measure the centre-to-centre distance of the two holes
    on one tab and tell me.
  parts:
  - fit-coupon
  hardware:
  - m4-nut
  tool: null
- n: '2'
  text: Print the plate with the seat face on the bed (PLA, 0.2 mm layers, 4 walls,
    about 40% infill). Nut channels face up while printing.
  parts:
  - plate
  hardware: []
  tool: null
- n: '3'
  text: Flip the plate so the flat seat face is up. Lower the servo into the cutout
    from above, shaft up, until both tabs rest on the seat face. The cable leaves
    from one end of the case below the tabs and hangs under the plate.
  parts:
  - plate
  hardware: []
  tool: null
- n: '4'
  text: 'Slide each tab hole over its slot. Put an M4x12 screw through each of the
    four tab holes and slot. Do not use washers: they hit the rib between the holes.
    The screw head bears directly on the tab.'
  parts:
  - plate
  hardware:
  - m4-screw
  tool: null
- n: '5'
  text: Turn the assembly over. Drop an M4 nut into each channel on the underside
    so it sits on its screw. Slide the nut onto the screw tip by hand and start it.
    Don't tighten yet.
  parts:
  - plate
  hardware:
  - m4-nut
  tool: null
- n: '6'
  text: Tighten all four screws evenly in a cross pattern until the tabs are clamped
    flat against the plate. Don't over-tighten, because PLA can crack. Push the servo
    by hand to check there's no wobble.
  parts:
  - plate
  hardware:
  - m4-screw
  - m4-nut
  tool: 2.5 mm hex key (M4 socket head) and a small spanner or finger to hold the
    nut
