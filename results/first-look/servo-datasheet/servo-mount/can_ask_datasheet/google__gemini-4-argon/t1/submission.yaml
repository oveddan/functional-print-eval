criteria:
- id: servo_body_fit
  part: servo_plate
  feature: body_cutout
  relation: contains
  hardware: null
  clearance_mm: 0.2
  params:
  - servo_body_length
  - servo_body_width
  - body_clearance
  check:
    method: coupon
    ref: fit_coupon
    description: Slide the fit_coupon (and then servo_plate) over the upper servo
      housing from the shaft side; the 40.58 x 19.82 mm body should slip through cleanly
      without rock or play.
- id: tab_rib_clearance
  part: servo_plate
  feature: rib_relief_slots
  relation: clears
  hardware: null
  clearance_mm: 0.55
  params:
  - servo_total_length
  - servo_rib_width
  - servo_rib_height
  - rib_slot_clearance
  check:
    method: coupon
    ref: fit_coupon
    description: Check that the 1.51 x 1.8 mm centering ribs on the shaft-side face
      of both servo mounting tabs sit freely inside the rib relief slots so the tabs
      seat completely flat against the bottom face (z = 0) of the plate.
- id: tab_flush_seat
  part: servo_plate
  feature: bottom_datum_face
  relation: faces
  hardware: null
  clearance_mm: 0.0
  params:
  - servo_tab_thickness
  - servo_rib_height
  check:
    method: coupon
    ref: fit_coupon
    description: Verify that the top face (shaft side) of both servo mounting tabs
      sits flush against the flat z = 0 bed face of the plate with zero rocking.
- id: tab_hole_alignment
  part: servo_plate
  feature: tab_mounting_holes
  relation: engages
  hardware: m3_screw
  clearance_mm: 0.2
  params:
  - servo_hole_inner_span_x
  - servo_tab_hole_d
  - servo_rib_to_hole_side_y
  - m3_hole_clearance_d
  - m3_washer_od
  check:
    method: coupon
    ref: fit_coupon
    description: Verify that the four M3 clearance holes align with the four 4.58
      mm U-holes in the servo tabs and that ISO 7089 M3 washers clear the vertical
      servo body wall while clamping the tabs.
- id: m3_nut_seat
  part: servo_plate
  feature: nut_pockets
  relation: seats
  hardware: m3_nut
  clearance_mm: 0.075
  params:
  - m3_nut_af
  - m3_nut_h
  - m3_nut_pocket_af
  - m3_nut_pocket_depth
  check:
    method: measure
    ref: null
    description: Press an ISO 4032 M3 hex nut into each of the four top hex pockets;
      it should seat flush below the top face and be held against rotation.
manual:
- n: '1'
  text: Print the fit_coupon first (flat on the bed, z = 0) and slide it down over
    the top (shaft side) of the MG996R servo until it rests on the top faces of the
    mounting tabs. Confirm that the servo body fits snugly in the central cutout,
    the two 1.51 mm tab ribs drop into the end relief slots so the tabs sit completely
    flush without rocking, and the four mounting holes align with the servo tab slots.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Print the servo_plate flat on the bed (z = 0 on the build plate, hex nut pockets
    facing up). Press four ISO 4032 M3 hex nuts into the four hexagonal pockets on
    the top face of the servo_plate.
  parts:
  - servo_plate
  hardware:
  - m3_nut
  tool: null
- n: '3'
  text: Insert the upper housing and output shaft of the MG996R servo up through the
    bottom (flat z = 0 face) of the servo_plate so the shaft sticks up through the
    plate and the top faces of the servo mounting tabs sit flush against the bottom
    face of the plate, with the two tab ribs nested inside the central relief slots.
  parts:
  - servo_plate
  hardware: []
  tool: null
- n: '4'
  text: Place an ISO 7089 M3 washer onto each of the four ISO 4762 M3x10 socket head
    cap screws. Pass the four screws upward from beneath the servo mounting tabs through
    the tab holes and plate clearance holes, and tighten them into the captured M3
    hex nuts to clamp the servo firmly in place.
  parts:
  - servo_plate
  hardware:
  - m3_screw
  - m3_washer
  - m3_nut
  tool: 2.5 mm hex key
