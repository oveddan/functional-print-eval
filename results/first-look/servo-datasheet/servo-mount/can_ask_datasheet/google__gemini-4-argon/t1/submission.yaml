task: servo-mount
note: The plate seats against the top (shaft-side) face of the MG996R mounting tabs
  using the flat bed-printed face (z = 0) as the datum, with through-slots at both
  ends of the body cutout that clear the 1.51 x 1.8 mm tab ribs so the servo cannot
  rock. M3 fasteners with 7.0 mm OD ISO 7089 washers clear the servo body wall (4.305
  mm from hole center) while spanning the 4.58 mm U-slots on the tabs.
