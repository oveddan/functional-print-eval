parts:
- id: servo_plate
  role: final
  material: PLA
  code: "def build(p):\n    cutout_l = p.servo_body_length + 2.0 * p.body_clearance\n\
    \    cutout_w = p.servo_body_width + 2.0 * p.body_clearance\n    rib_slot_l =\
    \ p.servo_total_length + 2.0 * p.rib_slot_clearance\n    rib_slot_w = p.servo_rib_width\
    \ + 2.0 * p.rib_slot_clearance\n    hole_x = (p.servo_hole_inner_span_x + p.servo_tab_hole_d)\
    \ / 2.0\n    hole_y = p.servo_rib_to_hole_side_y - p.servo_tab_hole_d / 2.0\n\
    \    nut_circum_d = p.m3_nut_pocket_af / 0.8660254037844386\n\n    hole_pts =\
    \ [\n        (-hole_x, -hole_y),\n        (-hole_x, hole_y),\n        (hole_x,\
    \ -hole_y),\n        (hole_x, hole_y),\n    ]\n\n    wp = (\n        cq.Workplane(\"\
    XY\")\n        .box(p.plate_length, p.plate_width, p.plate_thickness, centered=(True,\
    \ True, False))\n        .edges(\"|Z\")\n        .fillet(p.plate_corner_r)\n \
    \       .faces(\">Z\")\n        .workplane()\n        .rect(cutout_l, cutout_w)\n\
    \        .cutThruAll()\n        .faces(\">Z\")\n        .workplane()\n       \
    \ .rect(rib_slot_l, rib_slot_w)\n        .cutThruAll()\n        .faces(\">Z\"\
    )\n        .workplane()\n        .pushPoints(hole_pts)\n        .circle(p.m3_hole_clearance_d\
    \ / 2.0)\n        .cutThruAll()\n    )\n\n    for hx, hy in hole_pts:\n      \
    \  nut_cutter = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=p.plate_thickness\
    \ - p.m3_nut_pocket_depth)\n            .center(hx, hy)\n            .polygon(6,\
    \ nut_circum_d)\n            .extrude(p.m3_nut_pocket_depth)\n            .rotate((hx,\
    \ hy, 0), (hx, hy, 1), 30)\n        )\n        wp = wp.cut(nut_cutter)\n\n   \
    \ return wp\n"
  print_orientation: Flat on the build plate with z = 0 on the bed and captive hex
    nut pockets facing up (+Z); prints cleanly with zero overhangs or bridges.
  use_orientation: 'Same as print orientation (+Z up): the servo inserts upward from
    below (z < 0) so its output shaft sticks up (+Z) through the plate and the top
    faces of the mounting tabs seat flat against the z = 0 bottom face of the plate.'
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    cutout_l = p.servo_body_length + 2.0 * p.body_clearance\n\
    \    cutout_w = p.servo_body_width + 2.0 * p.body_clearance\n    rib_slot_l =\
    \ p.servo_total_length + 2.0 * p.rib_slot_clearance\n    rib_slot_w = p.servo_rib_width\
    \ + 2.0 * p.rib_slot_clearance\n    hole_x = (p.servo_hole_inner_span_x + p.servo_tab_hole_d)\
    \ / 2.0\n    hole_y = p.servo_rib_to_hole_side_y - p.servo_tab_hole_d / 2.0\n\n\
    \    coupon_l = p.servo_total_length + 2.0 * p.coupon_end_margin\n    coupon_w\
    \ = p.servo_body_width + 2.0 * p.coupon_end_margin\n\n    hole_pts = [\n     \
    \   (-hole_x, -hole_y),\n        (-hole_x, hole_y),\n        (hole_x, -hole_y),\n\
    \        (hole_x, hole_y),\n    ]\n\n    wp = (\n        cq.Workplane(\"XY\")\n\
    \        .box(coupon_l, coupon_w, p.coupon_thickness, centered=(True, True, False))\n\
    \        .edges(\"|Z\")\n        .fillet(2.0)\n        .faces(\">Z\")\n      \
    \  .workplane()\n        .rect(cutout_l, cutout_w)\n        .cutThruAll()\n  \
    \      .faces(\">Z\")\n        .workplane()\n        .rect(rib_slot_l, rib_slot_w)\n\
    \        .cutThruAll()\n        .faces(\">Z\")\n        .workplane()\n       \
    \ .pushPoints(hole_pts)\n        .circle(p.m3_hole_clearance_d / 2.0)\n      \
    \  .cutThruAll()\n    )\n\n    return wp\n"
  print_orientation: Flat on the build plate with z = 0 on the bed.
  use_orientation: Slip over the upper housing of the MG996R servo against the top
    face of the mounting tabs to verify cutout fit, rib slot clearance, and hole alignment.
