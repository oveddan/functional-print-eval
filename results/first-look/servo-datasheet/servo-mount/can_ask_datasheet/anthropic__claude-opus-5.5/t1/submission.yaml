    note: per side clearance around case
  tab_hole_d:
    value: 4.58
    unit: mm
    kind: world
    source: measured
    note: U-slot width in tabs
  hole_inner_gap:
    value: 44.61
    unit: mm
    kind: world
    source: measured
    note: inside edge to inside edge, tab to tab; centre spacing = gap + hole d =
