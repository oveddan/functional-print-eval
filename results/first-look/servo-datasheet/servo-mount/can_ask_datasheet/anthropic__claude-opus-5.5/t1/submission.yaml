    note: case bottom to tabs; walls only go 10 mm down so value is not critical
  m4_clear_d:
    value: 4.5
    unit: mm
    kind: design
    source: design
    note: M4 clearance
  m4_head_d:
    value: 7.0
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  plate_len:
    value: 64
    unit: mm
    kind: design
    source: design
    note: ''
  plate_wid:
    value: 34
    unit: mm
    kind: design
    source: design
    note: ''
  plate_t:
    value: 6
    unit: mm
    kind: design
    source: design
    note: ''
  wall_t:
    value: 2.5
    unit: mm
    kind: design
    source: design
    note: ''
  wall_h:
    value: 10
    unit: mm
    kind: design
    source: design
    note: how far the side locating walls go down along the case
  wall_len:
    value: 38
    unit: mm
    kind: design
    source: design
    note: kept shorter than the case so the walls stay clear of the nuts/washers
  coupon_t:
    value: 2
    unit: mm
    kind: design
    source: design
    note: ''
parts:
- id: servo_plate
  role: final
  material: PLA
  code: "def build(p):\n    L=p.plate_len; W=p.plate_wid; T=p.plate_t\n    cl=p.body_len+2*p.body_clear;\
    \ cw=p.body_wid+2*p.body_clear\n    plate=cq.Workplane('XY').box(L,W,T,centered=(True,True,False))\n\
    \    plate=plate.cut(cq.Workplane('XY').box(cl,cw,T,centered=(True,True,False)))\n\
    \    for s in (1,-1):\n        wall=cq.Workplane('XY').box(p.wall_len,p.wall_t,p.wall_h,centered=(True,True,False)).translate((0,s*(cw/2+p.wall_t/2),T))\n\
    \        plate=plate.union(wall)\n    hx=(p.hole_inner_gap+p.tab_hole_d)/2\n \
    \   yc=(p.hole_y_min+p.hole_y_max)/2\n    sl=(p.hole_y_max-p.hole_y_min)+p.m4_clear_d\n\
    \    for sx in (1,-1):\n        for sy in (1,-1):\n            cut=cq.Workplane('XY').center(sx*hx,sy*yc).slot2D(sl,p.m4_clear_d,90).extrude(T)\n\
    \            plate=plate.cut(cut)\n    return plate\n"
  print_orientation: Tab-seating face (top of the plate in use) flat on the bed; the
    side walls point up
  use_orientation: 'Flip it over: flat face up, walls hang down. Servo drops in from
    the top, shaft up'
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    L=p.plate_len; W=p.plate_wid; T=p.coupon_t\n    cl=p.body_len+2*p.body_clear;\
    \ cw=p.body_wid+2*p.body_clear\n    c=cq.Workplane('XY').box(L,W,T,centered=(True,True,False))\n\
    \    c=c.cut(cq.Workplane('XY').box(cl,cw,T,centered=(True,True,False)))\n   \
    \ hx=(p.hole_inner_gap+p.tab_hole_d)/2\n    yc=(p.hole_y_min+p.hole_y_max)/2\n\
    \    sl=(p.hole_y_max-p.hole_y_min)+p.m4_clear_d\n    for sx in (1,-1):\n    \
    \    for sy in (1,-1):\n            c=c.cut(cq.Workplane('XY').center(sx*hx,sy*yc).slot2D(sl,p.m4_clear_d,90).extrude(T))\n\
    \    return c\n"
  print_orientation: Flat on the bed
  use_orientation: Push the servo into it to check the fit before printing the plate
