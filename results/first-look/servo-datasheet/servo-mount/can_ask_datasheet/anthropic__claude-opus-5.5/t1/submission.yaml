criteria:
- id: c1
  part: fit_coupon
  feature: body cutout
  relation: contains
  hardware: null
  clearance_mm: 0.25
  params:
  - body_len
  - body_wid
  - body_clear
  check:
    method: coupon
    ref: null
    description: Servo case slides into the cutout with no play you can feel and without
      forcing it. If it's tight, raise body_clear to 0.35. If it's loose, drop it
      to 0.15
- id: c2
  part: fit_coupon
  feature: slotted holes
  relation: clears
  hardware: null
  clearance_mm: null
  params:
  - hole_inner_gap
  - tab_hole_d
  - hole_y_min
  - hole_y_max
  check:
    method: coupon
    ref: null
    description: With the servo in the coupon, all four tab U-holes line up with the
      plate slots, so an M4 screw passes through each one
- id: c3
  part: servo_plate
  feature: side walls
  relation: clears
  hardware: washer
  clearance_mm: null
  params:
  - wall_len
  - body_len
  - hole_inner_gap
  check:
    method: measure
    ref: null
    description: Washers and nuts sit flat on the underside and don't touch the walls
- id: c4
  part: servo_plate
  feature: screw heads vs tab rib
  relation: clears
  hardware: screw
  clearance_mm: null
  params:
  - m4_head_d
  - hole_y_min
  check:
    method: measure
    ref: null
    description: Each M4 head sits flat on the tab and doesn't ride up on the 1.8
      mm rib between the holes
manual:
- n: '1'
  text: Print fit_coupon (about 10 minutes). Push the servo case down into it, shaft
    up, until the tabs rest on it. Check the case is snug and that all four tab holes
    line up with the slots. If the fit is off, change body_clear and print the coupon
    again.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Print servo_plate with the flat face on the bed and the walls pointing up.
    Use no supports, 4 walls and 30% infill. Turn on elephant-foot compensation so
    the cutout edge on the bed side isn't undersized.
  parts:
  - servo_plate
  hardware: []
  tool: null
- n: '3'
  text: Flip the plate so the flat face is up and the walls hang down. Lower the servo
    in, shaft up, until the tabs sit flat on the plate. The cable end can face either
    way.
  parts:
  - servo_plate
  hardware: []
  tool: null
- n: '4'
  text: Push an M4x16 screw down through each of the four tab holes and the plate
    slots. From underneath, put on an M4 washer and then an M4 nylon lock nut. Tighten
    them in a cross pattern until they're firm. Don't overtighten, or the plastic
    tabs will crack.
  parts:
  - servo_plate
  hardware:
  - screw
  - washer
  - locknut
  tool: 3 mm hex key, 7 mm spanner or pliers
- n: '5'
  text: Check the servo doesn't rock. The side walls stop it tilting sideways and
    the clamped tabs stop it rocking end to end.
  parts:
  - servo_plate
  hardware: []
  tool: null
