task: servo-mount
note: I used M4 hardware instead of M5 because the tab holes are 4.58 mm wide. The
  spacing between the two holes on one tab wasn't measured, so the plate holes are
  slotted to fit spacings from 10 to 13 mm. Using no washer under the heads keeps
  them clear of the rib on the tabs. The side walls only run along the long sides
  of the case, so the cable end and the nuts stay clear.
questions:
- text: What is the centre-to-centre spacing between the two holes on one tab? It's
    covered for now by slotting the holes for 10-13 mm.
  answer: null
params:
  body_len:
    value: 40.58
    unit: mm
    kind: world
    source: measured
    note: servo case end to end, below tabs
  body_wid:
    value: 19.82
    unit: mm
    kind: world
    source: measured
    note: ''
  body_clear:
    value: 0.25
    unit: mm
    kind: design
