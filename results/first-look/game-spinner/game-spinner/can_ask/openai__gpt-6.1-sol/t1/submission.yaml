task: game-spinner
note: 'One-piece 70 mm wheel, with rear-access bearing and captive handle-nut pockets.
  The coupon is a disposable test print, not an assembly component. Press fits are
  printer-dependent: qualify them before printing the wheel. Axle installation is
  conditional on measuring the board and confirming that the available M8 washers
  do not rub the bearing shields. Do not force or glue either press fit. The handle
  is a short fixed bolt head, not a freely rotating crank grip.'
questions:
- text: What is the board thickness, and can a plain axle hole be drilled through
    it?
  answer: null
- text: Do the ISO 7089 M8 washers contact only the bearing inner race without rubbing
    either shield?
  answer: null
