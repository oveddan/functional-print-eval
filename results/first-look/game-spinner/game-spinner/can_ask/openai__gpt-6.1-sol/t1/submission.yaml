criteria:
- id: bearing_fit
  part: wheel
  feature: Central rear bearing pocket
  relation: engages
  hardware: bearing
  clearance_mm: null
  params:
  - bearing_od
  - bearing_fit
  - bearing_width
  check:
    method: coupon
    ref: fit_coupon
    description: Choose a pocket that accepts the bearing squarely by firm thumb pressure,
      without tools, and retains it when inverted and gently shaken. Transfer that
      allowance to bearing_fit. Repeat acceptance test on final wheel; coupon stiffness
      is not identical.
- id: nut_fit
  part: wheel
  feature: Rear hexagonal pocket
  relation: engages
  hardware: handle_nut
  clearance_mm: null
  params:
  - nut_af
  - nut_h
  - nut_fit
  - nut_depth_extra
  check:
    method: coupon
    ref: fit_coupon
    description: Nut must seat by thumb pressure, remain on inversion and gentle shaking,
      and resist turning as screw is snugged. Select nut_fit independently of bearing_fit.
- id: washer_clearance
  part: wheel
  feature: 20 mm front opening and exposed rear bearing face
  relation: clears
  hardware: axle_washers
  clearance_mm: null
  params:
  - washer_od
  - washer_t
  - bearing_front_opening
  check:
    method: measure
    ref: null
    description: Before assembly, hold washers firmly on each bearing inner-ring face
      and turn the outer ring. No shield rubbing or drag is permitted. Also verify
      the printed front shoulder clears the shield. Failure blocks axle assembly.
- id: handle_tip_clearance
  part: wheel
  feature: Rear of handle hole faces board with nominal 1.6 mm clearance
  relation: clears
  hardware: handle_bolt
  clearance_mm: 1.6
  params:
  - wheel_t
  - handle_screw_length
  - washer_t
  check:
    method: measure
    ref: null
    description: M5x10 tip must not project beyond rear wheel face. Confirm clearance
      to board through a complete rotation.
- id: axle_selection
  part: wheel
  feature: Bearing axle and board mounting stack
  relation: supports
  hardware: axle
  clearance_mm: null
  params:
  - board_thickness
  - axle_length
  - bearing_width
  - washer_t
  - axle_nut_h
  - axle_pitch
  check:
    method: measure
    ref: null
    description: Required grip to nut end is board thickness + 19.8 mm. Select catalog
      length with at least two pitches (2.5 mm) projecting beyond nut, full nylon
      engagement, and no unthreaded shoulder under nut. Recalculate if measured hardware
      differs.
manual:
- n: '1'
  text: Print fit_coupon at 0.2 mm layers, 5 walls, 30% infill, no supports. Keep
    the same filament and XY/hole compensation settings for the final wheel. Let it
    cool. The left-to-right bearing diameters are 21.85, 21.95, 22.05 mm; nut widths
    across flats are 7.8, 7.9, 8.0 mm. Identify columns before cutting the thin connecting
    strips.
  parts:
  - fit_coupon
  hardware: []
  tool: Slicer and flush cutters
- n: '2'
  text: Test the actual bearing and nut independently, starting at the largest pocket.
    Choose the loosest fit that still retains each part on inversion and gentle shaking,
    with insertion by thumb pressure only. Do not hammer or pull the bearing into
    its seat using the axle. Remove the bearing by pressing only its outer ring through
    the front opening. If none works, change the corresponding allowance in 0.05–0.10
    mm increments and reprint the coupon. Set bearing_fit and nut_fit to the successful
    allowances before generating the wheel.
  parts:
  - fit_coupon
  hardware:
  - bearing
  - handle_nut
  tool: null
- n: '3'
  text: Print wheel front face down at 0.2 mm layers, 5 walls, 6 top/bottom layers
    and 30% infill, without supports. Remove any elephant-foot burr from the front
    holes without enlarging the press-fit pockets. Cool fully, then press the bearing
    into the rear central pocket, loading its outer ring only, until it reaches the
    shoulder. Its rear face should be flush with the wheel. Press the M5 nut fully
    into the rear hex pocket. Repeat inversion and gentle-shake checks on this actual
    wheel. If loose or too tight, revise the allowance and reprint; no glue.
  parts:
  - wheel
  hardware:
  - bearing
  - handle_nut
  tool: null
- n: '4'
  text: 'Before mounting, test an M8 washer on each bearing face. Hold the inner ring
    with the washer and turn the outer ring. The washer must not drag on the shield.
    Also confirm the seated bearing spins freely without its shield rubbing the printed
    shoulder. Do not assemble if either check fails: this design has no separate bearing
    spacers, and the available washer dimensions alone do not establish compatibility.'
  parts:
  - wheel
  hardware:
  - bearing
  - axle_washers
  tool: null
- n: '5'
  text: 'Measure board thickness and ensure there is a flat area at least 70 mm across.
    Drill an 8.5 mm plain hole with backing support. Select axle length L so L >=
    board thickness + 22.3 mm, while the nut can tighten onto threads rather than
    an unthreaded shoulder. Typical choices: M8x30 for boards 3–7 mm; M8x35 for >7–12
    mm; M8x40 for >12–17 mm; M8x45 for >17–22 mm; M8x50 for >22–27 mm. All are ISO
    4762 catalog alternatives. The listed M8x40 is provisional, not a verified match.
    For boards outside these ranges, stop and revise the mounting stack rather than
    improvise.'
  parts:
  - wheel
  hardware:
  - axle
  - axle_locknut
  - axle_washers
  tool: Calipers or ruler; drill with 8.5 mm bit
- n: '6'
  text: Slide one M8 washer onto the axle and insert from the wheel front through
    the bearing. The washer nests inside the 20 mm front opening. Place a second washer
    on the axle behind the bearing, pass through the board, then add the third washer
    and M8 nylon locknut behind the board. Hold the bolt with a hex key and tighten
    gently, only enough to remove axial looseness. The clamping path must run through
    the bearing INNER race and board, not the wheel or shields. Verify at least two
    full threads beyond the nut and full nylon engagement. If tightening increases
    spinning resistance, stop and correct the contact problem; do not merely leave
    the mounting loose.
  parts:
  - wheel
  hardware:
  - axle
  - axle_locknut
  - axle_washers
  - bearing
  tool: Hex key and spanner
- n: '7'
  text: With the wheel on the board, insert the M5x10 handle bolt from the front and
    snug it into the captive nut. No access behind the wheel is needed. Do not overtighten
    into PLA. Check its tip is no farther back than the rear wheel face. The exposed
    socket head is the short finger handle.
  parts:
  - wheel
  hardware:
  - handle_bolt
  - handle_nut
  tool: 4 mm hex key
- n: '8'
  text: Turn the wheel through a full revolution by hand. Confirm no contact between
    handle hardware, wheel, and board, and no bearing drag. Recheck that both press
    fits remain retained and the axle is secure. An adult should inspect periodically;
    stop use if PLA cracks, hardware loosens, or a pocket loosens. Loose nuts and
    bearings are small-part hazards for young children.
  parts:
  - wheel
  hardware:
  - handle_bolt
  - handle_nut
  - axle
  - axle_locknut
  - bearing
  tool: null
