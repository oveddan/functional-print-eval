parts:
- id: wheel
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    t=p.wheel_t\n    b=p.bearing_od+p.bearing_fit\n\
    \    af=p.nut_af+p.nut_fit\n    depth=p.nut_h+p.nut_depth_extra\n    lead=p.entry_depth\n\
    \    w=cq.Workplane('XY').circle(p.wheel_d/2).extrude(t)\n    w=w.cut(cq.Workplane('XY').circle(p.bearing_front_opening/2).extrude(t))\n\
    \    w=w.cut(cq.Workplane('XY').workplane(offset=t-p.bearing_width).circle(b/2).extrude(p.bearing_width+1))\n\
    \    flare=cq.Solid.makeCone(b/2,(b+p.entry_flare)/2,lead,cq.Vector(0,0,t-lead),cq.Vector(0,0,1))\n\
    \    w=w.cut(flare)\n    w=w.cut(cq.Workplane('XY').center(p.handle_radius,0).circle(p.handle_hole_d/2).extrude(t))\n\
    \    hexcut=cq.Workplane('XY').workplane(offset=t-depth).center(p.handle_radius,0).polygon(6,af/math.cos(math.pi/6)).extrude(depth+1)\n\
    \    w=w.cut(hexcut)\n    hexlead=(cq.Workplane('XY').workplane(offset=t-lead).center(p.handle_radius,0).polygon(6,af/math.cos(math.pi/6)).workplane(offset=lead).polygon(6,(af+p.entry_flare)/math.cos(math.pi/6)).loft())\n\
    \    return w.cut(hexlead)\n"
  print_orientation: Flat front face at z=0 on the bed; both press-fit pockets open
    upward. No supports.
  use_orientation: Front is z=0; rear is z=10, toward board. Axle at (0,0); handle
    at (25,0). Bearing occupies z=3 to 10.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    t=p.wheel_t\n    lead=p.entry_depth\n \
    \   out=None\n    for i in range(3):\n        x=(i-1)*p.coupon_x_pitch\n     \
    \   delta=(i-1)*p.coupon_step\n        b=p.bearing_od+p.bearing_fit+delta\n  \
    \      af=p.nut_af+p.nut_fit+delta\n        ring=cq.Workplane('XY').center(x,0).circle(p.coupon_bearing_outer_d/2).extrude(t)\n\
    \        ring=ring.cut(cq.Workplane('XY').center(x,0).circle(p.bearing_front_opening/2).extrude(t))\n\
    \        ring=ring.cut(cq.Workplane('XY').workplane(offset=t-p.bearing_width).center(x,0).circle(b/2).extrude(p.bearing_width+1))\n\
    \        ring=ring.cut(cq.Solid.makeCone(b/2,(b+p.entry_flare)/2,lead,cq.Vector(x,0,t-lead),cq.Vector(0,0,1)))\n\
    \        y=p.coupon_y_pitch\n        n=cq.Workplane('XY').center(x,y).circle(p.coupon_nut_outer_d/2).extrude(t)\n\
    \        n=n.cut(cq.Workplane('XY').center(x,y).circle(p.handle_hole_d/2).extrude(t))\n\
    \        n=n.cut(cq.Workplane('XY').workplane(offset=t-p.nut_h-p.nut_depth_extra).center(x,y).polygon(6,af/math.cos(math.pi/6)).extrude(p.nut_h+p.nut_depth_extra+1))\n\
    \        cham=(cq.Workplane('XY').workplane(offset=t-lead).center(x,y).polygon(6,af/math.cos(math.pi/6)).workplane(offset=lead).polygon(6,(af+p.entry_flare)/math.cos(math.pi/6)).loft())\n\
    \        n=n.cut(cham)\n        link=cq.Workplane('XY').center(x,y/2).box(p.coupon_link_width,y,p.coupon_link_t,centered=(True,True,False))\n\
    \        piece=ring.union(n).union(link)\n        out=piece if out is None else\
    \ out.union(piece)\n    rail=cq.Workplane('XY').center(0,p.coupon_y_pitch/2).box(2*p.coupon_x_pitch+p.coupon_link_width,p.coupon_link_width,p.coupon_link_t,centered=(True,True,False))\n\
    \    return out.union(rail)\n"
  print_orientation: Flat faces at z=0, pockets upward; no supports. Print with the
    same settings as the wheel.
  use_orientation: Test only. From negative x to positive x, pocket allowances are
    baseline minus 0.1 mm, baseline, baseline plus 0.1 mm. Bearing row y=0; nut row
    y=32.
