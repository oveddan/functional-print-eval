task: game-spinner
note: Both the 608ZZ bearing pocket and the M5 hex nut pocket use a 0.4-0.6 mm clearance
  lead-in zone at the entry mouth for easy alignment followed by 6 narrow axial crush
  ribs (0.12 mm total interference across opposite ribs) so both parts press in smoothly
  by hand and stay retained when inverted without glue. The raised front handle boss
  accommodates a standard fully-threaded ISO 4762 M5x20 bolt so it clamps solidly
  against the back nut without protruding past the rear face of the wheel.
questions: []
