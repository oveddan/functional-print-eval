  bearing_rib_r:
    value: 0.8
    unit: mm
    kind: design
    source: design
    note: Radius of the cylindrical crush rib profile in the bearing bore
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: catalog
