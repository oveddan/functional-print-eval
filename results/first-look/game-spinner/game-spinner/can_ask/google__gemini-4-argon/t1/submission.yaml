parts:
- id: spinner_wheel
  role: final
  material: PLA
  code: "import math\n\ndef build(p):\n    # Main spinner wheel disk sitting flat\
    \ on the bed (z = 0 is the back face)\n    wheel = (\n        cq.Workplane(\"\
    XY\")\n        .circle(p.wheel_od / 2.0)\n        .extrude(p.wheel_t)\n      \
    \  .edges()\n        .chamfer(0.8)\n    )\n\n    # Raised handle boss on the front\
    \ face near the edge (from z = 1.0 to z = p.handle_total_h)\n    boss = (\n  \
    \      cq.Workplane(\"XY\")\n        .workplane(offset=1.0)\n        .center(p.handle_radial_pos,\
    \ 0.0)\n        .circle(p.handle_boss_od / 2.0)\n        .extrude(p.handle_total_h\
    \ - 1.0)\n        .edges(\">Z\")\n        .chamfer(0.6)\n    )\n    part = wheel.union(boss)\n\
    \n    # Central through-bore leaving the bottom retaining lip for the 608ZZ outer\
    \ ring\n    part = part.cut(\n        cq.Workplane(\"XY\")\n        .circle(p.bearing_lip_id\
    \ / 2.0)\n        .extrude(p.wheel_t + 1.0)\n    )\n\n    # 608ZZ bearing pocket\
    \ from z = p.bearing_lip_h to z = p.wheel_t\n    part = part.cut(\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.bearing_lip_h)\n        .circle(p.bearing_pocket_d\
    \ / 2.0)\n        .extrude(p.wheel_t - p.bearing_lip_h + 0.1)\n    )\n\n    #\
    \ 6 axial crush ribs inside the 608ZZ bearing pocket (stopping 0.6 mm below top\
    \ face for easy entry alignment)\n    rib_center_r = (p.bearing_pocket_d / 2.0)\
    \ + (p.bearing_rib_r - p.bearing_rib_protrusion)\n    for i in range(6):\n   \
    \     ang = math.radians(i * 60.0)\n        rx = rib_center_r * math.cos(ang)\n\
    \        ry = rib_center_r * math.sin(ang)\n        rib = (\n            cq.Workplane(\"\
    XY\")\n            .workplane(offset=p.bearing_lip_h)\n            .center(rx,\
    \ ry)\n            .circle(p.bearing_rib_r)\n            .extrude(p.wheel_t -\
    \ p.bearing_lip_h - 0.6)\n        )\n        part = part.union(rib)\n\n    # M5\
    \ bolt clearance through-hole through the handle boss\n    part = part.cut(\n\
    \        cq.Workplane(\"XY\")\n        .center(p.handle_radial_pos, 0.0)\n   \
    \     .circle(p.m5_clearance_d / 2.0)\n        .extrude(p.handle_total_h + 1.0)\n\
    \    )\n\n    # M5 hex nut pocket at the back face (z = 0 to z = p.nut_pocket_depth)\n\
    \    nut_circum_d = p.nut_pocket_af / math.cos(math.radians(30.0))\n    part =\
    \ part.cut(\n        cq.Workplane(\"XY\")\n        .center(p.handle_radial_pos,\
    \ 0.0)\n        .polygon(6, nut_circum_d)\n        .extrude(p.nut_pocket_depth)\n\
    \    )\n\n    # Single-layer sequential bridge relief (0.2 mm) above hex pocket\
    \ so the M5 hole bridges cleanly without supports\n    part = part.cut(\n    \
    \    cq.Workplane(\"XY\")\n        .workplane(offset=p.nut_pocket_depth)\n   \
    \     .center(p.handle_radial_pos, 0.0)\n        .rect(p.nut_pocket_af, p.m5_clearance_d)\n\
    \        .extrude(0.2)\n    )\n\n    # 6 axial crush ribs on the flats of the\
    \ M5 hex nut pocket (starting at z = 0.4 mm for easy entry alignment)\n    nut_rib_center_r\
    \ = (p.nut_pocket_af / 2.0) + (p.nut_rib_r - p.nut_rib_protrusion)\n    for i\
    \ in range(6):\n        ang = math.radians(30.0 + i * 60.0)\n        nx = p.handle_radial_pos\
    \ + nut_rib_center_r * math.cos(ang)\n        ny = nut_rib_center_r * math.sin(ang)\n\
    \        nrib = (\n            cq.Workplane(\"XY\")\n            .workplane(offset=0.4)\n\
    \            .center(nx, ny)\n            .circle(p.nut_rib_r)\n            .extrude(p.nut_pocket_depth\
    \ - 0.4)\n        )\n        part = part.union(nrib)\n\n    return part\n"
  print_orientation: Back face of the wheel flat on the build plate (z = 0), with
    the handle boss pointing up (+Z); no supports required.
  use_orientation: Mounted against the game board with the M8 bolt passing through
    the central 608ZZ bearing and the raised M5 handle on the front face.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "import math\n\ndef build(p):\n    # Compact test coupon for verifying the\
    \ hand press-fit of both the 608ZZ bearing and the M5 nut\n    base = (\n    \
    \    cq.Workplane(\"XY\")\n        .box(p.coupon_l, p.coupon_w, p.wheel_t, centered=(True,\
    \ True, False))\n        .edges(\"|Z\")\n        .fillet(3.0)\n    )\n\n    #\
    \ Bearing test pocket at (-7, 0)\n    bx = -7.0\n    part = base.cut(\n      \
    \  cq.Workplane(\"XY\")\n        .center(bx, 0.0)\n        .circle(p.bearing_lip_id\
    \ / 2.0)\n        .extrude(p.wheel_t + 1.0)\n    )\n    part = part.cut(\n   \
    \     cq.Workplane(\"XY\")\n        .workplane(offset=p.bearing_lip_h)\n     \
    \   .center(bx, 0.0)\n        .circle(p.bearing_pocket_d / 2.0)\n        .extrude(p.wheel_t\
    \ - p.bearing_lip_h + 0.1)\n    )\n\n    rib_center_r = (p.bearing_pocket_d /\
    \ 2.0) + (p.bearing_rib_r - p.bearing_rib_protrusion)\n    for i in range(6):\n\
    \        ang = math.radians(i * 60.0)\n        rx = bx + rib_center_r * math.cos(ang)\n\
    \        ry = rib_center_r * math.sin(ang)\n        rib = (\n            cq.Workplane(\"\
    XY\")\n            .workplane(offset=p.bearing_lip_h)\n            .center(rx,\
    \ ry)\n            .circle(p.bearing_rib_r)\n            .extrude(p.wheel_t -\
    \ p.bearing_lip_h - 0.6)\n        )\n        part = part.union(rib)\n\n    # M5\
    \ nut test pocket at (+13, 0)\n    nx_center = 13.0\n    part = part.cut(\n  \
    \      cq.Workplane(\"XY\")\n        .center(nx_center, 0.0)\n        .circle(p.m5_clearance_d\
    \ / 2.0)\n        .extrude(p.wheel_t + 1.0)\n    )\n    nut_circum_d = p.nut_pocket_af\
    \ / math.cos(math.radians(30.0))\n    part = part.cut(\n        cq.Workplane(\"\
    XY\")\n        .center(nx_center, 0.0)\n        .polygon(6, nut_circum_d)\n  \
    \      .extrude(p.nut_pocket_depth)\n    )\n    part = part.cut(\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.nut_pocket_depth)\n        .center(nx_center,\
    \ 0.0)\n        .rect(p.nut_pocket_af, p.m5_clearance_d)\n        .extrude(0.2)\n\
    \    )\n\n    nut_rib_center_r = (p.nut_pocket_af / 2.0) + (p.nut_rib_r - p.nut_rib_protrusion)\n\
    \    for i in range(6):\n        ang = math.radians(30.0 + i * 60.0)\n       \
    \ nx = nx_center + nut_rib_center_r * math.cos(ang)\n        ny = nut_rib_center_r\
    \ * math.sin(ang)\n        nrib = (\n            cq.Workplane(\"XY\")\n      \
    \      .workplane(offset=0.4)\n            .center(nx, ny)\n            .circle(p.nut_rib_r)\n\
    \            .extrude(p.nut_pocket_depth - 0.4)\n        )\n        part = part.union(nrib)\n\
    \n    return part\n"
  print_orientation: Flat on the build plate (z = 0), matching the exact print orientation
    of the spinner wheel.
  use_orientation: Hand-press test block for checking 608ZZ bearing and M5 nut retention
    before printing the full wheel.
hardware:
- id: bearing_608
  ref: 608ZZ
  qty: 1
- id: pivot_bolt_m8
  ref: ISO 4762 M8x35
  qty: 1
- id: pivot_washer_m8
  ref: ISO 7089 M8
  qty: 2
- id: pivot_nut_m8
  ref: ISO 10511 M8
  qty: 1
- id: handle_bolt_m5
  ref: ISO 4762 M5x20
  qty: 1
- id: handle_nut_m5
  ref: ISO 4032 M5
  qty: 1
joints:
- id: handle_joint
  fastener: handle_bolt_m5
  axis_origin:
  - 26.0
  - 0.0
  - 20.0
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: spinner_wheel
    feature: handle_boss_top
    role: head_seat
  - part: spinner_wheel
    feature: handle_bolt_bore
    role: clearance
  - part: spinner_wheel
    feature: m5_nut_pocket
    role: nut_pocket
  nut: handle_nut_m5
  external: null
- id: pivot_joint
  fastener: pivot_bolt_m8
  axis_origin:
  - 0.0
  - 0.0
  - 8.2
  axis_dir:
  - 0.0
  - 0.0
  - -1.0
  seats:
  - part: spinner_wheel
    feature: bearing_pocket
    role: clearance
  nut: pivot_nut_m8
  external: board_m8_mount_hole
criteria:
- id: bearing_press_fit
  part: spinner_wheel
  feature: bearing_pocket
  relation: seats
  hardware: bearing_608
  clearance_mm: -0.12
  params:
  - bearing_od
  - bearing_w
  - bearing_pocket_d
  - bearing_rib_protrusion
  - bearing_lip_h
  - bearing_lip_id
  check:
    method: coupon
    ref: fit_coupon
    description: Press the 608ZZ bearing by hand into the central pocket of the coupon
      and invert it to verify it stays retained without glue.
- id: bearing_inner_ring_clearance
  part: spinner_wheel
  feature: bearing_lip_bore
  relation: clears
  hardware: bearing_608
  clearance_mm: 3.25
  params:
  - bearing_bore
  - bearing_lip_id
  check:
    method: coupon
    ref: fit_coupon
    description: Verify that the bottom retaining lip supports the 608ZZ outer ring
      while clearing the inner ring and shield.
- id: nut_press_fit
  part: spinner_wheel
  feature: m5_nut_pocket
  relation: seats
  hardware: handle_nut_m5
  clearance_mm: -0.12
  params:
  - nut_m5_af
  - nut_m5_h
  - nut_pocket_af
  - nut_pocket_depth
  - nut_rib_protrusion
  check:
    method: coupon
    ref: fit_coupon
    description: Press the ISO 4032 M5 nut by hand into the back hex pocket of the
      coupon and turn it over to confirm retention without glue.
- id: handle_bolt_clearance_and_length
  part: spinner_wheel
  feature: handle_bolt_bore
  relation: contains
  hardware: handle_bolt_m5
  clearance_mm: 0.3
  params:
  - bolt_m5_d
  - bolt_m5_l
  - m5_clearance_d
  - handle_total_h
  - nut_pocket_depth
  check:
    method: measure
    ref: null
    description: Pass the M5x20 bolt through the front handle boss into the captured
      M5 nut and tighten from the front, verifying the bolt tip does not protrude
      past the back face.
manual:
- n: '1'
  text: Print the test coupon (fit_coupon) first and test-press the 608ZZ bearing
    into the round pocket and the ISO 4032 M5 nut into the hex pocket by hand. Flip
    the coupon over to verify both stay securely held by the internal crush ribs,
    then push them back out through the access holes.
  parts:
  - fit_coupon
  hardware:
  - bearing_608
  - handle_nut_m5
  tool: null
- n: '2'
  text: Press the 608ZZ bearing by hand into the central pocket on the front face
    of the spinner wheel until its outer ring seats firmly against the bottom retaining
    lip.
  parts:
  - spinner_wheel
  hardware:
  - bearing_608
  tool: null
- n: '3'
  text: Turn the spinner wheel over and press the ISO 4032 M5 hex nut by hand into
    the hexagonal pocket on the back face until it seats against the pocket floor.
  parts:
  - spinner_wheel
  hardware:
  - handle_nut_m5
  tool: null
- n: '4'
  text: Mount the spinner wheel to your game board using the ISO 4762 M8x35 bolt through
    the 608ZZ bearing bore, placing an ISO 7089 M8 washer between the bearing inner
    ring and the board so the back of the wheel spins completely clear of the board,
    and secure behind the board with the second M8 washer and ISO 10511 M8 lock nut.
  parts:
  - spinner_wheel
  hardware:
  - pivot_bolt_m8
  - pivot_washer_m8
  - pivot_nut_m8
  tool: 6 mm hex key and 13 mm wrench
- n: '5'
  text: Insert the ISO 4762 M5x20 bolt from the front through the raised handle boss
    near the wheel's edge and tighten it with a 4 mm hex key into the captured M5
    nut at the back.
  parts:
  - spinner_wheel
  hardware:
  - handle_bolt_m5
  tool: 4 mm hex key
