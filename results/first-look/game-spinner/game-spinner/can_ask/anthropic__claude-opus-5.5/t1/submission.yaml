task: game-spinner
note: Single-piece wheel, 70 x 10 mm, printed front-down so the bearing pocket and
  nut pocket have no overhangs. The press fits are checked with a coupon before the
  full print. The M8 bolt and nut aren't specified because the board thickness wasn't
  known.
questions: []
params:
  wheel_d:
    value: 70
    unit: mm
    kind: design
    source: asked
    note: about 70 mm across, per request
  wheel_t:
    value: 10
    unit: mm
    kind: design
    source: design
    note: ''
  bearing_od:
    value: 22.0
    unit: mm
    kind: hardware
    source: measured
    note: 're-measured square across the outer ring: about 22'
  bearing_w:
    value: 7.0
    unit: mm
    kind: hardware
    source: measured
    note: ''
  bearing_bore_d:
    value: 22.1
    unit: mm
    kind: design
    source: design
    note: modelled bore; printed holes come out ~0.1-0.2 small, so this aims at a
      light hand press. Tune from coupon
  bearing_proud:
    value: 1.0
    unit: mm
    kind: design
    source: design
    note: bearing stands 1 mm proud of the back so the wheel face never rubs the board
  lip_hole_d:
    value: 17.0
    unit: mm
    kind: design
    source: design
    note: front lip bears on outer ring only; M8 washer (16 OD) fits inside it against
      the inner race
  m8_washer_od:
    value: 16
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  handle_r:
    value: 27
    unit: mm
    kind: design
    source: design
    note: handle bolt centre distance from wheel centre
  m5_clear_d:
    value: 5.5
    unit: mm
    kind: design
    source: design
    note: ''
  m5_head_d:
    value: 8.5
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  nut_af:
    value: 8.0
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  nut_h:
    value: 4.7
    unit: mm
    kind: hardware
    source: catalog
    note: ''
  nut_pocket_af:
    value: 8.1
    unit: mm
    kind: design
    source: design
    note: press fit by hand; tune from coupon
  nut_pocket_depth:
    value: 5.0
    unit: mm
    kind: design
    source: design
    note: nut 4.7 sits 0.3 below back face
  m5_len:
    value: 10
    unit: mm
    kind: hardware
    source: catalog
    note: tip ends flush with back face, full nut engagement
  board_t:
    value: null
    unit: mm
    kind: world
    source: unknown
    note: couldn't be measured; sets the M8 bolt length
parts:
- id: spinner_wheel
  role: final
  material: PLA
  code: "def build(p):\n    T = p.wheel_t\n    w = cq.Workplane('XY').circle(p.wheel_d/2).extrude(T)\n\
    \    w = w.edges('<Z').chamfer(0.6)\n    w = w.cut(cq.Workplane('XY').circle(p.lip_hole_d/2).extrude(T))\n\
    \    pd = p.bearing_w - p.bearing_proud\n    w = w.cut(cq.Workplane('XY').workplane(offset=T-pd).circle(p.bearing_bore_d/2).extrude(pd))\n\
    \    w = w.cut(cq.Workplane('XY').center(p.handle_r, 0).circle(p.m5_clear_d/2).extrude(T))\n\
    \    w = w.cut(cq.Workplane('XY').workplane(offset=T-p.nut_pocket_depth).center(p.handle_r,\
    \ 0).polygon(6, p.nut_pocket_af/0.8660254).extrude(p.nut_pocket_depth))\n    return\
    \ w\n"
  print_orientation: front face (z=0) on the bed; bearing pocket and nut pocket open
    upward, so nothing overhangs
  use_orientation: front face toward the player, back face (z=wheel_t) toward the
    board
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    offs = [-0.1, 0.0, 0.1]\n    pitch = 30\n    h = p.bearing_w\
    \ - p.bearing_proud\n    w = cq.Workplane('XY').box(pitch*3, 42, h, centered=(True,\
    \ False, False))\n    for i, o in enumerate(offs):\n        x = (i-1)*pitch\n\
    \        w = w.cut(cq.Workplane('XY').center(x, 13).circle(p.bearing_bore_d/2\
    \ + o/2*2/2).extrude(h))\n        w = w.cut(cq.Workplane('XY').workplane(offset=h-p.nut_pocket_depth).center(x,\
    \ 34).polygon(6, (p.nut_pocket_af + o)/0.8660254).extrude(p.nut_pocket_depth))\n\
    \        w = w.cut(cq.Workplane('XY').center(x, 34).circle(p.m5_clear_d/2).extrude(h))\n\
    \        for k in range(i+1):\n            w = w.cut(cq.Workplane('XY').workplane(offset=h-0.6).center(x\
    \ - 10 + k*3, 39.5).circle(0.8).extrude(0.6))\n    return w\n"
  print_orientation: flat, z=0 on the bed, same as the wheel
  use_orientation: handheld test
hardware:
- id: handle_bolt
  ref: ISO 4762 M5x10
  qty: 1
- id: handle_nut
  ref: ISO 4032 M5
  qty: 1
- id: m8_washer
  ref: ISO 7089 M8
  qty: 2
joints:
- id: handle
  fastener: handle_bolt
  axis_origin:
  - 27.0
  - 0.0
  - 0.0
  axis_dir:
  - 0.0
  - 0.0
  - 1.0
  seats:
  - part: spinner_wheel
    feature: front face around M5 hole
    role: head_seat
  - part: spinner_wheel
    feature: M5 clearance hole
    role: clearance
  - part: spinner_wheel
    feature: hex nut pocket (back)
    role: nut_pocket
  nut: handle_nut
  external: null
criteria:
- id: bearing_fit
  part: spinner_wheel
  feature: bearing pocket
  relation: contains
  hardware: null
  clearance_mm: null
  params:
  - bearing_bore_d
  - bearing_od
  check:
    method: coupon
    ref: fit_coupon
    description: Pick the bore that presses in by thumb and doesn't drop out when
      shaken upside down
- id: nut_fit
  part: spinner_wheel
  feature: hex nut pocket
  relation: contains
  hardware: null
  clearance_mm: null
  params:
  - nut_pocket_af
  - nut_af
  check:
    method: coupon
    ref: fit_coupon
    description: Pick the hex that the nut pushes into by hand and stays in upside
      down
- id: board_clear
  part: spinner_wheel
  feature: back face
  relation: clears
  hardware: null
  clearance_mm: 1.0
  params:
  - bearing_proud
  - m5_len
  - wheel_t
  check:
    method: measure
    ref: null
    description: Bearing stands ~1 mm proud of back face; M5 tip not past back face
manual:
- n: '1'
  text: 'Print fit_coupon first (about 15 min). Each column is marked with 1, 2 or
    3 dots: 1 = 0.1 mm tighter, 2 = as designed, 3 = 0.1 mm looser. Push the bearing
    into each round hole and the M5 nut into each hex. Pick the tightest one you can
    still press in by thumb that also stays in when you shake it upside down. If you
    choose 1 or 3, change bearing_bore_d / nut_pocket_af by -0.1 / +0.1 before printing
    the wheel.'
  parts:
  - fit_coupon
  hardware:
  - handle_nut
  tool: null
- n: '2'
  text: Print spinner_wheel with the front face on the bed. No supports needed. 3
    walls and 20-25% infill works well.
  parts:
  - spinner_wheel
  hardware: []
  tool: null
- n: '3'
  text: Turn the wheel so the back (the side with the big round pocket and the hex)
    faces up. Press the 608 bearing in until it hits the lip. It will stand about
    1 mm proud of the back face; that's intentional, so the wheel doesn't rub the
    board.
  parts:
  - spinner_wheel
  hardware: []
  tool: null
- n: '4'
  text: Press the M5 nut into the hex pocket until it bottoms out.
  parts:
  - spinner_wheel
  hardware:
  - handle_nut
  tool: null
- n: '5'
  text: 'Mount it on the board: M8 bolt from the front, then an M8 washer (sits inside
    the front lip against the bearing''s inner ring), then the bearing, then the second
    M8 washer between the bearing and the board, through the board, then a nut on
    the back. Pick a bolt length of board thickness + about 7 + 3.2 + nut height.
    Tighten so it grips the inner ring and the wheel still spins freely.'
  parts: []
  hardware:
  - m8_washer
  tool: 6 mm hex key + spanner
- n: '6'
  text: From the front, screw the M5x10 into the nut and tighten. Its head is the
    handle you spin with. The tip finishes flush with the back face, so it can't scratch
    the board.
  parts: []
  hardware:
  - handle_bolt
  tool: 4 mm hex key
