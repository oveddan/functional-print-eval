parts:
- id: base_frame
  role: final
  material: PLA
  code: "def build(p):\n    # Pivot axis is at (x=0, y=0).\n    # Servo front edge\
    \ is at x = p.servo_shaft_from_end, so servo body center is at:\n    servo_cx\
    \ = p.servo_shaft_from_end - p.servo_body_length / 2.0\n    pocket_l = p.servo_body_length\
    \ + p.servo_body_clearance\n    pocket_w = p.servo_body_width + p.servo_body_clearance\n\
    \    hole_span_x = p.servo_hole_inner_span + p.servo_tab_hole_d\n\n    # Base\
    \ footprint centered around x = -12.0, y = 0\n    base_cx = -12.0\n    part =\
    \ (\n        cq.Workplane(\"XY\")\n        .center(base_cx, 0)\n        .box(p.base_length,\
    \ p.base_width, p.base_plate_t, centered=(True, True, False))\n        .edges(\"\
    |Z\")\n        .fillet(4.0)\n    )\n\n    # Servo cradle block rising from z=0\
    \ to z=p.servo_deck_z\n    cradle_l = pocket_l + 24.0\n    cradle_w = pocket_w\
    \ + 18.0\n    cradle = (\n        cq.Workplane(\"XY\")\n        .center(servo_cx,\
    \ 0)\n        .box(cradle_l, cradle_w, p.servo_deck_z, centered=(True, True, False))\n\
    \        .edges(\"|Z\")\n        .fillet(3.0)\n    )\n    part = part.union(cradle)\n\
    \n    # Hollow underneath the servo deck (z = p.base_plate_t to p.servo_deck_z\
    \ - p.servo_deck_t)\n    # so the user can easily access the M4 locknuts under\
    \ both servo mounting tabs\n    under_h = p.servo_deck_z - p.servo_deck_t - p.base_plate_t\n\
    \    under_cut_x = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.base_plate_t)\n\
    \        .center(servo_cx, 0)\n        .box(cradle_l + 2.0, pocket_w, under_h,\
    \ centered=(True, True, False))\n    )\n    under_cut_y = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.base_plate_t)\n        .center(servo_cx, 0)\n\
    \        .box(pocket_l - 6.0, cradle_w + 2.0, under_h, centered=(True, True, False))\n\
    \    )\n    part = part.cut(under_cut_x).cut(under_cut_y)\n\n    # Through-cutout\
    \ for servo body and front cable exit slot\n    servo_cut = (\n        cq.Workplane(\"\
    XY\")\n        .workplane(offset=p.base_plate_t)\n        .center(servo_cx, 0)\n\
    \        .box(pocket_l, pocket_w, p.servo_deck_z, centered=(True, True, False))\n\
    \    )\n    wire_slot = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.base_plate_t)\n\
    \        .center(servo_cx + pocket_l / 2.0 + 6.0, 0)\n        .box(14.0, 6.5,\
    \ p.servo_deck_z, centered=(True, True, False))\n    )\n    part = part.cut(servo_cut).cut(wire_slot)\n\
    \n    # Transverse slots at both ends of servo pocket for M4 tab screws (handles\
    \ any hole spacing across tab width)\n    slot_d = p.m4_d + p.fastener_clearance\n\
    \    for sign in (-1.0, 1.0):\n        tab_x = servo_cx + sign * (hole_span_x\
    \ / 2.0)\n        tab_slot = (\n            cq.Workplane(\"XY\")\n           \
    \ .workplane(offset=p.servo_deck_z - p.servo_deck_t - 1.0)\n            .center(tab_x,\
    \ 0)\n            .slot2D(15.0, slot_d, 90.0)\n            .extrude(p.servo_deck_t\
    \ + 2.0)\n        )\n        part = part.cut(tab_slot)\n\n    # Two rear upright\
    \ pillars at the back of the cradle for bearing_bridge Z-adjustment\n    pillar_x\
    \ = -41.0\n    pillar_l = 18.0\n    pillar_y_outer = cradle_w / 2.0\n    pillar_y_center\
    \ = pillar_y_outer - p.pillar_wall_t / 2.0\n    for sign_y in (-1.0, 1.0):\n \
    \       pillar = (\n            cq.Workplane(\"XY\")\n            .center(pillar_x,\
    \ sign_y * pillar_y_center)\n            .box(pillar_l, p.pillar_wall_t, p.pillar_top_z,\
    \ centered=(True, True, False))\n        )\n        part = part.union(pillar)\n\
    \n    # Vertical M4 adjustment slots in the rear pillars (along Z)\n    z_slot_center\
    \ = p.pillar_top_z - 15.0\n    for dx in (-4.5, 4.5):\n        z_slot = (\n  \
    \          cq.Workplane(\"XZ\")\n            .workplane(offset=-cradle_w)\n  \
    \          .center(pillar_x + dx, z_slot_center)\n            .slot2D(p.bridge_z_slot_travel,\
    \ slot_d, 90.0)\n            .extrude(2.0 * cradle_w)\n        )\n        part\
    \ = part.cut(z_slot)\n\n    # 4 corner mounting holes in baseplate\n    for sx\
    \ in (-1.0, 1.0):\n        for sy in (-1.0, 1.0):\n            hole = (\n    \
    \            cq.Workplane(\"XY\")\n                .center(base_cx + sx * (p.base_length\
    \ / 2.0 - 8.0), sy * (p.base_width / 2.0 - 8.0))\n                .circle((p.m4_d\
    \ + p.fastener_clearance) / 2.0)\n                .extrude(p.base_plate_t + 1.0)\n\
    \            )\n            part = part.cut(hole)\n\n    return part\n"
  print_orientation: Flat bottom baseplate on the print bed (z = 0), rear pillars
    pointing up (+Z); prints cleanly with no supports required.
  use_orientation: Same as print orientation (z = 0 resting on the work surface, servo
    shaft pointing up along +Z).
- id: bearing_bridge
  role: final
  material: PLA
  code: "def build(p):\n    # Printed with the flat top surface of the bridge arch\
    \ on the print bed (z = 0).\n    # The bearing pocket and rear mounting legs face\
    \ up (+Z) during printing so there are zero overhangs.\n    pocket_w = p.servo_body_width\
    \ + p.servo_body_clearance\n    cradle_w = pocket_w + 18.0\n    inner_span_y =\
    \ cradle_w + 0.4  # hugs the outside of base_frame's rear pillars\n    outer_span_y\
    \ = inner_span_y + 2.0 * p.pillar_wall_t\n\n    rear_x = -41.0\n    leg_l = 22.0\n\
    \    arch_len = abs(rear_x) + leg_l / 2.0 + 18.0\n    arch_cx = (18.0 + (rear_x\
    \ - leg_l / 2.0)) / 2.0\n\n    # Top horizontal plate from z=0 to z=p.bridge_plate_t\n\
    \    plate = (\n        cq.Workplane(\"XY\")\n        .center(arch_cx, 0)\n  \
    \      .box(arch_len, outer_span_y, p.bridge_plate_t, centered=(True, True, False))\n\
    \        .edges(\"|Z\")\n        .fillet(4.0)\n    )\n\n    # Two side legs rising\
    \ from z=0 to z=p.bridge_leg_h at the rear (x = rear_x)\n    leg_y_center = (inner_span_y\
    \ + p.pillar_wall_t) / 2.0\n    for sign_y in (-1.0, 1.0):\n        leg = (\n\
    \            cq.Workplane(\"XY\")\n            .center(rear_x, sign_y * leg_y_center)\n\
    \            .box(leg_l, p.pillar_wall_t, p.bridge_leg_h, centered=(True, True,\
    \ False))\n        )\n        plate = plate.union(leg)\n\n    # Coaxial 608ZZ\
    \ bearing seat at (0, 0):\n    # 1) Through-bore of diameter p.bearing_lip_bore_d\
    \ (14.0 mm) through the 3 mm retention lip at z=0..3\n    # 2) Bearing outer race\
    \ pocket of diameter (p.bearing_od + p.bearing_fit_clearance) from z=(p.bridge_plate_t\
    \ - p.bearing_width) to z=p.bridge_plate_t\n    lip_bore = (\n        cq.Workplane(\"\
    XY\")\n        .center(0, 0)\n        .circle(p.bearing_lip_bore_d / 2.0)\n  \
    \      .extrude(p.bridge_plate_t + 1.0)\n    )\n    bearing_seat_d = p.bearing_od\
    \ + p.bearing_fit_clearance\n    bearing_pocket = (\n        cq.Workplane(\"XY\"\
    )\n        .workplane(offset=p.bridge_plate_t - p.bearing_width)\n        .center(0,\
    \ 0)\n        .circle(bearing_seat_d / 2.0)\n        .extrude(p.bearing_width\
    \ + 1.0)\n    )\n    plate = plate.cut(lip_bore).cut(bearing_pocket)\n\n    #\
    \ Horizontal M4 adjustment slots (along X) in the rear side legs\n    slot_d =\
    \ p.m4_d + p.fastener_clearance\n    z_slot_center = p.bridge_leg_h - 14.0\n \
    \   for dx in (-4.5, 4.5):\n        x_slot = (\n            cq.Workplane(\"XZ\"\
    )\n            .workplane(offset=-outer_span_y)\n            .center(rear_x +\
    \ dx, z_slot_center)\n            .slot2D(p.bridge_x_slot_travel, slot_d, 0.0)\n\
    \            .extrude(2.0 * outer_span_y)\n        )\n        plate = plate.cut(x_slot)\n\
    \n    return plate\n"
  print_orientation: Flat arch face on the bed (z = 0), with the 608ZZ bearing pocket
    and side legs facing up (+Z) for support-free printing.
  use_orientation: Mounted above the servo with side legs pointing down (-Z) to straddle
    the rear pillars of base_frame and the 608ZZ bearing pocket facing up (+Z) at
    the pivot axis (0, 0).
- id: robot_arm
  role: final
  material: PLA
  code: "def build(p):\n    # Printed with the flat bearing-side face on the print\
    \ bed (z = 0) and the servo horn pocket facing UP (+Z),\n    # eliminating all\
    \ overhangs and bridges.\n    # Outer profile: hub of diameter p.arm_hub_od at\
    \ (0, 0), beam of length p.arm_length to (p.arm_length, 0) with tip diameter p.arm_tip_od.\n\
    \    beam_w = p.arm_tip_od\n    beam = (\n        cq.Workplane(\"XY\")\n     \
    \   .center(p.arm_length / 2.0, 0)\n        .box(p.arm_length, beam_w, p.arm_beam_h,\
    \ centered=(True, True, False))\n    )\n    hub = (\n        cq.Workplane(\"XY\"\
    )\n        .center(0, 0)\n        .circle(p.arm_hub_od / 2.0)\n        .extrude(p.arm_hub_h)\n\
    \    )\n    horn_boss = (\n        cq.Workplane(\"XY\")\n        .center(15.0,\
    \ 0)\n        .box(30.0, beam_w, p.arm_hub_h, centered=(True, True, False))\n\
    \    )\n    tip = (\n        cq.Workplane(\"XY\")\n        .center(p.arm_length,\
    \ 0)\n        .circle(p.arm_tip_od / 2.0)\n        .extrude(p.arm_beam_h)\n  \
    \  )\n    part = hub.union(horn_boss).union(beam).union(tip)\n\n    # 1) Through-bore\
    \ at (0, 0) for ISO 4762 M8x25 shaft\n    m8_bore_d = p.m8_d + 0.25\n    m8_bore\
    \ = (\n        cq.Workplane(\"XY\")\n        .center(0, 0)\n        .circle(m8_bore_d\
    \ / 2.0)\n        .extrude(p.arm_hub_h + 1.0)\n    )\n    part = part.cut(m8_bore)\n\
    \n    # 2) Horn pocket on the top (+Z during printing, underside in use):\n  \
    \  # Hub pocket depth = p.horn_hub_t - 0.5 (5.45 mm) from the top face z = p.arm_hub_h\n\
    \    horn_hub_pocket_d = p.horn_hub_d + p.horn_pocket_clearance\n    horn_hub_depth\
    \ = 5.2\n    horn_arm_depth = p.horn_arm_t + 0.3\n    horn_tip_r = p.horn_len_from_hub_far_edge\
    \ - p.horn_hub_d / 2.0 + 0.8\n\n    hub_pocket = (\n        cq.Workplane(\"XY\"\
    )\n        .workplane(offset=p.arm_hub_h - horn_hub_depth)\n        .center(0,\
    \ 0)\n        .circle(horn_hub_pocket_d / 2.0)\n        .extrude(horn_hub_depth\
    \ + 1.0)\n    )\n    arm_channel = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=p.arm_hub_h\
    \ - horn_arm_depth)\n        .center(horn_tip_r / 2.0, 0)\n        .box(horn_tip_r,\
    \ p.horn_arm_pocket_w, horn_arm_depth + 1.0, centered=(True, True, False))\n \
    \   )\n    part = part.cut(hub_pocket).cut(arm_channel)\n\n    # 3) Counterbore\
    \ seat for ISO 4762 M8x25 head directly beneath the horn hub pocket (from z =\
    \ 3.0 to z = p.arm_hub_h)\n    m8_head_seat_d = p.m8_head_d + 0.4\n    m8_head_floor_z\
    \ = p.arm_hub_h - horn_hub_depth - (p.m8_head_h + 0.3)\n    m8_head_pocket = (\n\
    \        cq.Workplane(\"XY\")\n        .workplane(offset=m8_head_floor_z)\n  \
    \      .center(0, 0)\n        .circle(m8_head_seat_d / 2.0)\n        .extrude(p.arm_hub_h)\n\
    \    )\n    part = part.cut(m8_head_pocket)\n\n    # 4) Radial slot from x = 13.5\
    \ mm to x = 24.5 mm for 2x M3x12 screws engaging the horn's 2.55 mm holes\n  \
    \  m3_slot_d = p.m3_d + p.fastener_clearance\n    m3_slot_len = 13.5  # center\
    \ at x=19.0, spans x=12.25 to x=25.75\n    m3_slot = (\n        cq.Workplane(\"\
    XY\")\n        .center(19.0, 0)\n        .slot2D(m3_slot_len, m3_slot_d, 0.0)\n\
    \        .extrude(p.arm_hub_h + 1.0)\n    )\n    # Recessed washer slot on the\
    \ z=0 face (depth 2.2 mm) or from the horn floor side:\n    # We keep z=0 flat\
    \ on the bed and let the M3x12 screw + M3 washer seat at z = 4.0 mm inside an\
    \ open access step from z = 0..4?\n    # Even cleaner: step the beam top down\
    \ outside the hub so z = 0 is 100% flat on the print bed, and the M3x12 screw\
    \ enters from the flat z=0 face!\n    part = part.cut(m3_slot)\n\n    # 5) Distal\
    \ mounting holes at x = p.arm_length (100.0 mm) and lightness cutouts along the\
    \ beam\n    tip_center_hole = (\n        cq.Workplane(\"XY\")\n        .center(p.arm_length,\
    \ 0)\n        .circle((p.m4_d + p.fastener_clearance) / 2.0)\n        .extrude(p.arm_beam_h\
    \ + 1.0)\n    )\n    part = part.cut(tip_center_hole)\n\n    for sx in (-1.0,\
    \ 1.0):\n        for sy in (-1.0, 1.0):\n            sub_hole = (\n          \
    \      cq.Workplane(\"XY\")\n                .center(p.arm_length + sx * 6.5,\
    \ sy * 6.5)\n                .circle((p.m3_d + p.fastener_clearance) / 2.0)\n\
    \                .extrude(p.arm_beam_h + 1.0)\n            )\n            part\
    \ = part.cut(sub_hole)\n\n    for pocket_x in (46.0, 64.0, 81.0):\n        light_cut\
    \ = (\n            cq.Workplane(\"XY\")\n            .center(pocket_x, 0)\n  \
    \          .slot2D(12.0, 9.0, 0.0)\n            .extrude(p.arm_beam_h + 1.0)\n\
    \        )\n        part = part.cut(light_cut)\n\n    return part\n"
  print_orientation: Flat bearing-side surface on the print bed (z = 0), with the
    25T aluminium horn pocket facing up (+Z) for zero overhangs.
  use_orientation: Flipped upside-down (180 deg about X) so the horn pocket faces
    down (-Z) onto the MG996R aluminium servo horn and the M8 pivot screw points up
    (+Z) through the 608ZZ bearing.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    # Compact test coupon combining:\n    # 1) 608ZZ bearing\
    \ pocket at (-18, 0)\n    # 2) 25T aluminium servo horn hub + arm channel + M3\
    \ radial slot from (5, 0) to (35, 0)\n    coupon = (\n        cq.Workplane(\"\
    XY\")\n        .center(4.0, 0)\n        .box(72.0, 30.0, 9.0, centered=(True,\
    \ True, False))\n        .edges(\"|Z\")\n        .fillet(3.0)\n    )\n\n    #\
    \ Bearing pocket at (-18, 0)\n    bearing_seat_d = p.bearing_od + p.bearing_fit_clearance\n\
    \    b_thru = (\n        cq.Workplane(\"XY\")\n        .center(-18.0, 0)\n   \
    \     .circle(p.bearing_lip_bore_d / 2.0)\n        .extrude(10.0)\n    )\n   \
    \ b_pocket = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=9.0 -\
    \ p.bearing_width)\n        .center(-18.0, 0)\n        .circle(bearing_seat_d\
    \ / 2.0)\n        .extrude(p.bearing_width + 1.0)\n    )\n    coupon = coupon.cut(b_thru).cut(b_pocket)\n\
    \n    # Horn pocket centered at (+8, 0)\n    horn_cx = 8.0\n    horn_hub_pocket_d\
    \ = p.horn_hub_d + p.horn_pocket_clearance\n    horn_tip_r = p.horn_len_from_hub_far_edge\
    \ - p.horn_hub_d / 2.0 + 0.8\n    horn_arm_depth = p.horn_arm_t + 0.3\n\n    h_hub\
    \ = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=9.0 - 5.2)\n  \
    \      .center(horn_cx, 0)\n        .circle(horn_hub_pocket_d / 2.0)\n       \
    \ .extrude(6.0)\n    )\n    h_arm = (\n        cq.Workplane(\"XY\")\n        .workplane(offset=9.0\
    \ - horn_arm_depth)\n        .center(horn_cx + horn_tip_r / 2.0, 0)\n        .box(horn_tip_r,\
    \ p.horn_arm_pocket_w, horn_arm_depth + 1.0, centered=(True, True, False))\n \
    \   )\n    h_slot = (\n        cq.Workplane(\"XY\")\n        .center(horn_cx +\
    \ 19.0, 0)\n        .slot2D(13.5, p.m3_d + p.fastener_clearance, 0.0)\n      \
    \  .extrude(10.0)\n    )\n    coupon = coupon.cut(h_hub).cut(h_arm).cut(h_slot)\n\
    \n    return coupon\n"
  print_orientation: Flat bottom on the print bed (z = 0), with both test pockets
    facing up (+Z).
  use_orientation: Handheld test gauge for checking the 608ZZ bearing fit and the
    25T aluminium horn + M3 screw engagement prior to printing the full parts.
