manual:
- n: '1'
  text: Print fit_coupon first. Test-fit the 608ZZ bearing into the circular bearing
    pocket and test-fit your 25-tooth aluminium servo horn into the horn pocket with
    two ISO 4762 M3x12 screws through the radial slot. Once satisfied with the fit,
    print base_frame, robot_arm, and bearing_bridge.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Drop the MG996R servo into the rectangular pocket of base_frame with the output
    shaft oriented toward the front (+X, away from the two tall rear pillars) and
    pass the servo lead out through the front wire slot. Secure the servo mounting
    tabs using four ISO 4762 M4x16 screws, eight ISO 7089 M4 washers, and four ISO
    10511 M4 locknuts through the transverse tab slots.
  parts:
  - base_frame
  hardware:
  - m4_servo_screw
  - m4_washer
  - m4_locknut
  tool: 3 mm hex key and 7 mm wrench
- n: '3'
  text: Power/center the MG996R servo to its neutral midpoint position, press the
    25-tooth aluminium single-arm servo horn onto the 5.84 mm output spline pointing
    straight forward (+X), and fasten the servo's center retaining screw.
  parts: []
  hardware: []
  tool: Small Phillips/hex screwdriver (for servo horn center screw)
- n: '4'
  text: Insert the ISO 4762 M8x25 socket head screw into the center counterbore inside
    the horn pocket of robot_arm so its threaded shaft sticks straight out of the
    flat upper face. Place robot_arm down over the aluminium servo horn so the horn
    hub and arm seat into the underside pocket, then thread two ISO 4762 M3x12 screws
    with ISO 7089 M3 washers down through the radial slot into the horn's 2.55 mm
    holes and tighten.
  parts:
  - robot_arm
  hardware:
  - m8_pivot_screw
  - m3_horn_screw
  - m3_horn_washer
  tool: 2.5 mm hex key
- n: '5'
  text: Press the 608ZZ bearing into the top bearing seat of bearing_bridge. Lower
    bearing_bridge over the protruding M8 shaft of robot_arm and loosely install four
    ISO 4762 M4x20 screws, eight ISO 7089 M4 washers, and four ISO 10511 M4 locknuts
    through the orthogonal X/Z adjustment slots connecting bearing_bridge to the rear
    pillars of base_frame. Install the ISO 7089 M8 washer and ISO 10511 M8 locknut
    onto the M8 shaft above the 608ZZ bearing inner race until snug (do not overtighten
    against the bearing), let the bridge self-center coaxially with the servo axis
    in X and Z, and then tighten all four M4 bridge bolts. Verify the 100 mm arm swings
    freely both ways (+/-90 deg+).
  parts:
  - bearing_bridge
  - base_frame
  - robot_arm
  hardware:
  - m8_pivot_washer
  - m8_pivot_locknut
  - m4_bridge_screw
  - m4_washer
  - m4_locknut
  tool: 3 mm hex key, 6 mm hex key, 7 mm wrench, and 13 mm wrench
