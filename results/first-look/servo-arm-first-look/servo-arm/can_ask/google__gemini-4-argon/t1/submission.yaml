task: servo-arm
note: Dual-supported (clevis) 100 mm robot arm prototype for an MG996R servo and 608ZZ
  bearing. Orthogonal X and Z adjustment slots between base_frame and bearing_bridge
  allow the coaxial 608ZZ counter-bearing to self-align with the physical servo output
  shaft axis without requiring exact measurements of shaft-to-case-end offset or tab-to-bottom
  height. The radial M3 slot and contoured horn pocket on robot_arm accommodate the
  25T aluminium horn's unmeasured hole spacing.
questions:
- text: How is coaxial alignment between the MG996R output shaft and the 608ZZ counter-bearing
    achieved without exact measurements of shaft offset from the case end or tab height?
  answer: Used orthogonal X (+/-4 mm) and Z (+/-6 mm) adjustment slots between base_frame
    and bearing_bridge so the coaxial 608ZZ bearing self-aligns to the true servo
    spline axis during assembly.
- text: How does robot_arm attach to the 25T aluminium servo horn without knowing
    the exact radial hole positions along the horn?
  answer: Used a contoured horn pocket plus a radial M3 slot spanning r = 12.25 mm
    to 25.75 mm so two ISO 4762 M3x12 screws engage the horn's 2.55 mm (M3-tapped)
    holes at any standard spacing.
