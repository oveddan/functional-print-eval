parts:
- id: servo_plate
  role: final
  material: PLA
  code: "def build(p):\n    plate = cq.Workplane('XY').box(p.plate_x, p.plate_y, p.plate_t,\
    \ centered=(True, True, False))\n    cut = cq.Workplane('XY').box(p.servo_w +\
    \ 0.4, p.servo_l + 0.4, p.plate_t + 2, centered=(True, True, False)).translate((0,\
    \ 0, -1))\n    plate = plate.cut(cut)\n    for sx in (-1, 1):\n        x = sx\
    \ * p.servo_tab_span / 2\n        hole = cq.Workplane('XY').center(x, 0).circle(p.m4_clear\
    \ / 2).extrude(p.plate_t)\n        plate = plate.cut(hole)\n        d = (p.nut_af\
    \ + 0.2) / 0.8660254\n        nut = cq.Workplane('XY').center(x, 0).polygon(6,\
    \ d).extrude(p.nut_h)\n        plate = plate.cut(nut)\n    return plate\n"
  print_orientation: flat, plate top face up
  use_orientation: horizontal, plate fixed to base, servo body hangs below
- id: arm
  role: final
  material: PLA
  code: "def build(p):\n    body = cq.Workplane('XY').box(p.arm_len, p.arm_w, p.arm_t,\
    \ centered=(False, True, False))\n    hub = cq.Workplane('XY').circle(p.hub_r).extrude(p.arm_t)\n\
    \    tip = cq.Workplane('XY').center(p.arm_len, 0).circle(p.tip_r).extrude(p.arm_t)\n\
    \    arm = body.union(hub).union(tip)\n    bore = cq.Workplane('XY').circle(p.spline_bore\
    \ / 2).extrude(p.arm_t)\n    arm = arm.cut(bore)\n    pocket = cq.Workplane('XY').workplane(offset=p.arm_t\
    \ - p.brg_pocket_d).center(p.arm_len, 0).circle(p.brg_od / 2 + p.brg_pocket_clear).extrude(p.brg_pocket_d\
    \ + 1)\n    arm = arm.cut(pocket)\n    pin = cq.Workplane('XY').center(p.arm_len,\
    \ 0).circle(p.pin_hole / 2).extrude(p.arm_t)\n    arm = arm.cut(pin)\n    return\
    \ arm\n"
  print_orientation: flat, arm top face up
  use_orientation: horizontal, arm rotates about servo axis
hardware:
- id: scr_m4
  ref: ISO 4762 M4x12
  qty: 1
- id: nut_m4
  ref: ISO 4032 M4
  qty: 1
- id: scr_m5
  ref: ISO 4762 M5x30
  qty: 1
- id: washer_m5
  ref: ISO 7089 M5
  qty: 1
- id: nut_m5
  ref: ISO 10511 M5
  qty: 1
joints: []
criteria: []
manual:
- n: '1'
  text: Print servo_plate flat with the top face up. Check the servo cutout and nut
    pockets fit before assembly.
  parts:
  - servo_plate
  hardware: []
  tool: null
- n: '2'
  text: Press two ISO 4032 M4 nuts into the hex pockets underneath the plate at the
    tab hole positions.
  parts:
  - servo_plate
  hardware:
  - nut_m4
  tool: null
- n: '3'
  text: Lower the MG996R into the plate cutout so its mounting tabs rest on the plate
    top. Fasten each tab with an ISO 4762 M4x12 screw into the M4 nut.
  parts:
  - servo_plate
  hardware:
  - scr_m4
  - nut_m4
  tool: null
- n: '4'
  text: Fit the 25-tooth aluminium horn to the servo spline. Print the arm and slide
    its hub onto the horn; trim the 5.9 mm bore if it is tight.
  parts:
  - arm
  hardware: []
  tool: null
- n: '5'
  text: Press the 608ZZ bearing into the arm tip pocket.
  parts:
  - arm
  hardware: []
  tool: null
- n: '6'
  text: 'Mount the bearing pivot: pass an ISO 4762 M5x30 screw through the bearing
    bore, add an ISO 7089 M5 washer, and secure with an ISO 10511 M5 lock nut on the
    fixed link side.'
  parts:
  - arm
  hardware:
  - scr_m5
  - washer_m5
  - nut_m5
  tool: null
