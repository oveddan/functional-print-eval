task: servo-arm
note: 'The servo shaft axis is horizontal, so the 100 mm arm swings in a vertical
  plane, side to side from upright. The arm is held at both ends: the servo spline
  drives it through the aluminium horn, which sits in a pocket so the torque doesn''t
  go through printed splines. A pin on the other side runs in the 608 bearing. The
  bearing upright also holds the arm on the horn along the shaft axis, so the arm
  doesn''t need screws into the small 2.55 mm horn holes. Several servo and horn dimensions
  are guesses. To make up for them, the bearing upright slides +/-4 mm in X and Y,
  and the servo holes are slotted +/-1.5 mm. The horn''s own center screw comes with
  the servo and isn''t on the hardware list. Frame coordinates: the pivot axis runs
  along Y at X=0, Z=40, and the back face of the servo upright is Y=0.'
questions:
- text: Where does the MG996R cable leave the case? If the grommet sticks out past
    the case outline, it may need tilting through the 41.2 x 20.4 window, or the window
    needs a notch.
  answer: null
- text: How wide is the aluminium horn arm at the hub and at the tip? 9.5 and 6.5
    mm are guesses; check with coupon_hub.
  answer: null
- text: Do you want the arm to sweep a full 180 deg (raise pivot_z above 110 mm),
    or is +/-90 deg from vertical OK for this first version?
  answer: null
