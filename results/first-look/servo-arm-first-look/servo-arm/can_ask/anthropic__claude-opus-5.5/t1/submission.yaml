manual:
- n: '1'
  text: 'Print the two coupons first: coupon_bearing and coupon_hub. Use PLA, 0.2
    mm layers, 4 walls and 40% infill. Press the 608 bearing into coupon_bearing:
    it should go in firmly and stay put. Put the aluminium horn into the pocket of
    coupon_hub: it should sit in without twisting. Push the coupon''s pin into the
    bearing: it should slide in snugly. If the bearing is loose, raise ''press'' by
    0.1. If it''s too tight, lower it. If the horn twists, raise the horn_arm_w params
    toward what you measure with calipers. Then reprint.'
  parts:
  - coupon_bearing
  - coupon_hub
  hardware:
  - bearing
  tool: null
- n: '2'
  text: Print frame, bearing_upright and arm as modelled, with no supports. Use 4
    walls and 40% infill, or more on the arm so the pin is strong.
  parts:
  - frame
  - bearing_upright
  - arm
  hardware: []
  tool: null
- n: '3'
  text: Push an M4 nut into each of the 4 hex pockets on the back of the frame's upright,
    the side facing away from the long base.
  parts:
  - frame
  hardware:
  - m4_nut
  tool: pliers
- n: '4'
  text: From the front (long-base side), slide the MG996R into the window, cable end
    first, with the output shaft pointing toward the long base and sitting at the
    left-hand end as you look from the front. Its tabs rest on the upright. Fix it
    with 4 M4x10 screws through the tab slots into the nuts.
  parts:
  - frame
  hardware:
  - m4_screw
  - m4_nut
  tool: 3 mm hex key
- n: '5'
  text: 'Center the servo: with a servo tester or your controller, send 1500 us (90
    deg). Fit the aluminium horn on the spline so it points straight up, then tighten
    its clamp and the center screw that came with it.'
  parts: []
  hardware: []
  tool: servo tester / controller, small screwdriver
- n: '6'
  text: Press the 608 bearing into the pocket of bearing_upright from the smooth face
    (the face that was on the bed), until it sits on the lip.
  parts:
  - bearing_upright
  hardware:
  - bearing
  tool: vise or flat block
- n: '7'
  text: Fit the arm over the horn so the horn sits fully in the pocket and the arm
    points up. The pin faces away from the servo.
  parts:
  - arm
  hardware: []
  tool: null
- n: '8'
  text: Slide an M5 nut into each nut track under the frame base. Set bearing_upright
    on the base, foot pointing away from the arm, with the bearing over the arm's
    pin. Put an M5x16 screw and a washer through each foot slot, through the base
    slot and into a nut. Tighten them loosely.
  parts:
  - bearing_upright
  - frame
  hardware:
  - m5_screw
  - m5_washer
  - m5_nut
  tool: 4 mm hex key
- n: '9'
  text: Slide the upright in X until the pin is centered in the bearing and the arm
    turns freely by hand, with the servo unpowered or the horn screw loosened. Then
    push the upright toward the arm until the collar just touches the bearing with
    no end play. Tighten both M5 screws.
  parts:
  - bearing_upright
  - arm
  hardware:
  - m5_screw
  tool: null
- n: '10'
  text: 'Power up and sweep slowly. Keep the arm within about +/-90 deg of vertical:
    below horizontal it hits the table. The hole at the arm tip (M5 clearance) is
    for the next stage.'
  parts:
  - arm
