parts:
- id: frame
  role: final
  material: PLA
  code: "import math\ndef build(p):\n    c = p.clr\n    cx = p.servo_len/2 - p.servo_shaft_offset\n\
    \    hcc = p.servo_hole_inner_gap + p.servo_tab_hole_d\n    x0 = cx - hcc/2 -\
    \ 10\n    x1 = cx + hcc/2 + 10\n    W = p.wall\n    pz = p.pivot_z\n    arm_face_y\
    \ = W + p.servo_tab_t + p.horn_seat_h + p.horn_standoff\n    yBa = arm_face_y\
    \ + p.arm_t + p.collar_h\n    plate_t = p.bearing_w + p.lip_t\n    screw_y = yBa\
    \ + plate_t + p.foot_len/2\n    base_len = yBa + plate_t + p.foot_len + p.adjust\
    \ + 3\n    up_h = pz + p.servo_wid/2 + 8\n    body = cq.Workplane('XY').box(x1-x0,\
    \ base_len, p.base_t, centered=False).translate((x0,0,0))\n    body = body.union(cq.Workplane('XY').box(x1-x0,\
    \ W, up_h, centered=False).translate((x0,0,0)))\n    for gx in (x0, x1-4):\n \
    \       g = cq.Workplane('YZ').polyline([(W-0.5, p.base_t-0.5),(W-0.5, pz),(W+12,\
    \ p.base_t-0.5)]).close().extrude(4).translate((gx,0,0))\n        body = body.union(g)\n\
    \    win = cq.Workplane('XY').box(p.servo_len+2*c, W+2, p.servo_wid+2*c).translate((cx,\
    \ W/2, pz))\n    body = body.cut(win)\n    r = (p.m4_d+0.5)/2\n    s = p.slot_z\n\
    \    af = p.m4_nut_af + 0.3\n    dep = p.m4_nut_h + 0.3\n    dcirc = af/math.cos(math.radians(30))\n\
    \    for sx in (cx-hcc/2, cx+hcc/2):\n        for sz in (pz-p.servo_hole_cc_across/2,\
    \ pz+p.servo_hole_cc_across/2):\n            for dz in (-s, s):\n            \
    \    body = body.cut(cq.Solid.makeCylinder(r, W+2, cq.Vector(sx,-1,sz+dz), cq.Vector(0,1,0)))\n\
    \                hx = cq.Workplane('XY').polygon(6, dcirc).extrude(dep+1).rotate((0,0,0),(0,0,1),30).rotate((0,0,0),(1,0,0),90).translate((sx,\
    \ dep, sz+dz))\n                body = body.cut(hx)\n            body = body.cut(cq.Solid.makeBox(2*r,\
    \ W+2, 2*s, cq.Vector(sx-r,-1,sz-s)))\n            body = body.cut(cq.Solid.makeBox(af,\
    \ dep+1, 2*s, cq.Vector(sx-af/2,-1,sz-s)))\n    r5 = (p.m5_d+0.5)/2\n    a = p.adjust\n\
    \    naf = p.m5_nut_af + 0.3\n    ncirc = naf/math.cos(math.radians(30))\n   \
    \ for bx in (-p.bscrew_x, p.bscrew_x):\n        for dx in (-a, a):\n         \
    \   body = body.cut(cq.Solid.makeCylinder(r5, p.base_t+2, cq.Vector(bx+dx, screw_y,\
    \ -1), cq.Vector(0,0,1)))\n        body = body.cut(cq.Solid.makeBox(2*a, 2*r5,\
    \ p.base_t+2, cq.Vector(bx-a, screw_y-r5, -1)))\n        body = body.cut(cq.Solid.makeBox(2*a+ncirc,\
    \ naf, p.m5_nut_h+1.3, cq.Vector(bx-a-ncirc/2, screw_y-naf/2, -1)))\n    return\
    \ body\n"
  print_orientation: base plate bottom on the bed, servo upright standing up (as modelled)
  use_orientation: same as printed, sitting on the table
- id: bearing_upright
  role: final
  material: PLA
  code: "def build(p):\n    plate_t = p.bearing_w + p.lip_t\n    Hc = p.pivot_z -\
    \ p.base_t\n    H = Hc + p.bearing_od/2 + 8\n    Wd = p.b_width\n    body = cq.Workplane('XY').box(Wd,\
    \ H, plate_t, centered=False).translate((-Wd/2,0,0))\n    body = body.union(cq.Workplane('XY').box(Wd,\
    \ p.foot_t, p.foot_len, centered=False).translate((-Wd/2,0,plate_t-0.01)))\n \
    \   for gx in (-Wd/2, Wd/2-4):\n        g = cq.Workplane('YZ').polyline([(p.foot_t-0.5,\
    \ plate_t-0.5),(p.foot_t-0.5, plate_t+15),(p.foot_t+15, plate_t-0.5)]).close().extrude(4).translate((gx,0,0))\n\
    \        body = body.union(g)\n    pocket = cq.Workplane('XY').workplane(offset=-1).center(0,Hc).circle((p.bearing_od+p.press)/2).extrude(p.bearing_w+1)\n\
    \    lip = cq.Workplane('XY').workplane(offset=-1).center(0,Hc).circle(p.lip_hole_d/2).extrude(plate_t+2)\n\
    \    body = body.cut(pocket).cut(lip)\n    r5 = (p.m5_d+0.5)/2\n    a = p.adjust\n\
    \    zc = plate_t + p.foot_len/2\n    for bx in (-p.bscrew_x, p.bscrew_x):\n \
    \       for dz in (-a, a):\n            body = body.cut(cq.Solid.makeCylinder(r5,\
    \ p.foot_t+2, cq.Vector(bx,-1,zc+dz), cq.Vector(0,1,0)))\n        body = body.cut(cq.Solid.makeBox(2*r5,\
    \ p.foot_t+2, 2*a, cq.Vector(bx-r5,-1,zc-a)))\n    return body\n"
  print_orientation: face toward the arm on the bed, foot standing up (as modelled);
    bearing pocket opens onto the bed
  use_orientation: stands upright on the frame base, foot down and pointing away from
    the arm. Print X = world X, print Y = world height above the base top, print Z
    = world Y
- id: arm
  role: final
  material: PLA
  code: "def build(p):\n    c = p.clr\n    L = p.arm_len; w = p.arm_w; T = p.arm_t\n\
    \    body = cq.Workplane('XY').circle(p.hub_r).extrude(T)\n    body = body.union(cq.Workplane('XY').center(L/2,0).rect(L,w).extrude(T))\n\
    \    body = body.union(cq.Workplane('XY').center(L,0).circle(w/2).extrude(T))\n\
    \    depth = p.horn_hub_t - p.horn_standoff\n    hub = cq.Workplane('XY').workplane(offset=-1).circle(p.horn_hub_d/2+c).extrude(depth+1)\n\
    \    wr = p.horn_arm_w_root/2 + c; wt = p.horn_arm_w_tip/2 + c\n    xc = p.horn_reach\
    \ - p.horn_hub_d/2 - p.horn_arm_w_tip/2\n    armp = cq.Workplane('XY').workplane(offset=-1).polyline([(0,-wr),(xc,-wt),(xc,wt),(0,wr)]).close().extrude(depth+1)\n\
    \    tip = cq.Workplane('XY').workplane(offset=-1).center(xc,0).circle(wt).extrude(depth+1)\n\
    \    na = p.horn_hub_d/2 + 3\n    notch = cq.Workplane('XY').workplane(offset=-1).center(-na/2,0).rect(na,9).extrude(depth+1)\n\
    \    recess = cq.Workplane('XY').workplane(offset=depth-0.01).circle(p.horn_screw_head_d/2+0.5).extrude(p.horn_screw_head_h+0.5)\n\
    \    tiphole = cq.Workplane('XY').workplane(offset=-1).center(L,0).circle((p.m5_d+0.5)/2).extrude(T+2)\n\
    \    body = body.cut(hub).cut(armp).cut(tip).cut(notch).cut(recess).cut(tiphole)\n\
    \    collar = cq.Workplane('XY').workplane(offset=T-0.01).circle(p.collar_d/2).extrude(p.collar_h+0.01)\n\
    \    pin = cq.Workplane('XY').workplane(offset=T+p.collar_h-0.01).circle((p.bearing_bore-p.pin_clr)/2).extrude(p.bearing_w-0.5).faces('>Z').edges().chamfer(0.5)\n\
    \    return body.union(collar).union(pin)\n"
  print_orientation: horn-pocket face on the bed, pin pointing up
  use_orientation: vertical plane between servo and bearing upright, pocket facing
    the servo, pin in the bearing; pivot axis along world Y at height pivot_z
- id: coupon_hub
  role: coupon
  material: PLA
  code: "def build(p):\n    c = p.clr\n    L = 38.0; w = p.arm_w; T = p.arm_t\n  \
    \  body = cq.Workplane('XY').circle(p.hub_r).extrude(T)\n    body = body.union(cq.Workplane('XY').center(L/2,0).rect(L,w).extrude(T))\n\
    \    body = body.union(cq.Workplane('XY').center(L,0).circle(w/2).extrude(T))\n\
    \    depth = p.horn_hub_t - p.horn_standoff\n    hub = cq.Workplane('XY').workplane(offset=-1).circle(p.horn_hub_d/2+c).extrude(depth+1)\n\
    \    wr = p.horn_arm_w_root/2 + c; wt = p.horn_arm_w_tip/2 + c\n    xc = p.horn_reach\
    \ - p.horn_hub_d/2 - p.horn_arm_w_tip/2\n    armp = cq.Workplane('XY').workplane(offset=-1).polyline([(0,-wr),(xc,-wt),(xc,wt),(0,wr)]).close().extrude(depth+1)\n\
    \    tip = cq.Workplane('XY').workplane(offset=-1).center(xc,0).circle(wt).extrude(depth+1)\n\
    \    na = p.horn_hub_d/2 + 3\n    notch = cq.Workplane('XY').workplane(offset=-1).center(-na/2,0).rect(na,9).extrude(depth+1)\n\
    \    recess = cq.Workplane('XY').workplane(offset=depth-0.01).circle(p.horn_screw_head_d/2+0.5).extrude(p.horn_screw_head_h+0.5)\n\
    \    body = body.cut(hub).cut(armp).cut(tip).cut(notch).cut(recess)\n    collar\
    \ = cq.Workplane('XY').workplane(offset=T-0.01).circle(p.collar_d/2).extrude(p.collar_h+0.01)\n\
    \    pin = cq.Workplane('XY').workplane(offset=T+p.collar_h-0.01).circle((p.bearing_bore-p.pin_clr)/2).extrude(p.bearing_w-0.5).faces('>Z').edges().chamfer(0.5)\n\
    \    return body.union(collar).union(pin)\n"
  print_orientation: pocket face on the bed, pin up
  use_orientation: 'handheld test: horn into pocket, pin into bearing'
- id: coupon_bearing
  role: coupon
  material: PLA
  code: "def build(p):\n    plate_t = p.bearing_w + p.lip_t\n    body = cq.Workplane('XY').box(32,\
    \ 32, plate_t, centered=False).translate((-16,-16,0))\n    pocket = cq.Workplane('XY').workplane(offset=-1).circle((p.bearing_od+p.press)/2).extrude(p.bearing_w+1)\n\
    \    lip = cq.Workplane('XY').workplane(offset=-1).circle(p.lip_hole_d/2).extrude(plate_t+2)\n\
    \    return body.cut(pocket).cut(lip)\n"
  print_orientation: pocket opening on the bed (same as bearing_upright)
  use_orientation: 'handheld test: press the 608 in'
