criteria:
- id: c_spline
  part: arm
  feature: spline press bore
  relation: engages
  hardware: null
  clearance_mm: null
  params: []
  check:
    method: coupon
    ref: fit_coupon
    description: Press the coupon's small bore onto the servo spline; it should grip
      firmly and resist twisting by hand. If too tight, reprint with spline_bore_d
      = 5.9 mm; if too loose, reprint at 5.6 mm.
- id: c_bearing
  part: arm
  feature: bearing pocket
  relation: seats
  hardware: null
  clearance_mm: null
  params: []
  check:
    method: coupon
    ref: fit_coupon
    description: Press the 608ZZ into the coupon's 22.2 mm pocket; it should be snug
      but installable by hand or with a light press.
- id: c_axle
  part: base_bracket
  feature: M8 self-tap axle hole
  relation: engages
  hardware: screw_m8x30
  clearance_mm: null
  params: []
  check:
    method: none
    ref: null
    description: The M8x30 bolt should thread into the right upright and hold firmly
      without splitting it.
- id: c_boss
  part: base_bracket
  feature: servo boss clearance hole
  relation: clears
  hardware: null
  clearance_mm: null
  params: []
  check:
    method: none
    ref: null
    description: The servo output boss and spline should pass through the 16 mm panel
      hole into the gap without rubbing.
manual:
- n: '1'
  text: Print fit_coupon first. Press its small bore onto the servo output spline
    and press the 608ZZ bearing into its large pocket. Adjust spline_bore_d or bearing_pocket_d
    and reprint only the coupon if needed before printing arm.
  parts:
  - fit_coupon
  hardware: []
  tool: null
- n: '2'
  text: Press the 608ZZ bearing into the arm's 22.2 mm pocket on the axle-side face
    until it is flush.
  parts:
  - arm
  hardware: []
  tool: null
- n: '3'
  text: Snip or sand the two small moulding ribs on the servo's mounting tabs so the
    tabs can sit flat. Slide one M4 washer and one M4x12 screw into one open U-slot
    on each tab.
  parts: []
  hardware:
  - screw_m4x12
  - washer_m4
  tool: null
- n: '4'
  text: Offer the servo up to the recessed panel on the left upright, passing the
    two M4x12 screws through the two panel slots. On the gap side, fit an M4 washer
    and M4 nut on each screw and tighten.
  parts:
  - base_bracket
  hardware:
  - screw_m4x12
  - washer_m4
  - nut_m4
  tool: null
- n: '5'
  text: Press the arm's spline bore firmly onto the servo output spline until it grips.
    The arm should now swing in the gap between the uprights.
  parts:
  - arm
  hardware: []
  tool: null
- n: '6'
  text: Slide pivot_sleeve onto the M8x30 bolt, then insert the bolt through the right
    upright from the outside. Keep turning so the bolt self-taps and passes through
    the sleeve and into the arm's bearing; stop when it seats. Do not overtighten;
    the arm must swing freely by hand.
  parts:
  - pivot_sleeve
  hardware:
  - screw_m8x30
  tool: null
- n: '7'
  text: Check the arm pivots smoothly through its range. Power the servo to swing
    it both ways. If the spline fit slips under load, use the servo's own hub screw
    (not supplied) or a drop of CA glue in the spline socket.
  parts: []
  hardware: []
  tool: null
