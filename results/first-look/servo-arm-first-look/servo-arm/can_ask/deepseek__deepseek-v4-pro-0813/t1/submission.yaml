task: servo-arm
note: 'First-prototype single-joint arm: the MG996R drives the arm directly through
  a printed 25T spline press-fit socket, and a 608 bearing on the opposite side supports
  the joint on an M8 axle. The servo-shaft stick-out past the mounting face was not
  measurable, so it is guessed at 6.0 mm; the printed fit_coupon lets the user verify
  spline grip and bearing fit before printing the full parts, and spline_bore_d can
  be adjusted (5.9 mm for a looser fit) if needed.'
