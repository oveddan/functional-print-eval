parts:
- id: base_bracket
  role: final
  material: PLA
  code: "def build(p):\n    z0 = p.base_floor_t\n    h = p.upright_h\n    span = p.servo_tab_span\n\
    \    fx = p.uw_t_left + p.gap + p.uw_t_right + p.floor_extra_left + p.floor_extra_right\n\
    \    floor_cx = -(p.uw_t_left + p.floor_extra_left) + fx/2.0\n    part = (cq.Workplane(\"\
    XY\").box(fx, p.floor_y, p.base_floor_t)\n            .translate((floor_cx, 0,\
    \ p.base_floor_t/2.0)))\n    part = part.union((cq.Workplane(\"XY\").box(p.uw_t_left,\
    \ p.upright_y, h)\n                       .translate((-p.uw_t_left/2.0, 0, z0\
    \ + h/2.0))))\n    part = part.union((cq.Workplane(\"XY\").box(p.uw_t_right, p.upright_y,\
    \ h)\n                       .translate((p.gap + p.uw_t_right/2.0, 0, z0 + h/2.0))))\n\
    \    recess_depth = p.uw_t_left - p.panel_t\n    part = part.cut((cq.Workplane(\"\
    XY\").box(recess_depth + 0.1, p.panel_w, p.panel_h)\n                     .translate((-p.uw_t_left\
    \ + recess_depth/2.0, 0, p.pivot_z))))\n    part = part.cut((cq.Workplane(\"YZ\"\
    ).workplane(offset=-p.panel_t)\n                     .center(0, p.pivot_z).circle(p.servo_boss_clear_d/2.0)\n\
    \                     .extrude(p.panel_t + 0.5)))\n    for zc in (p.pivot_z +\
    \ span/2.0, p.pivot_z - span/2.0):\n        part = part.cut((cq.Workplane(\"YZ\"\
    ).workplane(offset=-p.panel_t)\n                         .center(0, zc).rect(p.m4_slot_w,\
    \ p.m4_slot_len)\n                         .extrude(p.panel_t + 0.5)))\n    part\
    \ = part.cut((cq.Workplane(\"YZ\").workplane(offset=p.gap)\n                 \
    \    .center(0, p.pivot_z).circle(p.m8_self_tap_d/2.0)\n                     .extrude(p.uw_t_right\
    \ + 0.5)))\n    return part"
  print_orientation: Large floor face on the bed, uprights pointing straight up (z=0
    is the floor's bottom face).
  use_orientation: 'As printed: floor sits on the desk; the left upright faces the
    servo side, the right upright faces the M8 axle side.'
- id: arm
  role: final
  material: PLA
  code: "def build(p):\n    blk = (cq.Workplane(\"XY\").box(p.arm_x_t, p.arm_block_d,\
    \ p.arm_block_h)\n           .translate((p.arm_x_t/2.0, 0, p.arm_block_h/2.0)))\n\
    \    beam = (cq.Workplane(\"XY\").box(p.arm_beam_w, p.arm_beam_len, p.arm_beam_t)\n\
    \            .translate((p.arm_x_t/2.0, p.arm_block_d/2.0 + p.arm_beam_len/2.0,\
    \ p.arm_beam_t/2.0)))\n    part = blk.union(beam)\n    part = part.cut((cq.Workplane(\"\
    YZ\").workplane(offset=0)\n                     .center(0, p.arm_axis_z).circle(p.spline_bore_d/2.0)\n\
    \                     .extrude(p.spline_bore_len)))\n    clr_len = p.bearing_pocket_start\
    \ - p.spline_bore_len\n    part = part.cut((cq.Workplane(\"YZ\").workplane(offset=p.spline_bore_len)\n\
    \                     .center(0, p.arm_axis_z).circle(p.axle_clear_d/2.0)\n  \
    \                   .extrude(clr_len)))\n    part = part.cut((cq.Workplane(\"\
    YZ\").workplane(offset=p.bearing_pocket_start)\n                     .center(0,\
    \ p.arm_axis_z).circle(p.bearing_pocket_d/2.0)\n                     .extrude(p.arm_x_t\
    \ - p.bearing_pocket_start)))\n    return part"
  print_orientation: 'Flat: beam bottom and root-block bottom on the bed (z=0). The
    spline bore and bearing pocket print as sideways holes.'
  use_orientation: As printed (no flip). Servo-side face (small spline bore) toward
    the servo; the M8 axle enters the bearing pocket on the opposite face.
- id: pivot_sleeve
  role: final
  material: PLA
  code: "def build(p):\n    return (cq.Workplane(\"XY\").circle(p.sleeve_od/2.0).circle(p.sleeve_id/2.0)\n\
    \            .extrude(p.sleeve_len))"
  print_orientation: Standing on one flat end (tube axis vertical, z=0 on the bed).
  use_orientation: Slips over the M8 bolt between the arm's bearing and the right
    upright, setting the arm's axial position.
- id: fit_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    L = 20.0\n    part = (cq.Workplane(\"XY\").box(L, 30.0,\
    \ 26.0).translate((L/2.0, 0, 13.0)))\n    part = part.cut((cq.Workplane(\"YZ\"\
    ).workplane(offset=0)\n                     .center(0, 13).circle(p.spline_bore_d/2.0)\n\
    \                     .extrude(p.spline_bore_len)))\n    part = part.cut((cq.Workplane(\"\
    YZ\").workplane(offset=p.spline_bore_len)\n                     .center(0, 13).circle(p.axle_clear_d/2.0)\n\
    \                     .extrude(p.bearing_pocket_start - p.spline_bore_len)))\n\
    \    part = part.cut((cq.Workplane(\"YZ\").workplane(offset=L - p.bearing_w)\n\
    \                     .center(0, 13).circle(p.bearing_pocket_d/2.0)\n        \
    \             .extrude(p.bearing_w)))\n    return part"
  print_orientation: Flat on its large bottom face.
  use_orientation: 'Test block: press the small bore onto the servo spline; press
    the 608 bearing into the large pocket.'
