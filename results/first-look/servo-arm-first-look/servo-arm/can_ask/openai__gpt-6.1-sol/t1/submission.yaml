task: servo-arm
note: 'Measurement-gated V1: a 100 mm, single-axis, unloaded robot-arm demonstrator.
  Intended travel is approximately +/-60 degrees, subject to testing the actual servo.
  NOT fabrication-ready: null parameters must be measured before the final parts can
  be generated. The bearing coupon can be generated immediately using explicitly provisional
  catalog bearing dimensions. No payload rating or verified torque capability is claimed.
  The aluminium horn is captured between the arm and keeper; the bearing and axial
  screw retain the moving assembly so no unlisted servo screw is required. This arrangement
  is conditional on sufficient clearance below the seated horn. Do not substitute
  guessed spline geometry. CAD has not been executed or physically tested here.'
questions:
- text: 'Shaft-up servo: shaft center to nearest short end, and to a long side?'
  answer: null
- text: Actual center-to-center mounting-hole spacing along and across the case?
  answer: 44.61 mm was an inside-edge measurement, not a verified center-to-center
    measurement; across-case spacing is missing.
- text: Case bottom to mounting-tab underside, and case top to top of fully seated
    aluminium horn?
  answer: null
- text: Maximum aluminium horn arm width, including its root, and diameter of any
    servo boss immediately underneath it?
  answer: null
- text: Bearing OD measured squarely, bore, and width?
  answer: Square OD and width were not supplied. Catalog 22 x 8 x 7 mm is provisional;
    the earlier 21.22 mm OD reading is not used.
