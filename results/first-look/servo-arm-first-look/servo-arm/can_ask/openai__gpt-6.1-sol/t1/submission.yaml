parts:
- id: bearing_coupon
  role: coupon
  material: PLA
  code: "def build(p):\n    s=cq.Workplane('XY').box(34,34,p.bearing_shoulder+p.bearing_w,centered=(True,True,False))\n\
    \    s=s.cut(cq.Workplane('XY').circle(p.bearing_window/2).extrude(p.bearing_shoulder+p.bearing_w))\n\
    \    return s.cut(cq.Workplane('XY').workplane(offset=p.bearing_shoulder).circle((p.bearing_od+p.bearing_fit)/2).extrude(p.bearing_w+1))"
  print_orientation: Flat square underside on bed; bearing pocket opens upward. No
    support.
  use_orientation: Bench fit test only; not part of the assembled arm.
- id: base
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    required=['shaft_x','shaft_y','tab_pitch_x','tab_pitch_y','tab_z','horn_top','servo_boss_d','horn_w']\n\
    \    for k in required:\n        if getattr(p,k) is None: raise ValueError('Measure\
    \ parameter before fabrication: '+k)\n    if p.horn_w+p.horn_fit>17: raise ValueError('Horn\
    \ wider than this keeper design; redesign required')\n    if p.servo_boss_d+p.case_fit>=p.horn_hub_d-2:\
    \ raise ValueError('Insufficient keeper lip around boss')\n    if p.horn_top-p.horn_hub_h-p.keeper_floor<p.running_gap:\
    \ raise ValueError('Keeper would hit servo roof; redesign required')\n    if not\
    \ (p.deck_t+8 < p.tab_z < p.servo_h-p.tab_t): raise ValueError('Tab height incompatible\
    \ with deck')\n    H=p.floor_t+p.servo_h+p.horn_top\n    bridge_z=H+p.arm_t+p.boss_h-p.bearing_shoulder\n\
    \    cx=p.servo_l/2-p.shaft_x; cy=p.servo_w/2-p.shaft_y\n    dx=p.servo_l+24;\
    \ dy=p.servo_w+24\n    s=cq.Workplane('XY').center(-1,0).box(118,100,p.floor_t,centered=(True,True,False))\n\
    \    dz=p.floor_t+p.tab_z-p.deck_t\n    deck=cq.Workplane('XY').workplane(offset=dz).center(cx,cy).box(dx,dy,p.deck_t,centered=(True,True,False))\n\
    \    opening=cq.Workplane('XY').center(cx,cy).box(p.servo_l+p.case_fit,p.servo_w+p.case_fit,H,centered=(True,True,False))\n\
    \    deck=deck.cut(opening)\n    # Four feet lie under deck corners, not the servo\
    \ body.\n    for x in [cx-dx/2+4,cx+dx/2-4]:\n        for y in [cy-dy/2+4,cy+dy/2-4]:\n\
    \            s=s.union(cq.Workplane('XY').center(x,y).box(8,8,dz+p.deck_t,centered=(True,True,False)))\n\
    \    s=s.union(deck)\n    for x in [cx-p.tab_pitch_x/2,cx+p.tab_pitch_x/2]:\n\
    \        for y in [cy-p.tab_pitch_y/2,cy+p.tab_pitch_y/2]:\n            if abs(x-cx)>dx/2-5\
    \ or abs(y-cy)>dy/2-5: raise ValueError('Tab holes outside deck; redesign')\n\
    \            if abs(x-cx)<(p.servo_l+p.case_fit)/2+4: raise ValueError('Insufficient\
    \ deck around tab hole')\n            s=s.cut(cq.Workplane('XY').workplane(offset=dz-1).center(x,y).circle(p.m4_clear/2).extrude(p.deck_t+2))\n\
    \    for y in [-p.post_y,p.post_y]:\n        post=cq.Workplane('XY').center(p.post_x,y).box(p.post_size,p.post_size,bridge_z,centered=(True,True,False))\n\
    \        post=post.cut(cq.Workplane('XY').workplane(offset=bridge_z-13).center(p.post_x,y).circle(p.m4_clear/2).extrude(14))\n\
    \        # Side-loading, antirotation nut slot; roof remains above the nut.\n\
    \        af=p.m4_nut_af+p.nut_fit; nh=p.m4_nut_h+p.nut_depth_extra\n        slot=cq.Workplane('XY').workplane(offset=bridge_z-3-nh).center(p.post_x+p.post_size/4,y).box(p.post_size,af,nh,centered=(True,True,False))\n\
    \        post=post.cut(slot)\n        s=s.union(post)\n    return s"
  print_orientation: Large flat base on bed, shaft axis vertical. Enable painted supports
    under the raised servo deck only; keep nut access slots open.
  use_orientation: Base horizontal. Servo output axis at global X=0,Y=0. Horn points
    +X at neutral. Rear posts at negative X.
- id: arm
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    s=cq.Workplane('XY').circle(p.root_r).extrude(p.arm_t)\n\
    \    s=s.union(cq.Workplane('XY').center(p.arm_length/2,0).box(p.arm_length,p.arm_width,p.arm_t,centered=(True,True,False)))\n\
    \    s=s.union(cq.Workplane('XY').center(p.arm_length,0).circle(p.arm_width/2).extrude(p.arm_t))\n\
    \    s=s.union(cq.Workplane('XY').workplane(offset=p.arm_t).circle(p.boss_d/2).extrude(p.boss_h))\n\
    \    s=s.union(cq.Workplane('XY').workplane(offset=p.arm_t+p.boss_h).circle((p.bearing_id-p.journal_clearance)/2).extrude(p.bearing_w))\n\
    \    total=p.arm_t+p.boss_h+p.bearing_w\n    s=s.cut(cq.Workplane('XY').circle(p.m3_clear/2).extrude(total+1))\n\
    \    nd=p.m3_nut_h+p.nut_depth_extra\n    # Central nut loads from underside and\
    \ becomes captive against horn top.\n    s=s.cut(cq.Workplane('XY').polygon(6,2*(p.m3_nut_af+p.nut_fit)/math.sqrt(3)).extrude(nd))\n\
    \    for x in [-p.clamp_x,p.clamp_x]:\n        for y in [-p.clamp_y,p.clamp_y]:\n\
    \            s=s.cut(cq.Workplane('XY').center(x,y).circle(p.m3_clear/2).extrude(p.arm_t+1))\n\
    \            s=s.cut(cq.Workplane('XY').workplane(offset=p.arm_t-nd).center(x,y).polygon(6,2*(p.m3_nut_af+p.nut_fit)/math.sqrt(3)).extrude(nd+1))\n\
    \    return s.cut(cq.Workplane('XY').center(p.arm_length,0).circle(p.m4_clear/2).extrude(p.arm_t+1))"
  print_orientation: Broad flat arm underside on bed; journal points up. No supports;
    small underside hex pocket bridges less than 7 mm.
  use_orientation: Flat underside contacts horn top. Arm points +X at neutral. Bearing
    journal above arm. Tip hole center 100 mm from pivot.
- id: horn_keeper
  role: final
  material: PLA
  code: "def build(p):\n    if p.horn_w is None or p.servo_boss_d is None: raise ValueError('Measure\
    \ horn_w and servo_boss_d first')\n    if p.horn_w+p.horn_fit>17 or p.servo_boss_d+p.case_fit>=p.horn_hub_d-2:\
    \ raise ValueError('Horn/boss incompatible; redesign')\n    tip=p.horn_far_edge_to_tip-p.horn_hub_d/2\n\
    \    t=p.keeper_floor+p.horn_hub_h\n    s=cq.Workplane('XY').circle(p.root_r).extrude(t)\n\
    \    s=s.union(cq.Workplane('XY').center((tip+6)/2,0).box(tip+6,32,t,centered=(True,True,False)))\n\
    \    s=s.cut(cq.Workplane('XY').workplane(offset=p.keeper_floor).circle((p.horn_hub_d+p.horn_fit)/2).extrude(p.horn_hub_h+1))\n\
    \    s=s.cut(cq.Workplane('XY').workplane(offset=t-p.horn_arm_h).center((tip+p.horn_fit)/2,0).box(tip+p.horn_fit,p.horn_w+p.horn_fit,p.horn_arm_h+1,centered=(True,True,False)))\n\
    \    s=s.cut(cq.Workplane('XY').circle((p.servo_boss_d+p.case_fit)/2).extrude(t+1))\n\
    \    for x in [-p.clamp_x,p.clamp_x]:\n        for y in [-p.clamp_y,p.clamp_y]:\n\
    \            s=s.cut(cq.Workplane('XY').center(x,y).circle(p.m3_clear/2).extrude(t+1))\n\
    \    return s"
  print_orientation: Flat underside on bed; horn-shaped recess opens upward. No support.
  use_orientation: Below arm, recess facing up. Horn hub and single arm sit inside
    recess. Keeper bottom must clear all stationary servo surfaces.
- id: bearing_bridge
  role: final
  material: PLA
  code: "def build(p):\n    s=cq.Workplane('XY').circle(24).extrude(p.bridge_t)\n\
    \    s=s.union(cq.Workplane('XY').polyline([(-55,-43),(-55,43),(0,24),(0,-24)]).close().extrude(p.bridge_t))\n\
    \    s=s.cut(cq.Workplane('XY').circle(p.bearing_window/2).extrude(p.bridge_t+1))\n\
    \    s=s.cut(cq.Workplane('XY').workplane(offset=p.bearing_shoulder).circle((p.bearing_od+p.bearing_fit)/2).extrude(p.bridge_t))\n\
    \    for y in [-p.post_y,p.post_y]:\n        s=s.cut(cq.Workplane('XY').center(p.post_x,y).circle(p.m4_clear/2).extrude(p.bridge_t+1))\n\
    \        # Exposed counterbore permits short M4x16 fastener.\n        s=s.cut(cq.Workplane('XY').workplane(offset=4).center(p.post_x,y).circle((p.m4_washer_od+1)/2).extrude(p.bridge_t))\n\
    \    import math\n    nd=p.m3_nut_h+p.nut_depth_extra\n    for x in [-p.ring_screw_x,p.ring_screw_x]:\n\
    \        s=s.cut(cq.Workplane('XY').center(x,0).circle(p.m3_clear/2).extrude(p.bridge_t+1))\n\
    \        s=s.cut(cq.Workplane('XY').center(x,0).polygon(6,2*(p.m3_nut_af+p.nut_fit)/math.sqrt(3)).extrude(nd))\n\
    \    return s"
  print_orientation: Broad underside on bed, bearing seat and M4 counterbores open
    upward. No support.
  use_orientation: 'Mount above moving arm on two rear posts. Bottom height: floor_t
    + servo_h + horn_top + arm_t + boss_h - bearing_shoulder. Bearing drops into top
    pocket.'
- id: bearing_ring
  role: final
  material: PLA
  code: "def build(p):\n    s=cq.Workplane('XY').circle(22).extrude(p.ring_t)\n  \
    \  s=s.cut(cq.Workplane('XY').circle(7).extrude(p.ring_t+1))\n    for x in [-p.ring_screw_x,p.ring_screw_x]:\n\
    \        s=s.cut(cq.Workplane('XY').center(x,0).circle(p.m3_clear/2).extrude(p.ring_t+1))\n\
    \    return s"
  print_orientation: Flat face on bed. No support.
  use_orientation: On top of bearing bridge; central opening leaves inner race and
    axial screw accessible. Retains bearing outer ring only.
