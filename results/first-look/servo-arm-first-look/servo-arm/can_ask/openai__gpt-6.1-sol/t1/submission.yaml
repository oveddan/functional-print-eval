manual:
- n: '1'
  text: 'Resolve every null parameter before generating final CAD. Measure the servo
    shaft offsets, mounting-tab centers and height, seated-horn height, stationary
    boss diameter and horn arm width. Confirm the aluminium horn actually seats on
    this servo: a 25-tooth label and a 5.84 mm spline diameter do not establish compatibility.
    If it does not fit, stop; do not press it on or print a spline substitute.'
  parts: []
  hardware: []
  tool: null
- n: '2'
  text: Remeasure bearing OD, bore and width. Print bearing_coupon in PLA, 0.2 mm
    layers, and test the bearing. Adjust bearing_fit if needed. The nominal 22 x 8
    x 7 mm values are not new measurements.
  parts:
  - bearing_coupon
  hardware: []
  tool: Calipers
- n: '3'
  text: Enter the measured values and generate CAD. Any ValueError is a stop condition
    requiring measurement or redesign, not a reason to disable the check. Confirm
    the horn can be enclosed with a 3 mm keeper floor below it while maintaining 0.4
    mm clearance from the servo roof. If not, this architecture does not fit your
    servo/horn combination.
  parts:
  - base
  - horn_keeper
  hardware: []
  tool: null
- n: '4'
  text: Inspect generated assembly virtually before printing. Print a thin deck-only
    mounting template first; verify the four tab holes and body opening against the
    servo. Confirm cable routing; reposition or relieve the base only after measuring
    the cable exit. Ensure deck feet do not conflict with tabs or cable.
  parts:
  - base
  hardware: []
  tool: Slicer and calipers
- n: '5'
  text: Print final PLA parts with 5 walls, 6 top/bottom layers and about 40% infill.
    All fit within 256 mm build volume. Use painted supports under the raised base
    deck, and remove them completely. Other parts print flat without supports; no
    required unsupported bridge approaches 50 mm. Deburr holes and pockets, but do
    not aggressively sand the bearing seat or journal.
  parts:
  - base
  - arm
  - horn_keeper
  - bearing_bridge
  - bearing_ring
  hardware: []
  tool: null
- n: '6'
  text: Unpowered, place servo case through the deck aperture so its bottom rests
    on the base. Mount all four tabs with M4x16 screws, a washer above each tab, another
    under the deck and M4 nuts. Washers must fully cover the U-slot openings. Tighten
    gently; do not crush the tabs. Case must not rock, and wire must not be pinched.
  parts:
  - base
  hardware:
  - servo_tab_bolts
  - servo_tab_nuts
  - servo_tab_washers
  tool: Hex key and nut wrench
- n: '7'
  text: Insert the central M3 nut into the arm's underside pocket. Put the aluminium
    horn into the keeper recess, top face flush with the rim, pointing +X. Lay arm
    on top. Fit the four M3x20 screws upward from keeper underside with M3 washers
    and the four nuts in the arm's top pockets. Tighten evenly just until the horn
    is captive and cannot rock. Verify the axial screw will have full thread engagement
    and its tip can enter the horn's central opening without bottoming; otherwise
    stop and revise the stack.
  parts:
  - arm
  - horn_keeper
  hardware:
  - keeper_bolts
  - keeper_nuts
  - keeper_washers
  - axial_nut
  tool: Hex key
- n: '8'
  text: Insert two M4 nuts into the rear-post side slots. Insert the two M3 ring nuts
    into the bridge underside pockets before installation. Place bearing in bridge
    seat. Verify it is flush and seated squarely. Add bearing_ring with the two M3x16
    screws and washers, tightening only enough to retain the outer race.
  parts:
  - base
  - bearing_bridge
  - bearing_ring
  hardware:
  - bridge_nuts
  - ring_nuts
  - ring_bolts
  - ring_washers
  tool: Hex key
- n: '9'
  text: With the horn OFF the servo spline, trial-fit arm journal through the bearing.
    Add the M5 washer directly on the bearing inner race, the M3 washer above it,
    then M3x20 axial screw into the captive central nut. Verify boss and washer touch
    inner race only and joint turns freely without axial wobble. No screw tip may
    bottom against the horn. Remove this trial assembly as necessary to install at
    neutral.
  parts:
  - arm
  - horn_keeper
  - bearing_bridge
  hardware:
  - axial_bolt
  - axial_small_washer
  - axial_large_washer
  - axial_nut
  tool: Hex key
- n: '10'
  text: You must already have an appropriate servo controller and rated external servo
    power supply; they are not supplied or specified here. Never power the servo from
    a controller's small logic regulator. With horn removed, command a conservative
    center position, then disconnect power. Seat the captured horn/arm assembly at
    +X. Lower bridge onto the journal without side force and fasten bridge to posts
    with M4x16 screws and washers in its counterbores. Install the axial retainer
    stack as tested. The completed bearing/keeper assembly, not an unlisted center
    screw, prevents horn lift-off.
  parts:
  - base
  - arm
  - horn_keeper
  - bearing_bridge
  hardware:
  - bridge_bolts
  - bridge_washers
  - bridge_nuts
  - axial_bolt
  - axial_small_washer
  - axial_large_washer
  tool: Hex key
- n: '11'
  text: 'Keep fingers clear and stabilize the broad base on the bench. Test unloaded
    with small movements around neutral, expanding gradually only if no binding, rubbing
    or horn lift occurs. The claimed 120-degree range is unverified: do not force
    +/-60 degrees or run to mechanical stops. Do not manually back-drive a powered
    servo. Disconnect immediately for buzzing, heat, unexpected motion or increasing
    bearing drag. Posts are behind the pivot; operation outside the intended forward
    +/-60-degree sector can cause a collision.'
  parts:
  - base
  - arm
  - horn_keeper
  - bearing_bridge
  - bearing_ring
  hardware: []
  tool: null
- n: '12'
  text: Use only for a lightweight first-motion demonstration, not lifting or a safety-critical
    robot. The distal 4.5 mm clearance hole is centered 100 mm from the pivot; no
    payload attachment is specified. Recheck screws and PLA for cracks or creep after
    each short test, and keep away from heat.
  parts:
  - arm
  hardware: []
  tool: null
