manual:
- n: '1'
  text: 'Print base, strap_a, strap_b, arm and the small horn_fit coupon (PLA, 0.2
    mm layers, 4 walls, about 20% infill). Orientations: base flat on its bottom;
    straps with the flat top on the bed (recess up); arm top face on the bed with
    cheeks pointing up.'
  parts:
  - base
  - strap_a
  - strap_b
  - arm
  - horn_fit
  hardware: []
  tool: null
- n: '2'
  text: Before anything else, press the horn_fit coupon onto the aluminium single-arm
    horn. The hub should drop into the round pocket and the horn arm lie in the channel
    with little side play. If the arm is much narrower or wider than the channel,
    or longer than it, stop and tell me so I can adjust horn_slot_w and horn_reach.
  parts:
  - horn_fit
  hardware: []
  tool: null
- n: '3'
  text: Drop one M4 nut into each of the four hex pockets on the top of the base.
  parts:
  - base
  hardware:
  - m4_nut
  tool: null
- n: '4'
  text: Lower the MG996R into the base pocket, shaft up, with the shaft end at the
    end you want the arm to point away from. Its bottom rests on the table and the
    tabs rest on the base top.
  parts:
  - base
  hardware: []
  tool: null
- n: '5'
  text: Flip a strap so its recess faces down over a servo tab, with the feet on the
    base top. Fasten with two M4x16 bolts into the nuts. Snug them evenly; do not
    crush the tab. Repeat for the other strap.
  parts:
  - strap_a
  - strap_b
  hardware:
  - m4_bolt
  tool: 3 mm hex key
- n: '6'
  text: Power the servo to its centre position (90 degrees). Fit the aluminium horn
    on the spline with its arm pointing straight away from the servo body, along the
    servo's long axis.
  parts: []
  hardware: []
  tool: null
- n: '7'
  text: Turn the arm over (cheeks down) and press it onto the horn so the hub sits
    in the pocket and the horn arm lies in the channel. Fix it with the M3x12 screw
    through the counterbore into the shaft thread.
  parts:
  - arm
  hardware:
  - m3_screw
  tool: 2.5 mm hex key
- n: '8'
  text: 'Build the roller: bolt M8x35 through a washer, one cheek slot, a washer,
    the 608 bearing, a washer, the other cheek slot, a washer, and thread on the M8
    lock nut. Set the bolt height in the slot so the bearing just touches the table
    (the base and servo sit on the same table), then tighten the lock nut firmly.
    The bore is tight on the M8 thread; turn the bearing on rather than forcing it.'
  parts:
  - arm
  hardware:
  - m8_bolt
  - m8_washer
  - m8_locknut
  tool: 13 mm spanner, 6 mm hex key
- n: '9'
  text: 'Check the swing by hand-turning (power off) 90 degrees each way: the bar
    should clear the servo and straps, and the roller should roll sideways on the
    table. Then test with the servo.'
  parts: []
  hardware: []
  tool: null
