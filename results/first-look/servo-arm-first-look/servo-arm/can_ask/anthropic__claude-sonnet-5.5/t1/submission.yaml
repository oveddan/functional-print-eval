parts:
- id: base
  role: final
  material: PLA
  code: "def build(p):\n    import math\n    pw = p.servo_w + 2*p.fit_clear\n    pl\
    \ = p.servo_len + 2*p.fit_clear\n    H = p.servo_h - p.tab_top_to_case_top - p.tab_t\n\
    \    xh = pl/2 + p.strap_len + p.strap_pad\n    by = pw/2 + 5.5\n    yh = by +\
    \ 5.5 + p.strap_pad\n    body = cq.Workplane('XY').box(2*xh, 2*yh, H, centered=(True,\
    \ True, False))\n    pocket = cq.Workplane('XY').box(pl, pw, H+2, centered=(True,\
    \ True, False)).translate((0,0,-1))\n    body = body.cut(pocket)\n    nutD = (p.m4_nut_af\
    \ + p.nut_clear)/math.cos(math.radians(30))\n    for sx in (-1, 1):\n        for\
    \ sy in (-1, 1):\n            x = sx*(pl/2 + p.strap_len/2)\n            y = sy*by\n\
    \            nut = cq.Workplane('XY').workplane(offset=H - p.m4_nut_h - 0.2).center(x,\
    \ y).polygon(6, nutD).extrude(p.m4_nut_h + 1)\n            hole = cq.Workplane('XY').workplane(offset=H\
    \ - 10).center(x, y).circle(p.m4_hole_d/2).extrude(11)\n            body = body.cut(nut).cut(hole)\n\
    \    return body\n"
  print_orientation: bottom face flat on bed, pocket vertical
  use_orientation: same, on the table; servo drops in from the top and hangs with
    its bottom on the table
- id: strap_a
  role: final
  material: PLA
  code: "def build(p):\n    pw = p.servo_w + 2*p.fit_clear\n    by = pw/2 + 5.5\n\
    \    t = p.tab_t + p.rib_h - p.strap_press + p.strap_top_t\n    s = cq.Workplane('XY').box(p.strap_len,\
    \ 2*(by+5.5), t, centered=(True, True, False))\n    rec = cq.Workplane('XY').box(p.strap_len+2,\
    \ pw, t - p.strap_top_t + 1, centered=(True, True, False)).translate((0,0,p.strap_top_t))\n\
    \    s = s.cut(rec)\n    for sy in (-1, 1):\n        h = cq.Workplane('XY').workplane(offset=-1).center(0,\
    \ sy*by).circle(p.m4_hole_d/2).extrude(t+2)\n        s = s.cut(h)\n    return\
    \ s\n"
  print_orientation: top face (bolt-head side) on bed, recess facing up
  use_orientation: 'flipped: lies over the front servo tab, feet on base top'
- id: strap_b
  role: final
  material: PLA
  code: "def build(p):\n    pw = p.servo_w + 2*p.fit_clear\n    by = pw/2 + 5.5\n\
    \    t = p.tab_t + p.rib_h - p.strap_press + p.strap_top_t\n    s = cq.Workplane('XY').box(p.strap_len,\
    \ 2*(by+5.5), t, centered=(True, True, False))\n    rec = cq.Workplane('XY').box(p.strap_len+2,\
    \ pw, t - p.strap_top_t + 1, centered=(True, True, False)).translate((0,0,p.strap_top_t))\n\
    \    s = s.cut(rec)\n    for sy in (-1, 1):\n        h = cq.Workplane('XY').workplane(offset=-1).center(0,\
    \ sy*by).circle(p.m4_hole_d/2).extrude(t+2)\n        s = s.cut(h)\n    return\
    \ s\n"
  print_orientation: top face (bolt-head side) on bed, recess facing up
  use_orientation: 'flipped: lies over the rear servo tab, feet on base top'
- id: arm
  role: final
  material: PLA
  code: "def build(p):\n    def bx(x0, x1, y0, y1, z0, z1):\n        return cq.Workplane('XY').box(x1-x0,\
    \ y1-y0, z1-z0, centered=False).translate((x0, y0, z0))\n    pocket_d = p.horn_hub_d\
    \ + 0.4\n    pocket_depth = p.horn_hub_h - 0.2\n    arm_h = pocket_depth + p.arm_web\n\
    \    L = p.arm_len\n    g = p.bearing_w + 2*p.m8_washer_t + 0.2\n    ct = p.cheek_t\n\
    \    arm_bottom_height = p.servo_h + p.shaft_boss_h + p.horn_gap\n    drop = arm_bottom_height\
    \ - p.plate_clear\n    top = arm_h + drop\n    a = bx(0, L, -p.arm_w/2, p.arm_w/2,\
    \ 0, arm_h)\n    a = a.union(cq.Workplane('XY').circle(p.arm_w/2).extrude(arm_h))\n\
    \    a = a.union(bx(L-g/2-ct, L+g/2+ct, -p.cheek_w/2, p.cheek_w/2, 0, arm_h))\n\
    \    a = a.union(bx(L-g/2-ct, L-g/2, -p.cheek_w/2, p.cheek_w/2, 0, top))\n   \
    \ a = a.union(bx(L+g/2, L+g/2+ct, -p.cheek_w/2, p.cheek_w/2, 0, top))\n    # open-ended\
    \ vertical adjustment slot for the M8 axle through both cheeks\n    zc = top -\
    \ p.slot_travel\n    x0 = L - g/2 - ct - 1\n    ln = g + 2*ct + 2\n    gapcut\
    \ = bx(L-g/2, L+g/2, -p.cheek_w, p.cheek_w, arm_h, top+1)\n    slot = cq.Workplane('YZ').workplane(offset=x0).center(0,\
    \ (zc+top+1)/2).rect(p.m8_slot_w, top+1-zc).extrude(ln)\n    slotend = cq.Workplane('YZ').workplane(offset=x0).center(0,\
    \ zc).circle(p.m8_slot_w/2).extrude(ln)\n    a = a.cut(slot).cut(slotend)\n  \
    \  # horn pocket (opens upward in print) and channel for the horn arm\n    z0\
    \ = arm_h - pocket_depth\n    pk = cq.Workplane('XY').workplane(offset=z0).circle(pocket_d/2).extrude(pocket_depth+1)\n\
    \    ch = bx(0, p.horn_reach, -p.horn_slot_w/2, p.horn_slot_w/2, z0, arm_h+1)\n\
    \    a = a.cut(pk).cut(ch)\n    # central M3 screw hole + counterbore at the bed\
    \ face\n    hole = cq.Workplane('XY').workplane(offset=-1).circle(p.m3_hole_d/2).extrude(arm_h+2)\n\
    \    cb = cq.Workplane('XY').workplane(offset=-1).circle((p.m3_head_d+0.7)/2).extrude(p.m3_head_h\
    \ + 0.2 + 1)\n    a = a.cut(hole).cut(cb)\n    return a\n"
  print_orientation: top of arm (screw-head side) on bed; horn pocket and roller cheeks
    point up
  use_orientation: 'flipped: horizontal on the servo horn, cheeks hanging down at
    the tip; shaft axis at origin, arm along +x'
- id: horn_fit
  role: coupon
  material: PLA
  code: "def build(p):\n    pocket_d = p.horn_hub_d + 0.4\n    pocket_depth = p.horn_hub_h\
    \ - 0.2\n    arm_h = pocket_depth + p.arm_web\n    b = cq.Workplane('XY').box(34,\
    \ p.arm_w, arm_h, centered=False).translate((-10, -p.arm_w/2, 0))\n    z0 = arm_h\
    \ - pocket_depth\n    pk = cq.Workplane('XY').workplane(offset=z0).circle(pocket_d/2).extrude(pocket_depth+1)\n\
    \    ch = cq.Workplane('XY').box(24, p.horn_slot_w, pocket_depth+1, centered=False).translate((0,\
    \ -p.horn_slot_w/2, z0))\n    hole = cq.Workplane('XY').workplane(offset=-1).circle(p.m3_hole_d/2).extrude(arm_h+2)\n\
    \    return b.cut(pk).cut(ch).cut(hole)\n"
  print_orientation: flat, pocket facing up
  use_orientation: 'test only: press onto the aluminium horn to check hub pocket and
    arm channel fit'
