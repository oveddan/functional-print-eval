task: servo-arm
note: 'Prototype: servo mounted vertically in a printed base that clamps the tabs
  with straps, which doesn''t depend on the unmeasured tab hole positions. The ~100
  mm arm bolts to the aluminium horn. The 608 bearing is a roller on the arm tip that
  carries the arm''s weight on the table so the servo gears don''t take it. The roller
  axle slides in a vertical slot to take up the unmeasured horn height. Key assumptions:
  608 OD of 22.0 mm is nominal because the measured 21.22 was flagged as wrong and
  could not be re-measured. Horn arm width (12) and reach (36), and horn seat height
  above the case (4 mm) are guesses; the horn_fit coupon checks the first two. Horn
  arm width and hole positions, the shaft position, and the exact tab width could
  not be measured. Printing of M3 screw engagement depth into the shaft thread is
  assumed to be about 5 mm.'
questions:
- text: Could the 608 bearing OD be re-measured (nominal 22.0 assumed)?
  answer: null
- text: Aluminium horn arm width and length were not measured (12 mm wide, 36 mm long
    channel assumed)
  answer: null
- text: Height of the horn seat above the case top was not measured (4 mm assumed)
  answer: null
