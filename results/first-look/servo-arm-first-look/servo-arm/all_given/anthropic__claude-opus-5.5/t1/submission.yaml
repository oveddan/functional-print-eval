  relation: clears
  hardware: null
  clearance_mm: 1.5
  params:
  - horn_top_above_case
  - lift_gap
  check:
    method: measure
    ref: null
    description: 'With everything assembled, the arm turns freely and can lift about
      1 mm before it stops. If it binds, the horn sits higher than guessed: reduce
      horn_top_above_case'
manual:
- n: '1'
  text: 'Print coupon_horn and coupon_bearing first. Press coupon_horn onto the aluminium
    horn: it should go on without rotating play. Check the 608 slides into the ring
    on coupon_bearing and onto its pin. Adjust the params if they don''t, then print
    base, arm and bracket.'
  parts:
  - coupon_horn
  - coupon_bearing
  hardware:
  - bearing
  tool: null
- n: '2'
  text: Slide the four M4 nuts into the slots on the inside walls of the base's servo
    opening (two at each end).
  parts:
  - base
  hardware:
  - m4_nut
  tool: null
- n: '3'
  text: 'Lower the servo into the base, shaft up, with the shaft at the front end
    (the shorter end of the base). Feed the cable out through the slot at the bottom
    of whichever end wall it leaves from. Fix the tabs with the four M4x12 screws
    into the nuts. No washers: they would hit the tab ribs.'
  parts:
  - base
  hardware:
  - m4_screw
  - m4_nut
  tool: 3 mm hex key
- n: '4'
  text: Centre the servo (1500 µs pulse). Fit the aluminium horn so it points straight
    forward, away from the base, and tighten its centre screw.
  parts: []
  hardware: []
  tool: small screwdriver / hex key
- n: '5'
  text: 'Optional: heat-set the two M3 inserts into the holes at the arm''s tip, from
    the top. Press the arm''s underside pocket down over the horn so the arm points
    forward. Drop the 608 bearing onto the arm''s stub so it rests on the shoulder.'
  parts:
  - arm
  hardware:
  - bearing
  - insert
  tool: soldering iron for inserts
- n: '6'
  text: Slide the two M5 nuts into the side slots at the back of the base. Lower the
    bracket so its cap slips over the bearing and its foot sits on the back of the
    base. Drop the M5x25 screws down the long holes in the column and tighten them.
  parts:
  - bracket
  - base
  hardware:
  - m5_screw
  - m5_nut
  - bearing
  tool: 4 mm hex key (long)
- n: '7'
  text: Swing the arm gently by hand ±60°. It should turn freely and lift no more
    than about 1.5 mm. Then drive it with the servo, staying within about ±60°.
  parts: []
  hardware: []
  tool: null
