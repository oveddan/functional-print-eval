task: servo-arm
note: 'Layout: the servo stands shaft-up in an open frame base. The 100 mm arm grips
  the aluminium horn with a shaped pocket on its underside and has a printed 8 mm
  axle stub on top. The stub turns in the 608 bearing, which sits in a cantilever
  bracket coaxial with the servo shaft, so the bearing takes the side loads off the
  servo. The bearing floats 1.5 mm up and down in its bore. That makes up for the
  guessed horn height, and the bore''s lip stops the arm lifting off the spline. The
  column stands behind the servo, out of the ±60° swing. Guessed values: shaft offset
  (10), horn height above the case (8), horn arm widths (9.5/7) and the tab hole pitch
  (10, covered by slotted holes).'
questions:
- text: How far is the shaft centre from the near end of the case? (guessed 10 mm)
  answer: null
- text: With the aluminium horn fitted, how high is the top of its hub above the case
    top? (guessed 8 mm)
  answer: null
- text: How wide is the aluminium horn's arm next to the hub and at the tip? (guessed
    9.5 / 7 mm)
  answer: null
- text: What is the centre-to-centre spacing of the two holes on one tab? (guessed
    10 mm)
  answer: null
