parts:
- id: base
  role: final
  material: PLA
  code: "def build(p):\n    H = p.servo_h - p.tab_to_top - p.tab_t + p.base_floor_gap\n\
    \    x0, x1, hw = -p.base_x_front, p.base_x_back, p.base_half_w\n    base = cq.Workplane('XY').box(x1\
    \ - x0, 2 * hw, H, centered=False).translate((x0, -hw, 0))\n    ox = p.servo_len\
    \ / 2 + p.fit_clear\n    oy = p.servo_w / 2 + p.fit_clear\n    base = base.cut(cq.Workplane('XY').box(2\
    \ * ox, 2 * oy, H, centered=False).translate((-ox, -oy, 0)))\n    hx = (p.hole_gap_inner\
    \ + p.hole_w) / 2\n    nh = p.m4_nut_h + 0.3\n    wy = p.m4_nut_af + 0.3 + 2 *\
    \ p.hole_y_slack\n    xa = ox - 1.0\n    xb = hx + p.m4_nut_af / (3 ** 0.5) +\
    \ 0.3\n    for sx in (-1, 1):\n        for sy in (-1, 1):\n            yc = sy\
    \ * p.hole_pitch_y / 2\n            hole = (cq.Workplane('XY').center(sx * hx,\
    \ yc)\n                    .slot2D(p.m4_clear_d + 2 * p.hole_y_slack, p.m4_clear_d,\
    \ 90)\n                    .extrude(p.m4_hole_depth).translate((0, 0, H - p.m4_hole_depth)))\n\
    \            base = base.cut(hole)\n            xl = xa if sx > 0 else -xb\n \
    \           nut = cq.Workplane('XY').box(xb - xa, wy, nh, centered=False).translate((xl,\
    \ yc - wy / 2, H - p.deck_t - nh))\n            base = base.cut(nut)\n    cable\
    \ = cq.Workplane('XY').box(x1 - x0 + 2, p.cable_w, p.cable_h, centered=False).translate((x0\
    \ - 1, -p.cable_w / 2, 0))\n    base = base.cut(cable)\n    for sy in (-1, 1):\n\
    \        yc = sy * p.bkt_screw_y\n        h5 = cq.Workplane('XY').center(p.bkt_screw_x,\
    \ yc).circle(p.m5_clear_d / 2).extrude(20).translate((0, 0, H - 20))\n       \
    \ base = base.cut(h5)\n        wx = p.m5_nut_af + 0.3\n        nh5 = p.m5_nut_h\
    \ + 0.3\n        yin = p.bkt_screw_y - p.m5_nut_af / (3 ** 0.5) - 0.3\n      \
    \  ylen = hw - yin + 1\n        ylo = yin if sy > 0 else -hw - 1\n        n5 =\
    \ cq.Workplane('XY').box(wx, ylen, nh5, centered=False).translate((p.bkt_screw_x\
    \ - wx / 2, ylo, H - 7 - nh5))\n        base = base.cut(n5)\n    return base\n"
  print_orientation: bottom face on bed, as modelled (open frame, servo drops in from
    the top)
  use_orientation: same as printed, sitting on the desk
- id: arm
  role: final
  material: PLA
  code: "def build(p):\n    T = p.arm_t\n    L = p.arm_len\n    beam = (cq.Workplane('XY').polyline([(0,\
    \ p.arm_w_root / 2), (-L, p.arm_w_tip / 2), (-L, -p.arm_w_tip / 2), (0, -p.arm_w_root\
    \ / 2)]).close().extrude(T))\n    hub = cq.Workplane('XY').circle(p.arm_hub_r).extrude(T)\n\
    \    tipc = cq.Workplane('XY').center(-L, 0).circle(p.arm_w_tip / 2).extrude(T)\n\
    \    arm = beam.union(hub).union(tipc)\n    c = p.fit_clear\n    hub_p = cq.Workplane('XY').circle(p.horn_hub_d\
    \ / 2 + c).extrude(p.pocket_depth + p.hub_extra_depth)\n    tip_x = -(p.horn_len\
    \ - p.horn_hub_d / 2)\n    slot = (cq.Workplane('XY').polyline([(0, p.horn_w_root\
    \ / 2 + c), (tip_x, p.horn_w_tip / 2 + c), (tip_x, -(p.horn_w_tip / 2 + c)), (0,\
    \ -(p.horn_w_root / 2 + c))]).close().extrude(p.pocket_depth))\n    tip_r = cq.Workplane('XY').center(tip_x,\
    \ 0).circle(p.horn_w_tip / 2 + c).extrude(p.pocket_depth)\n    arm = arm.cut(hub_p).cut(slot).cut(tip_r)\n\
    \    sh = cq.Workplane('XY').workplane(offset=T).circle(p.shoulder_d / 2).extrude(p.shoulder_h)\n\
    \    stub = cq.Workplane('XY').workplane(offset=T + p.shoulder_h).circle(p.stub_d\
    \ / 2).extrude(p.bearing_w + 1)\n    arm = arm.union(sh).union(stub)\n    for\
    \ dx in (-L, -L + 15):\n        arm = arm.cut(cq.Workplane('XY').center(dx, 0).circle(p.insert_hole_d\
    \ / 2).extrude(T))\n    return arm\n"
  print_orientation: horn-pocket face on bed, axle stub pointing up, as modelled
  use_orientation: 'same as printed: pocket down onto the horn, stub up into the bearing'
- id: bracket
  role: final
  material: PLA
  code: "def build(p):\n    H = p.servo_h - p.tab_to_top - p.tab_t + p.base_floor_gap\n\
    \    z_ct = H + p.tab_t + p.tab_to_top\n    z_ht = z_ct + p.horn_top_above_case\n\
    \    z_at = z_ht - p.pocket_depth + p.arm_t\n    z_b0 = z_at + p.shoulder_h\n\
    \    z_cb = z_b0 - 0.5\n    bore_depth = p.bearing_w + 0.5 + p.lift_gap\n    z_top\
    \ = z_cb + bore_depth + p.lip_t\n    xs = -p.servo_len / 2 + p.shaft_offset\n\
    \    hw = p.base_half_w\n    col = cq.Workplane('XY').box(p.col_x1 - p.col_x0,\
    \ 2 * hw, z_top - H, centered=False).translate((p.col_x0, -hw, H))\n    cw = p.cant_half_w\n\
    \    cant = cq.Workplane('XY').box(p.col_x1 - xs, 2 * cw, z_top - z_cb, centered=False).translate((xs,\
    \ -cw, z_cb))\n    disc = cq.Workplane('XY').center(xs, 0).circle(cw).extrude(z_top\
    \ - z_cb).translate((0, 0, z_cb))\n    b = col.union(cant).union(disc)\n    bore\
    \ = cq.Workplane('XY').center(xs, 0).circle((p.bearing_od + p.bore_clear) / 2).extrude(bore_depth).translate((0,\
    \ 0, z_cb))\n    lip = cq.Workplane('XY').center(xs, 0).circle(p.lip_id / 2).extrude(z_top\
    \ - z_cb + 1).translate((0, 0, z_cb))\n    b = b.cut(bore).cut(lip)\n    for sy\
    \ in (-1, 1):\n        yc = sy * p.bkt_screw_y\n        th = cq.Workplane('XY').center(p.bkt_screw_x,\
    \ yc).circle(p.m5_clear_d / 2).extrude(z_top - H).translate((0, 0, H))\n     \
    \   cb = cq.Workplane('XY').center(p.bkt_screw_x, yc).circle(p.m5_head_cb_d /\
    \ 2).extrude(z_top - H - p.foot_t).translate((0, 0, H + p.foot_t))\n        b\
    \ = b.cut(th).cut(cb)\n    b = b.rotate((0, 0, 0), (1, 0, 0), 180).translate((0,\
    \ 0, z_top))\n    return b\n"
  print_orientation: 'upside down: top of the bearing cap (lip face) on bed, foot
    facing up; modelled that way'
  use_orientation: 'flipped over: foot down on the back end of the base, cap reaching
    over the servo shaft'
- id: coupon_bearing
  role: coupon
  material: PLA
  code: "def build(p):\n    bore_depth = p.bearing_w + 0.5 + p.lift_gap\n    ro =\
    \ (p.bearing_od + 8) / 2\n    ring = cq.Workplane('XY').circle(ro).extrude(p.lip_t\
    \ + bore_depth)\n    bar = cq.Workplane('XY').box(30, 8, 2, centered=False).translate((0,\
    \ -4, 0))\n    pad = cq.Workplane('XY').center(30, 0).circle(8).extrude(2)\n \
    \   sh = cq.Workplane('XY').center(30, 0).circle(p.shoulder_d / 2).extrude(p.shoulder_h).translate((0,\
    \ 0, 2))\n    stub = cq.Workplane('XY').center(30, 0).circle(p.stub_d / 2).extrude(p.bearing_w\
    \ + 1).translate((0, 0, 2 + p.shoulder_h))\n    c = ring.union(bar).union(pad).union(sh).union(stub)\n\
    \    c = c.cut(cq.Workplane('XY').circle((p.bearing_od + p.bore_clear) / 2).extrude(bore_depth).translate((0,\
    \ 0, p.lip_t)))\n    c = c.cut(cq.Workplane('XY').circle(p.lip_id / 2).extrude(p.lip_t\
    \ + 1))\n    return c\n"
  print_orientation: flat on bed, as modelled
  use_orientation: hand test
- id: coupon_horn
  role: coupon
  material: PLA
  code: "def build(p):\n    T = p.pocket_depth + p.hub_extra_depth + 1.2\n    c =\
    \ p.fit_clear\n    tip_x = -(p.horn_len - p.horn_hub_d / 2)\n    body = cq.Workplane('XY').circle(p.arm_hub_r).extrude(T)\n\
    \    body = body.union(cq.Workplane('XY').box(-tip_x + 6, p.arm_w_root, T, centered=False).translate((tip_x\
    \ - 6, -p.arm_w_root / 2, 0)))\n    body = body.cut(cq.Workplane('XY').circle(p.horn_hub_d\
    \ / 2 + c).extrude(p.pocket_depth + p.hub_extra_depth))\n    slot = (cq.Workplane('XY').polyline([(0,\
    \ p.horn_w_root / 2 + c), (tip_x, p.horn_w_tip / 2 + c), (tip_x, -(p.horn_w_tip\
    \ / 2 + c)), (0, -(p.horn_w_root / 2 + c))]).close().extrude(p.pocket_depth))\n\
    \    body = body.cut(slot).cut(cq.Workplane('XY').center(tip_x, 0).circle(p.horn_w_tip\
    \ / 2 + c).extrude(p.pocket_depth))\n    return body\n"
  print_orientation: pocket face on bed, as modelled (same as the arm)
  use_orientation: 'hand test: press onto the aluminium horn'
