  bearing_bore:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ bore; measured 7.94, so M8 bolt is a tight fit
  bearing_w:
    value: 7
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ width
  horn_hub_d:
    value: 14.66
    unit: mm
    kind: world
    source: measured
    note: aluminium horn hub diameter
  horn_hub_t:
    value: 5.95
    unit: mm
    kind: world
    source: measured
    note: aluminium horn hub thickness
  horn_hole_y:
    value: 5
    unit: mm
    kind: world
    source: guessed
    note: arm screw holes at (0, +/-y). Horn hole positions were NOT measured; this
      is a guess and must be checked against the horn
  body_hx:
    value: 22
    unit: mm
    kind: design
    source: design
    note: bracket half-length
  body_hy:
    value: 13
    unit: mm
    kind: design
    source: design
    note: bracket half-width
  ear_y:
    value: 4
    unit: mm
    kind: design
    source: design
    note: half-width of tab ears
  ear_bottom:
    value: 24
    unit: mm
    kind: design
    source: design
    note: underside of tab ears; sets nut pocket height
  nut_af:
    value: 7.4
    unit: mm
    kind: design
    source: design
    note: M4 nut across flats (7.0) plus clearance
  post_r:
    value: 8.5
    unit: mm
    kind: design
    source: design
    note: bearing post radius
  head_d:
    value: 13.5
    unit: mm
    kind: design
    source: design
    note: M8 head pocket diameter (head 13.0 plus clearance)
  head_h:
    value: 8
    unit: mm
    kind: hardware
    source: datasheet
    note: ISO 4762 M8 head height
  post_hole_d:
    value: 8.5
    unit: mm
    kind: design
    source: design
