task: servo-arm
note: ''
questions:
- text: The measurements for the shaft position from the case end, the shaft height
    above the case, the tab hole spacing, and the horn hole positions were not taken.
    Please measure them, or tell me if they can't be measured, so the guessed values
    can be replaced before printing.
  answer: null
- text: Re-measure the 608 bearing outer diameter flat with calipers (not pinched).
    The pocket is sized from the 22.0 datasheet value.
  answer: null
- text: Which end of the servo does the cable leave from? The design puts the notch
    at the end opposite the shaft.
  answer: null
params:
  case_len:
    value: 40.58
    unit: mm
    kind: world
    source: measured
    note: servo case length, end to end, no tabs
  case_w:
    value: 19.82
    unit: mm
    kind: world
    source: measured
    note: servo case width
  case_h:
    value: 40.4
    unit: mm
    kind: world
    source: measured
    note: servo case height
  tab_t:
    value: 2.28
    unit: mm
    kind: world
    source: measured
    note: mounting tab thickness
  tab_to_top:
    value: 5.66
    unit: mm
    kind: world
    source: measured
    note: tab top face to case top; readings 5.63 to 5.69, midpoint used
  tab_hole_d:
    value: 4.58
    unit: mm
    kind: world
    source: measured
    note: tab hole diameter
  tab_hole_x:
    value: 24.6
    unit: mm
    kind: world
    source: guessed
    note: tab hole centre distance from servo centre along the length. Derived from
