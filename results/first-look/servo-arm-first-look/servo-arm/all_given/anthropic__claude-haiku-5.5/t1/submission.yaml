  arm_len:
    value: 100
    unit: mm
    kind: design
    source: asked
    note: shaft centre to bearing centre, as asked
  arm_clear:
    value: 0.5
    unit: mm
    kind: design
    source: design
    note: gap between case top and arm underside
  floor_t:
    value: 2.8
    unit: mm
    kind: design
    source: design
    note: arm thickness under the bearing
  arm_t:
    value: 10
    unit: mm
    kind: design
    source: design
    note: arm plate thickness
  bearing_od:
    value: 22
    unit: mm
    kind: hardware
    source: datasheet
    note: 608ZZ OD. Measured 21.22 read low from pinching; re-measure flat with calipers
