parts:
- id: bracket
  role: final
  material: PLA black
  code: "def build(p):\n    Hb = p.case_h - p.tab_to_top - p.tab_t\n    body = cq.Workplane('XY').box(2*p.body_hx,\
    \ 2*p.body_hy, Hb, centered=(True, True, False))\n    for sx in (-1, 1):\n   \
    \     x0 = sx*(p.body_hx - 1.0)\n        x1 = sx*(p.tab_hole_x + 3.0)\n      \
    \  cx = (x0 + x1)/2\n        ear = cq.Workplane('XY').box(abs(x1 - x0), 2*p.ear_y,\
    \ Hb - p.ear_bottom, centered=(True, True, False)).translate((cx, 0, p.ear_bottom))\n\
    \        body = body.union(ear)\n    slot = cq.Workplane('XY').box(p.case_len\
    \ + 0.4, p.case_w + 0.4, Hb + 2, centered=(True, True, False)).translate((0, 0,\
    \ -1))\n    body = body.cut(slot)\n    nx0 = p.case_len/2 - 1.0\n    nx1 = p.body_hx\
    \ + 1.0\n    notch = cq.Workplane('XY').box(nx1 - nx0, p.notch_w, 6, centered=(False,\
    \ True, False)).translate((nx0, 0, 4))\n    body = body.cut(notch)\n    for sx\
    \ in (-1, 1):\n        hx = sx*p.tab_hole_x\n        h = Hb + 1 - (p.ear_bottom\
    \ - 1)\n        cyl = cq.Workplane('XY').workplane(offset=p.ear_bottom - 1).center(hx,\
    \ 0).circle(p.tab_hole_d/2).extrude(h)\n        nut = cq.Workplane('XY').workplane(offset=p.ear_bottom\
    \ - 1).center(hx, 0).polygon(6, p.nut_af/0.8660254).extrude(4.4)\n        body\
    \ = body.cut(cyl).cut(nut)\n    return body\n"
  print_orientation: z = 0 on bed, slot open at top and bottom, as printed
  use_orientation: 'as printed: servo inserted from above, tabs rest on the ears'
- id: arm
  role: final
  material: PLA black
  code: "def build(p):\n    L = p.arm_len\n    t = p.arm_t\n    plate = cq.Workplane('XY').box(L,\
    \ 18, t, centered=(False, True, False))\n    boss1 = cq.Workplane('XY').circle(9).extrude(t)\n\
    \    boss2 = cq.Workplane('XY').center(L, 0).circle(14).extrude(t)\n    body =\
    \ plate.union(boss1).union(boss2)\n    hub = cq.Workplane('XY').circle(p.horn_hub_d/2\
    \ + 0.2).extrude(p.horn_hub_t + 0.05)\n    body = body.cut(hub)\n    for sy in\
    \ (-1, 1):\n        scr = cq.Workplane('XY').center(0, sy*p.horn_hole_y).circle(1.7).extrude(t)\n\
    \        body = body.cut(scr)\n    pocket = cq.Workplane('XY').workplane(offset=p.floor_t).center(L,\
    \ 0).circle(p.bearing_od/2 + 0.15).extrude(t)\n    body = body.cut(pocket)\n \
    \   floor_hole = cq.Workplane('XY').center(L, 0).circle(9).extrude(p.floor_t)\n\
    \    body = body.cut(floor_hole)\n    return body\n"
  print_orientation: z = 0 on bed, arm lies flat with the horn hub pocket and bearing
    pocket open as printed
  use_orientation: horizontal plate, bearing pocket up, horn hub pocket on the servo
    side
- id: post
  role: final
  material: PLA black
  code: "def build(p):\n    H = p.post_h\n    post = cq.Workplane('XY').circle(p.post_r).extrude(H)\n\
    \    head = cq.Workplane('XY').circle(p.head_d/2).extrude(p.head_h)\n    hole\
    \ = cq.Workplane('XY').circle(p.post_hole_d/2).extrude(H)\n    post = post.cut(head).cut(hole)\n\
    \    return post\n"
  print_orientation: z = 0 on bed, post standing upright, head pocket open at bottom
  use_orientation: upright on the base, same plane as the servo case bottom
