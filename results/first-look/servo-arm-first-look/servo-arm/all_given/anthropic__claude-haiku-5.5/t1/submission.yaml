manual:
- n: '1'
  text: Print the bracket, arm and post. Check the printed bearing pocket and horn
    hub pocket fit before assembly.
  parts:
  - bracket
  - arm
  - post
  hardware: []
  tool: null
- n: '2'
  text: Press the two M4 nuts into the nut pockets on the underside of the bracket
    ears.
  parts:
  - bracket
  hardware:
  - m4_nut
  tool: null
- n: '3'
  text: Lower the servo into the bracket slot from above, with the cable running out
    through the notch. The tabs should rest on the ears.
  parts:
  - bracket
  hardware: []
  tool: null
- n: '4'
  text: Pass one M4x12 screw down through each tab hole into its nut and tighten.
  parts:
  - bracket
  hardware:
  - m4_screw
  tool: 2.5 mm hex key
- n: '5'
  text: Fit the aluminium horn onto the servo spline and secure it with the horn's
    own screw.
  parts: []
  hardware: []
  tool: null
- n: '6'
  text: Lower the arm over the horn so the hub seats in the hub pocket. Fasten with
    two M3x8 screws into the horn holes.
  parts:
  - arm
  hardware:
  - m3_screw
  tool: 2.5 mm hex key
- n: '7'
  text: Press the 608ZZ bearing into the arm bearing pocket from above.
  parts:
  - arm
  hardware:
  - brg
  tool: null
- n: '8'
  text: Stand the post on the base 100 mm from the servo shaft centre, under the bearing.
    Insert the M8x50 screw from below through the post into the bearing bore. Fit
    the washer and nut on top.
  parts:
  - post
  - arm
  hardware:
  - m8_screw
  - m8_washer
  - m8_nut
  tool: 13 mm spanner
