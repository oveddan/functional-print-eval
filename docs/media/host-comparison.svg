<text class="name" x="355.0" y="198" text-anchor="middle">on OpenAI server</text>
<rect class="s0" x="240.0" y="214" width="230.0" height="48" rx="6"/>
<text class="count on" x="355.0" y="245.0" text-anchor="middle">10</text>
<rect class="s1" x="240.0" y="278" width="230.0" height="48" rx="6"/>
<text class="count on" x="355.0" y="309.0" text-anchor="middle">10</text>
