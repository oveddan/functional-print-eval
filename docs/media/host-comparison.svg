<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 446" width="830" height="446" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<style>text{fill:#26302c}.title{font-weight:800;font-size:34px}.sub{font-size:17px;fill:#4a5450}.name{font-weight:700;font-size:20px}.stage{font-size:14px;fill:#4a5450}.count{font-weight:800;font-size:20px}.on{fill:#fff}.off{fill:#8a938f}.muted{fill:#6b7570;font-size:13px}.s0{fill:#9fb3c2}.s1{fill:#2f6f9f}.s2{fill:#b35c1e}.empty{fill:none;stroke:#c3cac6;stroke-width:1.5;stroke-dasharray:5 4}@media (prefers-color-scheme: dark){text{fill:#e4e9e6}.sub,.stage{fill:#b9c1bd}.muted{fill:#9aa39f}.off{fill:#7d8782}.s0{fill:#4d6272}.s1{fill:#4f8fbf}.s2{fill:#d9783a}.empty{stroke:#4a534f}}</style>
<text class="title" x="40" y="60">Same model. Different server.</text>
<text class="sub" x="40" y="92">GPT-6.2 Sol, same prompt, same 3D-print task, through OpenRouter.</text>
<text class="sub" x="40" y="116">On Amazon Bedrock it never asked for a test print, and nothing passed.</text>
<text class="stage" x="40" y="243.0">Trials</text>
