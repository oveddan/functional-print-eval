# Limits and where each comes from: brief.md, "What the records decide".
- id: R1
  text: There's a printed plate
  grader: bolted.plate_exists
  class: C5-mating-envelopes
- id: R2
  text: The plate fits the tripod's clamp
  grader: bolted.fits_clamp
  args: {width: [37, 39], narrows_by: 1.0}
  class: C5-mating-envelopes
- id: R3
  text: The camera's bolt goes through the plate, with its head on the clamp side
  grader: bolted.hole
  args: {bolt: "salvaged:webcam-mount-bolt", thread: "1/4-20", too_tight: 6.35, head_stopped: 13, head_passes: 15}
  class: C2-fit-clearance
- id: R4
  text: The bolt's head fits in its recess
  grader: bolted.head_recess
  args: {bolt: "salvaged:webcam-mount-bolt", bolt_across: 6.35, too_tight: 13, fits: 15, head_height: 5}
  class: C1-unmeasured
- id: R5
  text: The bolt reaches into the camera
  grader: bolted.reach
  args: {bolt: "salvaged:webcam-mount-bolt", bolt_across: 6.35, bolt_length: 10, min_reach: 3.81}
  class: C3-fastener-stackup
