# The person's own things. Only what the tripod session recorded, plus one labelled assumption.
webcam_bolt:
  aliases: [bolt, screw, webcam, mount bolt, webcam mount]
  measurements:
    head_across: {value: about 15, unit: mm, note: its head, aliases: [head, across, diameter, width]}
    head_height: {value: about 5, unit: mm, note: its head, aliases: [head, tall, height, thick, thickness]}
    # ASSUMPTION, not a record: see brief.md. 5 mm of plate plus about 5 mm into the camera.
    length: {value: about 10, unit: mm, note: under the head, aliases: [long, shank]}
tripod_clamp:
  aliases: [tripod, clamp, quick release, jaws, slot]
  measurements:
    style: {value: "jaws with angled lips, tightened by a knob; the plate drops in from above", aliases: [type, kind, standard, shape]}
camera:
  aliases: [camera's, socket]
  measurements:
    # What the session said: a webcam mount uses the same thread as cameras. Its depth isn't recorded.
    socket_thread: {value: 1/4-20, note: the usual camera thread, aliases: [thread, socket, size, diameter]}
