# As servo-mount: the system prompt leaves the `servos` section of catalog/hardware.yaml out, so the
# servo's readings (the tab rib, the shaft) come from hidden_facts.yaml. Every other task's prompt is
# unchanged.
hardware_left_out: [servos]

# can_ask_datasheet: the same MG996R datasheet as servo-mount. Its drawing is where this task's shaft
# position comes from (catalog/datasheet_estimates.yaml), and its text gives the 120 degree range.
datasheet: [../servo-mount/datasheet/MG996R-1.png, ../servo-mount/datasheet/MG996R-2.png]
datasheet_line: "I've attached the servo's datasheet."
