# Limits and the record behind each: brief.md, "The checks, and what the records decide".
# R1 to R3 are servo-mount's checks, unchanged. R4 to R7 read the arm.
- id: R1
  text: The servo's body goes through the cutout
  grader: servo.cutout
  args: {body: [40.58, 19.82], seats: 0.25, fits: [0.0, 0.1]}
  class: C2-fit-clearance
- id: R2
  text: Screws through the servo's four tab holes go into holes in the mount
  grader: servo.screws
  args: {body: [40.58, 19.82], seats: 0.25, pitch: [49.19, 49.5], pair: 10, tab_hole: 4.58}
  class: C3-fastener-stackup
- id: R3
  text: The tabs sit flush on the mount, so the servo can be screwed down snug
  grader: servo.flush
  args: {body: [40.58, 19.82], seats: 0.25, pitch: [49.19, 49.5], pair: 10, tab_hole: 4.58, rib: {width: 1.51, protrudes: 1.8, room: 0.05}, cable_stopped: 0.25}
  class: C5-mating-envelopes
- id: R4
  text: The arm presses onto the servo's shaft and grips it
  grader: arm.shaft_fit
  args:
    size: [5.0, 7.0]
    grips: [5.94, 6.04]
    loose: 6.14
    min_depth: 3
    body: [40.58, 19.82]
    horn_hub: 14.66
    # an arm on the aluminium horn: round 3's horn pockets (coupons/round3.py, piece N), graded only once
    # their outcomes are recorded. Which words mean the pocket works is Claude's call: the hub has to go
    # in and centre the arm, so "won't go in" and "loose" don't. Matched in this order.
    horn_test:
      file: results/predictions/round3-coupons.yaml
      piece: N_horn_pockets
      depth: 2.0
      # matched in order, first key found wins: "fits nicely ... a bit loose" (round 3's 14.76) reads as works
      outcomes: {"won't": too tight, "wouldn't": too tight, "not at all": too tight, "too tight": too tight,
                 "too small": too tight, "too big": too loose, "fits": works, "loose": too loose,
                 "tight": works, "play": works}
  class: C2-fit-clearance
- id: R5
  text: The 608 bearing presses into its seat and stays
  grader: arm.bearing_seat
  args: {bearing: 608ZZ, size: [20, 26], too_tight: 22.05, holds: [22.1, 22.3], too_loose: 22.4, min_depth: 7}
  class: C2-fit-clearance
- id: R6
  text: The arm is about 100 mm long
  grader: arm.length
  args: {size: [5.0, 7.0], grips: [5.94, 6.04], loose: 6.14, min_depth: 3, reach: [85, 115], body: [40.58, 19.82], horn_hub: 14.66}
  class: C5-mating-envelopes
- id: R7
  text: The arm swings both ways through the servo's range without hitting anything
  grader: arm.swing
  args: {size: [5.0, 7.0], grips: [5.94, 6.04], loose: 6.14, min_depth: 3, body: [40.58, 19.82], pitch: [49.19, 49.5], pair: 10,
         tab_hole: 4.58, tab_t: 2.28, tab_to_top: 5.69, case_h: 40.4, shaft_from_end: [9.3, 11.3], sits: [0, 10], rotation: 120, horn_hub: 14.66}
  class: C5-mating-envelopes
