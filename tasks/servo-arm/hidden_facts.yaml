# The person's MG996R, as in servo-mount's hidden facts (Dan's caliper readings, catalog/hardware.yaml
# `servos`), plus what this task adds: the spline's reading, where the shaft is as a person looking at
# it would say (its distance from the end and its height were never measured), the range the listing
# gives, and the horns in the box (the aluminium one's readings are the catalog's horn_25t_aluminium;
# its hole positions were only estimated from a photo, so they're left out). The 608 is in the hardware
# list every prompt shows.
servo:
  aliases: [mg996r, mg996, cable, wire, wires, lead]
  measurements:
    body_length: {value: 40.58, unit: mm, note: "the case, end to end, not counting the tabs", aliases: [length, long, case length]}
    body_width: {value: 19.82, unit: mm, note: "the case, side to side", aliases: [width, wide, case width]}
    body_height: {value: 40.4, unit: mm, note: "the case, top to bottom", aliases: [height, tall, case height]}
    tab_holes: {value: 4.58, unit: mm, note: "each mounting tab has two holes, open to the tab's end like a U", aliases: [hole, holes, screw hole, screw holes, mounting hole, mounting holes, hole size, hole diameter]}
    hole_spacing: {value: 44.61, unit: mm, note: "between the holes on the two tabs, from the inside edge of one to the inside edge of the other; I didn't measure the spacing between the two holes on one tab", aliases: [spacing, pitch, hole spacing, hole pitch, between the holes, centres, centers, distance]}
    tab_thickness: {value: 2.28, unit: mm, aliases: [tab thick, tab thickness, tabs thickness]}
    tab_to_top: {value: 5.63 to 5.69, unit: mm, note: "from the top face of a tab (the shaft side) to the top of the case", aliases: [tab height, tab position, above the tab, above the tabs, top of the case, case top]}
    rib_width: {value: 1.51, unit: mm, note: "a rib on each tab's top face (the shaft side), between the tab's two holes; it stops the tabs sitting flush", aliases: [rib, notch, ridge, mounting face, tab face, tab shape, raised, sticks up, sticking up, sticks out, sticking out, bump, protrusion]}
    rib_height: {value: 1.8, unit: mm, note: how far the rib stands up from the tab's top face, aliases: [rib, notch, ridge, mounting face, tab face, tab shape, raised, sticks up, sticking up, sticks out, sticking out, bump, protrusion]}
    rib_position: {value: 8.31, unit: mm, note: from the side of the holes to the middle of the rib, aliases: [rib, notch, ridge, mounting face, tab face, tab shape, raised, sticks up, sticking up, sticks out, sticking out, bump, protrusion]}
    cable_exit: {value: "out of one end of the case, below the tabs", note: "where the cable leaves; I didn't measure its size or how far it sticks out", aliases: [cable, wire, wires, lead, exit, comes out, come out, leaves]}
    spline: {value: 5.84, unit: mm, note: "the output shaft, across its splines, where an arm would grip it; there's a smaller reading of 5.60 at the very top, and I'm not sure which feature that was", aliases: [shaft, splines, output, output shaft, gear, spline diameter, shaft diameter]}
    shaft_position: {value: "near one end of the case, in the middle side to side", note: "I didn't measure how far it is from the end, or how high it stands above the case", aliases: [shaft position, where is the shaft, shaft location, offset, off centre, off center]}
    range: {value: "about 120 degrees, 60 each way", note: "what the listing says; I haven't checked it", aliases: [range, rotation, rotate, turn, turns, travel, degrees, angle, swing]}
    horns: {value: "four plastic horns came with it (a double arm, a six-arm star, a round disc and a cross), and I bought a 25-tooth aluminium single arm", note: "the aluminium arm's hub is 14.66 across and 5.95 thick, the arm 3.86 thick, 34.62 from the hub's far edge to the tip, with 2.55 holes; I didn't measure where the holes are, or the plastic horns", aliases: [horn, horns, servo horn, servo arm, aluminium arm, aluminum arm, hub]}
