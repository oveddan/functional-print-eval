# What this task adds to the submission format and the prompt (pbe/runner/tasks.py, TaskFormat).
# Every other task gets exactly the base format, prompt and tools.
#
# This task's system prompt leaves the servos out of the hardware list. catalog/hardware.yaml's
# `servos` section has the MG996R's tab rib (`tab_notch`), and with it in the prompt there's
# nothing to ask about. The same readings are in hidden_facts.yaml, so `measure` gives them in
# can_ask and all_given states them up front. Every other task's prompt is unchanged.
hardware_left_out: [servos]

# can_ask_datasheet: the MG996R datasheet Dan attached on 2026-11-05 (two pages, rendered at 150 dpi,
# no metadata), handed over with the request. It shows the rib between each tab's slots in its top
# view and photo but doesn't size it, gives a 53.6 mm tab span, and gives body sizes (40.7 x 19.7,
# 40.3 and 20 on the drawing) that differ from Dan's readings (40.58 x 19.82).
datasheet: [datasheet/MG996R-1.png, datasheet/MG996R-2.png]
datasheet_line: "I've attached the servo's datasheet."
