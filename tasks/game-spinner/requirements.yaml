# Limits and where each comes from: brief.md, "What the records decide". The graders are the
# existing wheel.* and nut.* readers, through pbe/graders/combined.py, which picks the record that
# applies (the model chooses whether to use the 608, and which of the M3, M5 and M8 nuts) and
# reports a case no test print covers as not graded.
- id: R1
  text: One printed part (a test print doesn't count)
  class: C6-printability
  grader: dims.part_count
  args: {n: 1}
- id: R2
  text: About 70 mm across
  class: C5-mating-envelopes
  grader: dims.across
  args: {d: 70, tol_frac: 0.2}
- id: R3
  text: There's room for the bearing, and something stops it going through
  class: C5-mating-envelopes
  grader: combined.bearing_room
  args: {seat_range: [20, 26], bearing_width: 7, bearings: 1}
- id: R4
  text: The bearing presses in and stays in on this printer, or a test print would find a size where it does
  class: C2-fit-clearance
  grader: combined.bearing_fit
  args: {seat_range: [20, 26], too_tight: 22.0, holds: [22.1, 22.3], bearing_width: 7, bearings: 1}
- id: R5
  text: The M8 bolt goes through the bearing's bore
  class: C3-fastener-stackup
  grader: combined.bearing_bolt
  args: {seat_range: [20, 26], bolt: 8, fine: 8.4}
- id: R6
  text: A hex pocket that takes the handle's whole nut, can be reached from one face, stops the nut turning, and stops it going out the far side
  class: C5-mating-envelopes
  grader: combined.handle_pocket
- id: R7
  text: The handle's nut presses in by hand and stays in upside down on this printer, or a test print would find a size where it does
  class: C2-fit-clearance
  grader: combined.handle_nut_fit
- id: R8
  text: The handle's bolt goes through the wheel and its nut
  class: C3-fastener-stackup
  grader: combined.handle_bolt
