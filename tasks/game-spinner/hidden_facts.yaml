# The person's own things. Only the bearing is recorded, at its standard sizes, as in
# tasks/bearing-wheel: round 2 settled its outer diameter at about 22
# (results/predictions/round2-coupons.yaml). The bolts and nuts are in the hardware list every
# model gets, so, as in the nut knob, the person adds nothing about them. The board isn't
# recorded either, so asking about it gets "I can't measure that".
#
# No "m8" or "axle" alias here: in the first look, "board and M8 axle mounting: board thickness"
# matched an M8 bolt entry and answered with the bolt's size.
bearing:
  aliases: ["608", skateboard]
  measurements:
    od: {value: about 22, unit: mm, note: outside, aliases: [outer, outside, diameter, across]}
    width: {value: about 7, unit: mm, aliases: [thick, thickness, tall, height, depth]}
    bore: {value: about 8, unit: mm, note: the hole, aliases: [inner, inside, hole, id]}
