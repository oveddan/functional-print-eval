# Typed requirements, each graded in code (pbe/requirements.py, pbe/nuts.py).
- id: R1
  text: One printed part (a test coupon doesn't count)
  class: C6-printability
  grader: dims.part_count
  args: {n: 1}
- id: R2
  text: About $knob_d mm across
  grader: dims.across
  args: {d: $knob_d, tol_frac: 0.2}
- id: R3
  text: A hex pocket that takes the whole nut, can be reached from one face, stops the nut turning, and stops it going out the far side
  class: C5-mating-envelopes
  grader: nut.pocket
  args: {nut: "ISO 4032 $nut"}
- id: R4
  text: The nut presses in by hand and stays in upside down on this printer, or a test coupon would have found a size that does
  class: C2-fit-clearance
  grader: nut.fit
  args: {nut: "ISO 4032 $nut", label: $nut}
- id: R5
  text: The bolt passes through the nut and out the other side (at least ISO 273's fine clearance hole)
  class: C3-fastener-stackup
  grader: nut.bolt_passes
  args: {nut: "ISO 4032 $nut", d_min: $hole_fine}
