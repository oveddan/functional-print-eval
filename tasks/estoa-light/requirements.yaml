# Limits and where each comes from: brief.md, "What the records decide". Lengths in mm.
- id: R1
  text: A screw through each of the disk's two holes goes into the box
  grader: enclosure.board_holes
  args:
    item: "own:led-disk"
    holes_r: [16.60, 17.11]  # where each hole's centre can be, from the centre, by Dan's readings
    hole: 3.3                # Dan's calipers
    screw: 3.0               # M3
    insert: "insert M3x4x5"
    insert_hole: [3.9, 4.9]  # a hole this wide, in a design that lists inserts, holds an insert
    board_radius: 120.5      # at least: 102.24 + 1.65 + 16.60 from Dan's readings
    board_thickness: [1.2, 2.0]  # ESTIMATE: never measured; Estoa assumed 1.6
    rests_within: 0.6        # the disk rests on the box at its holes
    depth: 12.0
  class: C1-unmeasured
  assume:  # ASSUMPTION, graded apart from the records' verdict (python -m pbe.assumptions)
    text: Each hole's centre is at the middle of where Dan's readings put it, 16.85 mm out.
    source: "the middle of 16.60 to 17.11, from Dan's calipers; no reading pins it closer"
    args: {holes_r: [16.85, 16.86]}
- id: R2
  text: The disk's screws hold, don't bottom out, and don't reach the electronics or the wall
  grader: enclosure.board_screws
  args:
    item: "own:led-disk"
    holes_r: [16.60, 17.11]
    hole: 3.3
    screw_d: 3.0
    insert: "insert M3x4x5"
    insert_hole: [3.9, 4.9]
    board_radius: 120.5
    board_thickness: [1.2, 2.0]
    rests_within: 0.6
    depth: 12.0
    nut_h: 2.4               # ISO 4032 M3
    nut_af: 5.5              # ISO 4032 M3 across flats: a void this wide along the screw holds a captive nut
    engage: 3.0              # 3 mm of thread in an insert held (Estoa's lid)
    electronics:
      item: "own:perfboard"
      certain: [6.5, 56.34, 12.55]  # always under the ESP32, wherever it sits on the board, and its measured height
      possible: [50, 70, 16]        # the whole board, to the ESP32's full height
  class: C3-fastener-stackup
  assume:
    text: The disk's board is 1.6 mm thick, and each hole's centre is 16.85 mm out.
    source: "1.6 mm is the standard circuit board thickness and what the Estoa model used; the holes as in R1's assumption"
    args: {holes_r: [16.85, 16.86], board_thickness: [1.6, 1.6]}
- id: R3
  text: A USB-C plug reaches the ESP32's port from outside the box
  grader: enclosure.plug_reaches
  args:
    item: "own:esp32"
    plug: usb_c_plug_overmold  # Dan's measured plug head, 11.58 x 6.44 with 7.5 mm of bare metal (catalog/connectors.yaml)
    margin: 0.2              # mm a side the way in must leave round that head to pass: Claude's scoring call (2026-11-12), for holes printing small; Dan kept it: a tight plug can be forced, or the opening Dremelled
    failed_from: 4.0         # Estoa's 11.5 x 8.5 opening, too narrow for the head, stood about 4 mm out from this ESP32's port and stopped plugs (FIXES section 2)
    socket_body: [1.0, 10.67, 3.2]  # the receptacle's first mm behind its mouth: 10.67 x 3.2 outside (the Estoa model)
    disk: "own:led-disk"
    disk_radius: 120.5
    disk_thickness: 1.2
    inside: [-6, 0, -2]      # a point in the ESP32 behind its port, which must be inside the box
    window: 30.0
  class: C5-mating-envelopes
- id: R4
  text: Every heat-set insert sits in a post like the ones that held
  grader: enclosure.insert_posts
  args:
    insert: "insert M3x4x5"
    insert_sized: [3.9, 4.9]   # a hole a screw goes into that's this wide is taken for an insert's: wider than M3's coarse clearance, 3.6 (ISO 273)
    hole_ok: [4.2, 4.4]        # ESTIMATE around the 4.3 mm holes inserts were set in
    # Dan, 2026-11-08: the 8 mm freestanding posts bulged because they were printed at 100% infill; at 20%
    # they'd hold. So posts are graded as printed at 20%: no recorded post fails, and (8 - 4.3) / 2 = 1.85 holds.
    # The 12 mm posts webbed to the wall, (12 - 4.3) / 2 = 3.85, held at 20%.
    bulged: null
    held: 1.85
    depth_into: 2.0            # read halfway down the 4 mm insert
  class: C3-fastener-stackup
- id: R5
  text: The perfboard is inside the box, and the ESP32 on it has room
  grader: enclosure.board_room
  args:
    item: "own:perfboard"
    certain: [6.5, 56.34, 12.55]  # always under the ESP32; 11.05 measured to its board's underside + its 1.5 mm board
    room: [44, 64, 16]            # the board less 3 mm at each edge, to the ESP32's height of about 16
    slab: [46, 66, 1.0]           # the board less 2 mm at each edge, 1 mm thick: ESTIMATE, its thickness wasn't measured
    holes: [22.9, 32.9, 2.5]      # corner holes, kept clear for posts
    disk: "own:led-disk"
    disk_radius: 120.5
    disk_thickness: 1.2
  class: C5-mating-envelopes
- id: R6
  text: The box hangs on the wall screws through keyholes whose slots run the same way
  grader: enclosure.keyholes
  args:
    # Any common wall screw, #6 to #10 pan or round head (Dan, 2026-11-11: "a generic wall screw, should work
    # with different kinds of screws"). Claude's scoring call from published head and shank sizes, not a print:
    # brief.md, R6.
    head: 9.9              # the largest common head, a #10 pan head (0.373 in, 9.47 mm), plus 0.2 a side because printed holes come out small
    entry:
      {fails_under: 9.9, passes_from: 9.9}
    slot:                  # wider than a #8 shank (0.164 in, 4.17 mm), narrower than a #6 pan head (0.256 in min, 6.5 mm).
      # Not a #10 shank (4.83 mm): Estoa's own slots were 4.8 and hung it. 4.5 to 6.0 is the estimate Estoa's record gave.
      {fails_under: 4.17, fails_from: 6.5, passes: [4.5, 6.0]}
    travel: 12.0           # not used with `head`: the slot need only take the shank past the entry (Dan, 2026-11-13)
    angle: {passes_within: 30, fails_beyond: 60}  # degrees from the way the slots run on average
    standoff: 3.5          # how far the screws stand out of the wall
    count: 2
    at_depth: 0.3
  class: C7-use-orientation
- id: R7
  text: No screw stands out of the back
  grader: enclosure.nothing_proud
  args: {tolerance: 0.05}
  class: C5-mating-envelopes
