# The person's own things: only what the Estoa record holds. Each value is Dan's reading as he gave it,
# from the facts relayed on issue 17 (session ids are the first 8 characters, timestamps UTC). What
# he never measured answers "I can't measure that", and the note says it isn't recorded.
led_disk:
  aliases: [disk, disc, led disk, led disc, dotstar, leds]
  measurements:
    # 602ba611, 2026-09-28T20:33:49, calipers
    hole_diameter: {value: 3.3, unit: mm, note: "each of the two small holes near the centre", aliases: [hole, holes, hole size, mounting holes, hole diameter]}
    # 20:34:45
    between_holes: {value: 30.2, unit: mm, note: "from the nearest edge of each hole, with calipers pulled in at the edges", aliases: [between, apart, spacing, distance between, centre to centre, center to center, pitch]}
    # 20:35:27 and 20:36:08; 20:36:45 says the readings are from the outside of the hole to the edge
    hole_to_edge: {value: "102.54 from the outside of one hole to the disk's edge, and 102.24 from the other hole to the other side", unit: mm, aliases: [edge, rim, outer edge, to the edge, from the edge]}
    # read from Dan's photo by the Estoa agent (20:38:18) and confirmed by Dan (20:38:36), not measured
    hole_positions: {value: "on a line through the centre, one at 3 o'clock and one at 9 o'clock, with the input wires at 12", aliases: [where, position, positions, layout, located, location, orientation, clock, line, angle]}
    # not recorded: the Estoa build assumed 242 mm from the product listing
    diameter: {value: "I can't measure that", aliases: [across, size, width, outer diameter]}
    # not recorded: the Estoa model assumed 1.6 mm ("datasheet silent; check")
    thickness: {value: "I can't measure that", aliases: [thick, depth, pcb thickness, board thickness]}
perfboard:
  aliases: [perf board, protoboard, proto board]
  measurements:
    # ead22945, 2026-10-01T21:37: "the largest perfboard i have is 50mm x 70 mm"
    size: {value: "50 x 70", unit: mm, aliases: [dimensions, length, width, long, wide, footprint, outline]}
    # ead22945, 2026-10-02T21:52:51 and 21:56:52
    corner_holes: {value: "2.4 mm across, and 0.9 mm from the edge of each hole to the board's edge", aliases: [hole, holes, mounting, mounting holes, corner, corners]}
    # the Estoa model's grid (disk_puck.scad:50), not a message from Dan
    grid: {value: "18 x 24 holes at 2.54 mm", aliases: [pitch, hole grid, holes grid, columns, rows]}
    # not recorded: the Estoa model assumed 1.6 mm
    thickness: {value: "I can't measure that", aliases: [thick, pcb thickness, board thickness]}
esp32:
  aliases: [esp, esp32 s3, devkit, dev board, devkitc, microcontroller]
  measurements:
    # 73c93171, 2026-09-27T22:13
    size: {value: "63.17 long and 28.25 wide", unit: mm, aliases: [dimensions, length, width, long, wide, footprint]}
    # the Estoa agent's figure (ead22945, 2026-10-04T00:05:31): 11.05 mm measured to the underside of its
    # board, its 1.5 mm board, and its tallest part, which wasn't measured (disk_puck.scad:267-269)
    height: {value: "it stands about 16 mm above the perfboard in its female headers; 11.05 mm of that is to the underside of its board", aliases: [tall, high, height above, clearance, headers, stack]}
    # the Estoa model (disk_puck.scad), not a message from Dan
    position: {value: "in female headers on the perfboard's columns 8 and 18, rows 2 to 23", aliases: [where, located, location, columns, rows, placement, sits]}
    # c8cfd18c, 2026-10-04T16:54 and 16:56
    usb_port: {value: "4.80 mm from the outside of its USB-C port to the nearest edge of the ESP32 board, and 7.53 mm from the ESP32's edge to the perfboard's edge", aliases: [usb, port, usb c, usb-c, connector]}
    # the Estoa model (disk_puck.scad:270-275), marked measured there; the relay didn't find Dan's message for it
    usb_port_height: {value: "the bottom of its USB-C receptacle is 12.54 mm above the perfboard's top, and the receptacle is about 3.2 mm tall and 10.67 mm wide, its centre 3.99 mm off the ESP32's centreline", aliases: [port height, how high, above the perfboard, receptacle, socket]}
wall_screws:
  # "hang" added after pilot-estoa: Sonnet asked for "screws you will hang it on" and got no answer
  aliases: [wall screw, screws in the wall, screw in the wall, anchor, anchors, wall anchors, hang, hangs, hanging]
  measurements:
    # what was ordered (ead22945, 2026-10-03T14:34:42); the real heads weren't measured
    size: {value: "#8 round-head screws in 1/4 inch anchors; I bought ones with heads 9 mm across at most", aliases: [head, heads, diameter, shank, thread, gauge, type, kind]}
    # the Estoa agent's spec that the build followed (14:13:52)
    standoff: {value: "I'll leave them about 3.5 mm out from the wall", aliases: [sticking out, stick out, out from the wall, proud, protrude, standoff, how far]}
    # a design choice: the person drills to the design's template
    spacing: {value: "I can put them wherever you say", aliases: [apart, distance, between, where, position, positions, spacing]}
