# The person's own things. The bearing's sizes are the standard ones; round 2 settled that its
# outer diameter is about 22 (results/predictions/round2-coupons.yaml).
bearing:
  aliases: ["608", skateboard]
  measurements:
    od: {value: about 22, unit: mm, note: outside, aliases: [outer, outside, diameter, across]}
    width: {value: about 7, unit: mm, aliases: [thick, thickness, tall, height, depth]}
    bore: {value: about 8, unit: mm, note: the hole, aliases: [inner, inside, hole, id]}
bolt:
  aliases: [m8, axle]
  measurements:
    across: {value: about 8, unit: mm, note: the shank, aliases: [diameter, thread, size, width]}
