# Limits and where each comes from: brief.md, "What the records decide".
- id: R1
  text: About the size of the old wheel
  grader: wheel.size
  args: {across: [40, 60], max_width: 20}
  class: C5-mating-envelopes
- id: R2
  text: There's room for both bearings
  grader: wheel.room
  args: {seat_range: [20, 26], bearing_width: 7, bearings: 2}
  class: C5-mating-envelopes
- id: R3
  text: The bearings press in and stay in on this printer, or a test coupon would find a size where they do
  grader: wheel.fit
  args: {seat_range: [20, 26], too_tight: 22.05, holds: [22.1, 22.3], too_loose: 22.4, bearing_width: 7, bearings: 2}
  class: C2-fit-clearance
- id: R4
  text: The M8 bolt goes through
  grader: wheel.bolt_passes
  args: {seat_range: [20, 26], bolt: 8, thread: M8, fine: 8.4}
  class: C3-fastener-stackup
