task: m5-spacer
note: Reference solution. It must pass every check; tests/test_spacer.py also checks that wrong versions fail.
params:
  length: {value: 20,  kind: design,   source: design,  note: from the request}
  od:     {value: 12,  kind: design,   source: design,  note: from the request}
  bolt_d: {value: 5,   kind: hardware, source: catalog, note: M5}
  hole_d: {value: 5.5, kind: design,   source: catalog, note: ISO 273 medium clearance hole for M5}
parts:
  - id: spacer
    role: final
    material: PLA
    print_orientation: Standing on one end, z = 0 on the bed, so the hole is vertical and needs no bridge.
    use_orientation: On the bolt between the two plates.
    code: |
      def build(p):
          return cq.Workplane("XY").circle(p.od / 2).circle(p.hole_d / 2).extrude(p.length)
criteria:
  - id: C1
    part: spacer
    feature: hole
    relation: clears
    clearance_mm: 0.5
    params: [hole_d, bolt_d]
    check: {method: none, description: A standard clearance hole; nothing to test-print first.}
manual:
  - n: "1"
    text: Print the spacer standing on one end, with no supports.
    parts: [spacer]
  - n: "2"
    text: Slide it onto the bolt between the two plates.
    parts: [spacer]
