# Typed requirements, each graded in code (pbe/graders/requirements.py).
- id: R1
  text: One printed part
  grader: dims.part_count
  args: {n: 1}
- id: R2
  text: 20 mm long and 12 mm across, within 0.2 mm
  grader: dims.extents
  args: {mm: [20, 12, 12], tol: 0.2}
- id: R3
  text: A clearance hole for an M5 bolt through the full length (5.3 to 5.8 mm, ISO 273 fine to coarse)
  grader: dims.through_hole
  args: {d_min: 5.3, d_max: 5.8}
- id: R4
  text: Round
  grader: dims.round_outline
  args: {min_roundness: 0.97}  # a circle scores 1, a hexagon 0.83, a square 0.64
