[project]
name = "print-build-eval"
version = "0.1.0"
description = "Can a frontier model design a 3D-printed fix a person can print, test and assemble?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cadquery>=2.4",
    "trimesh>=4.0",
    "manifold3d>=2.4",
    "networkx>=3.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pbe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
