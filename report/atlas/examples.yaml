# The featured failure and picture for each class on the failure atlas page.
# Image paths are local and private (Dan's photos and renders); the build copies
# resized versions into report/atlas/out/, which is gitignored. `url:` is the hosted copy
# of that resized, metadata-stripped file, which the README's failure-class section shows
# (build.py --readme); every picture of a class a graded task tests needs one.
C1-unmeasured:
  seed: battery-bay-guessed
  images:
    - path: ~/Source/local-lights/private/photos/estoa/IMG_4861.HEIC
      url: https://media.danoved.xyz/print-build-eval/nogit/243658bb/IMG_4861.jpg
      caption: Estoa's back-box skeleton, Oct 3, with the real power bank on it. The bay was drawn from a guessed 154 mm battery and a guessed cable exit; the power bank didn't fit.
      credit: Dan's photo
    - path: ~/Downloads/IMG_4869.HEIC
      url: https://media.danoved.xyz/print-build-eval/nogit/be5bddcb/IMG_4869.jpg
      caption: Half an hour later, the fix. A 1:1 paper floor plan with the real power bank, USB-C breakout and cable laid on it, before anything else was printed.
      credit: Dan's photo
C2-fit-clearance:
  seed: nut-pocket-clearance
  images: []
C3-fastener-stackup:
  seed: insert-bosses-bulged
  images:
    - path: ~/Source/local-lights/private/photos/estoa/IMG_4928.HEIC
      url: https://media.danoved.xyz/print-build-eval/nogit/efec6749/IMG_4928.jpg
      caption: A lid-screw post after its heat-set insert went in, Oct 5. The post was too thin and tall for a 5 mm insert, so its walls flared and the insert sat off-centre.
      credit: Dan's photo
    - path: ~/Downloads/IMG_5297.HEIC
      url: https://media.danoved.xyz/print-build-eval/nogit/1625ab83/IMG_5297.jpg
      caption: The tripod's phone clamp, Oct 24. The design treated an M5x50 as fully threaded; it's threaded only at the far end, so the lock nut couldn't reach the end wall.
      credit: Dan's photo
C4-tool-access:
  seed: leg-screw-under-lip
  images:
    - path: ~/Source/estoa-public/enclosure/docs/leg-screw-fix.png
      caption: Estoa's leg screw, cut through the wall. Before, the screw sat right under the glass ledge, so only an angled hex key reached it. After, it moved 6.4 mm inward.
      credit: Render from the Estoa repo
C5-mating-envelopes:
  seed: usb-opening-sized-to-receptacle
  images:
    - path: ~/Source/local-lights/private/photos/estoa/IMG_4884.HEIC
      url: https://media.danoved.xyz/print-build-eval/nogit/c524a219/IMG_4884.jpg
      caption: The ESP32's USB-C opening in Estoa's back box. Sized to the port, not the plug, at the end of a 9 mm recess; ordinary plug heads couldn't reach.
      credit: Dan's photo
C6-printability:
  seed: arca-roof-not-stepped
  images:
    - path: ~/Downloads/IMG_5045.HEIC
      url: https://media.danoved.xyz/print-build-eval/nogit/1e41d9fa/IMG_5045.jpg
      caption: The underside of the tripod's Arca plate, Oct 12, the project's first print. The roof over the bolt-head recess was a plain bridge with a slot cut through it, and it printed as a tangle.
      credit: Dan's photo
    - path: ~/Source/local-lights/private/photos/estoa/IMG_4746.HEIC
      url: https://media.danoved.xyz/print-build-eval/nogit/d7a954c0/IMG_4746.jpg
      caption: Estoa's test wall, Oct 1. A screw hole through a bridged pocket roof printed as loose strands and closed up; the slicer had warned of a floating cantilever.
      credit: Dan's photo
    - path: ~/Source/estoa-public/enclosure/docs/stepped-hole.svg
      url: https://media.danoved.xyz/print-build-eval/nogit/393de70f/stepped-hole.png
      caption: The fix, already used in Estoa a week earlier. Each pair of layers bridges onto the last, so the hole has a solid edge to print on.
      credit: Diagram from the Estoa repo
