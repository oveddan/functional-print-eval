# The featured failure and picture for each class on the failure atlas page.
# Image paths are local and private (Dan's photos and renders); the build copies
# resized versions into report/atlas/out/, which is gitignored.
C1-unmeasured:
  seed: battery-bay-guessed
  images:
    - path: ~/Source/local-lights/private/photos/estoa/IMG_4861.HEIC
      caption: Estoa's first back-box skeleton, Oct 4. The bay was drawn from a guessed 154 mm battery and a guessed cable exit; the real power bank didn't fit.
      credit: Dan's photo
C2-fit-clearance:
  seed: leg-pocket-too-tight
  images:
    - path: ~/Source/local-lights/private/photos/estoa/IMG_4746.HEIC
      caption: The leg pocket on Estoa's Oct 2 test wall. At 0.2 mm per side, bridge sag and first-layer squish kept the leg from seating.
      credit: Dan's photo
C3-fastener-stackup:
  seed: insert-bosses-bulged
  images:
    - path: ~/Source/local-lights/private/photos/estoa/IMG_4928.HEIC
      caption: A lid-screw post after its heat-set insert went in, Oct 5. The post was too thin and tall for a 5 mm insert, so its walls flared and the insert sat off-centre.
      credit: Dan's photo
    - path: ~/Downloads/IMG_5297.HEIC
      caption: The tripod's phone clamp, Oct 24. The design treated an M5x50 as fully threaded; it's threaded only at the far end, so the lock nut couldn't reach the end wall.
      credit: Dan's photo
C4-tool-access:
  seed: leg-screw-under-lip
  images:
    - path: ~/Source/estoa-public/enclosure/docs/leg-screw-fix.png
      caption: Estoa's leg screw, cut through the wall. Before, the screw sat right under the glass ledge, so only an angled hex key reached it. After, it moved 6.4 mm inward.
      credit: Render from the Estoa repo
C5-mating-envelopes:
  seed: usb-opening-sized-to-receptacle
  images:
    - path: ~/Source/local-lights/private/photos/estoa/IMG_4884.HEIC
      caption: The ESP32's USB-C opening in Estoa's back box. Sized to the port, not the plug, at the end of a 9 mm recess; ordinary plug heads couldn't reach.
      credit: Dan's photo
C6-printability:
  seed: arca-roof-not-stepped
  images:
    - path: ~/Downloads/IMG_5045.HEIC
      caption: The underside of the tripod's Arca plate, Oct 12, the project's first print. The roof over the bolt-head recess was a plain bridge with a slot cut through it, and it printed as a tangle.
      credit: Dan's photo
    - path: ~/Source/estoa-public/enclosure/docs/stepped-hole.svg
      caption: The fix, already used in Estoa a week earlier. Each pair of layers bridges onto the last, so the hole has a solid edge to print on.
      credit: Diagram from the Estoa repo
C7-use-orientation:
  seed: faces-down-only
  images:
    - path: ~/Source/local-lights/private/phone_stand/render/new_assembly_side.png
      caption: The phone stand as designed. The phone (blue) can only face the desk; the point was for Dan to film himself.
      credit: Render from the tripod project
C8-test-plan:
  seed: missing-mechanism-coupons
  images:
    - path: ~/Source/local-lights/private/photos/estoa/IMG_4742.HEIC
      caption: What a good coupon looks like. Estoa's Oct 2 test wall and leg stub caught four defects before an 8 to 10 hour print. The tripod build never made one for its clamp or base joint.
      credit: Dan's photo
C9-manual:
  seed: hidden-washers
  images:
    - path: ~/Source/local-lights/private/phone_stand/render/final/step_9b.png
      caption: Step 9b of the phone stand's assembly guide. The washer (F) sits against the knob and is easy to miss; Dan built the base joint without one.
      credit: Render from the tripod project's guide
C10-process:
  seed: petg-settings
  images:
    - path: ~/Downloads/IMG_5254.HEIC
      caption: The first PETG print, Oct 23, at 240 °C from memory and without drying. The spool's own sheet said 250 °C and 8 hours at 60 °C.
      credit: Dan's photo
    - path: ~/Source/local-lights/private/photos/estoa/IMG_4815.HEIC
      caption: Clear PLA over the LED disk, Oct 3. Every layer line acts as a lens and shows the LEDs as streaks; sanding at 120 then 220 grit fixed it.
      credit: Dan's photo
