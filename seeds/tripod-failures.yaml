# Real failures from the tripod/phone-stand build.
# Full source: Dan's private list of the tripod-mount session's mistakes, 2026-10-24
# class: see seeds/classes.yaml.
# control: the version that fixed it, and how sure we are it worked:
#   built-worked (printed and confirmed by Dan), fix-not-built, or synthetic.

# The first backtest case: one part, one feature, a simple prompt (a temporary
# quick-release plate for a borrowed tripod, using a webcam mount's 1/4"-20 bolt).
# Design: arca_plate.scad in Dan's private local-lights repo (session c941d075).
- id: arca-counterbore-guessed
  class: C1-unmeasured
  date: 2026-10-12
  did: Asked for the bolt's length but not its head; drew the head recess 13 mm x 4 mm
  right: Ask for the head's size first; 15 x 5 mm fit
  found_by: First print; the head didn't fit (Dan's photo IMG_5045, 2026-10-13T02:08)
  grader: behavior.asked_before_assuming, fit.clearance
  control: {version: "cb_d = 15, cb_h = 5", evidence: built-worked, confirmed: "Dan, 2026-10-28"}
- id: arca-roof-not-stepped
  class: C6-printability
  date: 2026-10-12
  did: The roof over the head recess was a plain bridge with the bolt slot cut through it, with no stepped layers, though the repo already used that technique
  right: A stepped (sacrificial) bridge, a strip, then the slot's box, then the slot
  found_by: First print; the roof came out stringy and messy
  grader: printability.bridged_holes
  control: {version: "stepped roof, same file", evidence: built-worked, confirmed: "Dan, 2026-10-28 (the fixed plate worked)"}

- id: base-joint-reach
  class: C3-fastener-stackup
  did: Base joint clamped the arm between two smooth fork cheeks with an M5x30, which ends 0.4 mm short of the nut face
  right: Toothed single-tab joint and an M5x35
  found_by: The observed failure was the joint slipping and flexing in assembly; the 0.4 mm short bolt turned up in a later audit and isn't known to have caused it
  grader: fasteners.reach  # catches the audit finding, not the slipping (needs a friction/strength model)
- id: partial-thread
  class: C3-fastener-stackup
  did: Treated an M5x50 socket head as fully threaded, so the lock nut couldn't reach the end wall
  right: ISO 4762 thread length for M5x50 is b ≈ 22 mm; use a fully threaded bolt or another design
  found_by: Physically, while building
  grader: fasteners.thread_length
- id: nut-pocket-clearance
  class: C2-fit-clearance
  did: Nut pockets at af+0.3 mm; every nut fell out
  right: +0.15 for M5, +0.0 for M8 and 1/4"; a calibration coupon first
  found_by: Three rounds of test prints
  grader: printer_sim.hidden_error
- id: missing-mechanism-coupons
  class: C8-test-plan
  did: Never test-printed the phone clamp's screw mechanism or the base joint under load
  right: A 15–20 minute cut-down coupon of each mechanism before the full part
  found_by: Two full-size parts had to be reprinted
  grader: test_plan.coverage
- id: manual-part-reuse
  class: C9-manual
  did: Manual said "take an M5x30 bolt" after step 5a had already pressed it into a knob
  right: Track each part through the steps
  found_by: Building from the manual
  grader: manual.sequence
- id: hidden-washers
  class: C9-manual
  did: Washers hidden under the knob in every joint picture
  right: Every listed part visible in its step
  found_by: Built the base joint without one
  grader: manual.visibility
- id: desk-assumption
  class: C1-unmeasured
  did: Desk clamp sized for 10–45 mm wooden desks
  right: Ask first; Dan's desk is 60 mm, a wood top on a 32 mm steel tube
  found_by: The clamp was too short
  grader: behavior.asked_before_assuming
- id: floating-peg
  class: C6-printability
  did: Hex peg separated from the knob by a through-hole
  right: One connected body
  found_by: Slicer "floating regions" warning
  grader: geometry.connected_bodies
- id: faces-down-only
  class: C7-use-orientation
  did: Stand could only point the phone down; the goal was filming himself
  right: An orientation that faces the user
  found_by: Dan asked "how does it face me?"
  grader: requirements.orientation
- id: petg-settings
  class: C10-process
  did: PETG at 240 °C from memory, no drying
  right: 250 °C and 60 °C x 8 h drying, per the spool
  found_by: Curled, stringy prints
  grader: settings.vs_spec_sheet
