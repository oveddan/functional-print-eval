# General failure classes. Every seed in seeds/*.yaml has a `class:` from this list.
# A class is task-independent: each one maps to graders that run on any task, and
# tasks are chosen to exercise several classes. Grader names are planned, not built.
- id: C1-unmeasured
  name: Designing from unmeasured dimensions
  description: Sizes a real-world object (desk, battery, port, hole, washer, material) from a guess or a product listing instead of asking or citing a datasheet.
  graders: [behavior.asked_before_assuming, bom.dimension_provenance]
- id: C2-fit-clearance
  name: Fit clearance wrong for the printer
  description: Press, slide or drop-in fits sized without allowing for printer error, bridge sag or elephant's foot.
  graders: [fit.clearance, printer_sim.hidden_error]
- id: C3-fastener-stackup
  name: Fastener stack-up arithmetic
  description: Bolt reach, thread length, screw length against hole depth, heat-set insert holes and bosses.
  graders: [fasteners.reach, fasteners.thread_length, fasteners.insert]
- id: C4-tool-access
  name: Tool and hand access
  description: A driver, hex key, drill or finger can't reach a fastener, pilot hole or control in the assembled state.
  graders: [access.tool_sweep]
- id: C5-mating-envelopes
  name: Mating-part envelopes
  description: Openings and clearances sized to the bare component instead of what mates with it (plug overmold, header height, screw head, cable bend).
  graders: [envelopes.interference]
- id: C6-printability
  name: Printability in the chosen orientation
  description: Floating regions, thin skins, holes that open onto bridges, parts that don't fit the bed's usable area, unstable orientations.
  graders: [geometry.connected_bodies, printability.min_wall, printability.bridged_holes, printability.bed_fit, printability.slicer_warnings]
- id: C7-use-orientation
  name: Works in the orientation it's used
  description: The design fails in the pose it's actually used or hung in (faces the wrong way, slots point the wrong way, loose parts fall out).
  graders: [requirements.orientation, requirements.retention]
- id: C8-test-plan
  name: Test-plan coverage
  description: No coupon for a fit or mechanism, a coupon that leaves out a constraining feature, geometry changed after the last test, or coupons far bigger than needed.
  graders: [test_plan.coverage]
- id: C9-manual
  name: Manual correctness
  description: Parts used twice or hidden, undocumented design choices, irreversible steps without a check, missing tool or method details, templates that print at the wrong scale.
  graders: [manual.sequence, manual.visibility, manual.templates, manual.irreversible_steps]  # last one is a rubric, not code
- id: C10-process
  name: Print process and material settings
  description: Temperatures, drying, slicer settings that conflict, finishing a cosmetic part.
  graders: [settings.vs_spec_sheet, settings.lint]
