# Failures in the eval's own test-print coupons (coupons/coupons.py), designed by
# Claude (Opus) in this project's session 596c6520 and printed the same
# night on Dan's X1C (0.20 mm, black high-speed PLA, 4 walls, 15% infill, no supports).
# Nothing was staged: these are the designer's real mistakes. Photos in
# docs/media/photos.md. Same fields as seeds/estoa-failures.yaml, with
# `round:` in place of `date:`.
- id: tunnel-breaks-outer-wall
  project: coupons
  class: C6-printability
  round: 1
  status: failed
  who: agent
  did: Placed a 10.7 mm tunnel 4 mm from the block's back face, so it cut through the wall and left the roof above it attached on one side only. Bambu Studio warned of a floating cantilever; the roof printed as spaghetti
  right: Check that every cut stays inside the body with a minimum wall; run the bridge check before printing (it flags this roof, 4% of strands anchored)
  found_by: Test print, and the slicer warning, which was read as expected
  evidence: 596c6520 round 1; IMG_5405, IMG_5409; results/predictions/round1-coupons.yaml
  backtest: caught by the bridge check when run afterwards with code unchanged (not run on this coupon before printing)
- id: tunnel-roof-bridged-lengthwise
  project: coupons
  class: C6-printability
  round: 1
  status: failed
  who: agent
  did: A 10.4 mm wide, 76 mm long tunnel roof anchored on both long sides. The roof printed as loose strands running along the tunnel, so the bar couldn't go in
  right: Keep bridges short in every direction the slicer might choose, or close the tunnel's ends so the slicer bridges across; check the slicer's bridge direction in its preview
  found_by: Test print
  evidence: 596c6520 round 1; IMG_5409; results/predictions/round1-coupons.yaml
  backtest: missed by the bridge check, which assumes the slicer picks the best direction. Repeated in round 2 (C2-tunnels, IMG_5445-7) with the broken wall fixed, so the wall didn't cause it; the slicer's choice of direction is still unconfirmed in its preview
- id: servo-tab-feature-not-cleared
  project: coupons
  class: C5-mating-envelopes
  round: 2
  status: near-miss
  who: agent
  did: Modeled the MG996R mount (coupon D) from the body's length and width and the tab-hole positions only. Seated from underneath, the servo goes in and its four tab holes line up with the slots, but a feature on the servo between each tab's two holes stops the tabs sitting flush on the plate, so it can't be clamped snug
  right: Ask for, or look at, the whole mounting face of the part, not just its hole positions, and relieve whatever stands proud of it
  found_by: Test fit (Dan, IMG_5450)
  evidence: 596c6520 round 2; IMG_5449, IMG_5450; results/predictions/round2-coupons.yaml (D_servos)
  backtest: missed; the feature isn't in the measurements. The assembly simulation would catch it only with a servo model that includes it (C1)
  note: an earlier version of this seed blamed the cable exit. That came from Claude's test instruction ("drop it in"), which had Dan push the servo all the way through; seated from underneath as intended, the cable never passes the plate
