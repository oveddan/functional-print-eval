# Real mechanical and printing failures from Estoa (also called Marea): a wall light
# piece with an LED disk, ESP32, radar and a printed PLA enclosure, designed with a Claude agent in OpenSCAD
# and built by Dan, 2026-09-25 to 2026-10-16.
#
# Sources: the agent sessions in Dan's private session archive (session ids below, timestamps UTC),
# and the estoa-public repo's enclosure/{TEST-PRINTS,FIXES,DECISIONS}.md.
# Mined 2026-10-28 by four reader agents; key quotes spot-checked by hand.
#
# status: failed (it went wrong physically), near-miss (caught in review before
# printing or building), unconfirmed (the record doesn't settle it).
# who: agent (the AI's design or instruction), dan, vendor, or unclear.
# class: see seeds/classes.yaml.

